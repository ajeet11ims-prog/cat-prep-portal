    "question": "<p>A typist had to type 360 pages of matter. By typing daily 4 pages more than what he had planned, the work was completed one day ahead of the schedule. For how many days did he work on the job?</p>",

    "question": "<p>Two ants start from a point A on circular path of circumference 1100 m. Both ants can show two types of motion. First ant can travel at the speed of 2 meters a minute and then takes rest for 2 minutes, or it can cover 3 meters in 2 minutes and then takes rest for 1 minute. Whereas, second ant can travel at the speed of 2 meters in 2 minutes and takes rest for 1 minute or it can cover 2 meters in three minutes without any rest. If each ant wants to reach back to the starting point A in the least possible time, then how long will the first ant take to complete a full circle?</p>",

    "question": "<p>Two riders on horseback with a gun and a bulletproof shield were moving towards each other at a constant speed of 25 <span class=\"frac\"><span>km</span><span>h</span></span> and 5 <span class=\"frac\"><span>km</span><span>h</span></span> respectively. When they were 300 km apart, they started firing bullets at each other with the speed of the fired bullets being 2000 <span class=\"frac\"><span>km</span><span>h</span></span>. When a bullet fired by rider 1 hit the shield of rider 2, rider 2 fired a bullet and vice versa and the process continued like this. Neglecting the time spent between the instant at which the bullet hits the shield and the rider fires the shot, find the total distance (in km) covered by all the bullets shot by both the riders.</p>",

    "question": "<p>A and B together can do a piece of work in 15 days. A alone can do the same work in 60 days. A and B work together on the work for 9 days at their original efficiency. After that B’s efficiency reduces by 33.33% and A keeps working at his original efficiency. In how many days will they complete the remaining work?</p>",
