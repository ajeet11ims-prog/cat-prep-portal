    "question": "<p>Mumbai and Pune are 144 km apart. ! start from Pune towards Mumbai with certain speed at 9 am. Vinod starts from Mumbai towards Pune with the same speed at 10 am. A slow truck starts from Pune towards Mumbai at 10.20 am. Vinod meets me at 11.30 am and meets the truck at 12.32 pm. What is the time taken by the truck to reach Mumbai?</p>",

    "question": "<p>In a multinational company, there are 15 Indian, 12 Chinese and 6 Japanese employees. Five Indians take as much time to finish a piece of work as four Chinese take. Also, 12 Chinese take as much time to finish a piece of work as 10 Japanese take. The one-day salary of all the workers amounts to Rs. 39,000, which is divided in the ratio of the quantity of work done by them. The company is planning to make some recruitment and estimates the salary amount of 16 Indians, 17 Chinese and 18 Japanese employees for 2 days. What amount does the company estimate (in Rs.)?</p>",

    "solution": "<p><strong>Detailed solution:</strong></p><ol class=\"solution-steps\"><li>Let Indian worker efficiency = 1. Chinese = <span class=\"frac\"><span>5</span><span>4</span></span> and Japanese = <span class=\"frac\"><span>3</span><span>2</span></span>.</li><li>The original workforce has effective units 15 + 12×<span class=\"frac\"><span>5</span><span>4</span></span> + 6×<span class=\"frac\"><span>3</span><span>2</span></span> = 39. Their daily wage is ₹39000, so ₹1000 per efficiency-<span class=\"frac\"><span>unit</span><span>day</span></span>.</li><li>The new workforce has effective units 16 + 17×<span class=\"frac\"><span>5</span><span>4</span></span> + 18×<span class=\"frac\"><span>3</span><span>2</span></span> = 64.25.</li><li>For 2 days, cost = 64.25×₹1000×2 = ₹128500.</li></ol>"

    "question": "<p>Five pipes, of which 3 are inlets and 2 are outlets, are connected to a tank. All inlet pipes are identical to each other and all outlet pipes are identical to each other. When two outlets and only one inlet are working, the tank can neither get filled nor emptied. All other possible combinations of inlet and outlet pipes, with at least one inlet and one outlet working, are arranged in ascending order of the time required to fill the tank. If the difference in time required for the combinations at positions IV and V is 30 minutes, in how much time will the tank be filled when only the three inlets are working?</p>",

    "solution": "<p><strong>Detailed solution:</strong></p><ol class=\"solution-steps\"><li>Let one outlet's rate be x. From the stated balance, one inlet has rate 2x.</li><li>The five possible net filling rates in increasing time order are proportional to 5x,4x,3x,2x,x.</li><li>Positions IV and V therefore take <span class=\"frac\"><span>1</span><span>(2x)</span></span> and <span class=\"frac\"><span>1</span><span>x</span></span>; their difference is <span class=\"frac\"><span>1</span><span>(2x)</span></span>=30 min, so <span class=\"frac\"><span>1</span><span>x</span></span>=60 min.</li><li>Three inlets have total rate 6x, so fill time = <span class=\"frac\"><span>1</span><span>(6x)</span></span>=<span class=\"frac\"><span>60</span><span>6</span></span>=10 min.</li></ol>"
