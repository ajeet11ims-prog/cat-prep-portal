    "question": "<p>Two sprinters run clockwise on a circular track x km long (x &gt; 1). Their second meeting is at point C, 200 m from the starting point in the anticlockwise direction. Possible locations of the first meeting are: I. 100 m from the start anticlockwise. II. 100 m anticlockwise from the point diametrically opposite the start. III. 200 m from the start anticlockwise. Which statement is definitely true?</p>",

    "acceptedAnswers": [],
    "solution": "<p><strong>Detailed solution:</strong></p><ol class=\"solution-steps\"><li>Let the circumference be L and measure positions from the start in one direction.</li><li>The second meeting condition gives a congruence 2s ≡ -0.2 km (mod L) for the first-meeting displacement s.</li><li>This has two geometrically distinct solutions on a circle: s=L-0.1 km, i.e. 100 m counterclockwise from the start, or s=<span class=\"frac\"><span>L</span><span>2</span></span>-0.1 km, i.e. 100 m counterclockwise from the diametrically opposite point.</li><li>Hence either statement I or II can be true.</li></ol>"

    "question": "<p>Ayesha started running from one end of a straight road at 5 a.m. Bhumika, standing at the other end of the road, started running towards Ayesha at 6 a.m. and met Ayesha for the first time at point P on the road. They continued running till they reached the opposite ends. Immediately after reaching their respective ends, they turned back towards their starting points and coincidently met again at the same point P. If they met for the first time at 7 a.m., then what was the ratio of the speed of Ayesha to that of Bhumika?</p>",

    "passage": "",
    "question": "<p>In a factory having 100 identical machines for producing bolts, the manager realizes that he would overshoot his deadline due to some of the machines going offline 10 days before the deadline. He replaces the faulty machines with twice their number, two days before the deadline. The maximum number of days by which he could still overshoot his deadline is</p>",

    "typedAnswer": "3",
    "acceptedAnswers": [],
    "solution": "<p><strong>Detailed solution:</strong></p><ol class=\"solution-steps\"><li>Suppose f machines fail 10 days before the deadline. Before replacements arrive, 8 days of output are lost: deficit 8f machine-days.</li><li>For the final 2 days, replacement rules give 100+f machines, gaining 2f machine-days relative to plan.</li><li>Net deficit at the deadline = 6f machine-days. With 100+f machines after the deadline, extra time = <span class=\"frac\"><span>6f</span><span>(100+f)</span></span> days.</li><li>This is maximized at f=100, giving <span class=\"frac\"><span>600</span><span>200</span></span>=3 days.</li></ol>"

    "question": "<p>Pipes A and B can completely fill a water tank independently in 4 hrs and 5 hrs respectively. A pipe C can empty the completely filled tank in 3 hrs. Initially the tank is empty and all the pipes are closed. Pipe A is opened first at time t = 0 hrs and pipe C is opened at the instant when the tank is exactly half filled with water. Pipe B is opened after pipe C and at the instant when the tank is exactly one-fourth filled with water. Find the total time taken to fill the tank completely counting from t= 0 hrs.</p>",
