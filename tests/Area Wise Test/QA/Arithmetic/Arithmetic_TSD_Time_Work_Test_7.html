    "question": "<p>Bhagat and Chandu start simultaneously from village X to village Y, with their respective speeds in the ratio 3 : 2. After travelling one-fourth of the total distance, Chandu triples his speed and travels for some more time, following which he again changes his speed and completes the rest of the journey. Bhagat maintains his initial speed throughout. If both reach village Y at the same time, and the time for which Chandu travelled at thrice his initial speed was one-third of his total travel time, find the ratio of the respective speeds with which Bhagat and Chandu reach village Y.</p>",

    "solution": "<p><strong>Detailed solution:</strong></p><ol class=\"solution-steps\"><li>Let Bhagat's constant speed be 3 units and Chandu's initial speed 2 units after normalization.</li><li>Chandu covers the first quarter of D at speed 2, taking <span class=\"frac\"><span>3T</span><span>8</span></span> of the common total time. He then travels at 3 times that speed, 6, for <span class=\"frac\"><span>T</span><span>3</span></span> and covers <span class=\"frac\"><span>2D</span><span>3</span></span>.</li><li>Remaining distance is <span class=\"frac\"><span>D</span><span>12</span></span> and remaining time is <span class=\"frac\"><span>7T</span><span>24</span></span>, so final speed = (<span class=\"frac\"><span>D</span><span>12</span></span>)/(<span class=\"frac\"><span>7T</span><span>24</span></span>)=<span class=\"frac\"><span>2D</span><span>(7T)</span></span>. Since Bhagat's speed <span class=\"frac\"><span>D</span><span>T</span></span>=3 units, Chandu's final speed is <span class=\"frac\"><span>6</span><span>7</span></span> units.</li><li>Final speeds Bhagat:Chandu = 3:(<span class=\"frac\"><span>6</span><span>7</span></span>)=7:2.</li></ol>"

    "question": "<p>In a relay race, each team member runs only a certain (not necessarily equal) portion of the total length of the race, such that together all the team members cover the entire length of the race. A certain relay race is conducted, with each team comprising exactly two runners. A and B are two runners of one of the teams participating in the relay race. The total length of the race is 140 m and the total time that A and B take to finish the race is 20 seconds. If it turns out that the average speed of A and B together for the entire race equals the average of their individual speeds, how many of the following statements are false? i If A’s speed is 6 <span class=\"frac\"><span>m</span><span>s</span></span>, B’s speed is 8 <span class=\"frac\"><span>m</span><span>s</span></span>. 2. If B’s speed is more than 8 <span class=\"frac\"><span>m</span><span>s</span></span>, Aruns for less than 12 seconds. 3. If B’s speed is 7 <span class=\"frac\"><span>m</span><span>s</span></span>, A’s speed is 7 <span class=\"frac\"><span>m</span><span>s</span></span>. 4. If A’s speed is less than 6 <span class=\"frac\"><span>m</span><span>s</span></span>, Bruns for more than 12 seconds.</p>",

    const qbar = document.getElementById("qbar"), host = document.getElementById("questionHost"), resultBox = document.getElementById("result");
    function esc(s){return String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
