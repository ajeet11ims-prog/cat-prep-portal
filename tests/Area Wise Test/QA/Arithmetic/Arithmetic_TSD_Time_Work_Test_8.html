    "direction": "<p>Answer the question independently.</p>",

    "question": "<p>There are three pipes A, B and C which can fill a tank in 10, 12 and 15 hours respectively. All the three pipes were opened simultaneously. It was found that for first 3 hours, pipe A supplied water at <span class=\"frac\"><span>2</span><span>3</span></span> of its normal capacity, pipe B supplied water at <span class=\"frac\"><span>3</span><span>5</span></span> of its normal capacity and pipe C supplied water at <span class=\"frac\"><span>3</span><span>4</span></span> of its normal capacity. Thereafter, they supplied water at their normal rates. In how much time (in hours) will the tank be full?</p>",

    "solution": "<p><strong>Detailed solution:</strong></p><ol class=\"solution-steps\"><li>Normal rates: A=<span class=\"frac\"><span>1</span><span>10</span></span>, B=<span class=\"frac\"><span>1</span><span>12</span></span>, C=<span class=\"frac\"><span>1</span><span>15</span></span> <span class=\"frac\"><span>tank</span><span>h</span></span>.</li><li>For first 3 h, reduced rates are (<span class=\"frac\"><span>2</span><span>3</span></span>)(<span class=\"frac\"><span>1</span><span>10</span></span>)+(<span class=\"frac\"><span>3</span><span>5</span></span>)(<span class=\"frac\"><span>1</span><span>12</span></span>)+(<span class=\"frac\"><span>3</span><span>4</span></span>)(<span class=\"frac\"><span>1</span><span>15</span></span>)=<span class=\"frac\"><span>1</span><span>6</span></span> <span class=\"frac\"><span>tank</span><span>h</span></span>, so they fill <span class=\"frac\"><span>1</span><span>2</span></span> tank.</li><li>Thereafter normal combined rate =<span class=\"frac\"><span>1</span><span>10</span></span>+<span class=\"frac\"><span>1</span><span>12</span></span>+<span class=\"frac\"><span>1</span><span>15</span></span>=<span class=\"frac\"><span>1</span><span>4</span></span> <span class=\"frac\"><span>tank</span><span>h</span></span>.</li><li>Remaining half takes (<span class=\"frac\"><span>1</span><span>2</span></span>)/(<span class=\"frac\"><span>1</span><span>4</span></span>)=2 h. Total =3+2=5 h.</li></ol>"

    "direction": "<p>Answer the question independently.</p>",
    "passage": "",
    "question": "<p>Rajat went from A to B at his usual speed, and then from B to A at twice his previous speed, then A to B at twice his previous speed and again B to A at twice his previous speed. Shouvik went from A to B at his usual speed, then from B to A at half his previous speed, then A to B at half his previous speed and again B to A at half his previous speed. It is known that, the total time taken by Rajat and Shouvik is the same. If Rajat and Shouvik simultaneously start moving towards each other from points A and B respectively at their individual usual speeds, they meet in 16 hours. Find the time taken (in hours) by Shouvik to cover the distance between A and Bat his usual speed.</p>",
    "options": [
      "<p>32</p>",

    "answer": 3,
    "typedAnswer": "18",

    "solution": "<p><strong>Detailed solution:</strong></p><ol class=\"solution-steps\"><li>Let Rajat's initial speed be r and Shouvik's s. Rajat covers four equal distance parts at speeds r,2r,4r,8r, so time = <span class=\"frac\"><span>D</span><span>r</span></span>(1+<span class=\"frac\"><span>1</span><span>2</span></span>+<span class=\"frac\"><span>1</span><span>4</span></span>+<span class=\"frac\"><span>1</span><span>8</span></span>)=<span class=\"frac\"><span>15D</span><span>(8r)</span></span>.</li><li>Shouvik's corresponding pattern gives time <span class=\"frac\"><span>15D</span><span>s</span></span>. Equal total times imply s=8r.</li><li>They meet moving oppositely after 16 h, so <span class=\"frac\"><span>D</span><span>(r+s)</span></span>=16 → <span class=\"frac\"><span>D</span><span>(9r)</span></span>=16 → <span class=\"frac\"><span>D</span><span>r</span></span>=144.</li><li>Shouvik's time for D at speed s is <span class=\"frac\"><span>D</span><span>(8r)</span></span>=<span class=\"frac\"><span>144</span><span>8</span></span>=18 h.</li></ol>"

    "passage": "",
    "question": "<p>A hare and a tortoise decide to run around a lake but instead of running in the same direction they decide to run in opposite directions. Each of them chooses a distinct convenient starting point. The hare meets the tortoise at a certain oak tree for the first time. The second time, they meet at a neem tree and the third time at a mango tree. The fourth time, the hare meets the tortoise exactly at the oak tree, where they meet for the first time. Which of the following statements is true? (Assume that neither of them rests after the start and that they run at constant speeds).</p>",

      "<p>The starting points and starting times are required to comment about the ratio of their speeds.</p>"
    ],

    "solution": "<p><strong>Detailed solution:</strong></p><ol class=\"solution-steps\"><li>Let speed ratio be a:b. For opposite-direction runners, successive meeting points advance by <span class=\"frac\"><span>a</span><span>(a+b)</span></span> of a lap.</li><li>Exactly three distinct meeting points means the fraction has denominator 3 in lowest terms.</li><li>Hence <span class=\"frac\"><span>a</span><span>(a+b)</span></span>=<span class=\"frac\"><span>1</span><span>3</span></span> or <span class=\"frac\"><span>2</span><span>3</span></span>, so the two speeds are in ratio 1:2.</li><li>Therefore one runner is one half as fast as the other.</li></ol>"

    const qbar = document.getElementById("qbar"), host = document.getElementById("questionHost"), resultBox = document.getElementById("result");
    function esc(s){return String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
