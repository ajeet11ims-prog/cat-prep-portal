  "</span>\tIf the volume of the second gold bar is V cubic units then the volume of the first gold bar is {(1.2 × 1.5) × V} cubic units i.e. 1.8V cubic units. <br> <br><span style=\"font-family: ;\">Therefore, the cost of the first gold bar will be 80% more than that of the second bar.</span> <br> <br><span style=\"font-family: ;\">Thus, the price (in Rs. Lakh) of the second gold bar = 45 ÷ 1.8 = 25</span> <br> <br><span style=\"font-family: ;\">Therefore, the required answer is 25.</span>",
  "</span>\tLet the number of students in the senior division be k. Then the number in the junior division will be k + 12. The average of all the students must be an integer between 45 and 69. Also, since the number of junior students is more, this overall average will be closer to 45 (the average of the juniors) than 6<span style=\"font-family: ;\">9</span><span style=\"font-family: ;\"> (the average of the seniors) and hence below 57. Suppose this average is 57 – x, then the distance of this average from 45 will be 12 – x while the distance from 69 will be 12 + x, where x can go from 1 to 11. Now we can say, using&nbsp;</span><span style=\"font-family: ;\">allegation</span><span style=\"font-family: ;\">, that</span><span style=\"font-family: ;\">&nbsp;</span><span class=\"math-frac\"><span class=\"frac-num\">12 – x</span><span class=\"frac-den\">12 + x</span></span>=<span class=\"math-frac\"><span class=\"frac-num\">k</span><span class=\"frac-den\">k + 12</span></span><span style=\"font-family: ;\">.</span><span style=\"font-family: ;\">&nbsp;</span> <br> <br><span style=\"font-family: ;\">At this point it is probably safest to try all possible values of x and check whether k becomes an integer.</span> <br><span style=\"font-family: ;\">x</span><span style=\"font-family: ;\"> = 5, 7, 10 and 11 give non-integral k. Among the rest, the extreme cases turn out to be&nbsp;</span> <br><span style=\"font-family: ;\">When x = 1:&nbsp;</span><span class=\"math-frac\"><span class=\"frac-num\">11</span><span class=\"frac-den\">13</span></span>=<span class=\"math-frac\"><span class=\"frac-num\">k</span><span class=\"frac-den\">k + 12</span></span><span style=\"font-family: ;\">&nbsp;</span><span style=\"font-family: Cambria Math;\">⇒</span><span style=\"font-family: ;\"> k = 66 and k + 12 = 78 (giving a total of 144 students)</span> <br><span style=\"font-family: ;\">When x = 9</span><span style=\"font-family: ;\">:&nbsp;</span><span class=\"math-frac\"><span class=\"frac-num\">3</span><span class=\"frac-den\">21</span></span>=<span class=\"math-frac\"><span class=\"frac-num\">k</span><span class=\"frac-den\">k + 12</span></span><span style=\"font-family: ;font-size: 18.7px;\">&nbsp;</span><span style=\"font-family: Cambria Math;\">⇒</span><span style=\"font-family: ;\">&nbsp;</span><span style=\"font-family: ;\">k = 2 and k</span><span style=\"font-family: ;\">&nbsp;</span><span style=\"font-family: ;\">+</span><span style=\"font-family: ;\">&nbsp;</span><span style=\"font-family: ;\">12 = 14 (giving a total of 16 students)</span> <br><span style=\"font-family: ;\">So the difference between the maximum and minimum possible number of students in the school is 144 – 16 = 128.</span> <br><span style=\"font-family: ;\">Therefore, the required answer is 128.</span>",

  "</span>\tRatio of investments made by Rajesh, Prasad, and Yadav = 5.5 : 7.5 : 11 = 11 : 15 : 22 <br><span style=\"font-family: ;\">Suppose, Rajesh received Rs. 3k and Prasad received Rs. 5k from the profit that is shared between them only.</span> <br> <br><span style=\"font-family: ;\">Therefore, the total amount received by -&nbsp;</span> <br><span style=\"font-family: ;\">Rajesh = 3k + 11m</span><span style=\"font-family: ;\">,&nbsp;</span><span style=\"font-family: ;\">Prasad = 7k + 15m</span><span style=\"font-family: ;\">,&nbsp;</span><span style=\"font-family: ;\">Yadav = 22m</span> <br> <br><span style=\"font-family: ;\">According to the question,&nbsp;</span><span style=\"font-family: ;\">7k + 15m = 22m</span><span style=\"font-family: ;\">&nbsp;</span><span style=\"font-family: Cambria Math;\">⇒</span><span style=\"font-family: ;\">&nbsp;</span><span style=\"font-family: ;\">k = m</span> <br> <br><span style=\"font-family: ;\">Therefore, the percentage of profit earned by Rajesh =&nbsp;</span><span class=\"math-frac\"><span class=\"frac-num\">14</span><span class=\"frac-den\">58</span></span><span style=\"font-family: ;\"> ×</span><span style=\"font-family: ;\"> 100% = 24</span><span class=\"math-frac\"><span class=\"frac-num\">4</span><span class=\"frac-den\">29</span></span><span style=\"font-family: ;\">%</span> <br> <br><span style=\"font-family: ;\">Hence, [1].</span>",

  "</span>\t<span class=\"math-frac\"><span class=\"frac-num\">5&#215;13<sup>3</sup>+5&#215;17<sup>3</sup>+5 &#215;19<sup>3</sup></span><span class=\"frac-den\">5&#215;91<sup>3</sup>+5&#215;119<sup>3</sup>+5&#215;133<sup>3</sup></span></span>=<span class=\"math-frac\"><span class=\"frac-num\">5&#215;13<sup>3</sup>+5 &#215;17<sup>3</sup>+5 &#215;19<sup>3</sup></span><span class=\"frac-den\">5&#215;7<sup>3</sup>&#215;13<sup>3</sup>+ 5 &#215;7<sup>3</sup>&#215;17<sup>3</sup>+ 5&#215;7<sup>3</sup>&#215;19<sup>3</sup></span></span><span style=\"font-size: 18.7px;\">&nbsp;</span> <br> <br><span class=\"math-frac\"><span class=\"frac-num\">5 &#215;13<sup>3</sup>+ 5 &#215;17<sup>3</sup>+ 5 &#215;19<sup>3</sup></span><span class=\"frac-den\">7<sup>3</sup>(5 &#215;13<sup>3</sup> + 5 &#215;17<sup>3</sup> + 5 &#215;19<sup>3</sup>)</span></span>=<span class=\"math-frac\"><span class=\"frac-num\">1</span><span class=\"frac-den\">7<sup>3</sup></span></span><span style=\"font-family: ;font-size: 18.7px;\">&nbsp;</span> <br> <br><span>Thus,&nbsp;</span>(<span class=\"math-frac\"><span class=\"frac-num\">1</span><span class=\"frac-den\">7<sup>3</sup></span></span>)<sup>–<span class=\"math-frac\"><span class=\"frac-num\">1</span><span class=\"frac-den\">3</span></span></sup><span> = 7</span> <br><span>&nbsp;</span> <br><span>Therefore, the required answer is 7.</span>",
  "<p>Suppose the weight of the green ball is G kg and that of the 15 balls other than green and red is W kg. </p> <p><span style=\"font-family: Cambria Math;\">&there4;</span> W = 8.5625&nbsp;&times; 16&nbsp;&ndash; 17 = 120 </p> <p><span style=\"font-family: Cambria Math;\">&there4;</span>&nbsp;<span class=\"math-frac\"><span class=\"frac-num\">17+120+G</span><span class=\"frac-den\">17</span></span>‒<span class=\"math-frac\"><span class=\"frac-num\">120+G</span><span class=\"frac-den\">16</span></span>=<span class=\"math-frac\"><span class=\"frac-num\">1</span><span class=\"frac-den\">2</span></span> </p> <p><span style=\"font-family: Cambria Math;\">&rArr;</span>&nbsp;<span class=\"math-frac\"><span class=\"frac-num\">120+G</span><span class=\"frac-den\">16</span></span>‒<span class=\"math-frac\"><span class=\"frac-num\">120+G</span><span class=\"frac-den\">17</span></span>=<span class=\"math-frac\"><span class=\"frac-num\">1</span><span class=\"frac-den\">2</span></span> </p> <p><span style=\"font-family: Cambria Math;\">&rArr;</span> 120 + G = 136&nbsp; </p> <p><span style=\"font-family: Cambria Math;\">&rArr;</span> G = 16 kg <br><br>Therefore, the required answer is 16.</p>",
  "</span>\tConcentration of milk in the solution of first container =&nbsp;<span class=\"math-frac\"><span class=\"frac-num\">5</span><span class=\"frac-den\">8</span></span> <br><span style=\"font-family: ;\">Concentration of milk in the&nbsp;</span><span style=\"font-family: ;\">mixture of the two solutions&nbsp;</span><span style=\"font-family: ;\">=&nbsp;</span><span class=\"math-frac\"><span class=\"frac-num\">17</span><span class=\"frac-den\">28</span></span> <br><span style=\"font-family: ;\">As,&nbsp;</span><span class=\"math-frac\"><span class=\"frac-num\">5</span><span class=\"frac-den\">8</span></span>&gt;<span class=\"math-frac\"><span class=\"frac-num\">17</span><span class=\"frac-den\">28</span></span><span style=\"font-family: ;\">, therefore, concentration of milk in the solution of second container is less than&nbsp;</span><span class=\"math-frac\"><span class=\"frac-num\">17</span><span class=\"frac-den\">28</span></span><span style=\"font-family: ;\">.</span> <br><span style=\"font-family: ;\">We construct the following alligation structure –</span> <br><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAPUAAACyCAIAAAAVjh7mAAAAAXNSR0IArs4c6QAAEiJJREFUeF7tXVuoFlUb1hAi6GDaRW3IbLuhA5UF1YX4k0U7hYIKzENdZHilNxWCpju1Qqy2gnbjCSKFMonATpaapFlElB2M0iBT07DAs3YTiP5PvfzrH2fm+761ZtZaM2vNMxeb2Xuv9a73fd5n1rzzrtPAc+fODeBFBCJF4IJI7aJZROAfBMhv8iBmBMjvmL1L28hvciBmBMjvmL1L28hvciBmBMjvmL1L28hvciBmBHT5vW7duoH/u3AfMyS0zQEC48aNU/zBzeeff+6gkRyRuvyePHkyRjpxvfnmm7jfu3evH/3YSjQIvPzyy0IhXKNHj/Zjly6/1TD+pEmToNmhQ4f86MdWiEAZBHT5rdqQnrurq6tMq6zbQARmzZolIcr06dO9mT/QdH4VAqnu7u5ly5Z5U5ENxYQA+scRI0YgVpk5c6YHu8z67/7+/j179pDcHhwTaxPoHKdNm/bJJ5/4MdCA3yA3XjHgtx/N2ErECIDlfqzT5TdiplWrVpkGM35sYCs1RwDZQBVz43758uWPPvqoH5214m+JmZIKjR07duPGjX5UZCsRINDT0/Prr7+KIZ999pm3/KAWvyPAlyY0EwHd+KSZ6NDq0BEgv0P3IPVvhwD5TX7EjAD5HbN3aRv5TQ7EjAD5HbN3aRv5TQ7EjAD5HbN3aRv5TQ7EjAD5HbN3aRv5TQ7EjAD5HbN3aRv5TQ7EjAD5HbN3aZsuv7F4J7l/BfeHIHWsIHD06NG+vj4s6rUiLStEl9+omdy/wtv6IkdmU2wdEFi5cuXcuXM3b97sThkDfrtTgpKbiUBvb pan><span style=\"font-family: ;\"> –&nbsp;</span><span style=\"font-family: ;\">140</span> <br>⇒ x =<span class=\"math-frac\"><span class=\"frac-num\">5</span><span class=\"frac-den\">3</span></span> <br><span style=\"font-family: ;\">Thus, concentration of milk in the solution of second container =&nbsp;</span><span class=\"math-frac\"><span class=\"frac-num\">3</span><span class=\"frac-den\">5</span></span> <br><span style=\"font-family: ;\">Therefore, in the second container, the ratio of milk to water is = 3 : 2</span> <br><span style=\"font-family: ;\">Hence, [1].</span>",
  "<p>Worker with employee number 1 works for 8 consecutive hours and the amount of work done by him per hour&nbsp;is R units. For this worker, R = 1 &times; k = k, where k is a constant. <br><br>Similarly, the worker with employee number 2 works for 7 consecutive hours and the amount of work done by him per hour is 2k units where k is a constant. <br><br>This way, the worker with employee number 8 works for 1 hour only and the amount of work done by him per hour is 8k units where k is a constant. <br><br>Thus, total amount of work done&nbsp; <br>= 8 &times; k + 7 &times; 2k + 6 &times; 3k + 5 &times; 4k + 4 &times; 5k + 3 &times; 6k + 2 &times; 7k + 1 &times; 8k&nbsp; <br>= 120k <br><br>The worker who started last is employee number 8 and his rate of work is 8k units per hour. <br><br>Therefore, he alone will finish the work in (120k &divide; 8k) hours i.e. 15 hours. <br><br>Therefore, the required answer is 15.</p>",
  "<p>Let the total number of innings played by the batsman be&nbsp;N and&nbsp;a be the overall average score. <br>Therefore,&nbsp; Na = 10 &times; 53 + (N &ndash; 10)(a + 2) &hellip; (1) <br>Na = 10 &times; 59 + (N &ndash; 10)(a &ndash; 2) &hellip; (2) <br><br>From eq. (1), we get - <br>Na = 530 + Na &ndash; 10a + 2N &ndash; 20 <br><span style=\"font-family: Cambria Math;\">&rArr;</span> 5a &ndash; N = 255 &hellip; (3) <br><br>From eq. (2), we get - <br>Na = 590 + Na &ndash; 10a &ndash; 2N + 20 <br><span style=\"font-family: Cambria Math;\">&rArr;</span> 5a + N = 305 &hellip; (4) <br><br>Solving eq. (3) &amp; (4), we get N = 25 <br><br>Hence, [2]. <br><br><em>Alternatively</em>;</p> <p><br>Suppose the total number of innings played by the batsman = n + 20. That means, the number of innings played by the batsman other than the first 10 and the last 10 = n. Suppose the average number of runs scored by the batsman in those n innings is R.&nbsp; <br><br>Therefore, we have, the average runs scored if first 10 innings are not considered =&nbsp;<span class=\"math-frac\"><span class=\"frac-num\">nR+590</span><span class=\"frac-den\">n+10</span></span> (which is greater than the total average by 2) and the average runs scored if last 10 innings are not considered =&nbsp;<span class=\"math-frac\"><span class=\"frac-num\">nR+530</span><span class=\"frac-den\">n+10</span></span> (which is lower than the total average by 2).&nbsp; <br><br>Now,&nbsp;<span class=\"math-frac\"><span class=\"frac-num\">nR+590</span><span class=\"frac-den\">n+10</span></span>‒<span class=\"math-frac\"><span class=\"frac-num\">nR+530</span><span class=\"frac-den\">n+10</span></span><span style=\"font-size: 18.7px;\">&nbsp;</span>= 4 or&nbsp;<span class=\"math-frac\"><span class=\"frac-num\">60</span><span class=\"frac-den\">n+10</span></span>=&nbsp;4. Solving for n, we get n = 5. <br><br>Therefore, the total number of innings played by the batsman = 5 + 20 = 25.</p>",
  "</span>\tLet the original mixture have 2k each of acid and water.&nbsp; <br> <br><span style=\"font-family: ;\">With this volume of 4k, we will be mixing water of volume 6k.&nbsp;</span> <br> <br><span style=\"font-family: ;\">So the ratio of acid and water in the final will be 2k : (2k + 6k) = 2k : 8k = 1 : 4.&nbsp;</span> <br> <br><span style=\"font-family: ;\">Hence, [3].</span>",
  "</span>\tSuppose the number of boys and girls passing are 3x and 4x respectively and the number of boys and girls failing are 5y and 2y respectively. <br><span style=\"font-family: ;\">&nbsp;</span> <br><span style=\"font-family: ;\">Then (3x + 5y) : (4x + 2y) is 10 : 11 which gives x : y = 5 : 1.&nbsp;</span> <br> <br><span style=\"font-family: ;\">So if 2y = 34 i.e. y = 17 then x = 85 and the total number of boys will be 3x + 5y = 3 × 85 + 5 × 17 = 340.</span><span style=\"font-family: ;\"><b>&nbsp;</b></span> <br> <br><span style=\"font-family: ;\">Hence, [1].</span>",
  "<p>Total height of five students = 5 &times; 150 = 750 cm </p> <p>The minimum total height of the three friends other than the tallest and the second tallest person = (135 + 136 + 150) = 421 cm </p> <p>Thus, the maximum height (in cm) of the second tallest friend can be = {(150&nbsp;&times;&nbsp;5&nbsp;&ndash;&nbsp;421)&nbsp;&ndash;&nbsp;1} &divide; 2 = 164 </p> <p>The minimum height of the second tallest person is 151 cm given that the five heights in&nbsp;centimetres are 148, 149, 150, 151, and 152. </p> <p>Thus, the difference = (164 ‒ 151) = 13 cm </p> <p>Hence, [1].</p>",
  "<p>Let us consider the volume of each container to be 48 k (so that we can take&nbsp;<span class=\"math-frac\"><span class=\"frac-num\">1</span><span class=\"frac-den\">2</span></span>,&nbsp;<span class=\"math-frac\"><span class=\"frac-num\">1</span><span class=\"frac-den\">2</span></span>,&nbsp;<span class=\"math-frac\"><span class=\"frac-num\">1</span><span class=\"frac-den\">3</span></span> and&nbsp;<span class=\"math-frac\"><span class=\"frac-num\">1</span><span class=\"frac-den\">4</span></span>).</p> <p>&nbsp;</p> <table style=\"width: 487px; height: 186.757px;\" border=\"1\" cellspacing=\"0\" cellpadding=\"2\"> <tbody> <tr style=\"text-align: center; height: 24.4329px;\"> <td style=\"width: 61.3079px; height: 24.4329px;\">&nbsp;</td> <td style=\"width: 183.623px; height: 24.4329px;\" colspan=\"2\"><strong style=\"text-align: center;\">Container 1</strong><strong><br></strong></td> <td style=\"width: 217.708px; height: 24.4329px;\" colspan=\"2\"><strong style=\"text-align: center;\">Container 2</strong><strong><br></strong></td> </tr> <tr style=\"text-align: center; height: 24.4329px;\"> <td style=\"width: 61.3079px; height: 24.4329px;\">&nbsp;</td> <td style=\"width: 88.3333px; height: 24.4329px;\"><strong>Acid</strong></td> <td style=\"width: 95.2894px; height: 24.4329px;\"><strong>Water</strong></td> <td style=\"width: 104.259px; height: 24.4329px;\"><strong>Acid</strong></td> <td style=\"width: 113.449px; height: 24.4329px;\"><strong>Water</strong></td> </tr> <tr style=\"text-align: center; height: 24.4329px;\"> <td style=\"width: 61.3079px; height: 24.4329px;\"><strong>Initial</strong></td> <td style=\"width: 88.3333px; height: 24.4329px;\">24k</td> <td style=\"width: 95.2894px; height: 24.4329px;\">0</td> <td style=\"width: 104.259px; height: 24.4329px;\">0</td> <td style=\"width: 113.449px; height: 24.4329px;\">24k</td> </tr> <tr style=\"text-align: center; height: 24.4329px;\"> <td style=\"width: 61.3079px; height: 24.4329px;\"><strong>Step 1</strong></td> <td style=\"width: 88.3333px; height: 24.4329px;\">12k</td> <td style=\"width: 95.2894px; height: 24.4329px;\">0</td> <td style=\"width: 104.259px; height: 24.4329px;\">12k</td> <td style=\"width: 113.449px; height: 24.4329px;\">24k</td> </tr> <tr style=\"text-align: center; height: 24.4329px;\"> <td style=\"width: 61.3079px; height: 24.4329px;\"><strong>Step 2</strong></td> <td style=\"width: 88.3333px; height: 24.4329px;\">16k</td> <td style=\"width: 95.2894px; height: 24.4329px;\">8k</td> <td style=\"width: 104.259px; height: 24.4329px;\">8k</td> <td style=\"width: 113.449px; height: 24.4329px;\">16k</td> </tr> <tr style=\"text-align: center; height: 24.4329px;\"> <td style=\"width: 61.3079px; height: 24.4329px;\"><strong>Step 3</strong></td> <td style=\"width: 88.3333px; height: 24.4329px;\">12k</td> <td style=\"width: 95.2894px; height: 24.4329px;\">6k</td> <td style=\"width: 104.259px; height: 24.4329px;\">12k</td> <td style=\"width: 113.449px; height: 24.4329px;\">18k</td> </tr> </tbody> </table> <p><br>The required ratio is 12k : 18k i.e. 2 : 3. <br><br>Hence, [1].</p>",
  "</span>\tLet the&nbsp;<span style=\"font-family: ;\">amount</span><span style=\"font-family: ;\"> of monthly salaries of Lata, Gita, and Sita be 8i, 7i, and 6i respectively.</span> <br> <br><span style=\"font-family: ;\">Let the&nbsp;</span><span style=\"font-family: ;\">amount</span><span style=\"font-family: ;\"> of monthly expenditures of Lata, Gita, and Sita be 8e, 7e, and 6e respectively.</span> <br> <br><span style=\"font-family: ;\">Thus, the amount that Lata, Gita, and Sita save each month will be 8(</span><span style=\"font-family: ;\">i</span><span style=\"font-family: ;\"> – e), 7(</span><span style=\"font-family: ;\">i</span><span style=\"font-family: ;\"> – e), and 6(</span><span style=\"font-family: ;\">i</span><span style=\"font-family: ;\"> – e).</span> <br> <br><span style=\"font-family: ;\">Thus, Lata saves a maximum amount per month.</span> <br> <br><span style=\"font-family: ;\">Percentage of monthly income saved by Lata =&nbsp;</span><span class=\"math-frac\"><span class=\"frac-num\">(i ‒ e) &#215; 100</span><span class=\"frac-den\">i</span></span><span style=\"font-family: ;\">%</span> <br><span style=\"font-family: ;\">Percentage of monthly income saved by Gita =&nbsp;</span><span class=\"math-frac\"><span class=\"frac-num\">(i ‒ e) &#215; 100</span><span class=\"frac-den\">i</span></span><span style=\"font-family: ;\">%</span> <br><span style=\"font-family: ;\">Percentage of monthly income saved by Sita =&nbsp;</span><span class=\"math-frac\"><span class=\"frac-num\">(i ‒ e) &#215; 100</span><span class=\"frac-den\">i</span></span><span style=\"font-family: ;\">%</span> <br> <br><span style=\"font-family: ;\">Thus, the percentage of monthly income saved is the same for all.</span> <br> <br><span style=\"font-family: ;\">Hence, [1].</span>",
  "<p>The maximum number of chocolates received by a kid shall be minimum only when each child receives an equal number of chocolates. But, 50 cannot be divided by 7.&nbsp; </p> <p>So, 6 kids will receive 7 chocolates each and one kid will get 8 chocolates. </p> <p>&there4; 50 = 6 &times; 7 + 1 &times; 8 </p> <p>Thus, 8 will be the minimum value of the maximum number of chocolates received by a kid. </p> <p>Hence, [4].</p>",
  "</span>\t<span style=\"font-family: ;\">Price of the cheapest mixture = 2 units of cheaper variety + 1 unit of costlier variety</span> <br><span style=\"font-family: ;\">= {(2</span><span style=\"font-family: ;\">&nbsp;</span><span style=\"font-family: ;\">×</span><span style=\"font-family: ;\">&nbsp;</span><span style=\"font-family: ;\">900 + 1</span><span style=\"font-family: ;\">&nbsp;</span><span style=\"font-family: ;\">×</span><span style=\"font-family: ;\">&nbsp;</span><span style=\"font-family: ;\">1200) ÷ (2</span><span style=\"font-family: ;\">&nbsp;</span><span style=\"font-family: ;\">+</span><span style=\"font-family: ;\">&nbsp;</span><span style=\"font-family: ;\">1)} per litre</span> <br><span style=\"font-family: ;\">= Rs. 1000 per litre</span> <br><span style=\"font-family: ;\">Price of the costliest mixture = 1 unit of cheaper variety + 2 units of costlier variety</span> <br>=&nbsp;<span style=\"font-family: ;\">{(1</span><span style=\"font-family: ;\">&nbsp;</span><span style=\"font-family: ;\">×</span><span style=\"font-family: ;\">&nbsp;</span><span style=\"font-family: ;\">900 + 2</span><span style=\"font-family: ;\">&nbsp;</span><span style=\"font-family: ;\">×</span><span style=\"font-family: ;\">&nbsp;</span><span style=\"font-family: ;\">1200) ÷ (1</span><span style=\"font-family: ;\">&nbsp;</span><span style=\"font-family: ;\">+</span><span style=\"font-family: ;\">&nbsp;</span><span style=\"font-family: ;\">2)} per litre</span> <br><span style=\"font-family: ;\">= Rs. 1100 per litre</span> <br> <br><span style=\"font-family: ;\">So, the maximum difference = Rs. 100 per litre</span> <br> <br><span style=\"font-family: ;\">Therefore, the required answer is 100.</span>",
  "</span>\tThe total of the three smallest numbers is 30 while that of the two largest is 50. The total of these five numbers is therefore fixed (80). We need to minimise the other two numbers to minimise the overall average. Suppose we take the three smallest numbers as 9, 10, 11, and the largest as 24 and 26, then we can take the remaining two as 12 and 13, giving a total of 105 and an average of 15. <br> <br><span style=\"font-family: ;\">Hence, [4].</span>",

    questions.forEach((q, i) => { q.solution = solutionText[i] || 'Solution not provided.'; });
    let current = 0, submitted = false, secondsLeft = 50 * 60;
    const responses = Array(questions.length).fill(null), marked = Array(questions.length).fill(false), labels = ["A","B","C","D"];
    const qbar = document.getElementById("qbar"), host = document.getElementById("questionHost"), resultBox = document.getElementById("result");
    function esc(s){return String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
    function norm(s){return String(s ?? "").trim().toLowerCase().replace(/[,₹ rs.%]/g,"").replace(/\s+/g,"");}
    function hasHtml(s){return /<\/?[a-z][\s\S]*>/i.test(String(s ?? ""));}
    function mathFractions(s){let html=hasHtml(s)?String(s):esc(s);html=html.replace(/(\d+)\s*<sup>(\d+)<\/sup>\s*\/\s*<sub>(\d+)<\/sub>/g,'<span class="mixed-number">$1 <span class="math-frac"><span class="frac-num">$2</span><span class="frac-den">$3</span></span></span>');const wrap=document.createElement("span");wrap.innerHTML=html;const nodes=[];const walker=document.createTreeWalker(wrap,NodeFilter.SHOW_TEXT);while(walker.nextNode())nodes.push(walker.currentNode);const pattern=/(^|[^A-Za-z0-9.])((?:\d+(?:\.\d+)?|[A-Za-z]))\s*\/\s*((?:\d+(?:\.\d+)?|[A-Za-z]))(?=$|[^A-Za-z0-9.])/g;nodes.forEach(node=>{const parent=node.parentElement;if(parent&&parent.closest('.math-frac,script,style'))return;const text=node.nodeValue||'';pattern.lastIndex=0;if(!pattern.test(text))return;pattern.lastIndex=0;const frag=document.createDocumentFragment();let last=0,m;while((m=pattern.exec(text))){frag.append(document.createTextNode(text.slice(last,m.index)+m[1]));const fraction=document.createElement('span');fraction.className='math-frac';const numerator=document.createElement('span');numerator.className='frac-num';numerator.textContent=m[2];const denominator=document.createElement('span');denominator.className='frac-den';denominator.textContent=m[3];fraction.append(numerator,denominator);frag.append(fraction);last=pattern.lastIndex;}frag.append(document.createTextNode(text.slice(last)));node.replaceWith(frag);});return wrap.innerHTML;}
    function rich(s){return mathFractions(hasHtml(s) ? String(s) : esc(s));}
    function stripHtml(html){const div=document.createElement("div");div.innerHTML=String(html ?? "");return div.textContent.trim().replace(/\s+/g," ");}
    function qType(q){return q.type || ((q.options && q.options.length) ? "mcq" : "text");}
    function qText(q){return q.question ?? q.q ?? "";}
    function qSource(q){return q.source || q.level || "";}
    function qAnswer(q){return q.typedAnswer ?? q.answer ?? "";}
    function renderBar(){qbar.innerHTML=questions.map((q,i)=>'<button type="button" class="qbtn '+(i===current?'current ':'')+(responses[i]!==null&&responses[i]!==''?'answered ':'')+(marked[i]?'marked ':'')+'" onclick="go('+i+')">'+(q.palette || (i+1))+'</button>').join('');}
    function correctText(q){return qType(q)==="mcq" ? "(" + labels[q.answer] + ") " + stripHtml((q.options || [])[q.answer] || "") : qAnswer(q);}
    function contentBlock(html, cls){return html ? '<div class="'+cls+'">'+rich(html)+'</div>' : '';}
    function control(q,i){if(qType(q)==="mcq") return '<div class="options">'+(q.options||[]).map((op,j)=>'<label class="option"><input type="radio" autocomplete="off" name="answer_'+i+'" value="'+j+'" '+(responses[i]===String(j)?'checked':'')+' '+(submitted?'disabled':'')+'> <span><span class="opt-label">('+labels[j]+')</span> <span class="opt-text">'+rich(op)+'</span></span></label>').join('')+'</div>'; return '<input type="text" inputmode="decimal" class="typed-answer" name="answer_'+i+'" autocomplete="off" value="'+esc(responses[i]||'')+'" placeholder="Type your numerical answer" '+(submitted?'disabled':'')+'>';}
    function solutionHtml(q){const sol=q.solution || "Solution not provided.";return rich(sol);}
    function renderQuestion(){const q=questions[current];host.innerHTML='<div class="qhead"><div><div class="qnum">Question '+(q.display || (current+1))+'</div><div class="source">'+esc(qSource(q))+'</div></div></div>'+contentBlock(q.direction,'block')+contentBlock(q.passage,'block')+'<div class="qtext">'+rich(qText(q))+'</div>'+control(q,current)+'<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Solution</h3><strong>Answer: '+rich(correctText(q))+'</strong><div class="block">'+solutionHtml(q)+'</div></div><div class="navrow"><button type="button" onclick="markReviewNext()" class="mark">Mark for Review & Next</button><button type="button" onclick="clearResponse()" '+(submitted?'disabled':'')+'>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" onclick="nextQ()" class="submit">Save & Next</button></div>';if(submitted)showReviewForCurrent();bindAnswer();renderBar();}
    function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{if(responses[current]===null&&el.type==='radio')el.checked=false;el.addEventListener('input',()=>{responses[current]=el.type==='radio'?el.value:el.value;renderBar();});el.addEventListener('change',()=>{responses[current]=el.type==='radio'?el.value:el.value;renderBar();});});}
    function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('input.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}
    function go(i){saveCurrent();current=i;renderQuestion();} function prevQ(){if(current>0)go(current-1);} function nextQ(){if(current<questions.length-1)go(current+1);} function toggleMark(){marked[current]=!marked[current];renderQuestion();} function markReviewNext(){marked[current]=true;if(current<questions.length-1)nextQ();else renderQuestion();} function clearResponse(){responses[current]=null;renderQuestion();}
    function isCorrect(q,ans){if(ans===null||ans==='')return null;if(qType(q)==='mcq')return Number(ans)===Number(q.answer);const accepted=(q.accepted&&q.accepted.length?q.accepted:[qAnswer(q)]).map(norm);return accepted.includes(norm(ans));}
    function showReviewForCurrent(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';host.scrollTop=0;if(r===null){note.className='answer-note muted';note.textContent='Unattempted. Correct answer: '+correctText(q);}else if(r){note.className='answer-note ok';note.textContent='Correct.';}else{note.className='answer-note bad';note.textContent='Wrong. Correct answer: '+correctText(q);} }
    function submitTest(){if(submitted)return;saveCurrent();submitted=true;let c=0,w=0,u=0;let score=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r){c++;score+=3;}else{w++;if(qType(q)==='mcq')score-=1;}});resultBox.style.display='block';resultBox.innerHTML='<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>'+score+'</strong></div><div class="score-box">Correct<strong>'+c+'</strong></div><div class="score-box">Wrong<strong>'+w+'</strong></div><div class="score-box">Attempted<strong>'+(c+w)+'</strong></div><div class="score-box">Unattempted<strong>'+u+'</strong></div></div>';showReviewForCurrent();renderBar();resultBox.scrollIntoView({behavior:'smooth',block:'start'});}
    function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest();return;}secondsLeft--;}
    function calcEval(expr){if(!/^[0-9+\-*/().%\s]+$/.test(expr))return 'Error';return Function('return ('+expr.replace(/%/g,'/100')+')')();}
    function updateCalcSub(){document.getElementById('calcSubDisplay').textContent=document.getElementById('calcDisplay').value||'0';}
    document.querySelectorAll('[data-calc]').forEach(btn=>btn.addEventListener('click',()=>{const d=document.getElementById('calcDisplay'),v=btn.dataset.calc;if(['MC','MR','MS','M+','M-'].includes(v))return; if(v==='C')d.value='';else if(v==='B')d.value=d.value.slice(0,-1);else if(v==='+/-'){d.value=d.value.startsWith('-')?d.value.slice(1):('-'+d.value);}else if(v==='sqrt'){try{d.value=Math.sqrt(Number(calcEval(d.value||'0')));}catch(e){d.value='Error';}}else if(v==='1/x'){try{d.value=1/Number(calcEval(d.value||'0'));}catch(e){d.value='Error';}}else if(v==='='){try{d.value=calcEval(d.value);}catch(e){d.value='Error';}}else d.value+=v;updateCalcSub();}));
    const calcPopup=document.getElementById('calcPopup'), calcHandle=document.getElementById('calcDragHandle');
    document.getElementById('calcToggle').addEventListener('click',()=>{calcPopup.classList.toggle('open');if(calcPopup.classList.contains('open')&&!calcPopup.dataset.moved){calcPopup.style.left='52%';calcPopup.style.top='120px';}});
    document.getElementById('calcClose').addEventListener('pointerdown',e=>e.stopPropagation());
    document.getElementById('calcClose').addEventListener('click',e=>{e.stopPropagation();calcPopup.classList.remove('open');});
    let dragCalc=false, calcDx=0, calcDy=0;
    calcHandle.addEventListener('pointerdown',e=>{dragCalc=true;calcHandle.setPointerCapture(e.pointerId);const r=calcPopup.getBoundingClientRect();calcDx=e.clientX-r.left;calcDy=e.clientY-r.top;calcPopup.style.left=r.left+'px';calcPopup.style.top=r.top+'px';calcPopup.style.right='auto';calcPopup.dataset.moved='1';e.preventDefault();});
    calcHandle.addEventListener('pointermove',e=>{if(!dragCalc)return;const maxX=window.innerWidth-calcPopup.offsetWidth-4,maxY=window.innerHeight-calcPopup.offsetHeight-4;calcPopup.style.left=Math.max(4,Math.min(maxX,e.clientX-calcDx))+'px';calcPopup.style.top=Math.max(4,Math.min(maxY,e.clientY-calcDy))+'px';});
    calcHandle.addEventListener('pointerup',e=>{dragCalc=false;try{calcHandle.releasePointerCapture(e.pointerId);}catch(err){}});
    calcHandle.addEventListener('pointercancel',()=>{dragCalc=false;});
    renderQuestion();tick();setInterval(tick,1000);
