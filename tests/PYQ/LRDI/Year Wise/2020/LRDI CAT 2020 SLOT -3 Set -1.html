<script>const TITLE="LRDI CAT 2020 SLOT -3 Set -1",MINUTES=15,questions=[{"group":"set","q":"How many mango trees were there in total?","options":["126","84","98","49"],"answer":"C","solution":"<p>First determine ownership. Chitra already has X1 and Z2. Because Dipti's two adjoining plots cannot touch Chitra's plots, Dipti must have X3 and X4. Each daughter has an even number of plots, and Abha and Bina have more plots than Dipti; therefore the plot counts are A=4, B=4, C=2, D=2. Bina must cover every row and column, fixing X2, Y3 and Z4 for Bina and Y2, Y4 and Z3 for Abha.</p><p>Let the teak values in Y2, Y3 and Y4 be x, 2x and 4x. Including Y1=21, teak totals 21+7x and mango totals twice this. The distinct non-zero multiples condition and the total of 205 leave x=4 (x=6 would leave only 16 pine trees, impossible with the fixed entries). Hence teak=49 and mango=98. The daughter totals become Abha=50, Chitra=30, Dipti=56 and Bina=69. Using the 32 maximum and the remaining totals gives the completed grid:</p><div style=\"overflow-x:auto\"><table class=\"data-table \"><thead><tr><th>Row / Column</th><th>1</th><th>2</th><th>3</th><th>4</th></tr></thead><tbody><tr><td>X — Mango</td><td>12 (Chitra)</td><td>30 (Bina)</td><td>32 (Dipti)</td><td>24 (Dipti)</td></tr><tr><td>Y — Teak</td><td>21 (Abha)</td><td>4 (Abha)</td><td>8 (Bina)</td><td>16 (Abha)</td></tr><tr><td>Z — Pine</td><td>3 (Bina)</td><td>18 (Chitra)</td><td>9 (Abha)</td><td>28 (Bina)</td></tr><tr><td>Column total</td><td>36</td><td>52</td><td>49</td><td>68</td></tr></tbody></table></div><p>The completed X row totals 12+30+32+24=98 mango trees.</p><p><strong>Correct answer: 98.</strong></p>"},{"group":"set","q":"Which of the following is the correct sequence of trees received by Abha, Bina, Chitra and Dipti, in that order?","options":["50, 69, 30, 56","60, 39, 40, 66","44, 87, 24, 50","54, 57, 34, 60"],"answer":"A","solution":"<p>First determine ownership. Chitra already has X1 and Z2. Because Dipti's two adjoining plots cannot touch Chitra's plots, Dipti must have X3 and X4. Each daughter has an even number of plots, and Abha and Bina have more plots than Dipti; therefore the plot counts are A=4, B=4, C=2, D=2. Bina must cover every row and column, fixing X2, Y3 and Z4 for Bina and Y2, Y4 and Z3 for Abha.</p><p>Let the teak values in Y2, Y3 and Y4 be x, 2x and 4x. Including Y1=21, teak totals 21+7x and mango totals twice this. The distinct non-zero multiples condition and the total of 205 leave x=4 (x=6 would leave only 16 pine trees, impossible with the fixed entries). Hence teak=49 and mango=98. The daughter totals become Abha=50, Chitra=30, Dipti=56 and Bina=69. Using the 32 maximum and the remaining totals gives the completed grid:</p><div style=\"overflow-x:auto\"><table class=\"data-table \"><thead><tr><th>Row / Column</th><th>1</th><th>2</th><th>3</th><th>4</th></tr></thead><tbody><tr><td>X — Mango</td><td>12 (Chitra)</td><td>30 (Bina)</td><td>32 (Dipti)</td><td>24 (Dipti)</td></tr><tr><td>Y — Teak</td><td>21 (Abha)</td><td>4 (Abha)</td><td>8 (Bina)</td><td>16 (Abha)</td></tr><tr><td>Z — Pine</td><td>3 (Bina)</td><td>18 (Chitra)</td><td>9 (Abha)</td><td>28 (Bina)</td></tr><tr><td>Column total</td><td>36</td><td>52</td><td>49</td><td>68</td></tr></tbody></table></div><p>Adding each daughter's plots gives A=50, B=69, C=30 and D=56.</p><p><strong>Correct answer: 50, 69, 30, 56.</strong></p>"},{"group":"set","q":"How many pine trees did Chitra receive?","options":["15","18","30","21"],"answer":"B","solution":"<p>First determine ownership. Chitra already has X1 and Z2. Because Dipti's two adjoining plots cannot touch Chitra's plots, Dipti must have X3 and X4. Each daughter has an even number of plots, and Abha and Bina have more plots than Dipti; therefore the plot counts are A=4, B=4, C=2, D=2. Bina must cover every row and column, fixing X2, Y3 and Z4 for Bina and Y2, Y4 and Z3 for Abha.</p><p>Let the teak values in Y2, Y3 and Y4 be x, 2x and 4x. Including Y1=21, teak totals 21+7x and mango totals twice this. The distinct non-zero multiples condition and the total of 205 leave x=4 (x=6 would leave only 16 pine trees, impossible with the fixed entries). Hence teak=49 and mango=98. The daughter totals become Abha=50, Chitra=30, Dipti=56 and Bina=69. Using the 32 maximum and the remaining totals gives the completed grid:</p><div style=\"overflow-x:auto\"><table class=\"data-table \"><thead><tr><th>Row / Column</th><th>1</th><th>2</th><th>3</th><th>4</th></tr></thead><tbody><tr><td>X — Mango</td><td>12 (Chitra)</td><td>30 (Bina)</td><td>32 (Dipti)</td><td>24 (Dipti)</td></tr><tr><td>Y — Teak</td><td>21 (Abha)</td><td>4 (Abha)</td><td>8 (Bina)</td><td>16 (Abha)</td></tr><tr><td>Z — Pine</td><td>3 (Bina)</td><td>18 (Chitra)</td><td>9 (Abha)</td><td>28 (Bina)</td></tr><tr><td>Column total</td><td>36</td><td>52</td><td>49</td><td>68</td></tr></tbody></table></div><p>Chitra owns Z2 in the pine row, which contains 18 trees.</p><p><strong>Correct answer: 18.</strong></p>"},{"group":"set","q":"Who got the plot with the smallest number of trees, and how many trees did that plot have?","options":["Abha, 4 trees","Dipti, 6 trees","Bina, 3 trees","Bina, 4 trees"],"answer":"C","solution":"<p>First determine ownership. Chitra already has X1 and Z2. Because Dipti's two adjoining plots cannot touch Chitra's plots, Dipti must have X3 and X4. Each daughter has an even number of plots, and Abha and Bina have more plots than Dipti; therefore the plot counts are A=4, B=4, C=2, D=2. Bina must cover every row and column, fixing X2, Y3 and Z4 for Bina and Y2, Y4 and Z3 for Abha.</p><p>Let the teak values in Y2, Y3 and Y4 be x, 2x and 4x. Including Y1=21, teak totals 21+7x and mango totals twice this. The distinct non-zero multiples condition and the total of 205 leave x=4 (x=6 would leave only 16 pine trees, impossible with the fixed entries). Hence teak=49 and mango=98. The daughter totals become Abha=50, Chitra=30, Dipti=56 and Bina=69. Using the 32 maximum and the remaining totals gives the completed grid:</p><div style=\"overflow-x:auto\"><table class=\"data-table \"><thead><tr><th>Row / Column</th><th>1</th><th>2</th><th>3</th><th>4</th></tr></thead><tbody><tr><td>X — Mango</td><td>12 (Chitra)</td><td>30 (Bina)</td><td>32 (Dipti)</td><td>24 (Dipti)</td></tr><tr><td>Y — Teak</td><td>21 (Abha)</td><td>4 (Abha)</td><td>8 (Bina)</td><td>16 (Abha)</td></tr><tr><td>Z — Pine</td><td>3 (Bina)</td><td>18 (Chitra)</td><td>9 (Abha)</td><td>28 (Bina)</td></tr><tr><td>Column total</td><td>36</td><td>52</td><td>49</td><td>68</td></tr></tbody></table></div><p>The smallest entry is 3 at Z1, owned by Bina.</p><p><strong>Correct answer: Bina, 3 trees.</strong></p>"},{"group":"set","q":"Which of the following statements is NOT true?","options":["Bina got 32 pine trees.","Chitra got 12 mango trees.","Abha got 41 teak trees.","Dipti got 56 mango trees."],"answer":"A","solution":"<p>First determine ownership. Chitra already has X1 and Z2. Because Dipti's two adjoining plots cannot touch Chitra's plots, Dipti must have X3 and X4. Each daughter has an even number of plots, and Abha and Bina have more plots than Dipti; therefore the plot counts are A=4, B=4, C=2, D=2. Bina must cover every row and column, fixing X2, Y3 and Z4 for Bina and Y2, Y4 and Z3 for Abha.</p><p>Let the teak values in Y2, Y3 and Y4 be x, 2x and 4x. Including Y1=21, teak totals 21+7x and mango totals twice this. The distinct non-zero multiples condition and the total of 205 leave x=4 (x=6 would leave only 16 pine trees, impossible with the fixed entries). Hence teak=49 and mango=98. The daughter totals become Abha=50, Chitra=30, Dipti=56 and Bina=69. Using the 32 maximum and the remaining totals gives the completed grid:</p><div style=\"overflow-x:auto\"><table class=\"data-table \"><thead><tr><th>Row / Column</th><th>1</th><th>2</th><th>3</th><th>4</th></tr></thead><tbody><tr><td>X — Mango</td><td>12 (Chitra)</td><td>30 (Bina)</td><td>32 (Dipti)</td><td>24 (Dipti)</td></tr><tr><td>Y — Teak</td><td>21 (Abha)</td><td>4 (Abha)</td><td>8 (Bina)</td><td>16 (Abha)</td></tr><tr><td>Z — Pine</td><td>3 (Bina)</td><td>18 (Chitra)</td><td>9 (Abha)</td><td>28 (Bina)</td></tr><tr><td>Column total</td><td>36</td><td>52</td><td>49</td><td>68</td></tr></tbody></table></div><p>Bina's only pine plots are Z1=3 and Z4=28, totalling 31, not 32. The other statements match the grid.</p><p><strong>Correct answer: Bina got 32 pine trees.</strong></p>"},{"group":"set","q":"Which column had the highest number of trees?","options":["3","Cannot be determined","2","4"],"answer":"D","solution":"<p>First determine ownership. Chitra already has X1 and Z2. Because Dipti's two adjoining plots cannot touch Chitra's plots, Dipti must have X3 and X4. Each daughter has an even number of plots, and Abha and Bina have more plots than Dipti; therefore the plot counts are A=4, B=4, C=2, D=2. Bina must cover every row and column, fixing X2, Y3 and Z4 for Bina and Y2, Y4 and Z3 for Abha.</p><p>Let the teak values in Y2, Y3 and Y4 be x, 2x and 4x. Including Y1=21, teak totals 21+7x and mango totals twice this. The distinct non-zero multiples condition and the total of 205 leave x=4 (x=6 would leave only 16 pine trees, impossible with the fixed entries). Hence teak=49 and mango=98. The daughter totals become Abha=50, Chitra=30, Dipti=56 and Bina=69. Using the 32 maximum and the remaining totals gives the completed grid:</p><div style=\"overflow-x:auto\"><table class=\"data-table \"><thead><tr><th>Row / Column</th><th>1</th><th>2</th><th>3</th><th>4</th></tr></thead><tbody><tr><td>X — Mango</td><td>12 (Chitra)</td><td>30 (Bina)</td><td>32 (Dipti)</td><td>24 (Dipti)</td></tr><tr><td>Y — Teak</td><td>21 (Abha)</td><td>4 (Abha)</td><td>8 (Bina)</td><td>16 (Abha)</td></tr><tr><td>Z — Pine</td><td>3 (Bina)</td><td>18 (Chitra)</td><td>9 (Abha)</td><td>28 (Bina)</td></tr><tr><td>Column total</td><td>36</td><td>52</td><td>49</td><td>68</td></tr></tbody></table></div><p>The column totals are 36, 52, 49 and 68. Column 4 is highest.</p><p><strong>Correct answer: 4.</strong></p>"}];
const charts={"set":""},passages={"set":"<p>A farmer had a rectangular land containing 205 trees. He distributed that land among his four daughters – Abha, Bina, Chitra and Dipti by dividing the land into twelve plots along three rows (X,Y,Z) and four Columns (1,2,3,4) as shown in the figure below:</p><div class=\"chart-card\" style=\"max-width:560px;margin:18px auto 22px;padding:14px;background:#fff\"><svg class=\"chart-svg\" viewBox=\"0 0 520 300\" role=\"img\" aria-label=\"Twelve plots arranged in rows X, Y, Z and columns 1, 2, 3, 4\"><rect x=\"70\" y=\"55\" width=\"400\" height=\"210\" fill=\"#fff\" stroke=\"#1f2933\" stroke-width=\"3\"/><g stroke=\"#1f2933\" stroke-width=\"2\"><line x1=\"170\" y1=\"55\" x2=\"170\" y2=\"265\"/><line x1=\"270\" y1=\"55\" x2=\"270\" y2=\"265\"/><line x1=\"370\" y1=\"55\" x2=\"370\" y2=\"265\"/><line x1=\"70\" y1=\"125\" x2=\"470\" y2=\"125\"/><line x1=\"70\" y1=\"195\" x2=\"470\" y2=\"195\"/></g><g fill=\"#17212b\" font-family=\"Arial, sans-serif\" font-size=\"22\" font-weight=\"700\" text-anchor=\"middle\"><text x=\"120\" y=\"38\">1</text><text x=\"220\" y=\"38\">2</text><text x=\"320\" y=\"38\">3</text><text x=\"420\" y=\"38\">4</text><text x=\"40\" y=\"98\">X</text><text x=\"40\" y=\"168\">Y</text><text x=\"40\" y=\"238\">Z</text></g><g fill=\"#17212b\" font-family=\"Arial, sans-serif\" font-size=\"21\" font-weight=\"700\"><text x=\"82\" y=\"79\">12</text><text x=\"82\" y=\"149\">21</text><text x=\"282\" y=\"219\">9</text><text x=\"382\" y=\"219\">28</text></g><g fill=\"#17212b\" font-family=\"Arial, sans-serif\" font-size=\"21\"><text x=\"150\" y=\"115\">C</text><text x=\"150\" y=\"185\">A</text><text x=\"450\" y=\"185\">A</text><text x=\"150\" y=\"255\">B</text><text x=\"250\" y=\"255\">C</text></g></svg></div><p>The plots in rows X, Y, Z contained mango, teak and pine trees respectively. Each plot had trees in non-zero multiples of 3 or 4 and none of the plots had the same number of trees. Each daughter got an even number of plots. In the figure, the number mentioned in top left corner of a plot is the number of trees in that plot, while the letter in the bottom right corner is the first letter of the name of the daughter who got that plot (For example, Abha got the plot in row Y and column 1 containing 21 trees).</p><p>Some information in the figure got erased, but the following is known:</p><ol><li>Abha got 20 trees more than Chitra but 6 trees less than Dipti.</li><li>The largest number of trees in a plot was 32, but it was not with Abha.</li><li>The number of teak trees in Column 3 was double of that in Column 2 but was half of that in Column 4.</li><li>Both Abha and Bina got a higher number of plots than Dipti.</li><li>Only Bina, Chitra and Dipti got corner plots.</li><li>Dipti got two adjoining plots in the same row.</li><li>Bina was the only one who got a plot in each row and each column.</li><li>Chitra and Dipti did not get plots which were adjacent to each other (either in row / column / diagonal).</li><li>The number of mango trees was double the number of teak trees.</li></ol>"};
const labels=Array.from({length:26},(_,i)=>String.fromCharCode(65+i));let current=0,submitted=false,secondsLeft=MINUTES*60,timerId=null;
const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false);
const host=document.getElementById("host"),qbar=document.getElementById("qbar"),result=document.getElementById("result");
function renderBar(){qbar.innerHTML=questions.map((_,i)=>`<button class="qdot ${i===current?"current":responses[i]!==null?"answered":""} ${marked[i]?"marked":""}" onclick="go(${i})">${i+1}</button>`).join("")}
function normalize(v){return String(v??"").replaceAll(",","").replace(/rs\.?/gi,"").replace(/%$/,"").replace(/\s+/g," ").trim().toLowerCase()}
function save(){if(submitted)return;const radio=host.querySelector('input[name="answer"]:checked'),typed=host.querySelector('input.typed-answer');if(radio)responses[current]=radio.value;else if(typed)responses[current]=typed.value.trim()||null}
function render(){const x=questions[current],commonText=passages[x.group]?`<div class="common-info">${passages[x.group]}</div>`:"",control=x.type==="text"?`<input class="typed-answer" name="answer" autocomplete="off" value="${responses[current]??""}" placeholder="Type your answer" ${submitted?"disabled":""}>`:`<div class="options">${x.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${labels[i]}" ${responses[current]===labels[i]?"checked":""} ${submitted?"disabled":""}><span>(${labels[i]}) ${o}</span></label>`).join("")}</div>`;host.innerHTML=`<section class="common-panel"><div class="block">${commonText}${charts[x.group]}<div id="solution" class="solution"><h3>Detailed Solution</h3>${x.solution}</div></div></section><section class="question-panel"><div class="qhead"><div><div class="qnum">Question ${current+1} of ${questions.length}</div><div class="source">${TITLE} | Source Q${current+1}</div></div></div><div class="question-body"><div class="qtext">${x.q}</div>${control}<div id="note" class="answer-note"></div></div><div class="navrow"><button class="mark-btn" onclick="markNext()">Mark for Review & Next</button><button class="clear-btn" onclick="clearResponse()" ${submitted?"disabled":""}>Clear Response</button><button class="previous-btn" onclick="go(${current-1})">Previous</button><button class="primary save-btn" onclick="next()">Save & Next</button></div></section>`;host.querySelectorAll('input[name="answer"]').forEach(el=>{el.addEventListener("change",()=>{responses[current]=el.value;renderBar()});el.addEventListener("input",()=>{responses[current]=el.value.trim()||null;renderBar()})});if(submitted)review();renderBar()}
function go(i){save();if(i<0||i>=questions.length)return;current=i;render();document.querySelector(".question-card").scrollTop=0}
function next(){save();go(Math.min(current+1,questions.length-1))}
function markNext(){save();marked[current]=true;go(Math.min(current+1,questions.length-1))}
function clearResponse(){if(submitted)return;responses[current]=null;render()}
function isCorrect(x,response){return x.type==="text"?normalize(response)===normalize(x.answer):response===x.answer}
function answerText(x){return x.type==="text"?x.answer:`(${x.answer})`}
function review(){const x=questions[current],note=document.getElementById("note");document.getElementById("solution").style.display="block";if(responses[current]===null){note.className="answer-note muted";note.textContent=`Unattempted. Correct answer: ${answerText(x)}`}else if(isCorrect(x,responses[current])){note.className="answer-note ok";note.textContent="Correct."}else{note.className="answer-note bad";note.textContent=`Wrong. Correct answer: ${answerText(x)}`}}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm("Submit this test now? You will not be able to change responses afterward."))return;submitted=true;clearInterval(timerId);let c=0,w=0,u=0;questions.forEach((x,i)=>{if(responses[i]===null)u++;else if(isCorrect(x,responses[i]))c++;else w++});const score=c*3-w;result.style.display="block";result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>${score}</strong></div><div class="score-box">Correct<strong>${c}</strong></div><div class="score-box">Wrong<strong>${w}</strong></div><div class="score-box">Attempted<strong>${c+w}</strong></div><div class="score-box">Unattempted<strong>${u}</strong></div></div>`;render();result.scrollIntoView({behavior:"smooth"})}
function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById("time").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(secondsLeft<=0){submitTest(true);return}secondsLeft--}
function calcEval(expr){if(!/^[0-9+\-*/().%\s]+$/.test(expr))return "Error";return Function("return ("+expr.replace(/%/g,"/100")+")")()}
function updateCalcSub(){document.getElementById("calcSubDisplay").textContent=document.getElementById("calcDisplay").value||"0"}
const calcPopup=document.getElementById("calcPopup"),calcHandle=document.getElementById("calcDragHandle"),calcClose=document.getElementById("calcClose");
function closeCalculator(e){if(e){e.preventDefault();e.stopPropagation()}dragCalc=false;calcPopup.classList.remove("open");calcPopup.hidden=true;calcPopup.setAttribute("aria-hidden","true")}
document.getElementById("calcToggle").onclick=()=>{if(calcPopup.classList.contains("open")){closeCalculator();return}calcPopup.hidden=false;calcPopup.setAttribute("aria-hidden","false");calcPopup.classList.add("open");if(!calcPopup.dataset.moved){calcPopup.style.left="52%";calcPopup.style.top="120px"}};
calcClose.addEventListener("pointerdown",closeCalculator);
calcClose.addEventListener("click",closeCalculator);
calcPopup.addEventListener("click",e=>{if(e.target.closest("#calcClose"))closeCalculator(e)},true);
document.querySelectorAll("[data-calc]").forEach(btn=>btn.onclick=()=>{const d=document.getElementById("calcDisplay"),v=btn.dataset.calc;if(["MC","MR","MS","M+","M-"].includes(v))return;if(v==="C")d.value="";else if(v==="B")d.value=d.value.slice(0,-1);else if(v==="+/-")d.value=d.value.startsWith("-")?d.value.slice(1):"-"+d.value;else if(v==="sqrt"){try{d.value=Math.sqrt(Number(calcEval(d.value||"0")))}catch{d.value="Error"}}else if(v==="1/x"){try{d.value=1/Number(calcEval(d.value||"0"))}catch{d.value="Error"}}else if(v==="="){try{d.value=calcEval(d.value)}catch{d.value="Error"}}else d.value+=v;updateCalcSub()});
let dragCalc=false,calcDx=0,calcDy=0;
calcHandle.onpointerdown=e=>{if(e.target.closest("#calcClose"))return;dragCalc=true;const r=calcPopup.getBoundingClientRect();calcDx=e.clientX-r.left;calcDy=e.clientY-r.top;calcPopup.style.left=r.left+"px";calcPopup.style.top=r.top+"px";calcPopup.style.right="auto";calcPopup.dataset.moved="1";e.preventDefault()};
document.addEventListener("pointermove",e=>{if(!dragCalc)return;const maxX=innerWidth-calcPopup.offsetWidth-4,maxY=innerHeight-calcPopup.offsetHeight-4;calcPopup.style.left=Math.max(4,Math.min(maxX,e.clientX-calcDx))+"px";calcPopup.style.top=Math.max(4,Math.min(maxY,e.clientY-calcDy))+"px"});
document.addEventListener("pointerup",()=>{dragCalc=false});
document.addEventListener("pointercancel",()=>{dragCalc=false});
render();tick();timerId=setInterval(tick,1000);
</script></body></html>
