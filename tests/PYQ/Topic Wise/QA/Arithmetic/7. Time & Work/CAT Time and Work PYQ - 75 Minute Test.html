    header{height:84px;background:#f3f5f7;border-bottom:1px solid #9eadb9;box-shadow:none}.topbar{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 62px 300px;align-items:stretch;padding:0}.title{background:var(--brand-dark);color:#fff;padding:10px 18px;display:flex;flex-direction:column;justify-content:center}.title h1{font-size:22px;line-height:1.1;margin:0;color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:15px;color:#dce9ef;margin-top:6px}.timer{align-self:stretch;display:grid;place-items:center;text-align:center;background:#fff;color:#111;border-left:1px solid #9eadb9;font-weight:700;font-size:18px}.timer span{font-size:22px;color:#111}

    .question-card{height:100%;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 0 88px;background:#fff;scroll-behavior:smooth;overscroll-behavior:contain}.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;min-height:52px;margin:0;padding:10px 16px;border-bottom:1px solid #c6d0d8;background:#f5f7f9}.qnum{font-size:19px;font-weight:700}.source{display:block;font-size:13px;color:var(--muted);margin-top:2px}.block{border:0;border-bottom:1px solid #d7dde5;border-radius:0;padding:12px 18px;background:#fff;margin:0;font-size:18px}.qtext{font-size:20px;font-weight:700;margin:0;padding:22px 24px 14px;min-height:120px;white-space:pre-wrap}.qtext p,.block p,.option p{margin:0 0 10px}.options{display:grid;gap:14px;padding:0 24px 14px}.option{border:0;border-radius:0;padding:4px 0;display:flex;gap:12px;cursor:pointer;background:#fff;align-items:flex-start;font-size:20px;font-weight:700}.option:hover .opt-text{text-decoration:underline}.option input{margin-top:7px;flex:0 0 auto;transform:scale(1.25)}.option .opt-label,.option .opt-text{font-weight:700}.option .opt-text{display:inline-block;color:#202a32}.typed-answer{width:min(420px,calc(100% - 48px));font-size:20px;font-weight:700;border:1px solid #8795a1;border-radius:2px;padding:12px;background:#fff;margin-left:24px}.navrow{position:fixed;left:0;right:300px;bottom:0;height:64px;display:flex;gap:10px;align-items:center;justify-content:flex-end;margin:0;padding:10px 16px;background:#eef8fc;border-top:1px solid #b6cbd6}.navrow button,.submit{border:1px solid #b6c1ca;border-radius:2px;padding:11px 18px;font-size:16px;font-weight:700;cursor:pointer;background:#fff;color:#2f3b44}.submit{background:#29a8df!important;color:#fff!important;border-color:#198fc0!important}.mark{background:#fff!important;color:#2f3b44!important}.solution{display:none;margin:16px 24px 28px;padding:16px 18px 24px;border:1px solid var(--line);border-radius:4px;background:#fbfcfd;font-size:17px;line-height:1.6;white-space:normal;overflow:visible}.solution h3{margin:0 0 8px;color:var(--brand);font-size:18px}.answer-note{margin:14px 24px 0;font-weight:800;font-size:17px}.ok{color:#157347}.bad{color:#b02a37}.muted{color:var(--muted)}#result{display:none;padding:16px;margin:0;border-bottom:1px solid var(--line)}.score-grid{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px}.score-box{border:1px solid var(--line);border-radius:2px;padding:10px;background:#fbfcfd;font-size:16px}.score-box strong{display:block;font-size:24px;margin-top:2px}
    .calc{padding:9px;background:#eee}.calc-title{display:flex;align-items:center;justify-content:space-between;background:#4a8fd0;color:#fff;font-size:17px;font-weight:700;margin:-9px -9px 9px;padding:8px 9px;cursor:grab;user-select:none;touch-action:none}.calc-title:active{cursor:grabbing}.calc-title-actions{display:flex;align-items:center;gap:8px}.calc-min{line-height:1;font-size:23px;font-weight:800}.calc-close{width:27px;height:27px;border:0;background:#4a8fd0;color:#fff;border-radius:2px;cursor:pointer;font-weight:800;font-size:26px;line-height:24px}.calc-toggle{align-self:center;justify-self:center;width:34px;height:34px;border:1px solid #d89c29;background:#f9c35b;color:#774d00;border-radius:2px;cursor:pointer;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0}.calc-toggle svg{width:18px;height:18px;display:block;flex:0 0 auto}.calc-display{width:100%;height:39px;border:1px solid #b6b6b6;border-radius:1px;padding:6px;text-align:right;font-size:20px;margin-bottom:8px;background:#fff}.calc-subdisplay{height:27px;background:#fff;border:1px solid #d0d0d0;border-top:0;text-align:right;padding:2px 8px;font-size:18px;color:#666;margin:-8px 0 8px}.calc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.calc-grid button{height:33px;border:1px solid #bababa;border-radius:4px;background:linear-gradient(#fff,#e7e7e7);font-weight:700;cursor:pointer;font-size:15px;color:#555;padding:0}.calc-grid button.op{background:#e9edf2;color:#555}.calc-grid button.red{background:#e35d4f;color:#fff;border-color:#c94a3d}.calc-grid button.eq{grid-row:span 2;height:71px;background:#21c987;color:#fff;border-color:#19a66f}.calc-help{display:none}
    @media(max-width:980px){html,body{overflow:auto}header{height:auto}.topbar{grid-template-columns:1fr 62px 1fr}.title h1{white-space:normal}main{height:auto;display:grid;grid-template-columns:1fr;grid-template-rows:auto}.panel,main>section,main>aside:first-child{grid-column:1;grid-row:auto;position:static}.calc-wrap{top:90px;left:12px;right:auto}.qbar{grid-template-columns:repeat(8,1fr)}.question-card{height:auto;min-height:70vh;padding-bottom:16px}.navrow{position:static;right:auto}.score-grid{grid-template-columns:1fr 1fr}}

    .mixed-number{display:inline-flex;align-items:center;gap:.18em;white-space:nowrap}.math-frac{display:inline-grid;grid-template-rows:auto auto;min-width:1.35em;margin:0 .1em;vertical-align:middle;text-align:center;font-size:.82em;line-height:1}.math-frac .frac-num{padding:0 .12em .08em;border-bottom:1.5px solid currentColor}.math-frac .frac-den{padding:.08em .12em 0}.option .math-frac{font-size:.78em}.formula-box .math-frac,.final-answer .math-frac{font-size:.86em}

  <header><div class="topbar"><div class="title"><h1>CAT Time &amp; Work PYQ - 75 Minute Test</h1><div class="meta">Quantitative Aptitude | 34 Questions | 75 Minutes | +3 correct, -1 wrong</div></div><button type="button" class="calc-toggle" id="calcToggle" title="Open calculator" aria-label="Open calculator"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2" fill="#fff4cf" stroke="#8f6500" stroke-width="1.7"/><rect x="8" y="5" width="8" height="3" rx=".6" fill="#8f6500"/><circle cx="8.5" cy="12" r="1.2" fill="#8f6500"/><circle cx="12" cy="12" r="1.2" fill="#8f6500"/><circle cx="15.5" cy="12" r="1.2" fill="#8f6500"/><circle cx="8.5" cy="16" r="1.2" fill="#8f6500"/><circle cx="12" cy="16" r="1.2" fill="#8f6500"/><circle cx="15.5" cy="16" r="1.2" fill="#8f6500"/></svg></button><div class="timer">Time Left: <span id="time">75:00</span></div></div></header>

  <script>
    const questions = [{"q": "Teams A, B, and C consist of five, eight, and ten members, respectively, such that every member within a team is equally productive. Working separately, teams A, B, and C can complete a certain job in 40 hours, 50 hours, and 4 hours, respectively. Two members from team A, three members from team B, and one member from team C together start the job, and the member from team C leaves after 23 hours. The number of additional member(s) from team B, that would be required to replace the member from team C, to finish the job in the next one hour, is", "type": "mcq", "source": "CAT 2025 Slot 3 | AfterGrad Q1", "options": ["3", "1", "2", "4"], "answer": 2, "solution": "<p class='solution-step'>The productivity of one member of A, B and C is respectively 1/200, 1/400 and 1/40 of the job per hour.</p><div class='formula-box'>Initial hourly work = 2/200 + 3/400 + 1/40 = 17/400<br>Work done in 23 hours = 391/400<br>Work left = 9/400</div><p class='solution-step'>The two A-members and three B-members already provide 7/400 in the next hour. The missing 2/400 requires two more B-members.</p><div class='final-answer'>Final Answer: 2 additional members — Option C</div>"}, {"q": "The rate of water flow through three pipes A, B and C are in the ratio 4 : 9 : 36. An empty tank can be filled up completely by pipe A in 15 hours. If all the three pipes are used simultaneously to fill up this empty tank, the time, in minutes, required to fill up the entire tank completely is nearest to", "type": "mcq", "source": "CAT 2025 Slot 3 | AfterGrad Q2", "options": ["78", "76", "73", "71"], "answer": 2, "solution": "<p class='solution-step'>Pipe A's rate is 1/15 tank per hour. Since the three rates are in the ratio 4:9:36, their combined rate is 49/4 times A's rate.</p><div class='formula-box'>Combined rate = (49/4)(1/15) = 49/60 tank/hour<br>Time = 60/49 hour = 3600/49 minutes ≈ 73.47 minutes</div><div class='final-answer'>Final Answer: 73 minutes — Option C</div>"}, {"q": "Ankita is twice as efficient as Bipin, while Bipin is twice as efficient as Chandan. All three of them start together on a job, and Bipin leaves the job after 20 days. If the job got completed in 60 days, the number of days needed by Chandan to complete the job alone, is", "type": "text", "source": "CAT 2025 Slot 2 | AfterGrad Q3", "answer": "340", "accepted": ["340"], "solution": "<p class='solution-step'>Take Chandan's efficiency as 1 unit/day. Then Bipin and Ankita have efficiencies 2 and 4.</p><div class='formula-box'>First 20 days: (4 + 2 + 1) × 20 = 140 units<br>Next 40 days: (4 + 1) × 40 = 200 units<br>Total work = 340 units</div><p class='solution-step'>Chandan alone completes 1 unit per day.</p><div class='final-answer'>Final Answer: 340 days</div>"}, {"q": "Arun, Varun and Tarun, if working alone, can complete a task in 24, 21, and 15 days, respectively. They charge Rs 2160, Rs 2400, and Rs 2160 per day, respectively, even if they are employed for a partial day. On any given day, any of the workers may or may not be employed to work. If the task needs to be completed in 10 days or less, then the minimum possible amount, in rupees, required to be paid for the entire task is", "type": "mcq", "source": "CAT 2025 Slot 1 | AfterGrad Q4", "options": ["38400", "38880", "34400", "47040"], "answer": 0, "solution": "<p class='solution-step'>The full-job costs are ₹51,840 for Arun, ₹50,400 for Varun and ₹32,400 for Tarun. Therefore use Tarun for all 10 available days, then use the next-cheapest worker, Varun, for the shortfall.</p><div class='formula-box'>Tarun's work in 10 days = 10/15 = 2/3<br>Remaining work = 1/3 = 7/21, requiring Varun for 7 days<br>Cost = 10 × ₹2,160 + 7 × ₹2,400 = ₹38,400</div><div class='final-answer'>Final Answer: ₹38,400 — Option A</div>"}, {"q": "Sam can complete a job in 20 days when working alone. Mohit is twice as fast as Sam and thrice as fast as Ayna is the same job. The undertake a job with an arrangement where Sam and Mohit work together on the first day, Sam and Ayna on the second day, Mohit and Ayna on the third day, and this three-day pattern is repeated till the work gets completed. Then, the fraction of total work done by Sam is", "type": "mcq", "source": "CAT 2024 Slot 3 | AfterGrad Q5", "options": ["<span class=\"math\"><span class=\"math-frac\"><span class=\"frac-num\">3</span><span class=\"frac-den\">20</span></span></span>", "<span class=\"math\"><span class=\"math-frac\"><span class=\"frac-num\">3</span><span class=\"frac-den\">10</span></span></span>", "<span class=\"math\"><span class=\"math-frac\"><span class=\"frac-num\">1</span><span class=\"frac-den\">5</span></span></span>", "<span class=\"math\"><span class=\"math-frac\"><span class=\"frac-num\">1</span><span class=\"frac-den\">20</span></span></span>"], "answer": 1, "solution": "<p class='solution-step'>Sam, Mohit and Ayna work at rates 1/20, 1/10 and 1/30 per day. A three-day roster completes 11/30 of the job.</p><div class='formula-box'>After two rosters: 11/15<br>After Day 7: 11/15 + 3/20 = 53/60<br>After Day 8: 53/60 + 1/12 = 58/60</div><p class='solution-step'>The job finishes during Day 9, when Sam is not working. Sam worked on six earlier days, contributing 6 × 1/20.</p><div class='final-answer'>Final Answer: 3/10 — Option B</div>"}, {"q": "Amal and Vimal together can complete a task in 150 days, while Vimal and Sunil together can complete the same task in 100 days. Amal starts working on the task and works for 75 days, then Vimal takes over and works for 135 days. Finally, Sunil takes over and completes the remaining task in 45 days. If Amal had started the task alone and worked on all days, Vimal had worked on every second day, and Sunil had worked on every third day, then the number of days required to complete the task would have been", "type": "text", "source": "CAT 2024 Slot 2 | AfterGrad Q6", "answer": "139", "accepted": ["139"], "solution": "<p class='solution-step'>Let the daily rates be a, v and s for Amal, Vimal and Sunil.</p><div class='formula-box'>a + v = 1/150, v + s = 1/100<br>75a + 135v + 45s = 1</div><p class='solution-step'>Substitution gives v = 1/300, a = 1/300 and s = 1/150. In 138 days the scheduled work is 138/300 + 69/300 + 46/150 = 299/300. Amal's work on Day 139 completes it.</p><div class='final-answer'>Final Answer: 139 days</div>"}, {"q": "Renu would take 15 days working 4 hours per day to complete a certain task whereas Seema would take 8 days working 5 hours per day to complete the same task. They decide to work together to complete this task. Seema agrees to work for double the number of hours per day as Renu, while Renu agrees to work for double the number of days as Seema. If Renu works 2 hours per day, then the number of days Seema will work, is", "type": "text", "source": "CAT 2024 Slot 1 | AfterGrad Q7", "answer": "6", "accepted": ["6"], "solution": "<p class='solution-step'>Renu needs 60 working-hours and Seema needs 40 working-hours. If Seema works for d days, Renu works for 2d days. Their daily hours are 4 and 2 respectively.</p><div class='formula-box'>Seema's work = 4d/40 = d/10<br>Renu's work = (2d × 2)/60 = d/15<br>d/10 + d/15 = 1 ⇒ d = 6</div><div class='final-answer'>Final Answer: 6 days</div>"}, {"q": "Rahul, Rakshita and Gurmeet, working together, would have taken more than <span class=\"math\">7</span> days to finish a job. On the other hand, Rahul and Gurmeet, working together would have taken less than <span class=\"math\">15</span> days to finish the job. However, they all worked together for <span class=\"math\">6</span> days, followed by Rakshita, who worked alone for <span class=\"math\">3</span> more days to finish the job. If Rakshita had worked alone on the job then the number of days she would have taken to finish the job, cannot be", "type": "mcq", "source": "CAT 2023 Slot 3 | AfterGrad Q8", "options": ["<span class=\"math\">17</span>", "<span class=\"math\">16</span>", "<span class=\"math\">21</span>", "<span class=\"math\">20</span>"], "answer": 2, "solution": "<p class='solution-step'>Let the combined daily rate of all three be t and Rakshita's rate be k. The actual schedule gives 6t + 3k = 1.</p><div class='formula-box'>All three take more than 7 days: t &lt; 1/7 ⇒ k &gt; 1/21<br>Rahul + Gurmeet take less than 15 days: t − k &gt; 1/15 ⇒ k &lt; 1/15</div><p class='solution-step'>Thus Rakshita's solo time is strictly between 15 and 21 days. Among the choices, 21 is impossible.</p><div class='final-answer'>Final Answer: 21 days — Option C</div>"}, {"q": "Gautam and Suhani, working together, can finish a job in <span class=\"math\">20</span> days. If Gautam does only <span class=\"math\">60 %</span> of his usual work on a day, Suhani must do <span class=\"math\">150 %</span> of her usual work on that day to exactly make up for it. Then, the number of days required by the faster worker to complete the job working alone is", "type": "text", "source": "CAT 2023 Slot 3 | AfterGrad Q9", "answer": "36", "accepted": ["36"], "solution": "<p class='solution-step'>Let Gautam's and Suhani's normal rates be g and s. The compensation condition is 0.6g + 1.5s = g + s.</p><div class='formula-box'>0.5s = 0.4g ⇒ s = 0.8g<br>g + s = 1/20 ⇒ 1.8g = 1/20 ⇒ g = 1/36</div><p class='solution-step'>Gautam is faster and takes 36 days alone.</p><div class='final-answer'>Final Answer: 36 days</div>"}, {"q": "Pipes <span class=\"math\">A</span> and <span class=\"math\">C</span> are fill pipes while Pipe <span class=\"math\">B</span> is a drain pipe of a tank. Pipe <span class=\"math\">B</span> empties the full tank in one hour less than the time taken by Pipe <span class=\"math\">A</span> to fill the empty tank. When pipes <span class=\"math\">A</span>, <span class=\"math\">B</span> and <span class=\"math\">C</span> are turned on together, the empty tank is filled in two hours. If pipes <span class=\"math\">B</span> and <span class=\"math\">C</span> are turned on together when the tank is empty and Pipe <span class=\"math\">B</span> is turned off after one hour, then Pipe <span class=\"math\">C</span> takes another one hour and <span class=\"math\">15</span> minutes to fill the remaining tank. If Pipe <span class=\"math\">A</span> can fill the empty tank in less than five hours, then the time taken, in minutes, by Pipe <span class=\"math\">C</span> to fill the empty tank is", "type": "mcq", "source": "CAT 2023 Slot 2 | AfterGrad Q10", "options": ["<span class=\"math\">60</span>", "<span class=\"math\">75</span>", "<span class=\"math\">120</span>", "<span class=\"math\">90</span>"], "answer": 3, "solution": "<p class='solution-step'>Let A take a hours, B take a−1 hours to drain, and let C's rate be c.</p><div class='formula-box'>1/a − 1/(a−1) + c = 1/2<br>c − 1/(a−1) + 1.25c = 1</div><p class='solution-step'>Using a &lt; 5, these equations give a = 3 and c = 2/3 tank/hour. Hence C alone needs 3/2 hours.</p><div class='final-answer'>Final Answer: 90 minutes — Option D</div>"}, {"q": "The amount of job that Amal, Sunil and Kamal can individually do in a day, are in harmonic progression. Kamal takes twice as much time as Amal to do the same amount of job. If Amal and Sunil work for <span class=\"math\">4</span> days and <span class=\"math\">9</span> days, respectively, Kamal needs to work for <span class=\"math\">16</span> days to finish the remaining job. Then the number of days Sunil will take to finish the job working alone, is", "type": "text", "source": "CAT 2023 Slot 1 | AfterGrad Q11", "answer": "27", "accepted": ["27"], "solution": "<p class='solution-step'>Let Amal's rate be a. Kamal takes twice as long, so his rate is a/2. Since the three daily work amounts are in harmonic progression, Sunil's rate is 2a/3.</p><div class='formula-box'>4a + 9(2a/3) + 16(a/2) = 1<br>18a = 1, so Sunil's rate = 1/27</div><div class='final-answer'>Final Answer: 27 days</div>"}, {"q": "A group of <span class=\"math\">N</span> people worked on a project. They finished <span class=\"math\">35 %</span> of the project by working <span class=\"math\">7</span> hours a day for <span class=\"math\">10</span> days. Thereafter, <span class=\"math\">10</span> people left the group and the remaining people finished the rest of the project in <span class=\"math\">14</span> days by working <span class=\"math\">10</span> hours a day. Then the value of <span class=\"math\">N</span> is", "type": "mcq", "source": "CAT 2022 Slot 3 | AfterGrad Q12", "options": ["<span class=\"math\">140</span>", "<span class=\"math\">36</span>", "<span class=\"math\">23</span>", "<span class=\"math\">150</span>"], "answer": 0, "solution": "<p class='solution-step'>For identical workers, completed work is proportional to people × hours × days.</p><div class='formula-box'>35% ∝ N × 7 × 10<br>65% ∝ (N−10) × 10 × 14<br>[(N−10)140]/[N70] = 65/35</div><p class='solution-step'>Solving 2(N−10)/N = 13/7 gives N = 140.</p><div class='final-answer'>Final Answer: 140 — Option A</div>"}, {"q": "Bob can finish a job in <span class=\"math\">40</span> days, if he works alone. Alex is twice as fast as Bob and thrice as fast as Cole in the same job. Suppose Alex and Bob work together on the first day, Bob and Cole work together on the second day, Cole and Alex work together on the third day, and then, they continue the work by repeating this three- day roster, with Alex and Bob working together on the fourth day, and so on. Then, the total number of days Alex would have worked when the job gets finished, is", "type": "text", "source": "CAT 2022 Slot 3 | AfterGrad Q13", "answer": "11", "accepted": ["11"], "solution": "<p class='solution-step'>Take Alex, Bob and Cole's rates as 6, 3 and 2 units/day. Because Bob alone needs 40 days, the job contains 120 units.</p><div class='formula-box'>Each 3-day roster completes (6+3)+(3+2)+(2+6) = 22 units<br>Five rosters complete 110 units in 15 days<br>Day 16 adds 9 units; the job ends on Day 17</div><p class='solution-step'>Alex works twice per roster, and also on Day 16: 10 + 1 = 11 days.</p><div class='final-answer'>Final Answer: 11 days</div>"}, {"q": "Working alone, the times taken by Anu, Tanu and Manu to complete any job are in the ratio <span class=\"math\">5: 8: 10</span>. They accept a job which they can finish in <span class=\"math\">4</span> days if they all work together for <span class=\"math\">8</span> hours per day. However, Anu and Tanu work together for the first <span class=\"math\">6</span> days, working <span class=\"math\">6</span> hours <span class=\"math\">40</span> minutes per day. Then, the number of hours that Manu will take to complete the remaining job working alone is", "type": "text", "source": "CAT 2022 Slot 2 | AfterGrad Q14", "answer": "6", "accepted": ["6"], "solution": "<p class='solution-step'>Times 5:8:10 imply hourly efficiencies 8:5:4. Total work equals the work of all three for four 8-hour days.</p><div class='formula-box'>Total work = (8+5+4) × 32 = 544 units<br>Anu and Tanu: (8+5) × (6×6⅔) = 13×40 = 520 units<br>Remaining = 24 units</div><p class='solution-step'>Manu works at 4 units/hour, so needs 24/4 hours.</p><div class='final-answer'>Final Answer: 6 hours</div>"}, {"q": "Anil can paint a house in <span class=\"math\">12</span> days while Barun can paint it in <span class=\"math\">16</span> days. Anil, Barun, and Chandu undertake to paint the house for ₹ <span class=\"math\">24000</span> and the three of them together complete the painting in <span class=\"math\">6</span> days. If Chandu is paid in proportion to the work done by him, then the amount in INR received by him is", "type": "text", "source": "CAT 2021 Slot 3 | AfterGrad Q15", "answer": "3000", "accepted": ["3000"], "solution": "<p class='solution-step'>The combined rate is 1/6 house per day. Anil and Barun together paint 1/12 + 1/16 = 7/48 per day.</p><div class='formula-box'>Chandu's rate = 1/6 − 7/48 = 1/48<br>Chandu's share of work in 6 days = 6/48 = 1/8<br>Payment = ₹24,000 × 1/8 = ₹3,000</div><div class='final-answer'>Final Answer: ₹3,000</div>"}, {"q": "One day, Rahul started a work at <span class=\"math\">9</span> AM and Gautam joined him two hours later. They then worked together and completed the work at <span class=\"math\">5</span> PM the same day. If both had started at <span class=\"math\">9</span> AM and worked together, the work would have been completed <span class=\"math\">30</span> minutes earlier. Working alone, the time Rahul would have taken, in hours, to complete the work is", "type": "mcq", "source": "CAT 2021 Slot 3 | AfterGrad Q16", "options": ["<span class=\"math\">12</span>", "<span class=\"math\">10</span>", "<span class=\"math\">11.5</span>", "<span class=\"math\">12.5</span>"], "answer": 1, "solution": "<p class='solution-step'>Rahul works 8 hours and Gautam 6 hours in the actual schedule, so 8r + 6g = 1. If both start together, they finish in 7.5 hours.</p><div class='formula-box'>7.5(r+g) = 1<br>6(r+g) = 0.8<br>Subtracting from 8r+6g=1 gives 2r=0.2 ⇒ r=0.1</div><div class='final-answer'>Final Answer: Rahul alone takes 10 hours — Option B</div>"}, {"q": "Two pipes <span class=\"math\">A</span> and <span class=\"math\">B</span> are attached to an empty water tank. Pipe <span class=\"math\">A</span> fills the tank while pipe <span class=\"math\">B</span> drains it. If pipe <span class=\"math\">A</span> is opened at <span class=\"math\">2</span> pm and pipe <span class=\"math\">B</span> is opened at <span class=\"math\">3</span> pm , then the tank becomes full at <span class=\"math\">10 pm</span>. Instead, if pipe <span class=\"math\">A</span> is opened at <span class=\"math\">2 pm</span> and pipe <span class=\"math\">B</span> is opened at <span class=\"math\">4 pm</span>, then the tank becomes full at <span class=\"math\">6 pm</span>. If pipe <span class=\"math\">B</span> is not opened at all, then the time, in minutes, taken to fill the tank is", "type": "mcq", "source": "CAT 2021 Slot 2 | AfterGrad Q17", "options": ["<span class=\"math\">264</span>", "<span class=\"math\">144</span>", "<span class=\"math\">140</span>", "<span class=\"math\">120</span>"], "answer": 1, "solution": "<p class='solution-step'>Let A's filling rate be a and B's draining rate be b.</p><div class='formula-box'>8a − 7b = 1<br>4a − 2b = 1</div><p class='solution-step'>Doubling the second equation and comparing gives b = 1/3 and a = 5/12 tank/hour. Therefore A alone takes 12/5 hours.</p><div class='final-answer'>Final Answer: 144 minutes — Option B</div>"}, {"q": "Anil can paint a house in <span class=\"math\">60</span> days while Bimal can paint it in <span class=\"math\">84</span> days. Anil starts painting and after <span class=\"math\">10</span> days, Bimal and Charu join him. Together, they complete the painting in <span class=\"math\">14</span> more days. If they are paid a total of Rs. <span class=\"math\">21000</span> for the job, then the share of Charu, in INR, proportionate to the work done by him, is", "type": "mcq", "source": "CAT 2021 Slot 2 | AfterGrad Q18", "options": ["<span class=\"math\">9100</span>", "<span class=\"math\">9150</span>", "<span class=\"math\">9000</span>", "<span class=\"math\">9200</span>"], "answer": 0, "solution": "<p class='solution-step'>Anil works 24 days in all and Bimal works 14 days.</p><div class='formula-box'>Anil's work = 24/60 = 2/5<br>Bimal's work = 14/84 = 1/6<br>Charu's work = 1 − 2/5 − 1/6 = 13/30<br>Charu's share = ₹21,000 × 13/30 = ₹9,100</div><div class='final-answer'>Final Answer: ₹9,100 — Option A</div>"}, {"q": "Anu, Vinu and Manu can complete a work alone in 15 days, 12 days and 20 days, respectively. Vinu works everyday. Anu works only on alternate days starting from the first day while Manu works only on alternate days starting from the second day. Then, the number of days needed to complete the work is", "type": "mcq", "source": "CAT 2021 Slot 1 | AfterGrad Q19", "options": ["<span class=\"math\">6</span>", "<span class=\"math\">7</span>", "<span class=\"math\">8</span>", "<span class=\"math\">5</span>"], "answer": 1, "solution": "<p class='solution-step'>On odd days Anu and Vinu complete 1/15 + 1/12 = 3/20. On even days Vinu and Manu complete 1/12 + 1/20 = 2/15.</p><div class='formula-box'>One 2-day cycle = 3/20 + 2/15 = 17/60<br>Three cycles (6 days) = 51/60<br>Day 7 adds 3/20 = 9/60</div><div class='final-answer'>Final Answer: 7 days — Option B</div>"}, {"q": "Amar, Akbar and Anthony are working on a project. Working together Amar and Akbar can complete the project in <span class=\"math\">1</span> year, Akbar and Anthony can complete in <span class=\"math\">16</span> months, Anthony and Amar can complete in <span class=\"math\">2</span> years. If the person who is neither the fastest nor the slowest works alone, the time in months he will take to complete the project is", "type": "text", "source": "CAT 2021 Slot 1 | AfterGrad Q20", "answer": "32", "accepted": ["32"], "solution": "<p class='solution-step'>Use months as the unit. Pair rates are A+B=1/12, B+C=1/16 and C+A=1/24.</p><div class='formula-box'>A = [(A+B)+(A+C)−(B+C)]/2 = 1/32<br>B = 5/96, C = 1/96</div><p class='solution-step'>B is fastest, C slowest, so A is the middle worker.</p><div class='final-answer'>Final Answer: 32 months</div>"}, {"q": "A contractor agreed to construct a <span class=\"math\">6</span> km road in <span class=\"math\">200</span> days. He employed <span class=\"math\">140</span> persons for the work. After <span class=\"math\">60</span> days, he realized that only <span class=\"math\">1.5</span> km road has been completed. How many additional people would he need to employ in order to finish the work exactly on time?", "type": "text", "source": "CAT 2020 Slot 3 | AfterGrad Q21", "answer": "40", "accepted": ["40"], "solution": "<p class='solution-step'>The first 1.5 km required 140×60 person-days. At the same productivity, the remaining 4.5 km requires three times as many person-days.</p><div class='formula-box'>Required person-days = 3 × 140 × 60 = 25,200<br>People needed for 140 remaining days = 25,200/140 = 180<br>Additional people = 180−140 = 40</div><div class='final-answer'>Final Answer: 40 people</div>"}, {"q": "John takes twice as much time as Jack to finish a job. Jack and Jim together take one-thirds of the time to finish the job than John takes working alone. Moreover, in order to finish the job, John takes three days more than that taken by three of them working together. In how many days will Jim finish the job working alone?", "type": "text", "source": "CAT 2020 Slot 2 | AfterGrad Q22", "answer": "4", "accepted": ["4"], "solution": "<p class='solution-step'>Let Jack take x days; John takes 2x. Jack and Jim together take 2x/3 days, so their combined rate is 3/(2x). This makes Jim's rate 1/(2x), hence Jim also takes 2x days.</p><div class='formula-box'>Rate of all three = 1/(2x)+1/x+1/(2x)=2/x<br>Their time = x/2<br>2x − x/2 = 3 ⇒ x=2</div><div class='final-answer'>Final Answer: Jim takes 4 days</div>"}, {"q": "Anil alone can do a job in <span class=\"math\">20</span> days while Sunil alone can do it in <span class=\"math\">40</span> days. Anil starts the job, and after <span class=\"math\">3</span> days, Sunil joins him. Again, after a few more days, Bimal joins them and they together finish the job. If Bimal has done <span class=\"math\">10%</span> of the job, then in how many days was the job done?", "type": "mcq", "source": "CAT 2019 Slot 2 | AfterGrad Q23", "options": ["<span class=\"math\">15</span>", "<span class=\"math\">12</span>", "<span class=\"math\">13</span>", "<span class=\"math\">14</span>"], "answer": 2, "solution": "<p class='solution-step'>Anil completes 3/20 in the first three days. Bimal completes 1/10 overall, leaving 3/4 to be completed by Anil and Sunil after Sunil joins.</p><div class='formula-box'>Anil + Sunil rate = 1/20 + 1/40 = 3/40<br>Time after Sunil joins = (3/4)/(3/40) = 10 days<br>Total time = 3+10 = 13 days</div><div class='final-answer'>Final Answer: 13 days — Option C</div>"}, {"q": "Three men and eight machines can finish a job in half the time taken by three machines and eight men to finish the same job. If two machines can finish the job in <span class=\"math\">13</span> days, then how many men can finish the job in <span class=\"math\">13</span> days?", "type": "text", "source": "CAT 2019 Slot 1 | AfterGrad Q24", "answer": "13", "accepted": ["13"], "solution": "<p class='solution-step'>Let one man's rate be H and one machine's rate be M. Finishing in half the time means twice the rate.</p><div class='formula-box'>3H+8M = 2(3M+8H)<br>2M = 13H</div><p class='solution-step'>Two machines finish in 13 days, so total work is 26M = 169H. Therefore 13 men finish it in 13 days.</p><div class='final-answer'>Final Answer: 13 men</div>"}, {"q": "At their usual efficiency levels, <span class=\"math\">A</span> and <span class=\"math\">B</span> together finish a task in <span class=\"math\">12</span> days. If <span class=\"math\">A</span> had worked half as efficiently as she usually does, and <span class=\"math\">B</span> had worked thrice as efficiently as he usually does, the task would have been completed in <span class=\"math\">9</span> days. How many days would <span class=\"math\">A</span> take to finish the task if she works alone at her usual efficiency?", "type": "mcq", "source": "CAT 2019 Slot 1 | AfterGrad Q25", "options": ["<span class=\"math\">24</span>", "<span class=\"math\">12</span>", "<span class=\"math\">18</span>", "<span class=\"math\">36</span>"], "answer": 2, "solution": "<p class='solution-step'>Let A and B's normal rates be a and b.</p><div class='formula-box'>a+b = 1/12<br>a/2 + 3b = 1/9</div><p class='solution-step'>Subtracting half the first equation from the second gives b=1/36, so a=1/12−1/36=1/18.</p><div class='final-answer'>Final Answer: A alone takes 18 days — Option C</div>"}, {"q": "A water tank has inlets of two types <span class=\"math\">A</span> and <span class=\"math\">B</span>. All inlets of type <span class=\"math\">A</span> when open, bring in water at the same rate. All inlets of type <span class=\"math\">B</span>, when open, bring in water at the same rate. The empty tank is completely filled in <span class=\"math\">30</span> minutes if <span class=\"math\">10</span> inlets of type <span class=\"math\">A</span> and <span class=\"math\">45</span> inlets of type <span class=\"math\">B</span> are open, and in <span class=\"math\">1</span> hour if <span class=\"math\">8</span> inlets of type <span class=\"math\">A</span> and <span class=\"math\">18</span> inlets of type <span class=\"math\">B</span> are open. In how many minutes will the empty tank get completely filled if <span class=\"math\">7</span> inlets of type <span class=\"math\">A</span> and <span class=\"math\">27</span> inlets of type <span class=\"math\">B</span> are open?", "type": "text", "source": "CAT 2018 Slot 2 | AfterGrad Q26", "answer": "48", "accepted": ["48"], "solution": "<p class='solution-step'>Let each A-inlet and B-inlet add a and b tanks per minute.</p><div class='formula-box'>10a+45b=1/30<br>8a+18b=1/60</div><p class='solution-step'>Solving gives a=1/1200 and b=1/1800. The requested rate is 7/1200+27/1800=1/48.</p><div class='final-answer'>Final Answer: 48 minutes</div>"}, {"q": "A tank is emptied everyday at a fixed time point. Immediately thereafter, either pump <span class=\"math\">A</span> or pump <span class=\"math\">B</span> or both start working until the tank is full. On Monday, <span class=\"math\">A</span> alone completed filling the tank at <span class=\"math\">8 pm</span>. On Tuesday, B alone completed filling the tank at <span class=\"math\">6 pm</span>. On Wednesday, <span class=\"math\">A</span> alone worked till <span class=\"math\">5 pm</span>, and then B worked alone from <span class=\"math\">5 pm</span> to <span class=\"math\">7 pm</span>, to fill the tank. At what time was the tank filled on Thursday if both pumps were used simultaneously all along?", "type": "mcq", "source": "CAT 2018 Slot 2 | AfterGrad Q27", "options": ["<span class=\"math\">4:36</span> pm", "<span class=\"math\">4:24</span> pm", "<span class=\"math\">4:12</span> pm", "<span class=\"math\">4:48</span> pm"], "answer": 1, "solution": "<p class='solution-step'>All days begin at the same fixed time. Since A finishes at 8 pm and B at 6 pm, A's solo time is two hours longer. Let B's solo time be b; then A's is b+2. On Wednesday A works b−1 hours and B works 2 hours.</p><div class='formula-box'>(b−1)/(b+2) + 2/b = 1 ⇒ b=4</div><p class='solution-step'>The start time is 2 pm. Together their rate is 1/6+1/4=5/12, so they need 12/5=2 hours 24 minutes.</p><div class='final-answer'>Final Answer: 4:24 pm — Option B</div>"}, {"q": "Ramesh and Ganesh can together complete a work in <span class=\"math\">16</span> days. After seven days of working together, Ramesh got sick and his efficiency fell by <span class=\"math\">30 %</span>. As a result, they completed the work in <span class=\"math\">17</span> days instead of <span class=\"math\">16</span> days. If Ganesh had worked alone after Ramesh got sick, in how many days would he have completed the remaining work?", "type": "mcq", "source": "CAT 2018 Slot 2 | AfterGrad Q28", "options": ["<span class=\"math\">13.5</span>", "<span class=\"math\">14.5</span>", "<span class=\"math\">11</span>", "<span class=\"math\">12</span>"], "answer": 0, "solution": "<p class='solution-step'>Let the normal daily rates be r and g. Together r+g=1/16. Seven normal days leave 9/16 of the work. The next ten days use 70% of Ramesh's rate.</p><div class='formula-box'>0.7r+g = (9/16)/10 = 9/160<br>r+g=10/160 ⇒ 0.3r=1/160<br>r=1/48, g=1/24</div><p class='solution-step'>Ganesh alone needs (9/16)/(1/24)=13.5 days.</p><div class='final-answer'>Final Answer: 13.5 days — Option A</div>"}, {"q": "Humans and robots can both perform a job but at different efficiencies. Fifteen humans and five robots working together take thirty days to finish the job, whereas five humans and fifteen robots working together take sixty days to finish it. How many days will fifteen humans working together (without any robot) take to finish it?", "type": "mcq", "source": "CAT 2018 Slot 1 | AfterGrad Q29", "options": ["<span class=\"math\">45</span>", "<span class=\"math\">36</span>", "<span class=\"math\">40</span>", "<span class=\"math\">32</span>"], "answer": 3, "solution": "<p class='solution-step'>Let one human's and one robot's daily rates be h and r.</p><div class='formula-box'>15h+5r=1/30<br>5h+15r=1/60</div><p class='solution-step'>Solving gives h=1/480. Thus 15 humans work at 15/480=1/32 job per day.</p><div class='final-answer'>Final Answer: 32 days — Option D</div>"}, {"q": "A tank is fitted with pipes, some filling it and the rest draining it. All filling pipes fill at the same rate, and all draining pipes drain at the same rate. The empty tank gets completely filled in <span class=\"math\">6</span> hours when <span class=\"math\">6</span> filling and <span class=\"math\">5</span> draining pipes are on, but this time becomes <span class=\"math\">60</span> hours when <span class=\"math\">5</span> filling and <span class=\"math\">6</span> draining pipes are on. In how many hours will the empty tank get completely filled when one draining and two filling pipes are on?", "type": "text", "source": "CAT 2018 Slot 1 | AfterGrad Q30", "answer": "10", "accepted": ["10"], "solution": "<p class='solution-step'>Let one filling pipe have rate f and one draining pipe have rate d.</p><div class='formula-box'>6f−5d=1/6<br>5f−6d=1/60</div><p class='solution-step'>Solving gives f=1/12 and d=1/15. With two filling pipes and one drain, the net rate is 2/12−1/15=1/10.</p><div class='final-answer'>Final Answer: 10 hours</div>"}, {"q": "When they work alone, <span class=\"math\">B</span> needs <span class=\"math\">25 %</span> more time to finish a job than <span class=\"math\">A</span> does. They two finish the job in <span class=\"math\">13</span> days in the following manner: <span class=\"math\">A</span> works alone till half the job is done, then <span class=\"math\">A</span> and <span class=\"math\">B</span> work together for four days, and finally <span class=\"math\">B</span> works alone to complete the remaining <span class=\"math\">5%</span> of the job. In how many days can <span class=\"math\">B</span> alone finish the entire job?", "type": "mcq", "source": "CAT 2018 Slot 1 | AfterGrad Q31", "options": ["<span class=\"math\">16</span>", "<span class=\"math\">20</span>", "<span class=\"math\">18</span>", "<span class=\"math\">22</span>"], "answer": 1, "solution": "<p class='solution-step'>Let A's solo time be T. B needs 25% more time, or 1.25T. A spends T/2 days on the first half, and B spends T/16 days on the final 5%.</p><div class='formula-box'>T/2 + 4 + T/16 = 13<br>9T/16=9 ⇒ T=16<br>B's time=1.25T=20</div><div class='final-answer'>Final Answer: 20 days — Option B</div>"}, {"q": "A tank has an inlet pipe and an outlet pipe. If the outlet pipe is closed then the inlet pipe fills the empty tank in <span class=\"math\">8</span> hours. If the outlet pipe is open then the inlet pipe fills the empty tank in <span class=\"math\">10</span> hours. If only the outlet pipe is open then in how many hours the full tank becomes half-full?", "type": "mcq", "source": "CAT 2017 Slot 2 | AfterGrad Q32", "options": ["<span class=\"math\">20</span>", "<span class=\"math\">30</span>", "<span class=\"math\">40</span>", "<span class=\"math\">45</span>"], "answer": 0, "solution": "<p class='solution-step'>The inlet fills 1/8 tank per hour. With the outlet open, the net rate is 1/10.</p><div class='formula-box'>Outlet rate = 1/8−1/10 = 1/40 tank/hour<br>Time to empty half = (1/2)/(1/40)=20 hours</div><div class='final-answer'>Final Answer: 20 hours — Option A</div>"}, {"q": "Amal can complete a job in <span class=\"math\">10</span> days and Bimal can complete it in <span class=\"math\">8</span> days. Amal, Bimal and Kamal together complete the job in <span class=\"math\">4</span> days and are paid a total amount of Rs <span class=\"math\">1000</span> as remuneration. If this amount is shared by them in proportion to their work, then Kamal's share, in rupees, is", "type": "mcq", "source": "CAT 2017 Slot 2 | AfterGrad Q33", "options": ["<span class=\"math\">100</span>", "<span class=\"math\">200</span>", "<span class=\"math\">300</span>", "<span class=\"math\">400</span>"], "answer": 0, "solution": "<p class='solution-step'>The three-person rate is 1/4 job per day. Amal and Bimal contribute 1/10+1/8=9/40, so Kamal contributes 1/40.</p><div class='formula-box'>Kamal's work in 4 days = 4/40=1/10<br>Kamal's payment = ₹1,000×1/10=₹100</div><div class='final-answer'>Final Answer: ₹100 — Option A</div>"}, {"q": "A person can complete a job in <span class=\"math\">120</span> days. He works alone on Day <span class=\"math\">1</span>. On Day <span class=\"math\">2</span>, he is joined by another person who also can complete the job in exactly <span class=\"math\">120</span> days. On Day <span class=\"math\">3</span>, they are joined by another person of equal efficiency. Like this, everyday a new person with the same efficiency joins the work. How many days are required to complete the job?", "type": "text", "source": "CAT 2017 Slot 1 | AfterGrad Q34", "answer": "15", "accepted": ["15"], "solution": "<p class='solution-step'>On Day n, n equally efficient people work, so the work done that day is n/120. After n days the accumulated work is n(n+1)/240.</p><div class='formula-box'>n(n+1)/240 = 1<br>n(n+1)=240=15×16</div><div class='final-answer'>Final Answer: 15 days</div>"}];
    let current = 0, submitted = false, secondsLeft = 75 * 60;
    const responses = Array(questions.length).fill(null), marked = Array(questions.length).fill(false), labels = ["A","B","C","D"];
    const qbar = document.getElementById("qbar"), host = document.getElementById("questionHost"), resultBox = document.getElementById("result");
    function esc(s){return String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
    function norm(s){return String(s ?? "").trim().toLowerCase().replace(/[,₹ rs.%]/g,"").replace(/\s+/g,"");}
    function hasHtml(s){return /<\/?[a-z][\s\S]*>/i.test(String(s ?? ""));}
    function mathFractions(s){let v=String(s ?? "");v=v.replace(/(\d+)\s*<sup>(\d+)<\/sup>\/<sub>(\d+)<\/sub>/g,'<span class="mixed-number">$1 <span class="math-frac"><span class="frac-num">$2</span><span class="frac-den">$3</span></span></span>');return v.replace(/(^|[^A-Za-z0-9.²>])([A-Za-z0-9.²]+)\/([A-Za-z0-9.²]+)/g,'$1<span class="math-frac"><span class="frac-num">$2</span><span class="frac-den">$3</span></span>');}
    function rich(s){return mathFractions(hasHtml(s) ? String(s) : esc(s));}
    function stripHtml(html){const div=document.createElement("div");div.innerHTML=String(html ?? "");return div.textContent.trim().replace(/\s+/g," ");}
    function qType(q){return q.type || ((q.options && q.options.length) ? "mcq" : "text");}
    function qText(q){return q.question ?? q.q ?? "";}
    function qSource(q){return q.source || q.level || "";}
    function qAnswer(q){return q.typedAnswer ?? q.answer ?? "";}
    function renderBar(){qbar.innerHTML=questions.map((q,i)=>'<button type="button" class="qbtn '+(i===current?'current ':'')+(responses[i]!==null&&responses[i]!==''?'answered ':'')+(marked[i]?'marked ':'')+'" onclick="go('+i+')">'+(i+1)+'</button>').join('');}
    function correctText(q){return qType(q)==="mcq" ? "(" + labels[q.answer] + ") " + stripHtml((q.options || [])[q.answer] || "") : qAnswer(q);}
    function contentBlock(html, cls){return html ? '<div class="'+cls+'">'+rich(html)+'</div>' : '';}
    function control(q,i){if(qType(q)==="mcq") return '<div class="options">'+(q.options||[]).map((op,j)=>'<label class="option"><input type="radio" autocomplete="off" name="answer_'+i+'" value="'+j+'" '+(responses[i]===String(j)?'checked':'')+' '+(submitted?'disabled':'')+'> <span><span class="opt-label">('+labels[j]+')</span> <span class="opt-text">'+rich(op)+'</span></span></label>').join('')+'</div>'; return '<input class="typed-answer" name="answer_'+i+'" autocomplete="off" value="'+esc(responses[i]||'')+'" placeholder="Type your answer" '+(submitted?'disabled':'')+'>';}
    function solutionHtml(q){const sol=q.solution || "Solution not provided.";return rich(sol);}
    function renderQuestion(){const q=questions[current];host.innerHTML='<div class="qhead"><div><div class="qnum">Question '+(current+1)+' of '+questions.length+'</div><div class="source">'+esc(qSource(q))+'</div></div></div>'+contentBlock(q.direction,'block')+contentBlock(q.passage,'block')+'<div class="qtext">'+rich(qText(q))+'</div>'+control(q,current)+'<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Detailed Solution</h3><strong>Answer: '+rich(correctText(q))+'</strong><div class="block">'+solutionHtml(q)+'</div></div><div class="navrow"><button type="button" onclick="markReviewNext()" class="mark">Mark for Review & Next</button><button type="button" onclick="clearResponse()" '+(submitted?'disabled':'')+'>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" onclick="nextQ()" class="submit">Save & Next</button></div>';if(submitted)showReviewForCurrent();bindAnswer();renderBar();}
    function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{if(responses[current]===null&&el.type==='radio')el.checked=false;el.addEventListener('input',()=>{responses[current]=el.type==='radio'?el.value:el.value;renderBar();});el.addEventListener('change',()=>{responses[current]=el.type==='radio'?el.value:el.value;renderBar();});});}
    function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('input.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}
    function go(i){saveCurrent();current=i;renderQuestion();} function prevQ(){if(current>0)go(current-1);} function nextQ(){if(current<questions.length-1)go(current+1);} function toggleMark(){marked[current]=!marked[current];renderQuestion();} function markReviewNext(){marked[current]=true;if(current<questions.length-1)nextQ();else renderQuestion();} function clearResponse(){responses[current]=null;renderQuestion();}
    function isCorrect(q,ans){if(ans===null||ans==='')return null;if(qType(q)==='mcq')return Number(ans)===Number(q.answer);const accepted=(q.accepted&&q.accepted.length?q.accepted:[qAnswer(q)]).map(norm);return accepted.includes(norm(ans));}
    function showReviewForCurrent(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';host.scrollTop=0;if(r===null){note.className='answer-note muted';note.textContent='Unattempted. Correct answer: '+correctText(q);}else if(r){note.className='answer-note ok';note.textContent='Correct.';}else{note.className='answer-note bad';note.textContent='Wrong. Correct answer: '+correctText(q);} }
    function submitTest(auto=false){if(submitted)return;saveCurrent();if(!auto&&!confirm('Submit this test now? You will not be able to change responses afterward.'))return;submitted=true;let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++;});const score=c*3-w;resultBox.style.display='block';resultBox.innerHTML='<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>'+score+'</strong></div><div class="score-box">Correct<strong>'+c+'</strong></div><div class="score-box">Wrong<strong>'+w+'</strong></div><div class="score-box">Attempted<strong>'+(c+w)+'</strong></div><div class="score-box">Unattempted<strong>'+u+'</strong></div></div>';showReviewForCurrent();renderBar();resultBox.scrollIntoView({behavior:'smooth',block:'start'});}
    function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest(true);return;}secondsLeft--;}
    function calcEval(expr){if(!/^[0-9+\-*/().%\s]+$/.test(expr))return 'Error';return Function('return ('+expr.replace(/%/g,'/100')+')')();}
    function updateCalcSub(){document.getElementById('calcSubDisplay').textContent=document.getElementById('calcDisplay').value||'0';}
    document.querySelectorAll('[data-calc]').forEach(btn=>btn.addEventListener('click',()=>{const d=document.getElementById('calcDisplay'),v=btn.dataset.calc;if(['MC','MR','MS','M+','M-'].includes(v))return; if(v==='C')d.value='';else if(v==='B')d.value=d.value.slice(0,-1);else if(v==='+/-'){d.value=d.value.startsWith('-')?d.value.slice(1):('-'+d.value);}else if(v==='sqrt'){try{d.value=Math.sqrt(Number(calcEval(d.value||'0')));}catch(e){d.value='Error';}}else if(v==='1/x'){try{d.value=1/Number(calcEval(d.value||'0'));}catch(e){d.value='Error';}}else if(v==='='){try{d.value=calcEval(d.value);}catch(e){d.value='Error';}}else d.value+=v;updateCalcSub();}));
    const calcPopup=document.getElementById('calcPopup'), calcHandle=document.getElementById('calcDragHandle');
    document.getElementById('calcToggle').addEventListener('click',()=>{calcPopup.classList.toggle('open');if(calcPopup.classList.contains('open')&&!calcPopup.dataset.moved){calcPopup.style.left='52%';calcPopup.style.top='120px';}});
    document.getElementById('calcClose').addEventListener('pointerdown',e=>e.stopPropagation());
    document.getElementById('calcClose').addEventListener('click',e=>{e.stopPropagation();calcPopup.classList.remove('open');});
    let dragCalc=false, calcDx=0, calcDy=0;
    calcHandle.addEventListener('pointerdown',e=>{dragCalc=true;calcHandle.setPointerCapture(e.pointerId);const r=calcPopup.getBoundingClientRect();calcDx=e.clientX-r.left;calcDy=e.clientY-r.top;calcPopup.style.left=r.left+'px';calcPopup.style.top=r.top+'px';calcPopup.style.right='auto';calcPopup.dataset.moved='1';e.preventDefault();});
    calcHandle.addEventListener('pointermove',e=>{if(!dragCalc)return;const maxX=window.innerWidth-calcPopup.offsetWidth-4,maxY=window.innerHeight-calcPopup.offsetHeight-4;calcPopup.style.left=Math.max(4,Math.min(maxX,e.clientX-calcDx))+'px';calcPopup.style.top=Math.max(4,Math.min(maxY,e.clientY-calcDy))+'px';});
    calcHandle.addEventListener('pointerup',e=>{dragCalc=false;try{calcHandle.releasePointerCapture(e.pointerId);}catch(err){}});
    calcHandle.addEventListener('pointercancel',()=>{dragCalc=false;});
    renderQuestion();tick();setInterval(tick,1000);
  </script>
