  <script>
    const questions = [{"q": "Rahul starts on his journey at 5 pm at a constant speed so that he reaches his destination at 11 pm the same day. However, on his way, he stops for 20 minutes, and after that, increases his speed by 3 km per hour to reach on time. If he had stopped for 10 minutes more, he would have had to increase his speed by 5 km per hour to reach on time. His initial speed, in km per hour, was", "type": "mcq", "source": "CAT 2025 Slot 3 | AfterGrad Q1", "options": ["12", "15", "20", "18"], "answer": 1, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let the initial speed be v and let the stop occur t hours after 5 pm. Compare the two on-time journeys with the normal six-hour journey.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>vt+(v+3)(17/3−t)=6v</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>vt+(v+5)(11/2−t)=6v</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>These give v=51−9t and v=55−10t, so t=4 and v=15.</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>15 km/h — Option B</strong>.</li></ol><div class='final-answer'>Final Answer: 15 km/h — Option B</div>"}, {"q": "Ankita walks from A to C through B, and runs back through the same route at a speed that is 40% more than her walking speed. She takes exactly 3 hours 30 minutes to walk from B to C as well as to run from B to A. The total time, in minutes, she would take to walk from A to B and run from B to C, is", "type": "text", "source": "CAT 2025 Slot 3 | AfterGrad Q2", "answer": "444", "accepted": ["444"], "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let walking speed be w; running speed is 1.4w.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>BC=3.5w and AB=3.5(1.4w)=4.9w</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>Walk AB: 4.9 h =294 min</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>Run BC: 3.5/1.4=2.5 h=150 min</div></li><li><strong>Step 5 — Substitute and simplify:</strong><div class='step-calculation'>Total=444 min</div></li><li><strong>Step 6 — Conclude:</strong> The required result is <strong>444 minutes</strong>.</li></ol><div class='final-answer'>Final Answer: 444 minutes</div>"}, {"q": "Rita and Sneha can row a boat at 5 km/h and 6 km/h in still water, respectively. In a river flowing with a constant velocity, Sneha takes 48 minutes more to row 14 km upstream than to row the same distance downstream. If Rita starts from a certain location in the river, and returns downstream to the same location, taking a total of 100 minutes, then the total distance, in km, Rita will cover is", "type": "text", "source": "CAT 2025 Slot 2 | AfterGrad Q3", "answer": "8", "accepted": ["8"], "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let the river speed be c. Sneha’s upstream/downstream difference determines c.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>14/(6−c)−14/(6+c)=0.8 ⇒ c=1 km/h</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>For Rita: x/4+x/6=100/60 ⇒ x=4 km each way</div></li><li><strong>Step 4 — Conclude:</strong> The required result is <strong>8 km</strong>.</li></ol><div class='final-answer'>Final Answer: 8 km</div>"}, {"q": "Shruti travels a distance of 224 km in four parts for a total travel time of 3 hours. Her speeds in these four parts follow an arithmetic progression, and the corresponding time taken to cover these four parts follow another arithmetic progression. If she travels at a speed of 960 meters per minute for 30 minutes to cover the first part, then the distance, in meters, she travels in the fourth part is", "type": "mcq", "source": "CAT 2025 Slot 1 | AfterGrad Q4", "options": ["112000", "76800", "86400", "96000"], "answer": 2, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> The first speed is 57.6 km/h and first time is 0.5 h. Let speed increment be d and time increment be e.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>4(0.5)+6e=3 ⇒ e=1/6 h</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>57.6(3)+d[3+14/6]=224 ⇒ d=9.6</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>Fourth speed=86.4 km/h; fourth time=1 h</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>86,400 metres — Option C</strong>.</li></ol><div class='final-answer'>Final Answer: 86,400 metres — Option C</div>"}, {"q": "A train travelled a certain distance at a uniform speed. Had the speed been <span class=\"math\">6</span> km per hour more, it would have needed <span class=\"math\">4</span> hours less. Had the speed been <span class=\"math\">6</span> km per hour less, it would have needed <span class=\"math\">6</span> hours more. The distance, in km, travelled by the train is", "type": "mcq", "source": "CAT 2024 Slot 3 | AfterGrad Q5", "options": ["800", "720", "780", "640"], "answer": 1, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let normal speed be v and normal time t.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>vt=(v+6)(t−4)=(v−6)(t+6)</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>t=v−6 and 3t=2v+12 ⇒ v=30,t=24</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>Distance=vt=720</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>720 km — Option B</strong>.</li></ol><div class='final-answer'>Final Answer: 720 km — Option B</div>"}, {"q": "A bus starts at 9 am and follows a fixed route every day. One day, it traveled at a constant speed of 60 km per hour and reached its destination 3.5 hours later than its scheduled arrival time. Next day, it traveled two-thirds of its route in one-third of its total scheduled travel time, and the remaining part of the route at 40 km per hour to reach just on time. The scheduled arrival time of the bus is", "type": "mcq", "source": "CAT 2024 Slot 2 | AfterGrad Q6", "options": ["10:30 pm", "7:00 pm", "7:30 pm", "9:00 pm"], "answer": 2, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let scheduled travel time be T hours and route length D.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>D/60=T+3.5</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>T/3+D/120=T ⇒ D=80T</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>80T=60T+210 ⇒ T=10.5 h</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>7:30 pm — Option C</strong>.</li></ol><div class='final-answer'>Final Answer: 7:30 pm — Option C</div>"}, {"q": "Two places A and B are 45 kms apart and connected by a straight road. Anil goes from A to B while Sunil goes from B to A. Starting at the same time, they cross each other in exactly 1 hour 30 minutes. If Anil reaches B exactly 1 hour 15 minutes after Sunil reaches A, the speed of Anil, in km per hour, is", "type": "mcq", "source": "CAT 2024 Slot 1 | AfterGrad Q7", "options": ["14", "12", "16", "18"], "answer": 1, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let Anil and Sunil’s speeds be a and s. They cover 45 km and meet after 1.5 h.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>a+s=30</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>45/a−45/s=1.25</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>Solving with a&lt;s gives a=12</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>12 km/h — Option B</strong>.</li></ol><div class='final-answer'>Final Answer: 12 km/h — Option B</div>"}, {"q": "A boat takes <span class=\"math\">2</span> hours to travel downstream a river from port A to port B , and <span class=\"math\">3</span> hours to return to port A . Another boat takes a total of <span class=\"math\">6</span> hours to travel from port <span class=\"math\">B</span> to port <span class=\"math\">A</span> and return to port <span class=\"math\">B</span>. If the speeds of the boats and the river are constant, then the time, in hours, taken by the slower boat to travel from port <span class=\"math\">A</span> to port <span class=\"math\">B</span> is", "type": "mcq", "source": "CAT 2023 Slot 3 | AfterGrad Q8", "options": ["<span class=\"math\">3(√<span class=\"root\">5</span>-1)</span>", "<span class=\"math\">12(√<span class=\"root\">5</span>-2)</span>", "<span class=\"math\">3(3+√<span class=\"root\">5</span>)</span>", "<span class=\"math\">3(3-√<span class=\"root\">5</span>)</span>"], "answer": 3, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> For the first boat, downstream and upstream rates are D/2 and D/3, so current rate is D/12. Let the slower boat’s still-water rate be yD.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>1/(y−1/12)+1/(y+1/12)=6</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>y=(2+√5)/12</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>A-to-B time=1/(y+1/12)=3(3−√5)</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>3(3−√5) hours — Option D</strong>.</li></ol><div class='final-answer'>Final Answer: 3(3−√5) hours — Option D</div>"}, {"q": "Ravi is driving at a speed of <span class=\"math\">40</span> km/h on a road. Vijay is <span class=\"math\">54</span> meters behind Ravi and driving in the same direction as Ravi. Ashok is driving along the same road from the opposite direction at a speed of <span class=\"math\">50</span> km/h and is <span class=\"math\">225</span> meters away from Ravi. The speed, in km/h, at which Vijay should drive so that all the three cross each other at the same time, is", "type": "mcq", "source": "CAT 2023 Slot 2 | AfterGrad Q9", "options": ["<span class=\"math\">61.6</span>", "<span class=\"math\">64.4</span>", "<span class=\"math\">67.2</span>", "<span class=\"math\">58.8</span>"], "answer": 0, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Ashok and Ravi approach at 90 km/h =25 m/s, so they meet after 225/25=9 seconds.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>In 9 s Ravi covers 100 m.</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>Vijay covers 54+100=154 m.</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>Speed=(154/9)×3.6=61.6 km/h</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>61.6 km/h — Option A</strong>.</li></ol><div class='final-answer'>Final Answer: 61.6 km/h — Option A</div>"}, {"q": "The minor angle between the hours hand and minutes hand of a clock was observed at 8:48 am. The minimum duration, in minutes, after <span class=\"math\">8.48</span> am when this angle increases by <span class=\"math\">50 %</span> is", "type": "mcq", "source": "CAT 2023 Slot 1 | AfterGrad Q10", "options": ["<span class=\"math\"><span class=\"math-frac\"><span class=\"frac-num\">24</span><span class=\"frac-den\">11</span></span></span>", "2", "4", "<span class=\"math\"><span class=\"math-frac\"><span class=\"frac-num\">36</span><span class=\"frac-den\">11</span></span></span>"], "answer": 0, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> At 8:48, the minute hand is at 288° and hour hand at 264°, giving 24°. A 50% increase means an additional 12°.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>Relative angular speed=6−0.5=5.5°/min</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>Time=12/5.5=24/11 min</div></li><li><strong>Step 4 — Conclude:</strong> The required result is <strong>24/11 minutes — Option A</strong>.</li></ol><div class='final-answer'>Final Answer: 24/11 minutes — Option A</div>"}, {"q": "Arvind travels from town <span class=\"math\">A</span> to town <span class=\"math\">B</span>, and Surbhi from town B to town <span class=\"math\">A</span>, both starting at the same time along the same route. After meeting each other, Arvind takes <span class=\"math\">6</span> hours to reach town <span class=\"math\">B</span> while Surbhi takes <span class=\"math\">24</span> hours to reach town <span class=\"math\">A</span>. If Arvind travelled at a speed of <span class=\"math\">54  km / h</span>, then the distance, in km, between town <span class=\"math\">A</span> and town <span class=\"math\">B</span> is", "type": "text", "source": "CAT 2023 Slot 1 | AfterGrad Q11", "answer": "972", "accepted": ["972"], "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> After meeting, travel times are 6 h and 24 h, so speeds are in ratio √(24/6)=2:1. Surbhi’s speed is 27 km/h.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>Arvind’s post-meeting distance=54×6=324 km</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>Surbhi’s post-meeting distance=27×24=648 km</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>Total=972 km</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>972 km</strong>.</li></ol><div class='final-answer'>Final Answer: 972 km</div>"}, {"q": "Moody takes <span class=\"math\">30</span> seconds to finish riding an escalator if he walks on it at his normal speed in the same direction. He takes <span class=\"math\">20</span> seconds to finish riding the escalator if he walks at twice his normal speed in the same direction. If Moody decides to stand still on the escalator, then the time, in seconds, needed to finish riding the escalator is", "type": "text", "source": "CAT 2022 Slot 3 | AfterGrad Q12", "answer": "60", "accepted": ["60"], "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let Moody’s walking rate be w and escalator rate e.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>30(w+e)=20(2w+e) ⇒ e=w</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>Escalator length=30(2w)=60w</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>Standing time=60w/e=60 s</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>60 seconds</strong>.</li></ol><div class='final-answer'>Final Answer: 60 seconds</div>"}, {"q": "Two cars travel from different locations at constant speeds. To meet each other after starting at the same time, they take <span class=\"math\">1.5</span> hours if they travel towards each other, but <span class=\"math\">10.5</span> hours if they travel in the same direction. If the speed of the slower car is <span class=\"math\">60</span> km/hr, then the distance traveled, in km, by the slower car when it meets the other car while traveling towards each other, is", "type": "mcq", "source": "CAT 2022 Slot 3 | AfterGrad Q13", "options": ["<span class=\"math\">90</span>", "<span class=\"math\">100</span>", "<span class=\"math\">150</span>", "<span class=\"math\">120</span>"], "answer": 0, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let the faster speed be v and slower speed be 60. The initial separation is the same in both cases.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>1.5(v+60)=10.5(v−60) ⇒ v=80</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>Slower car distance in 1.5 h=60×1.5=90</div></li><li><strong>Step 4 — Conclude:</strong> The required result is <strong>90 km — Option A</strong>.</li></ol><div class='final-answer'>Final Answer: 90 km — Option A</div>"}, {"q": "Two ships meet mid-ocean, and then, one ship goes south and the other ship goes west, both travelling at constant speeds. Two hours later, they are <span class=\"math\">60  km</span> apart. If the speed of one of the ships is <span class=\"math\">6  km</span> per hour more than the other one, then the speed, in km per hour, of the slower ship is", "type": "mcq", "source": "CAT 2022 Slot 2 | AfterGrad Q14", "options": ["<span class=\"math\">24</span>", "<span class=\"math\">18</span>", "<span class=\"math\">12</span>", "<span class=\"math\">20</span>"], "answer": 1, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> After two hours the perpendicular distances are 2v and 2(v+6).</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>(2v)²+[2(v+6)]²=60²</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>v²+(v+6)²=900 ⇒ v=18</div></li><li><strong>Step 4 — Conclude:</strong> The required result is <strong>18 km/h — Option B</strong>.</li></ol><div class='final-answer'>Final Answer: 18 km/h — Option B</div>"}, {"q": "Trains A and B start traveling at the same time towards each other with constant speeds from stations X and Y, respectively. Train A reaches station Y in <span class=\"math\">10</span> minutes while train B takes <span class=\"math\">9</span> minutes to reach station X after meeting train A. Then the total time taken, in minutes, by train <span class=\"math\">B</span> to travel from station <span class=\"math\">Y</span> to station <span class=\"math\">X</span> is", "type": "mcq", "source": "CAT 2022 Slot 1 | AfterGrad Q15", "options": ["<span class=\"math\">12</span>", "<span class=\"math\">10</span>", "<span class=\"math\">6</span>", "<span class=\"math\">15</span>"], "answer": 3, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let t be the time to meeting. Train A’s remaining time is 10−t and B’s is 9. For trains starting together, t² equals the product of post-meeting times.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>t²=9(10−t) ⇒ t=6</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>Train B total time=t+9=15</div></li><li><strong>Step 4 — Conclude:</strong> The required result is <strong>15 minutes — Option D</strong>.</li></ol><div class='final-answer'>Final Answer: 15 minutes — Option D</div>"}, {"q": "Mira and Amal walk along a circular track, starting from the same point at the sometime. If they walk in the same direction, then in <span class=\"math\">45</span> minutes, Amal completes exactly <span class=\"math\">3</span> more rounds than Mira. If they walk in opposite directions, then they meet for the first time exactly after <span class=\"math\">3</span> minutes. The number of rounds Mira walks in one hour is", "type": "text", "source": "CAT 2021 Slot 3 | AfterGrad Q16", "answer": "8", "accepted": ["8"], "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let hourly rounds be a for Amal and m for Mira.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>a−m=3/(45/60)=4</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>a+m=1/(3/60)=20</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>m=8 rounds/hour</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>8 rounds</strong>.</li></ol><div class='final-answer'>Final Answer: 8 rounds</div>"}, {"q": "Two trains <span class=\"math\">A</span> and <span class=\"math\">B</span> were moving in opposite directions, their speeds being in the ratio <span class=\"math\">5: 3</span>. The front end of <span class=\"math\">A</span> crossed the rear end of <span class=\"math\">B</span> <span class=\"math\">46</span> seconds after the front ends of the trains had crossed each other. It took another <span class=\"math\">69</span> seconds for the rear ends of the trains to cross each other. The ratio of length of train <span class=\"math\">A</span> to that of train <span class=\"math\">B</span> is", "type": "mcq", "source": "CAT 2021 Slot 2 | AfterGrad Q17", "options": ["<span class=\"math\">3 : 2</span>", "<span class=\"math\">2 : 1</span>", "<span class=\"math\">5 : 3</span>", "<span class=\"math\">2 : 3</span>"], "answer": 0, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> After the front ends meet, 46 seconds covers train B’s length; the next 69 seconds covers train A’s length at the same relative speed.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>Length A : Length B =69:46=3:2</div></li><li><strong>Step 3 — Conclude:</strong> The required result is <strong>3:2 — Option A</strong>.</li></ol><div class='final-answer'>Final Answer: 3:2 — Option A</div>"}, {"q": "Two trains cross each other in <span class=\"math\">14</span> seconds when running in opposite directions along parallel tracks. The faster train is <span class=\"math\">160</span> m long and crosses a lamp post in <span class=\"math\">12</span> seconds. If the speed of the other train is <span class=\"math\">6</span> km/hr less than the faster one, its length, in m, is", "type": "mcq", "source": "CAT 2021 Slot 1 | AfterGrad Q18", "options": ["<span class=\"math\">190</span>", "<span class=\"math\">184</span>", "<span class=\"math\">192</span>", "<span class=\"math\">180</span>"], "answer": 0, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Faster train speed is 160/12=13⅓ m/s. The slower train is 6 km/h=1⅔ m/s slower.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>Relative speed=25 m/s</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>Total length=25×14=350 m</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>Slower length=350−160=190 m</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>190 m — Option A</strong>.</li></ol><div class='final-answer'>Final Answer: 190 m — Option A</div>"}, {"q": "Anil, Sunil, and Ravi run along a circular path of length <span class=\"math\">3  km</span>, starting from the same point at the same time, and going in the clockwise direction. If they run at speeds of <span class=\"math\">15  km / hr, 10  km / hr</span>, and <span class=\"math\">8  km / hr</span>, respectively, how much distance in km will Ravi have run when Anil and Sunil meet again for the first time at the starting point?", "type": "mcq", "source": "CAT 2020 Slot 3 | AfterGrad Q19", "options": ["<span class=\"math\">5.2</span>", "<span class=\"math\">4.6</span>", "<span class=\"math\">4.8</span>", "<span class=\"math\">4.2</span>"], "answer": 2, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Anil and Sunil lap the 3 km track in 12 and 18 minutes. Their first common return is after LCM(12,18)=36 minutes.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>Ravi distance=8×(36/60)=4.8 km</div></li><li><strong>Step 3 — Conclude:</strong> The required result is <strong>4.8 km — Option C</strong>.</li></ol><div class='final-answer'>Final Answer: 4.8 km — Option C</div>"}, {"q": "<span class=\"math\">A</span> and <span class=\"math\">B</span> are two railway stations <span class=\"math\">90  km</span> apart. A train leaves <span class=\"math\">A</span> at <span class=\"math\">9:00</span> am, heading towards <span class=\"math\">B</span> at a speed of <span class=\"math\">40  km / hr</span>. Another train leaves <span class=\"math\">B</span> at <span class=\"math\">10:30</span> am, heading towards <span class=\"math\">A</span> at a speed of <span class=\"math\">20  km / hr</span>. The trains meet each other at", "type": "mcq", "source": "CAT 2020 Slot 3 | AfterGrad Q20", "options": ["<span class=\"math\">11:45</span> am", "<span class=\"math\">10:45</span> am", "<span class=\"math\">11:00</span> am", "<span class=\"math\">11:20</span> am"], "answer": 2, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> By 10:30 am the first train has covered 1.5×40=60 km, leaving 30 km between them.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>Relative speed=40+20=60 km/h</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>Time after 10:30=30/60=0.5 h</div></li><li><strong>Step 4 — Conclude:</strong> The required result is <strong>11:00 am — Option C</strong>.</li></ol><div class='final-answer'>Final Answer: 11:00 am — Option C</div>"}, {"q": "Vimla starts for office every day at <span class=\"math\">9</span> am and reaches exactly on time if she drives at her usual speed of <span class=\"math\">40  km / hr</span>. She is late by <span class=\"math\">6</span> minutes if she drives at <span class=\"math\">35  km / hr</span>. One day, she covers two-thirds of her distance to office in onethirds of her usual time to reach office, and then stops for <span class=\"math\">8</span> minutes. The speed, in km/hr, at which she should drive the remaining distance to reach office exactly on time is", "type": "mcq", "source": "CAT 2020 Slot 3 | AfterGrad Q21", "options": ["<span class=\"math\">27</span>", "<span class=\"math\">28</span>", "<span class=\"math\">29</span>", "<span class=\"math\">30</span>"], "answer": 1, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let office distance be D. The six-minute delay compares speeds 35 and 40.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>D/35−D/40=0.1 ⇒ D=28 km</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>Usual time=42 min; first 2/3 uses 14 min, stop=8 min</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>20 min remain for 28/3 km ⇒ speed=28 km/h</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>28 km/h — Option B</strong>.</li></ol><div class='final-answer'>Final Answer: 28 km/h — Option B</div>"}, {"q": "Two runners, Alice and Bob, are racing on two different circular tracks, <span class=\"math\">T1</span> and <span class=\"math\">T2</span>, with radii <span class=\"math\">60  m</span> and <span class=\"math\">40  m</span> respectively. They both start from point <span class=\"math\">P</span> at the same moment. Alice runs on track <span class=\"math\">T1</span> at a constant speed of <span class=\"math\">12  km / hr</span> and Bob runs on track <span class=\"math\">T2</span> at a constant speed of <span class=\"math\">8  km / hr</span>. After how many full rounds of Alice does she meet Bob again for the first time since the race started?", "type": "mcq", "source": "CAT 2020 Slot 2 | AfterGrad Q22", "options": ["1", "2", "3", "4"], "answer": 0, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Track circumferences are proportional to radii, 3:2. Speeds are also 3:2, so both runners have the same lap time.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>They return to P together after one lap.</div></li><li><strong>Step 3 — Conclude:</strong> The required result is <strong>1 full round — Option A</strong>.</li></ol><div class='final-answer'>Final Answer: 1 full round — Option A</div>"}, {"q": "The distance from <span class=\"math\">B</span> to <span class=\"math\">C</span> is thrice that from <span class=\"math\">A</span> to <span class=\"math\">B</span>. Two trains travel from <span class=\"math\">A</span> to <span class=\"math\">C</span> via <span class=\"math\">B</span>. The speed of train <span class=\"math\">2</span> is double that of train <span class=\"math\">1</span> while traveling from <span class=\"math\">A</span> to <span class=\"math\">B</span> and their speeds are interchanged while traveling from <span class=\"math\">B</span> to <span class=\"math\">C</span>. The ratio of the time taken by train <span class=\"math\">1</span> to that taken by train <span class=\"math\">2</span> in travelling from <span class=\"math\">A</span> to <span class=\"math\">C</span> is", "type": "mcq", "source": "CAT 2020 Slot 2 | AfterGrad Q23", "options": ["<span class=\"math\">7:5</span>", "<span class=\"math\">1:4</span>", "<span class=\"math\">5:7</span>", "<span class=\"math\">4:1</span>"], "answer": 2, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let AB=x and BC=3x. Use v and 2v as the two speeds.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>Train 1 time=x/v+3x/(2v)=5x/(2v)</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>Train 2 time=x/(2v)+3x/v=7x/(2v)</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>Ratio=5:7</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>5:7 — Option C</strong>.</li></ol><div class='final-answer'>Final Answer: 5:7 — Option C</div>"}, {"q": "<span class=\"math\">A</span> and <span class=\"math\">B</span> are two points on a straight line. Ram runs from <span class=\"math\">A</span> to <span class=\"math\">B</span> while Rahim runs from <span class=\"math\">B</span> to <span class=\"math\">A</span>. After crossing each other, Ram and Rahim reach their destinations in one minute and four minutes, respectively. If they start at the same time, then the ratio of Ram's speed to Rahim's speed is", "type": "mcq", "source": "CAT 2020 Slot 2 | AfterGrad Q24", "options": ["<span class=\"math\">2√<span class=\"root\">2</span></span>", "2", "<span class=\"math\">1/2</span>", "<span class=\"math\">√<span class=\"root\">2</span></span>"], "answer": 1, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> For two travellers starting together, their speed ratio equals the square root of the ratio of their post-meeting times in reverse order.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>Ram/Rahim=√(4/1)=2</div></li><li><strong>Step 3 — Conclude:</strong> The required result is <strong>2 — Option B</strong>.</li></ol><div class='final-answer'>Final Answer: 2 — Option B</div>"}];

    function norm(s){return String(s ?? "").trim().toLowerCase().replace(/[,₹ rs.%]/g,"").replace(/\s+/g,"");}
    function hasHtml(s){return /<\/?[a-z][\s\S]*>/i.test(String(s ?? ""));}
    function mathFractions(s){let v=String(s ?? "");v=v.replace(/(\d+)\s*<sup>(\d+)<\/sup>\/<sub>(\d+)<\/sub>/g,'<span class="mixed-number">$1 <span class="math-frac"><span class="frac-num">$2</span><span class="frac-den">$3</span></span></span>');return v.replace(/(^|[^A-Za-z0-9.²>])([A-Za-z0-9.²]+)\/([A-Za-z0-9.²]+)/g,'$1<span class="math-frac"><span class="frac-num">$2</span><span class="frac-den">$3</span></span>');}
    function rich(s){return mathFractions(hasHtml(s) ? String(s) : esc(s));}
    function stripHtml(html){const div=document.createElement("div");div.innerHTML=String(html ?? "");return div.textContent.trim().replace(/\s+/g," ");}
    function qType(q){return q.type || ((q.options && q.options.length) ? "mcq" : "text");}
    function qText(q){return q.question ?? q.q ?? "";}
    function qSource(q){return q.source || q.level || "";}
    function qAnswer(q){return q.typedAnswer ?? q.answer ?? "";}
    function renderBar(){qbar.innerHTML=questions.map((q,i)=>'<button type="button" class="qbtn '+(i===current?'current ':'')+(responses[i]!==null&&responses[i]!==''?'answered ':'')+(marked[i]?'marked ':'')+'" onclick="go('+i+')">'+(i+1)+'</button>').join('');}
    function correctText(q){return qType(q)==="mcq" ? "(" + labels[q.answer] + ") " + stripHtml((q.options || [])[q.answer] || "") : qAnswer(q);}
    function contentBlock(html, cls){return html ? '<div class="'+cls+'">'+rich(html)+'</div>' : '';}
    function control(q,i){if(qType(q)==="mcq") return '<div class="options">'+(q.options||[]).map((op,j)=>'<label class="option"><input type="radio" autocomplete="off" name="answer_'+i+'" value="'+j+'" '+(responses[i]===String(j)?'checked':'')+' '+(submitted?'disabled':'')+'> <span><span class="opt-label">('+labels[j]+')</span> <span class="opt-text">'+rich(op)+'</span></span></label>').join('')+'</div>'; return '<input class="typed-answer" name="answer_'+i+'" autocomplete="off" value="'+esc(responses[i]||'')+'" placeholder="Type your answer" '+(submitted?'disabled':'')+'>';}
    function solutionHtml(q){const sol=q.solution || "Solution not provided.";return rich(sol);}
    function renderQuestion(){const q=questions[current];host.innerHTML='<div class="qhead"><div><div class="qnum">Question '+(current+1)+' of '+questions.length+'</div><div class="source">'+esc(qSource(q))+'</div></div></div>'+contentBlock(q.direction,'block')+contentBlock(q.passage,'block')+'<div class="qtext">'+rich(qText(q))+'</div>'+control(q,current)+'<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Detailed Solution</h3><strong>Answer: '+rich(correctText(q))+'</strong><div class="block">'+solutionHtml(q)+'</div></div><div class="navrow"><button type="button" onclick="markReviewNext()" class="mark">Mark for Review & Next</button><button type="button" onclick="clearResponse()" '+(submitted?'disabled':'')+'>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" onclick="nextQ()" class="submit">Save & Next</button></div>';if(submitted)showReviewForCurrent();bindAnswer();renderBar();}
    function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{if(responses[current]===null&&el.type==='radio')el.checked=false;el.addEventListener('input',()=>{responses[current]=el.type==='radio'?el.value:el.value;renderBar();});el.addEventListener('change',()=>{responses[current]=el.type==='radio'?el.value:el.value;renderBar();});});}
    function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('input.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}
    function go(i){saveCurrent();current=i;renderQuestion();} function prevQ(){if(current>0)go(current-1);} function nextQ(){if(current<questions.length-1)go(current+1);} function toggleMark(){marked[current]=!marked[current];renderQuestion();} function markReviewNext(){marked[current]=true;if(current<questions.length-1)nextQ();else renderQuestion();} function clearResponse(){responses[current]=null;renderQuestion();}
    function isCorrect(q,ans){if(ans===null||ans==='')return null;if(qType(q)==='mcq')return Number(ans)===Number(q.answer);const accepted=(q.accepted&&q.accepted.length?q.accepted:[qAnswer(q)]).map(norm);return accepted.includes(norm(ans));}
    function showReviewForCurrent(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';host.scrollTop=0;if(r===null){note.className='answer-note muted';note.textContent='Unattempted. Correct answer: '+correctText(q);}else if(r){note.className='answer-note ok';note.textContent='Correct.';}else{note.className='answer-note bad';note.textContent='Wrong. Correct answer: '+correctText(q);} }
    function submitTest(auto=false){if(submitted)return;saveCurrent();if(!auto&&!confirm('Submit this test now? You will not be able to change responses afterward.'))return;submitted=true;let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++;});const score=c*3-w;resultBox.style.display='block';resultBox.innerHTML='<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>'+score+'</strong></div><div class="score-box">Correct<strong>'+c+'</strong></div><div class="score-box">Wrong<strong>'+w+'</strong></div><div class="score-box">Attempted<strong>'+(c+w)+'</strong></div><div class="score-box">Unattempted<strong>'+u+'</strong></div></div>';showReviewForCurrent();renderBar();resultBox.scrollIntoView({behavior:'smooth',block:'start'});}
    function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest(true);return;}secondsLeft--;}
    function calcEval(expr){if(!/^[0-9+\-*/().%\s]+$/.test(expr))return 'Error';return Function('return ('+expr.replace(/%/g,'/100')+')')();}
    function updateCalcSub(){document.getElementById('calcSubDisplay').textContent=document.getElementById('calcDisplay').value||'0';}
    document.querySelectorAll('[data-calc]').forEach(btn=>btn.addEventListener('click',()=>{const d=document.getElementById('calcDisplay'),v=btn.dataset.calc;if(['MC','MR','MS','M+','M-'].includes(v))return; if(v==='C')d.value='';else if(v==='B')d.value=d.value.slice(0,-1);else if(v==='+/-'){d.value=d.value.startsWith('-')?d.value.slice(1):('-'+d.value);}else if(v==='sqrt'){try{d.value=Math.sqrt(Number(calcEval(d.value||'0')));}catch(e){d.value='Error';}}else if(v==='1/x'){try{d.value=1/Number(calcEval(d.value||'0'));}catch(e){d.value='Error';}}else if(v==='='){try{d.value=calcEval(d.value);}catch(e){d.value='Error';}}else d.value+=v;updateCalcSub();}));
    const calcPopup=document.getElementById('calcPopup'), calcHandle=document.getElementById('calcDragHandle');
    document.getElementById('calcToggle').addEventListener('click',()=>{calcPopup.classList.toggle('open');if(calcPopup.classList.contains('open')&&!calcPopup.dataset.moved){calcPopup.style.left='52%';calcPopup.style.top='120px';}});
    document.getElementById('calcClose').addEventListener('pointerdown',e=>e.stopPropagation());
    document.getElementById('calcClose').addEventListener('click',e=>{e.stopPropagation();calcPopup.classList.remove('open');});
    let dragCalc=false, calcDx=0, calcDy=0;
    calcHandle.addEventListener('pointerdown',e=>{dragCalc=true;calcHandle.setPointerCapture(e.pointerId);const r=calcPopup.getBoundingClientRect();calcDx=e.clientX-r.left;calcDy=e.clientY-r.top;calcPopup.style.left=r.left+'px';calcPopup.style.top=r.top+'px';calcPopup.style.right='auto';calcPopup.dataset.moved='1';e.preventDefault();});
    calcHandle.addEventListener('pointermove',e=>{if(!dragCalc)return;const maxX=window.innerWidth-calcPopup.offsetWidth-4,maxY=window.innerHeight-calcPopup.offsetHeight-4;calcPopup.style.left=Math.max(4,Math.min(maxX,e.clientX-calcDx))+'px';calcPopup.style.top=Math.max(4,Math.min(maxY,e.clientY-calcDy))+'px';});
    calcHandle.addEventListener('pointerup',e=>{dragCalc=false;try{calcHandle.releasePointerCapture(e.pointerId);}catch(err){}});
    calcHandle.addEventListener('pointercancel',()=>{dragCalc=false;});
    renderQuestion();tick();setInterval(tick,1000);
  </script>
</body>
