  <script>
    const questions = [{"q": "In a car race, car <span class=\"math\">A</span> beats car <span class=\"math\">B</span> by <span class=\"math\">45  km</span>, car <span class=\"math\">B</span> beats car <span class=\"math\">C</span> by <span class=\"math\">50</span>km, and car <span class=\"math\">A</span> beats <span class=\"math\">C</span> by <span class=\"math\">90  km</span>. the distance (in km) over which the race has been conducted is", "type": "mcq", "source": "CAT 2020 Slot 2 | AfterGrad Q25", "options": ["<span class=\"math\">550</span>", "<span class=\"math\">500</span>", "<span class=\"math\">475</span>", "<span class=\"math\">450</span>"], "answer": 3, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let race distance be D. Use speed ratios from the winning margins.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>B/A=(D−45)/D, C/B=(D−50)/D, C/A=(D−90)/D</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>(D−45)(D−50)=D(D−90) ⇒ D=450</div></li><li><strong>Step 4 — Conclude:</strong> The required result is <strong>450 km — Option D</strong>.</li></ol><div class='final-answer'>Final Answer: 450 km — Option D</div>"}, {"q": "Leaving home at the same time, Amal reaches the office at <span class=\"math\">10:15 am</span> if he travels at <span class=\"math\">8 km/hr</span>, and at <span class=\"math\">9:40 am</span> if he travels at <span class=\"math\">15 km/hr</span>. Leaving home at 9:10, at what speed, in <span class=\"math\">km/hr,</span> must be travel so as to reach office exactly at <span class=\"math\">10 am?</span>", "type": "mcq", "source": "CAT 2020 Slot 1 | AfterGrad Q26", "options": ["14", "11", "13", "12"], "answer": 3, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> The difference between the travel times at 8 and 15 km/h is 35 minutes.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>D/8−D/15=7/12 ⇒ D=10 km</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>From 9:10 to 10:00 is 5/6 h</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>Required speed=10/(5/6)=12</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>12 km/h — Option D</strong>.</li></ol><div class='final-answer'>Final Answer: 12 km/h — Option D</div>"}, {"q": "A train travelled at one-thirds of its usual speed, and hence reached the destination <span class=\"math\">30</span> minutes after the scheduled time. On its return journey, the train initially travelled at its usual speed for <span class=\"math\">5</span> minutes but then stopped for <span class=\"math\">4</span> minutes for an emergency. The percentage by which the train must now increase its usual speed so as to reach the destination at the scheduled time, is nearest to", "type": "mcq", "source": "CAT 2020 Slot 1 | AfterGrad Q27", "options": ["<span class=\"math\">58</span>", "<span class=\"math\">61</span>", "<span class=\"math\">50</span>", "<span class=\"math\">67</span>"], "answer": 3, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> At one-third speed the travel time triples. The 30-minute delay is twice the usual time.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>2T=30 min ⇒ T=15 min</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>After 5 min, 1/3 distance is covered; after 4-min stop, 6 min remain</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>Required/usual speed=[(2/3)/6]/[1/15]=5/3</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>Approximately 67% increase — Option D</strong>.</li></ol><div class='final-answer'>Final Answer: Approximately 67% increase — Option D</div>"}, {"q": "A straight road connects points <span class=\"math\">A</span> and <span class=\"math\">B.</span> Car <span class=\"math\">1</span> travels from <span class=\"math\">A</span> to <span class=\"math\">B</span> and Car <span class=\"math\">2</span> travels from <span class=\"math\">B</span> to <span class=\"math\">A</span>, both leaving at the same time. After meeting each other, they take <span class=\"math\">45</span> minutes and <span class=\"math\">20</span> minutes, respectively, to complete their journeys. If Car <span class=\"math\">1</span> travels at the speed of <span class=\"math\">60 km/hr</span>, then the speed of Car <span class=\"math\">2,</span> in km/hr, is", "type": "mcq", "source": "CAT 2020 Slot 1 | AfterGrad Q28", "options": ["100", "80", "90", "70"], "answer": 2, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> For opposite travellers, speed ratio is the square root of the reversed post-meeting-time ratio.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>v1/v2=√(20/45)=2/3</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>60/v2=2/3 ⇒ v2=90</div></li><li><strong>Step 4 — Conclude:</strong> The required result is <strong>90 km/h — Option C</strong>.</li></ol><div class='final-answer'>Final Answer: 90 km/h — Option C</div>"}, {"q": "Two persons are walking beside a railway track at respective speeds of <span class=\"math\">2</span> and <span class=\"math\">4  km</span> per hour in the same direction. A train came from behind them and crossed them in <span class=\"math\">90</span> and <span class=\"math\">100</span> seconds, respectively. The time, in seconds, taken by the train to cross a stationary object?", "type": "mcq", "source": "CAT 2020 Slot 1 | AfterGrad Q29", "options": ["<span class=\"math\">78</span>", "<span class=\"math\">87</span>", "<span class=\"math\">75</span>", "<span class=\"math\">82</span>"], "answer": 3, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let train speed be V km/h and length be L. Relative crossing times give the same length.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>90(V−2)=100(V−4) ⇒ V=22</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>L=90×(20/3.6)=500 m</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>Stationary time=500/(22/3.6)=81.82 s</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>82 seconds — Option D</strong>.</li></ol><div class='final-answer'>Final Answer: 82 seconds — Option D</div>"}, {"q": "Two ants <span class=\"math\">A</span> and <span class=\"math\">B</span> start from a point <span class=\"math\">P</span> on a circle at the same time, with <span class=\"math\">A</span> moving clock-wise and <span class=\"math\">B</span> moving anti-clockwise. They meet for the first time at <span class=\"math\">10:00</span> am when <span class=\"math\">A</span> has covered <span class=\"math\">60%</span> of the track. If <span class=\"math\">A</span> returns to <span class=\"math\">P</span> at <span class=\"math\">10:12</span> am, then <span class=\"math\">B</span> returns to <span class=\"math\">P</span> at", "type": "mcq", "source": "CAT 2019 Slot 2 | AfterGrad Q30", "options": ["<span class=\"math\">10:25</span> am", "<span class=\"math\">10:18</span> am", "<span class=\"math\">10:27</span> am", "<span class=\"math\">10:45</span> am"], "answer": 2, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> At first meeting A covers 60% and B 40%, so speeds are 3:2. A covers the remaining 40% in 12 minutes.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>A lap time=12/0.4=30 min; start=9:42 am</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>B lap time=45 min</div></li><li><strong>Step 4 — Conclude:</strong> The required result is <strong>10:27 am — Option C</strong>.</li></ol><div class='final-answer'>Final Answer: 10:27 am — Option C</div>"}, {"q": "A cyclist leaves <span class=\"math\">A</span> at <span class=\"math\">10</span> am and reaches <span class=\"math\">B</span> at <span class=\"math\">11</span> am. Starting from <span class=\"math\">10:01</span> am, every minute a motor cycle leaves <span class=\"math\">A</span> and moves towards <span class=\"math\">B</span>. Forty-five such motor cycles reach <span class=\"math\">B</span> by <span class=\"math\">11</span> am. All motor cycles have the same speed. If the cyclist had doubled his speed, how many motor cycles would have reached <span class=\"math\">B</span> by the time the cyclist reached <span class=\"math\">B</span>?", "type": "mcq", "source": "CAT 2019 Slot 2 | AfterGrad Q31", "options": ["<span class=\"math\">20</span>", "<span class=\"math\">23</span>", "<span class=\"math\">15</span>", "<span class=\"math\">22</span>"], "answer": 2, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> The 45th motorcycle, leaving at 10:45, reaches by 11:00, so every motorcycle takes 15 minutes.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>At double speed cyclist reaches at 10:30.</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>Motorcycles leaving by 10:15 arrive by then: 15 motorcycles.</div></li><li><strong>Step 4 — Conclude:</strong> The required result is <strong>15 — Option C</strong>.</li></ol><div class='final-answer'>Final Answer: 15 — Option C</div>"}, {"q": "John jogs on track <span class=\"math\">A</span> at <span class=\"math\">6</span> kmph and Mary jogs on track <span class=\"math\">B</span> at <span class=\"math\">7.5</span> kmph. The total length of tracks <span class=\"math\">A</span> and <span class=\"math\">B</span> is <span class=\"math\">325</span> metres. While John makes <span class=\"math\">9</span> rounds of track <span class=\"math\">A</span>, Mary makes <span class=\"math\">5</span> rounds of track <span class=\"math\">B</span>. In how many seconds will Mary make one round of track <span class=\"math\">A</span>?", "type": "text", "source": "CAT 2019 Slot 2 | AfterGrad Q32", "answer": "48", "accepted": ["48"], "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let track lengths be a and b km. The stated equal times give 9a/6=5b/7.5.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>1.5a=(2/3)b ⇒ b=2.25a</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>a+b=0.325 ⇒ a=0.1 km</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>Mary time on A=0.1/7.5 h=48 s</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>48 seconds</strong>.</li></ol><div class='final-answer'>Final Answer: 48 seconds</div>"}, {"q": "In a race of three horses, the first beat the second by <span class=\"math\">11</span> metres and the third by <span class=\"math\">90</span> metres. If the second beat the third by <span class=\"math\">80</span> metres, what was the length, in metres, of the racecourse?", "type": "text", "source": "CAT 2019 Slot 1 | AfterGrad Q33", "answer": "880", "accepted": ["880"], "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let race length be D. Compare the third horse’s speed with the second and first.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>v3/v2=(D−80)/D</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>v3/v2=(D−90)/(D−11)</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>(D−80)(D−11)=D(D−90) ⇒ D=880</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>880 metres</strong>.</li></ol><div class='final-answer'>Final Answer: 880 metres</div>"}, {"q": "Two cars travel the same distance starting at <span class=\"math\">10:00</span> am and <span class=\"math\">11:00</span> am, respectively, on the same day. They reach their common destination at the same point of time. If the first car travelled for at least <span class=\"math\">6</span> hours, then the highest possible value of the percentage by which the speed of the second car could exceed that of the first car is", "type": "mcq", "source": "CAT 2019 Slot 1 | AfterGrad Q34", "options": ["<span class=\"math\">20</span>", "<span class=\"math\">25</span>", "<span class=\"math\">30</span>", "<span class=\"math\">10</span>"], "answer": 0, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> If the first car travels t hours, the second travels t−1 hours. Their speed ratio is t/(t−1).</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>Percentage excess=100/(t−1)</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>This is greatest at minimum t=6: 100/5=20%</div></li><li><strong>Step 4 — Conclude:</strong> The required result is <strong>20% — Option A</strong>.</li></ol><div class='final-answer'>Final Answer: 20% — Option A</div>"}, {"q": "One can use three different transports which move at <span class=\"math\">10</span>, <span class=\"math\">20</span>, and <span class=\"math\">30</span> kmph, respectively. To reach from <span class=\"math\">A</span> to <span class=\"math\">B</span>, Amal took each mode of transport <span class=\"math\">1/3</span> of his total journey time, while Bimal took each mode of transport <span class=\"math\">1/3</span> of the total distance. The percentage by which Bimal's travel time exceeds Amal's travel time is nearest to", "type": "mcq", "source": "CAT 2019 Slot 1 | AfterGrad Q35", "options": ["<span class=\"math\">22</span>", "<span class=\"math\">21</span>", "<span class=\"math\">19</span>", "<span class=\"math\">20</span>"], "answer": 0, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Amal spends equal times, giving average speed (10+20+30)/3=20. Bimal spends equal distances.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>Amal time=D/20</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>Bimal time=(D/3)(1/10+1/20+1/30)=11D/180</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>Excess=(11/9−1)×100≈22.22%</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>22% — Option A</strong>.</li></ol><div class='final-answer'>Final Answer: 22% — Option A</div>"}, {"q": "The wheels of bicycles <span class=\"math\">A</span> and <span class=\"math\">B</span> have radii <span class=\"math\">30</span> cm and <span class=\"math\">40</span> cm, respectively. While traveling a certain distance, each wheel of <span class=\"math\">A</span> required <span class=\"math\">5000</span> more revolutions than each wheel of <span class=\"math\">B</span>. If bicycle <span class=\"math\">B</span> traveled this distance in <span class=\"math\">45</span> minutes, then its speed, in km per hour, was", "type": "mcq", "source": "CAT 2019 Slot 1 | AfterGrad Q36", "options": ["<span class=\"math\">16\pi</span>", "<span class=\"math\">14\pi</span>", "<span class=\"math\">18\pi</span>", "<span class=\"math\">12\pi</span>"], "answer": 0, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let bicycle B make n revolutions. Equal distances give 30(n+5000)=40n.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>n=15000</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>Distance=15000×2π×0.4 m=12π km</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>Speed=12π/(3/4)=16π km/h</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>16π km/h — Option A</strong>.</li></ol><div class='final-answer'>Final Answer: 16π km/h — Option A</div>"}, {"q": "Points <span class=\"math\">A, P, Q</span> and <span class=\"math\">B</span> lie on the same line such that <span class=\"math\">P, Q</span> and <span class=\"math\">B</span> are, respectively, <span class=\"math\">100  km, 200  km</span> and <span class=\"math\">300  km</span> away from <span class=\"math\">A</span>. Cars <span class=\"math\">1</span> and <span class=\"math\">2</span> leave <span class=\"math\">A</span> at the same time and move towards <span class=\"math\">B.</span> Simultaneously, car <span class=\"math\">3</span> leaves <span class=\"math\">B</span> and moves towards <span class=\"math\">A</span>. Car <span class=\"math\">3</span> meets car <span class=\"math\">1</span> at <span class=\"math\">Q</span>, and car <span class=\"math\">2</span> at <span class=\"math\">P</span>. If each car is moving in uniform speed then the ratio of the speed of car <span class=\"math\">2</span> to that of car <span class=\"math\">1</span> is", "type": "mcq", "source": "CAT 2018 Slot 2 | AfterGrad Q37", "options": ["<span class=\"math\">1:2</span>", "<span class=\"math\">2:9</span>", "<span class=\"math\">1:4</span>", "<span class=\"math\">2:7</span>"], "answer": 2, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let the three speeds be v1,v2,v3. At Q, car 1 covers 200 km while car 3 covers 100 km. At P, car 2 covers 100 km while car 3 covers 200 km.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>v3/v1=1/2 and v2/v3=1/2</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>v2/v1=1/4</div></li><li><strong>Step 4 — Conclude:</strong> The required result is <strong>1:4 — Option C</strong>.</li></ol><div class='final-answer'>Final Answer: 1:4 — Option C</div>"}, {"q": "Points <span class=\"math\">A</span> and <span class=\"math\">B</span> are <span class=\"math\">150  km</span> apart. Cars <span class=\"math\">1</span> and <span class=\"math\">2</span> travel from <span class=\"math\">A</span> to <span class=\"math\">B</span>, but car <span class=\"math\">2</span> starts from <span class=\"math\">A</span> when car <span class=\"math\">1</span> is already <span class=\"math\">20  km</span> away from <span class=\"math\">A</span>. Each car travels at a speed of <span class=\"math\">100 kmph</span> for the first <span class=\"math\">50  km</span>, at <span class=\"math\">50 kmph</span> for the next <span class=\"math\">50  km</span>, and at <span class=\"math\">25 kmph</span> for the last <span class=\"math\">50  km</span>. The distance, in km, between car <span class=\"math\">2</span> and <span class=\"math\">B</span> when car <span class=\"math\">1</span> reaches <span class=\"math\">B</span> is", "type": "text", "source": "CAT 2018 Slot 2 | AfterGrad Q38", "answer": "5", "accepted": ["5"], "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Car 2 starts when car 1 has travelled 20 km at 100 km/h, a 0.2-hour delay.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>Car 1 total time=50/100+50/50+50/25=3.5 h</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>Car 2 gets 3.3 h; after 100 km it has 1.8 h left at 25 km/h, covering 45 km</div></li><li><strong>Step 4 — Conclude:</strong> The required result is <strong>5 km</strong>.</li></ol><div class='final-answer'>Final Answer: 5 km</div>"}, {"q": "On a long stretch of east-west road, <span class=\"math\">A</span> and <span class=\"math\">B</span> are two points such that <span class=\"math\">B</span> is <span class=\"math\">350</span> km west of <span class=\"math\">A</span>. One car starts from <span class=\"math\">A</span> and another from <span class=\"math\">B</span> at the same time. If they move towards each other, then they meet after <span class=\"math\">1</span> hour. If they both move towards east, then they meet in <span class=\"math\">7 hrs</span>. The difference between their speeds, in km per hour, is", "type": "text", "source": "CAT 2018 Slot 2 | AfterGrad Q39", "answer": "50", "accepted": ["50"], "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> When moving towards each other, their speed sum covers 350 km in one hour. When both move east, the catch-up uses their speed difference.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>Speed difference=350/7=50 km/h</div></li><li><strong>Step 3 — Conclude:</strong> The required result is <strong>50 km/h</strong>.</li></ol><div class='final-answer'>Final Answer: 50 km/h</div>"}, {"q": "Point <span class=\"math\">P</span> lies between points <span class=\"math\">A</span> and <span class=\"math\">B</span> such that the length of <span class=\"math\">BP</span> is thrice that of <span class=\"math\">AP</span> . Car <span class=\"math\">1</span> starts from <span class=\"math\">A</span> and moves towards <span class=\"math\">B</span> . Simultaneously, car <span class=\"math\">2</span> starts from <span class=\"math\">B</span> and moves towards <span class=\"math\">A</span>. Car <span class=\"math\">2</span> reaches <span class=\"math\">P</span> one hour after car <span class=\"math\">1</span> reaches <span class=\"math\">P</span>. If the speed of car <span class=\"math\">2</span> is half that of car <span class=\"math\">1</span>, then the time, in minutes, taken by car <span class=\"math\">1</span> in reaching <span class=\"math\">P</span> from <span class=\"math\">A</span> is", "type": "text", "source": "CAT 2018 Slot 1 | AfterGrad Q40", "answer": "12", "accepted": ["12"], "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let AP=x and car 1 speed=v, so car 1 reaches P in t=x/v. Car 2 travels BP=3x at speed v/2.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>Car 2 time=3x/(v/2)=6t</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>6t=t+1 hour ⇒ t=1/5 hour</div></li><li><strong>Step 4 — Conclude:</strong> The required result is <strong>12 minutes</strong>.</li></ol><div class='final-answer'>Final Answer: 12 minutes</div>"}, {"q": "Train <span class=\"math\">T</span> leaves station <span class=\"math\">X</span> for station <span class=\"math\">Y</span> at <span class=\"math\">3 pm</span>. Train <span class=\"math\">S</span>, traveling at three quarters of the speed of <span class=\"math\">T</span>, leaves <span class=\"math\">Y</span> for <span class=\"math\">X</span> at <span class=\"math\">4 pm</span>. The two trains pass each other at a station <span class=\"math\">Z</span>, where the distance between <span class=\"math\">X</span> and <span class=\"math\">Z</span> is three-fifths of that between <span class=\"math\">X</span> and <span class=\"math\">Y</span>. How many hours does train <span class=\"math\">T</span> take for its journey from <span class=\"math\">X</span> to <span class=\"math\">Y</span> ?", "type": "text", "source": "CAT 2018 Slot 1 | AfterGrad Q41", "answer": "15", "accepted": ["15"], "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let T’s full journey time be H hours. T reaches Z after 3H/5. S travels 2D/5 at 3v/4 after starting one hour later.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>3H/5=1+(2/5)D/(3v/4)=1+8H/15</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>H/15=1</div></li><li><strong>Step 4 — Conclude:</strong> The required result is <strong>15 hours</strong>.</li></ol><div class='final-answer'>Final Answer: 15 hours</div>"}, {"q": "The distance from <span class=\"math\">A</span> to <span class=\"math\">B</span> is <span class=\"math\">60  km</span>. Partha and Narayan start from <span class=\"math\">A</span> at the same time and move towards <span class=\"math\">B</span>. Partha takes four hours more than Narayan to reach <span class=\"math\">B</span>. Moreover, Partha reaches the mid-point of <span class=\"math\">A</span> and <span class=\"math\">B</span> two hours before Narayan reaches <span class=\"math\">B</span>. The speed of Partha, in km per hour, is", "type": "mcq", "source": "CAT 2018 Slot 1 | AfterGrad Q42", "options": ["<span class=\"math\">5</span>", "<span class=\"math\">6</span>", "<span class=\"math\">4</span>", "<span class=\"math\">3</span>"], "answer": 0, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let Partha take p hours; Narayan takes p−4. Partha reaches midpoint in p/2 hours, two hours before Narayan reaches B.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>p/2=(p−4)−2 ⇒ p=12</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>Speed=60/12=5 km/h</div></li><li><strong>Step 4 — Conclude:</strong> The required result is <strong>5 km/h — Option A</strong>.</li></ol><div class='final-answer'>Final Answer: 5 km/h — Option A</div>"}, {"q": "In a <span class=\"math\">10  km</span> race. A, B, and C , each running at uniform speed, get the gold, silver, and bronze medals, respectively. If A beats B by <span class=\"math\">1  km</span> and B beats C by <span class=\"math\">1  km</span>, then by how many metres does A beat C?", "type": "text", "source": "CAT 2017 Slot 2 | AfterGrad Q43", "answer": "1900", "accepted": ["1900"], "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> When A finishes 10 km, B has run 9 km. When B finishes 10 km, C has run 9 km.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>vC/vA=(9/10)²=0.81</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>When A finishes, C runs 8.1 km</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>Winning margin=1.9 km</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>1900 metres</strong>.</li></ol><div class='final-answer'>Final Answer: 1900 metres</div>"}, {"q": "Arun drove from home to his hostel at <span class=\"math\">60</span> miles per hour. While returning home he drove half way along the same route at a speed of <span class=\"math\">25</span> miles per hour and then took a bypass road which increased his driving distance by <span class=\"math\">5</span> miles, but allowed him to drive at <span class=\"math\">50</span> miles per hour along this bypass road. If his return journey took <span class=\"math\">30</span> minutes more than his onward journey, then the total distance traveled by him is", "type": "mcq", "source": "CAT 2017 Slot 2 | AfterGrad Q44", "options": ["<span class=\"math\">55</span> miles", "<span class=\"math\">60</span> miles", "<span class=\"math\">65</span> miles", "<span class=\"math\">70</span> miles"], "answer": 2, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let the direct one-way distance be D miles. Return distance is D+5.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>Onward time=D/60</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>Return time=(D/2)/25+(D/2+5)/50=3D/100+0.1</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>Return−onward=0.5 ⇒ D=30</div></li><li><strong>Step 5 — Substitute and simplify:</strong><div class='step-calculation'>Total distance=D+(D+5)=65</div></li><li><strong>Step 6 — Conclude:</strong> The required result is <strong>65 miles — Option C</strong>.</li></ol><div class='final-answer'>Final Answer: 65 miles — Option C</div>"}, {"q": "A motorbike leaves point <span class=\"math\">A</span> at <span class=\"math\">1</span> pm and moves towards point <span class=\"math\">B</span> at a uniform speed. A car leaves point <span class=\"math\">B</span> at <span class=\"math\">2</span> pm and moves towards point <span class=\"math\">A</span> at a uniform speed which is double that of the motorbike. They meet at <span class=\"math\">3:40</span> pm at a point which is <span class=\"math\">168  km</span> away from <span class=\"math\">A</span> . What is the distance, in km, between <span class=\"math\">A</span> and <span class=\"math\">B</span> ?", "type": "mcq", "source": "CAT 2017 Slot 2 | AfterGrad Q45", "options": ["<span class=\"math\">364</span>", "<span class=\"math\">378</span>", "<span class=\"math\">380</span>", "<span class=\"math\">388</span>"], "answer": 1, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> The motorbike travels from 1:00 to 3:40, or 8/3 hours, to cover 168 km.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>Bike speed=168÷(8/3)=63 km/h</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>Car speed=126 km/h; car time=5/3 h; car distance=210 km</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>Total=168+210=378 km</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>378 km — Option B</strong>.</li></ol><div class='final-answer'>Final Answer: 378 km — Option B</div>"}, {"q": "A man leaves his home and walks at a speed of <span class=\"math\">12</span> km per hour, reaching the railway station <span class=\"math\">10</span> minutes after the train had departed. If instead he had walked at a speed of <span class=\"math\">15</span> km per hour, he would have reached the station <span class=\"math\">10</span> minutes before the train's departure. The distance (in km) from his home to the railway station is", "type": "text", "source": "CAT 2017 Slot 1 | AfterGrad Q46", "answer": "20", "accepted": ["20"], "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> The two walking times differ by 20 minutes.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>D/12−D/15=1/3</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>D/60=1/3 ⇒ D=20</div></li><li><strong>Step 4 — Conclude:</strong> The required result is <strong>20 km</strong>.</li></ol><div class='final-answer'>Final Answer: 20 km</div>"}, {"q": "A man travels by a motor boat down a river to his office and back. With the speed of the river unchanged, if he doubles the speed of his motor boat, then his total travel time gets reduced by <span class=\"math\">75%</span>. The ratio of the original speed of the motor boat to the speed of the river is", "type": "mcq", "source": "CAT 2017 Slot 1 | AfterGrad Q47", "options": ["<span class=\"math\">√<span class=\"root\">6</span>:√<span class=\"root\">2</span></span>", "<span class=\"math\">√<span class=\"root\">7</span>:2</span>", "<span class=\"math\">2√<span class=\"root\">5</span>:3</span>", "<span class=\"math\">3:2</span>"], "answer": 1, "solution": "<ol class='solution-steps'><li><strong>Step 1 — Set up the information:</strong> Let boat speed be b and river speed c for equal upstream/downstream distances.</li><li><strong>Step 2 — Form the equation:</strong><div class='step-calculation'>Original time=2db/(b²−c²)</div></li><li><strong>Step 3 — Substitute and simplify:</strong><div class='step-calculation'>Doubled-speed time=4db/(4b²−c²)=1/4 original</div></li><li><strong>Step 4 — Substitute and simplify:</strong><div class='step-calculation'>2(b²−c²)/(4b²−c²)=1/4 ⇒ 4b²=7c²</div></li><li><strong>Step 5 — Conclude:</strong> The required result is <strong>√7 : 2 — Option B</strong>.</li></ol><div class='final-answer'>Final Answer: √7 : 2 — Option B</div>"}];
    let current = 0, submitted = false, secondsLeft = 75 * 60;
    const responses = Array(questions.length).fill(null), marked = Array(questions.length).fill(false), labels = ["A","B","C","D"];
    const qbar = document.getElementById("qbar"), host = document.getElementById("questionHost"), resultBox = document.getElementById("result");
    function esc(s){return String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
    function norm(s){return String(s ?? "").trim().toLowerCase().replace(/[,₹ rs.%]/g,"").replace(/\s+/g,"");}
    function hasHtml(s){return /<\/?[a-z][\s\S]*>/i.test(String(s ?? ""));}
    function mathFractions(s){let v=String(s ?? "");v=v.replace(/(\d+)\s*<sup>(\d+)<\/sup>\/<sub>(\d+)<\/sub>/g,'<span class="mixed-number">$1 <span class="math-frac"><span class="frac-num">$2</span><span class="frac-den">$3</span></span></span>');return v.replace(/(^|[^A-Za-z0-9.²>])([A-Za-z0-9.²]+)\/([A-Za-z0-9.²]+)/g,'$1<span class="math-frac"><span class="frac-num">$2</span><span class="frac-den">$3</span></span>');}
    function rich(s){return mathFractions(hasHtml(s) ? String(s) : esc(s));}
    function stripHtml(html){const div=document.createElement("div");div.innerHTML=String(html ?? "");return div.textContent.trim().replace(/\s+/g," ");}
    function qType(q){return q.type || ((q.options && q.options.length) ? "mcq" : "text");}
    function qText(q){return q.question ?? q.q ?? "";}
    function qSource(q){return q.source || q.level || "";}
    function qAnswer(q){return q.typedAnswer ?? q.answer ?? "";}
    function renderBar(){qbar.innerHTML=questions.map((q,i)=>'<button type="button" class="qbtn '+(i===current?'current ':'')+(responses[i]!==null&&responses[i]!==''?'answered ':'')+(marked[i]?'marked ':'')+'" onclick="go('+i+')">'+(i+1)+'</button>').join('');}
    function correctText(q){return qType(q)==="mcq" ? "(" + labels[q.answer] + ") " + stripHtml((q.options || [])[q.answer] || "") : qAnswer(q);}
    function contentBlock(html, cls){return html ? '<div class="'+cls+'">'+rich(html)+'</div>' : '';}
    function control(q,i){if(qType(q)==="mcq") return '<div class="options">'+(q.options||[]).map((op,j)=>'<label class="option"><input type="radio" autocomplete="off" name="answer_'+i+'" value="'+j+'" '+(responses[i]===String(j)?'checked':'')+' '+(submitted?'disabled':'')+'> <span><span class="opt-label">('+labels[j]+')</span> <span class="opt-text">'+rich(op)+'</span></span></label>').join('')+'</div>'; return '<input class="typed-answer" name="answer_'+i+'" autocomplete="off" value="'+esc(responses[i]||'')+'" placeholder="Type your answer" '+(submitted?'disabled':'')+'>';}
    function solutionHtml(q){const sol=q.solution || "Solution not provided.";return rich(sol);}
    function renderQuestion(){const q=questions[current];host.innerHTML='<div class="qhead"><div><div class="qnum">Question '+(current+1)+' of '+questions.length+'</div><div class="source">'+esc(qSource(q))+'</div></div></div>'+contentBlock(q.direction,'block')+contentBlock(q.passage,'block')+'<div class="qtext">'+rich(qText(q))+'</div>'+control(q,current)+'<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Detailed Solution</h3><strong>Answer: '+rich(correctText(q))+'</strong><div class="block">'+solutionHtml(q)+'</div></div><div class="navrow"><button type="button" onclick="markReviewNext()" class="mark">Mark for Review & Next</button><button type="button" onclick="clearResponse()" '+(submitted?'disabled':'')+'>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" onclick="nextQ()" class="submit">Save & Next</button></div>';if(submitted)showReviewForCurrent();bindAnswer();renderBar();}
    function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{if(responses[current]===null&&el.type==='radio')el.checked=false;el.addEventListener('input',()=>{responses[current]=el.type==='radio'?el.value:el.value;renderBar();});el.addEventListener('change',()=>{responses[current]=el.type==='radio'?el.value:el.value;renderBar();});});}
    function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('input.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}
    function go(i){saveCurrent();current=i;renderQuestion();} function prevQ(){if(current>0)go(current-1);} function nextQ(){if(current<questions.length-1)go(current+1);} function toggleMark(){marked[current]=!marked[current];renderQuestion();} function markReviewNext(){marked[current]=true;if(current<questions.length-1)nextQ();else renderQuestion();} function clearResponse(){responses[current]=null;renderQuestion();}
    function isCorrect(q,ans){if(ans===null||ans==='')return null;if(qType(q)==='mcq')return Number(ans)===Number(q.answer);const accepted=(q.accepted&&q.accepted.length?q.accepted:[qAnswer(q)]).map(norm);return accepted.includes(norm(ans));}
    function showReviewForCurrent(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';host.scrollTop=0;if(r===null){note.className='answer-note muted';note.textContent='Unattempted. Correct answer: '+correctText(q);}else if(r){note.className='answer-note ok';note.textContent='Correct.';}else{note.className='answer-note bad';note.textContent='Wrong. Correct answer: '+correctText(q);} }
    function submitTest(auto=false){if(submitted)return;saveCurrent();if(!auto&&!confirm('Submit this test now? You will not be able to change responses afterward.'))return;submitted=true;let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++;});const score=c*3-w;resultBox.style.display='block';resultBox.innerHTML='<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>'+score+'</strong></div><div class="score-box">Correct<strong>'+c+'</strong></div><div class="score-box">Wrong<strong>'+w+'</strong></div><div class="score-box">Attempted<strong>'+(c+w)+'</strong></div><div class="score-box">Unattempted<strong>'+u+'</strong></div></div>';showReviewForCurrent();renderBar();resultBox.scrollIntoView({behavior:'smooth',block:'start'});}
    function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest(true);return;}secondsLeft--;}
    function calcEval(expr){if(!/^[0-9+\-*/().%\s]+$/.test(expr))return 'Error';return Function('return ('+expr.replace(/%/g,'/100')+')')();}
    function updateCalcSub(){document.getElementById('calcSubDisplay').textContent=document.getElementById('calcDisplay').value||'0';}
    document.querySelectorAll('[data-calc]').forEach(btn=>btn.addEventListener('click',()=>{const d=document.getElementById('calcDisplay'),v=btn.dataset.calc;if(['MC','MR','MS','M+','M-'].includes(v))return; if(v==='C')d.value='';else if(v==='B')d.value=d.value.slice(0,-1);else if(v==='+/-'){d.value=d.value.startsWith('-')?d.value.slice(1):('-'+d.value);}else if(v==='sqrt'){try{d.value=Math.sqrt(Number(calcEval(d.value||'0')));}catch(e){d.value='Error';}}else if(v==='1/x'){try{d.value=1/Number(calcEval(d.value||'0'));}catch(e){d.value='Error';}}else if(v==='='){try{d.value=calcEval(d.value);}catch(e){d.value='Error';}}else d.value+=v;updateCalcSub();}));
    const calcPopup=document.getElementById('calcPopup'), calcHandle=document.getElementById('calcDragHandle');
    document.getElementById('calcToggle').addEventListener('click',()=>{calcPopup.classList.toggle('open');if(calcPopup.classList.contains('open')&&!calcPopup.dataset.moved){calcPopup.style.left='52%';calcPopup.style.top='120px';}});
    document.getElementById('calcClose').addEventListener('pointerdown',e=>e.stopPropagation());
    document.getElementById('calcClose').addEventListener('click',e=>{e.stopPropagation();calcPopup.classList.remove('open');});
    let dragCalc=false, calcDx=0, calcDy=0;
    calcHandle.addEventListener('pointerdown',e=>{dragCalc=true;calcHandle.setPointerCapture(e.pointerId);const r=calcPopup.getBoundingClientRect();calcDx=e.clientX-r.left;calcDy=e.clientY-r.top;calcPopup.style.left=r.left+'px';calcPopup.style.top=r.top+'px';calcPopup.style.right='auto';calcPopup.dataset.moved='1';e.preventDefault();});
    calcHandle.addEventListener('pointermove',e=>{if(!dragCalc)return;const maxX=window.innerWidth-calcPopup.offsetWidth-4,maxY=window.innerHeight-calcPopup.offsetHeight-4;calcPopup.style.left=Math.max(4,Math.min(maxX,e.clientX-calcDx))+'px';calcPopup.style.top=Math.max(4,Math.min(maxY,e.clientY-calcDy))+'px';});
    calcHandle.addEventListener('pointerup',e=>{dragCalc=false;try{calcHandle.releasePointerCapture(e.pointerId);}catch(err){}});
    calcHandle.addEventListener('pointercancel',()=>{dragCalc=false;});
    renderQuestion();tick();setInterval(tick,1000);
  </script>
