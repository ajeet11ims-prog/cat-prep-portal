<script>const TITLE="LRDI CAT 2021 SLOT -2 Set -2",MINUTES=15,questions=[{"group":"set","q":"How many days between Sep 1 and Sep 14 (both inclusive) had no booking from this client considering all the above categories?","options":[],"type":"text","answer":"6","solution":"<p>The booking dates (left endpoints) appearing from Sep 1 to Sep 14 are Sep 1, 2, 3, 4, 5, 6, 7 and 13. Thus 8 of the 14 dates have a booking and 14 − 8 = 6 dates do not.</p><p><strong>Therefore, the answer is 6.</strong></p>"},{"group":"set","q":"What was the average processing time of all orders in the categories which had only one type of ship mode?","options":[],"type":"text","answer":"11","solution":"<p>Only Accessories and Envelopes use a single ship mode throughout. Their sole orders run from Sep 1 to Sep 19 (18 days) and Sep 3 to Sep 7 (4 days). The average is (18 + 4) / 2 = 11 days.</p><p><strong>Therefore, the answer is 11.</strong></p>"},{"group":"set","q":"The sequence of categories -- Art, Binders, Paper and Phones -- in decreasing order of average processing time of their orders in this period is:","options":["Art, Binders, Paper, Phones","Paper, Binders, Art, Phones","Phones, Binders, Art, Paper","Phones, Art, Binders, Paper"],"answer":"D","solution":"<div style=\"overflow-x:auto\"><table class=\"data-table\"><thead><tr><th>Category</th><th>Processing times</th><th>Average</th></tr></thead><tbody><tr><td>Art</td><td>2, 1, 2, 7, 8</td><td>4</td></tr><tr><td>Binders</td><td>1, 2, 1, 11</td><td>3.75</td></tr><tr><td>Paper</td><td>2, 3, 5</td><td>3.33</td></tr><tr><td>Phones</td><td>2, 1, 12</td><td>5</td></tr></tbody></table></div><p>Thus the decreasing order is Phones (5), Art (4), Binders (3.75), Paper (3.33).</p><p><strong>Therefore, the answer is Phones, Art, Binders, Paper.</strong></p>"},{"group":"set","q":"Approximately what percentage of orders had a processing time of one day during the period Sep 1 to Sep 22 (both dates inclusive)?","options":["16%","20%","25%","22%"],"answer":"B","solution":"<p>There are 35 bars, hence 35 orders. The one-day bars are: one in Art, two in Binders, one in Phones, two in Bookcases and one in Chairs. Therefore 7 of 35 orders took one day, i.e. 20%.</p><p><strong>Therefore, the answer is 20%.</strong></p>"}];

"630\" y2=\"552\" stroke=\"#d5dce2\" stroke-width=\"1\"/><line x1=\"670\" y1=\"44\" x2=\"670\" y2=\"552\" stroke=\"#d5dce2\" stroke-width=\"1\"/><line x1=\"710\" y1=\"44\" x2=\"710\" y2=\"552\" stroke=\"#d5dce2\" stroke-width=\"1\"/><line x1=\"750\" y1=\"44\" x2=\"750\" y2=\"552\" stroke=\"#d5dce2\" stroke-width=\"1\"/><line x1=\"790\" y1=\"44\" x2=\"790\" y2=\"552\" stroke=\"#d5dce2\" stroke-width=\"1\"/><line x1=\"830\" y1=\"44\" x2=\"830\" y2=\"552\" stroke=\"#d5dce2\" stroke-width=\"1\"/><line x1=\"870\" y1=\"44\" x2=\"870\" y2=\"552\" stroke=\"#d5dce2\" stroke-width=\"1\"/><line x1=\"910\" y1=\"44\" x2=\"910\" y2=\"552\" stroke=\"#d5dce2\" stroke-width=\"1\"/><line x1=\"950\" y1=\"44\" x2=\"950\" y2=\"552\" stroke=\"#d5dce2\" stroke-width=\"1\"/><line x1=\"990\" y1=\"44\" x2=\"990\" y2=\"552\" stroke=\"#d5dce2\" stroke-width=\"1\"/><line x1=\"1030\" y1=\"44\" x2=\"1030\" y2=\"552\" stroke=\"#d5dce2\" stroke-width=\"1\"/><text x=\"132\" y=\"82\" text-anchor=\"end\" font-size=\"15\" font-weight=\"600\">Art</text><rect x=\"150\" y=\"66\" width=\"80\" height=\"22\" fill=\"url(#standard)\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><rect x=\"230\" y=\"66\" width=\"40\" height=\"22\" fill=\"#111\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><rect x=\"270\" y=\"66\" width=\"80\" height=\"22\" fill=\"url(#first)\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><rect x=\"350\" y=\"66\" width=\"280\" height=\"22\" fill=\"#111\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><rect x=\"630\" y=\"66\" width=\"320\" height=\"22\" fill=\"url(#standard)\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><text x=\"132\" y=\"117\" text-anchor=\"end\" font-size=\"15\" font-weight=\"600\">Binders</text><rect x=\"150\" y=\"101\" width=\"40\" height=\"22\" fill=\"url(#standard)\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><rect x=\"190\" y=\"101\" width=\"80\" height=\"22\" fill=\"#111\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><rect x=\"270\" y=\"101\" width=\"40\" height=\"22\" fill=\"url(#first)\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><rect x=\"310\" y=\"101\" width=\"440\" height=\"22\" fill=\"#111\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><text x=\"132\" y=\"152\" text-anchor=\"end\" font-size=\"15\" font-weight=\"600\">Paper</text><rect x=\"190\" y=\"136\" width=\"80\" height=\"22\" fill=\"#111\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><rect x=\"270\" y=\"136\" width=\"120\" height=\"22\" fill=\"url(#first)\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><rect x=\"390\" y=\"136\" width=\"200\" height=\"22\" fill=\"#111\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><text x=\"132\" y=\"187\" text-anchor=\"end\" font-size=\"15\" font-weight=\"600\">Phones</text><rect x=\"190\" y=\"171\" width=\"80\" height=\"22\" fill=\"url(#standard)\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><rect x=\"270\" y=\"171\" width=\"40\" height=\"22\" fill=\"url(#first)\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><rect x=\"310\" y=\"171\" width=\"480\" height=\"22\" fill=\"url(#standard)\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><text x=\"132\" y=\"222\" text-anchor=\"end\" font-size=\"15\" font-weight=\"600\">Appliances</text><rect x=\"190\" y=\"206\" width=\"80\" height=\"22\" fill=\"#111\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><rect x=\"270\" y=\"206\" width=\"320\" height=\"22\" fill=\"url(#standard)\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><text x=\"132\" y=\"257\" text-anchor=\"end\" font-size=\"15\" font-weight=\"600\">Bookcases</text><rect x=\"230\" y=\"241\" width=\"40\" height=\"22\" fill=\"#111\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><rect x=\"270\" y=\"241\" width=\"80\" height=\"22\" fill=\"url(#first)\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><rect x=\"350\" y=\"241\" width=\"40\" height=\"22\" fill=\"#111\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><text x=\"132\" y=\"292\" text-anchor=\"end\" font-size=\"15\" font-weight=\"600\">Fasteners</text><rect x=\"190\" y=\"276\" width=\"80\" height=\"22\" fill=\"url(#standard)\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><rect x=\"270\" y=\"276\" width=\"80\" height=\"22\" fill=\"#111\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><rect x=\"350\" y=\"276\" width=\"80\" height=\"22\" fill=\"url(#standard)\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><text x=\"132\" y=\"327\" text-anchor=\"end\" font-size=\"15\" font-weight=\"600\">Furnishings</text><rect x=\"150\" y=\"311\" width=\"160\" height=\"22\" fill=\"#111\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><rect x=\"310\" y=\"311\" width=\"280\" height=\"22\" fill=\"url(#standard)\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><text x=\"132\" y=\"362\" text-anchor=\"end\" font-size=\"15\" font-weight=\"600\">Labels</text><rect x=\"190\" y=\"346\" width=\"80\" height=\"22\" fill=\"#111\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><rect x=\"270\" y=\"346\" width=\"320\" height=\"22\" fill=\"url(#standard)\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><text x=\"132\" y=\"397\" text-anchor=\"end\" font-size=\"15\" font-weight=\"600\">Tables</text><rect x=\"190\" y=\"381\" width=\"80\" height=\"22\" fill=\"url(#standard)\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><rect x=\"270\" y=\"381\" width=\"240\" height=\"22\" fill=\"#111\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><text x=\"132\" y=\"432\" text-anchor=\"end\" font-size=\"15\" font-weight=\"600\">Chairs</text><rect x=\"190\" y=\"416\" width=\"40\" height=\"22\" fill=\"url(#standard)\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><rect x=\"230\" y=\"416\" width=\"240\" height=\"22\" fill=\"#111\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><text x=\"132\" y=\"467\" text-anchor=\"end\" font-size=\"15\" font-weight=\"600\">Accessories</text><rect x=\"150\" y=\"451\" width=\"720\" height=\"22\" fill=\"url(#standard)\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><text x=\"132\" y=\"502\" text-anchor=\"end\" font-size=\"15\" font-weight=\"600\">Envelopes</text><rect x=\"230\" y=\"486\" width=\"160\" height=\"22\" fill=\"url(#standard)\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><text x=\"132\" y=\"537\" text-anchor=\"end\" font-size=\"15\" font-weight=\"600\">Storage</text><rect x=\"190\" y=\"521\" width=\"200\" height=\"22\" fill=\"#111\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><rect x=\"390\" y=\"521\" width=\"600\" height=\"22\" fill=\"url(#standard)\" stroke=\"#1f2933\" stroke-width=\"1.6\"/><line x1=\"150\" y1=\"552\" x2=\"1030\" y2=\"552\" stroke=\"#17212b\" stroke-width=\"2\"/><text x=\"150\" y=\"583\" text-anchor=\"middle\" font-size=\"14\">Sep 1</text><text x=\"230\" y=\"583\" text-anchor=\"middle\" font-size=\"14\">Sep 3</text><text x=\"310\" y=\"583\" text-anchor=\"middle\" font-size=\"14\">Sep 5</text><text x=\"390\" y=\"583\" text-anchor=\"middle\" font-size=\"14\">Sep 7</text><text x=\"470\" y=\"583\" text-anchor=\"middle\" font-size=\"14\">Sep 9</text><text x=\"550\" y=\"583\" text-anchor=\"middle\" font-size=\"14\">Sep 11</text><text x=\"630\" y=\"583\" text-anchor=\"middle\" font-size=\"14\">Sep 13</text><text x=\"710\" y=\"583\" text-anchor=\"middle\" font-size=\"14\">Sep 15</text><text x=\"790\" y=\"583\" text-anchor=\"middle\" font-size=\"14\">Sep 17</text><text x=\"870\" y=\"583\" text-anchor=\"middle\" font-size=\"14\">Sep 19</text><text x=\"950\" y=\"583\" text-anchor=\"middle\" font-size=\"14\">Sep 21</text><text x=\"1030\" y=\"583\" text-anchor=\"middle\" font-size=\"14\">Sep 23</text><g transform=\"translate(830 8)\"><rect x=\"0\" y=\"0\" width=\"27\" height=\"18\" fill=\"url(#first)\" stroke=\"#111\"/><text x=\"36\" y=\"14\" font-size=\"14\">First class</text><rect x=\"0\" y=\"24\" width=\"27\" height=\"18\" fill=\"#111\"/><text x=\"36\" y=\"38\" font-size=\"14\">Second class</text><rect x=\"0\" y=\"48\" width=\"27\" height=\"18\" fill=\"url(#standard)\" stroke=\"#111\"/><text x=\"36\" y=\"62\" font-size=\"14\">Standard class</text></g></svg></div><p>The different bars in the diagram above provide information about different orders in various categories (Art, Binders, ….) that were booked in the first two weeks of September of a store for one client. The colour and pattern of a bar denotes the ship mode (First Class / Second Class / Standard Class). The left end point of a bar indicates the booking day of the order, while the right end point indicates the dispatch day of the order.</p><p>The difference between the dispatch day and the booking day (measured in terms of the number of days) is called the processing time of the order. For the same category, an order is considered for booking only after the previous order of the same category is dispatched. No two consecutive orders of the same category had identical ship mode during this period.</p><p>For example, there were only two orders in the furnishing category during this period. The first one was shipped in the Second Class. It was booked on Sep 1 and dispatched on Sep 5. The second order was shipped in the Standard class. It was booked on Sep 5 (although the order might have been placed before that) and dispatched on Sep 12. So the processing times were 4 and 7 days respectively for these orders.</p>"};
const labels=Array.from({length:26},(_,i)=>String.fromCharCode(65+i));let current=0,submitted=false,secondsLeft=MINUTES*60,timerId=null;
const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false);
const host=document.getElementById("host"),qbar=document.getElementById("qbar"),result=document.getElementById("result");
function renderBar(){qbar.innerHTML=questions.map((_,i)=>`<button class="qdot ${i===current?"current":responses[i]!==null?"answered":""} ${marked[i]?"marked":""}" onclick="go(${i})">${i+1}</button>`).join("")}
function normalize(v){return String(v??"").replaceAll(",","").replace(/rs\.?/gi,"").replace(/%$/,"").replace(/\s+/g," ").trim().toLowerCase()}
function save(){if(submitted)return;const radio=host.querySelector('input[name="answer"]:checked'),typed=host.querySelector('input.typed-answer');if(radio)responses[current]=radio.value;else if(typed)responses[current]=typed.value.trim()||null}
function render(){const x=questions[current],commonText=passages[x.group]?`<div class="common-info">${passages[x.group]}</div>`:"",control=x.type==="text"?`<input class="typed-answer" name="answer" autocomplete="off" value="${responses[current]??""}" placeholder="Type your answer" ${submitted?"disabled":""}>`:`<div class="options">${x.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${labels[i]}" ${responses[current]===labels[i]?"checked":""} ${submitted?"disabled":""}><span>(${labels[i]}) ${o}</span></label>`).join("")}</div>`;host.innerHTML=`<section class="common-panel"><div class="block">${commonText}${charts[x.group]}<div id="solution" class="solution"><h3>Detailed Solution</h3>${x.solution}</div></div></section><section class="question-panel"><div class="qhead"><div><div class="qnum">Question ${current+1} of ${questions.length}</div><div class="source">${TITLE} | Source Q${current+1}</div></div></div><div class="question-body"><div class="qtext">${x.q}</div>${control}<div id="note" class="answer-note"></div></div><div class="navrow"><button class="mark-btn" onclick="markNext()">Mark for Review & Next</button><button class="clear-btn" onclick="clearResponse()" ${submitted?"disabled":""}>Clear Response</button><button class="previous-btn" onclick="go(${current-1})">Previous</button><button class="primary save-btn" onclick="next()">Save & Next</button></div></section>`;host.querySelectorAll('input[name="answer"]').forEach(el=>{el.addEventListener("change",()=>{responses[current]=el.value;renderBar()});el.addEventListener("input",()=>{responses[current]=el.value.trim()||null;renderBar()})});if(submitted)review();renderBar()}
function go(i){save();if(i<0||i>=questions.length)return;current=i;render();document.querySelector(".question-card").scrollTop=0}
function next(){save();go(Math.min(current+1,questions.length-1))}
function markNext(){save();marked[current]=true;go(Math.min(current+1,questions.length-1))}
function clearResponse(){if(submitted)return;responses[current]=null;render()}
function isCorrect(x,response){return x.type==="text"?normalize(response)===normalize(x.answer):response===x.answer}
function answerText(x){return x.type==="text"?x.answer:`(${x.answer})`}
function review(){const x=questions[current],note=document.getElementById("note");document.getElementById("solution").style.display="block";if(responses[current]===null){note.className="answer-note muted";note.textContent=`Unattempted. Correct answer: ${answerText(x)}`}else if(isCorrect(x,responses[current])){note.className="answer-note ok";note.textContent="Correct."}else{note.className="answer-note bad";note.textContent=`Wrong. Correct answer: ${answerText(x)}`}}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm("Submit this test now? You will not be able to change responses afterward."))return;submitted=true;clearInterval(timerId);let c=0,w=0,u=0;questions.forEach((x,i)=>{if(responses[i]===null)u++;else if(isCorrect(x,responses[i]))c++;else w++});const score=c*3-w;result.style.display="block";result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>${score}</strong></div><div class="score-box">Correct<strong>${c}</strong></div><div class="score-box">Wrong<strong>${w}</strong></div><div class="score-box">Attempted<strong>${c+w}</strong></div><div class="score-box">Unattempted<strong>${u}</strong></div></div>`;render();result.scrollIntoView({behavior:"smooth"})}
function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById("time").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(secondsLeft<=0){submitTest(true);return}secondsLeft--}
function calcEval(expr){if(!/^[0-9+\-*/().%\s]+$/.test(expr))return "Error";return Function("return ("+expr.replace(/%/g,"/100")+")")()}
function updateCalcSub(){document.getElementById("calcSubDisplay").textContent=document.getElementById("calcDisplay").value||"0"}
const calcPopup=document.getElementById("calcPopup"),calcHandle=document.getElementById("calcDragHandle"),calcClose=document.getElementById("calcClose");
function closeCalculator(e){if(e){e.preventDefault();e.stopPropagation()}dragCalc=false;calcPopup.classList.remove("open");calcPopup.hidden=true;calcPopup.setAttribute("aria-hidden","true")}
document.getElementById("calcToggle").onclick=()=>{if(calcPopup.classList.contains("open")){closeCalculator();return}calcPopup.hidden=false;calcPopup.setAttribute("aria-hidden","false");calcPopup.classList.add("open");if(!calcPopup.dataset.moved){calcPopup.style.left="52%";calcPopup.style.top="120px"}};
calcClose.addEventListener("pointerdown",closeCalculator);
calcClose.addEventListener("click",closeCalculator);
calcPopup.addEventListener("click",e=>{if(e.target.closest("#calcClose"))closeCalculator(e)},true);
document.querySelectorAll("[data-calc]").forEach(btn=>btn.onclick=()=>{const d=document.getElementById("calcDisplay"),v=btn.dataset.calc;if(["MC","MR","MS","M+","M-"].includes(v))return;if(v==="C")d.value="";else if(v==="B")d.value=d.value.slice(0,-1);else if(v==="+/-")d.value=d.value.startsWith("-")?d.value.slice(1):"-"+d.value;else if(v==="sqrt"){try{d.value=Math.sqrt(Number(calcEval(d.value||"0")))}catch{d.value="Error"}}else if(v==="1/x"){try{d.value=1/Number(calcEval(d.value||"0"))}catch{d.value="Error"}}else if(v==="="){try{d.value=calcEval(d.value)}catch{d.value="Error"}}else d.value+=v;updateCalcSub()});
let dragCalc=false,calcDx=0,calcDy=0;
calcHandle.onpointerdown=e=>{if(e.target.closest("#calcClose"))return;dragCalc=true;const r=calcPopup.getBoundingClientRect();calcDx=e.clientX-r.left;calcDy=e.clientY-r.top;calcPopup.style.left=r.left+"px";calcPopup.style.top=r.top+"px";calcPopup.style.right="auto";calcPopup.dataset.moved="1";e.preventDefault()};
document.addEventListener("pointermove",e=>{if(!dragCalc)return;const maxX=innerWidth-calcPopup.offsetWidth-4,maxY=innerHeight-calcPopup.offsetHeight-4;calcPopup.style.left=Math.max(4,Math.min(maxX,e.clientX-calcDx))+"px";calcPopup.style.top=Math.max(4,Math.min(maxY,e.clientY-calcDy))+"px"});
document.addEventListener("pointerup",()=>{dragCalc=false});
document.addEventListener("pointercancel",()=>{dragCalc=false});
render();tick();timerId=setInterval(tick,1000);
</script></body></html>
