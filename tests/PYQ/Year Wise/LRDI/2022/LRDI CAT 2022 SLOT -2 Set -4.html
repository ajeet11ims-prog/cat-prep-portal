<script>const TITLE="LRDI CAT 2022 SLOT -2 Set -4",MINUTES=15,questions=[{"group":"set","q":"Considering all three years, which company had the highest annual profit?","options":["Company C","Company B","Company A","Company D"],"answer":"A","solution":"<ol class=\"solution-steps\"><li><strong>Step 1:</strong> For every plotted point, profit = revenue − cost.</li><li><strong>Step 2:</strong> <div style=\"overflow-x:auto\"><table class=\"data-table\"><thead><tr><th>Company</th><th>2019 profit</th><th>2020 profit</th><th>2021 profit</th></tr></thead><tbody><tr><td>A</td><td>5</td><td>25</td><td>30</td></tr><tr><td>B</td><td>25</td><td>50</td><td>0</td></tr><tr><td>C</td><td>5</td><td>10</td><td>70</td></tr><tr><td>D</td><td>10</td><td>−30</td><td>0</td></tr></tbody></table></div></li><li><strong>Step 3:</strong> The largest value is Rs.70 crores for Company C in 2021.</li></ol><div class=\"final-answer\">Final Answer: Company C (A)</div>"},{"group":"set","q":"Which of the four companies experienced the highest annual loss in any of the years?","options":["Company D","Company C","Company A","Company B"],"answer":"A","solution":"<ol class=\"solution-steps\"><li><strong>Step 1:</strong> Compute revenue − cost for all plotted points.</li><li><strong>Step 2:</strong> <div style=\"overflow-x:auto\"><table class=\"data-table\"><thead><tr><th>Company</th><th>2019 profit</th><th>2020 profit</th><th>2021 profit</th></tr></thead><tbody><tr><td>A</td><td>5</td><td>25</td><td>30</td></tr><tr><td>B</td><td>25</td><td>50</td><td>0</td></tr><tr><td>C</td><td>5</td><td>10</td><td>70</td></tr><tr><td>D</td><td>10</td><td>−30</td><td>0</td></tr></tbody></table></div></li><li><strong>Step 3:</strong> The only negative value is Company D's 2020 profit: 20 − 50 = −30, i.e. a loss of Rs.30 crores. It is therefore the highest annual loss.</li></ol><div class=\"final-answer\">Final Answer: Company D (A)</div>"},{"group":"set","q":"The ratio of a company's annual profit to its annual costs is a measure of its performance. Which of the four companies had the lowest value of this ratio in 2019?","options":["Company A","Company B","Company C","Company D"],"answer":"A","solution":"<ol class=\"solution-steps\"><li><strong>Step 1:</strong> Using the 2019 plot: A has 5/85 ≈ 0.0588; B has 25/75 = 1/3; C has 5/20 = 0.25; D has 10/40 = 0.25.</li><li><strong>Step 2:</strong> The lowest ratio is Company A's 5/85.</li></ol><div class=\"final-answer\">Final Answer: Company A (A)</div>"},{"group":"set","q":"The total number of employees lost in 2019 and 2020 was the least for:","options":["Company A","Company C","Company B","Company D"],"answer":"C","solution":"<ol class=\"solution-steps\"><li><strong>Step 1:</strong> Employees lost during a year = strength at the start + new hires during the year − strength at the start of the next year.</li><li><strong>Step 2:</strong> <div style=\"overflow-x:auto\"><table class=\"data-table\"><thead><tr><th>Company</th><th>Lost in 2019</th><th>Lost in 2020</th><th>Two-year total</th></tr></thead><tbody><tr><td>A</td><td>150+20−140 = 30</td><td>140+35−150 = 25</td><td>55</td></tr><tr><td>B</td><td>210+35−240 = 5</td><td>240+45−250 = 35</td><td>40</td></tr><tr><td>C</td><td>310+45−320 = 35</td><td>320+40−330 = 30</td><td>65</td></tr><tr><td>D</td><td>400+30−410 = 20</td><td>410+35−400 = 45</td><td>65</td></tr></tbody></table></div></li><li><strong>Step 3:</strong> The least two-year total is 40 for Company B.</li></ol><div class=\"final-answer\">Final Answer: Company B (C)</div>"},{"group":"set","q":"Profit per employee is the ratio of a company's profit to its employee strength. For this purpose, the employee strength in a year is the average of the employee strength at the beginning of that year and the beginning of the next year. In 2020, which of the four companies had the highest profit per employee?","options":["Company B","Company A","Company D","Company C"],"answer":"A","solution":"<ol class=\"solution-steps\"><li><strong>Step 1:</strong> The 2020 average employee strengths are A=(140+150)/2=145, B=(240+250)/2=245, C=(320+330)/2=325, and D=(410+400)/2=405.</li><li><strong>Step 2:</strong> Using 2020 profits, profit per employee is A=25/145≈0.1724, B=50/245≈0.2041, C=10/325≈0.0308, and D=−30/405<0.</li><li><strong>Step 3:</strong> The highest value belongs to Company B.</li></ol><div class=\"final-answer\">Final Answer: Company B (A)</div>"}];

333\" class=\"label\">B (2021)</text><circle cx=\"723.3333333333334\" cy=\"328\" r=\"8\" fill=\"#64748b\" stroke=\"#334155\" stroke-width=\"1.5\"/><text x=\"735.3333333333334\" y=\"333\" class=\"label\">C (2021)</text><circle cx=\"533.3333333333334\" cy=\"172\" r=\"8\" fill=\"#64748b\" stroke=\"#334155\" stroke-width=\"1.5\"/><text x=\"545.3333333333334\" y=\"177\" class=\"label\">D (2021)</text><text x=\"470\" y=\"515\" class=\"al\" text-anchor=\"middle\">Revenue (in Rs. crores)</text><text x=\"24\" y=\"250\" class=\"al\" text-anchor=\"middle\" transform=\"rotate(-90 24 250)\">Costs (in Rs. crores)</text></svg></div><div class=\"chart-card\"><svg class=\"chart-svg\" viewBox=\"0 0 940 530\" role=\"img\" aria-label=\"Employee Strength and New Hires\"><defs><style>.grid{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 6}.axis{stroke:#111827;stroke-width:3}.tick{font:600 18px 'Segoe UI',Arial;fill:#334155}.label{font:700 16px 'Segoe UI',Arial;fill:#17212b}.ttl{font:800 24px 'Segoe UI',Arial;fill:#17212b}.al{font:700 20px 'Segoe UI',Arial;fill:#17212b}</style></defs><text x=\"470\" y=\"30\" class=\"ttl\" text-anchor=\"middle\">Employee Strength and New Hires</text><line x1=\"90\" y1=\"55\" x2=\"90\" y2=\"445\" class=\"grid\"/><text x=\"90\" y=\"475\" class=\"tick\" text-anchor=\"middle\">0</text><line x1=\"174.44444444444446\" y1=\"55\" x2=\"174.44444444444446\" y2=\"445\" class=\"grid\"/><text x=\"174.44444444444446\" y=\"475\" class=\"tick\" text-anchor=\"middle\">50</text><line x1=\"258.8888888888889\" y1=\"55\" x2=\"258.8888888888889\" y2=\"445\" class=\"grid\"/><text x=\"258.8888888888889\" y=\"475\" class=\"tick\" text-anchor=\"middle\">100</text><line x1=\"343.3333333333333\" y1=\"55\" x2=\"343.3333333333333\" y2=\"445\" class=\"grid\"/><text x=\"343.3333333333333\" y=\"475\" class=\"tick\" text-anchor=\"middle\">150</text><line x1=\"427.77777777777777\" y1=\"55\" x2=\"427.77777777777777\" y2=\"445\" class=\"grid\"/><text x=\"427.77777777777777\" y=\"475\" class=\"tick\" text-anchor=\"middle\">200</text><line x1=\"512.2222222222222\" y1=\"55\" x2=\"512.2222222222222\" y2=\"445\" class=\"grid\"/><text x=\"512.2222222222222\" y=\"475\" class=\"tick\" text-anchor=\"middle\">250</text><line x1=\"596.6666666666666\" y1=\"55\" x2=\"596.6666666666666\" y2=\"445\" class=\"grid\"/><text x=\"596.6666666666666\" y=\"475\" class=\"tick\" text-anchor=\"middle\">300</text><line x1=\"681.1111111111111\" y1=\"55\" x2=\"681.1111111111111\" y2=\"445\" class=\"grid\"/><text x=\"681.1111111111111\" y=\"475\" class=\"tick\" text-anchor=\"middle\">350</text><line x1=\"765.5555555555555\" y1=\"55\" x2=\"765.5555555555555\" y2=\"445\" class=\"grid\"/><text x=\"765.5555555555555\" y=\"475\" class=\"tick\" text-anchor=\"middle\">400</text><line x1=\"850\" y1=\"55\" x2=\"850\" y2=\"445\" class=\"grid\"/><text x=\"850\" y=\"475\" class=\"tick\" text-anchor=\"middle\">450</text><line x1=\"90\" y1=\"445\" x2=\"850\" y2=\"445\" class=\"grid\"/><text x=\"75\" y=\"452\" class=\"tick\" text-anchor=\"end\">0</text><line x1=\"90\" y1=\"367\" x2=\"850\" y2=\"367\" class=\"grid\"/><text x=\"75\" y=\"374\" class=\"tick\" text-anchor=\"end\">10</text><line x1=\"90\" y1=\"289\" x2=\"850\" y2=\"289\" class=\"grid\"/><text x=\"75\" y=\"296\" class=\"tick\" text-anchor=\"end\">20</text><line x1=\"90\" y1=\"211\" x2=\"850\" y2=\"211\" class=\"grid\"/><text x=\"75\" y=\"218\" class=\"tick\" text-anchor=\"end\">30</text><line x1=\"90\" y1=\"133\" x2=\"850\" y2=\"133\" class=\"grid\"/><text x=\"75\" y=\"140\" class=\"tick\" text-anchor=\"end\">40</text><line x1=\"90\" y1=\"55\" x2=\"850\" y2=\"55\" class=\"grid\"/><text x=\"75\" y=\"62\" class=\"tick\" text-anchor=\"end\">50</text><line x1=\"90\" y1=\"445\" x2=\"850\" y2=\"445\" class=\"axis\"/><line x1=\"90\" y1=\"55\" x2=\"90\" y2=\"445\" class=\"axis\"/><path d=\"M 343.3333333333333 280 l 9 17 h -18 z\" fill=\"#2563eb\"/><text x=\"355.3333333333333\" y=\"294\" class=\"label\">A (2019)</text><path d=\"M 444.6666666666667 163 l 9 17 h -18 z\" fill=\"#2563eb\"/><text x=\"456.6666666666667\" y=\"177\" class=\"label\">B (2019)</text><path d=\"M 613.5555555555555 85 l 9 17 h -18 z\" fill=\"#2563eb\"/><text x=\"625.5555555555555\" y=\"99\" class=\"label\">C (2019)</text><path d=\"M 765.5555555555555 202 l 9 17 h -18 z\" fill=\"#2563eb\"/><text x=\"777.5555555555555\" y=\"216\" class=\"label\">D (2019)</text><rect x=\"319.44444444444446\" y=\"165\" width=\"14\" height=\"14\" fill=\"#f97316\"/><text x=\"338.44444444444446\" y=\"177\" class=\"label\">A (2020)</text><rect x=\"488.3333333333333\" y=\"87\" width=\"14\" height=\"14\" fill=\"#f97316\"/><text x=\"507.3333333333333\" y=\"99\" class=\"label\">B (2020)</text><rect x=\"623.4444444444445\" y=\"126\" width=\"14\" height=\"14\" fill=\"#f97316\"/><text x=\"642.4444444444445\" y=\"138\" class=\"label\">C (2020)</text><rect x=\"775.4444444444445\" y=\"165\" width=\"14\" height=\"14\" fill=\"#f97316\"/><text x=\"794.4444444444445\" y=\"177\" class=\"label\">D (2020)</text><circle cx=\"343.3333333333333\" cy=\"250\" r=\"8\" fill=\"#64748b\" stroke=\"#334155\" stroke-width=\"1.5\"/><text x=\"355.3333333333333\" y=\"255\" class=\"label\">A (2021)</text><circle cx=\"512.2222222222222\" cy=\"211\" r=\"8\" fill=\"#64748b\" stroke=\"#334155\" stroke-width=\"1.5\"/><text x=\"524.2222222222222\" y=\"216\" class=\"label\">B (2021)</text><circle cx=\"647.3333333333333\" cy=\"172\" r=\"8\" fill=\"#64748b\" stroke=\"#334155\" stroke-width=\"1.5\"/><text x=\"659.3333333333333\" y=\"177\" class=\"label\">C (2021)</text><circle cx=\"765.5555555555555\" cy=\"133\" r=\"8\" fill=\"#64748b\" stroke=\"#334155\" stroke-width=\"1.5\"/><text x=\"777.5555555555555\" y=\"138\" class=\"label\">D (2021)</text><text x=\"470\" y=\"515\" class=\"al\" text-anchor=\"middle\">Employee strength</text><text x=\"24\" y=\"250\" class=\"al\" text-anchor=\"middle\" transform=\"rotate(-90 24 250)\">New hires</text></svg></div>"},passages={"set":"<p>The two plots below show data for four companies code-named A, B, C, and D over three years - 2019, 2020, and 2021.</p><p>The first plot shows the revenues and costs incurred by the companies during these years. For example, in 2021, company C earned Rs.100 crores in revenue and spent Rs.30 crores. The profit of a company is defined as its revenue minus its costs.</p><p>The second plot shows the number of employees employed by the company (employee strength) at the start of each of these three years, as well as the number of new employees hired each year (new hires). For example, Company B had 250 employees at the start of 2021, and 30 new employees joined the company during the year.</p>"};
const labels=Array.from({length:26},(_,i)=>String.fromCharCode(65+i));let current=0,submitted=false,secondsLeft=MINUTES*60,timerId=null;
const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false);
const host=document.getElementById("host"),qbar=document.getElementById("qbar"),result=document.getElementById("result");
function renderBar(){qbar.innerHTML=questions.map((_,i)=>`<button class="qdot ${i===current?"current":responses[i]!==null?"answered":""} ${marked[i]?"marked":""}" onclick="go(${i})">${i+1}</button>`).join("")}
function normalize(v){return String(v??"").replaceAll(",","").replace(/rs\.?/gi,"").replace(/%$/,"").replace(/\s+/g," ").trim().toLowerCase()}
function save(){if(submitted)return;const radio=host.querySelector('input[name="answer"]:checked'),typed=host.querySelector('input.typed-answer');if(radio)responses[current]=radio.value;else if(typed)responses[current]=typed.value.trim()||null}
function render(){const x=questions[current],commonText=passages[x.group]?`<div class="common-info">${passages[x.group]}</div>`:"",control=x.type==="text"?`<input class="typed-answer" name="answer" autocomplete="off" value="${responses[current]??""}" placeholder="Type your answer" ${submitted?"disabled":""}>`:`<div class="options">${x.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${labels[i]}" ${responses[current]===labels[i]?"checked":""} ${submitted?"disabled":""}><span>(${labels[i]}) ${o}</span></label>`).join("")}</div>`;host.innerHTML=`<section class="common-panel"><div class="block">${commonText}${charts[x.group]}<div id="solution" class="solution"><h3>Detailed Solution</h3>${x.solution}</div></div></section><section class="question-panel"><div class="qhead"><div><div class="qnum">Question ${current+1} of ${questions.length}</div><div class="source">${TITLE} | Source Q${current+1}</div></div></div><div class="question-body"><div class="qtext">${x.q}</div>${control}<div id="note" class="answer-note"></div></div><div class="navrow"><button class="mark-btn" onclick="markNext()">Mark for Review & Next</button><button class="clear-btn" onclick="clearResponse()" ${submitted?"disabled":""}>Clear Response</button><button class="previous-btn" onclick="go(${current-1})">Previous</button><button class="primary save-btn" onclick="next()">Save & Next</button></div></section>`;host.querySelectorAll('input[name="answer"]').forEach(el=>{el.addEventListener("change",()=>{responses[current]=el.value;renderBar()});el.addEventListener("input",()=>{responses[current]=el.value.trim()||null;renderBar()})});if(submitted)review();renderBar()}
function go(i){save();if(i<0||i>=questions.length)return;current=i;render();document.querySelector(".question-card").scrollTop=0}
function next(){save();go(Math.min(current+1,questions.length-1))}
function markNext(){save();marked[current]=true;go(Math.min(current+1,questions.length-1))}
function clearResponse(){if(submitted)return;responses[current]=null;render()}
function isCorrect(x,response){return x.type==="text"?normalize(response)===normalize(x.answer):response===x.answer}
function answerText(x){return x.type==="text"?x.answer:`(${x.answer})`}
function review(){const x=questions[current],note=document.getElementById("note");document.getElementById("solution").style.display="block";if(responses[current]===null){note.className="answer-note muted";note.textContent=`Unattempted. Correct answer: ${answerText(x)}`}else if(isCorrect(x,responses[current])){note.className="answer-note ok";note.textContent="Correct."}else{note.className="answer-note bad";note.textContent=`Wrong. Correct answer: ${answerText(x)}`}}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm("Submit this test now? You will not be able to change responses afterward."))return;submitted=true;clearInterval(timerId);let c=0,w=0,u=0;questions.forEach((x,i)=>{if(responses[i]===null)u++;else if(isCorrect(x,responses[i]))c++;else w++});const score=c*3-w;result.style.display="block";result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>${score}</strong></div><div class="score-box">Correct<strong>${c}</strong></div><div class="score-box">Wrong<strong>${w}</strong></div><div class="score-box">Attempted<strong>${c+w}</strong></div><div class="score-box">Unattempted<strong>${u}</strong></div></div>`;render();result.scrollIntoView({behavior:"smooth"})}
function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById("time").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(secondsLeft<=0){submitTest(true);return}secondsLeft--}
function calcEval(expr){if(!/^[0-9+\-*/().%\s]+$/.test(expr))return "Error";return Function("return ("+expr.replace(/%/g,"/100")+")")()}
function updateCalcSub(){document.getElementById("calcSubDisplay").textContent=document.getElementById("calcDisplay").value||"0"}
const calcPopup=document.getElementById("calcPopup"),calcHandle=document.getElementById("calcDragHandle"),calcClose=document.getElementById("calcClose");
function closeCalculator(e){if(e){e.preventDefault();e.stopPropagation()}dragCalc=false;calcPopup.classList.remove("open");calcPopup.hidden=true;calcPopup.setAttribute("aria-hidden","true")}
document.getElementById("calcToggle").onclick=()=>{if(calcPopup.classList.contains("open")){closeCalculator();return}calcPopup.hidden=false;calcPopup.setAttribute("aria-hidden","false");calcPopup.classList.add("open");if(!calcPopup.dataset.moved){calcPopup.style.left="52%";calcPopup.style.top="120px"}};
calcClose.addEventListener("pointerdown",closeCalculator);
calcClose.addEventListener("click",closeCalculator);
calcPopup.addEventListener("click",e=>{if(e.target.closest("#calcClose"))closeCalculator(e)},true);
document.querySelectorAll("[data-calc]").forEach(btn=>btn.onclick=()=>{const d=document.getElementById("calcDisplay"),v=btn.dataset.calc;if(["MC","MR","MS","M+","M-"].includes(v))return;if(v==="C")d.value="";else if(v==="B")d.value=d.value.slice(0,-1);else if(v==="+/-")d.value=d.value.startsWith("-")?d.value.slice(1):"-"+d.value;else if(v==="sqrt"){try{d.value=Math.sqrt(Number(calcEval(d.value||"0")))}catch{d.value="Error"}}else if(v==="1/x"){try{d.value=1/Number(calcEval(d.value||"0"))}catch{d.value="Error"}}else if(v==="="){try{d.value=calcEval(d.value)}catch{d.value="Error"}}else d.value+=v;updateCalcSub()});
let dragCalc=false,calcDx=0,calcDy=0;
calcHandle.onpointerdown=e=>{if(e.target.closest("#calcClose"))return;dragCalc=true;const r=calcPopup.getBoundingClientRect();calcDx=e.clientX-r.left;calcDy=e.clientY-r.top;calcPopup.style.left=r.left+"px";calcPopup.style.top=r.top+"px";calcPopup.style.right="auto";calcPopup.dataset.moved="1";e.preventDefault()};
document.addEventListener("pointermove",e=>{if(!dragCalc)return;const maxX=innerWidth-calcPopup.offsetWidth-4,maxY=innerHeight-calcPopup.offsetHeight-4;calcPopup.style.left=Math.max(4,Math.min(maxX,e.clientX-calcDx))+"px";calcPopup.style.top=Math.max(4,Math.min(maxY,e.clientY-calcDy))+"px"});
document.addEventListener("pointerup",()=>{dragCalc=false});
document.addEventListener("pointercancel",()=>{dragCalc=false});
render();tick();timerId=setInterval(tick,1000);
</script></body></html>
