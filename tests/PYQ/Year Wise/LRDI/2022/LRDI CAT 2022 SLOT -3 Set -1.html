<script>const TITLE="LRDI CAT 2022 SLOT -3 Set -1",MINUTES=15,questions=[{"group":"set","q":"How many students took AI?","options":["60","270","90","210"],"answer":"B","solution":"<ol class=\"solution-steps\"><li><strong>Step 1:</strong> Let the common number of non-CS failures in AI and ML be <em>x</em>. Their total, 2<em>x</em>, equals the number of CS students with C in ML. In the CS ML pass ratio 4:5:2, write A, B and C as 4<em>m</em>, 5<em>m</em> and 2<em>m</em>. Hence 2<em>x</em>=2<em>m</em>, so <em>x</em>=<em>m</em>.</li><li><strong>Step 2:</strong> The ratio of all non-CS failures to all CS failures is 3:1. CS students do not fail AI, so if CS failures in ML are <em>f</em>, then 2<em>m</em>:<em>f</em>=3:1, giving <em>f</em>=2<em>m</em>/3.</li><li><strong>Step 3:</strong> Thirty students failed ML: <em>m</em> non-CS students plus 2<em>m</em>/3 CS students. Thus 5<em>m</em>/3=30, so <em>m</em>=18 and <em>f</em>=12.</li><li><strong>Step 4:</strong> The number of CS students is 11<em>m</em>+<em>f</em>=198+12=210. The non-CS AI:ML ratio is 2:5 and their total is also 210, so 60 non-CS students took AI and 150 took ML.</li><li><strong>Step 5:</strong> CS grades in AI are in the ratio 3:5:2 and sum to 210, giving 63, 105 and 42. Applying the overall pass-grade conditions in AI and ML completes the table below.</li><li><strong>Step 6:</strong> <div style=\"overflow-x:auto\"><table class=\"data-table\"><thead><tr><th>Course / group</th><th>A</th><th>B</th><th>C</th><th>F</th><th>Total</th></tr></thead><tbody><tr><td>AI — CS</td><td>63</td><td>105</td><td>42</td><td>0</td><td>210</td></tr><tr><td>AI — non-CS</td><td>0</td><td>21</td><td>21</td><td>18</td><td>60</td></tr><tr><td>AI — all</td><td>63</td><td>126</td><td>63</td><td>18</td><td>270</td></tr><tr><td>ML — CS</td><td>72</td><td>90</td><td>36</td><td>12</td><td>210</td></tr><tr><td>ML — non-CS</td><td>27</td><td>75</td><td>30</td><td>18</td><td>150</td></tr><tr><td>ML — all</td><td>99</td><td>165</td><td>66</td><td>30</td><td>360</td></tr></tbody></table></div></li><li><strong>Step 7:</strong> AI was taken by all 210 CS students and 60 non-CS students, so 270 students took AI.</li></ol><div class=\"final-answer\">Final Answer: 270 (B)</div>"},{"group":"set","q":"How many CS students failed in ML?","type":"text","answer":"12","solution":"<ol class=\"solution-steps\"><li><strong>Step 1:</strong> Let the common number of non-CS failures in AI and ML be <em>x</em>. Their total, 2<em>x</em>, equals the number of CS students with C in ML. In the CS ML pass ratio 4:5:2, write A, B and C as 4<em>m</em>, 5<em>m</em> and 2<em>m</em>. Hence 2<em>x</em>=2<em>m</em>, so <em>x</em>=<em>m</em>.</li><li><strong>Step 2:</strong> The ratio of all non-CS failures to all CS failures is 3:1. CS students do not fail AI, so if CS failures in ML are <em>f</em>, then 2<em>m</em>:<em>f</em>=3:1, giving <em>f</em>=2<em>m</em>/3.</li><li><strong>Step 3:</strong> Thirty students failed ML: <em>m</em> non-CS students plus 2<em>m</em>/3 CS students. Thus 5<em>m</em>/3=30, so <em>m</em>=18 and <em>f</em>=12.</li><li><strong>Step 4:</strong> The number of CS students is 11<em>m</em>+<em>f</em>=198+12=210. The non-CS AI:ML ratio is 2:5 and their total is also 210, so 60 non-CS students took AI and 150 took ML.</li><li><strong>Step 5:</strong> CS grades in AI are in the ratio 3:5:2 and sum to 210, giving 63, 105 and 42. Applying the overall pass-grade conditions in AI and ML completes the table below.</li><li><strong>Step 6:</strong> <div style=\"overflow-x:auto\"><table class=\"data-table\"><thead><tr><th>Course / group</th><th>A</th><th>B</th><th>C</th><th>F</th><th>Total</th></tr></thead><tbody><tr><td>AI — CS</td><td>63</td><td>105</td><td>42</td><td>0</td><td>210</td></tr><tr><td>AI — non-CS</td><td>0</td><td>21</td><td>21</td><td>18</td><td>60</td></tr><tr><td>AI — all</td><td>63</td><td>126</td><td>63</td><td>18</td><td>270</td></tr><tr><td>ML — CS</td><td>72</td><td>90</td><td>36</td><td>12</td><td>210</td></tr><tr><td>ML — non-CS</td><td>27</td><td>75</td><td>30</td><td>18</td><td>150</td></tr><tr><td>ML — all</td><td>99</td><td>165</td><td>66</td><td>30</td><td>360</td></tr></tbody></table></div></li><li><strong>Step 7:</strong> The CS failure count in ML is <em>f</em>=12.</li></ol><div class=\"final-answer\">Final Answer: 12</div>"},{"group":"set","q":"How many non-CS students got A grade in ML?","type":"text","answer":"27","solution":"<ol class=\"solution-steps\"><li><strong>Step 1:</strong> Let the common number of non-CS failures in AI and ML be <em>x</em>. Their total, 2<em>x</em>, equals the number of CS students with C in ML. In the CS ML pass ratio 4:5:2, write A, B and C as 4<em>m</em>, 5<em>m</em> and 2<em>m</em>. Hence 2<em>x</em>=2<em>m</em>, so <em>x</em>=<em>m</em>.</li><li><strong>Step 2:</strong> The ratio of all non-CS failures to all CS failures is 3:1. CS students do not fail AI, so if CS failures in ML are <em>f</em>, then 2<em>m</em>:<em>f</em>=3:1, giving <em>f</em>=2<em>m</em>/3.</li><li><strong>Step 3:</strong> Thirty students failed ML: <em>m</em> non-CS students plus 2<em>m</em>/3 CS students. Thus 5<em>m</em>/3=30, so <em>m</em>=18 and <em>f</em>=12.</li><li><strong>Step 4:</strong> The number of CS students is 11<em>m</em>+<em>f</em>=198+12=210. The non-CS AI:ML ratio is 2:5 and their total is also 210, so 60 non-CS students took AI and 150 took ML.</li><li><strong>Step 5:</strong> CS grades in AI are in the ratio 3:5:2 and sum to 210, giving 63, 105 and 42. Applying the overall pass-grade conditions in AI and ML completes the table below.</li><li><strong>Step 6:</strong> <div style=\"overflow-x:auto\"><table class=\"data-table\"><thead><tr><th>Course / group</th><th>A</th><th>B</th><th>C</th><th>F</th><th>Total</th></tr></thead><tbody><tr><td>AI — CS</td><td>63</td><td>105</td><td>42</td><td>0</td><td>210</td></tr><tr><td>AI — non-CS</td><td>0</td><td>21</td><td>21</td><td>18</td><td>60</td></tr><tr><td>AI — all</td><td>63</td><td>126</td><td>63</td><td>18</td><td>270</td></tr><tr><td>ML — CS</td><td>72</td><td>90</td><td>36</td><td>12</td><td>210</td></tr><tr><td>ML — non-CS</td><td>27</td><td>75</td><td>30</td><td>18</td><td>150</td></tr><tr><td>ML — all</td><td>99</td><td>165</td><td>66</td><td>30</td><td>360</td></tr></tbody></table></div></li><li><strong>Step 7:</strong> Overall ML A grades total 99 and CS students account for 72 of them. Therefore non-CS A grades in ML = 99−72=27.</li></ol><div class=\"final-answer\">Final Answer: 27</div>"},{"group":"set","q":"How many students got A grade in AI?","options":["42","99","84","63"],"answer":"D","solution":"<ol class=\"solution-steps\"><li><strong>Step 1:</strong> Let the common number of non-CS failures in AI and ML be <em>x</em>. Their total, 2<em>x</em>, equals the number of CS students with C in ML. In the CS ML pass ratio 4:5:2, write A, B and C as 4<em>m</em>, 5<em>m</em> and 2<em>m</em>. Hence 2<em>x</em>=2<em>m</em>, so <em>x</em>=<em>m</em>.</li><li><strong>Step 2:</strong> The ratio of all non-CS failures to all CS failures is 3:1. CS students do not fail AI, so if CS failures in ML are <em>f</em>, then 2<em>m</em>:<em>f</em>=3:1, giving <em>f</em>=2<em>m</em>/3.</li><li><strong>Step 3:</strong> Thirty students failed ML: <em>m</em> non-CS students plus 2<em>m</em>/3 CS students. Thus 5<em>m</em>/3=30, so <em>m</em>=18 and <em>f</em>=12.</li><li><strong>Step 4:</strong> The number of CS students is 11<em>m</em>+<em>f</em>=198+12=210. The non-CS AI:ML ratio is 2:5 and their total is also 210, so 60 non-CS students took AI and 150 took ML.</li><li><strong>Step 5:</strong> CS grades in AI are in the ratio 3:5:2 and sum to 210, giving 63, 105 and 42. Applying the overall pass-grade conditions in AI and ML completes the table below.</li><li><strong>Step 6:</strong> <div style=\"overflow-x:auto\"><table class=\"data-table\"><thead><tr><th>Course / group</th><th>A</th><th>B</th><th>C</th><th>F</th><th>Total</th></tr></thead><tbody><tr><td>AI — CS</td><td>63</td><td>105</td><td>42</td><td>0</td><td>210</td></tr><tr><td>AI — non-CS</td><td>0</td><td>21</td><td>21</td><td>18</td><td>60</td></tr><tr><td>AI — all</td><td>63</td><td>126</td><td>63</td><td>18</td><td>270</td></tr><tr><td>ML — CS</td><td>72</td><td>90</td><td>36</td><td>12</td><td>210</td></tr><tr><td>ML — non-CS</td><td>27</td><td>75</td><td>30</td><td>18</td><td>150</td></tr><tr><td>ML — all</td><td>99</td><td>165</td><td>66</td><td>30</td><td>360</td></tr></tbody></table></div></li><li><strong>Step 7:</strong> No non-CS student got A in AI, while 63 CS students did. Hence the total is 63.</li></ol><div class=\"final-answer\">Final Answer: 63 (D)</div>"},{"group":"set","q":"How many non-CS students got B grade in ML?","options":["165","90","25","75"],"answer":"D","solution":"<ol class=\"solution-steps\"><li><strong>Step 1:</strong> Let the common number of non-CS failures in AI and ML be <em>x</em>. Their total, 2<em>x</em>, equals the number of CS students with C in ML. In the CS ML pass ratio 4:5:2, write A, B and C as 4<em>m</em>, 5<em>m</em> and 2<em>m</em>. Hence 2<em>x</em>=2<em>m</em>, so <em>x</em>=<em>m</em>.</li><li><strong>Step 2:</strong> The ratio of all non-CS failures to all CS failures is 3:1. CS students do not fail AI, so if CS failures in ML are <em>f</em>, then 2<em>m</em>:<em>f</em>=3:1, giving <em>f</em>=2<em>m</em>/3.</li><li><strong>Step 3:</strong> Thirty students failed ML: <em>m</em> non-CS students plus 2<em>m</em>/3 CS students. Thus 5<em>m</em>/3=30, so <em>m</em>=18 and <em>f</em>=12.</li><li><strong>Step 4:</strong> The number of CS students is 11<em>m</em>+<em>f</em>=198+12=210. The non-CS AI:ML ratio is 2:5 and their total is also 210, so 60 non-CS students took AI and 150 took ML.</li><li><strong>Step 5:</strong> CS grades in AI are in the ratio 3:5:2 and sum to 210, giving 63, 105 and 42. Applying the overall pass-grade conditions in AI and ML completes the table below.</li><li><strong>Step 6:</strong> <div style=\"overflow-x:auto\"><table class=\"data-table\"><thead><tr><th>Course / group</th><th>A</th><th>B</th><th>C</th><th>F</th><th>Total</th></tr></thead><tbody><tr><td>AI — CS</td><td>63</td><td>105</td><td>42</td><td>0</td><td>210</td></tr><tr><td>AI — non-CS</td><td>0</td><td>21</td><td>21</td><td>18</td><td>60</td></tr><tr><td>AI — all</td><td>63</td><td>126</td><td>63</td><td>18</td><td>270</td></tr><tr><td>ML — CS</td><td>72</td><td>90</td><td>36</td><td>12</td><td>210</td></tr><tr><td>ML — non-CS</td><td>27</td><td>75</td><td>30</td><td>18</td><td>150</td></tr><tr><td>ML — all</td><td>99</td><td>165</td><td>66</td><td>30</td><td>360</td></tr></tbody></table></div></li><li><strong>Step 7:</strong> ML has 165 B grades in total, of which 90 belong to CS students. Thus non-CS B grades =165−90=75.</li></ol><div class=\"final-answer\">Final Answer: 75 (D)</div>"}];
const charts={"set":""},passages={"set":"<p>All the first-year students in the computer science (CS) department in a university take both the courses (i) AI and (ii) ML. Students from other departments (non-CS students) can also take one of these two courses, but not both. Students who fail in a course get an F grade; others pass and are awarded A or B or C grades depending on their performance. The following are some additional facts about the number of students who took these two courses this year and the grades they obtained.</p><ol><li>The numbers of non-CS students who took AI and ML were in the ratio 2 : 5.</li><li>The number of non-CS students who took either AI or ML was equal to the number of CS students.</li><li>The numbers of non-CS students who failed in the two courses were the same and their total is equal to the number of CS students who got a C grade in ML.</li><li>In both the courses, 50% of the students who passed got a B grade. But, while the numbers of students who got A and C grades were the same for AI, they were in the ratio 3 : 2 for ML.</li><li>No CS student failed in AI, while no non-CS student got an A grade in AI.</li><li>The numbers of CS students who got A, B and C grades respectively in AI were in the ratio 3 : 5 : 2, while in ML the ratio was 4 : 5 : 2.</li><li>The ratio of the total number of non-CS students failing in one of the two courses to the number of CS students failing in one of the two courses was 3 : 1.</li><li>30 students failed in ML.</li></ol>"};
const labels=Array.from({length:26},(_,i)=>String.fromCharCode(65+i));let current=0,submitted=false,secondsLeft=MINUTES*60,timerId=null;
const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false);
const host=document.getElementById("host"),qbar=document.getElementById("qbar"),result=document.getElementById("result");
function renderBar(){qbar.innerHTML=questions.map((_,i)=>`<button class="qdot ${i===current?"current":responses[i]!==null?"answered":""} ${marked[i]?"marked":""}" onclick="go(${i})">${i+1}</button>`).join("")}
function normalize(v){return String(v??"").replaceAll(",","").replace(/rs\.?/gi,"").replace(/%$/,"").replace(/\s+/g," ").trim().toLowerCase()}
function save(){if(submitted)return;const radio=host.querySelector('input[name="answer"]:checked'),typed=host.querySelector('input.typed-answer');if(radio)responses[current]=radio.value;else if(typed)responses[current]=typed.value.trim()||null}
function render(){const x=questions[current],commonText=passages[x.group]?`<div class="common-info">${passages[x.group]}</div>`:"",control=x.type==="text"?`<input class="typed-answer" name="answer" autocomplete="off" value="${responses[current]??""}" placeholder="Type your answer" ${submitted?"disabled":""}>`:`<div class="options">${x.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${labels[i]}" ${responses[current]===labels[i]?"checked":""} ${submitted?"disabled":""}><span>(${labels[i]}) ${o}</span></label>`).join("")}</div>`;host.innerHTML=`<section class="common-panel"><div class="block">${commonText}${charts[x.group]}<div id="solution" class="solution"><h3>Detailed Solution</h3>${x.solution}</div></div></section><section class="question-panel"><div class="qhead"><div><div class="qnum">Question ${current+1} of ${questions.length}</div><div class="source">${TITLE} | Source Q${current+1}</div></div></div><div class="question-body"><div class="qtext">${x.q}</div>${control}<div id="note" class="answer-note"></div></div><div class="navrow"><button class="mark-btn" onclick="markNext()">Mark for Review & Next</button><button class="clear-btn" onclick="clearResponse()" ${submitted?"disabled":""}>Clear Response</button><button class="previous-btn" onclick="go(${current-1})">Previous</button><button class="primary save-btn" onclick="next()">Save & Next</button></div></section>`;host.querySelectorAll('input[name="answer"]').forEach(el=>{el.addEventListener("change",()=>{responses[current]=el.value;renderBar()});el.addEventListener("input",()=>{responses[current]=el.value.trim()||null;renderBar()})});if(submitted)review();renderBar()}
function go(i){save();if(i<0||i>=questions.length)return;current=i;render();document.querySelector(".question-card").scrollTop=0}
function next(){save();go(Math.min(current+1,questions.length-1))}
function markNext(){save();marked[current]=true;go(Math.min(current+1,questions.length-1))}
function clearResponse(){if(submitted)return;responses[current]=null;render()}
function isCorrect(x,response){return x.type==="text"?normalize(response)===normalize(x.answer):response===x.answer}
function answerText(x){return x.type==="text"?x.answer:`(${x.answer})`}
function review(){const x=questions[current],note=document.getElementById("note");document.getElementById("solution").style.display="block";if(responses[current]===null){note.className="answer-note muted";note.textContent=`Unattempted. Correct answer: ${answerText(x)}`}else if(isCorrect(x,responses[current])){note.className="answer-note ok";note.textContent="Correct."}else{note.className="answer-note bad";note.textContent=`Wrong. Correct answer: ${answerText(x)}`}}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm("Submit this test now? You will not be able to change responses afterward."))return;submitted=true;clearInterval(timerId);let c=0,w=0,u=0;questions.forEach((x,i)=>{if(responses[i]===null)u++;else if(isCorrect(x,responses[i]))c++;else w++});const score=c*3-w;result.style.display="block";result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>${score}</strong></div><div class="score-box">Correct<strong>${c}</strong></div><div class="score-box">Wrong<strong>${w}</strong></div><div class="score-box">Attempted<strong>${c+w}</strong></div><div class="score-box">Unattempted<strong>${u}</strong></div></div>`;render();result.scrollIntoView({behavior:"smooth"})}
function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById("time").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(secondsLeft<=0){submitTest(true);return}secondsLeft--}
function calcEval(expr){if(!/^[0-9+\-*/().%\s]+$/.test(expr))return "Error";return Function("return ("+expr.replace(/%/g,"/100")+")")()}
function updateCalcSub(){document.getElementById("calcSubDisplay").textContent=document.getElementById("calcDisplay").value||"0"}
const calcPopup=document.getElementById("calcPopup"),calcHandle=document.getElementById("calcDragHandle"),calcClose=document.getElementById("calcClose");
function closeCalculator(e){if(e){e.preventDefault();e.stopPropagation()}dragCalc=false;calcPopup.classList.remove("open");calcPopup.hidden=true;calcPopup.setAttribute("aria-hidden","true")}
document.getElementById("calcToggle").onclick=()=>{if(calcPopup.classList.contains("open")){closeCalculator();return}calcPopup.hidden=false;calcPopup.setAttribute("aria-hidden","false");calcPopup.classList.add("open");if(!calcPopup.dataset.moved){calcPopup.style.left="52%";calcPopup.style.top="120px"}};
calcClose.addEventListener("pointerdown",closeCalculator);
calcClose.addEventListener("click",closeCalculator);
calcPopup.addEventListener("click",e=>{if(e.target.closest("#calcClose"))closeCalculator(e)},true);
document.querySelectorAll("[data-calc]").forEach(btn=>btn.onclick=()=>{const d=document.getElementById("calcDisplay"),v=btn.dataset.calc;if(["MC","MR","MS","M+","M-"].includes(v))return;if(v==="C")d.value="";else if(v==="B")d.value=d.value.slice(0,-1);else if(v==="+/-")d.value=d.value.startsWith("-")?d.value.slice(1):"-"+d.value;else if(v==="sqrt"){try{d.value=Math.sqrt(Number(calcEval(d.value||"0")))}catch{d.value="Error"}}else if(v==="1/x"){try{d.value=1/Number(calcEval(d.value||"0"))}catch{d.value="Error"}}else if(v==="="){try{d.value=calcEval(d.value)}catch{d.value="Error"}}else d.value+=v;updateCalcSub()});
let dragCalc=false,calcDx=0,calcDy=0;
calcHandle.onpointerdown=e=>{if(e.target.closest("#calcClose"))return;dragCalc=true;const r=calcPopup.getBoundingClientRect();calcDx=e.clientX-r.left;calcDy=e.clientY-r.top;calcPopup.style.left=r.left+"px";calcPopup.style.top=r.top+"px";calcPopup.style.right="auto";calcPopup.dataset.moved="1";e.preventDefault()};
document.addEventListener("pointermove",e=>{if(!dragCalc)return;const maxX=innerWidth-calcPopup.offsetWidth-4,maxY=innerHeight-calcPopup.offsetHeight-4;calcPopup.style.left=Math.max(4,Math.min(maxX,e.clientX-calcDx))+"px";calcPopup.style.top=Math.max(4,Math.min(maxY,e.clientY-calcDy))+"px"});
document.addEventListener("pointerup",()=>{dragCalc=false});
document.addEventListener("pointercancel",()=>{dragCalc=false});
render();tick();timerId=setInterval(tick,1000);
</script></body></html>
