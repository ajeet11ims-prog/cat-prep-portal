 Banana.\n\nDirections for questions 13 to 16: Write your answer in\nthe input box provided below the question.", "question": "How many people are there in the colony?", "options": [], "answer": "441", "sourcePage": 1, "visual": ""}, {"number": 14, "type": "tita", "context": "Directions for questions 13 to 16: These questions are\nbased on the following information.\n\nThere are some people in a colony, each purchases one\nor more fruits among - Apples, Oranges and Bananas.\n\nThe number of people who purchase Apples, Oranges\nand Bananas are 183, 200 and 174, not necessarily in the\nsame order.\nIt is also known that\ni. The number of people who purchase all the three\nfruits is half the number of people who purchase\nexactly two fruits.\nii. The number of people who purchase only Apple is\nhalf the number of people who purchase Bananas.\niii. The number of people who purchase orange is thrice\nthe number of people who purchase exactly two\nfruits.\niv. The number of people who purchase only orange is\nfour more than the number of people who purchase\nonly Banana.\n\nDirections for questions 13 to 16: Write your answer in\nthe input box provided below the question.", "question": "What is the number of people who purchase Apple\nand Banana but not Orange?", "options": [], "answer": "42", "sourcePage": 2, "visual": ""}, {"number": 15, "type": "tita", "context": "Directions for questions 13 to 16: These questions are\nbased on the following information.\n\nThere are some people in a colony, each purchases one\nor more fruits among - Apples, Oranges and Bananas.\n\nThe number of people who purchase Apples, Oranges\nand Bananas are 183, 200 and 174, not necessarily in the\nsame order.\nIt is also known that\ni. The number of people who purchase all the three\nfruits is half the number of people who purchase\nexactly two fruits.\nii. The number of people who purchase only Apple is\nhalf the number of people who purchase Bananas.\niii. The number of people who purchase orange is thrice\nthe number of people who purchase exactly two\nfruits.\niv. The number of people who purchase only orange is\nfour more than the number of people who purchase\nonly Banana.\n\nDirections for questions 13 to 16: Write your answer in\nthe input box provided below the question.", "question": "What is the difference between the number of people\nwho purchase only Banana and the number of people\nwho purchase only Apple?", "options": [], "answer": "25", "sourcePage": 2, "visual": ""}, {"number": 16, "type": "tita", "context": "Directions for questions 13 to 16: These questions are\nbased on the following information.\n\nThere are some people in a colony, each purchases one\nor more fruits among - Apples, Oranges and Bananas.\n\nThe number of people who purchase Apples, Oranges\nand Bananas are 183, 200 and 174, not necessarily in the\nsame order.\nIt is also known that\ni. The number of people who purchase all the three\nfruits is half the number of people who purchase\nexactly two fruits.\nii. The number of people who purchase only Apple is\nhalf the number of people who purchase Bananas.\niii. The number of people who purchase orange is thrice\nthe number of people who purchase exactly two\nfruits.\niv. The number of people who purchase only orange is\nfour more than the number of people who purchase\nonly Banana.\n\nDirections for questions 13 to 16: Write your answer in\nthe input box provided below the question.", "question": "Among the people who purchase Apple, what is the\nnumber of people who purchase at least two fruits?", "options": [], "answer": "83", "sourcePage": 2, "visual": ""}, {"number": 17, "type": "mcq", "context": "Directions for questions 17 to 20: These questions are\nbased on the following information.\n\nFour friends Surya, Akhil, Guru and Sai are playing a\ngame where in each round the loser has to double the\nmoney of the other three from his share of money. They\nplayed a total of four rounds. Surya, Akhil, Guru and Sai\nlost i  with ₹24000.", "question": "What was the lowest amount (in ₹) which any of the\nfour had at any point of time in the game?", "options": ["3000", "2000", "4000", "2500"], "answer": "A", "sourcePage": 2, "visual": ""}, {"number": 21, "type": "mcq", "context": "Directions for questions 21 to 25: These questions are\nbased on the following information.\n\nIn a colony there are 25 houses A through Y and are\nconstructed in the following pattern i.e., in the form of a\n5 x 5 grid.\n\nThe houses in each row are of different heights among a,\nb, c, d and e and the houses in each column are of\ndifferent heights among a, b, c, d and e, are in the\ndecreasing order. From the top of any house, only the\nhouses in that column and in that row are visible.\nA house is visible from the top of another house, only if it\nis taller than the other and there is no obstacle (obstacle\nis a house taller than both the houses) in between them.\nIt is also known that,\n(i) Eight houses are visible from the top of the house F.\n(ii) Only 6 and 3 houses are visible from C and N\nrespectively.\n(iii) No house is visible from V.", "question": "Which of the following houses is of the height e?", "options": ["W", "Y", "Q", "Cannot be determined"], "answer": "C", "sourcePage": 2, "visual": "<figure class=\"native-visual\"><div class=\"house-grid\"><span>A<\/span><span>B<\/span><span>C<\/span><span>D<\/span><span>E<\/span><span>F<\/span><span>G<\/span><span>H<\/span><span>I<\/span><span>J<\/span><span>K<\/span><span>L<\/span><span>M<\/span><span>N<\/span><span>O<\/span><span>P<\/span><span>Q<\/span><span>R<\/span><span>S<\/span><span>T<\/span><span>U<\/span><span>V<\/span><span>W<\/span><span>X<\/span><span>Y<\/span><\/div><\/figure>"}, {"number": 22, "type": "mcq", "context": "Directions for questions 21 to 25: These questions are\nbased on the following information.\n\nIn a colony there are 25 houses A through Y and are\nconstructed in the following pattern i.e., in the form of a\n5 x 5 grid.\n\nThe houses in each row are of different heights among a,\nb, c, d and e and the houses in each column are of\ndifferent heights among a, b, c, d and e, are in the\ndecreasing order. From the top of any house, only the\nhouses in that column and in that row are visible.\nA house is visible from the top of another house, only if it\nis taller than the other and there is no obstacle (obstacle\nis a house taller than both the houses) in between them.\nIt is also known that,\n(i) Eight houses are visible from the top of the house F.\n(ii) Only 6 and 3 houses are visible from C and N\nrespectively.\n(iii) No house is visible from V.", "question": "What is the height of the house T?", "options": ["a", "b", "d", "c"], "answer": "C", "sourcePage": 2, "visual": "<figure class=\"native-visual\"><div class=\"house-grid\"><span>A<\/span><span>B<\/span><span>C<\/span><span>D<\/span><span>E<\/span><span>F<\/span><span>G<\/span><span>H<\/span><span>I<\/span><span>J<\/span><span>K<\/span><span>L<\/span><span>M<\/span><span>N<\/span><span>O<\/span><span>P<\/span><span>Q<\/span><span>R<\/span><span>S<\/span><span>T<\/span><span>U<\/span><span>V<\/span><span>W<\/span><span>X<\/span><span>Y<\/span><\/div><\/figure>"}, {"number": 23, "type": "mcq", "context": "Directions for questions 21 to 25: These questions are\nbased on the following information.\n\nIn a colony there are 25 houses A through Y and are\nconstructed in the following pattern i.e., in the form of a\n5 x 5 grid.\n\nThe houses in each row are of different heights among a,\nb, c, d and e and the houses in each column are of\ndifferent heights among a, b, c, d and e, are in the\ndecreasing order. From the top of any house, only the\nhouses in that column and in that row are visible.\nA house is visible from the top of another house, only if it\nis taller than the other and there is no obstacle (obstacle\nis a house taller than both the houses) in between them.\nIt is also known that,\n(i) Eight houses are visible from the top of the house F.\n(ii) Only 6 and 3 houses are visible from C and N\nrespectively.\n(iii) No house is visible from V.", "question": "How many houses can be seen from house Q?", "options": ["8", "6", "5", "7"], "answer": "C", "sourcePage": 2, "visual": "<figure class=\"native-visual\"><div class=\"house-grid\"><span>A<\/span><span>B<\/span><span>C<\/span><span>D<\/span><span>E<\/span><span>F<\/span><span>G<\/span><span>H<\/span><span>I<\/span><span>J<\/span><span>K<\/span><span>L<\/span><span>M<\/span><span>N<\/span><span>O<\/span><span>P<\/span><span>Q<\/span><span>R<\/span><span>S<\/span><span>T<\/span><span>U<\/span><span>V<\/span><span>W<\/span><span>X<\/span><span>Y<\/span><\/div><\/figure>"}, {"number": 24, "type": "mcq", "context": "Directions for questions 21 to 25: These questions are\nbased on the following information.\n\nIn a colony there are 25 houses A through Y and are\nconstructed in the following pattern i.e., in the form of a\n5 x 5 grid.\n\nThe houses in each row are of different heights among a,\nb, c, d and e and the houses in each column are of\ndifferent heights among a, b, c, d and e, are in the\ndecreasing order. From the top of any house, only the\nhouses in that column and in that row are visible.\nA house is visible from the top of another house, only if it\nis taller than the other and there is no obstacle (obstacle\nis a house taller than both the houses) in between them.\nIt is also known that,\n(i) Eight houses are visible from the top of the house F.\n(ii) Only 6 and 3 houses are visible from C and N\nrespectively.\n(iii) No house is visible from V.", "question": "Which of the following is the correct combination of\nthe house and the number of houses that can be\nvisible from that house?", "options": ["M-3", "S-2", "L-3", "H-3"], "answer": "D", "sourcePage": 2, "visual": "<figure class=\"native-visual\"><div class=\"house-grid\"><span>A<\/span><span>B<\/span><span>C<\/span><span>D<\/span><span>E<\/span><span>F<\/span><span>G<\/span><span>H<\/span><span>I<\/span><span>J<\/span><span>K<\/span><span>L<\/span><span>M<\/span><span>N<\/span><span>O<\/span><span>P<\/span><span>Q<\/span><span>R<\/span><span>S<\/span><span>T<\/span><span>U<\/span><span>V<\/span><span>W<\/span><span>X<\/span><span>Y<\/span><\/div><\/figure>"}, {"number": 25, "type": "mcq", "context": "Directions for questions 21 to 25: These questions are\nbased on the following information.\n\nIn a colony there are 25 houses A through Y and are\nconstructed in the following pattern i.e., in the form of a\n5 x 5 grid.\n\nThe houses in each row are of different heights among a,\nb, c, d and e and the houses in each column are of\ndifferent heights among a, b, c, d and e, are in the\ndecreasing order. From the top of any house, only the\nhouses in that column and in that row are visible.\nA house is visible from the top of another house, only if it\nis taller than the other and there is no obstacle (obstacle\nis a house taller than both the houses) in between them.\nIt is also known that,\n(i) Eight houses are visible from the top of the house F.\n(ii) Only 6 and 3 houses are visible from C and N\nrespectively.\n(iii) No house is visible from V.", "question": "What is the height of house E?", "options": ["a", "b", "c", "d"], "answer": "B", "sourcePage": 2, "visual": "<figure class=\"native-visual\"><div class=\"house-grid\"><span>A<\/span><span>B<\/span><span>C<\/span><span>D<\/span><span>E<\/span><span>F<\/span><span>G<\/span><span>H<\/span><span>I<\/span><span>J<\/span><span>K<\/span><span>L<\/span><span>M<\/span><span>N<\/span><span>O<\/span><span>P<\/span><span>Q<\/span><span>R<\/span><span>S<\/span><span>T<\/span><span>U<\/span><span>V<\/span><span>W<\/span><span>X<\/span><span>Y<\/span><\/div><\/figure>"}], "solutionPages": [1, 2]}</script><script>const data=JSON.parse(document.getElementById('testData').textContent);const labels=['A','B','C','D'];const answers=Array(25).fill(null),marked=Array(25).fill(false);let current=0,submitted=false,seconds=50*60,timerId=null;const host=document.getElementById('questionHost'),bar=document.getElementById('qbar'),result=document.getElementById('result');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function text(v){return esc(v).replace(/\n/g,'<br>')}
function formatStimulus(v){const marker=/^((?:\d+\.|\(\d+\)|\([a-z]\)|[ivx]+\.|•)\s*)(.*)$/i;return String(v??'').split(/\n{2,}/).map(raw=>raw.trim()).filter(Boolean).map(block=>{const lines=block.split('\n').map(line=>line.trim()).filter(Boolean);if(!lines.length)return'';if(/^Directions\s+for\s+/i.test(lines[0]))return `<p class="direction">${esc(lines.join(' '))}</p>`;const prose=[],items=[];let item=null;lines.forEach(line=>{const match=line.match(marker);if(match){if(item)items.push(item);item={marker:match[1].trim(),body:match[2]}}else if(item){item.body+=' '+line}else{prose.push(line)}});if(item)items.push(item);let out=prose.length?`<p>${esc(prose.join(' '))}</p>`:'';if(items.length)out+=`<div class="info-list">${items.map(x=>`<div class="info-item"><span class="info-marker">${esc(x.marker)}</span><span class="info-body">${esc(x.body)}</span></div>`).join('')}</div>`;return out||`<p>${esc(lines.join(' '))}</p>`}).join('')}
function renderBar(){bar.innerHTML=data.questions.map((q,i)=>`<button type="button" class="qbtn ${answers[i]!==null&&answers[i]!==''?'answered ':''}${marked[i]?'marked ':''}${i===current?'current ':''}" onclick="go(${i})">${i+1}</button>`).join('')}
function responseControl(q){if(q.type==='mcq')return `<div class="options">${q.options.map((op,i)=>`<label class="option"><input type="radio" name="answer" value="${labels[i]}" ${answers[current]===labels[i]?'checked':''} ${submitted?'disabled':''}><span>(${labels[i]}) ${text(op)}</span></label>`).join('')}</div>`;return `<div class="tita"><label for="titaInput">Type your answer:</label><input id="titaInput" inputmode="decimal" value="${esc(answers[current]??'')}" ${submitted?'disabled':''}></div>`}
function render(){const q=data.questions[current],stimulus=q.context?`<div class="stimulus-copy">${formatStimulus(q.context)}</div>`:`<div class="stimulus-copy"><p>Question information is shown here.</p></div>`,visual=q.visual||'';host.innerHTML=`<div class="test-content"><section class="stimulus-pane">${stimulus}${visual}</section><section class="response-pane"><div class="qhead"><div class="qnum">Question ${q.number} of 25</div><div class="qsource">LRDI Sectional Test ${data.exercise} | Source Q${q.number}</div></div><h2 class="question-title">${text(q.question)}</h2>${responseControl(q)}<div id="answerNote" class="answer-note"></div><details class="solution"><summary>Correct answer</summary><div class="answer-note ok">Correct answer: ${esc(q.answer)}</div></details></section></div><div class="navrow"><button type="button" onclick="markNext()">Mark for Review & Next</button><button type="button" onclick="clearResponse()" ${submitted?'disabled':''}>Clear Response</button><button type="button" class="save" onclick="next()">Save & Next</button></div>`;bind();if(submitted)review();renderBar()}
function bind(){host.querySelectorAll('input[name="answer"]').forEach(el=>el.addEventListener('change',()=>{answers[current]=el.value;renderBar()}));const t=document.getElementById('titaInput');if(t)t.addEventListener('input',()=>{answers[current]=t.value.trim();renderBar()})}
function save(){const t=document.getElementById('titaInput');if(t&&!submitted)answers[current]=t.value.trim();const r=host.querySelector('input[name="answer"]:checked');if(r&&!submitted)answers[current]=r.value}
function go(i){save();current=i;render();document.querySelector('.work').scrollTop=0}function next(){if(current<24)go(current+1);else render()}function markNext(){save();marked[current]=true;if(current<24)go(current+1);else render()}function clearResponse(){answers[current]=null;render()}
function correct(q,a){if(a===null||a==='')return null;if(q.type==='mcq')return a===q.answer;const norm=v=>String(v).trim().replace(/,/g,'');const x=Number(norm(a)),y=Number(norm(q.answer));return Number.isFinite(x)&&Number.isFinite(y)?Math.abs(x-y)<1e-9:norm(a)===norm(q.answer)}
function review(){const q=data.questions[current],status=correct(q,answers[current]),note=document.getElementById('answerNote');if(status===null){note.className='answer-note muted';note.textContent='Unattempted. Correct answer: '+q.answer}else if(status){note.className='answer-note ok';note.textContent='Correct.'}else{note.className='answer-note bad';note.textContent='Wrong. Correct answer: '+q.answer}}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm('Submit this sectional test now?'))return;submitted=true;clearInterval(timerId);document.body.classList.add('submitted');let c=0,w=0,u=0,score=0;data.questions.forEach((q,i)=>{const s=correct(q,answers[i]);if(s===null)u++;else if(s){c++;score+=3}else{w++;if(q.type==='mcq')score-=1}});result.style.display='block';result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score">Score<strong>${score}</strong></div><div class="score">Correct<strong>${c}</strong></div><div class="score">Wrong<strong>${w}</strong></div><div class="score">Attempted<strong>${c+w}</strong></div><div class="score">Unattempted<strong>${u}</strong></div></div>`;render();document.querySelector('.work').scrollTop=0}
function tick(){const m=Math.floor(seconds/60),s=seconds%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(seconds<=0){submitTest(true);return}seconds--}
const calc=document.getElementById('calc'),display=document.getElementById('calcDisplay');document.getElementById('calcToggle').onclick=()=>calc.classList.toggle('open');document.getElementById('calcClose').onclick=()=>calc.classList.remove('open');function evaluate(v){if(!/^[0-9+\-*/().%\s]+$/.test(v))throw Error();return Function('return ('+v.replace(/%/g,'/100')+')')()}document.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>{const v=b.dataset.calc;if(v==='C')display.value='';else if(v==='B')display.value=display.value.slice(0,-1);else if(v==='='){try{display.value=evaluate(display.value||'0')}catch(e){display.value='Error'}}else display.value+=v});window.go=go;window.next=next;window.markNext=markNext;window.clearResponse=clearResponse;window.submitTest=submitTest;render();tick();timerId=setInterval(tick,1000);</script></body></html>
