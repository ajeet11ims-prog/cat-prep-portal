<script id="testData" type="application/json">{"exercise": 9, "questions": [{"number": 1, "type": "tita", "context": "Directions for questions 1 to 4: These questions are\nbased on the following information.\n\nIn an exhibition a shopkeeper sells 3 different types of toys\n– Pokemon toy, Ben10 toy and Beyblade toy. A lot of\nchildren come and buy toys at his shop. The shopkeeper\nanalyses his business at the end of the day. 800 children\nvisited his shop to buy toys. 323 children bought Pokemon\ntoy, 439 bought the Ben10 toys and 412 bought Beyblade\ntoys. 91 children bought all 3 toys and 40 bought none of\nthe toys.", "question": "If the number of children who bought only Pokemon\ntoys and Beyblade toys is 84, then how many children\nbought only Ben10 toys?", "options": [], "answer": "200", "sourcePage": 18, "visual": ""}, {"number": 2, "type": "tita", "context": "Directions for questions 1 to 4: These questions are\nbased on the following information.\n\nIn an exhibition a shopkeeper sells 3 different types of toys\n– Pokemon toy, Ben10 toy and Beyblade toy. A lot of\nchildren come and buy toys at his shop. The shopkeeper\nanalyses his business at the end of the day. 800 children\nvisited his shop to buy toys. 323 children bought Pokemon\ntoy, 439 bought the Ben10 toys and 412 bought Beyblade\ntoys. 91 children bought all 3 toys and 40 bought none of\nthe toys.", "question": "If the number of children who bought only Pokemon\ntoys is 9 7 then how many children bought both\nBeyblade and Ben10 toys?", "options": [], "answer": "188", "sourcePage": 18, "visual": ""}, {"number": 3, "type": "tita", "context": "Directions for questions 1 to 4: These questions are\nbased on the following information.\n\nIn an exhibition a shopkeeper sells 3 different types of toys\n– Pokemon toy, Ben10 toy and Beyblade toy. A lot of\nchildren come and buy toys at his shop. The shopkeeper\nanalyses his business at the end of the day. 800 children\nvisited his shop to buy toys. 323 children bought Pokemon\ntoy, 439 bought the Ben10 toys and 412 bought Beyblade\ntoys. 91 children bought all 3 toys and 40 bought none of\nthe toys.", "question": "If the number of children who bought only Ben10 toys\nis more than those who bought only Beyblade toys\nwhich in turn is more than those who bought only\nPokemon toys, then what is the maximum possible\nnumber of children who bought only Ben10 and\nBeyblade toys?", "options": [], "answer": "144", "sourcePage": 18, "visual": ""}, {"number": 4, "type": "tita", "context": "Directions for questions 1 to 4: These questions are\nbased on the following information.\n\nIn an exhibition a shopkeeper sells 3 different types of toys\n– Pokemon toy, Ben10 toy and Beyblade toy. A lot of\nchildren come and buy toys at his shop. The shopkeeper\nanalyses his business at the end of the day. 800 children\nvisited his shop to buy toys. 323 children bought Pokemon\ntoy, 439 bought the Ben10 toys and 412 bought Beyblade\ntoys. 91 children bought all 3 toys and 40 bought none of\nthe toys.", "question": "By taking the conditions from previous question if the\nBen10 toys break, then minimum how many children\nhave no toys to play with?", "options": [], "answer": "187", "sourcePage": 18, "visual": ""}, {"number": 5, "type": "mcq", "context": "Directions for questions 5 to 8: These questions are\nbased on the following information.\n\nAn annual recruitment test which consists of three\nsections Numerics, Intelligence and Language, has\nsectional and final cut offs.\n\nA candidate is not allowed to appear for the test again, if:\n(a) The candidate qualifies in each of the three sections.\n\n(b) The candidate is not qualified in any of the three\nsections.\n(One is said to have qualified if he/she clears the\ncut-off)\nRavi, who belongs to one of the three categories:\ntruthteller (who always speaks truth), liar (who always lies)\nor an alternator (who alternates between truth and lies),\nhas made the following four statements in the same order,\nwhen asked about his result in the test.\n\nP: I did not clear the cut-off in Numerics section.\nQ: I did not clear the cut-off in Intelligence section.\nR: I did not clear the cut-off in Language section.\nS: I am eligible to appear for the exam again.", "question": "Which of the following is definitely true?", "options": ["Statement P is true.", "Ravi cannot be a liar.", "Statement S is true.", "Statement R is false."], "answer": "D", "sourcePage": 19, "visual": ""}, {"number": 6, "type": "mcq", "context": "Directions for questions 5 to 8: These questions are\nbased on the following information.\n\nAn annual recruitment test which consists of three\nsections Numerics, Intelligence and Language, has\nsectional and final cut offs.\n\nA candidate is not allowed to appear for the test again, if:\n(a) The candidate qualifies in each of the three sections.\n\n(b) The candidate is not qualified in any of the three\nsections.\n(One is said to have qualified if he/she clears the\ncut-off)\nRavi, who belongs to one of the three categories:\ntruthteller (who always speaks truth), liar (who always lies)\nor an alternator (who alternates between truth and lies),\nhas made the following four statements in the same order,\nwhen asked about his result in the test.\n\nP: I did not clear the cut-off in Numerics section.\nQ: I did not clear the cut-off in Intelligence section.\nR: I did not clear the cut-off in Language section.\nS: I am eligible to appear for the exam again.", "question": "Which of the following is not logical?", "options": ["If P is true, Q must be false.", "If Q is False, R must be false.", "If S is true, Q must be true.", "If Q is false, S must be false."], "answer": "A", "sourcePage": 19, "visual": ""}, {"number": 7, "type": "mcq", "context": "Directions for questions 5 to 8: These questions are\nbased on the following information.\n\nAn annual recruitment test which consists of three\nsections Numerics, Intelligence and Language, has\nsectional and final cut offs.\n\nA candidate is not allowed to appear for the test again, if:\n(a) The candidate qualifies in each of the three sections.\n\n(b) The candidate is not qualified in any of the three\nsections.\n(One is said to have qualified if he/she clears the\ncut-off)\nRavi, who belongs to one of the three categories:\ntruthteller (who always speaks truth), liar (who always lies)\nor an alternator (who alternates between truth and lies),\nhas made the following four statements in the same order,\nwhen asked about his result in the test.\n\nP: I did not clear the cut-off in Numerics section.\nQ: I did not clear the cut-off in Intelligence section.\nR: I did not clear the cut-off in Language section.\nS: I am eligible to appear for the exam again.", "question": "Assuming statement S to be true, which of the\nfollowing can be a statement that Ravi could have\nmade immediately before statement P?", "options": ["I cleared exactly one sections.", "I cleared exactly two sections.", "I cleared exactly three sections.", "More than one of the above is possible."], "answer": "B", "sourcePage": 19, "visual": ""}, {"number": 8, "type": "mcq", "context": "Directions for questions 5 to 8: These questions are\nbased on the following information.\n\nAn annual recruitment test which consists of three\nsections Numerics, Intelligence and Language, has\nsectional and final cut offs.\n\nA candidate is not allowed to appear for the test again, if:\n(a) The candidate qualifies in each of the three sections.\n\n(b) The candidate is not qualified in any of the three\nsections.\n(One is said to have qualified if he/she clears the\ncut-off)\nRavi, who belongs to one of the three categories:\ntruthteller (who always speaks truth), liar (who always lies)\nor an alternator (who alternates between truth and lies),\nhas made the following four statements in the same order,\nwhen asked about his result in the test.\n\nP: I did not clear the cut-off in Numerics section.\nQ: I did not clear the cut-off in Intelligence section.\nR: I did not clear the cut-off in Language section.\nS: I am eligible to appear for the exam again.", "question": "Assuming statement S to be true, Ravi belongs to\nwhich category?", "options": ["Alternator with first statement P being false", "Truth teller", "Alternator with first statement true", "Cannot be determined"], "answer": "A", "sourcePage": 19, "visual": ""}, {"number": 9, "type": "mcq", "context": "Directions for questions 9 to 12: These questions are\nbased on the following information.\n\nTen children A through J, among whom only A, B, C, D are\ngirls, are to be divided into three groups P, Q and R such\nthat each group has a girl and a total of at least three\nchildren. We know the following additional information.\n(i) If one of E, F and G is selected in group R, then the\nother two must be in that group.\n(ii) If F is in the same group as C, then D must be in that\ngroup. Neither C nor D can be with I.\n(iii) No two of G, H and I can be in the same group.\n(iv) Unless J is selected in group P, A cannot be selected\nin group R.\n(v) If and only if H is a member of group P then it has four\nchildren.\n(vi) The number of children in group Q cannot be more\nthan that in group R.\n(vii) A and H must be in the same group.", "question": "If F is selected in Q, then who must be selected in R?", "options": ["C", "I", "A", "H"], "answer": "B", "sourcePage": 19, "visual": ""}, {"number": 10, "type": "mcq", "context": "Directions for questions 9 to 12: These questions are\nbased on the following information.\n\nTen children A through J, among whom only A, B, C, D are\ngirls, are to be divided into three groups P, Q and R such\nthat each group has a girl and a total of at least three\nchildren. We know the following additional information.\n(i) If one of E, F and G is selected in group R, then the\nother two must be in that group.\n(ii) If F is in the same group as C, then D must be in that\ngroup. Neither C nor D can be with I.\n(iii) No two of G, H and I can be in the same group.\n(iv) Unless J is selected in group P, A cannot be selected\nin group R.\n(v) If and only if H is a member of group P then it has four\nchildren.\n(vi) The number of children in group Q cannot be more\nthan that in group R.\n(vii) A and H must be in the same group.", "question": "If C is selected in P, then who must be selected in Q?", "options": ["A", "B", "D", "E"], "answer": "C", "sourcePage": 19, "visual": ""}, {"number": 11, "type": "mcq", "context": "Directions for questions 9 to 12: These questions are\nbased on the following information.\n\nTen children A through J, among whom only A, B, C, D are\ngirls, are to be divided into three groups P, Q and R such\nthat each group has a girl and a total of at least three\nchildren. We know the following additional information.\n(i) If one of E, F and G is selected in group R, then the\nother two must be in that group.\n(ii) If F is in the same group as C, then D must be in that\ngroup. Neither C nor D can be with I.\n(iii) No two of G, H and I can be in the same group.\n(iv) Unless J is selected in group P, A cannot be selected\nin group R.\n(v) If and only if H is a member of group P then it has four\nchildren.\n(vi) The number of children in group Q cannot be more\nthan that in group R.\n(vii) A and H must be in the same group.", "question": "If B is selected in P, then in how many ways group Q\ncan be selected?", "options": ["3", "0", "2", "1"], "answer": "D", "sourcePage": 19, "visual": ""}, {"number": 12, "type": "mcq", "context": "Directions for questions 9 to 12: These questions are\nbased on the following information.\n\nTen children A through J, among whom only A, B, C, D are\ngirls, are to be divided into three groups P, Q and R such\nthat each group has a girl and a total of at least three\nchildren. We know the following additional information.\n(i) If one of E, F and G is selected in group R, then the\nother two must be in that group.\n(ii) If F is in the same group as C, then D must be in that\ngroup. Neither C nor D can be with I.\n(iii) No two of G, H and I can be in the same group.\n(iv) Unless J is selected in group P, A cannot be selected\nin group R.\n(v) If and only if H is a member of group P then it has four\nchildren.\n(vi) The number of children in group Q cannot be more\nthan that in group R.\n(vii) A and H must be in the same group.", "question": "If B is selected in R, then in how many ways group P\ncan be selected?", "options": ["5", "1", "4", "3"], "answer": "D", "sourcePage": 19, "visual": ""}, {"number": 13, "type": "mcq", "context": "Directions for questions 13 to 16: These questions are\nbased on the following information:\n\n(i) There are six godowns, three on either side of the\nroad, each storing paints of different colour.\n(ii) These godowns are labeled as P, Q, R, S, T and U.\n(iii) The godown stores different colours of paints, namely\nred, blue, green, orange, yellow and white.\n(iv) The godowns have different capacities.\n(v) T, the highest capacity godown, is exactly opposite\nthe godown containing red paint.\n(vi) The least capacity godown is exactly opposite the\ngodown that has green paint.\n(vii) U, the godown containing orange colour, is located\nbetween P and S.\n(viii) R, the godown containing yellow paint, is exactly\nopposite P.\n(ix) Q, the godown containing gre en paint, is exactly\nopposite U.\n(x) P, the godown containing white colour paint, has a\nhigher capacity than R, but less than S and Q.", "question": "What colour is stored in the godown that is diagonally\nopposite the godown storing yellow paint?", "options": ["White", "Red", "Green", "None of these"], "answer": "B", "sourcePage": 19, "visual": ""}, {"number": 14, "type": "mcq", "context": "Directions for questions 13 to 16: These questions are\nbased on the following information:\n\n(i) There are six godowns, three on either side of the\nroad, each storing paints of different colour.\n(ii) These godowns are labeled as P, Q, R, S, T and U.\n(iii) The godown stores different colours of paints, namely\nred, blue, green, orange, yellow and white.\n(iv) The godowns have different capacities.\n(v) T, the highest capacity godown, is exactly opposite\nthe godown containing red paint.\n(vi) The least capacity godown is exactly opposite the\ngodown that has green paint.\n(vii) U, the godown containing orange colour, is located\nbetween P and S.\n(viii) R, the godown containing yellow paint, is exactly\nopposite P.\n(ix) Q, the godown containing gre en paint, is exactly\nopposite U.\n(x) P, the godown containing white colour paint, has a\nhigher capacity than R, but less than S and Q.", "question": "Which is the second largest godown (based on\ncapacity)?", "options": ["P", "S", "Q", "Cannot be determined"], "answer": "D", "sourcePage": 19, "visual": ""}, {"number": 15, "type": "mcq", "context": "Directions for questions 13 to 16: These questions are\nbased on the following information:\n\n(i) There are six godowns, three on either side of the\nroad, each storing paints of different colour.\n(ii) These godowns are labeled as P, Q, R, S, T and U.\n(iii) The godown stores different colours of paints, namely\nred, blue, green, orange, yellow and white.\n(iv) The godowns have different capacities.\n(v) T, the highest capacity godown, is exactly opposite\nthe godown containing red paint.\n(vi) The least capacity godown is exactly opposite the\ngodown that has green paint.\n(vii) U, the godown containing orange colour, is located\nbetween P and S.\n(viii) R, the godown containing yellow paint, is exactly\nopposite P.\n(ix) Q, the godown containing gre en paint, is exactly\nopposite U.\n(x) P, the godown containing white colour paint, has a\nhigher capacity than R, but less than S and Q.", "question": "Which colour paint does the highest capacity godown\nhold?", "options": ["Red", "Blue", "Green", "Yellow"], "answer": "B", "sourcePage": 19, "visual": ""}, {"number": 16, "type": "mcq", "context": "Directions for questions 13 to 16: These questions are\nbased on the following information:\n\n(i) There are six godowns, three on either side of the\nroad, each storing paints of different colour.\n(ii) These godowns are labeled as P, Q, R, S, T and U.\n(iii) The godown stores different colours of paints, namely\nred, blue, green, orange, yellow and white.\n(iv) The godowns have different capacities.\n(v) T, the highest capacity godown, is exactly opposite\nthe godown containing red paint.\n(vi) The least capacity godown is exactly opposite the\ngodown that has green paint.\n(vii) U, the godown containing orange colour, is located\nbetween P and S.\n(viii) R, the godown containing yellow paint, is exactly\nopposite P.\n(ix) Q, the godown containing gre en paint, is exactly\nopposite U.\n(x) P, the godown containing white colour paint, has a\nhigher capacity than R, but less than S and Q.", "question": "The sum of capacities of the three godowns on either\nside follow the relation given below except", "options": ["Less than", "Greater than", "Equal to", "Both (A) and (B)"], "answer": "C", "sourcePage": 19, "visual": ""}, {"number": 17, "type": "tita", "context": "Directions for questions 17 to 20: These questions are\nbased on the information given below.\n\nThree persons Ram, Shyam and Mohan have ₹32,\n₹43 and ₹46 with them respectively. Each of them has\nonly coins of denominations – ₹1, ₹2, and ₹5. The number\nof coins with any of them of any denomination is a distinct\nsingle-digit natural number, i.e., these will be nine distinct\nsingle digit natural numbers for nine possible\ncombinations of persons and denominations. Further, the\nnumber of ₹2 coins with Ram is six less than the number\nof ₹1 coins Mohan has.", "question": "What is the difference between the number of ₹2 coins\nwith Ram and the number of ₹5 coins with Mohan?", "options": [], "answer": "2", "sourcePage": 19, "visual": ""}, {"number": 18, "type": "tita", "context": "Directions for questions 17 to 20: These questions are\nbased on the information given below.\n\nThree persons Ram, Shyam and Mohan have ₹32,\n₹43 and ₹46 with them respectively. Each of them has\nonly coins of denominations – ₹1, ₹2, and ₹5. The number\nof coins with any of them of any denomination is a distinct\nsingle-digit natural number, i.e., these will be nine distinct\nsingle digit natural numbers for nine possible\ncombinations of persons and denominations. Further, the\nnumber of ₹2 coins with Ram is six less than the number\nof ₹1 coins Mohan has.", "question": "How many ₹5 coins are there with Ram, Shyam and\nMohan altogether?", "options": [], "answer": "16", "sourcePage": 20, "visual": ""}, {"number": 19, "type": "tita", "context": "Directions for questions 17 to 20: These questions are\nbased on the information given below.\n\nThree persons Ram, Shyam and Mohan have ₹32,\n₹43 and ₹46 with them respectively. Each of them has\nonly coins of denominations – ₹1, ₹2, and ₹5. The number\nof coins with any of them of any denomination is a distinct\nsingle-digit natural number, i.e., these will be nine distinct\nsingle digit natural numbers for nine possible\ncombinations of persons and denominations. Further, the\nnumber of ₹2 coins with Ram is six less than the number\nof ₹1 coins Mohan has.", "question": "In total, how many coins are there with Shyam?", "options": [], "answer": "14", "sourcePage": 20, "visual": ""}, {"number": 20, "type": "tita", "context": "Directions for questions 17 to 20: These questions are\nbased on the information given below.\n\nThree persons Ram, Shyam and Mohan have ₹32,\n₹43 and ₹46 with them respectively. Each of them has\nonly coins of denominations – ₹1, ₹2, and ₹5. The number\nof coins with any of them of any denomination is a distinct\nsingle-digit natural number, i.e., these will be nine distinct\nsingle digit natural numbers for nine possible\ncombinations of persons and denominations. Further, the\nnumber of ₹2 coins with Ram is six less than the number\nof ₹1 coins Mohan has.", "question": "How many two rupees coins are there with Mohan?", "options": [], "answer": "9", "sourcePage": 20, "visual": ""}, {"number": 21, "type": "mcq", "context": "Directions for questions 21 to 25: These questions are\nbased on the following information.\n\nA boy has to select 4 keys from three boxes A, B and C.\nIt is known that Box A contains keys P, Q and R, Box B\ncontains keys S, T and U and Box C contains keys X, Y\nand Z. The boy must select at least one key from each\nbox. Further, it is known that,\n(i) If a key from box A is selected, then only one key from\nbox C is to be selected.\n(ii) If T is selected, then neither R nor Z is to be selected.\n(iii) Z and R cannot be selected together. Q and S must\nbe selected together.\n(iv) Y cannot be selected unless U is selected.\n(v) If P is selected, then X must not be selected.", "question": "Which among the following cannot be selected if R is\nselected?", "options": ["Q", "S", "U", "None of these"], "answer": "D", "sourcePage": 20, "visual": ""}, {"number": 22, "type": "mcq", "context": "Directions for questions 21 to 25: These questions are\nbased on the following information.\n\nA boy has to select 4 keys from three boxes A, B and C.\nIt is known that Box A contains keys P, Q and R, Box B\ncontains keys S, T and U and Box C contains keys X, Y\nand Z. The boy must select at least one key from each\nbox. Further, it is known that,\n(i) If a key from box A is selected, then only one key from\nbox C is to be selected.\n(ii) If T is selected, then neither R nor Z is to be selected.\n(iii) Z and R cannot be selected together. Q and S must\nbe selected together.\n(iv) Y cannot be selected unless U is selected.\n(v) If P is selected, then X must not be selected.", "question": "Which among the following must be selected, if Y\nand R together are selected?", "options": ["Q", "P", "Z", "S"], "answer": "B", "sourcePage": 20, "visual": ""}, {"number": 23, "type": "mcq", "context": "Directions for questions 21 to 25: These questions are\nbased on the following information.\n\nA boy has to select 4 keys from three boxes A, B and C.\nIt is known that Box A contains keys P, Q and R, Box B\ncontains keys S, T and U and Box C contains keys X, Y\nand Z. The boy must select at least one key from each\nbox. Further, it is known that,\n(i) If a key from box A is selected, then only one key from\nbox C is to be selected.\n(ii) If T is selected, then neither R nor Z is to be selected.\n(iii) Z and R cannot be selected together. Q and S must\nbe selected together.\n(iv) Y cannot be selected unless U is selected.\n(v) If P is selected, then X must not be selected.", "question": "In how many ways can the four keys be selected?", "options": ["Eight", "Ten", "Six", "Seven"], "answer": "B", "sourcePage": 20, "visual": ""}, {"number": 24, "type": "mcq", "context": "Directions for questions 21 to 25: These questions are\nbased on the following information.\n\nA boy has to select 4 keys from three boxes A, B and C.\nIt is known that Box A contains keys P, Q and R, Box B\ncontains keys S, T and U and Box C contains keys X, Y\nand Z. The boy must select at least one key from each\nbox. Further, it is known that,\n(i) If a key from box A is selected, then only one key from\nbox C is to be selected.\n(ii) If T is selected, then neither R nor Z is to be selected.\n(iii) Z and R cannot be selected together. Q and S must\nbe selected together.\n(iv) Y cannot be selected unless U is selected.\n(v) If P is selected, then X must not be selected.", "question": "Which among the following must be selected, if P and\nT together are selected?", "options": ["Q", "S", "U", "V"], "answer": "C", "sourcePage": 20, "visual": ""}, {"number": 25, "type": "mcq", "context": "Directions for questions 21 to 25: These questions are\nbased on the following information.\n\nA boy has to select 4 keys from three boxes A, B and C.\nIt is known that Box A contains keys P, Q and R, Box B\ncontains keys S, T and U and Box C contains keys X, Y\nand Z. The boy must select at least one key from each\nbox. Further, it is known that,\n(i) If a key from box A is selected, then only one key from\nbox C is to be selected.\n(ii) If T is selected, then neither R nor Z is to be selected.\n(iii) Z and R cannot be selected together. Q and S must\nbe selected together.\n(iv) Y cannot be selected unless U is selected.\n(v) If P is selected, then X must not be selected.", "question": "In how many ways the four keys can be selected, if T\nis not selected?", "options": ["10", "8", "6", "7"], "answer": "D", "sourcePage": 20, "visual": ""}], "solutionPages": [18, 19]}</script><script>const data=JSON.parse(document.getElementById('testData').textContent);const labels=['A','B','C','D'];const answers=Array(25).fill(null),marked=Array(25).fill(false);let current=0,submitted=false,seconds=50*60,timerId=null;const host=document.getElementById('questionHost'),bar=document.getElementById('qbar'),result=document.getElementById('result');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function text(v){return esc(v).replace(/\n/g,'<br>')}
function formatStimulus(v){const marker=/^((?:\d+\.|\(\d+\)|\([a-z]\)|[ivx]+\.|•)\s*)(.*)$/i;return String(v??'').split(/\n{2,}/).map(raw=>raw.trim()).filter(Boolean).map(block=>{const lines=block.split('\n').map(line=>line.trim()).filter(Boolean);if(!lines.length)return'';if(/^Directions\s+for\s+/i.test(lines[0]))return `<p class="direction">${esc(lines.join(' '))}</p>`;const prose=[],items=[];let item=null;lines.forEach(line=>{const match=line.match(marker);if(match){if(item)items.push(item);item={marker:match[1].trim(),body:match[2]}}else if(item){item.body+=' '+line}else{prose.push(line)}});if(item)items.push(item);let out=prose.length?`<p>${esc(prose.join(' '))}</p>`:'';if(items.length)out+=`<div class="info-list">${items.map(x=>`<div class="info-item"><span class="info-marker">${esc(x.marker)}</span><span class="info-body">${esc(x.body)}</span></div>`).join('')}</div>`;return out||`<p>${esc(lines.join(' '))}</p>`}).join('')}
function renderBar(){bar.innerHTML=data.questions.map((q,i)=>`<button type="button" class="qbtn ${answers[i]!==null&&answers[i]!==''?'answered ':''}${marked[i]?'marked ':''}${i===current?'current ':''}" onclick="go(${i})">${i+1}</button>`).join('')}
function responseControl(q){if(q.type==='mcq')return `<div class="options">${q.options.map((op,i)=>`<label class="option"><input type="radio" name="answer" value="${labels[i]}" ${answers[current]===labels[i]?'checked':''} ${submitted?'disabled':''}><span>(${labels[i]}) ${text(op)}</span></label>`).join('')}</div>`;return `<div class="tita"><label for="titaInput">Type your answer:</label><input id="titaInput" inputmode="decimal" value="${esc(answers[current]??'')}" ${submitted?'disabled':''}></div>`}
function render(){const q=data.questions[current],stimulus=q.context?`<div class="stimulus-copy">${formatStimulus(q.context)}</div>`:`<div class="stimulus-copy"><p>Question information is shown here.</p></div>`,visual=q.visual||'';host.innerHTML=`<div class="test-content"><section class="stimulus-pane">${stimulus}${visual}</section><section class="response-pane"><div class="qhead"><div class="qnum">Question ${q.number} of 25</div><div class="qsource">LRDI Sectional Test ${data.exercise} | Source Q${q.number}</div></div><h2 class="question-title">${text(q.question)}</h2>${responseControl(q)}<div id="answerNote" class="answer-note"></div><details class="solution"><summary>Correct answer</summary><div class="answer-note ok">Correct answer: ${esc(q.answer)}</div></details></section></div><div class="navrow"><button type="button" onclick="markNext()">Mark for Review & Next</button><button type="button" onclick="clearResponse()" ${submitted?'disabled':''}>Clear Response</button><button type="button" class="save" onclick="next()">Save & Next</button></div>`;bind();if(submitted)review();renderBar()}
function bind(){host.querySelectorAll('input[name="answer"]').forEach(el=>el.addEventListener('change',()=>{answers[current]=el.value;renderBar()}));const t=document.getElementById('titaInput');if(t)t.addEventListener('input',()=>{answers[current]=t.value.trim();renderBar()})}
function save(){const t=document.getElementById('titaInput');if(t&&!submitted)answers[current]=t.value.trim();const r=host.querySelector('input[name="answer"]:checked');if(r&&!submitted)answers[current]=r.value}
function go(i){save();current=i;render();document.querySelector('.work').scrollTop=0}function next(){if(current<24)go(current+1);else render()}function markNext(){save();marked[current]=true;if(current<24)go(current+1);else render()}function clearResponse(){answers[current]=null;render()}
function correct(q,a){if(a===null||a==='')return null;if(q.type==='mcq')return a===q.answer;const norm=v=>String(v).trim().replace(/,/g,'');const x=Number(norm(a)),y=Number(norm(q.answer));return Number.isFinite(x)&&Number.isFinite(y)?Math.abs(x-y)<1e-9:norm(a)===norm(q.answer)}
function review(){const q=data.questions[current],status=correct(q,answers[current]),note=document.getElementById('answerNote');if(status===null){note.className='answer-note muted';note.textContent='Unattempted. Correct answer: '+q.answer}else if(status){note.className='answer-note ok';note.textContent='Correct.'}else{note.className='answer-note bad';note.textContent='Wrong. Correct answer: '+q.answer}}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm('Submit this sectional test now?'))return;submitted=true;clearInterval(timerId);document.body.classList.add('submitted');let c=0,w=0,u=0,score=0;data.questions.forEach((q,i)=>{const s=correct(q,answers[i]);if(s===null)u++;else if(s){c++;score+=3}else{w++;if(q.type==='mcq')score-=1}});result.style.display='block';result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score">Score<strong>${score}</strong></div><div class="score">Correct<strong>${c}</strong></div><div class="score">Wrong<strong>${w}</strong></div><div class="score">Attempted<strong>${c+w}</strong></div><div class="score">Unattempted<strong>${u}</strong></div></div>`;render();document.querySelector('.work').scrollTop=0}
function tick(){const m=Math.floor(seconds/60),s=seconds%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(seconds<=0){submitTest(true);return}seconds--}
const calc=document.getElementById('calc'),display=document.getElementById('calcDisplay');document.getElementById('calcToggle').onclick=()=>calc.classList.toggle('open');document.getElementById('calcClose').onclick=()=>calc.classList.remove('open');function evaluate(v){if(!/^[0-9+\-*/().%\s]+$/.test(v))throw Error();return Function('return ('+v.replace(/%/g,'/100')+')')()}document.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>{const v=b.dataset.calc;if(v==='C')display.value='';else if(v==='B')display.value=display.value.slice(0,-1);else if(v==='='){try{display.value=evaluate(display.value||'0')}catch(e){display.value='Error'}}else display.value+=v});window.go=go;window.next=next;window.markNext=markNext;window.clearResponse=clearResponse;window.submitTest=submitTest;render();tick();timerId=setInterval(tick,1000);</script></body></html>
