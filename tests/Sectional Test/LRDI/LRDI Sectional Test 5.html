i) Neither Amrutha nor Chetan selects Yellow toy or\nBarbie.", "question": "Who selects Barbie?", "options": ["Amrutha", "Sathwik", "Chetan", "Rishitha"], "answer": "B", "sourcePage": 10, "visual": ""}, {"number": 15, "type": "mcq", "context": "Directions for questions 13 to 16: These questions are\nbased on the following information.\n\nThere is a group of five children Amrutha, Sathwik,\nAsresh, Chetan and Rishitha. Each of them selects a\ndifferent toy among Car, Truck, Barbie, Train and Bus,\neach of which is of a different colour among White, Red,\nBlue, Green and Yellow, but not necessarily in the same\norder.\n(i) Chetan selects either Car or White toy but not both.\n(ii) Rishitha selects Green toy.\n(iii) If Truck is Yellow in colour then it is selected by\nAmrutha.\n(iv) Asresh selects Train, which is in either Green colour\nor White colour.\n(v) Sathwik selects Car, if and only if it is Red in colour.\n(vi) Neither Amrutha nor Chetan selects Yellow toy or\nBarbie.", "question": "Which of the following combinations is correct?", "options": ["Amrutha-Yellow", "Asresh-White", "Chetan-Red", "Sathwik-Blue"], "answer": "B", "sourcePage": 10, "visual": ""}, {"number": 16, "type": "mcq", "context": "Directions for questions 13 to 16: These questions are\nbased on the following information.\n\nThere is a group of five children Amrutha, Sathwik,\nAsresh, Chetan and Rishitha. Each of them selects a\ndifferent toy among Car, Truck, Barbie, Train and Bus,\neach of which is of a different colour among White, Red,\nBlue, Green and Yellow, but not necessarily in the same\norder.\n(i) Chetan selects either Car or White toy but not both.\n(ii) Rishitha selects Green toy.\n(iii) If Truck is Yellow in colour then it is selected by\nAmrutha.\n(iv) Asresh selects Train, which is in either Green colour\nor White colour.\n(v) Sathwik selects Car, if and only if it is Red in colour.\n(vi) Neither Amrutha nor Chetan selects Yellow toy or\nBarbie.", "question": "Who selects Blue col EST CAPTAIN, three players\nwere awarded with less points than B. Under the head\n– BEST CAPTAIN, C is the only player who was\nawarded with one point less than E who is awarded\nwith one point less than only one player.\n(3) Under at least one head equal number of players\nwere awarded with more and less points than E. B’s\nrank is better than (numerically less than) that of three\nplayers.\n(4) Under BEST PLAYER, D got five points.", "question": "Who got the fifth rank?", "options": ["A", "C", "D", "F"], "answer": "B", "sourcePage": 11, "visual": ""}, {"number": 22, "type": "mcq", "context": "Directions for questions 21 to 25: These questions are\nbased on the information given below.\n\nA newspaper publication has invited SMSs in favour of\nany cricket player among A, B, C, D, E and F under two\nheads, BEST PLAYER and BEST CAPTAIN. Under each\nhead depending on the number of SMSs in favour of each\nplayer they were awarded points among 1 through 5.\nUnder each head, out of six players, two persons were\nawarded withequal points. Based on the sum of the points\nawarded under two heads the players are ranked such that\nthe player with the maximum points gets first rank and the\nplayer with the minimum points gets the fifth rank. Two of\nthe six players got the same rank.\n\nWe know the following additional information.\n(1) Under the head – BEST CAPTAIN, F is awarded with\nmore points than all other players and his overall\nranking is better than all other players. Under the\nhead – BEST PLAYER, A got the least points and the\nnumber of players who got more points than C is the\nsame as that who got less points than C.\n(2) Under the head – BEST CAPTAIN, three players\nwere awarded with less points than B. Under the head\n– BEST CAPTAIN, C is the only player who was\nawarded with one point less than E who is awarded\nwith one point less than only one player.\n(3) Under at least one head equal number of players\nwere awarded with more and less points than E. B’s\nra function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function text(v){return esc(v).replace(/\n/g,'<br>')}
function formatStimulus(v){const marker=/^((?:\d+\.|\(\d+\)|\([a-z]\)|[ivx]+\.|•)\s*)(.*)$/i;return String(v??'').split(/\n{2,}/).map(raw=>raw.trim()).filter(Boolean).map(block=>{const lines=block.split('\n').map(line=>line.trim()).filter(Boolean);if(!lines.length)return'';if(/^Directions\s+for\s+/i.test(lines[0]))return `<p class="direction">${esc(lines.join(' '))}</p>`;const prose=[],items=[];let item=null;lines.forEach(line=>{const match=line.match(marker);if(match){if(item)items.push(item);item={marker:match[1].trim(),body:match[2]}}else if(item){item.body+=' '+line}else{prose.push(line)}});if(item)items.push(item);let out=prose.length?`<p>${esc(prose.join(' '))}</p>`:'';if(items.length)out+=`<div class="info-list">${items.map(x=>`<div class="info-item"><span class="info-marker">${esc(x.marker)}</span><span class="info-body">${esc(x.body)}</span></div>`).join('')}</div>`;return out||`<p>${esc(lines.join(' '))}</p>`}).join('')}
function renderBar(){bar.innerHTML=data.questions.map((q,i)=>`<button type="button" class="qbtn ${answers[i]!==null&&answers[i]!==''?'answered ':''}${marked[i]?'marked ':''}${i===current?'current ':''}" onclick="go(${i})">${i+1}</button>`).join('')}
function responseControl(q){if(q.type==='mcq')return `<div class="options">${q.options.map((op,i)=>`<label class="option"><input type="radio" name="answer" value="${labels[i]}" ${answers[current]===labels[i]?'checked':''} ${submitted?'disabled':''}><span>(${labels[i]}) ${text(op)}</span></label>`).join('')}</div>`;return `<div class="tita"><label for="titaInput">Type your answer:</label><input id="titaInput" inputmode="decimal" value="${esc(answers[current]??'')}" ${submitted?'disabled':''}></div>`}
function render(){const q=data.questions[current],stimulus=q.context?`<div class="stimulus-copy">${formatStimulus(q.context)}</div>`:`<div class="stimulus-copy"><p>Question information is shown here.</p></div>`,visual=q.visual||'';host.innerHTML=`<div class="test-content"><section class="stimulus-pane">${stimulus}${visual}</section><section class="response-pane"><div class="qhead"><div class="qnum">Question ${q.number} of 25</div><div class="qsource">LRDI Sectional Test ${data.exercise} | Source Q${q.number}</div></div><h2 class="question-title">${text(q.question)}</h2>${responseControl(q)}<div id="answerNote" class="answer-note"></div><details class="solution"><summary>Correct answer</summary><div class="answer-note ok">Correct answer: ${esc(q.answer)}</div></details></section></div><div class="navrow"><button type="button" onclick="markNext()">Mark for Review & Next</button><button type="button" onclick="clearResponse()" ${submitted?'disabled':''}>Clear Response</button><button type="button" class="save" onclick="next()">Save & Next</button></div>`;bind();if(submitted)review();renderBar()}
function bind(){host.querySelectorAll('input[name="answer"]').forEach(el=>el.addEventListener('change',()=>{answers[current]=el.value;renderBar()}));const t=document.getElementById('titaInput');if(t)t.addEventListener('input',()=>{answers[current]=t.value.trim();renderBar()})}
function save(){const t=document.getElementById('titaInput');if(t&&!submitted)answers[current]=t.value.trim();const r=host.querySelector('input[name="answer"]:checked');if(r&&!submitted)answers[current]=r.value}
function go(i){save();current=i;render();document.querySelector('.work').scrollTop=0}function next(){if(current<24)go(current+1);else render()}function markNext(){save();marked[current]=true;if(current<24)go(current+1);else render()}function clearResponse(){answers[current]=null;render()}
function correct(q,a){if(a===null||a==='')return null;if(q.type==='mcq')return a===q.answer;const norm=v=>String(v).trim().replace(/,/g,'');const x=Number(norm(a)),y=Number(norm(q.answer));return Number.isFinite(x)&&Number.isFinite(y)?Math.abs(x-y)<1e-9:norm(a)===norm(q.answer)}
function review(){const q=data.questions[current],status=correct(q,answers[current]),note=document.getElementById('answerNote');if(status===null){note.className='answer-note muted';note.textContent='Unattempted. Correct answer: '+q.answer}else if(status){note.className='answer-note ok';note.textContent='Correct.'}else{note.className='answer-note bad';note.textContent='Wrong. Correct answer: '+q.answer}}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm('Submit this sectional test now?'))return;submitted=true;clearInterval(timerId);document.body.classList.add('submitted');let c=0,w=0,u=0,score=0;data.questions.forEach((q,i)=>{const s=correct(q,answers[i]);if(s===null)u++;else if(s){c++;score+=3}else{w++;if(q.type==='mcq')score-=1}});result.style.display='block';result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score">Score<strong>${score}</strong></div><div class="score">Correct<strong>${c}</strong></div><div class="score">Wrong<strong>${w}</strong></div><div class="score">Attempted<strong>${c+w}</strong></div><div class="score">Unattempted<strong>${u}</strong></div></div>`;render();document.querySelector('.work').scrollTop=0}
function tick(){const m=Math.floor(seconds/60),s=seconds%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(seconds<=0){submitTest(true);return}seconds--}
const calc=document.getElementById('calc'),display=document.getElementById('calcDisplay');document.getElementById('calcToggle').onclick=()=>calc.classList.toggle('open');document.getElementById('calcClose').onclick=()=>calc.classList.remove('open');function evaluate(v){if(!/^[0-9+\-*/().%\s]+$/.test(v))throw Error();return Function('return ('+v.replace(/%/g,'/100')+')')()}document.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>{const v=b.dataset.calc;if(v==='C')display.value='';else if(v==='B')display.value=display.value.slice(0,-1);else if(v==='='){try{display.value=evaluate(display.value||'0')}catch(e){display.value='Error'}}else display.value+=v});window.go=go;window.next=next;window.markNext=markNext;window.clearResponse=clearResponse;window.submitTest=submitTest;render();tick();timerId=setInterval(tick,1000);</script></body></html>
