</style></head><body><header><div class="topbar"><div class="title"><h1>QA Sectional Test - 1</h1><div class="meta">25 Questions | 50 Minutes | 20 MCQ + 5 TITA | +3 correct | -1 wrong MCQ | 0 wrong TITA</div></div><button aria-label="Open calculator" class="calc-toggle" id="calcToggle" type="button">▦</button><div class="timer">Time Left:<br/><span id="time">50:00</span></div></div></header><main><section class="work"><div class="result" id="result"></div><div class="question-host" id="questionHost"></div></section><aside class="side"><h2>Question Bar</h2><div class="qbar" id="qbar"></div><div class="legend"><span><i class="dot current"></i>Current</span><span><i class="dot answered"></i>Answered</span><span><i class="dot marked"></i>Marked</span></div><button class="side-submit" onclick="submitTest()" type="button">Submit</button></aside></main><aside class="calc" id="calc"><div class="calc-title"><span>Normal Calculator</span><span class="calc-title-actions"><button aria-label="Minimize calculator" id="calcMin" type="button">-</button><button aria-label="Close calculator" id="calcClose" type="button">×</button></span></div><input aria-label="Calculator expression" class="calc-display" id="calcDisplay" readonly=""/><div class="calc-result" id="calcResult">0</div><div class="calc-grid"><button class="" data-calc="MC" type="button">MC</button><button class="" data-calc="MR" type="button">MR</button><button class="" data-calc="MS" type="button">MS</button><button class="" data-calc="M+" type="button">M+</button><button class="" data-calc="M-" type="button">M-</button><button class="danger" data-calc="B" type="button">←</button><button class="danger" data-calc="C" type="button">C</button><button class="danger" data-calc="S" type="button">+/-</button><button class="" data-calc="Q" type="button">√</button><button class="" data-calc="P" type="button">%</button><button class="" data-calc="7" type="button">7</button><button class="" data-calc="8" type="button">8</button><button class="" data-calc="9" type="button">9</button><button class="" data-calc="/" type="button">/</button><button class="" data-calc="I" type="button">1/x</button><button class="" data-calc="4" type="button">4</button><button class="" data-calc="5" type="button">5</button><button class="" data-calc="6" type="button">6</button><button class="" data-calc="*" type="button">*</button><button class="eq" data-calc="=" type="button">=</button><button class="" data-calc="1" type="button">1</button><button class="" data-calc="2" type="button">2</button><button class="" data-calc="3" type="button">3</button><button class="" data-calc="-" type="button">-</button><button class="" data-calc="0" type="button">0</button><button class="" data-calc="." type="button">.</button><button class="" data-calc="+" type="button">+</button></div></aside><script id="testData" type="application/json">{"exercise":1,"part":1,"durationMinutes":50,"questions":[{"sourceNumber":1,"type":"mcq","context":"Directions for questions 1 and 2: These questions are based on the following data.\n\nRohan entered the “Good World Supermarket” to buy pens, pencils and erasers for his younger brothers and sisters. He bought at least 11 pieces of each of the items and more pens than pencils and more pencils than erasers. He bought a total of 38 pieces.","question":"How many erasers did Rohan buy?","options":["11","10","12","Cannot say"],"answer":"A","sourcePage":1,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let erasers = x, pencils = y and pens = z.</div><div class=\"eq-line\">x + y + z = 38, &nbsp; z &gt; y &gt; x, &nbsp; and x, y, z ≥ 11.</div><div class=\"eq-line\">Therefore x = 11 and y + z = 27.</div><div class=\"eq-line\">The possible pairs are (y, z) = (12, 15) or (13, 14).</div></div><div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Hence, the number of erasers is 11. &nbsp; <strong>Choice (A)</strong></div></div>","questionHtml":"How many erasers did Rohan buy?","optionsHtml":["11","10","12","Cannot say"],"questionNumber":1},{"sourceNumber":2,"type":"mcq","context":"Directions for questions 1 and 2: These questions are based on the following data.\n\nRohan entered the “Good World Supermarket” to buy pens, pencils and erasers for his younger brothers and sisters. He bought at least 11 pieces of each of the items and more pens than pencils and more pencils than erasers. He bought a total of 38 pieces.","question":"If the number of pencils cannot be divided equally among his four brothers, how many pens did he buy?","options":["12","11","15","14"],"answer":"D","sourcePage":1,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let erasers = x, pencils = y and pens = z.</div><div class=\"eq-line\">x + y + z = 38, &nbsp; z &gt; y &gt; x, &nbsp; and x, y, z ≥ 11.</div><div class=\"eq-line\">Therefore x = 11 and y + z = 27.</div><div class=\"eq-line\">The possible pairs are (y, z) = (12, 15) or (13, 14).</div></div><div class=\"math-solution standardized-solution\"><div class=\"eq-line\">The pencils cannot be divided equally among four brothers, so y ≠ 12.</div><div class=\"eq-line\">Thus y = 13 and z = 14. &nbsp; <strong>Choice (D)</strong></div></div>","questionHtml":"If the number of pencils cannot be divided equally among his four brothers, how many pens did he buy?","optionsHtml":["12","11","15","14"],"questionNumber":2},{"sourceNumber":3,"type":"mcq","context":"Directions for questions 3 and 4: These questions are based on the information given below.\n\nFour boys Anil, Bimal, Charan and Deepak were playing a game of luck. Each one started with an integral number of rupees and had an integral number of rupees after each round. Four rounds were played in the game and in each round there was a loser who gave a certain amount of money to the remaining three. In the first round Anil lost and gave to each of the others next to him two-thirds of what the others had at that time (i.e., he gave 2/3 of what Bimal had to Bimal, 2/3 of what Charan had to Charan, and 2/3 of what Deepak had to Deepak). Similarly, in the second round Bimal lost and gave to each of the others 2/3 of what he had. In the third round Charan lost and gave to each of the others half of what he had, and in the fourth round Deepak lost and gave to each of the others half of what he had. After the four rounds, each of them had the same amount (₹P).","question":"Find the minimum possible value that P can take.","options":["180","240","225","450"],"answer":"C","sourcePage":1,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">For a two-thirds round, a balance x becomes x + <span class=\"frac\"><span>2</span><span>3</span></span>x = <span class=\"frac\"><span>5</span><span>3</span></span>x; reversing it multiplies the final balance by <span class=\"frac\"><span>3</span><span>5</span></span>.</div><div class=\"eq-line\">For a half round, a balance y becomes y + <span class=\"frac\"><span>1</span><span>2</span></span>y = <span class=\"frac\"><span>3</span><span>2</span></span>y; reversing it multiplies the final balance by <span class=\"frac\"><span>2</span><span>3</span></span>.</div><div class=\"eq-line\">To keep every intermediate balance integral, P must be divisible by 5² and 3².</div><div class=\"eq-line\">P = 5² × 3² × k = 225k.</div></div><div class=\"table-scroll\"><table class=\"native-table\"><thead><tr><th>Stage</th><th>Anil</th><th>Bimal</th><th>Charan</th><th>Deepak</th></tr></thead><tbody><tr><td>Before round I</td><td>396k</td><td>252k</td><td>144k</td><td>108k</td></tr><tr><td>After round I</td><td>60k</td><td>420k</td><td>240k</td><td>180k</td></tr><tr><td>After round II</td><td>100k</td><td>100k</td><td>400k</td><td>300k</td></tr><tr><td>After round III</td><td>150k</td><td>150k</td><td>150k</td><td>450k</td></tr><tr><td>After round IV</td><td>225k</td><td>225k</td><td>225k</td><td>225k</td></tr></tbody></table></div><div class=\"math-solution standardized-solution\"><div class=\"eq-line\">The least value occurs at k = 1, so P = 225. &nbsp; <strong>Choice (C)</strong></div></div>","questionHtml":"Find the minimum possible value that P can take.","optionsHtml":["180","240","225","450"],"questionNumber":3},{"sourceNumber":4,"type":"mcq","context":"Directions for questions 3 and 4: These questions are based on the information given below.\n\nFour boys Anil, Bimal, Charan and Deepak were playing a game of luck. Each one started with an integral number of rupees and had an integral number of rupees after each round. Four rounds were played in the game and in each round there was a loser who gave a certain amount of money to the remaining three. In the first round Anil lost and gave to each of the others next to him two-thirds of what the others had at that time (i.e., he gave 2/3 of what Bimal had to Bimal, 2/3 of what Charan had to Charan, and 2/3 of what Deepak had to Deepak). Similarly, in the second round Bimal lost and gave to each of the others 2/3 of what he had. In the third round Charan lost and gave to each of the others half of what he had, and in the fourth round Deepak lost and gave to each of the others half of what he had. After the four rounds, each of them had the same amount (₹P).","question":"The total amount with a person at the end of each round will alternately increase and decrease or decrease and increase for which of the following?","options":["Anil","Bimal","Charan","None of these"],"answer":"D","sourcePage":1,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"table-scroll\"><table class=\"native-table\"><thead><tr><th>Stage</th><th>Anil</th><th>Bimal</th><th>Charan</th><th>Deepak</th></tr></thead><tbody><tr><td>Before round I</td><td>396k</td><td>252k</td><td>144k</td><td>108k</td></tr><tr><td>After round I</td><td>60k</td><td>420k</td><td>240k</td><td>180k</td></tr><tr><td>After round II</td><td>100k</td><td>100k</td><td>400k</td><td>300k</td></tr><tr><td>After round III</td><td>150k</td><td>150k</td><td>150k</td><td>450k</td></tr><tr><td>After round IV</td><td>225k</td><td>225k</td><td>225k</td><td>225k</td></tr></tbody></table></div><div class=\"math-solution standardized-solution\"><div class=\"eq-line\">The balance table shows that each person has exactly one decrease and three increases.</div><div class=\"eq-line\">Therefore no person’s balance alternates increase/decrease throughout the rounds.</div><div class=\"eq-line\"><strong>None of these — Choice (D)</strong></div></div>","questionHtml":"The total amount with a person at the end of each round will alternately increase and decrease or decrease and increase for which of the following?","optionsHtml":["Anil","Bimal","Charan","None of these"],"questionNumber":4},{"sourceNumber":5,"type":"mcq","context":"Directions for questions 5 and 6: These questions are based on the following data.\n\nSeth Heeramal priced his diamond necklaces such that the cost of each necklace (in ₹) varied as the square of the number of diamonds in it. A necklace with 8 diamonds costs ₹1,60,000.","question":"What would be the price of a necklace with 10 diamonds?","options":["₹1,75,000","₹2,25,000","₹2,50,000","₹4,00,000"],"answer":"C","sourcePage":1,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let C = kn², where n is the number of diamonds.</div><div class=\"eq-line\">1,60,000 = k(8²) ⇒ k = 2,500.</div><div class=\"eq-line\">For 10 diamonds: C = 2,500(10²) = ₹2,50,000.</div><div class=\"eq-line\"><strong>Choice (C)</strong></div></div>","questionHtml":"What would be the price of a necklace with 10 diamonds?","optionsHtml":["₹1,75,000","₹2,25,000","₹2,50,000","₹4,00,000"],"questionNumber":5},{"sourceNumber":6,"type":"mcq","context":"Directions for questions 5 and 6: These questions are based on the following data.\n\nSeth Heeramal priced his diamond necklaces such that the cost of each necklace (in ₹) varied as the square of the number of diamonds in it. A necklace with 8 diamonds costs ₹1,60,000.","question":"Mr. Sharma asked for 3 necklaces to be made out of the diamonds in a necklace by dividing the diamonds in the ratio 5 : 3 : 2. If the 3 smaller necklaces are priced using the same formula, what is the percentage loss that Seth Heeramal would incur if he has to oblige Mr. Sharma?","options":["22%","38%","62%","78%"],"answer":"C","sourcePage":1,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Original value = 2,500(10²).</div><div class=\"eq-line\">Combined value after division = 2,500(5² + 3² + 2²).</div><div class=\"eq-line\">Percentage loss = <span class=\"frac\"><span>2,500[10² − (5² + 3² + 2²)]</span><span>2,500 × 10²</span></span> × 100%.</div><div class=\"eq-line\">= 62%. &nbsp; <strong>Choice (C)</strong></div></div>","questionHtml":"Mr. Sharma asked for 3 necklaces to be made out of the diamonds in a necklace by dividing the diamonds in the ratio 5 : 3 : 2. If the 3 smaller necklaces are priced using the same formula, what is the percentage loss that Seth Heeramal would incur if he has to oblige Mr. Sharma?","optionsHtml":["22%","38%","62%","78%"],"questionNumber":6},{"sourceNumber":7,"type":"mcq","context":"Directions for questions 7 and 8: These questions are based on the following data.\n\nSmitha attempts all the questions in a management entrance test which has questions of three levels of difficulty—A, B and C. For the questions of various difficulty levels, the marks awarded for answering the questions correctly and those deducted for answering the questions incorrectly are as follows:\n\nThere is no penalty for unanswered questions.","question":"If Smitha gets a total of 60 marks across all the sections and she answered 40 questions of level C difficulty correctly, what is the maximum number of questions she could have answered incorrectly across all the sections?","options":["74","116","108","102"],"answer":"B","sourcePage":1,"visual":"<figure class=\"native-visual\"><div class=\"table-scroll\"><table class=\"native-table\"><thead><tr><th>Difficulty level</th><th>Number of questions</th><th>Marks per correct answer</th><th>Penalty per incorrect answer</th></tr></thead><tbody><tr><td>A</td><td>60</td><td>3</td><td>2</td></tr><tr><td>B</td><td>60</td><td>2</td><td>1</td></tr><tr><td>C</td><td>80</td><td>1</td><td><span class=\"frac\"><span>1</span><span>2</span></span></td></tr></tbody></table></div></figure>","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Level C: 40 correct and 40 incorrect ⇒ net = 40 − <span class=\"frac\"><span>1</span><span>2</span></span>(40) = 20.</div><div class=\"eq-line\">To maximize incorrect answers, take all 60 level-B answers as incorrect ⇒ level-B net = −60.</div><div class=\"eq-line\">Level A must therefore contribute 60 − [20 − 60] = 100 marks.</div><div class=\"eq-line\">Let a be the number of incorrect level-A answers. Then correct level-A answers = 60 − a.</div><div class=\"eq-line\">3(60 − a) − 2a = 100 ⇒ 180 − 5a = 100 ⇒ a = 16.</div><div class=\"eq-line\">Maximum incorrect answers = 40 + 60 + 16 = 116. &nbsp; <strong>Choice (B)</strong></div></div>","questionHtml":"If Smitha gets a total of 60 marks across all the sections and she answered 40 questions of level C difficulty correctly, what is the maximum number of questions she could have answered incorrectly across all the sections?","optionsHtml":["74","116","108","102"],"questionNumber":7},{"sourceNumber":8,"type":"mcq","context":"Directions for questions 7 and 8: These questions are based on the following data.\n\nSmitha attempts all the questions in a management entrance test which has questions of three levels of difficulty—A, B and C. For the questions of various difficulty levels, the marks awarded for answering the questions correctly and those deducted for answering the questions incorrectly are as follows:\n\nThere is no penalty for unanswered questions.","question":"In the same test, Rohit attempted the least number of questions but got 120 marks. If he attempted at least one question of each level of difficulty, how many questions did he attempt?","options":["40","41","45","48"],"answer":"B","sourcePage":1,"visual":"<figure class=\"native-visual\"><div class=\"table-scroll\"><table class=\"native-table\"><thead><tr><th>Difficulty level</th><th>Number of questions</th><th>Marks per correct answer</th><th>Penalty per incorrect answer</th></tr></thead><tbody><tr><td>A</td><td>60</td><td>3</td><td>2</td></tr><tr><td>B</td><td>60</td><td>2</td><td>1</td></tr><tr><td>C</td><td>80</td><td>1</td><td><span class=\"frac\"><span>1</span><span>2</span></span></td></tr></tbody></table></div></figure>","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">At least one question from each level must be attempted.</div><div class=\"eq-line\">Take 39 correct level-A questions: 39 × 3 = 117 marks.</div><div class=\"eq-line\">One correct level-B question adds 2 marks and one correct level-C question adds 1 mark.</div><div class=\"eq-line\">Total = 117 + 2 + 1 = 120 from 39 + 1 + 1 = 41 questions.</div><div class=\"eq-line\"><strong>Choice (B)</strong></div></div>","questionHtml":"In the same test, Rohit attempted the least number of questions but got 120 marks. If he attempted at least one question of each level of difficulty, how many questions did he attempt?","optionsHtml":["40","41","45","48"],"questionNumber":8},{"sourceNumber":9,"type":"tita","context":"","question":"A change dispensing machine gives the amount in denominations of ₹1, ₹2 and ₹5 coins. The total number of coins in it is 500. The total amount is ₹960. If the number of ₹5 coins and ₹1 coins are interchanged, the value increases by ₹480. The total number of ₹2 coins is","options":[],"answer":"300","sourcePage":1,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let the numbers of ₹1 and ₹2 coins be x and y. Then ₹5 coins = 500 − x − y.</div><div class=\"eq-line\">x + 2y + 5(500 − x − y) = 960 ⇒ 4x + 3y = 1540. &nbsp; …(1)</div><div class=\"eq-line\">(500 − x − y) + 2y + 5x = 1440 ⇒ 4x + y = 940. &nbsp; …(2)</div><div class=\"eq-line\">(1) − (2): 2y = 600 ⇒ y = 300.</div></div>","questionHtml":"A change dispensing machine gives the amount in denominations of ₹1, ₹2 and ₹5 coins. The total number of coins in it is 500. The total amount is ₹960. If the number of ₹5 coins and ₹1 coins are interchanged, the value increases by ₹480. The total number of ₹2 coins is","optionsHtml":[],"questionNumber":9},{"sourceNumber":10,"type":"mcq","context":"","question":"When Sheela was asked how many apples she had, she replied, “If you add three-quarters of the number of apples I have to three-quarters of an apple, you will get the number of apples I have.” How many apples does she have?","options":["3","4","6","9"],"answer":"A","sourcePage":1,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let the number of apples be x.</div><div class=\"eq-line\"><span class=\"frac\"><span>3</span><span>4</span></span>x + <span class=\"frac\"><span>3</span><span>4</span></span> = x.</div><div class=\"eq-line\"><span class=\"frac\"><span>1</span><span>4</span></span>x = <span class=\"frac\"><span>3</span><span>4</span></span> ⇒ x = 3. &nbsp; <strong>Choice (A)</strong></div></div>","questionHtml":"When Sheela was asked how many apples she had, she replied, “If you add three-quarters of the number of apples I have to three-quarters of an apple, you will get the number of apples I have.” How many apples does she have?","optionsHtml":["3","4","6","9"],"questionNumber":10},{"sourceNumber":11,"type":"tita","context":"","question":"The class teacher of class V said that she would be distributing some chocolates to the first three rankers of the class. The second ranker would get 57 of what the topper would get, and the third ranker would get 35 of what the second ranker would get. The topper got 60 chocolates more than the third ranker. How many chocolates were distributed to the three children?","options":[],"answer":"225","sourcePage":1,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let the topper receive 7x chocolates.</div><div class=\"eq-line\">Second ranker = <span class=\"frac\"><span>5</span><span>7</span></span>(7x) = 5x; third ranker = <span class=\"frac\"><span>3</span><span>5</span></span>(5x) = 3x.</div><div class=\"eq-line\">7x − 3x = 60 ⇒ x = 15.</div><div class=\"eq-line\">Total chocolates = 7x + 5x + 3x = 15x = 225.</div></div>","questionHtml":"The class teacher of class V said that she would be distributing some chocolates to the first three rankers of the class. The second ranker would get <span class=\"frac\"><span>5</span><span>7</span></span> of what the topper would get, and the third ranker would get <span class=\"frac\"><span>3</span><span>5</span></span> of what the second ranker would get. The topper got 60 chocolates more than the third ranker. How many chocolates were distributed to the three children?","optionsHtml":[],"questionNumber":11},{"sourceNumber":12,"type":"mcq","context":"","question":"In a four-digit number, the sum of the first two digits is equal to the sum of the last two digits. If the sum of the digits is 30 and the sum of the digits in the units place and thousands place is twice its digit in the hundreds place, then which of the following cannot be the units digit?","options":["6","9","7","More than one of the previous choices"],"answer":"C","sourcePage":2,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">The first two digits and last two digits each sum to 15.</div><div class=\"eq-line\">Let the hundreds digit be H and the units digit be U. The thousands digit is 15 − H.</div><div class=\"eq-line\">(15 − H) + U = 2H ⇒ U = 3H − 15.</div><div class=\"eq-line\">The tens digit is 15 − U and must also be a digit; therefore U can only be 6 or 9.</div><div class=\"eq-line\">Hence 7 cannot be the units digit. &nbsp; <strong>Choice (C)</strong></div></div>","questionHtml":"In a four-digit number, the sum of the first two digits is equal to the sum of the last two digits. If the sum of the digits is 30 and the sum of the digits in the units place and thousands place is twice its digit in the hundreds place, then which of the following cannot be the units digit?","optionsHtml":["6","9","7","More than one of the previous choices"],"questionNumber":12},{"sourceNumber":13,"type":"tita","context":"","question":"In a fraction, if the numerator is doubled and the denominator is increased by 4, it changes to 56. If one is added to the denominator and the numerator is decreased by two, the fraction changes to 13. What is the denominator of the fraction?","options":[],"answer":"8","sourcePage":2,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let the fraction be <span class=\"frac\"><span>a</span><span>b</span></span>.</div><div class=\"eq-line\"><span class=\"frac\"><span>2a</span><span>b + 4</span></span> = <span class=\"frac\"><span>5</span><span>6</span></span> ⇒ 12a − 5b = 20. &nbsp; …(1)</div><div class=\"eq-line\"><span class=\"frac\"><span>a − 2</span><span>b + 1</span></span> = <span class=\"frac\"><span>1</span><span>3</span></span> ⇒ 3a − b = 7. &nbsp; …(2)</div><div class=\"eq-line\">Solving (1) and (2): a = 5 and b = 8.</div><div class=\"eq-line\">Therefore the denominator is 8.</div></div>","questionHtml":"In a fraction, if the numerator is doubled and the denominator is increased by 4, it changes to <span class=\"frac\"><span>5</span><span>6</span></span>. If one is added to the denominator and the numerator is decreased by two, the fraction changes to <span class=\"frac\"><span>1</span><span>3</span></span>. What is the denominator of the fraction?","optionsHtml":[],"questionNumber":13},{"sourceNumber":14,"type":"mcq","context":"","question":"“Once some cats saw some rats. If each cat caught one rat, there would be a cat without a rat. Should each rat now be shared by two cats, there would be a rat not caught by the cats.” How many cats are there?","options":["2","4","6","7"],"answer":"B","sourcePage":2,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let the number of cats be x. Then the number of rats is x − 1.</div><div class=\"eq-line\">(x − 1) − 1 = <span class=\"frac\"><span>x</span><span>2</span></span>.</div><div class=\"eq-line\">x − 2 = <span class=\"frac\"><span>x</span><span>2</span></span> ⇒ x = 4. &nbsp; <strong>Choice (B)</strong></div></div>","questionHtml":"“Once some cats saw some rats. If each cat caught one rat, there would be a cat without a rat. Should each rat now be shared by two cats, there would be a rat not caught by the cats.” How many cats are there?","optionsHtml":["2","4","6","7"],"questionNumber":14},{"sourceNumber":15,"type":"tita","context":"Directions for questions 15 and 16: These questions are based on the following data.\n\nA, B, C and D are four salesmen. In the first month, they received a total commission of ₹4,200 from their company and divided it in the ratio 2 : 3 : 4 : 5. In the second month, the commission doubled and the amount was divided in the ratio 3 : 4 : 5 : 2. In the third month, the commission tripled when compared to the first month and they shared it in the ratio 4 : 5 : 3 : 2. In the fourth month, the commission became half of that of the previous month and they shared it in the ratio 4 : 3 : 5 : 2.","question":"What was the average monthly earning of C over the period? (in ₹)","options":[],"answer":"2287.50","sourcePage":2,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Monthly earnings are:</div></div><div class=\"table-scroll\"><table class=\"native-table\"><thead><tr><th>Month</th><th>A</th><th>B</th><th>C</th><th>D</th></tr></thead><tbody><tr><td>First</td><td>600</td><td>900</td><td>1,200</td><td>1,500</td></tr><tr><td>Second</td><td>1,800</td><td>2,400</td><td>3,000</td><td>1,200</td></tr><tr><td>Third</td><td>3,600</td><td>4,500</td><td>2,700</td><td>1,800</td></tr><tr><td>Fourth</td><td>1,800</td><td>1,350</td><td>2,250</td><td>900</td></tr><tr><td>Total</td><td>7,800</td><td>9,150</td><td>9,150</td><td>5,400</td></tr></tbody></table></div><div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Average monthly earning of C = ₹<span class=\"frac\"><span>9,150</span><span>4</span></span> = ₹2,287.50.</div></div>","questionHtml":"What was the average monthly earning of C over the period? (in ₹)","optionsHtml":[],"questionNumber":15},{"sourceNumber":16,"type":"tita","context":"Directions for questions 15 and 16: These questions are based on the following data.\n\nA, B, C and D are four salesmen. In the first month, they received a total commission of ₹4,200 from their company and divided it in the ratio 2 : 3 : 4 : 5. In the second month, the commission doubled and the amount was divided in the ratio 3 : 4 : 5 : 2. In the third month, the commission tripled when compared to the first month and they shared it in the ratio 4 : 5 : 3 : 2. In the fourth month, the commission became half of that of the previous month and they shared it in the ratio 4 : 3 : 5 : 2.","question":"How much more should B have earned so that his average monthly earning would have been ₹3,500? (in ₹)","options":[],"answer":"4850","sourcePage":2,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">B’s total earning over four months = ₹9,150.</div><div class=\"eq-line\">Required total for a ₹3,500 monthly average = 4 × ₹3,500 = ₹14,000.</div><div class=\"eq-line\">Additional earning required = ₹14,000 − ₹9,150 = ₹4,850.</div></div>","questionHtml":"How much more should B have earned so that his average monthly earning would have been ₹3,500? (in ₹)","optionsHtml":[],"questionNumber":16},{"sourceNumber":17,"type":"mcq","context":"Directions for questions 17 to 19: These questions are based on the following data.\n\nI was visiting my friend’s house at Tuticorin for the first time. I knew that he had five children—two daughters and three sons. The daughters were Sonali and Monali and the sons were Surya, Sagar and Prithvi. When I stepped into the house, I was greeted by Sagar and Sonali. Sagar introduced himself and told me that he was twice as old as Sonali. The next to meet me was Monali, who said that she and Sonali together were twice as old as Sagar. Then Surya walked in and introduced himself and said that he and Sagar were twice as old as their sisters together. In the afternoon Prithvi came to my room when I was relaxing and said, “Sorry uncle, I was busy with my friends. As it is my 21st birthday today I could not meet you in the morning.” When I greeted him and said that it was fine, he said, “You know uncle, the three of us—Sagar, Surya and I—are five times as old as our sisters together,” saying which he went away.","question":"Who is the youngest of the siblings?","options":["Surya","Monali","Sonali","Prithvi"],"answer":"C","sourcePage":2,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let Sonali’s age be x. Then Sagar’s age = 2x.</div><div class=\"eq-line\">Monali + Sonali = 2(Sagar) ⇒ Monali = 3x.</div><div class=\"eq-line\">Surya + Sagar = 2(Sonali + Monali) ⇒ Surya + 2x = 8x ⇒ Surya = 6x.</div><div class=\"eq-line\">Prithvi is 21 and the three brothers are five times as old as the sisters together:</div><div class=\"eq-line\">21 + 6x + 2x = 5(x + 3x) ⇒ 12x = 21.</div><div class=\"eq-line\">x = <span class=\"frac\"><span>7</span><span>4</span></span> years = 1 year 9 months.</div><div class=\"eq-line\">Sagar = <span class=\"frac\"><span>7</span><span>2</span></span> years; Monali = <span class=\"frac\"><span>21</span><span>4</span></span> years; Surya = <span class=\"frac\"><span>21</span><span>2</span></span> years.</div><div class=\"eq-line\">Sonali is the youngest. &nbsp; <strong>Choice (C)</strong></div></div>","questionHtml":"Who is the youngest of the siblings?","optionsHtml":["Surya","Monali","Sonali","Prithvi"],"questionNumber":17},{"sourceNumber":18,"type":"mcq","context":"Directions for questions 17 to 19: These questions are based on the following data.\n\nI was visiting my friend’s house at Tuticorin for the first time. I knew that he had five children—two daughters and three sons. The daughters were Sonali and Monali and the sons were Surya, Sagar and Prithvi. When I stepped into the house, I was greeted by Sagar and Sonali. Sagar introduced himself and told me that he was twice as old as Sonali. The next to meet me was Monali, who said that she and Sonali together were twice as old as Sagar. Then Surya walked in and introduced himself and said that he and Sagar were twice as old as their sisters together. In the afternoon Prithvi came to my room when I was relaxing and said, “Sorry uncle, I was busy with my friends. As it is my 21st birthday today I could not meet you in the morning.” When I greeted him and said that it was fine, he said, “You know uncle, the three of us—Sagar, Surya and I—are five times as old as our sisters together,” saying which he went away.","question":"How much older than Sonali is Monali?","options":["3 years","3 years 6 months","5 years 6 months","7 years"],"answer":"B","sourcePage":2,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let Sonali’s age be x. Then Sagar’s age = 2x.</div><div class=\"eq-line\">Monali + Sonali = 2(Sagar) ⇒ Monali = 3x.</div><div class=\"eq-line\">Surya + Sagar = 2(Sonali + Monali) ⇒ Surya + 2x = 8x ⇒ Surya = 6x.</div><div class=\"eq-line\">Prithvi is 21 and the three brothers are five times as old as the sisters together:</div><div class=\"eq-line\">21 + 6x + 2x = 5(x + 3x) ⇒ 12x = 21.</div><div class=\"eq-line\">x = <span class=\"frac\"><span>7</span><span>4</span></span> years = 1 year 9 months.</div><div class=\"eq-line\">Sagar = <span class=\"frac\"><span>7</span><span>2</span></span> years; Monali = <span class=\"frac\"><span>21</span><span>4</span></span> years; Surya = <span class=\"frac\"><span>21</span><span>2</span></span> years.</div><div class=\"eq-line\">Monali − Sonali = <span class=\"frac\"><span>21</span><span>4</span></span> − <span class=\"frac\"><span>7</span><span>4</span></span> = <span class=\"frac\"><span>14</span><span>4</span></span> = 3 years 6 months.</div><div class=\"eq-line\"><strong>Choice (B)</strong></div></div>","questionHtml":"How much older than Sonali is Monali?","optionsHtml":["3 years","3 years 6 months","5 years 6 months","7 years"],"questionNumber":18},{"sourceNumber":19,"type":"mcq","context":"Directions for questions 17 to 19: These questions are based on the following data.\n\nI was visiting my friend’s house at Tuticorin for the first time. I knew that he had five children—two daughters and three sons. The daughters were Sonali and Monali and the sons were Surya, Sagar and Prithvi. When I stepped into the house, I was greeted by Sagar and Sonali. Sagar introduced himself and told me that he was twice as old as Sonali. The next to meet me was Monali, who said that she and Sonali together were twice as old as Sagar. Then Surya walked in and introduced himself and said that he and Sagar were twice as old as their sisters together. In the afternoon Prithvi came to my room when I was relaxing and said, “Sorry uncle, I was busy with my friends. As it is my 21st birthday today I could not meet you in the morning.” When I greeted him and said that it was fine, he said, “You know uncle, the three of us—Sagar, Surya and I—are five times as old as our sisters together,” saying which he went away.","question":"After how long would Surya be twice as old as Sagar?","options":["2 years","2 years 6 months","3 years 6 months","4 years"],"answer":"C","sourcePage":2,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let Sonali’s age be x. Then Sagar’s age = 2x.</div><div class=\"eq-line\">Monali + Sonali = 2(Sagar) ⇒ Monali = 3x.</div><div class=\"eq-line\">Surya + Sagar = 2(Sonali + Monali) ⇒ Surya + 2x = 8x ⇒ Surya = 6x.</div><div class=\"eq-line\">Prithvi is 21 and the three brothers are five times as old as the sisters together:</div><div class=\"eq-line\">21 + 6x + 2x = 5(x + 3x) ⇒ 12x = 21.</div><div class=\"eq-line\">x = <span class=\"frac\"><span>7</span><span>4</span></span> years = 1 year 9 months.</div><div class=\"eq-line\">Sagar = <span class=\"frac\"><span>7</span><span>2</span></span> years; Monali = <span class=\"frac\"><span>21</span><span>4</span></span> years; Surya = <span class=\"frac\"><span>21</span><span>2</span></span> years.</div><div class=\"eq-line\">Let t be the required time: <span class=\"frac\"><span>21</span><span>2</span></span> + t = 2(<span class=\"frac\"><span>7</span><span>2</span></span> + t).</div><div class=\"eq-line\"><span class=\"frac\"><span>21</span><span>2</span></span> + t = 7 + 2t ⇒ t = <span class=\"frac\"><span>7</span><span>2</span></span> years = 3 years 6 months.</div><div class=\"eq-line\"><strong>Choice (C)</strong></div></div>","questionHtml":"After how long would Surya be twice as old as Sagar?","optionsHtml":["2 years","2 years 6 months","3 years 6 months","4 years"],"questionNumber":19},{"sourceNumber":20,"type":"mcq","context":"Directions for questions 20 and 21: These questions are based on the following data.\n\nWhen I sat in my friend’s toy store last Saturday, I noticed an interesting thing. Among the visitors, the ratio of the number of men to women was the same as that of women to children. The highest number of visitors to the store were children, who were attracted by the various kinds of toys in the store. At the end of the day, I found that 7 women visited the store.","question":"How many children visited the store that day?","options":["44","49","52","57"],"answer":"B","sourcePage":2,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let men = x and children = y. Women = 7.</div><div class=\"eq-line\">x : 7 = 7 : y ⇒ xy = 49.</div><div class=\"eq-line\">The positive integer possibilities are (x, y) = (1, 49) or (7, 7).</div><div class=\"eq-line\">Children are the largest group, so x = 1 and y = 49.</div><div class=\"eq-line\"><strong>49 children — Choice (B)</strong></div></div>","questionHtml":"How many children visited the store that day?","optionsHtml":["44","49","52","57"],"questionNumber":20},{"sourceNumber":21,"type":"mcq","context":"Directions for questions 20 and 21: These questions are based on the following data.\n\nWhen I sat in my friend’s toy store last Saturday, I noticed an interesting thing. Among the visitors, the ratio of the number of men to women was the same as that of women to children. The highest number of visitors to the store were children, who were attracted by the various kinds of toys in the store. At the end of the day, I found that 7 women visited the store.","question":"If 15 children, 4 women and no men purchased toys that day, what is the ratio of those who purchased toys to those who did not?","options":["1 : 3","3 : 1","1 : 2","2 : 1"],"answer":"C","sourcePage":2,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Total visitors = 1 + 7 + 49 = 57.</div><div class=\"eq-line\">Purchasers = 15 + 4 + 0 = 19; non-purchasers = 57 − 19 = 38.</div><div class=\"eq-line\">Required ratio = 19 : 38 = 1 : 2. &nbsp; <strong>Choice (C)</strong></div></div>","questionHtml":"If 15 children, 4 women and no men purchased toys that day, what is the ratio of those who purchased toys to those who did not?","optionsHtml":["1 : 3","3 : 1","1 : 2","2 : 1"],"questionNumber":21},{"sourceNumber":22,"type":"mcq","context":"","question":"If 6a − 12b + 5c6a − 12b − 5c = 6a + 12b − 5c6a − 12b + 5c, which of the following is true?","options":["6ab − 12b² = 5ac + 5bc","6ab + 12b² = 5ac + 5bc","6ab + 5bc = 5ac + 12b²","6ab + 5ac = 5bc + 12b²"],"answer":"C","sourcePage":2,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\"><span class=\"frac\"><span>(6a − 12b) + 5c</span><span>(6a − 12b) − 5c</span></span> = <span class=\"frac\"><span>6a + (12b − 5c)</span><span>6a − (12b − 5c)</span></span>.</div><div class=\"eq-line\">Therefore <span class=\"frac\"><span>6a − 12b</span><span>5c</span></span> = <span class=\"frac\"><span>6a</span><span>12b − 5c</span></span>.</div><div class=\"eq-line\">(a − 2b)(12b − 5c) = 5ac.</div><div class=\"eq-line\">12ab − 5ac − 24b² + 10bc = 5ac.</div><div class=\"eq-line\">6ab + 5bc = 5ac + 12b². &nbsp; <strong>Choice (C)</strong></div></div>","questionHtml":"If <span class=\"frac\"><span>6a − 12b + 5c</span><span>6a − 12b − 5c</span></span> = <span class=\"frac\"><span>6a + 12b − 5c</span><span>6a − 12b + 5c</span></span>, which of the following is true?","optionsHtml":["6ab − 12b² = 5ac + 5bc","6ab + 12b² = 5ac + 5bc","6ab + 5bc = 5ac + 12b²","6ab + 5ac = 5bc + 12b²"],"questionNumber":22},{"sourceNumber":23,"type":"mcq","context":"","question":"If a + bb + c = c + dd + e = e + ff + a, c(a + d) ≠ ad + c2 and d + e + f ≠ 0, find the value of a + b + cd + e + f.","options":["1","0","−1","Cannot be determined"],"answer":"C","sourcePage":2,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let <span class=\"frac\"><span>a + b</span><span>b + c</span></span> = <span class=\"frac\"><span>c + d</span><span>d + e</span></span> = <span class=\"frac\"><span>e + f</span><span>f + a</span></span> = k.</div><div class=\"eq-line\">Then k = <span class=\"frac\"><span>a + b + c + d + e + f</span><span>b + c + d + e + f + a</span></span> = 1, or a + b + c + d + e + f = 0.</div><div class=\"eq-line\">If k = 1, then a = c = e.</div><div class=\"eq-line\">But c(a + d) ≠ ad + c² ⇒ c² − c(a + d) + ad ≠ 0 ⇒ (c − a)(c − d) ≠ 0, so a ≠ c.</div><div class=\"eq-line\">Therefore k ≠ 1 and a + b + c + d + e + f = 0.</div><div class=\"eq-line\">Hence <span class=\"frac\"><span>a + b + c</span><span>d + e + f</span></span> = −1. &nbsp; <strong>Choice (C)</strong></div></div>","questionHtml":"If <span class=\"frac\"><span>a + b</span><span>b + c</span></span> = <span class=\"frac\"><span>c + d</span><span>d + e</span></span> = <span class=\"frac\"><span>e + f</span><span>f + a</span></span>, c(a + d) ≠ ad + c<sup>2</sup> and d + e + f ≠ 0, find the value of <span class=\"frac\"><span>a + b + c</span><span>d + e + f</span></span>.","optionsHtml":["1","0","−1","Cannot be determined"],"questionNumber":23},{"sourceNumber":24,"type":"mcq","context":"","question":"If b + cc + d = d + ee + f = f + aa + b and a + b + c ≠ −(d + e + f), what is the value of bd + df + fb?","options":["−3","0","3","Cannot be determined"],"answer":"D","sourcePage":2,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let <span class=\"frac\"><span>b + c</span><span>c + d</span></span> = <span class=\"frac\"><span>d + e</span><span>e + f</span></span> = <span class=\"frac\"><span>f + a</span><span>a + b</span></span> = k.</div><div class=\"eq-line\">Then k = <span class=\"frac\"><span>b + c + d + e + f + a</span><span>c + d + e + f + a + b</span></span> = 1, or a + b + c + d + e + f = 0.</div><div class=\"eq-line\">Since a + b + c ≠ −(d + e + f), the second case is excluded; hence k = 1.</div><div class=\"eq-line\"><span class=\"frac\"><span>b + c</span><span>c + d</span></span> = 1 ⇒ b = d, and <span class=\"frac\"><span>f + a</span><span>a + b</span></span> = 1 ⇒ f = b. Thus b = d = f.</div><div class=\"eq-line\">If these values are nonzero, <span class=\"frac\"><span>b</span><span>d</span></span> + <span class=\"frac\"><span>d</span><span>f</span></span> + <span class=\"frac\"><span>f</span><span>b</span></span> = 3. But b = d = f = 0 also satisfies the given equalities and makes the requested ratios undefined.</div><div class=\"eq-line\">Therefore the value cannot be determined. &nbsp; <strong>Choice (D)</strong></div></div>","questionHtml":"If <span class=\"frac\"><span>b + c</span><span>c + d</span></span> = <span class=\"frac\"><span>d + e</span><span>e + f</span></span> = <span class=\"frac\"><span>f + a</span><span>a + b</span></span> and a + b + c ≠ −(d + e + f), what is the value of <span class=\"frac\"><span>b</span><span>d</span></span> + <span class=\"frac\"><span>d</span><span>f</span></span> + <span class=\"frac\"><span>f</span><span>b</span></span>?","optionsHtml":["−3","0","3","Cannot be determined"],"questionNumber":24},{"sourceNumber":25,"type":"mcq","context":"","question":"The inhabitants of Warawa island (where the currency is Waras) are taxed in a funny manner. They have to pay a fixed sum irrespective of their income level. In addition, they pay a sum proportional to the excess of their annual salary over Wr. 50,000. Mr. Wakhln pays a total tax of Wr. 6,200 per annum when his annual salary is Wr. 60,000, and his wife pays a total tax of Wr. 7,700 per annum when her annual salary is Wr. 75,000. What is the annual salary (in Waras) of Mr. Sangma, who pays a total tax of Wr. 8,200 per annum?","options":["Wr. 80,000","Wr. 82,000","Wr. 90,000","Wr. 81,000"],"answer":"A","sourcePage":2,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let annual salary be S, fixed tax be F and proportionality constant be k.</div><div class=\"eq-line\">Tax = F + k(S − 50,000).</div><div class=\"eq-line\">6,200 = F + 10,000k. &nbsp; …(1)</div><div class=\"eq-line\">7,700 = F + 25,000k. &nbsp; …(2)</div><div class=\"eq-line\">(2) − (1): 1,500 = 15,000k ⇒ k = <span class=\"frac\"><span>1</span><span>10</span></span>.</div><div class=\"eq-line\">From (1), F = 6,200 − 10,000(<span class=\"frac\"><span>1</span><span>10</span></span>) = 5,200.</div><div class=\"eq-line\">For Mr. Sangma: 8,200 = 5,200 + <span class=\"frac\"><span>1</span><span>10</span></span>(S − 50,000).</div><div class=\"eq-line\">3,000 = <span class=\"frac\"><span>1</span><span>10</span></span>(S − 50,000) ⇒ 30,000 = S − 50,000.</div><div class=\"eq-line\">S = 80,000 Waras. &nbsp; <strong>Choice (A)</strong></div></div>","questionHtml":"The inhabitants of Warawa island (where the currency is Waras) are taxed in a funny manner. They have to pay a fixed sum irrespective of their income level. In addition, they pay a sum proportional to the excess of their annual salary over Wr. 50,000. Mr. Wakhln pays a total tax of Wr. 6,200 per annum when his annual salary is Wr. 60,000, and his wife pays a total tax of Wr. 7,700 per annum when her annual salary is Wr. 75,000. What is the annual salary (in Waras) of Mr. Sangma, who pays a total tax of Wr. 8,200 per annum?","optionsHtml":["Wr. 80,000","Wr. 82,000","Wr. 90,000","Wr. 81,000"],"questionNumber":25}]}</script><script>
const data=JSON.parse(document.getElementById('testData').textContent),labels=['A','B','C','D'],total=data.questions.length,answers=Array(total).fill(null),marked=Array(total).fill(false);let current=0,submitted=false,seconds=data.durationMinutes*60,timerId=null;const host=document.getElementById('questionHost'),bar=document.getElementById('qbar'),result=document.getElementById('result');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function text(v){return esc(v).replace(/\s*\n+\s*/g,' ')}function mathText(v){
let s=text(v).replace(/(\d+)\s*\/\s*(\d+)\s*(?:st|nd|rd|th)\b/gi,'$1/$2');
const blocked=new Set(['is','are','and','or','per','hr','hrs','hour','hours','min','mins','sec','secs','day','days','week','weeks','month','months','year','years','switch','board','km','cm','mm','m','lt','units']);
const atom='(?:\\([^()<>]{1,80}\\)|\\{[^{}<>]{1,100}\\}|[−-]?(?:\\d+(?:\\.\\d+)?[A-Za-zπ]{0,5}[²³⁴⁵⁶⁷⁸⁹⁰]*|[A-Za-zπ][A-Za-z0-9π²³⁴⁵⁶⁷⁸⁹⁰]{0,5})[°%]?)';
const fraction=new RegExp('(^|[^\\w/])('+atom+')\\s*\\/\\s*('+atom+')(?=$|[^\\w/])','g');
let prior;
do{prior=s;s=s.replace(fraction,(m,p,a,b)=>blocked.has(a.replace(/[()−-]/g,'').toLowerCase())||blocked.has(b.replace(/[()−-]/g,'').toLowerCase())?m:p+'<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>')}while(s!==prior);
return s}
function formatStimulus(v){const marker=/^((?:\d+\.|\(\d+\)|\([a-z]\)|[ivx]+\.|•)\s*)(.*)$/i;return String(v??'').split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).map(block=>{const lines=block.split('\n').map(x=>x.trim()).filter(Boolean);if(/^Directions\s+for\s+/i.test(lines[0]))return `<p class="direction">${mathText(lines.join(' '))}</p>`;const prose=[],items=[];let item=null;lines.forEach(line=>{const m=line.match(marker);if(m){if(item)items.push(item);item={marker:m[1].trim(),body:m[2]}}else if(item)item.body+=' '+line;else prose.push(line)});if(item)items.push(item);let out=prose.length?`<p>${mathText(prose.join(' '))}</p>`:'';if(items.length)out+=`<div class="info-list">${items.map(x=>`<div class="info-item"><span class="info-marker">${esc(x.marker)}</span><span class="info-body">${mathText(x.body)}</span></div>`).join('')}</div>`;return out||`<p>${mathText(lines.join(' '))}</p>`}).join('')}
function renderBar(){bar.innerHTML=data.questions.map((q,i)=>`<button type="button" class="qbtn ${answers[i]!==null&&answers[i]!==''?'answered ':''}${marked[i]?'marked ':''}${i===current?'current ':''}" onclick="go(${i})">${i+1}</button>`).join('')}
function response(q){if(q.type==='mcq')return `<div class="options ${q.imageOnly?'image-choice':''}">${q.options.map((op,i)=>`<label class="option"><input type="radio" name="answer" value="${labels[i]}" ${answers[current]===labels[i]?'checked':''} ${submitted?'disabled':''}><span>(${labels[i]})${q.imageOnly?'':' '+(q.optionsHtml&&q.optionsHtml[i]?q.optionsHtml[i]:mathText(op))}</span></label>`).join('')}</div>`;return `<div class="tita"><label for="titaInput">Type your answer:</label><input id="titaInput" aria-label="Type your answer" placeholder="Type your answer" inputmode="decimal" value="${esc(answers[current]??'')}" ${submitted?'disabled':''}><div class="tita-note">TITA: type the numerical/value answer. No negative marking.</div></div>`}
function contextLocalNumbers(ctx){const ids=[];data.questions.forEach((x,i)=>{if(String(x.context||'')===String(ctx||''))ids.push(i+1)});return ids}
function localRangeLabel(ids,prefix){if(!ids.length)return prefix==='common'?'Common Information':'';if(ids.length===1)return prefix==='common'?`Common Information – Question ${ids[0]}`:`question ${ids[0]}`;const contiguous=ids.every((v,i)=>i===0||v===ids[i-1]+1);if(contiguous&&ids.length===2)return prefix==='common'?`Common Information – Questions ${ids[0]}–${ids[1]}`:`questions ${ids[0]} and ${ids[1]}`;if(contiguous)return prefix==='common'?`Common Information – Questions ${ids[0]}–${ids[ids.length-1]}`:`questions ${ids[0]} to ${ids[ids.length-1]}`;return prefix==='common'?`Common Information – Questions ${ids.join(', ')}`:`questions ${ids.join(', ')}`}
function localizeContext(ctx){const ids=contextLocalNumbers(ctx);if(!ids.length)return String(ctx||'');const lines=String(ctx||'').split('\n');const first=lines[0]||'';const m=first.match(/^Directions\s+for\s+questions?\s+[^:]+:(.*)$/i);if(m)lines[0]=`Directions for ${localRangeLabel(ids,'directions')}:${m[1]}`;return lines.join('\n')}
function localizedSolution(q){let s=String(q.solution||'');s=s.replace(/Solutions?\s+for\s+questions?[^<:]*(?::|<\/text>)/gi,'');s=s.replace(/Choice\s*\([A-D]\)/gi,'');s=s.replace(/Ans(?:wer)?\s*[:=][^<]*/gi,'');return s}
function render(){const q=data.questions[current],has=!!q.context,information=has?`<section class="qa-context"><div class="common-qno">${localRangeLabel(contextLocalNumbers(q.context),'common')}</div><div class="stimulus-copy">${formatStimulus(localizeContext(q.context))}</div>${q.visual||''}</section>`:`<p class="qa-direction">Answer the question independently.</p>`;host.innerHTML=`<div class="test-content"><section class="response-pane"><div class="qhead"><div class="qnum">Question ${current+1} of ${total}</div></div>${information}${q.questionVisual||''}<h2 class="question-title">${q.questionHtml||mathText(q.question)}</h2>${response(q)}<div id="answerNote" class="answer-note"></div><section class="solution direct-solution"><div class="solution-heading">Solution</div>${localizedSolution(q)}</section></section></div><div class="navrow"><button type="button" onclick="markNext()">Mark for Review & Next</button><button type="button" onclick="clearResponse()" ${submitted?'disabled':''}>Clear Response</button><button type="button" class="previous" onclick="previous()" ${current===0?'disabled':''}>Previous</button><button type="button" class="save" onclick="next()">Save & Next</button></div>`;bind();if(submitted)review();renderBar()}
function bind(){host.querySelectorAll('input[name="answer"]').forEach(el=>el.onchange=()=>{answers[current]=el.value;renderBar()});const t=document.getElementById('titaInput');if(t)t.oninput=()=>{answers[current]=t.value.trim();renderBar()}}
function save(){const t=document.getElementById('titaInput');if(t&&!submitted)answers[current]=t.value.trim();const r=host.querySelector('input[name="answer"]:checked');if(r&&!submitted)answers[current]=r.value}function go(i){save();current=i;render()}function next(){if(current<total-1)go(current+1)}function previous(){if(current>0)go(current-1)}function markNext(){save();marked[current]=true;if(current<total-1)go(current+1);else render()}function clearResponse(){answers[current]=null;render()}
function correct(q,a){if(a===null||a==='')return null;if(q.type==='mcq')return a===q.answer;const n=v=>String(v).trim().replace(/,/g,'');return n(a)===n(q.answer)}function review(){const q=data.questions[current],s=correct(q,answers[current]),n=document.getElementById('answerNote');n.className='answer-note '+(s===null?'muted':s?'ok':'bad');n.textContent=s===null?'Unattempted. Correct answer: '+q.answer:s?'Correct.':'Wrong. Correct answer: '+q.answer}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm('Submit this sectional test now?'))return;submitted=true;clearInterval(timerId);document.body.classList.add('submitted');let c=0,w=0,u=0,score=0;data.questions.forEach((q,i)=>{const s=correct(q,answers[i]);if(s===null)u++;else if(s){c++;score+=3}else{w++;if(q.type==='mcq')score--}});result.style.display='block';result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score">Score<strong>${score}</strong></div><div class="score">Correct<strong>${c}</strong></div><div class="score">Wrong<strong>${w}</strong></div><div class="score">Attempted<strong>${c+w}</strong></div><div class="score">Unattempted<strong>${u}</strong></div></div>`;render()}
function tick(){const m=Math.floor(seconds/60),s=seconds%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(seconds<=0){submitTest(true);return}seconds--}const calc=document.getElementById('calc'),display=document.getElementById('calcDisplay'),calcResult=document.getElementById('calcResult');let memory=0;const evaluate=v=>{if(!/^[0-9+\-*/().\s]+$/.test(v))throw Error();return Function('return ('+(v||'0')+')')()};const showResult=v=>{calcResult.textContent=Number.isFinite(Number(v))?String(v):'Error'};document.getElementById('calcToggle').onclick=()=>calc.classList.toggle('open');document.getElementById('calcClose').onclick=()=>calc.classList.remove('open');document.getElementById('calcMin').onclick=()=>calc.classList.remove('open');document.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>{const v=b.dataset.calc;try{if(v==='C'){display.value='';showResult(0)}else if(v==='B')display.value=display.value.slice(0,-1);else if(v==='='){const n=evaluate(display.value);display.value=String(n);showResult(n)}else if(v==='S'){const n=-evaluate(display.value);display.value=String(n);showResult(n)}else if(v==='Q'){const n=Math.sqrt(evaluate(display.value));display.value=String(n);showResult(n)}else if(v==='P'){const n=evaluate(display.value)/100;display.value=String(n);showResult(n)}else if(v==='I'){const n=1/evaluate(display.value);display.value=String(n);showResult(n)}else if(v==='MC')memory=0;else if(v==='MR')display.value+=String(memory);else if(v==='MS')memory=evaluate(display.value);else if(v==='M+')memory+=evaluate(display.value);else if(v==='M-')memory-=evaluate(display.value);else display.value+=v}catch{showResult('Error')}});let dragging=false,dx=0,dy=0,pointerId=null;const dragBar=document.querySelector('.calc-title');dragBar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;dragging=true;pointerId=e.pointerId;const r=calc.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;calc.classList.add('dragging');dragBar.setPointerCapture(pointerId)});dragBar.addEventListener('pointermove',e=>{if(!dragging)return;const maxX=Math.max(0,window.innerWidth-calc.offsetWidth),maxY=Math.max(84,window.innerHeight-calc.offsetHeight);calc.style.left=Math.min(maxX,Math.max(0,e.clientX-dx))+'px';calc.style.top=Math.min(maxY,Math.max(84,e.clientY-dy))+'px';calc.style.right='auto'});const stopDrag=()=>{dragging=false;calc.classList.remove('dragging');if(pointerId!==null&&dragBar.hasPointerCapture(pointerId))dragBar.releasePointerCapture(pointerId);pointerId=null};dragBar.addEventListener('pointerup',stopDrag);dragBar.addEventListener('pointercancel',stopDrag);window.addEventListener('resize',()=>{const r=calc.getBoundingClientRect();if(r.right>window.innerWidth)calc.style.left=Math.max(0,window.innerWidth-r.width)+'px';if(r.bottom>window.innerHeight)calc.style.top=Math.max(84,window.innerHeight-r.height)+'px'});window.go=go;window.previous=previous;window.markNext=markNext;window.clearResponse=clearResponse;window.submitTest=submitTest;render();tick();timerId=setInterval(tick,1000);
</script></body></html>
