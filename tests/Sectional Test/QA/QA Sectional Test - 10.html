<\/b>"], "answer": "D", "solution": "<div><b>As A, B, C are prime numbers, two cases arise either all three are odd number or one of them is 2 and other two are odd numbers. In both the cases (AB + BC + CA) will be odd and cannot be equal to 360, which is an even number. <\/b><\/div> "}, {"number": 3, "type": "mcq", "question": "<b>A person can complete a job in 128 days. He started working alone on Monday. On Tuesday, he was joined by another person who can complete the same job in 64 days. On Wednesday, these 2 were joined by a 3rd person who can complete the same job in 32 days, and so on. If Sunday is a holiday, on which day would the job get completed?<\/b>", "options": ["<b>Tuesday<\/b>", "<b>Monday<\/b>", "<b>Saturday<\/b>", "<b>None of these<\/b>"], "answer": "B", "solution": "<div><section class=\"authored-solution auto-authored\" data-source-visual=\"true\"><div class=\"solution-steps\"><div class=\"step\"><span class=\"step-no\">1<\/span><div><strong>Set up<\/strong><div class=\"equation authored-working\"><div>Let total work be 128 units.<\/div><div>Person A can do 1 unit work in a day;<\/div><div>Person B can do 2 unit work in a day<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">2<\/span><div><strong>Apply the relation<\/strong><div class=\"equation authored-working\"><div>Person C can do 4 unit work in a day; and so on.<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">3<\/span><div><strong>Simplify<\/strong><div class=\"equation authored-working\"><div>Hence total work done on 1st day = 1 unit,<\/div><div>on 2nd day = 1 + 2 = 3 units,<\/div><div>on3rdday =1+2 +4 =7 units and so on<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">4<\/span><div><strong>Evaluate<\/strong><div class=\"equation authored-working\"><div>So, work done on each subsequent day is increased hy numbers in GP.<\/div><div>Adding upto 6th day, we get 120 units of work completed. So, the remaining will get completed on
