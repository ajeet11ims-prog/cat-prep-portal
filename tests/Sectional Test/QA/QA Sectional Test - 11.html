 twelve days. How many additional men are required after that to complete the remaining work in 2 days?<\/b>", "options": ["<b>24<\/b>", "<b>48<\/b>", "<b>12<\/b>", "<b>15<\/b>"], "answer": "A", "solution": "<div><section class=\"authored-solution auto-authored\" data-source-visual=\"true\"><div class=\"solution-steps\"><div class=\"step\"><span class=\"step-no\">1<\/span><div><strong>Set up<\/strong><div class=\"equation authored-working\"><div>12 men take 32 days, while 64 women take 12 days to complete the same work.<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">2<\/span><div><strong>Apply the relation<\/strong><div class=\"equation authored-working\"><div>So, Total work = 12 x M x 32 =64 x W x 12<\/div><div>i.e, 1 men = 2 women<\/div><div>or 16 women = 8 men<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">3<\/span><div><strong>Simplify<\/strong><div class=\"equation authored-working\"><div>Work done by 16 men and 16 women in 12 days = work done by 24 men in 12 days.<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">4<\/span><div><strong>Evaluate<\/strong><div class=\"equation authored-working\"><div>So, work left to complete in 2 days = 12 x M x 32-24 x M x 12 =96 M<\/div><div>If x additional men are required, then<\/div><div>224 +x) x M=96 M<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">5<\/span><div><strong>Verify<\/strong><div class=\"equation authored-working\"><div>ie x =24.<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">6<\/span><div><strong>Conclude<\/strong><div class=\"equation authored-working\"><div>So, 24 more men are required.<\/div><\/div><\/div><\/div><div class=\"final-answer\"><span>Final answer<\/span><strong>A<\/strong><small>Therefore, the required answer is shown above.<\/small><\/div><\/div><\/section> <\/div> "}, {"number": 20, "type": "mcq", "question": "<b>What is the unit digit of (88<sup>77<\/sup> − 77<sup>88<\/sup> )?<\/b>", "options": ["1", "3", "6", "8"], "answer": "B", "solution": "<div><section class=\"authored-solution auto-authored\" data-source-visual=\"true\"><div class=\"solution-steps\"><div class=\"step\"><span class=\"step-no\">1<\/span><div><strong>Set up<\/strong><div class=\"equation authored-working\"><div>The cyclicity of unit digit's powers of digit 8 is {8, 4, 2, 6}. So, 8877 will end in 8<\/div><div>The cyclicity of unit digit's powers of digit 7 is {7, 9, 3, 1}. So, 77% will end in 1<\/div><div>Since, 77% &gt; 887,<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">2<\/span><div><strong>Apply the relation<\/strong><div class=\"equation authored-working\"><div>887 — 77% must be calculated as: — (77% — 887)<\/div><div>That would be calculating (a number ending with 1) minus (a number ending with 8)<\/div><div>Units digit =11-8=3<\/div><\/div><\/div><\/div><div class=\"final-answer\"><span>Final answer<\/span><strong>B<\/strong><small>Therefore, the required answer is shown above.<\/small><\/div><\/div><\/section> <\/div> "}, {"number": 21, "type": "mcq", "question": "<b>Amit drives from his home to office at 35 kilometres per hour for the first hour but then realizes that he will be 1 hour late to work if he drives at the same speed. He increases the speed by 15 kilometres per hour and reaches 30 minutes early. What is the distance (in kilometres) between his house and office?<\/b>", "options": ["<b>175<\/b>", "<b>200<\/b>", "<b>100<\/b>", "<b>210<\/b>"], "answer": "D", "solution": "<div><section class=\"authored-solution auto-authored\" data-source-visual=\"true\"><div class=\"solution-steps\"><div class=\"step\"><span class=\"step-no\">1<\/span><div><strong>Set up<\/strong><div class=\"equation authored-working\"><div>Let ‘d” be the distance remaining after 1 hour and ‘€’ be the remaining time until his office starts.<\/div><div>d=35(1+1)<\/div><div>d=50(¢{-0.5)<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">2<\/spa )}}function markNext(){save();marked[i]=true;go(Math.min(N-1,i+1))}function clearA(){answers[i]='';draw()}function equiv(a,b){return String(a).trim().replace(/,/g,'').toLowerCase()===String(b).trim().replace(/,/g,'').toLowerCase()}function submitTest(){if(submitted||!confirm('Submit this test now?'))return;save();submitted=true;let c=0,w=0,u=0,s=0;data.questions.forEach((q,k)=>{if(!answers[k])u++;else if(equiv(answers[k],q.answer)){c++;s+=3}else{w++;if(q.type==='mcq')s--}});clearInterval(clock);const r=document.getElementById('result');r.style.display='block';r.innerHTML=`<div class="result-grid"><span>Score <strong>${s}</strong></span><span>Correct <strong>${c}</strong></span><span>Wrong <strong>${w}</strong></span><span>Unattempted <strong>${u}</strong></span></div>`;document.body.classList.add('submitted');draw()}function tick(){document.getElementById('time').textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;if(left--<=0)submitTest()}const calc=document.getElementById('calc'),cd=document.getElementById('cd');document.getElementById('calcbtn').onclick=()=>calc.classList.toggle('open');document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let v=b.dataset.k;if(v==='C')cd.value='';else if(v==='='){try{if(!/^[0-9+*/(). -]+$/.test(cd.value))throw 0;cd.value=Function('return ('+cd.value+')')()}catch{cd.value='Error'}}else cd.value+=v});window.go=go;window.markNext=markNext;window.clearA=clearA;window.submitTest=submitTest;draw();tick();const clock=setInterval(tick,1000);requestAnimationFrame(()=>document.documentElement.classList.remove('booting'));const calcResult=document.getElementById('calcResult');let calcMemory=0;const calcEval=()=>{if(!/^[0-9+\-*/().\s]+$/.test(cd.value))throw Error();return Function('return ('+(cd.value||'0')+')')()};const calcShow=v=>calcResult.textContent=Number.isFinite(Number(v))?String(v):'Error';document.getElementById('calcClose').onclick=()=>calc.classList.remove('open');document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{try{const op=b.dataset.op,n=()=>Number(calcEval());if(op==='back')cd.value=cd.value.slice(0,-1);else if(op==='sqrt'){cd.value=String(Math.sqrt(n()));calcShow(cd.value)}else if(op==='percent'){cd.value=String(n()/100);calcShow(cd.value)}else if(op==='recip'){cd.value=String(1/n());calcShow(cd.value)}else if(op==='sign'){cd.value=String(-n());calcShow(cd.value)}else if(op==='mc')calcMemory=0;else if(op==='mr')cd.value+=String(calcMemory);else if(op==='ms')calcMemory=n();else if(op==='mplus')calcMemory+=n();else if(op==='mminus')calcMemory-=n()}catch{calcShow('Error')}});document.querySelector('[data-k="="]').addEventListener('click',()=>calcShow(cd.value));const calcBar=document.getElementById('calcBar');let drag=false,dragX=0,dragY=0;calcBar.onpointerdown=e=>{if(e.target.closest('button'))return;drag=true;dragX=e.clientX-calc.offsetLeft;dragY=e.clientY-calc.offsetTop;calc.classList.add('dragging');calcBar.setPointerCapture(e.pointerId)};calcBar.onpointermove=e=>{if(!drag)return;calc.style.left=Math.max(0,Math.min(innerWidth-calc.offsetWidth,e.clientX-dragX))+'px';calc.style.top=Math.max(84,Math.min(innerHeight-calc.offsetHeight,e.clientY-dragY))+'px';calc.style.right='auto'};calcBar.onpointerup=e=>{drag=false;calc.classList.remove('dragging');calcBar.releasePointerCapture(e.pointerId)};</script></body></html>
