 to both the semicircles.", "options": ["2π - 4", "4π - 8", "2π", "5π"], "answer": "B", "solution": "<div><section class=\"authored-solution auto-authored\" data-source-visual=\"true\"><div class=\"solution-steps\"><div class=\"step\"><span class=\"step-no\">1<\/span><div><strong>Set up<\/strong><div class=\"equation authored-working\"><div>Since, radius of circle = 4 cm<\/div><div>: 8<\/div><div>-. Side of the square =&gt; J2a=8=a=—<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">2<\/span><div><strong>Apply the relation<\/strong><div class=\"equation authored-working\"><div>2<\/div><div>1<\/div><div>Also, the radius of the two semicircles drawn inside the square = 3\" 5 5<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">3<\/span><div><strong>Simplify<\/strong><div class=\"equation authored-working\"><div>~EO=EB=0F=BF=22<\/div><div>242<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">4<\/span><div><strong>Evaluate<\/strong><div class=\"equation authored-working\"><div>Now area of semicircle with diameter AB = Lol = 47 = area of semicircle with diameter BC.<\/div><div>~ (half the area of semicircle) — (area of triangle BEQO) = half of the shaded area<\/div><div>= Ix aE x22 2-4<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">5<\/span><div><strong>Verify<\/strong><div class=\"equation authored-working\"><div>-. area of shaded region = 22x —4)=47- 8.<\/div><\/div><\/div><\/div><div class=\"final-answer\"><span>Final answer<\/span><strong>B<\/strong><small>Therefore, the required answer is shown above.<\/small><\/div><\/div><\/section> <\/div> "}, {"number": 21, "type": "tita", "question": "Four inlet pipes, with circular cross-section of radius r, together take 9 hours to fill a cistern. If the speed of water is thrice that of the earlier speed, then how many pipes of half the radius 'r' are required to fill it in 6 hours?", "options": [], "answer": "8", "solution": "<div><section class=\"authored-solution auto-authored\" data-source-visual=\"true\"><div class=\"solution-steps\"><div class=\"step\"><span class=\"step-no\">1<\/span><div><strong>Set up<\/strong><div class=\"equation authored-working\"><div>Let radius =r, speed = v<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">2<\/span><div><strong>Apply the relation<\/strong><div class=\"equation authored-working\"><div>Number of pipes = 4<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">3<\/span><div><strong>Simplify<\/strong><div class=\"equation authored-working\"><div>Total time = 9 hours<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">4<\/span><div><strong>Evaluate<\/strong><div class=\"equation authored-working\"><div>Total vol = (mr?) x 9 x v x 4<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">5<\/span><div><strong>Verify<\/strong><div class=\"equation authored-working\"><div>Now, new radius = 1/2, speed = 3v<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">6<\/span><div><strong>Conclude<\/strong><div class=\"equation authored-working\"><div>Number of pipes = x, time = 6 hours<\/div><div>2<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">7<\/span><div><strong>Alternative check<\/strong><div class=\"equation authored-working\"><div>So, (7r) x 9 x 4 = (1) xBx3VxX<\/div><\/div><\/div><\/div><div class=\"final-answer\"><span>Final answer<\/span><strong>8<\/strong><small>Therefore, the required answer is shown above.<\/small><\/div><\/div><\/section> <\/div> "}, {"number": 22, "type": "tita", "question": "p, q and r are the roots of the cubic equation: x<sup>3<\/sup> – 3x<sup>2<\/sup> + 2x – 1 = 0. Find the value of (p/qr + q/pr + r/pq). ", "options": [], "answer": "5", "solution": "<div><section class=\"authored-solution auto-authored\" data-source-visual=\"true\"><div class=\"solution-steps\"><div class=\"step\"><span class=\"step-no\">1<\/span><div><strong>Set up<\/strong><div class=\"equation authored-working\"><div>Given equation is x*— 3x2 + 2x —-1=0.<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">2<\/span><div><strong>Apply the relation<\/strong><div class=\"equation authored-working\"><div>As p, q and r are roots for the given equation,<\/div><div>Sumofroots=p+q+r=3;<\/div><div>Sum of roots taken two at atime = pg + pr + qr = 2;<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">3<\/span><div><strong>Simplify<\/strong><div class=\"equation authored-working\"><div>and product of roots = pqr = 1<\/div><div>P.O. 1 _P+q+r _(p+a+1F-2Apg+ar+m) _(3F-22) _<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">4<\/span><div><strong>Evaluate<\/strong><div class=\"equation authored-working\"><div>Now. ar \"or Tha par par<\/div><div>1<\/div><div>5.<\/div><\/div><\/div><\/div><div class=\"final-answer\"><span>Final answer<\/span><strong>5<\/strong><small>Therefore, the required answer is shown above.<\/small><\/div><\/div><\/section> <\/div> "}]}</script><script>const data=JSON.parse(document.getElementById('data').textContent),N=data.questions.length;let i=0,submitted=false,left=data.minutes*60,answers=Array(N).fill(''),marked=Array(N).fill(false);const host=document.getElementById('host'),bar=document.getElementById('bar');function response(q){if(q.type==='mcq')return '<div class="options">'+q.options.map((o,k)=>`<label class="option"><input type="radio" name="a" value="${'ABCD'[k]}" ${answers[i]==='ABCD'[k]?'checked':''} ${submitted?'disabled':''}><span>(${'ABCD'[k]}) ${o}</span></label>`).join('')+'</div>';return `<div class="tita"><label for="tita">Type your answer:</label><input id="tita" value="${answers[i]}" ${submitted?'disabled':''}><div class="tita-note">No negative marking for TITA questions.</div></div>`}function draw(){const q=data.questions[i];host.innerHTML=`<div class="qhead">Question ${i+1} of ${N}</div><div class="content"><h2 class="question">${q.question}</h2>${response(q)}<div class="answer-note" id="note"></div><section class="solution"><h3>Detailed Solution</h3>${q.solution}</section></div><div class="nav"><button onclick="markNext()">Mark for Review & Next</button><button onclick="clearA()" ${submitted?'disabled':''}>Clear Response</button><button onclick="go(i-1)" ${i===0?'disabled':''}>Previous</button><button class="save" onclick="go(Math.min(N-1,i+1))">Save & Next</button></div>`;host.querySelectorAll('[name=a]').forEach(x=>x.onchange=()=>{answers[i]=x.value;drawBar()});const t=document.getElementById('tita');if(t)t.oninput=()=>{answers[i]=t.value;drawBar()};if(submitted){const ok=equiv(answers[i],q.answer),n=document.getElementById('note');n.textContent=answers[i]?`${ok?'Correct':'Incorrect'}. Correct answer: ${q.answer}`:`Unattempted. Correct answer: ${q.answer}`;n.style.color=ok?'#17763e':'#a52d2a'}drawBar()}function drawBar(){bar.innerHTML=data.questions.map((_,k)=>`<button class="qb ${k===i?'current':marked[k]?'marked':answers[k]?'answered':''}" onclick="go(${k})">${k+1}</button>`).join('')}function save(){const t=document.getElementById('tita');if(t&&!submitted)answers[i]=t.value.trim()}function go(n){save();if(n>=0&&n<N){i=n;draw()}}function markNext(){save();marked[i]=true;go(Math.min(N-1,i+1))}function clearA(){answers[i]='';draw()}function equiv(a,b){return String(a).trim().replace(/,/g,'').toLowerCase()===String(b).trim().replace(/,/g,'').toLowerCase()}function submitTest(){if(submitted||!confirm('Submit this test now?'))return;save();submitted=true;let c=0,w=0,u=0,s=0;data.questions.forEach((q,k)=>{if(!answers[k])u++;else if(equiv(answers[k],q.answer)){c++;s+=3}else{w++;if(q.type==='mcq')s--}});clearInterval(clock);const r=document.getElementById('result');r.style.display='block';r.innerHTML=`<div class="result-grid"><span>Score <strong>${s}</strong></span><span>Correct <strong>${c}</strong></span><span>Wrong <strong>${w}</strong></span><span>Unattempted <strong>${u}</strong></span></div>`;document.body.classList.add('submitted');draw()}function tick(){document.getElementById('time').textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;if(left--<=0)submitTest()}const calc=document.getElementById('calc'),cd=document.getElementById('cd');document.getElementById('calcbtn').onclick=()=>calc.classList.toggle('open');document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let v=b.dataset.k;if(v==='C')cd.value='';else if(v==='='){try{if(!/^[0-9+*/(). -]+$/.test(cd.value))throw 0;cd.value=Function('return ('+cd.value+')')()}catch{cd.value='Error'}}else cd.value+=v});window.go=go;window.markNext=markNext;window.clearA=clearA;window.submitTest=submitTest;draw();tick();const clock=setInterval(tick,1000);requestAnimationFrame(()=>document.documentElement.classList.remove('booting'));const calcResult=document.getElementById('calcResult');let calcMemory=0;const calcEval=()=>{if(!/^[0-9+\-*/().\s]+$/.test(cd.value))throw Error();return Function('return ('+(cd.value||'0')+')')()};const calcShow=v=>calcResult.textContent=Number.isFinite(Number(v))?String(v):'Error';document.getElementById('calcClose').onclick=()=>calc.classList.remove('open');document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{try{const op=b.dataset.op,n=()=>Number(calcEval());if(op==='back')cd.value=cd.value.slice(0,-1);else if(op==='sqrt'){cd.value=String(Math.sqrt(n()));calcShow(cd.value)}else if(op==='percent'){cd.value=String(n()/100);calcShow(cd.value)}else if(op==='recip'){cd.value=String(1/n());calcShow(cd.value)}else if(op==='sign'){cd.value=String(-n());calcShow(cd.value)}else if(op==='mc')calcMemory=0;else if(op==='mr')cd.value+=String(calcMemory);else if(op==='ms')calcMemory=n();else if(op==='mplus')calcMemory+=n();else if(op==='mminus')calcMemory-=n()}catch{calcShow('Error')}});document.querySelector('[data-k="="]').addEventListener('click',()=>calcShow(cd.value));const calcBar=document.getElementById('calcBar');let drag=false,dragX=0,dragY=0;calcBar.onpointerdown=e=>{if(e.target.closest('button'))return;drag=true;dragX=e.clientX-calc.offsetLeft;dragY=e.clientY-calc.offsetTop;calc.classList.add('dragging');calcBar.setPointerCapture(e.pointerId)};calcBar.onpointermove=e=>{if(!drag)return;calc.style.left=Math.max(0,Math.min(innerWidth-calc.offsetWidth,e.clientX-dragX))+'px';calc.style.top=Math.max(84,Math.min(innerHeight-calc.offsetHeight,e.clientY-dragY))+'px';calc.style.right='auto'};calcBar.onpointerup=e=>{drag=false;calc.classList.remove('dragging');calcBar.releasePointerCapture(e.pointerId)};</script></body></html>
