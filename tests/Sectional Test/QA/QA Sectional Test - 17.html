ng\"><div>Number of days will be the number of terms in this series.<\/div><div>S2x1+(0-12] =3600<\/div><div>On solving, we get n = 60 days.<\/div><\/div><\/div><\/div><div class=\"final-answer\"><span>Final answer<\/span><strong>60<\/strong><small>Therefore, the required answer is shown above.<\/small><\/div><\/div><\/section> <\/div> "}]}</script><script>const data=JSON.parse(document.getElementById('data').textContent),N=data.questions.length;let i=0,submitted=false,left=data.minutes*60,answers=Array(N).fill(''),marked=Array(N).fill(false);const host=document.getElementById('host'),bar=document.getElementById('bar');function response(q){if(q.type==='mcq')return '<div class="options">'+q.options.map((o,k)=>`<label class="option"><input type="radio" name="a" value="${'ABCD'[k]}" ${answers[i]==='ABCD'[k]?'checked':''} ${submitted?'disabled':''}><span>(${'ABCD'[k]}) ${o}</span></label>`).join('')+'</div>';return `<div class="tita"><label for="tita">Type your answer:</label><input id="tita" value="${answers[i]}" ${submitted?'disabled':''}><div class="tita-note">No negative marking for TITA questions.</div></div>`}function draw(){const q=data.questions[i];host.innerHTML=`<div class="qhead">Question ${i+1} of ${N}</div><div class="content"><h2 class="question">${q.question}</h2>${response(q)}<div class="answer-note" id="note"></div><section class="solution"><h3>Detailed Solution</h3>${q.solution}</section></div><div class="nav"><button onclick="markNext()">Mark for Review & Next</button><button onclick="clearA()" ${submitted?'disabled':''}>Clear Response</button><button onclick="go(i-1)" ${i===0?'disabled':''}>Previous</button><button class="save" onclick="go(Math.min(N-1,i+1))">Save & Next</button></div>`;host.querySelectorAll('[name=a]').forEach(x=>x.onchange=()=>{answers[i]=x.value;drawBar()});const t=document.getElementById('tita');if(t)t.oninput=()=>{answers[i]=t.value;drawBar()};if(submitted){const ok=equiv(answers[i],q.answer),n=document.getElementById('note');n. st;draw();tick();const clock=setInterval(tick,1000);requestAnimationFrame(()=>document.documentElement.classList.remove('booting'));const calcResult=document.getElementById('calcResult');let calcMemory=0;const calcEval=()=>{if(!/^[0-9+\-*/().\s]+$/.test(cd.value))throw Error();return Function('return ('+(cd.value||'0')+')')()};const calcShow=v=>calcResult.textContent=Number.isFinite(Number(v))?String(v):'Error';document.getElementById('calcClose').onclick=()=>calc.classList.remove('open');document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{try{const op=b.dataset.op,n=()=>Number(calcEval());if(op==='back')cd.value=cd.value.slice(0,-1);else if(op==='sqrt'){cd.value=String(Math.sqrt(n()));calcShow(cd.value)}else if(op==='percent'){cd.value=String(n()/100);calcShow(cd.value)}else if(op==='recip'){cd.value=String(1/n());calcShow(cd.value)}else if(op==='sign'){cd.value=String(-n());calcShow(cd.value)}else if(op==='mc')calcMemory=0;else if(op==='mr')cd.value+=String(calcMemory);else if(op==='ms')calcMemory=n();else if(op==='mplus')calcMemory+=n();else if(op==='mminus')calcMemory-=n()}catch{calcShow('Error')}});document.querySelector('[data-k="="]').addEventListener('click',()=>calcShow(cd.value));const calcBar=document.getElementById('calcBar');let drag=false,dragX=0,dragY=0;calcBar.onpointerdown=e=>{if(e.target.closest('button'))return;drag=true;dragX=e.clientX-calc.offsetLeft;dragY=e.clientY-calc.offsetTop;calc.classList.add('dragging');calcBar.setPointerCapture(e.pointerId)};calcBar.onpointermove=e=>{if(!drag)return;calc.style.left=Math.max(0,Math.min(innerWidth-calc.offsetWidth,e.clientX-dragX))+'px';calc.style.top=Math.max(84,Math.min(innerHeight-calc.offsetHeight,e.clientY-dragY))+'px';calc.style.right='auto'};calcBar.onpointerup=e=>{drag=false;calc.classList.remove('dragging');calcBar.releasePointerCapture(e.pointerId)};</script></body></html>
