</style></head><body><header><div class="topbar"><div class="title"><h1>QA Sectional Test - 2</h1><div class="meta">25 Questions | 50 Minutes | 15 MCQ + 10 TITA | +3 correct | -1 wrong MCQ | 0 wrong TITA</div></div><button aria-label="Open calculator" class="calc-toggle" id="calcToggle" type="button">▦</button><div class="timer">Time Left:<br/><span id="time">50:00</span></div></div></header><main><section class="work"><div class="result" id="result"></div><div class="question-host" id="questionHost"></div></section><aside class="side"><h2>Question Bar</h2><div class="qbar" id="qbar"></div><div class="legend"><span><i class="dot current"></i>Current</span><span><i class="dot answered"></i>Answered</span><span><i class="dot marked"></i>Marked</span></div><button class="side-submit" onclick="submitTest()" type="button">Submit</button></aside></main><aside class="calc" id="calc"><div class="calc-title"><span>Normal Calculator</span><span class="calc-title-actions"><button aria-label="Minimize calculator" id="calcMin" type="button">-</button><button aria-label="Close calculator" id="calcClose" type="button">×</button></span></div><input aria-label="Calculator expression" class="calc-display" id="calcDisplay" readonly=""/><div class="calc-result" id="calcResult">0</div><div class="calc-grid"><button class="" data-calc="MC" type="button">MC</button><button class="" data-calc="MR" type="button">MR</button><button class="" data-calc="MS" type="button">MS</button><button class="" data-calc="M+" type="button">M+</button><button class="" data-calc="M-" type="button">M-</button><button class="danger" data-calc="B" type="button">←</button><button class="danger" data-calc="C" type="button">C</button><button class="danger" data-calc="S" type="button">+/-</button><button class="" data-calc="Q" type="button">√</button><button class="" data-calc="P" type="button">%</button><button class="" data-calc="7" type="button">7</button><button class="" data-calc="8" type="button">8</button><button class="" data-calc="9" type="button">9</button><button class="" data-calc="/" type="button">/</button><button class="" data-calc="I" type="button">1/x</button><button class="" data-calc="4" type="button">4</button><button class="" data-calc="5" type="button">5</button><button class="" data-calc="6" type="button">6</button><button class="" data-calc="*" type="button">*</button><button class="eq" data-calc="=" type="button">=</button><button class="" data-calc="1" type="button">1</button><button class="" data-calc="2" type="button">2</button><button class="" data-calc="3" type="button">3</button><button class="" data-calc="-" type="button">-</button><button class="" data-calc="0" type="button">0</button><button class="" data-calc="." type="button">.</button><button class="" data-calc="+" type="button">+</button></div></aside><script id="testData" type="application/json">{"exercise":1,"part":2,"durationMinutes":50,"questions":[{"sourceNumber":26,"type":"mcq","context":"Directions for question 26: This question is based on the following data.\n\nOn the 13th of a month I kept some money in a magical purse in which, on every alternate day starting from the 14th, the money decreases by ₹10 when compared to the closing amount on the evening of the previous day. But on every alternate day starting from the 15th, the money doubles with respect to the closing amount on the evening of the previous day.\n\nI had ₹500 on the 19th and the magical purse kept on decreasing and multiplying the money for me till the 25th of that month.","question":"Had I started with ₹100, how much more money would I have than what I had on the 25th of the month?","options":["₹400","₹760","₹1,280","₹1,640"],"answer":"C","sourcePage":3,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Actual amount from the known ₹500 on the 19th:</div><div class=\"eq-line\">19: 500 → 20: 490 → 21: 980 → 22: 970 → 23: 1,940 → 24: 1,930 → 25: 3,860.</div><div class=\"eq-line\">If ₹100 had been placed on the 13th:</div><div class=\"eq-line\">13: 100 → 14: 90 → 15: 180 → 16: 170 → 17: 340 → 18: 330 → 19: 660 → 20: 650 → 21: 1,300 → 22: 1,290 → 23: 2,580 → 24: 2,570 → 25: 5,140.</div><div class=\"eq-line\">Difference = ₹5,140 − ₹3,860 = ₹1,280. &nbsp; <strong>Choice (C)</strong></div></div>","questionHtml":"Had I started with ₹100, how much more money would I have than what I had on the 25th of the month?","optionsHtml":["₹400","₹760","₹1,280","₹1,640"],"questionNumber":1},{"sourceNumber":27,"type":"tita","context":"","question":"The value of a magic number triples from the first day to the second day, decreases by half from the second day to the third day and increases by half of the increase in the number from the first day to the second day on the fourth day. If the cycle repeats and the value of the magic number after 10 days is 375, what was the value on the 1st day?","options":[],"answer":"24","sourcePage":3,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let the first-day value be x. Applying the repeating three-step cycle gives:</div></div><div class=\"table-scroll\"><table class=\"native-table\"><thead><tr><th>Day</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th></tr></thead><tbody><tr><td>Value</td><td>x</td><td>3x</td><td><span class=\"frac\"><span>3x</span><span>2</span></span></td><td><span class=\"frac\"><span>5x</span><span>2</span></span></td><td><span class=\"frac\"><span>15x</span><span>2</span></span></td><td><span class=\"frac\"><span>15x</span><span>4</span></span></td><td><span class=\"frac\"><span>25x</span><span>4</span></span></td><td><span class=\"frac\"><span>75x</span><span>4</span></span></td><td><span class=\"frac\"><span>75x</span><span>8</span></span></td><td><span class=\"frac\"><span>125x</span><span>8</span></span></td></tr></tbody></table></div><div class=\"math-solution standardized-solution\"><div class=\"eq-line\"><span class=\"frac\"><span>125x</span><span>8</span></span> = 375 ⇒ x = 24.</div></div>","questionHtml":"The value of a magic number triples from the first day to the second day, decreases by half from the second day to the third day and increases by half of the increase in the number from the first day to the second day on the fourth day. If the cycle repeats and the value of the magic number after 10 days is 375, what was the value on the 1st day?","optionsHtml":[],"questionNumber":2},{"sourceNumber":28,"type":"mcq","context":"","question":"A shopkeeper sold wheat to four customers. To his first customer, he sold half a kg less than half of what he had. To his second customer, he sold half a kg of wheat less than half the remaining quantity of wheat he had, and so on. The quantity of wheat left with him finally was 3 kg. The initial quantity of wheat he had must be","options":["between 20 kg and 25 kg","between 25 kg and 30 kg","between 30 kg and 35 kg","between 35 kg and 40 kg"],"answer":"C","sourcePage":3,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let the initial quantity be i kg.</div><div class=\"eq-line\">After the first customer, remaining wheat = <span class=\"frac\"><span>i</span><span>2</span></span> + <span class=\"frac\"><span>1</span><span>2</span></span>.</div><div class=\"eq-line\">After the nth customer, remaining wheat = <span class=\"frac\"><span>i</span><span>2<sup>n</sup></span></span> + (1 − <span class=\"frac\"><span>1</span><span>2<sup>n</sup></span></span>).</div><div class=\"eq-line\">After four customers: <span class=\"frac\"><span>i</span><span>16</span></span> + <span class=\"frac\"><span>15</span><span>16</span></span> = 3.</div><div class=\"eq-line\">i + 15 = 48 ⇒ i = 33 kg.</div><div class=\"eq-line\">33 kg lies between 30 kg and 35 kg. &nbsp; <strong>Choice (C)</strong></div></div>","questionHtml":"A shopkeeper sold wheat to four customers. To his first customer, he sold half a kg less than half of what he had. To his second customer, he sold half a kg of wheat less than half the remaining quantity of wheat he had, and so on. The quantity of wheat left with him finally was 3 kg. The initial quantity of wheat he had must be","optionsHtml":["between 20 kg and 25 kg","between 25 kg and 30 kg","between 30 kg and 35 kg","between 35 kg and 40 kg"],"questionNumber":3},{"sourceNumber":29,"type":"tita","context":"","question":"Prof. Mathur and Prof. Singh met at the All India Historians’ conference last week. Prof. Mathur told Prof. Singh, “I found out that your teaching experience (in years) is twice that of mine.” Prof. Singh replied in the affirmative. Prof. Mathur continued, “But last time when both of us came to the same conference, I remember that your teaching experience was thrice that of mine.” “That was two years ago,” Prof. Singh said. For how many years has Prof. Singh been teaching? (in years)","options":[],"answer":"8","sourcePage":3,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let Prof. Mathur’s present experience be x years; Prof. Singh’s is 2x.</div><div class=\"eq-line\">Two years ago: 2x − 2 = 3(x − 2).</div><div class=\"eq-line\">2x − 2 = 3x − 6 ⇒ x = 4.</div><div class=\"eq-line\">Prof. Singh’s experience = 2x = 8 years.</div></div>","questionHtml":"Prof. Mathur and Prof. Singh met at the All India Historians’ conference last week. Prof. Mathur told Prof. Singh, “I found out that your teaching experience (in years) is twice that of mine.” Prof. Singh replied in the affirmative. Prof. Mathur continued, “But last time when both of us came to the same conference, I remember that your teaching experience was thrice that of mine.” “That was two years ago,” Prof. Singh said. For how many years has Prof. Singh been teaching? (in years)","optionsHtml":[],"questionNumber":4},{"sourceNumber":30,"type":"mcq","context":"","question":"Many years ago, when Mr. Waugh was asked who among Steve and Mark was older, he said, “Two years from now Steve will be twice as old as he was two years ago, and in three years from now Mark will be three times as old as he was three years ago.” How old is Mark today, if Mr. Waugh was asked the question 27 years back, and who is older?","options":["31 years, Steve","33 years, both are of the same age","37 years, Mark","43 years, cannot say"],"answer":"B","sourcePage":3,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">At the time Mr. Waugh was asked, let Steve’s and Mark’s ages be x and y.</div><div class=\"eq-line\">x + 2 = 2(x − 2) ⇒ x = 6.</div><div class=\"eq-line\">y + 3 = 3(y − 3) ⇒ y = 6.</div><div class=\"eq-line\">That was 27 years ago, so both are now 6 + 27 = 33 years old.</div><div class=\"eq-line\"><strong>Choice (B)</strong></div></div>","questionHtml":"Many years ago, when Mr. Waugh was asked who among Steve and Mark was older, he said, “Two years from now Steve will be twice as old as he was two years ago, and in three years from now Mark will be three times as old as he was three years ago.” How old is Mark today, if Mr. Waugh was asked the question 27 years back, and who is older?","optionsHtml":["31 years, Steve","33 years, both are of the same age","37 years, Mark","43 years, cannot say"],"questionNumber":5},{"sourceNumber":31,"type":"mcq","context":"","question":"A man going in his car finds that the distance he has covered is equal to the sum of two quantities, one of which varies with time t and the second varies with t2. After 5 seconds the man has covered 100 metres, and after 6 seconds he has covered 138 metres. How far from the starting point is the man after 20 seconds?","options":["400 m","1300 m","1200 m","1250 m"],"answer":"B","sourcePage":3,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let S = K₁t + K₂t².</div><div class=\"eq-line\">At t = 5: 100 = 5K₁ + 25K₂ ⇒ K₁ + 5K₂ = 20. &nbsp; …(1)</div><div class=\"eq-line\">At t = 6: 138 = 6K₁ + 36K₂ ⇒ K₁ + 6K₂ = 23. &nbsp; …(2)</div><div class=\"eq-line\">(2) − (1): K₂ = 3; hence K₁ = 5.</div><div class=\"eq-line\">At t = 20: S = 5(20) + 3(20²) = 1,300 m. &nbsp; <strong>Choice (B)</strong></div></div>","questionHtml":"A man going in his car finds that the distance he has covered is equal to the sum of two quantities, one of which varies with time t and the second varies with t<sup>2</sup>. After 5 seconds the man has covered 100 metres, and after 6 seconds he has covered 138 metres. How far from the starting point is the man after 20 seconds?","optionsHtml":["400 m","1300 m","1200 m","1250 m"],"questionNumber":6},{"sourceNumber":32,"type":"tita","context":"","question":"The owner of a jewellery showroom hired three watchmen to guard his diamonds, but a thief still got in and stole some diamonds. On the way out, the thief met each watchman, one at a time. To each, he gave six more than 13 of the diamonds he had then. He escaped with 14 diamonds. How many diamonds did he steal from the store?","options":[],"answer":"90","sourcePage":3,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">If the thief has D diamonds before a watchman, he gives <span class=\"frac\"><span>D</span><span>3</span></span> + 6 and retains <span class=\"frac\"><span>2D</span><span>3</span></span> − 6.</div><div class=\"eq-line\">Before the third watchman: (14 + 6)<span class=\"frac\"><span>3</span><span>2</span></span> = 30.</div><div class=\"eq-line\">Before the second watchman: (30 + 6)<span class=\"frac\"><span>3</span><span>2</span></span> = 54.</div><div class=\"eq-line\">Before the first watchman: (54 + 6)<span class=\"frac\"><span>3</span><span>2</span></span> = 90.</div><div class=\"eq-line\">He stole 90 diamonds.</div></div>","questionHtml":"The owner of a jewellery showroom hired three watchmen to guard his diamonds, but a thief still got in and stole some diamonds. On the way out, the thief met each watchman, one at a time. To each, he gave six more than <span class=\"frac\"><span>1</span><span>3</span></span> of the diamonds he had then. He escaped with 14 diamonds. How many diamonds did he steal from the store?","optionsHtml":[],"questionNumber":7},{"sourceNumber":33,"type":"tita","context":"","question":"A test has 60 questions. A student scores 1 mark for a correct answer, −12 for a wrong answer and −14 for not attempting a question. If the net score of a student who attempted 48 questions is 33 marks, how many questions did he get wrong?","options":[],"answer":"8","sourcePage":3,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let wrong answers = x. Correct answers = 48 − x; unattempted = 60 − 48 = 12.</div><div class=\"eq-line\">(48 − x) − <span class=\"frac\"><span>x</span><span>2</span></span> − <span class=\"frac\"><span>12</span><span>4</span></span> = 33.</div><div class=\"eq-line\">45 − <span class=\"frac\"><span>3x</span><span>2</span></span> = 33 ⇒ <span class=\"frac\"><span>3x</span><span>2</span></span> = 12 ⇒ x = 8.</div></div>","questionHtml":"A test has 60 questions. A student scores 1 mark for a correct answer, −<span class=\"frac\"><span>1</span><span>2</span></span> for a wrong answer and −<span class=\"frac\"><span>1</span><span>4</span></span> for not attempting a question. If the net score of a student who attempted 48 questions is 33 marks, how many questions did he get wrong?","optionsHtml":[],"questionNumber":8},{"sourceNumber":34,"type":"mcq","context":"","question":"Three years ago, the ratio of A’s age to B’s age was 2 : 3. B’s present age and C’s age next year would be in the ratio 3 : 4. Two years hence, the ratio of A’s and C’s ages would be 3 : 5. Find the sum of the present ages of A, B and C (in years).","options":["54","56","52","58"],"answer":"A","sourcePage":3,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Three years ago let A = 2a and B = 3a.</div><div class=\"eq-line\">Present ages: A = 2a + 3 and B = 3a + 3. From B present : C next year = 3 : 4, C next year = 4a + 4.</div><div class=\"eq-line\">Two years hence: A = 2a + 5 and C = 4a + 5.</div><div class=\"eq-line\"><span class=\"frac\"><span>2a + 5</span><span>4a + 5</span></span> = <span class=\"frac\"><span>3</span><span>5</span></span> ⇒ a = 5.</div><div class=\"eq-line\">Present-age sum = (2a + 3) + (3a + 3) + (4a + 3) = 9a + 9 = 54.</div><div class=\"eq-line\"><strong>Choice (A)</strong></div></div>","questionHtml":"Three years ago, the ratio of A’s age to B’s age was 2 : 3. B’s present age and C’s age next year would be in the ratio 3 : 4. Two years hence, the ratio of A’s and C’s ages would be 3 : 5. Find the sum of the present ages of A, B and C (in years).","optionsHtml":["54","56","52","58"],"questionNumber":9},{"sourceNumber":35,"type":"mcq","context":"","question":"In a three-digit number, the sum of the digits is 15. The tens digit is one less than the units digit. Which of the following numbers cannot be a digit in the hundreds place?","options":["5","4","6","8"],"answer":"A","sourcePage":3,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let the hundreds digit be h and the tens digit be t. The units digit is t + 1.</div><div class=\"eq-line\">h + t + (t + 1) = 15 ⇒ h + 2t = 14.</div><div class=\"eq-line\">Therefore h must be even, so it cannot be 5. &nbsp; <strong>Choice (A)</strong></div></div>","questionHtml":"In a three-digit number, the sum of the digits is 15. The tens digit is one less than the units digit. Which of the following numbers cannot be a digit in the hundreds place?","optionsHtml":["5","4","6","8"],"questionNumber":10},{"sourceNumber":36,"type":"mcq","context":"","question":"When Mr. Sundaram asked Ajit about his age, Ajit said, “My age was a quarter of your age five years ago, but will only be half my age fifteen years from now.” How old is Mr. Sundaram?","options":["40 years","45 years","55 years","62 years"],"answer":"B","sourcePage":3,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let Mr. Sundaram’s present age be x and Ajit’s be y.</div><div class=\"eq-line\"><span class=\"frac\"><span>x − 5</span><span>4</span></span> = y − 5 ⇒ x = 4y − 15. &nbsp; …(1)</div><div class=\"eq-line\"><span class=\"frac\"><span>x + 15</span><span>2</span></span> = y + 15 ⇒ x = 2y + 15. &nbsp; …(2)</div><div class=\"eq-line\">From (1) and (2): 4y − 15 = 2y + 15 ⇒ y = 15 and x = 45.</div><div class=\"eq-line\"><strong>Choice (B)</strong></div></div>","questionHtml":"When Mr. Sundaram asked Ajit about his age, Ajit said, “My age was a quarter of your age five years ago, but will only be half my age fifteen years from now.” How old is Mr. Sundaram?","optionsHtml":["40 years","45 years","55 years","62 years"],"questionNumber":11},{"sourceNumber":37,"type":"tita","context":"Directions for questions 37 and 38: These questions are based on the following data.\n\nMr. Harish has three children whose names are Sachin, Rahul and Saurav. One day he bought 117 sweets for his children and planned to divide the sweets in such a manner that two times the number of sweets that Sachin would have got should be equal to three times that Rahul would have got and four times that Saurav would have got. Since Mr. Harish was very poor in counting, he divided the sweets in the ratio 2 : 3 : 4.","question":"How many sweets more than the intended number did Saurav get as a result of the actual sharing?","options":[],"answer":"25","sourcePage":3,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Intended ratio = <span class=\"frac\"><span>1</span><span>2</span></span> : <span class=\"frac\"><span>1</span><span>3</span></span> : <span class=\"frac\"><span>1</span><span>4</span></span> = 6 : 4 : 3.</div><div class=\"eq-line\">Intended shares from 117: Sachin = <span class=\"frac\"><span>6</span><span>13</span></span>(117) = 54, Rahul = <span class=\"frac\"><span>4</span><span>13</span></span>(117) = 36, Saurav = <span class=\"frac\"><span>3</span><span>13</span></span>(117) = 27.</div><div class=\"eq-line\">Actual ratio = 2 : 3 : 4, giving Sachin = 26, Rahul = 39 and Saurav = 52.</div></div><div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Saurav received 52 − 27 = 25 sweets more than intended.</div></div>","questionHtml":"How many sweets more than the intended number did Saurav get as a result of the actual sharing?","optionsHtml":[],"questionNumber":12},{"sourceNumber":38,"type":"tita","context":"Directions for questions 37 and 38: These questions are based on the following data.\n\nMr. Harish has three children whose names are Sachin, Rahul and Saurav. One day he bought 117 sweets for his children and planned to divide the sweets in such a manner that two times the number of sweets that Sachin would have got should be equal to three times that Rahul would have got and four times that Saurav would have got. Since Mr. Harish was very poor in counting, he divided the sweets in the ratio 2 : 3 : 4.","question":"If the distribution ratio was as intended and Saurav has to get as many sweets as Rahul actually got, what should the total number of sweets be?","options":[],"answer":"169","sourcePage":3,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Intended ratio = <span class=\"frac\"><span>1</span><span>2</span></span> : <span class=\"frac\"><span>1</span><span>3</span></span> : <span class=\"frac\"><span>1</span><span>4</span></span> = 6 : 4 : 3.</div><div class=\"eq-line\">Intended shares from 117: Sachin = <span class=\"frac\"><span>6</span><span>13</span></span>(117) = 54, Rahul = <span class=\"frac\"><span>4</span><span>13</span></span>(117) = 36, Saurav = <span class=\"frac\"><span>3</span><span>13</span></span>(117) = 27.</div><div class=\"eq-line\">Actual ratio = 2 : 3 : 4, giving Sachin = 26, Rahul = 39 and Saurav = 52.</div></div><div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let the required total be x.</div><div class=\"eq-line\">Saurav’s intended share = <span class=\"frac\"><span>3x</span><span>13</span></span> = Rahul’s actual share, 39.</div><div class=\"eq-line\">x = 169.</div></div>","questionHtml":"If the distribution ratio was as intended and Saurav has to get as many sweets as Rahul actually got, what should the total number of sweets be?","optionsHtml":[],"questionNumber":13},{"sourceNumber":39,"type":"mcq","context":"Directions for questions 39 and 40: These questions are based on the following data.\n\nThe villagers of Panigarh were facing an acute shortage of water this year. When the minister for water resources visited the village, he promised that a water tank would be constructed. As promised, a tank was built which could contain enough water for the entire village for 50 days.\n\nThe villagers discovered that there was a leak at the bottom of the tank which drained out 20,000 litres of water every day. As a result, the water lasted only 40 days for the entire village.","question":"What is the total requirement of water (in litres) of the village per day?","options":["40000","50000","75000","80000"],"answer":"D","sourcePage":4,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let daily village requirement be x kilolitres. Tank capacity = 50x.</div><div class=\"eq-line\">With a 20-kilolitre daily leak, the tank lasts 40 days:</div><div class=\"eq-line\">50x = 40(x + 20) ⇒ 50x = 40x + 800 ⇒ x = 80 kilolitres.</div><div class=\"eq-line\">Daily requirement = 80,000 litres. &nbsp; <strong>Choice (D)</strong></div></div>","questionHtml":"What is the total requirement of water (in litres) of the village per day?","optionsHtml":["40000","50000","75000","80000"],"questionNumber":14},{"sourceNumber":40,"type":"mcq","context":"Directions for questions 39 and 40: These questions are based on the following data.\n\nThe villagers of Panigarh were facing an acute shortage of water this year. When the minister for water resources visited the village, he promised that a water tank would be constructed. As promised, a tank was built which could contain enough water for the entire village for 50 days.\n\nThe villagers discovered that there was a leak at the bottom of the tank which drained out 20,000 litres of water every day. As a result, the water lasted only 40 days for the entire village.","question":"If the leak was plugged partially and only 5,000 litres of water was getting drained out per day, on which day would the tank get emptied?","options":["45th","46th","47th","48th"],"answer":"D","sourcePage":4,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Tank capacity = 50 × 80 = 4,000 kilolitres.</div><div class=\"eq-line\">With the partial leak, daily outflow = 80 + 5 = 85 kilolitres.</div><div class=\"eq-line\">Days = <span class=\"frac\"><span>4,000</span><span>85</span></span> = 47 <span class=\"frac\"><span>1</span><span>17</span></span>.</div><div class=\"eq-line\">The tank becomes empty during the 48th day. &nbsp; <strong>Choice (D)</strong></div></div>","questionHtml":"If the leak was plugged partially and only 5,000 litres of water was getting drained out per day, on which day would the tank get emptied?","optionsHtml":["45th","46th","47th","48th"],"questionNumber":15},{"sourceNumber":41,"type":"tita","context":"","question":"The road transport corporation has hired a consultant to determine the standard time for a journey between two places. The consultant concludes that the time of journey is proportional to the product of the square root of the number of passengers n and the distance S. For two distinct trips, the times are in the ratio 2 : 1 and the distances are 80 km and 30 km respectively. How many passengers are there in the first bus if the second bus has 64 passengers?","options":[],"answer":"36","sourcePage":4,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">t = k√n · S.</div><div class=\"eq-line\"><span class=\"frac\"><span>t₁</span><span>t₂</span></span> = √<span class=\"frac\"><span>n₁</span><span>n₂</span></span> · <span class=\"frac\"><span>S₁</span><span>S₂</span></span>.</div><div class=\"eq-line\">2 = √<span class=\"frac\"><span>n₁</span><span>64</span></span> · <span class=\"frac\"><span>80</span><span>30</span></span>.</div><div class=\"eq-line\">√<span class=\"frac\"><span>n₁</span><span>64</span></span> = <span class=\"frac\"><span>3</span><span>4</span></span> ⇒ <span class=\"frac\"><span>n₁</span><span>64</span></span> = <span class=\"frac\"><span>9</span><span>16</span></span>.</div><div class=\"eq-line\">n₁ = 36 passengers.</div></div>","questionHtml":"The road transport corporation has hired a consultant to determine the standard time for a journey between two places. The consultant concludes that the time of journey is proportional to the product of the square root of the number of passengers n and the distance S. For two distinct trips, the times are in the ratio 2 : 1 and the distances are 80 km and 30 km respectively. How many passengers are there in the first bus if the second bus has 64 passengers?","optionsHtml":[],"questionNumber":16},{"sourceNumber":42,"type":"mcq","context":"","question":"A small child buys a Cornetto cone ice-cream. The amount of ice-cream varies with the square of the radius of the base when height is constant, and varies with height when radius is constant. When the radius is 3.5 cm and the height is 6 cm, the child eats 77 cc. What is the radius when the child eats 154 cc and the height is 3 cm?","options":["28 cm","17.5 cm","7 cm","10.5 cm"],"answer":"C","sourcePage":4,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Amount A = kr²h.</div><div class=\"eq-line\">77 = k(3.5²)(6). &nbsp; …(1)</div><div class=\"eq-line\">154 = k(r²)(3). &nbsp; …(2)</div><div class=\"eq-line\">Dividing (2) by (1): <span class=\"frac\"><span>154</span><span>77</span></span> = <span class=\"frac\"><span>3r²</span><span>6(3.5²)</span></span>.</div><div class=\"eq-line\">2 = <span class=\"frac\"><span>r²</span><span>2(3.5²)</span></span> ⇒ r² = 4(3.5²) ⇒ r = 7 cm.</div><div class=\"eq-line\"><strong>Choice (C)</strong></div></div>","questionHtml":"A small child buys a Cornetto cone ice-cream. The amount of ice-cream varies with the square of the radius of the base when height is constant, and varies with height when radius is constant. When the radius is 3.5 cm and the height is 6 cm, the child eats 77 cc. What is the radius when the child eats 154 cc and the height is 3 cm?","optionsHtml":["28 cm","17.5 cm","7 cm","10.5 cm"],"questionNumber":17},{"sourceNumber":43,"type":"tita","context":"","question":"The drop in temperature from the previous day varies directly as the square root of the rainfall in mm. On April 22nd, 25 mm of rainfall was recorded and the temperature was 32°C, compared with 42°C the day before. On May 16th, there was rainfall of 36 mm; the temperature on May 15th was 44°C. What was the temperature on May 16th? (in °C)","options":[],"answer":"32","sourcePage":4,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let temperature drop t = k√r, where r is rainfall.</div><div class=\"eq-line\">On April 22: 42 − 32 = k√25 ⇒ 10 = 5k ⇒ k = 2.</div><div class=\"eq-line\">For 36 mm rainfall: drop = 2√36 = 12°C.</div><div class=\"eq-line\">May 16 temperature = 44 − 12 = 32°C.</div></div>","questionHtml":"The drop in temperature from the previous day varies directly as the square root of the rainfall in mm. On April 22nd, 25 mm of rainfall was recorded and the temperature was 32°C, compared with 42°C the day before. On May 16th, there was rainfall of 36 mm; the temperature on May 15th was 44°C. What was the temperature on May 16th? (in °C)","optionsHtml":[],"questionNumber":18},{"sourceNumber":44,"type":"mcq","context":"Directions for questions 44 and 45: These questions are based on the following data.\n\nIn the “Get-none” supermarket, new software was installed in the computerised billing section. On the first day of operation, for a particular item it reversed the digits of both the number of pieces left unsold and the price per piece. As a result, the closing stock showed 63 pieces less and the value of the pieces still left was shown as ₹936. Both the stock left and the price per piece are two-digit numbers.","question":"How many items were actually left at the end of the day?","options":["29","81","92","Either (B) or (C)"],"answer":"B","sourcePage":4,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let actual stock left be 10x + y; the software records 10y + x.</div><div class=\"eq-line\">(10x + y) − (10y + x) = 63 ⇒ 9(x − y) = 63 ⇒ x − y = 7.</div><div class=\"eq-line\">The possible actual stocks are 81 and 92.</div><div class=\"eq-line\">The incorrect stock and incorrect price must multiply to ₹936. Since 936 = 18 × 52, the incorrect stock is 18 and incorrect price is ₹52.</div><div class=\"eq-line\">Therefore actual stock = 81 and actual price = ₹25.</div></div><div class=\"math-solution standardized-solution\"><div class=\"eq-line\"><strong>81 items — Choice (B)</strong></div></div>","questionHtml":"How many items were actually left at the end of the day?","optionsHtml":["29","81","92","Either (B) or (C)"],"questionNumber":19},{"sourceNumber":45,"type":"mcq","context":"Directions for questions 44 and 45: These questions are based on the following data.\n\nIn the “Get-none” supermarket, new software was installed in the computerised billing section. On the first day of operation, for a particular item it reversed the digits of both the number of pieces left unsold and the price per piece. As a result, the closing stock showed 63 pieces less and the value of the pieces still left was shown as ₹936. Both the stock left and the price per piece are two-digit numbers.","question":"By how much would the incorrectly calculated value of items sold be more/less than the correctly calculated value?","options":["₹887 more","₹887 less","₹1089 less","Cannot be determined"],"answer":"D","sourcePage":4,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let actual stock left be 10x + y; the software records 10y + x.</div><div class=\"eq-line\">(10x + y) − (10y + x) = 63 ⇒ 9(x − y) = 63 ⇒ x − y = 7.</div><div class=\"eq-line\">The possible actual stocks are 81 and 92.</div><div class=\"eq-line\">The incorrect stock and incorrect price must multiply to ₹936. Since 936 = 18 × 52, the incorrect stock is 18 and incorrect price is ₹52.</div><div class=\"eq-line\">Therefore actual stock = 81 and actual price = ₹25.</div></div><div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let actual number sold be z; the software shows z + 63.</div><div class=\"eq-line\">Incorrect sold value = 52(z + 63); correct sold value = 25z.</div><div class=\"eq-line\">Their difference depends on z, which is unknown.</div><div class=\"eq-line\"><strong>Cannot be determined — Choice (D)</strong></div></div>","questionHtml":"By how much would the incorrectly calculated value of items sold be more/less than the correctly calculated value?","optionsHtml":["₹887 more","₹887 less","₹1089 less","Cannot be determined"],"questionNumber":20},{"sourceNumber":46,"type":"tita","context":"","question":"Mr. Richie Rich inherited 2,602 silver coins. He divided them among his three sons Amar, Akbar and Anthony. Amar gives 23 coins from his share to his wife, Akbar donates 37 coins to charity and Anthony sells 42 coins. The coins remaining with them are in the ratio 11 : 9 : 5. How many coins did Amar receive from his father?","options":[],"answer":"1123","sourcePage":4,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Coins remaining after the three deductions = 2,602 − (23 + 37 + 42) = 2,500.</div><div class=\"eq-line\">Remaining ratio = 11 : 9 : 5; total parts = 25.</div><div class=\"eq-line\">Amar’s remaining coins = <span class=\"frac\"><span>11</span><span>25</span></span>(2,500) = 1,100.</div><div class=\"eq-line\">Initially Amar received 1,100 + 23 = 1,123 coins.</div></div>","questionHtml":"Mr. Richie Rich inherited 2,602 silver coins. He divided them among his three sons Amar, Akbar and Anthony. Amar gives 23 coins from his share to his wife, Akbar donates 37 coins to charity and Anthony sells 42 coins. The coins remaining with them are in the ratio 11 : 9 : 5. How many coins did Amar receive from his father?","optionsHtml":[],"questionNumber":21},{"sourceNumber":47,"type":"mcq","context":"","question":"A, B and C have some money. If A gives ₹15 to B, then A and B would have the same amount. If C takes half of B’s money, he will have five times as much money as is left with B. The ratio of the amounts with A and B is 5 : 2. What is the total amount with the three of them?","options":["₹55","₹110","₹165","₹231"],"answer":"B","sourcePage":4,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">If A gives ₹15 to B, they become equal; therefore A has ₹30 more than B.</div><div class=\"eq-line\">A : B = 5 : 2, so 3 parts = ₹30 ⇒ one part = ₹10.</div><div class=\"eq-line\">Thus A = ₹50 and B = ₹20.</div><div class=\"eq-line\">If B = 2x, then C = 4x; hence C = ₹40.</div><div class=\"eq-line\">Total = ₹50 + ₹20 + ₹40 = ₹110. &nbsp; <strong>Choice (B)</strong></div></div>","questionHtml":"A, B and C have some money. If A gives ₹15 to B, then A and B would have the same amount. If C takes half of B’s money, he will have five times as much money as is left with B. The ratio of the amounts with A and B is 5 : 2. What is the total amount with the three of them?","optionsHtml":["₹55","₹110","₹165","₹231"],"questionNumber":22},{"sourceNumber":48,"type":"tita","context":"","question":"The sum of the ages of the four members of the Rathore family is 140 years. Five years ago, the ages of Inder, Sunder, Mrs. Rathore and Mr. Rathore were in the ratio 2 : 3 : 7 : 8. After how many years would Inder be as old as his mother is today?","options":[],"answer":"30","sourcePage":4,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Five years ago the total age was 140 − 4(5) = 120 years.</div><div class=\"eq-line\">Let the ages then be 2k, 3k, 7k and 8k.</div><div class=\"eq-line\">20k = 120 ⇒ k = 6.</div><div class=\"eq-line\">Inder was 12 and is now 17; his mother was 42 and is now 47.</div><div class=\"eq-line\">Inder will reach 47 after 47 − 17 = 30 years.</div></div>","questionHtml":"The sum of the ages of the four members of the Rathore family is 140 years. Five years ago, the ages of Inder, Sunder, Mrs. Rathore and Mr. Rathore were in the ratio 2 : 3 : 7 : 8. After how many years would Inder be as old as his mother is today?","optionsHtml":[],"questionNumber":23},{"sourceNumber":49,"type":"mcq","context":"Directions for questions 49 and 50: These questions are based on the following data.\n\nMr. Nanda and Mr. Parekh are two of my neighbours. Each son of Mr. Nanda had five times as many sisters as the number of brothers, while each son of Mr. Parekh had as many sisters as the number of brothers. Each daughter of Mr. Nanda had twice the number of sisters as the number of brothers, but each daughter of Mr. Parekh had twice the number of brothers as the number of sisters.","question":"How many children does Mr. Parekh have?","options":["7","4","5","6"],"answer":"A","sourcePage":4,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Nanda family: let daughters = x and sons = y.</div><div class=\"eq-line\">x = 5(y − 1), and x − 1 = 2y ⇒ x = 5, y = 2.</div><div class=\"eq-line\">Parekh family: let daughters = a and sons = b.</div><div class=\"eq-line\">a = b − 1, and b = 2(a − 1) ⇒ a = 3, b = 4.</div></div><div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Mr. Parekh has 3 + 4 = 7 children. &nbsp; <strong>Choice (A)</strong></div></div>","questionHtml":"How many children does Mr. Parekh have?","optionsHtml":["7","4","5","6"],"questionNumber":24},{"sourceNumber":50,"type":"mcq","context":"Directions for questions 49 and 50: These questions are based on the following data.\n\nMr. Nanda and Mr. Parekh are two of my neighbours. Each son of Mr. Nanda had five times as many sisters as the number of brothers, while each son of Mr. Parekh had as many sisters as the number of brothers. Each daughter of Mr. Nanda had twice the number of sisters as the number of brothers, but each daughter of Mr. Parekh had twice the number of brothers as the number of sisters.","question":"What is the ratio of the number of sons to that of the daughters in the two families together?","options":["4 : 3","3 : 4","5 : 2","2 : 5"],"answer":"B","sourcePage":4,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Nanda family: let daughters = x and sons = y.</div><div class=\"eq-line\">x = 5(y − 1), and x − 1 = 2y ⇒ x = 5, y = 2.</div><div class=\"eq-line\">Parekh family: let daughters = a and sons = b.</div><div class=\"eq-line\">a = b − 1, and b = 2(a − 1) ⇒ a = 3, b = 4.</div></div><div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Combined sons : daughters = (2 + 4) : (5 + 3) = 6 : 8 = 3 : 4. &nbsp; <strong>Choice (B)</strong></div></div>","questionHtml":"What is the ratio of the number of sons to that of the daughters in the two families together?","optionsHtml":["4 : 3","3 : 4","5 : 2","2 : 5"],"questionNumber":25}]}</script><script>
const data=JSON.parse(document.getElementById('testData').textContent),labels=['A','B','C','D'],total=data.questions.length,answers=Array(total).fill(null),marked=Array(total).fill(false);let current=0,submitted=false,seconds=data.durationMinutes*60,timerId=null;const host=document.getElementById('questionHost'),bar=document.getElementById('qbar'),result=document.getElementById('result');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function text(v){return esc(v).replace(/\s*\n+\s*/g,' ')}function mathText(v){
let s=text(v).replace(/(\d+)\s*\/\s*(\d+)\s*(?:st|nd|rd|th)\b/gi,'$1/$2');
const blocked=new Set(['is','are','and','or','per','hr','hrs','hour','hours','min','mins','sec','secs','day','days','week','weeks','month','months','year','years','switch','board','km','cm','mm','m','lt','units']);
const atom='(?:\\([^()<>]{1,80}\\)|\\{[^{}<>]{1,100}\\}|[−-]?(?:\\d+(?:\\.\\d+)?[A-Za-zπ]{0,5}[²³⁴⁵⁶⁷⁸⁹⁰]*|[A-Za-zπ][A-Za-z0-9π²³⁴⁵⁶⁷⁸⁹⁰]{0,5})[°%]?)';
const fraction=new RegExp('(^|[^\\w/])('+atom+')\\s*\\/\\s*('+atom+')(?=$|[^\\w/])','g');
let prior;
do{prior=s;s=s.replace(fraction,(m,p,a,b)=>blocked.has(a.replace(/[()−-]/g,'').toLowerCase())||blocked.has(b.replace(/[()−-]/g,'').toLowerCase())?m:p+'<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>')}while(s!==prior);
return s}
function formatStimulus(v){const marker=/^((?:\d+\.|\(\d+\)|\([a-z]\)|[ivx]+\.|•)\s*)(.*)$/i;return String(v??'').split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).map(block=>{const lines=block.split('\n').map(x=>x.trim()).filter(Boolean);if(/^Directions\s+for\s+/i.test(lines[0]))return `<p class="direction">${mathText(lines.join(' '))}</p>`;const prose=[],items=[];let item=null;lines.forEach(line=>{const m=line.match(marker);if(m){if(item)items.push(item);item={marker:m[1].trim(),body:m[2]}}else if(item)item.body+=' '+line;else prose.push(line)});if(item)items.push(item);let out=prose.length?`<p>${mathText(prose.join(' '))}</p>`:'';if(items.length)out+=`<div class="info-list">${items.map(x=>`<div class="info-item"><span class="info-marker">${esc(x.marker)}</span><span class="info-body">${mathText(x.body)}</span></div>`).join('')}</div>`;return out||`<p>${mathText(lines.join(' '))}</p>`}).join('')}

function response(q){if(q.type==='mcq')return `<div class="options ${q.imageOnly?'image-choice':''}">${q.options.map((op,i)=>`<label class="option"><input type="radio" name="answer" value="${labels[i]}" ${answers[current]===labels[i]?'checked':''} ${submitted?'disabled':''}><span>(${labels[i]})${q.imageOnly?'':' '+(q.optionsHtml&&q.optionsHtml[i]?q.optionsHtml[i]:mathText(op))}</span></label>`).join('')}</div>`;return `<div class="tita"><label for="titaInput">Type your answer:</label><input id="titaInput" aria-label="Type your answer" placeholder="Type your answer" inputmode="decimal" value="${esc(answers[current]??'')}" ${submitted?'disabled':''}><div class="tita-note">TITA: type the numerical/value answer. No negative marking.</div></div>`}
function contextLocalNumbers(ctx){const ids=[];data.questions.forEach((x,i)=>{if(String(x.context||'')===String(ctx||''))ids.push(i+1)});return ids}
function localRangeLabel(ids,prefix){if(!ids.length)return prefix==='common'?'Common Information':'';if(ids.length===1)return prefix==='common'?`Common Information – Question ${ids[0]}`:`question ${ids[0]}`;const contiguous=ids.every((v,i)=>i===0||v===ids[i-1]+1);if(contiguous&&ids.length===2)return prefix==='common'?`Common Information – Questions ${ids[0]}–${ids[1]}`:`questions ${ids[0]} and ${ids[1]}`;if(contiguous)return prefix==='common'?`Common Information – Questions ${ids[0]}–${ids[ids.length-1]}`:`questions ${ids[0]} to ${ids[ids.length-1]}`;return prefix==='common'?`Common Information – Questions ${ids.join(', ')}`:`questions ${ids.join(', ')}`}
function localizeContext(ctx){const ids=contextLocalNumbers(ctx);if(!ids.length)return String(ctx||'');const lines=String(ctx||'').split('\n');const first=lines[0]||'';const m=first.match(/^Directions\s+for\s+questions?\s+[^:]+:(.*)$/i);if(m)lines[0]=`Directions for ${localRangeLabel(ids,'directions')}:${m[1]}`;return lines.join('\n')}
function localizedSolution(q){let s=String(q.solution||'');s=s.replace(/Solutions?\s+for\s+questions?[^<:]*(?::|<\/text>)/gi,'');s=s.replace(/Choice\s*\([A-D]\)/gi,'');s=s.replace(/Ans(?:wer)?\s*[:=][^<]*/gi,'');return s}
function render(){const q=data.questions[current],has=!!q.context,information=has?`<section class="qa-context"><div class="common-qno">${localRangeLabel(contextLocalNumbers(q.context),'common')}</div><div class="stimulus-copy">${formatStimulus(localizeContext(q.context))}</div>${q.visual||''}</section>`:`<p class="qa-direction">Answer the question independently.</p>`;host.innerHTML=`<div class="test-content"><section class="response-pane"><div class="qhead"><div class="qnum">Question ${current+1} of ${total}</div></div>${information}${q.questionVisual||''}<h2 class="question-title">${q.questionHtml||mathText(q.question)}</h2>${response(q)}<div id="answerNote" class="answer-note"></div><section class="solution direct-solution"><div class="solution-heading">Solution</div>${localizedSolution(q)}</section></section></div><div class="navrow"><button type="button" onclick="markNext()">Mark for Review & Next</button><button type="button" onclick="clearResponse()" ${submitted?'disabled':''}>Clear Response</button><button type="button" class="previous" onclick="previous()" ${current===0?'disabled':''}>Previous</button><button type="button" class="save" onclick="next()">Save & Next</button></div>`;bind();if(submitted)review();renderBar()}
function bind(){host.querySelectorAll('input[name="answer"]').forEach(el=>el.onchange=()=>{answers[current]=el.value;renderBar()});const t=document.getElementById('titaInput');if(t)t.oninput=()=>{answers[current]=t.value.trim();renderBar()}}
function save(){const t=document.getElementById('titaInput');if(t&&!submitted)answers[current]=t.value.trim();const r=host.querySelector('input[name="answer"]:checked');if(r&&!submitted)answers[current]=r.value}function go(i){save();current=i;render()}function next(){if(current<total-1)go(current+1)}function previous(){if(current>0)go(current-1)}function markNext(){save();marked[current]=true;if(current<total-1)go(current+1);else render()}function clearResponse(){answers[current]=null;render()}
function correct(q,a){if(a===null||a==='')return null;if(q.type==='mcq')return a===q.answer;const n=v=>String(v).trim().replace(/,/g,'');return n(a)===n(q.answer)}function review(){const q=data.questions[current],s=correct(q,answers[current]),n=document.getElementById('answerNote');n.className='answer-note '+(s===null?'muted':s?'ok':'bad');n.textContent=s===null?'Unattempted. Correct answer: '+q.answer:s?'Correct.':'Wrong. Correct answer: '+q.answer}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm('Submit this sectional test now?'))return;submitted=true;clearInterval(timerId);document.body.classList.add('submitted');let c=0,w=0,u=0,score=0;data.questions.forEach((q,i)=>{const s=correct(q,answers[i]);if(s===null)u++;else if(s){c++;score+=3}else{w++;if(q.type==='mcq')score--}});result.style.display='block';result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score">Score<strong>${score}</strong></div><div class="score">Correct<strong>${c}</strong></div><div class="score">Wrong<strong>${w}</strong></div><div class="score">Attempted<strong>${c+w}</strong></div><div class="score">Unattempted<strong>${u}</strong></div></div>`;render()}
function tick(){const m=Math.floor(seconds/60),s=seconds%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(seconds<=0){submitTest(true);return}seconds--}const calc=document.getElementById('calc'),display=document.getElementById('calcDisplay'),calcResult=document.getElementById('calcResult');let memory=0;const evaluate=v=>{if(!/^[0-9+\-*/().\s]+$/.test(v))throw Error();return Function('return ('+(v||'0')+')')()};const showResult=v=>{calcResult.textContent=Number.isFinite(Number(v))?String(v):'Error'};document.getElementById('calcToggle').onclick=()=>calc.classList.toggle('open');document.getElementById('calcClose').onclick=()=>calc.classList.remove('open');document.getElementById('calcMin').onclick=()=>calc.classList.remove('open');document.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>{const v=b.dataset.calc;try{if(v==='C'){display.value='';showResult(0)}else if(v==='B')display.value=display.value.slice(0,-1);else if(v==='='){const n=evaluate(display.value);display.value=String(n);showResult(n)}else if(v==='S'){const n=-evaluate(display.value);display.value=String(n);showResult(n)}else if(v==='Q'){const n=Math.sqrt(evaluate(display.value));display.value=String(n);showResult(n)}else if(v==='P'){const n=evaluate(display.value)/100;display.value=String(n);showResult(n)}else if(v==='I'){const n=1/evaluate(display.value);display.value=String(n);showResult(n)}else if(v==='MC')memory=0;else if(v==='MR')display.value+=String(memory);else if(v==='MS')memory=evaluate(display.value);else if(v==='M+')memory+=evaluate(display.value);else if(v==='M-')memory-=evaluate(display.value);else display.value+=v}catch{showResult('Error')}});let dragging=false,dx=0,dy=0,pointerId=null;const dragBar=document.querySelector('.calc-title');dragBar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;dragging=true;pointerId=e.pointerId;const r=calc.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;calc.classList.add('dragging');dragBar.setPointerCapture(pointerId)});dragBar.addEventListener('pointermove',e=>{if(!dragging)return;const maxX=Math.max(0,window.innerWidth-calc.offsetWidth),maxY=Math.max(84,window.innerHeight-calc.offsetHeight);calc.style.left=Math.min(maxX,Math.max(0,e.clientX-dx))+'px';calc.style.top=Math.min(maxY,Math.max(84,e.clientY-dy))+'px';calc.style.right='auto'});const stopDrag=()=>{dragging=false;calc.classList.remove('dragging');if(pointerId!==null&&dragBar.hasPointerCapture(pointerId))dragBar.releasePointerCapture(pointerId);pointerId=null};dragBar.addEventListener('pointerup',stopDrag);dragBar.addEventListener('pointercancel',stopDrag);window.addEventListener('resize',()=>{const r=calc.getBoundingClientRect();if(r.right>window.innerWidth)calc.style.left=Math.max(0,window.innerWidth-r.width)+'px';if(r.bottom>window.innerHeight)calc.style.top=Math.max(84,window.innerHeight-r.height)+'px'});window.go=go;window.previous=previous;window.markNext=markNext;window.clearResponse=clearResponse;window.submitTest=submitTest;render();tick();timerId=setInterval(tick,1000);
</script></body></html>
