</style></head><body><header><div class="topbar"><div class="title"><h1>QA Sectional Test - 3</h1><div class="meta">20 Questions | 40 Minutes | 10 MCQ + 10 TITA | +3 correct | -1 wrong MCQ | 0 wrong TITA</div></div><button aria-label="Open calculator" class="calc-toggle" id="calcToggle" type="button">▦</button><div class="timer">Time Left:<br/><span id="time">40:00</span></div></div></header><main><section class="work"><div class="result" id="result"></div><div class="question-host" id="questionHost"></div></section><aside class="side"><h2>Question Bar</h2><div class="qbar" id="qbar"></div><div class="legend"><span><i class="dot current"></i>Current</span><span><i class="dot answered"></i>Answered</span><span><i class="dot marked"></i>Marked</span></div><button class="side-submit" onclick="submitTest()" type="button">Submit</button></aside></main><aside class="calc" id="calc"><div class="calc-title"><span>Normal Calculator</span><span class="calc-title-actions"><button aria-label="Minimize calculator" id="calcMin" type="button">-</button><button aria-label="Close calculator" id="calcClose" type="button">×</button></span></div><input aria-label="Calculator expression" class="calc-display" id="calcDisplay" readonly=""/><div class="calc-result" id="calcResult">0</div><div class="calc-grid"><button class="" data-calc="MC" type="button">MC</button><button class="" data-calc="MR" type="button">MR</button><button class="" data-calc="MS" type="button">MS</button><button class="" data-calc="M+" type="button">M+</button><button class="" data-calc="M-" type="button">M-</button><button class="danger" data-calc="B" type="button">←</button><button class="danger" data-calc="C" type="button">C</button><button class="danger" data-calc="S" type="button">+/-</button><button class="" data-calc="Q" type="button">√</button><button class="" data-calc="P" type="button">%</button><button class="" data-calc="7" type="button">7</button><button class="" data-calc="8" type="button">8</button><button class="" data-calc="9" type="button">9</button><button class="" data-calc="/" type="button">/</button><button class="" data-calc="I" type="button">1/x</button><button class="" data-calc="4" type="button">4</button><button class="" data-calc="5" type="button">5</button><button class="" data-calc="6" type="button">6</button><button class="" data-calc="*" type="button">*</button><button class="eq" data-calc="=" type="button">=</button><button class="" data-calc="1" type="button">1</button><button class="" data-calc="2" type="button">2</button><button class="" data-calc="3" type="button">3</button><button class="" data-calc="-" type="button">-</button><button class="" data-calc="0" type="button">0</button><button class="" data-calc="." type="button">.</button><button class="" data-calc="+" type="button">+</button></div></aside><script id="testData" type="application/json">{"exercise":2,"part":1,"durationMinutes":40,"questions":[{"sourceNumber":1,"type":"tita","context":"","question":"Rohan purchased a single-bedroom flat and later sold it at a profit percentage equal to 1400 of the price (in rupees) at which he purchased it. If he received ₹43,824 in the transaction, at what price did he purchase the flat? (in ₹)","options":[],"answer":"26400","sourcePage":5,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let the purchase price be ₹400x. Then the profit percentage is x%.</div><div class=\"eq-line\">400x + <span class=\"frac\"><span>x</span><span>100</span></span>(400x) = 43,824.</div><div class=\"eq-line\">400x + 4x² = 43,824 ⇒ x² + 100x − 10,956 = 0.</div><div class=\"eq-line\">(x − 66)(x + 166) = 0 ⇒ x = 66.</div><div class=\"eq-line\">Purchase price = 400(66) = ₹26,400. <strong>Answer: 26400</strong></div></div>","questionHtml":"Rohan purchased a single-bedroom flat and later sold it at a profit percentage equal to <span class=\"frac\"><span>1</span><span>400</span></span> of the price (in rupees) at which he purchased it. If he received ₹43,824 in the transaction, at what price did he purchase the flat? (in ₹)","optionsHtml":[],"questionNumber":1},{"sourceNumber":2,"type":"tita","context":"","question":"The pollution level at a point 50 m above the main chimney of a factory should be less than 0.02%. Due to a leak, the pollution level increased to 10%. If 40% of the pollutants are cleaned up daily, in how many days will the pollution return to the acceptable level? (Take log 2 = 0.3010 and log 3 = 0.4771.)","options":[],"answer":"13","sourcePage":5,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">After n days, 60% of the previous day’s pollutants remains:</div><div class=\"eq-line\">10(0.6)<sup>n</sup> &lt; 0.02.</div><div class=\"eq-line\">Taking common logarithms: n(log 0.6) &lt; log 0.002.</div><div class=\"eq-line\">log 0.6 = log 2 + log 3 − 1 = −0.2219; log 0.002 = −2.6990.</div><div class=\"eq-line\">−0.2219n &lt; −2.6990 ⇒ n &gt; 12.15.</div><div class=\"eq-line\">The first whole day satisfying the condition is day 13. <strong>Answer: 13</strong></div></div>","questionHtml":"The pollution level at a point 50 m above the main chimney of a factory should be less than 0.02%. Due to a leak, the pollution level increased to 10%. If 40% of the pollutants are cleaned up daily, in how many days will the pollution return to the acceptable level? (Take log 2 = 0.3010 and log 3 = 0.4771.)","optionsHtml":[],"questionNumber":2},{"sourceNumber":3,"type":"mcq","context":"","question":"Anand buys an article and sells it at a 10% profit. His brother Srinath could have purchased it for 10% less and sold it for ₹25 more than Anand did, thereby making a 50% profit. What is Anand’s cost price?","options":["₹100","₹135","₹150","Cannot be determined"],"answer":"A","sourcePage":5,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let Anand’s cost price be ₹x; his selling price is ₹1.1x.</div><div class=\"eq-line\">Srinath’s cost price would be ₹0.9x and his selling price ₹(1.1x + 25).</div><div class=\"eq-line\">For a 50% profit: 1.5(0.9x) = 1.1x + 25.</div><div class=\"eq-line\">1.35x − 1.1x = 25 ⇒ 0.25x = 25 ⇒ x = ₹100. <strong>Choice (A)</strong></div></div>","questionHtml":"Anand buys an article and sells it at a 10% profit. His brother Srinath could have purchased it for 10% less and sold it for ₹25 more than Anand did, thereby making a 50% profit. What is Anand’s cost price?","optionsHtml":["₹100","₹135","₹150","Cannot be determined"],"questionNumber":3},{"sourceNumber":4,"type":"mcq","context":"","question":"The debentures of Soft Visual Limited are quoted at a 20% discount and pay 15% interest on face value. If Govind invests ₹1,87,400 in these debentures, what is the rate of return on his investment?","options":["35%","18%","18.75%","24.5%"],"answer":"C","sourcePage":5,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Take the face value as ₹100. At a 20% discount, investment price = ₹80.</div><div class=\"eq-line\">Annual interest = 15% of ₹100 = ₹15.</div><div class=\"eq-line\">Rate of return = <span class=\"frac\"><span>15</span><span>80</span></span> × 100% = 18.75%. <strong>Choice (C)</strong></div></div>","questionHtml":"The debentures of Soft Visual Limited are quoted at a 20% discount and pay 15% interest on face value. If Govind invests ₹1,87,400 in these debentures, what is the rate of return on his investment?","optionsHtml":["35%","18%","18.75%","24.5%"],"questionNumber":4},{"sourceNumber":5,"type":"tita","context":"","question":"One thousand people voted on a resolution and 10% of the votes were invalid. After discussion they voted again, and 20% of the votes were invalid. The number voting against increased by 50%, and the motion was rejected by a majority 300% greater than the majority by which it was formerly passed. How many people voted against the resolution after the discussion?","options":[],"answer":"600","sourcePage":5,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">First vote: valid votes = 900. Let votes against = x; votes for = 900 − x.</div><div class=\"eq-line\">Second vote: valid votes = 800. Votes against = 1.5x; votes for = 800 − 1.5x.</div><div class=\"eq-line\">Old passage majority = (900 − x) − x = 900 − 2x.</div><div class=\"eq-line\">New rejection majority = 1.5x − (800 − 1.5x) = 3x − 800.</div><div class=\"eq-line\">“300% more” means four times: 3x − 800 = 4(900 − 2x).</div><div class=\"eq-line\">11x = 4,400 ⇒ x = 400; new votes against = 1.5(400) = 600. <strong>Answer: 600</strong></div></div>","questionHtml":"One thousand people voted on a resolution and 10% of the votes were invalid. After discussion they voted again, and 20% of the votes were invalid. The number voting against increased by 50%, and the motion was rejected by a majority 300% greater than the majority by which it was formerly passed. How many people voted against the resolution after the discussion?","optionsHtml":[],"questionNumber":5},{"sourceNumber":6,"type":"mcq","context":"","question":"Sam earns a fixed salary of ₹1,200 per month and a commission of 8% on annual sales exceeding ₹1,00,000. What are his annual sales if, on average, he earns ₹1,600 per month?","options":["₹1,20,000","₹1,40,000","₹1,60,000","₹1,80,000"],"answer":"C","sourcePage":5,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Average monthly commission = ₹1,600 − ₹1,200 = ₹400.</div><div class=\"eq-line\">Annual commission = 12(400) = ₹4,800.</div><div class=\"eq-line\">Let annual sales be ₹S. Then 0.08(S − 1,00,000) = 4,800.</div><div class=\"eq-line\">S − 1,00,000 = 60,000 ⇒ S = ₹1,60,000. <strong>Choice (C)</strong></div></div>","questionHtml":"Sam earns a fixed salary of ₹1,200 per month and a commission of 8% on annual sales exceeding ₹1,00,000. What are his annual sales if, on average, he earns ₹1,600 per month?","optionsHtml":["₹1,20,000","₹1,40,000","₹1,60,000","₹1,80,000"],"questionNumber":6},{"sourceNumber":7,"type":"tita","context":"","question":"Aamal buys a certain number of oranges at ₹7 a dozen and an equal number at ₹6 a dozen. He sells all the oranges at ₹7.50 a dozen and makes a profit of ₹80. How many oranges does he buy? (Answer in dozens.)","options":[],"answer":"80","sourcePage":5,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">For one dozen bought at ₹7 and one dozen at ₹6, total cost = ₹13.</div><div class=\"eq-line\">Selling two dozen at ₹7.50 per dozen gives ₹15, so profit = ₹2 per pair of dozens.</div><div class=\"eq-line\">Number of such pairs = 80 ÷ 2 = 40.</div><div class=\"eq-line\">Total quantity = 40 × 2 = 80 dozen. <strong>Answer: 80</strong></div></div>","questionHtml":"Aamal buys a certain number of oranges at ₹7 a dozen and an equal number at ₹6 a dozen. He sells all the oranges at ₹7.50 a dozen and makes a profit of ₹80. How many oranges does he buy? (Answer in dozens.)","optionsHtml":[],"questionNumber":7},{"sourceNumber":8,"type":"tita","context":"","question":"Mr. Bazaar marks up an article by 40%. If increasing the discount from 5% to 10% decreases his profit by ₹14, how much profit will he earn if he gives a discount of 20% on the marked price? (in ₹)","options":[],"answer":"24","sourcePage":5,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">The extra 5 percentage points of discount reduce profit by ₹14.</div><div class=\"eq-line\">Therefore 5% of marked price = ₹14 ⇒ marked price = ₹280.</div><div class=\"eq-line\">Since marked price is 140% of cost price, cost price = 280 ÷ 1.4 = ₹200.</div><div class=\"eq-line\">At a 20% discount, selling price = 0.8(280) = ₹224.</div><div class=\"eq-line\">Profit = 224 − 200 = ₹24. <strong>Answer: 24</strong></div></div>","questionHtml":"Mr. Bazaar marks up an article by 40%. If increasing the discount from 5% to 10% decreases his profit by ₹14, how much profit will he earn if he gives a discount of 20% on the marked price? (in ₹)","optionsHtml":[],"questionNumber":8},{"sourceNumber":9,"type":"mcq","context":"","question":"The cost of painting the four walls of a room is ₹2,000. The cost for another room whose height is 25% more, length is 20% more and breadth is 50% more is ₹3,300. What is the ratio of the length to the breadth of the first room?","options":["2 : 1","5 : 3","3 : 2","Cannot be determined"],"answer":"C","sourcePage":5,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let the first room’s height, length and breadth be h, l and b. Its four-wall area is 2h(l + b).</div><div class=\"eq-line\">For the second room, area = 2(<span class=\"frac\"><span>5h</span><span>4</span></span>)(<span class=\"frac\"><span>6l</span><span>5</span></span> + <span class=\"frac\"><span>3b</span><span>2</span></span>).</div><div class=\"eq-line\">Area ratio = cost ratio = <span class=\"frac\"><span>3,300</span><span>2,000</span></span> = <span class=\"frac\"><span>33</span><span>20</span></span>.</div><div class=\"eq-line\"><span class=\"frac\"><span>2(5h/4)(6l/5 + 3b/2)</span><span>2h(l + b)</span></span> = <span class=\"frac\"><span>33</span><span>20</span></span> ⇒ <span class=\"frac\"><span>l</span><span>b</span></span> = <span class=\"frac\"><span>3</span><span>2</span></span>.</div><div class=\"eq-line\">Required ratio = 3 : 2. <strong>Choice (C)</strong></div></div>","questionHtml":"The cost of painting the four walls of a room is ₹2,000. The cost for another room whose height is 25% more, length is 20% more and breadth is 50% more is ₹3,300. What is the ratio of the length to the breadth of the first room?","optionsHtml":["2 : 1","5 : 3","3 : 2","Cannot be determined"],"questionNumber":9},{"sourceNumber":10,"type":"tita","context":"","question":"Sohanlal claims to sell vegetables at cost price, but uses a false weight of 800 g instead of 1 kg. What is the percentage-point difference between the percentage by which he underweighs and the percentage profit he makes?","options":[],"answer":"5","sourcePage":5,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">For goods costing ₹100 per kg, the cost of 800 g is ₹80.</div><div class=\"eq-line\">Profit percentage = <span class=\"frac\"><span>100 − 80</span><span>80</span></span> × 100% = 25%.</div><div class=\"eq-line\">Underweight percentage = <span class=\"frac\"><span>1,000 − 800</span><span>1,000</span></span> × 100% = 20%.</div><div class=\"eq-line\">Percentage-point difference = 25 − 20 = 5. <strong>Answer: 5</strong></div></div>","questionHtml":"Sohanlal claims to sell vegetables at cost price, but uses a false weight of 800 g instead of 1 kg. What is the percentage-point difference between the percentage by which he underweighs and the percentage profit he makes?","optionsHtml":[],"questionNumber":10},{"sourceNumber":11,"type":"mcq","context":"","question":"A rectangular room has to be painted on its four walls and ceiling. Another room has breadth 10% less, length 10% more and height 10% less than the first; painting it costs ₹1,872. What will it cost to paint the first room if its length, breadth and height are in the ratio 2 : 1 : 3?","options":["₹1,956","₹2,000","₹2,100","Cannot be determined"],"answer":"B","sourcePage":5,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let breadth = x, length = 2x and height = 3x.</div><div class=\"eq-line\">First-room painted area = 2(l + b)h + lb = 2(3x)(3x) + 2x² = 20x².</div><div class=\"eq-line\">Second-room dimensions are 2.2x, 0.9x and 2.7x.</div><div class=\"eq-line\">Its painted area = 2(2.2x + 0.9x)(2.7x) + (2.2x)(0.9x) = 18.72x².</div><div class=\"eq-line\">Since 18.72x² costs ₹1,872, 20x² costs ₹2,000. <strong>Choice (B)</strong></div></div>","questionHtml":"A rectangular room has to be painted on its four walls and ceiling. Another room has breadth 10% less, length 10% more and height 10% less than the first; painting it costs ₹1,872. What will it cost to paint the first room if its length, breadth and height are in the ratio 2 : 1 : 3?","optionsHtml":["₹1,956","₹2,000","₹2,100","Cannot be determined"],"questionNumber":11},{"sourceNumber":12,"type":"mcq","context":"","question":"Akai, a television manufacturer, gives dealers a commission of 10% on the list price of ₹25,000. If the commission is increased to 25%, how much discount can a dealer give a customer and still make a profit of 20%?","options":["₹1,500","₹2,000","₹3,250","₹2,500"],"answer":"D","sourcePage":5,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Use a list-price base of ₹100. With 25% commission, the dealer’s cost is ₹75.</div><div class=\"eq-line\">For a 20% profit, required selling price = 1.2(75) = ₹90.</div><div class=\"eq-line\">Discount = ₹100 − ₹90 = ₹10, i.e. 10% of list price.</div><div class=\"eq-line\">On ₹25,000, discount = 10% × ₹25,000 = ₹2,500. <strong>Choice (D)</strong></div></div>","questionHtml":"Akai, a television manufacturer, gives dealers a commission of 10% on the list price of ₹25,000. If the commission is increased to 25%, how much discount can a dealer give a customer and still make a profit of 20%?","optionsHtml":["₹1,500","₹2,000","₹3,250","₹2,500"],"questionNumber":12},{"sourceNumber":13,"type":"tita","context":"","question":"A manufacturer earns a 20% profit by selling a 300 ml bottle of coke for ₹12. Excise duty is 50% of the cost price. If the government reduces the excise duty by 20%, by how much should the selling price be reduced to maintain the same profit percentage? (in ₹)","options":[],"answer":"1.20","sourcePage":5,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Selling price ₹12 at 20% profit gives cost price = ₹12 ÷ 1.2 = ₹10.</div><div class=\"eq-line\">Excise duty = 50% of ₹10 = ₹5; other cost = ₹5.</div><div class=\"eq-line\">After a 20% duty reduction, new duty = ₹4 and new cost = ₹9.</div><div class=\"eq-line\">New selling price at 20% profit = 1.2(9) = ₹10.80.</div><div class=\"eq-line\">Required reduction = ₹12 − ₹10.80 = ₹1.20. <strong>Answer: 1.20</strong></div></div>","questionHtml":"A manufacturer earns a 20% profit by selling a 300 ml bottle of coke for ₹12. Excise duty is 50% of the cost price. If the government reduces the excise duty by 20%, by how much should the selling price be reduced to maintain the same profit percentage? (in ₹)","optionsHtml":[],"questionNumber":13},{"sourceNumber":14,"type":"mcq","context":"","question":"Sher Chand invests ₹19,000 in a 5% stock at 95. He later sells it and invests the proceeds in a 6% stock at 80, increasing his annual income by ₹200. At what price did he sell the first stock?","options":["₹90","₹95","₹80","₹75"],"answer":"C","sourcePage":5,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Number of ₹100 shares bought = <span class=\"frac\"><span>19,000</span><span>95</span></span> = 200.</div><div class=\"eq-line\">Initial annual income = 200 × ₹5 = ₹1,000.</div><div class=\"eq-line\">New annual income = ₹1,200, so number of 6% shares = 1,200 ÷ 6 = 200.</div><div class=\"eq-line\">Investment in the new stock = 200 × ₹80 = ₹16,000.</div><div class=\"eq-line\">Thus 200 original shares sold for ₹16,000, or ₹80 each. <strong>Choice (C)</strong></div></div>","questionHtml":"Sher Chand invests ₹19,000 in a 5% stock at 95. He later sells it and invests the proceeds in a 6% stock at 80, increasing his annual income by ₹200. At what price did he sell the first stock?","optionsHtml":["₹90","₹95","₹80","₹75"],"questionNumber":14},{"sourceNumber":15,"type":"tita","context":"","question":"The price of sugar increased by 40%. The Mehra family reduced consumption so that its expenditure increased by only 12%. If its previous consumption was 50 kg, what is its present consumption? (in kg)","options":[],"answer":"40","sourcePage":5,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Use an initial sugar price of ₹10 per kg. Initial expenditure = 50 × 10 = ₹500.</div><div class=\"eq-line\">New price = ₹14 per kg; new expenditure = 1.12(500) = ₹560.</div><div class=\"eq-line\">Present consumption = <span class=\"frac\"><span>560</span><span>14</span></span> = 40 kg. <strong>Answer: 40</strong></div></div>","questionHtml":"The price of sugar increased by 40%. The Mehra family reduced consumption so that its expenditure increased by only 12%. If its previous consumption was 50 kg, what is its present consumption? (in kg)","optionsHtml":[],"questionNumber":15},{"sourceNumber":16,"type":"mcq","context":"","question":"Somu measures only 900 ml instead of a litre. His cost price and selling price are ₹10 per litre and ₹12 per litre respectively. His profit and profit percentage on buying and selling 18 litres are _____.","options":["₹60, 20%","₹60, 33 13%","₹40, 25%","₹40, 33 13%"],"answer":"B","sourcePage":6,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Every 900 ml is charged as one litre, so 18 actual litres are charged as 20 litres.</div><div class=\"eq-line\">Cost = 18 × ₹10 = ₹180; revenue = 20 × ₹12 = ₹240.</div><div class=\"eq-line\">Profit = ₹240 − ₹180 = ₹60.</div><div class=\"eq-line\">Profit percentage = <span class=\"frac\"><span>60</span><span>180</span></span> × 100% = 33 <span class=\"frac\"><span>1</span><span>3</span></span>%. <strong>Choice (B)</strong></div></div>","questionHtml":"Somu measures only 900 ml instead of a litre. His cost price and selling price are ₹10 per litre and ₹12 per litre respectively. His profit and profit percentage on buying and selling 18 litres are _____.","optionsHtml":["₹60, 20%","₹60, 33 <span class=\"frac\"><span>1</span><span>3</span></span>%","₹40, 25%","₹40, 33 <span class=\"frac\"><span>1</span><span>3</span></span>%"],"questionNumber":16},{"sourceNumber":17,"type":"mcq","context":"","question":"A car dealer offers three discount options: Option I—two successive discounts of 15% each; Option II—three successive discounts of 10% each; Option III—successive discounts of 20%, 5% and 5%. Which is the best option for the buyer?","options":["Option I","Option II","Option III","All options are equally good"],"answer":"C","sourcePage":6,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Compare final prices using a base list price of ₹100.</div><div class=\"eq-line\">Option I: 100(0.85)(0.85) = ₹72.25.</div><div class=\"eq-line\">Option II: 100(0.9)³ = ₹72.90.</div><div class=\"eq-line\">Option III: 100(0.8)(0.95)(0.95) = ₹72.20.</div><div class=\"eq-line\">The lowest price is under Option III. <strong>Choice (C)</strong></div></div>","questionHtml":"A car dealer offers three discount options: Option I—two successive discounts of 15% each; Option II—three successive discounts of 10% each; Option III—successive discounts of 20%, 5% and 5%. Which is the best option for the buyer?","optionsHtml":["Option I","Option II","Option III","All options are equally good"],"questionNumber":17},{"sourceNumber":18,"type":"mcq","context":"","question":"Vinod, Rajesh and Amitabh enter a partnership with capitals of ₹74,000, ₹1,11,000 and ₹1,48,000. From annual profit of ₹62,000, Rajesh first receives a salary of ₹1,000 per month; Vinod then receives 10% of the remaining profit as commission. The balance is divided in the ratio of their capitals. Approximately what percentage of the total profit is Vinod’s share?","options":["20%","22%","24%","26%"],"answer":"C","sourcePage":6,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Capital ratio = 74,000 : 1,11,000 : 1,48,000 = 2 : 3 : 4.</div><div class=\"eq-line\">Rajesh’s annual salary = 12 × ₹1,000 = ₹12,000; remaining profit = ₹50,000.</div><div class=\"eq-line\">Vinod’s commission = 10% of ₹50,000 = ₹5,000; balance = ₹45,000.</div><div class=\"eq-line\">Vinod’s capital share = <span class=\"frac\"><span>2</span><span>9</span></span>(45,000) = ₹10,000.</div><div class=\"eq-line\">Vinod receives ₹15,000 total; 15,000 ÷ 62,000 ≈ 24.19%, approximately 24%. <strong>Choice (C)</strong></div></div>","questionHtml":"Vinod, Rajesh and Amitabh enter a partnership with capitals of ₹74,000, ₹1,11,000 and ₹1,48,000. From annual profit of ₹62,000, Rajesh first receives a salary of ₹1,000 per month; Vinod then receives 10% of the remaining profit as commission. The balance is divided in the ratio of their capitals. Approximately what percentage of the total profit is Vinod’s share?","optionsHtml":["20%","22%","24%","26%"],"questionNumber":18},{"sourceNumber":19,"type":"tita","context":"","question":"Makrand, Gaurav and Siddharth invest ₹24,000, ₹36,000 and ₹48,000. Gaurav receives 14 27% of the first-year profit for managing the business; the rest is divided in the ratio of their capitals. If Gaurav’s total earnings are ₹90,000, what is the total profit? (in ₹)","options":[],"answer":"210000","sourcePage":6,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let total profit be ₹P. Gaurav’s management share is 14 2/7% = 1/7 of P.</div><div class=\"eq-line\">The balance is <span class=\"frac\"><span>6P</span><span>7</span></span>; Gaurav’s capital fraction is <span class=\"frac\"><span>36</span><span>24 + 36 + 48</span></span> = <span class=\"frac\"><span>1</span><span>3</span></span>.</div><div class=\"eq-line\">Gaurav’s total = <span class=\"frac\"><span>P</span><span>7</span></span> + <span class=\"frac\"><span>1</span><span>3</span></span>(<span class=\"frac\"><span>6P</span><span>7</span></span>) = <span class=\"frac\"><span>3P</span><span>7</span></span>.</div><div class=\"eq-line\"><span class=\"frac\"><span>3P</span><span>7</span></span> = 90,000 ⇒ P = ₹2,10,000. <strong>Answer: 210000</strong></div></div>","questionHtml":"Makrand, Gaurav and Siddharth invest ₹24,000, ₹36,000 and ₹48,000. Gaurav receives 14 <span class=\"frac\"><span>2</span><span>7</span></span>% of the first-year profit for managing the business; the rest is divided in the ratio of their capitals. If Gaurav’s total earnings are ₹90,000, what is the total profit? (in ₹)","optionsHtml":[],"questionNumber":19},{"sourceNumber":20,"type":"tita","context":"","question":"Ratanlal sold his watch at a loss of 5%. Had he sold it for ₹56.25 more, he would have gained 10%. What will his gain or loss percentage be if he sells it for ₹450?","options":[],"answer":"20","sourcePage":6,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let cost price be ₹C.</div><div class=\"eq-line\">At 5% loss, selling price = 0.95C. At 10% gain, selling price = 1.10C.</div><div class=\"eq-line\">1.10C − 0.95C = 56.25 ⇒ 0.15C = 56.25 ⇒ C = ₹375.</div><div class=\"eq-line\">At selling price ₹450, profit = ₹450 − ₹375 = ₹75.</div><div class=\"eq-line\">Profit percentage = <span class=\"frac\"><span>75</span><span>375</span></span> × 100% = 20%. <strong>Answer: 20</strong></div></div>","questionHtml":"Ratanlal sold his watch at a loss of 5%. Had he sold it for ₹56.25 more, he would have gained 10%. What will his gain or loss percentage be if he sells it for ₹450?","optionsHtml":[],"questionNumber":20}]}</script><script>
const data=JSON.parse(document.getElementById('testData').textContent),labels=['A','B','C','D'],total=data.questions.length,answers=Array(total).fill(null),marked=Array(total).fill(false);let current=0,submitted=false,seconds=data.durationMinutes*60,timerId=null;const host=document.getElementById('questionHost'),bar=document.getElementById('qbar'),result=document.getElementById('result');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function text(v){return esc(v).replace(/\s*\n+\s*/g,' ')}function mathText(v){
let s=text(v).replace(/(\d+)\s*\/\s*(\d+)\s*(?:st|nd|rd|th)\b/gi,'$1/$2');
const blocked=new Set(['is','are','and','or','per','hr','hrs','hour','hours','min','mins','sec','secs','day','days','week','weeks','month','months','year','years','switch','board','km','cm','mm','m','lt','units']);
const atom='(?:\\([^()<>]{1,80}\\)|\\{[^{}<>]{1,100}\\}|[−-]?(?:\\d+(?:\\.\\d+)?[A-Za-zπ]{0,5}[²³⁴⁵⁶⁷⁸⁹⁰]*|[A-Za-zπ][A-Za-z0-9π²³⁴⁵⁶⁷⁸⁹⁰]{0,5})[°%]?)';
const fraction=new RegExp('(^|[^\\w/])('+atom+')\\s*\\/\\s*('+atom+')(?=$|[^\\w/])','g');
let prior;
do{prior=s;s=s.replace(fraction,(m,p,a,b)=>blocked.has(a.replace(/[()−-]/g,'').toLowerCase())||blocked.has(b.replace(/[()−-]/g,'').toLowerCase())?m:p+'<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>')}while(s!==prior);
return s}
function formatStimulus(v){const marker=/^((?:\d+\.|\(\d+\)|\([a-z]\)|[ivx]+\.|•)\s*)(.*)$/i;return String(v??'').split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).map(block=>{const lines=block.split('\n').map(x=>x.trim()).filter(Boolean);if(/^Directions\s+for\s+/i.test(lines[0]))return `<p class="direction">${mathText(lines.join(' '))}</p>`;const prose=[],items=[];let item=null;lines.forEach(line=>{const m=line.match(marker);if(m){if(item)items.push(item);item={marker:m[1].trim(),body:m[2]}}else if(item)item.body+=' '+line;else prose.push(line)});if(item)items.push(item);let out=prose.length?`<p>${mathText(prose.join(' '))}</p>`:'';if(items.length)out+=`<div class="info-list">${items.map(x=>`<div class="info-item"><span class="info-marker">${esc(x.marker)}</span><span class="info-body">${mathText(x.body)}</span></div>`).join('')}</div>`;return out||`<p>${mathText(lines.join(' '))}</p>`}).join('')}
function renderBar(){bar.innerHTML=data.questions.map((q,i)=>`<button type="button" class="qbtn ${answers[i]!==null&&answers[i]!==''?'answered ':''}${marked[i]?'marked ':''}${i===current?'current ':''}" onclick="go(${i})">${i+1}</button>`).join('')}
function response(q){if(q.type==='mcq')return `<div class="options ${q.imageOnly?'image-choice':''}">${q.options.map((op,i)=>`<label class="option"><input type="radio" name="answer" value="${labels[i]}" ${answers[current]===labels[i]?'checked':''} ${submitted?'disabled':''}><span>(${labels[i]})${q.imageOnly?'':' '+(q.optionsHtml&&q.optionsHtml[i]?q.optionsHtml[i]:mathText(op))}</span></label>`).join('')}</div>`;return `<div class="tita"><label for="titaInput">Type your answer:</label><input id="titaInput" aria-label="Type your answer" placeholder="Type your answer" inputmode="decimal" value="${esc(answers[current]??'')}" ${submitted?'disabled':''}><div class="tita-note">TITA: type the numerical/value answer. No negative marking.</div></div>`}
function contextLocalNumbers(ctx){const ids=[];data.questions.forEach((x,i)=>{if(String(x.context||'')===String(ctx||''))ids.push(i+1)});return ids}
function localRangeLabel(ids,prefix){if(!ids.length)return prefix==='common'?'Common Information':'';if(ids.length===1)return prefix==='common'?`Common Information – Question ${ids[0]}`:`question ${ids[0]}`;const contiguous=ids.every((v,i)=>i===0||v===ids[i-1]+1);if(contiguous&&ids.length===2)return prefix==='common'?`Common Information – Questions ${ids[0]}–${ids[1]}`:`questions ${ids[0]} and ${ids[1]}`;if(contiguous)return prefix==='common'?`Common Information – Questions ${ids[0]}–${ids[ids.length-1]}`:`questions ${ids[0]} to ${ids[ids.length-1]}`;return prefix==='common'?`Common Information – Questions ${ids.join(', ')}`:`questions ${ids.join(', ')}`}
function localizeContext(ctx){const ids=contextLocalNumbers(ctx);if(!ids.length)return String(ctx||'');const lines=String(ctx||'').split('\n');const first=lines[0]||'';const m=first.match(/^Directions\s+for\s+questions?\s+[^:]+:(.*)$/i);if(m)lines[0]=`Directions for ${localRangeLabel(ids,'directions')}:${m[1]}`;return lines.join('\n')}
function localizedSolution(q){let s=String(q.solution||'');s=s.replace(/Solutions?\s+for\s+questions?[^<:]*(?::|<\/text>)/gi,'');s=s.replace(/Choice\s*\([A-D]\)/gi,'');s=s.replace(/Ans(?:wer)?\s*[:=][^<]*/gi,'');return s}
function render(){const q=data.questions[current],has=!!q.context,information=has?`<section class="qa-context"><div class="common-qno">${localRangeLabel(contextLocalNumbers(q.context),'common')}</div><div class="stimulus-copy">${formatStimulus(localizeContext(q.context))}</div>${q.visual||''}</section>`:`<p class="qa-direction">Answer the question independently.</p>`;host.innerHTML=`<div class="test-content"><section class="response-pane"><div class="qhead"><div class="qnum">Question ${current+1} of ${total}</div></div>${information}${q.questionVisual||''}<h2 class="question-title">${q.questionHtml||mathText(q.question)}</h2>${response(q)}<div id="answerNote" class="answer-note"></div><section class="solution direct-solution"><div class="solution-heading">Solution</div>${localizedSolution(q)}</section></section></div><div class="navrow"><button type="button" onclick="markNext()">Mark for Review & Next</button><button type="button" onclick="clearResponse()" ${submitted?'disabled':''}>Clear Response</button><button type="button" class="previous" onclick="previous()" ${current===0?'disabled':''}>Previous</button><button type="button" class="save" onclick="next()">Save & Next</button></div>`;bind();if(submitted)review();renderBar()}
function bind(){host.querySelectorAll('input[name="answer"]').forEach(el=>el.onchange=()=>{answers[current]=el.value;renderBar()});const t=document.getElementById('titaInput');if(t)t.oninput=()=>{answers[current]=t.value.trim();renderBar()}}
function save(){const t=document.getElementById('titaInput');if(t&&!submitted)answers[current]=t.value.trim();const r=host.querySelector('input[name="answer"]:checked');if(r&&!submitted)answers[current]=r.value}function go(i){save();current=i;render()}function next(){if(current<total-1)go(current+1)}function previous(){if(current>0)go(current-1)}function markNext(){save();marked[current]=true;if(current<total-1)go(current+1);else render()}function clearResponse(){answers[current]=null;render()}
function correct(q,a){if(a===null||a==='')return null;if(q.type==='mcq')return a===q.answer;const n=v=>String(v).trim().replace(/,/g,'');return n(a)===n(q.answer)}function review(){const q=data.questions[current],s=correct(q,answers[current]),n=document.getElementById('answerNote');n.className='answer-note '+(s===null?'muted':s?'ok':'bad');n.textContent=s===null?'Unattempted. Correct answer: '+q.answer:s?'Correct.':'Wrong. Correct answer: '+q.answer}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm('Submit this sectional test now?'))return;submitted=true;clearInterval(timerId);document.body.classList.add('submitted');let c=0,w=0,u=0,score=0;data.questions.forEach((q,i)=>{const s=correct(q,answers[i]);if(s===null)u++;else if(s){c++;score+=3}else{w++;if(q.type==='mcq')score--}});result.style.display='block';result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score">Score<strong>${score}</strong></div><div class="score">Correct<strong>${c}</strong></div><div class="score">Wrong<strong>${w}</strong></div><div class="score">Attempted<strong>${c+w}</strong></div><div class="score">Unattempted<strong>${u}</strong></div></div>`;render()}
function tick(){const m=Math.floor(seconds/60),s=seconds%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(seconds<=0){submitTest(true);return}seconds--}const calc=document.getElementById('calc'),display=document.getElementById('calcDisplay'),calcResult=document.getElementById('calcResult');let memory=0;const evaluate=v=>{if(!/^[0-9+\-*/().\s]+$/.test(v))throw Error();return Function('return ('+(v||'0')+')')()};const showResult=v=>{calcResult.textContent=Number.isFinite(Number(v))?String(v):'Error'};document.getElementById('calcToggle').onclick=()=>calc.classList.toggle('open');document.getElementById('calcClose').onclick=()=>calc.classList.remove('open');document.getElementById('calcMin').onclick=()=>calc.classList.remove('open');document.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>{const v=b.dataset.calc;try{if(v==='C'){display.value='';showResult(0)}else if(v==='B')display.value=display.value.slice(0,-1);else if(v==='='){const n=evaluate(display.value);display.value=String(n);showResult(n)}else if(v==='S'){const n=-evaluate(display.value);display.value=String(n);showResult(n)}else if(v==='Q'){const n=Math.sqrt(evaluate(display.value));display.value=String(n);showResult(n)}else if(v==='P'){const n=evaluate(display.value)/100;display.value=String(n);showResult(n)}else if(v==='I'){const n=1/evaluate(display.value);display.value=String(n);showResult(n)}else if(v==='MC')memory=0;else if(v==='MR')display.value+=String(memory);else if(v==='MS')memory=evaluate(display.value);else if(v==='M+')memory+=evaluate(display.value);else if(v==='M-')memory-=evaluate(display.value);else display.value+=v}catch{showResult('Error')}});let dragging=false,dx=0,dy=0,pointerId=null;const dragBar=document.querySelector('.calc-title');dragBar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;dragging=true;pointerId=e.pointerId;const r=calc.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;calc.classList.add('dragging');dragBar.setPointerCapture(pointerId)});dragBar.addEventListener('pointermove',e=>{if(!dragging)return;const maxX=Math.max(0,window.innerWidth-calc.offsetWidth),maxY=Math.max(84,window.innerHeight-calc.offsetHeight);calc.style.left=Math.min(maxX,Math.max(0,e.clientX-dx))+'px';calc.style.top=Math.min(maxY,Math.max(84,e.clientY-dy))+'px';calc.style.right='auto'});const stopDrag=()=>{dragging=false;calc.classList.remove('dragging');if(pointerId!==null&&dragBar.hasPointerCapture(pointerId))dragBar.releasePointerCapture(pointerId);pointerId=null};dragBar.addEventListener('pointerup',stopDrag);dragBar.addEventListener('pointercancel',stopDrag);window.addEventListener('resize',()=>{const r=calc.getBoundingClientRect();if(r.right>window.innerWidth)calc.style.left=Math.max(0,window.innerWidth-r.width)+'px';if(r.bottom>window.innerHeight)calc.style.top=Math.max(84,window.innerHeight-r.height)+'px'});window.go=go;window.previous=previous;window.markNext=markNext;window.clearResponse=clearResponse;window.submitTest=submitTest;render();tick();timerId=setInterval(tick,1000);
</script></body></html>
