tton class="" data-calc="9" type="button">9</button><button class="" data-calc="/" type="button">/</button><button class="" data-calc="I" type="button">1/x</button><button class="" data-calc="4" type="button">4</button><button class="" data-calc="5" type="button">5</button><button class="" data-calc="6" type="button">6</button><button class="" data-calc="*" type="button">*</button><button class="eq" data-calc="=" type="button">=</button><button class="" data-calc="1" type="button">1</button><button class="" data-calc="2" type="button">2</button><button class="" data-calc="3" type="button">3</button><button class="" data-calc="-" type="button">-</button><button class="" data-calc="0" type="button">0</button><button class="" data-calc="." type="button">.</button><button class="" data-calc="+" type="button">+</button></div></aside><script id="testData" type="application/json">{"exercise":2,"part":2,"durationMinutes":40,"questions":[{"sourceNumber":21,"type":"mcq","context":"Directions for questions 21 and 22: These questions are based on the following data.\n\nFive salesmen A, B, C, D and E receive a fixed income of ₹5,000. They earn a commission of 10% of the sales value above 4,000 pieces. When sales are below 4,000 pieces, a penalty equal to 20% of the sales value of the shortfall is deducted. Each piece sells for ₹5. In April, A, B, C, D and E sold 6,000, 4,000, 2,000, 5,000 and 7,000 pieces respectively.","question":"What is the average income of the five salesmen for April?","options":["₹4,800","₹5,200","₹6,000","None of these"],"answer":"B","sourcePage":6,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">April incomes: A = ₹6,000; B = ₹5,000; C = ₹3,000; D = ₹5,500; E = ₹6,500.</div><div class=\"eq-line\">Total = ₹26,000.</div><div class=\"eq-line\">Average = <span class=\"frac\"><span>26,000</span><span>5</span></span> = ₹5,200. <strong>Choice (B)</strong></div></div>","questionHtml":"What is the average income of the five salesmen for April?","optionsHtml":["₹4,800","₹5,200","₹6,000","None of these"],"questionNumber":1},{"sourceNumber":22,"type":"mcq","context":"Directions for questions 21 and 22: These questions are based on the following data.\n\nFive salesmen A, B, C, D and E receive a fixed income of ₹5,000. They earn a commission of 10% of the sales value above 4,000 pieces. When sales are below 4,000 pieces, a penalty equal to 20% of the sales value of the shortfall is deducted. Each piece sells for ₹5. In April, A, B, C, D and E sold 6,000, 4,000, 2,000, 5,000 and 7,000 pieces respectively.","question":"To avoid the penalty, the salesmen decide that E will transfer enough recorded sales to C to bring C to 4,000 pieces. By how much will their combined income change?","options":["₹500 more","₹500 less","₹1,000 more","None of the above"],"answer":"C","sourcePage":6,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">After transferring 2,000 recorded pieces from E to C: C records 4,000 and earns ₹5,000; E records 5,000 and earns ₹5,500.</div><div class=\"eq-line\">New C + E income = ₹10,500. Old C + E income = ₹3,000 + ₹6,500 = ₹9,500.</div><div class=\"eq-line\">Combined income increases by ₹1,000. <strong>Choice (C)</strong></div></div>","questionHtml":"To avoid the penalty, the salesmen decide that E will transfer enough recorded sales to C to bring C to 4,000 pieces. By how much will their combined income change?","optionsHtml":["₹500 more","₹500 less","₹1,000 more","None of the above"],"questionNumber":2},{"sourceNumber":23,"type":"mcq","context":"Directions for questions 23 and 24: These questions are based on the following data.\n\nIn May, the terms changed. The fixed income was reduced to ₹2,000 for selling 2,000 pieces. Commission was 5% for the next 1,000 pieces, 10% for the next 1,000, and so on, increasing by 5 percentage points for every additional 1,000 pieces. The sales of A, B, C, D and E were 7,000, 5,000, 3,000, 4,000 and 5,000 respectively.","question":"By what amount is A’s May income more or less than the income he would have earned under the April scheme, assuming 7,000 pieces were sold in both cases?","options":["₹1,250 more","₹750 less","₹1,250 less","₹250 less"],"answer":"B","sourcePage":6,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Under the April scheme, A’s income for 7,000 pieces = ₹5,000 + 10% of ₹15,000 = ₹6,500.</div><div class=\"eq-line\">Under the May scheme, variable income = (5% + 10% + 15% + 20% + 25%) × ₹5,000 = ₹3,750.</div><div class=\"eq-line\">May income = ₹2,000 + ₹3,750 = ₹5,750.</div><div class=\"eq-line\">Difference = ₹6,500 − ₹5,750 = ₹750 less. <strong>Choice (B)</strong></div></div>","questionHtml":"By what amount is A’s May income more or less than the income he would have earned under the April scheme, assuming 7,000 pieces were sold in both cases?","optionsHtml":["₹1,250 more","₹750 less","₹1,250 less","₹250 less"],"questionNumber":3},{"sourceNumber":24,"type":"mcq","context":"Directions for questions 23 and 24: These questions are based on the following data.\n\nIn May, the terms changed. The fixed income was reduced to ₹2,000 for selling 2,000 pieces. Commission was 5% for the next 1,000 pieces, 10% for the next 1,000, and so on, increasing by 5 percentage points for every additional 1,000 pieces. The sales of A, B, C, D and E were 7,000, 5,000, 3,000, 4,000 and 5,000 respectively.","question":"By what amount did the average income of the five salesmen increase or decrease in May compared with April?","options":["Increased by ₹1,850","Decreased by ₹1,650","Increased by ₹1,250","Decreased by ₹1,250"],"answer":"B","sourcePage":6,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">May incomes are ₹5,750, ₹3,500, ₹2,250, ₹2,750 and ₹3,500.</div><div class=\"eq-line\">Total = ₹17,750; average = ₹17,750 ÷ 5 = ₹3,550.</div><div class=\"eq-line\">April average = ₹5,200, so the decrease is ₹5,200 − ₹3,550 = ₹1,650. <strong>Choice (B)</strong></div></div>","questionHtml":"By what amount did the average income of the five salesmen increase or decrease in May compared with April?","optionsHtml":["Increased by ₹1,850","Decreased by ₹1,650","Increased by ₹1,250","Decreased by ₹1,250"],"questionNumber":4},{"sourceNumber":25,"type":"tita","context":"Directions for questions 25 and 26: These questions are based on the following data.\n\nRam and Rajat take an examination in which each correct answer earns 1 mark and each wrong answer loses 1 mark. Ram gets 10% of his attempts wrong and scores 64% of the total marks, which is 22 marks above the pass mark. Rajat gets 20% of his attempts wrong and scores 54% of the total marks, which is 12 marks above the pass mark.","question":"What percentage of the total questions did Rajat attempt?","options":[],"answer":"90","sourcePage":6,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let total marks be T and pass mark be P.</div><div class=\"eq-line\">Ram’s net score is (0.9 − 0.1)x = 0.8x = 0.64T, so x = 0.8T.</div><div class=\"eq-line\">Rajat’s net score is (0.8 − 0.2)y = 0.6y = 0.54T, so y = 0.9T.</div><div class=\"eq-line\">0.64T = P + 22 and 0.54T = P + 12.</div><div class=\"eq-line\">Subtracting gives 0.10T = 10 ⇒ T = 100 and P = 42.</div></div><div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Rajat attempted 0.9T = 90% of the questions. <strong>Answer: 90</strong></div></div>","questionHtml":"What percentage of the total questions did Rajat attempt?","optionsHtml":[],"questionNumber":5},{"sourceNumber":26,"type":"tita","context":"Directions for questions 25 and 26: These questions are based on the following data.\n\nRam and Rajat take an examination in which each correct answer earns 1 mark and each wrong answer loses 1 mark. Ram gets 10% of his attempts wrong and scores 64% of the total marks, which is 22 marks above the pass mark. Rajat gets 20% of his attempts wrong and scores 54% of the total marks, which is 12 marks above the pass mark.","question":"What is the pass mark?","options":[],"answer":"42","sourcePage":6,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let total marks be T and pass mark be P.</div><div class=\"eq-line\">Ram’s net score is (0.9 − 0.1)x = 0.8x = 0.64T, so x = 0.8T.</div><div class=\"eq-line\">Rajat’s net score is (0.8 − 0.2)y = 0.6y = 0.54T, so y = 0.9T.</div><div class=\"eq-line\">0.64T = P + 22 and 0.54T = P + 12.</div><div class=\"eq-line\">Subtracting gives 0.10T = 10 ⇒ T = 100 and P = 42.</div></div><div class=\"math-solution standardized-solution\"><div class=\"eq-line\">The pass mark is 42. <strong>Answer: 42</strong></div></div>","questionHtml":"What is the pass mark?","optionsHtml":[],"questionNumber":6},{"sourceNumber":27,"type":"mcq","context":"","question":"The population of Shadigarh is 7,200. The community practises monogamy, every married person lives with their spouse, 1118 of the population are male, and 40% of the males are married. What percentage of the females are married?","options":["48 17%","52 47%","62 67%","71 17%"],"answer":"C","sourcePage":6,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Males = <span class=\"frac\"><span>11</span><span>18</span></span>(7,200) = 4,400; females = 7,200 − 4,400 = 2,800.</div><div class=\"eq-line\">Married males = 40% of 4,400 = 1,760. Monogamy makes the number of married females also 1,760.</div><div class=\"eq-line\">Married-female percentage = <span class=\"frac\"><span>1,760</span><span>2,800</span></span> × 100% = 62 <span class=\"frac\"><span>6</span><span>7</span></span>%. <strong>Choice (C)</strong></div></div>","questionHtml":"The population of Shadigarh is 7,200. The community practises monogamy, every married person lives with their spouse, <span class=\"frac\"><span>11</span><span>18</span></span> of the population are male, and 40% of the males are married. What percentage of the females are married?","optionsHtml":["48 <span class=\"frac\"><span>1</span><span>7</span></span>% ","52 <span class=\"frac\"><span>4</span><span>7</span></span>% ","62 <span class=\"frac\"><span>6</span><span>7</span></span>% ","71 <span class=\"frac\"><span>1</span><span>7</span></span>% "],"questionNumber":7},{"sourceNumber":28,"type":"tita","context":"","question":"Three businessmen A, B and C start with capitals in the ratio 4 : 1 : 15. At the end of each quarter, A halves his capital, B doubles his capital and C leaves his capital unchanged. If B’s year-end profit share is ₹22,000, what is the total profit? (in ₹)","options":[],"answer":"121000","sourcePage":6,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Quarterly capital weights: A = 4 + 2 + 1 + 1/2 = 15/2; B = 1 + 2 + 4 + 8 = 15; C = 15 + 15 + 15 + 15 = 60.</div><div class=\"eq-line\">Profit-sharing ratio = 15/2 : 15 : 60 = 1 : 2 : 8.</div><div class=\"eq-line\">B receives 2 of 11 parts: (2/11)P = ₹22,000 ⇒ P = ₹1,21,000. <strong>Answer: 121000</strong></div></div>","questionHtml":"Three businessmen A, B and C start with capitals in the ratio 4 : 1 : 15. At the end of each quarter, A halves his capital, B doubles his capital and C leaves his capital unchanged. If B’s year-end profit share is ₹22,000, what is the total profit? (in ₹)","optionsHtml":[],"questionNumber":8},{"sourceNumber":29,"type":"mcq","context":"","question":"Dershaw gives a 20% discount on marked price. Forgetting the discount, he treats the marked price as the selling price and calculates profit as 30% of that selling price. What is his actual profit percentage?","options":["14 27%","20%","25%","28 47%"],"answer":"A","sourcePage":7,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let marked price = ₹100. The mistaken calculation treats profit as ₹30, so cost price = ₹70.</div><div class=\"eq-line\">After the actual 20% discount, selling price = ₹80.</div><div class=\"eq-line\">Actual profit percentage = <span class=\"frac\"><span>80 − 70</span><span>70</span></span> × 100% = 14 <span class=\"frac\"><span>2</span><span>7</span></span>%. <strong>Choice (A)</strong></div></div>","questionHtml":"Dershaw gives a 20% discount on marked price. Forgetting the discount, he treats the marked price as the selling price and calculates profit as 30% of that selling price. What is his actual profit percentage?","optionsHtml":["14 <span class=\"frac\"><span>2</span><span>7</span></span>%","20%","25%","28 <span class=\"frac\"><span>4</span><span>7</span></span>%"],"questionNumber":9},{"sourceNumber":30,"type":"mcq","context":"","question":"Ketan Parekh buys 500 shares of a 5% stock at ₹92. He sells 250 shares at ₹95, 200 shares at ₹90, and the remaining 50 shares at ₹92. After receiving one dividend on all 500 shares, what is his overall profit?","options":["₹4,850","₹2,850","₹2,500","Data inadequate"],"answer":"B","sourcePage":7,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Total shares = <span class=\"frac\"><span>46,000</span><span>92</span></span> = 500.</div><div class=\"eq-line\">Sale proceeds = 250(95) + 200(90) + 50(92) = ₹46,350.</div><div class=\"eq-line\">Dividend = 500 × ₹5 = ₹2,500.</div><div class=\"eq-line\">Total realization = ₹48,850; profit = ₹48,850 − ₹46,000 = ₹2,850. <strong>Choice (B)</strong></div></div>","questionHtml":"Ketan Parekh buys 500 shares of a 5% stock at ₹92. He sells 250 shares at ₹95, 200 shares at ₹90, and the remaining 50 shares at ₹92. After receiving one dividend on all 500 shares, what is his overall profit?","optionsHtml":["₹4,850","₹2,850","₹2,500","Data inadequate"],"questionNumber":10},{"sourceNumber":31,"type":"tita","context":"","question":"Praveen, Ramu and Shashi invest ₹62,000, ₹93,000 and ₹1,24,000. Praveen manages the business for some months and Ramu for the rest. Managers receive 10% of the ₹12,000 annual profit as commission. If Praveen’s total income is ₹2,900, for how many months did he manage the business?","options":[],"answer":"5","sourcePage":7,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Capital ratio = 62,000 : 93,000 : 1,24,000 = 2 : 3 : 4.</div><div class=\"eq-line\">After 10% management commission, distributable profit = 90% of ₹12,000 = ₹10,800.</div><div class=\"eq-line\">Praveen’s capital share = (2/9)(₹10,800) = ₹2,400. His total income is ₹2,900, so his commission is ₹500.</div><div class=\"eq-line\">Total annual management commission = ₹1,200. Months managed = (500/1,200)(12) = 5. <strong>Answer: 5</strong></div></div>","questionHtml":"Praveen, Ramu and Shashi invest ₹62,000, ₹93,000 and ₹1,24,000. Praveen manages the business for some months and Ramu for the rest. Managers receive 10% of the ₹12,000 annual profit as commission. If Praveen’s total income is ₹2,900, for how many months did he manage the business?","optionsHtml":[],"questionNumber":11},{"sourceNumber":32,"type":"mcq","context":"","question":"An old woman buys equal numbers of oranges at 12 per rupee and 8 per rupee, then sells them at 10 per rupee. What is her gain or loss percentage?","options":["4% loss","4% gain","6.25% loss","6.25% gain"],"answer":"A","sourcePage":7,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Take 120 oranges of each kind. Costs are ₹10 and ₹15, total ₹25.</div><div class=\"eq-line\">All 240 oranges sell at 10 per rupee for ₹24.</div><div class=\"eq-line\">Loss = ₹1; loss percentage = (1/25) × 100% = 4%. <strong>Choice (A)</strong></div></div>","questionHtml":"An old woman buys equal numbers of oranges at 12 per rupee and 8 per rupee, then sells them at 10 per rupee. What is her gain or loss percentage?","optionsHtml":["4% loss","4% gain","6.25% loss","6.25% gain"],"questionNumber":12},{"sourceNumber":33,"type":"mcq","context":"","question":"Of 6,00,000 examination candidates, 60% are male. The pass percentage among males is 75%, and the overall pass percentage is 70%. What is the pass percentage among females?","options":["37.5%","50%","62.5%","70%"],"answer":"C","sourcePage":7,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Total passed = 70% of 6,00,000 = 4,20,000.</div><div class=\"eq-line\">Males = 60% of 6,00,000 = 3,60,000; males passed = 75% of 3,60,000 = 2,70,000.</div><div class=\"eq-line\">Females = 2,40,000; females passed = 1,50,000.</div><div class=\"eq-line\">Female pass percentage = <span class=\"frac\"><span>1,50,000</span><span>2,40,000</span></span> × 100% = 62.5%. <strong>Choice (C)</strong></div></div>","questionHtml":"Of 6,00,000 examination candidates, 60% are male. The pass percentage among males is 75%, and the overall pass percentage is 70%. What is the pass percentage among females?","optionsHtml":["37.5%","50%","62.5%","70%"],"questionNumber":13},{"sourceNumber":34,"type":"mcq","context":"","question":"The quantities satisfy V = 2xyz + 3ab. If x, y, z, a and b change by +25%, +60%, −10%, +20% and +50%, what is the percentage increase in V?","options":["60%","80%","92%","Cannot be determined"],"answer":"B","sourcePage":7,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">The factor on xyz is 1.25 × 1.60 × 0.90 = 1.80.</div><div class=\"eq-line\">The factor on ab is 1.20 × 1.50 = 1.80.</div><div class=\"eq-line\">Both terms in V = 2xyz + 3ab become 1.8 times their original values.</div><div class=\"eq-line\">Therefore V increases by 80%. <strong>Choice (B)</strong></div></div>","questionHtml":"The quantities satisfy V = 2xyz + 3ab. If x, y, z, a and b change by +25%, +60%, −10%, +20% and +50%, what is the percentage increase in V?","optionsHtml":["60%","80%","92%","Cannot be determined"],"questionNumber":14},{"sourceNumber":35,"type":"tita","context":"","question":"Venkat buys a gross of bananas at ₹10 per dozen. Two dozen spoil during transport. Transport costs 10% of the purchase cost. At what price per dozen must he sell the remaining bananas to earn an overall profit of 20%? (in ₹)","options":[],"answer":"15.84","sourcePage":7,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">A gross is 12 dozen. Purchase cost = 12 × ₹10 = ₹120.</div><div class=\"eq-line\">Including 10% transport, total cost = ₹132. At 20% profit, required revenue = 1.2(132) = ₹158.40.</div><div class=\"eq-line\">Two dozen spoil, so 10 dozen remain.</div><div class=\"eq-line\">Price per dozen = <span class=\"frac\"><span>158.40</span><span>10</span></span> = ₹15.84. <strong>Answer: 15.84</strong></div></div>","questionHtml":"Venkat buys a gross of bananas at ₹10 per dozen. Two dozen spoil during transport. Transport costs 10% of the purchase cost. At what price per dozen must he sell the remaining bananas to earn an overall profit of 20%? (in ₹)","optionsHtml":[],"questionNumber":15},{"sourceNumber":36,"type":"tita","context":"","question":"Ramanand buys a bag at a 30% discount on list price and sells it for 160% of list price, earning ₹81 profit. What is the list price? (in ₹)","options":[],"answer":"90","sourcePage":7,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let list price = ₹x. Cost price = 0.70x; selling price = 1.60x.</div><div class=\"eq-line\">Profit = 1.60x − 0.70x = 0.90x = ₹81.</div><div class=\"eq-line\">x = ₹90. <strong>Answer: 90</strong></div></div>","questionHtml":"Ramanand buys a bag at a 30% discount on list price and sells it for 160% of list price, earning ₹81 profit. What is the list price? (in ₹)","optionsHtml":[],"questionNumber":16},{"sourceNumber":37,"type":"mcq","context":"","question":"The price of a cricket bat rises from ₹2,500 to ₹2,750 and the price of a cricket ball rises from ₹100 to ₹120. What is the approximate percentage change in the cost of a set containing 11 bats and 11 balls?","options":["20%","18%","15%","10%"],"answer":"D","sourcePage":7,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">The percentage change for 11 bats and 11 balls equals that for one bat plus one ball.</div><div class=\"eq-line\">Old cost = ₹2,500 + ₹100 = ₹2,600; new cost = ₹2,750 + ₹120 = ₹2,870.</div><div class=\"eq-line\">Increase = <span class=\"frac\"><span>270</span><span>2,600</span></span> × 100% ≈ 10.38%, approximately 10%. <strong>Choice (D)</strong></div></div>","questionHtml":"The price of a cricket bat rises from ₹2,500 to ₹2,750 and the price of a cricket ball rises from ₹100 to ₹120. What is the approximate percentage change in the cost of a set containing 11 bats and 11 balls?","optionsHtml":["20%","18%","15%","10%"],"questionNumber":17},{"sourceNumber":38,"type":"tita","context":"","question":"Garjana Constructions has 33 13% women. Half the women are married and 33 13% of the married women have children. Of the men, 75% are married and 66 23% of the married men have children. No two employees are married to each other. If the fraction without children is n18, find n.","options":[],"answer":"11","sourcePage":7,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Take 90 employees: 30 women and 60 men.</div><div class=\"eq-line\">Of 30 women, 15 are married and 5 have children. Of 60 men, 45 are married and 30 have children.</div><div class=\"eq-line\">Employees with children = 35; without children = 90 − 35 = 55.</div><div class=\"eq-line\">Fraction without children = <span class=\"frac\"><span>55</span><span>90</span></span> = <span class=\"frac\"><span>11</span><span>18</span></span>. Thus n = 11. <strong>Answer: 11</strong></div></div>","questionHtml":"Garjana Constructions has 33 <span class=\"frac\"><span>1</span><span>3</span></span>% women. Half the women are married and 33 <span class=\"frac\"><span>1</span><span>3</span></span>% of the married women have children. Of the men, 75% are married and 66 <span class=\"frac\"><span>2</span><span>3</span></span>% of the married men have children. No two employees are married to each other. If the fraction without children is <span class=\"frac\"><span>n</span><span>18</span></span>, find n.","optionsHtml":[],"questionNumber":18},{"sourceNumber":39,"type":"mcq","context":"Directions for questions 39 and 40: These questions are based on the following data.\n\nShiv Shankar manufactures pens at ₹8 each and sells them at ₹10 each. Under the old regime, tax is 12.5% of production cost. He now offers a 5% discount on the marked price of ₹10, while the government charges tax at 12.5% of the marked price.","question":"What is the percentage increase or decrease in profit per pen under the new discount and tax regime?","options":["25% increase","25% decrease","75% increase","75% decrease"],"answer":"D","sourcePage":7,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Old tax = 12.5% of ₹8 = ₹1, so old total cost = ₹9 and old profit = ₹10 − ₹9 = ₹1.</div><div class=\"eq-line\">New tax = 12.5% of marked price ₹10 = ₹1.25. New selling price after 5% discount = ₹9.50.</div><div class=\"eq-line\">New profit = ₹9.50 − (₹8 + ₹1.25) = ₹0.25.</div><div class=\"eq-line\">Profit falls from ₹1 to ₹0.25, a 75% decrease. <strong>Choice (D)</strong></div></div>","questionHtml":"What is the percentage increase or decrease in profit per pen under the new discount and tax regime?","optionsHtml":["25% increase","25% decrease","75% increase","75% decrease"],"questionNumber":19},{"sourceNumber":40,"type":"mcq","context":"Directions for questions 39 and 40: These questions are based on the following data.\n\nShiv Shankar manufactures pens at ₹8 each and sells them at ₹10 each. Under the old regime, tax is 12.5% of production cost. He now offers a 5% discount on the marked price of ₹10, while the government charges tax at 12.5% of the marked price.","question":"If Shiv Shankar stops offering the discount and increases sales volume by 10%, what is the percentage change in government revenue compared with the old volume under the old tax regime?","options":["−37.5%","37.5%","−25%","25%"],"answer":"B","sourcePage":7,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Use an old sales volume of 10 pens. Old government revenue = 10 × ₹1 = ₹10.</div><div class=\"eq-line\">New volume without discount = 11 pens; new tax per pen = ₹1.25.</div><div class=\"eq-line\">New revenue = 11 × ₹1.25 = ₹13.75.</div><div class=\"eq-line\">Percentage increase = <span class=\"frac\"><span>13.75 − 10</span><span>10</span></span> × 100% = 37.5%. <strong>Choice (B)</strong></div></div>","questionHtml":"If Shiv Shankar stops offering the discount and increases sales volume by 10%, what is the percentage change in government revenue compared with the old volume under the old tax regime?","optionsHtml":["−37.5%","37.5%","−25%","25%"],"questionNumber":20}]}</script><script>
const data=JSON.parse(document.getElementById('testData').textContent),labels=['A','B','C','D'],total=data.questions.length,answers=Array(total).fill(null),marked=Array(total).fill(false);let current=0,submitted=false,seconds=data.durationMinutes*60,timerId=null;const host=document.getElementById('questionHost'),bar=document.getElementById('qbar'),result=document.getElementById('result');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function text(v){return esc(v).replace(/\s*\n+\s*/g,' ')}function mathText(v){
let s=text(v).replace(/(\d+)\s*\/\s*(\d+)\s*(?:st|nd|rd|th)\b/gi,'$1/$2');
const blocked=new Set(['is','are','and','or','per','hr','hrs','hour','hours','min','mins','sec','secs','day','days','week','weeks','month','months','year','years','switch','board','km','cm','mm','m','lt','units']);
const atom='(?:\\([^()<>]{1,80}\\)|\\{[^{}<>]{1,100}\\}|[−-]?(?:\\d+(?:\\.\\d+)?[A-Za-zπ]{0,5}[²³⁴⁵⁶⁷⁸⁹⁰]*|[A-Za-zπ][A-Za-z0-9π²³⁴⁵⁶⁷⁸⁹⁰]{0,5})[°%]?)';
const fraction=new RegExp('(^|[^\\w/])('+atom+')\\s*\\/\\s*('+atom+')(?=$|[^\\w/])','g');
let prior;
do{prior=s;s=s.replace(fraction,(m,p,a,b)=>blocked.has(a.replace(/[()−-]/g,'').toLowerCase())||blocked.has(b.replace(/[()−-]/g,'').toLowerCase())?m:p+'<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>')}while(s!==prior);
return s}
function formatStimulus(v){const marker=/^((?:\d+\.|\(\d+\)|\([a-z]\)|[ivx]+\.|•)\s*)(.*)$/i;return String(v??'').split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).map(block=>{const lines=block.split('\n').map(x=>x.trim()).filter(Boolean);if(/^Directions\s+for\s+/i.test(lines[0]))return `<p class="direction">${mathText(lines.join(' '))}</p>`;const prose=[],items=[];let item=null;lines.forEach(line=>{const m=line.match(marker);if(m){if(item)items.push(item);item={marker:m[1].trim(),body:m[2]}}else if(item)item.body+=' '+line;else prose.push(line)});if(item)items.push(item);let out=prose.length?`<p>${mathText(prose.join(' '))}</p>`:'';if(items.length)out+=`<div class="info-list">${items.map(x=>`<div class="info-item"><span class="info-marker">${esc(x.marker)}</span><span class="info-body">${mathText(x.body)}</span></div>`).join('')}</div>`;return out||`<p>${mathText(lines.join(' '))}</p>`}).join('')}
function renderBar(){bar.innerHTML=data.questions.map((q,i)=>`<button type="button" class="qbtn ${answers[i]!==null&&answers[i]!==''?'answered ':''}${marked[i]?'marked ':''}${i===current?'current ':''}" onclick="go(${i})">${i+1}</button>`).join('')}
function response(q){if(q.type==='mcq')return `<div class="options ${q.imageOnly?'image-choice':''}">${q.options.map((op,i)=>`<label class="option"><input type="radio" name="answer" value="${labels[i]}" ${answers[current]===labels[i]?'checked':''} ${submitted?'disabled':''}><span>(${labels[i]})${q.imageOnly?'':' '+(q.optionsHtml&&q.optionsHtml[i]?q.optionsHtml[i]:mathText(op))}</span></label>`).join('')}</div>`;return `<div class="tita"><label for="titaInput">Type your answer:</label><input id="titaInput" aria-label="Type your answer" placeholder="Type your answer" inputmode="decimal" value="${esc(answers[current]??'')}" ${submitted?'disabled':''}><div class="tita-note">TITA: type the numerical/value answer. No negative marking.</div></div>`}
function contextLocalNumbers(ctx){const ids=[];data.questions.forEach((x,i)=>{if(String(x.context||'')===String(ctx||''))ids.push(i+1)});return ids}
function localRangeLabel(ids,prefix){if(!ids.length)return prefix==='common'?'Common Information':'';if(ids.length===1)return prefix==='common'?`Common Information – Question ${ids[0]}`:`question ${ids[0]}`;const contiguous=ids.every((v,i)=>i===0||v===ids[i-1]+1);if(contiguous&&ids.length===2)return prefix==='common'?`Common Information – Questions ${ids[0]}–${ids[1]}`:`questions ${ids[0]} and ${ids[1]}`;if(contiguous)return prefix==='common'?`Common Information – Questions ${ids[0]}–${ids[ids.length-1]}`:`questions ${ids[0]} to ${ids[ids.length-1]}`;return prefix==='common'?`Common Information – Questions ${ids.join(', ')}`:`questions ${ids.join(', ')}`}
function localizeContext(ctx){const ids=contextLocalNumbers(ctx);if(!ids.length)return String(ctx||'');const lines=String(ctx||'').split('\n');const first=lines[0]||'';const m=first.match(/^Directions\s+for\s+questions?\s+[^:]+:(.*)$/i);if(m)lines[0]=`Directions for ${localRangeLabel(ids,'directions')}:${m[1]}`;return lines.join('\n')}
function localizedSolution(q){let s=String(q.solution||'');s=s.replace(/Solutions?\s+for\s+questions?[^<:]*(?::|<\/text>)/gi,'');s=s.replace(/Choice\s*\([A-D]\)/gi,'');s=s.replace(/Ans(?:wer)?\s*[:=][^<]*/gi,'');return s}
function render(){const q=data.questions[current],has=!!q.context,information=has?`<section class="qa-context"><div class="common-qno">${localRangeLabel(contextLocalNumbers(q.context),'common')}</div><div class="stimulus-copy">${formatStimulus(localizeContext(q.context))}</div>${q.visual||''}</section>`:`<p class="qa-direction">Answer the question independently.</p>`;host.innerHTML=`<div class="test-content"><section class="response-pane"><div class="qhead"><div class="qnum">Question ${current+1} of ${total}</div></div>${information}${q.questionVisual||''}<h2 class="question-title">${q.questionHtml||mathText(q.question)}</h2>${response(q)}<div id="answerNote" class="answer-note"></div><section class="solution direct-solution"><div class="solution-heading">Solution</div>${localizedSolution(q)}</section></section></div><div class="navrow"><button type="button" onclick="markNext()">Mark for Review & Next</button><button type="button" onclick="clearResponse()" ${submitted?'disabled':''}>Clear Response</button><button type="button" class="previous" onclick="previous()" ${current===0?'disabled':''}>Previous</button><button type="button" class="save" onclick="next()">Save & Next</button></div>`;bind();if(submitted)review();renderBar()}
function bind(){host.querySelectorAll('input[name="answer"]').forEach(el=>el.onchange=()=>{answers[current]=el.value;renderBar()});const t=document.getElementById('titaInput');if(t)t.oninput=()=>{answers[current]=t.value.trim();renderBar()}}
function save(){const t=document.getElementById('titaInput');if(t&&!submitted)answers[current]=t.value.trim();const r=host.querySelector('input[name="answer"]:checked');if(r&&!submitted)answers[current]=r.value}function go(i){save();current=i;render()}function next(){if(current<total-1)go(current+1)}function previous(){if(current>0)go(current-1)}function markNext(){save();marked[current]=true;if(current<total-1)go(current+1);else render()}function clearResponse(){answers[current]=null;render()}
function correct(q,a){if(a===null||a==='')return null;if(q.type==='mcq')return a===q.answer;const n=v=>String(v).trim().replace(/,/g,'');return n(a)===n(q.answer)}function review(){const q=data.questions[current],s=correct(q,answers[current]),n=document.getElementById('answerNote');n.className='answer-note '+(s===null?'muted':s?'ok':'bad');n.textContent=s===null?'Unattempted. Correct answer: '+q.answer:s?'Correct.':'Wrong. Correct answer: '+q.answer}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm('Submit this sectional test now?'))return;submitted=true;clearInterval(timerId);document.body.classList.add('submitted');let c=0,w=0,u=0,score=0;data.questions.forEach((q,i)=>{const s=correct(q,answers[i]);if(s===null)u++;else if(s){c++;score+=3}else{w++;if(q.type==='mcq')score--}});result.style.display='block';result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score">Score<strong>${score}</strong></div><div class="score">Correct<strong>${c}</strong></div><div class="score">Wrong<strong>${w}</strong></div><div class="score">Attempted<strong>${c+w}</strong></div><div class="score">Unattempted<strong>${u}</strong></div></div>`;render()}
function tick(){const m=Math.floor(seconds/60),s=seconds%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(seconds<=0){submitTest(true);return}seconds--}const calc=document.getElementById('calc'),display=document.getElementById('calcDisplay'),calcResult=document.getElementById('calcResult');let memory=0;const evaluate=v=>{if(!/^[0-9+\-*/().\s]+$/.test(v))throw Error();return Function('return ('+(v||'0')+')')()};const showResult=v=>{calcResult.textContent=Number.isFinite(Number(v))?String(v):'Error'};document.getElementById('calcToggle').onclick=()=>calc.classList.toggle('open');document.getElementById('calcClose').onclick=()=>calc.classList.remove('open');document.getElementById('calcMin').onclick=()=>calc.classList.remove('open');document.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>{const v=b.dataset.calc;try{if(v==='C'){display.value='';showResult(0)}else if(v==='B')display.value=display.value.slice(0,-1);else if(v==='='){const n=evaluate(display.value);display.value=String(n);showResult(n)}else if(v==='S'){const n=-evaluate(display.value);display.value=String(n);showResult(n)}else if(v==='Q'){const n=Math.sqrt(evaluate(display.value));display.value=String(n);showResult(n)}else if(v==='P'){const n=evaluate(display.value)/100;display.value=String(n);showResult(n)}else if(v==='I'){const n=1/evaluate(display.value);display.value=String(n);showResult(n)}else if(v==='MC')memory=0;else if(v==='MR')display.value+=String(memory);else if(v==='MS')memory=evaluate(display.value);else if(v==='M+')memory+=evaluate(display.value);else if(v==='M-')memory-=evaluate(display.value);else display.value+=v}catch{showResult('Error')}});let dragging=false,dx=0,dy=0,pointerId=null;const dragBar=document.querySelector('.calc-title');dragBar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;dragging=true;pointerId=e.pointerId;const r=calc.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;calc.classList.add('dragging');dragBar.setPointerCapture(pointerId)});dragBar.addEventListener('pointermove',e=>{if(!dragging)return;const maxX=Math.max(0,window.innerWidth-calc.offsetWidth),maxY=Math.max(84,window.innerHeight-calc.offsetHeight);calc.style.left=Math.min(maxX,Math.max(0,e.clientX-dx))+'px';calc.style.top=Math.min(maxY,Math.max(84,e.clientY-dy))+'px';calc.style.right='auto'});const stopDrag=()=>{dragging=false;calc.classList.remove('dragging');if(pointerId!==null&&dragBar.hasPointerCapture(pointerId))dragBar.releasePointerCapture(pointerId);pointerId=null};dragBar.addEventListener('pointerup',stopDrag);dragBar.addEventListener('pointercancel',stopDrag);window.addEventListener('resize',()=>{const r=calc.getBoundingClientRect();if(r.right>window.innerWidth)calc.style.left=Math.max(0,window.innerWidth-r.width)+'px';if(r.bottom>window.innerHeight)calc.style.top=Math.max(84,window.innerHeight-r.height)+'px'});window.go=go;window.previous=previous;window.markNext=markNext;window.clearResponse=clearResponse;window.submitTest=submitTest;render();tick();timerId=setInterval(tick,1000);
requestAnimationFrame(()=>document.documentElement.classList.remove('booting'));</script></body></html>
