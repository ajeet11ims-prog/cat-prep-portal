</style></head><body><header><div class="topbar"><div class="title"><h1>QA Sectional Test - 5</h1><div class="meta">20 Questions | 40 Minutes | 13 MCQ + 7 TITA | +3 correct | -1 wrong MCQ | 0 wrong TITA</div></div><button aria-label="Open calculator" class="calc-toggle" id="calcToggle" type="button">▦</button><div class="timer">Time Left:<br/><span id="time">40:00</span></div></div></header><main><section class="work"><div class="result" id="result"></div><div class="question-host" id="questionHost"></div></section><aside class="side"><h2>Question Bar</h2><div class="qbar" id="qbar"></div><div class="legend"><span><i class="dot current"></i>Current</span><span><i class="dot answered"></i>Answered</span><span><i class="dot marked"></i>Marked</span></div><button class="side-submit" onclick="submitTest()" type="button">Submit</button></aside></main><aside class="calc" id="calc"><div class="calc-title"><span>Normal Calculator</span><span class="calc-title-actions"><button aria-label="Minimize calculator" id="calcMin" type="button">-</button><button aria-label="Close calculator" id="calcClose" type="button">×</button></span></div><input aria-label="Calculator expression" class="calc-display" id="calcDisplay" readonly=""/><div class="calc-result" id="calcResult">0</div><div class="calc-grid"><button class="" data-calc="MC" type="button">MC</button><button class="" data-calc="MR" type="button">MR</button><button class="" data-calc="MS" type="button">MS</button><button class="" data-calc="M+" type="button">M+</button><button class="" data-calc="M-" type="button">M-</button><button class="danger" data-calc="B" type="button">←</button><button class="danger" data-calc="C" type="button">C</button><button class="danger" data-calc="S" type="button">+/-</button><button class="" data-calc="Q" type="button">√</button><button class="" data-calc="P" type="button">%</button><button class="" data-calc="7" type="button">7</button><button class="" data-calc="8" type="button">8</button><button class="" data-calc="9" type="button">9</button><button class="" data-calc="/" type="button">/</button><button class="" data-calc="I" type="button">1/x</button><button class="" data-calc="4" type="button">4</button><button class="" data-calc="5" type="button">5</button><button class="" data-calc="6" type="button">6</button><button class="" data-calc="*" type="button">*</button><button class="eq" data-calc="=" type="button">=</button><button class="" data-calc="1" type="button">1</button><button class="" data-calc="2" type="button">2</button><button class="" data-calc="3" type="button">3</button><button class="" data-calc="-" type="button">-</button><button class="" data-calc="0" type="button">0</button><button class="" data-calc="." type="button">.</button><button class="" data-calc="+" type="button">+</button></div></aside><script id="testData" type="application/json">{"exercise":3,"part":1,"durationMinutes":40,"questions":[{"sourceNumber":1,"type":"mcq","context":"","question":"A father normally leaves home to pick up his son Raju from school at 3:30 p.m. One day Raju leaves school at 2:30 p.m., walks home at 6 km/hr and meets his father on the way. They reach home 24 minutes earlier than usual. Find the father’s speed.","options":["20 km/hr","22 km/hr","24 km/hr","15 km/hr"],"answer":"C","sourcePage":7,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">The 24-minute saving is 12 minutes on each leg, so the father meets Raju at 3:18 p.m.</div><div class=\"eq-line\">Raju walks from 2:30 to 3:18, i.e. 48 minutes.</div><div class=\"eq-line\">Raju’s distance = 6 × <span class=\"frac\"><span>48</span><span>60</span></span> = 4.8 km.</div><div class=\"eq-line\">The father covers the same distance in 12 minutes.</div><div class=\"eq-line\">Father’s speed = <span class=\"frac\"><span>4.8</span><span>0.2</span></span> = 24 km/hr. <strong>Choice (C)</strong></div></div>","questionHtml":"A father normally leaves home to pick up his son Raju from school at 3:30 p.m. One day Raju leaves school at 2:30 p.m., walks home at 6 km/hr and meets his father on the way. They reach home 24 minutes earlier than usual. Find the father’s speed.","optionsHtml":["20 km/hr","22 km/hr","24 km/hr","15 km/hr"],"questionNumber":1},{"sourceNumber":2,"type":"tita","context":"","question":"A, B and C run around a circular track of length 1,260 m at 3 m/s, 5 m/s and 7 m/s respectively. They start together from the same point in the same direction. At how many distinct points on the track do all three meet?","options":[],"answer":"2","sourcePage":7,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">First simultaneous meeting time = LCM(<span class=\"frac\"><span>1260</span><span>5−3</span></span>, <span class=\"frac\"><span>1260</span><span>7−5</span></span>) = 630 seconds.</div><div class=\"eq-line\">In 630 seconds A travels 3 × 630 = 1,890 m = one lap + 630 m, so this meeting is opposite the start.</div><div class=\"eq-line\">First simultaneous return to the start = LCM(<span class=\"frac\"><span>1260</span><span>3</span></span>, <span class=\"frac\"><span>1260</span><span>5</span></span>, <span class=\"frac\"><span>1260</span><span>7</span></span>) = 1,260 seconds.</div><div class=\"eq-line\">Thus all three meet only at the starting point and its diametrically opposite point. <strong>Answer: 2</strong></div></div>","questionHtml":"A, B and C run around a circular track of length 1,260 m at 3 m/s, 5 m/s and 7 m/s respectively. They start together from the same point in the same direction. At how many distinct points on the track do all three meet?","optionsHtml":[],"questionNumber":2},{"sourceNumber":3,"type":"mcq","context":"","question":"A boat takes 8 hours to travel a certain distance downstream and return. If its speed in still water doubles, the round trip takes 3 hours 12 minutes. Find the ratio of the boat’s original speed in still water to the speed of the stream.","options":["3 : 1","3 : 2","2 : 1","4 : 3"],"answer":"C","sourcePage":7,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let the original still-water speed be ku, stream speed u and one-way distance d.</div><div class=\"eq-line\">Original round-trip time = <span class=\"frac\"><span>d</span><span>(k+1)u</span></span> + <span class=\"frac\"><span>d</span><span>(k−1)u</span></span> = <span class=\"frac\"><span>2kd</span><span>(k²−1)u</span></span> = 8. …(1)</div><div class=\"eq-line\">After doubling still-water speed: <span class=\"frac\"><span>4kd</span><span>(4k²−1)u</span></span> = <span class=\"frac\"><span>16</span><span>5</span></span>. …(2)</div><div class=\"eq-line\">Dividing (1) by (2): <span class=\"frac\"><span>4k²−1</span><span>k²−1</span></span> = 5 ⇒ k² = 4 ⇒ k = 2.</div><div class=\"eq-line\">Required ratio = 2 : 1. <strong>Choice (C)</strong></div></div>","questionHtml":"A boat takes 8 hours to travel a certain distance downstream and return. If its speed in still water doubles, the round trip takes 3 hours 12 minutes. Find the ratio of the boat’s original speed in still water to the speed of the stream.","optionsHtml":["3 : 1","3 : 2","2 : 1","4 : 3"],"questionNumber":3},{"sourceNumber":4,"type":"mcq","context":"","question":"A boy travels half the distance from home to school at 10 km/hr. For exactly half of the remaining time he travels at 15 km/hr and for the rest at 20 km/hr. Find his average speed.","options":["13 km/hr","12 811 km/hr","15 km/hr","16 16 km/hr"],"answer":"B","sourcePage":8,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">For the second half of the distance, equal times at 15 and 20 km/hr give average speed <span class=\"frac\"><span>15+20</span><span>2</span></span> = 17.5 km/hr.</div><div class=\"eq-line\">The two equal distance-halves are covered at 10 km/hr and 17.5 km/hr.</div><div class=\"eq-line\">Overall average = <span class=\"frac\"><span>2(10)(17.5)</span><span>10+17.5</span></span> = <span class=\"frac\"><span>140</span><span>11</span></span> = 12 <span class=\"frac\"><span>8</span><span>11</span></span> km/hr. <strong>Choice (B)</strong></div></div>","questionHtml":"A boy travels half the distance from home to school at 10 km/hr. For exactly half of the remaining time he travels at 15 km/hr and for the rest at 20 km/hr. Find his average speed.","optionsHtml":["13 km/hr","12 <span class=\"frac\"><span>8</span><span>11</span></span> km/hr","15 km/hr","16 <span class=\"frac\"><span>1</span><span>6</span></span> km/hr"],"questionNumber":4},{"sourceNumber":5,"type":"mcq","context":"","question":"In a 1 km race, A beats B by 1 minute and B beats C by 30 seconds. If A beats C by 600 m, find the ratio of the speeds of A and B.","options":["3 : 1","3 : 2","4 : 3","2 : 1"],"answer":"D","sourcePage":8,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let A take t seconds. Then B takes t + 60 and C takes t + 90.</div><div class=\"eq-line\">When A finishes 1,000 m, C covers 400 m.</div><div class=\"eq-line\"><span class=\"frac\"><span>1000</span><span>400</span></span> = <span class=\"frac\"><span>t+90</span><span>t</span></span> ⇒ <span class=\"frac\"><span>5</span><span>2</span></span> = <span class=\"frac\"><span>t+90</span><span>t</span></span> ⇒ t = 60 seconds.</div><div class=\"eq-line\">Speed ratio A : B = <span class=\"frac\"><span>t+60</span><span>t</span></span> = <span class=\"frac\"><span>120</span><span>60</span></span> = 2 : 1. <strong>Choice (D)</strong></div></div>","questionHtml":"In a 1 km race, A beats B by 1 minute and B beats C by 30 seconds. If A beats C by 600 m, find the ratio of the speeds of A and B.","optionsHtml":["3 : 1","3 : 2","4 : 3","2 : 1"],"questionNumber":5},{"sourceNumber":6,"type":"tita","context":"","question":"Harry starts from A towards B at 60 km/hr and reduces his speed by 6 km/hr after every 10 minutes. If AB = 42 km, how many minutes does he take?","options":[],"answer":"54","sourcePage":8,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Distances in successive 10-minute intervals are 10, 9, 8, 7 and 6 km.</div><div class=\"eq-line\">In 50 minutes Harry covers 40 km.</div><div class=\"eq-line\">The remaining 2 km at 30 km/hr takes 4 minutes.</div><div class=\"eq-line\">Total time = 54 minutes. <strong>Answer: 54</strong></div></div>","questionHtml":"Harry starts from A towards B at 60 km/hr and reduces his speed by 6 km/hr after every 10 minutes. If AB = 42 km, how many minutes does he take?","optionsHtml":[],"questionNumber":6},{"sourceNumber":7,"type":"tita","context":"","question":"A man jumps from a plane at a height of 2,300 m. With the parachute closed he falls 5t² metres in t seconds; with it open he falls (2t² − 3t) metres in t seconds. At what height should he open it to reach the ground in 40 seconds? (in m)","options":[],"answer":"1175","sourcePage":8,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let the parachute open t seconds after the jump. Closed-parachute fall = 5t².</div><div class=\"eq-line\">Open-parachute time = 40 − t, so its fall is 2(40 − t)² − 3(40 − t).</div><div class=\"eq-line\">5t² + 2(40 − t)² − 3(40 − t) = 2,300.</div><div class=\"eq-line\">7t² − 157t + 780 = 0 ⇒ (t − 15)(7t − 52) = 0.</div><div class=\"eq-line\">Using the intended published branch t = 15 seconds, opening height = 2,300 − 5(15²) = 1,175 m. <strong>Answer: 1175</strong></div></div>","questionHtml":"A man jumps from a plane at a height of 2,300 m. With the parachute closed he falls 5t² metres in t seconds; with it open he falls (2t² − 3t) metres in t seconds. At what height should he open it to reach the ground in 40 seconds? (in m)","optionsHtml":[],"questionNumber":7},{"sourceNumber":8,"type":"mcq","context":"","question":"An escalator moves at 1 step per second. A man walking up takes 36 seconds; walking down the same moving escalator, he takes 108 seconds. If the escalator is stationary, how long will he take to walk down?","options":["54 seconds","72 seconds","90 seconds","96 seconds"],"answer":"A","sourcePage":8,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let the escalator have n steps and the man walk m steps/second.</div><div class=\"eq-line\">Walking down: <span class=\"frac\"><span>n</span><span>m−1</span></span> = 108 ⇒ m − 1 = <span class=\"frac\"><span>n</span><span>108</span></span>.</div><div class=\"eq-line\">Walking up: <span class=\"frac\"><span>n</span><span>m+1</span></span> = 36 ⇒ m + 1 = <span class=\"frac\"><span>n</span><span>36</span></span>.</div><div class=\"eq-line\">Subtracting: 2 = <span class=\"frac\"><span>n</span><span>36</span></span> − <span class=\"frac\"><span>n</span><span>108</span></span> = <span class=\"frac\"><span>n</span><span>54</span></span> ⇒ n = 108 and m = 2.</div><div class=\"eq-line\">On a stationary escalator, time = <span class=\"frac\"><span>n</span><span>m</span></span> = 54 seconds. <strong>Choice (A)</strong></div></div>","questionHtml":"An escalator moves at 1 step per second. A man walking up takes 36 seconds; walking down the same moving escalator, he takes 108 seconds. If the escalator is stationary, how long will he take to walk down?","optionsHtml":["54 seconds","72 seconds","90 seconds","96 seconds"],"questionNumber":8},{"sourceNumber":9,"type":"mcq","context":"","question":"P and Q take 12 minutes and 15 minutes to complete a lap. They start from diametrically opposite points and run in the same direction. After how much time will they be diametrically opposite for the second time?","options":["1 hr 30 min","2 hr","2 hr 30 min","3 hr"],"answer":"B","sourcePage":8,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Speeds are inversely proportional to lap times, so P : Q = 15 : 12 = 5 : 4.</div><div class=\"eq-line\">Starting opposite, for the second diametrically-opposite position P must gain two full laps on Q.</div><div class=\"eq-line\">This occurs when P completes 10 laps and Q completes 8 laps.</div><div class=\"eq-line\">Time = 10 × 12 = 120 minutes = 2 hours. <strong>Choice (B)</strong></div></div>","questionHtml":"P and Q take 12 minutes and 15 minutes to complete a lap. They start from diametrically opposite points and run in the same direction. After how much time will they be diametrically opposite for the second time?","optionsHtml":["1 hr 30 min","2 hr","2 hr 30 min","3 hr"],"questionNumber":9},{"sourceNumber":10,"type":"tita","context":"","question":"Two cyclists start simultaneously from A and B towards each other and meet at noon. The first reaches B at 2:15 p.m.; the second reaches A at 6:15 p.m. If their speed difference is 8 km/hr, find AB. (in km)","options":[],"answer":"120","sourcePage":8,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let their speeds be v₁ and v₂ and their common pre-meeting time be t hours.</div><div class=\"eq-line\">After meeting, the first takes 2.25 hours and the second 6.25 hours.</div><div class=\"eq-line\"><span class=\"frac\"><span>v₁</span><span>v₂</span></span> = <span class=\"frac\"><span>6.25</span><span>t</span></span> = <span class=\"frac\"><span>t</span><span>2.25</span></span> ⇒ t² = 14.0625 ⇒ t = 3.75.</div><div class=\"eq-line\">v₁ : v₂ = <span class=\"frac\"><span>6.25</span><span>3.75</span></span> = 5 : 3. Their difference is 2 parts = 8, so v₁ = 20 and v₂ = 12 km/hr.</div><div class=\"eq-line\">The first cyclist’s total time is 3.75 + 2.25 = 6 hours; distance AB = 20 × 6 = 120 km. <strong>Answer: 120</strong></div></div>","questionHtml":"Two cyclists start simultaneously from A and B towards each other and meet at noon. The first reaches B at 2:15 p.m.; the second reaches A at 6:15 p.m. If their speed difference is 8 km/hr, find AB. (in km)","optionsHtml":[],"questionNumber":10},{"sourceNumber":11,"type":"mcq","context":"","question":"Boat P moves at 8 m/s in still water and starts downstream. Five minutes later boat Q, moving at 3 m/s in still water, follows. After another 15 minutes, two passengers leave P on a raft drifting with the river to be picked up by Q. If P moves upstream at 6 m/s, approximately how long are they on the raft?","options":["42 min","48 12 min","41 min","45 min"],"answer":"A","sourcePage":8,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">P’s upstream speed is 6 m/s, so stream speed = 8 − 6 = 2 m/s. Q’s downstream speed = 3 + 2 = 5 m/s.</div><div class=\"eq-line\">When passengers leave P, P has travelled 20 minutes at 10 m/s = 12,000 m; Q has travelled 15 minutes at 5 m/s = 4,500 m.</div><div class=\"eq-line\">The raft is 7,500 m ahead of Q. Q gains on it at 5 − 2 = 3 m/s.</div><div class=\"eq-line\">Time = <span class=\"frac\"><span>7,500</span><span>3</span></span> = 2,500 seconds = 41 <span class=\"frac\"><span>2</span><span>3</span></span> minutes ≈ 42 minutes. <strong>Choice (A)</strong></div></div>","questionHtml":"Boat P moves at 8 m/s in still water and starts downstream. Five minutes later boat Q, moving at 3 m/s in still water, follows. After another 15 minutes, two passengers leave P on a raft drifting with the river to be picked up by Q. If P moves upstream at 6 m/s, approximately how long are they on the raft?","optionsHtml":["42 min","48 <span class=\"frac\"><span>1</span><span>2</span></span> min","41 min","45 min"],"questionNumber":11},{"sourceNumber":12,"type":"tita","context":"","question":"A and B start together from the same point on a circular track. They meet every 40 seconds in opposite directions and every 160 seconds in the same direction. After how many seconds will they first meet at the starting point?","options":[],"answer":"320","sourcePage":8,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let track length be L and speeds be vₐ and vᵦ.</div><div class=\"eq-line\"><span class=\"frac\"><span>L</span><span>vₐ+vᵦ</span></span> = 40 and <span class=\"frac\"><span>L</span><span>vₐ−vᵦ</span></span> = 160.</div><div class=\"eq-line\">vₐ = <span class=\"frac\"><span>5L</span><span>320</span></span>, vᵦ = <span class=\"frac\"><span>3L</span><span>320</span></span>.</div><div class=\"eq-line\">Individual lap times are 64 seconds and <span class=\"frac\"><span>320</span><span>3</span></span> seconds.</div><div class=\"eq-line\">First joint return to the start = LCM(64, <span class=\"frac\"><span>320</span><span>3</span></span>) = 320 seconds. <strong>Answer: 320</strong></div></div>","questionHtml":"A and B start together from the same point on a circular track. They meet every 40 seconds in opposite directions and every 160 seconds in the same direction. After how many seconds will they first meet at the starting point?","optionsHtml":[],"questionNumber":12},{"sourceNumber":13,"type":"mcq","context":"","question":"Two riders start at the West gate of a circular wall and travel towards the South gate along the shortest route, touching the North, East, South and West gates. One rides five times as fast as the other. At which location do they meet for the 19th time?","options":["at the North gate","at the South gate","midway between the North and West gates","midway between the South and East gates"],"answer":"A","sourcePage":8,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">The four quarter-arcs are equal. When the slower rider travels from W to S, the faster travels five quarter-arcs: one full circuit plus W to S.</div><div class=\"eq-line\">Successive meetings therefore cycle through S, E, N, W, then repeat.</div><div class=\"eq-line\">19 ≡ 3 (mod 4), so the 19th meeting is at the North gate. <strong>Choice (A)</strong></div></div>","questionHtml":"Two riders start at the West gate of a circular wall and travel towards the South gate along the shortest route, touching the North, East, South and West gates. One rides five times as fast as the other. At which location do they meet for the 19th time?","optionsHtml":["at the North gate","at the South gate","midway between the North and West gates","midway between the South and East gates"],"questionNumber":13},{"sourceNumber":14,"type":"tita","context":"","question":"Amul and Cadbury run a 12 km cycling race on a circular track of circumference 750 m. Amul beats Cadbury by 500 m in a 2,000 m race. If Amul gives Cadbury a 500 m head start, how many times does Amul overtake Cadbury?","options":[],"answer":"4","sourcePage":8,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">From a 2,000 m race won by 500 m, speed ratio Amul : Cadbury = 2,000 : 1,500 = 4 : 3.</div><div class=\"eq-line\">With Cadbury 500 m ahead, Amul gains 500 m after travelling 2,000 m. Further overtakes occur every 3,000 m of Amul’s travel.</div><div class=\"eq-line\">Within 12 km, Amul overtakes at 2 km, 5 km, 8 km and 11 km. <strong>Answer: 4</strong></div></div>","questionHtml":"Amul and Cadbury run a 12 km cycling race on a circular track of circumference 750 m. Amul beats Cadbury by 500 m in a 2,000 m race. If Amul gives Cadbury a 500 m head start, how many times does Amul overtake Cadbury?","optionsHtml":[],"questionNumber":14},{"sourceNumber":15,"type":"mcq","context":"","question":"Aman rows at 4 km/hr in still water and must travel 130 km downstream. The current is 2 km/hr for two hours, then 4 km/hr for two hours, repeating every four hours. Starting when the current begins at 2 km/hr, how long does he take?","options":["9 14 hr","19 12 hr","9 27 hr","18 34 hr"],"answer":"D","sourcePage":8,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">For the first two hours downstream speed = 4 + 2 = 6 km/hr; distance = 12 km.</div><div class=\"eq-line\">For the next two hours speed = 4 + 4 = 8 km/hr; distance = 16 km. Thus each four-hour cycle covers 28 km.</div><div class=\"eq-line\">Four cycles take 16 hours and cover 112 km. Remaining distance = 18 km.</div><div class=\"eq-line\">Next two hours cover 12 km; final 6 km at 8 km/hr takes <span class=\"frac\"><span>3</span><span>4</span></span> hour.</div><div class=\"eq-line\">Total time = 16 + 2 + <span class=\"frac\"><span>3</span><span>4</span></span> = 18 <span class=\"frac\"><span>3</span><span>4</span></span> hours. <strong>Choice (D)</strong></div></div>","questionHtml":"Aman rows at 4 km/hr in still water and must travel 130 km downstream. The current is 2 km/hr for two hours, then 4 km/hr for two hours, repeating every four hours. Starting when the current begins at 2 km/hr, how long does he take?","optionsHtml":["9 <span class=\"frac\"><span>1</span><span>4</span></span> hr","19 <span class=\"frac\"><span>1</span><span>2</span></span> hr","9 <span class=\"frac\"><span>2</span><span>7</span></span> hr","18 <span class=\"frac\"><span>3</span><span>4</span></span> hr"],"questionNumber":15},{"sourceNumber":16,"type":"tita","context":"","question":"Harinder travels at 25% below his usual speed and arrives 10 minutes late. If he travels at 25% above his usual speed, how many minutes early will he arrive?","options":[],"answer":"6","sourcePage":8,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">At 75% of usual speed, time becomes <span class=\"frac\"><span>4</span><span>3</span></span> of usual time.</div><div class=\"eq-line\">The extra one-third equals 10 minutes, so usual time = 30 minutes.</div><div class=\"eq-line\">At 125% of usual speed, time = <span class=\"frac\"><span>4</span><span>5</span></span> × 30 = 24 minutes.</div><div class=\"eq-line\">He arrives 30 − 24 = 6 minutes early. <strong>Answer: 6</strong></div></div>","questionHtml":"Harinder travels at 25% below his usual speed and arrives 10 minutes late. If he travels at 25% above his usual speed, how many minutes early will he arrive?","optionsHtml":[],"questionNumber":16},{"sourceNumber":17,"type":"mcq","context":"","question":"Ants Anne and Amy leave their anthill in the same direction at equal speed. Anne turns back earlier carrying food, reducing her return speed by 50%. Amy turns back later carrying food, reducing her return speed by 25%. They arrive back together. Approximately how much farther is Amy’s trip than Anne’s?","options":["29%","71%","350%","87%"],"answer":"A","sourcePage":8,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let Anne’s outward distance be d₁ and Amy’s additional distance be d₂; initial speed is v.</div><div class=\"eq-line\">Anne’s total time = <span class=\"frac\"><span>d₁</span><span>v</span></span> + <span class=\"frac\"><span>d₁</span><span>0.5v</span></span> = <span class=\"frac\"><span>3d₁</span><span>v</span></span>.</div><div class=\"eq-line\">Amy’s total time = <span class=\"frac\"><span>d₁+d₂</span><span>v</span></span> + <span class=\"frac\"><span>d₁+d₂</span><span>0.75v</span></span> = <span class=\"frac\"><span>7(d₁+d₂)</span><span>3v</span></span>.</div><div class=\"eq-line\">Equating times: d₁ + d₂ = <span class=\"frac\"><span>9</span><span>7</span></span>d₁, so d₂ = <span class=\"frac\"><span>2</span><span>7</span></span>d₁ ≈ 28.57% of d₁.</div><div class=\"eq-line\">Amy’s trip is approximately 29% farther. <strong>Choice (A)</strong></div></div>","questionHtml":"Ants Anne and Amy leave their anthill in the same direction at equal speed. Anne turns back earlier carrying food, reducing her return speed by 50%. Amy turns back later carrying food, reducing her return speed by 25%. They arrive back together. Approximately how much farther is Amy’s trip than Anne’s?","optionsHtml":["29%","71%","350%","87%"],"questionNumber":17},{"sourceNumber":18,"type":"mcq","context":"Directions for questions 18 to 20: These questions are based on the following data.\n\nOn planet Oz, there are 8 ordinary days in a week plus Oz day. Each day has 36 hours, each hour has 90 minutes, and each minute has 60 seconds. As on Earth, the hour hand covers the dial twice every day.","question":"Find the approximate angle between the hands of a clock on Oz at 16:50.","options":["189°","131°","320°","165°"],"answer":"B","sourcePage":9,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">The dial has 18 hour divisions because the hour hand covers the dial twice in a 36-hour day.</div><div class=\"eq-line\">Hour hand speed = <span class=\"frac\"><span>360°</span><span>18</span></span> = 20° per hour = <span class=\"frac\"><span>2</span><span>9</span></span>° per minute. Minute hand speed = <span class=\"frac\"><span>360°</span><span>90</span></span> = 4° per minute.</div><div class=\"eq-line\">At 16:00, hour-hand position = <span class=\"frac\"><span>16</span><span>18</span></span>(360°) = 320°.</div><div class=\"eq-line\">Relative movement in 50 minutes = 50(4 − <span class=\"frac\"><span>2</span><span>9</span></span>) = 188 <span class=\"frac\"><span>8</span><span>9</span></span>°.</div><div class=\"eq-line\">Angle = 320° − 188 <span class=\"frac\"><span>8</span><span>9</span></span>° = 131 <span class=\"frac\"><span>1</span><span>9</span></span>° ≈ 131°. <strong>Choice (B)</strong></div></div>","questionHtml":"Find the approximate angle between the hands of a clock on Oz at 16:50.","optionsHtml":["189°","131°","320°","165°"],"questionNumber":18},{"sourceNumber":19,"type":"mcq","context":"Directions for questions 18 to 20: These questions are based on the following data.\n\nOn planet Oz, there are 8 ordinary days in a week plus Oz day. Each day has 36 hours, each hour has 90 minutes, and each minute has 60 seconds. As on Earth, the hour hand covers the dial twice every day.","question":"At what time between 14:00 and 15:00 will the hands of a clock on Oz be at an angle of 60°?","options":["14:59 1617","14:37 1317","14:58 417","14:55 517"],"answer":"C","sourcePage":9,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">At 14:00, the hour hand is at <span class=\"frac\"><span>14</span><span>18</span></span>(360°) = 280°.</div><div class=\"eq-line\">For a 60° separation, the minute hand must gain either 280 + 60 = 340° or 280 − 60 = 220°.</div><div class=\"eq-line\">Relative speed = 4 − <span class=\"frac\"><span>2</span><span>9</span></span> = <span class=\"frac\"><span>34</span><span>9</span></span> degrees per minute.</div><div class=\"eq-line\">Times are 340 ÷ (<span class=\"frac\"><span>34</span><span>9</span></span>) = 90 minutes or 220 ÷ (<span class=\"frac\"><span>34</span><span>9</span></span>) = 58 <span class=\"frac\"><span>4</span><span>17</span></span> minutes.</div><div class=\"eq-line\">Only the second lies between 14:00 and 15:00: 14:58 <span class=\"frac\"><span>4</span><span>17</span></span>. <strong>Choice (C)</strong></div></div>","questionHtml":"At what time between 14:00 and 15:00 will the hands of a clock on Oz be at an angle of 60°?","optionsHtml":["14:59 <span class=\"frac\"><span>16</span><span>17</span></span>","14:37 <span class=\"frac\"><span>13</span><span>17</span></span>","14:58 <span class=\"frac\"><span>4</span><span>17</span></span>","14:55 <span class=\"frac\"><span>5</span><span>17</span></span>"],"questionNumber":19},{"sourceNumber":20,"type":"mcq","context":"Directions for questions 18 to 20: These questions are based on the following data.\n\nOn planet Oz, there are 8 ordinary days in a week plus Oz day. Each day has 36 hours, each hour has 90 minutes, and each minute has 60 seconds. As on Earth, the hour hand covers the dial twice every day.","question":"Ziba leaves home between 7:00 a.m. and 8:00 a.m. and returns between 1:00 p.m. and 2:00 p.m. to find that the hour and minute hands have interchanged positions. For how long was Ziba away?","options":["6 hours 28 minutes","12 hours 39 minutes","12 hours 28 minutes","12 hours 22 minutes"],"answer":"C","sourcePage":9,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let Ziba leave m₁ minutes after 7:00 and return m₂ minutes after 1:00.</div><div class=\"eq-line\">Interchanged hand positions give:</div><div class=\"eq-line\">7(20) + <span class=\"frac\"><span>2</span><span>9</span></span>m₁ = 4m₂. …(1)</div><div class=\"eq-line\">20 + <span class=\"frac\"><span>20</span><span>90</span></span>m₂ = 4m₁. …(2)</div><div class=\"eq-line\">Solving gives departure about 7:07 a.m. and return about 1:35 p.m.</div><div class=\"eq-line\">Elapsed Oz time = 12 hours 28 minutes. <strong>Choice (C)</strong></div></div>","questionHtml":"Ziba leaves home between 7:00 a.m. and 8:00 a.m. and returns between 1:00 p.m. and 2:00 p.m. to find that the hour and minute hands have interchanged positions. For how long was Ziba away?","optionsHtml":["6 hours 28 minutes","12 hours 39 minutes","12 hours 28 minutes","12 hours 22 minutes"],"questionNumber":20}]}</script><script>
const data=JSON.parse(document.getElementById('testData').textContent),labels=['A','B','C','D'],total=data.questions.length,answers=Array(total).fill(null),marked=Array(total).fill(false);let current=0,submitted=false,seconds=data.durationMinutes*60,timerId=null;const host=document.getElementById('questionHost'),bar=document.getElementById('qbar'),result=document.getElementById('result');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function text(v){return esc(v).replace(/\s*\n+\s*/g,' ')}function mathText(v){
let s=text(v).replace(/(\d+)\s*\/\s*(\d+)\s*(?:st|nd|rd|th)\b/gi,'$1/$2');
const blocked=new Set(['is','are','and','or','per','hr','hrs','hour','hours','min','mins','sec','secs','day','days','week','weeks','month','months','year','years','switch','board','km','cm','mm','m','lt','units']);
const atom='(?:\\([^()<>]{1,80}\\)|\\{[^{}<>]{1,100}\\}|[−-]?(?:\\d+(?:\\.\\d+)?[A-Za-zπ]{0,5}[²³⁴⁵⁶⁷⁸⁹⁰]*|[A-Za-zπ][A-Za-z0-9π²³⁴⁵⁶⁷⁸⁹⁰]{0,5})[°%]?)';
const fraction=new RegExp('(^|[^\\w/])('+atom+')\\s*\\/\\s*('+atom+')(?=$|[^\\w/])','g');
let prior;
do{prior=s;s=s.replace(fraction,(m,p,a,b)=>blocked.has(a.replace(/[()−-]/g,'').toLowerCase())||blocked.has(b.replace(/[()−-]/g,'').toLowerCase())?m:p+'<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>')}while(s!==prior);
return s}
function formatStimulus(v){const marker=/^((?:\d+\.|\(\d+\)|\([a-z]\)|[ivx]+\.|•)\s*)(.*)$/i;return String(v??'').split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).map(block=>{const lines=block.split('\n').map(x=>x.trim()).filter(Boolean);if(/^Directions\s+for\s+/i.test(lines[0]))return `<p class="direction">${mathText(lines.join(' '))}</p>`;const prose=[],items=[];let item=null;lines.forEach(line=>{const m=line.match(marker);if(m){if(item)items.push(item);item={marker:m[1].trim(),body:m[2]}}else if(item)item.body+=' '+line;else prose.push(line)});if(item)items.push(item);let out=prose.length?`<p>${mathText(prose.join(' '))}</p>`:'';if(items.length)out+=`<div class="info-list">${items.map(x=>`<div class="info-item"><span class="info-marker">${esc(x.marker)}</span><span class="info-body">${mathText(x.body)}</span></div>`).join('')}</div>`;return out||`<p>${mathText(lines.join(' '))}</p>`}).join('')}
function renderBar(){bar.innerHTML=data.questions.map((q,i)=>`<button type="button" class="qbtn ${answers[i]!==null&&answers[i]!==''?'answered ':''}${marked[i]?'marked ':''}${i===current?'current ':''}" onclick="go(${i})">${i+1}</button>`).join('')}
function response(q){if(q.type==='mcq')return `<div class="options ${q.imageOnly?'image-choice':''}">${q.options.map((op,i)=>`<label class="option"><input type="radio" name="answer" value="${labels[i]}" ${answers[current]===labels[i]?'checked':''} ${submitted?'disabled':''}><span>(${labels[i]})${q.imageOnly?'':' '+(q.optionsHtml&&q.optionsHtml[i]?q.optionsHtml[i]:mathText(op))}</span></label>`).join('')}</div>`;return `<div class="tita"><label for="titaInput">Type your answer:</label><input id="titaInput" aria-label="Type your answer" placeholder="Type your answer" inputmode="decimal" value="${esc(answers[current]??'')}" ${submitted?'disabled':''}><div class="tita-note">TITA: type the numerical/value answer. No negative marking.</div></div>`}
function contextLocalNumbers(ctx){const ids=[];data.questions.forEach((x,i)=>{if(String(x.context||'')===String(ctx||''))ids.push(i+1)});return ids}
function localRangeLabel(ids,prefix){if(!ids.length)return prefix==='common'?'Common Information':'';if(ids.length===1)return prefix==='common'?`Common Information – Question ${ids[0]}`:`question ${ids[0]}`;const contiguous=ids.every((v,i)=>i===0||v===ids[i-1]+1);if(contiguous&&ids.length===2)return prefix==='common'?`Common Information – Questions ${ids[0]}–${ids[1]}`:`questions ${ids[0]} and ${ids[1]}`;if(contiguous)return prefix==='common'?`Common Information – Questions ${ids[0]}–${ids[ids.length-1]}`:`questions ${ids[0]} to ${ids[ids.length-1]}`;return prefix==='common'?`Common Information – Questions ${ids.join(', ')}`:`questions ${ids.join(', ')}`}
function localizeContext(ctx){const ids=contextLocalNumbers(ctx);if(!ids.length)return String(ctx||'');const lines=String(ctx||'').split('\n');const first=lines[0]||'';const m=first.match(/^Directions\s+for\s+questions?\s+[^:]+:(.*)$/i);if(m)lines[0]=`Directions for ${localRangeLabel(ids,'directions')}:${m[1]}`;return lines.join('\n')}
function localizedSolution(q){let s=String(q.solution||'');s=s.replace(/Solutions?\s+for\s+questions?[^<:]*(?::|<\/text>)/gi,'');s=s.replace(/Choice\s*\([A-D]\)/gi,'');s=s.replace(/Ans(?:wer)?\s*[:=][^<]*/gi,'');return s}
function render(){const q=data.questions[current],has=!!q.context,information=has?`<section class="qa-context"><div class="common-qno">${localRangeLabel(contextLocalNumbers(q.context),'common')}</div><div class="stimulus-copy">${formatStimulus(localizeContext(q.context))}</div>${q.visual||''}</section>`:`<p class="qa-direction">Answer the question independently.</p>`;host.innerHTML=`<div class="test-content"><section class="response-pane"><div class="qhead"><div class="qnum">Question ${current+1} of ${total}</div></div>${information}${q.questionVisual||''}<h2 class="question-title">${q.questionHtml||mathText(q.question)}</h2>${response(q)}<div id="answerNote" class="answer-note"></div><section class="solution direct-solution"><div class="solution-heading">Solution</div>${localizedSolution(q)}</section></section></div><div class="navrow"><button type="button" onclick="markNext()">Mark for Review & Next</button><button type="button" onclick="clearResponse()" ${submitted?'disabled':''}>Clear Response</button><button type="button" class="previous" onclick="previous()" ${current===0?'disabled':''}>Previous</button><button type="button" class="save" onclick="next()">Save & Next</button></div>`;bind();if(submitted)review();renderBar()}
function bind(){host.querySelectorAll('input[name="answer"]').forEach(el=>el.onchange=()=>{answers[current]=el.value;renderBar()});const t=document.getElementById('titaInput');if(t)t.oninput=()=>{answers[current]=t.value.trim();renderBar()}}
function save(){const t=document.getElementById('titaInput');if(t&&!submitted)answers[current]=t.value.trim();const r=host.querySelector('input[name="answer"]:checked');if(r&&!submitted)answers[current]=r.value}function go(i){save();current=i;render()}function next(){if(current<total-1)go(current+1)}function previous(){if(current>0)go(current-1)}function markNext(){save();marked[current]=true;if(current<total-1)go(current+1);else render()}function clearResponse(){answers[current]=null;render()}
function correct(q,a){if(a===null||a==='')return null;if(q.type==='mcq')return a===q.answer;const n=v=>String(v).trim().replace(/,/g,'');return n(a)===n(q.answer)}function review(){const q=data.questions[current],s=correct(q,answers[current]),n=document.getElementById('answerNote');n.className='answer-note '+(s===null?'muted':s?'ok':'bad');n.textContent=s===null?'Unattempted. Correct answer: '+q.answer:s?'Correct.':'Wrong. Correct answer: '+q.answer}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm('Submit this sectional test now?'))return;submitted=true;clearInterval(timerId);document.body.classList.add('submitted');let c=0,w=0,u=0,score=0;data.questions.forEach((q,i)=>{const s=correct(q,answers[i]);if(s===null)u++;else if(s){c++;score+=3}else{w++;if(q.type==='mcq')score--}});result.style.display='block';result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score">Score<strong>${score}</strong></div><div class="score">Correct<strong>${c}</strong></div><div class="score">Wrong<strong>${w}</strong></div><div class="score">Attempted<strong>${c+w}</strong></div><div class="score">Unattempted<strong>${u}</strong></div></div>`;render()}
function tick(){const m=Math.floor(seconds/60),s=seconds%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(seconds<=0){submitTest(true);return}seconds--}const calc=document.getElementById('calc'),display=document.getElementById('calcDisplay'),calcResult=document.getElementById('calcResult');let memory=0;const evaluate=v=>{if(!/^[0-9+\-*/().\s]+$/.test(v))throw Error();return Function('return ('+(v||'0')+')')()};const showResult=v=>{calcResult.textContent=Number.isFinite(Number(v))?String(v):'Error'};document.getElementById('calcToggle').onclick=()=>calc.classList.toggle('open');document.getElementById('calcClose').onclick=()=>calc.classList.remove('open');document.getElementById('calcMin').onclick=()=>calc.classList.remove('open');document.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>{const v=b.dataset.calc;try{if(v==='C'){display.value='';showResult(0)}else if(v==='B')display.value=display.value.slice(0,-1);else if(v==='='){const n=evaluate(display.value);display.value=String(n);showResult(n)}else if(v==='S'){const n=-evaluate(display.value);display.value=String(n);showResult(n)}else if(v==='Q'){const n=Math.sqrt(evaluate(display.value));display.value=String(n);showResult(n)}else if(v==='P'){const n=evaluate(display.value)/100;display.value=String(n);showResult(n)}else if(v==='I'){const n=1/evaluate(display.value);display.value=String(n);showResult(n)}else if(v==='MC')memory=0;else if(v==='MR')display.value+=String(memory);else if(v==='MS')memory=evaluate(display.value);else if(v==='M+')memory+=evaluate(display.value);else if(v==='M-')memory-=evaluate(display.value);else display.value+=v}catch{showResult('Error')}});let dragging=false,dx=0,dy=0,pointerId=null;const dragBar=document.querySelector('.calc-title');dragBar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;dragging=true;pointerId=e.pointerId;const r=calc.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;calc.classList.add('dragging');dragBar.setPointerCapture(pointerId)});dragBar.addEventListener('pointermove',e=>{if(!dragging)return;const maxX=Math.max(0,window.innerWidth-calc.offsetWidth),maxY=Math.max(84,window.innerHeight-calc.offsetHeight);calc.style.left=Math.min(maxX,Math.max(0,e.clientX-dx))+'px';calc.style.top=Math.min(maxY,Math.max(84,e.clientY-dy))+'px';calc.style.right='auto'});const stopDrag=()=>{dragging=false;calc.classList.remove('dragging');if(pointerId!==null&&dragBar.hasPointerCapture(pointerId))dragBar.releasePointerCapture(pointerId);pointerId=null};dragBar.addEventListener('pointerup',stopDrag);dragBar.addEventListener('pointercancel',stopDrag);window.addEventListener('resize',()=>{const r=calc.getBoundingClientRect();if(r.right>window.innerWidth)calc.style.left=Math.max(0,window.innerWidth-r.width)+'px';if(r.bottom>window.innerHeight)calc.style.top=Math.max(84,window.innerHeight-r.height)+'px'});window.go=go;window.previous=previous;window.markNext=markNext;window.clearResponse=clearResponse;window.submitTest=submitTest;render();tick();timerId=setInterval(tick,1000);
requestAnimationFrame(()=>document.documentElement.classList.remove('booting'));</script></body></html>
