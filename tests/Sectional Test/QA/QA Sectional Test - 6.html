tton class="" data-calc="9" type="button">9</button><button class="" data-calc="/" type="button">/</button><button class="" data-calc="I" type="button">1/x</button><button class="" data-calc="4" type="button">4</button><button class="" data-calc="5" type="button">5</button><button class="" data-calc="6" type="button">6</button><button class="" data-calc="*" type="button">*</button><button class="eq" data-calc="=" type="button">=</button><button class="" data-calc="1" type="button">1</button><button class="" data-calc="2" type="button">2</button><button class="" data-calc="3" type="button">3</button><button class="" data-calc="-" type="button">-</button><button class="" data-calc="0" type="button">0</button><button class="" data-calc="." type="button">.</button><button class="" data-calc="+" type="button">+</button></div></aside><script id="testData" type="application/json">{"exercise":3,"part":2,"durationMinutes":40,"questions":[{"sourceNumber":21,"type":"mcq","context":"","question":"Ganesh and Harish start together from the same point on a circular track of length 1,600 m, running in the same direction at 50 m/min and 40 m/min. Peter starts with them from the same point in the opposite direction at 30 m/min. How many hours do all three take to meet for the third time?","options":["6","8","10","12"],"answer":"B","sourcePage":9,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">First common meeting time = LCM(<span class=\"frac\"><span>1600</span><span>50−40</span></span>, <span class=\"frac\"><span>1600</span><span>50+30</span></span>) = LCM(160,20) = 160 minutes.</div><div class=\"eq-line\">Third meeting time = 3 × 160 = 480 minutes = 8 hours. <strong>Choice (B)</strong></div></div>","questionHtml":"Ganesh and Harish start together from the same point on a circular track of length 1,600 m, running in the same direction at 50 m/min and 40 m/min. Peter starts with them from the same point in the opposite direction at 30 m/min. How many hours do all three take to meet for the third time?","optionsHtml":["6","8","10","12"],"questionNumber":1},{"sourceNumber":22,"type":"tita","context":"","question":"In a 9,000 m race, Ravi beats Rahul by 900 m, Rahul beats Ramu by 500 m, and Ravi beats Ramu by 4 12 minutes. By how many metres will Ravi beat Ramu in a 2,000 m race?","options":[],"answer":"300","sourcePage":9,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">When Ravi covers 9,000 m, Rahul covers 8,100 m. When Rahul covers 9,000 m, Ramu covers 8,500 m.</div><div class=\"eq-line\">When Rahul covers 8,100 m, Ramu covers <span class=\"frac\"><span>8,100</span><span>9,000</span></span>(8,500) = 7,650 m.</div><div class=\"eq-line\">Thus Ravi beats Ramu by 9,000 − 7,650 = 1,350 m in a 9,000 m race.</div><div class=\"eq-line\">In 2,000 m, the winning distance = <span class=\"frac\"><span>1,350</span><span>9,000</span></span>(2,000) = 300 m. <strong>Answer: 300</strong></div></div>","questionHtml":"In a 9,000 m race, Ravi beats Rahul by 900 m, Rahul beats Ramu by 500 m, and Ravi beats Ramu by 4 <span class=\"frac\"><span>1</span><span>2</span></span> minutes. By how many metres will Ravi beat Ramu in a 2,000 m race?","optionsHtml":[],"questionNumber":2},{"sourceNumber":23,"type":"mcq","context":"","question":"Samanth and Saurav run on separate rectangular fields measuring 60 m × 80 m and 30 m × 40 m. Each must run at least once between every two corners before finishing. Saurav runs at 1.35 m/s. What minimum speed must Samanth maintain to beat Saurav by 20 seconds?","options":["3 m/s","2.84 m/s","2.7 m/s","2.66 m/s"],"answer":"A","sourcePage":9,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Required paths: Samanth covers 2(80+60)+2(100)+60 = 540 m; Saurav covers 2(30+40)+2(50)+30 = 270 m.</div><div class=\"eq-line\">Saurav’s time = <span class=\"frac\"><span>270</span><span>1.35</span></span> = 200 seconds.</div><div class=\"eq-line\">To win by 20 seconds, Samanth must finish in 180 seconds.</div><div class=\"eq-line\">Minimum speed = <span class=\"frac\"><span>540</span><span>180</span></span> = 3 m/s. <strong>Choice (A)</strong></div></div>","questionHtml":"Samanth and Saurav run on separate rectangular fields measuring 60 m × 80 m and 30 m × 40 m. Each must run at least once between every two corners before finishing. Saurav runs at 1.35 m/s. What minimum speed must Samanth maintain to beat Saurav by 20 seconds?","optionsHtml":["3 m/s","2.84 m/s","2.7 m/s","2.66 m/s"],"questionNumber":3},{"sourceNumber":24,"type":"mcq","context":"","question":"The obtuse angle between the hour and minute hands of a clock is 165°. After M minutes, the obtuse angle is again 165°. What is the minimum value of M?","options":["8 211","51 911","5 511","6 611"],"answer":"C","sourcePage":9,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">The minute hand moves relative to the hour hand at 5.5° per minute.</div><div class=\"eq-line\">To move from one 165° separation to the next, the relative angle covered is 360° − 165° − 165° = 30°.</div><div class=\"eq-line\">M = <span class=\"frac\"><span>30</span><span>5.5</span></span> = <span class=\"frac\"><span>60</span><span>11</span></span> = 5 <span class=\"frac\"><span>5</span><span>11</span></span> minutes. <strong>Choice (C)</strong></div></div>","optionsHtml":["8 <span class=\"frac\"><span>2</span><span>11</span></span>","51 <span class=\"frac\"><span>9</span><span>11</span></span>","5 <span class=\"frac\"><span>5</span><span>11</span></span>","6 <span class=\"frac\"><span>6</span><span>11</span></span>"],"questionNumber":4,"questionHtml":"The obtuse angle between the hour and minute hands of a clock is 165°. After M minutes, the obtuse angle is again 165°. What is the minimum value of M?"},{"sourceNumber":25,"type":"tita","context":"","question":"A and B start simultaneously from P and Q towards each other. After reaching their destinations, they immediately turn back. They first meet 18 km from Q and meet a second time 15 km from P. If A’s speed is more than twice B’s speed, find PQ. (in km)","options":[],"answer":"60","sourcePage":9,"visual":"","questionVisual":"","imageOnly":false,"solution":"<figure class=\"native-visual solution-diagram\"><figcaption>Meeting positions for question 25</figcaption><svg class=\"flow-diagram\" viewBox=\"0 0 640 180\" role=\"img\" aria-label=\"Meeting positions for question 25\"><line x1=\"70\" y1=\"95\" x2=\"570\" y2=\"95\" stroke=\"#263b48\" stroke-width=\"4\"/><circle cx=\"70\" cy=\"95\" r=\"7\" fill=\"#c52828\"/><circle cx=\"190\" cy=\"95\" r=\"7\" fill=\"#c52828\"/><circle cx=\"470\" cy=\"95\" r=\"7\" fill=\"#c52828\"/><circle cx=\"570\" cy=\"95\" r=\"7\" fill=\"#c52828\"/><text x=\"60\" y=\"75\">P</text><text x=\"180\" y=\"75\">S</text><text x=\"460\" y=\"75\">R</text><text x=\"580\" y=\"75\">Q</text><text x=\"110\" y=\"130\">15 km</text><text x=\"485\" y=\"130\">18 km</text></svg></figure><div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let PQ = d. Since A is more than twice as fast, the second meeting occurs after A reaches Q, turns back and meets B at S.</div><div class=\"eq-line\">The constant speed ratio gives <span class=\"frac\"><span>d−18</span><span>18</span></span> = <span class=\"frac\"><span>2d−15</span><span>d−15</span></span>.</div><div class=\"eq-line\">d² − 69d + 540 = 0 ⇒ (d − 9)(d − 60) = 0.</div><div class=\"eq-line\">Since d must exceed 18, d = 60 km. <strong>Answer: 60</strong></div></div>","questionHtml":"A and B start simultaneously from P and Q towards each other. After reaching their destinations, they immediately turn back. They first meet 18 km from Q and meet a second time 15 km from P. If A’s speed is more than twice B’s speed, find PQ. (in km)","optionsHtml":[],"questionNumber":5},{"sourceNumber":26,"type":"mcq","context":"","question":"Anil leaves home for school a few minutes late, travels at 43 of his usual speed and arrives the same number of minutes early. Next day he leaves that many minutes early but travels at 811 of his usual speed. He reaches school _____.","options":["as many minutes late","twice as many minutes late","thrice as many minutes late","Cannot be determined"],"answer":"B","sourcePage":9,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let usual journey time be t and the original lateness be t₁ minutes. Travelling at <span class=\"frac\"><span>4</span><span>3</span></span> speed takes <span class=\"frac\"><span>3t</span><span>4</span></span>.</div><div class=\"eq-line\">Because he changes from t₁ late to t₁ early: t − 2t₁ = <span class=\"frac\"><span>3t</span><span>4</span></span> ⇒ t₁ = <span class=\"frac\"><span>t</span><span>8</span></span>.</div><div class=\"eq-line\">Next day let his lateness be t₂. At <span class=\"frac\"><span>8</span><span>11</span></span> speed, journey time is <span class=\"frac\"><span>11t</span><span>8</span></span>.</div><div class=\"eq-line\"><span class=\"frac\"><span>t+(t₁+t₂)</span><span>t</span></span> = <span class=\"frac\"><span>11</span><span>8</span></span> ⇒ t₁+t₂ = <span class=\"frac\"><span>3t</span><span>8</span></span>.</div><div class=\"eq-line\">With t₁ = <span class=\"frac\"><span>t</span><span>8</span></span>, t₂ = <span class=\"frac\"><span>2t</span><span>8</span></span> = 2t₁. He is twice as many minutes late. <strong>Choice (B)</strong></div></div>","questionHtml":"Anil leaves home for school a few minutes late, travels at <span class=\"frac\"><span>4</span><span>3</span></span> of his usual speed and arrives the same number of minutes early. Next day he leaves that many minutes early but travels at <span class=\"frac\"><span>8</span><span>11</span></span> of his usual speed. He reaches school _____.","optionsHtml":["as many minutes late","twice as many minutes late","thrice as many minutes late","Cannot be determined"],"questionNumber":6},{"sourceNumber":27,"type":"mcq","context":"","question":"A hare, a mongoose and a tortoise run a closed-circuit race. The hare overtakes the mongoose twice per round, the second time at the start; the mongoose overtakes the tortoise four times per round, the fourth time at the start. Find hare speed : tortoise speed.","options":["5 : 1","8 : 1","15 : 1","10 : 1"],"answer":"C","sourcePage":9,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Two hare-over-mongoose overtakes per round, with the second at the start, imply hare speed = 3 × mongoose speed.</div><div class=\"eq-line\">Four mongoose-over-tortoise overtakes per round, with the fourth at the start, imply mongoose speed = 5 × tortoise speed.</div><div class=\"eq-line\">Therefore hare : tortoise = 3 × 5 : 1 = 15 : 1. <strong>Choice (C)</strong></div></div>","questionHtml":"A hare, a mongoose and a tortoise run a closed-circuit race. The hare overtakes the mongoose twice per round, the second time at the start; the mongoose overtakes the tortoise four times per round, the fourth time at the start. Find hare speed : tortoise speed.","optionsHtml":["5 : 1","8 : 1","15 : 1","10 : 1"],"questionNumber":7},{"sourceNumber":28,"type":"mcq","context":"","question":"Bhanti starts from P towards Q. Two hours later Amar starts from P, overtakes Bhanti, reaches Q, turns back immediately and meets Bhanti 9 km from Q. Their speeds are in the ratio Bhanti : Amar = 2 : 3. What is PQ?","options":["105 km","90 km","135 km","Cannot be determined"],"answer":"D","sourcePage":9,"visual":"","questionVisual":"","imageOnly":false,"solution":"<figure class=\"native-visual solution-diagram\"><figcaption>Amar overtakes at R and later returns from Q</figcaption><svg class=\"flow-diagram\" viewBox=\"0 0 640 180\" role=\"img\" aria-label=\"Amar overtakes at R and later returns from Q\"><line x1=\"90\" y1=\"95\" x2=\"550\" y2=\"95\" stroke=\"#263b48\" stroke-width=\"4\"/><circle cx=\"90\" cy=\"95\" r=\"7\" fill=\"#c52828\"/><circle cx=\"320\" cy=\"95\" r=\"7\" fill=\"#c52828\"/><circle cx=\"550\" cy=\"95\" r=\"7\" fill=\"#c52828\"/><text x=\"80\" y=\"70\">P</text><text x=\"310\" y=\"70\">R</text><text x=\"540\" y=\"70\">Q</text><text x=\"420\" y=\"130\">9 km from Q</text></svg></figure><div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let Bhanti take t hours to reach the overtaking point R. Amar takes t − 2 hours.</div><div class=\"eq-line\"><span class=\"frac\"><span>t−2</span><span>t</span></span> = <span class=\"frac\"><span>2</span><span>3</span></span> ⇒ t = 6 hours.</div><div class=\"eq-line\">Let RQ = d. On Amar’s trip R→Q→meeting, distances are d+9 for Amar and d−9 for Bhanti.</div><div class=\"eq-line\"><span class=\"frac\"><span>d+9</span><span>d−9</span></span> = <span class=\"frac\"><span>3</span><span>2</span></span> ⇒ d = 45 km.</div><div class=\"eq-line\">Only RQ is determined; PR is unknown, so PQ cannot be determined. <strong>Choice (D)</strong></div></div>","questionHtml":"Bhanti starts from P towards Q. Two hours later Amar starts from P, overtakes Bhanti, reaches Q, turns back immediately and meets Bhanti 9 km from Q. Their speeds are in the ratio Bhanti : Amar = 2 : 3. What is PQ?","optionsHtml":["105 km","90 km","135 km","Cannot be determined"],"questionNumber":8},{"sourceNumber":29,"type":"mcq","context":"","question":"Car A leaves X at 7:00 a.m. at 50 km/hr towards Y. Car B leaves X at 8:00 a.m. at 40 km/hr. Car C leaves Y at 9:00 a.m. at 30 km/hr towards X. If XY = 200 km, when is distance AB equal to distance AC?","options":["9:26:40 a.m.","9:28:36 a.m.","9:30:30 a.m.","9:36:20 a.m."],"answer":"A","sourcePage":9,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let t be hours after 7:00 a.m. For t>2: A = 50t, B = 40(t−1), C = 200 − 30(t−2).</div><div class=\"eq-line\">Set distance AB equal to distance AC:</div><div class=\"eq-line\">50t − 40(t−1) = [200 − 30(t−2)] − 50t.</div><div class=\"eq-line\">10t + 40 = 260 − 80t ⇒ 90t = 220.</div><div class=\"eq-line\">t = <span class=\"frac\"><span>22</span><span>9</span></span> hours after 7:00 = 2 hours 26 minutes 40 seconds, giving 9:26:40 a.m. <strong>Choice (A)</strong></div></div>","questionHtml":"Car A leaves X at 7:00 a.m. at 50 km/hr towards Y. Car B leaves X at 8:00 a.m. at 40 km/hr. Car C leaves Y at 9:00 a.m. at 30 km/hr towards X. If XY = 200 km, when is distance AB equal to distance AC?","optionsHtml":["9:26:40 a.m.","9:28:36 a.m.","9:30:30 a.m.","9:36:20 a.m."],"questionNumber":9},{"sourceNumber":30,"type":"tita","context":"","question":"Amrish and Biswas start simultaneously from A and B towards each other. They first cross 17 m from A. Biswas continues to A, turns back and overtakes Amrish at a point 19 56 m from B. Find AB. (in m)","options":[],"answer":"59.5","sourcePage":9,"visual":"","questionVisual":"","imageOnly":false,"solution":"<figure class=\"native-visual solution-diagram\"><figcaption>First and second meeting positions</figcaption><svg class=\"flow-diagram\" viewBox=\"0 0 640 180\" role=\"img\" aria-label=\"First and second meeting positions\"><text x=\"30\" y=\"35\">First meeting</text><line x1=\"160\" y1=\"30\" x2=\"590\" y2=\"30\" stroke=\"#263b48\" stroke-width=\"4\"/><circle cx=\"260\" cy=\"30\" r=\"7\" fill=\"#c52828\"/><text x=\"150\" y=\"60\">A</text><text x=\"245\" y=\"60\">17 m</text><text x=\"580\" y=\"60\">B</text><text x=\"30\" y=\"125\">Second meeting</text><line x1=\"160\" y1=\"120\" x2=\"590\" y2=\"120\" stroke=\"#263b48\" stroke-width=\"4\"/><circle cx=\"500\" cy=\"120\" r=\"7\" fill=\"#c52828\"/><text x=\"150\" y=\"150\">A</text><text x=\"430\" y=\"150\">near B</text><text x=\"580\" y=\"150\">B</text></svg></figure><div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let AB = L. At the first meeting, Amrish and Biswas cover 17 and L−17.</div><div class=\"eq-line\">Using the distances covered between the first and second meetings and the same speed ratio gives:</div><div class=\"eq-line\"><span class=\"frac\"><span>102</span><span>6L−221</span></span> = <span class=\"frac\"><span>6(L−17)</span><span>6L−17</span></span>.</div><div class=\"eq-line\">Solving yields L = 59.5 m or <span class=\"frac\"><span>34</span><span>3</span></span> m. Since L > 17, L = 59.5 m. <strong>Answer: 59.5</strong></div></div>","questionHtml":"Amrish and Biswas start simultaneously from A and B towards each other. They first cross 17 m from A. Biswas continues to A, turns back and overtakes Amrish at a point 19 <span class=\"frac\"><span>5</span><span>6</span></span> m from B. Find AB. (in m)","optionsHtml":[],"questionNumber":10},{"sourceNumber":31,"type":"mcq","context":"","question":"P and Q start at 10:00 a.m. from the same point and walk in opposite directions. R starts at 11:00 a.m. in P’s direction and catches P at 11:30 a.m. R reverses direction, increases speed by 61 19%, and catches Q at 12:30 p.m. Find P speed : Q speed.","options":["4 : 5","5 : 6","3 : 4","7 : 9"],"answer":"C","sourcePage":9,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let speeds of P, Q and R initially be p, q and r. R catches P in 0.5 hour after P has a one-hour head start.</div><div class=\"eq-line\"><span class=\"frac\"><span>p</span><span>r−p</span></span> = <span class=\"frac\"><span>1</span><span>2</span></span> ⇒ p = <span class=\"frac\"><span>r</span><span>3</span></span>. …(1)</div><div class=\"eq-line\">After reversing, R’s speed is 1 + 61 <span class=\"frac\"><span>1</span><span>9</span></span>% = <span class=\"frac\"><span>29</span><span>18</span></span> times r. In the next hour it closes Q’s 1.5-hour head start plus Q’s further one-hour travel.</div><div class=\"eq-line\">1.5q + 0.5r = <span class=\"frac\"><span>29r</span><span>18</span></span> − q ⇒ 2.5q = <span class=\"frac\"><span>10r</span><span>9</span></span> ⇒ q = <span class=\"frac\"><span>4r</span><span>9</span></span>.</div><div class=\"eq-line\">Thus p : q = <span class=\"frac\"><span>r</span><span>3</span></span> : <span class=\"frac\"><span>4r</span><span>9</span></span> = 3 : 4. <strong>Choice (C)</strong></div></div>","questionHtml":"P and Q start at 10:00 a.m. from the same point and walk in opposite directions. R starts at 11:00 a.m. in P’s direction and catches P at 11:30 a.m. R reverses direction, increases speed by 61 <span class=\"frac\"><span>1</span><span>9</span></span>%, and catches Q at 12:30 p.m. Find P speed : Q speed.","optionsHtml":["4 : 5","5 : 6","3 : 4","7 : 9"],"questionNumber":11},{"sourceNumber":32,"type":"tita","context":"","question":"A train takes 50 seconds to cross a boy moving at 6 km/hr in the opposite direction. A second train, half as long and 25% faster, takes 30 seconds to cross a pole. Find the length of the second train. (in m)","options":[],"answer":"125","sourcePage":9,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let the train speeds be 4x and 5x km/hr. First-train length is twice second-train length.</div><div class=\"eq-line\">First-train length = (4x+6)<span class=\"frac\"><span>5</span><span>18</span></span>(50); second-train length = 5x<span class=\"frac\"><span>5</span><span>18</span></span>(30).</div><div class=\"eq-line\">Twice the second length equals the first: 2(5x)(30) = (4x+6)(50) ⇒ x = 3.</div><div class=\"eq-line\">Second-train length = 15 × <span class=\"frac\"><span>5</span><span>18</span></span> × 30 = 125 m. <strong>Answer: 125</strong></div></div>","questionHtml":"A train takes 50 seconds to cross a boy moving at 6 km/hr in the opposite direction. A second train, half as long and 25% faster, takes 30 seconds to cross a pole. Find the length of the second train. (in m)","optionsHtml":[],"questionNumber":12},{"sourceNumber":33,"type":"mcq","context":"","question":"Anubhav and Rakesh start together around a 600 m circular track. Running in the same direction, one overtakes the other every 60 seconds. They first meet at the starting point after 60 seconds. Which cannot be the faster person’s speed?","options":["10 m/s","20 m/s","30 m/s","40 m/s"],"answer":"A","sourcePage":9,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Relative speed = <span class=\"frac\"><span>600</span><span>60</span></span> = 10 m/s.</div><div class=\"eq-line\">Their individual lap times must have LCM 60 seconds. Possible speed pairs differing by 10 are (10,20), (20,30), (30,40), (40,50), …</div><div class=\"eq-line\">The faster speed cannot be 10 m/s because the slower runner would then have speed 0. <strong>Choice (A)</strong></div></div>","questionHtml":"Anubhav and Rakesh start together around a 600 m circular track. Running in the same direction, one overtakes the other every 60 seconds. They first meet at the starting point after 60 seconds. Which cannot be the faster person’s speed?","optionsHtml":["10 m/s","20 m/s","30 m/s","40 m/s"],"questionNumber":13},{"sourceNumber":34,"type":"mcq","context":"","question":"A boat travelling upstream crosses a tree trunk floating downstream 16 km from P at noon. It continues upstream for two hours, turns around, and reaches P at 4:00 p.m. When does the trunk reach P?","options":["5:00 p.m.","4:30 p.m.","3:00 p.m.","4:00 p.m."],"answer":"D","sourcePage":10,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">After meeting the trunk at noon, the boat travels upstream for two hours and downstream for two hours.</div><div class=\"eq-line\">At 4:00 p.m. it has returned to the trunk’s downstream position. The boat is also at P then.</div><div class=\"eq-line\">Therefore the trunk reaches P at 4:00 p.m. <strong>Choice (D)</strong></div></div>","questionHtml":"A boat travelling upstream crosses a tree trunk floating downstream 16 km from P at noon. It continues upstream for two hours, turns around, and reaches P at 4:00 p.m. When does the trunk reach P?","optionsHtml":["5:00 p.m.","4:30 p.m.","3:00 p.m.","4:00 p.m."],"questionNumber":14},{"sourceNumber":35,"type":"tita","context":"","question":"A 600 m train is leaving a 1,125 m platform at 15 km/hr. Before it completely leaves, a 300 m train moving oppositely at 75 km/hr starts crossing it. The second train enters the platform completely at the instant it finishes crossing the first train. How many seconds later does it finish crossing the platform?","options":[],"answer":"54","sourcePage":10,"visual":"","questionVisual":"","imageOnly":false,"solution":"<figure class=\"native-visual solution-diagram\"><figcaption>Train and platform positions</figcaption><svg class=\"flow-diagram\" viewBox=\"0 0 640 180\" role=\"img\" aria-label=\"Train and platform positions\"><rect x=\"160\" y=\"100\" width=\"320\" height=\"35\" fill=\"#d7e8f3\" stroke=\"#263b48\" stroke-width=\"3\"/><text x=\"270\" y=\"125\">1,125 m platform</text><rect x=\"90\" y=\"65\" width=\"135\" height=\"30\" fill=\"#efb366\" stroke=\"#263b48\" stroke-width=\"3\"/><text x=\"105\" y=\"55\">Second train</text><path d=\"M225 80h55\" stroke=\"#263b48\" stroke-width=\"3\" marker-end=\"url(#a)\"/><rect x=\"465\" y=\"25\" width=\"110\" height=\"30\" fill=\"#9fc98d\" stroke=\"#263b48\" stroke-width=\"3\"/><text x=\"455\" y=\"18\">First train</text><path d=\"M465 40h-55\" stroke=\"#263b48\" stroke-width=\"3\" marker-end=\"url(#b)\"/><defs><marker id=\"a\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L6,3 z\" fill=\"#263b48\"/></marker><marker id=\"b\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L6,3 z\" fill=\"#263b48\"/></marker></defs></svg></figure><div class=\"math-solution standardized-solution\"><div class=\"eq-line\">When the second train has entered the platform completely, it has just finished crossing the first train.</div><div class=\"eq-line\">From then until it leaves the platform, it must cover exactly the platform length, 1,125 m.</div><div class=\"eq-line\">Second-train speed = 75 km/hr = <span class=\"frac\"><span>125</span><span>6</span></span> m/s.</div><div class=\"eq-line\">Time = 1,125 ÷ (<span class=\"frac\"><span>125</span><span>6</span></span>) = 54 seconds. <strong>Answer: 54</strong></div></div>","questionHtml":"A 600 m train is leaving a 1,125 m platform at 15 km/hr. Before it completely leaves, a 300 m train moving oppositely at 75 km/hr starts crossing it. The second train enters the platform completely at the instant it finishes crossing the first train. How many seconds later does it finish crossing the platform?","optionsHtml":[],"questionNumber":15},{"sourceNumber":36,"type":"mcq","context":"","question":"An 18 km upstream journey takes three hours longer than the downstream journey. If the boat’s speed in still water is twice the stream speed, find the stream speed.","options":["3 km/hr","4 km/hr","4.5 km/hr","6 km/hr"],"answer":"B","sourcePage":10,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let stream speed = x km/hr and still-water boat speed = 2x km/hr.</div><div class=\"eq-line\">Upstream speed = x; downstream speed = 3x.</div><div class=\"eq-line\"><span class=\"frac\"><span>18</span><span>x</span></span> = <span class=\"frac\"><span>18</span><span>3x</span></span> + 3 ⇒ <span class=\"frac\"><span>12</span><span>x</span></span> = 3 ⇒ x = 4 km/hr. <strong>Choice (B)</strong></div></div>","questionHtml":"An 18 km upstream journey takes three hours longer than the downstream journey. If the boat’s speed in still water is twice the stream speed, find the stream speed.","optionsHtml":["3 km/hr","4 km/hr","4.5 km/hr","6 km/hr"],"questionNumber":16},{"sourceNumber":37,"type":"tita","context":"","question":"Ajay and Ajit run around a circular track in the same direction; Ajay runs five times as fast. At ordinary overtakes, the overtaker gives the other runner as many tokens as the other has. At a starting-point overtake, the slower runner gives half his tokens to the faster. Ajit starts with one token; Ajay finishes with 246. How many tokens could Ajay have started with?","options":[],"answer":"501","sourcePage":10,"visual":"","questionVisual":"","imageOnly":false,"solution":"<figure class=\"native-visual solution-diagram\"><figcaption>Four overtaking points per Ajay lap</figcaption><svg class=\"flow-diagram\" viewBox=\"0 0 640 180\" role=\"img\" aria-label=\"Four overtaking points per Ajay lap\"><circle cx=\"320\" cy=\"90\" r=\"65\" fill=\"none\" stroke=\"#263b48\" stroke-width=\"4\"/><circle cx=\"320\" cy=\"155\" r=\"6\" fill=\"#c52828\"/><circle cx=\"385\" cy=\"90\" r=\"6\" fill=\"#c52828\"/><circle cx=\"320\" cy=\"25\" r=\"6\" fill=\"#c52828\"/><circle cx=\"255\" cy=\"90\" r=\"6\" fill=\"#c52828\"/><text x=\"310\" y=\"175\">A</text><text x=\"400\" y=\"98\">B</text><text x=\"310\" y=\"20\">C</text><text x=\"235\" y=\"98\">D</text></svg></figure><div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Ajay’s speed is 5v while Ajit’s is v, so Ajay overtakes Ajit at B, C, D and A during each Ajay lap.</div><div class=\"eq-line\">Ajit’s tokens double at B, C and D, then halve at A: starting with 1, he ends successive full laps with 4, 16, 64, 256 tokens.</div><div class=\"eq-line\">After n laps, Ajit has 4ⁿ tokens, of which 4ⁿ−1 came from Ajay.</div><div class=\"eq-line\">If Ajay begins with N and finishes with 246: N − (4ⁿ−1) = 246.</div><div class=\"eq-line\">Trying n = 4 gives N = 246 + 255 = 501. <strong>Answer: 501</strong></div></div>","questionHtml":"Ajay and Ajit run around a circular track in the same direction; Ajay runs five times as fast. At ordinary overtakes, the overtaker gives the other runner as many tokens as the other has. At a starting-point overtake, the slower runner gives half his tokens to the faster. Ajit starts with one token; Ajay finishes with 246. How many tokens could Ajay have started with?","optionsHtml":[],"questionNumber":17},{"sourceNumber":38,"type":"mcq","context":"","question":"P and Q start simultaneously from A and B towards each other and meet after two hours. After meeting, P takes three hours less to reach B than Q takes to reach A. If Q’s speed is 2 km/hr, find P’s speed.","options":["3 km/hr","3.5 km/hr","4 km/hr","5 km/hr"],"answer":"C","sourcePage":10,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let P and Q speeds be x and y. In two hours they cover 2x and 2y.</div><div class=\"eq-line\">After meeting, Q takes <span class=\"frac\"><span>2x</span><span>y</span></span> hours to reach A and P takes <span class=\"frac\"><span>2y</span><span>x</span></span> hours to reach B.</div><div class=\"eq-line\"><span class=\"frac\"><span>2x</span><span>y</span></span> − <span class=\"frac\"><span>2y</span><span>x</span></span> = 3.</div><div class=\"eq-line\">Let a = <span class=\"frac\"><span>x</span><span>y</span></span>. Then 2a − <span class=\"frac\"><span>2</span><span>a</span></span> = 3 ⇒ 2a² − 3a − 2 = 0 ⇒ (2a+1)(a−2)=0.</div><div class=\"eq-line\">Since a>0, a=2. With y=2 km/hr, x=4 km/hr. <strong>Choice (C)</strong></div></div>","questionHtml":"P and Q start simultaneously from A and B towards each other and meet after two hours. After meeting, P takes three hours less to reach B than Q takes to reach A. If Q’s speed is 2 km/hr, find P’s speed.","optionsHtml":["3 km/hr","3.5 km/hr","4 km/hr","5 km/hr"],"questionNumber":18},{"sourceNumber":39,"type":"tita","context":"","question":"Two cars start together toward a destination 420 km away at 60 km/hr and 90 km/hr. After some time they interchange speeds. The second car arrives one hour before the first. After how many hours were their speeds interchanged?","options":[],"answer":"4","sourcePage":10,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Let x be the hours travelled at the original speeds. Remaining distances are 420−60x and 420−90x.</div><div class=\"eq-line\">After the swap, the first travels at 90 and the second at 60. The second arrives one hour earlier:</div><div class=\"eq-line\"><span class=\"frac\"><span>420−60x</span><span>90</span></span> = <span class=\"frac\"><span>420−90x</span><span>60</span></span> + 1.</div><div class=\"eq-line\">840−120x = 1,440−270x ⇒ 150x = 600 ⇒ x = 4 hours. <strong>Answer: 4</strong></div></div>","questionHtml":"Two cars start together toward a destination 420 km away at 60 km/hr and 90 km/hr. After some time they interchange speeds. The second car arrives one hour before the first. After how many hours were their speeds interchanged?","optionsHtml":[],"questionNumber":19},{"sourceNumber":40,"type":"tita","context":"","question":"Charan rides from P to Q while Dinesh walks from P. When Charan reaches the midpoint, Dinesh calls him; Charan turns back, picks up Dinesh and rides with him to Q. Charan takes 1.6 times his normal journey time, while Dinesh saves 20 minutes. If PQ = 2.5 km, find Dinesh’s speed. (in km/hr)","options":[],"answer":"4.5","sourcePage":10,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\"><div class=\"eq-line\">Charan’s extra travel makes his actual time 1.6 times normal, so the extra back-and-forth distance is 0.6PQ. He turns back 0.3PQ.</div><div class=\"eq-line\">During this interval Charan covers 0.8PQ while Dinesh covers 0.2PQ, so Charan is four times as fast.</div><div class=\"eq-line\">For Dinesh to cover <span class=\"frac\"><span>4</span><span>5</span></span>PQ, let his normal time be t; Charan covers the same distance in <span class=\"frac\"><span>t</span><span>4</span></span>.</div><div class=\"eq-line\">t − <span class=\"frac\"><span>t</span><span>4</span></span> = <span class=\"frac\"><span>3t</span><span>4</span></span> = 20 minutes = <span class=\"frac\"><span>1</span><span>3</span></span> hour ⇒ t = <span class=\"frac\"><span>4</span><span>9</span></span> hour.</div><div class=\"eq-line\">Dinesh’s full-PQ time = <span class=\"frac\"><span>5</span><span>4</span></span>t = <span class=\"frac\"><span>5</span><span>9</span></span> hour.</div><div class=\"eq-line\">Speed = 2.5 ÷ (<span class=\"frac\"><span>5</span><span>9</span></span>) = 4.5 km/hr. <strong>Answer: 4.5</strong></div></div>","questionHtml":"Charan rides from P to Q while Dinesh walks from P. When Charan reaches the midpoint, Dinesh calls him; Charan turns back, picks up Dinesh and rides with him to Q. Charan takes 1.6 times his normal journey time, while Dinesh saves 20 minutes. If PQ = 2.5 km, find Dinesh’s speed. (in km/hr)","optionsHtml":[],"questionNumber":20}]}</script><script>
const data=JSON.parse(document.getElementById('testData').textContent),labels=['A','B','C','D'],total=data.questions.length,answers=Array(total).fill(null),marked=Array(total).fill(false);let current=0,submitted=false,seconds=data.durationMinutes*60,timerId=null;const host=document.getElementById('questionHost'),bar=document.getElementById('qbar'),result=document.getElementById('result');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function text(v){return esc(v).replace(/\s*\n+\s*/g,' ')}function mathText(v){
let s=text(v).replace(/(\d+)\s*\/\s*(\d+)\s*(?:st|nd|rd|th)\b/gi,'$1/$2');
const blocked=new Set(['is','are','and','or','per','hr','hrs','hour','hours','min','mins','sec','secs','day','days','week','weeks','month','months','year','years','switch','board','km','cm','mm','m','lt','units']);
const atom='(?:\\([^()<>]{1,80}\\)|\\{[^{}<>]{1,100}\\}|[−-]?(?:\\d+(?:\\.\\d+)?[A-Za-zπ]{0,5}[²³⁴⁵⁶⁷⁸⁹⁰]*|[A-Za-zπ][A-Za-z0-9π²³⁴⁵⁶⁷⁸⁹⁰]{0,5})[°%]?)';
const fraction=new RegExp('(^|[^\\w/])('+atom+')\\s*\\/\\s*('+atom+')(?=$|[^\\w/])','g');
let prior;
do{prior=s;s=s.replace(fraction,(m,p,a,b)=>blocked.has(a.replace(/[()−-]/g,'').toLowerCase())||blocked.has(b.replace(/[()−-]/g,'').toLowerCase())?m:p+'<span class="frac"><span>'+a+'</span><span>'+b+'</span></span>')}while(s!==prior);
return s}
function formatStimulus(v){const marker=/^((?:\d+\.|\(\d+\)|\([a-z]\)|[ivx]+\.|•)\s*)(.*)$/i;return String(v??'').split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).map(block=>{const lines=block.split('\n').map(x=>x.trim()).filter(Boolean);if(/^Directions\s+for\s+/i.test(lines[0]))return `<p class="direction">${mathText(lines.join(' '))}</p>`;const prose=[],items=[];let item=null;lines.forEach(line=>{const m=line.match(marker);if(m){if(item)items.push(item);item={marker:m[1].trim(),body:m[2]}}else if(item)item.body+=' '+line;else prose.push(line)});if(item)items.push(item);let out=prose.length?`<p>${mathText(prose.join(' '))}</p>`:'';if(items.length)out+=`<div class="info-list">${items.map(x=>`<div class="info-item"><span class="info-marker">${esc(x.marker)}</span><span class="info-body">${mathText(x.body)}</span></div>`).join('')}</div>`;return out||`<p>${mathText(lines.join(' '))}</p>`}).join('')}
function renderBar(){bar.innerHTML=data.questions.map((q,i)=>`<button type="button" class="qbtn ${answers[i]!==null&&answers[i]!==''?'answered ':''}${marked[i]?'marked ':''}${i===current?'current ':''}" onclick="go(${i})">${i+1}</button>`).join('')}
function response(q){if(q.type==='mcq')return `<div class="options ${q.imageOnly?'image-choice':''}">${q.options.map((op,i)=>`<label class="option"><input type="radio" name="answer" value="${labels[i]}" ${answers[current]===labels[i]?'checked':''} ${submitted?'disabled':''}><span>(${labels[i]})${q.imageOnly?'':' '+(q.optionsHtml&&q.optionsHtml[i]?q.optionsHtml[i]:mathText(op))}</span></label>`).join('')}</div>`;return `<div class="tita"><label for="titaInput">Type your answer:</label><input id="titaInput" aria-label="Type your answer" placeholder="Type your answer" inputmode="decimal" value="${esc(answers[current]??'')}" ${submitted?'disabled':''}><div class="tita-note">TITA: type the numerical/value answer. No negative marking.</div></div>`}
function contextLocalNumbers(ctx){const ids=[];data.questions.forEach((x,i)=>{if(String(x.context||'')===String(ctx||''))ids.push(i+1)});return ids}
function localRangeLabel(ids,prefix){if(!ids.length)return prefix==='common'?'Common Information':'';if(ids.length===1)return prefix==='common'?`Common Information – Question ${ids[0]}`:`question ${ids[0]}`;const contiguous=ids.every((v,i)=>i===0||v===ids[i-1]+1);if(contiguous&&ids.length===2)return prefix==='common'?`Common Information – Questions ${ids[0]}–${ids[1]}`:`questions ${ids[0]} and ${ids[1]}`;if(contiguous)return prefix==='common'?`Common Information – Questions ${ids[0]}–${ids[ids.length-1]}`:`questions ${ids[0]} to ${ids[ids.length-1]}`;return prefix==='common'?`Common Information – Questions ${ids.join(', ')}`:`questions ${ids.join(', ')}`}
function localizeContext(ctx){const ids=contextLocalNumbers(ctx);if(!ids.length)return String(ctx||'');const lines=String(ctx||'').split('\n');const first=lines[0]||'';const m=first.match(/^Directions\s+for\s+questions?\s+[^:]+:(.*)$/i);if(m)lines[0]=`Directions for ${localRangeLabel(ids,'directions')}:${m[1]}`;return lines.join('\n')}
function localizedSolution(q){let s=String(q.solution||'');s=s.replace(/Solutions?\s+for\s+questions?[^<:]*(?::|<\/text>)/gi,'');s=s.replace(/Choice\s*\([A-D]\)/gi,'');s=s.replace(/Ans(?:wer)?\s*[:=][^<]*/gi,'');return s}
function render(){const q=data.questions[current],has=!!q.context,information=has?`<section class="qa-context"><div class="common-qno">${localRangeLabel(contextLocalNumbers(q.context),'common')}</div><div class="stimulus-copy">${formatStimulus(localizeContext(q.context))}</div>${q.visual||''}</section>`:`<p class="qa-direction">Answer the question independently.</p>`;host.innerHTML=`<div class="test-content"><section class="response-pane"><div class="qhead"><div class="qnum">Question ${current+1} of ${total}</div></div>${information}${q.questionVisual||''}<h2 class="question-title">${q.questionHtml||mathText(q.question)}</h2>${response(q)}<div id="answerNote" class="answer-note"></div><section class="solution direct-solution"><div class="solution-heading">Solution</div>${localizedSolution(q)}</section></section></div><div class="navrow"><button type="button" onclick="markNext()">Mark for Review & Next</button><button type="button" onclick="clearResponse()" ${submitted?'disabled':''}>Clear Response</button><button type="button" class="previous" onclick="previous()" ${current===0?'disabled':''}>Previous</button><button type="button" class="save" onclick="next()">Save & Next</button></div>`;bind();if(submitted)review();renderBar()}
function bind(){host.querySelectorAll('input[name="answer"]').forEach(el=>el.onchange=()=>{answers[current]=el.value;renderBar()});const t=document.getElementById('titaInput');if(t)t.oninput=()=>{answers[current]=t.value.trim();renderBar()}}
function save(){const t=document.getElementById('titaInput');if(t&&!submitted)answers[current]=t.value.trim();const r=host.querySelector('input[name="answer"]:checked');if(r&&!submitted)answers[current]=r.value}function go(i){save();current=i;render()}function next(){if(current<total-1)go(current+1)}function previous(){if(current>0)go(current-1)}function markNext(){save();marked[current]=true;if(current<total-1)go(current+1);else render()}function clearResponse(){answers[current]=null;render()}
function correct(q,a){if(a===null||a==='')return null;if(q.type==='mcq')return a===q.answer;const n=v=>String(v).trim().replace(/,/g,'');return n(a)===n(q.answer)}function review(){const q=data.questions[current],s=correct(q,answers[current]),n=document.getElementById('answerNote');n.className='answer-note '+(s===null?'muted':s?'ok':'bad');n.textContent=s===null?'Unattempted. Correct answer: '+q.answer:s?'Correct.':'Wrong. Correct answer: '+q.answer}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm('Submit this sectional test now?'))return;submitted=true;clearInterval(timerId);document.body.classList.add('submitted');let c=0,w=0,u=0,score=0;data.questions.forEach((q,i)=>{const s=correct(q,answers[i]);if(s===null)u++;else if(s){c++;score+=3}else{w++;if(q.type==='mcq')score--}});result.style.display='block';result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score">Score<strong>${score}</strong></div><div class="score">Correct<strong>${c}</strong></div><div class="score">Wrong<strong>${w}</strong></div><div class="score">Attempted<strong>${c+w}</strong></div><div class="score">Unattempted<strong>${u}</strong></div></div>`;render()}
function tick(){const m=Math.floor(seconds/60),s=seconds%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(seconds<=0){submitTest(true);return}seconds--}const calc=document.getElementById('calc'),display=document.getElementById('calcDisplay'),calcResult=document.getElementById('calcResult');let memory=0;const evaluate=v=>{if(!/^[0-9+\-*/().\s]+$/.test(v))throw Error();return Function('return ('+(v||'0')+')')()};const showResult=v=>{calcResult.textContent=Number.isFinite(Number(v))?String(v):'Error'};document.getElementById('calcToggle').onclick=()=>calc.classList.toggle('open');document.getElementById('calcClose').onclick=()=>calc.classList.remove('open');document.getElementById('calcMin').onclick=()=>calc.classList.remove('open');document.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>{const v=b.dataset.calc;try{if(v==='C'){display.value='';showResult(0)}else if(v==='B')display.value=display.value.slice(0,-1);else if(v==='='){const n=evaluate(display.value);display.value=String(n);showResult(n)}else if(v==='S'){const n=-evaluate(display.value);display.value=String(n);showResult(n)}else if(v==='Q'){const n=Math.sqrt(evaluate(display.value));display.value=String(n);showResult(n)}else if(v==='P'){const n=evaluate(display.value)/100;display.value=String(n);showResult(n)}else if(v==='I'){const n=1/evaluate(display.value);display.value=String(n);showResult(n)}else if(v==='MC')memory=0;else if(v==='MR')display.value+=String(memory);else if(v==='MS')memory=evaluate(display.value);else if(v==='M+')memory+=evaluate(display.value);else if(v==='M-')memory-=evaluate(display.value);else display.value+=v}catch{showResult('Error')}});let dragging=false,dx=0,dy=0,pointerId=null;const dragBar=document.querySelector('.calc-title');dragBar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;dragging=true;pointerId=e.pointerId;const r=calc.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;calc.classList.add('dragging');dragBar.setPointerCapture(pointerId)});dragBar.addEventListener('pointermove',e=>{if(!dragging)return;const maxX=Math.max(0,window.innerWidth-calc.offsetWidth),maxY=Math.max(84,window.innerHeight-calc.offsetHeight);calc.style.left=Math.min(maxX,Math.max(0,e.clientX-dx))+'px';calc.style.top=Math.min(maxY,Math.max(84,e.clientY-dy))+'px';calc.style.right='auto'});const stopDrag=()=>{dragging=false;calc.classList.remove('dragging');if(pointerId!==null&&dragBar.hasPointerCapture(pointerId))dragBar.releasePointerCapture(pointerId);pointerId=null};dragBar.addEventListener('pointerup',stopDrag);dragBar.addEventListener('pointercancel',stopDrag);window.addEventListener('resize',()=>{const r=calc.getBoundingClientRect();if(r.right>window.innerWidth)calc.style.left=Math.max(0,window.innerWidth-r.width)+'px';if(r.bottom>window.innerHeight)calc.style.top=Math.max(84,window.innerHeight-r.height)+'px'});window.go=go;window.previous=previous;window.markNext=markNext;window.clearResponse=clearResponse;window.submitTest=submitTest;render();tick();timerId=setInterval(tick,1000);
requestAnimationFrame(()=>document.documentElement.classList.remove('booting'));</script></body></html>
