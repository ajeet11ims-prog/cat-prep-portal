c="M+" type="button">M+</button><button class="" data-calc="M-" type="button">M-</button><button class="danger" data-calc="B" type="button">←</button><button class="danger" data-calc="C" type="button">C</button><button class="danger" data-calc="S" type="button">+/-</button><button class="" data-calc="Q" type="button">√</button><button class="" data-calc="P" type="button">%</button><button class="" data-calc="7" type="button">7</button><button class="" data-calc="8" type="button">8</button><button class="" data-calc="9" type="button">9</button><button class="" data-calc="/" type="button">/</button><button class="" data-calc="I" type="button">1/x</button><button class="" data-calc="4" type="button">4</button><button class="" data-calc="5" type="button">5</button><button class="" data-calc="6" type="button">6</button><button class="" data-calc="*" type="button">*</button><button class="eq" data-calc="=" type="button">=</button><button class="" data-calc="1" type="button">1</button><button class="" data-calc="2" type="button">2</button><button class="" data-calc="3" type="button">3</button><button class="" data-calc="-" type="button">-</button><button class="" data-calc="0" type="button">0</button><button class="" data-calc="." type="button">.</button><button class="" data-calc="+" type="button">+</button></div></aside><script id="testData" type="application/json">{"exercise":4,"part":1,"durationMinutes":50,"questions":[{"sourceNumber":1,"type":"mcq","context":"Directions for questions 1 and 2: These questions are based on the following data.\n\nThere are ten taps numbered 1 to 10 that can fill a cistern. The rate of the nth tap (n ≥ 2) is 2/3 of the cumulative rate of all taps numbered less than it.","question":"If the total time taken to fill the cistern by all the\n10 taps together is 1 minute, then how many minutes\nwould the 6th tap take when working alone to fill it?","options":["1242/75","1822/45","2085/15","1947/162"],"answer":"D","sourcePage":10,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">Let the first tap alone take <em>t</em> minutes. Adding each new tap multiplies the cumulative rate by <span class=\"frac\"><span>5</span><span>3</span></span>, so the time for the first <em>n</em> taps is <span class=\"math\">t<sub>n</sub> = (<span class=\"frac\"><span>3</span><span>5</span></span>)<sup>n−1</sup>t</span>.<br>Given <span class=\"math\">t<sub>10</sub>=(<span class=\"frac\"><span>3</span><span>5</span></span>)<sup>9</sup>t=1</span>, hence <span class=\"math\">t=(<span class=\"frac\"><span>5</span><span>3</span></span>)<sup>9</sup></span>.<br>Therefore <span class=\"math\">t<sub>5</sub>=<span class=\"frac\"><span>3125</span><span>243</span></span></span> and <span class=\"math\">t<sub>6</sub>=<span class=\"frac\"><span>625</span><span>81</span></span></span>. If the sixth tap alone takes <em>T</em>, then <span class=\"math\"><span class=\"frac\"><span>1</span><span>t<sub>5</sub></span></span>+<span class=\"frac\"><span>1</span><span>T</span></span>=<span class=\"frac\"><span>1</span><span>t<sub>6</sub></span></span></span>.<br><span class=\"math\"><span class=\"frac\"><span>1</span><span>T</span></span>=<span class=\"frac\"><span>81</span><span>625</span></span>−<span class=\"frac\"><span>243</span><span>3125</span></span>=<span class=\"frac\"><span>162</span><span>3125</span></span></span>, so <span class=\"math\">T=<span class=\"frac\"><span>3125</span><span>162</span></span>=19<span class=\"frac\"><span>47</span><span>162</span></span></span> minutes. <strong>Choice (D).</strong></div>","questionHtml":"If the total time taken to fill the cistern by all the 10 taps together is 1 minute, then how many minutes would the 6th tap take when working alone to fill it?","optionsHtml":["12<span class=\"frac\"><span>42</span><span>75</span></span>","18<span class=\"frac\"><span>22</span><span>45</span></span>","20<span class=\"frac\"><span>85</span><span>15</span></span>","19<span class=\"frac\"><span>47</span><span>162</span></span>"],"questionNumber":1},{"sourceNumber":2,"type":"mcq","context":"Directions for questions 1 and 2: These questions are based on the following data.\n\nThere are ten taps numbered 1 to 10 that can fill a cistern. The rate of the nth tap (n ≥ 2) is 2/3 of the cumulative rate of all taps numbered less than it.","question":"If the total time taken to fill the cistern by all the\n10 taps together is 1 minute, then find the time taken\nby the first 7 taps together to fill it.","options":["417/27 min","514/15 min","331/27 min","325/37 min"],"answer":"A","sourcePage":10,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">The first seven taps together take <span class=\"math\">t<sub>7</sub>=(<span class=\"frac\"><span>3</span><span>5</span></span>)<sup>6</sup>t</span>.<br>Using <span class=\"math\">t=(<span class=\"frac\"><span>5</span><span>3</span></span>)<sup>9</sup></span>, <span class=\"math\">t<sub>7</sub>=(<span class=\"frac\"><span>5</span><span>3</span></span>)<sup>3</sup>=<span class=\"frac\"><span>125</span><span>27</span></span>=4<span class=\"frac\"><span>17</span><span>27</span></span></span> minutes. <strong>Choice (A).</strong></div>","questionHtml":"If the total time taken to fill the cistern by all the 10 taps together is 1 minute, then find the time taken by the first 7 taps together to fill it.","optionsHtml":["4<span class=\"frac\"><span>17</span><span>27</span></span> min","5<span class=\"frac\"><span>14</span><span>15</span></span> min","3<span class=\"frac\"><span>31</span><span>27</span></span> min","3<span class=\"frac\"><span>25</span><span>37</span></span> min"],"questionNumber":2},{"sourceNumber":3,"type":"mcq","context":"Directions for questions 3 and 4: These questions are\nbased on the following data.\n\nAnoop was writing the Reading Comprehension section in\nthe DOG entrance examination. There were four passages\nof exactly the same word length and the four passages had\n5, 8, 8 and 6 questions following them respectively.\nIt is known that Anoop can answer exactly 12 questions in\nthe time he takes to read any one of the four passages. His\nrate of reading and answering questions remains the same\nthroughout the section.","question":"Anoop took 13 minutes more to finish the first three\npassages than the time he took to finish the last\npassage. If Anoop answered all the questions in each\npassage, what approximate percent of the total time\ndid he spend on the first passage?","options":["24.5%","25.4%","22.7%","26.2%"],"answer":"C","sourcePage":10,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">Let the time to answer one question be <em>t</em>. Reading one passage then takes 12t. <div class=\"redrawn-visual\"><table class=\"solution-table\"><thead><tr><th>Passage</th><th>1</th><th>2</th><th>3</th><th>4</th><th>Total</th></tr></thead><tbody><tr><th>Read</th><td>12t</td><td>12t</td><td>12t</td><td>12t</td><td>48t</td></tr><tr><th>Answer</th><td>5t</td><td>8t</td><td>8t</td><td>6t</td><td>27t</td></tr><tr><th>Total</th><td>17t</td><td>20t</td><td>20t</td><td>18t</td><td>75t</td></tr></tbody></table><div class=\"visual-caption\">Redrawn time allocation</div></div><span class=\"math\"><span class=\"frac\"><span>17t</span><span>75t</span></span>×100=<span class=\"frac\"><span>68</span><span>3</span></span>%=22.7%</span> approximately. <strong>Choice (C).</strong></div>","questionHtml":"Anoop took 13 minutes more to finish the first three passages than the time he took to finish the last passage. If Anoop answered all the questions in each passage, what approximate percent of the total time did he spend on the first passage?","optionsHtml":["24.5%","25.4%","22.7%","26.2%"],"questionNumber":3},{"sourceNumber":4,"type":"mcq","context":"Directions for questions 3 and 4: These questions are\nbased on the following data.\n\nAnoop was writing the Reading Comprehension section in\nthe DOG entrance examination. There were four passages\nof exactly the same word length and the four passages had\n5, 8, 8 and 6 questions following them respectively.\nIt is known that Anoop can answer exactly 12 questions in\nthe time he takes to read any one of the four passages. His\nrate of reading and answering questions remains the same\nthroughout the section.","question":"By what approximate percent should Anoop increase\nhis reading speed if he has to cut down his total time\nspent on the section by 20%?","options":["36.36%","54.54%","50.50%","45.45%"],"answer":"D","sourcePage":10,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">Original total time is 75t. A 20% reduction gives 60t. Answering still needs 27t, leaving 33t for reading, or 8.25t per passage.<br>Required reading-speed factor <span class=\"math\">=<span class=\"frac\"><span>12</span><span>8.25</span></span>=<span class=\"frac\"><span>16</span><span>11</span></span></span>. Increase <span class=\"math\">=<span class=\"frac\"><span>5</span><span>11</span></span>×100=45.45%</span>. <strong>Choice (D).</strong></div>","questionHtml":"By what approximate percent should Anoop increase his reading speed if he has to cut down his total time spent on the section by 20%?","optionsHtml":["36.36%","54.54%","50.50%","45.45%"],"questionNumber":4},{"sourceNumber":5,"type":"mcq","context":"Directions for questions 5 and 6: These questions are\nbased on the following data.\n\nA can complete a piece of work in 12 days working at his\nfull efficiency. On the first day he works at his full\nefficiency, on the second day at half of his full efficiency,\non the third day at one-fourth of his full efficiency.","question":"In how many days would the work get completed if A\nworks in the same fashion working at full, half and\nquarter efficiencies respectively on the 1st, 2nd and 3rd\ndays in every further period of 3 days?","options":["18","20","22¾","252/7"],"answer":"B","sourcePage":10,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">Work in each three-day cycle <span class=\"math\">=<span class=\"frac\"><span>1</span><span>12</span></span>+<span class=\"frac\"><span>1</span><span>24</span></span>+<span class=\"frac\"><span>1</span><span>48</span></span>=<span class=\"frac\"><span>7</span><span>48</span></span></span>.<br>In 18 days: <span class=\"math\">6×<span class=\"frac\"><span>7</span><span>48</span></span>=<span class=\"frac\"><span>7</span><span>8</span></span></span>. On day 19 he completes <span class=\"frac\"><span>1</span><span>12</span></span>, leaving <span class=\"math\"><span class=\"frac\"><span>1</span><span>8</span></span>−<span class=\"frac\"><span>1</span><span>12</span></span>=<span class=\"frac\"><span>1</span><span>24</span></span></span>, which is completed at half efficiency on day 20. <strong>Choice (B).</strong></div>","questionHtml":"In how many days would the work get completed if A works in the same fashion working at full, half and quarter efficiencies respectively on the 1st, 2nd and 3rd days in every further period of 3 days?","optionsHtml":["18","20","22<span class=\"frac\"><span>3</span><span>4</span></span>","25<span class=\"frac\"><span>2</span><span>7</span></span>"],"questionNumber":5},{"sourceNumber":6,"type":"tita","context":"Directions for questions 5 and 6: These questions are\nbased on the following data.\n\nA can complete a piece of work in 12 days working at his\nfull efficiency. On the first day he works at his full\nefficiency, on the second day at half of his full efficiency,\non the third day at one-fourth of his full efficiency.","question":"A worked for the first three days as described above,\nand from the fourth day he worked at full efficiency.\nB joined him on the fourth day and together they\ncompleted the job in 11 days from the beginning.\nIf they earned ₹7,200, what is B's share? (in ₹)","options":[],"answer":"1350","sourcePage":11,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">First three days’ work <span class=\"math\">=<span class=\"frac\"><span>7</span><span>48</span></span></span>; remaining work <span class=\"math\">=<span class=\"frac\"><span>41</span><span>48</span></span></span>. From day 4 through day 11 there are 8 days.<br>A’s total contribution <span class=\"math\">=<span class=\"frac\"><span>7</span><span>48</span></span>+8×<span class=\"frac\"><span>1</span><span>12</span></span>=<span class=\"frac\"><span>39</span><span>48</span></span></span>, so B contributes <span class=\"math\">1−<span class=\"frac\"><span>39</span><span>48</span></span>=<span class=\"frac\"><span>9</span><span>48</span></span></span>.<br>B’s share <span class=\"math\">=₹7,200×<span class=\"frac\"><span>9</span><span>48</span></span>=₹1,350</span>.</div>","questionHtml":"A worked for the first three days as described above, and from the fourth day he worked at full efficiency. B joined him on the fourth day and together they completed the job in 11 days from the beginning. If they earned ₹7,200, what is B's share? (in ₹)","optionsHtml":[],"questionNumber":6},{"sourceNumber":7,"type":"tita","context":"Directions for questions 7 and 8: These questions are\nbased on the following data.\n\nA tank in the colony of Panikam is provided with three\npipes A, B, C which can fill the tank in 20, 15, 12 hours\nrespectively. The tank has a capacity of 60,000 litres and\nan outlet pipe D, which supplies water to the 100 houses\nin the colony.","question":"If all the pipes are opened simultaneously, how much\nwater enters the tank every hour? (in litres)","options":[],"answer":"12000","sourcePage":11,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">Hourly inflow = 60,000/20 + 60,000/15 + 60,000/12 = 3,000 + 4,000 + 5,000 = <strong>12,000 litres</strong>.</div>","questionHtml":"If all the pipes are opened simultaneously, how much water enters the tank every hour? (in litres)","optionsHtml":[],"questionNumber":7},{"sourceNumber":8,"type":"tita","context":"Directions for questions 7 and 8: These questions are\nbased on the following data.\n\nA tank in the colony of Panikam is provided with three\npipes A, B, C which can fill the tank in 20, 15, 12 hours\nrespectively. The tank has a capacity of 60,000 litres and\nan outlet pipe D, which supplies water to the 100 houses\nin the colony.","question":"Each of the 100 houses in the colony receive water at\nthe rate of 30 lt/min. The requirement of each house\nis 900 lt per day. If the tank is empty, what is the least\ntime in which all the houses are supplied with their\ndaily requirement? (in min)","options":[],"answer":"450","sourcePage":11,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">The houses need 100 × 900 = 90,000 litres. Inflow is 12,000 L/h = 200 L/min; outlet delivery is 100 × 30 = 3,000 L/min.<br>Fill for 280 minutes, then supply for 20 minutes: stock changes by 56,000 + 4,000 − 60,000 = 0. Fill another 140 minutes and supply for the last 10 minutes: 28,000 + 2,000 − 30,000 = 0.<br>Minimum time = 280 + 20 + 140 + 10 = <strong>450 minutes</strong>.</div>","questionHtml":"Each of the 100 houses in the colony receive water at the rate of 30 lt/min. The requirement of each house is 900 lt per day. If the tank is empty, what is the least time in which all the houses are supplied with their daily requirement? (in min)","optionsHtml":[],"questionNumber":8},{"sourceNumber":9,"type":"mcq","context":"Directions for questions 9 and 10: These questions are\nbased on the following data.\n\nTwo masons were supposed to finish making a certain\ncompound wall around a square playground in a certain\nnumber of days. They cando the job in the given time\nprovided they work together. But the second mason did not\ncome for work till the wall on the first side of the playground\nwas built. The work at that point was lagging behind by 12\ndays. For the next side of the playground, the second mason\nworked alone and by the ti me this part of the wall was\ncompleted, the work was lagging behind by 39 days.","question":"In how many days can the other two sid es of the\nplayground be made by both the masons working\ntogether?","options":["32","28","36","24"],"answer":"C","sourcePage":11,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">Let both together take <em>t</em> days per side. The first and second masons alone take <em>t</em>+12 and <em>t</em>+27 days respectively.<br><span class=\"math\"><span class=\"frac\"><span>1</span><span>t+12</span></span>+<span class=\"frac\"><span>1</span><span>t+27</span></span>=<span class=\"frac\"><span>1</span><span>t</span></span></span> gives <span class=\"math\">t=18</span>. Two remaining sides together need <span class=\"math\">2t=36</span> days. <strong>Choice (C).</strong></div>","questionHtml":"In how many days can the other two sides of the playground be made by both the masons working together?","optionsHtml":["32","28","36","24"],"questionNumber":9},{"sourceNumber":10,"type":"mcq","context":"Directions for questions 9 and 10: These questions are\nbased on the following data.\n\nTwo masons were supposed to finish making a certain\ncompound wall around a square playground in a certain\nnumber of days. They cando the job in the given time\nprovided they work together. But the second mason did not\ncome for work till the wall on the first side of the playground\nwas built. The work at that point was lagging behind by 12\ndays. For the next side of the playground, the second mason\nworked alone and by the ti me this part of the wall was\ncompleted, the work was lagging behind by 39 days.","question":"The two masons finished making the other two walls\nworking together. If they received an amount of\n₹2,00,000 for the entire work, what would be the\nshare of the second mason in this amount?","options":["₹1,20,000","₹80,000","₹1,10,000","₹90,000"],"answer":"D","sourcePage":11,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">Individual times are 30 and 45 days. Total work contributions are proportional to <span class=\"math\"><span class=\"frac\"><span>30+36</span><span>30</span></span>:<span class=\"frac\"><span>45+36</span><span>45</span></span>=<span class=\"frac\"><span>66</span><span>30</span></span>:<span class=\"frac\"><span>81</span><span>45</span></span>=11:9</span>.<br>Second mason’s share <span class=\"math\">=₹2,00,000×<span class=\"frac\"><span>9</span><span>20</span></span>=₹90,000</span>. <strong>Choice (D).</strong></div>","questionHtml":"The two masons finished making the other two walls working together. If they received an amount of ₹2,00,000 for the entire work, what would be the share of the second mason in this amount?","optionsHtml":["₹1,20,000","₹80,000","₹1,10,000","₹90,000"],"questionNumber":10},{"sourceNumber":11,"type":"mcq","context":"Directions for questions 11 to 13: These questions are\nbased on the following data.\n\nA, B and C have to make some electric switchboards.\nWorking alone, A can make 1 switchboard in 12 hours.\nB is 20% faster than him, C is 50% more faster than A\nand D is twice as fast as A.","question":"In how much time can C make 90 switchboards if he\nworks alone?","options":["720 hours","600 hours","320 hours","480 hours"],"answer":"A","sourcePage":11,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">C is 50% faster than A, so C needs 12/1.5 = 8 hours per switchboard. For 90 boards: 90 × 8 = <strong>720 hours</strong>. Choice (A).</div>","questionHtml":"In how much time can C make 90 switchboards if he works alone?","optionsHtml":["720 hours","600 hours","320 hours","480 hours"],"questionNumber":11},{"sourceNumber":12,"type":"mcq","context":"Directions for questions 11 to 13: These questions are\nbased on the following data.\n\nA, B and C have to make some electric switchboards.\nWorking alone, A can make 1 switchboard in 12 hours.\nB is 20% faster than him, C is 50% more faster than A\nand D is twice as fast as A.","question":"For making one switchboard, A, B, C and D worked\nfor 1 hour and A and B for the next 2 hours. In how\nmuch more time can A alone complete the remaining\nwork?","options":["0.8 hours","1.2 hours","1.5 hours","1.9 hours"],"answer":"D","sourcePage":11,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">Work in the first hour <span class=\"math\">=<span class=\"frac\"><span>1</span><span>12</span></span>+<span class=\"frac\"><span>1</span><span>10</span></span>+<span class=\"frac\"><span>1</span><span>8</span></span>+<span class=\"frac\"><span>1</span><span>6</span></span>=<span class=\"frac\"><span>19</span><span>40</span></span></span>.<br>Work in the next two hours <span class=\"math\">=2(<span class=\"frac\"><span>1</span><span>12</span></span>+<span class=\"frac\"><span>1</span><span>10</span></span>)=<span class=\"frac\"><span>11</span><span>30</span></span></span>.<br>Remaining <span class=\"math\">=1−<span class=\"frac\"><span>19</span><span>40</span></span>−<span class=\"frac\"><span>11</span><span>30</span></span>=<span class=\"frac\"><span>19</span><span>120</span></span></span>. A needs <span class=\"math\">12×<span class=\"frac\"><span>19</span><span>120</span></span>=1.9</span> hours. <strong>Choice (D).</strong></div>","questionHtml":"For making one switchboard, A, B, C and D worked for 1 hour and A and B for the next 2 hours. In how much more time can A alone complete the remaining work?","optionsHtml":["0.8 hours","1.2 hours","1.5 hours","1.9 hours"],"questionNumber":12},{"sourceNumber":13,"type":"mcq","context":"Directions for questions 11 to 13: These questions are\nbased on the following data.\n\nA, B and C have to make some electric switchboards.\nWorking alone, A can make 1 switchboard in 12 hours.\nB is 20% faster than him, C is 50% more faster than A\nand D is twice as fast as A.","question":"A works on the first day, B on the second, C on the\nthird and D on the fourth and then this same cycle is\nrepeated till the completion of the work. If ea ch\nperson works for 12 hours a day, in how many days\nare 114 switchboards ready?","options":["40 days","60 days","80 days","70 days"],"answer":"C","sourcePage":11,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">Boards made in one assigned 12-hour day: A = 1, B = 1.2, C = 1.5, D = 2. A four-day cycle produces 5.7 boards. Since 114/5.7 = 20 cycles, time = 20 × 4 = <strong>80 days</strong>. Choice (C).</div>","questionHtml":"A works on the first day, B on the second, C on the third and D on the fourth and then this same cycle is repeated till the completion of the work. If ea ch person works for 12 hours a day, in how many days are 114 switchboards ready?","optionsHtml":["40 days","60 days","80 days","70 days"],"questionNumber":13},{"sourceNumber":14,"type":"mcq","context":"Directions for questions 14 and 15: These questions are based on the following data.\n\nA person can dig a well at 10 m per day. Overnight, mud fills 1/5 of the total depth reached by the end of that day.","question":"When can he finish digging a well 30 m deep?\n(Assume that when he reaches a depth of 30 m, the\nwalls of the well are cemented so that it doesn't fill up\nwith mud again)","options":["In exactly 4 days","On the 5th day","In exactly 5 days","On the 6th day"],"answer":"B","sourcePage":11,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">After each night, 80% of the depth remains. <div class=\"redrawn-visual\"><table class=\"solution-table\"><thead><tr><th>Day</th><th>Depth after digging</th><th>Depth next morning</th></tr></thead><tbody><tr><td>1</td><td>10</td><td>8</td></tr><tr><td>2</td><td>18</td><td>14.4</td></tr><tr><td>3</td><td>24.4</td><td>19.52</td></tr><tr><td>4</td><td>29.52</td><td>23.616</td></tr></tbody></table><div class=\"visual-caption\">Redrawn daily-depth table (metres)</div></div>On day 5 he digs from 23.616 m past 30 m, where the well is cemented. Therefore he finishes <strong>on the 5th day</strong>. Choice (B).</div>","questionHtml":"When can he finish digging a well 30 m deep? (Assume that when he reaches a depth of 30 m, the walls of the well are cemented so that it doesn't fill up with mud again)","optionsHtml":["In exactly 4 days","On the 5th day","In exactly 5 days","On the 6th day"],"questionNumber":14},{"sourceNumber":15,"type":"mcq","context":"Directions for questions 14 and 15: These questions are based on the following data.\n\nA person can dig a well at 10 m per day. Overnight, mud fills 1/5 of the total depth reached by the end of that day.","question":"What was the depth of the well at the beginning of the\nfourth day?","options":["14.4 m","19.52 m","23.616 m","24.72 m"],"answer":"B","sourcePage":11,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">At the end of day 3, and hence at the beginning of day 4, the depth is <span class=\"math\">(14.4+10)×<span class=\"frac\"><span>4</span><span>5</span></span>=19.52</span> m. <strong>Choice (B).</strong></div>","questionHtml":"What was the depth of the well at the beginning of the fourth day?","optionsHtml":["14.4 m","19.52 m","23.616 m","24.72 m"],"questionNumber":15},{"sourceNumber":16,"type":"tita","context":"","question":"In a factory, there are three shifts of work on a day,\neach comprising eight hours. During the three shifts,\nthe average work efficiencies of workers are 80%,\n70% and 50% respectively. A work is completed in\n60 days by the group working in the first shift. If the\nwork is done in all the shifts, then how many days less\nare required to complete the work?","options":[],"answer":"36","sourcePage":11,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">At 80% efficiency, the first shift completes <span class=\"frac\"><span>1</span><span>60</span></span> per day, so a 100%-efficient shift completes <span class=\"math\"><span class=\"frac\"><span>100</span><span>80</span></span>×<span class=\"frac\"><span>1</span><span>60</span></span>=<span class=\"frac\"><span>1</span><span>48</span></span></span>.<br>All-shift daily work <span class=\"math\">=<span class=\"frac\"><span>1</span><span>60</span></span>+<span class=\"frac\"><span>70</span><span>100</span></span>×<span class=\"frac\"><span>1</span><span>48</span></span>+<span class=\"frac\"><span>50</span><span>100</span></span>×<span class=\"frac\"><span>1</span><span>48</span></span>=<span class=\"frac\"><span>1</span><span>24</span></span></span>.<br>The work takes 24 days, which is <strong>36 days fewer</strong>.</div>","questionHtml":"In a factory, there are three shifts of work on a day, each comprising eight hours. During the three shifts, the average work efficiencies of workers are 80%, 70% and 50% respectively. A work is completed in 60 days by the group working in the first shift. If the work is done in all the shifts, then how many days less are required to complete the work?","optionsHtml":[],"questionNumber":16},{"sourceNumber":17,"type":"mcq","context":"","question":"In the above question there are 200 men and\n300 women workers, in each shift. On a particular day\nwomen do not work in the first shift and 50% of the\nwomen do not work in the second shift. If the ratio of\nthe rate of work of a man to that of a woman is 2 : 1,\nin which of the following shifts is the maximum\namount of work done?","options":["First shift","Second shift","Third shift","The second shift as well as the third shift."],"answer":"B","sourcePage":11,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">Measure output in woman-equivalent units. First shift: (200 × 2) × 80% = 320. Second: (200 × 2 + 150) × 70% = 385. Third: (200 × 2 + 300) × 50% = 350. The second shift is highest. <strong>Choice (B).</strong></div>","questionHtml":"In the above question there are 200 men and 300 women workers, in each shift. On a particular day women do not work in the first shift and 50% of the women do not work in the second shift. If the ratio of the rate of work of a man to that of a woman is 2: 1, in which of the following shifts is the maximum amount of work done?","optionsHtml":["First shift","Second shift","Third shift","The second shift as well as the third shift."],"questionNumber":17},{"sourceNumber":18,"type":"mcq","context":"","question":"Three persons P, Q and R can complete a work in\n15, 20 and 30 days respectively. Only two of these\nthree work on any given day. But, the same two\npersons do not work for any two consecutive days.\nWhat is the least number of days in which the work\ncan be completed?","options":["55/6","91/6","86/7","48/13"],"answer":"B","sourcePage":11,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">Use P every day and alternate Q and R. In two days the work is <span class=\"math\"><span class=\"frac\"><span>2</span><span>15</span></span>+<span class=\"frac\"><span>1</span><span>20</span></span>+<span class=\"frac\"><span>1</span><span>30</span></span>=<span class=\"frac\"><span>13</span><span>60</span></span></span>.<br>After 8 days, <span class=\"frac\"><span>52</span><span>60</span></span> is done. On day 9, P+Q complete <span class=\"frac\"><span>7</span><span>60</span></span>, leaving <span class=\"frac\"><span>1</span><span>60</span></span>. P+R work at <span class=\"frac\"><span>1</span><span>10</span></span> per day, so the final part takes <span class=\"frac\"><span>1</span><span>6</span></span> day.<br>Total = <strong>9<span class=\"frac\"><span>1</span><span>6</span></span> days</strong>. Choice (B).</div>","questionHtml":"Three persons P, Q and R can complete a work in 15, 20 and 30 days respectively. Only two of these three work on any given day. But, the same two persons do not work for any two consecutive days. What is the least number of days in which the work can be completed?","optionsHtml":["5<span class=\"frac\"><span>5</span><span>6</span></span>","9<span class=\"frac\"><span>1</span><span>6</span></span>","8<span class=\"frac\"><span>6</span><span>7</span></span>","4<span class=\"frac\"><span>8</span><span>13</span></span>"],"questionNumber":18},{"sourceNumber":19,"type":"tita","context":"","question":"A and B each individually started to make identical\nclay models. A took 12 days more than B to complete\nhis work. If both of them had worked together, they\nwould have taken 16 days to make both the models.\nIn how many days does A complete his model?","options":[],"answer":"24","sourcePage":11,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">Let B take <em>x</em> days, so A takes <em>x</em>+12. Together, one model takes 8 days because two models take 16 days.<br><span class=\"math\"><span class=\"frac\"><span>1</span><span>x</span></span>+<span class=\"frac\"><span>1</span><span>x+12</span></span>=<span class=\"frac\"><span>1</span><span>8</span></span></span> gives <span class=\"math\">x²−4x−96=0</span>, hence <span class=\"math\">x=12</span>. A takes <strong>24 days</strong>.</div>","questionHtml":"A and B each individually started to make identical clay models. A took 12 days more than B to complete his work. If both of them had worked together, they would have taken 16 days to make both the models. In how many days does A complete his model?","optionsHtml":[],"questionNumber":19},{"sourceNumber":20,"type":"mcq","context":"","question":"A, B and C together can complete a work in a certain\nnumber of days. After nine days, some work is\nremaining. This work can be completed by A, B and\nC in half -a-day, three-fourths of a day, and one day\nrespectively. In how many days can A, B and C\ntogether complete the work?","options":["10¼","93/13","111/7","Cannot be determined"],"answer":"B","sourcePage":12,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">Let all three together take <em>x</em> days and let the final remaining work be <span class=\"frac\"><span>1</span><span>y</span></span>. Then <span class=\"math\"><span class=\"frac\"><span>9</span><span>x</span></span>+<span class=\"frac\"><span>1</span><span>y</span></span>=1</span>.<br>From the individual completion times, their full-job times are <span class=\"frac\"><span>y</span><span>2</span></span>, <span class=\"frac\"><span>3y</span><span>4</span></span> and <em>y</em>; hence <span class=\"math\"><span class=\"frac\"><span>2</span><span>y</span></span>+<span class=\"frac\"><span>4</span><span>3y</span></span>+<span class=\"frac\"><span>1</span><span>y</span></span>=<span class=\"frac\"><span>1</span><span>x</span></span></span>, so <span class=\"math\">y=<span class=\"frac\"><span>13x</span><span>3</span></span></span>.<br><span class=\"math\"><span class=\"frac\"><span>9</span><span>x</span></span>+<span class=\"frac\"><span>3</span><span>13x</span></span>=1</span> gives <span class=\"math\">x=<span class=\"frac\"><span>120</span><span>13</span></span>=9<span class=\"frac\"><span>3</span><span>13</span></span></span> days. <strong>Choice (B).</strong></div>","questionHtml":"A, B and C together can complete a work in a certain number of days. After nine days, some work is remaining. This work can be completed by A, B and C in half -a-day, three-fourths of a day, and one day respectively. In how many days can A, B and C together complete the work?","optionsHtml":["10<span class=\"frac\"><span>1</span><span>4</span></span>","9<span class=\"frac\"><span>3</span><span>13</span></span>","11<span class=\"frac\"><span>1</span><span>7</span></span>","Cannot be determined"],"questionNumber":20},{"sourceNumber":21,"type":"mcq","context":"Directions for questions 21 and 22: These questions\nare based on the following data.\n\nA and B can independently dig a well in 10 and 5 days\nrespectively. But, on a particularly difficult terrain, the work\nis such that due to fatigue every subsequent day the\nefficiency of a worker falls by 10%.","question":"If A is given a task of digging one such well on the\ndifficult terrain, when will he finish the work?","options":["On the 12th day.","On the 15th day.","On the 11th day.","He will never finish the work."],"answer":"D","sourcePage":12,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">After <em>n</em> days, A completes <span class=\"math\"><span class=\"frac\"><span>1</span><span>10</span></span>[1+0.9+⋯+(0.9)<sup>n−1</sup>]=1−(0.9)<sup>n</sup></span>.<br>This is less than 1 for every finite <em>n</em>; it only approaches 1. Therefore A <strong>never finishes</strong>. Choice (D).</div>","questionHtml":"If A is given a task of digging one such well on the difficult terrain, when will he finish the work?","optionsHtml":["On the 12th day.","On the 15th day.","On the 11th day.","He will never finish the work."],"questionNumber":21},{"sourceNumber":22,"type":"mcq","context":"Directions for questions 21 and 22: These questions\nare based on the following data.\n\nA and B can independently dig a well in 10 and 5 days\nrespectively. But, on a particularly difficult terrain, the work\nis such that due to fatigue every subsequent day the\nefficiency of a worker falls by 10%.","question":"If B is given the task of digging one such well on the\ndifficult terrain, when will he finish the work?","options":["On the 9th day.","On the 7th day.","On the 8th day.","He will never finish the work"],"answer":"B","sourcePage":12,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">After <em>n</em> days, B completes <span class=\"math\"><span class=\"frac\"><span>1</span><span>5</span></span>×<span class=\"frac\"><span>1−(0.9)<sup>n</sup></span><span>1−0.9</span></span>=2[1−(0.9)<sup>n</sup>]</span>.<br>Completion requires <span class=\"math\">(0.9)<sup>n</sup>≤0.5</span>. Since <span class=\"math\">0.9<sup>6</sup>=0.531</span> and <span class=\"math\">0.9<sup>7</sup>=0.478</span>, he finishes <strong>on day 7</strong>. Choice (B).</div>","questionHtml":"If B is given the task of digging one such well on the difficult terrain, when will he finish the work?","optionsHtml":["On the 9th day.","On the 7th day.","On the 8th day.","He will never finish the work"],"questionNumber":22},{"sourceNumber":23,"type":"tita","context":"Directions for questions 23 and 24: These questions are based on the following data.\n\nThree men are hired to dig four identical moats. They dig the first moat together and then split up to dig the other three individually. The second moat takes 4 1/6 times the first-moat time. The third takes 10 days more than 5/2 times the first-moat time, and the fourth takes exactly 5/2 times that time.","question":"Find the total time taken for the digging of all the four\nmoats to be completed. (in days)","options":[],"answer":"186","sourcePage":12,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">Let the first moat take <em>x</em> days. The three individual times are <span class=\"frac\"><span>25x</span><span>6</span></span>, <span class=\"frac\"><span>5x</span><span>2</span></span>+10 and <span class=\"frac\"><span>5x</span><span>2</span></span>. Since their rates add to the joint rate:<br><span class=\"math\"><span class=\"frac\"><span>6</span><span>25x</span></span>+<span class=\"frac\"><span>2</span><span>5x+20</span></span>+<span class=\"frac\"><span>2</span><span>5x</span></span>=<span class=\"frac\"><span>1</span><span>x</span></span></span>, giving <span class=\"math\">x=36</span>.<br>The individual moats take 150, 100 and 90 days. <div class=\"redrawn-visual\"><svg viewBox=\"0 0 700 125\" role=\"img\" aria-label=\"Moat work schedule\"><line x1=\"35\" y1=\"48\" x2=\"665\" y2=\"48\" stroke=\"#94a3b8\" stroke-width=\"5\"/><rect x=\"35\" y=\"30\" width=\"122\" height=\"36\" rx=\"8\" fill=\"#dbeafe\"/><text x=\"96\" y=\"53\" text-anchor=\"middle\">Together: 36 d</text><rect x=\"157\" y=\"13\" width=\"508\" height=\"22\" rx=\"6\" fill=\"#fee2e2\"/><text x=\"411\" y=\"29\" text-anchor=\"middle\">Man 1: 150 d</text><rect x=\"157\" y=\"48\" width=\"339\" height=\"22\" rx=\"6\" fill=\"#dcfce7\"/><text x=\"326\" y=\"64\" text-anchor=\"middle\">Man 2: 100 d</text><rect x=\"157\" y=\"83\" width=\"305\" height=\"22\" rx=\"6\" fill=\"#fef3c7\"/><text x=\"309\" y=\"99\" text-anchor=\"middle\">Man 3: 90 d</text></svg><div class=\"visual-caption\">Redrawn parallel-work schedule</div></div>Elapsed time = 36 + max(150,100,90) = <strong>186 days</strong>.</div>","questionHtml":"Find the total time taken for the digging of all the four moats to be completed. (in days)","optionsHtml":[],"questionNumber":23},{"sourceNumber":24,"type":"tita","context":"Directions for questions 23 and 24: These questions are based on the following data.\n\nThree men are hired to dig four identical moats. They dig the first moat together and then split up to dig the other three individually. The second moat takes 4 1/6 times the first-moat time. The third takes 10 days more than 5/2 times the first-moat time, and the fourth takes exactly 5/2 times that time.","question":"If the three men receive ₹10,000 for the four moats,\nwhat would the difference between the smallest and\nthe largest shares be? (in ₹)","options":[],"answer":"400","sourcePage":12,"visual":"","questionVisual":"","imageOnly":false,"solution":"<div class=\"math-solution standardized-solution\">Total contributions are proportional to <span class=\"math\"><span class=\"frac\"><span>36+150</span><span>150</span></span>:<span class=\"frac\"><span>36+100</span><span>100</span></span>:<span class=\"frac\"><span>36+90</span><span>90</span></span>=<span class=\"frac\"><span>31</span><span>25</span></span>:<span class=\"frac\"><span>34</span><span>25</span></span>:<span class=\"frac\"><span>35</span><span>25</span></span>=31:34:35</span>.<br>The ₹10,000 shares are ₹3,100, ₹3,400 and ₹3,500. Difference = <strong>₹400</strong>.</div>","questionHtml":"If the three men receive ₹10,000 for the four moats, what would the difference between the smallest and the largest shares be? (in ₹)","optionsHtml":[],"questionNumber":24}]}</script><script>

function formatStimulus(v){const marker=/^((?:\d+\.|\(\d+\)|\([a-z]\)|[ivx]+\.|•)\s*)(.*)$/i;return String(v??'').split(/\n{2,}/).map(x=>x.trim()).filter(Boolean).map(block=>{const lines=block.split('\n').map(x=>x.trim()).filter(Boolean);if(/^Directions\s+for\s+/i.test(lines[0]))return `<p class="direction">${mathText(lines.join(' '))}</p>`;const prose=[],items=[];let item=null;lines.forEach(line=>{const m=line.match(marker);if(m){if(item)items.push(item);item={marker:m[1].trim(),body:m[2]}}else if(item)item.body+=' '+line;else prose.push(line)});if(item)items.push(item);let out=prose.length?`<p>${mathText(prose.join(' '))}</p>`:'';if(items.length)out+=`<div class="info-list">${items.map(x=>`<div class="info-item"><span class="info-marker">${esc(x.marker)}</span><span class="info-body">${mathText(x.body)}</span></div>`).join('')}</div>`;return out||`<p>${mathText(lines.join(' '))}</p>`}).join('')}
function renderBar(){bar.innerHTML=data.questions.map((q,i)=>`<button type="button" class="qbtn ${answers[i]!==null&&answers[i]!==''?'answered ':''}${marked[i]?'marked ':''}${i===current?'current ':''}" onclick="go(${i})">${i+1}</button>`).join('')}
function response(q){if(q.type==='mcq')return `<div class="options ${q.imageOnly?'image-choice':''}">${q.options.map((op,i)=>`<label class="option"><input type="radio" name="answer" value="${labels[i]}" ${answers[current]===labels[i]?'checked':''} ${submitted?'disabled':''}><span>(${labels[i]})${q.imageOnly?'':' '+(q.optionsHtml&&q.optionsHtml[i]?q.optionsHtml[i]:mathText(op))}</span></label>`).join('')}</div>`;return `<div class="tita"><label for="titaInput">Type your answer:</label><input id="titaInput" aria-label="Type your answer" placeholder="Type your answer" inputmode="decimal" value="${esc(answers[current]??'')}" ${submitted?'disabled':''}><div class="tita-note">TITA: type the numerical/value answer. No negative marking.</div></div>`}
function contextLocalNumbers(ctx){const ids=[];data.questions.forEach((x,i)=>{if(String(x.context||'')===String(ctx||''))ids.push(i+1)});return ids}
function localRangeLabel(ids,prefix){if(!ids.length)return prefix==='common'?'Common Information':'';if(ids.length===1)return prefix==='common'?`Common Information – Question ${ids[0]}`:`question ${ids[0]}`;const contiguous=ids.every((v,i)=>i===0||v===ids[i-1]+1);if(contiguous&&ids.length===2)return prefix==='common'?`Common Information – Questions ${ids[0]}–${ids[1]}`:`questions ${ids[0]} and ${ids[1]}`;if(contiguous)return prefix==='common'?`Common Information – Questions ${ids[0]}–${ids[ids.length-1]}`:`questions ${ids[0]} to ${ids[ids.length-1]}`;return prefix==='common'?`Common Information – Questions ${ids.join(', ')}`:`questions ${ids.join(', ')}`}
function localizeContext(ctx){const ids=contextLocalNumbers(ctx);if(!ids.length)return String(ctx||'');const lines=String(ctx||'').split('\n');const first=lines[0]||'';const m=first.match(/^Directions\s+for\s+questions?\s+[^:]+:(.*)$/i);if(m)lines[0]=`Directions for ${localRangeLabel(ids,'directions')}:${m[1]}`;return lines.join('\n')}
function localizedSolution(q){let s=String(q.solution||'');s=s.replace(/Solutions?\s+for\s+questions?[^<:]*(?::|<\/text>)/gi,'');s=s.replace(/Choice\s*\([A-D]\)/gi,'');s=s.replace(/Ans(?:wer)?\s*[:=][^<]*/gi,'');return s}
function render(){const q=data.questions[current],has=!!q.context,information=has?`<section class="qa-context"><div class="common-qno">${localRangeLabel(contextLocalNumbers(q.context),'common')}</div><div class="stimulus-copy">${formatStimulus(localizeContext(q.context))}</div>${q.visual||''}</section>`:`<p class="qa-direction">Answer the question independently.</p>`;host.innerHTML=`<div class="test-content"><section class="response-pane"><div class="qhead"><div class="qnum">Question ${current+1} of ${total}</div></div>${information}${q.questionVisual||''}<h2 class="question-title">${q.questionHtml||mathText(q.question)}</h2>${response(q)}<div id="answerNote" class="answer-note"></div><section class="solution direct-solution"><div class="solution-heading">Solution</div>${localizedSolution(q)}</section></section></div><div class="navrow"><button type="button" onclick="markNext()">Mark for Review & Next</button><button type="button" onclick="clearResponse()" ${submitted?'disabled':''}>Clear Response</button><button type="button" class="previous" onclick="previous()" ${current===0?'disabled':''}>Previous</button><button type="button" class="save" onclick="next()">Save & Next</button></div>`;bind();if(submitted)review();renderBar()}
function bind(){host.querySelectorAll('input[name="answer"]').forEach(el=>el.onchange=()=>{answers[current]=el.value;renderBar()});const t=document.getElementById('titaInput');if(t)t.oninput=()=>{answers[current]=t.value.trim();renderBar()}}
function save(){const t=document.getElementById('titaInput');if(t&&!submitted)answers[current]=t.value.trim();const r=host.querySelector('input[name="answer"]:checked');if(r&&!submitted)answers[current]=r.value}function go(i){save();current=i;render()}function next(){if(current<total-1)go(current+1)}function previous(){if(current>0)go(current-1)}function markNext(){save();marked[current]=true;if(current<total-1)go(current+1);else render()}function clearResponse(){answers[current]=null;render()}
function correct(q,a){if(a===null||a==='')return null;if(q.type==='mcq')return a===q.answer;const n=v=>String(v).trim().replace(/,/g,'');return n(a)===n(q.answer)}function review(){const q=data.questions[current],s=correct(q,answers[current]),n=document.getElementById('answerNote');n.className='answer-note '+(s===null?'muted':s?'ok':'bad');n.textContent=s===null?'Unattempted. Correct answer: '+q.answer:s?'Correct.':'Wrong. Correct answer: '+q.answer}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm('Submit this sectional test now?'))return;submitted=true;clearInterval(timerId);document.body.classList.add('submitted');let c=0,w=0,u=0,score=0;data.questions.forEach((q,i)=>{const s=correct(q,answers[i]);if(s===null)u++;else if(s){c++;score+=3}else{w++;if(q.type==='mcq')score--}});result.style.display='block';result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score">Score<strong>${score}</strong></div><div class="score">Correct<strong>${c}</strong></div><div class="score">Wrong<strong>${w}</strong></div><div class="score">Attempted<strong>${c+w}</strong></div><div class="score">Unattempted<strong>${u}</strong></div></div>`;render()}
function tick(){const m=Math.floor(seconds/60),s=seconds%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(seconds<=0){submitTest(true);return}seconds--}const calc=document.getElementById('calc'),display=document.getElementById('calcDisplay'),calcResult=document.getElementById('calcResult');let memory=0;const evaluate=v=>{if(!/^[0-9+\-*/().\s]+$/.test(v))throw Error();return Function('return ('+(v||'0')+')')()};const showResult=v=>{calcResult.textContent=Number.isFinite(Number(v))?String(v):'Error'};document.getElementById('calcToggle').onclick=()=>calc.classList.toggle('open');document.getElementById('calcClose').onclick=()=>calc.classList.remove('open');document.getElementById('calcMin').onclick=()=>calc.classList.remove('open');document.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>{const v=b.dataset.calc;try{if(v==='C'){display.value='';showResult(0)}else if(v==='B')display.value=display.value.slice(0,-1);else if(v==='='){const n=evaluate(display.value);display.value=String(n);showResult(n)}else if(v==='S'){const n=-evaluate(display.value);display.value=String(n);showResult(n)}else if(v==='Q'){const n=Math.sqrt(evaluate(display.value));display.value=String(n);showResult(n)}else if(v==='P'){const n=evaluate(display.value)/100;display.value=String(n);showResult(n)}else if(v==='I'){const n=1/evaluate(display.value);display.value=String(n);showResult(n)}else if(v==='MC')memory=0;else if(v==='MR')display.value+=String(memory);else if(v==='MS')memory=evaluate(display.value);else if(v==='M+')memory+=evaluate(display.value);else if(v==='M-')memory-=evaluate(display.value);else display.value+=v}catch{showResult('Error')}});let dragging=false,dx=0,dy=0,pointerId=null;const dragBar=document.querySelector('.calc-title');dragBar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;dragging=true;pointerId=e.pointerId;const r=calc.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;calc.classList.add('dragging');dragBar.setPointerCapture(pointerId)});dragBar.addEventListener('pointermove',e=>{if(!dragging)return;const maxX=Math.max(0,window.innerWidth-calc.offsetWidth),maxY=Math.max(84,window.innerHeight-calc.offsetHeight);calc.style.left=Math.min(maxX,Math.max(0,e.clientX-dx))+'px';calc.style.top=Math.min(maxY,Math.max(84,e.clientY-dy))+'px';calc.style.right='auto'});const stopDrag=()=>{dragging=false;calc.classList.remove('dragging');if(pointerId!==null&&dragBar.hasPointerCapture(pointerId))dragBar.releasePointerCapture(pointerId);pointerId=null};dragBar.addEventListener('pointerup',stopDrag);dragBar.addEventListener('pointercancel',stopDrag);window.addEventListener('resize',()=>{const r=calc.getBoundingClientRect();if(r.right>window.innerWidth)calc.style.left=Math.max(0,window.innerWidth-r.width)+'px';if(r.bottom>window.innerHeight)calc.style.top=Math.max(84,window.innerHeight-r.height)+'px'});window.go=go;window.previous=previous;window.markNext=markNext;window.clearResponse=clearResponse;window.submitTest=submitTest;render();tick();timerId=setInterval(tick,1000);
