section> <\/div> "}, {"number": 19, "type": "tita", "question": "<b>The sum of 3rd and 28th term of an Arithmetic Progression is same as that of 7th, 11th and 18th term of the Arithmetic Progression. If the sum of the first N terms of this Arithmetic Progression is zero, then find the value of N.<\/b>", "options": [], "answer": "9", "solution": "<div><section class=\"authored-solution auto-authored\" data-source-visual=\"true\"><div class=\"solution-steps\"><div class=\"step\"><span class=\"step-no\">1<\/span><div><strong>Set up<\/strong><div class=\"equation authored-working\"><div>Let ‘@' and ‘d' be the first term and the common<\/div><div>difference of the given A.P.<\/div><div>Thent, +i, =t +t +t<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">2<\/span><div><strong>Apply the relation<\/strong><div class=\"equation authored-working\"><div>—a+2d*a+27d= a+6d+a+10d+a+17d<\/div><div>=a+4d=%=0<\/div><div>This implies that the first 4 terms of this AP will be<\/div><\/div><\/div><\/div><div class=\"step\"><span class=\"step-no\">3<\/span><div><strong>Simplify<\/strong><div class=\"equation authored-working\"><div>equal but of opposite signs of the next 4 terms after<\/div><div>the 5th term. Hence, first nine terms sum will he 0.<\/div><\/div><\/div><\/div><div class=\"final-answer\"><span>Final answer<\/span><strong>9<\/strong><small>Therefore, the required answer is shown above.<\/small><\/div><\/div><\/section> <\/div> "}, {"number": 20, "type": "mcq", "question": "<b>Find the remainder when F(a) = a<sup>15<\/sup> + a<sup>14<\/sup> + a<sup>13<\/sup> +.....+ a<sup>2<\/sup> + a is divided by (a<sup>2<\/sup> – 1).<\/b>", "options": ["<b>7a + 8<\/b>", "<b>8a + 7<\/b>", "<b>9a + 6<\/b>", "<b>5a + 8<\/b>"], "answer": "B", "solution": "<div><section class=\"authored-solution auto-authored\" data-source-visual=\"true\"><div class=\"solution-steps\"><div class=\"step\"><span class=\"step-no\">1<\/span><div><strong>Set up<\/strong><div class=\"equation a mentById('cd');document.getElementById('calcbtn').onclick=()=>calc.classList.toggle('open');document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{let v=b.dataset.k;if(v==='C')cd.value='';else if(v==='='){try{if(!/^[0-9+*/(). -]+$/.test(cd.value))throw 0;cd.value=Function('return ('+cd.value+')')()}catch{cd.value='Error'}}else cd.value+=v});window.go=go;window.markNext=markNext;window.clearA=clearA;window.submitTest=submitTest;draw();tick();const clock=setInterval(tick,1000);requestAnimationFrame(()=>document.documentElement.classList.remove('booting'));const calcResult=document.getElementById('calcResult');let calcMemory=0;const calcEval=()=>{if(!/^[0-9+\-*/().\s]+$/.test(cd.value))throw Error();return Function('return ('+(cd.value||'0')+')')()};const calcShow=v=>calcResult.textContent=Number.isFinite(Number(v))?String(v):'Error';document.getElementById('calcClose').onclick=()=>calc.classList.remove('open');document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{try{const op=b.dataset.op,n=()=>Number(calcEval());if(op==='back')cd.value=cd.value.slice(0,-1);else if(op==='sqrt'){cd.value=String(Math.sqrt(n()));calcShow(cd.value)}else if(op==='percent'){cd.value=String(n()/100);calcShow(cd.value)}else if(op==='recip'){cd.value=String(1/n());calcShow(cd.value)}else if(op==='sign'){cd.value=String(-n());calcShow(cd.value)}else if(op==='mc')calcMemory=0;else if(op==='mr')cd.value+=String(calcMemory);else if(op==='ms')calcMemory=n();else if(op==='mplus')calcMemory+=n();else if(op==='mminus')calcMemory-=n()}catch{calcShow('Error')}});document.querySelector('[data-k="="]').addEventListener('click',()=>calcShow(cd.value));const calcBar=document.getElementById('calcBar');let drag=false,dragX=0,dragY=0;calcBar.onpointerdown=e=>{if(e.target.closest('button'))return;drag=true;dragX=e.clientX-calc.offsetLeft;dragY=e.clientY-calc.offsetTop;calc.classList.add('dragging');calcBar.setPointerCapture(e.pointerId)};calcBar.onpointermove=e=>{if(!drag)return;calc.style.left=Math.max(0,Math.min(innerWidth-calc.offsetWidth,e.clientX-dragX))+'px';calc.style.top=Math.max(84,Math.min(innerHeight-calc.offsetHeight,e.clientY-dragY))+'px';calc.style.right='auto'};calcBar.onpointerup=e=>{drag=false;calc.classList.remove('dragging');calcBar.releasePointerCapture(e.pointerId)};</script></body></html>
