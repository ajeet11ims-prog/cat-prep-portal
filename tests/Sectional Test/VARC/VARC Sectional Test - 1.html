<script type="application/json" id="test-data">{"testNumber": 1, "simcat": 1, "minutes": 40, "questions": [{"number": 1, "sourceId": "16817108635680", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>Published in 2000 “Bowling Alone”, the landmark study by Robert Putnam, a political scientist at Harvard, offered a sweeping survey of what ailed American society by detailing a steady erosion in the amount of social interaction among people who are not family, close <\/span><span>friends<\/span><span> or work colleagues—a concept called “social capital”. The withdrawal of Americans from bowling leagues, religious life and volunteering was a symptom of anomie, Mr Putnam argued… Social scientists have argued about the supposed importance of social capital in the intervening decades. A comprehensive set of studies by a team of economists, just published in <\/span><span>Nature<\/span><span>,<\/span> <span>strikes a blow in favour of those who have championed the importance of social capital…<\/span>\r<br>\r<br><span>Fittingly for the new age of social science, the data come from Faceboo<\/span>k. <span>The large research team worked with the social-media giant’s proprietary data on 72.2m young American adults and the 21bn friendships they had formed on the site. The shape of every person’s network of friends could be converted into a few simple, empirical scores of social <\/span><span>capital<\/span><span>. Data on the hometowns, workplaces and educational histories of Facebook users allowed the researchers to estimate how social capital varied between places in a much finer-grained way than previously possible. And, most important, they were able to correlate these neighbourhood-level measures of social capital with important outcomes like graduating successfully from high school and having <\/span><span>upward social mobility<\/span><span>.<\/span>\r<br>\r<br><span>One measure seemed especially important. What the researchers called “economic connectedness”—the extent of friendships across social classes—was strongly associated with increased rates of high-school completion, reduced rates of teenage pregnancy and increased income for those born poorer. Moving from a place where friendships across social strata are relatively uncommon (a one-in-four chance of a friendship between someone in the bottom half of the class distribution and someone in the top) to one where it was relatively standard (a one-in-two chance) translated into an 8.2% increase in future earnings, the researchers found.<\/span>\r<br>\r<br><span>This corroborates findings in other recent large-scale examinations: places in America that are more segregated by race or income seem to give poor kids less of a chance… The most important institutions for encouraging these friendships seem to be colleges and universities… Past research has also found long-term benefits for poor kids who attend integrated schools or who do not live in neighbourhoods where poverty is extremely concentrated. Divine intervention helps, too. The researchers also found that intra-class friendships were most easily struck up in religious settings.<\/span>\r<br>\r<br><span>Other classical definitions of social capital such as the extent of civic engagement and the cohesiveness of bonds within social classes did not appear to be correlated with improved life outcomes<\/span>. <span>Verifying [the theory of social capital] has always been difficult. And even though this study is studded with quantitative measures derived from big data, its findings remain largely based on associations and correlations. It is hard to think of a way to experimentally vary a person’s degree of social capital—even leaving aside the ethical problems with doing it. Whatever uncertainty remains, the imperative for integration seems to have become stronger still.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span>Which of the following best represents the main idea of the passage?<\/span>", "options": ["<span>Facebook's proprietary data on 72.2m young American adults reveal the importance of economic connectedness.<\/span>", "<span><\/span>\t<span>Previous research on social capital is inconsistent, but recent studies show the importance of civic engagement.<\/span>", "<span><\/span>\t<span>The decline of social interaction in America has led to negative consequences for individuals and society.<\/span>", "<span><\/span>\t<span>It is difficult to experimentally vary a person's social capital, but integration is imperative for improving life outcomes.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tOption 1: While the passage discusses Facebook's proprietary data and its role in measuring social capital, this is not the main idea of the passage.\r<br /><span>Option 2: The statement is only a part of the argument made in the passage.<\/span>\r<br /><span>Option 3.Correct.The passage discusses the concept of social capital and its decline in American society, and the negative consequences this has on individuals and society. It also highlights recent research, including a study that used Facebook data to measure the importance of economic connectedness, and mentions the challenges of studying social capital and the benefits of integration. However, the main idea is&nbsp;<\/span><span>centered<\/span><span> around the decline of social interaction and its consequences.<\/span>\r<br /><span>Option 4: While the passage discusses the difficulty of experimentally varying a person's social capital, this is not the main idea of the passage.<\/span><span>Hence, [3].<\/span>", "topic": "Central Idea"}, {"number": 2, "sourceId": "16817108635711", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>Published in 2000 “Bowling Alone”, the landmark study by Robert Putnam, a political scientist at Harvard, offered a sweeping survey of what ailed American society by detailing a steady erosion in the amount of social interaction among people who are not family, close <\/span><span>friends<\/span><span> or work colleagues—a concept called “social capital”. The withdrawal of Americans from bowling leagues, religious life and volunteering was a symptom of anomie, Mr Putnam argued… Social scientists have argued about the supposed importance of social capital in the intervening decades. A comprehensive set of studies by a team of economists, just published in <\/span><span>Nature<\/span><span>,<\/span> <span>strikes a blow in favour of those who have championed the importance of social capital…<\/span>\r<br>\r<br><span>Fittingly for the new age of social science, the data come from Faceboo<\/span>k. <span>The large research team worked with the social-media giant’s proprietary data on 72.2m young American adults and the 21bn friendships they had formed on the site. The shape of every person’s network of friends could be converted into a few simple, empirical scores of social <\/span><span>capital<\/span><span>. Data on the hometowns, workplaces and educational histories of Facebook users allowed the researchers to estimate how social capital varied between places in a much finer-grained way than previously possible. And, most important, they were able to correlate these neighbourhood-level measures of social capital with important outcomes like graduating successfully from high school and having <\/span><span>upward social mobility<\/span><span>.<\/span>\r<br>\r<br><span>One measure seemed especially important. What the researchers called “economic connectedness”—the extent of friendships across social classes—was strongly associated with increased rates of high-school completion, reduced rates of teenage pregnancy and increased income for those born poorer. Moving from a place where friendships across social strata are relatively uncommon (a one-in-four chance of a friendship between someone in the bottom half of the class distribution and someone in the top) to one where it was relatively standard (a one-in-two chance) translated into an 8.2% increase in future earnings, the researchers found.<\/span>\r<br>\r<br><span>This corroborates findings in other recent large-scale examinations: places in America that are more segregated by race or income seem to give poor kids less of a chance… The most important institutions for encouraging these friendships seem to be colleges and universities… Past research has also found long-term benefits for poor kids who attend integrated schools or who do not live in neighbourhoods where poverty is extremely concentrated. Divine intervention helps, too. The researchers also found that intra-class friendships were most easily struck up in religious settings.<\/span>\r<br>\r<br><span>Other classical definitions of social capital such as the extent of civic engagement and the cohesiveness of bonds within social classes did not appear to be correlated with improved life outcomes<\/span>. <span>Verifying [the theory of social capital] has always been difficult. And even though this study is studded with quantitative measures derived from big data, its findings remain largely based on associations and correlations. It is hard to think of a way to experimentally vary a person’s degree of social capital—even leaving aside the ethical problems with doing it. Whatever uncertainty remains, the imperative for integration seems to have become stronger still.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>All of the following statements, if false, could be seen as being in accordance with the passage, EXCEPT:<\/span>", "options": ["The concept of social capital is not important for understanding American society.", "Facebook data cannot be used to measure social capital in a fine-grained way.", "Economic connectedness is not associated with positive life outcomes.", "Civic engagement and bonds within social classes do not improve life outcomes."], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>(<\/span><span>All of the following<\/span><span>) if false in accordance&nbsp;<\/span><span>EXCEPT<\/span><span> boils down to: 1. Three options are contrary to the passage as they stand – when negated they will be in accordance with the passage (they are not the answer choices because of EXCEPT) - OR: 2. As it stands, the option is in accordance with the passage.<\/span>\r<br /><span>Negate each option:<\/span>\r<br /><span>Option 1. If false –&nbsp;<\/span><span>(is important)<\/span><span> in accordance with the passage<\/span><span>.<\/span>\r<br /><span>Option 2. If false –&nbsp;<\/span><span>(can be used)<\/span><span> in accordance with the passage<\/span><span>.<\/span>\r<br /><span>Option 3. If false –<\/span><span> (associated with)<\/span><span> in accordance with the passage<\/span><span>.<\/span>\r<br /><span>Option 4. If false –&nbsp;<\/span><span>(improve)<\/span><span> not in accordance  - Exception (Other classical definitions of social capital […] such as the extent of civic engagement and the cohesiveness of bonds within social classes did not appear to be correlated with improved life outcomes…)<\/span><span> Hence, [4]<\/span><span>.<\/span>", "topic": "Specific Detail Question"}, {"number": 3, "sourceId": "16817108635712", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>Published in 2000 “Bowling Alone”, the landmark study by Robert Putnam, a political scientist at Harvard, offered a sweeping survey of what ailed American society by detailing a steady erosion in the amount of social interaction among people who are not family, close <\/span><span>friends<\/span><span> or work colleagues—a concept called “social capital”. The withdrawal of Americans from bowling leagues, religious life and volunteering was a symptom of anomie, Mr Putnam argued… Social scientists have argued about the supposed importance of social capital in the intervening decades. A comprehensive set of studies by a team of economists, just published in <\/span><span>Nature<\/span><span>,<\/span> <span>strikes a blow in favour of those who have championed the importance of social capital…<\/span>\r<br>\r<br><span>Fittingly for the new age of social science, the data come from Faceboo<\/span>k. <span>The large research team worked with the social-media giant’s proprietary data on 72.2m young American adults and the 21bn friendships they had formed on the site. The shape of every person’s network of friends could be converted into a few simple, empirical scores of social <\/span><span>capital<\/span><span>. Data on the hometowns, workplaces and educational histories of Facebook users allowed the researchers to estimate how social capital varied between places in a much finer-grained way than previously possible. And, most important, they were able to correlate these neighbourhood-level measures of social capital with important outcomes like graduating successfully from high school and having <\/span><span>upward social mobility<\/span><span>.<\/span>\r<br>\r<br><span>One measure seemed especially important. What the researchers called “economic connectedness”—the extent of friendships across social classes—was strongly associated with increased rates of high-school completion, reduced rates of teenage pregnancy and increased income for those born poorer. Moving from a place where friendships across social strata are relatively uncommon (a one-in-four chance of a friendship between someone in the bottom half of the class distribution and someone in the top) to one where it was relatively standard (a one-in-two chance) translated into an 8.2% increase in future earnings, the researchers found.<\/span>\r<br>\r<br><span>This corroborates findings in other recent large-scale examinations: places in America that are more segregated by race or income seem to give poor kids less of a chance… The most important institutions for encouraging these friendships seem to be colleges and universities… Past research has also found long-term benefits for poor kids who attend integrated schools or who do not live in neighbourhoods where poverty is extremely concentrated. Divine intervention helps, too. The researchers also found that intra-class friendships were most easily struck up in religious settings.<\/span>\r<br>\r<br><span>Other classical definitions of social capital such as the extent of civic engagement and the cohesiveness of bonds within social classes did not appear to be correlated with improved life outcomes<\/span>. <span>Verifying [the theory of social capital] has always been difficult. And even though this study is studded with quantitative measures derived from big data, its findings remain largely based on associations and correlations. It is hard to think of a way to experimentally vary a person’s degree of social capital—even leaving aside the ethical problems with doing it. Whatever uncertainty remains, the imperative for integration seems to have become stronger still.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which one of the following statements best reflects the main argument of the THIRD paragraph of the passage?<\/span>", "options": ["There is a steady erosion of social interaction among people of different economic classes.", "Income and education levels, as well as the rate of teenage pregnancy in a society, serve as markers of social capital.", "As one moves from one place to another, there is a significant improvement in economic connectedness.", "Social integration is crucial for improving life outcomes and reducing social disparities."], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span><b>T<\/b><\/span><span>he third paragraph of the passage discusses the importance of economic connectedness and its impact on life outcomes. The paragraph emphasizes that having friendships across social classes is strongly associated with positive outcomes such as increased rates of high-school completion, reduced rates of teenage pregnancy, and increased income for those born in poorer families. Option 1 is incorrect as the erosion of social interaction is not the focus of this paragraph. Option 2 is incorrect as the author does not go so far as to suggest that these are markers of social capital. Besides, the focus of the paragraph is economic connectedness – not social capital per se.  Option 3 is incorrect as mere mobility does not improve life outcomes.<\/span>\r<br /><span>Option 4 is correct. The paragraph suggests that economic connectedness, which refers to the extent of friendships across social classes, has significant implications for improving life outcomes. The researchers found that an increase in economic connectedness was strongly associated with increased rates of high-school completion, reduced rates of teenage pregnancy, and increased income for those born in lower economic classes. The paragraph further suggests that the increase in economic connectedness by moving from a place where friendships across social classes are uncommon to where they are relatively standard translated into an 8.2% increase in future earnings. Therefore, the implications are that social integration is crucial for improving life outcomes and reducing social disparities.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Inference"}, {"number": 4, "sourceId": "16817108635713", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>Published in 2000 “Bowling Alone”, the landmark study by Robert Putnam, a political scientist at Harvard, offered a sweeping survey of what ailed American society by detailing a steady erosion in the amount of social interaction among people who are not family, close <\/span><span>friends<\/span><span> or work colleagues—a concept called “social capital”. The withdrawal of Americans from bowling leagues, religious life and volunteering was a symptom of anomie, Mr Putnam argued… Social scientists have argued about the supposed importance of social capital in the intervening decades. A comprehensive set of studies by a team of economists, just published in <\/span><span>Nature<\/span><span>,<\/span> <span>strikes a blow in favour of those who have championed the importance of social capital…<\/span>\r<br>\r<br><span>Fittingly for the new age of social science, the data come from Faceboo<\/span>k. <span>The large research team worked with the social-media giant’s proprietary data on 72.2m young American adults and the 21bn friendships they had formed on the site. The shape of every person’s network of friends could be converted into a few simple, empirical scores of social <\/span><span>capital<\/span><span>. Data on the hometowns, workplaces and educational histories of Facebook users allowed the researchers to estimate how social capital varied between places in a much finer-grained way than previously possible. And, most important, they were able to correlate these neighbourhood-level measures of social capital with important outcomes like graduating successfully from high school and having <\/span><span>upward social mobility<\/span><span>.<\/span>\r<br>\r<br><span>One measure seemed especially important. What the researchers called “economic connectedness”—the extent of friendships across social classes—was strongly associated with increased rates of high-school completion, reduced rates of teenage pregnancy and increased income for those born poorer. Moving from a place where friendships across social strata are relatively uncommon (a one-in-four chance of a friendship between someone in the bottom half of the class distribution and someone in the top) to one where it was relatively standard (a one-in-two chance) translated into an 8.2% increase in future earnings, the researchers found.<\/span>\r<br>\r<br><span>This corroborates findings in other recent large-scale examinations: places in America that are more segregated by race or income seem to give poor kids less of a chance… The most important institutions for encouraging these friendships seem to be colleges and universities… Past research has also found long-term benefits for poor kids who attend integrated schools or who do not live in neighbourhoods where poverty is extremely concentrated. Divine intervention helps, too. The researchers also found that intra-class friendships were most easily struck up in religious settings.<\/span>\r<br>\r<br><span>Other classical definitions of social capital such as the extent of civic engagement and the cohesiveness of bonds within social classes did not appear to be correlated with improved life outcomes<\/span>. <span>Verifying [the theory of social capital] has always been difficult. And even though this study is studded with quantitative measures derived from big data, its findings remain largely based on associations and correlations. It is hard to think of a way to experimentally vary a person’s degree of social capital—even leaving aside the ethical problems with doing it. Whatever uncertainty remains, the imperative for integration seems to have become stronger still.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "Based on the passage, w<span>hich of the following views is the author NOT likely to support?<\/span>", "options": ["<span>Social capital is difficult to measure experimentally.<\/span>", "Religious settings are the most effective institutions for promoting social capital.", "Lack of communal activity and sharing in American Society signals a moral breakdown.", "Social capital can play a role in promoting economic development and reducing poverty."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>The correct answer is 2. Though the passage mentions that the researchers found that intra-class friendships were most easily formed in religious settings, it does not suggest that the author supports the view that religious settings are the most effective institutions for promoting social capital.<\/span>\r<br /><span>Option 1 is supported by the last paragraph. The mention of anomie in the paragraph justifies option 3. Option 4 is supported as ‘economic connectedness’ is a part of social capital.<\/span><span> Hence, [2].<\/span>", "topic": "Inference"}, {"number": 5, "sourceId": "16817108635714", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>H<\/span><span>ow did the harmful effects of fire shape our evolution? It’s a question that’s just starting to attract more attention. Now, two new studies have proposed theories on how negative consequences of fire might have shaped human evolution and development. In the first, scientists identified a genetic mutation in modern humans that allows certain toxins, including those found in smoke, to be metabolized at a safe rate. The same genetic sequence was not found in other primates, including ancient hominins such as Neanderthals and Denisovans. The researchers believe the mutation was selected for in response to breathing in smoke toxins, which can increase the risk of respiratory infections, suppress the immune <\/span><span>system<\/span><span> and disrupt the reproductive system.<\/span><br><br><span>It’s possible that having this mutation gave modern humans an evolutionary edge over Neanderthals, though it’s speculation at this point. But if the speculation is correct, the mutation may have been one <\/span>way that modern humans were inured against some adverse effects from fire, while other species were not. Thomas Henle, a chemistry professor at Dresden University of Technology in Germany, has wondered whether humans also have unique genetic mutations to better handle, or even take advantage of, <span>byproducts<\/span><span> of fire in food. In 2011, his research group showed that the brown molecules that come from roasting coffee can inhibit enzymes produced by <\/span><span>tumor<\/span><span> cells, which might explain why coffee drinkers may be at lower risk for certain cancers…<\/span><br><br><span>Humans may not have been able to adjust to <\/span><span>all of<\/span><span> the dangers of fire. The second study, published last week in Proceedings of the National Academy of Sciences, suggests that with fire’s advantageous effects for human societies also came profound new damage. It offers conjecture that the early use of fire might have helped spread tuberculosis by bringing people into close contact, damaging their <\/span><span>lungs<\/span><span> and causing them to cough.<\/span><br><br><span>With mathematical <\/span><span>modeling<\/span><span>, Rebecca Chisholm and Mark Tanaka, biologists at the University of New South Wales in Australia, simulated how ancient soil bacteria might have evolved to become infectious tuberculosis agents. Without fire, the probability was low. But when the researchers added fire to their model, the likelihood that tuberculosis would emerge jumped by several degrees of magnitude.<\/span><br><br><span>It is thought that tuberculosis has killed more than a billion people, possibly accounting for more deaths than wars and famines combined… Many experts believe tuberculosis arose at least 70,000 years ago. By then, humans were most certainly controlling fire. She and <\/span><span>Dr.<\/span><span> Tanaka believe that fire might have helped spread other airborne diseases, not just tuberculosis. “Fire, as a technological advantage, has been a double-edged sword,” <\/span><span>Dr.<\/span><span> Tanaka said.<\/span><br><br><span>Negative cultural consequences came with fire, too — and continue to leave an imprint. Anthropologists have speculated that inhaling smoke led to the discovery of smoking. Humans have long used fire to modify their environment and burn carbon, practices that now have us in the throes of climate change. Fire is even tied to the rise of patriarchy — by allowing men to go out hunting while women stayed behind to cook by the fire, it spawned gender norms that still exist today…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following, if true, would cast the most serious doubt on the main argument presented in the passage?<\/span>", "options": ["<span>Airborne diseases such as tuberculosis were common among Neanderthals and Denisovans.<\/span>", "<span><\/span>\t<span>There is evidence to suggest that Neanderthals and humans had different evolutionary lineages despite originating from the same ancestor.<\/span>", "<span><\/span>\t<span>There is evidence of interbreeding between Neanderthals and humans as Neanderthal DNA still exists in the genomes of modern humans.<\/span>", "<span><\/span>\t<span>Neanderthals were the ultimate cave-dwelling fire users and were one of the most successful examples of evolution.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "The main argument of the passage is that the harmful effects of fire have shaped human evolution and development. This is based on the premise that a particular genetic mutation is present in humans and not in Neanderthals – whatever their relation may be, the implication is that Neanderthals possibly could not survive because of its lack, and humans succeeded because of it. For this conclusion to be true, it must be assumed that both used fire. To cast the most serious doubt on this argument, we need to find the statement that contradicts this idea. Therefore, option 4, which suggests that Neanderthals used fire and still succeeded (in evolution), would cast the most serious doubt on the main argument of the passage. If Neanderthals were successful in using fire, it would imply that the harmful effects of fire did not have a significant impact on their evolution. While it still acknowledges that humans might have succeeded because of the mutation, the option makes the comparison irrelevant and destroys the argument. The other options do not necessarily contradict the main argument of the passage. Options 1, 2, and 3 are all consistent with the idea that humans and other hominids experienced different evolutionary paths.\r<br />\r<br /><span>Option 1. The fact that tuberculosis and other airborne diseases were common among Neanderthals and Denisovans does not negate the possibility that fire had consequences on human evolution and development.<\/span>\r<br /><span>Option 2. Even if Neanderthals and humans had different evolutionary lineages, it is still possible that the harmful effects of fire had an impact on human evolution and development.<\/span>\r<br /><span>Option 3. It does not directly address the central claim about the impact of fire on human evolution and development.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Application Question"}, {"number": 6, "sourceId": "16817108635725", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>H<\/span><span>ow did the harmful effects of fire shape our evolution? It’s a question that’s just starting to attract more attention. Now, two new studies have proposed theories on how negative consequences of fire might have shaped human evolution and development. In the first, scientists identified a genetic mutation in modern humans that allows certain toxins, including those found in smoke, to be metabolized at a safe rate. The same genetic sequence was not found in other primates, including ancient hominins such as Neanderthals and Denisovans. The researchers believe the mutation was selected for in response to breathing in smoke toxins, which can increase the risk of respiratory infections, suppress the immune <\/span><span>system<\/span><span> and disrupt the reproductive system.<\/span><br><br><span>It’s possible that having this mutation gave modern humans an evolutionary edge over Neanderthals, though it’s speculation at this point. But if the speculation is correct, the mutation may have been one <\/span>way that modern humans were inured against some adverse effects from fire, while other species were not. Thomas Henle, a chemistry professor at Dresden University of Technology in Germany, has wondered whether humans also have unique genetic mutations to better handle, or even take advantage of, <span>byproducts<\/span><span> of fire in food. In 2011, his research group showed that the brown molecules that come from roasting coffee can inhibit enzymes produced by <\/span><span>tumor<\/span><span> cells, which might explain why coffee drinkers may be at lower risk for certain cancers…<\/span><br><br><span>Humans may not have been able to adjust to <\/span><span>all of<\/span><span> the dangers of fire. The second study, published last week in Proceedings of the National Academy of Sciences, suggests that with fire’s advantageous effects for human societies also came profound new damage. It offers conjecture that the early use of fire might have helped spread tuberculosis by bringing people into close contact, damaging their <\/span><span>lungs<\/span><span> and causing them to cough.<\/span><br><br><span>With mathematical <\/span><span>modeling<\/span><span>, Rebecca Chisholm and Mark Tanaka, biologists at the University of New South Wales in Australia, simulated how ancient soil bacteria might have evolved to become infectious tuberculosis agents. Without fire, the probability was low. But when the researchers added fire to their model, the likelihood that tuberculosis would emerge jumped by several degrees of magnitude.<\/span><br><br><span>It is thought that tuberculosis has killed more than a bil -being of early humans, and thus, could have influenced their evolution.\r<br /><span>Option 2:  This option would not support the argument that negative consequences of fire might have shaped human evolution and development. If the use of fire by early humans was primarily for warmth and cooking, rather than for protection and&nbsp;<\/span><span>defense<\/span><span>, it suggests that the negative consequences of fire may not have been as significant as the benefits of using fire for warmth and cooking.<\/span>\r<br /><span>Option 3: The discovery of early human tools specifically designed to control and contain fires suggests that early humans were aware of the potential negative consequences of fire and took steps to mitigate those consequences.<\/span>\r<br /><span>Option 4: It suggests that a negative  consequence directly influenced human development.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Application Question"}, {"number": 7, "sourceId": "16817108635726", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>H<\/span><span>ow did the harmful effects of fire shape our evolution? It’s a question that’s just starting to attract more attention. Now, two new studies have proposed theories on how negative consequences of fire might have shaped human evolution and development. In the first, scientists identified a genetic mutation in modern humans that allows certain toxins, including those found in smoke, to be metabolized at a safe rate. The same genetic sequence was not found in other primates, including ancient hominins such as Neanderthals and Denisovans. The researchers believe the mutation was selected for in response to breathing in smoke toxins, which can increase the risk of respiratory infections, suppress the immune <\/span><span>system<\/span><span> and disrupt the reproductive system.<\/span><br><br><span>It’s possible that having this mutation gave
