t soil bacteria, the tuberculosis, and ancient humans have changed in complex ways over time.<\/span>", "<span><\/span>\t<span>The infectious tuberculosis bacteria had emerged before the evolution of modern humans and infected a variety of species through soil or water.<\/span>", "<span><\/span>\t<span>Environmental factors that may have played a role in the evolution of the infectious tuberculosis bacteria are unknown.<\/span>", "<span><\/span>\t<span>The emergence of the infectious tuberculosis bacteria was the result of an interplay between environmental, genetic, and host factors.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\tBased on the passage, the mathematical model described in paragraph 4 is focused on the impact of fire on the emergence of tuberculosis. Therefore, the option that would pose the most serious challenge to the prediction of the model would be one that undermines the importance of fire in the emergence of tuberculosis.\r<br /><span>Option 2 suggests that tuberculosis had emerged before the evolution of modern humans, and it infected a variety of species through soil or water. This option challenges the prediction of the model because it suggests that tuberculosis was already widespread before the introduction of fire by humans. If this option were true, it would imply that the emergence of tuberculosis was not closely linked to the use of fire by humans, (though not fire itself) and thus it would pose a serious challenge to the model's prediction.<\/span>\r<br />Option 1. While this may be true, it is not directly related to the prediction of the mathematical model in paragraph 4. The model is focused on the impact of fire on the emergence of tuberculosis, and changes in genetic makeup over time do not challenge that prediction.\r<br /><span>Option 3. It does not challenge the prediction of the mathematical model. The model is based on the assumption that fire was a key environmental factor that played a role in the emergence of tuberculosis, and it does not depend on the identification of specific environmental factors.<\/span>\r<br /><span>Option 4 The model is based on the assumption that fire was a key environmental factor that played a role in the emergence of tuberculosis, and it does not depend on the identification of other factors that may also have contributed to the emergence of tuberculosis.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Application Question"}, {"number": 9, "sourceId": "16817108635728", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Retailers’ aisles have long been stocked with private-label products, but consumers seem particularly open to them now. <\/span><span>Various<\/span><span> <\/span><span>market-research firms<\/span><span> have in recent years sketched a picture of what they call “agnostic shoppers”—informed, savvy consumers who are less loyal to specific brands and stores than to getting a good deal, whether that deal is considered good because of low prices, high quality, or both.<\/span><br><br><span>Private-label products seem a perfect fit for this trend, being both cheaper than brand-name products and comparable to them in quality. Indeed, <\/span><span>a report last year<\/span><span> from Gartner, a research and consulting firm, found that roughly half of Millennial shoppers said that they were indifferent to whether a product is brand-name or private-label, and that they would buy more private-label goods if the market provided them.<\/span><br><br><span>Retailers like private-label products too—they often have <\/span><span>higher profit margins for stores<\/span><span> than brand-name goods do. The national grocery chain Kroger has taken a particular liking to them. According to <\/span><span>an article from Reuters earlier this year<\/span><span>, Kroger has a team of 400 employees who develop its private-label products, poring over sales data to pounce on new trends. Each Kroger store, on average, has more than 15,000 house-brand products, <\/span><span>and,<\/span><span> the sales of these products accounted for about 27 percent of the chain’s grocery sales last year…<\/span><br><br><span>Private-label products currently account for much larger shares of sales for brick-and-mortar stores than they do for online retailers. According to the market-research firm Nielsen, $17 out of every $100 spent in American brick-and-mortar stores goes to private-label brands, while online, private-label products make up only 3 percent of sales of packaged goods…<\/span><br><br><span>A spokesperson for Amazon told me that its private-label products “only account for about 1 percent of our total retail sales.” The company does sell a range of products under Amazon-owned brands, but lately it has been focusing on assembling an arsenal of goods that are made by other companies but <\/span><span>can’t be purchased anywhere except on Amazon<\/span><span>. Forming exclusive brand partnerships allows Amazon to add unique products and plug assortment gaps in high-demand categories without having to spend the resources to develop, manufacture and sell them…<\/span><br><br><span>The market-research firm IRI has found that the prices of private-label products are on average 20 percent lower than those of brand-name products, but there’s apparently such a thing as too good of a deal. Christopher Durham, the private-label consultant, told me a story about working with a retailer on a pack of private-label batteries. Their price was about 60 percent cheaper than what the brand-name version was selling for, but even though Durham said they were of comparable quality, sales were “very, very slow on them.” He and his team experimented with different <\/span><span>prices, and<\/span><span> arrived at a somewhat amazing conclusion: “We could move the price up to about 25 percent less than the national brand, and the [sales] volume went up about seven times. Which is crazy, right? But [the customer was thinking], <\/span><span>These are so cheap—I don<\/span><span>’<\/span><span>t trust them<\/span><span>.” …<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>All of the following can be inferred from the passage about private- label products EXCEPT:<\/span>", "options": ["<span>Retailers make and sell them directly to consumers<\/span><span>.<\/span>", "<span><\/span>\t<span>Retailers get them manufactured by a third party<\/span><span>.<\/span>", "<span><\/span>\t<span>Retailers sell them under their own brand name<\/span><span>.<\/span>", "<span><\/span>\t<span>They target price and quality conscious consumers<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t2 , 3 and 4 are low level inferences more or less directly stated in the passage.  Hence, [1].", "topic": "Inference"}, {"number": 10, "sourceId": "16817108635749", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Retailers’ aisles have long been stocked with private-label products, but consumers seem particularly open to them now. <\/span><span>Various<\/span><span> <\/span><span>market-research firms<\/span><span> have in recent years sketched a picture of what they call “agnostic shoppers”—informed, savvy consumers who are less loyal to specific brands and stores than to getting a good deal, whether that deal is considered good because of low prices, high quality, or both.<\/span><br><br><span>Private-label products seem a perfect fit for this trend, being both cheaper than brand-name products and comparable to them in quality. Indeed, <\/span><span>a report last year<\/span><span> from Gartner, a research and consulting firm, found that roughly half of Millennial shoppers said that they were indifferent to whether a product is brand-name or private-label, and that they would buy more private-label goods if the market provided them.<\/span><br><br><span>Retailers like private-label products too—they often have <\/span><span>higher profit margins for stores<\/span><span> than brand-name goods do. The national grocery chain Kroger has taken a particular liking to them. According to <\/span><span>an article from Reuters earlier this year<\/span><span>, Kroger has a team of 400 employees who develop its private-label products, poring over sales data to pounce on new trends. Each Kroger store, on average, has more than 15,000 house-brand products, <\/span><span>and,<\/span><span> the sales of these products accounted for about 27 percent of the chain’s grocery sales last year…<\/span><br><br><span>Private-label products currently account for much larger shares of sales for brick-and-mortar stores than they do for online retailers. According to the market-research firm Nielsen, $17 out of every $100 spent in American brick-and-mortar stores goes to private-label brands, while online, private-label products make up only 3 percent of sales of packaged goods…<\/span><br><br><span>A spokesperson for Amazon told me that its private-label products “only account for about 1 percent of our total retail sales.” The company does sell a range of products under Amazon-owned brands, but lately it has been focusing on assembling an arsenal of goods that are made by other companies but <\/span><span>can’t be purchased anywhere except on Amazon<\/span><span>. Forming exclusive brand partnerships allows Amazon to add unique products and plug assortment gaps in high-demand categories without having to spend the resources to develop, manufacture and sell them…<\/span><br><br><span>The market-research firm IRI has found that the prices of private-label products are on average 20 percent lower than those of brand-name products, but there’s apparently such a thing as too good of a deal. Christopher Durham, the private-label consultant, told me a story about working with a retailer on a pack of private-label batteries. Their price was about 60 percent cheaper than what the brand-name version was selling for, but even though Durham said they were of comparable quality, sales were “very, very slow on them.” He and his team experimented with different <\/span><span>prices, and<\/span><span> arrived at a somewhat amazing conclusion: “We could move the price up to about 25 percent less than the national brand, and the [sales] volume went up about seven times. Which is crazy, right? But [the customer was thinking], <\/span><span>These are so cheap—I don<\/span><span>’<\/span><span>t trust them<\/span><span>.” …<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<p><span>In the context of the passage, which of the following can be inferred from the findings of the Gartner study on private-label products and millennials?<\/span><\/p>", "options": ["<span>Roughly half of Millennial shoppers would prefer Kroger to Amazon.<\/span>", "<span><\/span>\t<span>Millennials are indifferent to the price and quality of the products they buy.<\/span>", "<span><\/span>\t<span>Millennials are informed, savvy consumers who prioritize getting a good deal.<\/span>", "<span><\/span>\t<span>Millennials are concerned equally about the price and the quality of the products.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tOption 1. Not a sustainable inference. “Roughly half of them would buy private label if available. “Retailers like private-label products too… The national grocery chain Kroger has taken a particular liking to them.”  – “Each Kroger store, on average, has more than 15,000 house-brand products.” At Amazon,  “only account for about 1 percent of our total retail sales” – comparison of real number and percentage cannot be done.\r<br /><span>Option 2. They are indifferent to brand name and private- label and interested in a good deal.  Either price, or quality, or both are important to them.<\/span>\r<br /><span>Option 3. Correct. Millennials are informed, savvy consumers who prioritize getting a good deal, whether that deal is considered good because of low prices, high quality, or both.<\/span>\r<br /><span>Option 4. Either low price, or quality, or both does not lead to option 4.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Inference"}, {"number": 11, "sourceId": "168171086357410", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Retailers’ aisles have long been stocked with private-label products, but consumers seem particularly open to them now. <\/span><span>Various<\/span><span> <\/span><span>market-research firms<\/span><span> have in recent years sketched a picture of what they call “agnostic shoppers”—informed, savvy consumers who are less loyal to specific brands and stores than to getting a good deal, whether that deal is considered good because of low prices, high quality, or both.<\/span><br><br><span>Private-label products seem a perfect fit for this trend, being both cheaper than brand-name products and comparable to them in quality. Indeed, <\/span><span>a report last year<\/span><span> from Gartner, a research and consulting firm, found that roughly half of Millennial shoppers said that they were indifferent to whether a product is brand-name or private-label, and that they would buy more private-label goods if the market provided them.<\/span><br><br><span>Retailers like private-label products too—they often have <\/span><span>higher profit margins for stores<\/span><span> than brand-name goods do. The national grocery chain Kroger has taken a particular liking to them. According to <\/span><span>an article from Reuters earlier this year<\/span><span>, Kroger has a team of 400 employees who develop its private-label products, poring over sales data to pounce on new trends. Each Kroger store, on average, has more than 15,000 house-brand products, <\/span><span>and,<\/span><span> the sales of these products accounted for about 27 percent of the chain’s grocery sales last year…<\/span><br><br><span>Private-label products currently account for much larger shares of sales for brick-and-mortar stores than they do for online retailers. According to the market-research firm Nielsen, $17 out of every $100 spent in American brick-and-mortar stores goes to private-label brands, while online, private-label products make up only 3 percent of sales of packaged goods…<\/span><br><br><span>A spokesperson for Amazon told me that its private-label products “only account for about 1 percent of our total retail sales.” The company does sell a range of products under Amazon-owned brands, but lately it has been focusing on assembling an arsenal of goods that are made by other companies but <\/span><span>can’t be purchased anywhere except on Amazon<\/span><span>. Forming exclusive brand partnerships allows Amazon to add unique products and plug assortment gaps in high-demand categories without having to spend the resources to develop, manufacture and sell them…<\/span><br><br><span>The market-research firm IRI has found that the prices of private-label products are on average 20 percent lower than those of brand-name products, but there’s apparently such a thing as too good of a deal. Christopher Durham, the private-label consultant, told me a story about working with a retailer on a pack of private-label batteries. Their price was about 60 percent cheaper than what the brand-name version was selling for, but even though Durham said they were of comparable quality, sales were “very, very slow on them.” He and his team experimented with different <\/span><span>prices, and<\/span><span> arrived at a somewhat amazing conclusion: “We could move the price up to about 25 percent less than the national brand, and the [sales] volume went up about seven times. Which is crazy, right? But [the customer was thinking], <\/span><span>These are so cheap—I don<\/span><span>’<\/span><span>t trust them<\/span><span>.” …<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Based on the information in the passage, which of the following best explains Amazon's approach to exclusive brand partnerships?<\/span>", "options": ["<span>Offering large discounts on unique brand-name products to lure customers to buy from Amazon instead of its competitors.<\/span>", "<span><\/span>\t<span>Developing, manufacturing, and selling products itself to add a unique assortment of products on its platform.<\/span>", "<span><\/span>\t<span>Collaborating with manufacturers to create unique products that can only be purchased on Amazon, which helps plug assortment gaps in high-demand categories.<\/span>", "<span><\/span>\t<span>Purchasing and reselling products that are not readily available on other e-commerce websites to gain a competitive advantage.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>Option 1. Option 1 is incorrect as the passage specifically states that Amazon's exclusive brand partnership strategy involves offering unique products that cannot be found on other e-commerce websites. The focus of the exclusive brand partnership strategy is not discounts.<\/span>\r<br /><span>Option 2. It is incorrect because while Amazon does sell products under its own brand, the exclusive brand partnership strategy focuses on collaborating with other manufacturers to offer unique products that can only be purchased on Amazon.<\/span>\r<br /><span>Option 3. Correct. The passage states that Amazon's exclusive brand partnership strategy involves forming partnerships with manufacturers to create unique products that can only be purchased on Amazon. This helps fill gaps in high-demand categories and differentiate Amazon's platform from its competitors.<\/span>\r<br /><span>Option 4. This option is incorrect. While Amazon does offer a wide range of products, the exclusive brand partnership strategy focuses on adding exclusive products to the platform.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Specific Detail Question"}, {"number": 12, "sourceId": "168171086357411", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Retailers’ aisles have long been stocked with private-label products, but consumers seem particularly open to them now. <\/span><span>Various<\/span><span> <\/span><span>market-research firms<\/span><span> have in recent years sketched a picture of what they call “agnostic shoppers”—informed, savvy consumers who are less loyal to specific brands and stores than to getting a good deal, whether that deal is considered good because of low prices, high quality, or both.<\/span><br><br><span>Private-label products seem a perfect fit for this trend, being both cheaper than brand-name products and comparable to them in quality. Indeed, <\/span><span>a report last year<\/span><span> from Gartner, a research and consulting firm, found that roughly half of Millennial shoppers said that they were indifferent to whether a product is brand-name or private-label, and that they would buy more private-label goods if the market provided them.<\/span><br><br><span>Retailers like private-label products too—they often have <\/span><span>higher profit margins for stores<\/span><span> than brand-name goods do. The national grocery chain Kroger has taken a particular liking to them. According to <\/span><span>an article from Reuters earlier this year<\/span><span>, Kroger has a team of 400 employees who develop its private-label products, poring over sales data to pounce on new trends. Each Kroger store, on average, has more than 15,000 house-brand products, <\/span><span>and,<\/span><span> the sales of these products accounted for about 27 percent of the chain’s grocery sales last year…<\/span><br><br><span>Private-label products currently account for much larger shares of sales for brick-and-mortar stores than they do for online retailers. According to the market-research firm Nielsen, $17 out of every $100 spent in American brick-and-mortar stores goes to private-label brands, while online, private-label products make up only 3 percent of sales of packaged goods…<\/span><br><br><span>A spokesperson for Amazon told me that its private-label products “only account for about 1 percent of our total retail sales.” The company does sell a range of products under Amazon-owned brands, but lately it has been focusing on assembling an arsenal of goods that are made by other companies but <\/span><span>can’t be purchased anywhere except on Amazon<\/span><span>. Forming exclusive brand partnerships allows Amazon to add unique products and plug assortment gaps in high-demand categories without having to spend the resources to develop, manufacture and sell them…<\/span><br><br><span>The market-research firm IRI has found that the prices of private-label products are on average 20 percent lower than those of brand-name products, but there’s apparently such a thing as too good of a deal. Christopher Durham, the private-label consultant, told me a story about working with a retailer on a pack of private-label batteries. Their price was about 60 percent cheaper than what the brand-name version was selling for, but even though Durham said they were of comparable quality, sales were “very, very slow on them.” He and his team experimented with different <\/span><span>prices, and<\/span><span> arrived at a somewhat amazing conclusion: “We could move the price up to about 25 percent less than the national brand, and the [sales] volume went up about seven times. Which is crazy, right? But [the customer was thinking], <\/span><span>These are so cheap—I don<\/span><span>’<\/span><span>t trust them<\/span><span>.” …<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span>“The market-research firm IRI has found that the prices of private-label products are on average 20 percent lower than those of brand-name products, but there’s apparently such a thing as too good of a deal. “<\/span><br><span>In the context of the passage, which one of the following is NOT a possible implication of the quoted statement?<\/span>", "options": ["<span>Customers may associate lower prices with lower <\/span><span>quality, and<\/span><span> may be suspicious of products that are priced significantly lower than their competitors.<\/span>", "<span>Companies may need to find a balance between offering a good deal and setting a price that customers will trust.<\/span>", "<span><\/span>\t<span>Private-label products are always of the same quality as brand-name <\/span><span>products, and<\/span><span> should be priced accordingly to maintain sales.<\/span>", "<span><\/span>\t<span>Setting a price that is too low may hurt sales of a product, even if it is of comparable quality to a higher-priced competitor.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tOption 3 is NOT a possible implication of the quoted statement. The passage does not provide any information or imply that private-label products are always of the same quality as brand-name products and should be priced accordingly to maintain sales. Instead, it suggests that customers may associate lower prices with lower quality, which may lead to suspicion and slow sales. Companies may need to find a balance between offering a good deal and setting a price that customers will trust, and setting a price that is too low may hurt sales of a product, even if it is of comparable quality to a higher-priced competitor.\r<br /><span>Hence, [3].<\/span>", "topic": "Inference"}, {"number": 13, "sourceId": "168171086357412", "type": "mcq", "passage": "<b> <\/b><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>As beautiful as they are to look at, art masterpieces are not eternal: Pigments and binders in oil paintings inexorably deteriorate. Light, humidity, and temperature fluctuations are the usual culprits, but exposure to some solvents or the mixing of incompatible pigments can also render paint unstable over time. In their effort to understand the chemical reactions that caused degradation in a particular painting, art conservators try to answer three questions: How was the painting made? How did it originally appear? And how did it change? […] By reconstructing how a painting deteriorated, conservators may be able to forestall further damage and better preserve it.<\/span><br><br><span>Paintings conservator and doctoral student <\/span><span>Nouchka<\/span><span> De Keyser (Rijksmuseum, University of Amsterdam, and University of Antwerp) and her colleagues have scientifically addressed all three questions while examining a yellow rose in Abraham Mignon’s painting <\/span><span>Still Life with Flowers and a Watch<\/span><span> (circa 1660–79). Yellow roses have long been a problematic motif. To create the flowers’ bright and vibrant appearance, artists since antiquity have used orpiment. But over time the mineral severely <\/span><span>discolored<\/span><span> the appearance of such items as orange draperies, lemons, yellow flowers, and the sheen of golden metal in several old masterworks…<\/span><br><br><span>In Mignon’s painting, most of the flowers retain beautifully preserved details. But the rose stands out as flat, monochrome, and peppered with microcracks. De Keyser and her colleagues first <\/span><span>analyzed<\/span><span> the rose using x-ray fluorescence imaging. That technique mapped the spatial distribution of elements, particularly arsenic, calcium, iron, <\/span><span>sulfur<\/span><span>, lead, and copper. Their presence revealed painterly features—light and shadows defining the separate petals and stamens—that are optically invisible in the actual image. Because those elements still reside in the paint layers, the map of the micro-scale distribution of arsenic uncovers the rose in much of its former glory.<\/span><br><br><span>Fluorescence cannot resolve the elements’ molecular phases, though. To identify them, the group used an in-house x-ray powder diffraction scanner. They non-invasively mapped the presence of crystalline pigment phases and degradation products and <\/span><span>analyzed<\/span><span> the paint surface in reflection mode. The diffraction map primarily identified two lead arsenates as degradation products—<\/span><span>schultenite<\/span><span> and mimetite. According to the authors, the presence of those lead arsenates accounts for <\/span>the <span>colorless<\/span><span> appearance of the yellow rose. The original orpiment pigment still exists in the painting only along the border of the rose. The mineral’s bright, vivid yellow in other parts of the flower were transformed into reaction products that are largely transparent. …Mignon is thought to have adopted a multistep method to produce his work. He first blocked out the position of the flowers with a monochrome underpainting and then filled in details by applying glazes for the shadows and orpiment in lighter sections for sunlit parts. Accordingly, the position of the yellow rose was marked with a yellow <\/span><span>ocher<\/span><span> underpaint rich in iron. In its now degraded state, that underpaint is the only part that is optically visible. The fluorescence map reveals it as a layer rich in iron, and the diffraction map identifies its molecular source as goethite, a key ingredient in the yellow <\/span><span>ocher<\/span><span>. The result is dull, flat, and monochrome…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>The yellow rose in \"<\/span><span>Still Life with Flowers and a Watch<\/span><span>\" lost its <\/span><span>color<\/span><span> over time for <\/span><span>all of<\/span><span> the following reasons EXCEPT:<\/span>", "options": ["<span>The degradation of the orpiment pigment.<\/span>", "<span><\/span>\t<span>Reaction products that are largely transparent.<\/span>", "<p><span>Instability of <\/span><span>schultenite<\/span><span> and mimetite.<\/span> &nbsp;<\/p>", "<p>Contact with chemical substances.<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tIt can be inferred from the passage that the loss of colour happened because the yellow pigment orpiment is unstable and on exposure to the environment breaks down to “two lead arsenates as degradation products—<span>schultenite<\/span><span> and mimetite” which are largely transparent. Hence options 1, 2, 4 are sustainable statements. Option 4 can be inferred from the general statement in the&nbsp;<\/span>passage – “Pigments and binders in oil paintings inexorably deteriorate. Light, humidity, and temperature fluctuations are the usual culprits, but exposure to some solvents or the mixing of incompatible pigments can also render paint unstable over time.” Contact with chemical substances through any of these routes cannot be ruled out.  Option 3 states that the arsenates were unstable, whereas the arsenates are degradation products of unstable orpiment. Hence, [3].", "topic": "Inference"}, {"number": 14, "sourceId": "168171086357513", "type": "mcq", "passage": "<b> <\/b><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>As beautiful as they are to look at, art masterpieces are not eternal: Pigments and binders in oil paintings inexorably deteriorate. Light, humidity, and temperature fluctuations are the usual culprits, but exposure to some solvents or the mixing of incompatible pigments can also render paint unstable over time. In their effort to understand the chemical reactions that caused degradation in a particular painting, art conservators try to answer three questions: How was the painting made? How did it originally appear? And how did it change? […] By reconstructing how a painting deteriorated, conservators may be able to forestall further damage and better preserve it.<\/span><br><br><span>Paintings conservator and doctoral student <\/span><span>Nouchka<\/span><span> De Keyser (Rijksmuseum, University of Amsterdam, and University of Antwerp) and her colleagues have scientifically addressed all three questions while examining a yellow rose in Abraham Mignon’s painting <\/span><span>Still Life with Flowers and a Watch<\/span><span> (circa 1660–79). Yellow roses have long been a problematic motif. To create the flowers’ bright and vibrant appearance, artists since antiquity have used orpiment. But over time the mineral severely <\/span><span>discolored<\/span><span> the appearance of such items as orange draperies, lemons, yellow flowers, and the sheen of golden metal in several old masterworks…<\/span><br><br><span>In Mignon’s painting, most of the flowers retain beautifully preserved details. But the rose stands out as flat, monochrome, and peppered with microcracks. De Keyser and her colleagues first <\/span><span>analyzed<\/span><span> the rose using x-ray fluorescence imaging. That technique mapped the spatial distribution of elements, particularly arsenic, calcium, iron, <\/span><span>sulfur<\/span><span>, lead, and copper. Their presence revealed painterly features—light and shadows defining the separate petals and stamens—that are optically invisible in the actual image. Because those elements still reside in the paint layers, the map of the micro-scale distribution of arsenic uncovers the rose in much of its former glory.<\/span><br><br><span>Fluorescence cannot resolve the elements’ molecular phases, though. To identify them, the group used an in-house x-ray powder diffraction scanner. They non-invasively mapped the presence of crystalline pigment phases and degradation products and <\/span><span>analyzed<\/span><span> the paint surface in reflection mode. The diffraction map primarily identified two lead arsenates as degradation products—<\/span><span>schultenite<\/span><span> and mimetite. According to the authors, the presence of those lead arsenates accounts for <\/span>the <span>colorless<\/span><span> appearance of the yellow rose. The original orpiment pigment still exists in the painting only along the border of the rose. The mineral’s bright, vivid yellow in other parts of the flower were transformed into reaction products that are largely transparent. …Mignon is thought to have adopted a multistep method to produce his work. He first blocked out the position of the flowers with a monochrome underpainting and then filled in details by applying glazes for the shadows and orpiment in lighter sections for sunlit parts. Accordingly, the position of the yellow rose was marked with a yellow <\/span><span>ocher<\/span><span> underpaint rich in iron. In its now degraded state, that underpaint is the only part that is optically visible. The fluorescence map reveals it as a layer rich in iron, and the diffraction map identifies its molecular source as goethite, a key ingredient in the yellow <\/span><span>ocher<\/span><span>. The result is dull, flat, and monochrome…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>How did X-ray fluorescence imaging help the group of conservators?<\/span>", "options": ["<span>They could map the spatial distribution of different elements which could later help them restore the flower to much of its original beauty.<\/span>", "<span><\/span>\t<span>They could determine the elemental composition of the painting and create a map of the distribution of elements within it.<\/span>", "<span><\/span>\t<span>They could <\/span><span>analyze<\/span><span> the elemental composition of pigments and determine the original appearance of the rose.<\/span>", "<span><\/span>\t<span>They could turn the rose into a <\/span><span>multicolored<\/span><span> flower with beautifully preserved details from a flat monochrome image peppered with microcracks.<\/span>\n<span><\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tX-ray fluorescence imaging helped to map the spatial distribution of elements, particularly arsenic, calcium, iron,&nbsp;<span>sulfur<\/span><span>, lead, and copper, in the yellow rose in Abraham Mignon’s painting. This technique revealed painterly features that are optically invisible (light and shadows defining the separate petals and stamens) in the actual image and uncovered the rose in much of its former glory. At best it means that the flat image could be seen as something that resembled what it was originally.<\/span>\r<br /><span>Option 1. The passage does not talk about restoration.<\/span>\r<br /><span>Option 2. Yes, it did. But the question of how&nbsp;<\/span><span>did it help<\/span><span> them still remains.<\/span>\r<br /><span>Option 3. ‘determine the original appearance’ specifies how it helped them.<\/span>\r<br /><span>Option 4. “turn the rose into a&nbsp;<\/span><span>multicolored<\/span><span> flower with beautifully preserved details” is an overstatement. It sounds almost like restoration or even improvement upon the original.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Specific Detail Question"}, {"number": 15, "sourceId": "168171086357514", "type": "mcq", "passage": "<b> <\/b><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>As beautiful as they are to look at, art masterpieces are not eternal: Pigments and binders in oil paintings inexorably deteriorate. Light, humidity, and temperature fluctuations are the usual culprits, but exposure to some solvents or the mixing of incompatible pigments can also render paint unstable over time. In their effort to understand the chemical reactions that caused degradation in a particular painting, art conservators try to answer three questions: How was the painting made? How did it originally appear? And how did it change? […] By reconstructing how a painting deteriorated, conservators may be able to forestall further damage and better preserve it.<\/span><br><br><span>Paintings conservator and doctoral student <\/span><span>Nouchka<\/span><span> De Keyser (Rijksmuseum, University of Amsterdam, and University of Antwerp) and her colleagues have scientifically addressed all three questions while examining a yellow rose in Abraham Mignon’s painting <\/span><span>Still Life with Flowers and a Watch<\/span><span> (circa 1660–79). Yellow roses have long been a problematic motif. To create the flowers’ bright and vibrant appearance, artists since antiquity have used orpiment. But over time the mineral severely <\/span><span>discolored<\/span><span> the appearance of such items as orange draperies, lemons, yellow flowers, and the sheen of golden metal in several old masterworks…<\/span><br><br><span>In Mignon’s painting, most of the flowers retain beautifully preserved details. But the rose stands out as flat, monochrome, and peppered with microcracks. De Keyser and her colleagues first <\/span><span>analyzed<\/span><span> the rose using x-ray fluorescence imaging. That technique mapped the spatial distribution of elements, particularly arsenic, calcium, iron, <\/span><span>sulfur<\/span><span>, lead, and copper. Their presence revealed painterly features—light and shadows defining the separate petals and stamens—that are optically invisible in the actual image. Because those elements still reside in the paint layers, the map of the micro-scale distribution of arsenic uncovers the rose in much of its former glory.<\/span><br><br><span>Fluorescence cannot resolve the elements’ molecular phases, though. To identify them, the group used an in-house x-ray powder diffraction scanner. They non-invasively mapped the presence of crystalline pigment phases and degradation products and <\/span><span>analyzed<\/span><span> the paint surface in reflection mode. The diffraction map primarily identified two lead arsenates as degradation products—<\/span><span>schultenite<\/span><span> and mimetite. According to the authors, the presence of those lead arsenates accounts for <\/span>the <span>colorless<\/span><span> appearance of the yellow rose. The original orpiment pigment still exists in the painting only along the border of the rose. The mineral’s bright, vivid yellow in other parts of the flower were transformed into reaction products that are largely transparent. …Mignon is thought to have adopted a multistep method to produce his work. He first blocked out the position of the flowers with a monochrome underpainting and then filled in details by applying glazes for the shadows and orpiment in lighter sections for sunlit parts. Accordingly, the position of the yellow rose was marked with a yellow <\/span><span>ocher<\/span><span> underpaint rich in iron. In its now degraded state, that underpaint is the only part that is optically visible. The fluorescence map reveals it as a layer rich in iron, and the diffraction map identifies its molecular source as goethite, a key ingredient in the yellow <\/span><span>ocher<\/span><span>. The result is dull, flat, and monochrome…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>X-ray powder diffraction scanner (Paragraph 4) helped determine <\/span><span>all of<\/span><span> the following EXCEPT:<\/span>", "options": ["<span>The cause of the discoloration<\/span>", "<span>Abraham Mignon’s painting technique<\/span>", "<span><\/span>\t<span>The materials Abraham Mignon used<\/span>", "<span>The cause of orpiment degradation.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\tOption 1. Not an exception. The diffraction map created by the scanner was able to identify the molecular phases of the elements detected by x-ray fluorescence imaging, such as lead arsenates, which were present as degradation products in the yellow rose. The lead arsenates were identified as&nbsp;<span>schultenite<\/span><span> and mimetite, which accounted for the&nbsp;<\/span><span>colorless<\/span><span> appearance of the rose.<\/span>\r<br /><span>Option 2. Not an exception. The group of conservators also&nbsp;<\/span><span>analyzed<\/span><span> Mignon’s painting technique and found that he used a multistep method to produce his work. He first blocked out the position of the flowers with a monochrome underpainting and then filled in details by applying glazes for the shadows and orpiment in lighter sections for sunlit parts. Et. Etc.<\/span>\r<br /><span>Option 3. Not an exception. The position of the yellow rose was marked with a yellow&nbsp;<\/span><span>ocher<\/span><span> underpaint rich in iron, …. The fluorescence map revealed it as a layer rich in iron, and the diffraction map identified its molecular source as goethite, a key ingredient in the yellow&nbsp;<\/span><span>ocher<\/span><span>. As a result, the yellow rose appeared dull, flat, and monochrome.<\/span>\r<br /><span>Option 4. Exception. Why orpiment degraded is not determined.<\/span><span> Hence, [4].<\/span>", "topic": "Inference"}, {"number": 16, "sourceId": "168171086357515", "type": "mcq", "passage": "<b> <\/b><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>As beautiful as they are to look at, art masterpieces are not eternal: Pigments and binders in oil paintings inexorably deteriorate. Light, humidity, and temperature fluctuations are the usual culprits, but exposure to some solvents or the mixing of incompatible pigments can also render paint unstable over time. In their effort to understand the chemical reactions that caused degradation in a particular painting, art conservators try to answer three questions: How was the painting made? How did it originally appear? And how did it change? […] By reconstructing how a painting deteriorated, conservators may be able to forestall further damage and better preserve it.<\/span><br><br><span>Paintings conservator and doctoral student <\/span><span>Nouchka<\/span><span> De Keyser (Rijksmuseum, University of Amsterdam, and University of Antwerp) and her colleagues have scientifically addressed all three questions while examining a yellow rose in Abraham Mignon’s painting <\/span><span>Still Life with Flowers and a Watch<\/span><span> (circa 1660–79). Yellow roses have long been a problematic motif. To create the flowers’ bright and vibrant appearance, artists since antiquity have used orpiment. But over time the mineral severely <\/span><span>discolored<\/span><span> the appearance of such items as orange draperies, lemons, yellow flowers, and the sheen of golden metal in several old masterworks…<\/span><br><br><span>In Mignon’s painting, most of the flowers retain beautifully preserved details. But the rose stands out as flat, monochrome, and peppered with microcracks. De Keyser and her colleagues first <\/span><span>analyzed<\/span><span> the rose using x-ray fluorescence imaging. That technique mapped the spatial distribution of elements, particularly arsenic, calcium, iron, <\/span><span>sulfur<\/span><span>, lead, and copper. Their presence revealed painterly features—light and shadows defining the separate petals and stamens—that are optically invisible in the actual image. Because those elements still reside in the paint layers, the map of the micro-scale distribution of arsenic uncovers the rose in much of its former glory.<\/span><br><br><span>Fluorescence cannot resolve the elements’ molecular phases, though. To identify them, the group used an in-house x-ray powder diffraction scanner. They non-invasively mapped the presence of crystalline pigment phases and degradation products and <\/span><span>analyzed<\/span><span> the paint surface in reflection mode. The diffraction map primarily identified two lead arsenates as degradation products—<\/span><span>schultenite<\/span><span> and mimetite. According to the authors, the presence of those lead arsenates accounts for <\/span>the <span>colorless<\/span><span> appearance of the yellow rose. The original orpiment pigment still exists in the painting only along the border of the rose. The mineral’s bright, vivid yellow in other parts of the flower were transformed into reaction products that are largely transparent. …Mignon is thought to have adopted a multistep method to produce his work. He first blocked out the position of the flowers with a monochrome underpainting and then filled in details by applying glazes for the shadows and orpiment in lighter sections for sunlit parts. Accordingly, the position of the yellow rose was marked with a yellow <\/span><span>ocher<\/span><span> underpaint rich in iron. In its now degraded state, that underpaint is the only part that is optically visible. The fluorescence map reveals it as a layer rich in iron, and the diffraction map identifies its molecular source as goethite, a key ingredient in the yellow <\/span><span>ocher<\/span><span>. The result is dull, flat, and monochrome…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following best expresses the primary purpose of the passage?<\/span>", "options": ["T<span>o describe the scientific approach taken by art conservators, led by <\/span><span>Nouchka<\/span><span> De Keyser, to <\/span><span>analyze<\/span><span> the degradation of a yellow rose in Abraham Mignon’s painting <\/span><span>Still Life with Flowers and a Watch<\/span><span>.<\/span>", "<span><\/span>\tT<span>o highlight the challenges of preserving art masterpieces and the role of scientific analysis in better understanding the original appearance of a painting and how it has changed over time.<\/span>", "<span><\/span>\tT<span>o provide details <\/span>of<span> the techniques used by the conservators, including x-ray fluorescence imaging and x-ray powder diffraction scanning, to identify the degradation products that caused the <\/span><span>colorless<\/span><span> appearance of the yellow rose in Mignon’s painting.<\/span>", "<span>T<\/span><span>o demonstrate how a scientific understanding of the chemical reactions that cause degradation can help in preserving art masterpieces.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\tOptions 1, 2 and 3 are partially correct. The passage does describe the scientific approach taken by art conservators, led by&nbsp;<span>Nouchka<\/span><span> De Keyser, to&nbsp;<\/span><span>analyze<\/span><span> the degradation of a yellow rose in Abraham Mignon’s painting Still Life with Flowers and a Watch. However, this is not the main purpose of the passage, as it only serves as an example to demonstrate how a scientific understanding of the chemical reactions that cause degradation can help in preserving art masterpieces. The&nbsp;<\/span><span>ultimate goal<\/span><span> of the passage is to show how scientific analysis can help in preserving art, rather than just describing a single instance of it. This is indicated by the first paragraph itself.<\/span>\r<br /><span>Option 2 is also not the main purpose of the passage, as it only serves&nbsp;<\/span><span>as a means to<\/span><span> emphasize the importance of understanding the chemical reactions that cause degradation in order to better preserve art.<\/span>\r<br /><span>Option 3 is also partially correct, as the passage does provide details about the techniques used by the conservators, including x-ray fluorescence imaging and x-ray powder diffraction scanning, to identify the degradation products that caused the&nbsp;<\/span><span>colorless<\/span><span> appearance of the yellow rose in Mignon's painting. However, like option 1 and 2, this is not the main purpose of the passage.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Primary Purpose"}, {"number": 17, "sourceId": "168171086357516", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<p><strong>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/strong><\/p>\n<p><br />1. <span>To address this issue, David King proposes a solution to recreate the albedo effect by creating white clouds high above the earth.<\/span><br /><span>2.<\/span> Although mitigation and adaptation efforts are necessary to combat climate change, they are not enough to address the destruction of previously stable systems caused by human interference.<br /><span>3.<\/span> With the proper scientific safeguards and consultation with local indigenous communities, this project could help restabilize the Arctic system, which governs the entire global climate system.<br /><span>4.<\/span> The Arctic Ocean's once pristine snow and ice that reflected the sun, known as the \"albedo effect,\" have been disrupted by rising temperatures and soot from various sources covering the Greenland ice sheet.<br /><br /><span><\/span><\/p>", "options": [], "answer": "4132", "answerLabel": "4132", "solution": "<\/span>\tSentence 1. “To address this issue …” is linked to the sentence that specifies this issue.\r<br /><span>Sentence 2. General statement. Has the characteristic of both a starter and a conclusion.<\/span>\r<br /><span>Sentence 3. Refers to ‘this project’. 1 and 3 are connected sentences as 1-3.<\/span>\r<br />Sentence 4. Ideal for the starter.\r<br /><span>Sentence 4 is followed by the 1-3 pair and then the paragraph is closed by 2<\/span><span>.<\/span>\r<br /><span>Therefore, the required answer is 4132.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 18, "sourceId": "168171086358017", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br>1.\t<span>Throughout my life, I have dedicated myself to comprehending the world I was born into and have had some success in doing so.<\/span><br><span>2.<\/span>\t<span>As participants, we seek to change the world to our advantage while as observers we aim to understand the world as it is.<\/span><br><span>3.<\/span>\t<span>I have come to the realization that our understanding of the world will always be imperfect because we are both participants and observers in it.<\/span><br><span>4.<\/span>\t<span>As a result, these two objectives often interfere with each another.<\/span><br><br><span>", "options": [], "answer": "1324", "answerLabel": "1324", "solution": "<\/span>\tSentence 1. First person narrative . Could be the introductory sentence.\r<br /><span>Sentence 2. Reference to participants and observers makes it dependent on some other sentence to get its meaning.<\/span>\r<br /><span>Sentence 3. Reference to participants and observers again makes 3-2 a pair as well as connects to 1 as 132.<\/span>\r<br /><span>Sentence 4. Good conclusion with ‘as a result.”<\/span>\r<br /><span>Therefore, the required answer is 1324.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 19, "sourceId": "168171086358218", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br>1.\t<span>While speculation has been known to lead to the bursting of market bubbles, such as the tulip craze in seventeenth-century Amsterdam and the more recent 2008 global financial crisis, it is also the market's necessary lubricant.<\/span><br><span>2.<\/span>\t<span>Speculative trades enable market players to calculate risks and generate returns, which help prevent the market from overheating.<\/span><br><span>3.<\/span>\t<span>Speculation, the act of investing in the financial market, carries both destructive and constructive potentials at its core.<\/span><br><span>4.<\/span>\t<span>However, during periods of speculative <\/span><span>fervor<\/span><span>, traders may assign value to abstract concepts that have no tangible link to market fundamentals.<\/span><br><br><span>", "options": [], "answer": "3124", "answerLabel": "3124", "solution": "<\/span>\tSentence 1. Standalone sentence. Negative and positive aspects of speculation. Could be the starter.\r<br /><span>Sentence 2. Standalone sentence. Positive aspect of speculation. Good for the starter. However, both sentences are about speculative trades in the markets.<\/span>\r<br /><span>Sentence 3. Defines Speculation – states that it has both negative and positive aspects. Links with 1 as 3-1. The best of the three for the starter.<\/span>\r<br /><span>Sentence 4. “<\/span><span>However<\/span><span>”, in sentence 4 signals a contrast with the sentence that is immediately before it.<\/span>\r<br /><span>Between 2 and 3, 3 is a better starter. 3-1 is a good pair as the ‘destructive’ potential of speculation is carried forward in sentence 1. Though 3-2 is possible, 3-1 is more logical for this reason. Sentence 2 following the 3-1 pair is also logical as the ‘constructive’ potential is suggested in 2.&nbsp;<\/span><span>So<\/span><span> 3-1-2 is a good sequence. Sentence 4 with ‘however’, provides the immediate contrast to 2 and closes the paragraph.<\/span>\r<br /><span>Therefore, the required answer is 3124.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 20, "sourceId": "168171086358319", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><span><b>Sentence<\/b><\/span><span>: <\/span><br><span>AI can be found in many aspects of modern life, including voice assistants, image recognition software, and self-driving cars.<\/span><br><br><span><b>Paragraph<\/b><\/span><span>: <\/span><br><span>Artificial intelligence, or AI for short, is a rapidly advancing field that involves creating machines that can perform tasks that would normally require human intelligence. _____1____. AI systems are designed to learn from data and improve their performance over time, making them incredibly versatile and adaptive. _____2____. One of the key advantages of AI is its ability to <\/span><span>analyze<\/span><span> vast amounts of data quickly and accurately, allowing for insights and predictions that would be difficult or impossible for humans to achieve. This makes AI especially useful in fields such as healthcare, finance, and marketing, where there are large amounts of data to be processed and <\/span><span>analyzed<\/span><span>. Despite its many benefits, AI is not without its challenges. _____3____. One of the most significant concerns is the potential for AI to be used for malicious purposes, such as cyberattacks or surveillance. _____4____.<\/span>", "options": ["<span>Option 1<\/span>", "<span><\/span>\t<span>Option 2<\/span>", "<span><span><\/span>\t<span>Option 3<\/span>", "<span><span><\/span>\t<span>Option 4<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span>The key sentence fits in blank 1 appropriately. After the introductory sentence about the advancing field of AI, its presence in modern life is most suitable. In any other blank, the sentence would interrupt the flow of the description. Hence, [1].<\/span><span><b>&nbsp;<\/b><\/span>", "topic": "Paragraph Completion"}, {"number": 21, "sourceId": "168171086358420", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><span><b>Sentence:<\/b><\/span><span> <\/span><br><span>There is also a growing recognition of the importance of inequality and the role it plays in shaping economic outcomes.<\/span><br><br><span><b>Paragraph:<\/b><\/span><span> <\/span><br><span>In recent years, there have been several new developments in economics that are shaping the way we think about economic theory and policy. _____1____.One of the most significant developments is the growing use of <\/span><span>behavioral<\/span><span> economics, which incorporates insights from psychology and other social sciences to better understand how people make decisions. Another important development is the increasing emphasis on data-driven approaches to economic analysis. _____2____.With the proliferation of big data and advanced analytical tools, economists are now able to more accurately measure and model economic phenomena, leading to more precise and effective policy recommendations. _____3____. This has led to renewed interest in policies that aim to reduce inequality, such as progressive taxation, minimum wage laws, and social safety net programs. _____4____.Finally, there is a growing interest in the economics of innovation, as economists seek to better understand how technological progress and innovation drive economic growth and development.<\/span>", "options": ["<span>Option 1<\/span>", "<span><\/span>\t<span>Option 2<\/span>", "<span><\/span>\t<span>Option 3<\/span>", "<span><\/span>\t<span>Option 4<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tThe sentence after blank 3 talks about the renewed interest in reducing inequality. The given sentence is the only one in the paragraph that mentions inequality. Hence it can fit in logically only blank 3. Elsewhere in the paragraph the sentence would break the flow of the narrative.\r<br /><span>Hence, [3].<\/span>", "topic": "Paragraph Completion"}, {"number": 22, "sourceId": "168171086358621", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br><span>Many scholars agree that a subjectively meaningful existence often boils down to three factors: the feeling that one’s life is coherent and “makes sense,” the possession of clear and satisfying long-term goals and the belief that one’s life matters in the grand scheme of things. Psychologists call these three things coherence, <\/span><span>purpose<\/span><span> and existential mattering. But we believe there is another element to consider. Think about the first butterfly you stop to admire after a long winter or imagine the scenery atop a hill after a fresh hike. When people are open to appreciating such experiences, these moments may enhance how they view their life. We call this element experiential appreciation. The phenomenon reflects the feeling of a deep connection to events as they transpire and the ability to extract value from that link.<\/span>", "options": ["<span>Scholars think that a meaningful life includes a sense of coherence, purpose, existential <\/span><span>mattering<\/span><span> and an ability to extract value from experiences and how one views one’s life.<\/span>", "<span><\/span>\t<span>A life with meaning depends not as much on a sense of coherence, <\/span><span>direction<\/span><span> and importance as on experiential appreciation or on the ability to broaden perspective through experiences.<\/span>", "<span><\/span>\t<span>A meaningful life encompasses not only coherence, purpose, and belief in one's own significance, but the ability to gain value from experiences and broaden one's perspective.<\/span>", "<span><\/span>\t<span>Scholars concur that a meaningful life encompasses coherence, direction, and significance, in addition to the capability to gain value from experiences and enhance one's perspective.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t\r<br /><span><b>Points:<\/b><\/span>\r<br /><span>·<\/span>\tScholars - Meaningful life – coherence,&nbsp;<span>purpose<\/span><span> and belief that one’s life matters (existential mattering)<\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\tAuthor – one more element to be considered, experiential appreciation – the ability to extract value from experiences and improve outlook.\r<br />\r<br /><span>Both options 1 and 3 are good precis, but option 3 is more precise in terms of capturing the author's emphasis on the addition of experiential appreciation to the concept of a meaningful life. Option 2 is contrary to the passage. The passage does not state that one (psychologists view) or the other (the author’s view) is less or more important. So ‘not as much on … as on’ construction is a distortion. Option 4 is unclear about significance. Besides everything is attributed to Scholars.<\/span>\r<br />Hence, [3].", "topic": "Summary"}, {"number": 23, "sourceId": "168171086358722", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<p><strong>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/strong><\/p>\n<p><br />The act of doomscrolling&mdash;spinning continuously through bad news despite its disheartening and depressing effects&mdash;and social media envy, like the fear of missing out, present greater risks to your health than were previously realized. A tranche of research over the past few years, amid the global coronavirus pandemic, a rise in armed conflicts, and increased economic woes, has offered a glimpse into what leaves us restless at night and the ways social media and our phones exacerbate feelings of helplessness. Spawning from a sense of inadequacy about one&rsquo;s appearance or a perceived lack of achievements, anyone scrolling their phones for extended periods and misusing social media faces an elevated risk of depression, anxiety, loneliness, self-harm, and suicide. But when at least one in five get their news through social media, it seems a near impossibility to disassociate from our digital avatars and the mobile computers we cart with us everywhere. Like most everything in life, moderation is key.<\/p>", "options": ["Although it is difficult to give up digital avatars and mobile devices, moderating their use is critical to avoid the detrimental effects of doomscrolling and social media envy, such as depression, anxiety, loneliness, self-harm and suicide.", "Research indicates that excessive scrolling through negative news and feelings of envy caused by social media use, have greater negative impacts on mental health than previously believed, leading to depression, anxiety, loneliness, self-harm and suicide.", "It may be challenging for individuals to dissociate from digital avatars and mobile devices; however, for those who consume news through social media, it is crucial to moderate their use to avoid the negative effects of excessive news consumption.", "It can be difficult for people to detach themselves from digital avatars and mobile device but as majority obtain news through social media, it is essential to practice moderation to avoid the detrimental effects of excessive news consumption."], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span><b>Main Points:<\/b><\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\tDoomscrolling and social media envy are harmful to health.\r<br />\t<span>·<\/span>\tResearch shows that social media exacerbates feelings of helplessness.\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\tMisusing social media can lead to depression, anxiety, loneliness, self-harm, and suicide.\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\tOne in five get their news through social media.\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\tIt's difficult to disassociate from social media and mobile devices.\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\tModeration is key<span>.<\/span>\r<br /><span>Option 1. This precis summarizes the main points of the original text, including the negative effects of doomscrolling and social media envy, the difficulty of giving up digital avatars and mobile devices, and the importance of moderation to avoid these negative effects. It also includes specific examples of the negative effects, such as depression, anxiety, loneliness, self-harm, and suicide.<\/span>\r<br /><span>Option 2. The idea of moderation is missing.<\/span>\r<br /><span>Option 3. it doesn't mention the negative effects that excessive news consumption can have on mental health, it just points out the importance of moderation to avoid negative effects of excessive news consumption. While it covers the main point of the text,&nbsp;<\/span><span>precis<\/span><span> 1 and 2 provide more detail and context.<\/span>\r<br /><span>Option 4. Precis 4 is&nbsp;<\/span><span>similar to<\/span><span> precis 3 in that it emphasizes the difficulty of detaching oneself from digital avatars and mobile devices, and the importance of moderation for those who obtain news through social media. However, compared to precis 1 and 2 it doesn't mention any of the negative effects of excessive news consumption on mental health, which is a key point of the original text. It also uses more informal language, which may not be appropriate for all contexts. Overall,&nbsp;<\/span><span>precis<\/span><span> 1 and 2 are more informative and detailed compared to precis 4.<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Summary"}, {"number": 24, "sourceId": "168171086358923", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br><span>Studies show that reading ability is more closely linked to a child's vocabulary than to their age, and that spoken language skills are a high predictor of later literary skills. However, we know that many children who enter school are behind on their language skills, especially those from disadvantaged backgrounds. Some argue that formal teaching allows these children to access the support and skills that others may pick up informally at home. This line of thinking is espoused by many educational authorities, who say that teaching reading early to those behind on their spoken language is \"the only effective route to closing this [language ability] gap\".  Others favour the opposite approach, of immersing children in an environment where they can enjoy and develop their language comprehension, which is after all central to reading success.<\/span>", "options": ["<span>Reading ability is linked to a child’s vocabulary and spoken language skills areas in which disadvantaged children are behind and there is debate whether immersive learning or formal training in spoken language would bridge the gap.<\/span>", "<span><\/span>\t<span>Studies show that reading ability is linked to vocabulary and spoken language skills; many children from disadvantaged backgrounds are behind in these areas and there is debate on the best approach to help them catch up.<\/span>", "<span><\/span>\t<span>Studies show that reading ability is linked to vocabulary and spoken language, areas where those from disadvantaged backgrounds lag; the best approach to bridge the gap is to provide an immersive learning experience.<\/span>", "<span>A child’s reading ability is linked to the vocabulary and spoken language skills acquired at home hence immersing disadvantaged children in an environment in which they learn these skills is the only way to help them catch up with others.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\tMain Points:\r<br /><span>·<\/span><span>&nbsp;<\/span>\tReading ability is linked to vocabulary more than age.\r<br /><span>·<\/span>\tSpoken language skills predict literary skills&nbsp;<span>later on<\/span><span>.&nbsp;<\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\tMany children enter school behind on language skills, especially those from disadvantaged backgrounds.&nbsp;\r<br /><span>·<\/span>\tSome argue formal teaching helps disadvantaged children catch up.\r<br /><span>·<\/span><span>&nbsp;<\/span>\tOthers argue for immersion in language-rich environments to develop comprehension.\r<br />\r<br /><span>Option 1. The passage is not talking about formal training in spoken language, but ‘teaching reading early.’<\/span>\r<br /><span>Option 2. Option 2 is the best precis because it conveys the main points of the original text in a clear and concise manner. It states that studies show that reading ability is linked to vocabulary and spoken language skills and that many children from disadvantaged backgrounds are behind in these areas. It also highlights that there is debate on the best approach to help these children catch up, which is a key point in the original text.<\/span>\r<br /><span>Option 3. ‘children’ not mentioned in the option. The passages&nbsp;<\/span><span>does<\/span><span> not say that immersive learning experience is the best approach.<\/span>\r<br /><span>Option 4. ‘acquired at home’ is a misrepresentation. ‘the only way’ is incorrect.<\/span>\r<br /><span>Hence, [2].<\/span", "topic": "Summary"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;
function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
