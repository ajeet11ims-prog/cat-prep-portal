<script type="application/json" id="test-data">{"testNumber": 10, "simcat": 10, "minutes": 40, "questions": [{"number": 1, "sourceId": "16927035315220", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>To <\/span><span>get a real sense of the azulejo tradition is to get a real sense of Portugal. The term azulejo comes from the Arabic word <\/span><span>azzelij<\/span><span>, meaning “little polished stone.” The tilework <\/span><span>dates back to<\/span><span> the 13th century, in the period just after the Moors invaded Portugal and brought parts of their culture to their invaded lands. But it wasn’t until the 16th century that azulejos became a more popular fixture in Portugal. At that time, powerful leaders in the monarchy or church commissioned the mosaics, and production started to take place in-country.<\/span>\r<br>\r<br><span>Today, the materials, especially the distinctive blue ink used on the tiles, tend to be sourced from factories in Portugal, and are not readily available elsewhere. First, the tiles are baked in an oven. Then, an artist spreads each individual glaze color made from potent ink diluted with just the right amount of water over a compact powder on the surface of the tile. Once the glaze is applied, each tile is refired in an ultrahot oven that often exceeds 1,000 degrees Fahrenheit. It’s this glazing process that makes the tiles particularly resilient, and resistant to elements like rain, <\/span><span>sun<\/span><span> and fire. That’s also when the true hues reveal themselves and shine.<\/span>\r<br>\r<br><span>… “One of the first things to notice is the monumental size of the places with coverings of azulejos,” says Alexandre Pais, the director of the National Azulejo Museum. “This sense of monumentality is something that is very specific to Portugal.” Other countries certainly use ceramic tiles to decorate walls and buildings, but not to the same extent and in the same deliberate way as in this country. To the untrained eye, azulejos might just seem like geometric shapes and swirling designs assembled and placed onto any old building to decorate an otherwise blank space. But the mosaics are created specifically for the architecture, so, the work’s setting is as critical as the design elements displayed on the tiles… In other countries, you can remove the tiles and move them from one wall or building to another without losing anything. But in Portugal … many azulejos have figurative scenes, and they tie into that place and that context.<\/span>\r<br>\r<br><span>The other major difference between Portuguese azulejos and other countries’ tilework, Pais says, is that “we are always changing and adjusting to new concepts, new ideas, according to the aspects of the culture at the time.” In the beginning, azulejos were produced outside of Portugal and tended to feature Islamic motifs like knotwork. Then, in the 16th century, when Portuguese leaders began to commission tileworks and the production of azulejos was localized, “a sense of scenography” took hold…<\/span>\r<br>\r<br>… Eventually, azulejos were applied to the facades of buildings, especially in Lisbon, as a more manageable, less expensive way of rebuilding the city infrastructure after its infamous earthquake. The artistry, Pais adds, provided a sense of hope in a time of recovery and growth. During the 20th century, contemporary artists began creating original tilework installations in public settings. “In Portugal, it’s less common to have big sculptures in the center of the square like in Italy or France,” Pais says. “But what we have is walls covered by azulejos, so azulejos become a vehicle, a medium for contemporary artists to express their individuality.”", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>According to the passage, azulejo combines <\/span><span>all of<\/span><span> these artistic and cult o the facades of buildings, especially in Lisbon, as a more manageable, less expensive way of rebuilding the city infrastructure after its infamous earthquake. The artistry, Pais adds, provided a sense of hope in a time of recovery and growth. During the 20th century, contemporary artists began creating original tilework installations in public settings. “In Portugal, it’s less common to have big sculptures in the center of the square like in Italy or France,” Pais says. “But what we have is walls covered by azulejos, so azulejos become a vehicle, a medium for contemporary artists to express their individuality.”", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>According to the passage, what makes azulejos “<\/span><span>tie into that place and that context”?<\/span>", "options": ["<span>The tiles are sourced from factories in Portugal and are not readily available elsewhere.<\/span>", "<span>The tiles are baked in an oven and then glazed with ink and fired again at a high temperature.<\/span>", "<span>The tiles are assembled and placed onto old buildings to decorate an otherwise blank space.<\/span>", "<span>The mosaics are designed specifically for the architecture of the building.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>Option 4 is supported by the passage, which states that the mosaics are created specifically for the architecture, so the work’s setting is as critical as the design elements displayed on the tiles.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Specific Detail Question"}, {"number": 3, "sourceId": "16927035315262", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>To <\/span><span>get a real sense of the azulejo tradition is to get a real sense of Portugal. The term azulejo comes from the Arabic word <\/span><span>azzelij<\/span><span>, meaning “little polished stone.” The tilework <\/span><span>dates back to<\/span><span> the 13th century, in the period just after the Moors invaded Portugal and brought parts of their culture to their invaded lands. But it wasn’t until the 16th century that azulejos became a more popular fixture in Portugal. At that time, powerful leaders in the monarchy or church commissioned the mosaics, and production started to take place in-country.<\/span>\r<br>\r<br><span>Today, the materials, especially the distinctive blue ink used on the tiles, tend to be sourced from factories in Portugal, and are not readily available elsewhere. First, the tiles are baked in an oven. Then, an artist spreads each individual glaze color made from potent ink diluted with just the right amount of water over a compact powder on the surface of the tile. Once the glaze is applied, each tile is refired in an ultrahot oven that often exceeds 1,000 degrees Fahrenheit. It’s this glazing process that makes the tiles particularly resilient, and resistant to elements like rain, <\/span><span>sun<\/span><span> and fire. That’s also when the true hues reveal themselves and shine.<\/span>\r<br>\r<br><span>… “One of the first things to notice is the monumental size of the places with coverings of azulejos,” says Alexandre Pais, the director of the National Azulejo Museum. “This sense of monumentality is something that is very specific to Portugal.” Other countries certainly use ceramic tiles to decorate walls and buildings, but not to the same extent and in the same deliberate way as in this country. To the untrained eye, azulejos might just seem like geometric shapes and swirling designs assembled and placed onto any old building to decorate an otherwise blank space. But the mosaics are created specifically for the architecture, so, the work’s setting is as critical as the design elements displayed on the tiles… In other countries, you can remove the tiles and move them from one wall or building to another without losing anything. But in Portugal … many azulejos have figurative scenes, and they tie into that place and that context.<\/span>\r<br>\r<br><span>The other major difference between Portuguese azulejos and other countries’ tilework, Pais says, is that “we are always changing and adjusting to new concepts, new ideas, according to the aspects of the culture at the time.” In the beginning, azulejos were produced outside of Portugal and tended to feature Islamic motifs like knotwork. Then, in the 16th century, when Portuguese leaders began to commission tileworks and the production of azulejos was localized, “a sense of scenography” took hold…<\/span>\r<br>\r<br>… Eventually, azulejos were applied to the facades of buildings, especially in Lisbon, as a more manageable, less expensive way of rebuilding the city infrastructure after its infamous earthquake. The artistry, Pais adds, provided a sense of hope in a time of recovery and growth. During the 20th century, contemporary artists began creating original tilework installations in public settings. “In Portugal, it’s less common to have big sculptures in the center of the square like in Italy or France,” Pais says. “But what we have is walls covered by azulejos, so azulejos become a vehicle, a medium for contemporary artists to express their individuality.”", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which one of the following statements best reflects the main purpose of the third paragraph of the passage?<\/span>", "options": ["<span>To explain the importance of the context and setting in which azulejos are created and displayed in Portugal.<\/span>", "<span>To compare the different types of designs used in azulejos in Portugal and other countries.<\/span>", "<span>To describe azulejos in Portugal as specifically created for the architecture and that they are often tied to the place and context in which they are displayed.<\/span>", "<span>To highlight that azulejos are not simply decorative elements but integral parts of the architectural and cultural identity of Portugal.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>All the options are factually correct. The main purpose is to highlight the uniqueness of azelujos of Portugal and justify the opening remark that “T<\/span><span>o get a real sense of the azulejo tradition is to get a real sense of Portugal.” Nothing else in the passage contributes as much to substantiate this remark as paragraph 3 does.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Inference"}, {"number": 4, "sourceId": "16927035315263", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>To <\/span><span>get a real sense of the azulejo tradition is to get a real sense of Portugal. The term azulejo comes from the Arabic word <\/span><span>azzelij<\/span><span>, meaning “little polished stone.” The tilework <\/span><span>dates back to<\/span><span> the 13th century, in the period just after the Moors invaded Portugal and brought parts of their culture to their invaded lands. But it wasn’t until the 16th century that azulejos became a more popular fixture in Portugal. At that time, powerful leaders in the monarchy or church commissioned the mosaics, and production started to take place in-country.<\/span>\r<br>\r<br><span>Today, the materials, especially the distinctive blue ink used on the tiles, tend to be sourced from factories in Portugal, and are not readily available elsewhere. First, the tiles are baked in an oven. Then, an artist spreads each individual glaze color made from potent ink diluted with just the right amount of water over a compact powder on the surface of the tile. Once the glaze is applied, each tile is refired in an ultrahot oven that often exceeds 1,000 degrees Fahrenheit. It’s this glazing process that makes the tiles particularly resilient, and resistant to elements like rain, <\/span><span>sun<\/span><span> and fire. That’s also when the true hues reveal themselves and shine.<\/span>\r<br>\r<br><span>… “One of the first things to notice is the monumental size of the places with coverings of azulejos,” says Alexandre Pais, the director of the National Azulejo Museum. “This sense of monumentality is something that is very specific to Portugal.” Other countries certainly use ceramic tiles to decorate walls and buildings, but not to the same extent and in the same deliberate way as in this country. To the untrained eye, azulejos might just seem like geometric shapes and swirling designs assembled and placed onto any old building to decorate an otherwise blank space. But the mosaics are created specifically for the architecture, so, the work’s setting is as critical as the design elements displayed on the tiles… In other countries, you can remove the tiles and move them from one wall or building to another without losing anything. But in Portugal … many azulejos have figurative scenes, and they tie into that place and that context.<\/span>\r<br>\r<br><span>The other major difference between Portuguese azulejos and other countries’ tilework, Pais says, is that “we are always changing and adjusting to new concepts, new ideas, according to the aspects of the culture at the time.” In the beginning, azulejos were produced outside of Portugal and tended to feature Islamic motifs like knotwork. Then, in the 16th century, when Portuguese leaders began to commission tileworks and the production of azulejos was localized, “a sense of scenography” took hold…<\/span>\r<br>\r<br>… Eventually, azulejos were applied to the facades of buildings, especially in Lisbon, as a more manageable, less expensive way of rebuilding the city infrastructure after its infamous earthquake. The artistry, Pais adds, provided a sense of hope in a time of recovery and growth. During the 20th century, contemporary artists began creating original tilework installations in public settings. “In Portugal, it’s less common to have big sculptures in the center of the square like in Italy or France,” Pais says. “But what we have is walls covered by azulejos, so azulejos become a vehicle, a medium for contemporary artists to express their individuality.”", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>On the basis of the passage, <\/span><span>all of<\/span><span> the following statements can be regarded as true, EXCEPT:<\/span>", "options": ["<span>The study and appreciation of azulejos can tell us a lot about the history and cultural heritage of Portugal.<\/span>", "<span>Portuguese azulejo <\/span><span>tile-work<\/span><span> is versatile enough to accommodate tile artwork ideas from around the world.<\/span>", "<span>Azulejos were introduced by the Moors and later adopted by the Portuguese, making them <\/span>an important symbol of the country's cultural fusion.", "<span>Azulejos have been used for centuries to decorate public and private buildings, reflecting various artistic and cultural influences.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>Option 1 is true according to the second paragraph of the passage. Option 3 is also true as per the first paragraph. Option 3 is mentioned in the first paragraph and is elaborated upon in the subsequent paragraphs. However, option 2 is not supported by any information in the passage. In fact, the passage emphasizes the specificity and deliberate use of azulejos in Portugal's cultural and architectural contexts. Thus, option 2 can be regarded as false.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Specific Detail Question"}, {"number": 5, "sourceId": "16927035315264", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Although the subfield of urban history had its own institutions and journals since the 1960s, sociologists and other urban scholars have paid little attention to its output… The recent rise of global history, with its affection for long-distance connections and movement, has done nothing to help urban history.<\/span><br><br><span>The resulting present-mindedness of urban studies leads to blind spots. Cities, after all, are products of history and, as such, they change over time. For example, where a specific ethnic community lives in any given city often depends on how their arrival related to the development in time of the city itself. In contrast to New York, Buenos Aires never gave birth to a Little Italy. Chicago School scholarship explained this difference by pointing to the so-called social-distance hypothesis, according to which greater cultural difference between an immigrant group and the host society results in higher levels of the immigrants’ residential concentration. The argument holds that since Italians were socio-culturally not so distant from Argentina’s Catholic Spanish-speaking mainstream, they did not end up in specifically Italian neighbourhoods.<\/span><br><br><span>But as an explanation for why a Little Italy formed in New York but not in Buenos Aires, the social-distance hypothesis turns out not to work. It rests on the flawed assumption that the city had a definite <\/span><span>shape<\/span><span> and we have to ask ourselves only how people spread in it. Yet we also know that Spanish immigrants in Buenos Aires, who shared even more socio-cultural traits with Argentine society than Italians did, nonetheless clustered much more spatially comparatively. Rather than cultural differences between population groups, the key to understanding Buenos Aires’s absent Little Italy is essentially historical, to be found in conditions existing at the time when Italian immigrants arrived and no longer present later, when Spanish immigrants came to Buenos Aires. Italian immigrants arrived <\/span><span>earlier<\/span><span> and they often settled on small rural plots in the then pampas, before the massive growth of the nearby city set in. The Italian immigrants’ wider spread over semi-urban areas (which the metropolis subsequently ate up) led to their relatively even distribution in space shown in later censuses. The city came to the immigrants, not the immigrants to the city; a process for which there is little room in Chicago School theory.<\/span><br><br><span>Much in the life and character of a city depends on when it was born, and by what kind of parents. All cities have more than two parents, some local and others global. Singapore rose to the rank of <\/span>global city due to the forces of British colonialism, the opening of the Suez Canal, the political, <span>economic<\/span><span> and social history of China, and eventually Southeast Asia’s decolonisation… The 19th-century commodity entrepôts of the global South, such as Buenos Aires or Singapore, provide telling examples of how bridgeheads of globalisation work. Their city centres were pivots of power and wealth, while their outskirts accommodated the never-ending stream of rural poor migrating towards cities. Urban theory today would be well advised to learn from such precedents.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following statements, if true, would support the author's criticism of the 'social-distance hypothesis' as the explanation for the formation of 'Little Italy' in New York?\"<\/span>", "options": ["<span>As the population and physical boundaries of New York expanded over time, clusters of Italian immigrant communities within the city tended to disperse and spread.<\/span>", "<span>Clusters of Italian immigrants were not witnessed in the US where immigrant movement had preceded urbanization.<\/span>", "<span>Immigrants settled in and around specific neighborhoods in New York that offered opportunities for better living conditions and economic advancement.<\/span>", "<span>Spanish immigrants settled in Buenos Aires after it developed into a city and created a 'Little Spain' neighborhood, comparable to 'Little Italy' in New York.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>The author argues that the \"social-distance hypothesis\" does not adequately explain why a Little Italy formed in New York (but not in Buenos Aires). The key to understanding Buenos Aires's absent Little Italy is essentially historical, to be found in conditions existing at the time when Italian immigrants arrived and no longer present later, when Spanish immigrants came to Buenos Aires. The Italian immigrants arrived earlier and settled on small rural plots before the massive growth of the nearby city set in. The city came to the immigrants, not the immigrants to the city; a process for which there is little room in Chicago School theory - \"social-distance hypothesis\". This is in contrast to the second statement which highlights that when immigrant movement preceded urbanization, immigrant clusters were not witnessed. This statement supports the author's argument that the historical conditions at the time of immigrant arrival were more important than cultural differences between population groups in determining immigrant clusters.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Application Question"}, {"number": 6, "sourceId": "16927035315275", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Although the subfield of urban history had its own institutions and journals since the 1960s, sociologists and other urban scholars have paid little attention to its output… The recent rise of global history, with its affection for long-distance connections and movement, has done nothing to help urban history.<\/span><br><br><span>The resulting present-mindedness of urban studies leads to blind spots. Cities, after all, are products of history and, as such, they change over time. For example, where a specific ethnic community lives in any given city often depends on how their arrival related to the development in time of the city itself. In contrast to New York, Buenos Aires never gave birth to a Little Italy. Chicago School scholarship explained this difference by pointing to the so-called social-distance hypothesis, according to which greater cultural difference between an immigrant group and the host society results in higher levels of the immigrants’ residential concentration. The argument holds that since Italians were socio-culturally not so distant from Argentina’s Catholic Spanish-speaking mainstream, they did not end up in specifically Italian neighbourhoods.<\/span><br><br><span>But as an explanation for why a Little Italy formed in New York but not in Buenos Aires, the social-distance hypothesis turns out not to work. It rests on the flawed assumption that the city had a definite <\/span><span>shape<\/span><span> and we have to ask ourselves only how people spread in it. Yet we also know that Spanish immigrants in Buenos Aires, who shared even more socio-cultural traits with Argentine society than Italians did, nonetheless clustered much more spatially comparatively. Rather than cultural differences between population groups, the key to understanding Buenos Aires’s absent Little Italy is essentially historical, to be found in conditions existing at the time when Italian immigrants arrived and no longer present later, when Spanish immigrants came to Buenos Aires. Italian immigrants arrived <\/span><span>earlier<\/span><span> and they often settled on small rural plots in the then pampas, before the massive growth of the nearby city set in. The Italian immigrants’ wider spread over semi-urban areas (which the metropolis subsequently ate up) led to their relatively even distribution in space shown in later censuses. The city came to the immigrants, not the immigrants to the city; a process for which there is little room in Chicago School theory.<\/span><br><br><span>Much in the life and character of a city depends on when it was born, and by what kind of parents. All cities have more than two parents, some local and others global. Singapore rose to the rank of <\/span>global city due to the forces of British colonialism, the opening of the Suez Canal, the political, <span>economic<\/span><span> and social history of China, and eventually Southeast Asia’s decolonisation… The 19th-century commodity entrepôts of the global South, such as Buenos Aires or Singapore, provide telling examples of how bridgeheads of globalisation work. Their city centres were pivots of power and wealth, while their outskirts accommodated the never-ending stream of rural poor migrating towards cities. Urban theory today would be well advised to learn from such precedents.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following best describes the point the author makes by comparing Italian immigrants in New York with Spanish immigrants in Buenos Aires?<\/span>", "options": ["<span><\/span>\t<span>The social-distance hypothesis does not explain the reason for the absence of an Italian cluster in Buenos Aires.<\/span>", "<span>Spanish immigrants in Buenos Aires did not face discrimination from the host society compared to Italian immigrants in New York.<\/span>", "<span>The Italian and Spanish immigrants in New York and Buenos Aires, respectively, had different cultural backgrounds that determined their settlement patterns.<\/span>", "<span>The formation of immigrant clusters in a city is solely based on the availability of job and income opportunities.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span>Option 1. This is the correct answer. The author argues that the social-distance hypothesis does not adequately explain why there was a Little Italy in New York but not in Buenos Aires. The author contends that historical factors, not cultural differences between Italian and Spanish immigrants, are the key to understanding the absence of an Italian cluster in Buenos Aires.<\/span>\r<br /><span>Option 2. This statement is not supported by the passage. The author does not discuss discrimination faced by Spanish and Italian immigrants in New York and Buenos Aires.<\/span>\r<br /><span>Option 3. This statement is partly true but does not capture the main point the author is making. While the cultural backgrounds of Italian and Spanish immigrants may have influenced their settlement patterns, the author argues that historical factors played a more significant role in the formation of immigrant clusters in the two cities.<\/span>\r<br /><span>Option 4. This statement is not supported by the passage. While job opportunities may be a factor in the formation of immigrant clusters, the author argues that historical factors and the timing of immigration are more important in explaining the absence or presence of specific immigrant clusters in a city.<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Inference"}, {"number": 7, "sourceId": "16927035315276", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Although the subfield of urban history had its own institutions and journals since the 1960s, sociologists and other urban scholars have paid little attention to its output… The recent rise of global history, with its affection for long-distance connections and movement, has done nothing to help urban history.<\/span><br><br><span>The resulting present-mindedness of urban studies leads to blind spots. Cities, after all, are products of history and, as such, they change over time. For example, where a specific ethnic community lives in any given city often depends on how their arrival related to the development in time of the city itself. In contrast to New York, Buenos Aires never gave birth to a Little Italy. Chicago School scholarship explained this difference by pointing to the so-called social-distance hypothesis, according to which greater cultural difference between an immigrant group and the host society results in higher levels of the immigrants’ residential concentration. The argument holds that since Italians were socio-culturally not so distant from Argentina’s Catholic Spanish-speaking mainstream, they did not end up in specifically Italian neighbourhoods.<\/span><br><br><span>But as an explanation for why a Little Italy formed in New York but not in Buenos Aires, the social-distance hypothesis turns out not to work. It rests on the flawed assumption that the city had a definite <\/span><span>shape<\/span><span> and we have to ask ourselves only how people spread in it. Yet we also know that Spanish immigrants in Buenos Aires, who shared even more socio-cultural traits with Argentine society than Italians did, nonetheless clustered much more spatially comparatively. Rather than cultural differences between population groups, the key to understanding Buenos Aires’s absent Little Italy is essentially historical, to be found in conditions existing at the time when Italian immigrants arrived and no longer present later, when Spanish immigrants came to Buenos Aires. Italian immigrants arrived <\/span><span>earlier<\/span><span> and they often settled on small rural plots in the then pampas, before the massive growth of the nearby city set in. The Italian immigrants’ wider spread over semi-urban areas (which the metropolis subsequently ate up) led to their relatively even distribution in space shown in later censuses. The city came to the immigrants, not the immigrants to the city; a process for which there is little room in Chicago School theory.<\/span><br><br><span>Much in the life and character of a city depends on when it was born, and by what kind of parents. All cities have more than two parents, some local and others global. Singapore rose to the rank of <\/span>global city due to the forces of British colonialism, the opening of the Suez Canal, the political, <span>economic<\/span><span> and social history of China, and eventually Southeast Asia’s decolonisation… The 19th-century commodity entrepôts of the global South, such as Buenos Aires or Singapore, provide telling examples of how bridgeheads of globalisation work. Their city centres were pivots of power and wealth, while their outskirts accommodated the never-ending stream of rural poor migrating towards cities. Urban theory today would be well advised to learn from such precedents.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>According to the passage, why did Spanish immigrants show more clustering in Buenos Aires?<\/span>", "options": ["<span>Due to greater cultural differences between Spanish immigrants and Argentine society compared to Italian immigrants<\/span><span>.<\/span>", "<span>Due to the availability of more economic opportunities in specific areas of Buenos Aires preferred by Spanish immigrants<\/span><span>.<\/span>", "<span>Due to the fact that Spanish immigrants arrived in Buenos Aires after the city had already taken shape, leading to greater spatial concentration<\/span><span>.<\/span>", "<span>Due to the socio-cultural similarities between Spanish immigrants and Argentine society, leading to their clustering in areas with similar cultural practices<\/span><span>.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>Option 1. This option is incorrect because the passage clearly states that Spanish immigrants shared even more socio-cultural traits with Argentine society than Italians did, yet they still clustered much more spatially comparatively.<\/span>\r<br /><span>Option 2. This option is partially correct because the passage mentions that immigrants tend to cluster around areas where they can find work easily. However, it does not provide any evidence to suggest that job opportunities were more available in specific areas preferred by Spanish immigrants.<\/span>\r<br /><span>Option 3. This option is the correct answer according to the passage. The text states that Italian immigrants arrived earlier and settled in semi-urban areas, which were later eaten up by the growth of the nearby city. This led to their relatively even distribution in space shown in later censuses. In contrast, Spanish immigrants arrived after the city had taken shape, and thus their clustering can be attributed to historical conditions.<\/span>\r<br /><span>Option 4. This option is incorrect because the passage states that Spanish immigrants shared more socio-cultural traits with Argentine society than Italians did, yet they still clustered more spatially. Therefore, socio-cultural similarities are not the reason for Spanish immigrants' clustering.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Inference"}, {"number": 8, "sourceId": "16927035315277", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Although the subfield of urban history had its own institutions and journals since the 1960s, sociologists and other urban scholars have paid little attention to its output… The recent rise of global history, with its affection for long-distance connections and movement, has done nothing to help urban history.<\/span><br><br><span>The resulting present-mindedness of urban studies leads to blind spots. Cities, after all, are products of history and, as such, they change over time. For example, where a specific ethnic community lives in any given city often depends on how their arrival related to the development in time of the city itself. In contrast to New York, Buenos Aires never gave birth to a Little Italy. Chicago School scholarship explained this difference by pointing to the so-called social-distance hypothesis, according to which greater cultural difference between an immigrant group and the host society results in higher levels of the immigrants’ residential concentration. The argument holds that since Italians were socio-culturally not so distant from Argentina’s Catholic Spanish-speaking mainstream, they did not end up in specifically Italian neighbourhoods.<\/span><br><br><span>But as an explanation for why a Little Italy formed in New York but not in Buenos Aires, the social-distance hypothesis turns out not to work. It rests on the flawed assumption that the city had a definite <\/span><span>shape<\/span><span> and we have to ask ourselves only how people spread in it. Yet we also know that Spanish immigrants in Buenos Aires, who shared even more socio-cultural traits with Argentine society than Italians did, nonetheless clustered much more spatially comparatively. Rather than cultural differences between population groups, the key to understanding Buenos Aires’s absent Little Italy is essentially historical, to be found in conditions existing at the time when Italian immigrants arrived and no longer present later, when Spanish immigrants came to Buenos Aires. Italian immigrants arrived <\/span><span>earlier<\/span><span> and they often settled on small rural plots in the then pampas, before the massive growth of the nearby city set in. The Italian immigrants’ wider spread over semi-urban areas (which the metropolis subsequently ate up) led to their relatively even distribution in space shown in later censuses. The city came to the immigrants, not the immigrants to the city; a process for which there is little room in Chicago School theory.<\/span><br><br><span>Much in the life and character of a city depends on when it was born, and by what kind of parents. All cities have more than two parents, some local and others global. Singapore rose to the rank of <\/span>global city due to the forces of British colonialism, the opening of the Suez Canal, the political, <span>economic<\/span><span> and social history of China, and eventually Southeast Asia’s decolonisation… The 19th-century commodity entrepôts of the global South, such as Buenos Aires or Singapore, provide telling examples of how bridgeheads of globalisation work. Their city centres were pivots of power and wealth, while their outskirts accommodated the never-ending stream of rural poor migrating towards cities. Urban theory today would be well advised to learn from such precedents.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span>As suggested in the passage, which of the following is NOT considered a potential flaw of the current approach to urban history?<\/span>", "options": ["<span>Lack of attention to the historical context in which the cities developed.<\/span>", "<span>Overemphasis on the role of socio-cultural differences in shaping urban patterns.<\/span>", "<span>Failure to recognize the heterogeneity of urban experiences and urban forms.<\/span>", "<span>Narrowing of the scope of urban history to a few select cities and regions.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>Option 1.  Not an exception. This refers to the problem of not considering the historical conditions and factors that led to the formation and development of a city. In the context of the&nbsp;<\/span>passage, the Chicago School of Urban History is criticized for not taking into account the historical conditions that led to the formation of Little Italy in New York but not in Buenos Aires.\r<br /><span>Option 2. Not an exception.  This refers to the problem of giving too much importance to social and cultural factors and ignoring other factors that may influence urban development. In the context of the passage, the social-distance hypothesis is criticized for overemphasizing the role of cultural differences in shaping urban patterns and ignoring the historical and physical factors.<\/span>\r<br /><span>Option 3. Not an exception.  This refers to the problem of not acknowledging the diverse experiences and forms of urbanism in different parts of the world. In the context of the passage, the social-distance hypothesis is criticized for not recognizing the diversity of urban forms and experiences in Buenos Aires and New York.<\/span>\r<br /><span>Option 4. There is no suggestion in the passage that a few select cities have been studied at the expense of others. Exception.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Inference"}, {"number": 9, "sourceId": "16927035315278", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Alongside the industrial and the digital revolutions, the modern era has witnessed a happiness revolution. The scientific study, laboratory refinement, and industrial production of happiness are all big business. But just as mass-produced plastic items lack any lingering aura of the artisanship packed into the traditional crafts these items supplant, so too the isolated, distilled, and monetized product that has been studied and developed and sold back to us as happiness shows little continuity with traditional articulations of what happiness is.<\/span><br><br><span>For millennia, philosophers have been aware that happiness is a concept difficult to define, as much as it is a condition difficult to achieve. Many, though not all, ancient philosophers warned against conflating happiness with a current sensation of contentment or pleasure, preferring to understand it as a long-term condition of the soul, or as a dimension of moral character. But many also argued that happiness is an objective state that attaches to a given individual whether that individual has any first-person experience of it or not.<\/span><br><br><span>For Aristotle our happiness is dependent on our virtue — it is “an activity of the soul expressing virtue” — while our virtue, or aretḗ, is simply the <\/span><span>particular excellence<\/span><span> appropriate to a human being, just as the excellence of a knife is wrapped up in its cutting and the excellence of fire in its burning. This means that, in an important respect for Aristotle, an acorn that manages to become an oak, thereby realizing the <\/span><span>particular excellence<\/span><span> that was contained within it in potentia, is also happy, or at least is in a state that is not totally distinct from what we recognize as happiness in human beings.<\/span><br><br><span>If happiness is understood in this way, as a set of circumstances quite independent of any subjective experience of them, the project of isolating its “molecules” and selling it to the public appears downright absurd. You can sell a person a lottery ticket, but you cannot sell them the luck that <\/span>would make it the winning one. That involves a whole cosmic arrangement that precedes us and frames our existence.<br><br><span>In the happiness experts’ efforts to isolate the fundamental molecules of happiness and to measure happiness by quantitative means, they have wittingly or not rendered happiness into something money-like, where having more units of it makes you better off and having fewer does the opposite. While happiness studies as a field is deeply invested in surmounting and contrasting itself with the science of economics, nonetheless it is often to economics that this field looks <\/span><span>as<\/span><span> its imperfect ancestor. Happiness studies seeks to position itself as economics with a human face. (More precisely, with a smiley face.)<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following statements best represents the essence of the passage?<\/span>", "options": ["<span>Happiness is a long-term condition of the soul or a dimension of moral character, and it cannot be isolated, distilled, and monetized like a product.<\/span>", "<span>The scientific study and commercialization of happiness have rendered it into something money-like, where having more of it makes you better off and less does the opposite.<\/span>", "<span>The current approach to happiness equates it with the possession of money and fails to acknowledge the complex and multifaceted nature of happiness as a subjective experience.<\/span>", "<span>The scientific study of happiness, the interventions aimed at increasing it, and its commercialization have transformed happiness into a commodity.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>The passage discusses how the scientific study and industrial production of happiness have turned happiness into something that can be bought and sold like a product. The author argues that this approach to happiness is misguided, as happiness cannot be isolated and quantified like a material object. He does not attempt to explain what happiness is.<\/span>\r<br /><span>Option 1. Partially correct, as the passage does discuss how happiness is difficult to define and achieve, and how it cannot be isolated and monetized like a product. However, this option is not comprehensive enough to represent the overall essence of the passage, as it does not fully capture the author's argument against the scientific study and industrial production of happiness.<\/span>\r<br /><span>Option 2. Correct.<\/span>\r<br /><span>Option 3. Partially correct. The second part is incorrect – it is a common-sense idea not supported by the passage.<\/span>\r<br /><span>Option 4. Partially correct. The use of the term ‘commodity’, though correct, does not make the main argument as clear as option 2 does.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Central Idea"}, {"number": 10, "sourceId": "16927035315289", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Alongside the industrial and the digital revolutions, the modern era has witnessed a happiness revolution. The scientific study, laboratory refinement, and industrial production of happiness are all big business. But just as mass-produced plastic items lack any lingering aura of the artisanship packed into the traditional crafts these items supplant, so too the isolated, distilled, and monetized product that has been studied and developed and sold back to us as happiness shows little continuity with traditional articulations of what happiness is.<\/span><br><br><span>For millennia, philosophers have been aware that happiness is a concept difficult to define, as much as it is a condition difficult to achieve. Many, though not all, ancient philosophers warned against conflating happiness with a current sensation of contentment or pleasure, preferring to understand it as a long-term condition of the soul, or as a dimension of moral character. But many also argued that happiness is an objective state that attaches to a given individual whether that individual has any first-person experience of it or not.<\/span><br><br><span>For Aristotle our happiness is dependent on our virtue — it is “an activity of the soul expressing virtue” — while our virtue, or aretḗ, is simply the <\/span><span>particular excellence<\/span><span> appropriate to a human being, just as the excellence of a knife is wrapped up in its cutting and the excellence of fire in its burning. This means that, in an important respect for Aristotle, an acorn that manages to become an oak, thereby realizing the <\/span><span>particular excellence<\/span><span> that was contained within it in potentia, is also happy, or at least is in a state that is not totally distinct from what we recognize as happiness in human beings.<\/span><br><br><span>If happiness is understood in this way, as a set of circumstances quite independent of any subjective experience of them, the project of isolating its “molecules” and selling it to the public appears downright absurd. You can sell a person a lottery ticket, but you cannot sell them the luck that <\/span>would make it the winning one. That involves a whole cosmic arrangement that precedes us and frames our existence.<br><br><span>In the happiness experts’ efforts to isolate the fundamental molecules of happiness and to measure happiness by quantitative means, they have wittingly or not rendered happiness into something money-like, where having more units of it makes you better off and having fewer does the opposite. While happiness studies as a field is deeply invested in surmounting and contrasting itself with the science of economics, nonetheless it is often to economics that this field looks <\/span><span>as<\/span><span> its imperfect ancestor. Happiness studies seeks to position itself as economics with a human face. (More precisely, with a smiley face.)<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following best describes the \"happiness revolution\" mentioned in the passage?<\/span>", "options": ["<span>Consumerism involving the mass production and marketing of products aimed at promoting happiness.<\/span>", "<span>A modern movement that has emerged with the goal of achieving greater individual happiness.<\/span>", "<span>The scientific study of happiness involving laboratory isolation and refinement for its digital measurement.<\/span>", "<span>The continuing philosophical inquiry into the nature of happiness that began in ancient times.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>The passage describes the \"happiness revolution\" as an effort towards greater individual happiness that has emerged in modern times. This can be inferred from paragraphs 4 and 5 rather than from the first paragraph where the author mentions ‘happiness revolution’. The author states that the ‘happiness revolution’ came along with the industrial and the digital revolutions. He does not quite relate them to one another. Hence Options 1 and 3 are incorrect because option 1 relates industrial revolution to ‘happiness industry’, whereas the passage states that the “industrial production of happiness is big business.” In other words, happiness itself is mass-produced. Option 3&nbsp;<\/span>similarly without information in the passage, links it to digital measurement. Option 4 is more easily eliminated as the history of the inquiry into the nature of happiness is mentioned only as background information. Industrial production of happiness combined with the information in paragraphs 4 and 5, option 2 is inferable.\r<br /><span>Hence, [2].<\/span>", "topic": "Inference"}, {"number": 11, "sourceId": "169270353152810", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Alongside the industrial and the digital revolutions, the modern era has witnessed a happiness revolution. The scientific study, laboratory refinement, and industrial production of happiness are all big business. But just as mass-produced plastic items lack any lingering aura of the artisanship packed into the traditional crafts these items supplant, so too the isolated, distilled, and monetized product that has been studied and developed and sold back to us as happiness shows little continuity with traditional articulations of what happiness is.<\/span><br><br><span>For millennia, philosophers have been aware that happiness is a concept difficult to define, as much as it is a condition difficult to achieve. Many, though not all, ancient philosophers warned against conflating happiness with a current sensation of contentment or pleasure, preferring to understand it as a long-term condition of the soul, or as a dimension of moral character. But many also argued that happiness is an objective state that attaches to a given individual whether that individual has any first-person experience of it or not.<\/span><br><br><span>For Aristotle our happiness is dependent on our virtue — it is “an activity of the soul expressing virtue” — while our virtue, or aretḗ, is simply the <\/span><span>particular excellence<\/span><span> appropriate to a human being, just as the excellence of a knife is wrapped up in its cutting and the excellence of fire in its burning. This means that, in an important respect for Aristotle, an acorn that manages to become an oak, thereby realizing the <\/span><span>particular excellence<\/span><span> that was contained within it in potentia, is also happy, or at least is in a state that is not totally distinct from what we recognize as happiness in human beings.<\/span><br><br><span>If happiness is understood in this way, as a set of circumstances quite independent of any subjective experience of them, the project of isolating its “molecules” and selling it to the public appears downright absurd. You can sell a person a lottery ticket, but you cannot sell them the luck that <\/span>would make it the winning one. That involves a whole cosmic arrangement that precedes us and frames our existence.<br><br><span>In the happiness experts’ efforts to isolate the fundamental molecules of happiness and to measure happiness by quantitative means, they have wittingly or not rendered happiness into something money-like, where having more units of it makes you better off and having fewer does the opposite. While happiness studies as a field is deeply invested in surmounting and contrasting itself with the science of economics, nonetheless it is often to economics that this field looks <\/span><span>as<\/span><span> its imperfect ancestor. Happiness studies seeks to position itself as economics with a human face. (More precisely, with a smiley face.)<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Based on the passage, which of the following best describes the relationship between happiness studies and economics?<\/span>", "options": ["<span>Happiness studies and economics are distinct disciplines that strive to measure and explain human happiness, sometimes in competition with each other.<\/span>", "<span>Happiness studies seeks to replace economics as the dominant approach to understanding human well-being.<\/span>", "<span>Happiness studies draws on the concepts and methods of economics, and sees economics as <\/span>a precursor to its own field.", "<span>Happiness studies is a broad field with ancient roots, while economics emerged as a subset of happiness studies.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>The passage describes the relationship between happiness studies and economics as one of both contrast and connection. On the one hand, happiness studies is deeply invested in contrasting itself with the science of economics, and seeks to position itself as \"economics with a human face\". On the other hand, happiness studies often looks to economics as an imperfect ancestor, and is influenced by some of the concepts and methods of economics. Therefore, answer choice 3 is the best description of the relationship between happiness studies and economics, and is supported by the passage. The other answer choices are not supported by the passage. While it is true that happiness studies and economics are not completely unrelated, their functions are misrepresented in option 1.  so option 1 is incorrect. Similarly, while happiness studies may seek to supplant economics in some contexts, this is not the main relationship between the two fields, so answer choice 2 is incorrect. While happiness studies may draw on concepts from economics, it is not a subset of economics, so answer choice 4 is incorrect.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Specific Detail Question"}, {"number": 12, "sourceId": "169270353152811", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Alongside the industrial and the digital revolutions, the modern era has witnessed a happiness revolution. The scientific study, laboratory refinement, and industrial production of happiness are all big business. But just as mass-produced plastic items lack any lingering aura of the artisanship packed into the traditional crafts these items supplant, so too the isolated, distilled, and monetized product that has been studied and developed and sold back to us as happiness shows little continuity with traditional articulations of what happiness is.<\/span><br><br><span>For millennia, philosophers have been aware that happiness is a concept difficult to define, as much as it is a condition difficult to achieve. Many, though not all, ancient philosophers warned against conflating happiness with a current sensation of contentment or pleasure, preferring to understand it as a long-term condition of the soul, or as a dimension of moral character. But many also argued that happiness is an objective state that attaches to a given individual whether that individual has any first-person experience of it or not.<\/span><br><br><span>For Aristotle our happiness is dependent on our virtue — it is “an activity of the soul expressing virtue” — while our virtue, or aretḗ, is simply the <\/span><span>particular excellence<\/span><span> appropriate to a human being, just as the excellence of a knife is wrapped up in its cutting and the excellence of fire in its burning. This means that, in an important respect for Aristotle, an acorn that manages to become an oak, thereby realizing the <\/span><span>particular excellence<\/span><span> that was contained within it in potentia, is also happy, or at least is in a state that is not totally distinct from what we recognize as happiness in human beings.<\/span><br><br><span>If happiness is understood in this way, as a set of circumstances quite independent of any subjective experience of them, the project of isolating its “molecules” and selling it to the public appears downright absurd. You can sell a person a lottery ticket, but you cannot sell them the luck that <\/span>would make it the winning one. That involves a whole cosmic arrangement that precedes us and frames our existence.<br><br><span>In the happiness experts’ efforts to isolate the fundamental molecules of happiness and to measure happiness by quantitative means, they have wittingly or not rendered happiness into something money-like, where having more units of it makes you better off and having fewer does the opposite. While happiness studies as a field is deeply invested in surmounting and contrasting itself with the science of economics, nonetheless it is often to economics that this field looks <\/span><span>as<\/span><span> its imperfect ancestor. Happiness studies seeks to position itself as economics with a human face. (More precisely, with a smiley face.)<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>None of the following statements is implied by the arguments of the passage, EXCEPT:<\/span>", "options": ["<span>The scientific study of happiness can provide insights into the factors that contribute to happiness, which can inform policies and interventions to improve well-being.<\/span>", "<span>The laboratory refinement of happiness can help identify practices that can enhance happiness for individuals seeking to improve their own happiness.<\/span>", "<span>The modern approach to happiness recognizes happiness as a desirable state, which can help shift societal values away from purely materialistic goals.<\/span>", "<span>The emphasis on objective, measurable happiness ignores the subjective experiences and perceptions of individuals, which may differ from quantitative measures.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>(none is implied except = which one is implied)<\/span>\r<br /><span>The passage is completely critical of the modern approach to happiness and cites various inadequacies and limitations of the ‘happiness revolution’ – among them: The scientific study and laboratory refinement of happiness reduce it to a quantifiable and isolated product, detached from its traditional definitions and meanings. The monetization of happiness turns it into a commodity, where having more of it is seen as better and having less is worse, rather than recognizing its complex and subjective nature. It focuses on immediate pleasure or contentment, rather than the more complex and long-term condition of the soul or moral character, and that the emphasis on objective, measurable happiness ignores the subjective experiences and perceptions of individuals, which may differ from quantitative measures. Hence the only inference possible from the passage is option 4. Note also, that the author does not explicitly or implicitly suggest any advantage of the modern approach. Hence options 1, 2 and 3, though possible by wide extrapolation, are still possibilities and not inferences that can be made from the passage.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Inference"}, {"number": 13, "sourceId": "169270353152812", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Social scientists distinguish between what are known as treatment effects and selection effects. The Marine Corps, for instance, is largely a treatment-effect institution. It doesn’t have an enormous admissions office grading applicants along four separate dimensions of toughness and intelligence. A modelling agency, by contrast, is a selection-effect institution. You get signed up by an agency because you’re beautiful.<\/span><br><br><span>At the heart of the American obsession with the Ivy League is the belief that schools like Harvard provide the social and intellectual equivalent of Marine Corps basic training—that being taught by brilliant professors and meeting other motivated students and getting a degree with that powerful name on it will confer advantages that no local state university can provide. Fueling the treatment-effect idea are studies showing that if you take two students with the same S.A.T. scores and grades, one of whom goes to a school like Harvard makes far more money ten or twenty years down the road than the other.<\/span><br><br><span>How do we know that two students who have the same S.A.T. scores and grades really are equivalent? It’s quite possible that the student who goes to Harvard is more ambitious and energetic and personable and that those same intangibles are what account for his better career success. To assess the effect of the Ivies, it makes more sense to compare the student who got into a top school with the student who got into that same school but chose to go to a less selective one. Three years ago, the economists Alan Krueger and Stacy Dale published just such a study. And they found that when you compare apples and apples the income bonus from selective schools disappears.<\/span><br><br><span>“As a hypothetical example, take the University of Pennsylvania and Penn State, which are two schools a lot of students choose between,” Krueger said. “One is Ivy, one is a state school. Penn is much more highly selective. If you compare the students who go to those two schools, the ones who go to Penn have higher incomes. But let’s look at those who got into both types of schools, some of whom chose Penn and some of whom chose Penn State. Within that set it doesn’t seem to matter whether you go to the more selective school. Now, you would think that the more ambitious student is the one who would choose to go to Penn, and the ones choosing to go to Penn State might be a little less confident in their abilities or have a little lower family income, and both of those factors would point to people doing worse <\/span><span>later on<\/span><span>. But they don’t.”<\/span><br><br><span>Krueger notes that students from the lowest economic strata may benefit from attending an Ivy League school, but for most students, being hardworking and intelligent is enough to achieve success regardless of where they go to school. While attending an Ivy League school may offer networking opportunities, a school like Penn State is diverse enough to provide similar advantages. Ultimately, having an Ivy League school on one's resume may open some doors, but if a student was able to gain admission, they likely possess the qualities to succeed regardless of their alma mater.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Based on the information in the first paragraph, which of the following does NOT exemplify selection-effect?<\/span>", "options": ["<span><\/span>\t<span>Choosing a policy intervention, such as a new tax policy or social welfare program based on the impact of the policy intervention.<\/span>", "<span>Choosing job candidates based on characteristics, such as experience, education, and skills, that predict success in the job.<\/span>", "<span>Choosing participants in clinical trials based on age, gender, and medical history that may impact the outcome of the trial.<\/span>", "<span>Choosing athletes for a team based on physical attributes, such as height, weight, and speed, that predict success in the sport.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span>The correct answer to the question is 1. Choosing a policy intervention, such as a new tax policy or social welfare program based on the impact of the policy intervention, is an example of treatment effect, not selection effect. Treatment effect refers to the effect of an intervention, such&nbsp;<\/span>as a policy or program, on a particular outcome. In contrast, selection effect refers to the process of selecting individuals or groups based on certain characteristics or attributes that may impact the outcome of interest. Option 2 is an example of selection effect because it involves selecting job candidates based on certain characteristics that predict success in the job. Option 3 is also an example of selection effect because it involves selecting clinical trial participants based on certain characteristics that may impact the outcome of the trial. Option 4 is another example of selection effect because it involves selecting athletes for a team based on certain physical attributes that predict success in the sport.\r<br /><span>Hence, [1].<\/span>", "topic": "Application Question"}, {"number": 14, "sourceId": "169270353152913", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Social scientists distinguish between what are known as treatment effects and selection effects. The Marine Corps, for instance, is largely a treatment-effect institution. It doesn’t have an enormous admissions office grading applicants along four separate dimensions of toughness and intelligence. A modelling agency, by contrast, is a selection-effect institution. You get signed up by an agency because you’re beautiful.<\/span><br><br><span>At the heart of the American obsession with the Ivy League is the belief that schools like Harvard provide the social and intellectual equivalent of Marine Corps basic training—that being taught by brilliant professors and meeting other motivated students and getting a degree with that powerful name on it will confer advantages that no local state university can provide. Fueling the treatment-effect idea are studies showing that if you take two students with the same S.A.T. scores and grades, one of whom goes to a school like Harvard makes far more money ten or twenty years down the road than the other.<\/span><br><br><span>How do we know that two students who have the same S.A.T. scores and grades really are equivalent? It’s quite possible that the student who goes to Harvard is more ambitious and energetic and personable and that those same intangibles are what account for his better career success. To assess the effect of the Ivies, it makes more sense to compare the student who got into a top school with the student who got into that same school but chose to go to a less selective one. Three years ago, the economists Alan Krueger and Stacy Dale published just such a study. And they found that when you compare apples and apples the income bonus from selective schools disappears.<\/span><br><br><span>“As a hypothetical example, take the University of Pennsylvania and Penn State, which are two schools a lot of students choose between,” Krueger said. “One is Ivy, one is a state school. Penn is much more highly selective. If you compare the students who go to those two schools, the ones who go to Penn have higher incomes. But let’s look at those who got into both types of schools, some of whom chose Penn and some of whom chose Penn State. Within that set it doesn’t seem to matter whether you go to the more selective school. Now, you would think that the more ambitious student is the one who would choose to go to Penn, and the ones choosing to go to Penn State might be a little less confident in their abilities or have a little lower family income, and both of those factors would point to people doing worse <\/span><span>later on<\/span><span>. But they don’t.”<\/span><br><br><span>Krueger notes that students from the lowest economic strata may benefit from attending an Ivy League school, but for most students, being hardworking and intelligent is enough to achieve success regardless of where they go to school. While attending an Ivy League school may offer networking opportunities, a school like Penn State is diverse enough to provide similar advantages. Ultimately, having an Ivy League school on one's resume may open some doors, but if a student was able to gain admission, they likely possess the qualities to succeed regardless of their alma mater.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>According to Alan Krueger, the fact that one who goes to “a school like Harvard makes far more money” does NOT indicate that:<\/span>", "options": ["<span>the treatment-effect principle followed in the selection process is not effective.<\/span>", "<span>the selection-effect principle followed in the selection process is not effective.<\/span>", "<span>if the same student did not go to Harvard, he would not earn that much.<\/span>", "<span>if the same student did not go to Harvard, he would still earn that much.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>In the passage, Alan Krueger argued that the income advantage attributed to attending selective schools like Harvard disappears when comparing students who got into the same schools but chose different options. He suggests that it's more likely that intangibles like ambition and energy contribute to better career success rather than the prestige of attending an Ivy League institution. Krueger's point is that simply observing that students who attend Harvard end up making more money does not necessarily imply that attending Harvard is the cause of their success. It could be that the students who are accepted into Harvard are already more ambitious, energetic, and personable than those who are not accepted. Therefore, Krueger's argument does not imply that attending Harvard necessarily leads to higher earnings, but rather that other factors such as the qualities of the student who attends Harvard also play an important role in determining future success.<\/span>\r<br /><span>Option 1. Harvard does not follow the treatment effect principle – it is the American obsession.<\/span>\r<br /><span>Option 2. Krueger’s research does not challenge this. Though it attributes other causes to the students’ financial success, selection also helps in a Harvard student earning more.<\/span>\r<br /><span>Option 4. This is equivalent to option 1. Applicable only to those who get into both Penn and Penn State.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Inference"}, {"number": 15, "sourceId": "169270353152914", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Social scientists distinguish between what are known as treatment effects and selection effects. The Marine Corps, for instance, is largely a treatment-effect institution. It doesn’t have an enormous admissions office grading applicants along four separate dimensions of toughness and intelligence. A modelling agency, by contrast, is a selection-effect institution. You get signed up by an agency because you’re beautiful.<\/span><br><br><span>At the heart of the American obsession with the Ivy League is the belief that schools like Harvard provide the social and intellectual equivalent of Marine Corps basic training—that being taught by brilliant professors and meeting other motivated students and getting a degree with that powerful name on it will confer advantages that no local state university can provide. Fueling the treatment-effect idea are studies showing that if you take two students with the same S.A.T. scores and grades, one of whom goes to a school like Harvard makes far more money ten or twenty years down the road than the other.<\/span><br><br><span>How do we know that two students who have the same S.A.T. scores and grades really are equivalent? It’s quite possible that the student who goes to Harvard is more ambitious and energetic and personable and that those same intangibles are what account for his better career success. To assess the effect of the Ivies, it makes more sense to compare the student who got into a top school with the student who got into that same school but chose to go to a less selective one. Three years ago, the economists Alan Krueger and Stacy Dale published just such a study. And they found that when you compare apples and apples the income bonus from selective schools disappears.<\/span><br><br><span>“As a hypothetical example, take the University of Pennsylvania and Penn State, which are two schools a lot of students choose between,” Krueger said. “One is Ivy, one is a state school. Penn is much more highly selective. If you compare the students who go to those two schools, the ones who go to Penn have higher incomes. But let’s look at those who got into both types of schools, some of whom chose Penn and some of whom chose Penn State. Within that set it doesn’t seem to matter whether you go to the more selective school. Now, you would think that the more ambitious student is the one who would choose to go to Penn, and the ones choosing to go to Penn State might be a little less confident in their abilities or have a little lower family income, and both of those factors would point to people doing worse <\/span><span>later on<\/span><span>. But they don’t.”<\/span><br><br><span>Krueger notes that students from the lowest economic strata may benefit from attending an Ivy League school, but for most students, being hardworking and intelligent is enough to achieve success regardless of where they go to school. While attending an Ivy League school may offer networking opportunities, a school like Penn State is diverse enough to provide similar advantages. Ultimately, having an Ivy League school on one's resume may open some doors, but if a student was able to gain admission, they likely possess the qualities to succeed regardless of their alma mater.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following can be validly inferred from Paragraph 4?<\/span>", "options": ["<span>Selectivity of a school plays no important role in determining the future earnings of its students.<\/span>", "<span>Students who attend Penn State are equally capable of acquiring incomes as high as those <\/span>who attend Penn.", "<span>Students who were accepted to <\/span><span>both but<\/span><span> chose Penn State demonstrated the effect of treatment effect in college education.<\/span>", "<span>The higher earnings of Penn students are due to the selection effect in college education.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>Paragraph 4 discusses a hypothetical example used by Alan Krueger to illustrate the selection effect in college education. Krueger compares the University of Pennsylvania, which is an Ivy League school and highly selective, with Penn State, a state school with lower selectivity. He notes that students who attend Penn tend to have higher incomes compared to those who attend Penn State. However, Krueger points out that when you compare students who were accepted to both schools, there is no significant difference in their future earnings whether they attended Penn or Penn State. There is no treatment-effect (Option3). This finding suggests that the higher earnings of Penn students are not necessarily due to the superior education they receive, but rather due to the selective process (Option 4) that admits students with characteristics that predict success. Krueger's example implies that the selectivity of a school plays an important role in determining the future earnings of its students.(Option 1) This means that high-achieving students who attend&nbsp;<\/span>selective schools tend to have higher future earnings, not necessarily because of the quality of education they receive, but because of the selection effect that favors students with characteristics that predict success. Option 2 is true only about those students who possess other qualities as well.\r<br /><span>Hence, [4].<\/span>", "topic": "Inference"}, {"number": 16, "sourceId": "169270353152915", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Social scientists distinguish between what are known as treatment effects and selection effects. The Marine Corps, for instance, is largely a treatment-effect institution. It doesn’t have an enormous admissions office grading applicants along four separate dimensions of toughness and intelligence. A modelling agency, by contrast, is a selection-effect institution. You get signed up by an agency because you’re beautiful.<\/span><br><br><span>At the heart of the American obsession with the Ivy League is the belief that schools like Harvard provide the social and intellectual equivalent of Marine Corps basic training—that being taught by brilliant professors and meeting other motivated students and getting a degree with that powerful name on it will confer advantages that no local state university can provide. Fueling the treatment-effect idea are studies showing that if you take two students with the same S.A.T. scores and grades, one of whom goes to a school like Harvard makes far more money ten or twenty years down the road than the other.<\/span><br><br><span>How do we know that two students who have the same S.A.T. scores and grades really are equivalent? It’s quite possible that the student who goes to Harvard is more ambitious and energetic and personable and that those same intangibles are what account for his better career success. To assess the effect of the Ivies, it makes more sense to compare the student who got into a top school with the student who got into that same school but chose to go to a less selective one. Three years ago, the economists Alan Krueger and Stacy Dale published just such a study. And they found that when you compare apples and apples the income bonus from selective schools disappears.<\/span><br><br><span>“As a hypothetical example, take the University of Pennsylvania and Penn State, which are two schools a lot of students choose between,” Krueger said. “One is Ivy, one is a state school. Penn is much more highly selective. If you compare the students who go to those two schools, the ones who go to Penn have higher incomes. But let’s look at those who got into both types of schools, some of whom chose Penn and some of whom chose Penn State. Within that set it doesn’t seem to matter whether you go to the more selective school. Now, you would think that the more ambitious student is the one who would choose to go to Penn, and the ones choosing to go to Penn State might be a little less confident in their abilities or have a little lower family income, and both of those factors would point to people doing worse <\/span><span>later on<\/span><span>. But they don’t.”<\/span><br><br><span>Krueger notes that students from the lowest economic strata may benefit from attending an Ivy League school, but for most students, being hardworking and intelligent is enough to achieve success regardless of where they go to school. While attending an Ivy League school may offer networking opportunities, a school like Penn State is diverse enough to provide similar advantages. Ultimately, having an Ivy League school on one's resume may open some doors, but if a student was able to gain admission, they likely possess the qualities to succeed regardless of their alma mater.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which one of the following statements, if false, could be seen as contradicting the facts/arguments in the passage?<\/span>", "options": ["<span>Higher earnings for Ivy League graduates account for selection effects.<\/span>", "<span>Ivy League students are often more ambitious and energetic than their peers.<\/span>", "<span>Alan Krueger’s study made the income bonus from selective schools evident.<\/span>", "<p><span>Attending Ivy League schools offers unique networking opportunities.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p>&lsquo;If false &hellip; contradicts the passage&rsquo; means&nbsp;which of the following &hellip; supports the passage? <br /><br />Option 1. If false: Higher earnings for Ivy League graduates&nbsp;do not account for
