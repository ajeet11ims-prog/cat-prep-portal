 selection effects. It does not contradict the passage. <br />Option 2. If false: Ivy League students are often&nbsp;not more ambitious and energetic than their peers. This contradicts the passage. Hence the answer. <br />Option 3. If false: Alan Krueger&rsquo;s study did not make the income bonus from selective school evident. It made the bonus disappear. It does not contradict the passage. <br />Option 4.&nbsp; If false:&nbsp; Attending Ivy League schools does not offer unique networking opportunities.- It does not contradict the passage as Penn State also offers &ldquo;similar advantages&rdquo;. (It is nothing unique) <br />Hence, [2].<\/p>", "topic": "Inference"}, {"number": 17, "sourceId": "169270353152916", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br><span>1.<\/span>\t<span>Their fears were reasonable: global population has doubled twice since then to reach 8 billion.<\/span><br>2.\t<span>Malthus famously ignited furious arguments in the nineteenth century when he warned that population growth would outpace agricultural growth and cause recurrent bouts of famine and pestilence.<\/span><br>3.\t<span>In the 1960s, Paul and Anne Ehrlich added fuel to the fire with their bestseller, ‘The Population Bomb.’<\/span><br>4.\t<span>Industrialization would postpone the crisis, but not forever.<\/span><br><br><span>", "options": [], "answer": "2431", "answerLabel": "2431", "solution": "<\/span>\t<span>Sentence 1. “their fears were reasonable” … needs an antecedent.<\/span>\r<br /><span>Sentence 2. Suitable for the beginning.<\/span>\r<br /><span>Sentence 3. Could be placed immediately after sentence 2 or later after 2.<\/span>\r<br /><span>Sentence 4. ‘the crisis’ refers to a crisis.<\/span>\r<br /><span>2431 is a possible sequence. 2341 is another. The only question is whether 4 should be placed immediately after 2 or after 2-3. Since ‘the crisis’ is made explicit in sentence 2 and not in sentence 3, 2431 is a better sequence.<\/span>\r<br /><span>Therefore, the required answer is 2431.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 18, "sourceId": "169270353153217", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br><span>1.<\/span>\t<span>Globalization has been a part of human history for a long time and, it is a mistake to conclude that it is over.<\/span><br>2.\t<span>Military and sociocultural globalizations also have a long history, with religions spreading <\/span>across multiple continents and empires spanning three.<br>3.\t<span>Migration and climate change have been driving factors of globalization since ancient times, leading to biological interactions and interdependencies.<\/span><br>4.\t<span>Globalization is simply the growth of interdependence at intercontinental, rather than national or regional, distances, which is neither good nor <\/span><span>bad in itself<\/span><span>.<\/span><br><br><span>", "options": [], "answer": "1432", "answerLabel": "1432", "solution": "<\/span>\t<span>Sentence 1. General Statement. Could be the starter.<\/span>\r<br /><span>Sentence 2. “also have a long history…”. Some other instance of long history will precede. Can relate to 1 too.<\/span>\r<br /><span>Sentence 3. Another instance of long, or ancient history. 3-2 could be a pair.<\/span>\r<br />Sentence 4. Implication of globalisation. 1-4 could be a pair too.\r<br /><span>1-4 followed by 3-2 creates a good sequence<\/span><span>.<\/span>\r<br /><span>Therefore, the required answer is 1432.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 19, "sourceId": "169270353153618", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br><span>1.<\/span>\t<span>Despite being responsible for 35% of low- and middle-income countries' GDP and comprising <\/span><span>the majority of<\/span><span> non-agricultural labor in nations like India and Thailand, informal workers are not acknowledged as significant stakeholders in driving the global recovery.<\/span><br>2.\t<span>The health and debt crises plaguing informal workers are intertwined and mutually reinforcing.<\/span><br>3.\t<span>But the fact is that our economies rely on the collective well-being of two billion informal workers, many of whom are struggling under the weight of rising health costs.<\/span><br>4.\t<span>Moreover, the current policy debate centered on fiscal austerity ignores the threat that austerity policies pose to millions of livelihoods worldwide.<\/span><br><br><span>", "options": [], "answer": "2143", "answerLabel": "2143", "solution": "<\/span>\t<span>Sentence 1. General Statement. Standalone. Could be considered for the start.<\/span>\r<br /><span>Sentence 2. General statement. Introduces a specific issue. “the health and debt crises plaguing informal workers….” If considered as the starter, links to sentence 1 as 2-1.<\/span>\r<br /><span>Sentence 3. ‘But the fact is that’ …. Could link to 1.<\/span>\r<br /><span>Sentence 4. ‘Moreover…’ It adds something to something else.<\/span>\r<br /><span>The best starter is 2, which is followed by 1 making 2-1 a good pair. Placing 4 and 3 needs some deliberation. 2143 and 2134 are two possibilities. 4-3 is more logical after 2-1, because ‘moreover the current policy debate ignores…” is logically added to “informal workers are not recognized as key stakeholders in driving global recovery” in sentence 1. Statement of a problem and its current exacerbation. After that, ‘but the fact is that …’ in sentence 3, provides a better conclusion to the whole paragraph. 3-4 would lose the focus on ‘informal workers’ as ‘millions of livelihoods’ in 4 leaves the main topic open. Closing with 3 puts the focus back on ‘informal workers’ – a better closure to the topic.<\/span>\r<br /><span>Therefore, the required answer is 2143.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 20, "sourceId": "169270353153719", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<p><strong>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/strong><br /><br /><span><strong>Sentence:<\/strong><\/span><span> Many people believe that the best way to learn a new language is through immersion.<\/span><br /><strong>Paragraph:<\/strong><span> _____1____. There are many methods for learning a new language, from textbooks and classes to mobile apps and online courses. However, many language learners believe that the most effective way to learn a language is through immersion, where you surround yourself with the language and use it in your daily life. _____2____. Immersion programs can be found around the world, from language schools in major cities to homestays in remote villages. _____3____. Additionally, immersion allows learners to pick up on subtleties of the language, such as local accents and colloquialisms, that they might not encounter in a classroom or textbook. _____4____. However, immersion can also be challenging, as learners may struggle with cultural differences or difficulty understanding native speakers. Despite these challenges, immersion remains a popular and effective method for language learning.<\/span><\/p>", "options": ["<span><\/span>\t<span>Option 1<\/span>", "<span>Option 2<\/span>", "<span>Option 3<\/span>", "<span>Option 4<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span>The sentence provides the topic of the paragraph, which is the belief that immersion is the best way to learn a new language. Therefore, it fits most appropriately in the first blank. The following blanks  (in blank 2 and 3) are continuous and provide  examples and benefits of immersion language programs, while the sentence blank 4 provides a counterpoint to the argument.<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Paragraph Completion"}, {"number": 21, "sourceId": "169270353153820", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><span><b>Sentence:<\/b><\/span><span> In recent years, however, there has been a growing trend towards sustainable and ethical fashion.<\/span><br><span><b>Paragraph:<\/b><\/span><span> _____1____. The fashion industry is one of the largest and most influential industries in the world, but it has a significant impact on the environment and human rights. Fast fashion has led to a throwaway culture where clothes are worn only a few times before being discarded. This has resulted in a massive amount of waste and pollution. _____2____. This includes using <\/span><span>environmentally-friendly<\/span><span> materials and production methods, as well as ensuring fair labor practices throughout the supply chain. Many fashion brands and retailers are now offering sustainable and ethical options for consumers who want to make more responsible choices. _____3____.  Consumers can also do their part by choosing to buy from these brands and by taking care of their clothes to extend their lifespan. While the fashion industry still has a long way to go in terms of sustainability and ethics, the growing trend towards responsible fashion is a step in the right direction. _____4____.<\/span>", "options": ["<span>Option 1<\/span>", "<span>Option 2<\/span>", "<span>Option 3<\/span>", "<span>Option 4<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>The sentence fits well in the second blank. No other blank indicates the need for a sentence connecting the one before and after the blank.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Paragraph Completion"}, {"number": 22, "sourceId": "169270353154021", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br><span>If an alien race came to Earth and lined up humans in a row alongside all the other primates, one of the first differences they might observe – together with our upright position and unique form of communication – is our apparently furless bodies. Of course, humans <\/span><span>actually do<\/span><span> have lots of hair: on average we have approximately five million hair follicles across our body surface. But almost all the hair follicles on human bodies produce vellus hair, fine, short, fuzzy hair which grows from shallow follicles…Scientists don't definitively know the reason behind this change from thicker, coarser fur to these light vellus hairs, and they also don't know exactly when it happened. Still, several theories have been suggested as to what could have sparked the loss of our hair. The most dominant view among scientists is the so-called \"body-cooling\" hypothesis, also known as the \"savannah\" hypothesis. This points to a rising need for early humans to thermoregulate their bodies as a driver for fur loss.<\/span><br><br><span>Which of the following best captures the essence of the passage?<\/span>", "options": ["<span>Humans are the only primate with furless bodies, and the body cooling hypothesis is the most dominant view among scientists for loss of fur at an unknown time in evolution.<\/span>", "<span>The need to thermoregulate their bodies in the savannah environment led to human fur getting replaced by vellus hairs at some time during human evolution.<\/span>", "<span>The body-cooling hypothesis points to a rising need for early humans to thermoregulate their bodies as a driver for fur loss during evolution.<\/span>", "<span>Early humans lost their fur due to the need to regulate body temperature in the savannah environment according to the “body-cooling” hypothesis.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span><b>Points:<\/b><\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>Humans appear to be furless but they have vellus hair.<\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>Scientists are uncertain about why humans lost their thick fur.<\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>Several theories – but the “body-cooling” hypothesis is the most dominant<\/span><span>.<\/span><span><\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>Early humans needed to regulate their body temperature in the savannah environment.<\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>The replacement occurred at an unknown time in human evolution.<\/span>\r<br /><span>Option 1. Savannah environment is not mentioned.<\/span>\r<br /><span>Option 2. It is a hypothesis but not captured by option 2.<\/span>\r<br /><span>Option 3. Savannah environment is not mentioned.<\/span>\r<br /><span>Option 4. Comparatively the best precis.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Summary"}, {"number": 23, "sourceId": "169270353154122", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br><span>Today, we tend to look back on aristocrats with a great deal of cynicism, regarding them at best as parasites, and at worst as violent predators on the rest of their society. We have to recognize, however, that in aristocratic societies there was a deeply rooted belief that <\/span><span>honor<\/span><span> or esteem was not due to everyone, but only to the class of people who risked their lives. An echo of that feeling still exists in the respect we citizens of modern democratic societies typically pay to soldiers who die for their country, or firemen who risk their lives. Dignity is not due to everyone, least of all to those whose main objective is to maximize their own welfare. Aristocrats thought of themselves as better than other people and possessed what we may call megalothymia, the desire to be recognized as superior. Predemocratic societies rested on a foundation of social hierarchy, so this belief in the inherent superiority of a certain class of people was fundamental to the maintenance of social order.<\/span>", "options": ["<span>Social order in pre-democratic, hierarchical societies was based on the belief that aristocrats were inherently superior; the belief, however, still echoes in modern societies.<\/span>", "<span>The belief in the inherent superiority of a certain class was fundamental to maintaining social order in pre-democratic societies, and this belief <\/span><span>still persists<\/span><span> in modern societies.<\/span>", "<span>Aristocrats are still respected in modern societies for their bravery and risk tolerance as this social hierarchy was essential to maintain social order in pre-democratic societies.<\/span>", "<span>Megalothymia<\/span><span>, the desire for recognition as superior, was a defining trait of aristocrats in pre-democratic societies and has persisted to some extent in modern democratic societies.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span><b>Points:<\/b><\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>Aristocrats are now viewed as parasites or violent predators.<\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>However, in ancient societies, there was a belief that&nbsp;<\/span><span>honor<\/span><span> and esteem were not due to everyone, but only to those who risked their lives.<\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>This belief still persists in modern democratic societies where soldiers or firefighters are respected for risking their lives.<\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>The belief in the inherent superiority of a certain class was fundamental to maintaining social order in pre-democratic societies.<\/span>\r<br /><span>The passage is not about aristocrats. (they are despised today) It is about the belief that certain class of people deserve respect. As a hangover of pre-democratic societies, where aristocrats were respected, we respect soldiers and firemen today.<\/span>\r<br /><span>Option 1. It doesn't mention the connection between this belief and the respect given to soldiers and firefighters, which is an important point made in the paragraph.<\/span>\r<br /><span>Option 2. Correct.<\/span>\r<br /><span>Option 3. Aristocrats are not respected in modern societies.<\/span>\r<br /><span>Option 4. It doesn't mention the connection between this trait and the respect given to soldiers and firefighters.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Summary"}, {"number": 24, "sourceId": "169270353154323", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br><span>For centuries, historians and philosophers have traced, and debated, technology’s role in shaping civilization. Some have made the case for what the sociologist Thorstein Veblen dubbed “technological determinism”. They’ve argued that technological progress, which they see as an autonomous force outside man’s control, has been the primary factor influencing the course of human history. In the most extreme expression of the determinist view, human beings become little more than “the sex organs of the machine world,” as McLuhan memorably wrote in <\/span><span>Understanding Media<\/span><span>. Our essential role is to produce ever more sophisticated tools—to “fecundate” machines as bees fecundate plants—until technology has developed the capacity to reproduce itself on its own. At that point, we become dispensable.<\/span>", "options": ["<span>In the extreme determinist view, humans become mere producers of tools, and technology reaches a point where it can reproduce on its own, making humans indispensable.<\/span>", "<span>Technological determinism in its extreme form asserts that civilization is beyond human control, and eventually when technology can reproduce itself, humans will be redundant.<\/span>", "<span>In the extreme view of technological determinism, humans become mere producers of tools, and technology eventually becomes self-replicating making humans dispensable.<\/span>", "<span>According to the sociologist Thorstein Veblen, technology is deterministic, progressing with an autonomous force beyond human control to eventually make humans dispensable.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span><b>Points:<\/b><\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>Historians and philosophers have debated technology's role in shaping civilization for centuries.<\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>Technological determinism: technological progress, seen as an autonomous force beyond human control influences human history.<\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>In the most extreme form of determinist view, humans become tool producers, and technology becomes self-replicating, making humans dispensable.<\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>Eventually technology may develop the capacity to reproduce itself on its own.<\/span>\r<br /><span>At that point, humans become dispensable.<\/span>\r<br /><span>Option 1. “indispensable” changes the narrative.<\/span>\r<br /><span>Option 2. ‘civilization is beyond human control’ does not spell out why.<\/span>\r<br /><span>Option 3. The best  precis<\/span>\r<br /><span>Option 4. ‘to make them dispensable’ is problematic – they become dispensable would be better.<\/span>\r<br /><span>Hence, [3].<\/span", "topic": "Summary"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;
function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
