ly to turn neurons on and off.<\/span><br><br><span>The most obvious heir to the spirit of Cajal’s histology is a technique called ‘<\/span><span>Brainbow<\/span><span>’, which introduces coral, jellyfish and sea anemone DNA into mice, fruit flies and other small animals. The fluorescent proteins produced as a result are blue, cyan, yellow, orange and red. When mixed, they create a palette of hundreds of distinctive hues. In this collage of vibrant colour, cell bodies appear like neon raindrops. <\/span><span>Brainbow<\/span><span> technique can trace many neurons at once. Neuroscientists these days are more concerned with populations of neurons than they are with individuals. Yet there is something intimate and revealing about the staining of a single cell, like the portrait of a human being. ‘Only true artists are attracted to science,’ Cajal said.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>All of the following are true about optogenetics EXCEPT:<\/span>", "options": ["<span>It introduces genes into the neurons.<\/span>", "<span><\/span>\t<span>It uses light to control neuronal activity.<\/span>", "<span><\/span>\t<span>It can selectively target specific neurons.<\/span>", "<span><\/span>\t<span>It electrically stimulates neuronal activity.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>“Then they shine a certain kind of light at those neurons to open their ion channels and fire the electrical signal, thus stimulating their activity.” It is the neuron that fires the electrical signal and not optogenetics. Hence, Option 4 is the exception.<\/span>\r<br /><span>Optogenetics is explained in the fourth paragraph. Optogenetics is a technique that allows researchers to control the activity of specific neurons in the brain using light. This is achieved by introducing genes into the neurons that produce light-sensitive proteins called opsins. When these opsins are exposed to light, they can either activate or inhibit the neuron's activity, depending on the type of opsin used. By selectively targeting specific neurons with opsins and controlling the timing and location of the light stimulus, researchers can manipulate neural activity and study brain function. Hence, options 1, 2, and 3 are true about optogenetics.<\/span>\r<br /><span>Hence, [<\/span><span>4<\/span><span>].<\/span>", "topic": "Specific Detail Question"}, {"number": 16, "sourceId": "169390995205915", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>The apotheosis of histology, and perhaps the most spectacular revelation in the history of anatomy, came in 1888 when Santiago Ramón y Cajal demonstrated the anatomical independence of nerve cells, later termed neurons and defined as the basic units of the brain. Cajal became the first person to use the term <\/span><span>plasticity<\/span><span> when referring to the central nervous system and its ability to change its structure in response to experience, introducing a concept that has become <\/span><span>en<\/span><span> vogue<\/span><span> in many modern fields, including psychology and education.<\/span><br><br><span>Imaging technology in the 21st century is beyond what Cajal and his contemporaries could have imagined, but our desire remains the same. We have preserved the structure of our own enquiry. Gone may be the days of dusty, cork-stopped bottles filled with eerie fluids, of cheap light microscopes, of practising microscopy alone in the kitchen or the attic. Yet cells, no matter how you image them, are still mostly water. Adding colour is still necessary.<\/span><br><br><span>The histology of the 19th century has led to a world of unprecedented clarity and vividness, promising immaculate control of complex processes, no longer susceptible to the vagaries of laboratory chemistry. A technique called immunofluorescence, first described in 1942, employs antibodies tagged with fluorescent compounds that reemit light upon excitation and thus function, in the eyes of an observer, like dyes. Another technique, CLARITY renders tissue transparent with monomers called hydrogels, allowing immunofluorescent stains to expose neurons in the whole brain.<\/span><br><br><span>A technique known as optogenetics became popular at the start of the 21st century. Instead of chemical reagents, optogenetics relies on photosensitive proteins, or opsins; instead of revealing the structure of cells, the technique tracks their function. With genetic engineering, researchers add new <\/span>code to certain neurons that allows them to make opsins. Then they shine a certain kind of light at those neurons to open their ion channels and fire the electrical signal, thus stimulating their activity. By precisely controlling the processes of the engineered neurons, researchers can observe how other neurons respond, thereby illuminating the brain’s circuitry,<span> <\/span><span>carefully and selectively. Already, optogenetics has been used to help patients recover after a stroke and to provide insight into the mechanisms behind anxiety. Scientists hope that their findings will lead to advances in treating Alzheimer’s and PTSD. But, technically optogenetics is a method of <\/span><span>perturbing<\/span><span> not imaging; the colours are useful only to turn neurons on and off.<\/span><br><br><span>The most obvious heir to the spirit of Cajal’s histology is a technique called ‘<\/span><span>Brainbow<\/span><span>’, which introduces coral, jellyfish and sea anemone DNA into mice, fruit flies and other small animals. The fluorescent proteins produced as a result are blue, cyan, yellow, orange and red. When mixed, they create a palette of hundreds of distinctive hues. In this collage of vibrant colour, cell bodies appear like neon raindrops. <\/span><span>Brainbow<\/span><span> technique can trace many neurons at once. Neuroscientists these days are more concerned with populations of neurons than they are with individuals. Yet there is something intimate and revealing about the staining of a single cell, like the portrait of a human being. ‘Only true artists are attracted to science,’ Cajal said.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>According to the passage, the ‘<\/span><span>Brainbow<\/span><span>’ technique is …<\/span>", "options": ["<span><\/span>\t<span>A method of <\/span><span>labeling<\/span><span> individual neurons.<\/span>", "<span><\/span>\t<span>A technique to control the activity of neurons<\/span>", "<span><\/span>\t<span>A method to detect specific proteins in cells.<\/span>", "<span><\/span>\t<span>A technique to create transparent brain tissue.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span>“… The fluorescent proteins produced as a result are blue, cyan, yellow, orange and red. When mixed, they create a palette of hundreds of distinctive hues.” The researchers then ‘trace’ these neurons. It is the fluorescent label that helps them trace the neurons.<\/span>\r<br /><span>Option 1. Correct.<\/span>\r<br /><span>Option 2. This is something similar to optogenetics. Passage does not support that this is applicable for&nbsp;<\/span><span>Brainbow<\/span><span> as well.<\/span>\r<br /><span>Option 3. ‘<\/span><span>specific<\/span><span> proteins’ is similar to immunofluorescence<\/span>\r<br /><span>Option 4. This is similar to CLARITY.<\/span>\r<br /><span>Hence, [<\/span><span>1<\/span><span>].<\/span>", "topic": "Specific Detail Question"}, {"number": 17, "sourceId": "169390995205916", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br> <br><br><span>1.<\/span>\t<span>Printing and handwriting began to influence each other: for example, modern advertising continues to incorporate calligraphy, and many calligraphers have through the years designed typefaces for printing.<\/span><br><span>2.<\/span><span> <\/span>\t<span>Though it has often been assumed that the printing process ended the manuscript tradition, it is not quite true: for example, most of the surviving books of hours date from the period after the introduction of printing.<\/span><br><span>3.<\/span>\t<span>Thus, although handwritten books could not be reproduced in quantity or with complete uniformity, they did survive the introduction of printing.<\/span><br><span>4.<\/span>\t<span>Certain types of publications, such as musical scores, scientific notation, and other specialized or small-audience works, continued to be handwritten well into the 19th century.<\/span><br><br><span>", "options": [], "answer": "2431", "answerLabel": "2431", "solution": "<\/span>\t<span>Sentence 1. Not good for the starter. However, it tells us what the paragraph is about: Printing and handwriting.<\/span>\r<br /><span>Sentence 2. Good sentence to begin the paragraph. The topic is spelt out.<\/span>\r<br />Sentence 3. Good after 4. Good also for the concluding sentence in the paragraph with “thus”.\r<br /><span>Sentence 4. ‘<\/span><span>continued<\/span><span> to be handwritten’, links it directly to 2. 2-4 is a pair.<\/span>\r<br />The 2-4 pair begins the paragraph. Between 3 and 4, sentence 3 follows 2-4 because ‘books could not be reproduced in quantity’ and ‘they did survive’ continue the idea the of books rather than handwriting as in 4. Sentence 1 closes the paragraph – along with handwritten books ‘handwriting’ also survived as calligraphy.\r<br /><span>Therefore, the required answer is 2431.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 18, "sourceId": "169390995206117", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br><span>1.<\/span>\t<span>Lakes hold less than 0.5 percent of all fresh water, while soil moisture accounts for about 0.05 percent.<\/span><br><span>2.<\/span>\t<span>River channels hold only 0.025 percent of the Earth’s total fresh water, which is primarily stored as land ice and groundwater, with oceans containing 97 percent of all water.<\/span><br><span>3.<\/span>\t<span>Despite the critical role that rivers play in the water cycle, the amount of water in river systems is a minuscule fraction of the Earth’s total water.<\/span><br>4.\t<span>The limited amount of freshwater available in river systems highlights the importance of conservation efforts and responsible use of this vital resource.<\/span><br><br><span>", "options": [], "answer": "3214", "answerLabel": "3214", "solution": "<\/span>\t<span>Sentence 1. Statement of a fact. Part of some description.<\/span>\r<br /><span>Sentence 2. Another fact. Neither 1 nor 2 can be the starter – would be too abrupt as no context/cause is given about why the data has been provided.<\/span>\r<br /><span>Sentence 3. Introduces the topic – river systems and their limitations. 3-2 is pair.<\/span>\r<br /><span>Sentence 4. Related to both 3 and 2. Could be placed after 3-2.<\/span>\r<br /><span>Sentence 1 appears unrelated to river systems, which is the topic. However, the subject of ‘fresh water’ of which river systems are a part, is also continued in ‘lakes’ – that they hold more fresh water than rivers. Sentence 1 should be more coherent when placed after 3-2 than anywhere else.<\/span>\r<br /><span>Therefore, the required answer is 3214.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 19, "sourceId": "169390995206218", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br><span>1.<\/span>\t<span>Prolonged exposure to negative work conditions can warp the perception of what it means to be in the workforce and damage the relationship with work, resulting in quiet-quitting <\/span><span>behaviors<\/span><span>.<\/span><br><span>2.<\/span>\t<span>Young workers in many job situations face the short-term risk of burnout, burdened by long hours, heavy workloads, and menial tasks without the seniority to advocate for themselves.<\/span><br><span>3.<\/span>\t<span>This can have longer-term effects, negatively impacting their career prospects and overall well-being.<\/span><br><span>4.<\/span>\t<span>Some may feel compelled to endure it, especially if they aspire to enter industries with high barriers to entry.<\/span><br><br><span>", "options": [], "answer": "2413", "answerLabel": "2413", "solution": "<\/span>\t<span>Sentence 1. General, standalone sentence. Could be the starter.  What prolonged exposure to negative work conditions can&nbsp;<\/span><span>do.<\/span><span><\/span>\r<br /><span>Sentence 2. General statement – about what young workers face in many job situations. Considering that the paragraph is only 4 sentences either 1 or 2 must be the main topic of the paragraph.<\/span>\r<br /><span>Sentence 3. The pronoun use, ‘this’ and ‘their’, tells us it can be linked to sentence 2. ‘this’ can also stand for the ‘prolonged exposure…’ in sentence 1.<\/span>\r<br /><span>Sentence 4. ‘some’ as a pronoun stands for young workers; or as a determiner in ‘some young workers.’ So linked to 2 and 3.<\/span>\r<br /><span>3 sentences being about young workers in bad job situations, it is safe to assume that that is the topic of the paragraph. Between 1 and 2, 2 is a better starter. 2-4 is a pair; 3 can conclude. The problem is in placing 1. Since ‘prolonged exposure’ and ‘quiet-quitting&nbsp;<\/span><span>behaviors<\/span><span> can result only from the decision to ‘endure’, sentence 1 makes better sense after 2-4 pair. Besides, the points mentioned in sentence 1 - “Prolonged exposure to negative work conditions<\/span><span>” ,<\/span><span> “warp the perception of what it means to be in the workforce”  and “damage the relationship with work,”  “quiet-quitting&nbsp;<\/span><span>behaviors<\/span><span>” make better sense when related to young workers. Other sequences might appear plausible. In comparison, 2413 is the best.<\/span>\r<br />Therefore<span>,&nbsp;<\/span><span>the required answer is 2413.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 20, "sourceId": "169390995206719", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><span><b>Sentence:<\/b><\/span><span> Assume <\/span><span>L<\/span><span> is false.<\/span><br><br><span><b>Paragraph:<\/b><\/span><span> The Liar Paradox is an argument that arrives at a contradiction by reasoning about a Liar Sentence. The Classical Liar Sentence is the self-referential sentence: (<\/span><span>L<\/span><span>:) “<\/span><span>This sentence is false.” <\/span><span> It leads to the same difficulties as the sentence, ‘<\/span><span>I am lying.’<\/span><span> _____1____.  Experts in the field of logic have never agreed on the way out of the trouble despite 2,300 years of attention. Here is the trouble. _____2____.  It is a sketch of the Paradox, the argument that reveals the contradiction: Let <\/span><span>L<\/span><span> be the Classical Liar Sentence. If <\/span><span>L<\/span><span> is true, then <\/span><span>L<\/span><span> is false. But the converse also can be established, as follows. _____3____.  Because the Liar Sentence is just the sentence <\/span><span>L<\/span><span> is false, the Liar Sentence is therefore true, so <\/span><span>L<\/span><span> is true. _____4____.  What has now been shown is that <\/span><span>L<\/span><span> is true if, and only if, it is false. Since <\/span><span>L<\/span><span> must be one or the other, it is both.<\/span>", "options": ["<span>Option 1<\/span>", "<span><\/span>\t<span>Option 2<\/span>", "<span><\/span>\t<span>Option 3<\/span>", "<span><\/span>\t<span>Option 4<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>Blank 1 does not need the key sentence in its place. Blank 2 likewise does not replace the key sentence. Before blank 3, we have ‘if L is true…But the converse is also true’ The converse in indicated by the key sentence. “Assume&nbsp;<\/span><span>L<\/span><span> is false.” Blank 4 does not need a sentence.<\/span>\r<br /><span>Hence, [3].<\/span><span><b>&nbsp;<\/b><\/span>", "topic": "Paragraph Completion"}, {"number": 21, "sourceId": "169390995206820", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><span><b>Sentence:<\/b><\/span><span> San Francisco and the Bay Area are emblematic of this paradox.<\/span><br><br><span><b>Paragraph:<\/b><\/span><span> San Francisco’s Millennium Tower is sinking at an alarming rate of almost an inch every year since it was constructed in 2009. The 58-story luxury apartment tower now leans 27 inches lower on one side. _____1____.  The structure’s foundation has been reinforced with metal pilings, and many lawsuits have been filed to recover investment losses. The tower’s problems have received media attention, and its situation is a metaphor for contemporary American society’s condition – an imposing edifice on sinking ground. _____2____.  The region has been the most economically productive area in the US, if not the world, for the past two decades. However, San Francisco has experienced rising wealth inequality, lower economic mobility, and a growing number of homeless people. _____3____.  Due to the city’s high cost of housing, its population dropped 6.3 percent between July 2020 and July 2021, the highest decline among all major US cities during the pandemic. _____4____.  The pandemic made the Financial District <\/span><span>more bleak<\/span><span>, with makeshift tents and homeless people.<\/span>", "options": ["<span>Option 1<\/span>", "<span><\/span>\t<span>Option 2<\/span>", "<span><\/span>\t<span>Option 3<\/span>", "<span><\/span>\t<span>Option 4<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>The key sentence mentions “this paradox”. The part before the key sentence has to explain the paradox. The sentence before blank 2 specifies the paradox “an imposing edifice on sinking ground.” Hence it fits in the second blank. The sentence after 2 explains it.<\/span>\r<br /><span>Hence, [<\/span><span>2<\/span><span>].<\/span>", "topic": "Paragraph Completion"}, {"number": 22, "sourceId": "169390995207021", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><span><b> <\/b><\/span><br><br><span>In recent years, genetic-sequencing studies have started to get to the bottom of why some people react so badly to certain medications, pinpointing four different variations of a gene called DPYD which is involved in metabolism, as the likely cause. Healthcare systems around the world have now begun sequencing the DNA of certain cancer patients and screening for each of these four variants before determining their chemotherapy dose. The only problem is that these studies were done entirely on white people, or as geneticists say, \"individuals of European ancestry\". While different variants of DPYD may serve as warning signs for people of other ethnicities, we do not have enough data to be sure of which variants are most applicable to different ethnic groups…This is just one example of what scientists call the \"genomic gap\", a phenomenon which unless addressed, is likely to have wide-ranging impacts across healthcare, exacerbating existing inequalities.<\/span>", "options": ["<span>Genetic-sequencing has identified gene variations responsible for drug reactions in cancer patients, but the study, limited to individuals of European ancestry alone, highlights the ethnic bias in genomic research which can exacerbate existing healthcare inequalities.<\/span>", "<span><\/span>\t<span>Genetic-sequencing studies have identified four variations of a gene involved in metabolism called DPYD, but their limited scope on individuals of European ancestry highlights the lack of diversity in genomic research that could exacerbate healthcare inequalities.<\/span>", "<span><\/span>\t<span>Healthcare systems are using genetic-sequencing studies to screen certain cancer patients for four variations of the DPYD gene, but the lack of diversity in these studies conducted solely on individuals of European ancestry, may worsen existing healthcare inequalities.<\/span>", "<span><\/span>\t<span>Genetic-sequencing studies have identified four variations of the DPYD gene, which healthcare systems are using to screen certain cancer patients, but the lack of diversity in these studies may exacerbate healthcare inequalities.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span><b>Points:<\/b><\/span><span><\/span>\r<br />\t<span><\/span><span>&nbsp;<\/span>\t<span>Genetic-sequencing studies identified 4 DPYD gene variations responsible for medication reactions.<\/span>\r<br />\t<span><\/span><span>&nbsp;<\/span>\t<span>Healthcare systems worldwide now screen for these variants in cancer patients before chemotherapy<\/span>\r<br />\t<span><\/span><span>&nbsp;<\/span>\t<span>C<\/span><span>Studies<\/span><span> were limited to individuals of European ancestry and excluded other ethnic groups.<\/span>\r<br />\t<span><\/span><span>&nbsp;<\/span>\t<span>Lack of diversity in genomic research may exacerbate existing healthcare inequalities<\/span><span>.<\/span>\r<br /><span>Option 1. The best precis.<\/span>\r<br /><span>Option 2. Medication reactions is missing. Fails to convey the complete picture.<\/span>\r<br /><span>Option 3. Why screening for DYPD is needed is not made clear.<\/span>\r<br /><span>Option 4. Medication reactions is missing.<\/span>\r<br /><span>Options other than 1 fail to make the significance of the gene variations clear.<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Summary"}, {"number": 23, "sourceId": "169390995207122", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br><span>The foundations of identity are laid with the perception of a disjunction between one’s inside and one’s outside. Individuals come to believe that they have a true identity hiding within themselves that is somehow at odds with the role they are assigned by society. The modern concept of identity places a supreme value on authenticity, on the validation of that inner being that is not being allowed to express itself. It is on the side of the inner and not the outer self. Oftentimes an individual may not understand who that inner self really is, but has only the vague feeling that he or she is being forced to live a lie. This can lead to an obsessive focus on the question “Who am I, really?” The search for an answer produces feelings of alienation and anxiety and can only be relieved when one accepts that inner self and receives public recognition for it.<\/span>", "options": ["<span>The modern concept of identity with its emphasis on authenticity leads to feelings of alienation when an individual’s social identity is not aligned with his inner self and does not receive public recognition.<\/span>", "<span><\/span>\t<span>The perception of a disjunction between one's inner and outer selves is the foundation of identity, and modern identity values authenticity and social validation to be free of alienation and anxiety.<\/span>", "<span><\/span>\t<span>The perception that one's inner self differs from the role one plays in society drives individuals to seek their authentic selves and contributes to the sense of alienation in contemporary societies.<\/span>", "<span><\/span>\t<span>Modern concept of identity involves seeking authenticity and social validation as a means of alleviating feelings of alienation and anxiety, wherein individuals' inner identities are affirmed and accepted by others.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span><b>Points:<\/b><\/span>\r<br />\t<span><\/span><span>&nbsp;<\/span><span>&nbsp;<\/span>\t<span>Perception of disjunction between inner and outer&nbsp;<\/span><span>self lays<\/span><span> foundations of identity<\/span>\r<br />\t<span><\/span><span>&nbsp;<\/span><span>&nbsp;<\/span>\t<span>True identity is believed to be at odds with the assigned societal role<\/span><span>.<\/span>\r<br />\t<span><\/span><span>&nbsp;<\/span><span>&nbsp;<\/span>\t<span>Modern identity values authenticity and inner expression over outer self<\/span><span>.<\/span>\r<br />\t<span><\/span><span>&nbsp;<\/span>\t<span>Obsessive focus on \"Who am I, really?\" due to vague feeling of living a lie<\/span><span>.<\/span><span>&nbsp;<\/span>\r<br />\t<span><\/span><span>&nbsp;<\/span><span>&nbsp;<\/span>\t<span>Search for answer causes alienation and anxiety<\/span><span>.<\/span>\r<br />\t<span><\/span><span>&nbsp;<\/span><span>&nbsp;<\/span>\t<span>Relief comes from accepting inner self and receiving public recognition.<\/span>\r<br />\r<br />Option 1. Tricky. “<span>social<\/span><span> identity is not aligned with his inner self and does not receive public recognition.” It is the inner identity that seeks social recognition. If you interchange them the option would be correct precis.<\/span>\r<br /><span>Option 2. Not precise. “<\/span><span>modern<\/span><span> identity values authenticity and social validation” (of what?) is not clear.<\/span>\r<br /><span>Option 3. Correct. The best precis. captures the main point about alienation though it misses the point about how it is relieved.<\/span>\r<br /><span>Option 4. Incomplete. The point of the paragraph is how alienation happens. This is missing in this option.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Summary"}, {"number": 24, "sourceId": "169390995207323", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br>The conflict between the determinists and the instrumentalists will never be resolved. It involves, after all, two radically different views of the nature and destiny of humankind. The debate is as much about faith as it is about reason. But there is one thing that determinists and instrumentalists can agree on: technological advances often mark turning points in history. New tools for hunting and farming brought changes in patterns of population growth, settlement, and <span>labor<\/span><span>. New modes of transport led to expansions and realignments of trade and commerce. New weaponry altered the balance of power between states. Other breakthroughs, in fields as various as medicine, metallurgy, and magnetism, changed the way people live in innumerable ways— and continue to do so today. In large measure, civilization has assumed its current form as a result of the technologies people have come to use.<\/span>", "options": ["<span>While the conflict between determinists and instrumentalists regarding the nature and destiny of humanity is unlikely to be resolved, they both agree that civilization in its current form is an expression of both faith and reason.<\/span>", "<span><\/span>\t<span>Both determinists and instrumentalists agree that technology - from tools for hunting and farming to transportation and weaponry, breakthroughs in various fields, to the current form of civilization - is a product of faith and reason.<\/span>", "<span><\/span>\t<span>While determinists view civilization as the result of reason, and instrumentalists see it as an expression of faith, both agree on the role of technology in influencing the way people live and would continue to live.<\/span>", "<span><\/span>\t<span>Despite having conflicting perspectives on the fundamental nature and future of humanity, determinists and instrumentalists find common ground when it comes to the role of technology in the advancement of civilization.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<p><strong>Points:<\/strong> <br /><span><\/span>&nbsp; determinists and the instrumentalists have radically different views of the nature and destiny of humankind <br /><span><\/span>&nbsp; But, they agree that civilization is a result of the technologies people have come to use. <br />Option 1. &ldquo;they both agree that civilization in its current form is an expression of both faith and reason,&rdquo; is a misrepresentation and not implied in the passage. <br />Option 2. The unresolvable debate does not find mention. &lsquo;product of faith and reason&rsquo; is similar to option 1. <br />Option 3. Lopsided. Determinists see it as a matter of faith and instrumentalists may see it as reason. <br />Option 4. Correct. <br />Hence, [4].<\/p>", "topic": "Summary"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;
function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
