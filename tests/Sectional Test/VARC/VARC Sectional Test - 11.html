<script type="application/json" id="test-data">{"testNumber": 11, "simcat": 11, "minutes": 40, "questions": [{"number": 1, "sourceId": "16939099520520", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>It seems logical enough that bad weather can sometimes cause birds to become disoriented during their annual fall migrations—causing them to wind up in territory they're unaccustomed to. But why, even when weather is not a major factor, do birds travel far away from their usual routes? A new paper by UCLA ecologists explores one reason: disturbances to Earth's magnetic field can lead birds astray—a phenomenon scientists call \"vagrancy\"—even in perfect weather, and especially during fall migration.<\/span>\r<br>\r<br><span>With North America's bird populations steadily declining, assessing the causes of vagrancy could help scientists better understand the threats birds face and the ways they adapt to those threats. For example, birds that wind up in unfamiliar territory are likely to face challenges finding food and habitats that suit them, and may die as a result. But it also could be beneficial for birds whose traditional homes are becoming uninhabitable due to climate change, by \"accidentally\" introducing the animals into geographic regions that are now better suited for them.<\/span>\r<br>\r<br><span>Earth's magnetic field, which runs between the North and South Poles, is generated by several factors, both above and below the planet's surface. Decades' worth of lab research suggests that birds can sense magnetic fields using magnetoreceptors in their eyes.<\/span>\r<br>\r<br><span>\"There's increasing evidence that birds can actually see geomagnetic fields,\" said Morgan Tingley, the paper's corresponding author and a UCLA associate professor of ecology and evolutionary biology. \"In familiar areas, birds may navigate by geography, but in some situations it's easier to use geomagnetism.\" <\/span>\r<br>\r<br><span>But birds' ability to navigate using geomagnetic fields can be impaired when those magnetic fields are disturbed. Such disturbances can come from the sun's magnetic field, for example, particularly during periods of heightened solar activity, such as sunspots and solar flares, but also from other sources. While other factors such as weather likely play bigger roles in causing vagrancy, the researchers found a strong correlation between birds that were captured far outside of their expected range and the geomagnetic disturbances that occurred during both fall and spring migrations. But the relationship was particularly pronounced during the fall migration, the authors noted.<\/span>\r<br>\r<br><span>Geomagnetic disturbances affected the navigation of both young birds and their elders, suggesting that birds rely similarly on geomagnetism regardless of their level of migration experience. The researchers had expected that geomagnetic disturbances associated with heightened solar activity would be associated with the most vagrancy. To their surprise, solar activity actually reduced the <\/span>incidence of vagrancy. One possible reason is that radiofrequency activity generated by the solar disturbances could make birds' magnetoreceptors unusable, leaving birds to navigate by other cues instead. \"We think the combination of high solar activity and geomagnetic disturbance leads to either a pause in migration or a switch to other cues during fall migration,\" researchers said. \"Interestingly, birds that migrate during the day were generally exceptions to this rule—they were more affected by solar activity,” they added.", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>What is the main idea of this passage?<\/span>", "options": ["The factors that contribute to the phenomenon of vagrancy among birds during migration.", "The failure of a bird’s navigation system is associated with increased vagrancy among migratory birds", "The correlation between disturbances in Earth's magnetic field and birds' vagrancy during migration.", "The impact of disturbances in weather, geomagnetic field, and solar activity on the migration of birds."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>Option 1. - This option is just partially correct as the passage discusses the factors that contribute to vagrancy but the main idea is the correlation between disturbances in Earth's magnetic field and birds' vagrancy.<\/span>\r<br /><span>Option 2. This option is incorrect as the passage states that the navigation system of birds is affected by disturbances in Earth's magnetic field, which leads to vagrancy.<\/span>\r<br /><span>Option 3. This option is the correct answer as the passage mainly discusses how disturbances in Earth's magnetic field can lead to vagrancy among migratory birds.<\/span>\r<br /><span>Option 4. This option is partially correct. The factors mentioned in 4 don’t capture the main idea. The passage focuses on the correlation between disturbances in Earth's magnetic field and birds' vagrancy.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Central Idea"}, {"number": 2, "sourceId": "16939099520551", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>It seems logical enough that bad weather can sometimes cause birds to become disoriented during their annual fall migrations—causing them to wind up in territory they're unaccustomed to. But why, even when weather is not a major factor, do birds travel far away from their usual routes? A new paper by UCLA ecologists explores one reason: disturbances to Earth's magnetic field can lead birds astray—a phenomenon scientists call \"vagrancy\"—even in perfect weather, and especially during fall migration.<\/span>\r<br>\r<br><span>With North America's bird populations steadily declining, assessing the causes of vagrancy could help scientists better understand the threats birds face and the ways they adapt to those threats. For example, birds that wind up in unfamiliar territory are likely to face challenges finding food and habitats that suit them, and may die as a result. But it also could be beneficial for birds whose traditional homes are becoming uninhabitable due to climate change, by \"accidentally\" introducing the animals into geographic regions that are now better suited for them.<\/span>\r<br>\r<br><span>Earth's magnetic field, which runs between the North and South Poles, is generated by several factors, both above and below the planet's surface. Decades' worth of lab research suggests that birds can sense magnetic fields using magnetoreceptors in their eyes.<\/span>\r<br>\r<br><span>\"There's increasing evidence that birds can actually see geomagnetic fields,\" said Morgan Tingley, the paper's corresponding author and a UCLA associate professor of ecology and evolutionary biology. \"In familiar areas, birds may navigate by geography, but in some situations it's easier to use geomagnetism.\" <\/span>\r<br>\r<br><span>But birds' ability to navigate using geomagnetic fields can be impaired when those magnetic fields are disturbed. Such disturbances can come from the sun's magnetic field, for example, particularly during periods of heightened solar activity, such as sunspots and solar flares, but also from other sources. While other factors such as weather likely play bigger roles in causing vagrancy, the researchers found a strong correlation between birds that were captured far outside of their expected range and the geomagnetic disturbances that occurred during both fall and spring migrations. But the relationship was particularly pronounced during the fall migration, the authors noted.<\/span>\r<br>\r<br><span>Geomagnetic disturbances affected the navigation of both young birds and their elders, suggesting that birds rely similarly on geomagnetism regardless of their level of migration experience. The researchers had expected that geomagnetic disturbances associated with heightened solar activity would be associated with the most vagrancy. To their surprise, solar activity actually reduced the <\/span>incidence of vagrancy. One possible reason is that radiofrequency activity generated by the solar disturbances could make birds' magnetoreceptors unusable, leaving birds to navigate by other cues instead. \"We think the combination of high solar activity and geomagnetic disturbance leads to either a pause in migration or a switch to other cues during fall migration,\" researchers said. \"Interestingly, birds that migrate during the day were generally exceptions to this rule—they were more affected by solar activity,” they added.", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>None of the following statements is implied in the 2<\/span><span><sup>nd<\/sup><\/span><span> Paragraph of the passage EXCEPT:<\/span>", "options": ["Studying vagrancy can help scientists in the conservation of bird populations by developing strategies to help them adapt to threats.", "Decline in North America’s bird population can be attributed to vagrancy among migrating bird populations.", "Migratory birds from North America end up in hostile habitats and are unable to return to their original habitats.", "The causes of vagrancy can help identify the threats that birds face during migration and how they adapt to these threats."], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>North America's decline in bird population is not directly related to vagrancy, but assessing the causes of vagrancy can help scientists better understand the threats birds face, including the decline in bird population. Birds that end up in unfamiliar territory due to vagrancy are likely to face challenges finding food and suitable habitats, which can ultimately lead to death. Additionally, some birds' traditional habitats are becoming uninhabitable due to climate change. Vagrancy, in some cases, may accidentally introduce the birds into geographic regions that are now better suited for them. Options 1 and 4 can be examined carefully – however, both the points mentioned in ‘help in conservation’ and ‘developing strategies to help birds adapt to threats’ are farfetched conclusions.<\/span>\r<br /><span>Hence, [<\/span><span>4<\/span><span>].<\/span>", "topic": "Inference"}, {"number": 3, "sourceId": "16939099520552", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>It seems logical enough that bad weather can sometimes cause birds to become disoriented during their annual fall migrations—causing them to wind up in territory they're unaccustomed to. But why, even when weather is not a major factor, do birds travel far away from their usual routes? A new paper by UCLA ecologists explores one reason: disturbances to Earth's magnetic field can lead birds astray—a phenomenon scientists call \"vagrancy\"—even in perfect weather, and especially during fall migration.<\/span>\r<br>\r<br><span>With North America's bird populations steadily declining, assessing the causes of vagrancy could help scientists better understand the threats birds face and the ways they adapt to those threats. For example, birds that wind up in unfamiliar territory are likely to face challenges finding food and habitats that suit them, and may die as a result. But it also could be beneficial for birds whose traditional homes are becoming uninhabitable due to climate change, by \"accidentally\" introducing the animals into geographic regions that are now better suited for them.<\/span>\r<br>\r<br><span>Earth's magnetic field, which runs between the North and South Poles, is generated by several factors, both above and below the planet's surface. Decades' worth of lab research suggests that birds can sense magnetic fields using magnetoreceptors in their eyes.<\/span>\r<br>\r<br><span>\"There's increasing evidence that birds can actually see geomagnetic fields,\" said Morgan Tingley, the paper's corresponding author and a UCLA associate professor of ecology and evolutionary biology. \"In familiar areas, birds may navigate by geography, but in some situations it's easier to use geomagnetism.\" <\/span>\r<br>\r<br><span>But birds' ability to navigate using geomagnetic fields can be impaired when those magnetic fields are disturbed. Such disturbances can come from the sun's magnetic field, for example, particularly during periods of heightened solar activity, such as sunspots and solar flares, but also from other sources. While other factors such as weather likely play bigger roles in causing vagrancy, the researchers found a strong correlation between birds that were captured far outside of their expected range and the geomagnetic disturbances that occurred during both fall and spring migrations. But the relationship was particularly pronounced during the fall migration, the authors noted.<\/span>\r<br>\r<br><span>Geomagnetic disturbances affected the navigation of both young birds and their elders, suggesting that birds rely similarly on geomagnetism regardless of their level of migration experience. The researchers had expected that geomagnetic disturbances associated with heightened solar activity would be associated with the most vagrancy. To their surprise, solar activity actually reduced the <\/span>incidence of vagrancy. One possible reason is that radiofrequency activity generated by the solar disturbances could make birds' magnetoreceptors unusable, leaving birds to navigate by other cues instead. \"We think the combination of high solar activity and geomagnetic disturbance leads to either a pause in migration or a switch to other cues during fall migration,\" researchers said. \"Interestingly, birds that migrate during the day were generally exceptions to this rule—they were more affected by solar activity,” they added.", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>In which of the following scenarios would researchers be confident in asserting that birds used magnetoreceptors to migrate?<\/span>", "options": ["When the birds are migrating in their known territories where they do not need internal cues to navigate.", "When the birds migrate successfully during periods of increased solar activity which interferes with Earth’s magnetic field.", "When the birds are migrating far outside of their expected range during a period of geomagnetic disturbances.", "When the birds are migrating due to alterations in weather patterns."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>The passage states that birds can sense magnetic fields using magnetoreceptors in their eyes, but this ability can be impaired when magnetic fields are disturbed. While other factors such as weather likely play bigger roles in causing vagrancy, the researchers found a strong correlation between birds that were captured far outside of their expected range and the geomagnetic disturbances that occurred during both fall and spring migrations. Thus, in the situation where birds are migrating far outside of their expected range during a period of geomagnetic disturbances, (using vagrancy as a yardstick) researchers can be certain that birds migrated using magnetoreceptors.<\/span>\r<br /><span>Option 1 is incorrect as the birds may navigate by geography in their familiar areas.<\/span>\r<br /><span>Option 2 is incorrect as heightened solar activity can also cause magnetic field disturbances which may impair birds' ability to navigate using magnetoreceptors.<\/span>\r<br /><span>Option 4 is incorrect as changes in weather patterns do not necessarily indicate that the birds are using magnetoreceptors to navigate.<\/span>\r<br />Hence, [3].", "topic": "Inference"}, {"number": 4, "sourceId": "16939099520553", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>It seems logical enough that bad weather can sometimes cause birds to become disoriented during their annual fall migrations—causing them to wind up in territory they're unaccustomed to. But why, even when weather is not a major factor, do birds travel far away from their usual routes? A new paper by UCLA ecologists explores one reason: disturbances to Earth's magnetic field can lead birds astray—a phenomenon scientists call \"vagrancy\"—even in perfect weather, and especially during fall migration.<\/span>\r<br>\r<br><span>With North America's bird populations steadily declining, assessing the causes of vagrancy could help scientists better understand the threats birds face and the ways they adapt to those threats. For example, birds that wind up in unfamiliar territory are likely to face challenges finding food and habitats that suit them, and may die as a result. But it also could be beneficial for birds whose traditional homes are becoming uninhabitable due to climate change, by \"accidentally\" introducing the animals into geographic regions that are now better suited for them.<\/span>\r<br>\r<br><span>Earth's magnetic field, which runs between the North and South Poles, is generated by several factors, both above and below the planet's surface. Decades' worth of lab research suggests that birds can sense magnetic fields using magnetoreceptors in their eyes.<\/span>\r<br>\r<br><span>\"There's increasing evidence that birds can actually see geomagnetic fields,\" said Morgan Tingley, the paper's corresponding author and a UCLA associate professor of ecology and evolutionary biology. \"In familiar areas, birds may navigate by geography, but in some situations it's easier to use geomagnetism.\" <\/span>\r<br>\r<br><span>But birds' ability to navigate using geomagnetic fields can be impaired when those magnetic fields are disturbed. Such disturbances can come from the sun's magnetic field, for example, particularly during periods of heightened solar activity, such as sunspots and solar flares, but also from other sources. While other factors such as weather likely play bigger roles in causing vagrancy, the researchers found a strong correlation between birds that were captured far outside of their expected range and the geomagnetic disturbances that occurred during both fall and spring migrations. But the relationship was particularly pronounced during the fall migration, the authors noted.<\/span>\r<br>\r<br><span>Geomagnetic disturbances affected the navigation of both young birds and their elders, suggesting that birds rely similarly on geomagnetism regardless of their level of migration experience. The researchers had expected that geomagnetic disturbances associated with heightened solar activity would be associated with the most vagrancy. To their surprise, solar activity actually reduced the <\/span>incidence of vagrancy. One possible reason is that radiofrequency activity generated by the solar disturbances could make birds' magnetoreceptors unusable, leaving birds to navigate by other cues instead. \"We think the combination of high solar activity and geomagnetic disturbance leads to either a pause in migration or a switch to other cues during fall migration,\" researchers said. \"Interestingly, birds that migrate during the day were generally exceptions to this rule—they were more affected by solar activity,” they added.", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following statements best reflects the effect of geomagnetic disturbances associated with heightened solar activity on bird vagrancy?<\/span>", "options": ["<span>Since solar activity primarily affected the sunlit side of the Earth, day time migrants paused their migration thus eliminating the incidence of vagrancy.<\/span>", "<span><\/span>\t<span>Solar activity increased the vagrancy in some daytime migrants but mitigated vagrancy for night<\/span><span> <\/span><span>time migrating species.<\/span>", "<span><\/span>\t<span>Since radiofrequency noise from solar activity disabled birds’ magnetoreceptors, the incidence of vagrancy became widespread among migrating birds.<\/span>", "<span><\/span>\t<span>Generally, heightened solar activity unexpectedly had no negative impact on the success of migration.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>Refer to the last two paragraphs: Solar activity can cause geomagnetic disturbances that impact bird navigation during both fall and spring migrations. Researchers found a strong correlation between birds captured outside their expected range and geomagnetic disturbances. Researchers had expected heightened solar activity to be associated with more vagrancy, but they found that it actually reduced vagrancy. (<\/span><span>perhaps<\/span><span> because the birds paused their migration or used other cues at such times). The author states that “\"Interestingly, birds that migrate during the day were generally exceptions to this rule—they were more affected by solar activity.” Option 2 is thus supported.<\/span>\r<br /><span>Option 1. Vagrancy increased among day time migrants.<\/span>\r<br /><span>Option 2. Correct.<\/span>\r<br /><span>Option 3. Contradicts the passage – it was less for some species and more for others.<\/span>\r<br /><span>Option 4. This means there was no vagrancy, which is incorrect.<\/span>\r<br /><span>Hence, [<\/span><span>2<\/span><span>].<\/span>", "topic": "Inference"}, {"number": 5, "sourceId": "16939099520554", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>The idea of learning styles as we know it today began to take shape with the VARK model (visual, auditory, reading, kinaesthetic). The most recognisable application of learning styles is the notion that visual learners learn best when information is presented visually, auditory learners learn best when listening to recordings, and kinaesthetic learners learn best when engaging in physical or tactile activities.<\/span><br><br><span>Learning styles can be seen as something that emerged from a progressive movement that stressed individual differences in children and sought to apply more empirical methods to the study of how learning happens. Developments in personality psychology based on grouping people by the way they relate to the world lent a further scientific plausibility to the learning styles approach.<\/span><br><br><span>By the end of the 20th century, learning styles had become a pedagogical behemoth that fuelled a whole industry of books, workshops, consultants and even government support. Yet, along the way, something went badly wrong as the theory became detached from science and reality. In 2004, when Frank Coffield led a review of the relevant research literature, his team identified an astonishing 71 different learning styles, and they compiled a wide array of associated journal articles, magazine features, websites and conference papers, few of which were peer-reviewed or conducted in well-designed studies.<\/span><br><br><span>With its huge popularity and deep roots in educational reform and psychology, you might wonder what is so problematic about learning styles theory. The first is the validity of the learning styles concept – that is, whether ‘learning style’ is a real and specific property of individuals, whereby they learn material better when it is presented to them in a particular modality. And, if it is real, can a learning style actually be measured?<\/span><br><br><span>What learning style tools measure is not a learning style, but rather a learning preference. Someone may prefer to listen to audiobooks as opposed to reading a book. The problem is, there is no evidence that using audio will lead such a person to a better understanding of the content or retention of <\/span>knowledge gained from it. Consider a 2016 study that tested whether visual learners learned better when presented with material in the form of pictures, and whether verbal learners learned better when material was presented as words. Although the visual learners felt more confident when studying pictures and the verbal learners felt more confident studying words, the researchers found no difference in the learning performance of the groups for the different kinds of material. This result and others like it suggest that, even if we accept that individuals have preferences for how they learn, there is no way of assessing their postulated learning style with any accuracy.<br><br><span>Learning styles theory suggests that people have discrete groups of learning preferences, but measurement problems suggest that this is not always the case. The effectiveness of learning methods is determined more by the nature of the material being learned than by subjective preferences. For example, visual aids are more effective for learning geography, while auditory aids are more helpful for learning pronunciation in language acquisition.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\tT<span>he author suggests all of these problems with VARK model of learning styles EXCEPT:<\/span>", "options": ["<span>There is no scientific validity or evidence for the claims made by VARK model.<\/span>", "<span><\/span>\t<span>People do not have specific and distinct groups of learning preferences.<\/span>", "<span><\/span>\t<span>Effectiveness of learning methods <\/span><span>is<\/span><span> determined by subjective preferences.<\/span>", "<span><\/span>\t<span>There is no reliable way to measure and categorize someone's learning style.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>Option 1 is stated in the passage when the author mentions the lack of scientific validity and evidence to support the VARK model.<\/span>\r<br /><span>Option 2 is also discussed in the passage when the author questions the validity of discrete groups of learning preferences proposed by learning styles theory.<\/span>\r<br /><span>Option 3, is not presented as a problem with the VARK model of learning style in the passage. In fact, the author argues that the effectiveness of learning methods is determined more by the nature of the material being learned than by subjective preferences. Therefore, option 3 is the correct answer.<\/span>\r<br /><span>Option 4 is also mentioned in the passage when the author argues that measurement problems make it difficult to accurately assess someone's learning style.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Specific Detail Question"}, {"number": 6, "sourceId": "16939099520565", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>The idea of learning styles as we know it today began to take shape with the VARK model (visual, auditory, reading, kinaesthetic). The most recognisable application of learning styles is the notion that visual learners learn best when information is presented visually, auditory learners learn best when listening to recordings, and kinaesthetic learners learn best when engaging in physical or tactile activities.<\/span><br><br><span>Learning styles can be seen as something that emerged from a progressive movement that stressed individual differences in children and sought to apply more empirical methods to the study of how learning happens. Developments in personality psychology based on grouping people by the way they relate to the world lent a further scientific plausibility to the learning styles approach.<\/span><br><br><span>By the end of the 20th century, learning styles had become a pedagogical behemoth that fuelled a whole industry of books, workshops, consultants and even government dying pictures and the verbal learners felt more confident studying words, the researchers found no difference in the learning performance of the groups for the different kinds of material. This result and others like it suggest that, even if we accept that individuals have preferences for how they learn, there is no way of assessing their postulated learning style with any accuracy.<br><br><span>Learning styles theory suggests that people have discrete groups of learning preferences, but measurement problems suggest that this is not always the case. The effectiveness of learning methods is determined more by the nature of the material being learned than by subjective preferences. For example, visual aids are more effective for learning geography, while auditory aids are more helpful for learning pronunciation in language acquisition.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which one of the following statements, if false, could be seen as contradicting the facts/arguments in the passage?<\/span>", "options": ["<span>Majority of the research papers published on educational practice support the application of learning styles to instructional methodology.<\/span>", "<span><\/span>\t<span>Matching the mode of instruction to modality-specific learning preferences is based on both the ability of the learner and the content. <\/span><span><\/span>", "<span><\/span>\t<span>if individuals are given instruction in their preferred modality, they will experience enhanced learning outcomes.<\/span>", "<span><\/span>\t<span>the learning material delivered via one sensory modality is processed in the brain independently from material delivered via other sensory modalities.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span>‘If false … contradicts the passage’<\/span><span> means ‘<\/span><span>which of the following … supports the passage<\/span><span>?’<\/span>\r<br /><span>Option 1. Supports the facts/arguments in the passage. (<\/span><span>refer<\/span><span> to the third paragraph: “pedagogical behemoth that fuelled a whole industry of books…”<\/span>\r<br /><span>Option 2. Contradicts the facts/arguments in the passage. If false it does not contradict.<\/span>\r<br /><span>Option 3. Contradicts the facts/arguments in the passage If false it does not contradict.<\/span>\r<br /><span>Option 4. Contradicts the facts/arguments in the passage. If false it does not contradict.<\/span>\r<br /><span>Hence, [<\/span><span>1<\/span><span>].<\/span>", "topic": "Application Question"}, {"number": 9, "sourceId": "16939099520568", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br> <br><br><span>A new study published in the journal <\/span><span>PNAS<\/span><span> has found that human feelings can accurately be expressed numerically and have more predictive power for how we behave than formal studies of socioeconomic factors like household income and employment status.<\/span><br><br><span>Andrew <\/span><span>Oswald<\/span><span>, a professor of economics and <\/span><span>behavioral<\/span><span> science at the University of Warwick, and colleagues gathered information from three large data sets of nearly 700,000 people in Germany, Australia and the United Kingdom. Participants were asked annually over a three-decade period how they felt on a numerical scale about their job, spouse, health and home. Using the data collected, researchers constructed statistical models to show how people felt and the actions they took as a result of their reported feelings. The study found that ratings of life satisfaction had a direct linear relationship to actions people subsequently take.<\/span><br><br><span>Participants who rated their job satisfaction as a 2 out of 7, for example, had a 25 percent probability of quitting their job in the next quarter. Those who rated their job satisfaction a 6 out of 7 had only a 10 percent probability of quitting. The same was true across other measures like marriage, health and housing. Similarly, those who rated their marriages lower were more likely to get divorced, and those who rated their health positively were less likely to end up in the hospital.<\/span><br><br><span>Human measurement of feelings goes beyond psychology and extends into the realm of economics. Economists have previously been critical of feelings data because they deemed them unscientific and unreliable… This study showed that socioeconomic factors had a lesser probability of predicting human behaviour than data on feelings. But while the study has shown that numbers can quantify feelings, researchers are still a bit perplexed as to why estimates of seemingly subjective feelings can be such good predictors of future actions.<\/span><br><br>According to Oswald, a number of factors could be at play. Humans are well versed in comparative thinking and have the ability to scale their own life satisfaction against that of their <span>neighbors<\/span><span>… We’re also accustomed to using measuring devices for other aspects of life like temperature, distance and weight, so it shouldn’t be too surprising that we’re able to measure our feelings in a similarly accurate way for life-defining events such as relationships and a career.<\/span><br><br><span>Study co-author Caspar Kaiser says that it may also be because we exercise these mental muscles every day. This could be why it comes out in the data more accurately than in objective markers. “These days we’re asked to rate nearly everything from movies to restaurants to podcasts …” he says.<\/span><br><br><span>Looking ahead, Kaiser hopes that this same data can be studied in lower-income countries so that it can be applied universally to places with varied levels of economic development. But more than anything else he’s interested in studying why feelings work so well. “While we know that humans have a remarkable ability to encode their feelings along a cardinal scale, we still don’t know for sure how it’s done,” he says.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following best expresses the main conclusion of Andrew <\/span><span>Oswald<\/span><span>‘s study?<\/span>", "options": ["<span>Human feelings expressed as numerical values are accurate indicators of social and economic circumstances which regulate human <\/span><span>behavior<\/span><span>.<\/span>", "<span><\/span>\t<span>Though human feelings cannot be quantified, they are more reliable predictors of human <\/span><span>behavior<\/span><span> compared to socioeconomic factors.<\/span>", "<span><\/span>\t<span>Humans manage to assign accurate numerical values for their feelings and in combination with socio economic factors determine human <\/span><span>behavior<\/span><span>.<\/span>", "<span><\/span>\t<span>Human feelings can be expressed numerically and have a greater probability of predicting human <\/span><span>behavior<\/span><span> than socioeconomic factors.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>“A new study published in the journal&nbsp;<\/span><span>Proceedings of the National Academy of Sciences&nbsp;<\/span><span>(<\/span><span>PNAS<\/span><span>) has found that human feelings can accurately be expressed numerically and have more predictive power for how we behave than formal studies of socioeconomic factors like household income and employment status.”<\/span>\r<br /><span>The conclusion has two aspects. 1. Human feelings can be quantified on a numerical scale. 2. These integers assigned to feelings can better predict human behaviour than other factors of a person’s social and economic circumstances.<\/span>\r<br /><span>Both aspects of the conclusion are well captured in option 4.<\/span>\r<br />Option 1. They are not “indicators of social and economic circumstances”, but values assigned to feelings.\r<br /><span>Option 2. Human feelings can be quantified.<\/span>\r<br /><span>Option 3. The study does not conclude ‘in combination with’.<\/span>\r<br /><span>Option 4. Correct.<\/span>\r<br /><span>Hence, [<\/span><span>4<\/span><span>].<\/span>", "topic": "Specific Detail Question"}, {"number": 10, "sourceId": "16939099520589", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br> <br><br><span>A new study published in the journal <\/span><span>PNAS<\/span><span> has found that human feelings can accurately be expressed numerically and have more predictive power for how we behave than formal studies of socioeconomic factors like household income and employment status.<\/span><br><br><span>Andrew <\/span><span>Oswald<\/span><span>, a professor of economics and <\/span><span>behavioral<\/span><span> science at the University of Warwick, and colleagues gathered information from three large data sets of nearly 700,000 people in Germany, Australia and the United Kingdom. Participants were asked annually over a three-decade period how they felt on a numerical scale about their job, spouse, health and home. Using the data collected, researchers constructed statistical models to show how people felt and the actions they took as a result of their reported feelings. The study found that ratings of life satisfaction had a direct linear relationship to actions people subsequently take.<\/span><br><br><span>Participants who rated their job satisfaction as a 2 out of 7, for example, had a 25 percent probability of quitting their job in the next quarter. Those who rated their job satisfaction a 6 out of 7 had only a 10 percent probability of quitting. The same was true across other measures like marriage, health and housing. Similarly, those who rated their marriages lower were more likely to get divorced, and those who rated their health positively were less likely to end up in the hospital.<\/span><br><br><span>Human measurement of feelings goes beyond psychology and extends into the realm of economics. Economists have previously been critical of feelings data because they deemed them unscientific and unreliable… This study showed that socioeconomic factors had a lesser probability of predicting human behaviour than data on feelings. But while the study has shown that numbers can quantify feelings, researchers are still a bit perplexed as to why estimates of seemingly subjective feelings can be such good predictors of future actions.<\/span><br><br>According to Oswald, a number of factors could be at play. Humans are well versed in comparative thinking and have the ability to scale their own life satisfaction against that of their <span>neighbors<\/span><span>… We’re also accustomed to using measuring devices for other aspects of life like temperature, distance and weight, so it shouldn’t be too surprising that we’re able to measure our feelings in a similarly accurate way for life-defining events such as relationships and a career.<\/span><br><br><span>Study co-author Caspar Kaiser says that it may also be because we exercise these mental muscles every day. This could be why it comes out in the data more accurately than in objective markers. “These days we’re asked to rate nearly everything from movies to restaurants to podcasts …” he says.<\/span><br><br><span>Looking ahead, Kaiser hopes that this same data can be studied in lower-income countries so that it can be applied universally to places with varied levels of economic development. But more than anything else he’s interested in studying why feelings work so well. “While we know that humans have a remarkable ability to encode their feelings along a cardinal scale, we still don’t know for sure how it’s done,” he says.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>All of the following, if true, will undermine the argument in Paragraph 3, EXCEPT:<\/span>", "options": ["Participants who rated their job satisfaction as a 2 out of 7 did not plan to quit because of job security and high salary.", "Some of the participants who rated their job satisfaction as a 6 out of 7 planned to quit their job in the next quarter for better prospects.", "Women participants who rated their marriages lower did not intend to get divorced for the sake of their children unlike those who rated their marriages higher.", "Participants who rated their health positively were equally or more likely to end up in the hospital than those who rated their health negatively."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>The argument in the third paragraph is: “Participants who rated their satisfaction low have greater probability of quitting (job/marriage) in the next quarter.”  One potential weakness of the argument implied in the third paragraph is that it relies solely on self-reported feelings and does not take into account other factors that could affect behaviour.  Additionally, other external factors beyond feelings may play a role in whether someone gets divorced or ends up in the hospital.<\/span>\r<br /><span>Option 1. If they do not intend to quit for other reasons (though they rated low), it weakens the argument. They are unlikely to quit.<\/span>\r<br /><span>Option 2. This is an exception as it does not weaken the argument. The argument is not about people who rate themselves highly. It does not even imply that happy people don’t quit. The argument does not say that ALL those who rated themselves high will not quit. The passage is talking about a higher probability of not quitting.&nbsp;<\/span><span>So<\/span><span> this statement agrees with the argument and does not weaken it. The fact does not undermine that ‘Participants who rated their job satisfaction as a 2 out of 7, for example, had a 25 percent probability of quitting their job (compared to 10% of 6/7 rating) in the next quarter” – ‘some’ may belong to the 10%. (‘Some’ can mean a few people). So, that will not change the probability.&nbsp;<\/span>\r<br /><span>Option 3. Similar to 1. External factors are at play here;&nbsp;<\/span><span>so<\/span><span> the argument that low rating in marriage is more likely to result in divorce is weakened.<\/span>\r<br /><span>Option 4. The passage does not say ‘end up in hospital’ for what reason. Here, the likelihood of ending up in hospital cannot be correlated to the rating. The person who rated high could the next day be diagnosed with a fatal illness and be hospitalised.<\/span>\r<br /><span>Hence, [<\/span><span>2<\/span><span>].<\/span>\r<br />\r<br /><span><b><\/b><\/span>", "topic": "Inference"}, {"number": 11, "sourceId": "169390995205810", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br> <br><br><span>A new study published in the journal <\/span><span>PNAS<\/span><span> has found that human feelings can accurately be expressed numerically and have more predictive power for how we behave than formal studies of socioeconomic factors like household income and employment status.<\/span><br><br><span>Andrew <\/span><span>Oswald<\/span><span>, a professor of economics and <\/span><span>behavioral<\/span><span> science at the University of Warwick, and colleagues gathered information from three large data sets of nearly 700,000 people in Germany, Australia and the United Kingdom. Participants were asked annually over a three-decade period how they felt on a numerical scale about their job, spouse, health and home. Using the data collected, researchers constructed statistical models to show how people felt and the actions they took as a result of their reported feelings. The study found that ratings of life satisfaction had a direct linear relationship to actions people subsequently take.<\/span><br><br><span>Participants who rated their job satisfaction as a 2 out of 7, for example, had a 25 percent probability of quitting their job in the next quarter. Those who rated their job satisfaction a 6 out of 7 had only a 10 percent probability of quitting. The same was true across other measures like marriage, health and housing. Similarly, those who rated their marriages lower were more likely to get divorced, and those who rated their health positively were less likely to end up in the hospital.<\/span><br><br><span>Human measurement of feelings goes beyond psychology and extends into the realm of economics. Economists have previously been critical of feelings data because they deemed them unscientific and unreliable… This study showed that socioeconomic factors had a lesser probability of predicting human behaviour than data on feelings. But while the study has shown that numbers can quantify feelings, researchers are still a bit perplexed as to why estimates of seemingly subjective feelings can be such good predictors of future actions.<\/span><br><br>According to Oswald, a number of factors could be at play. Humans are well versed in comparative thinking and have the ability to scale their own life satisfaction against that of their <span>neighbors<\/span><span>… We’re also accustomed to using measuring devices for other aspects of life like temperature, distance and weight, so it shouldn’t be too surprising that we’re able to measure our feelings in a similarly accurate way for life-defining events such as relationships and a career.<\/span><br><br><span>Study co-author Caspar Kaiser says that it may also be because we exercise these mental muscles every day. This could be why it comes out in the data more accurately than in objective markers. “These days we’re asked to rate nearly everything from movies to restaurants to podcasts …” he says.<\/span><br><br><span>Looking ahead, Kaiser hopes that this same data can be studied in lower-income countries so that it can be applied universally to places with varied levels of economic development. But more than anything else he’s interested in studying why feelings work so well. “While we know that humans have a remarkable ability to encode their feelings along a cardinal scale, we still don’t know for sure how it’s done,” he says.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>“Human measurement of feelings goes beyond psychology and extends into the realm of economics.” In the context of the passage, what is the author trying to communicate in this quoted extract?<\/span>", "options": ["<span>The measurement of human feelings is not as important for psychological research as it is relevant to the field of economics.<\/span>", "<span><\/span>\t<span>Economic measurements of human feelings are more reliable than psychological measurements.<\/span>", "<span><\/span>\t<span>Human feelings can have an impact on economic <\/span><span>behavior<\/span><span> and can be used as a predictor of future economic activity.<\/span>", "<span><\/span>\t<span>Human feelings are not relevant to economics, but psychology is a key factor in economic decision-making.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>The author is trying to communicate that the measurement of human feelings is not just important for psychological research, but is also relevant to the field of economics. This suggests that human feelings can have an impact on economic behaviour, such as job retention or divorce rates, and can be used as a predictor of future economic activity. This idea is best captured in option 3.<\/span>\r<br />Option 1. Contradicts the author’s interdisciplinary approach to feelings.\r<br /><span>Option 2. The author is not making a claim about the reliability of economic measurements of human feelings versus psychological measurements.<\/span>\r<br /><span>Option 3. Correct<\/span>\r<br /><span>Option 4. The author is not suggesting that human feelings are not relevant to economics, but rather highlighting the connection between the two fields in measuring human feelings.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Inference"}, {"number": 12, "sourceId": "169390995205811", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br> <br><br><span>A new study published in the journal <\/span><span>PNAS<\/span><span> has found that human feelings can accurately be expressed numerically and have more predictive power for how we behave than formal studies of socioeconomic factors like household income and employment status.<\/span><br><br><span>Andrew <\/span><span>Oswald<\/span><span>, a professor of economics and <\/span><span>behavioral<\/span><span> science at the University of Warwick, and colleagues gathered information from three large data sets of nearly 700,000 people in Germany, Australia and the United Kingdom. Participants were asked annually over a three-decade period how they felt on a numerical scale about their job, spouse, health and home. Using the data collected, researchers constructed statistical models to show how people felt and the actions they took as a result of their reported feelings. The study found that ratings of life satisfaction had a direct linear relationship to actions people subsequently take.<\/span><br><br><span>Participants who rated their job satisfaction as a 2 out of 7, for example, had a 25 percent probability of quitting their job in the next quarter. Those who rated their job satisfaction a 6 out of 7 had only a 10 percent probability of quitting. The same was true across other measures like marriage, health and housing. Similarly, those who rated their marriages lower were more likely to get divorced, and those who rated their health positively were less likely to end up in the hospital.<\/span><br><br><span>Human measurement of feelings goes beyond psychology and extends into the realm of economics. Economists have previously been critical of feelings data because they deemed them unscientific and unreliable… This study showed that socioeconomic factors had a lesser probability of predicting human behaviour than data on feelings. But while the study has shown that numbers can quantify feelings, researchers are still a bit perplexed as to why estimates of seemingly subjective feelings can be such good predictors of future actions.<\/span><br><br>According to Oswald, a number of factors could be at play. Humans are well versed in comparative thinking and have the ability to scale their own life satisfaction against that of their <span>neighbors<\/span><span>… We’re also accustomed to using measuring devices for other aspects of life like temperature, distance and weight, so it shouldn’t be too surprising that we’re able to measure our feelings in a similarly accurate way for life-defining events such as relationships and a career.<\/span><br><br><span>Study co-author Caspar Kaiser says that it may also be because we exercise these mental muscles every day. This could be why it comes out in the data more accurately than in objective markers. “These days we’re asked to rate nearly everything from movies to restaurants to podcasts …” he says.<\/span><br><br><span>Looking ahead, Kaiser hopes that this same data can be studied in lower-income countries so that it can be applied universally to places with varied levels of economic development. But more than anything else he’s interested in studying why feelings work so well. “While we know that humans have a remarkable ability to encode their feelings along a cardinal scale, we still don’t know for sure how it’s done,” he says.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following is NOT acknowledged by the researchers as a limitation of the study?<\/span>", "options": ["<span>Lack of attention to other factors that influence decision-making.<\/span>", "<span><span><\/span>\t<span>L<\/span><span>imited generalizability to cultures other than the ones studied.<\/span>", "<span><\/span>\t<span>Lack of numerical units that can measure human feelings.<\/span>", "<span><\/span>\t<span>Lack of knowledge of how feelings are encoded on a cardinal scale.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>The researchers acknowledge the other three limitations mentioned in the options. They acknowledge the limitations of not accounting for other factors that may influence decision-making (According to Oswald, a number of factors could be at play), the limited generalizability of the study to cultures other than those studied (“Germany, Australia and the United Kingdom” and “Kaiser hopes that this same data can be studied in lower-income countries …levels of economic development”), and the lack of knowledge about how feelings are encoded on a cardinal scale (“While we know that humans have a remarkable ability to encode their feelings along a cardinal scale, we still don’t know for sure how it’s done”).  However, they do not acknowledge the limitation of a lack of numerical units to measure human feelings. In fact, the researchers argue that feelings can be expressed numerically.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Specific Detail Question"}, {"number": 13, "sourceId": "169390995205812", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>The apotheosis of histology, and perhaps the most spectacular revelation in the history of anatomy, came in 1888 when Santiago Ramón y Cajal demonstrated the anatomical independence of nerve cells, later termed neurons and defined as the basic units of the brain. Cajal became the first person to use the term <\/span><span>plasticity<\/span><span> when referring to the central nervous system and its ability to change its structure in response to experience, introducing a concept that has become <\/span><span>en<\/span><span> vogue<\/span><span> in many modern fields, including psychology and education.<\/span><br><br><span>Imaging technology in the 21st century is beyond what Cajal and his contemporaries could have imagined, but our desire remains the same. We have preserved the structure of our own enquiry. Gone may be the days of dusty, cork-stopped bottles filled with eerie fluids, of cheap light microscopes, of practising microscopy alone in the kitchen or the attic. Yet cells, no matter how you image them, are still mostly water. Adding colour is still necessary.<\/span><br><br><span>The histology of the 19th century has led to a world of unprecedented clarity and vividness, promising immaculate control of complex processes, no longer susceptible to the vagaries of laboratory chemistry. A technique called immunofluorescence, first described in 1942, employs antibodies tagged with fluorescent compounds that reemit light upon excitation and thus function, in the eyes of an observer, like dyes. Another technique, CLARITY renders tissue transparent with monomers called hydrogels, allowing immunofluorescent stains to expose neurons in the whole brain.<\/span><br><br><span>A technique known as optogenetics became popular at the start of the 21st century. Instead of chemical reagents, optogenetics relies on photosensitive proteins, or opsins; instead of revealing the structure of cells, the technique tracks their function. With genetic engineering, researchers add new <\/span>code to certain neurons that allows them to make opsins. Then they shine a certain kind of light at those neurons to open their ion channels and fire the electrical signal, thus stimulating their activity. By precisely controlling the processes of the engineered neurons, researchers can observe how other neurons respond, thereby illuminating the brain’s circuitry,<span> <\/span><span>carefully and selectively. Already, optogenetics has been used to help patients recover after a stroke and to provide insight into the mechanisms behind anxiety. Scientists hope that their findings will lead to advances in treating Alzheimer’s and PTSD. But, technically optogenetics is a method of <\/span><span>perturbing<\/span><span> not imaging; the colours are useful only to turn neurons on and off.<\/span><br><br><span>The most obvious heir to the spirit of Cajal’s histology is a technique called ‘<\/span><span>Brainbow<\/span><span>’, which introduces coral, jellyfish and sea anemone DNA into mice, fruit flies and other small animals. The fluorescent proteins produced as a result are blue, cyan, yellow, orange and red. When mixed, they create a palette of hundreds of distinctive hues. In this collage of vibrant colour, cell bodies appear like neon raindrops. <\/span><span>Brainbow<\/span><span> technique can trace many neurons at once. Neuroscientists these days are more concerned with populations of neurons than they are with individuals. Yet there is something intimate and revealing about the staining of a single cell, like the portrait of a human being. ‘Only true artists are attracted to science,’ Cajal said.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following best describes Santiago Ramón y Cajal’s contribution to histology?<\/span>", "options": ["<span>Cajal demonstrated that neurons are continuous structures, and not individual cells that communicate with each other.<\/span>", "<span><\/span>\t<span>He introduced the concept of plasticity in neuroscience which is now widely used in many fields, including psychology and education.<\/span>", "<span><\/span>\t<span>Cajal demonstrated that neurons in the nervous system are distinct entities that are not physically connected to one another.<\/span>", "<span><\/span>\t<span>He was the first person to use the <\/span><span>Brainbow<\/span><span> technique to trace the development of neurons in the brain and study the function of different brain regions.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>Santiago Ramón y Cajal demonstrated the anatomical independence of neurons, which means that they are distinct entities that are not physically connected to one another.<\/span>\r<br /><span>Option 1 is incorrect because Cajal's contribution was precisely the opposite: he demonstrated that neurons are individual cells that communicate with each other.<\/span>\r<br /><span>Option 2 is partially correct but incomplete. Cajal did introduce the concept of plasticity in neuroscience, which refers to the brain's ability to change its structure and function in response to experience. However, plasticity is not specific to the nervous system but is a broader concept that applies to many biological and non-biological systems while the question pertains to histology.<\/span>\r<br /><span>Option 4 is incorrect because&nbsp;<\/span><span>Brainbow<\/span><span> is a modern technique that was developed later – “… heir to the spirit of Cajal’s histology is a technique called ‘<\/span><span>Brainbow<\/span><span>’”<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Specific Detail Question"}, {"number": 14, "sourceId": "169390995205913", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>The apotheosis of histology, and perhaps the most spectacular revelation in the history of anatomy, came in 1888 when Santiago Ramón y Cajal demonstrated the anatomical independence of nerve cells, later termed neurons and defined as the basic units of the brain. Cajal became the first person to use the term <\/span><span>plasticity<\/span><span> when referring to the central nervous system and its ability to change its structure in response to experience, introducing a concept that has become <\/span><span>en<\/span><span> vogue<\/span><span> in many modern fields, including psychology and education.<\/span><br><br><span>Imaging technology in the 21st century is beyond what Cajal and his contemporaries could have imagined, but our desire remains the same. We have preserved the structure of our own enquiry. Gone may be the days of dusty, cork-stopped bottles filled with eerie fluids, of cheap light microscopes, of practising microscopy alone in the kitchen or the attic. Yet cells, no matter how you image them, are still mostly water. Adding colour is still necessary.<\/span><br><br><span>The histology of the 19th century has led to a world of unprecedented clarity and vividness, promising immaculate control of complex processes, no longer susceptible to the vagaries of laboratory chemistry. A technique called immunofluorescence, first described in 1942, employs antibodies tagged with fluorescent compounds that reemit light upon excitation and thus function, in the eyes of an observer, like dyes. Another technique, CLARITY renders tissue transparent with monomers called hydrogels, allowing immunofluorescent stains to expose neurons in the whole brain.<\/span><br><br><span>A technique known as optogenetics became popular at the start of the 21st century. Instead of chemical reagents, optogenetics relies on photosensitive proteins, or opsins; instead of revealing the structure of cells, the technique tracks their function. With genetic engineering, researchers add new <\/span>code to certain neurons that allows them to make opsins. Then they shine a certain kind of light at those neurons to open their ion channels and fire the electrical signal, thus stimulating their activity. By precisely controlling the processes of the engineered neurons, researchers can observe how other neurons respond, thereby illuminating the brain’s circuitry,<span> <\/span><span>carefully and selectively. Already, optogenetics has been used to help patients recover after a stroke and to provide insight into the mechanisms behind anxiety. Scientists hope that their findings will lead to advances in treating Alzheimer’s and PTSD. But, techni advances made in brain imaging technologies.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>In the first paragraph, the author mentions the spectacular achievement of Cajal in the field of histology – the anatomical independence of nerve cells. The author comes back to brain science only at the end of the third paragraph. Even the whole passage is about histology related to&nbsp;<\/span>neuroscience. The two aspects of the quoted sentence are unchanged desire and structure of the enquiry even with the great advancements made in technology. – the desire is the goal, and structure is studying cells and tissues in the lab. Hence option 2 is valid.\r<br /><span>Option 1. This is a general statement about histology – always true. Not derived from the quote.<\/span>\r<br /><span>Option 3. Similar to 1.<\/span>\r<br /><span>Option 4. The quote is not specifically about brain enquiry, though the option is valid.<\/span>\r<br /><span>Hence, [<\/span><span>2<\/span><span>].<\/span>", "topic": "Inference"}, {"number": 15, "sourceId": "169390995205914", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>The apotheosis of histology, and perhaps the most spectacular revelation in the history of anatomy, came in 1888 when Santiago Ramón y Cajal demonstrated the anatomical independence of nerve cells, later termed neurons and defined as the basic units of the brain. Cajal became the first person to use the term <\/span><span>plasticity<\/span><span> when referring to the central nervous system and its ability to change its structure in response to experience, introducing a concept that has become <\/span><span>en<\/span><span> vogue<\/span><span> in many modern fields, including psychology and education.<\/span><br><br><span>Imaging technology in the 21st century is beyond what Cajal and his contemporaries could have imagined, but our desire remains the same. We h
