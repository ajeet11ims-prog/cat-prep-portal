<script type="application/json" id="test-data">{"testNumber": 12, "simcat": 12, "minutes": 40, "questions": [{"number": 1, "sourceId": "16946051270240", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br>Bureaucracies are forged in the smithy of politics. The decision to create such<span> <\/span>structures and maintain them is made by political actors<span> <\/span>involved in governance. The modern democratic<span> <\/span>governance requires a supporting bureaucratic apparatus because only an e<span>ffi<\/span>cient bureaucracy can generate the surplus capacity to absorb the high<span> <\/span>decision and transaction costs inherent in democracy.\r<br>\r<br>A nation that cannot feed or educate its citizens is unlikely to be able to support a<span> <\/span>functioning democracy. This necessity, however, plays out in<span> <\/span>a variety of ways.<span> <\/span>The relationship of bureaucracy to the electoral—often misnamed the political—institutions of government in<span>fl<\/span>uences bureaucratic structures, delimits the scope of its activities, and creates pressures to restrict or reduce bureaucracy. Different combinations of political institutions result in di<span>ff<\/span>erent<span> <\/span>implicit bargains with the bureaucracy, thus de<span>fi<\/span>ning bureaucracy’s responsibilities<span> <\/span>and scope. \r<br>\r<br>Political systems vary in their concentration of political power<span> <\/span>and decision-making processes; some political systems are centralized with<span> <\/span>unitary governments; others are decentralized with semi-autonomous governments exercising power in a fragmented political system. In centralized political<span> <\/span>systems (e.g, UK, France), the role of bureaucracy in establishing and maintaining state power is generally recognized. In France, the bureaucracy is viewed as the instrument by which republicanism seeks equality and other fundamental values. Such states provide a clearer ‘‘contract’’ with the bureaucracy by being more<span> <\/span>precise in de<span>fi<\/span>ning political roles and accepting the idea of signi<span>fi<\/span>cant discretion<span> <\/span>among career bureaucrats…\r<br>\r<br>In fragmented systems, the bureaucracy itself becomes a<span> <\/span>more political institution. The classic case of a fragmented political system<span> <\/span>failing to provide the political consensus to create a relationship with bureaucracy is the United States. Because the formal institutions of government<span> <\/span>cannot concentrate power and thus de<span>fi<\/span>ne political ends, the bureaucracy is left<span> <\/span>with the task of building support for its own mission from the bottom up rather<span> <\/span>than via a principal—agent contract with political branches. In this situation<span>, <\/span>bureaucracy is seen as a competitor for political power, and politicians perceive<span> <\/span>that running for election by campaigning against the bureaucracy is a viable<span> <\/span>political strategy. The irony of decentralized systems such as the United States is that<span> <\/span>political principals fail to de<span>fi<\/span>ne political goals for the bureaucracy. Such shirking allows political attacks on the bureaucracy, but at the same<span> <\/span>time it creates the incentive for bureaucracies to generate their own political<span> <\/span>support. Rather than increasing political control over the bureaucracy, the process<span> <\/span>lessens it because the bureaucracy supplies its own political legitimacy.<span> <\/span>\r<br>\r<br><span>…[A]<\/span>mong the nascent democracies<span> <\/span>in Latin America, the argument is made that democracy is enhanced by creating<span> <\/span>more authority for governments closer to the people (that is local governments). Via fragmented local governments, with each developing a unique set of services, individual citizens can vote<span> <\/span>with their feet to select the community that best meets their preferences for taxes<span> <\/span>and services.<span> <\/span>The argument, however, has implicit in it that local governments have the capacity to provide e<span>ff<\/span>ective services or can purchase them from the private sector. Without<span> <\/span>such capacity, decentralization is as likely to bring corruption and dissatisfaction,<span> <\/span>thus undercutting support for democracy…", "passageTitle": "Reading Comprehension Passage", "question": "Which of the following describes what the passage is mainly about?", "options": ["The origins, growth and types of bureaucratic systems.", "How bureaucracies operate in different political systems.", "Bureaucratic structures in developed and nascent democracies.", "Types of bureaucratic structures and hierarchies."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\tThe passage explains how bureaucracies operate in different political systems, and the impacts of these systems on the roles and functions of bureaucracies.\r<br />\r<br /><span>The passage primarily focuses on explaining how bureaucracy functions within different types of political systems - centralized and decentralized, and its role in each. It discusses how the nature of political systems, in terms of power concentration, impacts the roles, functions, and nature of bureaucracies, using examples of the UK, France, the US, and nascent democracies in Latin America. While there is a comparison between these different countries' political systems (option 3), it serves the broader purpose of discussing the interaction between politics and bureaucracy (option 2), making 2 a more comprehensive and accurate description of the passage's content. Option 1 is incorrect as the historical origins of bureaucracy are not discussed, nor its types. Option 4 is also incorrect as the passage does not discuss the types or hierarchies of bureaucratic structures.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Central Idea"}, {"number": 2, "sourceId": "16946051270281", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br>Bureaucracies are forged in the smithy of politics. The decision to create such<span> <\/span>structures and maintain them is made by political actors<span> <\/span>involved in governance. The modern democratic<span> <\/span>governance requires a supporting bureaucratic apparatus because only an e<span>ffi<\/span>cient bureaucracy can generate the surplus capacity to absorb the high<span> <\/span>decision and transaction costs inherent in democracy.\r<br>\r<br>A nation that cannot feed or educate its citizens is unlikely to be able to support a<span> <\/span>functioning democracy. This necessity, however, plays out in<span> <\/span>a variety of ways.<span> <\/span>The relationship of bureaucracy to the electoral—often misnamed the political—institutions of government in<span>fl<\/span>uences bureaucratic structures, delimits the scope of its activities, and creates pressures to restrict or reduce bureaucracy. Different combinations of political institutions result in di<span>ff<\/span>erent<span> <\/span>implicit bargains with the bureaucracy, thus de<span>fi<\/span>ning bureaucracy’s responsibilities<span> <\/span>and scope. \r<br>\r<br>Political systems vary in their concentration of political power<span> <\/span>and decision-making processes; some political systems are centralized with<span> <\/span>unitary governments; others are decentralized with semi-autonomous governments exercising power in a fragmented political system. In centralized political<span> <\/span>systems (e.g, UK, France), the role of bureaucracy in establishing and maintaining state power is generally recognized. In France, the bureaucracy is viewed as the instrument by which republicanism seeks equality and other fundamental values. Such states provide a clearer ‘‘contract’’ with the bureaucracy by being more<span> <\/span>precise in de<span>fi<\/span>ning political roles and accepting the idea of signi<span>fi<\/span>cant discretion<span> <\/span>among career bureaucrats…\r<br>\r<br>In fragmented systems, the bureaucracy itself becomes a<span> <\/span>more political institution. The classic case of a fragmented political system<span> <\/span>failing to provide the political consensus to create a relationship with bureaucracy is the United States. Because the formal institutions of government<span> <\/span>cannot concentrate power and thus de<span>fi<\/span>ne political ends, the bureaucracy is left<span> <\/span>with the task of building support for its own mission from the bottom up rather<span> <\/span>than via a principal—agent contract with political branches. In this situation<span>, <\/span>bureaucracy is seen as a competitor for political power, and politicians perceive<span> <\/span>that running for election by campaigning against the bureaucracy is a viable<span> <\/span>political strategy. The irony of decentralized systems such as the United States is that<span> <\/span>political principals fail to de<span>fi<\/span>ne political goals for the bureaucracy. Such shirking allows political attacks on the bureaucracy, but at the same<span> <\/span>time it creates the incentive for bureaucracies to generate their own political<span> <\/span>support. Rather than increasing political control over the bureaucracy, the process<span> <\/span>lessens it because the bureaucracy supplies its own political legitimacy.<span> <\/span>\r<br>\r<br><span>…[A]<\/span>mong the nascent democracies<span> <\/span>in Latin America, the argument is made that democracy is enhanced by creating<span> <\/span>more authority for governments closer to the people (that is local governments). Via fragmented local governments, with each developing a unique set of services, individual citizens can vote<span> <\/span>with their feet to select the community that best meets their preferences for taxes<span> <\/span>and services.<span> <\/span>The argument, however, has implicit in it that local governments have the capacity to provide e<span>ff<\/span>ective services or can purchase them from the private sector. Without<span> <\/span>such capacity, decentralization is as likely to bring corruption and dissatisfaction,<span> <\/span>thus undercutting support for democracy…", "passageTitle": "Reading Comprehension Passage", "question": "Based on the passage all of the following accurately reflect the relationship between politics and bureaucracy, EXCEPT:", "options": ["In centralized political systems, bureaucracy is an integral part of state power.", "Bureaucracy becomes politically active in fragmented political systems.", "In emerging democracies, decentralization can undermine the support for democracy.", "Bureaucracy is seen by government systems as a competitor for political power."], "answer": 3, "answerLabel": "D", "solution": "<\/span>\tOption 1. This statement is accurate according to the passage. In centralized systems like the UK and France, the bureaucracy plays a significant role in maintaining state power, with clear roles and substantial autonomy.\r<br /><span>Option 2. This statement is also accurate. The passage mentions that in fragmented or decentralized political systems, like the United States, the bureaucracy often has to generate its own political support, thus becoming more politically active.<\/span>\r<br /><span>Option 3. This statement is supported by the passage. It discusses how decentralization in nascent democracies can lead to problems such as corruption and dissatisfaction, potentially undermining support for democracy, if the local governments lack the capacity to provide effective services or manage contracts with the private sector effectively.<\/span>\r<br /><span>Option 4. This statement is not supported by the passage. While it's mentioned that in fragmented systems bureaucracy can be seen as a competitor for political power, it is not generalized for all political systems. In contrast, the passage highlights that in centralized systems, bureaucracy is more recognized as an integral part of state power. Therefore, it cannot be stated that all government systems see bureaucracy as a competitor for political power.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Inference"}, {"number": 3, "sourceId": "16946051270282", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br>Bureaucracies are forged in the smithy of politics. The decision to create such<span> <\/span>structures and maintain them is made by political actors<span> <\/span>involved in governance. The modern democratic<span> <\/span>governance requires a supporting bureaucratic apparatus because only an e<span>ffi<\/span>cient bureaucracy can generate the surplus capacity to absorb the high<span> <\/span>decision and transaction costs inherent in democracy.\r<br>\r<br>A nation that cannot feed or educate its citizens is unlikely to be able to support a<span> <\/span>functioning democracy. This necessity, however, plays out in<span> <\/span>a variety of ways.<span> <\/span>The relationship of bureaucracy to the electoral—often misnamed the political—institutions of government in<span>fl<\/span>uences bureaucratic structures, delimits the scope of its activities, and creates pressures to restrict or reduce bureaucracy. Different combinations of political institutions result in di<span>ff<\/span>erent<span> <\/span>implicit bargains with the bureaucracy, thus de<span>fi<\/span>ning bureaucracy’s responsibilities<span> <\/span>and scope. \r<br>\r<br>Political systems vary in their concentration of political power<span> <\/span>and decision-making processes; some political systems are centralized with<span> <\/span>unitary governments; others are decentralized with semi-autonomous governments exercising power in a fragmented political system. In centralized political<span> <\/span>systems (e.g, UK, France), the role of bureaucracy in establishing and maintaining state power is generally recognized. In France, the bureaucracy is viewed as the instrument by which republicanism seeks equality and other fundamental values. Such states provide a clearer ‘‘contract’’ with the bureaucracy by being more<span> <\/span>precise in de<span>fi<\/span>ning political roles and accepting the idea of signi<span>fi<\/span>cant discretion<span> <\/span>among career bureaucrats…\r<br>\r<br>In fragmented systems, the bureaucracy itself becomes a<span> <\/span>more political institution. The classic case of a fragmented political system<span> <\/span>failing to provide the political consensus to create a relationship with bureaucracy is the United States. Because the formal institutions of government<span> <\/span>cannot concentrate power and thus de<span>fi<\/span>ne political ends, the bureaucracy is left<span> <\/span>with the task of building support for its own mission from the bottom up rather<span> <\/span>than via a principal—agent contract with political branches. In this situation<span>, <\/span>bureaucracy is seen as a competitor for political power, and politicians perceive<span> <\/span>that running for election by campaigning against the bureaucracy is a viable<span> <\/span>political strategy. The irony of decentralized systems such as the United States is that<span> <\/span>political principals fail to de<span>fi<\/span>ne political goals for the bureaucracy. Such shirking allows political attacks on the bureaucracy, but at the same<span> <\/span>time it creates the incentive for bureaucracies to generate their own political<span> <\/span>support. Rather than increasing political control over the bureaucracy, the process<span> <\/span>lessens it because the bureaucracy supplies its own political legitimacy.<span> <\/span>\r<br>\r<br><span>…[A]<\/span>mong the nascent democracies<span> <\/span>in Latin America, the argument is made that democracy is enhanced by creating<span> <\/span>more authority for governments closer to the people (that is local governments). Via fragmented local governments, with each developing a unique set of services, individual citizens can vote<span> <\/span>with their feet to select the community that best meets their preferences for taxes<span> <\/span>and services.<span> <\/span>The argument, however, has implicit in it that local governments have the capacity to provide e<span>ff<\/span>ective services or can purchase them from the private sector. Without<span> <\/span>such capacity, decentralization is as likely to bring corruption and dissatisfaction,<span> <\/span>thus undercutting support for democracy…", "passageTitle": "Reading Comprehension Passage", "question": "Which of the following statements most accurately captures the \"irony\" associated with fragmented political systems (Paragraph 4)?", "options": ["When institutions fail to centralize power and set political goals, the bureaucracy ironically steps in to establish its own political agenda.", "In their attempts to exert greater control over the bureaucracy, politicians ironically reduce their influence by politicizing it.", "As the bureaucracy generates its own political support, it lessens the political control that was intended to be exerted by the political principals.", "When bureaucracy is seen as a rival in the pursuit of power, it leads politicians to believe that campaigning against it is an effective electoral strategy."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tOption 1. This statement is partially correct. While the passage does mention that bureaucracies may take up the task of setting their own goals in fragmented systems, it doesn't portray this as&nbsp;<span>the irony<\/span><span>. The irony is more about the shift of political control, not about the establishment of a political agenda.<\/span>\r<br /><span>Option 2. The statement is incorrect. Option 2 suggests active efforts by politicians to control the bureaucracy. In contrast, the passage describes a situation where there's an absence of active control and definition from political principals (\"fail to define political goals for the bureaucracy\"), leading to the bureaucracy acting more autonomously.<\/span>\r<br /><span>Option 3. This statement is accurate according to the passage. The irony lies in the fact that as bureaucracies in fragmented systems generate their own political support due to a lack of clear goals from the political principals, they inadvertently lessen the political control those principals have over them.<\/span>\r<br /><span>Option 4. While this might be a consequence of the fragmented political system, it's not described as the main irony in the passage. The irony focuses more on the shift in political control rather than the political strategies of politicians<\/span><span>.<\/span>\r<br />Hence, [3].", "topic": "Inference"}, {"number": 4, "sourceId": "16946051270283", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br>Bureaucracies are forged in the smithy of politics. The decision to create such<span> <\/span>structures and maintain them is made by political actors<span> <\/span>involved in governance. The modern democratic<span> <\/span>governance requires a supporting bureaucratic apparatus because only an e<span>ffi<\/span>cient bureaucracy can generate the surplus capacity to absorb the high<span> <\/span>decision and transaction costs inherent in democracy.\r<br>\r<br>A nation that cannot feed or educate its citizens is unlikely to be able to support a<span> <\/span>functioning democracy. This necessity, however, plays out in<span> <\/span>a variety of ways.<span> <\/span>The relationship of bureaucracy to the electoral—often misnamed the political—institutions of government in<span>fl<\/span>uences bureaucratic structures, delimits the scope of its activities, and creates pressures to restrict or reduce bureaucracy. Different combinations of political institutions result in di<span>ff<\/span>erent<span> <\/span>implicit bargains with the bureaucracy, thus de<span>fi<\/span>ning bureaucracy’s responsibilities<span> <\/span>and scope. \r<br>\r<br>Political systems vary in their concentration of political power<span> <\/span>and decision-making processes; some political systems are centralized with<span> <\/span>unitary governments; others are decentralized with semi-autonomous governments exercising power in a fragmented political system. In centralized political<span> <\/span>systems (e.g, UK, France), the role of bureaucracy in establishing and maintaining state power is generally recognized. In France, the bureaucracy is viewed as the instrument by which republicanism seeks equality and other fundamental values. Such states provide a clearer ‘‘contract’’ with the bureaucracy by being more<span> <\/span>precise in de<span>fi<\/span>ning political roles and accepting the idea of signi<span>fi<\/span>cant discretion<span> <\/span>among career bureaucrats…\r<br>\r<br>In fragmented systems, the bureaucracy itself becomes a<span> <\/span>more political institution. The classic case of a fragmented political system<span> <\/span>failing to provide the political consensus to create a relationship with bureaucracy is the United States. Because the formal institutions of government<span> <\/span>cannot concentrate power and thus de<span>fi<\/span>ne political ends, the bureaucracy is left<span> <\/span>with the task of building support for its own mission from the bottom up rather<span> <\/span>than via a principal—agent contract with political branches. In this situation<span>, <\/span>bureaucracy is seen as a competitor for political power, and politicians perceive<span> <\/span>that running for election by campaigning against the bureaucracy is a viable<span> <\/span>political strategy. The irony of decentralized systems such as the United States is that<span> <\/span>political principals fail to de<span>fi<\/span>ne political goals for the bureaucracy. Such shirking allows political attacks on the bureaucracy, but at the same<span> <\/span>time it creates the incentive for bureaucracies to generate their own political<span> <\/span>support. Rather than increasing political control over the bureaucracy, the process<span> <\/span>lessens it because the bureaucracy supplies its own political legitimacy.<span> <\/span>\r<br>\r<br><span>…[A]<\/span>mong the nascent democracies<span> <\/span>in Latin America, the argument is made that democracy is enhanced by creating<span> <\/span>more authority for governments closer to the people (that is local governments). Via fragmented local governments, with each developing a unique set of services, individual citizens can vote<span> <\/span>with their feet to select the community that best meets their preferences for taxes<span> <\/span>and services.<span> <\/span>The argument, however, has implicit in it that local governments have the capacity to provide e<span>ff<\/span>ective services or can purchase them from the private sector. Without<span> <\/span>such capacity, decentralization is as likely to bring corruption and dissatisfaction,<span> <\/span>thus undercutting support for democracy…", "passageTitle": "Reading Comprehension Passage", "question": "Which one of the following sets of words/phrases best encapsulates the issues discussed in the passage?", "options": ["Bureaucracy, Political systems, Institutions, Decentralization, Politicization of bureaucracy.", "Democracy, transaction costs, centralization, Fragmented systems, Political roles", "Autonomy, direct democracy, transaction costs, Institutions, political instability, corruption.", "Surplus capacity, Unitary governments, Bureaucracy, political consensus, political roles"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\tOption 1. \"Bureaucracy, Political systems, Institutions, Decentralization, Politicization of bureaucracy.\" This set of words/phrases captures the main topics discussed in the passage, including the role of bureaucracy in different political systems, the influence of institutions in these systems, the process and effects of decentralization, and how bureaucracies can become politicized.\r<br /><span>Option 2. \"Democracy, transaction costs, centralization, Fragmented systems, Political roles.\" While these terms are relevant, they do not encapsulate all the key issues discussed. The term \"transaction costs\" is mentioned only briefly, and \"centralization\" is just one aspect of the political systems discussed.<\/span>\r<br /><span>Option 3. \"Autonomy, direct democracy, transaction costs, Institutions, political instability, corruption.\" This set doesn't fully capture the main topics, as \"direct democracy,\" \"political instability,\" and \"transaction costs\" aren't major themes in the passage.<\/span>\r<br /><span>Option 4. \"Surplus capacity, Unitary governments, Bureaucracy, political consensus, political roles.\" These terms are relevant, but \"surplus capacity\" and \"unitary governments\" are not extensively discussed.<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Central Idea"}, {"number": 5, "sourceId": "16946051270284", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>How should we grapple with what is at stake in [the] fraught dynamic of death, power and politics? For Achille Mbembe, a Cameroonian critical theorist, manifestations of power and sovereignty are forms of ‘necropolitics’; contemporary power is the condition of wielding death: being able to apply it, withhold it, prolong it. This power, has led to the creation of ‘death-worlds’ inhabited by ‘living dead’. But death and politics are tangled in complex ways. To conceptualise the subversion of necropolitics, Mbembe uses the figure of a Palestinian suicide bomber. The long history of martyrdom in the Abrahamic traditions, or Kashmir, provide other examples.<br><br>But the question remains: what utilitarian political end, if any, does death serve, especially in the contexts of unpopular rule, armed insurgency, and sovereign necropolitical death? G W F Hegel has one response. Hegel describes voluntary encounters with death as non-nihilistic, and maintains that these acts form an essential element of subject-formation. Confronting death, whether as an individual or collective, inevitably transforms the subjective experience of the living. Terry Eagleton has another response. In his treatise on martyrdom, Radical Sacrifice (2020), Eagleton writes about the ways that voluntary death can overcome the ‘demonic compulsion’ of the Freudian death drive and transform what appears to be a necessity into a practice of freedom. When everyday life is pervasively animated by oppressive forms of enforced death, can death itself be appropriated and turned into an act of resistance and freedom?<br><br>In Starve and Immolate (2014), Banu Bargu continues this thread by offering an alternative to sovereign necropolitics: necroresistance. What is striking in Bargu’s case is the way that this form of resistance overlaps with Abrahamic martyrdom. Through the example of imprisoned Marxist dissidents held in the depths of Turkey’s carceral system, Bargu shows how death, and its attendant rituals and discourses, can assume a theological character even among the nonreligious. Bargu describes theologisation as a necessary precondition for necroresistance, and maintains that it has resulted in the production of a new kind of Marxism for the Communist cadre in Turkey: ‘sacrificial Marxism’, which involves martyrdom being systemically appropriated as a ‘central ethico-political value’ and transformed into a vehicle for ‘ideological and cultural propagation’. <br><br>When is such expression appropriate? For Frantz Fanon, death is a preferable form of political expression when people are oppressed by conditions that appear to stretch across time – an all-encompassing ‘web of three-dimensional violence’. Ending a territorially endless and temporally eternal regime, by any means necessary, may include death.<br><br>This form of death cannot be dismissed as simply desperate and futile. Not for Fanon, for Bargu, for Kandahar’s insurgents, nor those whose martyrdom became an expression of dissentious politics. For them, and others, death may not only be logical, but revelatory.", "passageTitle": "Reading Comprehension Passage", "question": "Based on the first paragraph, it can be inferred that the term 'living dead' refers to:", "options": ["Individuals who have died for a political cause.", "Political prisoners who face the death penalty.", "Inhabitants of a sovereign necropolitical nation.", "Those who resist oppressive power structures."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tThe correct answer is 3. Inhabitants of a sovereign necropolitical nation.\r<br /><span>Option 1. \"Individuals who have died for a political cause.\" - The passage doesn't infer that the 'living dead' are individuals who have died for a political cause. The term is used to describe those who are living but essentially 'dead' due to extreme control over their lives, not individuals who have already died for a political cause.<\/span>\r<br /><span>Option 2. \"Political prisoners who face the death penalty.\" - The passage does not suggest that the 'living dead' specifically refers to political prisoners facing the death penalty. While these individuals could be part of the 'living dead' in a necropolitical nation, the&nbsp;<\/span><span>term as<\/span><span> used by Mbembe is not limited to this group, in a general sense, in all countries.&nbsp;<\/span>\r<br /><span>Option 3. \"Inhabitants of a sovereign necropolitical nation.\" - This is the correct answer. The 'living dead,' as used by Mbembe, refers to those living under the oppressive control of a sovereign power that can determine, hasten, or prolong death. These individuals, while technically alive, are so controlled and oppressed that they are akin to the 'living dead.'<\/span>\r<br /><span>Option 4. \"Those who resist oppressive power structures.\" - While individuals resisting oppressive power structures might also be subject to necropolitical control, the term 'living dead' doesn't specifically refer to those who resist, but rather to those who live under such oppressive control. Resistance, as a response to such conditions, is discussed later in the passage but isn't part of the definition of 'living dead.'<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Inference"}, {"number": 6, "sourceId": "16946051270295", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>How should we grapple with what is at stake in [the] fraught dynamic of death, power and politics? For Achille Mbembe, a Cameroonian critical theorist, manifestations of power and sovereignty are forms of ‘necropolitics’; contemporary power is the condition of wielding death: being able to apply it, withhold it, prolong it. This power, has led to the creation of ‘death-worlds’ inhabited by ‘living dead’. But death and politics are tangled in complex ways. To conceptualise the subversion of necropolitics, Mbembe uses the figure of a Palestinian suicide bomber. The long history of martyrdom in the Abrahamic traditions, or Kashmir, provide other examples.<br><br>But the question remains: what utilitarian political end, if any, does death serve, especially in the contexts of unpopular rule, armed insurgency, and sovereign necropolitical death? G W F Hegel has one response. Hegel describes voluntary encounters with death as non-nihilistic, and maintains that these acts form an essential element of subject-formation. Confronting death, whether as an individual or collective, inevitably transforms the subjective experience of the living. Terry Eagleton has another response. In his treatise on martyrdom, Radical Sacrifice (2020), Eagleton writes about the ways that voluntary death can overcome the ‘demonic compulsion’ of the Freudian death drive and transform what appears to be a necessity into a practice of freedom. When everyday life is pervasively animated by oppressive forms of enforced death, can death itself be appropriated and turned into an act of resistance and freedom?<br><br>In Starve and Immolate (2014), Banu Bargu continues this thread by offering an alternative to sovereign necropolitics: necroresistance. What is striking in Bargu’s case is the way that this form of resistance overlaps with Abrahamic martyrdom. Through the example of imprisoned Marxist dissidents held in the depths of Turkey’s carceral system, Bargu shows how death, and its attendant rituals and discourses, can assume a theological character even among the nonreligious. Bargu describes theologisation as a necessary precondition for necroresistance, and maintains that it has resulted in the production of a new kind of Marxism for the Communist cadre in Turkey: ‘sacrificial Marxism’, which involves martyrdom being systemically appropriated as a ‘central ethico-political value’ and transformed into a vehicle for ‘ideological and cultural propagation’. <br><br>When is such expression appropriate? For Frantz Fanon, death is a preferable form of political expression when people are oppressed by conditions that appear to stretch across time – an all-encompassing ‘web of three-dimensional violence’. Ending a territorially endless and temporally eternal regime, by any means necessary, may include death.<br><br>This form of death cannot be dismissed as simply desperate and futile. Not for Fanon, for Bargu, for Kandahar’s insurgents, nor those whose martyrdom became an expression of dissentious politics. For them, and others, death may not only be logical, but revelatory.", "passageTitle": "Reading Comprehension Passage", "question": "“Hegel describes voluntary encounters with death as non-nihilistic, and maintains that these acts form an essential element of subject-formation.”<br><br>Which one of the following statements best explains this quote, in the context of the passage?", "options": ["Hegel believes that choosing to face death serves no utilitarian end in an oppressive regime.", "According to Hegel, voluntary death is the acceptance of sovereign necropolitical death.", "Hegel argues that choosing to face death is an act of resistance against oppressive political structures.", "Hegel posits that voluntary encounters with death are meaningful and shape one’s identity."], "answer": 3, "answerLabel": "D", "solution": "<\/span>\tOption 1. This is incorrect. The author asks,  “what utilitarian political end, if any, does death serve, especially in the contexts of unpopular rule, armed insurgency, and sovereign necropolitical death?” Then the author refers to Hegel and states that according to Hegel (the quote) it does serve a purpose in a necropolitical nation. Option 1 contradicts this, hence incorrect.&nbsp;\r<br /><span>Option 2. This is incorrect. ‘<\/span><span>sovereign<\/span><span> necropolitical death’ means death at the hands of a necropolitical state. The dying does not merely accept it, they do it for a purpose. The quote explains that purpose. So, mere acceptance does not explain the quote.&nbsp;<\/span>\r<br /><span>Option 3. This is incorrect. While the concept of death as a form of resistance is discussed in the passage, this is not the focus of Hegel's quoted viewpoint, which is more concerned with the role of voluntary encounters with death in identity formation.<\/span>\r<br />Option 4. According to Hegel, facing death voluntarily in a necropolitical state is ‘non-nihilistic’ (meaningful) and serves in ‘subject-formation’ (identity).&nbsp;<span>So<\/span><span> this option is correct. Hegel also states that such a death affects the living as well.&nbsp;<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Inference"}, {"number": 7, "sourceId": "16946051270296", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>How should we grapple with what is at stake in [the] fraught dynamic of death, power and politics? For Achille Mbembe, a Cameroonian critical theorist, manifestations of power and sovereignty are forms of ‘necropolitics’; contemporary power is the condition of wielding death: being able to apply it, withhold it, prolong it. This power, has led to the creation of ‘death-worlds’ inhabited by ‘living dead’. But death and politics are tangled in complex ways. To conceptualise the subversion of necropolitics, Mbembe uses the figure of a Palestinian suicide bomber. The long history of martyrdom in the Abrahamic traditions, or Kashmir, provide other examples.<br><br>But the question remains: what utilitarian political end, if any, does death serve, especially in the contexts of unpopular rule, armed insurgency, and sovereign necropolitical death? G W F Hegel has one response. Hegel describes voluntary encounters with death as non-nihilistic, and maintains that these acts form an essential element of subject-formation. Confronting death, whether as an individual or collective, inevitably transforms the subjective experience of the living. Terry Eagleton has another response. In his treatise on martyrdom, Radical Sacrifice (2020), Eagleton writes about the ways that voluntary death can overcome the ‘demonic compulsion’ of the Freudian death drive and transform what appears to be a necessity into a practice of freedom. When everyday life is pervasively animated by oppressive forms of enforced death, can death itself be appropriated and turned into an act of resistance and freedom?<br><br>In
