iscourse of necroresistance.", "Bargu criticizes the adoption of martyrdom as an 'ethico-political value' for ideological and cultural propagation."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\tOption 1. This is incorrect.&nbsp;<span>Bargu<\/span><span> argues that&nbsp;<\/span><span>necroresistance<\/span><span> can be a potent force of popular political expression when opposed to&nbsp;<\/span><span>necropolitics<\/span><span>.<\/span>\r<br /><span>Option 2. This is correct. The paragraph discusses how&nbsp;<\/span><span>Bargu's<\/span><span> work illustrates&nbsp;<\/span><span>necroresistance<\/span><span> as a significant political tool, which interestingly includes elements of religious martyrdom even among non-religious groups.<\/span>\r<br /><span>Option 3. This is incorrect.&nbsp;<\/span><span>Bargu<\/span><span> actually shows how theology becomes intertwined with&nbsp;<\/span><span>necroresistance<\/span><span>, describing&nbsp;<\/span><span>theologisation<\/span><span> as a necessary precondition for&nbsp;<\/span><span>necroresistance<\/span><span>.<\/span>\r<br /><span>Option 4.  This is incorrect.&nbsp;<\/span><span>Bargu<\/span><span> doesn't criticize this adoption; instead, she explains how martyrdom has been systematically appropriated as a central&nbsp;<\/span><span>ethico<\/span><span>-political value, transforming into a vehicle for ideological and cultural propagation.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Inference"}, {"number": 8, "sourceId": "16946051270297", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>How should we grapple with what is at stake in [the] fraught dynamic of death, power and politics? For Achille Mbembe, a Cameroonian critical theorist, manifestations of power and sovereignty are forms of ‘necropolitics’; contemporary power is the condition of wielding death: being able to apply it, withhold it, prolong it. This power, has led to the creation of ‘death-worlds’ inhabited by ‘living dead’. But death and politics are tangled in complex ways. To conceptualise the subversion of necropolitics, Mbembe uses the figure of a Palestinian suicide bomber. The long history of martyrdom in the Abrahamic traditions, or Kashmir, provide other examples.<br><br>But the question remains: what utilitarian political end, if any, does death serve, especially in the contexts of unpopular rule, armed insurgency, and sovereign necropolitical death? G W F Hegel has one response. Hegel describes voluntary encounters with death as non-nihilistic, and maintains that these acts form an essential element of subject-formation. Confronting death, whether as an individual or collective, inevitably transforms the subjective experience of the living. Terry Eagleton has another response. In his treatise on martyrdom, Radical Sacrifice (2020), Eagleton writes about the ways that voluntary death can overcome the ‘demonic compulsion’ of the Freudian death drive and transform what appears to be a necessity into a practice of freedom. When everyday life is pervasively animated by oppressive forms of enforced death, can death itself be appropriated and turned into an act of resistance and freedom?<br><br>In Starve and Immolate (2014), Banu Bargu continues this thread by offering an alternative to sovereign necropolitics: necroresistance. What is striking in Bargu’s case is the way that this form of resistance overlaps with Abrahamic martyrdom. Through the example of imprisoned Marxist dissidents held in the depths of Turkey’s carceral system, Bargu shows how death, and its attendant rituals and discourses, can assume a theological character even among the nonreligious. Bargu describes theologisation as a necessary precondition for necroresistance, and maintains that it has resulted in the production of a new kind of Marxism for the Communist cadre in Turkey: ‘sacrificial Marxism’, which involves martyrdom being systemically appropriated as a ‘central ethico-political value’ and transformed into a vehicle for ‘ideological and cultural propagation’. <br><br>When is such expression appropriate? For Frantz Fanon, death is a preferable form of political expression when people are oppressed by conditions that appear to stretch across time – an all-encompassing ‘web of three-dimensional violence’. Ending a territorially endless and temporally eternal regime, by any means necessary, may include death.<br><br>This form of death cannot be dismissed as simply desperate and futile. Not for Fanon, for Bargu, for Kandahar’s insurgents, nor those whose martyrdom became an expression of dissentious politics. For them, and others, death may not only be logical, but revelatory.", "passageTitle": "Reading Comprehension Passage", "question": "Which one of the following statements contradicts the arguments of the passage?", "options": ["The power to control life and death is not an essential attribute of a sovereign entity.", "Nonreligious individuals can incorporate aspects found in religious martyrdom.", "Under extreme and unending oppression death is a meaningful and necessary act.", "Necroresistance, relevant in political discourse, has no place in religious contexts."], "answer": 3, "answerLabel": "D", "solution": "<\/span>\tOption 1. Sovereign entities do not generally have the power to control life and death of its citizens. But there are powers that exercise this power.&nbsp;<span>So<\/span><span> the author’s assumption is that sovereign entities are not defined by their power to control life and death of their citizens. Option 1 does not contradict the passage.&nbsp;<\/span>\r<br /><span>Option 2. This does not contradict the arguments in the passage. Similar to option 1, this too is an assumption in the example of Marxists&nbsp;<\/span><span>In<\/span><span> fact, the passage mentions the example of nonreligious (sacrificial) Marxist dissidents adopting aspects of religious martyrdom in their&nbsp;<\/span><span>necroresistance<\/span><span>.<\/span>\r<br /><span>Option 3. The passage does not contradict this. Refer to the last paragraph.&nbsp;<\/span>\r<br /><span>Option 4. This option contradicts Banu&nbsp;<\/span><span>Bargu's<\/span><span> arguments as outlined in the passage.&nbsp;<\/span><span>Bargu<\/span><span> illustrates how&nbsp;<\/span><span>necroresistance<\/span><span>, the act of transforming death into a form of resistance, overlaps with religious (Abrahamic) martyrdom. The first paragraph states: ‘the long history of martyrdom in the Abrahamic traditions…’ It is implied that voluntary death is primarily a religious concept.&nbsp;<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Inference"}, {"number": 9, "sourceId": "16946051270298", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>Hawking’s discovery of the Hawking radiation, possible through thought experiment, brought general relativity and quantum theory together in a remarkable way. But Hawking was puzzled by features of this radiation – or more precisely, its lack of features. Critical to the probability interpretation of quantum mechanics was that something always happens. If you add up the probabilities for anything that may happen, you will find that the total probability is one. This can be formulated as a statement about information: if one knows everything one can know about a system at one time, one can know everything about it at later times. But this did not seem to be the case for radiation from black holes.<br><br>These ideas may be unfamiliar – so it is worth elaborating a bit. If you enter a lottery and buy one ticket and there are 10 million lottery tickets sold, your chances of winning the jackpot are 1 in 10 million. But you either win or lose the lottery: the chance of winning or losing is 100 per cent.<br><br>What does it mean for information to disappear? Of course, we all forget things… but we believe that we could, in time, reconstruct this information. The amount of information in a system doesn’t change, though it may be hard to access. For a system, like a collapsing star, there is a lot of information.  …Thanks to Hawking, we know that it forms a black hole and then slowly evaporates, emitting radiation. The information that was contained in the initial star has been reduced to just the temperature of a warm body. Hawking argued that the information was simply lost. Quantum mechanics, he asserted, breaks down near black holes.<br><br>Many leading theorists have struggled to resolve the puzzles raised by this thought experiment. Some have argued that, one has to redo quantum mechanics or general relativity to resolve Hawking’s paradox. Others have been more sceptical. Perhaps, the evaporation of a black hole is like a lump of ash from the burning of a log. Surely, the laws of quantum mechanics don’t break down when an object burns? In that case, the resolution of the puzzle is that the outgoing radiation is not exactly that of a black body because subtle connections between the outgoing photons remain intact. But it was soon realised that the answer could not be so simple; the structure of space and time makes it hard to understand how such correlations might arise. … Perhaps Hawking was right: just as Newtonian physics was usurped by quantum mechanics and general relativity on large or tiny scales, something had to give here as well.<br><br>It turns out that there is a situation where black holes could exist and quantum mechanics could make sense: string theory. String theory, also emerging from thought experiments, replaces the particles of quantum mechanics with one-dimensional strings. That concept has provided at least a partial resolution of the puzzle. Two theorists at Harvard University – Cumrun Vafa and Andrew Strominger were able to understand the temperature of certain idealised black holes in quantum mechanical terms. In other words, the information, at least for these idealised systems, somehow survives, evading Hawking’s paradox.", "passageTitle": "Reading Comprehension Passage", "question": "It can be inferred from the first paragraph that Hawking radiation puzzled Stephen Hawking because:", "options": ["The radiation from the black hole reconciled general relativity with quantum mechanics.", "The radiation from the black hole confirmed that information is neither lost nor created.", "The radiation from the black hole carried no information about its past or future.", "The radiation from the black hole ensured the certainty of an event within the scope of all possible outcomes."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>The radiation from the black hole carried no information about its past or future.<\/span>\r<br /><span>In the first paragraph, it is mentioned that Hawking was puzzled by the \"lack of features\" in the radiation emitted by a black hole. Lack of features is then related to probability and information in the first paragraph.  “<\/span><span>if<\/span><span> one knows everything one can know about a system at one time, one can know everything about it at later times. But this did not seem to be the case for radiation from black holes.” In other words, lack of features refers to a lack of information.&nbsp;<\/span>\r<br /><span>The other options do not correctly capture the nature of the paradox described in the passage:<\/span>\r<br /><span>Option 1. The radiation did bring general relativity and quantum mechanics together in some ways, but it also created a paradox that has puzzled physicists, rather than resolving all the conflicts between the two theories.<\/span>\r<br /><span>Option 2. As discussed above, the radiation seemed to contradict the principle that information is neither lost nor created, which is what created the paradox.<\/span>\r<br /><span>Option 4. The principle of the total probability of all possible outcomes being one is a separate concept in quantum mechanics, not directly related to the specific features (or lack thereof) in the Hawking radiation that puzzled Hawking.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Inference"}, {"number": 10, "sourceId": "16946051270319", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>Hawking’s discovery of the Hawking radiation, possible through thought experiment, brought general relativity and quantum theory together in a remarkable way. But Hawking was puzzled by features of this radiation – or more precisely, its lack of features. Critical to the probability interpretation of quantum mechanics was that something always happens. If you add up the probabilities for anything that may happen, you will find that the total probability is one. This can be formulated as a statement about information: if one knows everything one can know about a system at one time, one can know everything about it at later times. But this did not seem to be the case for radiation from black holes.<br><br>These ideas may be unfamiliar – so it is worth elaborating a bit. If you enter a lottery and buy one ticket and there are 10 million lottery tickets sold, your chances of winning the jackpot are 1 in 10 million. But you either win or lose the lottery: the chance of winning or losing is 100 per cent.<br><br>What does it mean for information to disappear? Of course, we all forget things… but we believe that we could, in time, reconstruct this information. The amount of information in a system doesn’t change, though it may be hard to access. For a system, like a collapsing star, there is a lot of information.  …Thanks to Hawking, we know that it forms a black hole and then slowly evaporates, emitting radiation. The information that was contained in the initial star has been reduced to just the temperature of a warm body. Hawking argued that the information was simply lost. Quantum mechanics, he asserted, breaks down near black holes.<br><br>Many leading theorists have struggled to resolve the puzzles raised by this thought experiment. Some have argued that, one has to redo quantum mechanics or general relativity to resolve Hawking’s paradox. Others have been more sceptical. Perhaps, the evaporation of a black hole is like a lump of ash from the burning of a log. Surely, the laws of quantum mechanics don’t break down when an object burns? In that case, the resolution of the puzzle is that the outgoing radiation is not exactly that of a black body because subtle connections between the outgoing photons remain intact. But it was soon realised that the answer could not be so simple; the structure of space and time makes it hard to understand how such correlations might arise. … Perhaps Hawking was right: just as Newtonian physics was usurped by quantum mechanics and general relativity on large or tiny scales, something had to give here as well.<br><br>It turns out that there is a situation where black holes could exist and quantum mechanics could make sense: string theory. String theory, also emerging from thought experiments, replaces the particles of quantum mechanics with one-dimensional strings. That concept has provided at least a partial resolution of the puzzle. Two theorists at Harvard University – Cumrun Vafa and Andrew Strominger were able to understand the temperature of certain idealised black holes in quantum mechanical terms. In other words, the information, at least for these idealised systems, somehow survives, evading Hawking’s paradox.", "passageTitle": "Reading Comprehension Passage", "question": "Based on the passage, which of the following statements best describes the nature of information in relation to quantum mechanics?", "options": ["Information can be transferred faster than the speed of light in quantum mechanics.", "Information in a quantum system can be completely lost over time.", "Information in quantum mechanics is subject to changes and may not be preserved.", "Information cannot be created or destroyed in quantum mechanics."], "answer": 3, "answerLabel": "D", "solution": "<span>The passage discusses the principle of “the total probability = one” in quantum mechanics, which asserts that information cannot be created or destroyed. Refer to the third paragraph: “What does it mean for information to disappear? … we forget things… but we believe that we could reconstruct this information. The amount of information in a system doesn’t change, though it may be hard to access. For a system, like a collapsing star, there is a lot of information.  …[But] Hawking argued that the information was simply lost. Quantum mechanics, he asserted, breaks down near black holes.” The reason for the breakdown of quantum mechanics is that it considers information indestructible.&nbsp;<\/span>\r<br />\r<br /><span>Option 1 is incorrect because it relates to the concept of \"quantum entanglement,\" which is not mentioned or implied in the passage. Option 2 and 3 are also incorrect as they directly contradict the principles of quantum mechanics as explained in the passage. Quantum mechanics asserts the conservation of information, indicating that information cannot be lost or changed randomly over time.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Inference"}, {"number": 11, "sourceId": "169460512703110", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>Hawking’s discovery of the Hawking radiation, possible through thought experiment, brought general relativity and quantum theory together in a remarkable way. But Hawking was puzzled by features of this radiation – or more precisely, its lack of features. Critical to the probability interpretation of quantum mechanics was that something always happens. If you add up the probabilities for anything that may happen, you will find that the total probability is one. This can be formulated as a statement about information: if one knows everything one can know about a system at one time, one can know everything about it at later times. But this did not seem to be the case for radiation from black holes.<br><br>These ideas may be unfamiliar – so it is worth elaborating a bit. If you enter a lottery and buy one ticket and there are 10 million lottery tickets sold, your chances of winning the jackpot are 1 in 10 million. But you either win or lose the lottery: the chance of winning or losing is 100 per cent.<br><br>What does it mean for information to disappear? Of course, we all forget things… but we believe that we could, in time, reconstruct this information. The amount of information in a system doesn’t change, though it may be hard to access. For a system, like a collapsing star, there is a lot of information.  …Thanks to Hawking, we know that it forms a black hole and then slowly evaporates, emitting radiation. The information that was contained in the initial star has been reduced to just the temperature of a warm body. Hawking argued that the information was simply lost. Quantum mechanics, he asserted, breaks down near black holes.<br><br>Many leading theorists have struggled to resolve the puzzles raised by this thought experiment. Some have argued that, one has to redo quantum mechanics or general relativity to resolve Hawking’s paradox. Others have been more sceptical. Perhaps, the evaporation of a black hole is like a lump of ash from the burning of a log. Surely, the laws of quantum mechanics don’t break down when an object burns? In that case, the resolution of the puzzle is that the outgoing radiation is not exactly that of a black body because subtle connections between the outgoing photons remain intact. But it was soon realised that the answer could not be so simple; the structure of space and time makes it hard to understand how such correlations might arise. … Perhaps Hawking was right: just as Newtonian physics was usurped by quantum mechanics and general relativity on large or tiny scales, something had to give here as well.<br><br>It turns out that there is a situation where black holes could exist and quantum mechanics could make sense: string theory. String theory, also emerging from thought experiments, replaces the particles of quantum mechanics with one-dimensional strings. That concept has provided at least a partial resolution of the puzzle. Two theorists at Harvard University – Cumrun Vafa and Andrew Strominger were able to understand the temperature of certain idealised black holes in quantum mechanical terms. In other words, the information, at least for these idealised systems, somehow survives, evading Hawking’s paradox.", "passageTitle": "Reading Comprehension Passage", "question": "Based on the passage, all of the following are aspects of Hawking’s paradox EXCEPT:", "options": ["Hawking radiation contradicts both general relativity and quantum mechanics.", "Hawking radiation intersects both general relativity and quantum theory.", "Hawking radiation disputes the idea that total probability should be conserved at one.", "Hawking radiation can be explained without contradictions using string theory."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>B<\/span><span>ased on the passage, the paradox of Hawking radiation relates primarily to the seeming contradiction between general relativity and quantum mechanics, specifically regarding the principle of conservation of information. Therefore, options 1 and 2 are both aspects of the paradox. Option 4 is also related to the content of the passage, which mentions that string theory might provide a resolution to the paradox, suggesting a way that Hawking radiation could be explained without contradictions. Option 3, however, is not mentioned in the passage. The principle that the total probability of all possible outcomes should sum to one is indeed a principle in quantum mechanics, but it's not directly related to the issue raised by Hawking's paradox, which is about the apparent loss of information, not the sum of probabilities. Therefore, it is the correct answer, because it is not an aspect of Hawking’s paradox as presented in the passage.&nbsp;<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Inference"}, {"number": 12, "sourceId": "169460512703111", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>Hawking’s discovery of the Hawking radiation, possible through thought experiment, brought general relativity and quantum theory together in a remarkable way. But Hawking was puzzled by features of this radiation – or more precisely, its lack of features. Critical to the probability interpretation of quantum mechanics was that something always happens. If you add up the probabilities for anything that may happen, you will find that the total probability is one. This can be formulated as a statement about information: if one knows everything one can know about a system at one time, one can know everything about it at later times. But this did not seem to be the case for radiation from black holes.<br><br>These ideas may be unfamiliar – so it is worth elaborating a bit. If you enter a lottery and buy one ticket and there are 10 million lottery tickets sold, your chances of winning the jackpot are 1 in 10 million. But you either win or lose the lottery: the chance of winning or losing is 100 per cent.<br><br>What does it mean for information to disappear? Of course, we all forget things… but we believe that we could, in time, reconstruct this information. The amount of information in a system doesn’t change, though it may be hard to access. For a system, like a collapsing star, there is a lot of information.  …Thanks to Hawking, we know that it forms a black hole and then slowly evaporates, emitting radiation. The information that was contained in the initial star has been reduced to just the temperature of a warm body. Hawking argued that the information was simply lost. Quantum mechanics, he asserted, breaks down near black holes.<br><br>Many leading theorists have struggled to resolve the puzzles raised by this thought experiment. Some have argued that, one has to redo quantum mechanics or general relativity to resolve Hawking’s paradox. Others have been more sceptical. Perhaps, the evaporation of a black hole is like a lump of ash from the burning of a log. Surely, the laws of quantum mechanics don’t break down when an object burns? In that case, the resolution of the puzzle is that the outgoing radiation is not exactly that of a black body because subtle connections between the outgoing photons remain intact. But it was soon realised that the answer could not be so simple; the structure of space and time makes it hard to understand how such correlations might arise. … Perhaps Hawking was right: just as Newtonian physics was usurped by quantum mechanics and general relativity on large or tiny scales, something had to give here as well.<br><br>It turns out that there is a situation where black holes could exist and quantum mechanics could make sense: string theory. String theory, also emerging from thought experiments, replaces the particles of quantum mechanics with one-dimensional strings. That concept has provided at least a partial resolution of the puzzle. Two theorists at Harvard University – Cumrun Vafa and Andrew Strominger were able to understand the temperature of certain idealised black holes in quantum mechanical terms. In other words, the information, at least for these idealised systems, somehow survives, evading Hawking’s paradox.", "passageTitle": "Reading Comprehension Passage", "question": "According to the passage, why is the evaporation of a black hole compared to the burning of a log?", "options": ["Because both processes are governed by the laws of quantum mechanics.", "Because both result in a loss of detailed information about the initial state.", "Because both emit radiation and result in the destruction of the initial material.", "Because both defy the principle of conservation of energy."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\tOption 1. While quantum mechanics is part of the discussion on black holes and Hawking radiation, the burning of a log isn't mentioned in the context of quantum mechanics. So, this option is not supported by the passage.\r<br /><span>Option 2. The passage compares the evaporation of a black hole to the burning of a log because both processes seem to result in a loss of detailed information about the initial state. The radiation emitted by an evaporating black hole, known as Hawking radiation, seems to carry no information about the matter that fell into the black hole. Similarly, when a log burns, the ash that remains contains little detailed information about what the log was like before it burned. This is the correct answer.<\/span>\r<br /><span>Option 3. Although both processes indeed lead to a transformation of the initial material and, in a certain sense, both emit radiation (Hawking radiation in the case of black holes, heat and light in the case of burning logs), this answer option is not entirely accurate because the comparison made in the passage focuses specifically on the apparent loss of information, not the emission of radiation or the destruction of the initial material.<\/span>\r<br /><span>Option 4. The principle of conservation of energy isn't discussed in relation to either the evaporation of a black hole or the burning of a log in the passage, so this option is incorrect<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Inference"}, {"number": 13, "sourceId": "169460512703112", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>In a time of screen saturation, digitized images of objects and manuscripts, and an emphasis on “knowledge workers” rather than craftspeople, we run the risk of becoming materially illiterate. When we privilege sight and visual analysis alone, we fail to use a full battery of analytical tools deploying our eyes, touch, and embodied experiences to understand the material world. How might we link visual, haptic, and tacit knowledge of the material world when we have become distant from making and are more comfortable with approximations?<br><br>Formal visual analysis—a focus upon type and external aesthetic decoration—privileges appearance and often rests upon value systems generated outside of original context. Such an emphasis leads naturally to a hierarchy in which an idealized type or style is identified and charted as it moves outwards from the center to the periphery. This approach also draws attention to makers who have marked their products or appeared in written records, thereby skewing in favor of those who work in the metropole. <br>In interpreting functional works of art, one needs to think beyond the façade or style of the finished product. It is often the evidence of the unconscious act of the maker—the substrate, interior, or back rather than the surface, exterior, or front—that provide a true sense of the conditions of its creation. Materials are the crucial first step in delving into this hidden history of an object. The inherent possibilities of a particular medium can restrict or encourage certain action in the fabrication of objects. For example, Kongo weavers of the 16th century understood the techniques and effects of European cut pile velvet cloth but used their familiar raffia material and weaving practices to produce visually similar work that impressed European visitors. Such adaptation by the weaver turns an imperial perspective on end. Finished objects result from the interconnection of material, technique, and idea; resources, culture, and the maker’s body and brain all play active roles.<br><br>Once materials are harvested or processed, artisans transform them into objects through a series of interrelated steps of fabrication, decoration, and finish that altogether can be called realization. By recognizing that skilled work takes place over a considerable geographic and temporal range, we can divest ourselves of the notion that technology has continually improved and that the present offers the most advanced form of workmanship. Paying attention to the tacit knowledge and dexterous actions of past cultures questions this progressive model and allows us to see both refined and quotidian objects in a different light.<br><br>How something is made is as important as why it is made and what it looks like. The ultimate goal of this sort of object-driven inquiry is a material literacy informed by cultural curiosity and an appreciation for diverse approaches to problem solving that supplants an inclination to judge, classify, and rank in hindsight. Objects, more than simply reflections of static values, are complex entities that defy easy categorization. Human activity creates material culture, which in turn makes action possible while also recursively shaping and controlling action. Studied in this way, objects are truly at the center of interdisciplinary, cross-cultural study since they arise from specific socio-economic contexts, mediate social and cultural relations, and become important bearers of meaning and memory.", "passageTitle": "Reading Comprehension Passage", "question": "In the context of the passage, which one of the following statements is NOT in accordance with the concept of “material literacy”?", "options": ["Appreciating the work of artisans who mark their products and those appearing in written records.", "Recognizing the artisan’s thought processes and the properties of the materials used.", "Appreciating the cultural and socio-economic contexts of the objects’ creation.", "Recognizing how objects shape societal and cultural relations embodying meaning and memories."], "answer": 0, "answerLabel": "A", "solution": "<\/span>\tOption 1. This option contradicts the concept of \"material literacy\" as presented in the passage. According to the passage, focusing on artisans who mark their products or appear in explicit records can lead to a biased interpretation of the object and its value. Material literacy encourages a deeper&nbsp;understanding that goes beyond these visible marks or records to include the hidden aspects of the object's creation.\r<br /><span>Option 2. Recognizing the artisan’s thought processes and the properties of the materials used aligns with the concept of material literacy. The passage emphasizes the importance of these aspects in truly understanding an object and its creation.<\/span>\r<br /><span>Option 3. Appreciating the cultural and socio-economic contexts of the objects’ creation is in line with the concept of material literacy. According to the passage, these contexts play a crucial role in the creation of an object and its meaning.<\/span>\r<br /><span>Option 4. Recognizing how objects shape societal and cultural relations embodying meaning and memories also aligns with the concept of material literacy as described in the passage. It suggests that objects are not just passive reflections of societal&nbsp;<\/span><span>values, but<\/span><span> are complex entities that are actively involved in shaping social and cultural relations and carrying meaning and memories.<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Specific Detail Question"}, {"number": 14, "sourceId": "169460512703213", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>In a time of screen saturation, digitized images of objects and manuscripts, and an emphasis on “knowledge workers” rather than craftspeople, we run the risk of becoming materially illiterate. When we privilege sight and visual analysis alone, we fail to use a full battery of analytical tools deploying our eyes, touch, and embodied experiences to understand the material world. How might we link visual, haptic, and tacit knowledge of the material world when we have become distant from making and are more comfortable with approximations?<br><br>Formal visual analysis—a focus upon type and external aesthetic decoration—privileges appearance and often rests upon value systems generated outside of original context. Such an emphasis leads naturally to a hierarchy in which an idealized type or style is identified and charted as it moves outwards from the center to the periphery. This approach also draws attention to makers who have marked their products or appeared in written records, thereby skewing in favor of those who work in the metropole. <br>In interpreting functional works of art, one needs to think beyond the façade or style of the finished product. It is often the evidence of the unconscious act of the maker—the substrate, interior, or back rather than the surface, exterior, or front—that provide a true sense of the conditions of its creation. Materials are the crucial first step in delving into this hidden history of an object. The inherent possibilities of a particular medium can restrict or encourage certain action in the fabrication of objects. For example, Kongo weavers of the 16th century understood the techniques and effects of European cut pile velvet cloth but used their familiar raffia material and weaving practices to produce visually similar work that impressed European visitors. Such adaptation by the weaver turns an imperial perspective on end. Finished objects result from the interconnection of material, technique, and idea; resources, culture, and the maker’s body and brain all play active roles.<br><br>Once materials are harvested or processed, artisans transform them into objects through a series of interrelated steps of fabrication, decoration, and finish that altogether can be called realization. By recognizing that skilled work takes place over a considerable geographic and temporal range, we can divest ourselves of the notion that technology has continually improved and that the present offers the most advanced form of workmanship. Paying attention to the tacit knowledge and dexterous actions of past cultures questions this progressive model and allows us to see both refined and quotidian objects in a different light.<br><br>How something is made is as important as why it is made and what it looks like. The ultimate goal of this sort of object-driven inquiry is a material literacy informed by cultural curiosity and an appreciation for diverse approaches to problem solving that supplants an inclination to judge, classify, and rank in hindsight. Objects, more than simply reflections of static values, are complex entities that defy easy categorization. Human activity creates material culture, which in turn makes action possible while also recursively shaping and controlling action. Studied in this way, objects are truly at the center of interdisciplinary, cross-cultural study since they arise from specific socio-economic contexts, mediate social and cultural relations, and become important bearers of meaning and memory.", "passageTitle": "Reading Comprehension Passage", "question": "Which of the following statements best reflects the main argument of the THIRD paragraph of the passage?", "options": ["The innate potentials of a specific medium can significantly influence the production process.", "The conditions of an object's creation can be best understood by examining its substrate, interior, or back.", "The Kongo weavers of the 16th century created visually similar work to European velvet cloth by copying the techniques and using the same materials.", "The Kongo weavers' adaptation of the European technique highlights the potential for exchange between different cultures and their techniques."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\tOption 1. The statement is present in the&nbsp;<span>text<\/span><span> but it is not the main argument of the paragraph. The text does mention that the inherent possibilities of a particular medium can influence the production&nbsp;<\/span><span>process<\/span><span> but it is part of the larger argument about understanding the creation of functional works of art.<\/span>\r<br /><span>Option 2. This statement is the most representative of the main argument of the paragraph. The paragraph discusses the idea that a deeper understanding of functional works of art goes beyond the visible exterior and includes looking into the materials used, the interior of the object, and even the unconscious decisions of the creator.<\/span>\r<br /><span>Option 3. This statement is incorrect based on the paragraph. The Kongo weavers did not copy European techniques or use the same materials. They used their own familiar material (raffia) and practices to create work that was visually similar to European velvet cloth but was unique in its creation.<\/span>\r<br /><span>Option 4. Although the Kongo weavers' adaptation of the European technique can imply the potential for exchange between different cultures and their techniques, this is not explicitly mentioned or suggested as the main argument of the paragraph. The paragraph discusses&nbsp;<\/span><span>more about<\/span><span> understanding the creation of objects rather than the exchange of techniques between cultures.&nbsp;<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Inference"}, {"number": 15, "sourceId": "169460512703214", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>In a time of screen saturation, digitized images of objects and manuscripts, and an emphasis on “knowledge workers” rather than craftspeople, we run the risk of becoming materially illiterate. When we privilege sight and visual analysis alone, we fail to use a full battery of analytical tools deploying our eyes, touch, and embodied experiences to understand the material world. How might we link visual, haptic, and tacit knowledge of the material world when we have become distant from making and are more comfortable with approximations?<br><br>Formal visual analysis—a focus upon type and external aesthetic decoration—privileges appearance and often rests upon value systems generated outside of original context. Such an emphasis leads naturally to a hierarchy in which an idealized type or style is identified and charted as it moves outwards from the center to the periphery. This approach also draws attention to makers who have marked their products or appeared in written records, thereby skewing in favor of those who work in the metropole. <br>In interpreting functional works of art, one needs to think beyond the façade or style of the finished product. It is often the evidence of the unconscious act of the maker—the substrate, interior, or back rather than the surface, exterior, or front—that provide a true sense of the conditions of its creation. Materials are the crucial first step in delving into this hidden history of an object. The inherent possibilities of a particular medium can restrict or encourage certain action in the fabrication of objects. For example, Kongo weavers of the 16th century understood the techniques and effects of European cut pile velvet cloth but used their familiar raffia material and weaving practices to produce visually similar work that impressed European visitors. Such adaptation by the weaver turns an imperial perspective on end. Finished objects result from the interconnection of material, technique, and idea; resources, culture, and the maker’s body and brain all play active roles.<br><br>Once materials are harvested or processed, artisans transform them into objects through a series of interrelated steps of fabrication, decoration, and finish that altogether can be called realization. By recognizing that skilled work takes place over a considerable geographic and temporal range, we can divest ourselves of the notion that technology has continually improved and that the present offers the most advanced form of workmanship. Paying attention to the tacit knowledge and dexterous actions of past cultures questions this progressive model and allows us to see both refined and quotidian objects in a different light.<br><br>How something is made is as important as why it is made and what it looks like. The ultimate goal of this sort of object-driven inquiry is a material literacy informed by cultural curiosity and an appreciation for diverse approaches to problem solving that supplants an inclination to judge, classify, and rank in hindsight. Objects, more than simply reflections of static values, are complex entities that defy easy categorization. Human activity creates material culture, which in turn makes action possible while also recursively shaping and controlling action. Studied in this way, objects are truly at the center of interdisciplinary, cross-cultural study since they arise from specific socio-economic contexts, mediate social and cultural relations, and become important bearers of meaning and memory.", "passageTitle": "Reading Comprehension Passage", "question": "Which of the following, if true, most seriously challenges the “progressive model” of artisanship in Paragraph 4?", "options": ["The latest 3D printing technologies are now able to create intricate sculptures in a matter of hours.", "The current generation of artisans has developed new techniques that their predecessors could not have imagined.", "A 2000-year-old clay pot discovered in South America exhibited advanced pottery techniques that are still used today.", "Roman aqueducts, which are still standing and functioning 2300 years after their construction, showcase intricate architectural designs and sophisticated building techniques."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tOption 1. While the advancements in 3D printing technology is impressive, this option supports the \"progressive model\" of artisanship, which assumes constant technological advancement and improvement in craftsmanship over time.\r<br /><span>Option 2. This option, too, supports the \"progressive model\" as it implies a linear development and progression of craftsmanship techniques over time, with the current generation developing new techniques that surpass those of their predecessors.<\/span>\r<br /><span>Option 3. If a 2000-year-old clay pot demonstrated advanced pottery techniques that are still being used today, it would seriously challenge the \"progressive model\" of artisanship. This is because the \"progressive model\" implies a linear development in craftsmanship techniques, with the current day being the peak. This scenario shows that advanced techniques existed thousands of years ago, meaning that techniques have not necessarily progressed or improved linearly.<\/span>\r<br /><span>Option 4. This option helps to prove that Romans, 2300 years ago, had sophisticated technology, but does not prove that technology has not advanced or that the same technology is used today. The distinction between demonstrating the presence of advanced techniques in the past (as in option 4) and demonstrating the ongoing use of those techniques in the present (as in option 3) is important in challenging the \"progressive model.”&nbsp;<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Application Question"}, {"number": 16, "sourceId": "169460512703215", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>In a time of screen saturation, digitized images of objects and manuscripts, and an emphasis on “knowledge workers” rather than craftspeople, we run the risk of becoming materially illiterate. When we privilege sight and visual analysis alone, we fail to use a full battery of analytical tools deploying our eyes, touch, and embodied experiences to understand the material world. How might we link visual, haptic, and tacit knowledge of the material world when we have become distant from making and are more comfortable with approximations?<br><br>Formal visual analysis—a focus upon type and external aesthetic decoration—privileges appearance and often rests upon value systems generated outside of original context. Such an emphasis leads naturally to a hierarchy in which an idealized type or style is identified and charted as it moves outwards from the center to the periphery. This approach also draws attention to makers who have marked their products or appeared in written records, thereby skewing in favor of those who work in the metropole. <br>In interpreting functional works of art, one needs to think beyond the façade or style of the finished product. It is often the evidence of the unconscious act of the maker—the substrate, interior, or back rather than the surface, exterior, or front—that provide a true sense of the conditions of its creation. Materials are the crucial first step in delving into this hidden history of an object. The inherent possibilities of a particular medium can restrict or encourage certain action in the fabrication of objects. For example, Kongo weavers of the 16th century understood the techniques and effects of European cut pile velvet cloth but used their familiar raffia material and weaving practices to produce visually similar work that impressed European visitors. Such adaptation by the weaver turns an imperial perspective on end. Finished objects result from the interconnection of material, technique, and idea; resources, culture, and the maker’s body and brain all play active roles.<br><br>Once materials are harvested or processed, artisans transform them into objects through a series of interrelated steps of fabrication, decoration, and finish that altogether can be called realization. By recognizing that skilled work takes place over a considerable geographic and temporal range, we can divest ourselves of the notion that technology has continually improved and that the present offers the most advanced form of workmanship. Paying attention to the tacit knowledge and dexterous actions of past cultures questions this progressive model and allows us to see both refined and quotidian objects in a different light.<br><br>How something is made is as important as why it is made and what it looks like. The ultimate goal of this sort of object-driven inquiry is a material literacy informed by cultural curiosity and an appreciation for diverse approaches to problem solving that supplants an inclination to judge, classify, and rank in hindsight. Objects, more than simply reflections of static values, are complex entities that defy easy categorization. Human activity creates material culture, which in turn makes action possible while also recursively shaping and controlling action. Studied in this way, objects are truly at the center of interdisciplinary, cross-cultural study since they arise from specific socio-economic contexts, mediate social and cultural relations, and become important bearers of meaning and memory.", "passageTitle": "Reading Comprehension Passage", "question": "All of the following statements, if false, could be seen as being in accordance with the passage, EXCEPT:", "options": ["Digitized forms of objects are at best approximations of real word objects.", "Modern artifacts lack cultural and aesthetic depth of ancient objects.", "Contemporary techniques of creation are superior to older ones.", "The process of creation occurs in settings insulated from external influences."], "answer": 0, "answerLabel": "A", "solution": "The question stem is equivalent to:&nbsp;<span>Which of the following statements could be seen as being in accordance with the passage? OR Which of the following statements Is TRUE as per the passage?<\/span>\r<br /><span>Option1. This statement aligns with the initial part of the passage where it discusses how the current emphasis on digital images and \"knowledge workers\" runs the risk of making us materially illiterate. It implies that digitized forms of objects can only approximate the full experience of real-world objects, as they lack the tactile, embodied experience provided by physical interaction.<\/span>\r<br /><span>Option 2. Modern artifacts lack cultural and aesthetic depth of ancient objects. The passage doesn't argue that modern artifacts lack cultural and aesthetic depth compared to ancient ones. Instead, it emphasizes the need to understand the hidden history, materials, and process of creation, regardless of the age of the objects.<\/span>\r<br /><span>Option 3. Contemporary techniques of creation are superior to older ones. This directly contradicts the ideas presented in the passage. The passage disputes the notion that technology and craftsmanship have continually improved, instead suggesting that high levels of craftsmanship have been present throughout history.<\/span>\r<br /><span>Option 4. The process of creation occurs in settings insulated from external influences. This option contradicts the passage's assertion that the process of creating objects is influenced by resources, culture, and the artisan's body and brain. It implies a strong connection between the object's creation and its socio-economic and cultural context, thus refuting the idea that creation occurs in a vacuum.<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Inference"}, {"number": 17, "sourceId": "169460512703216", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br>1.\tA \"competitive\" market typically features numerous buyers and sellers, similar goods, and lacks informational disparities. <br>2.\tAny deviations from a fully competitive model, such as unavoidable concentration in digital markets due to network effects, need to be factored into the normative assessments of these markets.<br>3.\tDespite this, even in seemingly competitive markets, \"pockets\" of unequal power may exist due to situations like a single employer in a region or banks having more information than their customers. <br>4.\tCompetition in markets arises as agents strive for the best deal, inducing rivalry among other market participants. <br><br><span>", "options": [], "answer": "4132", "answerLabel": "4132", "solution": "<\/span>\tThere are two sequences to compare: 4132 and 1432.&nbsp;\r<br /><span>4132: Sentence 4: This is a suitable starting point as it introduces the concept of competition in markets (“competition in markets arises”). Sentence 1: Following the introduction of competition, this sentence naturally follows as it explains what characteristics define a competitive market. Sentence 3: After defining a competitive market, it's logical to then discuss the potential imperfections or exceptions in such markets, which is what this sentence does. Sentence 2: Finally, after discussing the imperfections or exceptions, this sentence concludes by stating that such deviations need to be considered in evaluating these markets.&nbsp;<\/span>\r<br /><span>1432: The sequence 1,4,3,2 is less coherent than 4,1,3,2 because it disrupts the logical progression of ideas. Here's why: Starting with sentence 1, you're introducing the concept of a \"competitive\" market and its features. This would naturally lead to a discussion about competition itself. But if we then move to sentence 4, we're suddenly discussing how competition arises in markets. This information would have been more valuable prior to defining a \"competitive\" market because it sets the groundwork for understanding competition in general before getting into the specifics of what makes a market competitive. The sequence then follows with sentence 3, which mentions exceptions to the competitive market. This would make more sense following an explanation of what makes a market competitive (which sentence 1 provides), but it's a bit disjointed coming right after a discussion about how competition arises. Finally, sentence 2 talks about deviations from the competitive model and the need to consider them. This is a good conclusion as it sets up a course of action based on the preceding discussion.<\/span>\r<br /><span>So, while both sequences are technically possible, 4,1,3,2 provides a smoother, more logical progression of ideas from the general (how competition arises) to the specific (what makes a market competitive, exceptions, and considerations).<\/span>\r<br /><span>Therefore<\/span><span>,<\/span><span> the required answer is 4132.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 18, "sourceId": "169460512703417", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br>1.\tThe stumbling block is their inability to articulate a fundamental and intuitively persuasive feature of retributivism - the broadly accepted belief that it is inappropriate to punish the innocent and to inflict disproportionate punishments on the guilty. <br>2.\tThis hybrid theory posits retributivism as a necessary condition for punishment, while consequentialist considerations furnish the reasons for imposing it.<br>3.\tIn its intuitive appeal, retributivism offers a stark contrast to consequentialist theories of punishment that concentrate on deterrence and incapacitation, both of which seem to grapple with a significant issue.<br>4.\tIn response to this dilemma, some theorists adopt a mixed approach, integrating elements of both theories.<br><br><span>", "options": [], "answer": "3142", "answerLabel": "3142", "solution": "<\/span>\tSentence 1. “The stumbling block is their inability …” makes it a follow up sentence. Presents a problem with consequentialist theories of punishment.\r<br />Sentence 2. “This hybrid theory…’ another follow-up sentence Describes a hybrid theory that integrates elements of retributivism and consequentialist theories.\r<br /><span>Sentence 3. Standalone sentence. Good starter. Introduces retributivism and how it contrasts with consequentialist theories of punishment.<\/span>\r<br /><span>Sentence 4. Describes a response to the dilemma mentioned in sentence 1.<\/span>\r<br />\r<br /><span>Sentence 3 introduces the topic of retributivism and its contrast to consequentialist theories, making it a good starting sentence. Sentence 1 follows naturally, presenting a problem with consequentialist theories, related to a feature of retributivism. Sentence 4 provides a response to this dilemma, which is the adoption of a mixed approach. Sentence 2 concludes by describing this hybrid theory.<\/span>\r<br /><span>Therefore<\/span><span> the required answer is 3142.<\/span><span><b>&nbsp;<\/b><\/span>", "topic": "Jumbled Paragraphs"}, {"number": 19, "sourceId": "169460512703818", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br>1.\tAdditionally, these firms face legal challenges due to the traumatizing experiences and insufficient wages given to local content moderators.<br>2.\tThe labor and recruitment practices of Big Tech firms highlight their disregard for Africa's needs and interests, thus jeopardizing the growth of domestic industries.<br>3.\tGiven this history of neglect towards African needs and issues, it is hardly surprising that African governments have started exploring alternatives and enforcing regulations on these firms.<br>4.\tThe unchecked spread of disinformation on US-based platforms such as Facebook has not only sowed discord and violent conflict, but also provided a platform for extremist groups, further tarnishing the reputation of these companies.<br><br><span>", "options": [], "answer": "2143", "answerLabel": "2143", "solution": "<\/span>\tSentence 1. “Additionally…” makes it a follow-up sentence. Presents legal challenges faced by Big Tech firms due to their treatment of local content moderators.\r<br /><span>Sentence 2. General statement of fact. Could be the starter. 2-1 is a possibility. Describes the labor and recruitment practices of Big Tech firms and how they highlight disregard for Africa's needs.<\/span>\r<br /><span>Sentence 3. “Given this history …” makes it a follow-up sentence. Presents a reaction from African governments due to the history of neglect from Big Tech firms.<\/span>\r<br /><span>Sentence 4. Highlights a specific issue related to the spread of disinformation on US-based platforms.4-3 is possible.&nbsp;<\/span>\r<br />\r<br /><span>Sentence 2 introduces the topic of the labor and recruitment practices of Big Tech firms and their impact on Africa, making it a good starting sentence. Sentence 1 follows naturally, presenting additional issues these firms face. Sentence 4 further elaborates on the problems caused by these firms, specifically through the spread of disinformation. Sentence 3 concludes by showing the reaction of African governments to these issues.<\/span>\r<br /><span>Therefore, the required answer is 2143.<\/span><span><b>&nbsp;<\/b><\/span>", "topic": "Jumbled Paragraphs"}, {"number": 20, "sourceId": "169460512703919", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><b>Sentence:<\/b> The application of censorship can potentially hinder the free flow of information.<br><br><b>Paragraph:<\/b> As artificial intelligence continues to evolve, large language models like ChatGPT have shown significant promise in various applications, including content generation, information retrieval, and language translation. _____1____. While these AI models are trained on vast datasets to understand and generate human-like text, their output is not without its controversies. _____2____. To address this, some propose applying censorship to the models' training data and output, aiming to prevent them from generating inappropriate or harmful content. _____3____. Nevertheless, despite the good intentions behind these measures, they pose certain challenges. _____4____.", "options": ["Option 1", "Option 2", "Option 3", "Option 4"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\tThe given sentence, \"The application of censorship can potentially hinder the free flow of information,\" fits best in the fourth blank. The sentences around&nbsp;<span>first<\/span><span> two blanks set the context about the role of AI models like ChatGPT and the controversies related to their output. The passage then discusses the proposal of censorship with the good intention of preventing them from generating harmful output.  So, blank 4, after discussing the proposal of censorship, provides an ideal place for the given sentence, which introduces the challenges/drawbacks of applying censorship.&nbsp;<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Paragraph Completion"}, {"number": 21, "sourceId": "169460512704120", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><b>Sentence:<\/b> Web3 is often associated with improved security, privacy, and greater control over one's digital footprint.<br><br><b>Paragraph:<\/b> The advent of the internet has revolutionized the way we communicate, work, and transact. Recently, we have entered the era of Web3, the next evolution of the internet. _____1____. Web3 allows users to interact with decentralized networks and applications, fundamentally altering our relationship with the digital world. _____2____. These features can potentially reshape the financial system, promoting more secure and private transactions. _____3____. Despite its promise, however, the implementation of Web3 also raises legal and ethical questions, particularly around data ownership, privacy, and security. _____4____. Navigating these challenges will be key to leveraging the full potential of Web3 for the benefit of all users.", "options": ["Option 1", "Option 2", "Option 3", "Option 4"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\tThe given sentence, \"Web3 is often associated with improved security, privacy, and greater control over one's digital footprint,\" fits best in the first blank. The first blank follows the introduction of Web3, setting up the context for discussing the specific elements and benefits of this new evolution of the internet. The given sentence aligns well with this context, providing an overview of what Web3 often promises. The following text delves into the application of Web3 in reshaping the financial system, potential challenges it raises, and the importance of navigating these issues.\r<br /><span>Hence, [1].<\/span>", "topic": "Paragraph Completion"}, {"number": 22, "sourceId": "169460512704221", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br>Like great works, deep feelings always mean more than they are conscious of saying. The regularity of an impulse or a repulsion in a soul is encountered again in habits of doing or thinking, is reproduced in consequences of which the soul itself knows nothing. Great feelings take with them their own universe, splendid or abject. They light up with their passion an exclusive world in which they recognize their climate. There is a universe of jealousy, of ambition, of selfishness, or of generosity. A universe in other words, a metaphysic and an attitude of mind. What is true of already specialized feelings will be even more so of emotions basically as indeterminate, simultaneously as vague and as “definite,” as remote and as “present” as those furnished us by beauty or aroused by absurdity.", "options": ["Deep feelings, like great works, carry more meaning than they express and shape our habits, actions, and attitudes, often unbeknownst to us.", "Great feelings create their own universes, each with its own climate, metaphysics, and attitude, be it of jealousy, ambition, selfishness, or generosity, beauty or absurdity.", "The emotions furnished by beauty or absurdity not only shape our habits and attitudes but also light up an exclusive world, whether of jealousy, ambition, selfishness, or generosity.", "Like great works, deep feelings unbeknownst to us, condition our habits and actions and define their unique universes, particularly those stirred by beauty or absurdity."], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span><b>Points:<\/b><\/span>\r<br /><span>• Deep feelings mean more than they consciously express.<\/span>\r<br /><span>• These feelings influence habits, actions, and attitudes.<\/span>\r<br />• Great feelings create their own universes, which may be of jealousy, ambition, selfishness, or generosity.\r<br /><span>• The unique universes of feelings are especially evident in emotions stirred by beauty or absurdity.<\/span>\r<br />\r<br /><span>Option 1. Incorrect. This summary does not mention the unique universes created by great feelings and their metaphysical implications.<\/span>\r<br /><span>Option 2. Incorrect. This summary fails to articulate how deep feelings influence habits and actions, and it doesn't include the aspect of emotions stirred by beauty or absurdity.<\/span>\r<br /><span>Option 3. Incorrect. This summary fails to capture the wider influence of deep feelings on habits and actions and does not mention emotions stirred by beauty or absurdity.<\/span>\r<br /><span>Option 4. Correct. This summary encapsulates all the main points of the text: the more profound meanings of deep feelings, their influence on habits and actions, the unique universes they create, and the special case of emotions stirred by beauty or absurdity, and the comparison with the influence o great works.&nbsp;<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Summary"}, {"number": 23, "sourceId": "169460512704422", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br>All of Dostoevsky’s heroes question themselves as to the meaning of life. In this they are modern: they do not fear ridicule. What distinguishes modern sensibility from classical sensibility is that the latter thrives on moral problems and the former on metaphysical problems. In Dostoevsky’s novels the question is propounded with such intensity that it can only invite extreme solutions. Existence is illusory or it is eternal. If Dostoevsky were satisfied with this inquiry, he would be a philosopher. But he illustrates the consequences that such intellectual pastimes may have in a man’s life, and in this regard he is an artist.", "options": ["Dostoevsky's characters' intense questioning of life’s meaning highlights the shift from moral to metaphysical issues in modern thought, leading to extreme solutions about the nature of existence and highlighting Dostoevsky's artistic insight into the consequences of such inquiry.", "Dostoevsky's characters, being modern, question the meaning of life, dealing with metaphysical rather than moral problems and inviting extreme solutions such as the idea that existence is either illusory or eternal, making Dostoevsky an artist rather than a philosopher.", "Dostoevsky's modern characters focus on metaphysical problems, contrasting with classical sensibility's focus on moral problems, and ponder on the nature of existence in extreme terms, either as an illusion or as eternity, which makes Dostoyevsky a philosopher artist.", "The intense questioning about the meaning of life by Dostoevsky's characters demonstrates the shift from metaphysical to moral problems in modern sensibility, leading to extreme solutions to existence and showcasing Dostoevsky's artistic understanding of the repercussions of such questioning."], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span><b>Points:<\/b><\/span>\r<br /><span>• Dostoevsky’s heroes, representing modern sensibility, question the meaning of life.<\/span>\r<br /><span>• Modern sensibility, unlike classical sensibility, focuses on metaphysical rather than moral problems.<\/span>\r<br /><span>• These characters explore extreme solutions about the nature of existence.<\/span>\r<br /><span>• Dostoevsky illustrates the consequences of such intellectual pursuits, showcasing his skill as an artist.<\/span>\r<br />\r<br /><span>Option 2. Incorrect. This summary, while capturing the main points, does not effectively communicate the contrast between modern and classical sensibilities – ‘the shift from moral to metaphysical.’<\/span>\r<br /><span>Option 3. Incorrect. This summary misses the fact that Dostoevsky illustrates the consequences of such intense questioning on a person's life, demonstrating his skill as an artist. ‘<\/span><span>philosopher<\/span><span> artist’ is also misleading.&nbsp;<\/span>\r<br /><span>Option 4. Incorrect. Reverses “the shift from metaphysical to moral problems in modern sensibility.”&nbsp;<\/span>\r<br /><span>Option 1. Correct. This summary encapsulates all the main points of the text, effectively distinguishing between modern and classical sensibilities, highlighting the extreme solutions explored by the characters, and acknowledging Dostoevsky's artistic insight into the impact of such inquiry.<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Summary"}, {"number": 24, "sourceId": "169460512704523", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br>Idleness, it is usually said, is a root of all evil. To prevent this evil one recommends work. However, it is easy to see from the remedy as well as the feared cause that this whole view is of very plebeian extraction. Idleness as such is by no means a root of evil; quite the contrary, it is a truly divine way of life so long as one is not bored. Certainly, idleness may lead you to lose your fortune, and so on, but of such things the man of noble nature has no fear; what he fears is boredom. The Olympian gods were not bored, they prospered in happy idleness. So, far from idleness being the root of evil, rather it is the true good. The root of evil is boredom, and that is what must be kept at bay. Idleness is not evil; indeed, one can say that any human who lacks appreciation of it proves he has not raised himself to the level of humanity.", "options": ["The plebeian view that idleness is the root of all evil is contradicted, asserting that idleness, free from boredom, is a divine way of life that a person of noble nature aspires to, while boredom is the actual root of evil.", "The common perception of idleness as a root of all evil is contested, arguing that idleness is not the problem but boredom is and that one who doesn't appreciate idleness has not truly understood the essence of humanity.", "Idleness without boredom is defended as a divine lifestyle free of evil, stating that boredom is the real root of evil, and an inability to appreciate idleness denotes a lack of understanding of humanity.", "The notion that idleness leads to evil is ridiculous, and it is asserted that idleness, if not accompanied by boredom, is a divine life practice and that the real evil is boredom, and those who do not value idleness lack a deep understanding of humanity."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span><b>Points:<\/b><\/span>\r<br /><span>• The view that idleness is the root of evil is questioned as plebian.<\/span>\r<br /><span>• Idleness is argued to be a divine way of life, provided one does not get bored.<\/span>\r<br /><span>• The real root of evil is stated to be boredom.<\/span>\r<br /><span>• It is suggested that a lack of appreciation for idleness signifies a lack of understanding of humanity.<\/span>\r<br />\r<br /><span>Option 1. Incorrect. This summary, while capturing the main points is problematic in “aspires to.”&nbsp;<\/span>\r<br /><span>Option 2. Correct. This summary effectively encapsulates the main points of the text, challenging the perception of idleness as evil, asserting boredom as the actual evil, and linking the appreciation of idleness to the understanding of humanity.<\/span>\r<br /><span>Option 3. Incorrect. This summary, although it covers the main ideas, fails to capture the point that the conventional view is plebeian.&nbsp;<\/span>\r<br /><span>Option 4. Incorrect. This summary is problematic in the use of ‘<\/span><span>ridiculous’<\/span><span>.&nbsp;<\/span>\r<br />\r<br /><span>Hence, [2].<\/span>", "topic": "Summary"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;
function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
