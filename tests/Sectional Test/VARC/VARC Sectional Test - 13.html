 […] was the interaction between Earth and life that transformed our planet’s surface.", "passageTitle": "Reading Comprehension Passage", "question": "<span>Which of the following, if true, would most seriously challenge the “whiffs of oxygen” theory (Paragraph 3)?<\/span>", "options": ["<span>The chemical signatures in the rocks older than 2.4 billon years showed oxygen-based weathering of rocks on land and early existence of cyanobacteria.<\/span>", "<span><\/span>\t<span>Sedimentary rocks that form from volcanic dust show signals of oxidation of millions of years after they were formed.<\/span>", "<span><\/span>\t<span>The sedimentary rocks older than 2.4 billion years also contained chemical signatures of minerals that formed long after the rocks were formed.<\/span>", "<span><\/span>\t<span>Chemical signatures used as evidence of the presence of whiffs of oxygen were introduced into the rock at an earlier stage, long before the GOE.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>The “whiff of air” hypothesis is that “Some of the same chemical signatures that record permanent environmental change 2.4 billion years ago suggest earlier accumulations of oxygen….” (earlier to GOE). And these accumulations were “limited, local, and short-lived.” Option 3 challenges this theory by stating that the time of these chemical signatures cannot be relied upon because the same rocks also contained chemical signatures of minerals that formed ‘long after the rocks were formed”. Similarly, the chemical signature of atmospheric oxygen could also have been formed long after (implicitly even after the GOE). By making the timing of the chemical signatures in the rocks doubtful, it challenges the theory. The other options support the theory.<\/span>\r<br /><span>Hence, [<\/span><span>3<\/span><span>].<\/span>", "topic": "Application Question"}, {"number": 15, "sourceId": "169476453377114", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>Why did our planet change so profoundly 2.4 billion years ago? Geologists agree on when oxygen began to accumulate, but at present there is no consensus on how it happened…<br><br><span>There is consensus on at least two points. First, oxygen in the air we breathe owes its existence to life. The only process capable of oxygenating our planet’s atmosphere is oxygenic photosynthesis—photosynthesis in which water supplies electrons, generating oxygen as a by-product. Earth’s Great Oxygenation Event (GOE) was revolutionary, and cyanobacteria—the only bacteria capable of oxygenic photosynthesis—were the heroes of the revolution. <\/span><span>With this in mind, a<\/span><span> potentially simple solution presents itself: the evolutionary origin of cyanobacteria led directly to the GOE. Simple indeed, but two observations, one geological and one ecological, suggest that the story is <\/span><span>actually more<\/span><span> complicated…<\/span><br><br><span>Sedimentary rocks older than 2.4 billion years contain chemical signatures that many interpret as evidence for transient oxygen production on a generally oxygen-free planet. Some of the same chemical signatures that record permanent environmental change 2.4 billion years ago suggest earlier accumulations of oxygen, but limited, local, and short-lived. Critics of such interpretations exist, but evidence for these “whiffs of oxygen” is abundant and growing, and if even one of them is interpreted correctly, oxygenic photosynthesis must have originated hundreds of millions of years before the GOE…<\/span><br><br><span>Ecology helps to explain the geologic data. In modern sunlit environments where dissolved iron, hydrogen <\/span><span>sulfide<\/span><span>, or other alternative sources of electrons are present, cyanobacteria <\/span><span>actually don’t<\/span><span> fare well. This suggests that in early oceans, cyanobacteria were commonly at a competitive disadvantage relative to other types of photosynthetic bacteria.<\/span><br><br><span>This brings up the second point of consensus: the existence of cyanobacterial photosynthesis is not enough to foment planetary change. Oxygen in the atmosphere and ocean will only accumulate when the rate of oxygen production by cyanobacteria exceeds the rate at which physical and biological processes remove it.<\/span><br><br><span>Now we have two ways of explaining how cyanobacteria could have originated long before oxygen began its permanent accumulation in the atmosphere and surface ocean. Perhaps reduced gases and ions in early oceans <\/span><span>favored<\/span><span> photosynthetic bacteria other than cyanobacteria. And possibly, overall rates of photosynthesis were sufficiently low so that any oxygen gas generated by early <\/span><span>cyanos<\/span><span> was scavenged by volcanic gases and weathering minerals. I believe that both were true.<\/span><br><br>In early oceans, phosphorus input from the continents was low because of the limited volume of rocks sticking out above the sea. At the same time, the return of phosphorus to the surface by the upwelling of deep waters would also have been limited by inefficient recycling. In fact, nutrient availability probably placed strong constraints on early life, limiting photosynthesis, whether by cyanobacteria or other bacteria, to levels unlikely to affect global transformation. As our planet matured, large, stable continents emerged above sea level, increasing the erosional flux of phosphorus to the oceans. Eventually, as the phosphorus supply came to outstrip the availability of alternative electron donors, cyanobacteria gained ecological importance. And as they did so, they transformed the world. The oxygen they produced scavenged other sources of electrons from sunlit waters, permanently tipping the biosphere toward oxygenic photosynthesis and oxygen-rich air. In this view, the Great Oxygenation Event […] was the interaction between Earth and life that transformed our planet’s surface.", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which one of the following statements, if false, could be seen as contradicting the facts/arguments in the passage:<\/span>", "options": ["<span>Ecology suggests that cyanobacteria were the dominant form of photosynthetic life in early oceans on Earth.<\/span>", "<span><\/span>\t<span>Ecology cannot explain how cyanobacteria could have originated long before the Great Oxygenation Event of 2.4 billion years ago.<\/span>", "<span>Life originated on an oxygen-free Earth and transformed the planet's surface by introducing oxygen into the atmosphere.<\/span>", "<span><\/span>\t<span>Sedimentary rocks older than 2.4 billion years suggest that there were no accumulations of oxygen on the planet.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>If false … contradict<\/span><span> means the answer option would not contradict (or be a true statement) as it stands. If negated it would contradict the passage.<\/span>\r<br /><span>Option 1. “Ecology suggests that cyanobacteria were the dominant form of photosynthetic life in early oceans on Earth” is a false statement&nbsp;<\/span><span>in itself as<\/span><span> the passage states “in early oceans, cyanobacteria were commonly at a competitive disadvantage relative to other types of photosynthetic bacteria…This brings up the second point of consensus: the existence of cyanobacterial photosynthesis is not enough to foment planetary change.”  If negated, option 1 will support the passage.<\/span>\r<br /><span>Option 2. “Ecology cannot explain how cyanobacteria could have originated long before the Great Oxygenation Event of 2.4 billion years ago” is a false Statement in itself.  The penultimate paragraph makes this clear.<\/span>\r<br />Option 3. “Life originated on an oxygen-free Earth and transformed the planet's surface by introducing oxygen into the atmosphere” is a true statement and supports the passage. If negated it would contradict the passage.\r<br /><span>Option 4. “Sedimentary rocks older than 2.4 billion years suggest that there were no accumulations of oxygen on the planet” is false&nbsp;<\/span><span>statement in itself<\/span><span>.<\/span>\r<br /><span>Hence, [<\/span><span>3<\/span><span>].<\/span>", "topic": "Application Question"}, {"number": 16, "sourceId": "169476453377115", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>Why did our planet change so profoundly 2.4 billion years ago? Geologists agree on when oxygen began to accumulate, but at present there is no consensus on how it happened…<br><br><span>There is consensus on at least two points. First, oxygen in the air we breathe owes its existence to life. The only process capable of oxygenating our planet’s atmosphere is oxygenic photosynthesis—photosynthesis in which water supplies electrons, generating oxygen as a by-product. Earth’s Great Oxygenation Event (GOE) was revolutionary, and cyanobacteria—the only bacteria capable of oxygenic photosynthesis—were the heroes of the revolution. <\/span><span>With this in mind, a<\/span><span> potentially simple solution presents itself: the evolutionary origin of cyanobacteria led directly to the GOE. Simple indeed, but two observations, one geological and one ecological, suggest that the story is <\/span><span>actually more<\/span><span> complicated…<\/span><br><br><span>Sedimentary rocks older than 2.4 billion years contain chemical signatures that many interpret as evidence for transient oxygen production on a generally oxygen-free planet. Some of the same chemical signatures that record permanent environmental change 2.4 billion years ago suggest earlier accumulations of oxygen, but limited, local, and short-lived. Critics of such interpretations exist, but evidence for these “whiffs of oxygen” is abundant and growing, and if even one of them is interpreted correctly, oxygenic photosynthesis must have originated hundreds of millions of years before the GOE…<\/span><br><br><span>Ecology helps to explain the geologic data. In modern sunlit environments where dissolved iron, hydrogen <\/span><span>sulfide<\/span><span>, or other alternative sources of electrons are present, cyanobacteria <\/span><span>actually don’t<\/span><span> fare well. This suggests that in early oceans, cyanobacteria were commonly at a competitive disadvantage relative to other types of photosynthetic bacteria.<\/span><br><br><span>This brings up the second point of consensus: the existence of cyanobacterial photosynthesis is not enough to foment planetary change. Oxygen in the atmosphere and ocean will only accumulate when the rate of oxygen production by cyanobacteria exceeds the rate at which physical and biological processes remove it.<\/span><br><br><span>Now we have two ways of explaining how cyanobacteria could have originated long before oxygen began its permanent accumulation in the atmosphere and surface ocean. Perhaps reduced gases and ions in early oceans <\/span><span>favored<\/span><span> photosynthetic bacteria other than cyanobacteria. And possibly, overall rates of photosynthesis were sufficiently low so that any oxygen gas generated by early <\/span><span>cyanos<\/span><span> was scavenged by volcanic gases and weathering minerals. I believe that both were true.<\/span><br><br>In early oceans, phosphorus input from the continents was low because of the limited volume of rocks sticking out above the sea. At the same time, the return of phosphorus to the surface by the upwelling of deep waters would also have been limited by inefficient recycling. In fact, nutrient availability probably placed strong constraints on early life, limiting photosynthesis, whether by cyanobacteria or other bacteria, to levels unlikely to affect global transformation. As our planet matured, large, stable continents emerged above sea level, increasing the erosional flux of phosphorus to the oceans. Eventually, as the phosphorus supply came to outstrip the availability of alternative electron donors, cyanobacteria gained ecological importance. And as they did so, they transformed the world. The oxygen they produced scavenged other sources of electrons from sunlit waters, permanently tipping the biosphere toward oxygenic photosynthesis and oxygen-rich air. In this view, the Great Oxygenation Event […] was the interaction between Earth and life that transformed our planet’s surface.", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which one of the following statements best reflects the main argument of the last paragraph of the passage?<\/span>", "options": ["<span>The oxygen produced by cyanobacteria had a transformative effect on the biosphere, tipping it toward oxygenic photosynthesis and oxygen-rich air.<\/span>", "<span><\/span>\t<span>The emergence of stable continents that alleviated the nutritional constraints for cyanobacteria led to Earth’s Great Oxygenation Event.<\/span>", "<span><\/span>\t<span>The large continents which increased the phosphorus-content of the early oceans enabled cyanobacteria to transform the biosphere permanently towards oxygen-rich air.<\/span>", "<span><\/span>\t<span>The Great Oxygenation Event is seen as a crucial interaction between Earth and life that transformed the planet's surface permanently.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>In early oceans, low phosphorus input from continents and limited recycling of phosphorus in upwelling deep waters constrained early life and limited photosynthesis. With the emergence of large continents above sea level, the supply of phosphorus to the oceans increased. Cyanobacteria gained ecological importance (phosphorous made the oceans nutrition rich for cyanobacteria) and produced oxygen through photosynthesis, which permanently transformed the biosphere towards oxygen-rich air. This event is known as the Great Oxygenation Event and is seen as a crucial interaction between Earth and life that transformed the planet's surface. Option 2 best captures this idea concisely.<\/span>\r<br /><span>Hence, [<\/span><span>2<\/span><span>].<\/span>", "topic": "Inference"}, {"number": 17, "sourceId": "169476453377116", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br><span>1.<\/span>\t<span>A healthy diet is essential for maintaining overall health and well-being, including managing weight, preventing chronic diseases, and improving mental health.<\/span><br><span>2.<\/span>\t<span>Many people, however, still struggle to make healthy choices when it comes to their daily meals.<\/span><br><span>3.<\/span>\t<span>To make a lasting change, it is important to start with small, manageable steps, like adding more fruits and vegetables to your diet and reducing portion sizes.<\/span><br><span>4.<\/span>\t<span>Poor dietary choices, such as consuming too much processed food and not enough fruits and vegetables, can lead to serious health issues like obesity, diabetes, and heart disease.<\/span><br><br><span>", "options": [], "answer": "1423", "answerLabel": "1423", "solution": "<\/span>\t<span>Sentence 1. Standalone sentence. Good for the starter. Introduces the topic of a healthy diet and its importance for overall health.<\/span>\r<br /><span>Sentence 2. Could follow 1 as 1-2. Addresses the issue of people struggling with making healthy choices.<\/span>\r<br /><span>Sentence 3. ‘To make a lasting change’ links to struggling ‘to make healthy choices’ in 2.&nbsp;<\/span><span>So<\/span><span> 2-3 is a possibility.  Offers a solution for making lasting changes towards a healthier diet.<\/span>\r<br /><span>Sentence 4. Explains the consequences of poor dietary choices. General statement. Could be at the beginning.<\/span>\r<br /><span>1234 itself looks like a good sequence. However, 1-4-2-3 is better. “Poor dietary choices … can lead to serious health issues” in 4 makes “Many people, however, still struggle to make healthy choices…” a better combination logically. In that case, 4 is better placed before 2-3. 1-4 is also logical as they present a flow emphasising why “a healthy diet is essential”.&nbsp;<\/span><span>So<\/span><span> the best sequence is 1423.  Sentence 1 introduces the topic of a healthy diet and its importance for overall health, making it a good starting sentence. Sentence 4 follows logically, explaining the consequences of poor dietary choices. Sentence 2 then addresses the issue of people struggling with making healthy choices when it comes to their daily meals, providing a contrasting perspective. Sentence 3 offers a solution for making lasting changes towards a healthier diet, making it a good ending sentence.<\/span>\r<br /><span>Therefore, the correct answer is 1423.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 18, "sourceId": "169476453377317", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br><span>1.<\/span>\t<span>Art, in its many forms, can inspire deep emotions, provoke thought, and even lead to personal growth.<\/span><br><span>2.<\/span>\t<span>However, the power of art to create a lasting impact on individuals and society is often underestimated.<\/span><br><span>3.<\/span>\t<span>By engaging with various forms of art, people can develop a greater understanding of themselves, others, and the world around them.<\/span><br><span>4.<\/span>\t<span>Despite its significance, many people still view art as a mere form of entertainment or decoration, overlooking its potential to change lives.<\/span><br><br><span>", "options": [], "answer": "1342", "answerLabel": "1342", "solution": "<p>Sentence 1 introduces the topic of art and its various impacts, making it a good starting sentence.&nbsp; Sentence 3 follows logically, explaining the benefits of engaging with various forms of art. 3 has to be followed either by 2 or 4.&nbsp;<\/p>\n<p>&ldquo;&hellip;people can develop a greater understanding of themselves, others, and the world around them&rdquo; in 3 and &ldquo;many people still view art as a mere form of entertainment&rdquo; provides a particular contrast &ndash; which is 3-4.<\/p>\n<p>&ldquo;&hellip;people can develop a greater understanding of themselves, others, and the world around them&rdquo; and &ldquo;the power of art to create a lasting impact on individuals and society&rdquo; is another contrast, which is 3-2.<\/p>\n<p>3-4 scores over 3-2 for various reasons: &nbsp;&lsquo;what people can gain from art&rsquo; and &lsquo;how still many people perceive art&rsquo; (3-4) are logically more related than &lsquo;how people can gain from art&rsquo; and &lsquo;the power of art.&rsquo; (3-2) Also, &nbsp;<strong>&ldquo;<\/strong>a lasting impact on individuals and society&rdquo; in 4 is in sharp contrast to &ldquo;mere form of entertainment or decoration, overlooking its potential to change lives&rdquo;. &nbsp;Besides, sentence 2 which is more general and in line with the theme of the paragraph, which is: &ldquo; Art, &hellip; can inspire &hellip;, provoke thought, .. lead to personal growth&rdquo; and &ldquo;the power of art to create a lasting impact on individuals and society&hellip;&rdquo; as start and close produces a more structured paragraph.&nbsp; Also, &ldquo;the potential to change lives&rdquo; (sentence 4) and &ldquo;lasting impact&rdquo; (sentence 2) are better placed in 4-2.&nbsp; This makes 2 a follow-up sentence to 4 rather than vice versa and is a better closing than 4.<\/p>\n<p>What this boils down to is that 3-4 is mandatory and 4-2 is mandatory. The \"However\" in sentence 2 can be seen as emphasizing or deepening the sentiment introduced in sentence 4.<\/p>\n<p>Combination 1324, on the other hand, merely appears plausible on casual reading and lacks the above robust structure of details.<\/p>\n<p><strong>The correct answer is 1342.<\/strong><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 19, "sourceId": "169476453377718", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br><span>1.<\/span>\t<span>To succeed, united opposition parties must not only remove the populist leader, but also present a compelling alternative vision for the future.<\/span><br><span>2.<\/span>\t<span>Populist leaders are known for undermining democracy and causing even more damage if re-elected, as seen in Hungary under Prime Minister Viktor Orbán.<\/span><br><span>3.<\/span>\t<span>When opposition parties unite to challenge an authoritarian populist regime, they must prioritize removing the populist leader above their individual goals.<\/span><br><span>4.<\/span>\t<span>However, focusing solely on the strongman can inadvertently play into their hands, as they thrive on polarization and personalization.<\/span><br><br><span>", "options": [], "answer": "3241", "answerLabel": "3241", "solution": "<\/span>\t<span>Sentence 1. “to succeed…’ refers to some&nbsp;<\/span><span>task<\/span><span> stated before it.<\/span>\r<br /><span>Sentence 2. Provides an example of a populist leader undermining democracy and causing damage, supporting the need for united opposition. Could be the starter.<\/span>\r<br /><span>Sentence 3. Introduces the topic of opposition parties uniting to challenge an authoritarian populist regime. 3-2 appears possible. 2-3 would be an abrupt start. But 3-2 is better because the reason for 3 (‘they must prioritize removing the populist leader’) is explained in 2.&nbsp;<\/span>\r<br /><span>Sentence 4. “<\/span><span>However<\/span><span>…” Presents a contrasting perspective, warning about the potential pitfalls of focusing solely on the strongman.<\/span>\r<br /><span>The correct sequence is 3-2-4-1. Sentence 3 introduces the topic of opposition parties uniting to challenge an authoritarian populist regime, making it a good starting sentence. Sentence 2 follows logically, providing an example of a populist leader undermining democracy and causing damage, supporting the need for a united opposition. Sentence 4 then presents a contrasting perspective, warning about the potential pitfalls of focusing solely on the strongman. Sentence 1 concludes with what opposition parties need to do to succeed, offering a solution that addresses the concerns raised in sentence 4.<\/span>\r<br /><span>Therefore, the required answer is 3241.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 20, "sourceId": "169476453377919", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><span><b>Sentence:<\/b><\/span><span> This damage can lead to serious complications and even vision loss if left untreated.<\/span><br><span><b>Paragraph:<\/b><\/span><span> _____1____. With millions of people worldwide suffering from some form of visual impairment, proper eye care is essential for maintaining good vision and eye health. _____2____.  One of the most common threats to our eyes is exposure to harmful substances, such as environmental pollutants, chemicals, and even certain medications. _____3____.  Another lesser-known factor that can impact eye health is cigarette smoking. Researchers have found that smoking can harm various parts of the eye, including the cornea and lens, causing inflammation, cataracts, and macular degeneration. _____4____.<\/span>", "options": ["<span>Option 1<\/span>", "<span><\/span>\t<span>Option 2<\/span>", "<span><\/span>\t<span>Option 3<\/span>", "<span><\/span>\t<span>Option 4<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>The given sentence, \"This damage can lead to serious complications and even vision loss if left untreated,\" fits most appropriately in the fourth blank as the sentences preceding the other blanks are not talking about ‘this damage’ to the eyes. The paragraph starts with a general&nbsp;<\/span>introduction to the importance of eye care and then discusses the common threats to eye health. In the third blank, the paragraph specifically mentions the impact of cigarette smoking on eye health, listing some of the consequences. The given sentence is a natural continuation of this information, as it describes the potential severity of the damage caused by smoking to the eyes if not addressed. Blank 3 may seem to some as a possible placement but blank 4 is a better fit as “this damage” in the given sentence refers to the damage mentioned in the sentence before blank 4.&nbsp;<span>Hence, [<\/span><span>4<\/span><span>].<\/span>", "topic": "Paragraph Completion"}, {"number": 21, "sourceId": "169476453378020", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><span><b>Sentence:<\/b><\/span><span> Researchers are working tirelessly to find innovative solutions to combat this pressing issue.<\/span><br><span><b>Paragraph:<\/b><\/span><span> _____1____. Climate change is one of the most significant challenges facing humanity today, with severe consequences for our environment, economies, and societies. _____2____. The primary causes of climate change include the burning of fossil fuels, deforestation, and various industrial processes that release greenhouse gases into the atmosphere. _____3____. By understanding the underlying causes and effects of climate change, experts aim to develop more sustainable practices and technologies to mitigate its impact. _____4____.<\/span>", "options": ["<span>Option 1<\/span>", "<span><\/span>\t<span>Option 2<\/span>", "<span><\/span>\t<span>Option 3<\/span>", "<span><\/span>\t<span>Option 4<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>The given sentence, \"Researchers are working tirelessly to find innovative solutions to combat this pressing issue,\" fits most appropriately in the third blank. The paragraph starts by emphasizing the importance and consequences of climate change. It then discusses the primary causes of climate change in the second blank. The given sentence serves as a natural transition from the causes of climate change to the efforts being made to address it, highlighting the determination of researchers to find innovative solutions.<\/span>\r<br /><span>Hence, [<\/span><span>3<\/span><span>].<\/span>", "topic": "Paragraph Completion"}, {"number": 22, "sourceId": "169476453378221", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br><span>In most management settings, “high variance” — erratic and unpredictable behaviour — is a bad thing. We want our pilots, <\/span><span>doctors<\/span><span> or underwriters to perform in an orderly way with the variance minimised. For example, any airline considering the recruitment of 10 pilots would prefer all of them to be solid, reliable hires rather than taking on one pilot who is brilliant and nine that are terrible who might crash the plane. But, when it comes to creativity and innovation — such as finding a way to improve the air travel experience or launching a new aviation venture — that same airline would prefer one idea that is excellent and nine that are nonsense, rather than a set of ten solid ideas. The reason is that, in creative tasks, variance is your friend. An idea is like a financial option: you simply use it if it is good and just forget about it if it is not. This insight has important implications for the design and use of AI systems, in general, and for their use in creativity and innovation, in particular.<\/span>", "options": ["<span>High variance which is minimized while hiring pilots is essential while seeking ways to improve travel experience or launching a new venture or affecting AI system design and use within the industry.<\/span>", "<span><\/span>\t<span>AI systems should be designed to minimize high variance in management settings and fostering creativity and innovation is essential for the generation of ideas for air travel improvements or new aviation ventures.<\/span>", "<span><\/span>\t<span>High variance is undesirable in management settings, but it is essential for creativity and innovation, where one great idea is more valuable than multiple solid ones which is an important aspect in AI system design and use.<\/span>", "<span><\/span>\t<span>High variance, undesirable while hiring pilots, has significant implications for the use of AI systems in management settings and the aviation industry while fostering creativity in air travel improvements or aviation ventures.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<p><strong>Points:<\/strong> <br /><span>&middot;<\/span>&nbsp; High variance is undesirable in management settings. <br /><span>&middot;<\/span>&nbsp; Orderly performance is preferred for pilots, doctors, underwriters. <br /><span>&middot;<\/span>&nbsp; In creativity and innovation, high variance is essential. <br /><span>&middot;<\/span>&nbsp; One great idea more is valuable than multiple solid ones. <br /><span>&middot;<\/span>&nbsp; Ideas like financial options: use good ones, discard bad ones. <br /><span>&middot;<\/span>&nbsp; Implications for AI system design and use in creativity and innovation.<\/p>\n<p><br />Option 1. This option is not the best precis as it focuses on hiring pilots and doesn't effectively capture the essence of the passage which is about the importance of high variance in creativity and innovation, and its implications on AI system design and use. <br />Option 2. This option is not the best precis as it focuses on the design of AI systems to minimize high variance in management settings and fostering&nbsp;creativity, but doesn't capture the key idea that high variance is essential in creativity and innovation. <br />Option 3. This option is the best precis as it accurately captures the essence of the passage, stating that high variance is undesirable in management settings but essential for creativity and innovation, and highlights the importance of this insight in AI system design and use. <br />Option 4. This option is not the best precis as it emphasizes the undesirability of high variance in hiring&nbsp;pilots, but doesn't effectively convey the importance of high variance in creativity and innovation, and its implications on AI system design and use. <br />Hence, [3].<\/p>", "topic": "Summary"}, {"number": 23, "sourceId": "169476453378322", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br><span>Language itself is not a technology. It’s native to our species. Our brains and bodies have evolved to speak and to hear words. A child learns to talk without instruction, as a fledgling bird learns to fly. Because reading and writing have become so central to our identity and culture, it’s easy to assume that they, too, are innate talents. But they’re not. Reading and writing are unnatural acts, made possible by the purposeful development of the alphabet and many other technologies. Our minds <\/span><span>have to<\/span><span> be taught how to translate the symbolic characters we see into the language we understand. Reading and writing require schooling and practice, the deliberate shaping of the brain.<\/span>", "options": ["<span>Language is a technology that is native to humans, but learning to speak, read, and write require deliberate practice and instruction.<\/span>", "<span>Reading, writing, and language are innate abilities that humans possess, requiring little to no instruction.<\/span>", "<span><\/span>\t<span>The development of reading and writing skills relies on the alphabet and various technologies, but they are not innate as spoken language.<\/span>", "<span><\/span>\t<span>Language is an innate ability, while reading and writing are unnatural acts made possible by deliberate practice and education.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<p><strong>Points:<\/strong> <br /><span>&middot;<\/span>&nbsp; Language is native to humans. <br /><span>&middot;<\/span>&nbsp; Brains and bodies evolved for speaking and hearing. <br /><span>&middot;<\/span>&nbsp; Children learn to talk without instruction. <br /><span>&middot;<\/span>&nbsp; Reading and writing are unnatural acts. <br /><span>&middot;<\/span>&nbsp; Alphabet and technologies enable reading and writing. <br /><span>&middot;<\/span>&nbsp; Minds need to be taught to translate symbols. <br /><span>&middot;<\/span>&nbsp; Schooling and practice required for reading and writing.<\/p>\n<p><br />Option 1. This option is incorrect because it suggests that language itself is a technology. The passage states that language is not a technology, but rather an innate ability of humans. The passage also emphasizes that reading and writing are technologies that require practice and instruction. <br />Option 2. This option is incorrect because it claims that reading, writing, and language are all innate abilities. The passage clearly differentiates between spoken language, which is innate, and reading and writing, which are technologies that require deliberate practice and education. <br />Option 3. This option is partially correct, as it acknowledges the reliance of reading and writing skills on the alphabet and various technologies. However, it does not explicitly state the difference between spoken language as an innate ability and reading and writing as technologies requiring practice and education. <br />Option 4. This option is the correct one because it captures the essence of the passage, stating that language is an innate ability, while reading and writing are technologies that require deliberate practice and education. It highlights the differences between spoken language and reading and writing, as well as the importance of the alphabet and other technologies in the development of these skills. <br />Hence, [4].<\/p>", "topic": "Summary"}, {"number": 24, "sourceId": "169476453378423", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br><span>The parasite, Toxoplasma gondii, makes its hosts bold—a mechanism that increases its survival. To reproduce sexually, T. gondii must reach the body of a cat, usually when its host is eaten by one. That becomes much more likely if the parasite alters the host’s behaviour, making it foolhardy. In rodents, infection generally correlates with decreased fear of cats and increased exploratory behaviour. Warm-blooded mammals can catch the parasite by eating an infected animal or ingesting forms of T. gondii shed in the faeces of infected cats. After a period of acute infection, semi-dormant cysts form in muscle and brain tissue, and persist for the rest of the host’s life. Up to one-third of humans might be chronically infected. Wolves infected with T. gondii are more likely than uninfected animals to lead a pack, according to an analysis of more than 200 North American wolves. Infected animals are also more likely to leave their home packs and strike out on their own.<\/span>", "options": ["<span><\/span>\t<span>The parasite, T. gondii manipulates hosts’ <\/span><span>behavior<\/span><span>, and makes them bolder and reckless, which assists the parasite in reaching its reproductive goal within a cat's body through infected rodents; it impacts various warm-blooded mammals including wolves and humans.<\/span>", "<span><\/span>\t<span>T. gondii manipulates hosts’ <\/span><span>behavior<\/span><span>, and makes them foolish and adventurous, which assists the parasite in survival and in reaching its reproductive goal within a cat's body; it impacts up to one-third of humans, and wolves which may then lead the pack or abandon it.<\/span>", "<span><\/span>\t<span>T. gondii alters the <\/span><span>behavior<\/span><span> of its hosts, causing them to become bolder and more reckless, which aids its survival in the hosts’ body and achieve its reproductive goal; this affects a range of warm-blooded mammals, including cats, wolves and up to one-third humans.<\/span>", "<span><\/span>\t<span>The parasite, T. gondii alters the <\/span><span>behavior<\/span><span> of its host, inducing recklessness and adventurousness to aid its survival and reproduction; this phenomenon affects around one-third of humans and cats, and infected wolves either lead or abandon their pack.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<p><strong>Points:<\/strong> <br /><span>&middot;<\/span>&nbsp; Toxoplasma gondii manipulates host&nbsp;behavior. <br /><span>&middot;<\/span>&nbsp; Hosts become bolder, increasing parasite's survival. <br /><span>&middot;<\/span>&nbsp; T. gondii reproduces sexually in cats&rsquo; body. <br /><span>&middot;<\/span>&nbsp; Infected rodents show decreased fear of cats. <br /><span>&middot;<\/span> Warm-blooded mammals can catch T. gondii. <br /><span>&middot;<\/span>&nbsp; Semi-dormant cysts form after acute infection. <br /><span>&middot;<\/span>&nbsp; Up to one-third of humans may be infected. <br /><span>&middot;<\/span> Infected wolves more likely to lead packs. <br /><span>&middot;<\/span> Infected animals may leave their home packs.<\/p>\n\n<p>Option 1:&nbsp; This option correctly summarizes that T. gondii manipulates host behavior to aid its survival and reproduction, impacting various warm-blooded mammals, including humans and wolves. It explains how the parasite reaches its reproductive goal through infected rodents. <br />Option 2: Incorrect. It is unclear about how the parasite reaches a cat&rsquo;s body (i.e. through infected rodents) which is clear in option 1.&nbsp; <br />Option 3: Incorrect. Misses the emphasis on rodents and cats <br />Option 4: Incorrect. &ldquo;one-third of humans and cats&rdquo;, and &ldquo;its survival&rdquo; (intended meaning, &lsquo;its own survival&rsquo;)&nbsp; are unclear. <br />Hence, [1].<\/p>", "topic": "Summary"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;
function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
