<script type="application/json" id="test-data">{"testNumber": 14, "simcat": 14, "minutes": 40, "questions": [{"number": 1, "sourceId": "16962747890270", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span>\r<br>\r<br><span>Writing in the early 1990s, as the personal computer revolution first accelerated, Neil Postman argued that our society was sliding into a troubling relationship with technology. We were, he noted, no longer discussing the trade-offs surrounding new technologies, balancing the new efficiencies against the new problems introduced. If it’s high-tech, we began to instead assume, then it’s good. Case closed. <\/span>\r<br>\r<br><span>He called such a culture a <\/span><span>technopoly<\/span><span>, and he didn’t mince words in warning against it. “<\/span><span>Technopoly<\/span><span> eliminates alternatives to itself in precisely the way Aldous Huxley outlined in <\/span><span>Brave New World<\/span><span>,” he argued in his 1993 book on the topic. “It does not make them illegal, [or] immoral. It does not even make them unpopular. It makes them invisible and therefore irrelevant.” <\/span>\r<br>\r<br><span>Postman died in 2003, but fortunately, he has an intellectual heir to continue this argument in the Internet Age: the <\/span><span>hypercitational<\/span><span> social critic Evgeny Morozov. In his 2013 book, <\/span><span>To Save Everything, Click Here<\/span><span>, Morozov attempts to pull back the curtains on our <\/span><span>technopolic<\/span><span> obsession with “the Internet” (a term he purposefully places in scare quotes to emphasize its role as an ideology), saying: “It’s this propensity to view ‘the Internet’ as a source of wisdom and policy advice that transforms it from a fairly uninteresting set of cables and network routers into a seductive and exciting ideology—perhaps today’s uber-ideology.” <\/span>\r<br>\r<br><span>In Morozov’s critique, we’ve made “the Internet” synonymous with the revolutionary future of business and government. To make your company more like “the Internet” is to be with the times, and to ignore these trends is to be the proverbial buggy-whip maker in an automotive age. We no longer see Internet tools as products released by for-profit companies, funded by investors hoping to make a return, and run by twentysomethings who are often making things up as they go along…<\/span>\r<br>\r<br><span>This Internet-centrism is what <\/span><span>technopoly<\/span><span> looks like today. [For example], The <\/span><span>New York Times <\/span><span>maintains a social media desk and pressures its writers toward distracting behavior, because in an Internet-centric <\/span><span>technopoly<\/span><span>, such behavior is not up for discussion. The alternative, to not embrace all things Internet, is, “invisible and therefore irrelevant.” …<\/span>\r<br>\r<br><span>‘Deep work' is at a severe disadvantage in a <\/span><span>technopoly<\/span><span> because it builds on values like quality, craftsmanship, and mastery that are decidedly old-fashioned and non-technological. Even worse, to support deep work often requires the rejection of much of what is new and high-tech. Deep work is exiled in favor of more distracting high-tech behaviors, like the professional use of social media, not because the former is empirically inferior to the latter. Indeed, if we had hard metrics relating the impact of these behaviors on the bottom line, our current <\/span><span>technopoly<\/span><span> would likely crumble. But a ‘metric black hole’ prevents such clarity and allows us instead to elevate all things Internet into Morozov’s feared “uber-ideology.” <\/span>", "passageTitle": "Reading Comprehension Passage", "question": "Which of the following situations does NOT exemplify a ‘technopoly’?", "options": ["Healthcare professionals prioritizing pharmaceuticals and advanced medical technologies.", "Education systems emphasizing standardized testing and technology-driven teaching methods.", "Urban planning focusing on sustainable public transportation and community-driven designs.", "Agriculture adopting genetically modified organisms as a primary solution."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>Option 1. This option implies a technopoly mindset by suggesting an overemphasis on pharmaceuticals and advanced technologies, potentially at the expense of preventive care, lifestyle changes, or alternative treatments.<\/span>\r<br /><span>Option 2.  This option implies a technopoly mindset by prioritizing technology-based teaching and standardized testing, potentially sidelining alternative pedagogies, creativity, and critical thinking in the learning process.<\/span>\r<br /><span>Option 3. This option does NOT exemplify a technopoly because it demonstrates a balanced approach that considers both technological advancements and the needs of communities and the environment. It does not overemphasize a single technology or solution.<\/span>\r<br /><span>Option 4. This option implies a technopoly mindset by suggesting a heavy reliance on genetically modified organisms, potentially without considering potential ecological impacts, or the benefits of alternative, sustainable agricultural practices.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Application Question"}, {"number": 2, "sourceId": "16962747890311", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span>\r<br>\r<br><span>Writing in the early 1990s, as the personal computer revolution first accelerated, Neil Postman argued that our society was sliding into a troubling relationship with technology. We were, he noted, no longer discussing the trade-offs surrounding new technologies, balancing the new efficiencies against the new problems introduced. If it’s high-tech, we began to instead assume, then it’s good. Case closed. <\/span>\r<br>\r<br><span>He called such a culture a <\/span><span>technopoly<\/span><span>, and he didn’t mince words in warning against it. “<\/span><span>Technopoly<\/span><span> eliminates alternatives to itself in precisely the way Aldous Huxley outlined in <\/span><span>Brave New World<\/span><span>,” he argued in his 1993 book on the topic. “It does not make them illegal, [or] immoral. It does not even make them unpopular. It makes them invisible and therefore irrelevant.” <\/span>\r<br>\r<br><span>Postman died in 2003, but fortunately, he has an intellectual heir to continue this argument in the Internet Age: the <\/span><span>hypercitational<\/span><span> social critic Evgeny Morozov. In his 2013 book, <\/span><span>To Save Everything, Click Here<\/span><span>, Morozov attempts to pull back the curtains on our <\/span><span>technopolic<\/span><span> obsession with “the Internet” (a term he purposefully places in scare quotes to emphasize its role as an ideology), saying: “It’s this propensity to view ‘the Internet’ as a source of wisdom and policy advice that transforms it from a fairly uninteresting set of cables and network routers into a seductive and exciting ideology—perhaps today’s uber-ideology.” <\/span>\r<br>\r<br><span>In Morozov’s critique, we’ve made “the Internet” synonymous with the revolutionary future of business and government. To make your company more like “the Internet” is to be with the times, and to ignore these trends is to be the proverbial buggy-whip maker in an automotive age. We no longer see Internet tools as products released by for-profit companies, funded by investors hoping to make a return, and run by twentysomethings who are often making things up as they go along…<\/span>\r<br>\r<br><span>This Internet-centrism is what <\/span><span>technopoly<\/span><span> looks like today. [For example], The <\/span><span>New York Times <\/span><span>maintains a social media desk and pressures its writers toward distracting behavior, because in an Internet-centric <\/span><span>technopoly<\/span><span>, such behavior is not up for discussion. The alternative, to not embrace all things Internet, is, “invisible and therefore irrelevant.” …<\/span>\r<br>\r<br><span>‘Deep work' is at a severe disadvantage in a <\/span><span>technopoly<\/span><span> because it builds on values like quality, craftsmanship, and mastery that are decidedly old-fashioned and non-technological. Even worse, to support deep work often requires the rejection of much of what is new and high-tech. Deep work is exiled in favor of more distracting high-tech behaviors, like the professional use of social media, not because the former is empirically inferior to the latter. Indeed, if we had hard metrics relating the impact of these behaviors on the bottom line, our current <\/span><span>technopoly<\/span><span> would likely crumble. But a ‘metric black hole’ prevents such clarity and allows us instead to elevate all things Internet into Morozov’s feared “uber-ideology.” <\/span>", "passageTitle": "Reading Comprehension Passage", "question": "Which of the following statements most accurately reflects Neil Postman’s warning against ‘technopoly’?", "options": ["Technopoly stifles the development of alternative technologies by providing a singular, universally accepted solution.", "Technopoly suppresses creativity by promoting a culture of conformity and resistance to change.", "Technopoly fosters technological progress at the expense of social connections and personal well-being.", "<span><\/span>\t<span>Technopoly<\/span><span> eliminates alternative approaches to itself without directly prohibiting or condemning them. <\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\tPostman’s warning in Paragraph 2,” “Technopoly eliminates alternatives to itself in precisely the way Aldous Huxley outlined in&nbsp;<span>Brave New World<\/span><span>,” he argued in his 1993 book on the topic. “It does not make them illegal, [or] immoral. It does not even make them unpopular. It makes them invisible and therefore irrelevant.””<\/span>\r<br /><span>Option 1.  This option suggests that technopoly hinders the growth of alternative technologies by offering a single dominant solution. According to Postman, It doesn’t merely hinder, it makes them invisible and irrelevant, it is more than eliminating competition. But the option is partly correct though it doesn’t capture the full intent of the warning.&nbsp;<\/span>\r<br /><span>Option 2. This option implies that technopoly promotes technology at the cost of human relationships and individual welfare. Although technopoly can have these side effects, this option does not fully encompass Postman's warning.<\/span>\r<br /><span>Option3. This option suggests that technopoly discourages innovation and enforces uniformity. While technopoly may contribute to these issues, this option does not capture the central idea of Postman's warning.<\/span>\r<br /><span>Option 4. This option accurately reflects Postman's warning against technopoly. He argued that technopoly undermines alternative approaches and ideas by making them invisible and irrelevant, rather than by directly attacking or banning them. Option 4 best represents Neil Postman's warning against technopoly, as it highlights the way technopoly marginalizes alternatives without directly making them illegal or immoral.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Inference"}, {"number": 3, "sourceId": "16962747890312", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span>\r<br>\r<br><span>Writing in the early 1990s, as the personal computer revolution first accelerated, Neil Postman argued that our society was sliding into a troubling relationship with technology. We were, he noted, no longer discussing the trade-offs surrounding new technologies, balancing the new efficiencies against the new problems introduced. If it’s high-tech, we began to instead assume, then it’s good. Case closed. <\/span>\r<br>\r<br><span>He called such a culture a <\/span><span>technopoly<\/span><span>, and he didn’t mince words in warning against it. “<\/span><span>Technopoly<\/span><span> eliminates alternatives to itself in precisely the way Aldous Huxley outlined in <\/span><span>Brave New World<\/span><span>,” he argued in his 1993 book on the topic. “It does not make them illegal, [or] immoral. It does not even make them unpopular. It makes them invisible and therefore irrelevant.” <\/span>\r<br>\r<br><span>Postman died in 2003, but fortunately, he has an intellectual heir to continue this argument in the Internet Age: the <\/span><span>hypercitational<\/span><span> social critic Evgeny Morozov. In his 2013 book, <\/span><span>To Save Everything, Click Here<\/span><span>, Morozov attempts to pull back the curtains on our <\/span><span>technopolic<\/span><span> obsession with “the Internet” (a term he purposefully places in scare quotes to emphasize its role as an ideology), saying: “It’s this propensity to view ‘the Internet’ as a source of wisdom and policy advice that transforms it from a fairly uninteresting set of cables and network routers into a seductive and exciting ideology—perhaps today’s uber-ideology.” <\/span>\r<br>\r<br><span>In Morozov’s critique, we’ve made “the Internet” synonymous with the revolutionary future of business and government. To make your company more like “the Internet” is to be with the times, and to ignore these trends is to be the proverbial buggy-whip maker in an automotive age. We no longer see Internet tools as products released by for-profit companies, funded by investors hoping to make a return, and run by twentysomethings who are often making things up as they go along…<\/span>\r<br>\r<br><span>This Internet-centrism is what <\/span><span>technopoly<\/span><span> looks like today. [For example], The <\/span><span>New York Times <\/span><span>maintains a social media desk and pressures its writers toward distracting behavior, because in an Internet-centric <\/span><span>technopoly<\/span><span>, such behavior is not up for discussion. The alternative, to not embrace all things Internet, is, “invisible and therefore irrelevant.” …<\/span>\r<br>\r<br><span>‘Deep work' is at a severe disadvantage in a <\/span><span>technopoly<\/span><span> because it builds on values like quality, craftsmanship, and mastery that are decidedly old-fashioned and non-technological. Even worse, to support deep work often requires the rejection of much of what is new and high-tech. Deep work is exiled in favor of more distracting high-tech behaviors, like the professional use of social media, not because the former is empirically inferior to the latter. Indeed, if we had hard metrics relating the impact of these behaviors on the bottom line, our current <\/span><span>technopoly<\/span><span> would likely crumble. But a ‘metric black hole’ prevents such clarity and allows us instead to elevate all things Internet into Morozov’s feared “uber-ideology.” <\/span>", "passageTitle": "Reading Comprehension Passage", "question": "Morozov’s criticism of the internet includes all of the following EXCEPT:", "options": ["Being the proverbial buggy-whip maker in an automotive age.", "Viewing the internet as a one-size-fits-all solution to various problems.", "Advocating it as the future of business, government, and other sectors.", "Treating the internet as an ideology and source of wisdom."], "answer": 0, "answerLabel": "A", "solution": "<\/span>\tOption 1 is not a critique presented in the passage. The comparison “buggy-whip maker in an automotive age” refers to those who ignore the ‘trends’ (the internet).  Therefore, option 1 is the correct answer as it is not a critique of the internet presented by Morozov in the passage.\r<br /><span>Option 2 is a valid critique of Morozov, as he argues against viewing the internet as a one-size-fits-all solution to various problems. He argues that this view transforms the internet into an ideology, leading to an \"internet-centric technopoly\" that eliminates alternatives and values distraction over deep work.<\/span>\r<br /><span>Option 3 is also a valid critique of Morozov, as he argues that the internet is often advocated as the future of business, government, and other sectors. This view, he argues, is an example of the \"internet-centric technopoly\" that leads to a lack of critical discussion about the potential negative consequences of internet technologies.<\/span>\r<br /><span>Option 4 is also a valid critique of Morozov, as he argues that the internet is often treated as an ideology and source of wisdom. This view, he argues, leads to a lack of critical thinking about the potential negative consequences of internet technologies and a failure to consider alternative solutions<\/span><span>.<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Specific Detail Question"}, {"number": 4, "sourceId": "16962747890313", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span>\r<br>\r<br><span>Writing in the early 1990s, as the personal computer revolution first accelerated, Neil Postman argued that our society was sliding into a troubling relationship with technology. We were, he noted, no longer discussing the trade-offs surrounding new technologies, balancing the new efficiencies against the new problems introduced. If it’s high-tech, we began to instead assume, then it’s good. Case closed. <\/span>\r<br>\r<br><span>He called such a culture a <\/span><span>technopoly<\/span><span>, and he didn’t mince words in warning against it. “<\/span><span>Technopoly<\/span><span> eliminates alternatives to itself in precisely the way Aldous Huxley outlined in <\/span><span>Brave New World<\/span><span>,” he argued in his 1993 book on the topic. “It does not make them illegal, [or] immoral. It does not even make them unpopular. It makes them invisible and therefore irrelevant.” <\/span>\r<br>\r<br><span>Postman died in 2003, but fortunately, he has an intellectual heir to continue this argument in the Internet Age: the <\/span><span>hypercitational<\/span><span> social critic Evgeny Morozov. In his 2013 book, <\/span><span>To Save Everything, Click Here<\/span><span>, Morozov attempts to pull back the curtains on our <\/span><span>technopolic<\/span><span> obsession with “the Internet” (a term he purposefully places in scare quotes to emphasize its role as an ideology), saying: “It’s this propensity to view ‘the Internet’ as a source of wisdom and policy advice that transforms it from a fairly uninteresting set of cables and network routers into a seductive and exciting ideology—perhaps today’s uber-ideology.” <\/span>\r<br>\r<br><span>In Morozov’s critique, we’ve made “the Internet” synonymous with the revolutionary future of business and government. To make your company more like “the Internet” is to be with the times, and to ignore these trends is to be the proverbial buggy-whip maker in an automotive age. We no longer see Internet tools as products released by for-profit companies, funded by investors hoping to make a return, and run by twentysomethings who are often making things up as they go along…<\/span>\r<br>\r<br><span>This Internet-centrism is what <\/span><span>technopoly<\/span><span> looks like today. [For example], The <\/span><span>New York Times <\/span><span>maintains a social media desk and pressures its writers toward distracting behavior, because in an Internet-centric <\/span><span>technopoly<\/span><span>, such behavior is not up for discussion. The alternative, to not embrace all things Internet, is, “invisible and therefore irrelevant.” …<\/span>\r<br>\r<br><span>‘Deep work' is at a severe disadvantage in a <\/span><span>technopoly<\/span><span> because it builds on values like quality, craftsmanship, and mastery that are decidedly old-fashioned and non-technological. Even worse, to support deep work often requires the rejection of much of what is new and high-tech. Deep work is exiled in favor of more distracting high-tech behaviors, like the professional use of social media, not because the former is empirically inferior to the latter. Indeed, if we had hard metrics relating the impact of these behaviors on the bottom line, our current <\/span><span>technopoly<\/span><span> would likely crumble. But a ‘metric black hole’ prevents such clarity and allows us instead to elevate all things Internet into Morozov’s feared “uber-ideology.” <\/span>", "passageTitle": "Reading Comprehension Passage", "question": "All of the following statements, if false, could be seen as being in accordance with the passage, EXCEPT:", "options": ["High-tech innovations should always be welcomed without question as they invariably lead to progress and improved efficiency.", "The internet has become an \"uber-ideology\" that clouds our judgment when it comes to assessing the true impact of technology on society.", "Deep work, by its very nature, must completely reject any technological advancements in order to preserve quality, craftsmanship, and mastery.", "Embracing all things related to the internet is essential for businesses to survive and thrive in the modern world, regardless of any potential downsides."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\tAll of the following statements, if false, could be seen as being in accordance with the passage, EXCEPT: = Which of the following statements Is TRUE as per the passage?\r<br /><span>Only Statement 2 is true as per the passage.&nbsp;<\/span>\r<br />Option 1. This statement goes against the passage, which emphasizes the need for a critical and balanced approach to new technologies, rather than blindly accepting them.\r<br /><span>Option 2. This statement aligns with the passage, as it reflects Morozov's critique that the internet has become an ideology that can lead to an uncritical embrace of technology.<\/span>\r<br /><span>Option 3. This statement does not align with the passage, which argues that deep work is at a disadvantage in a technopoly but does not suggest that it must completely reject all technological advancements.<\/span>\r<br /><span>Option 4. This statement contradicts the passage, which highlights the dangers of uncritically embracing all things internet-related and calls for a more balanced and critical approach.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Inference"}, {"number": 5, "sourceId": "16962747890314", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>For decades, paleontologists’ only fossil link between birds and dinosaurs was archaeopteryx, a hybrid creature with feathered wings but with the teeth and long bony tail of a dinosaur. These animals appeared to have acquired their birdlike features — feathers, wings and flight — in just 10 million years, a mere flash in evolutionary time. “Archaeopteryx seemed to emerge fully fledged with the characteristics of modern birds,” said Michael Benton, a paleontologist at the University of Bristol in England.<\/span><br><br><span>To explain this miraculous metamorphosis, scientists evoked a theory often referred to as “hopeful monsters.” According to this idea, major evolutionary leaps require large-scale genetic changes that are qualitatively different from the routine modifications within a species. Only such substantial alterations on a short timescale, the story went, could account for the sudden transformation from 300-pound theropods - a group of two-legged dinosaurs, whose members include the towering Tyrannosaurus rex and the smaller velociraptors - to the sparrow-size prehistoric bird <\/span><span>Iberomesornis<\/span><span>.<\/span><br><br><span>But it has become increasingly clear that the story of how dinosaurs begat birds is much more subtle. Discoveries have shown that bird-specific features like feathers began to emerge long before the evolution of birds, indicating that birds simply adapted a number of pre-existing features to a new use. And recent research suggests that a few simple changes — among them the adoption of a more babylike skull shape into <\/span>adulthood — likely played essential roles in the final push to bird-hood. Not only are birds much smaller than their dinosaur ancestors, <span>they closely<\/span><span> resemble dinosaur embryos. Adaptations such as these may have paved the way for modern birds’ distinguishing features, namely their ability to fly and their remarkably agile beaks. The work demonstrates how huge evolutionary changes can result from a series of small evolutionary steps.<\/span><br><br><span>In the 1990s, an influx of new dinosaur fossils from China revealed a feathery surprise. Though many of these fossils lacked wings, they had a panoply of plumage, from fuzzy bristles to fully articulated quills. The discovery of these new intermediary species, which filled in the spotty fossil record, triggered a change in how <\/span><span>palaeontologists<\/span><span> conceived of the dinosaur-to-bird transition. Feathers, once thought unique to birds, must have evolved in dinosaurs long before birds developed.<\/span><br><br><span>In research published in <\/span><span>Current Biology<\/span><span>, Stephen <\/span><span>Brusatte<\/span><span>, a paleontologist at the University of <\/span><span>Edinburgh<\/span><span> and collaborators examined fossils from coelurosaurs, the subgroup of theropods that produced archaeopteryx and modern birds. They […] found that there was no great jump that distinguished birds from other coelurosaurs. “A bird didn’t just evolve from a T. rex overnight, but rather the classic features of birds evolved one by one; first bipedal locomotion, then feathers, then a wishbone, then more complex feathers that look like quill-pen feathers, then wings,” <\/span><span>Brusatte<\/span><span> said.<\/span><br><br><span>Brusatte’s<\/span><span> study of coelurosaurs found that once archaeopteryx and other ancient birds emerged, they began evolving much more rapidly than other dinosaurs. The hopeful monster theory had it almost exactly backwards: A burst of evolution didn’t produce birds. Rather, birds produced a burst of evolution. “It seems like birds had happened upon a very successful new body plan and new type of ecology — flying at small size — and this led to an evolutionary explosion,” <\/span><span>Brusatte<\/span><span> said.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "According to the passage, which one of the following sets of terms/phrases best indicates the dinosaur-to-bird transition?", "options": ["Archaeopteryx – Hopeful Monsters – Iberomesornis - Bipedal Locomotion, Wings – Evolutionary Explosion.", "Feathery Dinosaurs – Hopeful Monsters –Bipedal Locomotion, Wings – Archaeopteryx – Evolutionary Explosion.", "Feathery Dinosaurs – Coelurosaurs – Archaeopteryx – Bipedal Locomotion, Wings – Evolutionary Explosion.", "Archaeopteryx – Feathery dinosaurs – Coelurosaurs - Iberomesornis - Bipedal Locomotion, Wings."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tFeathery Dinosaurs: The discovery of feathery dinosaur fossils in China indicated that feathers evolved in dinosaurs long before the emergence of birds.\r<br /><span>Coelurosaurs: This subgroup of theropods led to the evolution of Archaeopteryx and modern birds. The classic features of birds evolved one by one within this group.<\/span>\r<br /><span>Archaeopteryx: The initial link between birds and dinosaurs, which was considered as a hybrid creature with bird and dinosaur features.<\/span>\r<br /><span>Bipedal Locomotion, Wings: These are some of the features that evolved gradually in archaeopteryx/ coelurosaurs, eventually leading to the development of bird characteristics.<\/span>\r<br /><span>Evolutionary Explosion: After the emergence of ancient birds like Archaeopteryx, they evolved rapidly, leading to a burst of evolution and the development of a successful new body plan and ecology.<\/span>\r<br /><span>In the other options, one or another stage is mixed up.&nbsp;<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Specific Detail Question"}, {"number": 6, "sourceId": "16962747890325", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>For decades, paleontologists’ only fossil link between birds and dinosaurs was archaeopteryx, a hybrid creature with feathered wings but with the teeth and long bony tail of a dinosaur. These animals appeared to have acquired their birdlike features — feathers, wings and flight — in just 10 million years, a mere flash in evolutionary time. “Archaeopteryx seemed to emerge fully fledged with the characteristics of modern birds,” said Michael Benton, a paleontologist at the University of Bristol in England.<\/span><br><br><span>To explain this miraculous metamorphosis, scientists evoked a theory often referred to as “hopeful monsters.” According to this idea, major evolutionary leaps require large-scale genetic changes that are qualitatively different from the routine modifications within a species. Only such substantial alterations on a short timescale, the story went, could account for the sudden transformation from 300-pound theropods - a group of two-legged dinosaurs, whose members include the towering Tyrannosaurus rex and the smaller velociraptors - to the sparrow-size prehistoric bird <\/span><span>Iberomesornis<\/span><span>.<\/span><br><br><span>But it has become increasingly clear that the story of how dinosaurs begat birds is much more subtle. Discoveries have shown that bird-specific features like feathers began to emerge long before the evolution of birds, indicating that birds simply adapted a number of pre-existing features to a new use. And recent research suggests that a few simple changes — among them the adoption of a more babylike skull shape into <\/span>adulthood — likely played essential roles in the final push to bird-hood. Not only are birds much smaller than their dinosaur ancestors, <span>they closely<\/span><span> resemble dinosaur embryos. Adaptations such as these may have paved the way for modern birds’ distinguishing features, namely their ability to fly and their remarkably agile beaks. The work demonstrates how huge evolutionary changes can result from a series of small evolutionary steps.<\/span><br><br><span>In the 1990s, an influx of new dinosaur fossils from China revealed a feathery surprise. Though many of these fossils lacked wings, they had a panoply of plumage, from fuzzy bristles to fully articulated quills. The discovery of these new intermediary species, which filled in the spotty fossil record, triggered a change in how <\/span><span>palaeontologists<\/span><span> conceived of the dinosaur-to-bird transition. Feathers, once thought unique to birds, must have evolved in dinosaurs long before birds developed.<\/span><br><br><span>In research published in <\/span><span>Current Biology<\/span><span>, Stephen <\/span><span>Brusatte<\/span><span>, a paleontologist at the University of <\/span><span>Edinburgh<\/span><span> and collaborators examined fossils from coelurosaurs, the subgroup of theropods that produced archaeopteryx and modern birds. They […] found that there was no great jump that distinguished birds from other coelurosaurs. “A bird didn’t just evolve from a T. rex overnight, but rather the classic features of birds evolved one by one; first bipedal locomotion, then feathers, then a wishbone, then more complex feathers that look like quill-pen feathers, then wings,” <\/span><span>Brusatte<\/span><span> said.<\/span><br><br><span>Brusatte’s<\/span><span> study of coelurosaurs found that once archaeopteryx and other ancient birds emerged, they began evolving much more rapidly than other dinosaurs. The hopeful monster theory had it almost exactly backwards: A burst of evolution didn’t produce birds. Rather, birds produced a burst of evolution. “It seems like birds had happened upon a very successful new body plan and new type of ecology — flying at small size — and this led to an evolutionary explosion,” <\/span><span>Brusatte<\/span><span> said.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "According to the passage, which of the following most seriously challenges the ‘hopeful monster’ theory of paleontologists?", "options": ["The observation that birds adopted a babylike skull into adulthood.", "The idea that birds closely resemble dinosaur embryos.", "The discovery of feathery dinosaur fossils in China.", "The belief that birds evolved from 300-pound theropods."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tOption 1: This option is incorrect because, while the passage mentions the adoption of a babylike skull shape as a factor in bird evolution, it does not present this as a factor that seriously challenged the hopeful monster theory.\r<br /><span>Option 2. This option is incorrect because, although the passage discusses the resemblance between birds and dinosaur embryos, it does not directly challenge the hopeful monster theory.<\/span>\r<br /><span>Option 3: This option is correct because the discovery of feathery dinosaur fossils revealed that bird-like features, such as feathers, evolved long before birds themselves, indicating a more gradual evolutionary process rather than the sudden large-scale genetic changes proposed by the hopeful monster theory. (Paragraph 4)<\/span>\r<br /><span>Option 4: This option is incorrect because the passage does not mention this belief as a factor that challenged the hopeful monster theory. Instead, it refers to the transformation from large theropods to small prehistoric birds as part of the theory itself.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Inference"}, {"number": 7, "sourceId": "16962747890326", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>For decades, paleontologists’ only fossil link between birds and dinosaurs was archaeopteryx, a hybrid creature with feathered wings but with the teeth and long bony tail of a dinosaur. These animals appeared to have acquired their birdlike features — feathers, wings and flight — in just 10 million years, a mere flash in evolutionary time. “Archaeopteryx seemed to emerge fully fledged with the characteristics of modern birds,” said Michael Benton, a paleontologist at the University of Bristol in England.<\/span><br><br><span>To explain this miraculous metamorphosis, scientists evoked a theory often referred to as “hopeful monsters.” According to this idea, major evolutionary leaps require large-scale genetic changes that are qualitatively different from the routine modifications within a species. Only such substantial alterations on a short timescale, the story went, could account for the sudden transformation from 300-pound theropods - a group of two-legged dinosaurs, whose members include the towering Tyrannosaurus rex and the smaller velociraptors - to the sparrow-size prehistoric bird <\/span><span>Iberomesornis<\/span><span>.<\/span><br><br><span>But it has become increasingly clear that the story of how dinosaurs begat birds is much more subtle. Discoveries have shown that bird-specific features like feathers began to emerge long before the evolution of birds, indicating that birds simply adapted a number of pre-existing features to a new use. And recent research suggests that a few simple changes — among them the adoption of a more babylike skull shape into <\/span>adulthood — likely played essential roles in the final push to bird-hood. Not only are birds much smaller than their dinosaur ancestors, <span>they closely<\/span><span> resemble dinosaur embryos. Adaptations such as these may have paved the way for modern birds’ distinguishing features, namely their ability to fly and their remarkably agile beaks. The work demonstrates how huge evolutionary changes can result from a series of small evolutionary steps.<\/span><br><br><span>In the 1990s, an influx of new dinosaur fossils from China revealed a feathery surprise. Though many of these fossils lacked wings, they had a panoply of plumage, from fuzzy bristles to fully articulated quills. The discovery of these new intermediary species, which filled in the spotty fossil record, triggered a change in how <\/span><span>palaeontologists<\/span><span> conceived of the dinosaur-to-bird transition. Feathers, once thought unique to birds, must have evolved in dinosaurs long before birds developed.<\/span><br><br><span>In research published in <\/span><span>Current Biology<\/span><span>, Stephen <\/span><span>Brusatte<\/span><span>, a paleontologist at the University of <\/span><span>Edinburgh<\/span><span> and collaborators examined fossils from coelurosaurs, the subgroup of theropods that produced archaeopteryx and modern birds. They […] found that there was no great jump that distinguished birds from other coelurosaurs. “A bird didn’t just evolve from a T. rex overnight, but rather the classic features of birds evolved one by one; first bipedal locomotion, then feathers, then a wishbone, then more complex feathers that look like quill-pen feathers, then wings,” <\/span><span>Brusatte<\/span><span> said.<\/span><br><br><span>Brusatte’s<\/span><span> study of coelurosaurs found that once archaeopteryx and other ancient birds emerged, they began evolving much more rapidly than other dinosaurs. The hopeful monster theory had it almost exactly backwards: A burst of evolution didn’t produce birds. Rather, birds produced a burst of evolution. “It seems like birds had happened upon a very successful new body plan and new type of ecology — flying at small size — and this led to an evolutionary explosion,” <\/span><span>Brusatte<\/span><span> said.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "Based on the passage, which one of the following statements is NOT true about the evolution of birds?", "options": ["Feathers and other bird-like features had evolved in dinosaurs much before the emergence of birds.", "The discovery of feathery dinosaur fossils in China supported the idea of a gradual evolution of bird features.", "The hopeful monster theory suggests that the adoption of a babylike skull shape into adulthood was crucial for bird evolution.", "The evolution of bird features, such as bipedal locomotion and wings, occurred gradually within the coelurosaur subgroup."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tOption 1: This statement is true, as the passage mentions that the discovery of feathery dinosaur fossils in China indicated that feathers evolved in dinosaurs long before birds developed.\r<br /><span>Option 2: This statement is true because the feathery dinosaur fossils provided evidence for a more gradual evolutionary process, rather than the sudden large-scale genetic changes proposed by the hopeful monster theory.<\/span>\r<br /><span>Option 3: This statement is not true because the hopeful monster theory actually proposes that major evolutionary leaps require large-scale genetic changes. The passage discusses the adoption of a babylike skull shape into adulthood as a factor in bird evolution, but it does not attribute this idea to the hopeful monster theory.<\/span>\r<br /><span>Option 4: This statement is true, as the passage explains that bird features evolved gradually within the coelurosaur subgroup, leading to the development of bird characteristics.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Specific Detail Question"}, {"number": 8, "sourceId": "16962747890327", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>For decades, paleontologists’ only fossil link between birds and dinosaurs was archaeopteryx, a hybrid creature with feathered wings but with the teeth and long bony tail of a dinosaur. These animals appeared to have acquired their birdlike features — feathers, wings and flight — in just 10 million years, a mere flash in evolutionary time. “Archaeopteryx seemed to emerge fully fledged with the characteristics of modern birds,” said Michael Benton, a paleontologist at the University of Bristol in England.<\/span><br><br><span>To explain this miraculous metamorphosis, scientists evoked a theory often referred to as “hopeful monsters.” According to this idea, major evolutionary leaps require large-scale genetic changes that are qualitatively different from the routine modifications within a species. Only such substantial alterations on a short timescale, the story went, could account for the sudden transformation from 300-pound theropods - a group of two-legged dinosaurs, whose members include the towering Tyrannosaurus rex and the smaller velociraptors - to the sparrow-size prehistoric bird <\/span><span>Iberomesornis<\/span><span>.<\/span><br><br><span>But it has become increasingly clear that the story of how dinosaurs begat birds is much more subtle. Discoveries have shown that bird-specific features like feathers began to emerge long before the evolution of birds, indicating that birds simply adapted a number of pre-existing features to a new use. And recent research suggests that a few simple changes — among them the adoption of a more babylike skull shape into <\/span>adulthood — likely played essential roles in the final push to bird-hood. Not only are birds much smaller than their dinosaur ancestors, <span>they closely<\/span><span> resemble dinosaur embryos. Adaptations such as these may have paved the way for modern birds’ distinguishing features, namely their ability to fly and their remarkably agile beaks. The work demonstrates how huge evolutionary changes can result from a series of small evolutionary steps.<\/span><br><br><span>In the 1990s, an influx of new dinosaur fossils from China revealed a feathery surprise. Though many of these fossils lacked wings, they had a panoply of plumage, from fuzzy bristles to fully articulated quills. The discovery of these new intermediary species, which filled in the spotty fossil record, triggered a change in how <\/span><span>palaeontologists<\/span><span> conceived of the dinosaur-to-bird transition. Feathers, once thought unique to birds, must have evolved in dinosaurs long before birds developed.<\/span><br><br><span>In research published in <\/span><span>Current Biology<\/span><span>, Stephen <\/span><span>Brusatte<\/span><span>, a paleontologist at the University of <\/span><span>Edinburgh<\/span><span> and collaborators examined fossils from coelurosaurs, the subgroup of theropods that produced archaeopteryx and modern birds. They […] found that there was no great jump that distinguished birds from other coelurosaurs. “A bird didn’t just evolve from a T. rex overnight, but rather the classic features of birds evolved one by one; first bipedal locomotion, then feathers, then a wishbone, then more complex feathers that look like quill-pen feathers, then wings,” <\/span><span>Brusatte<\/span><span> said.<\/span><br><br><span>Brusatte’s<\/span><span> study of coelurosaurs found that once archaeopteryx and other ancient birds emerged, they began evolving much more rapidly than other dinosaurs. The hopeful monster theory had it almost exactly backwards: A burst of evolution didn’t produce birds. Rather, birds produced a burst of evolution. “It seems like birds had happened upon a very successful new body plan and new type of ecology — flying at small size — and this led to an evolutionary explosion,” <\/span><span>Brusatte<\/span><span> said.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "“The hopeful monster theory had it almost exactly backwards: A burst of evolution didn’t produce birds. Rather, birds produced a burst of evolution.” In the context of the passage, what is the author trying to communicate in this quoted extract?", "options": ["The hopeful monster theory correctly describes the sudden appearance of bird features in the fossil record.", "Birds did not emerge rapidly on a large scale as suggested by the hopeful monster theory, but evolved at the same pace as other species.", "The evolution of birds was a slow, gradual process, which contrasts with the hopeful monster theory of rapid and large-scale genetic change.", "The emergence of birds led to a rapid increase in their evolution, contrary to the hopeful monster theory."], "answer": 3, "answerLabel": "D", "solution": "<\/span>\tOption 1. This option is incorrect, as the author states that the hopeful monster theory was almost exactly backwards, suggesting it did not correctly describe the bird evolution process.\r<br />Option 2. This option is mixed up. Hopeful monster theory is that large-scale genetic change produced birds. The author states that large-scale population of birds happened quickly only after a slow and gradual evolution. ‘emerged rapidly on a large scale’ is a misrepresentation.&nbsp;\r<br /><span>Option 3. This option is partially correct but does not capture the full meaning of the quoted text. The author acknowledges the gradual evolution of bird features but focuses on the idea that birds themselves produced a burst of evolution after their emergence.<\/span>\r<br /><span>Option 4. This option is correct because it highlights the author's main point: birds produced a burst of evolution, and this idea contradicts the hopeful monster theory, which suggests that a sudden large-scale genetic change produced birds.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Inference"}, {"number": 9, "sourceId": "16962747890328", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>As their recurring success in nature’s designs shows, networks are excellent structures for reliably distributing resources throughout a whole system. In order to better understand the kind of networks that can make us thrive, network theorists studied the branching patterns and resource flows that are found in nature’s ecosystems.<\/span><br><br><span>Nature’s networks are structured by branching fractals, ranging from a few larger ones to many medium-sized ones and then myriad smaller ones, just like blood vessels in a body, or veins in a leaf… Efficiency occurs when a system streamlines and simplifies its resource flow to achieve its aims, say by <\/span><span>channelling<\/span><span> resources directly between the larger nodes. Resilience, however, depends upon diversity and redundancy in the network, which means that there are ample alternative connections and options in times of shock or change. Too much efficiency makes a system vulnerable, while too much resilience makes it stagnant: vitality and robustness lie in a balance between the two.<\/span><br><br><span>What design principles can nature’s thriving networks teach us for creating thriving economies? In two words: diversity and distribution. If large-scale actors dominate an economic network by squeezing out the number and diversity of small and medium players, the result will be a highly unequal and brittle economy. This certainly sounds familiar, given the current scale of corporate concentration across many industrial sectors, from agribusiness, pharmaceuticals and the media to the banks that are deemed too big to fail.<\/span><br><br><span>The fragility generated by such concentration is reviving appreciation for the small, diverse enterprises that make up the bulk of an economy’s network. The question, then, is how to design economic networks so that they distribute value in a far more equitable way.<\/span><br><br><span>Thanks to international public outrage over widening inequalities, ambition for greater redistribution has returned in the twenty-first century. Many mainstream economists now advocate raising top marginal income tax rates along with higher taxes on interest, rent and dividends. Social activists worldwide have put <\/span>companies and governments under pressure to pay living wages. Others call for a maximum wage too, set within each company at around 20 to 50 times its lowest earner’s wage, in order to curb excessive <span>executive<\/span><span> pay and ensure that corporate profits are more equitably shared amongst the workforce. Some governments now offer guaranteed access to work, such as India’s nationwide scheme that promises 100 days of minimum-wage employment each year to every rural household that needs it. And citizens – from Australia and the USA to South Africa and Slovenia – are campaigning for a national basic income paid unconditionally to all, to ensure that, job or no job, every person has sufficient income to meet life’s essentials.<\/span><br><br><span>Redistributive policies can significantly impact <\/span><span>beneficiaries, but<\/span><span> may not address the root of economic inequalities as they target income, not wealth. To truly tackle inequality, it's essential to democratize wealth ownership, as political-economic systems depend on property control. Thus, economists should also focus on redistributing wealth sources.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "Which one of the following sets of words/phrases best encapsulates the key elements of efficiency and resilience in nature's networks?", "options": ["Efficiency: Maximizing alternative connections; Resilience: Minimizing resource flow.", "Efficiency: Centralizing resource distribution; Resilience: Reducing variety and large nodes.", "Efficiency: Streamlining resource distribution; Resilience: Variety and backup options.", "Efficiency: Enhancing variety and backup options; Resilience: Focusing on large nodes."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tOption 1. This option is incorrect because efficiency is not about maximizing diversity; rather, it is about streamlining resource flow. Additionally, resilience does not involve minimizing resource flow but instead focuses on diversity and redundancy.\r<br /><span>Option 2. This option is incorrect because efficiency is not about centralizing resource flow; it aims to streamline and simplify the flow. Resilience does not seek to eliminate redundancy; in fact, redundancy is an essential component of a resilient network.<\/span>\r<br /><span>Option 3. Correct. Efficiency is achieved by streamlining and simplifying resource flow to attain the network's goals, often by channelling resources directly between larger nodes. Resilience relies on diversity and redundancy within the network, ensuring multiple alternative connections and options are available during times of shock or change. This balance between efficiency and resilience contributes to a network's vitality and robustness.<\/span>\r<br /><span>Option 4. This option is incorrect because efficiency is not about enhancing diversity; it is focused on streamlining resource flow. Resilience is not about focusing on large nodes only; it relies on a diverse and redundant network structure to ensure adaptability in times of shock or change.<\/span>\r<br /><span>Hence, [3].<\/span>\r<br /><span><b>&nbsp;<\/b><\/span>", "topic": "Inference"}, {"number": 10, "sourceId": "16962747890349", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>As their recurring success in nature’s designs shows, networks are excellent structures for reliably distributing resources throughout a whole system. In order to better understand the kind of networks that can make us thrive, network theorists studied the branching patterns and resource flows that are found in nature’s ecosystems.<\/span><br><br><span>Nature’s networks are structured by branching fractals, ranging from a few larger ones to many medium-sized ones and then myriad smaller ones, just like blood vessels in a body, or veins in a leaf… Efficiency occurs when a system streamlines and simplifies its resource flow to achieve its aims, say by <\/span><span>channelling<\/span><span> resources directly between the larger nodes. Resilience, however, depends upon diversity and redundancy in the network, which means that there are ample alternative connections and options in times of shock or change. Too much efficiency makes a system vulnerable, while too much resilience makes it stagnant: vitality and robustness lie in a balance between the two.<\/span><br><br><span>What design principles can nature’s thriving networks teach us for creating thriving economies? In two words: diversity and distribution. If large-scale actors dominate an economic network by squeezing out the number and diversity of small and medium players, the result will be a highly unequal and brittle economy. This certainly sounds familiar, given the current scale of corporate concentration across many industrial sectors, from agribusiness, pharmaceuticals and the media to the banks that are deemed too big to fail.<\/span><br><br><span>The fragility generated by such concentration is reviving appreciation for the small, diverse enterprises that make up the bulk of an economy’s network. The question, then, is how to design economic networks so that they distribute value in a far more equitable way.<\/span><br><br><span>Thanks to international public outrage over widening inequalities, ambition for greater redistribution has returned in the twenty-first century. Many mainstream economists now advocate raising top marginal income tax rates along with higher taxes on interest, rent and dividends. Social activists worldwide have put <\/span>companies and governments under pressure to pay living wages. Others call for a maximum wage too, set within each company at around 20 to 50 times its lowest earner’s wage, in order to curb excessive <span>executive<\/span><span> pay and ensure that corporate profits are more equitably shared amongst the workforce. Some governments now offer guaranteed access to work, such as India’s nationwide scheme that promises 100 days of minimum-wage employment each year to every rural household that needs it. And citizens – from Australia and the USA to South Africa and Slovenia – are campaigning for a national basic income paid unconditionally to all, to ensure that, job or no job, every person has sufficient income to meet life’s essentials.<\/span><br><br><span>Redistributive policies can significantly impact <\/span><span>beneficiaries, but<\/span><span> may not address the root of economic inequalities as they target income, not wealth. To truly tackle inequality, it's essential to democratize wealth ownership, as political-economic systems depend on property control. Thus, economists should also focus on redistributing wealth sources.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "\"Too much efficiency makes a system vulnerable, while too much resilience makes it stagnant”<br>In the context of the passage, which one of the following is not a possible implication of the quoted statement?", "options": ["A system designed exclusively for efficiency can easily adapt to changes and disruptions.", "A system with an overemphasis on resilience can become slow and unresponsive.", "Too much resilience makes the system stagnant by causing inefficiency and sluggishness in responding to new situations.", "A highly efficient system might lack the diversity and redundancy necessary to cope with unexpected disruptions."], "answer": 0, "answerLabel": "A", "solution": "<\/span>\tOption 1. This option contradicts the quoted statement. According to the passage, too much efficiency makes a system vulnerable, not easily adaptable to changes and disruptions. ‘Exclusive efficiency’ results in a lack of diversity and redundancy in the network, making it less adaptable in the face of unexpected events.\r<br /><span>Option 2. This option aligns with the quoted statement, as too much resilience can indeed make a system stagnant. Excessive focus on diversity and redundancy might hinder the system's ability to efficiently allocate resources and quickly respond to new opportunities or challenges, resulting in a slow and unresponsive system.<\/span>\r<br /><span>Option 3. This option is consistent with the quoted statement, as it highlights the negative consequence of having too much resilience. An overly resilient system may become inefficient and sluggish, as it focuses on maintaining a high level of diversity and redundancy at the expense of optimal resource distribution and responsiveness.<\/span>\r<br /><span>Option 4. This option also aligns with the quoted statement. A highly efficient system might be vulnerable due to a lack of diversity and redundancy, making it less capable of handling unexpected disruptions. The focus on streamlined resource flows may inadvertently sacrifice the network's ability to adapt and recover from shocks or changes.<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Inference"}, {"number": 11, "sourceId": "169627478903410", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>As their recurring success in nature’s designs shows, networks are excellent structures for reliably distributing resources throughout a whole system. In order to better understand the kind of networks that can ma ivists worldwide have put <\/span>companies and governments under pressure to pay living wages. Others call for a maximum wage too, set within each company at around 20 to 50 times its lowest earner’s wage, in order to curb excessive <span>executive<\/span><span> pay and ensure that corporate profits are more equitably shared amongst the workforce. Some governments now offer guaranteed access to work, such as India’s nationwide scheme that promises 100 days of minimum-wage employment each year to every rural household that needs it. And citizens – from Australia and the USA to South Africa and Slovenia – are campaigning for a national basic income paid unconditionally to all, to ensure that, job or no job, every person has sufficient income to meet life’s essentials.<\/span><br><br><span>Redistributive policies can significantly impact <\/span><span>beneficiaries, but<\/span><span> may not address the root of economic inequalities as they target income, not wealth. To truly tackle inequality, it's essential to democratize wealth ownership, as political-economic systems depend on property control. Thus, economists should also focus on redistributing wealth sources.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "Based on the passage, how would an economic network that follows the principles of nature's networks most likely be designed?", "options": ["Overemphasizing the role of small and medium players with reasonable restrictions on large-scale players in industrial sectors and banks.", "Dominated by large-scale actors with centralized resources and a limited number of small and\nmedium players.", "Focused exclusively on core sectors but promoting small and medium players that serve large-scale\ncorporations.", "Characterized by equitable resource distribution among large corporations and small and medium\nplayers in the economy."], "answer": 3, "answerLabel": "D", "solution": "Option 1. This option partially reflects the principles of nature's networks but the emphasis on  “overemphasizing”  the role of small and medium players makes the option incorrect. The passage emphasizes the importance of finding a balance between efficiency and resilience, which includes considering the roles of both large and small actors in the economy.\r<br /><span>Option 2. This option contradicts the passage, as it suggests a centralized, unequal distribution of resources and limited diversity. Nature's networks emphasize diversity and distribution, not domination by large-scale actors.<\/span>\r<br /><span>Option 3. This option is not aligned with the passage. While it acknowledges the importance of small and medium players, it still focuses exclusively on core sectors, which doesn't reflect the balance between efficiency and resilience found in nature's networks.<\/span>\r<br /><span>Option 4. This option is consistent with the passage. It captures the idea of promoting diversity and equitable distribution of resources, mirroring the balance between efficiency and resilience found in nature's networks.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Inference"}, {"number": 12, "sourceId": "169627478903411", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>As their recurring success in nature’s designs shows, networks are excellent structures for reliably distributing resources throughout a whole system. In order to better understand the kind of networks that can make us thrive, network theorists studied the branching patterns and resource flows that are found in nature’s ecosystems.<\/span><br><br><span>Nature’s networks are structured by branching fractals, ranging from a few larger ones to many medium-sized ones and then myriad smaller ones, just like blood vessels in a body, or veins in a leaf… Efficiency occurs when a system streamlines and simplifies its resource flow to achieve its aims, say
