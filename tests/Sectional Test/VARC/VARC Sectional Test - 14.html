t promises 100 days of minimum-wage employment each year to every rural household that needs it. And citizens – from Australia and the USA to South Africa and Slovenia – are campaigning for a national basic income paid unconditionally to all, to ensure that, job or no job, every person has sufficient income to meet life’s essentials.<\/span><br><br><span>Redistributive policies can significantly impact <\/span><span>beneficiaries, but<\/span><span> may not address the root of economic inequalities as they target income, not wealth. To truly tackle inequality, it's essential to democratize wealth ownership, as political-economic systems depend on property control. Thus, economists should also focus on redistributing wealth sources.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "The passage mentions all of the following measures aimed at redistributing resources to alleviate inequality EXCEPT:", "options": ["Raising top marginal income tax rates and higher taxes on interest, rent, and dividends.", "ampaigning for a national basic income paid unconditionally to all.", "Introducing a wealth tax to support social programs and public services.", "Offering guaranteed access to work through minimum-wage employment programs."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tOption 1. Refer to the penultimate paragraph. This option is mentioned in the passage as a measure for redistributing resources to address inequality. It involves raising top marginal income tax rates and increasing taxes on interest, rent, and dividends.\r<br /><span>Option 2. The passage discusses this measure, which involves advocating for a national basic income paid unconditionally to all individuals to ensure they have sufficient income to meet their basic needs.<\/span>\r<br /><span>Option 3. The wealth tax option is not explicitly mentioned in the passage as a measure to alleviate inequality. However, it is more closely related to the topic of “redistributing resources and addressing wealth inequality,”. While wealth tax may be one possible way to achieve this, the author neither states it nor implies it.  It is not the same as ‘democratisation of wealth,’ which means: promoting policies and structures that enable more people to participate in and benefit from economic resources.<\/span>\r<br /><span>Option 4. Offering guaranteed access to work through minimum-wage employment programs, like India's nationwide scheme, is mentioned in the passage as a measure aimed at redistributing resources and reducing inequality.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Specific Detail Question"}, {"number": 13, "sourceId": "169627478903412", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>For more than a century, scientists have been finding hints of a close-knit relationship between the nervous and the immune systems. In the late nineteenth and early twentieth centuries, for example, scientists demonstrated that cutting nerves <\/span><span>to<\/span><span> the skin could curb some hallmarks of inflammation. It wasn’t until the late 1990s that researchers began drawing connections to the body’s master conductor, the brain. Neurosurgeon Kevin Tracey, and his colleagues found something unexpected while investigating whether an experimental anti-inflammatory drug could help to tame brain inflammation caused by stroke.<\/span><br><br><span>When delivered into the brains of rodents that had experienced strokes, the drug had the expected effect: it reduced neuroinflammation. As a control, the team injected the drug into the brains of animals that had inflammation throughout their bodies, thinking the drug would work exclusively in the brain. To their surprise, it also worked in the body…<\/span><br><br><span>After months of trying to determine the path of the drug from brain to body, the researchers decided to cut the <\/span><span>vagus<\/span><span> nerve, a bundle of some 100,000 nerve <\/span><span>fibres<\/span><span> that runs from the brain to the heart, lungs, gastrointestinal tract and other major organs. With the <\/span><span>vagus<\/span><span> nerve snipped, the anti-inflammatory effect of the brain-administered drug disappeared.<\/span><br><br><span>Inspired by this discovery, Tracey’s group and others have continued to explore other ways in which the <\/span><span>vagus<\/span><span> nerve — and the rest of the nervous system — directs immune responses. Scientific tools have enabled unprecedented charting of interactions between the nervous and immune systems, driving these developments.<\/span><br><br><span>Some researchers are focusing on particular body systems. For instance, a team led by Andreas Habenicht, a cardiologist at LMU Munich, reported last year that the interaction between immune cells and nerves in the outermost layer of artery walls modulated the progression of atherosclerosis, an inflammatory disease in which vessels become clogged with cholesterol and other substances.<\/span><br><br><span>The brain itself is also beginning to give up its secrets. Neuroscientist Catherine Dulac and her team at Harvard <\/span><span>University,<\/span><span> have pinpointed neurons in an area called the hypothalamus that control symptoms including fever, warmth-seeking and loss of appetite in response to infection. “Most people probably assume that when you feel sick, it’s because the bacteria or viruses are messing up your body,” she says. But her team demonstrated that activating these neurons could generate symptoms of sickness even in the absence of a pathogen. An open question, Dulac adds, is whether these hypothalamic neurons can be activated by triggers other than pathogens, such as chronic inflammation.<\/span><br><br><span>Just above the hypothalamus sits a region called the insula. In a 2021 study, Tamar Koren, found that neurons in the insula store memories of past bouts of gut inflammation — and that stimulating those brain cells reactivated the immune response. Koren and colleagues suspect that such a reaction might prime the body to fight potential threats. But these reactions could also backfire and start up in the absence of the original trigger. This could be the case for certain conditions, such as irritable bowel syndrome, that can be exacerbated by negative psychological states.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\tWhich of the following is NOT an implication of the 'unexpected' finding of Kevin Tracey and his team of researchers?", "options": ["The finding indicated a direct relationship between the vagus nerve, and the heart, lungs, and other major organs", "The finding highlighted the role of the vagus nerve in mediating the communication between the brain and the immune system.", "The result opened new avenues for developing therapies that target the nervous system to treat inflammatory diseases.", "The discovery contributed to our understanding of the complex interactions between the nervous and immune systems."], "answer": 0, "answerLabel": "A", "solution": "<\/span>\tOption 1: This option is NOT an implication of the unexpected finding because it only states the anatomical connections of the vagus nerve to various organs. This was already known to the researchers (Paragraph 3). The option does not relate to the finding that the drug reduced inflammation in both the brain and body when injected into the brains of animals with body-wide inflammation.\r<br /><span>Option 2: This option is an implication of the finding because it was discovered that cutting the vagus nerve eliminated the anti-inflammatory effect, which demonstrates the role of the vagus nerve in mediating the communication between the brain and the immune system.<\/span>\r<br /><span>Option 3: This option is an implication of the finding because the discovery of the brain's influence on immune responses in the body could lead to the development of new therapies targeting the nervous system to treat inflammatory diseases. The experiment was conducted to see “whether an experimental anti-inflammatory drug could help to tame brain inflammation caused by stroke.”<\/span>\r<br /><span>Option 4: This option is an implication of the finding because the discovery contributes to our understanding of the complex interactions between the nervous and immune systems, paving the way for further research in the field of neuroimmunology.<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Inference"}, {"number": 14, "sourceId": "169627478903513", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>For more than a century, scientists have been finding hints of a close-knit relationship between the nervous and the immune systems. In the late nineteenth and early twentieth centuries, for example, scientists demonstrated that cutting nerves <\/span><span>to<\/span><span> the skin could curb some hallmarks of inflammation. It wasn’t until the late 1990s that researchers began drawing connections to the body’s master conductor, the brain. Neurosurgeon Kevin Tracey, and his colleagues found something unexpected while investigating whether an experimental anti-inflammatory drug could help to tame brain inflammation caused by stroke.<\/span><br><br><span>When delivered into the brains of rodents that had experienced strokes, the drug had the expected effect: it reduced neuroinflammation. As a control, the team injected the drug into the brains of animals that had inflammation throughout their bodies, thinking the drug would work exclusively in the brain. To their surprise, it also worked in the body…<\/span><br><br><span>After months of trying to determine the path of the drug from brain to body, the researchers decided to cut the <\/span><span>vagus<\/span><span> nerve, a bundle of some 100,000 nerve <\/span><span>fibres<\/span><span> that runs from the brain to the heart, lungs, gastrointestinal tract and other major organs. With the <\/span><span>vagus<\/span><span> nerve snipped, the anti-inflammatory effect of the brain-administered drug disappeared.<\/span><br><br><span>Inspired by this discovery, Tracey’s group and others have continued to explore other ways in which the <\/span><span>vagus<\/span><span> nerve — and the rest of the nervous system — directs immune responses. Scientific tools have enabled unprecedented charting of interactions between the nervous and immune systems, driving these developments.<\/span><br><br><span>Some researchers are focusing on particular body systems. For instance, a team led by Andreas Habenicht, a cardiologist at LMU Munich, reported last year that the interaction between immune cells and nerves in the outermost layer of artery walls modulated the progression of atherosclerosis, an inflammatory disease in which vessels become clogged with cholesterol and other substances.<\/span><br><br><span>The brain itself is also beginning to give up its secrets. Neuroscientist Catherine Dulac and her team at Harvard <\/span><span>University,<\/span><span> have pinpointed neurons in an area called the hypothalamus that control symptoms including fever, warmth-seeking and loss of appetite in response to infection. “Most people probably assume that when you feel sick, it’s because the bacteria or viruses are messing up your body,” she says. But her team demonstrated that activating these neurons could generate symptoms of sickness even in the absence of a pathogen. An open question, Dulac adds, is whether these hypothalamic neurons can be activated by triggers other than pathogens, such as chronic inflammation.<\/span><br><br><span>Just above the hypothalamus sits a region called the insula. In a 2021 study, Tamar Koren, found that neurons in the insula store memories of past bouts of gut inflammation — and that stimulating those brain cells reactivated the immune response. Koren and colleagues suspect that such a reaction might prime the body to fight potential threats. But these reactions could also backfire and start up in the absence of the original trigger. This could be the case for certain conditions, such as irritable bowel syndrome, that can be exacerbated by negative psychological states.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "The severing of the vagus nerve contributed to the understanding that:", "options": ["Inflammations throughout the body primarily originate in the brain.", "The brain influenced immune responses and inflammation within the body.", "The vagus nerve extends from the brain to various essential organs.", "Anti-inflammatory drugs may be more effectively administered to the brain than locally."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\tOption 1. This option is not accurate because not all bodily inflammations originate in the brain. The experiment showed that the brain could influence immune responses and inflammation&nbsp;in the body through the vagus nerve, but it does not imply that all inflammations have their origins in the brain.\r<br /><span>Option 2. This option is correct because the experiment demonstrated that when the vagus nerve was cut, the anti-inflammatory effect of the drug disappeared, indicating that the brain could influence immune responses and inflammation in the body through the vagus nerve.<\/span>\r<br /><span>Option 3. This option is inaccurate.. The information, while factually correct, was already known to the medical researchers (paragraph 3). The cutting of the vagus nerve established the role of the vagus nerve in mediating communication between the brain and the immune system, but it did not help establish the anatomical connections of the vagus nerve.<\/span>\r<br /><span>Option 4. This option is not accurate because the experiment primarily demonstrated the role of the vagus nerve in mediating the communication between the brain and the immune system. While the anti-inflammatory drug was administered into the brain and affected inflammation in the body, the experiment did not establish this as a general principle or preferred method for administering anti-inflammatory drugs.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Specific Detail Question"}, {"number": 15, "sourceId": "169627478903514", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>For more than a century, scientists have been finding hints of a close-knit relationship between the nervous and the immune systems. In the late nineteenth and early twentieth centuries, for example, scientists demonstrated that cutting nerves <\/span><span>to<\/span><span> the skin could curb some hallmarks of inflammation. It wasn’t until the late 1990s that researchers began drawing connections to the body’s master conductor, the brain. Neurosurgeon Kevin Tracey, and his colleagues found something unexpected while investigating whether an experimental anti-inflammatory drug could help to tame brain inflammation caused by stroke.<\/span><br><br><span>When delivered into the brains of rodents that had experienced strokes, the drug had the expected effect: it reduced neuroinflammation. As a control, the team injected the drug into the brains of animals that had inflammation throughout their bodies, thinking the drug would work exclusively in the brain. To their surprise, it also worked in the body…<\/span><br><br><span>After months of trying to determine the path of the drug from brain to body, the researchers decided to cut the <\/span><span>vagus<\/span><span> nerve, a bundle of some 100,000 nerve <\/span><span>fibres<\/span><span> that runs from the brain to the heart, lungs, gastrointestinal tract and other major organs. With the <\/span><span>vagus<\/span><span> nerve snipped, the anti-inflammatory effect of the brain-administered drug disappeared.<\/span><br><br><span>Inspired by this discovery, Tracey’s group and others have continued to explore other ways in which the <\/span><span>vagus<\/span><span> nerve — and the rest of the nervous system — directs immune responses. Scientific tools have enabled unprecedented charting of interactions between the nervous and immune systems, driving these developments.<\/span><br><br><span>Some researchers are focusing on particular body systems. For instance, a team led by Andreas Habenicht, a cardiologist at LMU Munich, reported last year that the interaction between immune cells and nerves in the outermost layer of artery walls modulated the progression of atherosclerosis, an inflammatory disease in which vessels become clogged with cholesterol and other substances.<\/span><br><br><span>The brain itself is also beginning to give up its secrets. Neuroscientist Catherine Dulac and her team at Harvard <\/span><span>University,<\/span><span> have pinpointed neurons in an area called the hypothalamus that control symptoms including fever, warmth-seeking and loss of appetite in response to infection. “Most people probably assume that when you feel sick, it’s because the bacteria or viruses are messing up your body,” she says. But her team demonstrated that activating these neurons could generate symptoms of sickness even in the absence of a pathogen. An open question, Dulac adds, is whether these hypothalamic neurons can be activated by triggers other than pathogens, such as chronic inflammation.<\/span><br><br><span>Just above the hypothalamus sits a region called the insula. In a 2021 study, Tamar Koren, found that neurons in the insula store memories of past bouts of gut inflammation — and that stimulating those brain cells reactivated the immune response. Koren and colleagues suspect that such a reaction might prime the body to fight potential threats. But these reactions could also backfire and start up in the absence of the original trigger. This could be the case for certain conditions, such as irritable bowel syndrome, that can be exacerbated by negative psychological states.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "Which of the following most accurately describes the primary objective of Catherine Dulac's research?", "options": ["Uncovering latent diseases by examining symptoms shared by viral and bacterial infections.", "Investigating whether hypothalamic neurons can be activated by stimuli other than pathogens.", "Exploring the brain's role in regulating symptoms associated with illness, even in the absence of a pathogen.", "Discovering and devising treatments for a range of conditions underlying chronic inflammation."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tOption 3. Correct. Catherine Dulac's research focuses on understanding how specific neurons in the hypothalamus regulate symptoms such as fever, warmth-seeking, and loss of appetite during an infection, and how these neurons can generate sickness symptoms even without the presence of a pathogen. This research aims to provide a better understanding of the brain's role in controlling symptoms related to sickness.\r<br /><span>Option 1. Incorrect. This option suggests that Catherine Dulac's research is focused on discovering hidden or latent diseases by examining symptoms typically associated with infections. However, the main focus of her research is understanding the brain's role in controlling sickness symptoms, even in the absence of a pathogen, rather than identifying dormant diseases.<\/span>\r<br /><span>Option 2. Incorrect. This option refers to an open question mentioned by Catherine Dulac in the passage. While her research has shown that hypothalamic neurons can generate sickness symptoms without a pathogen, the primary focus of her research is on understanding the brain's role in controlling sickness symptoms, not solely on investigating the activation of hypothalamic neurons by other triggers.<\/span>\r<br /><span>Option 4. Incorrect. This option suggests that Catherine Dulac's research aims to discover and create treatments for various diseases related to chronic inflammation. Although her research may contribute to a broader understanding of how the brain responds to different factors, including chronic inflammation, the main purpose of her research is to study the brain's role in controlling symptoms related to sickness, even in the absence of a pathogen.<\/span>\r<br /><span>&nbsp;<\/span>", "topic": "Inference"}, {"number": 16, "sourceId": "169627478903515", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>For more than a century, scientists have been finding hints of a close-knit relationship between the nervous and the immune systems. In the late nineteenth and early twentieth centuries, for example, scientists demonstrated that cutting nerves <\/span><span>to<\/span><span> the skin could curb some hallmarks of inflammation. It wasn’t until the late 1990s that researchers began drawing connections to the body’s master conductor, the brain. Neurosurgeon Kevin Tracey, and his colleagues found something unexpected while investigating whether an experimental anti-inflammatory drug could help to tame brain inflammation caused by stroke.<\/span><br><br><span>When delivered into the brains of rodents that had experienced strokes, the drug had the expected effect: it reduced neuroinflammation. As a control, the team injected the drug into the brains of animals that had inflammation throughout their bodies, thinking the drug would work exclusively in the brain. To their surprise, it also worked in the body…<\/span><br><br><span>After months of trying to determine the path of the drug from brain to body, the researchers decided to cut the <\/span><span>vagus<\/span><span> nerve, a bundle of some 100,000 nerve <\/span><span>fibres<\/span><span> that runs from the brain to the heart, lungs, gastrointestinal tract and other major organs. With the <\/span><span>vagus<\/span><span> nerve snipped, the anti-inflammatory effect of the brain-administered drug disappeared.<\/span><br><br><span>Inspired by this discovery, Tracey’s group and others have continued to explore other ways in which the <\/span><span>vagus<\/span><span> nerve — and the rest of the nervous system — directs immune responses. Scientific tools have enabled unprecedented charting of interactions between the nervous and immune systems, driving these developments.<\/span><br><br><span>Some researchers are focusing on particular body systems. For instance, a team led by Andreas Habenicht, a cardiologist at LMU Munich, reported last year that the interaction between immune cells and nerves in the outermost layer of artery walls modulated the progression of atherosclerosis, an inflammatory disease in which vessels become clogged with cholesterol and other substances.<\/span><br><br><span>The brain itself is also beginning to give up its secrets. Neuroscientist Catherine Dulac and her team at Harvard <\/span><span>University,<\/span><span> have pinpointed neurons in an area called the hypothalamus that control symptoms including fever, warmth-seeking and loss of appetite in response to infection. “Most people probably assume that when you feel sick, it’s because the bacteria or viruses are messing up your body,” she says. But her team demonstrated that activating these neurons could generate symptoms of sickness even in the absence of a pathogen. An open question, Dulac adds, is whether these hypothalamic neurons can be activated by triggers other than pathogens, such as chronic inflammation.<\/span><br><br><span>Just above the hypothalamus sits a region called the insula. In a 2021 study, Tamar Koren, found that neurons in the insula store memories of past bouts of gut inflammation — and that stimulating those brain cells reactivated the immune response. Koren and colleagues suspect that such a reaction might prime the body to fight potential threats. But these reactions could also backfire and start up in the absence of the original trigger. This could be the case for certain conditions, such as irritable bowel syndrome, that can be exacerbated by negative psychological states.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "Which one of the following statements could be inferred as supporting the arguments of the passage?", "options": ["Cutting the vagus nerve eliminates the body's inflammatory response along with the anti-inflammatory effect of the brain-administered drug.", "The hypothalamus plays a role in controlling symptoms related to sickness, even when there is no pathogen present.", "Dormant diseases can be identified by examining symptoms specific to each disease and cannot be linked to common symptoms.", "The interaction between immune cells and nerves in artery walls is the primary cause of atherosclerosis."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\tOption 1. This statement is not supported by the passage. The passage states that cutting the vagus nerve eliminated the anti-inflammatory ‘effect’ of the brain-administered drug, but it does not suggest that it completely eliminates the body's inflammatory ‘response’.\r<br /><span>Option 2. This statement is supported by the passage, as it discusses Catherine Dulac's research on how hypothalamic neurons regulate symptoms associated with illness, even in the absence of a pathogen.<\/span>\r<br /><span>Option 3. This statement is not directly supported by the passage. The passage focuses on the relationship between the nervous and immune systems and their potential implications, rather than on identifying dormant diseases.<\/span>\r<br /><span>Option 4. This statement is not supported by the passage. The passage states that Andreas Habenicht's team found that the interaction between immune cells and nerves in artery walls modulated the progression of atherosclerosis, but it does not claim that this interaction is the primary cause of the disease.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Inference"}, {"number": 17, "sourceId": "169627478903516", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span><b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><\/span><br><br>1.\tDespite this imbalance, richer countries faced higher losses of lifeyears per capita, highlighting health inequality at various levels. <br>2.\tHealth inequality reduction requires addressing factors like discrimination, health literacy, and cultural barriers. <br>3.\tThe COVID-19 pandemic exposed the inequality in vaccine allocation, with only 19% of low-income countries' populations inoculated compared to 75% in high-income countries. <br>4.\tIn the US, people of color experienced higher COVID-19 infection and death rates due to social determinants of health. <br><br>", "options": [], "answer": "3142", "answerLabel": "3142", "solution": "<\/span>\tSentence 1. “Despite this imbalance…” makes sentence 1 a follow up sentence.&nbsp;\r<br />Sentence 2.  Probably a standalone sentence; suggests measures to reduce health inequality.\r<br /><span>Sentence 3. “the inequality in vaccine allocation…” links it to 1. 3-1 is a pair. 3-1 could begin the paragraph.&nbsp;<\/span>\r<br /><span>Sentence 4. This is an example of higher losses suffered by the US. It links directly to sentence 1.<\/span>\r<br /><span>Sentence 3 introduces the topic – inequality in vaccine allocation between rich countries and poor countries. 1 follows 3 by presenting a contrast (“despite this imbalance”) referring to the imbalance introduced in 3. 4 gives an example of higher losses and health inequality in rich countries (“In the US”). 2 follows by talking about ways to reduce this inequality. 2 acts as the concluding sentence.&nbsp;<\/span>\r<br /><span>Therefore, the required answer is 3142.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 18, "sourceId": "169627478903717", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<p><em><strong>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/strong><\/em><\/p>\n<p><br />1. In addition to the convenience factor, online shopping platforms often offer a wider range of products than physical stores.<br />2. Online shopping has become increasingly popular in recent years due to its convenience, as people can shop from anywhere at any time.<br />3. However, this ease of access may also lead to excessive consumerism and increased waste.<br />4. It is crucial for consumers to remain mindful of their shopping habits and consider the environmental impact of their choices.<br /><br /><span><\/span><\/p>", "options": [], "answer": "2134", "answerLabel": "2134", "solution": "<\/span>\tSentence 1. ‘In addition’ makes it a follow up sentence.&nbsp;\r<br /><span>Sentence 2. Introduces the topic of online shopping and its popularity due to convenience, making it a good starting sentence.<\/span>\r<br /><span>Sentence 3. Presents a drawback of online shopping, focusing on excessive consumerism and waste.<\/span>\r<br /><span>Sentence 4. Provides a suggestion for consumers to be mindful of their shopping habits and consider the environmental impact.<\/span>\r<br /><span>Sentence 2 serves as a good introduction to the topic of online shopping and its popularity due to convenience. Following this, Sentence 1 expands on the benefits of online shopping, discussing the variety of products available. Next, Sentence 3 presents a drawback of online shopping, focusing on excessive consumerism and waste. Finally, Sentence 4 provides a suggestion for consumers to be mindful of their shopping habits and consider the environmental impact.<\/span>\r<br /><span>Therefore, the required answer is 2134.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 19, "sourceId": "169627478904118", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<p><span><strong>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/strong><\/span><br /><br /><br />1. In today's world, social media platforms are a major source of information and communication.<br />2. Nevertheless, the overuse of social media can lead to addiction, decreased productivity, and mental health issues.<br />3. As a result, it is crucial to establish boundaries and manage time spent on social media wisely.<br />4. Social media has revolutionized the way people connect and share information with each other.<br /><br /><br /><span><\/span><\/p>", "options": [], "answer": "4123", "answerLabel": "4123", "solution": "<\/span>\tSentence 1. Talks about the role of social media as a source of information and communication.\r<br /><span>Sentence 2. Introduces the negative aspects of social media overuse.<\/span>\r<br /><span>Sentence 3. Provides a solution to the problems mentioned in sentence 2.<\/span>\r<br /><span>Sentence 4. Describes the impact of social media on people's connections and information sharing.<\/span>\r<br />\r<br /><span>Sentence 4 introduces the topic of social media and its impact on people's connections, making it a good starting sentence. Sentence 1 follows naturally, explaining the role of social media as a major source of information and communication. Sentence 2 provides a contrasting perspective, highlighting that the overuse of social media can lead to addiction and other issues. Sentence 3 offers a solution to the negative consequences mentioned in sentence 2, making it a good ending sentence.<\/span>\r<br /><span>Therefore, the required answer is 4123.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 20, "sourceId": "169627478904319", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<p><span><strong>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/strong><\/span><br /><br /><strong>Sentence<\/strong>: People tend to seek consistency among their beliefs, attitudes, and actions.<br /><br /><strong>Paragraph<\/strong>:&nbsp;&nbsp;_____1____.&nbsp;Cognitive dissonance is a psychological phenomenon that occurs when an individual experiences discomfort or distress due to conflicting beliefs, attitudes, or actions. For instance, if someone believes that smoking is harmful but continues to smoke, they may experience cognitive dissonance. To resolve this discomfort, individuals often engage in various strategies. _____2____. Some of these strategies include changing their behavior, justifying their behavior, or seeking out information that supports their existing beliefs. _____3____. Research has shown that cognitive dissonance can have significant implications in various aspects of life, including decision-making, problem-solving, and interpersonal relationships. _____4____. Understanding cognitive dissonance and its effects is crucial in helping individuals make better choices and resolve internal conflicts.<\/p>", "options": ["Option 1", "Option 2", "Option 3", "Option 4"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\tThe given sentence, \"People tend to seek consistency among their beliefs, attitudes, and actions,\" best fits in the first blank. It provides an introduction to the concept of cognitive dissonance by explaining the natural tendency of individuals to strive for consistency in their thoughts and actions. The following blanks in the paragraph discuss examples of cognitive dissonance, strategies to resolve it, and its implications in different aspects of life. It doesn’t fit in any other blank.  So the best place in this instance is 1 as it explains the need for consistency upfront.\r<br /><span>Hence, [1].<\/span>", "topic": "Paragraph Completion"}, {"number": 21, "sourceId": "169627478904420", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<span><b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><\/span><br><br><b>Sentence<\/b>: They are well adapted for diving and swimming in the ocean.<br><br><b>Paragraph<\/b>: Seals, part of the pinniped family, are marine mammals that have evolved over millions of years. _____1____. The early ancestors of seals, known as puijilids, were semi-aquatic and possessed characteristics of both terrestrial and marine mammals. _____2____. Over time, they developed streamlined bodies, specialized limbs, and increased blubber content to better survive in their aquatic environment. _____3____. These adaptations allowed them to become efficient hunters and divers, capable of reaching great depths and staying submerged for extended periods. Today, there are numerous species of seals, each with its unique adaptations to thrive in different habitats, from the Arctic to the Antarctic. _____4____.", "options": ["Option 1", "Option 2", "Option 3", "Option 4"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tThe given sentence, \"They are well adapted for diving and swimming in the ocean,\" fits best in the third blank. The first blank introduces the topic of seals and their evolution, while the second blank discusses the early ancestors of seals, known as puijilids. The third blank is where the paragraph highlights the specific adaptations that seals have developed to become efficient divers&nbsp;and swimmers in the ocean. The fourth blank goes on to discuss the variety of seal species and their unique adaptations to different habitats.\r<br /><span>Hence, [3].<\/span>", "topic": "Paragraph Completion"}, {"number": 22, "sourceId": "169627478904621", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span><b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><\/span><br><br>The philosopher Hegel stated a link between moral choice and human dignity: human beings are morally free agents who are not simply rational machines seeking to maximize satisfaction of their desires. But unlike Rousseau or Kant, Hegel put recognition of that moral agency at the center of his account of the human condition. He argued that human history was driven by a struggle for recognition. The demand comes initially from a warrior who is willing to risk his life in a bloody battle, not for territory or wealth, but simply for recognition itself. But this recognition ultimately fails to be satisfying because it is the recognition of a slave, that is, of someone without dignity. This problem can be solved only when the slave acquires dignity through labor, through the ability to transform the world into a place suitable for human life. The only rational form of recognition is ultimately the mutual recognition of master and slave of their shared human dignity.", "options": ["Hegel believed that the struggle for recognition is ultimately a struggle for dignity, and that the recognition of our shared human dignity is the only rational form of recognition.", "According to Hegel, human history is driven by a struggle for recognition, with the only rational form of recognition being the acknowledgement of shared human dignity.", "Hegel believed human dignity is connected to moral choice, as individuals are morally free agents, and emphasized the role of recognition in human history.", "For Hegel, the connection between moral choice and human dignity involves the struggle for recognition culminating in the recognition of shared human dignity of individuals."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span><b>Points:<\/b><\/span>\r<br /><span><\/span><span>&nbsp;<\/span>\tHegel's link between moral choice and human dignity.\r<br /><span><\/span><span>&nbsp;<\/span>\tRecognition of moral agency is central to Hegel's account\r<br /><span><\/span><span>&nbsp;<\/span>\tHuman history is driven by a struggle for recognition\r<br />\r<br /><span>Option 1: This option focuses on the struggle for dignity and the rational form of recognition but misses the idea that human history is driven by the struggle for recognition.<\/span>\r<br /><span>Option 2: This option accurately captures the central ideas in the paragraph, including the struggle for recognition driving human history and the only rational form of recognition being the acknowledgement of shared human dignity.<\/span>\r<br /><span>Option 3: This option mentions Hegel's belief in moral choice, human dignity, and recognition, but it does not capture the idea of human history being driven by the struggle for recognition and the mutual recognition of shared human dignity as the only rational form of recognition.<\/span>\r<br /><span>Option 4: This option connects moral choice and human dignity with the struggle for recognition but does not clearly state that human history is driven by this struggle for recognition, which is central to Hegel's view.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Summary"}, {"number": 23, "sourceId": "169627478904722", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span><b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><\/span><br><br>In a purely oral culture, thinking is governed by the capacity of human memory. Knowledge is what you recall, and what you recall is limited to what you can hold in your mind. Throughout the millennia of man’s preliterate history, language evolved to aid the storage of complex information in individual memory and to make it easy to exchange that information with others through speech. Serious thought was by necessity intertwined with memory systems. Diction and syntax became highly rhythmical, tuned to the ear, and information was encoded in common turns of phrase—what we’d today call clichés—to aid memorization. Knowledge was embedded in “poetry,” as Plato defined it, and a specialized class of poet-scholars became the human devices, the flesh-and-blood intellectual technologies, for information storage, retrieval, and transmission. Laws, records, transactions, decisions, traditions— everything that today would be “documented”—in oral cultures had to be “composed in formulaic verse” and distributed “by being sung or chanted aloud.”", "options": ["Language evolved to facilitate the retention and dissemination of complex information, with poet-scholars serving as human devices for information management due to the reliance on human memory for knowledge storage.", "In oral cultures thinking was governed by human memory and serious thought was encoded in poetry for ease of storing and transmission making poet-scholars human devices for the storage and dissemination of information.", "Since oral cultures relied purely on human memory for knowledge storage, language evolved to aid in the retention and dissemination of complex information, with poet-scholars acting as human devices for information management.", "In oral cultures, the evolution of language focused on the development of rhythmic diction and syntax, and the use of clichés to aid in memorization which made a specialized class of poet-scholars responsible for information management."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span><b>Points:<\/b><\/span>\r<br /><span>•&nbsp;<\/span>\t<span>Reliance on human memory in oral cultures (for information/knowledge)<\/span><span>.<\/span>\r<br /><span>•&nbsp;<\/span>\t<span>Language evolving to aid information storage and exchange<\/span><span>.<\/span>\r<br /><span>•<\/span>\t<span>Rhythmical diction and syntax, and use of clichés<\/span><span>.<\/span>\r<br /><span>•&nbsp;<\/span>\t<span>Knowledge embedded in poetry<\/span><span>.<\/span>\r<br /><span>•&nbsp;<\/span>\t<span>Specialized class of poet-scholars for information management<\/span><span>.<\/span>\r<br />\r<br /><span>Option 1. It does not mention oral cultures.&nbsp;<\/span>\r<br /><span>Option 2. This option is not the best choice because it lacks information about the specific ways in which language evolved to aid in the storage and exchange of complex information, such as the development of rhythmic diction and syntax and the use of clichés.<\/span>\r<br /><span>Option 3. This option is the best précis because it concisely captures the key points of the original passage. It explains the reliance on human memory for knowledge storage in oral cultures, the evolution of language to aid in the retention and dissemination of complex information, and the role of poet-scholars as human devices for information management. The other options either lack crucial information or are not as clear and concise in their summary of the passage.<\/span>\r<br /><span>Option 4. This option is not the best choice because it doesn't explicitly mention the reliance on human memory for knowledge storage and how thinking was governed by human memory in oral cultures.&nbsp;<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Summary"}, {"number": 24, "sourceId": "169627478904923", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span><b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><\/span><br><br>While earthquake prediction has often been referred to as the “holy grail” of seismology, it actually would present some real dilemmas if ever developed. First of all, earthquakes are so infrequent that any early methods will inevitably be of uncertain accuracy. In the face of that uncertainty, who will make the call to take a major action, such as evacuating an entire city or region? How long should people stay away if a quake doesn’t materialize? How many times before it’s a boy-who-cried-wolf situation and the public stops heeding the orders? The idea that prediction technology will emerge fully formed and reliable is a mirage…It is often said that earthquakes don’t kill people, buildings do. Scientists are already good enough today at forecasting earthquake hazards that the best course of action is to redouble efforts to construct buildings, bridges and other infrastructure so they’re safe and resilient in the event of ground shaking in any area known to be at risk from quakes. These precautions will pay off in lives and property saved far more than a hoped-for means of earthquake prediction.", "options": ["The uncertainty of seismology makes its predictions unreliable; instead, constructing safe and resilient buildings and infrastructure in areas prone to earthquakes will more effectively save lives and property in earthquake-prone areas.", "Earthquake prediction, considered the \"holy grail\" of seismology, presents dilemmas due to uncertain accuracy, evacuation challenges, and public trust, as building resilient infrastructure offers a less effective approach to save lives and property.", "The suggestion that building safe and resilient infrastructure is a more reliable way to minimize earthquake-related damages presents some real dilemmas about pursuing the development of fully formed earthquake prediction technologies.", "Earthquake prediction faces challenges such as uncertainty in early methods and the potential for false alarms, leading to the suggestion that focusing on safe and resilient infrastructure is a more reliable way to minimize earthquake-related damages."], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span><b>Points:<\/b><\/span>\r<br /><span>•&nbsp;<\/span>\t<span>Earthquake prediction is considered the \"holy grail\" of seismology but presents dilemmas<\/span><span>.<\/span>\r<br /><span>•&nbsp;<\/span>\t<span>Earthquakes are infrequent, making early methods uncertain<\/span><span>.<\/span>\r<br /><span>•&nbsp;<\/span>\t<span>Challenges in making major decisions like evacuations<\/span><span>.<\/span>\r<br /><span>•&nbsp;<\/span>\t<span>Potential for false alarms and the boy-who-cried-wolf situation<\/span><span>.<\/span>\r<br /><span>•&nbsp;<\/span>\t<span>Fully formed and reliable prediction technology is a mirage<\/span><span>.<\/span>\r<br /><span>•&nbsp;<\/span>\t<span>Focus on constructing safe and resilient buildings and infrastructure<\/span><span>.<\/span>\r<br />•&nbsp;\t<span>Safe construction is a more effective approach to saving lives and property<\/span><span>.<\/span>\r<br />\r<br /><span>Option 1. “uncertainty of seismology” is a misrepresentation; the passage is only about earthquake prediction and not seismology in general, the scope of which extends beyond earthquake prediction.&nbsp;<\/span>\r<br /><span>Option 2. “less effective approach” is wrong.&nbsp;<\/span>\r<br /><span>Option 3. “building safe and resilient infrastructure…” does not present any dilemma.&nbsp;<\/span>\r<br /><span>Option 4. Correct. The best precis capturing the essence of the passage.&nbsp;<\/span>\r<br /><span>Hence, [4].<\/span", "topic": "Summary"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;
function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
