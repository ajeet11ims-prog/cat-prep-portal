ving along our line of sight. Knowing this velocity made it possible to uncover each star’s orbit. What emerged was a portrait of a halo-shaped proto-galaxy, as anticipated by some theorists. The population of elderly, metal-poor stars orbited in a small, tight sphere with a radius of 9,000 light-years, which the team dubbed the “poor old heart” of the Milky Way. Overall, the findings suggest that the proto-galaxy didn’t steal stars from other galaxies. If it had, their stellar orbits would be headed toward regions beyond the Milky Way.<br><br>In 2022, two papers hinted at a timeline for the Milky Way’s disk formation. The theory goes that after the proto-galaxy arose, the region “simmered,” collecting gas and creating metal-poor stars. After a billion years, the emergent galaxy “boiled,” frantically giving birth to metal-rich stars for 2 billion to 3 billion years. These newer stars were different. They followed flatter orbits. As the galaxy cooled down, a razor-thin disk formed, filled with the newly minted stars (including our sun) moving in tidy circular orbits around the galactic center. The 1.5 million stars in Chandra’s data set confirmed this timeline…", "passageTitle": "Reading Comprehension Passage", "question": "Which one of the following statements, if true, would most seriously challenge the internal nursery theory of the origin of the Milky Way?", "options": ["The hierarchical merging of smaller substructures predicted by the nursery theory is not consistent with observations of galaxies other than the Milky Way.", "Observations have shown that some of the oldest stars in the Milky Way are located in the outermost region of the galaxy.", "The current simulation models based on the internal nursery theory have been unsuccessful in reproducing some of the observed properties of the Milky Way.", "The smaller substructures in the Milky Way explain the existence of clusters which are formed from the merging of smaller galaxies."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\tOption 1. This statement, if true, would challenge the internal nursery theory, but it would not be the most serious challenge. The hierarchical merging of smaller substructures in galaxies other than the Milky Way may have nothing to do with the formation of the Milky Way.&nbsp;\r<br /><span>Option 2. This statement, if true, would seriously challenge the internal nursery theory, as it predicts that the oldest stars should be located near the center of the galaxy. This observation suggests that the formation of the Milky Way was more complex than predicted by the internal nursery theory.<\/span>\r<br /><span>Option 3. This statement, if true, would also challenge the internal nursery theory, but it would not be the most serious challenge. Simulation models may be constantly being refined and updated, and it is possible that future models could better reproduce the observed properties of the Milky Way.<\/span>\r<br /><span>Option 4. This statement supports the internal nursery theory, rather than challenge it. The hierarchical merging of smaller substructures is a key prediction of the theory, and the existence of clusters formed from merging smaller galaxies is consistent with this prediction.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Application Question"}, {"number": 17, "sourceId": "169709850481716", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br>\t1.\tThis realization can lead individuals to live a more meaningful and fulfilling life.<br>\t2.\tHowever, some people may struggle to find their purpose or become overwhelmed by existential questions.<br>\t3.\tUnderstanding one's purpose in life is a fundamental aspect of human existence and well-being.<br>\t4.\tThrough self-reflection and exploration, individuals can identify their passions, values, and goals, which can provide a sense of direction.<br><br><span>", "options": [], "answer": "3241", "answerLabel": "3241", "solution": "<p>Sentence 1.&nbsp; Describes the outcome of realizing one's purpose in life. &ldquo;This realization&hellip;&rdquo; makes it a follow-up sentence.&nbsp; <br />Sentence 2. &ldquo;however&rdquo; signals a contrast to something else&rdquo;. It introduces the challenges some people face in finding their purpose. <br />Sentence 3. General statement. Most likely the starter - the importance of understanding one's purpose in life. 3-2 is a possibility.&nbsp; <br />Sentence 4. Standalone sentence. But it also provides a solution to the challenges mentioned in sentence 2.&nbsp; 2-4 is a possibility.&nbsp;<\/p>\n<p><span lang=\"EN-US\">From the given statements, one might come to two possible sequences. <\/span><\/p>\n<p><span lang=\"EN-US\">3-2-4-1 Sequence:<\/span><\/p>\n<p><span lang=\"EN-US\">In this sequence: The paragraph starts with a general statement about the importance of understanding one's purpose in life. It then immediately acknowledges that some people have difficulty in this regard, setting up a problem. &nbsp;The third sentence offers a solution to the problem by suggesting ways individuals can find their purpose. The final sentence concludes by highlighting the benefits of that realization.<\/span><\/p>\n<p><span lang=\"EN-US\">3-4-1-2 Sequence:<\/span><\/p>\n<p><span lang=\"EN-US\">In this sequence: &nbsp;The paragraph begins with the same general statement. &nbsp;It then jumps directly into a solution or way of achieving understanding without setting up a clear problem or challenge. The third sentence further emphasizes the positive aspect of realization, which is a natural progression from the second sentence. &nbsp;The final sentence suddenly introduces a problem or challenge, which disrupts the flow and feels out of place after two positive statements.<\/span><span lang=\"EN-US\">&nbsp;<\/span><\/p>\n<p><span lang=\"EN-US\">Given the above, the 3-2-4-1 sequence provides a clearer and more logical progression of ideas, moving from the statement of importance to the problem, the solution, and finally the benefits. The 3-4-1-2 sequence, on the other hand, disrupts the flow by ending on a challenging note after presenting solutions and benefits. It ends the overall sequence on an unresolved note.&nbsp; Hence, 3-2-4-1 is the correct sequence.<\/span><\/p>\n<p>Therefore, the correct answer is 3241.<\/p>", "topic": "Jumbled Paragraphs"}, {"number": 18, "sourceId": "169709850481917", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<p><strong>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/strong><br /><br />1. The discovery has opened new avenues for research and potential treatments for various diseases.<br />2. The ethical implications and potential risks of such technologies, notwithstanding their benefits, need careful consideration.<br />3. Advances in genetic engineering, such as CRISPR-Cas9, have enabled precise manipulation of DNA sequences.<br />4. Scientists can now potentially correct genetic mutations, prevent hereditary conditions, and even engineer more resilient crops.<br /><br /><span><\/span><\/p>", "options": [], "answer": "3412", "answerLabel": "3412", "solution": "<\/span>\tSentence 1. Describes the positive impact of a scientific discovery. “The discovery…” makes this a follow up sentence.\r<br /><span>Sentence 2. Introduces the ethical concerns and potential risks. “notwithstanding their benefits”… signals that the benefits need to be mentioned in a prior sentence.&nbsp;<\/span>\r<br /><span>Sentence 3. Presents advances in genetic engineering, such as CRISPR-Cas9. Good for the starter.&nbsp;<\/span>\r<br /><span>Sentence 4. Provides examples of potential applications of genetic engineering. 1-2 is a pair.&nbsp;<\/span>\r<br /><span>3-4 is another pair. Sentence 3 introduces the topic of genetic engineering and CRISPR-Cas9, making it a good starting sentence. Sentence 4 follows naturally, explaining potential applications of genetic engineering. Sentence 1 describes the positive impact (future potential) of these advances in genetics. Sentence 2 provides a contrasting perspective, highlighting ethical implications and potential risks, making it a good ending sentence<\/span><span>.<\/span>\r<br />Therefore, the required answer is 3412.<span><b>&nbsp;<\/b><\/span>", "topic": "Jumbled Paragraphs"}, {"number": 19, "sourceId": "169709850482118", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<p><strong>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/strong><br /><br />1. There is also debate about whether faith requires some sort of connection to action.<br />2. Though used interchangeably with 'trust' or &lsquo;trustworthiness, the definition of faith is contested with differing ontological categories.<br />3. The term \"faith\" encompasses a broad range of phenomena, such as having faith in oneself, faith in democracy, and faith in God. <br />4. Some argue that faith is a psychological state, while others argue that it is an act or disposition to act. <br /><br /><span><\/span><\/p>", "options": [], "answer": "3241", "answerLabel": "3241", "solution": "<\/span>\tSentence 3 introduces the broad range of phenomena that the term \"faith\" encompasses, providing context for the subsequent discussion. Sentence 2 follows, building on the previous sentence by highlighting the contested definition of faith and its relationship to the term \"trust.\" Sentence 4 further explores the contested definition of faith by introducing differing ontological categories and theories about whether faith is a psychological state or an act/disposition to act. Sentence 1 concludes the sequence by raising the question of whether faith requires a connection to action, which relates back to the discussion in sentence 4 about the nature of faith as an act or disposition to act.\r<br /><span>Therefore, the required answer is 3241.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 20, "sourceId": "169709850482519", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><b>Sentence:<\/b> Consequently, biodiversity hotspots are regions that demand conservation efforts.<br><br><b>Paragraph:<\/b> Biodiversity hotspots are areas on Earth that contain a high level of species richness and endemism but are also facing significant threats to their ecosystems. _____1____.  These areas are crucial not only for the survival of countless species but also for the overall health of our planet. _____2____.  By focusing on conserving these hotspots, we can ensure the protection of a large number of unique species and their habitats. _____3____.   Numerous conservation organizations and governments have recognized the importance of these areas and have implemented various strategies to preserve them. _____4____.  These efforts include the establishment of protected areas, habitat restoration, and community-based conservation initiatives.", "options": ["Option 1", "Option 2", "Option 3", "Option 4"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\tThe given sentence, \"Consequently, biodiversity hotspots are regions that demand conservation efforts,\" fits best in the first blank. The first blank provides a natural place to introduce the importance of biodiversity hotspots in terms of conservation, right after defining what biodiversity hotspots are and describing the threats they face. The following blanks elaborate on the significance of these hotspots, the rationale for focusing on their conservation, and the efforts made by organizations and governments to preserve them.\r<br /><span>Hence, [1].<\/span>", "topic": "Paragraph Completion"}, {"number": 21, "sourceId": "169709850482720", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><b>Sentence:<\/b> The goal is to promote diversity and address the historical disadvantages faced by these groups.<br><br><b>Paragraph:<\/b> Affirmative action is a set of policies and practices aimed at increasing the representation of underrepresented groups in various spheres of life, such as education, employment, and business. _____1____. It often involves preferential treatment, quotas, or outreach efforts that seek to ensure equal opportunities for members of marginalized groups. _____2____. Critics of affirmative action argue that it may lead to reverse discrimination and that it should be based on meritocracy rather than group identity. However, proponents assert that it helps level the playing field, providing opportunities for those who have been systematically disadvantaged. _____3____. Affirmative action has been implemented in many countries around the world, with varying degrees of success and controversy. _____4____. Despite ongoing debates about its merits and drawbacks, affirmative action remains an essential tool in the pursuit of social justice and equality.", "options": ["Option 1", "Option 2", "Option 3", "Option 4"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tThe given sentence, \"The goal is to promote diversity and address the historical disadvantages faced by these groups,\" fits best in the third blank. The first blank introduces the concept of affirmative action, while the second blank discusses the measures taken in the context of affirmative action. The third blank is where the paragraph elaborates on the rationale behind implementing affirmative action policies, making it the most appropriate place for the given sentence. The fourth blank goes on to discuss the global implementation of affirmative action and the ongoing debate surrounding it.\r<br /><span>Hence, [3].<\/span>", "topic": "Paragraph Completion"}, {"number": 22, "sourceId": "169709850482821", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br>According to Harvard’s Opportunity Insights, the chances of children in the US earning more than their parents have declined dramatically over the past half century: from 90 per cent in 1940 to only 50 per cent today. The US also has greater income and wealth inequality than any other industrial country according to the OECD — and it is at its most extreme level in nearly a hundred years. Globally, Oxfam reports that two-thirds of the more than $42tn in new wealth created since 2020 has gone to the top 1 per cent. Higher education has long been seen as playing a vital role in improving the life prospects of young people. But critics now argue that access and affordability challenges have reduced its societal impact.", "options": ["The decline in children's chances of out-earning their parents in the US and increasing global wealth inequality have sparked criticism of higher education's societal impact, which is hampered by access and affordability challenges.", "As the chances of children earning more than their parents decline globally, critics in the US argue that the societal impact of higher education has diminished due to access and affordability issues, while income and wealth inequality rise.", "Critics contend that higher education's societal impact has been reduced by access and affordability\nchallenges, amid a decline in the likelihood of US children out-earning their parents and increasing income\nand wealth inequality.", "The decreasing chances of US children earning more than their parents and the growth of income and wealth inequality globally have led to criticism in the US about higher education's societal impact, access and affordability."], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span><b>Points:<\/b><\/span>\r<br />\r<br /><span>·<\/span><span>&nbsp;<\/span>\tDecline in US children's chances of out-earning their parents.\r<br /><span>·<\/span><span>&nbsp;<\/span>\tHighest income and wealth inequality among industrial countries.\r<br /><span>·<\/span><span>&nbsp;<\/span>\tTwo-thirds of new wealth going to the top 1% globally.\r<br /><span>·<\/span><span>&nbsp;<\/span>\tHigher education seen as vital for improving life prospects.\r<br /><span>·<\/span><span>&nbsp;<\/span>\tCritics argue access and affordability challenges have reduced societal impact.\r<br />\r<br /><span>Option 1. Correct. This option accurately and concisely summarizes the key points in the passage, including the decline in US children's chances of out-earning their parents, increasing income and wealth inequality, and the criticism of higher education's societal impact due to access and affordability challenges.<\/span>\r<br /><span>Option 2. Incorrect. “the chances of children earning more than their parents decline globally, critics in the US…” is a misrepresentation.&nbsp;<\/span>\r<br /><span>Option 3. Incorrect. The “global” aspect is not captured. This option indicates that the impact is limited to the US.<\/span>\r<br /><span>Option 4. Incorrect. “about higher education's societal impact, access and affordability,” is a misrepresentation.&nbsp;<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Summary"}, {"number": 23, "sourceId": "169709850483022", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br>The central goal of animals is to eat, argued Charles Elton, the founding father of modern ecology. And yet, most of the time, as Elton pointed out, animals are doing ‘nothing in particular’. Further research has borne out Elton’s impression. In a study from 1981, researchers found that laziness – as measured by the percentage of daylight hours spent inactive – was, in fact, widespread among animals. Lions lie around for three-quarters of the day, as do walruses. Even in bee and ant societies, the classical paragons of hard work, most workers are inactive at any given time. In effect, most animals rest more than they work. Should we now declare that all animals are also affluent, and have limited needs? Not quite. Biologists know that evolution operates with ruthless efficiency, so any apparent laziness we see in animals must serve some kind of function. In the 2010s, researchers found that colonies maintain a pool of inactive workers to step in when new work arises or when other workers get lost, and they sometimes help to store food. Other research has shown that having inactive workers around to replace fatigued workers leads to better long-term success of the colony.", "options": ["Animals, despite their central goal to eat, are often found to be inactive, but this inactivity serves a\npurpose in evolution, with inactive workers in bee and ant colonies contributing to the colony's long-term\nsuccess.", "Inactive workers in animal societies such as bee and ant colonies help ensure long-term success by\nstepping in when new work arises or when other workers are lost, demonstrating that apparent laziness\namong animals has an evolutionary function.", "While animals often appear to be lazy, research suggests that this inactivity serves a purpose, as in bee and ant colonies where inactive workers contribute to tasks such as replacing fatigued workers, food storage, and adapting to new work demands.", "Most animals rest more than they work, but this apparent laziness serves a purpose in evolutionary\nterms, as seen in bee and ant colonies where inactive workers are crucial for replacing fatigued workers and ensuring the colony's long-term success."], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span><b>Points:<\/b><\/span>\r<br />\r<br /><span>·<\/span><span>&nbsp;<\/span>\tAnimals' central goal is to eat, yet they often appear inactive.\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>Laziness is widespread among animals.<\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\tInactivity must serve a function in evolution.\r<br /><span>·<\/span><span>&nbsp;<\/span>\tInactive workers in bee and ant colonies contribute to long-term success.\r<br />\r<br /><span>Option 1. Incorrect. This option does not mention the widespread nature of laziness among animals, which is an important aspect of the passage.<\/span>\r<br /><span>Option 2. Incorrect. This option focuses mainly on the role of inactive workers in bee and ant colonies, omitting the overall widespread nature of laziness among animals and the connection between inactivity and the central goal of animals to eat.<\/span>\r<br /><span>Option 3. Incorrect. While this option addresses some key points, it does not refer to the evolutionary aspect of laziness, which is an important aspect of the passage.<\/span>\r<br /><span>Option 4. Correct. This option accurately and concisely summarizes the key points in the passage, including the central goal of animals to eat, the widespread nature of laziness among animals, and the evolutionary function of inactivity, particularly in bee and ant colonies.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Summary"}, {"number": 24, "sourceId": "169709850483223", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br>Real-world liberal democracies never fully live up to their underlying ideals of freedom and equality. Rights are often violated; the law never applies equally to the powerful as it does to the poor and weak. Moreover, intrinsic conflicts exist between the goals of freedom and equality: greater freedom often entails increased inequality, while efforts to equalize outcomes reduce freedom. Successful democracy depends not on optimization of its ideals, but a balance between individual freedom and political equality, and between a capable state exercising legitimate power and the institutions of law and accountability that seek to constrain it. Many democracies try to do a whole lot more than this, through policies that try to promote economic growth, a clean environment, support for technology, and the like. But the effective recognition of citizens as equal adults with the capacity to make political choices is a minimal condition for being a liberal democracy.", "options": ["Liberal democracies face challenges in fully realizing their ideals of freedom and equality, requiring a balance between these ideals, state power, and institutions to ensure the effective recognition of citizens as equal political decision-makers.", "Successful democracies balance freedom and equality while recognizing citizens as equal adults capable of making political choices, despite inherent conflicts between these ideals and the challenges posed by power imbalances and rights violations.", "Liberal democracies struggle to achieve their ideals of freedom and equality due to inherent conflicts and rights violations, necessitating a balance between individual freedom, political equality, and the institutions that constrain state power.", "To be considered a liberal democracy, a successful democracy must balance freedom and equality, and uphold the recognition of citizens as equal adults capable of making political choices, even in the face of rights violations and power imbalances."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span><b>Points:&nbsp;<\/b><\/span>\r<br />\r<br /><span>·<\/span><span>&nbsp;<\/span>\tReal-world liberal democracies struggle to fully uphold freedom and equality.&nbsp;\r<br /><span>·<\/span><span>&nbsp;<\/span>\tInherent conflicts exist between freedom and equality.&nbsp;\r<br /><span>·<\/span><span>&nbsp;<\/span>\tSuccessful democracy requires a balance between individual freedom & political equality, and between state and institutions.&nbsp;\r<br /><span>·<\/span><span>&nbsp;<\/span>\tEffective recognition of citizens as equal adults capable of making political choices is a minimal condition for being a liberal democracy.\r<br />\r<br /><span><b>Note:<\/b><\/span><span> Though there is also the point about democracies trying to do much more than the minimum requirement, it is not accommodated in any of the options. The essence of the passage is about the minimum requirements for something to be called a liberal democracy – bullet points 3 and 4 above.&nbsp;<\/span>\r<br />\r<br /><span>Option 1. Incorrect. While this option addresses some key points, it does not mention the inherent conflicts between freedom and equality, which is an important aspect of the passage.<\/span>\r<br /><span>Option 2. Correct. This option accurately and concisely summarizes the key points in the passage, including the challenges faced by liberal democracies, the inherent conflicts between freedom and equality, and the balance needed for a successful democracy.<\/span>\r<br /><span>Option 3. Incorrect. This option focuses mainly on the struggles faced by liberal democracies but does not emphasize the minimal condition for being a liberal democracy, which is an important aspect of the passage.<\/span>\r<br /><span>Option 4. Incorrect. Although this option includes the minimal condition for being a liberal democracy, it does not address the inherent conflicts between freedom and equality.<\/span>\r<br /><span>Hence, [2].<\/span", "topic": "Summary"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;
function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
