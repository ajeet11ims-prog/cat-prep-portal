<script type="application/json" id="test-data">{"testNumber": 15, "simcat": 15, "minutes": 40, "questions": [{"number": 1, "sourceId": "16970985048090", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br>Mainstream economic theory claims that without intellectual property protection, innovators lack the incentive to bring new products to market because they cannot recoup their costs. But in the collaborative commons, millions of innovators are defying this received wisdom, co-creating and using free open-source software, known as FOSS, as well as free open-source hardware, or FOSH. It’s a spirit embodied by Marcin Jakubowski, physicist and Missourian farmer, who – frustrated by the extortionate cost of farm machinery that kept breaking down – decided to build his own, while sharing his ever-improving designs online for free. His idea soon grew into the Global Village Construction Set, which demonstrates step-by-step how to build from scratch 50 universally useful machines, from tractors … to wind turbines. The designs have been recreated by innovators worldwide. Based on these successes, Jakubowski and his collaborators have since launched the Open Building Institute, which aims to make open-source designs for ecological, off-grid, affordable housing available to all. ‘Our goal is decentralized production,’ he explains. \r<br>\r<br>Open-source design also promises large social benefits and cost savings for state-funded institutions in every country, says Joshua Pearce, a leading academic and engineer in FOSH. His research into the economics of FOSH manufacturing finds that using open-source 3D printers and designs to produce essential scientific equipment … slashes costs, making such equipment far more affordable and accessible worldwide. ‘The conclusion,’ says Pearce, ‘is that FOSH development should be funded by organizations interested in maximizing return on public investments in technologies associated with science, medicine and education.’\r<br>The digital revolution has unleashed an era of collaborative knowledge creation that has the potential to radically decentralise the ownership of wealth. But, argues the commons theorist Michel Bauwens, it is unlikely to reach its potential without state support. Just as corporate capitalism has long depended on the backing of government policies, public funding, and pro-business legislation, so now the commons need the backing of a partner state whose aim is to enable the creation of common value. The state can start helping the knowledge commons to realise its potential in five key ways.\r<br>\r<br>First, invest in human ingenuity by teaching social entrepreneurship, problem-solving and collaboration in schools and universities worldwide: such skills will equip the next generation to innovate in open-source networks like no generation before them. Second, ensure that all publicly funded research becomes public knowledge, by contractually requiring it to be licensed in the knowledge commons…. Third, roll back the excessive reach of corporate intellectual property claims in order to prevent spurious patent and copyright applications from encroaching on the knowledge commons. Fourth, publicly fund the set-up of community maker-spaces – places where innovators can meet and experiment with shared use of 3D printers and essential tools for hardware construction. And lastly, encourage the spread of civic organisations – from cooperative societies to student groups and innovation clubs– because their interconnections turn into the very nodes that bring such peer-to-peer networks alive.", "passageTitle": "Reading Comprehension Passage", "question": "According to the passage, how do free open-source software (FOSS) and free open-source hardware (FOSH) challenge mainstream economic theory on intellectual property protection?", "options": ["By proving that FOSS and FOSH can be easily made available at no or low cost, making them accessible to a wide range of users.", "By demonstrating that FOSS and FOSH projects foster innovation and accelerate the development of new features and improvements.", "By showing that FOSS and FOSH can redeem costs without the need for intellectual property protection.", "By highlighting the irrelevance of intellectual property protection in maintaining a competitive market."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tOption 1. This option is incorrect because, although the passage does mention that FOSS and FOSH are often free, it does not focus on their accessibility or the challenge they pose to the mainstream economic theory on intellectual property protection in this context.\r<br /><span>Option 2. This option is incorrect because the passage does not specifically mention that FOSS and FOSH projects accelerate the development of new features and improvements. It does, however, talk about how millions of innovators are defying the mainstream economic theory by co-creating and using FOSS and FOSH.<\/span>\r<br /><span>Option 3. This is the correct answer. The passage states that \"millions of innovators are defying this received wisdom, co-creating and using free open-source software, known as FOSS, as well as free open-source hardware, or FOSH.\" This shows that innovators can still be successful without relying on intellectual property protection to recoup their costs, thus challenging the mainstream economic theory.<\/span>\r<br /><span>Option 4. This option is incorrect because the passage does not focus on the irrelevance of intellectual property protection in maintaining a competitive market. Instead, it discusses the success of FOSS and FOSH projects without the need for intellectual property protection.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Inference"}, {"number": 2, "sourceId": "16970985048131", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br>Mainstream economic theory claims that without intellectual property protection, innovators lack the incentive to bring new products to market because they cannot recoup their costs. But in the collaborative commons, millions of innovators are defying this received wisdom, co-creating and using free open-source software, known as FOSS, as well as free open-source hardware, or FOSH. It’s a spirit embodied by Marcin Jakubowski, physicist and Missourian farmer, who – frustrated by the extortionate cost of farm machinery that kept breaking down – decided to build his own, while sharing his ever-improving designs online for free. His idea soon grew into the Global Village Construction Set, which demonstrates step-by-step how to build from scratch 50 universally useful machines, from tractors … to wind turbines. The designs have been recreated by innovators worldwide. Based on these successes, Jakubowski and his collaborators have since launched the Open Building Institute, which aims to make open-source designs for ecological, off-grid, affordable housing available to all. ‘Our goal is decentralized production,’ he explains. \r<br>\r<br>Open-source design also promises large social benefits and cost savings for state-funded institutions in every country, says Joshua Pearce, a leading academic and engineer in FOSH. His research into the economics of FOSH manufacturing finds that using open-source 3D printers and designs to produce essential scientific equipment … slashes costs, making such equipment far more affordable and accessible worldwide. ‘The conclusion,’ says Pearce, ‘is that FOSH development should be funded by organizations interested in maximizing return on public investments in technologies associated with science, medicine and education.’\r<br>The digital revolution has unleashed an era of collaborative knowledge creation that has the potential to radically decentralise the ownership of wealth. But, argues the commons theorist Michel Bauwens, it is unlikely to reach its potential without state support. Just as corporate capitalism has long depended on the backing of government policies, public funding, and pro-business legislation, so now the commons need the backing of a partner state whose aim is to enable the creation of common value. The state can start helping the knowledge commons to realise its potential in five key ways.\r<br>\r<br>First, invest in human ingenuity by teaching social entrepreneurship, problem-solving and collaboration in schools and universities worldwide: such skills will equip the next generation to innovate in open-source networks like no generation before them. Second, ensure that all publicly funded research becomes public knowledge, by contractually requiring it to be licensed in the knowledge commons…. Third, roll back the excessive reach of corporate intellectual property claims in order to prevent spurious patent and copyright applications from encroaching on the knowledge commons. Fourth, publicly fund the set-up of community maker-spaces – places where innovators can meet and experiment with shared use of 3D printers and essential tools for hardware construction. And lastly, encourage the spread of civic organisations – from cooperative societies to student groups and innovation clubs– because their interconnections turn into the very nodes that bring such peer-to-peer networks alive.", "passageTitle": "Reading Comprehension Passage", "question": "Which of the following, if true, would best support Joshua Pearce's argument in the 2nd paragraph?", "options": ["Open-source 3D printed scientific equipment has higher maintenance cost compared to proprietary alternatives.", "The majority of scientific researchers tend to favor proprietary equipment because of its exclusive nature.", "The growth of the open-source hardware industry has no significant impact on innovation in the scientific community.", "State-funded institutions do not have enough budget to purchase proprietary scientific equipment without financial strain."], "answer": 3, "answerLabel": "D", "solution": "<\/span>\tOption 1. This option does not support Joshua Pearce's argument, as it presents a disadvantage of open-source 3D printed scientific equipment, indicating that it may have higher maintenance costs compared to proprietary alternatives.\r<br /><span>Option 2. This option also does not support the argument because it suggests that researchers prefer proprietary equipment, which contradicts the idea of promoting open-source design as a more affordable and accessible alternative.<\/span>\r<br /><span>Option 3. This option is not supportive of Pearce's argument, as it implies that the growth of the open-source hardware industry does not significantly impact innovation, which would not strengthen the case for funding FOSH development.<\/span>\r<br /><span>Option 4. This is the correct answer, as it highlights the financial constraints faced by state-funded institutions in purchasing proprietary scientific equipment. This situation supports Pearce's argument that open-source design can provide cost savings, making essential scientific equipment more affordable and accessible, thus making a stronger case for funding FOSH development.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Application Question"}, {"number": 3, "sourceId": "16970985048132", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br>Mainstream economic theory claims that without intellectual property protection, innovators lack the incentive to bring new products to market because they cannot recoup their costs. But in the collaborative commons, millions of innovators are defying this received wisdom, co-creating and using free open-source software, known as FOSS, as well as free open-source hardware, or FOSH. It’s a spirit embodied by Marcin Jakubowski, physicist and Missourian farmer, who – frustrated by the extortionate cost of farm machinery that kept breaking down – decided to build his own, while sharing his ever-improving designs online for free. His idea soon grew into the Global Village Construction Set, which demonstrates step-by-step how to build from scratch 50 universally useful machines, from tractors … to wind turbines. The designs have been recreated by innovators worldwide. Based on these successes, Jakubowski and his collaborators have since launched the Open Building Institute, which aims to make open-source designs for ecological, off-grid, affordable housing available to all. ‘Our goal is decentralized production,’ he explains. \r<br>\r<br>Open-source design also promises large social benefits and cost savings for state-funded institutions in every country, says Joshua Pearce, a leading academic and engineer in FOSH. His research into the economics of FOSH manufacturing finds that using open-source 3D printers and designs to produce essential scientific equipment … slashes costs, making such equipment far more affordable and accessible worldwide. ‘The conclusion,’ says Pearce, ‘is that FOSH development should be funded by organizations interested in maximizing return on public investments in technologies associated with science, medicine and education.’\r<br>The digital revolution has unleashed an era of collaborative knowledge creation that has the potential to radically decentralise the ownership of wealth. But, argues the commons theorist Michel Bauwens, it is unlikely to reach its potential without state support. Just as corporate capitalism has long depended on the backing of government policies, public funding, and pro-business legislation, so now the commons need the backing of a partner state whose aim is to enable the creation of common value. The state can start helping the knowledge commons to realise its potential in five key ways.\r<br>\r<br>First, invest in human ingenuity by teaching social entrepreneurship, problem-solving and collaboration in schools and universities worldwide: such skills will equip the next generation to innovate in open-source networks like no generation before them. Second, ensure that all publicly funded research becomes public knowledge, by contractually requiring it to be licensed in the knowledge commons…. Third, roll back the excessive reach of corporate intellectual property claims in order to prevent spurious patent and copyright applications from encroaching on the knowledge commons. Fourth, publicly fund the set-up of community maker-spaces – places where innovators can meet and experiment with shared use of 3D printers and essential tools for hardware construction. And lastly, encourage the spread of civic organisations – from cooperative societies to student groups and innovation clubs– because their interconnections turn into the very nodes that bring such peer-to-peer networks alive.", "passageTitle": "Reading Comprehension Passage", "question": "Which of the following measures would commons theorist Michel Bauwens be most likely to disapprove of?", "options": ["Promoting the establishment of various civic organizations to strengthen collaborative networks.", "Supporting the creation of public spaces for innovators to access shared tools and resources.", "Strengthening exclusivity of knowledge and ideas through stringent intellectual property protections.", "Advocating for the dissemination of publicly funded research findings within the knowledge commons."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tOption 1. Michel Bauwens would likely approve of this measure, as promoting the establishment of civic organizations aligns with his advocacy for collaboration and the growth of the knowledge commons. The passage mentions encouraging the spread of civic organizations as one of the ways to help the knowledge commons realize its potential.\r<br /><span>Option 2. Bauwens would also likely approve of this measure, as supporting the creation of public spaces for innovators to access shared tools and resources facilitates innovation and fosters the growth of the knowledge commons. The passage suggests publicly funding the setup of community maker-spaces as one of the key ways the state can help the knowledge commons.<\/span>\r<br /><span>Option 3. This is the correct answer, as Bauwens would most likely disapprove of this measure. Strengthening exclusivity through stringent intellectual property protections goes against the principles of the commons, which emphasize collaboration and shared resources. The passage suggests rolling back the excessive reach of corporate intellectual property claims to prevent encroachment on the knowledge commons.<\/span>\r<br /><span>Option 4. Bauwens would likely approve of this measure, as advocating for the dissemination of publicly funded research findings within the knowledge commons promotes openness, collaboration, and the growth of the commons. The passage recommends ensuring that all publicly funded research becomes public knowledge and is licensed in the knowledge commons.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Inference"}, {"number": 4, "sourceId": "16970985048133", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br>Mainstream economic theory claims that without intellectual property protection, innovators lack the incentive to bring new products to market because they cannot recoup their costs. But in the collaborative commons, millions of innovators are defying this received wisdom, co-creating and using free open-source software, known as FOSS, as well as free open-source hardware, or FOSH. It’s a spirit embodied by Marcin Jakubowski, physicist and Missourian farmer, who – frustrated by the extortionate cost of farm machinery that kept breaking down – decided to build his own, while sharing his ever-improving designs online for free. His idea soon grew into the Global Village Construction Set, which demonstrates step-by-step how to build from scratch 50 universally useful machines, from tractors … to wind turbines. The designs have been recreated by innovators worldwide. Based on these successes, Jakubowski and his collaborators have since launched the Open Building Institute, which aims to make open-source designs for ecological, off-grid, affordable housing available to all. ‘Our goal is decentralized production,’ he explains. \r<br>\r<br>Open-source design also promises large social benefits and cost savings for state-funded institutions in every country, says Joshua Pearce, a leading academic and engineer in FOSH. His research into the economics of FOSH manufacturing finds that using open-source 3D printers and designs to produce essential scientific equipment … slashes costs, making such equipment far more affordable and accessible worldwide. ‘The conclusion,’ says Pearce, ‘is that FOSH development should be funded by organizations interested in maximizing return on public investments in technologies associated with science, medicine and education.’\r<br>The digital revolution has unleashed an era of collaborative knowledge creation that has the potential to radically decentralise the ownership of wealth. But, argues the commons theorist Michel Bauwens, it is unlikely to reach its potential without state support. Just as corporate capitalism has long depended on the backing of government policies, public funding, and pro-business legislation, so now the commons need the backing of a partner state whose aim is to enable the creation of common value. The state can start helping the knowledge commons to realise its potential in five key ways.\r<br>\r<br>First, invest in human ingenuity by teaching social entrepreneurship, problem-solving and collaboration in schools and universities worldwide: such skills will equip the next generation to innovate in open-source networks like no generation before them. Second, ensure that all publicly funded research becomes public knowledge, by contractually requiring it to be licensed in the knowledge commons…. Third, roll back the excessive reach of corporate intellectual property claims in order to prevent spurious patent and copyright applications from encroaching on the knowledge commons. Fourth, publicly fund the set-up of community maker-spaces – places where innovators can meet and experiment with shared use of 3D printers and essential tools for hardware construction. And lastly, encourage the spread of civic organisations – from cooperative societies to student groups and innovation clubs– because their interconnections turn into the very nodes that bring such peer-to-peer networks alive.", "passageTitle": "Reading Comprehension Passage", "question": "<p>Which one of the following sets of terms best serves as keywords to the passage?<\/p>", "options": ["Intellectual property, open source, centralized production, corporate capitalism.", "Open-source, collaboration, commons theorist, decentralization, public funding.", "Proprietary software, patent protection, limited accessibility, private research.", "Competition, corporate control, knowledge monopolies, commons theory."], "answer": 1, "answerLabel": "B", "solution": "Option 1. This set of terms focuses more on the concepts that are in opposition to the ideas presented in the passage. The passage primarily discusses alternatives to intellectual property and centralized production, as well as promoting collaboration and open-source networks.\r<br /><span>Option 2.  This set of terms best represents the main ideas in the passage. It covers the central themes, such as open-source approaches to software and hardware, collaboration within the commons, the role of commons theorists like Michel Bauwens, the importance of decentralization, and the need for public funding to support the growth of the knowledge commons.<\/span>\r<br /><span>Option 3. This set of terms highlights aspects that the passage argues against. The passage promotes open-source approaches and increased accessibility, rather than focusing on proprietary software, patent protection, and limited accessibility.<\/span>\r<br /><span>Option4.  This set of terms emphasizes the negative consequences of competition, corporate control, and knowledge monopolies, (except commons theory) which the passage seeks to address through the promotion of open-source networks and collaboration. However, these terms do not capture the full range of ideas and solutions presented in the passage.&nbsp;<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Central Idea"}, {"number": 5, "sourceId": "16970985048134", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>Urbanization and changing physical environment are poor explanations for rising crime rates in developed countries after the 1960s. By 1960, the countries under consideration were already industrialized, urbanized societies; there was no sudden shift from countryside to city that began in 1965. In the United States, murder rates are much higher in the South than in the North, despite the fact that the latter tends to be more urban and densely populated. Japan, Korea, Hong Kong, and Singapore are among the most densely populated, overcrowded urban environments in the world, and yet they did not experience rising crime rates. Indeed, if we are to believe Jane Jacobs’s account of crime as inversely proportional to the number of “eyes on the street,” precisely the sorts of urban conditions said to breed crime, including crowded sidewalks and mixed-use neighborhoods, are for her exactly the reasons that crime is low in neighborhoods with plentiful social capital. We are back, in other words, to the social capital argument: crime increases because the social capital of a neighborhood or a society decreases, and vice versa.<br><br>Another explanation is sometimes euphemistically labeled “social heterogeneity.” That is, in many societies crime tends to be concentrated among racial or ethnic minorities. The reason that crime rates are frequently higher among minorities is very likely related to the fact that legitimate avenues of social mobility are blocked for them in ways that are not true for members of the majority community. In other cases, the simple fact of heterogeneity in itself may be to blame: neighborhoods that are too diverse culturally, linguistically, religiously, or ethnically never come together as communities able to enforce informal norms on their members… <br><br>A further explanation has to do with drugs. Based on the maturing of the baby boom cohort alone, we should have expected the decline in crime to occur in the late 1980s rather than in the late 1990s. One explanation for the continuation of high levels of violent crime, and for the sudden rapid drop in rates in the late 1990s, has to do with the introduction of crack cocaine in American cities in the mid-1980s and the subsequent stabilization of crack markets. This factor does not, however, explain the reasons for the initial growth of crime, only the crime wave’s prolongation. <br><br>The currently dominant school of contemporary American criminology holds that early childhood socialization is one of the most important factors determining the level of subsequent criminality. The vast majority of people obey the law, particularly with regard to serious offenses, out of habit that they learned relatively early in life. By contrast, most crimes are committed by repeat offenders who have failed to learn this basic level of self-control. In many cases, they are not acting rationally, but out of impulse. It is more useful to speak of “criminal careers” rather than individual acts of crime, since life courses were established by the way parents socialized their children at relatively early ages.<sup> <\/sup>A comprehensive survey of studies ue for members of the majority community. In other cases, the simple fact of heterogeneity in itself may be to blame: neighborhoods that are too diverse culturally, linguistically, religiously, or ethnically never come together as communities able to enforce informal norms on their members… <br><br>A further explanation has to do with drugs. Based on the maturing of the baby boom cohort alone, we should have expected the decline in crime to occur in the late 1980s rather than in the late 1990s. One explanation for the continuation of high levels of violent crime, and for the sudden rapid drop in rates in the late 1990s, has to do with the introduction of crack cocaine in American cities in the mid-1980s and the subsequent stabilization of crack markets. This factor does not, however, explain the reasons for the initial growth of crime, only the crime wave’s prolongation. <br><br>The currently dominant school of contemporary American criminology holds that early childhood socialization is one of the most important factors determining the level of subsequent criminality. The vast majority of people obey the law, particularly with regard to serious offenses, out of habit that they learned relatively early in life. By contrast, most crimes are committed by repeat offenders who have failed to learn this basic level of self-control. In many cases, they are not acting rationally, but out of impulse. It is more useful to speak of “criminal careers” rather than individual acts of crime, since life courses were established by the way parents socialized their children at relatively early ages.<sup> <\/sup>A comprehensive survey of studies linking family to crime confirmed that parents influence their children’s subsequent criminal behavior through neglect, conflict with the child, deviant behavior on the part of the parents themselves, and marital conflict and parental absence.", "passageTitle": "Reading Comprehension Passage", "question": "According to the author, the increas n the late 1990s.", "The baby boom cohort young adults in the late 1980s, had no discernible influence on crime rates throughout the 1980s and 1990s."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tOption 1. This option is incorrect, as the passage states that the decline in crime rates in the late 1990s was the result of the stabilization of the crack market.&nbsp;\r<br /><span>Option 2. This option is incorrect because the passage does not suggest that the introduction of crack cocaine caused the baby boom cohort to be more prone to criminal behavior. Instead, it explains that the introduction of crack cocaine contributed to the continuation of high levels of violent crime.<\/span>\r<br />Option 3. This option is correct because it accurately reflects the passage's description of the relationship between the baby boom cohort and crime rates, where the expected decline in crime rates did not occur in the late 1980s but only in the late 1990s.\r<br /><span>Option 4.  This option is incorrect because the passage does mention the baby boom cohort in relation to crime rates, with the expectation that crime rates would decline as the cohort matured<\/span><span>.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Specific Detail Question"}, {"number": 8, "sourceId": "16970985048147", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>Urbanization and changing physical environment are poor explanations for rising crime rates in developed countries after the 1960s. By 1960, the countries under consideration were already industrialized, urbanized societies; there was no sudden shift from countryside to city that began in 1965. In the United States, murder rates are much higher in the South than in the North, despite the fact that the latter tends to be more urban and densely populated. Japan, Korea, Hong Kong, and Singapore are among the most densely populated, overcrowded mining the level of subsequent criminality. The vast majority of people obey the law, particularly with regard to serious offenses, out of habit that they learned relatively early in life. By contrast, most crimes are committed by repeat offenders who have failed to learn this basic level of self-control. In many cases, they are not acting rationally, but out of impulse. It is more useful to speak of “criminal careers” rather than individual acts of crime, since life courses were established by the way parents socialized their children at relatively early ages.<sup> <\/sup>A comprehensive survey of studies linking family to crime confirmed that parents influence their children’s subsequent criminal behavior through neglect, conflict with the child, deviant behavior on the part of the parents themselves, and marital conflict and parental absence.", "passageTitle": "Reading Comprehension Passage", "question": "All of the following statements, if false, could be seen as being in accordance with the passage, EXCEPT:", "options": ["Changing physical environment due to urbanisation does not explain rise in crime.", "Social heterogeneity plays no role in crime rates among racial or ethnic minorities.", "The presence of social capital in neighborhoods has no influence on crime rates.", "The relationship between family and crime is unrelated to parental behavior."], "answer": 0, "answerLabel": "A", "solution": "<\/span>\tQuestion means:&nbsp;<span>Which of the following statements is in accordance with the passage?<\/span>\r<br /><span>Option 1. Exception. If false, it is not in accordance with the passage (as given at the beginning of the first paragraph).&nbsp;<\/span>\r<br /><span>Option 2. If false, it is in accordance with the passage, which suggests that social heterogeneity can contribute to higher crime rates among racial or ethnic minorities due to barriers to social mobility and lack of community cohesion.<\/span>\r<br /><span>Option 3. If false, it is in accordance with the passage, which argues that crime rates can be influenced by the social capital of a neighborhood or a society.<\/span>\r<br /><span>Option 4. If false, it is in accordance with the passage, which explains that parents influence their children's subsequent criminal behavior through neglect, conflict with the child, deviant behavior on the part of the parents themselves, and marital conflict and parental absence.<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Specific Detail Question"}, {"number": 9, "sourceId": "16970985048148", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>Some of the oldest stone tools ever found have offered a rare glimpse into the lives of early humans and their relatives. An archaeological excavation on the shore of Lake Victoria in Kenya has unearthed hundreds of stone tools and fossils dating to as early as three million years ago. These tools — found alongside teeth from human relatives and the butchered remains of ancient hippopotamus-like creatures — provide some of the first direct evidence that early hominins used stone tools to feed on large animals.<br><br>The site now joins a handful of others that have yielded tools dating back to the earliest adoption of stone technology. Gaps in the archaeological record have made it challenging to study toolmaking in our earliest ancestors. Hominins — the group of primates that includes Homo sapiens and its relatives — first started using tools at least 3.3 million years ago. Researchers know this because of stone tools unearthed at a single site in northern Kenya.<br><br>But the next known set of stone tools — called Oldowan tools — doesn’t pop up in the archaeological record for another 700,000 years. This type of tool eventually became widespread across Africa and into Asia. But the dearth of artefacts from between the two early sites means that finding out how tools were made and used during this period of almost one million years is a challenge.<br><br>The site in Kenya is now offering some fresh insights… The crew started excavating at the new site in 2015. They unearthed 330 artefacts, including 42 Oldowan stone tools scattered around the bones of an ancestral hippo. Some of the hippo bones, as well as other animal remains at the site, bore signs of being cut and scraped by stone implements. This also pushes back the known start of large-animal butchering by hominins by at least 600,000 years. Microanalysis of some of the tools suggested some were used to pound plant material, possibly hard roots or tubers.<br><br>These findings suggest that stone tools were crucial for accessing hard-to-get foods, says Thomas Plummer, a palaeoanthropologist at Queens College, City University of New York in Flushing. Early hominins would have been limited by what they could tear with their hands and teeth, he says. Stone tools “allowed them to work food outside of their mouths”.<br><br>Stone tools and fossilized animal bones weren’t the only remains to come out of the site. The researchers also stumbled on a tooth that belonged to an ancient relative of humans from a genus called Paranthropus. Its presence near the hippo carcasses — along with another Paranthropus tooth also found at the site — raises the possibility that it might have been members of Paranthropus, rather than of the modern-human genus Homo, that used some of the stone tools at the site to butcher the animals.<br><br>It isn’t that surprising that other hominin lineages might have made tools, considering that the first known tools pre-date the emergence of Homo. But there is scepticism. “I personally do not believe that Paranthropus made Oldowan tools,” says Mohamed Sahnouni, a palaeolithic archaeologist at the National Research Centre on Human Evolution in Burgos, Spain. He says that the hominin’s anatomy suggests that it was well adapted to eating coarse foods and might not have needed to master tool use. However, Sahnouni adds that the finds are still “a major breakthrough”.", "passageTitle": "Reading Comprehension Passage", "question": "Which of the following most accurately describes the current archaeological record of stone tools?", "options": ["Stone tools have been found consistently throughout the entire hominin timeline, without any gaps in the archaeological record.", "The first stone tools discovered date back to 3.3 million years ago, with the next known set of Oldowan tools dating back to a 2.6 million years.", "Oldowan tools are the earliest known stone tools, with no evidence of earlier tool use by hominins.", "All of the archaeological evidence of stone tools used by hominin lineages that is currently available was excavated from various sites in Kenya."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\tOption 1. This option is incorrect because there are gaps in the archaeological record of stone tools. For example, there is a gap of 2.6 million years between the first known stone tools and the next set of Oldowan tools.&nbsp;\r<br /><span>Option 2. This option is correct. The first known stone tools date back to 3.3 million years ago, (current discovery dates back to 3 million years) and there is a gap of 2.6 million years before the next set of Oldowan tools - 700,000 years ( refer to “finding out how tools were made and used during this period of almost one million years is a challenge.”)<\/span>\r<br /><span>Option 3. This option is incorrect. There is evidence of earlier tool use by hominins, such as the tools that date back to 3.3 million years ago.<\/span>\r<br /><span>Option 4. This option is incorrect because while archaeological sites in Kenya have yielded important findings of hominin tools, we do not know where the Oldowan tools were excavated. Passage mentions they were widespread in Africa and Asia.&nbsp;<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Specific Detail Question"}, {"number": 10, "sourceId": "169 ght not have needed to master tool use due to their anatomy being well adapted to eating coarse foods. Thus, he suggests that the Homo genus might be the exclusive users of Oldowan tools at the site.\r<br />Option 2. This option is incorrect because Sahnouni's scepticism is not about the timing of the emergence of Oldowan tools. The passage does mention that the first known tools pre-date the emergence of Homo, but this point is not directly related to Sahnouni's scepticism.\r<br /><span>Option 3. This option is incorrect because Sahnouni's scepticism focuses on the idea that Paranthropus might not have needed to use tools, and he does not claim that Paranthropus was solely responsible for the development and use of Oldowan tools.<\/span>\r<br /><span>Option 4. This option is incorrect because Sahnouni's scepticism is about the association between Paranthropus and Oldowan tools, not the presence of Paranthropus teeth at the site. The passage raises the possibility that Paranthropus might have used some of the stone tools for butchering animals, but Sahnouni does not believe Paranthropus made Oldowan tools.<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Inference"}, {"number": 12, "sourceId": "169709850481611", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>Some of the oldest stone tools ever found have offered a rare glimpse into the lives of early humans and their relatives. An archaeological excavation on the shore of Lake Victoria in Kenya has unearthed hundreds of stone tools and fossils dating to as early as three million years ago. These tools — found alongside teeth from human relatives and the butchered remains of ancient hippopotamus-like creatures — provide some of the first direct evidence that early hominins used stone tools to feed on large animals.<br><br>The site now joins a handful of others that have yielded tools dating back to the earliest adoption of ite — raises the possibility that it might have been members of Paranthropus, rather than of the modern-human genus Homo, that used some of the stone tools at the site to butcher the animals.<br><br>It isn’t that surprising that other hominin lineages might have made tools, considering that the first known tools pre-date the emergence of Homo. But there is scepticism. “I personally do not believe that Paranthropus made Oldowan tools,” says Mohamed Sahnouni, a palaeolithic archaeologist at the National Research Centre on Human Evolution in Burgos, Spain. He says that the hominin’s anatomy suggests that it was well adapted to eating coarse foods and might not have needed to master tool use. However, Sahnouni adds that the finds are still “a major breakthrough”.", "passageTitle": "Reading Comprehension Passage", "question": "Which one of the following statements, if false, could be seen as contradicting the facts/arguments in the passage?", "options": ["There is no definitive evidence of stone tool use among early hominins that date back to 3.3 million years.", "Oldowan stone tools were assumed to be the first-ever evidence for the use of stone tools for butchering animals.", "Evidence from excavations at the new site in Kenya, starting in 2015 challenges the date of first-ever use of stone tools early hominins.", "The archaeological excavation on the shore of Lake Victoria in Kenya leaves a million-year gap in the archaeological record."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\tThe question stem indicates that 3 options will be false – in falsified they will not contradict, and one option will be true (as per the passage). This option, if falsified contradicts the passage and will eb answer choice. In short, the true statement will be the answer.&nbsp;\r<br /><span>Option 1. This is a false statement. Hence not the answer. The passage states that researchers know hominins first started using tools at least 3.3 million years ago because of stone tools e telescope released its third full set of data, called DR3. DR3 also included stellar spectra—measurements of how bright a star is at different wavelengths of light. These spectrometry measurements are commonly used to examine the chemical elements inside a star. As the universe ages, hydrogen-rich stars detonate into supernovas and die, spewing out elements such as carbon and oxygen. This material then coalesces into new, heavier-element stars, also known as metal-rich stars. So more recent stars are metal-rich, and metal-poor stars must have originated in the proto-galaxy.<br><br>When the team saw the Gaia DR3 data, however, they were disappointed to discover that the spectrometer readings were too broad to reveal individual chemical peaks. So the team turned to machine learning to extract the signals of heavier elements from the noisy, low-resolution spectra. They used an off-the-shelf algorithm called XGBoost, and trained it using high-quality spectral data from other surveys. The team whittled down a population of 1.5 million stars to about 18,000 early stars with low metallicity located in the Milky Way’s bulge. <br><br>The researchers still needed to answer at least one more question: Where were the proto-galaxy’s stars headed? The answer came from another type of measurement newly available in the Gaia DR3 release—the speed at which the stars are moving along our line of sight. Knowing this velocity made it possible to uncover each star’s orbit. What emerged was a portrait of a halo-shaped proto-galaxy, as anticipated by some theorists. The population of elderly, metal-poor stars orbited in a small, tight sphere with a radius of 9,000 light-years, which the team dubbed the “poor old heart” of the Milky Way. Overall, the findings suggest that the proto-galaxy didn’t steal stars from other galaxies. If it had, their stellar orbits would be headed toward regions beyond the Milky Way.<br><br>In 2022, two papers hinted at a timeline for the Milky Way’s disk formation. The theory goes that after the proto-galaxy arose, the region “simmered,” collecting gas and creating metal-poor stars. After a billion years, the emergent galaxy “boiled,” frantically giving birth to metal-rich stars for 2 billion to 3 billion years. These newer stars were different. They followed flatter orbits. As the galaxy cooled down, a razor-thin disk formed, filled with the newly minted stars (including our sun) moving in tidy circular orbits around the galactic center. The 1.5 million stars in Chandra’s data set confirmed this timeline…", "passageTitle": "Reading Comprehension Passage", "question": "Which of the following statements best captures the main idea of the passage?", "options": ["The passage describes the two main theories proposed to explain the origin of the Milky Way from a turbulent proto-galaxy.", "The passage outlines the discovery of the Milky Way's earliest star population and how it provides insights into the galaxy's formation.", "The passage focuses on the DR3 data and XGBoost algorithm that identified low-metallicity stars which explained the formation of the Milky Way's bulge.", "The passage discusses how the proto-galaxy contributed to the production of heavier elements that influenced the formation of the Milky Way galaxy."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\tOption 1. Although the passage does mention the two main theories, it mainly focuses on the discovery of the earliest star population and how it provides insights into the galaxy's formation, making this option not the best choice.\r<br /><span>Option 2. This option accurately captures the main idea of the passage, as it discusses the discovery of the earliest star population and its significance in understanding the Milky Way's formation.<\/span>\r<br /><span>Option 3. While the passage does discuss the DR3 data and the XGBoost algorithm, these details are part of the broader story about the discovery of the Milky Way's earliest star population and its implications for understanding the galaxy's formation. This option only focuses on a specific aspect of the passage.<\/span>\r<br /><span>Option 4. The passage briefly touches on the production of heavier elements, but the main focus is on the discovery of the earliest star population and how it offers insights into the galaxy's formation. This option does not capture the main idea of the passage.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Central Idea"}, {"number": 14, "sourceId": "169709850481713", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>Astronomers believe that the Milky Way was preceded by something called a proto-galaxy—a violent, chaotic place containing young stars with wild orbits. “People didn’t have a really good idea of what the proto-galaxy looked like,” said Vedant Chandra, an astrophysicist at Harvard University and one of the lead authors on a recent paper detailing the ancient star discoveries.<br><br>By the 2000s, scientists had settled on two formation theories. Either the proto-galaxy gave birth to the Milky Way’s first stars internally, as gas coalesced into stars, or it cannibalized other galaxies, ripping out stars and siphoning off dark matter. To settle the question, astronomers would need to isolate the Milky Way’s earliest star population. Studies identified candidate stars, but if the internal-nursery theory was correct, a much larger fossil population lay undiscovered.<br><br>The opportunity to find them arrived in 2022 when the European Space Agency’s Gaia space telescope released its third full set of data, called DR3. DR3 also included stellar spectra—measurements of how bright a star is at different wavelengths of light. These spectrometry measurements are commonly used to examine the chemical elements inside a star. As the universe ages, hydrogen-rich stars detonate into supernovas and die, spewing out elements such as c s role in advancing our understanding of the Milky Way's formation.&nbsp;<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Inference"}, {"number": 15, "sourceId": "169709850481714", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>Astronomers believe that the Milky Way was preceded by something called a proto-galaxy—a violent, chaotic place containing young stars with wild orbits. “People didn’t have a really good idea of what the proto-galaxy looked like,” said Vedant Chandra, an astrophysicist at Harvard University and one of the lead authors on a recent paper detailing the ancient star discoveries.<br><br>By the 2000s, scientists had settled on two formation theories. Either the proto-galaxy gave birth to the Milky Way’s first stars internally, as gas coalesced into stars, or it cannibalized other galaxies, ripping out stars and siphoning off dark matter. To settle the question, astronomers would need to isolate the Milky Way’s earliest star population. Studies identified candidate stars, but if the internal-nursery theory was correct, a much larger fossil population lay undiscovered.<br><br>The opportunity to find them arrived in 2022 when the European Space Agency’s Gaia space telescope released its third full set of data, called DR3. DR3 also included stellar spectra—measurements of how bright a star is at different wavelengths of light. These spectrometry measurements are commonly used to examine the chemical elements inside a star. As the universe ages, hydrogen-rich stars detonate into supernovas and die, spewing out elements such as carbon and oxygen. This material then coalesces into new, heavier-element stars, also known as metal-rich stars. So more recent stars are metal-rich, and metal-poor stars must have originated in the proto-galaxy.<br><br>When the team saw the Gaia DR3 data, however, they were disappointed to discover that the spectrometer readings were
