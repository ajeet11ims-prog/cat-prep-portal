<script type="application/json" id="test-data">{"testNumber": 16, "simcat": 1, "minutes": 40, "questions": [{"number": 1, "sourceId": "34009", "type": "mcq", "passage": "<p>Ants are famously collaborative. But they are also fiercely competitive. Workers from the same colony sacrifice their own reproductive opportunities to boost that of a single queen or, occasionally, a small ruling council. But they vigorously defend the patch on which their nest sits – often to the death. Unless, that is, they are Argentine ants in Europe.<\/p><p>It has been known for some time that this species, although normally aggressive in its native habitat, has relaxed into placid mutual toleration in the laid-back environment of the Mediterranean. But until Tatiana Giraud, of the University of Lausanne, and her colleagues started probing, it was not realized just how far this toleration extended.<\/p><p>Dr. Giraud collected workers from 33 Argentine-ant nests scattered along the Mediterranean coasts of Italy, France and Spain, and the Atlantic coasts of Spain and Portugal. Measured along the coastline, the extremities of this distribution are 6,000 km apart. Ants from different nests were then paired off to see if they would tolerate each other, or fight. Some 30 of the nests proved to be mutually tolerant. The other three were also mutually tolerant, but they fought to the death with workers from the larger group. Argentine ants in Europe seem, therefore, to belong to two separate but widespread 'supercolonies', the larger of which is the biggest collaborative society in the known living world.<\/p><p>Such chumminess is quite disturbing to evolutionary biologists. The willingness of worker ants to delegate reproduction to their queens was hard enough to explain until, in the 1960s, a biologist called William Hamilton came up with the idea of 'kin selection'. This showed that, besides the usual way of passing genes to the next generation by mating and reproducing, an individual can increase its genetic footprint in the future by helping close relatives to raise young, so long as the cost of doing so is not too high.<\/p><p>That helps to explain human nepotism. But it applies particularly strongly to ants (and also to bees and wasps), because they have a peculiar form of genetic inheritance in which females (and only females) share more genes with their sisters than with their daughters. Helping your mother (i.e. the colony's queen) to raise female offspring thus makes better genetic sense than breeding yourself. That, in turn, explains why the sterile workers in these species are always female.<\/p><p>There is, however, no theory involving kin selection that explains why unrelated neighbouring colonies should collaborate. And there is certainly no reason why unrelated colonies thousands of kilometres apart should do so. The assumption, therefore, had been that these colonies would turn out to be closely related. That might make sense for an introduced species: it could be the result of a single introduction, or rather of two introductions, one for each supercolony. But this assumption turns out to be wrong.<\/p><p>The researchers have come up with a different hypothesis, of sorts. This is that the introduced ants, now liberated from the parasites and competitors of their native land, have become abnormally abundant. In these circumstances, aggression towards others of their species might become a positive liability if it caused them to spend too much time fighting and not enough gathering food for the nest. Dr. Giraud proposes that natural selection might cause convergence in the genetic characteristics by which ants tell relatives from aliens, so as to reduce the amount of fighting. But since nobody knows precisely what those characteristics are, it is impossible to test this hypothesis.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>The passage given below is followed by a set of questions. Choose the correct answer to each question.<\/strong><\/p><\/div><p> Which of the following facts about ants is NOT stated in this passage?<\/p>", "options": ["<p>They have a very strong sense of community.<\/p>", "<p>They collaborate well with almost all species.<\/p>", "<p>They are aggressive defenders of their territory.<\/p>", "<p>They have a peculiar form of genetic inheritance.<\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p>Refer to the first paragraph: [1] and [3] are categorically stated. Refer to the fifth paragraph: [4] is given. Though the passage talks about ants being 'famously collaborative', it is given only in relation to their own species, and not all species. Hence, [2].<\/p>", "topic": "Specific Detail"}, {"number": 2, "sourceId": "34010", "type": "mcq", "passage": "<p>Ants are famously collaborative. But they are also fiercely competitive. Workers from the same colony sacrifice their own reproductive opportunities to boost that of a single queen or, occasionally, a small ruling council. But they vigorously defend the patch on which their nest sits – often to the death. Unless, that is, they are Argentine ants in Europe.<\/p><p>It has been known for some time that this species, although normally aggressive in its native habitat, has relaxed into placid mutual toleration in the laid-back environment of the Mediterranean. But until Tatiana Giraud, of the University of Lausanne, and her colleagues started probing, it was not realized just how far this toleration extended.<\/p><p>Dr. Giraud collected workers from 33 Argentine-ant nests scattered along the Mediterranean coasts of Italy, France and Spain, and the Atlantic coasts of Spain and Portugal. Measured along the coastline, the extremities of this distribution are 6,000 km apart. Ants from different nests were then paired off to see if they would tolerate each other, or fight. Some 30 of the nests proved to be mutually tolerant. The other three were also mutually tolerant, but they fought to the death with workers from the larger group. Argentine ants in Europe seem, therefore, to belong to two separate but widespread 'supercolonies', the larger of which is the biggest collaborative society in the known living world.<\/p><p>Such chumminess is quite disturbing to evolutionary biologists. The willingness of worker ants to delegate reproduction to their queens was hard enough to explain until, in the 1960s, a biologist called William Hamilton came up with the idea of 'kin selection'. This showed that, besides the usual way of passing genes to the next generation by mating and reproducing, an individual can increase its genetic footprint in the future by helping close relatives to raise young, so long as the cost of doing so is not too high.<\/p><p>That helps to explain human nepotism. But it applies particularly strongly to ants (and also to bees and wasps), because they have a peculiar form of genetic inheritance in which females (and only females) share more genes with their sisters than with their daughters. Helping your mother (i.e. the colony's queen) to raise female offspring thus makes better genetic sense than breeding yourself. That, in turn, explains why the sterile workers in these species are always female.<\/p><p>There is, however, no theory involving kin selection that explains why unrelated neighbouring colonies should collaborate. And there is certainly no reason why unrelated colonies thousands of kilometres apart should do so. The assumption, therefore, had been that these colonies would turn out to be closely related. That might make sense for an introduced species: it could be the result of a single introduction, or rather of two introductions, one for each supercolony. But this assumption turns out to be wrong.<\/p><p>The researchers have come up with a different hypothesis, of sorts. This is that the introduced ants, now liberated from the parasites and competitors of their native land, have become abnormally abundant. In these circumstances, aggression towards others of their species might become a positive liability if it caused them to spend too much time fighting and not enough gathering food for the nest. Dr. Giraud proposes that natural selection might cause convergence in the genetic characteristics by which ants tell relatives from aliens, so as to reduce the amount of fighting. But since nobody knows precisely what those characteristics are, it is impossible to test this hypothesis.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>The passage given below is followed by a set of questions. Choose the correct answer to each question.<\/strong><\/p><\/div><p> Which of the following correctly captures the gist of the passage?<\/p>", "options": ["<p>Argentine ants in Europe tolerate almost all other European Argentine ants, even those from colonies. Scientists are still trying to understand this peculiar behaviour.<\/p>", "<p>Though ants are very collaborative, Argentine ants take this behaviour to extremes. Scientists have been coming up with a variety of hypotheses to explain this.<\/p>", "<p>Argentine ants in Europe cooperate with other European ants. This behaviour is very unusual and scientists are still trying to explain it.<\/p>", "<p>Argentine ants in Europe are very closely related, which is why they tolerate each other, but not other ants. Scientists are still trying to learn more about this behaviour.<\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p>This passage is specifically about Argentine ants found in Europe, not Argentine ants in general, so [2], which fails to make this distinction, is wrong. Refer to paragraphs 2 and 3 – the European Argentine ants tolerate European Argentine ants from other nests, not other types of European ants. So [3] is also wrong. The first sentence of  [4] is said to be false in paragraph 6, so [4] is also ruled out. Only [1] includes all the vital points correctly. Hence, [1].<\/p>", "topic": "Central Idea"}, {"number": 3, "sourceId": "34011", "type": "mcq", "passage": "<p>Ants are famously collaborative. But they are also fiercely competitive. Workers from the same colony sacrifice their own reproductive opportunities to boost that of a single queen or, occasionally, a small ruling council. But they vigorously defend the patch on which their nest sits – often to the death. Unless, that is, they are Argentine ants in Europe.<\/p><p>It has been known for some time that this species, although normally aggressive in its native habitat, has relaxed into placid mutual toleration in the laid-back environment of the Mediterranean. But until Tatiana Giraud, of the University of Lausanne, and her colleagues started probing, it was not realized just how far this toleration extended.<\/p><p>Dr. Giraud collected workers from 33 Argentine-ant nests scattered along the Mediterranean coasts of Italy, France and Spain, and the Atlantic coasts of Spain and Portugal. Measured along the coastline, the extremities of this distribution are 6,000 km apart. Ants from different nests were then paired off to see if they would tolerate each other, or fight. Some 30 of the nests proved to be mutually tolerant. The other three were also mutually tolerant, but they fought to the death with workers from the larger group. Argentine ants in Europe seem, therefore, to belong to two separate but widespread 'supercolonies', the larger of which is the biggest collaborative society in the known living world.<\/p><p>Such chumminess is quite disturbing to evolutionary biologists. The willingness of worker ants to delegate reproduction to their queens was hard enough to explain until, in the 1960s, a biologist called William Hamilton came up with the idea of 'kin selection'. This showed that, besides the usual way of passing genes to the next generation by mating and reproducing, an individual can increase its genetic footprint in the future by helping close relatives to raise young, so long as the cost of doing so is not too high.<\/p><p>That helps to explain human nepotism. But it applies particularly strongly to ants (and also to bees and wasps), because they have a peculiar form of genetic inheritance in which females (and only females) share more genes with their sisters than with their daughters. Helping your mother (i.e. the colony's queen) to raise female offspring thus makes better genetic sense than breeding yourself. That, in turn, explains why the sterile workers in these species are always female.<\/p><p>There is, however, no theory involving kin selection that explains why unrelated neighbouring colonies should collaborate. And there is certainly no reason why unrelated colonies thousands of kilometres apart should do so. The assumption, therefore, had been that these colonies would turn out to be closely related. That might make sense for an introduced species: it could be the result of a single introduction, or rather of two introductions, one for each supercolony. But this assumption turns out to be wrong.<\/p><p>The researchers have come up with a different hypothesis, of sorts. This is that the introduced ants, now liberated from the parasites and competitors of their native land, have become abnormally abundant. In these circumstances, aggression towards others of their species might become a positive liability if it caused them to spend too much time fighting and not enough gathering food for the nest. Dr. Giraud proposes that natural selection might cause convergence in the genetic characteristics by which ants tell relatives from aliens, so as to reduce the amount of fighting. But since nobody knows precisely what those characteristics are, it is impossible to test this hypothesis.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>The passage given below is followed by a set of questions. Choose the correct answer to each question.<\/strong><\/p><\/div><p> Why do evolutionary biologists find the 'chumminess' among Argentine ants disturbing?<\/p>", "options": ["<p>Because this would overturn the existing classification.<\/p>", "<p>Because it is difficult to explain such unusual behaviour.<\/p>", "<p>Because kin selection in itself is an unverifiable theory.<\/p>", "<p>Because it adds to the mystery of worker ants' sterility.<\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p>Option [1] is neither given nor implied. Refer to the fourth paragraph: 'The willingness of worker ants to delegate reproduction to their queens was hard enough to explain...'. This implies that 'chumminess' among Argentine ants is even more difficult. This negates [3], which is a distracter, and implies [2]. Note that [4] is no longer a mystery – the kin selection theory explains it. Hence, [2].<\/p>", "topic": "Specific Detail"}, {"number": 4, "sourceId": "34415", "type": "mcq", "passage": "<p>How many words are there in the English language? No one knows. But that hasn't stopped an operation known as the Global Language Monitor from estimating that – as of this writing – there are exactly 988,968 words in English. GLM has done a remarkable job suckering even the respectable press into believing that we're on the verge of adding the millionth word to English. Even so, its claim is a bogus one.<\/p><p><br />The problem with trying to number the words in any language is that it's very hard to agree on the basics. For example, what is a word? If <em>run<\/em> is a verb, is the noun <em>run<\/em> another word? What about the inflected forms <em>ran, runs,<\/em> and<em> running<\/em>? What about words with run as a base, such as <em>runner<\/em> and <em>runoff<\/em> and <em>runway<\/em>? Are compounds, such as <em>man-bites-dog<\/em>, <em>man-child<\/em>, <em>man-eater<\/em>,<em> manhandle,<\/em> <em>man-hour<\/em>, <em>man of God<\/em>, <em>man's man<\/em>, and <em>men in black<\/em>, to be counted once or many times?<br /> <br />Another question: What is English? The word veal, borrowed from French in the 14th century, seems to be English, as does <em>spaghetti<\/em>, a 19th-century Italian borrowing. But what about<em> pho<\/em>, a Vietnamese soup found from the 1930s but only recently common? What about <em>shurpa<\/em>, a Bukharian soup, which can apparently be eaten in New York? What about words used by non-native English speakers in Singlish (Singapore Colloquial English)?<br /> <br />Even sticking with something that we can agree is English, what about obsolete words? Variant spellings? Regional dialects? What about words that are widespread, but only in a highly limited subgroup, such as <em>hog<\/em> 'a guitar having a mahogany top, back, and sides', used among collectors of vintage guitars? What about <em>Giant<\/em>, 'a player on the N.Y. Giants football team'? The most comprehensive abbreviations-dictionaries include about 500,000 entries, most of which wouldn't be found in standard dictionaries. The American Chemical Society has a registry of over 84 million named chemical substances, and there are about a million named species of insects alone; surely these must count as words?<br /> <br />What about obvious forms? Dictionaries include <em>great-grandfather<\/em> but not <em>great-great-great-great-great-great-grandfather<\/em>, which is real enough to get over 3,500 Google hits. Only the most basic numbers are typically included; Merriam-Webster, for example, includes <em>twenty-one<\/em> and <em>twenty-two<\/em>, but not <em>twenty-three<\/em> or <em>thirty-one<\/em>. In fact, if you were to count every number between 0 and 999,999 as a word, you'd have a cool million right there – and still have the rest of infinity (not to mention the rest of the English language) to account for.<br /> <br />College-size dictionaries typically include almost 200,000 words (using a formula that counts each separately listed word or word-form); unabridged dictionaries from 300,000 to 600,000 or so. But each of these words is listed not for any intrinsic reason, but because a lexicographer decided it was useful to include. <em>Twenty-three<\/em> is just as real a number as <em>twenty-two<\/em>, but it doesn't have a common bullet calibre associated with it, so it often gets left out. Team names, as a class, generally fail to make the cut. We could always add words to the dictionary if there were no limitations on time or space.<br /> <br />It's probably possible to devise criteria that would allow us to conclude that there are about a million words in English. But there's no possible way to count the actual number of words in the language, and the idea of having a running counter, as is found on GLM's home page, is absurd. So, why have journalists fallen for the claim? I think it's the pseudo-scientific nature of GLM's 'methodology': the company claims to use an 'algorithm', so its figures must be right. I recently got a call about GLM from a reporter, and when I explained why the million-word claim is bogus, he practically shouted, 'But they have an algorithm!'<br /> <br />And they'll have a good party in a few months' time, for the credulous among us.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>The passage given below is followed by a set of questions. Choose the best answer to each question.<\/strong><\/p><\/div><p> This passage begins with a question: 'How many words are there in the English language?' How is this question answered in the rest of the passage?<\/p>", "options": ["<p>The answer is summed up in the second sentence itself: 'No one knows.'<\/p>", "<p>The author shows that it is difficult, if not impossible, to answer this, as dictionaries differ in the number and type of words they include.<\/p>", "<p>The author goes on to show that it is impossible to know this at any point in time, as the very idea of what constitutes a standard English word is fluid.<\/p>", "<p>The author shows that, depending on the criteria, one could say that there are about a million words in English, but nothing more precise than that.<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p>Options [1], [2] and [4] are only partial answers. [1] does not give any reason <em>why <\/em>'no one knows', whereas the rest of the passage does. The words included in dictionaries are just lexicographers' judgement calls, and are not based on any objective data, so [2] cannot provide a complete answer. The figure 'one million' is just one of the many possible figures one can arrive at. But refer to paragraphs 2, 3 and 4: [3] sums up the point the author is trying to make. Hence, [3].<\/p>", "topic": "Application Question"}, {"number": 5, "sourceId": "34416", "type": "mcq", "passage": "<p>How many words are there in the English language? No one knows. But that hasn't stopped an operation known as the Global Language Monitor from estimating that – as of this writing – there are exactly 988,968 words in English. GLM has done a remarkable job suckering even the respectable press into believing that we're on the verge of adding the millionth word to English. Even so, its claim is a bogus one.<\/p><p><br />The problem with trying to number the words in any language is that it's very hard to agree on the basics. For example, what is a word? If <em>run<\/em> is a verb, is the noun <em>run<\/em> another word? What about the inflected forms <em>ran, runs,<\/em> and<em> running<\/em>? What about words with run as a base, such as <em>runner<\/em> and <em>runoff<\/em> and <em>runway<\/em>? Are compounds, such as <em>man-bites-dog<\/em>, <em>man-child<\/em>, <em>man-eater<\/em>,<em> manhandle,<\/em> <em>man-hour<\/em>, <em>man of God<\/em>, <em>man's man<\/em>, and <em>men in black<\/em>, to be counted once or many times?<br /> <br />Another question: What is English? The word veal, borrowed from French in the 14th century, seems to be English, as does <em>spaghetti<\/em>, a 19th-century Italian borrowing. But what about<em> pho<\/em>, a Vietnamese soup found from the 1930s but only recently common? What about <em>shurpa<\/em>, a Bukharian soup, which can apparently be eaten in New York? What about words used by non-native English speakers in Singlish (Singapore Colloquial English)?<br /> <br />Even sticking with something that we can agree is English, what about obsolete words? Variant spellings? Regional dialects? What about words that are widespread, but only in a highly limited subgroup, such as <em>hog<\/em> 'a guitar having a mahogany top, back, and sides', used among collectors of vintage guitars? What about <em>Giant<\/em>, 'a player on the N.Y. Giants football team'? The most comprehensive abbreviations-dictionaries include about 500,000 entries, most of which wouldn't be found in standard dictionaries. The American Chemical Society has a registry of over 84 million named chemical substances, and there are about a million named species of insects alone; surely these must count as words?<br /> <br />What about obvious forms? Dictionaries include <em>great-grandfather<\/em> but not <em>great-great-great-great-great-great-grandfather<\/em>, which is real enough to get over 3,500 Google hits. Only the most basic numbers are typically included; Merriam-Webster, for example, includes <em>twenty-one<\/em> and <em>twenty-two<\/em>, but not <em>twenty-three<\/em> or <em>thirty-one<\/em>. In fact, if you were to count every number between 0 and 999,999 as a word, you'd have a cool million right there – and still have the rest of infinity (not to mention the rest of the English language) to account for.<br /> <br />College-size dictionaries typically include almost 200,000 words (using a formula that counts each separately listed word or word-form); unabridged dictionaries from 300,000 to 600,000 or so. But each of these words is listed not for any intrinsic reason, but because a lexicographer decided it was useful to include. <em>Twenty-three<\/em> is just as real a number as <em>twenty-two<\/em>, but it doesn't have a common bullet calibre associated with it, so it often gets left out. Team names, as a class, generally fail to make the cut. We could always add words to the dictionary if there were no limitations on time or space.<br /> <br />It's probably possible to devise criteria that would allow us to conclude that there are about a million words in English. But there's no possible way to count the actual number of words in the language, and the idea of having a running counter, as is found on GLM's home page, is absurd. So, why have journalists fallen for the claim? I think it's the pseudo-scientific nature of GLM's 'methodology': the company claims to use an 'algorithm', so its figures must be right. I recently got a call about GLM from a reporter, and when I explained why the million-word claim is bogus, he practically shouted, 'But they have an algorithm!'<br /> <br />And they'll have a good party in a few months' time, for the credulous among us.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>The passage given below is followed by a set of questions. Choose the best answer to each question.<\/strong><\/p><\/div><p> Judging by the criteria given in this passage, which of the following words is least likely to be included in an abridged English dictionary?<\/p>", "options": ["<p>The name of a basic number, like 'billion'<\/p>", "<p>The name of an actual relationship, like 'great-great-great aunt'<\/p>", "<p>The name of a common chemical, like 'Sodium Chloride' (common salt)<\/p>", "<p>A word like 'croissant', which is commonly used in contemporary English, but which is of French origin<\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p>Refer to paragraph 5 – 'basic numbers are typically included' in dictionaries, so [1] is fairly likely to be found even in an abridged dictionary. According to paragraph 4, the names of the vast majority of chemicals are not included, but that does not mean a common substance like 'Sodium Chloride' (i.e., common salt) will be excluded. Refer to paragraph 3 – just because a word has foreign origins does not mean that it can never be naturalized into English; so if 'croissant' is commonly used in contemporary English, it will probably be included in the dictionary. But refer again to paragraph 5 – 'great-great-great aunt' is likely to be rejected from dictionaries on the same grounds as <em>'<\/em>great-great-great-great-great-great-grandfather' is: because they both simply extend a basic word. Hence, [2].<\/p>", "topic": "Application Question"}, {"number": 6, "sourceId": "34417", "type": "mcq", "passage": "<p>How many words are there in the English language? No one knows. But that hasn't stopped an operation known as the Global Language Monitor from estimating that – as of this writing – there are exactly 988,968 words in English. GLM has done a remarkable job suckering even the respectable press into believing that we're on the verge of adding the millionth word to English. Even so, its claim is a bogus one.<\/p><p><br />The problem with trying to number the words in any language is that it's very hard to agree on the basics. For example, what is a word? If <em>run<\/em> is a verb, is the noun <em>run<\/em> another word? What about the inflected forms <em>ran, runs,<\/em> and<em> running<\/em>? What about words with run as a base, such as <em>runner<\/em> and <em>runoff<\/em> and <em>runway<\/em>? Are compounds, such as <em>man-bites-dog<\/em>, <em>man-child<\/em>, <em>man-eater<\/em>,<em> manhandle,<\/em> <em>man-hour<\/em>, <em>man of God<\/em>, <em>man's man<\/em>, and <em>men in black<\/em>, to be counted once or many times?<br /> <br />Another question: What is English? The word veal, borrowed from French in the 14th century, seems to be English, as does <em>spaghetti<\/em>, a 19th-century Italian borrowing. But what about<em> pho<\/em>, a Vietnamese soup found from the 1930s but onl sociated with it, so it often gets left out. Team names, as a class, generally fail to make the cut. We could always add words to the dictionary if there were no limitations on time or space.<br /> <br />It's probably possible to devise criteria that would allow us to conclude that there are about a million words in English. But there's no possible way to count the actual number of words in the language, and the idea of having a running counter, as is found on GLM's home page, is absurd. So, why have journalists fallen for the claim? I think it's the pseudo-scientific nature of GLM's 'methodology': the company claims to use an 'algorithm', so its figures must be right. I recently got a call about GLM from a reporter, and when I explained why the million-word claim is bogus, he practically shouted, 'But they have an algorithm!'<br /> <br />And they'll have a good party in a few months' time, for the credulous among us.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong> The passage given below is followed by a set of questions. Choose the best answer to each question.<\/strong><\/p><\/div><p><em> Depending on the criteria we use to define a word, we can say that the English language can have an infinite number of words.<\/em><\/p>\n<p>Based on this passage, we can conclude that the above statement is:<\/p>", "options": ["<p>definitely true.<\/p>", "<p>probably true.<\/p>", "<p>probably false.<\/p>", "<p>definitely false.<\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p>Refer to paragraph 5, the last sentence. According to the author, counting all the numbers from 0 to 999,999 as separate words would give us a million words in English. Logically extending this argument to all numbers – which are infinite – would give us potentially infinite words in English. Therefore, this statement is definitely true. Hence, [1].<\/p>", "topic": "Application Question"}, {"number": 7, "sourceId": "34418", "type": "mcq", "p cently got a call about GLM from a reporter, and when I explained why the million-word claim is bogus, he practically shouted, 'But they have an algorithm!'<br /> <br />And they'll have a good party in a few months' time, for the credulous among us.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>The passage given below is followed by a set of questions. Choose the best answer to each question.<\/strong><\/p><\/div><p> What is implied in the last sentence of the passage?<\/p>", "options": ["<p>GLM are so audacious that they will soon celebrate the fact their data is bogus, though their audience believes otherwise.<\/p>", "<p>In a few months' time, GLM is likely to announce that the millionth word has been added to the English language.<\/p>", "<p>All the gullible people who have believed GLM's ludicrous claim that the English language has nearly 1 million words will be undeceived in a few months' time.<\/p>", "<p>Soon GLM will announce the addition of the millionth word in English, and celebrate this with all those who actually believe this absurd claim.<\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p>Refer to paragraph 1, 'GLM has done a remarkable job convincing ... to English.' The 'few months' time' in the last paragraph refers to this point, i.e., when GLM will announce the addition of the millionth word. While both [2] and [4] include this point, only [4] notes the implication that GLM will celebrate this absurd claim: 'they'll have a good party ... for the credulous among us'. Note that [1] is overly negative, as it assumes deliberate deception on GLM's part, and [3] states the near opposite of what is implied in the passage. Hence, [4].<\/p>", "topic": "Application Question"}, {"number": 8, "sourceId": "31980", "type": "mcq", "passage": "<p>Eliot's idea of tradition is directly linked up with his impersonal theory of art, as he insists on the poet's duty to transcend the private self by loyalty to the tradition of European literature as a whole. He has expressed his views on the impersonality of poetry and the poetic process in his essay \"Tradition and the Individual Talent\" (1919). He says that poetry is not the expression of the personality of the poet. Revolting against the romantic theory of poetry as the expression of self, Eliot propounds a theory of poetry which views poetic process not as an externalization of personal feelings, but as a complete surrender of personality. He insists on viewing the whole of European literature as a continuity, where each work of the present modifies the past works and is in turn modified by them. Eliot's views on the nature of the poetic process are also noteworthy. Poetry, according to him, is not inspiration, it is an organization. A great number of varied feelings, emotions and experiences are stored up in the mind of the poet who amalgamates them and forms a new whole out of them. The poetic process, therefore, is that of organization, of fusing different experiences and feelings into a new whole. Perfect poetry can be produced only when there is \"unification of sensibility\". The greatness of a poem does not depend on the type of pleasure it gives, or the quality of moral improvement it effects, but on the order and unity it imposes on the chaotic and disparate experiences of the poet. A good poem must give the impression of a perfect organization of experiences.<\/p><p>Eliot elucidates his impersonal theory by examining, first, the relation of the poet to the past, and secondly, the relation of the poem to its author. The past, Eliot says, is never dead; it lives in the present. \"No poet, no artist of any sort, has his complete meaning alone. His significance, his appreciation, is the appreciation of his relation to the dead poets and artists. You cannot value him alone; you must set him, for contrast and comparison, among the dead.\" Eliot insists on the importance of the relation of the poem to other poems by other authors, and suggests the conception of poetry as a living whole of all the poetry that has ever been written.<\/p><p>The artistic process, according to Eliot, is a process of depersonalization, the artist's continual surrender of himself as he is at the moment to something which is more valuable. He must surrender himself totally to the creative work. \"The progress of an artist is a continual self-sacrifice, a continual extinction of personality.\" Eliot also points out the relation of the poem to its author; the poem, according to him, has no relation to the poet. The difference between the mind of a mature poet and that of an immature one is that the mind of a mature poet is \"a more finely perfected medium in which special, or very varied, feelings are at liberty to enter into new combinations\".<\/p><p>Emotions and feelings are the elements which, entering the presence of the poet's mind, which acts as a catalyst, go into the making of a work of art. The final effect produced by a work of art may be formed out of several emotions into one; it may be formed out of a single emotion or out of the feeling evoked in the poet by various words and images. It is also possible that it may be composed of feelings alone, without using any emotion. Thus, \"the poet's mind is a receptacle for seizing and storing up numberless feelings, phrases, images, which remain there until all the particles which can unite to form a new compound are present together.\"<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong> The passage given below is followed by a set of questions. Choose the best answer to each question.<\/strong><\/p><\/div><p> What does Eliot mean by the term \"unification of sensibility\"?<\/p>", "options": ["<p>A joining together of ideas with the emotions and experiences of the poet<\/p>", "<p>An amalgamation of influences on European literature<\/p>", "<p>An organized presentation of chaotic and disparate experiences of the poet<\/p>", "<p>A unified record of the poet's perceptions dipped in tradition<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p>Refer to paragraph 1. According to Eliot, a good poem is the perfect organization of the many diverse experiences and emotions that enter into the poet's mind. It is not just a joining together of ideas on life or the poet's perceptions, but the organization of the chaos. Thus, options [1] and [4] are incorrect. Option [2] does not answer the question at all. Hence, [3].<\/p>", "topic": "Contextual Vocabulary"}, {"number": 9, "sourceId": "31981", "type": "mcq", "passage": "<p>Eliot's idea of tradition is directly linked up with his impersonal theory of art, as he insists on the poet's duty to transcend the private self by loyalty to the tradition of European literature as a whole. He has expressed his views on the impersonality of poetry and the poetic process in his essay \"Tradition and the Individual Talent\" (1919). He says that poetry is not the expression of the personality of the poet. Revolting against the romantic theory of poetry as the expression of self, Eliot propounds a theory of poetry which views poetic process not as an externalization of personal feelings, but as a complete surrender of personality. He insists on viewing the whole of European literature as a continuity, where each work of the present modifies the past works and is in turn modified by them. Eliot's views on the nature of the poetic process are also noteworthy. Poetry, according to him, is not inspiration, it is an organization. A great number of varied feelings, emotions and experiences are stored up in the mind of the poet who amalgamates them and forms a new whole out of them. The poetic process, therefore, is that of organization, of fusing different experiences and feelings into a new whole. Perfect poetry can be produced only when there is \"unification of sensibility\". The greatness of a poem does not depend
