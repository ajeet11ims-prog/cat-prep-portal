s also possible that it may be composed of feelings alone, without using any emotion. Thus, \"the poet's mind is a receptacle for seizing and storing up numberless feelings, phrases, images, which remain there until all the particles which can unite to form a new compound are present together.\"<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong> The passage given below is followed by a set of questions. Choose the best answer to each question.<\/strong><\/p><\/div><p> What does the romantic theory of poetry advocate?<\/p>", "options": ["<p>Poetry should follow the poet's own imagination and his individualism.<\/p>", "<p>Poetry is a process of the artist's continual surrender of himself to the art form.<\/p>", "<p>Poetry is expression of the poet's own experiences in terms of the established rules of literature.<\/p>", "<p>Poetry, as an art form, has no relation to the poet.<\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p>Paragraph 1 states that the romantic theory of poetry propounds that poetry is an expression of the poet's own self. Therefore, the poet's own perceptions and his individualism are of utmost importance. Option [2] advocates Eliot's point of view regarding the poet and the poem. Option [3] is not mentioned in the passage. Option [4] contradicts romantic theory as it is stated in the passage. Hence, [1].<\/p>", "topic": "Specific Detail"}, {"number": 10, "sourceId": "31982", "type": "mcq", "passage": "<p>Eliot's idea of tradition is directly linked up with his impersonal theory of art, as he insists on the poet's duty to transcend the private self by loyalty to the tradition of European literature as a whole. He has expressed his views on the impersonality of poetry and the poetic process in his essay \"Tradition and the Individual Talent\" (1919). He says that poetry is not the expression of the personality of the poet. Revolting against the romantic theory of poetry as the expression of self, Eliot propounds a theory of poetry which views poetic process not as an externalization of personal feelings, but as a complete surrender of personality. He insists on viewing the whole of European literature as a continuity, where each work of the present modifies the past works and is in turn modified by them. Eliot's views on the nature of the poetic process are also noteworthy. Poetry, according to him, is not inspiration, it is an organization. A great number of varied feelings, emotions and experiences are stored up in the mind of the poet who amalgamates them and forms a new whole out of them. The poetic process, therefore, is that of organization, of fusing different experiences and feelings into a new whole. Perfect poetry can be produced only when there is \"unification of sensibility\". The greatness of a poem does not depend on the type of pleasure it gives, or the quality of moral improvement it effects, but on the order and unity it imposes on the chaotic and disparate experiences of the poet. A good poem must give the impression of a perfect organization of experiences.<\/p><p>Eliot elucidates his impersonal theory by examining, first, the relation of the poet to the past, and secondly, the relation of the poem to its author. The past, Eliot says, is never dead; it lives in the present. \"No poet, no artist of any sort, has his complete meaning alone. His significance, his appreciation, is the appreciation of his relation to the dead poets and artists. You cannot value him alone; you must set him, for contrast and comparison, among the dead.\" Eliot insists on the importance of the relation of the poem to other poems by other authors, and suggests the conception of poetry as a living whole of all the poetry that has ever been written.<\/p><p>The artistic process, according to Eliot, is a process of depersonalization, the artist's continual surrender of himself as he is at the moment to something which is more valuable. He must surrender himself totally to the creative work. \"The progress of an artist is a continual self-sacrifice, a continual extinction of personality.\" Eliot also points out the relation of the poem to its author; the poem, according to him, has no relation to the poet. The difference between the mind of a mature poet and that of an immature one is that the mind of a mature poet is \"a more finely perfected medium in which special, or very varied, feelings are at liberty to enter into new combinations\".<\/p><p>Emotions and feelings are the elements which, entering the presence of the poet's mind, which acts as a catalyst, go into the making of a work of art. The final effect produced by a work of art may be formed out of several emotions into one; it may be formed out of a single emotion or out of the feeling evoked in the poet by various words and images. It is also possible that it may be composed of feelings alone, without using any emotion. Thus, \"the poet's mind is a receptacle for seizing and storing up numberless feelings, phrases, images, which remain there until all the particles which can unite to form a new compound are present together.\"<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>The passage given below is followed by a set of questions. Choose the best answer to each question.<\/strong><\/p><\/div><p> What is Eliot's view on the past works of European literature?<\/p>", "options": ["<p>The past works of European literature have hardly any influence in the present day.<\/p>", "<p>European literature is a dynamic entity where every present work has its influence on the past works and is simultaneously modified by them.<\/p>", "<p>The past works of European literature have only modified the thought process of the poets of the present day.<\/p>", "<p>All the past works of European literature advocate the individualism of poets.<\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p>Eliot says that the past makes its presence felt through the works that come after it. Thus, option [1] can be ruled out. [3] highlights only one aspect – that of the past influencing the present and not the other way round. [4] is not mentioned anywhere. Hence, [2].<\/p>", "topic": "Inference"}, {"number": 11, "sourceId": "31983", "type": "mcq", "passage": "<p>Eliot's idea of tradition is directly linked up with his impersonal theory of art, as he insists on the poet's duty to transcend the private self by loyalty to the tradition of European literature as a whole. He has expressed his views on the impersonality of poetry and the poetic process in his essay \"Tradition and the Individual Talent\" (1919). He says that poetry is not the expression of the personality of the poet. Revolting against the romantic theory of poetry as the expression of self, Eliot propounds a theory of poetry which views poetic process not as an externalization of personal feelings, but as a complete surrender of personality. He insists on viewing the whole of European literature as a continuity, where each work of the present modifies the past works and is in turn modified by them. Eliot's views on the nature of the poetic process are also noteworthy. Poetry, according to him, is not inspiration, it is an organization. A great number of varied feelings, emotions and experiences are stored up in the mind of the poet who amalgamates them and forms a new whole out of them. The poetic process, therefore, is that of organization, of fusing different experiences and feelings into a new whole. Perfect poetry can be produced only when there is \"unification of sensibility\". The greatness of a poem does not depend on the type of pleasure it gives, or the quality of moral improvement it effects, but on the order and unity it imposes on the chaotic and disparate experiences of the poet. A good poem must give the impression of a perfect organization of experiences.<\/p><p>Eliot elucidates his impersonal theory by examining, first, the relation of the poet to the past, and secondly, the relation of the poem to its author. The past, Eliot says, is never dead; it lives in the present. \"No poet, no artist of any sort, has his complete meaning alone. His significance, his appreciation, is the appreciation of his relation to the dead poets and artists. You cannot value him alone; you must set him, for contrast and comparison, among the dead.\" Eliot insists on the importance of the relation of the poem to other poems by other authors, and suggests the conception of poetry as a living whole of all the poetry that has ever been written.<\/p><p>The artistic process, according to Eliot, is a process of depersonalization, the artist's continual surrender of himself as he is at the moment to something which is more valuable. He must surrender himself totally to the creative work. \"The progress of an artist is a continual self-sacrifice, a continual extinction of personality.\" Eliot also points out the relation of the poem to its author; the poem, according to him, has no relation to the poet. The difference between the mind of a mature poet and that of an immature one is that the mind of a mature poet is \"a more finely perfected medium in which special, or very varied, feelings are at liberty to enter into new combinations\".<\/p><p>Emotions and feelings are the elements which, entering the presence of the poet's mind, which acts as a catalyst, go into the making of a work of art. The final effect produced by a work of art may be formed out of several emotions into one; it may be formed out of a single emotion or out of the feeling evoked in the poet by various words and images. It is also possible that it may be composed of feelings alone, without using any emotion. Thus, \"the poet's mind is a receptacle for seizing and storing up numberless feelings, phrases, images, which remain there until all the particles which can unite to form a new compound are present together.\"<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong> The passage given below is followed by a set of questions. Choose the best answer to each question.<\/strong><\/p><\/div><p> What could be the source of this passage?<\/p>", "options": ["<p>An article on the literary works of Eliot<\/p>", "<p>A biography of Eliot<\/p>", "<p>An essay on Eliot's theory of the impersonality of poetry<\/p>", "<p>An essay on an analysis of Eliot's theory of poetry vis-a-vis the romantic theory of poetry<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p>This passage does not dwell at all on the literary works of Eliot nor on the factual details about his life. So, [1] and [2] can be safely ruled out. Only paragraph [1] makes a passing reference to the romantic theory of poetry. So [4] is out. In fact, the whole passage is about Eliot's theory of the impersonality of poetry. Hence, [3].<\/p>", "topic": "Application Question"}, {"number": 12, "sourceId": "77329", "type": "mcq", "passage": "<\/span><span lang=EN-US>Perhaps the most important characteristic of this\r\n  modern world of governance is its relationship to time. The difference\r\n  between the coherence of the state in the abstract, and the chaotic concrete\r\n  reality of local government has a temporal dimension. The present real state\r\n  of things is seen as chaotic, but contrasts with how things once were or how\r\n  they might be in the future. A normative idea of the state as an entity able\r\n  to effectively enforce a single bureaucratic will upon society as a whole is\r\n  projected on to other moments of time, and contrasted with the degenerate\r\n  present. The modern state does not seem, then, to live in what Walter\r\n  Benjamin called a &quot;homogeneous, empty time&quot;, in which the future is\r\n  always different from the past and present and progress is the inevitable\r\n  process of improvement which marks the transition from one to the other.\r\n  Instead, the time of modern governance is heterogeneous.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>The institutions of\r\n  modern rule are deeply implicated within the present-day world of disordered\r\n  social action in which officials interact with their subjects. But the\r\n  state's abstract, rule-bound techniques of governance deal with those actions\r\n  from the standpoint of another moment in which it is possible to act as if\r\n  such seeming disorder has been done away with. The minor functionary working\r\n  in the land records department manipulates complex local power relations,\r\n  taking bribes from some but not others; but when he fills in a record ledger,\r\n  or writes to his superiors he acts as a functionary in a rational machine that\r\n  has abolished such local inequalities. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>The modern state sets up camp in that world,\r\n  creating real institutions that act as if the world really is ordered\r\n  according to the abstract categories and rules it has projected on to the\r\n  future. Its functionaries know very well that the individuals in the world\r\n  outside are motivated by complex intentions that cannot be encapsulated in\r\n  its rules. They know that the purposes that drive an individual to court are\r\n  very different from those implicit within the code of laws. But the culture\r\n  of modern governance works hard to blind its officials to that difference,\r\n  insisting that, at particular moments, they act as if the abstract version of\r\n  social reality it produces is the only valid way of understanding what went on;\r\n  as if, for example, the law it had enacted has already transformed social\r\n  relations so that they conform to an abstract schema. <\/span><span\r\n  lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose <em>the most appropriate<\/em> answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following best captures the main idea of the passage?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Modern governance forces officials to enforce the law without any regard for the disorder of the real world and the consequences of the same.<\/span><\/p>", "<p><span lang=\"EN-US\">The rules of the modern world of governance are designed and enforced not for the chaos of the world as it is, but for the ideal world as it was or as it might come to be.<\/span><\/p>", "<p><span lang=\"EN-US\">The modern state's rule-bound techniques have been framed without taking into account local power relations that adversely affect governance.<\/span><\/p>", "<p><span lang=\"EN-US\">The institutions of the modern state have laws whose implicit code is not understood by individuals who approach the courts for justice.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">The main idea of the passage deals with the relationship of the modern state and its governance to time as stated in the very first sentence of the passage. The rest of the passage explains this relationship: the rules of governance are determined with respect to an ideal state that might be realized in the future or might have existed in the past: \"The present real state of things is seen as chaotic, but contrasts with how things once were or how they might be in the future.\" The passage then goes on to describe the implications of this disjunction. Option (2) best captures this. Option (1) concerns itself only with the implication of the disjunction and not the main idea itself. Option (3) is limited to local power relations and does not capture the main idea in its entirety. Option (4) is limited to a distorting idea stated in the fourth paragraph. Hence, (2).<\/span><\/p>", "topic": "Central Idea"}, {"number": 13, "sourceId": "77330", "type": "mcq", "passage": "<\/span><span lang=EN-US>Perhaps the most important characteristic of this\r\n  modern world of governance is its relationship to time. The difference\r\n  between the coherence of the state in the abstract, and the chaotic concrete\r\n  reality of local government has a temporal dimension. The present real state\r\n  of things is seen as chaotic, but contrasts with how things once were or how\r\n  they might be in the future. A normative idea of the state as an entity able\r\n  to effectively enforce a single bureaucratic will upon society as a whole is\r\n  projected on to other moments of time, and contrasted with the degenerate\r\n  present. The modern state does not seem, then, to live in what Walter\r\n  Benjamin called a &quot;homogeneous, empty time&quot;, in which the future is\r\n  always different from the past and present and progress is the inevitable\r\n  process of improvement which marks the transition from one to the other.\r\n  Instead, the time of modern governance is heterogeneous.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>The institutions of\r\n  modern rule are deeply implicated within the present-day world of disordered\r\n  social action in which officials interact with their subjects. But the\r\n  state's abstract, rule-bound techniques of governance deal with those actions\r\n  from the standpoint of another moment in which it is possible to act as if\r\n  such seeming disorder has been done away with. The minor functionary working\r\n  in the land records department manipulates complex local power relations,\r\n  taking bribes from some but not others; but when he fills in a record ledger,\r\n  or writes to his superiors he acts as a functionary in a rational machine that\r\n  has abolished such local inequalities. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>The modern state sets up camp in that world,\r\n  creating real institutions that act as if the world really is ordered\r\n  according to the abstract categories and rules it has projected on to the\r\n  future. Its functionaries know very well that the individuals in the world\r\n  outside are motivated by complex intentions that cannot be encapsulated in\r\n  its rules. They know that the purposes that drive an individual to court are\r\n  very different from those implicit within the code of laws. But the culture\r\n  of modern governance works hard to blind its officials to that difference,\r\n  insisting that, at particular moments, they act as if the abstract version of\r\n  social reality it produces is the only valid way of understanding what went on;\r\n  as if, for example, the law it had enacted has already transformed social\r\n  relations so that they conform to an abstract schema. <\/span><span\r\n  lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose <em>the most appropriate<\/em> answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">According to the passage, what is the difference between Benjamin Franklin's \"homogenous, empty time\" and the time in which the modern state exists?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">In the former, it represents an abstract past or future but in the latter, it represents a progression into a better future.<\/span><\/p>", "<p><span lang=\"EN-US\">In the former, the future is not defined as an abstraction but as a possible reality, while in the latter it is imagined to be a perfection belonging to another time.<\/span><\/p>", "<p><span lang=\"EN-US\">In both, the future always symbolizes progress, but unlike in the former the latter does not consider the present to be degenerate.<\/span><\/p>", "<p><span lang=\"EN-US\">In the former, the future is always an improvement over the past and present, but in the latter the ideal exists both in the past as well as the future.<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">The difference is clearly stated in the last two sentences of the first paragraph. According to Benjamin Franklin's notion, the modern state exists in the present, which is homogeneous and empty, and marks a transition to a better future. However in reality, the modern state exists in a heterogeneous time, which is an ideal state that might exist in the future or might have existed in the past but not in the degenerate present. Option (4) best captures this. Option (1) reverses the order. Option (2) extends and distorts the argument by defining the different futures as abstract and realistic possibilities. Option (3) incorrectly says that in Benjamin Franklin's view the present is degenerate, whereas he only considers it homogenous and empty. Hence, (4).<\/span><\/p>", "topic": "Specific Detail"}, {"number": 14, "sourceId": "77331", "type": "mcq", "passage": "<\/span><span lang=EN-US>Perhaps the most important characteristic of this\r\n  modern world of governance is its relationship to time. The difference\r\n  between the coherence of the state in the abstract, and the chaotic concrete\r\n  reality of local government has a temporal dimension. The present real state\r\n  of things is seen as chaotic, but contrasts with how things once were or how\r\n  they might be in the future. A normative idea of the state as an entity able\r\n  to effectively enforce a single bureaucratic will upon society as a whole is\r\n  projected on to other moments of time, and contrasted with the degenerate\r\n  present. The modern state does not seem, then, to live in what Walter\r\n  Benjamin called a &quot;homogeneous, empty time&quot;, in which the future is\r\n  always different from the past and present and progress is the inevitable\r\n  process of improvement which marks the transition from one to the other.\r\n  Instead, the time of modern governance is heterogeneous.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>The institutions of\r\n  modern rule are deeply implicated within the present-day world of disordered\r\n  social action in which officials interact with their subjects. But the\r\n  state's abstract, rule-bound techniques of governance deal with those actions\r\n  from the standpoint of another moment in which it is possible to act as if\r\n  such seeming disorder has been done away with. The minor functionary working\r\n  in the land records department manipulates complex local power relations,\r\n  taking bribes from some but not others; but when he fills in a record ledger,\r\n  or writes to his superiors he acts as a functionary in a rational machine that\r\n  has abolished such local inequalities. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>The modern state sets up camp in that world,\r\n  creating real institutions that act as if the world really is ordered\r\n  according to the abstract categories and rules it has projected on to the\r\n  future. Its functionaries know very well that the individuals in the world\r\n  outside are motivated by complex intentions that cannot be encapsulated in\r\n  its rules. They know that the purposes that drive an individual to court are\r\n  very different from those implicit within the code of laws. But the culture\r\n  of modern governance works hard to blind its officials to that difference,\r\n  insisting that, at particular moments, they act as if the abstract version of\r\n  social reality it produces is the only valid way of understanding what went on;\r\n  as if, for example, the law it had enacted has already transformed social\r\n  relations so that they conform to an abstract schema. <\/span><span\r\n  lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose <em>the most appropriate<\/em> answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Based on the passage, it can be inferred that:<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">individuals approach courts for reasons that are selfish and not for upholding the abstract principles of justice on which the law is based.<\/span><\/p>", "<p><span lang=\"EN-US\">the principles implicit in the code of law are too abstract to understand for the individuals who approach the courts.<\/span><\/p>", "<p><span lang=\"EN-US\">the abstract rules of the court do not have enough provisions to deliver justice in all the complex cases that are thrown up in the real world.<\/span><\/p>", "<p><span lang=\"EN-US\">individuals might move court demanding that the letter of the law be followed and not necessarily its spirit.<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">The last paragraph states \"...the purposes that drive an individual to court are very different from those implicit within the code of laws.\" The paragraph also states that these rules and codes of law are based on an ideal abstract view of the world. So it can be inferred that individuals move court not just to seek justice in accordance to the spirit of the law but only to claim their right as per what the law states. So individuals might be filing cases only demanding that the letter of the law be followed and not necessarily its spirit. Option (4) best captures this. Option (1) is incorrect since it makes a generalization that individuals approach court for selfish reasons. Option (4) makes a similar inference but the use of the word might make it logically correct when compared to (1). Option (2) is incorrect since the passage states that the purposes that drive an individual are different from those implicit within the code of laws. This does not mean that individuals do not understand the principles that are implicit. The paragraph states that rules cannot encapsulate all the intentions of the individuals in the real world but this cannot be used to infer that courts do not have provisions to deliver justice in all cases in the real world. Thus, option (3) can be ruled out. Hence, (4).<\/span><\/p>", "topic": "Inference"}, {"number": 15, "sourceId": "76914", "type": "mcq", "passage": "<p>We hear about cloud computing everywhere these days. It represents the next great leap forward.<\/p>   <p>Premised on a dispersed systems network, cloud computing liberates digital material from hard-drive transmission and creates a free-floating collectively-accessible data saturation. Among other things, this digital saturation hastens the across-the-board obsolescence of a whole class of physical item. We are all witnessing the sudden dematerialization of our arts and entertainment, their transfer from unique artifact source to universally on-demand screen availability. Walk down Main Street. The video and DVD emporia are gone – it happened in a year or two. The bookstores, if not yet folded, are quickly going the way of record stores. More and more people are persuaded to access their culture through screen portals, ordering up what they need for their Kindle, their iPod, and their nightly watching pleasures. And the middle men, the algorithmically nimble purveyors of books and music and film, increasingly access them – us – identifying what they think we want and laying it on our electronic doorstep.<\/p>   <p>Of course there are advantages to all this. Instant access and narrowcasting to gratify our preferences. But there are enormous losses, too. The main one, front and centre is the public and private disappearance of the physical evidence of our tastes and desires. There will be no records or CDs on the shelves of the future, few if any books. Everything will live in bits, in files – and how can this not modify the general atmosphere? We are removing the physical markers of culture from our collective midst. For a record store was not just a place to get records, as a bookstore was not only for finding the needed read. These were sites where the love of music and literature announced themselves across a spectrum of tastes. And though they were commercial entities, these emporia also symbolized the presence, the value of their product to the community.<\/p>   <p>What distresses me about the transfer from thing to cloud – it was Karl Marx who lamented that \"all that's solid melts into air\" – is not just the loss of the object, the fetish, the thing, but also the larger thematic implications. Of course we will never dispense with physicality altogether but the primal materiality that governed the terms of existence is being by degrees, quick degrees, put at a distance. In his book <em>The End of Nature<\/em>, Bill McKibben argued with some persuasiveness that we have tamed nature and domesticated the idea of it. Nature is now for vacations or high-priced adventurings; or else it is, for the fortunate majority of us, a catastrophe spectacle, something else for the websites' home page slide show: tsunami, tornado, calving iceberg.<\/p>   <p>We might try on the big picture for a moment, imagining the terms of physical existence as they were a hundred years ago for the average person, and comparing these with the present. I won't itemize, though I could. The short version is that the world, its elements, its nouns, has receded, as has its intractability, the defining obstacles of time and space. It's almost as if world and screen were in inverse relation, the former fading as the latter keeps gaining in reach, in definition, in its power to compel our attention.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of four questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">The passage is a:<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">lament on what we will lose as our world becomes increasingly digitized and virtual.<\/span><\/p>", "<p><span lang=\"EN-US\">critique of our drive towards dematerializing the objects of our arts and entertainment.<\/span><\/p>", "<p><span lang=\"EN-US\">tirade against the loss of the physical presence of art and its surrounding ecosystems like book or video stores.<\/span><\/p>", "<p><span lang=\"EN-US\">plea to stop the digital production and consumption of art.<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\">The first words of the answer options make it clear that the question is asking you to identify the tone of the passage: <em>lament, critique, tirade<\/em> or <em>plea.<\/em> The passage is not a critique or tirade since the author is not aggressively attacking the dematerialization of the digital world. The passage is not a plea to stop digital production since the author never calls to put a stop to digitization; he only highlights what we stand to lose, while saying that there might be many benefits. Option (1) is correct since the passage is more of a catalogue of what we will lose through digitization and the tone of the author is also one of distress, a word he himself uses at the beginning of the third paragraph. Hence, (1).<\/span><\/p>", "topic": "Central Idea"}, {"number": 16, "sourceId": "76915", "type": "mcq", "passage": "<p>We hear about cloud computing everywhere these days. It represents the next great leap forward.<\/p>   <p>Premised on a dispersed systems network, cloud computing liberates digital material from hard-drive transmission and creates a free-floating collectively-accessible data saturation. Among other things, this digital saturation hastens the across-the-board obsolescence of a whole class of physical item. We are all witnessing the sudden dematerialization of our arts and entertainment, their transfer from unique artifact source to universally on-demand screen availability. Walk down Main Street. The video and DVD emporia are gone – it happened in a year or two. The bookstores, if not yet folded, are quickly going the way of record stores. More and more people are persuaded to access their culture through screen portals, ordering up what they need for their Kindle, their iPod, and their nightly watching pleasures. And the middle men, the algorithmically nimble purveyors of books and music and film, increasingly access them – us – identifying what they think we want and laying it on our electronic doorstep.<\/p>   <p>Of course there are advantages to all this. Instant access and narrowcasting to gratify our preferences. But there are enormous losses, too. The main one, front and centre is the public and private disappearance of the physical evidence of our tastes and desires. There will be no records or CDs on the shelves of the future, few if any books. Everything will live in bits, in files – and how can this not modify the general atmosphere? We are removing the physical markers of culture from our collective midst. For a record store was not just a place to get records, as a bookstore was not only for finding the needed read. These were sites where the love of music and literature announced themselves across a spectrum of tastes. And though they were commercial entities, these emporia also symbolized the presence, the value of their product to the community.<\/p>   <p>What distresses me about the transfer from thing to cloud – it was Karl Marx who lamented that \"all that's solid melts into air\" – is not just the loss of the object, the fetish, the thing, but also the larger thematic implications. Of course we will never dispense with physicality altogether but the primal materiality that governed the terms of existence is being by degrees, quick degrees, put at a distance. In his book <em>The End of Nature<\/em>, Bill McKibben argued with some persuasiveness that we have tamed nature and domesticated the idea of it. Nature is now for vacations or high-priced adventurings; or else it is, for the fortunate majority of us, a catastrophe spectacle, something else for the websites' home page slide show: tsunami, tornado, calving iceberg.<\/p>   <p>We might try on the big picture for a moment, imagining the terms of physical existence as they were a hundred years ago for the average person, and comparing these with the present. I won't itemize, though I could. The short version is that the world, its elements, its nouns, has receded, as has its intractability, the defining obstacles of time and space. It's almost as if world and screen were in inverse relation, the former fading as the latter keeps gaining in reach, in definition, in its power to compel our attention.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of four questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">The passage suggests that in the future most of our arts will be:<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">intangible<\/span><\/p>", "<p><span lang=\"EN-US\">artefacts<\/span><\/p>", "<p><span lang=\"EN-US\">commoditized<\/span><\/p>", "<p><span lang=\"EN-US\">marginalized<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\">The author states in the first paragraph and second paragraphs that we are witnessing a dematerialization of our arts as they are being transformed into digital content from their current physical existence and soon books music and CDs will physically disappear.<span>  <\/span>The option that captures this is (1); <em>intangible<\/em> means not having any material or physical existence. Hence, (1).<\/span><\/p>", "topic": "Specific Detail"}, {"number": 17, "sourceId": "76916", "type": "mcq", "passage": "<p>We hear about cloud computing everywhere these days. It represents the next great leap forward.<\/p>   <p>Premised on a dispersed systems network, cloud computing liberates digital material from hard-drive transmission and creates a free-floating collectively-accessible data saturation. Among other things, this digital saturation hastens the across-the-board obsolescence of a whole class of physical item. We are all witnessing the sudden dematerialization of our arts and entertainment, their transfer from unique artifact source to universally on-demand screen availability. Walk down Main Street. The video and DVD emporia are gone – it happened in a year or two. The bookstores, if not yet folded, are quickly going the way of record stores. More and more people are persuaded to access their culture through screen portals, ordering up what they need for their Kindle, their iPod, and their nightly watching pleasures. And the middle men, the algorithmically nimble purveyors of books and music and film, increasingly access them – us – identifying what they think we want and laying it on our electronic doorstep.<\/p>   <p>Of course there are advantages to all this. Instant access and narrowcasting to gratify our preferences. But there are enormous losses, too. The main one, front and centre is the public and private disappearance of the physical evidence of our tastes and desires. There will be no records or CDs on the shelves of the future, few if any books. Everything will live in bits, in files – and how can this not modify the general atmosphere? We are removing the physical markers of culture from our collective midst. For a record store was not just a place to get records, as a bookstore was not only for finding the needed read. These were sites where the love of music and literature announced themselves across a spectrum of tastes. And though they were commercial entities, these emporia also symbolized the presence, the value of their product to the community.<\/p>   <p>What distresses me about the transfer from thing to cloud – it was Karl Marx who lamented that \"all that's solid melts into air\" – is not just the loss of the object, the fetish, the thing, but also the larger thematic implications. Of course we will never dispense with physicality altogether but the primal materiality that governed the terms of existence is being by degrees, quick degrees, put at a distance. In his book <em>The End of Nature<\/em>, Bill McKibben argued with some persuasiveness that we have tamed nature and domesticated the idea of it. Nature is now for vacations or high-priced adventurings; or else it is, for the fortunate majority of us, a catastrophe spectacle, something else for the websites' home page slide show: tsunami, tornado, calving iceberg.<\/p>   <p>We might try on the big picture for a moment, imagining the terms of physical existence as they were a hundred years ago for the average person, and comparing these with the present. I won't itemize, though I could. The short version is that the world, its elements, its nouns, has receded, as has its intractability, the defining obstacles of time and space. It's almost as if world and screen were in inverse relation, the former fading as the latter keeps gaining in reach, in definition, in its power to compel our attention.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of four questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following best elaborates the idea expressed in the last sentence of the first paragraph?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Computer programs using statistics to suggest titles are now replacing the storeowner or attendant who knew our artistic tastes and suggested titles to us.<\/span><\/p>", "<p><span lang=\"EN-US\">We no longer need to physically browse through shelves to find artworks since computer programs can search the catalogues for the same.<\/span><\/p>", "<p><span lang=\"EN-US\">Computer programs using statistics are quicker in identifying our artistic tastes and suggesting titles to us than the store owner or attendant.<\/span><\/p>", "<p><span lang=\"EN-US\">The middlemen who mediated our access to books, music and film are being rendered irrelevant with the digitization of content.<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\">The sentence referred to in the question, is about our wants being identified by 'algorithmically nimble (fast) purveyors (sellers)', the sellers in this case being online stores. The question is asking you to identify the option that best elaborates the meaning of this sentence. 'Algorithms' refer to computer programs, even if you are unaware of what an algorithm means you can infer this from the wording of the options. So the sentence is in effect saying that online stores are using fast computer programs to identify our likes and dislikes and making suggestions to us. Also, the author is making this statement in the light of disappearing video and bookstores. Option (1) best elaborates this. Option (2) is incorrect since it is limited to browsing for books rather than identification of our wants. Option (3) is incorrect since while the sentence calls the programs nimble it cannot be claimed that the author considers them to be faster than store owners or attendants. Option (4) is incorrect since it does not elaborate but keeps itself limited to the disappearance of middlemen. Hence, (1).<\/span><\/p>", "topic": "Application Question"}, {"number": 18, "sourceId": "83654", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>The sentences given in each question, when properly sequenced, form a coherent paragraph. Each sentence is labeled with a letter. Choose the most logical order of sentences and enter it in the box.<\/strong><\/p>\n<p><strong>Note: Use the virtual keyboard to enter your answer.<\/strong><\/p><\/div>", "options": [], "answer": "CADEB", "answerLabel": "CADEB", "solution": "<p>Statement A describes how students are always under the compulsion to demonstrate their abilities across various subjects and D elaborates on the result of a negative performance in such tests. The reference of the test is first found in C; hence C should start the sequence. The division into 'math types' and 'poetry types' mentioned in B is actually a manifestation of the aptitude of the students alluded to in E; hence B follows E. E easily flows from D because E starts with the connective 'as an added advantage'. Thus, the correct sequence is CADEB. Hence, CADEB.<\/p>", "topic": "Jumbled Paragraphs"}, {"number": 19, "sourceId": "83655", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>The sentences given in each question, when properly sequenced, form a coherent paragraph. Each sentence is labeled with a letter. Choose the most logical order of sentences and enter it in the box.<\/strong><\/p>\n<p><strong>Note: Use the virtual keyboard to enter your answer.<\/strong><\/p><\/div>", "options": [], "answer": "CEADB", "answerLabel": "CEADB", "solution": "<p>C starts by stating a general truth, which is further validated in E. Sentences E and A should be placed as close as possible because 'certain peculiarities' of modern music, as mentioned in A are actually first stated in E; in fact E should precede A. D, which reiterates the slow acceptance of modernist music by audience. B adds on to this by saying that some modern music is not just accepted by beloved. Thus, CEADB is the correct sequence. Hence, CEADB.<\/p>", "topic": "Jumbled Paragraphs"}, {"number": 20, "sourceId": "83656", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>The sentences given in each question, when properly sequenced, form a coherent paragraph. Each sentence is labeled with a letter. Choose the most logical order of sentences and enter it in the box.<\/strong><\/p>\n<p><strong>Note: Use the virtual keyboard to enter your answer.<\/strong><\/p><\/div>", "options": [], "answer": "DBEAC", "answerLabel": "DBEAC", "solution": "<p>D, being a general statement about the rise of postmodernism, starts the sequence and is then followed by Martin Amis' views about the postmodern man. B follow next ‘postmodern people’ in B refers to postmodernism in D. ‘Modes of over-existence’ in E are a comment of the ‘over-existed’ modern people mentioned in B. A follows next by stating the reason of ‘over-existence’. C comes after A because the examples of 'over-consumption in the guise of entertainment', mentioned in A, are elaborated in C. Hence, DBEAC.<\/p>", "topic": "Jumbled Paragraphs"}, {"number": 21, "sourceId": "83988", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>In the following questions, there are four sentences. Each sentence has a pair of words that are italicized and highlighted. From the italicized and highlighted words, select the most appropriate words (A or B) to form correct sentences. Then enter in the box below the appropriate letters (A or B) corresponding to the correct words in each sentence in the correct order.<\/strong><\/p>\n<p><strong>Note: Use the virtual keyboard to enter your answer. <\/strong><\/p><\/div>", "options": [], "answer": "AAAA", "answerLabel": "AAAA", "solution": "<p>‘Altogether’ means ‘entirely’ and ‘all together’ means ‘in a group’; in the first sentence, the word ‘altogether’ fits the sentence logically and grammatically. ‘Breach’ means ‘the act or a result of breaking’, whereas ‘breech’ is the ‘hinder or lower part of anything’; the given sentence speaks about security arrangements, hence the word ‘breach’ should be used. ‘Assent’ means ‘to agree with’ and ‘ascent’ is ‘upward movement’; so, the former fits correctly in this context. ‘Tact’ means ‘skill in dealing with difficult or delicate situations’, whereas ‘tack’ is ‘one of several possible ways of dealing with’. The given sentence is describing the qualities of a person; hence, the word ‘tact’ would be appropriate in the context. Hence, AAAA<\/p>", "topic": "Confusing Words/Spellings"}, {"number": 22, "sourceId": "83445", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">Each question has four sentences pertaining to a subject, which may or may not be in sequence. One of the sentences is contextually/logically incorrect. Choose the option corresponding to the sentence that is incorrect or inappropriate.<\/span><\/strong><\/p><\/div>", "options": [], "answer": "2", "answerLabel": "2", "solution": "<p><span lang=\"EN-US\">The paragraph speaks about modern art and artists of the Pre-Raphaelite period. Sentences 1, 3 and 4 are connected by their common theme: Britain's first modern art movement. Only sentence 2, which speaks about a specific painting, deviates from this subject and does not fit in logically or contextually with the other sentences. Hence, [2].<\/span><\/p>", "topic": "Sentence out of context"}, {"number": 23, "sourceId": "83446", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">Each question has four sentences pertaining to a subject, which may or may not be in sequence. One of the sentences is contextually/logically incorrect. Choose the option corresponding to the sentence that is incorrect or inappropriate.<\/span><\/strong><\/p><\/div><p>1. Occult science is the systematic research into occult concepts in a manner that follows the way natural science researches the phenomena of the physical world.<\/p>\n<p>2. Some authors have sought to show that various aspects of what was traditionally been considered 'occultism' are, in fact, scientific in precisely the same manner that chemistry or physics is scientific.<\/p>\n<p>3. Kabbalah and tarot reading have been described as occult sciences by researchers.<\/p>\n<p>4. When a branch of knowledge has this overall form, it can be considered 'scientific' and that is the claim made for certain aspects of occultism.<\/p>", "options": [], "answer": "4", "answerLabel": "4", "solution": "<p>Sentences 1, 2 and 3 speak about  the development of 'occult science'. To fit into the context, sentence 4, which also speaks about 'occultism', would need a connecting sentence that describes the term 'overall form' mentioned in sentence 4. Hence, 4<\/p>", "topic": "Sentence out of context"}, {"number": 24, "sourceId": "217036", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-IN\">There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-IN\"><strong><span lang=\"EN-IN\">Sentence:<\/span><\/strong><span lang=\"EN-IN\"> While you may feel vulnerable and exposed on your own, being part of the herd gives you a distinct sense of protection.<\/span><\/span><\/p>\n<p><span lang=\"EN-IN\"><strong>Paragraph: <\/strong>_ (1) _Have you noticed how, when crossing a busy road, you feel a sudden urge to speed up and melt into the crowd? Whether you are in Rio <span>de Janeiro<\/span> or Bangkok, New Delhi or New York City, your animal instinct tells you that it is safer to venture as part of a herd than on your own. Fear brings us closer together. _ (2)­­­­­­­­­­_The evidence is not just anecdotal. When we are herding, neuroimaging experiments show increased activation in the amygdala area of the brain, where fear and other negative emotions are processed. _ (3) ­­­­­­­­­­­­­­­­­­­­­­­­­­­­­­­­­­­­­­­_You know in your guts that, in the midst of others, the risk of being hit by a car is lower because it is somehow distributed among the group’s members. The more of them, the lower the risk.  _ (4) _There is safety in numbers. And so much more than mere safety.<\/span><\/p>\n<p><span lang=\"EN-IN\"><br /><\/span><\/p>", "options": ["<p><span lang=\"EN-IN\">Option 1<\/span><\/p>", "<p><span lang=\"EN-IN\">Option 2<\/span><\/p>", "<p><span lang=\"EN-IN\">Option 3<\/span><\/p>", "<p><span lang=\"EN-IN\">Option 4<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p>Ignore the blanks and read the paragraph. At blank 3, the sentence post that talks about the sense of security in a herd with an example of risk of being hit by a car reduced. Also, the previous line speaks about the part of brain which controls fear. To shift gear to sense of security we need conjunction like ‘while.’ So, <strong>the answer is option 3<\/strong>.<\/p>\n<p>Option 1- Starting the paragraph with ‘while’ makes no sense, even though the line touches the topic but still ambiguity prevails.<\/p>\n<p>Option 2 – The line following blank 2 is evidence of how fear makes us vulnerable and the sentence in question ends with the sense of protection which does not match to the following evidence.<\/p>\n<p>Option 4 – At blank 4 it looks repetitive as it has already been discussed with evidence earlier.<\/p>\n<p>Hence, [3].<\/p>", "topic": "Paragraph Completion"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;
function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
