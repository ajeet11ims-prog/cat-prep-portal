<script type="application/json" id="test-data">{"testNumber": 17, "simcat": 2, "minutes": 40, "questions": [{"number": 1, "sourceId": "83670", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>Each race contributes something essential\r\n  to the world's civilization in the course of its own self-expression and\r\n  self-realization. The character built up in solving its own problems, in the\r\n  experience of its own misfortunes, is itself a gift which each offers to the\r\n  world. The essential contribution of India, then, is simply her Indianness;\r\n  her great humiliation would be to substitute or to have substituted for this\r\n  own character (<i>svabhava<\/i>) a cosmopolitan veneer, for then indeed she\r\n  must come before the world empty-handed.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><span>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;  <\/span><o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>If now we ask what is\r\n  most distinctive in this essential contribution, we must first make it clear\r\n  that there cannot be anything absolutely unique in the experience of any\r\n  race. Its peculiarities will be chiefly a matter of selection and emphasis,\r\n  certainly not a difference in specific humanity. If we regard the world as a\r\n  family of nations, then we shall best understand the position of India by\r\n  recognizing in her the elder, who no longer, it is true, possesses the\r\n  virility and enterprise of youth, but has passed through many experiences and\r\n  solved many problems which younger races have hardly yet recognized. The\r\n  heart and essence of the Indian experience is to be found in a constant\r\n  intuition of the unity of all life, and the instinctive and ineradicable\r\n  conviction that the recognition of this unity is the highest good and the\r\n  uttermost freedom. All that India can offer to the world proceeds from her\r\n  philosophy. This philosophy is not, indeed, unknown to others it is equally\r\n  the gospel of Jesus and of Blake, Lao Tze and Rumi but nowhere else has it\r\n  been made the essential basis of sociology and education.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span\r\n  lang=EN-US>Where the Indian mind differs most from the average mind of modern\r\n  Europe is in its view of the value of philosophy. In Europe and America the\r\n  study of philosophy is of but little importance to the ordinary man. In\r\n  India, on the contrary, philosophy is not regarded primarily as a mental\r\n  gymnastic, but rather, and with deep religious conviction, as our salvation (<i>moksha<\/i>)\r\n  from the ignorance (<i>avidya<\/i>) which for ever hides from our eyes the\r\n  vision of reality. Philosophy is the key to the map of life, by which are set\r\n  forth the meaning of life and the means of attaining its goal. It is no\r\n  wonder, then, that the Indians have pursued the study of philosophy with\r\n  enthusiasm, for these are matters that concern all.<\/span><span lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div>", "options": ["<p><span lang=\"EN-US\">Both I and II<\/span><\/p>", "<p><span lang=\"EN-US\">Both II and III<\/span><\/p>", "<p><span lang=\"EN-US\">Both I and III<\/span><\/p>", "<p><span lang=\"EN-US\">I, II and III<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">Statement II is incorrect since the second paragraph clearly states that there can be no race that can have experience or insights that are absolutely unique to it. Statement I is clearly stated in the second paragraph; India is the elder race which has passed through stages which the younger ones are yet to pass. Statement III is stated in the last two sentences of the second paragraph and the third paragraph. Hence, (3).<\/span><\/p>", "topic": "Application Question"}, {"number": 2, "sourceId": "83671", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>Each race contributes something essential\r\n  to the world's civilization in the course of its own self-expression and\r\n  self-realization. The character built up in solving its own problems, in the\r\n  experience of its own misfortunes, is itself a gift which each offers to the\r\n  world. The essential contribution of India, then, is simply her Indianness;\r\n  her great humiliation would be to substitute or to have substituted for this\r\n  own character (<i>svabhava<\/i>) a cosmopolitan veneer, for then indeed she\r\n  must come before the world empty-handed.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><span>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;  <\/span><o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>If now we ask what is\r\n  most distinctive in this essential contribution, we must first make it clear\r\n  that there cannot be anything absolutely unique in the experience of any\r\n  race. Its peculiarities will be chiefly a matter of selection and emphasis,\r\n  certainly not a difference in specific humanity. If we regard the world as a\r\n  family of nations, then we shall best understand the position of India by\r\n  recognizing in her the elder, who no longer, it is true, possesses the\r\n  virility and enterprise of youth, but has passed through many experiences and\r\n  solved many problems which younger races have hardly yet recognized. The\r\n  heart and essence of the Indian experience is to be found in a constant\r\n  intuition of the unity of all life, and the instinctive and ineradicable\r\n  conviction that the recognition of this unity is the highest good and the\r\n  uttermost freedom. All that India can offer to the world proceeds from her\r\n  philosophy. This philosophy is not, indeed, unknown to others it is equally\r\n  the gospel of Jesus and of Blake, Lao Tze and Rumi but nowhere else has it\r\n  been made the essential basis of sociology and education.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span\r\n  lang=EN-US>Where the Indian mind differs most from the average mind of modern\r\n  Europe is in its view of the value of philosophy. In Europe and America the\r\n  study of philosophy is of but little importance to the ordinary man. In\r\n  India, on the contrary, philosophy is not regarded primarily as a mental\r\n  gymnastic, but rather, and with deep religious conviction, as our salvation (<i>moksha<\/i>)\r\n  from the ignorance (<i>avidya<\/i>) which for ever hides from our eyes the\r\n  vision of reality. Philosophy is the key to the map of life, by which are set\r\n  forth the meaning of life and the means of attaining its goal. It is no\r\n  wonder, then, that the Indians have pursued the study of philosophy with\r\n  enthusiasm, for these are matters that concern all.<\/span><span lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Based on the passage, it can be said that the author believes that:<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">despite their differences, different races can learn from each others' experiences.<\/span><\/p>", "<p><span lang=\"EN-US\">different races can apply the same solutions to deal with their problems, their differences notwithstanding.<\/span><\/p>", "<p><span lang=\"EN-US\">older races should guide younger races by helping them anticipate the problems they are likely to face.<\/span><\/p>", "<p><span lang=\"EN-US\">the underlying unity of life is something that other civilizations have not been able to intuit.<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\">The whole passage is about what India can offer to the world; the implicit assumption is that races can learn from one another's experiences. Option (1) states this. Option (2) is incorrect since the author does not say that the same solutions can be applied across countries. Option (3) is incorrect since the author never states that older races should guide younger races; he only says that younger races can learn from older races like India. Option (4) is incorrect since the last sentence of the second paragraph sates that other people from other civilizations have been able to intuit the underlying unity. Hence, (1).<\/span><\/p>", "topic": "Application Question"}, {"number": 3, "sourceId": "83672", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>Each race contributes something essential\r\n  to the world's civilization in the course of its own self-expression and\r\n  self-realization. The character built up in solving its own problems, in the\r\n  experience of its own misfortunes, is itself a gift which each offers to the\r\n  world. The essential contribution of India, then, is simply her Indianness;\r\n  her great humiliation would be to substitute or to have substituted for this\r\n  own character (<i>svabhava<\/i>) a cosmopolitan veneer, for then indeed she\r\n  must come before the world empty-handed.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><span>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;  <\/span><o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>If now we ask what is\r\n  most distinctive in this essential contribution, we must first make it clear\r\n  that there cannot be anything absolutely unique in the experience of any\r\n  race. Its peculiarities will be chiefly a matter of selection and emphasis,\r\n  certainly not a difference in specific humanity. If we regard the world as a\r\n  family of nations, then we shall best understand the position of India by\r\n  recognizing in her the elder, who no longer, it is true, possesses the\r\n  virility and enterprise of youth, but has passed through many experiences and\r\n  solved many problems which younger races have hardly yet recognized. The\r\n  heart and essence of the Indian experience is to be found in a constant\r\n  intuition of the unity of all life, and the instinctive and ineradicable\r\n  conviction that the recognition of this unity is the highest good and the\r\n  uttermost freedom. All that India can offer to the world proceeds from her\r\n  philosophy. This philosophy is not, indeed, unknown to others it is equally\r\n  the gospel of Jesus and of Blake, Lao Tze and Rumi but nowhere else has it\r\n  been made the essential basis of sociology and education.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span\r\n  lang=EN-US>Where the Indian mind differs most from the average mind of modern\r\n  Europe is in its view of the value of philosophy. In Europe and America the\r\n  study of philosophy is of but little importance to the ordinary man. In\r\n  India, on the contrary, philosophy is not regarded primarily as a mental\r\n  gymnastic, but rather, and with deep religious conviction, as our salvation (<i>moksha<\/i>)\r\n  from the ignorance (<i>avidya<\/i>) which for ever hides from our eyes the\r\n  vision of reality. Philosophy is the key to the map of life, by which are set\r\n  forth the meaning of life and the means of attaining its goal. It is no\r\n  wonder, then, that the Indians have pursued the study of philosophy with\r\n  enthusiasm, for these are matters that concern all.<\/span><span lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following summarizes the difference between the role of philosophy in Europe and America vis-Ã -vis its role in India?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">In the former it is approached through the mind while in the latter it is approached though the soul.<\/span><\/p>", "<p><span lang=\"EN-US\">In the former it is pursued academically but in the latter it is pursued with enthusiasm.<\/span><\/p>", "<p><span lang=\"EN-US\">In the former it is not concerned with understanding the meaning of life, while in the latter it is.<\/span><\/p>", "<p><span lang=\"EN-US\">In the former philosophy is an end in itself; in the latter it is the means to attaining spiritual goals.<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">The last paragraph states that in Europe and America, the ordinary man has nothing to do with the study of philosophy and unlike in India, it remains a mental gymnastic. In other words, in Europe and America philosophy is a subject of study and an end in itself, but in India, as the paragraph goes on to state, it is a means to realize the meaning of life. Option (4) states this. Option (1) is incorrect since it is not mentioned in the passage. Option (2) is incorrect since it does not refer to the role played by philosophy. Option (3) is incorrect since while it is stated that in India, philosophy is the basis of our sociology and education and even the ordinary man uses it to achieve salvation, it is not stated that philosophers in the West have not used philosophy to determine the meaning of life. Hence, (4).<\/span><\/p>", "topic": "Application Question"}, {"number": 4, "sourceId": "83673", "type": "mcq", "passage": "<p><span lang=\"EN-US\">What, exactly, happens when we feel disgust? As Daniel Kelly, an assistant professor of philosophy at Purdue University, explains in his new book, it's not just a physical sensation; it's a powerful emotional warning sign. Although disgust initially helped keep us away from rotting food and contagious disease, the defense mechanism changed over time to affect the distance we keep from one another. When allowed to play a role in the creation of social policy, Kelly argues, disgust might actually cause more harm than good.<\/span><\/p><p><span lang=\"EN-US\">Simply speaking, disgust is the response we have to things we find repulsive. Some of the things that trigger disgust are innate, like the smell of sewage on a hot summer day. We have a base layer of core disgusting things, and a lot of them don't seem like they're learnt. But there's also a whole set of things that have a lot of cultural and individual variation about whether it's considered disgusting. The core base of what causes disgust has expanded to the point where certain kinds of moral violations, social transgressions, and even value systems of groups one is not a member of can come to be disgusting as well.<\/span><\/p><p><span lang=\"EN-US\">It's an indisputable fact at this point that disgust influences a lot of social and moral judgments in a variety of ways. An interesting question is whether or not feelings of disgust should play a part in deliberate decision making. If a large percentage of the population finds some social practice disgusting — like stem cell research or cloning — is that a good reason to think the practice is immoral? I argue that it should not. A practice people are disgusted by may or may not be immoral, but the fact that people are disgusted by it is totally irrelevant to that particular question. We shouldn't trust disgust to give us reliable information about morality. We know the story of how it evolved and why it varies from one culture to the next. Investing the emotion with moral authority is extremely dubious, and we shouldn't uncritically trust it.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div>", "options": ["<p><span lang=\"EN-US\">I and III<\/span><\/p>", "<p><span lang=\"EN-US\">II and III<\/span><\/p>", "<p><span lang=\"EN-US\">only I<\/span><\/p>", "<p><span lang=\"EN-US\">only II<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">In the passage, the author does not mention any disgust response related to social hierarchy. He only says that 'even value systems of groups one is not a member of can come to be disgusting as well.' That does not mean that it results in creating social inequality; hence question II is not related to the passage. Though the author elaborates our reaction to things we find disgusting, such as fetid smell, rotting food, etc, he does not dwell on the subtle difference between disgust and dislike. Therefore, we do not find the answer of question III in the passage. The last sentence of the first paragraph and the entire third paragraph give us answers to question I. Hence, [3].<\/span><\/p>", "topic": "Application Question"}, {"number": 5, "sourceId": "83674", "type": "mcq", "passage": "<p><span lang=\"EN-US\">What, exactly, happens when we feel disgust? As Daniel Kelly, an assistant professor of philosophy at Purdue University, explains in his new book, it's not just a physical sensation; it's a powerful emotional warning sign. Although disgust initially helped keep us away from rotting food and contagious disease, the defense mechanism changed over time to affect the distance we keep from one another. When allowed to play a role in the creation of social policy, Kelly argues, disgust might actually cause more harm than good.<\/span><\/p><p><span lang=\"EN-US\">Simply speaking, disgust is the response we have to things we find repulsive. Some of the things that trigger disgust are innate, like the smell of sewage on a hot summer day. We have a base layer of core disgusting things, and a lot of them don't seem like they're learnt. But there's also a whole set of things that have a lot of cultural and individual variation about whether it's considered disgusting. The core base of what causes disgust has expanded to the point where certain kinds of moral violations, social transgressions, and even value systems of groups one is not a member of can come to be disgusting as well.<\/span><\/p><p><span lang=\"EN-US\">It's an indisputable fact at this point that disgust influences a lot of social and moral judgments in a variety of ways. An interesting question is whether or not feelings of disgust should play a part in deliberate decision making. If a large percentage of the population finds some social practice disgusting — like stem cell research or cloning — is that a good reason to think the practice is immoral? I argue that it should not. A practice people are disgusted by may or may not be immoral, but the fact that people are disgusted by it is totally irrelevant to that particular question. We shouldn't trust disgust to give us reliable information about morality. We know the story of how it evolved and why it varies from one culture to the next. Investing the emotion with moral authority is extremely dubious, and we shouldn't uncritically trust it.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following statements would the author most vehemently oppose?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Something we find disgusting will definitely capture our attention because we're quite sensitized to them.<\/span><\/p>", "<p><span lang=\"EN-US\">Disgust can be used as a social tool to get rid of something we all logically agree is morally pernicious.<\/span><\/p>", "<p><span lang=\"EN-US\">Disgust can be a very powerful rhetorical tool to discredit an opponent or a group of people with whom you don't agree.<\/span><\/p>", "<p><span lang=\"EN-US\">Disgust is a really potent emotion, and using it can be pretty rousing and effective because it has an almost subliminal influence on how we think of things.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">Option (1) can be validated from the second paragraph. Disgust is a powerful warning sign and we are inherently conditioned to express disgust at some scenarios. Referring to the example used in the same paragraph, we can say foul smell will always attract our attention and elicit the same response. The last sentence of the second paragraph and the first sentence of the last paragraph help us infer (3). (4) follows from the statement in paragraph one that<span>   <\/span>disgust is 'not just a physical sensation; it's a powerful emotional warning sign' and the first sentence of the third paragraph. In the last paragraph, the author says that though our sense of disgust colours a lot of social and moral judgements, we should not uncritically trust it. He clearly says that 'A practice people are disgusted by may or may not be immoral, but the fact that people are disgusted by it is totally irrelevant to that particular question. We shouldn't trust disgust to give us reliable information about morality'. Therefore, the author will strongly oppose (2). Hence, [2].<\/span><\/p>", "topic": "Application Question"}, {"number": 6, "sourceId": "83675", "type": "mcq", "passage": "<p><span lang=\"EN-US\">What, exactly, happens when we feel disgust? As Daniel Kelly, an assistant professor of philosophy at Purdue University, explains in his new book, it's not just a physical sensation; it's a powerful emotional warning sign. Although disgust initially helped keep us away from rotting food and contagious disease, the defense mechanism changed over time to affect the distance we keep from one another. When allowed to play a role in the creation of social policy, Kelly argues, disgust might actually cause more harm than good.<\/span><\/p><p><span lang=\"EN-US\">Simply speaking, disgust is the response we have to things we find repulsive. Some of the things that trigger disgust are innate, like the smell of sewage on a hot summer day. We have a base layer of core disgusting things, and a lot of them don't seem like they're learnt. But there's also a whole set of things that have a lot of cultural and individual variation about whether it's considered disgusting. The core base of what causes disgust has expanded to the point where certain kinds of moral violations, social transgressions, and even value systems of groups one is not a member of can come to be disgusting as well.<\/span><\/p><p><span lang=\"EN-US\">It's an indisputable fact at this point that disgust influences a lot of social and moral judgments in a variety of ways. An interesting question is whether or not feelings of disgust should play a part in deliberate decision making. If a large percentage of the population finds some social practice disgusting — like stem cell research or cloning — is that a good reason to think the practice is immoral? I argue that it should not. A practice people are disgusted by may or may not be immoral, but the fact that people are disgusted by it is totally irrelevant to that particular question. We shouldn't trust disgust to give us reliable information about morality. We know the story of how it evolved and why it varies from one culture to the next. Investing the emotion with moral authority is extremely dubious, and we shouldn't uncritically trust it.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following can be inferred from the passage?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">The groups that are most likely to elicit disgust are often the lowest on the social hierarchy.<\/span><\/p>", "<p><span lang=\"EN-US\">Our milieu may have a lot of influence on what we find disgusting, but past a certain point, our sensibilities are fixed.<\/span><\/p>", "<p><span lang=\"EN-US\">An acute exposure to something can have the effect of decreasing our feeling of disgust towards it.<\/span><\/p>", "<p><span lang=\"EN-US\">Since the culture we grow up in can fine-tune our disgust response, there is no room for individual disparities.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">Option (1) cannot be inferred from the passage because the author does not mention anything about the relation between disgust and social strata. That our feeling of disgust is decreased with continuous exposure to the thing that we find repulsive is beyond the purview of the passage; thus, (3) is also eliminated. Option (4) contradicts the sentence 'But there's also a whole set of things that have a lot of cultural and individual variation about whether it's considered disgusting.' from the second paragraph. (2) can be inferred from the second paragraph. There is a set of disgust responses that are culture dependent. But we inherently have a base layer of core disgusting things and our views regarding them always remain same. Hence, [2].<\/span><\/p>", "topic": "Inference"}, {"number": 7, "sourceId": "84918", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>The sentences given in the question  below when properly sequenced, form a coherent paragraph. Each sentence is labelled with a letter. Enter in the box provided below the most logical order of sentences  to construct a coherent paragraph.<\/p>\n<p>Note: <em>Your answer should  be a combination of  letters indicating the order of the sentences<em> .Use the virtual keyboard to enter your answer.<\/em><\/em><\/p><\/div>", "options": [], "answer": "DCEBA", "answerLabel": "DCEBA", "solution": "<p><span lang=\"EN-US\">The opening sentence has to be D since it is a statement that introduces the idea of the paragraph, a new strain of populism. C has to follow D since it elaborates on this new strain while E goes into a more detail; hence D has to be followed by C and E. B refers to a threat, stated in E, and hence has to follow it. A completes the paragraph by stating who is behind this new strain of populism, the libertarian mob. Thus, DCEBA. Hence, [DCEBA].<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 8, "sourceId": "84919", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>The sentences given in the question  below when properly sequenced, form a coherent paragraph. Each sentence is labelled with a letter. Enter in the box provided below the most logical order of sentences  to construct a coherent paragraph.<\/p>\n<p>Note: <em>Your answer should  be a combination of  letters indicating the order of the sentences<em> .Use the virtual keyboard to enter your answer.<\/em><\/em><\/p><\/div>", "options": [], "answer": "CBEAD", "answerLabel": "CBEAD", "solution": "<p><span lang=\"EN-US\">The topic of the paragraph is stated in sentence C - the landmark, 1922 poem by T.S. Eliot, <em>The Waste Land<\/em>. B has to follow it since it refers to the content of the poem and says that it puzzled many readers. E follows B since it elaborates on the puzzling nature of the poem, which led to multiple interpretations. A should follow E because A states how a reader should approach this poem. D has to follow A since it refers to why the poem wouldn't be published. Thus, the correct sequence is CBEAD. Hence, [CBEAD].<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 9, "sourceId": "84920", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The sentences given in each question, when properly sequenced form a coherent paragraph. Each sentence is labelled with a letter. Enter in the box provided below the letters corresponding to the most logical order of the sentences to construct a coherent paragraph.<\/span><\/p>\n<p><span lang=\"EN-US\">Note: Your answer should be a combination of letters. Use the virtual keyboard provided to enter your answer. <\/span><\/p><\/div>", "options": [], "answer": "DBCA", "answerLabel": "DBCA", "solution": "<p><span lang=\"EN-US\">The subject of the paragraph is given only in sentence D, which is the starter as seen from the options. B has to follow D since <em>that commentary<\/em> in B refers to the commentary on Pushkin's epic mentioned in D. C has to follow B since <em>it<\/em> refers to <em>Notes on Prosody<\/em> mentioned in B. A contrast Nabokov's view of older English verse forms with Russian verse forms. A can come only after B because of the starter 'on the other hand'. Thus, the correct sequence is DBCA. Hence, [DBCA].<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 10, "sourceId": "84921", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The sentences given in each question, when properly sequenced form a coherent paragraph. Each sentence is labelled with a letter. Enter in the box provided below the letters corresponding to the most logical order of the sentences to construct a coherent paragraph.<\/span><\/p>\n<p><span lang=\"EN-US\"> <\/span><\/p>\n<p><em><span lang=\"EN-US\">Note: Your answer should be a combination of letters. Use the virtual keyboard to enter your answer. <\/span><\/em><\/p><\/div>", "options": [], "answer": "CBDA", "answerLabel": "CBDA", "solution": "<p><span lang=\"EN-US\">The subject of the paragraph is political risk, which is stated in B and C. But C introduces the effect of political risk in a more general sense than B and therefore should precede B. Thus the first two sentences are C and B in that order. A starts with 'but', which indicates a contrast and hence should follow D. Thus, the correct sequence is CBDA. Hence, [CBDA].<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 11, "sourceId": "84922", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The sentences given in each question, when properly sequenced form a coherent paragraph. Each sentence is labelled with a letter. Enter in the box provided below the letters corresponding to the most logical order of the sentences to construct a coherent paragraph.<\/span><\/p>\n<p><em><span lang=\"EN-US\">Note: Your answer should be a combination of letters. Use the virtual keyboard to enter your answer. <\/span><\/em><\/p><\/div>", "options": [], "answer": "DCBAE", "answerLabel": "DCBAE", "solution": "<p><span lang=\"EN-US\">D introduces the topic: the similarity between tuberculosis (TB) and cancer. The next sentence has to thus elaborate on the topic. C best follows D since it elaborates the similarity: both of them evoke the same reactions since they are diseases that are incurable and cannot be properly understood. B should follow C since it classifies such a disease as mysterious. A follows B since it describes the reaction that TB evoked because of its mysterious nature. E states that now it is cancer's turn to evoke the same reactions since it is as of now mysterious. Hence, [DCBAE]<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 12, "sourceId": "76911", "type": "mcq", "passage": "<p>Given the wealth and depth of the evidence that refutes the model of self-interested rationality, why does it still dominate? The myth of universal selfishness endures in part because it isn't entirely wrong–only mostly so. We all have experienced moments when we have caved in to self-interest even when other values demanded something else. We can recognize ourselves in the story of rational self-interest. However, it's a problem when we take a partial truth and treat it as though it were the whole. We then build systems, like the Wall Street Game, that drive almost everyone to act in a self-interested way instead of the Community Game, where the self-interested are a minority.<\/p>   <p>The roots of the assumption about universal selfishness are probably as old as human culture. Nonetheless, it gained prominence from the 1950s to the 1980s, becoming dominant in public discourse around the world during the Cold War, when the global power struggle between the United States and former Soviet Union was couched as an ideological battle between capitalism and free enterprise, on the one hand, and socialism and collectivism on the other. Nothing is more seductive than seeing our moral and political views vindicated as those that scientifically reflect human nature. The end of the Cold War era has made it possible to see new scientific observations for what they are: progress rather than a threat to capitalism.<\/p>   <p>Human beings tend to seek simple and neat explanations for a complex world. A straightforward, uncomplicated theory of human nature that reduces our actions to simple, predictable responses to rewards and punishments is appealing to the human mind. Almost two generations of human beings have been educated and socialized to think in terms of universal selfishness. \"We need to get the incentives right\" has been the watchword for anyone engaged in designing any kind of interaction, organization, or law. \"What's in it for him/her/us?\" is the question we have trained ourselves to ask first. Once we get into the habit of thinking of ourselves in a particular way, we tend to interpret all the evidence we encounter to fit our preconceptions and assumptions. But our experiences are more complex.<\/p>   <p>When we see acts of generosity or cooperation, for example, we tend to interpret them through the lens of self-interest. The first generation of economic scholarship on open source software analyzed the voluntary contributions of participants as an attempt to improve their reputations and long-term employment prospects–interpretations that were refuted by the decade of empirical research that followed. Through sheer force of habit, our erroneous beliefs and ways of thinking about human nature are interpreted as evidence and become entrenched. New insights need to overcome substantial barriers before they are accepted.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>Read the passage below and answer the questions that follow.<\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Based on the passage, it can be inferred that during the Cold War:<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">socialism was positioned against capitalism based on the premise that human beings are inherently selfish and thus an ideology based on individual freedom is flawed.<\/span><\/p>", "<p><span lang=\"EN-US\">capitalism was positioned against socialism based on the premise that human beings are inherently selfish and thus an ideology based on good of the collective is flawed.<\/span><\/p>", "<p><span lang=\"EN-US\">socialism was positioned against capitalism using the premise that human beings are not selfish and thus an ideology that is based on the good of the collective is appropriate to human nature.<\/span><\/p>", "<p><span lang=\"EN-US\">capitalism was positioned against socialism based on the premise that human beings are not selfish and thus an ideology based on individual freedom is appropriate to human nature.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">From the first two paragraphs of the passage we can infer that self-interested rationality is an aspect of capitalism. On the other hand, socialism and collectivism, which imply the collection or the group is more important that the individuals constituting it, leave no scope for individual selfishness. Option (1) is, thus, incorrect because socialism and inherent selfishness of human beings cannot be aligned. They are mutually exclusive groups. The first paragraph, emphasises the point that human beings are inherently selfish. So, (3) cannot be true. Capitalism is a reflection of the universal selfishness, thus (4) is self-contradictory. Only (2) is a valid inference. Hence, [2].<\/span><\/p>", "topic": "Inference"}, {"number": 13, "sourceId": "76912", "type": "mcq", "passage": "<p>Given the wealth and depth of the evidence that refutes the model of self-interested rationality, why does it still dominate? The myth of universal selfishness endures in part because it isn't entirely wrong–only mostly so. We all have experienced moments when we have caved in to self-interest even when other values demanded something else. We can recognize ourselves in the story of rational self-interest. However, it's a problem when we take a partial truth and treat it as though it were the whole. We then build systems, like the Wall Street Game, that drive almost everyone to act in a self-interested way instead of the Community Game, where the self-interested are a minority.<\/p>   <p>The roots of the assumption about universal selfishness are probably as old as human culture. Nonetheless, it gained prominence from the 1950s to the 1980s, becoming dominant in public discourse around the world during the Cold War, when the global power struggle between the United States and former Soviet Union was couched as an ideological battle between capitalism and free enterprise, on the one hand, and socialism and collectivism on S\"> Both II and III<\/span><\/p>", "<p><span lang=\"EN-US\"> Both I and III<\/span><\/p>", "<p><span lang=\"EN-US\"> I, II and III<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\"> The example of economic scholarship on open source software, used in the last paragraph, help us validate statement I. The third paragraph states that 'A straightforward, uncomplicated theory of human nature that reduces our actions to simple, predictable responses to rewards and punishments is appealing to the human mind.' But to infer that societies cannot be built without reducing the complexity of the human nature into easily understandable theories is an exaggeration; hence statement II is not valid. The third paragraph, mainly the sentence 'Almost two generations of human beings have been educated and socialized to think in terms of universal selfishness' helps us infer statement III. Only I and III are valid. Hence, [3].<\/span><\/p>", "topic": "Inference"}, {"number": 14, "sourceId": "76913", "type": "mcq", "passage": "<p>Given the wealth and depth of the evidence that refutes the model of self-interested rationality, why does it still dominate? The myth of universal selfishness endures in part because it isn't entirely wrong–only mostly so. We all have experienced moments when we have caved in to self-interest even when other values demanded something else. We can recognize ourselves in the story of rational self-interest. However, it's a problem when we take a partial truth and treat it as though it were the whole. We then build systems, like the Wall Street Game, that drive almost everyone to act in a self-interested way instead of the Community Game, where the self-interested are a minority.<\/p>   <p>The roots of the assumption about universal selfishness are probably as old as human culture. Nonetheless, it gained prominence from the 1950s to the 1980s, becoming dominant in public discourse around the world during the Cold War, when the tion": "<div class=\"direction\"><p>Read the passage below and answer the questions that follow.<\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">According to the passage, human beings tend to hang on to their view of the world despite contrary evidence because:<\/span><\/p>", "options": ["<p><span lang=\"EN-US\"> they tend to mistake partial truths for the whole truth.<\/span><\/p>", "<p><span lang=\"EN-US\"> they are habituated to viewing all events through the lens of their world view.<\/span><\/p>", "<p><span lang=\"EN-US\"> they have still not been able to get over the shadow of the Cold War.<\/span><\/p>", "<p><span lang=\"EN-US\"> they believe that human beings are inherently selfish.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\"> The third and the fourth paragraphs make it very clear that human beings have a tendency to cling to their preconceived notions; in fact 'Once we get in the habit of thinking of ourselves in a particular way, we tend to interpret all the evidence we encounter to fit our preconceptions and assumptions'. Only (2) aptly conveys this idea. Hence, [2].<\/span><\/p>", "topic": "Specific Detail"}, {"number": 15, "sourceId": "77347", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>Read the passage below and answer the questions that follow.<\/p><\/div><p><span lang=\"EN-US\">According to the passage, how is Aristotle's theory of art different from that of Plato?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Plato believed that any work of art has a utilitarian goal, whereas Aristotle believed that all art is transcendental.<\/span><\/p>", "<p><span lang=\"EN-US\">Plato believed that all art is just an imitation of reality, hence useless; but Aristotle believed that art is useful because of its cathartic effect.<\/span><\/p>", "<p><span lang=\"EN-US\">Plato believed that since art is a mere simulation, it is always figurative, whereas Aristotle strongly advocated the existence of decorative and abstract art. <\/span><\/p>", "<p><span lang=\"EN-US\">According to Plato, the palpability of ordinary material things justifies their use in art, whereas Aristotle considered everything to be imitative.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">Refer to the second and third paragraphs. According to Plato, \"art is neither particularly<\/span><\/p>\n<p><span lang=\"EN-US\">useful (the painting of a bed is no good to sleep on), nor, in the strict sense, true.\" So, he<\/span><\/p>\n<p><span lang=\"EN-US\">would not believe in a utilitarian goal for art. Thus, [1] is incorrect. [3] distorts the<\/span><\/p>\n<p><span lang=\"EN-US\">information given in paragraph 3. The second paragraph states that Plato \"considered<\/span><\/p>\n<p><span lang=\"EN-US\">ordinary material things as themselves mimetic objects, imitations of transcendent forms<\/span><\/p>\n<p><span lang=\"EN-US\">or structures\", hence [4] is also ruled out. The last part of paragraph 3 states that Aristotle<\/span><\/p>\n<p><span lang=\"EN-US\">believed that art is a form of therapy in that \"it arouses and purges dangerous emotions\",<\/span><\/p>\n<p><span lang=\"EN-US\">which points to [2] as the answer. Hence, [2].<\/span><\/p>", "topic": "Specific Detail"}, {"number": 16, "sourceId": "77348", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>Read the passage below and answer the questions that follow.<\/p><\/div><p><span lang=\"EN-US\">According to the passage, despite moving away from the Greek theory of art as mimesis, which of its legacies is still evident in modern criticism of art?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Art being an imitation of transcendent forms does not have any inherent value.<\/span><\/p>", "<p><span lang=\"EN-US\">In any work of art, it is the content, which is of primary importance.<\/span><\/p>", "<p><span lang=\"EN-US\">All art is figurative in form; hence art is nothing but a kind of visual deception.<\/span><\/p>", "<p><span lang=\"EN-US\">In an art form that is purely a subjective expression, form overrides content.<span>       <\/span><\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">Refer to the last paragraph where it is clearly stated that even in modern times, \"the main feature of mimetic theory persists. Whether we conceive of the work of art on the model of a picture (art as a picture of reality) or on the model of a statement (art as the statement of the artist), content still comes first.\" Only [2] captures this idea. That art does not have any inherent value was Plato's opinion and Aristotle refuted it. Even [3] states something, which Plato believed. It is nowhere mentioned in the passage how these assumptions have influenced modern art. The last sentence of the penultimate paragraph states that content in art is considered essential, whereas form is an accessory. So, [4] is also ruled out. Hence, [2].<\/span><\/p>", "topic": "Specific Detail"}, {"number": 17, "sourceId": "77349", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>Read the passage below and answer the questions that follow.<\/p><\/div><p><span lang=\"EN-US\">Which of the following statements are true according to the passage?<\/span><\/p>\n<p><span lang=\"EN-US\">I.<span>          <\/span>In the hands of the modernist artists, the idea of art for art's sake has been turned into a tool for delimiting the<\/span><\/p>\n<p><span lang=\"EN-US\">            focus on content.<\/span><\/p>\n<p><span lang=\"EN-US\">II.<span>         <\/span>Modernist art strictly believes that a work of art is an embodiment of the creator's vision and does not have to<\/span><\/p>\n<p><span lang=\"EN-US\">            justify itself.<\/span><\/p>\n<p><span lang=\"EN-US\">III.<span>       <\/span>Compared to art in the Greek era, modernist art has shown a remarkable shift in form but the content still<\/span><\/p>\n<p><span lang=\"EN-US\">            remains unaltered.<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">I, II and III<\/span><\/p>", "<p><span lang=\"EN-US\">II and III<\/span><\/p>", "<p><span lang=\"EN-US\">I and II<\/span><\/p>", "<p><span lang=\"EN-US\">None of these <\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">The last paragraph clearly states that even in modern times, \"Whether we conceive of the <\/span><span>work of art on the model of a picture (art as a picture of reality) or on the model of a <\/span><span>statement (art as the statement of the artist), content still comes first.\" So, I is incorrect. <\/span><span>The first sentence of the last paragraph states that most artists and critics in modern times <\/span><span>favour the theory of art as subjective expression but the main feature of mimetic theory, <\/span><span>which insists that an art has to justify itself, still survives. So, II is also incorrect. The <\/span><span>passage does not mention anything about whether the form in art has changed over a <\/span><span>period of time. The last two sentences clearly state that the content in art may have <\/span><span>changed, that it may be 'less figurative' or 'less lucidly realistic'. So, we cannot say that <\/span><span>the content is still unaltered as incorrectly mentioned in III. Hence, [4]. <\/span><\/p>", "topic": "Application Question"}, {"number": 18, "sourceId": "34422", "type": "mcq", "passage": "<p>The United Kingdom has a disastrous record in coronary artery disease, cancer and a number of other diseases. A large proportion of the population can expect to live at least 35-45 years beyond reproductive life. For most of us the latter part of those four decades is ruined by degenerative disease.<\/p><p>Epidemiological studies show that people who consume larger amounts of fruit and vegetable in their diet have a lowered incidence of nearly all these diseases - hence the current governmental guidelines. But now it seems we can begin to move this onto a more scientific footing because the links between the pharmacological actions of these various micronutrients, and the patho-aetiology of many diseases is becoming clearer.<\/p><p>Surveys show that most of us can no longer obtain the micronutrients we need from a well-balanced diet, whatever that might be. This pattern of multiple micronutrient depletion - not deficiency - is termed Type B malnutrition, and it appears to be an increasingly likely cause of much degenerative illness. There is good evidence that depletion of many vitamins and minerals impedes anabolic processes within the body; and conversely, depletion of some of the newer micronutrients (omega 3 oils, carotenes, flavonoids, etc.) may accelerate various catabolic processes.<\/p><p>Viewed from this biologically dynamic perspective, it’s obvious that even a minor discrepancy between rates of bone formation and resorption or between atheroma deposition and clearance will eventually lead to an osteoporotic fracture or heart attack. And whereas these clinical end-points can be crisis-managed with surgery and/or drugs, they cannot be cured with drugs, if as the evidence indicates, their aetiology rests in Type B malnutrition.<\/p><p>Free radicals, antioxidants and even glycosolation/cross link reactions are increasingly familiar to nutritionists and newspaper columnists. By and large, however, the medical profession has shut its collective eyes and ears to this topic. It can afford to do so no longer.<\/p><p>Dr Paul Clayton (consultant in nutraceuticals and functional foods) believes that the onset of many disorders of old-age, eg. NIDDM, osteoporosis, can be delayed and potentially reversed by appropriate supplementation of the diet. Early diagnosis is vital for early treatment with nutritional supplementation but it's a pretty safe assumption that everyone over the age of 40 has degenerative disease established in all systems.<\/p><p>Dr Clayton taught us that free radicals and cross-link reactions, exacerbated by Type B malnutrition, play a role in many disease states and perhaps the aging process itself.<\/p><p>Drs Mark Draper and Charles Forsyth taught us that studies have shown that the tissues of most people on Western diet are significantly depleted of zinc, selenium, chromium and many other trace elements. Although most of these are required only in micrograms amounts, these metals have many important roles not only as coenzymes but also as antioxidant scavengers and sinks for the damaging free radicals.<\/p><p>Dr Clayton explained the importance of the antioxidants and anti-inflammatory flavonoids in fruit and vegetables for vascular integrity; and of the methyl groups in betaine, choline and the B vitamins for good quality DNA replication, cell membrane integrity and homocysteine regulation. He also explained that the ‘five fruit and veg’ government recommended diet is no longer sufficient to provide the necessary levels of vital nutrients to permit a healthy old-age.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>Read the passage below and answer the questions that follow.<\/p><\/div><p>The current governmental guidelines have been influenced by the epidemiological studies. This statement is:<\/p>", "options": ["<p>true<\/p>", "<p>false<\/p>", "<p>probably true<\/p>", "<p>probably false<\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p>Refer to the first sentence of paragraph 2 - \"Epidemiological ... governmental guidelines.\"? Hence, [1].<\/p>", "topic": "Application Question"}, {"number": 19, "sourceId": "34423", "type": "mcq", "passage": "<p>The United Kingdom has a disastrous record in coronary artery disease, cancer and a number of other diseases. A large proporti edes' anabolic processes means 'hampers' or delays. Hence, [1].<\/p>", "topic": "Specific Detail"}, {"number": 20, "sourceId": "34424", "type": "mcq", "passage": "<p>The United Kingdom has a disastrous record in coronary artery disease, cancer and a number of other diseases. A large proportion of the population can expect to live at least 35-45 years beyond reproductive life. For most of us the latter part of those four decades is ruined by degenerative disease.<\/p><p>Epidemiological studies show that people who consume larger amounts of fruit and vegetable in their diet have a lowered incidence of nearly all these diseases - hence the current governmental guidelines. But now it seems we can begin to move this onto a more scientific footing because the links between the pharmacological actions of these various micronutrients, and the patho-aetiology of many diseases is becoming clearer.<\/p><p>Surveys show that most of us can no longer obtain the micronutrients we need from a well-balanced diet, whatever that might be. This pattern of multiple micronutrient depletion - not deficiency - is termed Type B malnutrition, and it appears to be an increasingly likely cause of much degenerative illness. There is good evidence that depletion of many vitamins and minerals impedes anabolic processes within the body; and conversely, depletion of some of the newer micronutrients (omega 3 oils, carotenes, flavonoids, etc.) may accelerate various catabolic processes.<\/p><p>Viewed from this biologically dynamic perspective, it’s obvious that even a minor discrepancy between rates of bone formation and resorption or between atheroma deposition and clearance will eventually lead to an osteoporotic fracture or heart attack. And whereas these clinical end-points can be crisis-managed with surgery and/or drugs, they cannot be cured with drugs, if as the evidence indicates, their aetiology rests in Type B malnutrition.<\/p><p>Free radicals, antioxidants and even glycosolation/cross link reactions are increasingly familiar to nutritionists and newspaper columnists. By and large, however, the medical profession has shut its collective eyes and ears to this topic. It can afford to do so no longer.<\/p><p>Dr Paul Clayton (consultant in nutraceuticals and functional foods) believes that the onset of many disorders of old-age, eg. NIDDM, osteoporosis, can be delayed and potentially reversed by appropriate supplementation of the diet. Early diagnosis is vital for early treatment with nutritional supplementation but it's a pretty safe assumption that everyone over the age of 40 has degenerative disease established in all systems.<\/p><p>Dr Clayton taught us that free radicals and cross-link reactions, exacerbated by Type B malnutrition, play a role in many disease states and perhaps the aging process itself.<\/p><p>Drs Mark Draper and Charles Forsyth taught us that studies have shown that the tissues of most people on Western diet are significantly depleted of zinc, selenium, chromium and many other trace elements. Although most of these are required only in micrograms amounts, these metals have many important roles not only as coenzymes but also as antioxidant scavengers and sinks for the damaging free radicals.<\/p><p>Dr Clayton explained the importance of the antioxidants and anti-inflammatory flavonoids in fruit and vegetables for vascular integrity; and of the methyl groups in betaine, choline and the B vitamins for good quality DNA replication, cell membrane integrity and homocysteine regulation. He also explained that the ‘five fruit and veg’ government recommended diet is no longer sufficient to provide the necessary levels of vital nutrients to permit a healthy old-age.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>Read the passage below and answer the questions that follow.<\/p><\/div><p>The author strongly feels that:<\/p>", "options": ["<p>Type B malnutrition plays a role in many disease states.<\/p>", "<p>the medical profession can no longer ignore free radicals and glycosolation/cross link reaction.<\/p>", "<p>everyone over the age of 40 will have osteoporosis.<\/p>", "<p>All of the above<\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p>Refer to paragraph 5 – the author’s view is reflected in the statement ‘It can afford to do so no longer.’ In the third paragraph, the author states that Type B malnutrition ‘appears to be an increasingly likely cause of much degenerative illness’, but since he doesn’t state it as a fact, we cannot say that he feels strongly about it. Hence, [2].<\/p>", "topic": "Application Question"}, {"number": 21, "sourceId": "34425", "type": "mcq", "passage": "<p>The United Kingdom has a disastrous record in coronary artery disease, cancer and a number of other diseases. A large proportion of the population can expect to live at least 35-45 years beyond reproductive life. For most of us the latter part of those four decades is ruined by degenerative disease.<\/p><p>Epidemiological studies show that people who consume larger amounts of fruit and vegetable in their diet have a lowered incidence of nearly all these diseases - hence the current governmental guidelines. But now it seems we can begin to move this onto a more scientific footing because the links between the pharmacological actions of these various micronutrients, and the patho-aetiology of many diseases is becoming clearer.<\/p><p>Surveys show that most of us can no longer obtain the micronutrients we need from a well-balanced diet, whatever that might be. This pattern of multiple micronutrient depletion - not deficiency - is termed Type B malnutrition, and it appears to be an increasingly likely cause of much degenerative illness. There is good evidence that depletion of many vitamins and minerals impedes anabolic processes within the body; and conversely, depletion of some of the newer micronutrients (omega 3 oils, carotenes, flavonoids, etc.) may accelerate various catabolic processes.<\/p><p>Viewed from this biologically dynamic perspective, it’s obvious that even a minor discrepancy between rates of bone formation and resorption or between atheroma deposition and clearance will eventually lead to an osteoporotic fracture or heart attack. And whereas these clinical end-points can be crisis-managed with surgery and/or drugs, they cannot be cured with drugs, if as the evidence indicates, their aetiology rests in Type B malnutrition.<\/p><p>Free radicals, antioxidants and even glycosolation/cross link reactions are increasingly familiar to nutritionists and newspaper columnists. By and large, however, the medical profession has shut its collective eyes and ears to this topic. It can afford to do so no longer.<\/p><p>Dr Paul Clayton (consultant in nutraceuticals and functional foods) believes that the onset of many disorders of old-age, eg. NIDDM, osteoporosis, can be delayed and potentially reversed by appropriate supplementation of the diet. Early diagnosis is vital for early treatment with nutritional supplementation but it's a pretty safe assumption that everyone over the age of 40 has degenerative disease established in all systems.<\/p><p>Dr Clayton taught us that free radicals and cross-link reactions, exacerbated by Type B malnutrition, play a role in many disease states and perhaps the aging process itself.<\/p><p>Drs Mark Draper and Charles Forsyth taught us that studies have shown that the tissues of most people on Western diet are significantly depleted of zinc, selenium, chromium and many other trace elements. Although most of these are required only in micrograms amounts, these metals have many important roles not only as coenzymes but also as antioxidant scavengers and sinks for the damaging free radicals.<\/p><p>Dr Clayton explained the importance of the antioxidants and anti-inflammatory flavonoids in fruit and vegetables for vascular integrity; and of the methyl groups in betaine, choline and the B vitamins for good quality DNA replication, cell membrane integrity and homocysteine regulation. He also explained that the ‘five fruit and veg’ government recommended diet is no longer sufficient to provide the necessary levels of vital nutrients to permit a healthy old-age.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>Read the passage below and answer the questions that follow.<\/p><\/div><p>Dr. Clayton explained the importance of the methyl groups in choline, betaine and the B vitamins:<\/p>", "options": ["<p>for vascular integrity.<\/p>", "<p>for good quality DNA replication.<\/p>", "<p>for proper implementation of the 'fruit and veg' diet.<\/p>", "<p>to facilitate early diagnosis of disorders.<\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p>Refer to the last paragraph – flavonoids in fruit and vegetables are required for vascular integrity. [3] is not relevant. [4] is true only with respect to treatment. Hence, [2].<\/p>", "topic": "Specific Detail"}, {"number": 22, "sourceId": "83657", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The following question has a sentence with a blank. Given below the sentence are four words. Choose the word that best completes the sentence.<\/span><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">When an artist uses a conceptual form of art, it means that all of the planning and decisions are made beforehand and the execution is a _______ affair.<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">momentous<\/span><\/p>", "<p><span lang=\"EN-US\">perfunctory<\/span><\/p>", "<p><span lang=\"EN-US\">circumspect<\/span><\/p>", "<p><span lang=\"EN-US\">ruminative<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">The sentence implies that an artist, by using conceptual form of art, makes a conscious decision, and leaves no further scope for planning and decision-making. Thus, the execution is just a superficial step. 'Momentous' means of great importance or significance. If all the planning and decision making is done earlier, there is nothing left for the execution to be a significant affair. On similar grounds 'ruminative', which means thoughtful or analytical can be ruled out. 'Circumspect' means cautious or wary does not fit the context at all. Only 'perfunctory', which means carried out in a superficial manner, without real interest, feeling, or effort, is appropriate for the context. Hence, (2).<\/span><\/p>", "topic": "Sentence Completion"}, {"number": 23, "sourceId": "83658", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The following question has a sentence with a blank. Given below the sentence are four words. Choose the word that best completes the sentence.<\/span><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Orwell educated himself, not without difficulty, out of racial prejudice and took a <span>________<\/span> position on the side of the workers.<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">reticent<\/span><\/p>", "<p><span lang=\"EN-US\">perspicuous<\/span><\/p>", "<p><span lang=\"EN-US\">stalwart<\/span><\/p>", "<p><span lang=\"EN-US\">capricious<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">The sentence implies that getting over racial prejudice was not an easy task for Orwell and that is why he had to 'educate' himself in that direction. After putting in such effort, it is obvious that he won't take a 'capricious', i.e., arbitrary or erratic position on the side of the underdogs. 'Reticent' meaning reluctant or reserved can also be eliminated. 'Perspicuous', meaning lucid or clearly presented, won't be appropriate in the context, which describes a person's opinion or stand. Only 'stalwart', which means firm or uncompromising, would fit the context appropriately. Hence, [3].<\/span><\/p>", "topic": "Sentence Completion"}, {"number": 24, "sourceId": "83662", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">In the following questions, there are sentences that form a paragraph. Identify the sentence(s) or part(s) of sentence(s) that is/are correct in terms of grammar and usage (including spelling, punctuation and logical consistency). Then, choose the most appropriate option.<\/span><\/p><\/div>", "options": ["<p><span lang=\"EN-US\">only B<\/span><\/p>", "<p><span lang=\"EN-US\">A and E<\/span><\/p>", "<p><span lang=\"EN-US\">B and D<\/span><\/p>", "<p><span lang=\"EN-US\">C and D<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">There is a prepositional error in part A. 'With' should be replaced by 'to'. The expression 'to make a difference to somebody' means to have an effect on the person. The excerpt is in the past tense, but B states a universal truth, therefore, in part B the present tense should be used throughout. So, B should be rewritten as:<span>   <\/span>'Dishonesty in a woman is a thing you never blame deeply'. In E, the 'honest people' referred<span>   <\/span>to are the ones whom the author already knows; so the article 'a' should be replaced by the definite article 'the'. Only parts C and D are grammatically correct. Hence, [4].<\/span><\/p>", "topic": "Miscellaneous Concepts"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;
function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
