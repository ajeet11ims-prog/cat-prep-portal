<script type="application/json" id="test-data">{"testNumber": 18, "simcat": 3, "minutes": 40, "questions": [{"number": 1, "sourceId": "68040", "type": "mcq", "passage": "<p><em>Love’s Comedy<\/em>, first published in 1862, is Ibsen’s first play on contemporary social life, in which he ends the long resurrection and exploration of the Norwegian past, from Viking times to the present, undertaken in his previous plays. This multi-layered cultural past, mythic, historical, ideological, made up something of a communal unconscious underlying and shaping modern consciousness, would expand into the large-scaled conflict of <em>Emperor and Galilean<\/em> and infiltrate the cycle of modern plays that followed. <em>Love’s Comedy<\/em> also inaugurated another persistent feature of Ibsen’s career: it was greeted with outrage and intense hostility by the critics and the public who were incensed at its unnerving thesis that romantic love and conventional marriage were fundamentally incompatible.<\/p><p>Ibsen’s paradoxical lovers, Falk and Svanhild, go at the theme with dialectical rigour and Romantic ardour, finally renouncing each other in ecstatic anguish. This paradox was too much for the Norway of the 1860s and the play was rejected by the theatres. Even worse, it aggravated the social ostracism Ibsen already was enduring.<\/p><p>Behind the love theme is the more radical Romantic one of the inevitable opposition between how things authentically should be (the ‘Idea’ to be realised by ‘Life’) and how things actually are in the ‘alienated’ world we have created around us and actually have to live in. This in fact, is the fundamental conflict of all modern dialectical drama: in e.g. George Bernard Shaw, Bertolt Brecht, and Jean Genet. It is the idea (also expressed by Shaw in <em>Man and Superman<\/em>) of conventional and fashionable society as Hell: explicitly (and jauntily) stated by the hero Falk in Act III where he tells Svanhild that the upholders of conventional society and its values who have banished him and are celebrating socially approved weddings, <br />…think they are gods, or Croesus, rich and wise;<br />And yet they drove themselves from paradise,<br />To crash headlong into the sulfurous pit.<br />There they all sit, not knowing where they are,<br />Thinking they shine in heaven, each like a star.<br />Everyone smiles between their “ahs” and “ouches”<br />And if Beelzebub towards them slouches<br />With horns and goat’s feet - and a worser feature -<br />They nudge their neighbours on their heated couches,<br />Saying, “Take off your hat. Here comes the Creator”.<\/p><p>The consequence of the hostile critical reception was that the play was not performed and, in fact it still awaits a production that could decide on whether or not it would ‘work’ in the theatre, as I am convinced it would.<\/p><p>The problem, for a modern audience, obviously is the highly elaborate rhymed-verse structure. The medium of rhymed verse sustains the characters and action of the play at a level of highly self-conscious artifice, which cannot translate into prose without removing something like the oxygen the characters breathe. Even free verse translation would have to forsake the high spirited energy with which all the characters collude in keeping up the intricate, omnipresent demands of the rhyme medium, a subtle imperative by which they are all constrained as if by a code of exquisite manners. They were conceived to live and move and have their being within such a medium and would not survive being transplanted into another. Michael Meyer, in his biography of Ibsen, notes the play’s “extreme formalism” where the characters engage in bouts of epigram which makes it seem “as if written by a modern Alexander Pope”.<\/p><p>In many ways, <em>Love’s Comedy<\/em> fulfils Shaw’s ideal of “the discussion play” for, like Shaw’s own <em>Getting Married<\/em>, it consists almost entirely of brilliant discussion from beginning to end. The central event in Act II, for example, is not an action, but Falk’s extended analogy of Love and Tea and the discussion that follows, leading to Falk’s expulsion from the ‘false Eden’ of the Halm house and garden. If one accepts that <em>Love’s Comedy<\/em> is a play of verbal rather than physical confrontations, it should be possible to create an effective performance style for it.<\/p><p>The theme and story of the play will be repeated in subsequent drama: notably in Ibsen’s <em>The Lady from the Sea<\/em>, and in George Bernard Shaw’s <em>Candida<\/em>; while the consequences of its denouement can be found, perhaps, in <em>Hedda Gabler<\/em>. Ellida Wangel, Hedda Gabler and Candida Morell follow the example of Svanhild, (relinquishing the possibility of romantic love with the rebellious poet Falk, and settling for the humdrum of quiet domestic love with the merchant, Guldstad) with similarly ambiguous dutifulness.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Read the passage below and answer the questions that follow.<\/strong><\/p><\/div><p>According to the passage, modern dialectical drama explores:<\/p>", "options": ["<p>the more radical romantic theme as accepted by conventional society.<\/p>", "<p>the fundamental conflict between how things authentically should be and how they turn out to be in an alienated world.<\/p>", "<p>the conflict faced by characters like Falk and Svanhild with romantic ardour, finally compelled to renounce each other.<\/p>", "<p>future possibilities for lovers caught in the web of anguished love.<\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p>Paragraph 3, mentions how modern dialectical drama explores the more radical love theme that shows ‘the inevitable opposition between how things should authentically be and how things actually are in the alienated world’. The second half of option [1] is contradictory to what is mentioned in the passage, while dialectical drama does not explore situations faced by characters such as Falk and Svanhild nor does it present future possibilities for anguished lovers. Hence, [3] and [4] are incorrect. Hence, [2]. <\/p>", "topic": "Specific Detail"}, {"number": 2, "sourceId": "68041", "type": "mcq", "passage": "<p><em>Love’s Comedy<\/em>, first published in 1862, is Ibsen’s first play on contemporary social life, in which he ends the long resurrection and exploration of the Norwegian past, from Viking times to the present, undertaken in his previous plays. This multi-layered cultural past, mythic, historical, ideological, made up something of a communal unconscious underlying and shaping modern consciousness, would expand into the large-scaled conflict of <em>Emperor and Galilean<\/em> and infiltrate the cycle of modern plays that followed. <em>Love’s Comedy<\/em> also inaugurated another persistent feature of Ibsen’s career: it was greeted with outrage and intense hostility by the critics and the public who were incensed at its unnerving thesis that romantic love and conventional marriage were fundamentally incompatible.<\/p><p>Ibsen’s paradoxical lovers, Falk and Svanhild, go at the theme with dialectical rigour and Romantic ardour, finally renouncing each other in ecstatic anguish. This paradox was too much for the Norway of the 1860s and the play was rejected by the theatres. Even worse, it aggravated the social ostracism Ibsen already was enduring.<\/p><p>Behind the love theme is the more radical Romantic one of the inevitable opposition between how things authentically should be (the ‘Idea’ to be realised by ‘Life’) and how things actually are in the ‘alienated’ world we have created around us and actually have to live in. This in fact, is the fundamental conflict of all modern dialectical drama: in e.g. George Bernard Shaw, Bertolt Brecht, and Jean Genet. It is the idea (also expressed by Shaw in <em>Man and Superman<\/em>) of conventional and fashionable society as Hell: explicitly (and jauntily) stated by the hero Falk in Act III where he tells Svanhild that the upholders of conventional society and its values who have banished him and are celebrating socially approved weddings, <\/p><p><br />…think they are gods, or Croesus, rich and wise;<br />And yet they drove themselves from paradise,<br />To crash headlong into the sulfurous pit.<br />There they all sit, not knowing where they are,<br />Thinking they shine in heaven, each like a star.<br />Everyone smiles between their “ahs” and “ouches”<br />And if Beelzebub towards them slouches<br />With horns and goat’s feet - and a worser feature -<br />They nudge their neighbours on their heated couches,<br />Saying, “Take off your hat. Here comes the Creator”.<\/p><p>The consequence of the hostile critical reception was that the play was not performed and, in fact it still awaits a production that could decide on whether or not it would ‘work’ in the theatre, as I am convinced it would.<\/p><p>The problem, for a modern audience, obviously is the highly elaborate rhymed-verse structure. The medium of rhymed verse sustains the characters and action of the play at a level of highly self-conscious artifice, which cannot translate into prose without removing something like the oxygen the characters breathe. Even free verse translation would have to forsake the high spirited energy with which all the characters collude in keeping up the intricate, omnipresent demands of the rhyme medium, a subtle imperative by which they are all constrained as if by a code of exquisite manners. They were conceived to live and move and have their being within such a medium and would not survive being transplanted into another. Michael Meyer, in his biography of Ibsen, notes the play’s “extreme formalism” where the characters engage in bouts of epigram which makes it seem “as if written by a modern Alexander Pope”.<\/p><p>In many ways, <em>Love’s Comedy<\/em> fulfils Shaw’s ideal of “the discussion play” for, like Shaw’s own <em>Getting Married<\/em>, it consists almost entirely of brilliant discussion from beginning to end. The central event in Act II, for example, is not an action, but Falk’s extended analogy of Love and Tea and the discussion that follows, leading to Falk’s expulsion from the ‘false Eden’ of the Halm house and garden. If one accepts that <em>Love’s Comedy<\/em> is a play of verbal rather than physical confrontations, it should be possible to create an effective performance style for it.<\/p><p>The theme and story of the play will be repeated in subsequent drama: notably in Ibsen’s <em>The Lady from the Sea<\/em>, and in George Bernard Shaw’s <em>Candida<\/em>; while the consequences of its denouement can be found, perhaps, in <em>Hedda Gabler<\/em>. Ellida Wangel, Hedda Gabler and Candida Morell follow the example of Svanhild, (relinquishing the possibility of romantic love with the rebellious poet Falk, and settling for the humdrum of quiet domestic love with the merchant, Guldstad) with similarly ambiguous dutifulness.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Read the passage below and answer the questions that follow.<\/strong><\/p><\/div><p>The plays of Ibsen and Shaw share performance style characteristics:<\/p>", "options": ["<p>of plays with verbal confrontation as opposed to physical confrontation.<\/p>", "<p>of plays with physical confrontation as opposed to verbal exchange.<\/p>", "<p>of plays crafted with artifice and elegance.<\/p>", "<p>of plays that skillfully reflect the times they lived in.<\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p>Paragraph 7, mentions how Ibsen’s  play fulfils Shaw’s  ideal of the ‘discussion play’ which is driven by ‘verbal rather that physical confrontation’. Thus, we can negate option [2], while options [3] and [4] are not suggested anywhere in the passage. Hence, [1].<\/p>", "topic": "Specific Detail"}, {"number": 3, "sourceId": "68042", "type": "mcq", "passage": "< emselves from paradise,<br />To crash headlong into the sulfurous pit.<br />There they all sit, not knowing where they are,<br />Thinking they shine in heaven, each like a star.<br />Everyone smiles between their “ahs” and “ouches”<br />And if Beelzebub towards them slouches<br />With horns and goat’s feet - and a worser feature -<br />They nudge their neighbours on their heated couches,<br />Saying, “Take off your hat. Here comes the Creator”.<\/p>\n\n<p>The consequence of the hostile critical reception was that the play was not performed and, in fact it still awaits a production that could decide on whether or not it would ‘work’ in the theatre, as I am convinced it would.<\/p>\n\n<p>The problem, for a modern audience, obviously is the highly elaborate rhymed-verse structure. The medium of rhymed verse sustains the characters and action of the play at a level of highly self-conscious artifice, which cannot translate into prose without removing something like the oxygen the characters breathe. Even free verse translation would have to forsake the high spirited energy with which all the characters collude in keeping up the intricate, omnipresent demands of the rhyme medium, a subtle imperative by which they are all constrained as if by a code of exquisite manners. They were conceived to live and move and have their being within such a medium and would not survive being transplanted into another. Michael Meyer, in his biography of Ibsen, notes the play’s “extreme formalism” where the characters engage in bouts of epigram which makes it seem “as if written by a modern Alexander Pope”.<\/p>\n\n<p>In many ways, <em>Love’s Comedy<\/em> fulfils Shaw’s ideal of “the discussion play” for, like Shaw’s own <em>Getting Married<\/em>, it consists almost entirely of brilliant discussion from beginning to end. The central event in Act II, for example, is not an action, but Falk’s extended analogy of Love and Tea and the discussion that follows, leading to Falk’s expulsion from the ‘false Eden’ of the Halm house and garden. If one accepts that <em>Love’s Comedy<\/em> is a play of verbal rather than physical confrontations, it should be possible to create an effective performance style for it.<\/p>\n\n<p>The theme and story of the play will be repeated in subsequent drama: notably in Ibsen’s <em>The Lady from the Sea<\/em>, and in George Bernard Shaw’s <em>Candida<\/em>; while the consequences of its denouement can be found, perhaps, in <em>Hedda Gabler<\/em>. Ellida Wangel, Hedda Gabler and Candida Morell follow the example of Svanhild, (relinquishing the possibility of romantic love with the rebellious poet Falk, and settling for the humdrum of quiet domestic love with the merchant, Guldstad) with similarly ambiguous dutifulness.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Read the passage below and answer the questions that follow.<\/strong><\/p><\/div><p>One may infer from the passage that the denouement in <em>Love’s Comedy<\/em>:<\/p>", "options": ["<p>advocates dutifulness.<\/p>", "<p>is cynical of romantic love.<\/p>", "<p>fails to achieve romantic love.<\/p>", "<p>prescribes a practical approach to life and love.<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p>Refer to pragraph 8 – “... relinquishes the possibility of romantic love...”. Note that Svanhild’s dutifulness is considered “ambigous by the author, So, [1] can  be negated. Options [2] and [4] are incorrect in the context of the play. Hence, [3].<\/p>", "topic": "Inference"}, {"number": 4, "sourceId": "68043", "type": "mcq", "passage": "<p><em>Love’s Comedy<\/em>, first published in 1862, is Ibsen’s first play on contemporary social life, in which he ends the long resurrection and exploration of the Norwegian past, from Viking times to the present, undertaken in his previous plays. This multi-layered cultural past, mythic, historical, ideological, made up something of a communal unconscious underlying and shaping modern consciousness, would expand into the large-scaled conflict of <em>Emperor and Galilean<\/em> and infiltrate the cycle of modern plays that followed. <em>Love’s Comedy<\/em> also inaugurated another persistent feature of Ibsen’s career: it was greeted with outrage and intense hostility by the critics and the public who were incensed at its unnerving thesis that romantic love and conventional marriage were fundamentally incompatible.<\/p><p>Ibsen’s paradoxical lovers, Falk and Svanhild, go at the theme with dialectical rigour and Romantic ardour, finally renouncing each other in ecstatic anguish. This paradox was too much for the Norway of the 1860s and the play was rejected by the theatres. Even worse, it aggravated the social ostracism Ibsen already was enduring.<\/p><p>Behind the love theme is the more radical Romantic one of the inevitable opposition between how things authentically should be (the ‘Idea’ to be realised by ‘Life’) and how things actually are in the ‘alienated’ world we have created around us and actually have to live in. This in fact, is the fundamental conflict of all modern dialectical drama: in e.g. George Bernard Shaw, Bertolt Brecht, and Jean Genet. It is the idea (also expressed by Shaw in <em>Man and Superman<\/em>) of conventional and fashionable society as Hell: explicitly (and jauntily) stated by the hero Falk in Act III where he tells Svanhild that the upholders of conventional society and its values who have banished him and are celebrating socially approved weddings, <\/p><p><br />…think they are gods, or Croesus, rich and wise;<br />And yet they drove themselves from paradise,<br />To crash headlong into the sulfurous pit.<br />There they all sit, not knowing where they are,<br />Thinking they shine in heaven, each like a star.<br />Everyone smiles between their “ahs” and “ouches”<br />And if Beelzebub towards them slouches<br />With horns and goat’s feet - and a worser feature -<br />They nudge their neighbours on their heated couches,<br />Saying, “Take off your hat. Here comes the Creator”.<\/p><p>The consequence of the hostile critical reception was that the play was not performed and, in fact it still awaits a production that could decide on whether or not it would ‘work’ in the theatre, as I am convinced it would.<\/p><p>The problem, for a modern audience, obviously is the highly elaborate rhymed-verse structure. The medium of rhymed verse sustains the characters and action of the play at a level of highly self-conscious artifice, which cannot translate into prose without removing something like the oxygen the characters breathe. Even free verse translation would have to forsake the high spirited energy with which all the characters collude in keeping up the intricate, omnipresent demands of the rhyme medium, a subtle imperative by which they are all constrained as if by a code of exquisite manners. They were conceived to live and move and have their being within such a medium and would not survive being transplanted into another. Michael Meyer, in his biography of Ibsen, notes the play’s “extreme formalism” where the characters engage in bouts of epigram which makes it seem “as if written by a modern Alexander Pope”.<\/p><p>In many ways, <em>Love’s Comedy<\/em> fulfils Shaw’s ideal of “the discussion play” for, like Shaw’s own <em>Getting Married<\/em>, it consists almost entirely of brilliant discussion from beginning to end. The central event in Act II, for example, is not an action, but Falk’s extended analogy of Love and Tea and the discussion that follows, leading to Falk’s expulsion from the ‘false Eden’ of the Halm house and garden. If one accepts that <em>Love’s Comedy<\/em> is a play of verbal rather than physical confrontations, it should be possible to create an effective performance style for it.<\/p><p>The theme and story of the play will be repeated in subsequent drama: notably in Ibsen’s <em>The Lady from the Sea<\/em>, and in George Bernard Shaw’s <em>Candida<\/em>; while the consequences of its denouement can be found, perhaps, in <em>Hedda Gabler<\/em>. Ellida Wangel, Hedda Gabler and Candida Morell follow the example of Svanhild, (relinquishing the possibility of romantic love with the rebellious poet Falk, and settling for the humdrum of quiet domestic love with the merchant, Guldstad) with similarly ambiguous dutifulness.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Read the passage below and answer the questions that follow.<\/strong><\/p><\/div><p>Falk’s dialogue in Act III:<\/p>", "options": ["<p>serves to show the protagonist’s belief that institutionalised society is deluded.<\/p>", "<p>shows a sharp contrast between the upholders of conventional, fashionable society and its values and hell.<\/p>", "<p>serves to prove that institutionalised society has not yet lost its values but that some of its members are transforming into evil characters.<\/p>", "<p>draws a parallel between hell’s characters and the three evil tempters, thus eliciting audience sympathy.<\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p>According to Falk’s dialogue, the members of society are mistaken in their belief that they are in paradise when in fact they are in hell. This proves their disillusionment. So only option [1] can be inferred. Options [2], [3] and [4] are not suggested by Falk’s dialogue. Hence, [1].<\/p>", "topic": "Application Question"}, {"number": 5, "sourceId": "68044", "type": "mcq", "passage": "<p><em>Love’s Comedy<\/em>, first published in 1862, is Ibsen’s first play on contemporary social life, in which he ends the long resurrection and exploration of the Norwegian past, from Viking times to the present, undertaken in his previous plays. This multi-layered cultural past, mythic, historical, ideological, made up something of a communal unconscious underlying and shaping modern consciousness, would expand into the large-scaled conflict of <em>Emperor a <em>Hedda Gabler<\/em>. Ellida Wangel, Hedda Gabler and Candida Morell follow the example of Svanhild, (relinquishing the possibility of romantic love with the rebellious poet Falk, and settling for the humdrum of quiet domestic love with the merchant, Guldstad) with similarly ambiguous dutifulness.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Read the passage below and answer the questions that follow.<\/strong><\/p><\/div><p>Like <em>Love’s Comedy<\/em>, the theme and story of an anguished love and a renunciation of it can be found in:<\/p>", "options": ["<p><em>The Misanthrope<\/em>, <em>Candida<\/em> and <em>Hedda Gabbler.<\/em><\/p>", "<p><em>Romeo and Juliet, The Misanthrope<\/em> and <em>Candida.<\/em><\/p>", "<p><em>The Lady from the Sea, Romeo and Juliet<\/em> and <em>Troilus and Cresside.<\/em><\/p>", "<p><em>Candida, The Lady from the Sea<\/em> and <em>Hedda Gabbler.<\/em><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p>Paragraph 8 directly states that a parallel can be found in the theme and story of the play <em>Love's Comedy<\/em> and <em>Candida,<\/em> <em>The Lady from the Sea<\/em> and <em>Hedda Gabler<\/em>.Options [1], [2] and [3] do not share a similar theme and story as found in <em>Love’s Comedy.<\/em> Hence, [4].<\/p>", "topic": "Specific Detail"}, {"number": 6, "sourceId": "68045", "type": "mcq", "passage": "<p>In the appreciation of a work of art or an art form, consideration of the receiver never proves fruitful. Not only is any reference to a certain public or its representatives misleading, but even the concept of an ‘ideal’ receiver is detrimental in the theoretical consideration of art, since all it posits is the existence and nature of man as such. Art, in the same way, posits man’s physical and spiritual existence, but in none of its works is it concerned with his response. No poem is intended for the reader, no picture for the beholder, no symphony for the listener.<\/p>\n\n<p>Is a translation meant for readers who do not understand the original? This would seem to explain adequately the divergence of their standing in the realm of art. Moreover, it seems to be the only conceivable reason for saying ‘the same thing’ repeatedly. For what does a literary work ‘say’? What does it communicate? It ‘tells’ very little to those who understand it. Its essential quality is not statement or the imparting of information. Yet any translation which intends to perform a transmitting function cannot transmit anything but information — hence, something inessential. This is the hallmark of bad translations. But do we not generally regard as the essential substance of a literary work what it contains in addition to information — as even a poor translator will admit — the unfathomable, the mysterious, the ‘poetic,’ something that a translator can reproduce only if he is also a poet? This, actually, is the cause of another characteristic of inferior translation, which consequently we may define as the inaccurate transmission of an inessential content. This will be true whenever a translation undertakes to serve the reader. However, if it were intended for the reader, the same would have to apply to the original. If the original does not exist for the reader’s sake, how could the translation be understood on the basis of this premise?<\/p>\n\n<p>Translation is a mode. To comprehend it as a mode one must go back to the original, for that contains the law governing the translation: its translatability. The question of whether a work is translatable has a dual meaning. Either: Will an adequate translator ever be found among the totality of its readers? Or, more pertinently: Does its nature lend itself to translation and, therefore, in view of the significance of the mode, call for it? In principle, the first question can be decided only contingently; the second, however, apodictically. Only superficial thinking will deny the independent meaning of the latter and declare both questions to be of equal significance. It should be pointed out that certain correlative concepts retain their meaning, and possibly their foremost significance, if they are referred exclusively to man. One might, for example, speak of an unforgettable life or moment even if all men had forgotten it. If the nature of such a life or moment required that it be unforgotten, that predicate would not imply a falsehood but merely a claim not fulfilled by men, and probably also a reference to a realm in which it is fulfilled: God’s remembrance. Analogously, the translatability of linguistic creations ought to be considered even if men should prove unable to translate them. Given a strict concept of translation, would they not really be translatable to some degree? The question as to whether the translation of certain linguistic creations is called for ought to be posed in this sense. For this thought is valid <em>here<\/em>: If translation is a mode, translatability must be an essential feature of certain works.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Read the passage below and answer the questions that follow.<\/strong><\/p><\/div><p> Which of the following questions does the author seek to answer in the passage?<\/p>\n<p><br />I. What kinds of works lend themselves to translations?<br />II. What is the function of the reader of a translated work of art?<br />III. What is a translation?<\/p>", "options": ["<p>None of the above<\/p>", "<p>I and III<\/p>", "<p>Only I<\/p>", "<p>Only III<\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p>There is no mention of the reader's function in the passage as is made clear in the very first paragraph. However, questions I and III have been answered in paragraphs 3 and 2 respectively. Hence, [2].<\/p>", "topic": "Application Question"}, {"number": 7, "sourceId": "68046", "type": "mcq", "passage": "<p>In the appreciation of a work of art or  again in another language for readers who do not understand the original.<\/p>", "<p>The imperative attribute of a work of art is to communicate information.<\/p>", "<p>That which contains something unfathomable and mysterious is the hallmark of good art.<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p>Options [1], [2] and [4] have been mentioned in paragraph 2. In paragraph 2, the author maintains that a work of art does more than just imparting information. Refer to the seventh sentence of paragraph 2. Hence, [3].<\/p>", "topic": "Application Question"}, {"number": 8, "sourceId": "68047", "type": "mcq", "passage": "<p>In the appreciation of a work of art or an art form, consideration of the receiver never proves fruitful. Not only is any reference to a certain public or its representatives misleading, but even the concept of an ‘ideal’ receiver is detrimental in the theoretical consideration of art, since all it posits is the existence and nature of man as such. Art, in the same way, posits man’s physical and spiritual existence, but in none of its works is it concerned with his response. No poem is intended for the reader, no picture for the beholder, no symphony for the listener.<\/p>\n\n<p>Is a translation meant for readers who do not understand the original? This would seem to explain adequately the divergence of their standing in the realm of art. Moreover, it seems to be the only conceivable reason for saying ‘the same thing’ repeatedly. For what does a literary work ‘say’? What does it communicate? It ‘tells’ very little to those who understand it. Its essential quality is not statement or the imparting of information. Yet any translation which intends to perform a transmitting function cannot transmit anything but information — hence, something inessential. This is the hallmark of bad translations. But do we not generally regard as the essential substance of a literary work what it contains in addition to information — as even a poor translator w  in scale and treatment for some generalisation to be made about Rogier’s intensely personal artistic vision.<\/p>\n\n<p>The moving <em>Triptych of the Virgin<\/em> exists in two versions. The one in Berlin was originally from the Charterhouse of Miraflores, near Burgos, to which it was presented by John II of Castile in 1445 as being by ‘Magistro Rogel’. Examination of this <em>Miraflores Triptych<\/em> has revealed that it is the original, while the version left by Isabella of Castile to the Capilla Real at Granada (now divided between Granada and the Metropolitan Museum, New York), is, in fact, a copy.<\/p>\n\n<p>The other two pictures are both documented as Van der Weyden’s from 16<sup>th<\/sup> century sources, notably the inventory of gifts made by Philip II of Spain to the Escorial in 1574. Still in the Escorial is a monumental Crucifixion sold in 1555 by the Charterhouse at Scheut, to which ‘Master Roger’ had given it. It was presumably sent directly to Philip, since his court painter, Anthonis Mor, provided a replacement for 30 pounds.<\/p>\n\n<p>The beautifully constructed <em>Deposition<\/em>, now in the Prado, Madrid, was brought by Philip’s aunt, Mary of Hungary, from the Archer’s Guild at Louvain. Again a copy was left in its place and the original went with Mary to Spain to pass into the royal collection.<\/p>\n\n<p>All three altarpieces, despite their enormous differences in scale and subject matter, share an emphasis on the picture as an artificial creation — that is, as a flat, painted surface — rather than as a representation of three-dimensional reality (as a contemporary Italian painting). The framing arches of the <em>Miraflores Triptych<\/em> and the gilded wooden box enclosing the <em>Deposition<\/em> distance the viewer from the painted Biblical scenes. In this way, they become far more than straightforward recreations of the original events. Their spiritual role is reinforced by the play between different levels of reality: in the <em>Deposition<\/em> the elaborately contrived figure composition in its gold box exists alongside some beautifully observed and detailed plant studies. This remarkable ability to exploit the illusionistic potential of painting is also used to imitate other art forms, such as the delicate carvings on the <em>Miraflores<\/em> arches, or the sculptural, stone-coloured figures of the Virgin and St. John in the <em>Crucifixion<\/em>. In this unusually large altarpiece, the cross is firmly rooted in the ground, yet Rogier has placed it as if it were a carved crucifix in a church. Thus, the depiction of reality is subordinated to the painting’s spiritual significance.<\/p>\n\n<p>Rogier conveys the religious meaning of his work chiefly through the intensity of his figures’ attitudes and emotions. With deliberate restraint, he eliminates or abstracts any narrative detail, unless a ‘naturalistic’ setting is essential to the meaning of the scene.<\/p>\n\n<p>As for the more dramatic emotions, Rogier is a master of orchestrating grief. But even in the violently contorted figure of the grief-stricken Magdalen in the <em>Deposition<\/em> or in the anguished souls who move towards hell in the <em>Beaune<\/em> <em>Last Judgement<\/em>, the emotion is never overplayed. In the Beaune altarpiece, no devils are needed to drive the figures of the damned, only a knowledge of their own sinfulness.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Read the passage below and answer the questions that follow.<\/strong><\/p><\/div><p>Which of the following has not been explicitly stated about Van der Weyden's paintings but can be inferred from the passage?<\/p>", "options": ["<p>They are large and vivid paintings.<\/p>", "<p>They were meant for religious use.  <\/p>", "<p>They were varied in scale.<\/p>", "<p>Both [2] and [3]<\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p>Paragraph 1 directly mentions that Weyden’s paintings are of suffi une<\/em> <em>Last Judgement<\/em>, the emotion is never overplayed. In the Beaune altarpiece, no devils are needed to drive the figures of the damned, only a knowledge of their own sinfulness.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Read the passage below and answer the questions that follow.<\/strong><\/p><\/div><p>Which of the following can best be concluded from the passage?<\/p>", "options": ["<p>Rogier Van der Weyden’s paintings convey a sense of naturalism in their treatment and effectively evoke spiritualism.<\/p>", "<p>Rogier Van der Weyden’s paintings are remarkable for the exaggerated placement of figures that depict spiritual grief.<\/p>", "<p>Though Rogier Van der Weyden focused on the artificial nature of his creations, his paintings turned out to be supremely real in their depiction of emotional and spiritual truths.<\/p>", "<p>Although Rogier Van der Weyden’s works are few, the intensity of their depiction reflects the creative genius of the artist whose vision was typical of the grand stylisation of his time.<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p>Option [1] is incorrect as naturalism is not a feature in all of Roger Van Der Weyden’s paintings. Option [2] is incorrect as it states that the placement of figures was exaggerated. The last paragraph states that he never overplayed the emotion. Option [4] is incorrect as we do not know if the artist’s works were typical of his time. Option [3] best sums up the artist’s style as explained in the passage. (Refer to paragraph 5). Hence, [3].<\/p>", "topic": "Application Question"}, {"number": 12, "sourceId": "67967", "type": "mcq", "passage": "<p>Unfortunately, there is no run of signed and dated paintings to provide a firm basis for studying Rogier van der Weyden’s art and many of his greatest works have been destroyed. Only three surviving pictures can be attributed to him with any reasonable certainty. But happily, they ar ls of reality: in the <em>Deposition<\/em> the elaborately contrived figure composition in its gold box exists alongside some beautifully observed and detailed plant studies. This remarkable ability to exploit the illusionistic potential of painting is also used to imitate other art forms, such as the delicate carvings on the <em>Miraflores<\/em> arches, or the sculptural, stone-coloured figures of the Virgin and St. John in the <em>Crucifixion<\/em>. In this unusually large altarpiece, the cross is firmly rooted in the ground, yet Rogier has placed it as if it were a carved crucifix in a church. Thus, the depiction of reality is subordinated to the painting’s spiritual significance.<\/p>\n\n<p>Rogier conveys the religious meaning of his work chiefly through the intensity of his figures’ attitudes and emotions. With deliberate restraint, he eliminates or abstracts any narrative detail, unless a ‘naturalistic’ setting is essential to the meaning of the scene.<\/p>\n\n<p>As for the more dramatic emotions, Rogier is a master of orchestrating grief. But even in the violently contorted figure of the grief-stricken Magdalen in the <em>Deposition<\/em> or in the anguished souls who move towards hell in the <em>Beaune<\/em> <em>Last Judgement<\/em>, the emotion is never overplayed. In the Beaune altarpiece, no devils are needed to drive the figures of the damned, only a knowledge of their own sinfulness.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Read the passage below and answer the questions that follow.<\/strong><\/p><\/div><p>Which of the following can be inferred about the <em>Miraflores Triptych<\/em>?<\/p>", "options": ["<p>The <em>Miraflores Triptych<\/em> has a replica that is not by Van der Wayden.<\/p>", "<p>The <em>Miraflores Triptych<\/em> was commissioned by royalty.<\/p>", "<p>The <em>Miraflores Triptych<\/em> was authenticated by experts.<\/p>", "<p>The <em>Miraflores Triptych<\/em> was one of the most dramatic paintings evoking spiritual grief.<\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p>Refer to paragraph 2.<em> The Miraflores Triptych<\/em> is said to have a replica. This replica cannot have been made by Van der Weyden as the total number of his works are three and the other two have also been named in the passage. Also, there is no information to suggest options [2], [3] and [4]. Hence, [1].<\/p>", "topic": "Inference"}, {"number": 13, "sourceId": "67968", "type": "mcq", "passage": "<p>Unfortunately, there is no run of signed and dated paintings to provide a firm basis for studying Rogier van der Weyden’s art and many of his greatest works have been destroyed. Only three surviving pictures can be attributed to him with any reasonable certainty. But happily, they are paintings of sufficient range in scale and treatment for some generalisation to be made about Rogier’s intensely personal artistic vision.<\/p>\n\n<p>The moving <em>Triptych of the Virgin<\/em> exists in two versions. The one in Berlin was originally from the Charterhouse of Miraflores, near Burgos, to which it was presented by John II of Castile in 1445 as being by ‘Magistro Rogel’. Examination of this <em>Miraflores Triptych<\/em> has revealed that it is the original, while the version left by Isabella of Castile to the Capilla Real at Granada (now divided between Granada and the Metropolitan Museum, New York), is, in fact, a copy.<\/p>\n\n<p>The other two pictures are both documented as Van der Weyden’s from 16<sup>th<\/sup> century sources, notably the inventory of gifts made by Philip II of Spain to the Escorial in 1574. Still in the Escorial is a monumental Crucifixion sold in 1555 by the Charterhouse at Scheut, to which ‘Master Roger’ had given it. It was presumably sent directly to Philip, since his court painter, Anthonis Mor, provided a replacement for 30 pounds.<\/p>\n\n<p>The beautifully constructed <em>Deposition<\/em>, now in the Prado, Madrid, was brought by Philip’s aunt, Mary of Hungary, from the Archer’s Guild at Louvain. Again a copy was left in its place and the original went with Mary to Spain to pass into the royal collection.<\/p>\n\n<p>All three altarpieces, despite their enormous differences in scale and subject matter, share an emphasis on the picture as an artificial creation — that is, as a flat, painted surface — rather than as a representation of three-dimensional reality (as a contemporary Italian painting). The framing arches of the <em>Miraflores Triptych<\/em> and the gilded wooden box enclosing the <em>Deposition<\/em> distance the viewer from the painted Biblical scenes. In this way, they become far more than straightforward recreations of the original events. Their spiritual role is reinforced by the play between different levels of reality: in the <em>Deposition<\/em> the elaborately contrived figure composition in its gold box exists alongside some beautifully observed and detailed plant studies. This remarkable ability to exploit the illusionistic potential of painting is also used to imitate other art forms, such as the delicate carvings on the <em>Miraflores<\/em> arches, or the sculptural, stone-coloured figures of the Virgin and St. John in the <em>Crucifixion<\/em>. In this unusually large altarpiece, the cross is firmly rooted in the ground, yet Rogier has placed it as if it were a carved crucifix in a church. Thus, the depiction of reality is subordinated to the painting’s spiritual significance.<\/p>\n\n<p>Rogier conveys the religious meaning of his work chiefly through the intensity of his figures’ attitudes and emotions. With deliberate restraint, he eliminates or abstracts any narrative detail, unless a ‘naturalistic’ setting is essential to the meaning of the scene.<\/p>\n\n<p>As for the more dramatic emotions, Rogier is a master of orchestrating grief. But even in the violently contorted figure of the grief-stricken Magdalen in the <em>Deposition<\/em> or in the anguished souls who move towards hell in the <em>Beaune<\/em> <em>Last Judgement<\/em>, the emotion is never overplayed. In the Beaune altarpiece, no devils are needed to drive the figures of the damned, only a knowledge of their own sinfulness.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Read the passage below and answer the questions that follow.<\/strong><\/p><\/div><p>Which of the following is true about the <em>Deposition<\/em>:<\/p>", "options": ["<p>It is a triangular painting.<\/p>", "<p>It has framed arches.<\/p>", "<p>It is painted in the Baroque style.<\/p>", "<p>It is enclosed in a gilded wooden box.<\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p>Refer to paragraph 5. The deposition is enclosed in a gilded wooden box. Hence, [4].<\/p>", "topic": "Specific Detail"}, {"number": 14, "sourceId": "67969", "type": "mcq", "passage": "<p>Unfortunately, there is no run of signed and dated paintings to provide a firm basis for studying Rogier van der Weyden’s art and many of his greatest works have been destroyed. Only three surviving pictures can be attributed to him with any reasonable certainty. But happily, they are paintings of sufficient range in scale and treatment for some generalisation to be made about Rogier’s intensely personal artistic vision.<\/p>\n\n<p>The moving <em>Triptych of the Virgin<\/em> exists in two versions. The one in Berlin was originally from the Charterhouse of Miraflores, near Burgos, to which it was presented by John II of Castile in 1445 as being by ‘Magistro Rogel’. Examination of this <em>Miraflores Triptych<\/em> has revealed that it is the original, while the version left by Isabella of Castile to the Capilla Real at Granada (now divided between Granada and the Metropolitan Museum, New York), is, in fact, a copy.<\/p>\n\n<p>The other two pictures are both documented as Van der Weyden’s from 16<sup>th<\/sup> century sources, notably the inventory of gifts made by Philip II of Spain to the Escorial in 1574. Still in the Escorial is a monumental Crucifixion sold in 1555 by the Charterhouse at Scheut, to which ‘Master Roger’ had given it. It was presumably sent directly to Philip, since his court painter, Anthonis Mor, provided a replacement for 30 pounds.<\/p>\n\n<p>The beautifully constructed <em>Deposition<\/em>, now in the Prado, Madrid, was brought by Philip’s aunt, Mary of Hungary, from the Archer’s Guild at Louvain. Again a copy was left in its place and the original went with Mary to Spain to pass into the royal collection.<\/p>\n\n<p>All three altarpieces, despite their enormous differences in scale and subject matter, share an emphasis on the picture as an artificial creation — that is, as a flat, painted surface — rather than as a representation of three-dimensional reality (as a contemporary Italian painting). The framing arches of the <em>Miraflores Triptych<\/em> and the gilded wooden box enclosing the <em>Deposition<\/em> distance the viewer from the painted Biblical scenes. In this way, they become far more than straightforward recreations of the original events. Their spiritual role is reinforced by the play between different levels of reality: in the <em>Deposition<\/em> the elaborately contrived figure composition in its gold box exists alongside some beautifully observed and detailed plant studies. This remarkable ability to exploit the illusionistic potential of painting is also used to imitate other art forms, such as the delicate carvings on the <em>Miraflores<\/em> arches, or the sculptural, stone-coloured figures of the Virgin and St. John in the <em>Crucifixion<\/em>. In this unusually large altarpiece, the cross is firmly rooted in the ground, yet Rogier has placed it as if it were a carved crucifix in a church. Thus, the depiction of reality is subordinated to the painting’s spiritual significance.<\/p>\n\n<p>Rogier conveys the religious meaning of his work chiefly through the intensity of his figures’ attitudes and emotions. With deliberate restraint, he eliminates or abstracts any narrative detail, unless a ‘naturalistic’ setting is essential to the meaning of the scene.<\/p>\n\n<p>As for the more dramatic emotions, Rogier is a master of orchestrating grief. But even in the violently contorted figure of the grief-stricken Magdalen in the <em>Deposition<\/em> or in the anguished souls who move towards hell in the <em>Beaune<\/em> <em>Last Judgement<\/em>, the emotion is never overplayed. In the Beaune altarpiece, no devils are needed to drive the figures of the damned, only a knowledge of their own sinfulness.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Read the passage below and answer the questions that follow.<\/strong><\/p><\/div><p>One may infer from the passage that Van der Weyden favoured:<\/p>", "options": ["<p>styling his characters to bring out certain emotions.<\/p>", "<p>using naturalism to convey certain attitudes.<\/p>", "<p>using symbolism to exploit the illusionistic potential of a painting.<\/p>", "<p>bringing an element of simplicity to his characters and situations. <\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p>Option [2] is incorrect as naturalism was not used all the time. Option [3] is incorrect as, even though he exploited the illusionist potential of a painting, Van der Weyden cannot be said to have used symbolism. Option [4] is incorrect as simplicity has not been mentioned in the passage. The artist is said to have been conscious of the purpose of his work and thus painted in order to achieve an effect. Refer to paragraph 5 (the crucifix and the last line). Hence, [1].<\/p>", "topic": "Inference"}, {"number": 15, "sourceId": "67970", "type": "mcq", "passage": "<p>We are accustomed to speaking of the sacred as an entity intrinsically vaster than life: we regard it as a transcendental energy of presence that animates the world, a cosmic ordering principle that helps us make sense of our experience. The sacred is acknowledged as a mystery both by reason, which describes it as the <em>numen<\/em>, and by faith, which venerates it as the Divine. And yet, paradoxically, the transcendental mystery of the sacred is always approached through specific icons, archetypal symbols or conceptual devices: whether Shiva or Vishnu, the cross or the sacred fire, the <em>Shunya<\/em> or the <em>Kaaba<\/em>. We have no universal image of the sacred. And it is, therefore, the impact of the forces of globalisation on local cultures that has brought the sacred into so extreme a condition of crisis today, across the world.<\/p>\n\n<p>The phenomenon of globalisation has drawn diverse geographical regions, social structures and economic arrangements into a single network of transactions, in which all natural and human resources are treated as potential commodities or services, and all scales of value reduced to a calculus of profit and liability. By so doing, globalisation has shattered the specificity of the local and radically destabilised all prevailing conceptions of collective identity, individual purpose, ethical obligation and political responsibility. This is especially true in the formerly colonised and economically weaker countries of the world, which have neither a cultural nor a legal apparatus of sufficient strength to oppose the decrees of globalisation, which emanate from the centres of global power in the former First World.<\/p>\n\n<p>This is not an argument for the static preservation of local cultures: there is much in them that is hierarchical, regressive and oppressive; but there is also much else that is participatory, dynamic and wise. In any case, the local must have the right to determine its own course of revision and reform, by the light of universal human principles, without having these changes imposed on it by a global authority.<\/p>\n\n<p>While globalisation may be seen to give (in the form of consumer goods and new technologies, and the access to a First-World “look” that these options generate), it is surely more important to assess what it takes away. Not only does it rob countries of control over their resources, their goods and services, and their autonomy to act as sovereign nation-states, but it also deepens existing asymmetries within societies by operating through their complicit elites to exploit their subaltern classes.<\/p>\n\n<p>With this revisitation of the East India Company syndrome goes the colossal fragmentation of an experienced totality of the world that has already been placed under strain by the onset of industrial modernity. In the epoch of globalisation, the conceptual shift from duty to choice, from consistency to multifariousness, has resulted in the loss of centredness in self and world, the release of divergent energies towards diverse objects. This loss of coherence causes an acute sense of homelessness, which none of the traditional belief-systems can remedy, unless they adapt themselves greatly to meet the surprises and shocks of the present. In the process of re-invention that ensues, some religions undergo distortion, others transfigure themselves; some wane into discreet philosophies, others are revived by ferocious bigots or rapacious gurus.<\/p>\n\n<p>To employ the marketing jargon so popular in this age, many religious traditions succumb to the pressure to “reposition themselves”, to consolidate their “brand equity”, to “find new recruits”, and to “tap new markets”. But religious practice can also transmogrify into the terrorism of doctrinaire belief, revealing that the march towards a promised Utopia can be a violent project, which destroys all obstacles in its path, plunging the world into terror and madness. The quest for the Absolute in a world of relativities can, as Kierkegaard recognised, be a demonic one.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Read the passage below and answer the questions that follow.<\/strong><\/p><\/div><p>The above passage primarily focuses on:<\/p>", "options": ["<p>the changing role of belief in society due to liberalisation.<\/p>", "<p>the altered space of the sacred in contemporary culture.<\/p>", "<p>the significance of faith in a period of disruptive, epic-scale economic and social transformation.<\/p>", "<p>globalisation and its negative impact on what is referred to as the sacred.<\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p>Option [1] is incorrect as no mention has been made of liberalisation. Option [2] constitutes only a part of the passage and option [3] is not dealt with at all. The hint lies in the last line of the first paragraph and the first line of the fourth paragraph. Hence, [4].<\/p>", "topic": "Central Idea"}, {"number": 16, "sourceId": "67971", "type": "mcq", "passage": "<p>We are accustomed to speaking of the sacred as an entity intrinsically vaster than life: we regard it as a transcendental energy of presence that animates the world, a cosmic ordering principle that helps us make sense of our experience. The sacred is acknowledged as a mystery both by reason, which describes it as the <em>numen<\/em>, and by faith, which venerates it as the Divine. And yet, paradoxically, the transcendental mystery of the sacred is always approached through specific icons, archetypal symbols or conceptual devices: whether Shiva or Vishnu, the cross or the sacred fire, the <em>Shunya<\/em> or the <em>Kaaba<\/em>. We have no universal image of the sacred. And it is, therefore, the impact of the forces of globalisation on local cultures that has brought the sacred into so extreme a condition of crisis today, across the world.<\/p>\n\n<p>The phenomenon of globalisation has drawn diverse geographical regions, social structures and economic arrangements into a single network of transactions, in which all natural and human resources are treated as potential commodities or services, and all scales of value reduced to ne of the traditional belief-systems can remedy, unless they adapt themselves greatly to meet the surprises and shocks of the present. In the process of re-invention that ensues, some religions undergo distortion, others transfigure themselves; some wane into discreet philosophies, others are revived by ferocious bigots or rapacious gurus.<\/p>\n\n<p>To employ the marketing jargon so popular in this age, many religious traditions succumb to the pressure to “reposition themselves”, to consolidate their “brand equity”, to “find new recruits”, and to “tap new markets”. But religious practice can also transmogrify into the terrorism of doctrinaire belief, revealing that the march towards a promised Utopia can be a violent project, which destroys all obstacles in its path, plunging the world into terror and madness. The quest for the Absolute in a world of relativities can, as Kierkegaard recognised, be a demonic one.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Read the passage below and answer the questions that follow.<\/strong><\/p><\/div><p>The paragraph following the last paragraph of the passage is most likely to discuss:<\/p>", "options": ["<p>an account of traditional cultures of the world.<\/p>", "<p>a discussion of symbols and icons that reflect the particularities of various cultures.<\/p>", "<p>a discussion on evolved religious practices that demonstrate the transitions of faith today.<\/p>", "<p>a discussion on the increasing politicisation of faith.<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p>Traditional cultures, symbols, icons and increasing politicisation  of  faith are  not  major topics of discussion in the passage or the final paragraph. Since the passage primarily focuses on globalisation and how it has led to degeneration of religious practices, it is most likely to be followed by a discussion on evolved religious practices  that demonstrate the transitions of faith today, how the new cults are not an aberration, but a symptom of the malaise afflicting the society. The last paragraph introduces this idea by talking about ‘repositioning’. Hence, [3].<\/p>", "topic": "Application Question"}, {"number": 17, "sourceId": "67972", "type": "mcq", "passage": "<p>We are accustomed to speaking of the sacred as an entity intrinsically vaster than life: we regard it as a transcendental energy of presence that animates the world, a cosmic ordering principle that helps us make sense of our experience. The sacred is acknowledged as a mystery both by reason, which describes it as the <em>numen<\/em>, and by faith, which venerates it as the Divine. And yet, paradoxically, the transcendental mystery of the sacred is always approached through specific icons, archetypal symbols or conceptual devices: whether Shiva or Vishnu, the cross or the sacred fire, the <em>Shunya<\/em> or the <em>Kaaba<\/em>. We have no universal image of the sacred. And it is, therefore, the impact of the forces of globalisation on local cultures that has brought the sacred into so extreme a condition of crisis today, across the world.<\/p>\n\n<p>The phenomenon of globalisation has drawn diverse geographical regions, social structures and economic arrangements into a single network of transactions, in which all natural and human resources are treated as potential commodities or services, and all scales of value reduced to a calculus of profit and liability. By so doing, globalisation has shattered the specificity of the local and radically destabilised all prevailing conceptions of collective identity, individual purpose, ethical obligation and political responsibility. This is especially true in the formerly colonised and economically weaker countries of the world, which have neither a cultural nor a legal apparatus of sufficient strength to oppose the decrees of globalisation, which emanate from the centres of global power in the former First World.<\/p>\n\n<p>This is not an argument for the static preservation of local cultures: there is much in them that is hierarchical, regressive and oppressive; but there is also much else that is participatory, dynamic and wise. In any case, the local must have the right to determine its own course of revision and reform, by the light of universal human principles, without having these changes imposed on it by a global authority.<\/p>\n\n<p>While globalisation may be seen to give (in the form of consumer goods and new technologies, and the access to a First-World “look” that these options generate), it is surely more important to assess what it takes away. Not only does it rob countries of control over their resources, their goods and services, and their autonomy to act as sovereign nation-states, but it also deepens existing asymmetries within societies by operating through their complicit elites to exploit their subaltern classes.<\/p>\n\n<p>With this revisitation of the East India Company syndrome goes the colossal fragmentation of an experienced totality of the world that has already been placed under strain by the onset of industrial modernity. In the epoch of globalisation, the conceptual shift from duty to choice, from consistency to multifariousness, has resulted in the loss of centredness in self and world, the release of divergent energies towards diverse objects. This loss of coherence causes an acute sense of homelessness, which none of the traditional belief-systems can remedy, unless they adapt themselves greatly to meet the surprises and shocks of the present. In the process of re-invention that ensues, some religions undergo distortion, others transfigure themselves; some wane into discreet philosophies, others are revived by ferocious bigots or rapacious gurus.<\/p>\n\n<p>To employ the marketing jargon so popular in this age, many religious traditions succumb to the pressure to “reposition themselves”, to consolidate their “brand equity”, to “find new recruits”, and to “tap new markets”. But religious practice can also transmogrify into the terrorism of doctrinaire belief, revealing that the march towards a promised Utopia can be a violent project, which destroys all obstacles in its path, plunging the world into terror and madness. The quest for the Absolute in a world of relativities can, as Kierkegaard recognised, be a demonic one.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Read the passage below and answer the questions that follow.<\/strong><\/p><\/div><p>How, according to the passage, have the forces of globalisation brought the sacred into a situation of crisis today?<\/p>", "options": ["<p>Globalisation tends to rob countries of control over their resources and their goods and services.<\/p>", "<p>Globalisation exploits the fact that local cultures have no universal image of the sacred.<\/p>", "<p>Globalisation fails to conceive and address the needs of the particularities of local cultures.<\/p>", "<p>Under the impact of the forces of globalisation, nation states fail to exercise autonomous control over religion.<\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p>Option [1], though it may be true, has not been mentioned as a reason for bringing the sacred into crisis. Options [3] and [4] have not been mentioned in the passage. Refer to paragraphs 1 and 2. Local cultures have no universal image of the sacred, giving globalisation a chance to step in. Hence, [2].<\/p>", "topic": "Specific Detail"}, {"number": 18, "sourceId": "67960", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Four alternative summaries are given below the text. Choose the option that best captures the essence of the text.<\/strong><\/p><\/div><p> Dust as we are, the immortal spirit grows like harmony in music; there is a dark inscrutable workmanship that reconciles discordant elements, makes them cling together. In one society. How strange that all. The terrors, pains, and early miseries, regrets, vexations, lassitudes interfused within my mind, should e’er have borne a part, and that a needful part, in making up. The calm existence that is mine when I am worthy of myself! Praise to the end!<\/p>\n\n<p>A. According to the poet, one can be worthy of oneself only when one has experienced the terrors and the pains of life and has grown above them to achieve a state of calmness.<\/p>\n<p>B. The mind fuses the past and the present in such a way that the calmness the poet feels at the moment is in a way amnesiac of the past; it is only because of this forgetfulness of the terrors of the past that the poet can be calm in the present. <\/p>\n<p>C. All the discordant elements in the poet’s life have gone into making him what he is now, and the calmness that he feels in the present is only because of having experienced the terrors in the past; this is what has made him a worthy human being.<\/p>\n<p>D. Dust we are and unto dust we will return; in the meanwhile, one must undergo all the pains and travails of life in order to become a worthy human being-- only then can one achieve a praiseworthy end.<\/p>", "options": ["<p>C<\/p>", "<p>A<\/p>", "<p>B<\/p>", "<p>D<\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p>This is a personal/autobiographical poem. The narrator in the poem is the poet, so there is no universal message implied as expressed in options [A] and [D]. So, [A] and [D] are out. Option [B] changes the meaning of the poem. It is not stated anywhere that forgetting the past has any calming effect on the poet in the present. Option [C] summarises the poem in the best way possible by bringing clarity to the lines of the verse. Hence [1]<\/p>", "topic": "Summary"}, {"number": 19, "sourceId": "34007", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>In the following question, there are sentences or parts of sentences that form a paragraph. Identify the sentence(s) or part(s) of sentence(s) that is/are correct in terms of grammar and usage (including spelling, punctuation and logical consistency). Enter in the box provided below the letters corresponding only to the correct sentences.<\/strong><\/p>\n<p><strong><em>Note: Your answer should be in letters and in alphabetical order.Use the virtual keyboard to enter your answer in the box provided below<\/em><br /><\/strong><\/p><\/div><p>A. Corn on the cob is the perfect finger food – at least for people not obsessed with counting carbohydrates.<\/p>\n\n<p>B. Quintessentially American, it's likely that corn evolved somewhere around Panama or Mexico some 5,000 to 7,000 years ago, then spread throughout the Western hemisphere.<\/p>\n\n<p>C. Its subsequent cultivation has been widely credited with letting pre-Columbian communities throughout the Americas settling down and launching their civilizations.<\/p>\n\n<p>D. Eventually agriculture, based on corn, moved into what would become the United States.<\/p>", "options": [], "answer": "AD", "answerLabel": "AD", "solution": "<p>Sentence B has a modifier error – the phrase 'quintessentially American' refers to the noun 'corn' and should therefore be placed immediately adjacent to it – i.e., 'It's likely that the quintessentially American corn...' Sentence C has incorrect forms of the verbs 'settle' and 'launch' – they are the main verbs that follow the auxiliary verb 'let', and are not parallel to it, so they should be used in the root form, not in the present participle form. Sentences A and D are completely correct. Hence, AD.<\/p>", "topic": "Miscellaneous Concepts"}, {"number": 20, "sourceId": "77355", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span><strong>The sentences given in the question  below when properly sequenced, form a coherent paragraph. Each sentence is labelled with a letter. Enter in the box provided below the most logical order of sentences to construct a coherent paragraph.<\/strong><\/span><\/p>\n<p><span><strong>Note: <em>Your answer should be a combination of letters indicating the order of the sentences<em> .Use the virtual keyboard to enter your answer.<\/em><\/em><\/strong><\/span><\/p><\/div><p><span> <\/span><\/p>", "options": [], "answer": "CBDA", "answerLabel": "CBDA", "solution": "<p><span lang=\"EN-US\">D, though appears a stand-alone sentence, cannot begin the sequence because the ideas discussed here allude to information given in sentence C. The 'nature of the material' in D is mentioned in reference to the artefacts carved out of 'ivory' as mentioned in C. So, the paragraph should start with C followed by B, which states an idea that is in direct contradiction to the phenomenon mentioned in C. The connector 'yet' highlights this contrast. B should be followed by D and not A because D elaborates on what is meant by 'such larger knowledge' in B. A should follow D because 'such information' in A alludes to the awareness of the 'nature of the material' used in producing an object or an artefact and 'the ways in which it was worked' or carved. Thus, the correct sequence is CBDA. Hence, [CBDA].<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 21, "sourceId": "77356", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>The sentences given in the question  below when properly sequenced, form a coherent paragraph. Each sentence is labelled with a letter. Enter in the box provided below the most logical order of sentences to construct a coherent paragraph.<\/strong><\/p>\n<p><strong>Note: <em>Your answer should  be a combination of  letters indicating the order of the sentences<em> .Use the virtual keyboard to enter your answer<\/em><\/em><\/strong><\/p><\/div><p><span lang=\"EN-US\">A.<span>       <\/span>Where could its limits be?<\/span><\/p>\n<p><span lang=\"EN-US\">B.<span>       <\/span>Representation had looked like a burden for painting. <\/span><\/p>\n<p><span lang=\"EN-US\">C.<span>       <\/span>We now see that it can also be a glimpse of the perpetrator at the crime scene, a <\/span><span>tantalizing flirtation, a fun<\/span><\/p>\n<p><span>           house mirror, a raw dream, or a visual eulogy to the <\/span><span>constantly disappearing world.<\/span><\/p>\n<p><span lang=\"EN-US\">D.<span>       <\/span>It was an act of violence, imposing its frame on the world.<\/span><\/p>\n<p><span lang=\"EN-US\"><\/span><\/p>", "options": [], "answer": "BDCA", "answerLabel": "BDCA", "solution": "<p><span lang=\"EN-US\">A cannot start the sequence because the antecedent of the pronoun 'its' is not clear. B is the only stand-alone sentence that starts the sequence. D should follow B because it takes the idea of representation being a burden for painting (as mentioned in B) one-step further by saying that representation was like an act of violence. C should come next as it shows the contemporary perception of representation in art. Since representation in art has become so varied, A aptly ends the paragraph with the question of where we should draw the limits. Thus, the correct sequence is BDCA. Hence, BDCA.<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 22, "sourceId": "67710", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Sentences given in this question, when properly sequenced, form a coherent paragraph. The first and the last sentences are 1 and 6 and the four in between are labelled with a letter each. Enter in the box provided below the most logical order of sentences  to  construct a coherent paragraph.<\/strong><\/p>\n<p><strong>Note: <em>Your answer should  be a combination of   letters indicating the order of the sentences<em> .Use the virtual keyboard to enter your answer<\/em><\/em><br /><\/strong><\/p><\/div><p>1. Make your friends instantly jealous or bored with your vacation snaps while you give them a call on your mobile phone.<br />A. The J-SH04 allows users to transmit colour photos to other mobiles as e-mail attachments.<br />B. The phone’s screen is able to display stored images and even show the picture of a friend when they call you.<br />C. This month, Japanese communications firm J-phone will release the first mobile phone with a built-in digital camera.<br />D. Images can also be instantly printed using a Sharp colour mobile printer.<br />6. Your boss could soon ask you to prove it the next time you say that you are sick.<\/p>", "options": [], "answer": "CADB", "answerLabel": "CADB", "solution": "<p>The set starts off with C with an introduction to the company J-phone. Moving on, the phone is named in A as J-SH04. Thus, the CA link is clear. A talks about transmitting photos while D with \"also prints\" talks about printed photographs. The AD link is also clear. \"Images\" in B links logically with the boss asking for proof of sickness (through images) in sentence 6. Hence, CADB.<\/p>", "topic": "Jumbled Paragraphs"}, {"number": 23, "sourceId": "217303", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-IN\">There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/span><\/strong><\/p><\/div><p><strong>Statement:<\/strong> The war resulted in the deaths of millions of people and had a profound impact on the course of history.<\/p>\n<p><strong>Paragraph:<\/strong><\/p>\n<p>_ (1) _World War II was a global war that lasted from 1939 to 1945. It involved many of the world's nations, including all the great powers, and it is considered one of the most significant events in human history.  _ (2) _The main causes of World War II were the aggressive actions of Nazi Germany, led by dictator Adolf Hitler, and the Axis powers in Europe, and Japan's expansionist policies in Asia. _ (3) _ It also led to major technological and social changes, including the development of nuclear weapons and the creation of the United Nations. The war ended with the defeat of the Axis powers and the Allied victory. _ (4) _<\/p>", "options": ["<p>Option 1<\/p>", "<p>Option 2<\/p>", "<p>Option 3<\/p>", "<p>Option 4<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p>Explanation:  At blank 3 it fits the best and after the details of the war and its causes we can talk about its effect. So, answer is option 3.<\/p>\n<p>Option 1: This cannot be the opening line.<\/p>\n<p>Option 2: First causes then effect.<\/p>\n<p>Option 4 : Too late and out of context.<\/p>\n<p>Hence, [3].<\/p>", "topic": "Paragraph Completion"}, {"number": 24, "sourceId": "217304", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<p><strong>Statement:<\/strong> It is known for its beautiful, brightly coloured flowers, which range in shade from white to pink to red to purple.<\/p>\n<p><strong>Paragraph:<\/strong><\/p>\n<p>_ (1) _ Hibiscus is a plant that belongs to the mallow family (Malvaceae). _ (2) _ Hibiscus plants are native to warm, tropical regions around the world, but they are also grown as ornamental plants in many other areas. _ (3) _In addition to their attractive flowers, hibiscus plants are also valued for their medicinal properties, and different parts of the plant have been used in traditional medicine for a variety of purposes. _ (4) - The leaves, flowers, and other parts of the hibiscus plant are also sometimes used in cooking and as natural food dyes<\/p>", "options": ["<p>Option 1<\/p>", "<p>Option 2<\/p>", "<p>Option 3<\/p>", "<p>Option 4<\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p>Explanation: At blank 2 the statement fits as it is introductory and should come after its definition. So, answer is option 2.<\/p>\n<p>Option 1: This cannot be the 1st line.<\/p>\n<p>Option 3: Too late to mention this.<\/p>\n<p>Option 4:  Extremely late to mention.<\/p>\n<p>Hence, [2].<\/p>", "topic": "Paragraph Completion"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;
function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
