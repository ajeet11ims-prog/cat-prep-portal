e the climates are distinct for the different natures and longevities of the creatures they support. The would-be piece of literature may not last for decades and generations, but it wants to. The article of commentary may not vanish from everyone's mind after a lifespan measured in days and weeks, but it expects to.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The difference recalls that between labour and work in Hannah Arendt. \"Labour,\" as she defines it, flows into goods whose twofold character is to be used up by consumption and to erase the discrete contribution of the individual labourer. \"Work,\" on the other hand, yields durable objects whose utility is not destroyed by the use of them, and which bear the lasting impress of the individual artisan. Presumably writing will always be like more work, in this sense, than a job as a short-order cook, but if, as Arendt held, the tendency of the modern world is to establish \"a waste economy, in which things must be almost as quickly devoured and discarded as they appear in the world,\" this process would seem to be overtaking prose along with everything else.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Based on the passage, it can be said that the author's attitude towards articles of commentary is:<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">derisory<\/span><\/p>", "<p><span lang=\"EN-US\">condescending<\/span><\/p>", "<p><span lang=\"EN-US\">supercilious<\/span><\/p>", "<p><span lang=\"EN-US\">none of the above<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">'Derisory' means contemptuous or mocking. 'Condescending' means disdainful. 'Supercilious' means haughtily disdainful or contemptuous. All these words are too negative. The last two sentences of the first paragraph indicate that the author is not completely disdainful of the status of commentary. He says: \"This is not to disdain commentary for its failure to be primary rather than secondary, only to attempt to suggest its difference from literature.\" Hence, [4].<\/span><\/p>", "topic": "Style, Tone & Attitude"}, {"number": 14, "sourceId": "83008", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">For a minority of the Indian population—but still very large in actual numbers—economic growth alone has been very advantageous, since they are already comparatively privileged and need no social assistance to benefit from economic growth. The limited prosperity of recent years has helped to support a remarkable variety of lifestyles as well as globally acclaimed developments of Indian literature, music, cinema, theatre, painting, and the culinary arts, among other cultural activities.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Yet an exaggerated concentration on the lives of the relatively prosperous, exacerbated by the Indian media, gives an unrealistically rosy picture of the lives of Indians in general. Since the fortunate group includes not only business leaders and the professional classes but also many of the country's intellectuals, the story of unusual national advancement is widely and persistently heard. More worryingly, relatively privileged Indians can easily fall for the temptation to focus just on economic growth as a grand social benefactor for all.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Some critics of the huge social inequalities in India find something callous and uncouth in the self-centred lives and inward-looking preoccupations of a relatively prosperous minority. My primary concern, however, is that the illusions generated by those distorted perceptions of prosperity may prevent India from bringing social deprivations into political focus, which is essential for achieving what needs to be done for Indians at large through its democratic system. A fuller understanding of the real conditions of the mass of neglected Indians and what can be done to improve their lives through public policy should be a central issue in the politics of India.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">This is exactly where the exclusive concentration on the rate of GNP growth has the most damaging effect. Economic growth can make a very large contribution to improving people's lives; but single-minded emphasis on growth has limitations that need to be clearly understood.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">What is the author trying to emphasize through this passage?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">That economic growth is the most reliable yardstick for assessing the quality of life that India provides to its citizens.<\/span><\/p>", "<p><span lang=\"EN-US\">That economic growth in India and improvement in the quality of life of its citizens <br />indicate a diametrical difference.<\/span><\/p>", "<p><span lang=\"EN-US\">That a perspective of the real problems facing India is often obfuscated by the excessive focus on economic growth alone.<\/span><\/p>", "<p><span lang=\"EN-US\">That economic growth as seen in India may not always successfully gloss over the social inequalities that have been prevalent since ages.<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">Throughout the passage, the author warns a country like India to not get too carried away by the economic growth of the country, which reflects the success of only a section of society and not all. The inherent problems are still there and tend to get overlooked due to this heightened and to some extent false sense of satisfaction. He is of the opinion that \"A fuller understanding of the real conditions of the mass of neglected Indians and what can be done to improve their lives through public policy should be a central issue in the politics of India.\" So, option [1] will not be the author's opinion. [2] is too negative and cannot be validated from the passage. Economic growth shifts the focus; it does not try to hide the inequalities. So, [4] is also incorrect. Only [3] states the warning that the author is trying to give through this passage.<span>   <\/span>Hence, [3].<\/span><\/p>", "topic": "Primary Purpose"}, {"number": 15, "sourceId": "83009", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">For a minority of the Indian population—but still very large in actual numbers—economic growth alone has been very advantageous, since they are already comparatively privileged and need no social assistance to benefit from economic growth. The limited prosperity of recent years has helped to support a remarkable variety of lifestyles as well as globally acclaimed developments of Indian literature, music, cinema, theatre, painting, and the culinary arts, among other cultural activities.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Yet an exaggerated concentration on the lives of the relatively prosperous, exacerbated by the Indian media, gives an unrealistically rosy picture of the lives of Indians in general. Since the fortunate group includes not only business leaders and the professional classes but also many of the country's intellectuals, the story of unusual national advancement is widely and persistently heard. More worryingly, relatively privileged Indians can easily fall for the temptation to focus just on economic growth as a grand social benefactor for all.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Some critics of the huge social inequalities in India find something callous and uncouth in the self-centred lives and inward-looking preoccupations of a relatively prosperous minority. My primary concern, however, is that the illusions generated by those distorted perceptions of prosperity may prevent India from bringing social deprivations into political focus, which is essential for achieving what needs to be done for Indians at large through its democratic system. A fuller understanding of the real conditions of the mass of neglected Indians and what can be done to improve their lives through public policy should be a central issue in the politics of India.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">This is exactly where the exclusive concentration on the rate of GNP growth has the most damaging effect. Economic growth can make a very large contribution to improving people's lives; but single-minded emphasis on growth has limitations that need to be clearly understood.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p>Which of the following can be inferred from the passage?<\/p>\n<p>I.     The Indian intelligentsia does not seem to partake in the complacency resulting from the economic growth that India has been witnessing.<\/p>\n<p>II.    The economic prosperity in India, though partial, has given Indian culture a boost on the international platform.<\/p>\n<p>III.   Since India follows a democratic system of governance, it is imperative for the country to get rid of all forms of social deprivation.<\/p>", "options": ["<p><span lang=\"EN-US\">I, II and III<\/span><\/p>", "<p><span lang=\"EN-US\">Both I and II<\/span><\/p>", "<p><span lang=\"EN-US\">Both II and III<\/span><\/p>", "<p><span lang=\"EN-US\">Only II<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">I contradicts the sentence in the second paragraph \"Since the fortunate group includes not only business leaders and the professional classes but also many of the country's intellectuals, the story of unusual national advancement is widely and persistently heard.\" The economic growth has benefited the intellectuals along with the business leaders and professional classes. II distorts the information given in paragraph 3. It states that the democratic system in India should strive to remove social inequalities. Only II can be inferred from the last sentence of the first paragraph. Hence, [4].<\/span><\/p>", "topic": "Inference"}, {"number": 16, "sourceId": "83010", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">For a minority of the Indian population—but still very large in actual numbers—economic growth alone has been very advantageous, since they are already comparatively privileged and need no social assistance to benefit from economic growth. The limited prosperity of recent years has helped to support a remarkable variety of lifestyles as well as globally acclaimed developments of Indian literature, music, cinema, theatre, painting, and the culinary arts, among other cultural activities.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Yet an exaggerated concentration on the lives of the relatively prosperous, exacerbated by the Indian media, gives an unrealistically rosy picture of the lives of Indians in general. Since the fortunate group includes not only business leaders and the professional classes but also many of the country's intellectuals, the story of unusual national advancement is widely and persistently heard. More worryingly, relatively privileged Indians can easily fall for the temptation to focus just on economic growth as a grand social benefactor for all.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Some critics of the huge social inequalities in India find something callous and uncouth in the self-centred lives and inward-looking preoccupations of a relatively prosperous minority. My primary concern, however, is that the illusions generated by those distorted perceptions of prosperity may prevent India from bringing social deprivations into political focus, which is essential for achieving what needs to be done for Indians at large through its democratic system. A fuller understanding of the real conditions of the mass of neglected Indians and what can be done to improve their lives through public policy should be a central issue in the politics of India.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">This is exactly where the exclusive concentration on the rate of GNP growth has the most damaging effect. Economic growth can make a very large contribution to improving people's lives; but single-minded emphasis on growth has limitations that need to be clearly understood.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following can be considered a reason why India's economic growth has not proved to be an advantageous proposition across social strata?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">The social inequalities present in India have been handled in a callous manner by the governing bodies.<\/span><\/p>", "<p><span lang=\"EN-US\">A lack of understanding of and the drive to improve the lot of people who are not privileged on the part of those who have benefited from the economic growth.<\/span><\/p>", "<p><span lang=\"EN-US\">Economic growth in India is actually a hogwash because it is not complemented by social assistance, which is fundamental to the realization of the full benefit of the growth.<\/span><\/p>", "<p><span lang=\"EN-US\">The outlook of the people in India has not kept pace with the economic growth; hence people are still riddled with regressive superstitions and cynicism.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">Refer to the last sentence of the second paragraph and that of the third paragraph. The author is of the opinion that people who are the fortunate ones in society, i.e., the ones who have really benefited from this growth have been so overwhelmed by it that they have lost focus on the real scenario across India. They are the people who could initiate a positive change in society, but they seem to be not interested in \"understanding of the real conditions of the mass of neglected Indians\". Therefore, the economic growth witnessed recently is a partial achievement. Only [2] reflects this point. [1] is not correct because it is the opinion of some critics of economic growth. It is the segment of people who are not privileged that require social assistance to benefit from economic growth and not all the people. So, [3] is also ruled out. [4] cannot be validated from the passage. Hence, [2].<\/span><\/p>", "topic": "Application Question"}, {"number": 17, "sourceId": "83985", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>In the following questions, there are sentences that form a paragraph. Identify the sentence(s) or part(s) that are / is correct in terms of grammar and usage (including spelling, punctuation and logical consistency). Then, choose the most appropriate option. Enter in the box below the letters corresponding to the correct sentences in alphabetical order.<\/p>\n<p>Note: Use the virtual keyboard provided to enter your answer. <\/p><\/div>", "options": [], "answer": "DE", "answerLabel": "DE", "solution": "<p>The paragraph is in past tense, hence the use of the word ‘has’ in sentence A makes the sentence incorrect. ‘Has’ should be replaced with ‘had’ to make the sentence correct. The plural form of ‘parent’ i.e. ‘parents’ and not the possessive form ‘parent’s’ should be used in sentence B. The word ‘recess’ is spelt incorrectly as ‘recces’ in sentence C. Sentences D and E are grammatically and logically correct. Hence, DE.<\/p>", "topic": "Miscellaneous Concepts"}, {"number": 18, "sourceId": "83035", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The sentences given in each question, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a letter. Choose the most logical order of sentences from among the given choices to construct a coherent paragraph. Enter in the box below the letters corresponding to the sentences in the correct order.<\/span><\/p>\n<p><span lang=\"EN-US\">Note: Your answer should be a combination of letters. Use the virtual keyboard to enter your answer. <\/span><\/p><\/div>", "options": [], "answer": "DACEB", "answerLabel": "DACEB", "solution": "<p><span lang=\"EN-US\">The most obvious link in the whole sequence is the EB link: E says Nabokov saw the intellectual vacuity of Freudian theory and B states how the theory affected a person and ultimately the culture. Peter Medawar is mentioned in relation to Nabokov's opinion about Freudian theory, so C cannot start the sequence. D starts the sequence by stating Nabokov's derision of Freud, followed by A which gives the reason behind the derision. C comes next by stating similar opinions expressed by another personality and then EB which elaborate on the reasons why Nabokov had such a strong opinion about Freud. Thus, the sequence DACEB. Hence, DACEB.<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 19, "sourceId": "83036", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The sentences given in each question, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a letter. Choose the most logical order of sentences from among the given choices to construct a coherent paragraph. Enter in the box below the letters corresponding to the sentences in the correct order.<\/span><\/p>\n<p><span lang=\"EN-US\">Note: Your answer should be a combination of letters. Use the virtual keyboard to enter your answer. <\/span><\/p><\/div>", "options": [], "answer": "BECDA", "answerLabel": "BECDA", "solution": "<p><span lang=\"EN-US\">The most obvious link here is the DA link: A gives a proof and concludes the idea presented in D. B must start the paragraph because it is a generic statement but pertinent to the theme of the passage. In E, that lack of enthusiasm refers to B, which mentions that there are not enough buyers of books of Indian authors, thus BE link. C follows from E<span> <\/span>as it is a fallout of the perception mentioned in E and then comes the DA link that ends the sequence. Thus, BECDA. Hence, BECDA.<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 20, "sourceId": "83037", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The sentences given in each question, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a letter. Choose the most logical order of sentences from among the given choices to construct a coherent paragraph. Enter in the box below the letters corresponding to the sentences in the correct order.<\/span><\/p>\n<p><span lang=\"EN-US\">Note: Your answer chould be a combination of letters. Use the virtual keyboard to enter your answer. <\/span><\/p>\n<p><span lang=\"EN-US\"> <\/span><\/p><\/div>", "options": [], "answer": "BDFACE", "answerLabel": "BDFACE", "solution": "<p><span lang=\"EN-US\">The passage is about boredom and not depression, so the concept of boredom would be discussed first followed by that of depression. So C should always come before E. The most prominent link is the DF link. D states different terms that are often associated (and confused) with boredom, though none of them provide the accurate definition. F connects to this by stating that perhaps the two words that are most confused and that require proper distinction are 'boredom' and 'depression'. A should follow F because it quotes Toohey's opinion to support the idea of a proper distinction between boredom and depression. C further clarifies what boredom is and should follow A. E should come next because it states how depression is different from boredom. Sentence B can come only at the beginning; it introduces the theme of the paragraph. So, the correct sequence is BDFACE. Hence, BDFACE.<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 21, "sourceId": "217584", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-IN\">There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/span><\/strong><\/p><\/div><p><strong>Sentence: <\/strong><\/p>\n<p>Peering into the darkness with a lighted candle, Carter could not believe his eyes.<strong> <\/strong><\/p>\n\n<p><strong>Paragraph: <\/strong>Early in the morning of 4 November 1922, in the Valley of the Kings, Egyptian workers uncovered a step cut into the valley floor. Two days later, clearance revealed a descending staircase, terminating at a rubble wall that blocked further access. This was the moment for which the British archaeologist Howard Carter, director of the expedition, and his patron Lord Carnarvon – or, more accurately, their hundreds of Egyptian workers – had been toiling for 15 long years in the heat and dust of Egypt.  _ (1) _Carter immediately sent a telegram to Carnarvon, who was some 2,500 miles away at his stately home in southern England: ‘At last have made wonderful discovery in Valley. _ (2) _ A magnificent tomb with seals intact. Re-covered same for your arrival. Congratulations.’ When Carnarvon arrived in Luxor 17 days later, he and Carter proceeded to clear the blocking wall and the corridor beyond. _ (3) _ Eventually, just after 4 o’clock in the afternoon of 26 November, the archaeologist and the aristocrat gained access to the royal tomb itself. _ (4) _ When Carnarvon, unable to bear the suspense any longer, asked: ‘Can you see anything?’ Carter’s now-famous reply came back: ‘Yes, yes, wonderful things.’<\/p>", "options": ["<p><span lang=\"EN-IN\">Option 1<\/span><\/p>", "<p><span lang=\"EN-IN\">Option 2<\/span><\/p>", "<p><span lang=\"EN-IN\">Option 3<\/span><\/p>", "<p><span lang=\"EN-IN\">Option 4<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p>Ignore the blanks and read the paragraph. At blank 4, the line fits in perfectly. The preceding line talks about gaining access to the tomb and the following line questions what can be seen which is answered by saying wonderful things. So, peering into the dark and sighting unbelievable should be the missing link. Hence <strong>answer is option 4<\/strong>.<\/p>\n<p>Option 1:  Irrelevant as the following sentence talks about a telegram which does not fit the context of the statement.<\/p>\n<p>Option 2: Eliminated and preceding and following sentence are connected (wonderful discovery and a magnificent tomb stone). So, nothing can come in between.<\/p>\n<p>Option 3: Eliminated as does not fit the context and the following line has the thing missing which is difficult to believe.<\/p>\n<p>Hence, [4].<\/p>", "topic": "Paragraph Completion"}, {"number": 22, "sourceId": "217585", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-IN\">There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/span><\/strong><\/p><\/div><p><strong><strong><br /><\/strong><\/strong><\/p>\n<p><strong><strong>Sentence:  <\/strong><\/strong><\/p>\n<p>In general, realistic paintings are easier for viewers to understand and interpret because the subject matter is immediately recognizable.<\/p>\n<p><strong>Paragraph:<\/strong><\/p>\n<p><strong> <\/strong> _ (1) _. Abstract painting and realistic painting are two different approaches to creating art. Realistic painting, also known as representational or figurative art, is characterized by its attention to detail and accurate depiction of the subject matter. _ (2) _The goal of realistic painting is to create a lifelike or true-to-life representation of a person, place, or thing. Abstract painting, on the other hand, is characterized by its non-representational forms and lack of concern for creating a realistic depiction of the subject matter. Instead, the focus is on the use of colour, line, and shape to create a visual effect and evoke an emotional response in the viewer.  _ (3) _ Abstract paintings often rely on the manipulation of form and composition to create a desired visual impact. _ (4) _ Abstract paintings, on the other hand, can be more challenging for viewers to understand because the subject matter is not immediately recognizable and the artist's intention is not always clear.<\/p>", "options": ["<p><span lang=\"EN-IN\">Option 1<\/span><\/p>", "<p><span lang=\"EN-IN\">Option 2<\/span><\/p>", "<p><span lang=\"EN-IN\">Option 3<\/span><\/p>", "<p><span lang=\"EN-IN\">Option 4<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p>At blank 4, there is a clearcut indication that a statement is missing as the following statement is about abstract with starts by saying on the other hand and the previous statement is also about abstract. So, the statement given about realistic painting fits the bill. <strong>The answer is option 4<\/strong>.<\/p>\n<p>Option 1:  Irrelevant as realistic painting gets introduced later so the given statement should come post that.<\/p>\n<p>Option 2:  Can be applied but option 4 has the perfect flow of thought due to which we must let go this option.<\/p>\n<p>Option 3:  The former and latter statements are about abstract painting, so the realistic painting statement would be an interruption.<\/p>\n<p>Hence, [4].<\/p>", "topic": "Paragraph Completion"}, {"number": 23, "sourceId": "34023", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Each question has four sentences pertaining to a subject, and one of them is contextually/logically incorrect and incorrectly placed in the sequence. <\/strong><strong>Identify the odd one out and key in the number of the sentence as your answer.<\/strong><\/p><\/div><p>1] The Versailles cabinet of the French King Louis XIV, the 'Sun King', held only handwritten, often richly illuminated manuscripts.<\/p>\n\n<p>2] Many others of France's aristocracy owned and used office presses and discussed preferred typographies; others commissioned printed books and illustrations and followed their success with the keenest interest.<\/p>\n\n<p>3] Books, in this case illuminated manuscripts, were seen as only works of art to impress and awe the populace, their contents unimportant.<\/p>\n\n<p>4] This is because Louis XIV (ruled 1643 - 1715) still regarded printing and engraving 'merely as ways to acquaint his subjects with the masterpieces with which he surrounded himself and the festivities he sponsored'.<\/p>\n\n<p><em>Enter your response (as an integer) using the virtual keyboard in the box provided<\/em><\/p>\n<p><em><\/em><\/p>", "options": [], "answer": "2", "answerLabel": "2", "solution": "<p>Sentences [1], [2] and [4] discuss the importance of handwritten manuscripts among French aristocracy (particularly King Louis XIV), whereas [2] talks about the importance of printing, without so much as a conjunction like 'but' to explain the contrast. So [2] cannot fit into the sequence of sentences created by [1], [4] and [3]. <\/p>\n<p>The required answer is 2.<\/p>", "topic": "Sentence out of context"}, {"number": 24, "sourceId": "34024", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Each question has four sentences pertaining to a subject, and one of them is contextually/logically incorrect and incorrectly placed in the sequence. <\/strong><strong>Identify the odd one out and key in the number of the sentence as your answer.<\/strong><\/p><\/div><p>1] People in Roman times did not believe that the questions they faced were any different from those that confronted their dimly perceived forebears.<\/p>\n\n<p>2] They were acutely aware that the ancients had attained a philosophical sophistication of which only pitiful remnants had survived through the harrowing times that followed Rome's collapse.<\/p>\n\n<p>3] So the mission of the 'sciences', such as they were, was not to explore the universe but to scour the meagre works of the philosophers of Roman times in the hope of recovering what they had known.<\/p>\n\n<p>4] For western intellectuals at the dawn of the past millennium, understanding the world meant looking to the past.<\/p>\n\n<p><em>Enter your response (as an integer) using the virtual keyboard in the box provided<\/em><\/p>\n<p><em><\/em><\/p>", "options": [], "answer": "1", "answerLabel": "1", "solution": "<p>Sentences [2] and [3] are written from a perspective after the fall of Rome looking back towards times before it. Sentence [4] is about people at 'the dawn of the past millennium', i.e. the 11<span>th<\/span><span>  <\/span>century, looking back to the past (which could include Roman times). These three sentences can be arranged in the sequence [4], [2], [3]. But [1] is from the perspective of people in Roman times looking to <em>their<\/em> past, which does not fit with the other three sentences at all.<\/p>\n<p>The required answer is 1. <\/p>", "topic": "Sentence out of context"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;
function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
