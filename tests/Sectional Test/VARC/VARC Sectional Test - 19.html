<script type="application/json" id="test-data">{"testNumber": 19, "simcat": 4, "minutes": 40, "questions": [{"number": 1, "sourceId": "84004", "type": "mcq", "passage": "<p><span>For nearly all of history, the success of a society was proportionate to its ability to assemble large and disciplined organizations. Those who bet on economies of scale generally won, which meant the largest organizations were the most successful ones. Things have already changed so much that this is hard for us to believe, but till just a few decades ago the largest organizations tended to be the most progressive. An ambitious kid graduating from college in 1960 wanted to work in the huge, gleaming offices of Ford, or General Electric, or NASA. Small meant small-time. Small in 1960 didn’t mean a cool little startup. It meant your uncle’s shoe store.<\/span><\/p><p><span> <\/span><\/p><p><span>When I grew up in the 1970s, the idea of the ‘corporate ladder’ was still very much alive. The standard plan was to try to get into a good college, from which one would be drafted into some organization and then rise to positions of gradually increasing responsibility. The more ambitious merely hoped to climb the same ladder faster. <\/span><\/p><p><span> <\/span><\/p><p><span>But in the late twentieth century something changed. It turned out that economies of scale were not the only force at work. Particularly in technology, the increase in speed one could get from smaller groups started to trump the advantages of size. The future turned out to be different from the one we were expecting in 1970. Instead of being dominated by a few, giant tree-structured organizations, it’s now looking like the economy of the future will be a fluid network of smaller, independent units.<\/span><\/p><p><span> <\/span><\/p><p><span>It’s not so much that large organizations stopped working. There’s no evidence that famously successful organizations like the Roman army or the British East India Company were any less afflicted by protocol and politics than organizations of the same size today. But they were competing against opponents who couldn’t change the rules on the fly by discovering new technology. Now it turns out the rule ‘large and disciplined organizations win’ needs to have a qualification appended: ‘at games that change slowly’. No one knew till change reached a sufficient speed.<\/span><\/p><p><span> <\/span><\/p><p><span>Large organizations <em>will<\/em> start to do worse now, though, because for the first time in history they’re no longer getting the best people. Ambitious kids graduating from college now don’t want to work for a big company. They want to work for the hot startup that’s rapidly growing into one. If they’re really ambitious, they want to start it. <\/span><\/p><p><span> <\/span><\/p><p>This doesn’t mean big companies will disappear. To say that startups will succeed implies that big companies will exist, because startups that succeed either become big companies or are acquired by them. But large organizations will probably never again play the leading role they did up till the last quarter of the twentieth century.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/strong><\/p><\/div><p> What is the main idea of this passage?<\/p>", "options": ["<p>Small startups will make large companies obsolete.<\/p>", "<p>The idea of a ‘corporate ladder’ has become obsolete due to the rise of the startups.<\/p>", "<p>The largest organizations are no longer the most successful ones, due to the rise of the startups.<\/p>", "<p>Ambitious college graduates should consider working for startups or even starting them.<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p>Option [4] can be ruled out immediately, as the passage merely describes a trend; it does not necessarily suggest that people should follow it (at least, that’s not the main idea). According to the last paragraph, big companies will not disappear, as they are still necessary for startups’ success. So [1] is wrong. The ‘corporate ladder’ is mentioned only in the second paragraph; its demise not the main point of the passage, so [2] is incorrect. The main idea is encapsulated by [3]: the passage is about the difference between small and large organizations, and how the latter are no longer the most successful, due to the rise of small-scale startups. Hence, [3].<\/p>", "topic": "Central Idea"}, {"number": 2, "sourceId": "84005", "type": "mcq", "passage": "<p><span>For nearly all of history, the success of a society was proportionate to its ability to assemble large and disciplined organizations. Those who bet on economies of scale generally won, which meant the largest organizations were the most successful ones. Things have already changed so much that this is hard for us to believe, but till just a few decades ago the largest organizations tended to be the most progressive. An ambitious kid graduating from college in 1960 wanted to work in the huge, gleaming offices of Ford, or General Electric, or NASA. Small meant small-time. Small in 1960 didn’t mean a cool little startup. It meant your uncle’s shoe store.<\/span><\/p><p><span> <\/span><\/p><p><span>When I grew up in the 1970s, the idea of the ‘corporate ladder’ was still very much alive. The standard plan was to try to get into a good college, from which one would be drafted into some organization and then rise to positions of gradually increasing responsibility. The more ambitious merely hoped to climb the same ladder faster. <\/span><\/p><p><span> <\/span><\/p><p><span>But in the late twentieth century something changed. It turned out that economies of scale were not the only force at work. Particularly in technology, the increase in speed one could get from smaller groups started to trump the advantages of size. The future turned out to be different from the one we were expecting in 1970. Instead of being dominated by a few, giant tree-structured organizations, it’s now looking like the economy of the future will be a fluid network of smaller, independent units.<\/span><\/p><p><span> <\/span><\/p><p><span>It’s not so much that large organizations stopped working. There’s no evidence that famously successful organizations like the Roman army or the British East India Company were any less afflicted by protocol and politics than organizations of the same size today. But they were competing against opponents who couldn’t change the rules on the fly by discovering new technology. Now it turns out the rule ‘large and disciplined organizations win’ needs to have a qualification appended: ‘at games that change slowly’. No one knew till change reached a sufficient speed.<\/span><\/p><p><span> <\/span><\/p><p><span>Large organizations <em>will<\/em> start to do worse now, though, because for the first time in history they’re no longer getting the best people. Ambitious kids graduating from college now don’t want to work for a big company. They want to work for the hot startup that’s rapidly growing into one. If they’re really ambitious, they want to start it. <\/span><\/p><p><span> <\/span><\/p><p>This doesn’t mean big companies will disappear. To say that startups will succeed implies that big companies will exist, because startups that succeed either become big companies or are acquired by them. But large organizations will probably never again play the leading role they did up till the last quarter of the twentieth century.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/strong><\/p><\/div><p> According to the author, a hypothetical ambitious college graduate in 1960 most likely wanted to:<\/p>", "options": ["<p>be a part of the family business. <\/p>", "<p>Work for a rapidly growing startup.<\/p>", "<p>Start his/her own startup.<\/p>", "<p>Work for a large organization.<\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p>The author differentiates between the attitudes of ambitious college graduates in 1960 and the present, with the former preferring [4] and the latter preferring [2] or [3]. Hence. [4].<\/p>", "topic": "Application Question"}, {"number": 3, "sourceId": "84006", "type": "mcq", "passage": "<p><span>For nearly all of history, the success of a society was proportionate to its ability to assemble large and disciplined organizations. Those who bet on economies of scale generally won, which meant the largest organizations were the most successful ones. Things have already changed so much that this is hard for us to believe, but till just a few decades ago the largest organizations tended to be the most progressive. An ambitious kid graduating from college in 1960 wanted to work in the huge, gleaming offices of Ford, or General Electric, or NASA. Small meant small-time. Small in 1960 didn’t mean a cool little startup. It meant your uncle’s shoe store.<\/span><\/p><p><span> <\/span><\/p><p><span>When I grew up in the 1970s, the idea of the ‘corporate ladder’ was still very much alive. The standard plan was to try to get into a good college, from which one would be drafted into some organization and then rise to positions of gradually increasing responsibility. The more ambitious merely hoped to climb the same ladder faster. <\/span><\/p><p><span> <\/span><\/p><p><span>But in the late twentieth century something changed. It turned out that economies of scale were not the only force at work. Particularly in technology, the increase in speed one could get from smaller groups started to trump the advantages of size. The future turned out to be different from the one we were expecting in 1970. Instead of being dominated by a few, giant tree-structured organizations, it’s now looking like the economy of the future will be a fluid network of smaller, independent units.<\/span><\/p><p><span> <\/span><\/p><p><span>It’s not so much that large organizations stopped working. There’s no evidence that famously successful organizations like the Roman army or the British East India Company were any less afflicted by protocol and politics than organizations of the same size today. But they were competing against opponents who couldn’t change the rules on the fly by discovering new technology. Now it turns out the rule ‘large and disciplined organizations win’ needs to have a qualification appended: ‘at games that change slowly’. No one knew till change reached a sufficient speed.<\/span><\/p><p><span> <\/span><\/p><p><span>Large organizations <em>will<\/em> start to do worse now, though, because for the first time in history they’re no longer getting the best people. Ambitious kids graduating from college now don’t want to work for a big company. They want to work for the hot startup that’s rapidly growing into one. If they’re really ambitious, they want to start it. <\/span><\/p><p><span> <\/span><\/p><p>This doesn’t mean big companies will disappear. To say that startups will succeed implies that big companies will exist, because startups that succeed either become big companies or are acquired by them. But large organizations will probably never again play the leading role they did up till the last quarter of the twentieth century.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/strong><\/p><\/div><p> Why are large organizations no longer flourishing?<\/p>", "options": ["<p>The idea of the ‘corporate ladder’ is now old-fashioned.<\/p>", "<p>Large organizations are too bogged down by protocol and politics nowadays.<\/p>", "<p>Smaller, independent units are more likely to be the basis of the economy of the future.<\/p>", "<p>The increase in speed of technological change favours smaller organizations that can adapt to changes quickly.<\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p>Option [1] is the result of the fall from favour of large organizations, not the cause of it. According to paragraph 4, older and successful large organizations were just as afflicted by protocol and politics as their modern counterparts, so that cannot be the only reason for the latter’s failures. [3] is simply the author’s prediction for the future, not the reason for a present trend. [4] is the reason that large organizations are no longer the most successful ones, as can be inferred from paragraphs 3 and 4. Hence, [4].<\/p>", "topic": "Specific Detail Question"}, {"number": 4, "sourceId": "84009", "type": "mcq", "passage": "<p>It’s a well-known fact that a translation is no substitute for the original.<\/p><p>It’s also perfectly obvious that this is wrong. Translations are substitutes for original texts. You use them in the place of a work written in a language you cannot read with ease.<\/p><p>The claim that a translation is no substitute for an original is not the only piece of folk wisdom that isn’t true. We happily utter sayings such as “crime doesn’t pay” or “it never rains but it pours” or “the truth will out” that fly in the face of the evidence—Russian mafiosi basking on the French Riviera, British drizzle, and family secrets that never get out. Adages of this sort don’t have to be true to be useful. Typically, they serve to warn, console, or encourage other people in particular circumstances, not to establish a theory of justice, a weather forecasting system, or forensic science. That’s why saying a translation is no substitute for the original misleads only those who take it to be a well-known fact. It’s truly astounding how many people fall into the trap.<\/p><p>When you say “crime doesn’t pay” to a teenager caught filching a DVD from a market stall, it does not matter whether you believe this to be true or not. You are trying to steer the young person toward acceptance of the eighth commandment and using a conventional phrase in the service of that moral aim.<\/p><p>Similarly, a schoolteacher who has just caught his students reading The Outsider in English when they were supposed to be preparing their lessons by reading Camus’s novel in French may well admonish them by saying in an authoritative tone of voice, “A translation is no substitute for the original!” The students know it’s not true because they have just been caught using the translation as a substitute for the original. But they also understand that the teacher used a piece of folk wisdom to say something else that really is true—that only by reading more French will they improve their language skills. The teacher means to spur them into greater assiduity, not to speak the truth about translation.<\/p><p>Students eventually graduate and get jobs, and soon enough some of them start writing book reviews. In those circumstances, when they have to write about a work of foreign literature translated into English and are lost for a phrase to use, they may parrot the warning they first heard at school. In common with all things people say and write, however, the force of the saying that “a translation is no substitute for an original” is completely altered when the context of utterance is changed.<\/p><p>In its new context, it means that the writer of the book review possesses sufficient knowledge of some original to be able to make a judgment that its translation is not a substitute for it. Whether or not the reviewer really has read the original work, the assertion that the translation does not constitute a substitute for it puts the reviewer in charge.<\/p><p>Using the adage in this way obviously affects the meaning of the word substitute. If, for example, I said, “Instant coffee is no substitute for espresso made from freshly ground beans,” I would be wrong, in the sense that the purpose of instant coffee is to serve as a substitute for more laborious ways of making the drink; but also right, as long as the word substitute is understood to mean “the same as,” “as good as,” or “equivalent to.” Instant coffee is clearly not the same as espresso; many people regard it as not as good as espresso; and because preferences in the field of coffee are matters of individual taste, it is not unreasonable to treat powdered coffee as not equivalent to espresso. We do often say all these more explicit things about coffee. But it is not so straightforward when it comes to translation.<\/p><p>People who declare translations to be no substitute for the original imply that they possess the means to recognize and appreciate the real thing, that is to say, original composition as opposed to a translation. Without this ability they could not possibly make the claim that they do. Just as an inability to distinguish two types of coffee would deprive you of any possibility of comparing them, so the ability to discriminate between “a translation” and “an original” is a basic requirement for anyone who wants to claim that one of them is not the same as, equivalent to, or as good as the other.<\/p><p>In practice, we look at the title page, jacket copy, or copyright page of a book or the byline at the bottom of an article to find out whether or not we are reading a translation. But in the absence of such giveaways, are readers in fact able to distinguish, by the taste on their linguistic and literary tongues, whether a text is “original” or “translated”? Absolutely not. Countless writers have packaged originals as translations and translations as originals and gotten away with it for weeks, months, years, even centuries.<\/p><p>Fingal, an Ancient Epic Poem in Six Books appeared to great acclaim in 1762. For many decades, it was held to give precious insight into the ancient culture of the original inhabitants of Europe’s northwestern fringe. Figures as eminent as Napoleon and as learned as the German philosopher Johann Gottfried von Herder were entranced by the authentic folk poetry of the “Gaelic Bard.” But they were wrong. The story of Ossian hadn’t been invented by Celtic poets at all. It was written in English by a minor poet called James Macpherson.<\/p><p>Horace Walpole had a shorter run. In the introduction to the first edition of The Castle of Otranto (1764) he claimed his novel was but a translation of an Italian work first published in 1529, and he promised to make it available if his work met with any success. It did—in fact, it was a bestseller and spawned a whole genre of writing called “Gothic horror.” A second edition was needed, and so the author had to eat humble pie. He could not produce the Italian original, for there was none. He, too, had written his “translation” in English.<\/p><p>Even grander deceptions speckle the history of many literatures. The Letters of a Portuguese Nun, first published in French in 1669, purports to be a translation, even though the original was never produced. This exquisite spiritual text fascinated readers for three centuries and was translated from French into many other languages—one version was done into German by the poet Rainer Maria Rilke, who never even suspected that he had been taken for a ride. The letters had in fact been written in French by Guilleragues, a friend of Jean Racine. The hoax was not unraveled until 1954.[20]<\/p><p>A more recent example of pseudo-translation in French is provided by Andreï Makine, whose first three novels, published between 1990 and 1995, were presented as works translated from Russian by the fictional Françoise Bour. In 1995 Le Monde revealed that they were French originals and thus cleared the way for Makine’s fourth novel, Le Testament français, to win the Prix Goncourt, which is awarded only to writers of French.<\/p><p>Pseudo-translations can be hard to kill off once they have come to life. In Soviet Russia, the poet Emmanuel Lifshitz felt he could express himself more fully by writing as if he were someone else—as James Clifford, an Englishman who did not exist. Originally printed in The Batum Worker, the twenty-three poems purportedly translated from English were reprinted in Moscow with a short biography of the poet, which tried to give the game away in its closing sentence: “Such could have been the biography of this English poet, who grew up in my imagination and who has materialized in the poems whose translation I ask you to consider.”[21] But even clues as big as that can be missed by readers who really want to believe they can tell the difference between originals and translations. Lifshitz did not include the Clifford poems in collections of his own verse, and that is perhaps why James Clifford lived on in literary circles as a well-known English poet for many years. In conversation with Lifshitz, Yevgeny Yevtushenko mentioned how well he remembered the melancholic Englishman—a true eccentric.[22]<\/p><p>Examples of the reverse process, passing off translations as original works, are probably just as numerous. Three novels by the multilingual writer-diplomat Romain Gary that were purportedly composed in French (Lady L., 1963; Les Mangeurs d’étoiles, 1966; and Adieu Gary Cooper, 1969) had actually been written and published in English (as Lady L, 1958; The Talent Scout, 1961; and The Ski Bum, 1965, respectively) then secretly translated by a senior editor at Gary’s French publishing house. How many translations have been misrepresented as originals and never rumbled? It can’t be the case that every deception of the kind has already been unmasked.<\/p><p>Authors have many reasons for wanting to pass off original work as a translation and a translation as an original. Sometimes it helps to get through censorship, sometimes it is to try out a new identity. It can serve individual or collective fantasies about national or linguistic authenticity, and it can be done just to pander to a public taste for the exotic. What all such deceptions underscore is that reading alone simply does not tell you whether a work was originally written in the language you are reading it in. The difference between a translation and an original is not of the same order as the difference between powdered and steamed coffee. It’s more than just an idea. But it is not at all easy to demonstrate.<\/p><p>The idea that a translation is not a substitute for an original work must also be subjected to another critique. If the adage were true, then what would users of a translation get from reading a translation? Not the real thing, obviously. But they would not even get a substitute for it—not even the literary equivalent of powdered coffee. Asserting the irreplaceable nature of a literary original condemns those who cannot read the language in question to the consumption not of Nescafé but of dishwater. No opinions would be worth holding except by those who read works in the original.<\/p><p>Yet the examples of Cervantes (Don Quixote claims to be translated from the Arabic), Walpole, Macpherson, Gary, Guilleragues, Makine, Clifford, and countless others demonstrate that nobody can be certain that what he has read is an original.<\/p><p>Ismail Kadare tells another story about the indistinction of original and translated texts in his memoir-novel, Chronicle in Stone. As a ten-year-old, he was entranced by a book he’d been given by an uncle. With its story of ghosts, castles, murder, and betrayal, it appealed to him immensely, especially as it seemed to explain some of what had been going on around him in the fortress city of Gjirokastër over the preceding years of war and civil strife. The book’s title? Macbeth, by William Shakespeare. Young Ismail could see Lady Macbeth down the street, wringing her hands on the balcony, washing away the terrible things that had happened in her home. He had no idea that the play had originally been written in English. In childish fascination with a text he reread many times, Kadare copied out the unsuspected translation by hand, and nowadays, when asked by interviewers which was the first book he ever wrote, he always answers, with only half a smile, Macbeth. To this day, Kadare has not learned to speak English, but he counts Macbeth as the founding experience of his own life in literature. Whatever the quality of the translation that so inspired him, it clearly did not have the effect of dishwater. It was more like an elixir.<\/p><p>Why then do people still say that a translation is no substitute for an original? The adage might conceivably be of use to people who consciously avoid reading anything in translation, as it would justify and explain their practice. But since there is no reliable way of distinguishing a translation from an original by internal criteria alone, such purists could never be sure they were sticking to their guns. And even if by some stroke of luck they did manage to keep clear of all but original work in their reading, they would end up with a decidedly peculiar view of the world—if they were English readers, they would have no knowledge of the Bible, Tolstoy, or Planet of the Apes. All the adage really does is provide spurious cover for the view that translation is a second-rate kind of thing. That’s what people really mean to say when they assert that a translation is no substitute for original work.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/strong><\/p><\/div><p>The first sentence of the passage can best be described as:<\/p>", "options": ["<p>A familiar cliché that the author intends to disprove.<\/p>", "<p>A universal truth that the author intends to question.<\/p>", "<p>An obvious fallacy intended to confuse the readers.<\/p>", "<p>A deliberately controversial statement intended to shock the readers.<\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p>Option [3] can be ruled out immediately, as there is no attempt to confuse the readers. Nor is the first sentence shocking at all, so [4] can be eliminated as well. Between [1] and [2], the former is the better answer, as the author does not merely set out to question the notion that ‘translation is no substitute for the original’, he actively argues against it and succeeds in disproving it. It is also better to characterize said idea as a ‘cliché’, i.e. a trite or overused saying, rather than a ‘universal truth’, as the latter wrongly implies that the idea is in fact true. Hence, [1].<\/p>", "topic": "Application Question"}, {"number": 5, "sourceId": "84010", "type": "mcq", "passage": "<p>It’s a well-known fact that a translation is no substitute for the original.<\/p><p>It’s also perfectly obvious that this is wrong. Translations are substitutes for original texts. You use them in the place of a work written in a language you cannot read with ease.<\/p><p>The claim that a translation is no substitute for an original is not the only piece of folk wisdom that isn’t true. We happily utter sayings such as “crime doesn’t pay” or “it never rains but it pours” or “the truth will out” that fly in the face of the evidence—Russian mafiosi basking on the French Riviera, British drizzle, and family secrets that never get out. Adages of this sort don’t have to be true to be useful. Typically, they serve to warn, console, or encourage other people in particular circumstances, not to establish a theory of justice, a weather forecasting system, or forensic science. That’s why saying a translation is no substitute for the original misleads only those who take it to be a well-known fact. It’s truly astounding how many people fall into the trap.<\/p><p>When you say “crime doesn’t pay” to a teenager caught filching a DVD from a market stall, it does not matter whether you believe this to be true or not. You are trying to steer the young person toward acceptance of the eighth commandment and using a conventional phrase in the service of that moral aim.<\/p><p>Similarly, a schoolteacher who has just caught his students reading The Outsider in English when they were supposed to be preparing their lessons by reading Camus’s novel in French may well admonish them by saying in an authoritative tone of voice, “A translation is no substitute for the original!” The students know it’s not true because they have just been caught using the translation as a substitute for the original. But they also understand that the teacher used a piece of folk wisdom to say something else that really is true—that only by reading more French will they improve their language skills. The teacher means to spur them into greater assiduity, not to speak the truth about translation.<\/p><p>Students eventually graduate and get jobs, and soon enough some of them start writing book reviews. In those circumstances, when they have to write about a work of foreign literature translated into English and are lost for a phrase to use, they may parrot the warning they first heard at school. In common with all things people say and write, however, the force of the saying that “a translation is no substitute for an original” is completely altered when the context of utterance is changed.<\/p><p>In its new context, it means that the writer of the book review possesses sufficient knowledge of some original to be able to make a judgment that its translation is not a substitute for it. Whether or not the reviewer really has read the original work, the assertion that the translation does not constitute a substitute for it puts the reviewer in charge.<\/p><p>Using the adage in this way obviously affects the meaning of the word substitute. If, for example, I said, “Instant coffee is no substitute for espresso made from freshly ground beans,” I would be wrong, in the sense that the purpose of instant coffee is to serve as a substitute for more laborious ways of making the drink; but also right, as long as the word substitute is understood to mean “the same as,” “as good as,” or “equivalent to.” Instant coffee is clearly not the same as espresso; many people regard it as not as good as espresso; and because preferences in the field of coffee are matters of individual taste, it is not unreasonable to treat powdered coffee as not equivalent to espresso. We do often say all these more explicit things about coffee. But it is not so straightforward when it comes to translation.<\/p><p>People who declare translations to be no substitute for the original imply that they possess the means to recognize and appreciate the real thing, that is to say, original composition as opposed to a translation. Without this ability they could not possibly make the claim that they do. Just as an inability to distinguish two types of coffee would deprive you of any possibility of comparing them, so the ability to discriminate between “a translation” and “an original” is a basic requirement for anyone who wants to claim that one of them is not the same as, equivalent to, or as good as the other.<\/p><p>In practice, we look at the title page, jacket copy, or copyright page of a book or the byline at the bottom of an article to find out whether or not we are reading a translation. But in the absence of such giveaways, are readers in fact able to distinguish, by the taste on their linguistic and literary tongues, whether a text is “original” or “translated”? Absolutely not. Countless writers have packaged originals as translations and translations as originals and gotten away with it for weeks, months, years, even centuries.<\/p><p>Fingal, an Ancient Epic Poem in Six Books appeared to great acclaim in 1762. For many decades, it was held to give precious insight into the ancient culture of the original inhabitants of Europe’s northwestern fringe. Figures as eminent as Napoleon and as learned as the German philos lly by writing as if he were someone else—as James Clifford, an Englishman who did not exist. Originally printed in The Batum Worker, the twenty-three poems purportedly translated from English were reprinted in Moscow with a short biography of the poet, which tried to give the game away in its closing sentence: “Such could have been the biography of this English poet, who grew up in my imagination and who has materialized in the poems whose translation I ask you to consider.”[21] But even clues as big as that can be missed by readers who really want to believe they can tell the difference between originals and translations. Lifshitz did not include the Clifford poems in collections of his own verse, and that is perhaps why James Clifford lived on in literary circles as a well-known English poet for many years. In conversation with Lifshitz, Yevgeny Yevtushenko mentioned how well he remembered the melancholic Englishman—a true eccentric.[22]<\/p><p>Examples of the reverse process, passing off translations as original works, are probably just as numerous. Three novels by the multilingual writer-diplomat Romain Gary that were purportedly composed in French (Lady L., 1963; Les Mangeurs d’étoiles, 1966; and Adieu Gary Cooper, 1969) had actually been written and published in English (as Lady L, 1958; The Talent Scout, 1961; and The Ski Bum, 1965, respectively) then secretly translated by a senior editor at Gary’s French publishing house. How many translations have been misrepresented as originals and never rumbled? It can’t be the case that every deception of the kind has already been unmasked.<\/p><p>Authors have many reasons for wanting to pass off original work as a translation and a translation as an original. Sometimes it helps to get through censorship, sometimes it is to try out a new identity. It can serve individual or collective fantasies about national or linguistic authenticity, and it can be done just to pander to a public taste for the exotic. What all such rk was originally written in the language you are reading it in. The difference between a translation and an original is not of the same order as the difference between powdered and steamed coffee. It’s more than just an idea. But it is not at all easy to demonstrate.<\/p><p>The idea that a translation is not a substitute for an original work must also be subjected to another critique. If the adage were true, then what would users of a translation get from reading a translation? Not the real thing, obviously. But they would not even get a substitute for it—not even the literary equivalent of powdered coffee. Asserting the irreplaceable nature of a literary original condemns those who cannot read the language in question to the consumption not of Nescafé but of dishwater. No opinions would be worth holding except by those who read works in the original.<\/p><p>Yet the examples of Cervantes (Don Quixote claims to be translated from the Arabic), Walpole, Macpherson, Gary, Guilleragues, Makine, Clifford, and countless others demonstrate that nobody can be certain that what he has read is an original.<\/p><p>Ismail Kadare tells another story about the indistinction of original and translated texts in his memoir-novel, Chronicle in Stone. As a ten-year-old, he was entranced by a book he’d been given by an uncle. With its story of ghosts, castles, murder, and betrayal, it appealed to him immensely, especially as it seemed to explain some of what had been going on around him in the fortress city of Gjirokastër over the preceding years of war and civil strife. The book’s title? Macbeth, by William Shakespeare. Young Ismail could see Lady Macbeth down the street, wringing her hands on the balcony, washing away the terrible things that had happened in her home. He had no idea that the play had originally been written in English. In childish fascination with a text he reread many times, Kadare copied out the unsuspected translation by hand, and nowadays, when asked by interviewers which was the first book he ever wrote, he always answers, with only half a smile, Macbeth. To this day, Kadare has not learned to speak English, but he counts Macbeth as the founding experience of his own life in literature. Whatever the quality of the translation that so inspired him, it clearly did not have the effect of dishwater. It was more like an elixir.<\/p><p>Why then do people still say that a translation is no substitute for an original? The adage might conceivably be of use to people who consciously avoid reading anything in translation, as it would justify and explain their practice. But since there is no reliable way of distinguishing a translation from an original by internal criteria alone, such purists could never be sure they were sticking to their guns. And even if by some stroke of luck they did manage to keep clear of all but original work in their reading, they would end up with a decidedly peculiar view of the world—if they were English readers, they would have no knowledge of the Bible, Tolstoy, or Planet of the Apes. All the adage really does is provide spurious cover for the view that translation is a second-rate kind of thing. That’s what people really mean to say when they assert that a translation is no substitute for original work.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/strong><\/p><\/div><p>What can be said about the relationship between translations and original work, based on this passage?<\/p>", "options": ["<p>Translations are superior to the original work.<\/p>", "<p>Translations are inferior to the original work.<\/p>", "<p>Translations are equivalent to the original work.<\/p>", "<p>There can be no comparison between translations and the original work.<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p>Option [2] is exactly what the author tries to disprove in this passage. But neither does he go to the other extreme, and claim that translations are superior to the original work, so [1] is wrong. He does compare translations and the original work throughout the passage, so [4] is false. Only [3] can be inferred: according to the passage, there is no way to tell the difference between translations and the original work, so the two are essentially equal. Hence, [3].<\/p>", "topic": "Application Question"}, {"number": 7, "sourceId": "84012", "type": "mcq", "passage": "<p>It’s a well-known fact that a translation is no substitute for the original.<\/p><p>It’s also perfectly obvious that this is wrong. Translations are substitutes for original texts. You use them in the place of a work written in a language you cannot read with ease.<\/p><p>The claim that a translation is no substitute for an original is not the only piece of folk wisdom that isn’t true. We happily utter sayings such as “crime doesn’t pay” or “it never rains but it pours” or “the truth will out” that fly in the face of the evidence—Russian mafiosi basking on the French Riviera, British drizzle, and family secrets that never get out. Adages of this sort don’t have to be true to be useful. Typically, they serve to warn, console, or encourage other people in particular circumstances, not to establish a theory of justice, a weather forecasting system, or forensic science. That’s why saying a translation is no substitute for the original misleads only those who take it to be a well-known fact. It’s truly astounding how many people fall into the trap.<\/p><p>When you say “crime doesn’t pay” to a teenager caught filching a DVD from a market stall, it does not matter whether you believe this to be true or not. You are trying to steer the young person toward acceptance of the eighth commandment and using a conventional phrase in the service of that moral aim.<\/p><p>Similarly, a schoolteacher who has just caught his students reading The Outsider in English when they were supposed to be preparing their lessons by reading Camus’s novel in French may well admonish them by saying in an authoritative tone of voice, “A translation is no substitute for the original!” The students know it’s not true because they have just been caught using the translation as a substitute for the original. But they also understand that the teacher used a piece of folk wisdom to say something else that really is true—that only by reading more French will they improve their language skills. The teacher means to spur them into greater assiduity, not to speak the truth about translation.<\/p><p>Students eventually graduate and get jobs, and soon enough some of them start writing book reviews. In those circumstances, when they have to write about a work of foreign literature translated into English and are lost for a phrase to use, they may parrot the warning they first heard at school. In common with all things people say and write, however, the force of the saying that “a translation is no substitute for an original” is completely altered when the context of utterance is changed.<\/p><p>In its new context, it means that the writer of the book review possesses sufficient knowledge of some original to be able to make a judgment that its translation is not a substitute for it. Whether or not the reviewer really has read the original work, the assertion that the translation does not constitute a substitute for it puts the reviewer in charge.<\/p><p>Using the adage in this way obviously affects the meaning of the word substitute. If, for example, I said, “Instant coffee is no substitute for espresso made from freshly ground beans,” I would be wrong, in the sense that the purpose of instant coffee is to serve as a substitute for more laborious ways of making the drink; but also right, as long as the word substitute is understood to mean “the same as,” “as good as,” or “equivalent to.” Instant coffee is clearly not the same as espresso; many people regard it as not as good as espresso; and because preferences in the field of coffee are matters of individual taste, it is not unreasonable to treat powdered coffee as not equivalent to espresso. We do often say all these more explicit things about coffee. But it is not so straightforward when it comes to translation.<\/p><p>People who declare translations to be no substitute for the original imply that they possess the means to recognize and appreciate the real thing, that is to say, original composition as opposed to a translation. Without this ability they could not possibly make the claim that they do. Just as an inability to distinguish two types of coffee would deprive you of any possibility of comparing them, so the ability to discriminate between “a translation” and “an original” is a basic requirement for anyone who wants to claim that one of them is not the same as, equivalent to, or as good as the other.<\/p><p>In practice, we look at the title page, jacket copy, or copyright page of a book or the byline at the bottom of an article to find out whether or not we are reading a translation. But in the absence of such giveaways, are readers in fact able to distinguish, by the taste on their linguistic and literary tongues, whether a text is “original” or “translated”? Absolutely not. Countless writers have packaged originals as translations and translations as originals and gotten away with it for weeks, months, years, even centuries.<\/p><p>Fingal, an Ancient Epic Poem in Six Books appeared to great acclaim in 1762. For many decades, it was held to give precious insight into the ancient culture of the original inhabitants of Europe’s northwestern fringe. Figures as eminent as Napoleon and as learned as the German philosopher Johann Gottfried von Herder were entranced by the authentic folk poetry of the “Gaelic Bard.” But they were wrong. The story of Ossian hadn’t been invented by Celtic poets at all. It was written in English by a minor poet called James Macpherson.<\/p><p>Horace Walpole had a shorter run. In the introduction to the first edition of The Castle of Otranto (1764) he claimed his novel was but a translation of an Italian work first published in 1529, and he promised to make it available if his work met with any success. It did—in fact, it was a bestseller and spawned a whole genre of writing called “Gothic horror.” A second edition was needed, and so the author had to eat humble pie. He could not produce the Italian original, for there was none. He, too, had written his “translation” in English.<\/p><p>Even grander deceptions speckle the history of many literatures. The Letters of a Portuguese Nun, first published in French in 1669, purports to be a translation, even though the original was never produced. This exquisite spiritual text fascinated readers for three centuries and was translated from French into many other languages—one version was done into German by the poet Rainer Maria Rilke, who never even suspected that he had been taken for a ride. The letters had in fact been written in French by Guilleragues, a friend of Jean Racine. The hoax was not unraveled until 1954.[20]<\/p><p>A more recent example of pseudo-translation in French is provided by Andreï Makine, whose first three novels, published between 1990 and 1995, were presented as works translated from Russian by the fictional Françoise Bour. In 1995 Le Monde revealed that they were French originals and thus cleared the way for Makine’s fourth novel, Le Testament français, to win the Prix Goncourt, which is awarded only to writers of French.<\/p><p>Pseudo-translations can be hard to kill off once they have come to life. In Soviet Russia, the poet Emmanuel Lifshitz felt he could express himself more fully by writing as if he were someone else—as James Clifford, an Englishman who did not exist. Originally printed in The Batum Worker, the twenty-three poems purportedly translated from English were reprinted in Moscow with a short biography of the poet, which tried to give the game away in its closing sentence: “Such could have been the biography of this English poet, who grew up in my imagination and who has materialized in the poems whose translation I ask you to consider.”[21] But even clues as big as that can be missed by readers who really want to believe they can tell the difference between originals and translations. Lifshitz did not include the Clifford poems in collections of his own verse, and that is perhaps why James Clifford lived on in literary circles as a well-known English poet for many years. In conversation with Lifshitz, Yevgeny Yevtushenko mentioned how well he remembered the melancholic Englishman—a true eccentric.[22]<\/p><p>Examples of the reverse process, passing off translations as original works, are probably just as numerous. Three novels by the multilingual writer-diplomat Romain Gary that were purportedly composed in French (Lady L., 1963; Les Mangeurs d’étoiles, 1966; and Adieu Gary Cooper, 1969) had actually been written and published in English (as Lady L, 1958; The Talent Scout, 1961; and The Ski Bum, 1965, respectively) then secretly translated by a senior editor at Gary’s French publishing house. How many translations have been misrepresented as originals and never rumbled? It can’t be the case that every deception of the kind has already been unmasked.<\/p><p>Authors have many reasons for wanting to pass off original work as a translation and a translation as an original. Sometimes it helps to get through censorship, sometimes it is to try out a new identity. It can serve individual or collective fantasies about national or linguistic authenticity, and it can be done just to pander to a public taste for the exotic. What all such deceptions underscore is that reading alone simply does not tell you whether a work was originally written in the language you are reading it in. The difference between a translation and an original is not of the same order as the difference between powdered and steamed coffee. It’s more than just an idea. But it is not at all easy to demonstrate.<\/p><p>The idea that a translation is not a substitute for an original work must also be subjected to another critique. If the adage were true, then what would users of a translation get from reading a translation? Not the real thing, obviously. But they would not even get a substitute for it—not even the literary equivalent of powdered coffee. Asserting the irreplaceable nature of a literary original condemns those who cannot read the language in question to the consumption not of Nescafé but of dishwater. No opinions would be worth holding except by those who read works in the original.<\/p><p>Yet the examples of Cervantes (Don Quixote claims to be translated from the Arabic), Walpole, Macpherson, Gary, Guilleragues, Makine, Clifford, and countless others demonstrate that nobody can be certain that what he has read is an original.<\/p><p>Ismail Kadare tells another story about the indistinction of original and translated texts in his memoir-novel, Chronicle in Stone. As a ten-year-old, he was entranced by a book he’d been given by an uncle. With its story of ghosts, castles, murder, and betrayal, it appealed to him immensely, especially as it seemed to explain some of what had been going on around him in the fortress city of Gjirokastër over the preceding years of war and civil strife. The book’s title? Macbeth, by William Shakespeare. Young Ismail could see Lady Macbeth down the street, wringing her hands on the balcony, washing away the terrible things that had happened in her home. He had no idea that the play had originally been written in English. In childish fascination with a text he reread many times, Kadare copied out the unsuspected translation by hand, and nowadays, when asked by interviewers which was the first book he ever wrote, he always answers, with only half a smile, Macbeth. To this day, Kadare has not learned to speak English, but he counts Macbeth as the founding experience of his own life in literature. Whatever the quality of the translation that so inspired him, it clearly did not have the effect of dishwater. It was more like an elixir.<\/p><p>Why then do people still say that a translation is no substitute for an original? The adage might conceivably be of use to people who consciously avoid reading anything in translation, as it would justify and explain their practice. But since there is no reliable way of distinguishing a translation from an original by internal criteria alone, such purists could never be sure they were sticking to their guns. And even if by some stroke of luck they did manage to keep clear of all but original work in their reading, they would end up with a decidedly peculiar view of the world—if they were English readers, they would have no knowledge of the Bible, Tolstoy, or Planet of the Apes. All the adage really does is provide spurious cover for the view that translation is a second-rate kind of thing. That’s what people really mean to say when they assert that a translation is no substitute for original work.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/strong><\/p><\/div><p>Which of the following would the author disagree with?<\/p>", "options": ["<p>It’s possible that we may never realize if certain works are translations or not.<\/p>", "<p>People should read books that are not originally written in languages they know.<\/p>", "<p>Even when some books or articles are translations, this may not be stated clearly on them.<\/p>", "<p>Since a translation is an acceptable substitute for the original, those who pass off translations as originals and vice versa are not being deceitful.<\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p>Based on the last sentence of the penultimate paragraph, it’s possible to infer that some hoaxes regarding translations may continue permanently, i.e. they may never be unmasked, so the author would agree with [1]. Option [2] is implicit in the author’s view that English speaking people who never read any translations ‘would end up with a decidedly peculiar view of the world’. [3] is inferable from the phrase ‘in the absence of such giveaways’ in paragraph 4. But the author would not agree with [4] – he calls the practices of passing off translations as originals and vice versa ‘hoaxes’ and ‘deception’. Hence, [4].<\/p>", "topic": "Application Question"}, {"number": 8, "sourceId": "83676", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>Advertising is usually explained and\r\n  justified as a competitive medium that ultimately benefits the public (the\r\n  consumer) and the most efficient manufacturers - and thus the national\r\n  economy. It is closely related to certain ideas about freedom: freedom of\r\n  choice for the purchaser, freedom of enterprise for the manufacturer. The\r\n  great hoardings and the advertising neons of the cities of capitalism are the\r\n  immediate visible sign of &quot;The Free World.&quot; For many in Eastern\r\n  Europe such images in the West sum up what they in the East lack.\r\n  Advertising, it is thought, offers a free choice. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>It is true that in\r\n  advertising one brand of manufacture, one firm, competes with another; but it\r\n  is also true that every advertising image confirms and enhances every other.\r\n  Advertising is not merely an assembly of competing messages: it is a language\r\n  in itself that is always being used to make the same general proposal. Within\r\n  advertising, choices are offered between this cream and that cream, that car\r\n  and this car, but advertising as a system only makes a single proposal. It\r\n  proposes to each of us that we transform ourselves, or our lives, by buying\r\n  something more. Advertising persuades us of such a transformation by showing\r\n  us people who have apparently been transformed and are, as a result,\r\n  enviable. The state of being envied is what constitutes glamour. And\r\n  advertising is the process of manufacturing glamour. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>Advertising has\r\n  another important social function. The fact that this function has not been\r\n  planned as a purpose by those who make and use advertising in no way lessens\r\n  its significance. Advertising turns consumption into a substitute for\r\n  democracy. The choice of what one eats (or wears or drives) takes the place\r\n  of significant political choice. Advertising helps to mask and compensate for\r\n  all that is undemocratic within society. And it also masks what is happening\r\n  in the rest of the world. Advertising adds up to a kind of philosophical\r\n  system. It explains everything in its own terms. It interprets the world. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>The entire world\r\n  becomes a setting for the fulfillment of advertising's promise of the good\r\n  life. The world smiles at us. It offers itself to us. And because everywhere\r\n  is imagined as offering itself to us, everywhere is more or less the same.\r\n  The contrast between advertising's interpretation of the world and the\r\n  world's actual condition is a very stark one, and this sometimes becomes\r\n  evident in the color magazines which deal with news stories. It can be argued\r\n  that the juxtaposition of images was not planned. Nevertheless the text, the\r\n  photographs taken in Pakistan, the photographs taken for the advertisements,\r\n  the editing of the magazine, the layout of the advertising, the printing of\r\n  both, the fact that advertiser's pages and news pages cannot be co-ordinated\r\n  - all these are produced by the same culture. <o:p><\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span\r\n  lang=EN-US>Advertising exerts an enormous influence and is a political\r\n  phenomenon of great importance. But its offer is as narrow as its references\r\n  are wide. It recognizes nothing except the power to acquire. All other human\r\n  faculties or needs are made subsidiary to this power. All hopes are gathered\r\n  together, made homogeneous, simplified, so that they become the intense yet\r\n  vague, magical yet repeatable promise offered in every purchase. No other\r\n  kind of hope or satisfaction or pleasure can any longer be envisaged within\r\n  the culture of capitalism. Advertising is the life of this culture - in so\r\n  far as without advertising capitalism could not survive - and at the same\r\n  time advertising is its dream. Capitalism survives by forcing the majority,\r\n  whom it exploits, to define their own interests as narrowly as possible. This\r\n  was once achieved by extensive deprivation. Today in the developed countries\r\n  it is being achieved by imposing a false standard of what is and what is not\r\n  desirable.<\/span><span lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">According the passage, advertising offers an illusion of free choice because:<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">it offers choices in degree but not in kind.<\/span><\/p>", "<p><span lang=\"EN-US\">it offers choices in means but not in ends.<\/span><\/p>", "<p><span lang=\"EN-US\">it offers choices in material terms but not in civic life.<\/span><\/p>", "<p><span lang=\"EN-US\">it offers choices in the market place at the expense of political engagement.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">[2] is the right answer. Refer second paragraph, third sentence, \"but advertising as a system only makes a single proposal.\" This means advertising does not offer multiple proposals or choices to consumers. [4] is mentioned in the passage but is not answering the question about advertising and its limitations on choices. [1] and [3] are out of context. Hence, [2].<\/span><\/p>", "topic": "Inference"}, {"number": 9, "sourceId": "83677", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>Advertising is usually explained and\r\n  justified as a competitive medium that ultimately benefits the public (the\r\n  consumer) and the most efficient manufacturers - and thus the national\r\n  economy. It is closely related to certain ideas about freedom: freedom of\r\n  choice for the purchaser, freedom of enterprise for the manufacturer. The\r\n  great hoardings and the advertising neons of the cities of capitalism are the\r\n  immediate visible sign of &quot;The Free World.&quot; For many in Eastern\r\n  Europe such images in the West sum up what they in the East lack.\r\n  Advertising, it is thought, offers a free choice. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>It is true that in\r\n  advertising one brand of manufacture, one firm, competes with another; but it\r\n  is also true that every advertising image confirms and enhances every other.\r\n  Advertising is not merely an assembly of competing messages: it is a language\r\n  in itself that is always being used to make the same general proposal. Within\r\n  advertising, choices are offered between this cream and that cream, that car\r\n  and this car, but advertising as a system only makes a single proposal. It\r\n  proposes to each of us that we transform ourselves, or our lives, by buying\r\n  something more. Advertising persuades us of such a transformation by showing\r\n  us people who have apparently been transformed and are, as a result,\r\n  enviable. The state of being envied is what constitutes glamour. And\r\n  advertising is the process of manufacturing glamour. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>Advertising has\r\n  another important social function. The fact that this function has not been\r\n  planned as a purpose by those who make and use advertising in no way lessens\r\n  its significance. Advertising turns consumption into a substitute for\r\n  democracy. The choice of what one eats (or wears or drives) takes the place\r\n  of significant political choice. Advertising helps to mask and compensate for\r\n  all that is undemocratic within society. And it also masks what is happening\r\n  in the rest of the world. Advertising adds up to a kind of philosophical\r\n  system. It explains everything in its own terms. It interprets the world. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>The entire world\r\n  becomes a setting for the fulfillment of advertising's promise of the good\r\n  life. The world smiles at us. It offers itself to us. And because everywhere\r\n  is imagined as offering itself to us, everywhere is more or less the same.\r\n  The contrast between advertising's interpretation of the world and the\r\n  world's actual condition is a very stark one, and this sometimes becomes\r\n  evident in the color magazines which deal with news stories. It can be argued\r\n  that the juxtaposition of images was not planned. Nevertheless the text, the\r\n  photographs taken in Pakistan, the photographs taken for the advertisements,\r\n  the editing of the magazine, the layout of the advertising, the printing of\r\n  both, the fact that advertiser's pages and news pages cannot be co-ordinated\r\n  - all these are produced by the same culture. <o:p><\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span\r\n  lang=EN-US>Advertising exerts an enormous influence and is a political\r\n  phenomenon of great importance. But its offer is as narrow as its references\r\n  are wide. It recognizes nothing except the power to acquire. All other human\r\n  faculties or needs are made subsidiary to this power. All hopes are gathered\r\n  together, made homogeneous, simplified, so that they become the intense yet\r\n  vague, magical yet repeatable promise offered in every purchase. No other\r\n  kind of hope or satisfaction or pleasure can any longer be envisaged within\r\n  the culture of capitalism. Advertising is the life of this culture - in so\r\n  far as without advertising capitalism could not survive - and at the same\r\n  time advertising is its dream. Capitalism survives by forcing the majority,\r\n  whom it exploits, to define their own interests as narrowly as possible. This\r\n  was once achieved by extensive deprivation. Today in the developed countries\r\n  it is being achieved by imposing a false standard of what is and what is not\r\n  desirable.<\/span><span lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div>", "options": ["<p><span lang=\"EN-US\">only I<\/span><\/p>", "<p><span lang=\"EN-US\">I and II<\/span><\/p>", "<p><span lang=\"EN-US\">II and III<\/span><\/p>", "<p><span lang=\"EN-US\">I, II and III<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\">Refer to the second paragraph: it states that advertisements of different products offer us choices but advertising as a system makes only one proposal - that we transform ourselves by indulging more. I makes this point. From the passage it is clear that advertising plays with our emotion of envy and the assumption is that fall for advertisements because of this envy. II slightly distorts this and puts this assumption as a fact that is universal. So, it is eliminated. III is also incorrect because the first sentence states that advertising is explained and justified as a medium that benefits the public. Whether the advertising industry adheres to this goal or not cannot be derived from the passage. Thus, III is also negated. Hence, (1).<\/span><\/p>", "topic": "Application Question"}, {"number": 10, "sourceId": "83678", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>Advertising is usually explained and\r\n  justified as a competitive medium that ultimately benefits the public (the\r\n  consumer) and the most efficient manufacturers - and thus the national\r\n  economy. It is closely related to certain ideas about freedom: freedom of\r\n  choice for the purchaser, freedom of enterprise for the manufacturer. The\r\n  great hoardings and the advertising neons of the cities of capitalism are the\r\n  immediate visible sign of &quot;The Free World.&quot; For many in Eastern\r\n  Europe such images in the West sum up what they in the East lack.\r\n  Advertising, it is thought, offers a free choice. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>It is true that in\r\n  advertising one brand of manufacture, one firm, competes with another; but it\r\n  is also true that every advertising image confirms and enhances every other.\r\n  Advertising is not merely an assembly of competing messages: it is a language\r\n  in itself that is always being used to make the same general proposal. Within\r\n  advertising, choices are offered between this cream and that cream, that car\r\n  and this car, but advertising as a system only makes a single proposal. It\r\n  proposes to each of us that we transform ourselves, or our lives, by buying\r\n  something more. Advertising persuades us of such a transformation by showing\r\n  us people who have apparently been transformed and are, as a result,\r\n  enviable. The state of being envied is what constitutes glamour. And\r\n  advertising is the process of manufacturing glamour. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>Advertising has\r\n  another important social function. The fact that this function has not been\r\n  planned as a purpose by those who make and use advertising in no way lessens\r\n  its significance. Advertising turns consumption into a substitute for\r\n  democracy. The choice of what one eats (or wears or drives) takes the place\r\n  of significant political choice. Advertising helps to mask and compensate for\r\n  all that is undemocratic within society. And it also masks what is happening\r\n  in the rest of the world. Advertising adds up to a kind of philosophical\r\n  system. It explains everything in its own terms. It interprets the world. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>The entire world\r\n  becomes a setting for the fulfillment of advertising's promise of the good\r\n  life. The world smiles at us. It offers itself to us. And because everywhere\r\n  is imagined as offering itself to us, everywhere is more or less the same.\r\n  The contrast between advertising's interpretation of the world and the\r\n  world's actual condition is a very stark one, and this sometimes becomes\r\n  evident in the color magazines which deal with news stories. It can be argued\r\n  that the juxtaposition of images was not planned. Nevertheless the text, the\r\n  photographs taken in Pakistan, the photographs taken for the advertisements,\r\n  the editing of the magazine, the layout of the advertising, the printing of\r\n  both, the fact that advertiser's pages and news pages cannot be co-ordinated\r\n  - all these are produced by the same culture. <o:p><\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span\r\n  lang=EN-US>Advertising exerts an enormous influence and is a political\r\n  phenomenon of great importance. But its offer is as narrow as its references\r\n  are wide. It recognizes nothing except the power to acquire. All other human\r\n  faculties or needs are made subsidiary to this power. All hopes are gathered\r\n  together, made homogeneous, simplified, so that they become the intense yet\r\n  vague, magical yet repeatable promise offered in every purchase. No other\r\n  kind of hope or satisfaction or pleasure can any longer be envisaged within\r\n  the culture of capitalism. Advertising is the life of this culture - in so\r\n  far as without advertising capitalism could not survive - and at the same\r\n  time advertising is its dream. Capitalism survives by forcing the majority,\r\n  whom it exploits, to define their own interests as narrowly as possible. This\r\n  was once achieved by extensive deprivation. Today in the developed countries\r\n  it is being achieved by imposing a false standard of what is and what is not\r\n  desirable.<\/span><span lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">What does the author imply when he says \"Advertising turns consumption into a substitute for democracy\"?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Through advertising, different social groups can disseminate their messages among millions.<\/span><\/p>", "<p><span lang=\"EN-US\">Advertising explains everything in its own terms and does not relent to any social mores or conventions.<\/span><\/p>", "<p><span lang=\"EN-US\">Advertising generates mass appeal and thereby unites people of all strata.<\/span><\/p>", "<p><span lang=\"EN-US\">Advertisement messages are for everyone to get inspired and make the decision whether to buy the product or not.<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">'Democracy' refers to a social order where supreme power is vested in the people and they can exercise it directly or indirectly in a free electoral system. So, there is formal equality of rights and privileges. (1) just refers to how massages can be scattered but no proactive measure on the part of the recipients of those messages. (2) indicates the authority that advertising enjoys but not how it acts as asocial leveler. It is not only the effect of mass appeal that the author wants to highlight here. In the sentence following the quoted sentence, the author says that the choice one makes after seeing an advertisement is akin to a political choice. Therefore, (4) is the main implication of the sentence. Hence, (4).<\/span><\/p>", "topic": "Inference"}, {"number": 11, "sourceId": "83005", "type": "mcq", "passage": "<p><span lang=\"EN-US\">The main species of online writing might all be said to belong to the family of \"commentary\" rather than what is still sometimes called (though not usually without embarrassment) \"literature.\" They have, that is, a sort of secondary status to whatever primary object they comment on; they are prompted by and dependent on some other object or event, whether a commercial product, a recent private experience, a news story, someone else's political opinion, a song or book, or whatever. This is not to disdain commentary for its failure to be primary rather than secondary, only to attempt to suggest its difference from literature. Literature, you might say, transforms the world into an illustration of the text, while commentary's relationship to the world is more like that of a caption to a photograph or a wall-paragraph to a painting.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The news article that formed the germ of Madame Bovary might serve as an example of commentary, and Flaubert's novel as one of literature. At the unmarked border between the literature and commentary, the regions may be hard to tell apart. But on the whole the climates are distinct for the different natures and longevities of the creatures they support. The would-be piece of literature may not last for decades and generations, but it wants to. The article of commentary may not vanish from everyone's mind after a lifespan measured in days and weeks, but it expects to.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The difference recalls that between labour and work in Hannah Arendt. \"Labour,\" as she defines it, flows into goods whose twofold character is to be used up by consumption and to erase the discrete contribution of the individual labourer. \"Work,\" on the other hand, yields durable objects whose utility is not destroyed by the use of them, and which bear the lasting impress of the individual artisan. Presumably writing will always be like more work, in this sense, than a job as a short-order cook, but if, as Arendt held, the tendency of the modern world is to establish \"a waste economy, in which things must be almost as quickly devoured and discarded as they appear in the world,\" this process would seem to be overtaking prose along with everything else.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">The second paragraph suggests that:<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">writers of commentary aspire in vain to produce articles that leave a lasting impression on readers.<\/span><\/p>", "<p><span lang=\"EN-US\">writers of commentary do not consider it their task to produce articles that leave <br />a lasting impression on readers.<\/span><\/p>", "<p><span lang=\"EN-US\">writers of commentary do not aspire to produce articles that leave a lasting impression on readers.<\/span><\/p>", "<p><span lang=\"EN-US\">writers of commentary consider it their task to produce articles that leave a lasting <br />impression on readers.<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">Refer to the last two sentences of the second paragraph. The author is of the opinion that literature looks forward to permanence, whereas when one writes a commentary, he/ she takes it for granted that the memory of the writing will vanish from everyone's mind after a few days. So, a writer of commentary would not strive to produce a piece that would be remembered forever. [3] correctly states this attitude of writers. [2], though close, is not correct because from the passage we do not know the perception of commentary writers regarding what constitutes their work. Hence, [3].<\/span><\/p>", "topic": "Specific Detail"}, {"number": 12, "sourceId": "83006", "type": "mcq", "passage": "<p><span lang=\"EN-US\">The main species of online writing might all be said to belong to the family of \"commentary\" rather than what is still sometimes called (though not usually without embarrassment) \"literature.\" They have, that is, a sort of secondary status to whatever primary object they comment on; they are prompted by and dependent on some other object or event, whether a commercial product, a recent private experience, a news story, someone else's political opinion, a song or book, or whatever. This is not to disdain commentary for its failure to be primary rather than secondary, only to attempt to suggest its difference from literature. Literature, you might say, transforms the world into an illustration of the text, while commentary's relationship to the world is more like that of a caption to a photograph or a wall-paragraph to a painting.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The news article that formed the germ of Madame Bovary might serve as an example of commentary, and Flaubert's novel as one of literature. At the unmarked border between the literature and commentary, the regions may be hard to tell apart. But on the whole the climates are distinct for the different natures and longevities of the creatures they support. The would-be piece of literature may not last for decades and generations, but it wants to. The article of commentary may not vanish from everyone's mind after a lifespan measured in days and weeks, but it expects to.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The difference recalls that between labour and work in Hannah Arendt. \"Labour,\" as she defines it, flows into goods whose twofold character is to be used up by consumption and to erase the discrete contribution of the individual labourer. \"Work,\" on the other hand, yields durable objects whose utility is not destroyed by the use of them, and which bear the lasting impress of the individual artisan. Presumably writing will always be like more work, in this sense, than a job as a short-order cook, but if, as Arendt held, the tendency of the modern world is to establish \"a waste economy, in which things must be almost as quickly devoured and discarded as they appear in the world,\" this process would seem to be overtaking prose along with everything else.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p>The author uses the distinction between labour and work in Hannah Arendt to highlight:<\/p>\n<p>I.     the longevity of literature vis-à-vis commentary, by looking at the way they are created and consumed.<\/p>\n<p>II.    the presence and absence of the creator’s imprint in literature and commentary respectively.<\/p>\n<p>III.   the difference in the impact of literature and commentary in transforming society.<\/p>", "options": ["<p><span lang=\"EN-US\">Only I<\/span><\/p>", "<p><span lang=\"EN-US\">Both I and II<\/span><\/p>", "<p><span lang=\"EN-US\">Both II and III<\/span><\/p>", "<p><span lang=\"EN-US\">I, II and III<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">Refer to the third paragraph. The author quotes Hannah Arendt in order to reinstate the difference between a work of literature and online writing or commentary. From the comparison, it is clear that commentary writing is like Labour, where the thing created is meant for immediate consumption. On the other hand, literature is like Work, which has durability. So, I is stated. II is also clearly stated in the second and third sentences of the paragraph. III is not inferable because the author does not dwell on the impact of the two forms of writing on the transformation of the society. Hence, [2].<\/span><\/p>", "topic": "Specific Detail"}, {"number": 13, "sourceId": "83007", "type": "mcq", "passage": "<p><span lang=\"EN-US\">The main species of online writing might all be said to belong to the family of \"commentary\" rather than what is still sometimes called (though not usually without embarrassment) \"literature.\" They have, that is, a sort of secondary status to whatever primary object they comment on; they are prompted by and dependent on some other object or event, whether a commercial product, a recent private experience, a news story, someone else's political opinion, a song or book, or whatever. This is not to disdain commentary for its failure to be primary rather than secondary, only to attempt to suggest its difference from literature. Literature, you might say, transforms the world into an illustration of the text, while commentary's relationship to the world is more like that of a caption to a photograph or a wall-paragraph to a painting.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The news article that formed the germ of Madame Bovary might serve as an example of commentary, and Flaubert's novel as one of literature. At the unmarked border between the literature and commentary, the regions may be hard to tell apart. But on the whol
