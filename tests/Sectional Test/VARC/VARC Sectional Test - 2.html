<script type="application/json" id="test-data">{"testNumber": 2, "simcat": 2, "minutes": 40, "questions": [{"number": 1, "sourceId": "16833653050760", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>At the close of World War I, the four defeated empires that had dominated and ruled East Central Europe—the German, Habsburg, Ottoman, and Russian empires—were replaced by a dozen new or restored or enlarged would-be nation-states, all of which based their asserted legitimation on the then reigning politico-moral principle of national self-determination. Though the territorial arrangements of 1919 to 1921 still left a number of additional nations in East Central Europe stateless and created problems of aggrieved minorities allocated to states toward which they felt little or no affinity, conditions that induced revisionist apologists for the territorial losers of World War I to charge that the territorial arrangements were merely a cynical and unprincipled victors’ fiat, for all their admitted flaws, they still freed three times as many people from nationally alien rule as they subjected to such rule.<\/span>\r<br>\r<br><span>The real political weakness of the interwar effort to implement the principle of national self-determination in East Central Europe lay not in its alleged hypocrisy, but in the impossibility of reconciling it with three other important aims of the peacemakers of 1919 to 1921: the permanent diminution of German power, the permanent containment of Russian power, and the permanent restoration of international order in Europe. In other words, the geopolitical map of interwar East Central Europe, with its plethora of new, restored, and enlarged so-called<\/span><span> <\/span><span>nation-states, was not congruent with the real distribution of power in Europe.<\/span>\r<br>\r<br><span>Germany and Soviet Russia embodied the two basic revisionist threats to the territorial and social settlements of the interwar years… The defeat of Germany in 1918 was deceptive. Neither in absolute nor in relative terms had Germany been weakened to anything like the extent that was often assumed in the 1920s. In absolute terms, Germany’s industrial and transportation resources had been left largely intact because World War I had not been fought on its territory. In relative terms, a territorial settlement predicated on the national principle, such as that popular in 1919 to 1921, <\/span><span>ipso facto<\/span><span> left Germany as Europe’s second largest country after Russia. Relative to East Central Europe, Germany gained through the replacement of the Habsburg Empire, which for all its infirmities had still been a major power… Germany’s geographical position in the <\/span><span>center<\/span><span> of the continent was only enhanced by these developments.<\/span>\r<br>\r<br><span>The very existence of the newly independent but highly vulnerable states of East Central Europe, endorsed by the victorious Western Allies, proved on balance a political and diplomatic asset to <\/span>Germany. It (1) initially buffered Germany against a <span>spillover<\/span><span> of the Bolshevik Revolution, (2) then tempted Soviet Russia to collaborate with Germany throughout the 1920s and in the partition of this area in 1939 and 1940, and (3) ultimately frustrated efforts at Soviet–Western cooperation to halt Nazi Germany in the late 1930s, as the West was then inhibited by its commitments to the successor states from paying the Soviet Union’s price for such cooperation—the sacrifice of East Central Europe’s effective independence to Soviet hegemony…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following best expresses the main idea of the passage?<\/span>", "options": ["<span>The territorial arrangements in East Central Europe after WWI proved helpful for German and Russian collaboration, and ultimately frustrated the Western Allies’ efforts to halt Nazi Germany.<\/span>", "<span><\/span>\t<span>The principle of national self-determination in East Central Europe after WWI failed due to the conflicting aims of the peacemakers, including the containment of German and Russian power.<\/span>", "<span><\/span>\t<span>The implementation of national self-determination in East Central Europe after WWI was hindered by an incongruent geopolitical map with Germany and Soviet Russia remaining revisionist threats.<\/span>", "<span><\/span>\t<span>Germany’s defeat in WWI was deceptive as it remained largely intact from the war, and Russia and Germany remained revisionist threats to interwar settlements in East Central Europe.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>The story in the passage briefly is this: After World War I,&nbsp;<\/span><span>a number of<\/span><span> new or restored nation-states were established in East Central Europe based on the principle of national self-determination. However, these states were&nbsp;<\/span><span>vulnerable<\/span><span> and their creation conflicted with other aims of the peacemakers, including the containment of German and Russian power and the restoration of international order in Europe. As a result, the geopolitical map of interwar East Central Europe was not in line with the distribution of power in the region. Germany and Russia were revisionist threats to the territorial and social settlements in the region, with Germany remaining a major power despite its defeat in World War I. The presence of these newly independent states proved to be an asset for Germany, as they served as a buffer against the spread of the Bolshevik Revolution, tempted Soviet Russia to collaborate with Germany, and ultimately frustrated efforts at cooperation between the Soviet Union and the West to halt Nazi Germany in the late 1930s.<\/span>\r<br /><span>Option 1. Incorrect. Summarizes only the second part of the above story.<\/span>\r<br /><span>Option 2. Incorrect. Summarizes only the first part of the above story.<\/span>\r<br /><span>Option 3. Correct. Brief, but includes the full story.<\/span>\r<br /><span>Option 4. Incorrect. Summarizes only the German aspect of the story.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Central Idea"}, {"number": 2, "sourceId": "16833653050801", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>At the close of World War I, the four defeated empires that had dominated and ruled East Central Europe—the German, Habsburg, Ottoman, and Russian empires—were replaced by a dozen new or restored or enlarged would-be nation-states, all of which based their asserted legitimation on the then reigning politico-moral principle of national self-determination. Though the territorial arrangements of 1919 to 1921 still left a number of additional nations in East Central Europe stateless and created problems of aggrieved minorities allocated to states toward which they felt little or no affinity, conditions that induced revisionist apologists for the territorial losers of World War I to charge that the territorial arrangements were merely a cynical and unprincipled victors’ fiat, for all their admitted flaws, they still freed three times as many people from nationally alien rule as they subjected to such rule.<\/span>\r<br>\r<br><span>The real political weakness of the interwar effort to implement the principle of national self-determination in East Central Europe lay not in its alleged hypocrisy, but in the impossibility of reconciling it with three other important aims of the peacemakers of 1919 to 1921: the permanent diminution of German power, the permanent containment of Russian power, and the permanent restoration of international order in Europe. In other words, the geopolitical map of interwar East Central Europe, with its plethora of new, restored, and enlarged so-called<\/span><span> <\/span><span>nation-states, was not congruent with the real distribution of power in Europe.<\/span>\r<br>\r<br><span>Germany and Soviet Russia embodied the two basic revisionist threats to the territorial and social settlements of the interwar years… The defeat of Germany in 1918 was deceptive. Neither in absolute nor in relative terms had Germany been weakened to anything like the extent that was often assumed in the 1920s. In absolute terms, Germany’s industrial and transportation resources had been left largely intact because World War I had not been fought on its territory. In relative terms, a territorial settlement predicated on the national principle, such as that popular in 1919 to 1921, <\/span><span>ipso facto<\/span><span> left Germany as Europe’s second largest country after Russia. Relative to East Central Europe, Germany gained through the replacement of the Habsburg Empire, which for all its infirmities had still been a major power… Germany’s geographical position in the <\/span><span>center<\/span><span> of the continent was only enhanced by these developments.<\/span>\r<br>\r<br><span>The very existence of the newly independent but highly vulnerable states of East Central Europe, endorsed by the victorious Western Allies, proved on balance a political and diplomatic asset to <\/span>Germany. It (1) initially buffered Germany against a <span>spillover<\/span><span> of the Bolshevik Revolution, (2) then tempted Soviet Russia to collaborate with Germany throughout the 1920s and in the partition of this area in 1939 and 1940, and (3) ultimately frustrated efforts at Soviet–Western cooperation to halt Nazi Germany in the late 1930s, as the West was then inhibited by its commitments to the successor states from paying the Soviet Union’s price for such cooperation—the sacrifice of East Central Europe’s effective independence to Soviet hegemony…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>According to the first paragraph, the territorial arrangements of 1919 to 1921 (first paragraph) …<\/span>", "options": ["<span><\/span>\t<span>were largely successful in the drawing of new national boundaries to reflect the principle of national self-determination of the time.<\/span>", "<span><\/span>\t<span>rearranged the maps of East Central Europe to create would-be nation-states as per a cynical and unprincipled will of the victors of World War I.<\/span>", "<span><\/span>\t<span>pushed the territorial losers of World War I into stateless nations towards which they felt little no affinity.<\/span>", "<span><\/span>\t<span>undermined the principle of self-determination, as many of the new states were created without any regard for the wishes of the people living in them.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span>Option&nbsp;<\/span><span>1. Correct. Whatever the shortcomings of the arrangement, the paragraph concludes, “they still freed three times as many people from nationally alien rule as they subjected to such rule.”<\/span>\r<br /><span>Option 2. Incorrect. This view is of the revisionist apologists for the territorial losers of World War I.<\/span>\r<br /><span>Option 3. Incorrect. No data to make this inference.<\/span>\r<br /><span>Option 4. Incorrect. Could be true. But the driving principle was self-determination and  “they still freed three times as many people from nationally alien rule as they subjected to such rule.” Paragraph 1 does not highlight any problem with the rearrangements other than aggrieved minorities.<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Specific Detail Question"}, {"number": 3, "sourceId": "16833653050802", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>At the close of World War I, the four defeated empires that had dominated and ruled East Central Europe—the German, Habsburg, Ottoman, and Russian empires—were replaced by a dozen new or restored or enlarged would-be nation-states, all of which based their asserted legitimation on the then reigning politico-moral principle of national self-determination. Though the territorial arrangements of 1919 to 1921 still left a number of additional nations in East Central Europe stateless and created problems of aggrieved minorities allocated to states toward which they felt little or no affinity, conditions that induced revisionist apologists for the territorial losers of World War I to charge that the territorial arrangements were merely a cynical and unprincipled victors’ fiat, for all their admitted flaws, they still freed three times as many people from nationally alien rule as they subjected to such rule.<\/span>\r<br>\r<br><span>The real political weakness of the interwar effort to implement the principle of national self-determination in East Central Europe lay not in its alleged hypocrisy, but in the impossibility of reconciling it with three other important aims of the peacemakers of 1919 to 1921: the permanent diminution of German power, the permanent containment of Russian power, and the permanent restoration of international order in Europe. In other words, the geopolitical map of interwar East Central Europe, with its plethora of new, restored, and enlarged so-called<\/span><span> <\/span><span>nation-states, was not congruent with the real distribution of power in Europe.<\/span>\r<br>\r<br><span>Germany and Soviet Russia embodied the two basic revisionist threats to the territorial and social settlements of the interwar years… The defeat of Germany in 1918 was deceptive. Neither in absolute nor in relative terms had Germany been weakened to anything like the extent that was often assumed in the 1920s. In absolute terms, Germany’s industrial and transportation resources had been left largely intact because World War I had not been fought on its territory. In relative terms, a territorial settlement predicated on the national principle, such as that popular in 1919 to 1921, <\/span><span>ipso facto<\/span><span> left Germany as Europe’s second largest country after Russia. Relative to East Central Europe, Germany gained through the replacement of the Habsburg Empire, which for all its infirmities had still been a major power… Germany’s geographical position in the <\/span><span>center<\/span><span> of the continent was only enhanced by these developments.<\/span>\r<br>\r<br><span>The very existence of the newly independent but highly vulnerable states of East Central Europe, endorsed by the victorious Western Allies, proved on balance a political and diplomatic asset to <\/span>Germany. It (1) initially buffered Germany against a <span>spillover<\/span><span> of the Bolshevik Revolution, (2) then tempted Soviet Russia to collaborate with Germany throughout the 1920s and in the partition of this area in 1939 and 1940, and (3) ultimately frustrated efforts at Soviet–Western cooperation to halt Nazi Germany in the late 1930s, as the West was then inhibited by its commitments to the successor states from paying the Soviet Union’s price for such cooperation—the sacrifice of East Central Europe’s effective independence to Soviet hegemony…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following best expresses the ‘real political weakness of the interwar effort to implement the principle of national self-determination in East Central Europe’?<\/span>", "options": ["<span>A larger number of new, restored, and enlarged nation-states were created <\/span><span>in an effort to<\/span><span> implement the principle of national self-determination in the region.<\/span>", "<span><\/span>\t<span>The desire to permanently diminish German and Russian power did not take into account the wishes of the people living in the affected areas.<\/span>", "<span><\/span>\t<span>The alleged hypocrisy of the efforts to implement the principle of national self-determination in the region made them irreconcilable with the other aims of the effort.<\/span>", "<span><\/span>\t<span>The political boundaries and arrangements of interwar Europe did not reflect the real distribution of power in Europe.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>Refer to the second paragraph. After mentioning certain specific problems that made the effort irreconcilable with the goal, the passage states it broadly as: “In other words, the geopolitical map of interwar East Central Europe, with its plethora of new, restored, and enlarged so-called<\/span><span>&nbsp;<\/span><span>nation-states, was not congruent with the real distribution of power in Europe.” This statement accommodates the “German, Habsburg, Ottoman, and Russian empires” mentioned in the first paragraph.<\/span>\r<br /><span>Option 1. Incorrect. The division itself is not cited as a weakness.<\/span>\r<br /><span>Option 2. Incorrect. It takes account of only two ‘empires’ that existed prior to WWI.<\/span>\r<br />Option 3. Incorrect. The alleged hypocrisy is cited as not the real issue.\r<br /><span>Option 4. Correct. As explained above.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Specific Detail Question"}, {"number": 4, "sourceId": "16833653050803", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>At the close of World War I, the four defeated empires that had dominated and ruled East Central Europe—the German, Habsburg, Ottoman, and Russian empires—were replaced by a dozen new or restored or enlarged would-be nation-states, all of which based their asserted legitimation on the then reigning politico-moral principle of national self-determination. Though the territorial arrangements of 1919 to 1921 still left a number of additional nations in East Central Europe stateless and created problems of aggrieved minorities allocated to states toward which they felt little or no affinity, conditions that induced revisionist apologists for the territorial losers of World War I to charge that the territorial arrangements were merely a cynical and unprincipled victors’ fiat, for all their admitted flaws, they still freed three times as many people from nationally alien rule as they subjected to such rule.<\/span>\r<br>\r<br><span>The real political weakness of the interwar effort to implement the principle of national self-determination in East Central Europe lay not in its alleged hypocrisy, but in the impossibility of reconciling it with three other important aims of the peacemakers of 1919 to 1921: the permanent diminution of German power, the permanent containment of Russian power, and the permanent restoration of international order in Europe. In other words, the geopolitical map of interwar East Central Europe, with its plethora of new, restored, and enlarged so-called<\/span><span> <\/span><span>nation-states, was not congruent with the real distribution of power in Europe.<\/span>\r<br>\r<br><span>Germany and Soviet Russia embodied the two basic revisionist threats to the territorial and social settlements of the interwar years… The defeat of Germany in 1918 was deceptive. Neither in absolute nor in relative terms had Germany been weakened to anything like the extent that was often assumed in the 1920s. In absolute terms, Germany’s industrial and transportation resources had been left largely intact because World War I had not been fought on its territory. In relative terms, a territorial settlement predicated on the national principle, such as that popular in 1919 to 1921, <\/span><span>ipso facto<\/span><span> left Germany as Europe’s second largest country after Russia. Relative to East Central Europe, Germany gained through the replacement of the Habsburg Empire, which for all its infirmities had still been a major power… Germany’s geographical position in the <\/span><span>center<\/span><span> of the continent was only enhanced by these developments.<\/span>\r<br>\r<br><span>The very existence of the newly independent but highly vulnerable states of East Central Europe, endorsed by the victorious Western Allies, proved on balance a political and diplomatic asset to <\/span>Germany. It (1) initially buffered Germany against a <span>spillover<\/span><span> of the Bolshevik Revolution, (2) then tempted Soviet Russia to collaborate with Germany throughout the 1920s and in the partition of this area in 1939 and 1940, and (3) ultimately frustrated efforts at Soviet–Western cooperation to halt Nazi Germany in the late 1930s, as the West was then inhibited by its commitments to the successor states from paying the Soviet Union’s price for such cooperation—the sacrifice of East Central Europe’s effective independence to Soviet hegemony…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>According to the author, “Soviet–Western cooperation to halt Nazi Germany” was difficult to achieve because:<\/span>", "options": ["<span>Germany was largely unaffected by WWI in absolute terms as the war did not take place on its soil.<\/span>", "<span><\/span>\t<span>Soviet Russia was in collaboration with Germany from the 1920s till the late 1930s.<\/span>", "<span><\/span>\t<span>Nazi Germany was able to continue its expansion without facing any opposition from Russia.<\/span>", "<span><\/span>\t<span>The Western powers were unwilling to pay the price demanded by the Soviet Union for cooperation.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>Refer to the last paragraph: “… ultimately frustrated efforts at Soviet–Western cooperation to halt Nazi Germany in the late 1930s, as the West was then inhibited by its commitments to the successor states from paying the Soviet Union’s price for such cooperation—the sacrifice of East Central Europe’s effective independence to Soviet hegemony.” Option 4 states the reason without specifying what the price was.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Specific Detail Question"}, {"number": 5, "sourceId": "16833653050804", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>For thousands of years, there have always been three types of monetary systems: Type 1: Hard money (e.g., metal coins), Type 2: Paper money (claims on hard money) and Type 3: Fiat money.<\/span><br><br><span>Hard money is the most restrictive system because money can’t be created unless the supply of the metal or other intrinsically valuable commodity that is the money is increased. Money and credit are more easily created in the second type of system, so the ratio of the claims on hard money to the actual hard money held rises… The result is a) defaults, when the bank closes its doors and depositors lose their hard assets, and/or b) devaluations of the claims on money, which mean depositors get back less.<\/span><br><br><span>In the third type of system, governments can create money and credit freely… <\/span><span>So<\/span><span> when the system of hard money and claims on hard money becomes too painfully constrictive, governments typically abandon it in <\/span><span>favor<\/span><span> of what is called “fiat money.” No hard money is involved in fiat systems; there is just paper money that the central bank can print without restriction. As a result, there is no risk that <\/span>the central bank will have its stash of hard money drawn down and <span>have to<\/span><span> default on its promises to deliver it. Rather, the risk is that, freed from the constraints on the supply of tangible gold, silver, or some other hard asset, the people who control the printing presses (i.e., the central bankers working with the commercial bankers) will create ever more money and debt assets and liabilities in relation to the amount of goods and services being produced until the time comes when those holding the enormous amount of debt will try to turn it in for goods and services, which will […] result in either debt defaults or the devaluation of money.<\/span><br><br><span>When a country needs more money and credit than it currently has, whether to deal with debts, wars, or other problems, it naturally moves from Type 1 to Type 2, or Type 2 to Type 3, so that it has more flexibility to print money. Then creating too much money and debt depreciates their value, causing people to get out of holding debt and money as a <\/span><span>storehold<\/span><span> of wealth and move back into hard assets (like gold and silver) and other currencies. Since this typically takes place when there is wealth conflict and sometimes war, there is also typically a desire to get out of the country. Such countries need to re-establish confidence in their currency as a store<\/span><span> <\/span><span>hold of wealth before they can restore their credit markets.<\/span><br><br><span>… This <\/span><span>‘<\/span><span>big cycle<\/span><span>’<\/span><span> typically plays out over something like 50 to 75 years; its ending is characterized by a restructuring of debts and the monetary system itself. The abrupt parts of these restructurings—i.e., the periods of debt and currency crisis—typically happen quickly, lasting only a few months to up to three years, depending on how long it takes the government to act. However, their ripple effects can be long-lasting…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>All of the following can be inferred from the 2<\/span><span><sup>nd<\/sup><\/span><span> Paragraph, EXCEPT:<\/span>", "options": ["<span>In a hard money system, the supply of money is limited by the commodity that is used as money.<\/span>", "The claim on hard money is the amount of money that is needed in the economy.", "The actual hard money e second type of system, so the ratio of the claims on hard money to the actual hard money held rises… The result is a) defaults, when the bank closes its doors and depositors lose their hard assets, and/or b) devaluations of the claims on money, which mean depositors get back less.<\/span><br><br><span>In the third type of system, governments can create money and credit freely… <\/span><span>So<\/span><span> when the system of hard money and claims on hard money becomes too painfully constrictive, governments typically abandon it in <\/span><span>favor<\/span><span> of what is called “fiat money.” No hard money is involved in fiat systems; there is just paper money that the central bank can print without restriction. As a result, there is no risk that <\/span>the central bank will have its stash of hard money drawn down and <span>have to<\/span><span> default on its promises to deliver it. Rather, the risk is that, freed from the constraints on the supply of tangible gold, silver, or some other hard asset, the people who control the printing presses (i.e., the central bankers working with the commercial bankers) will create ever more money and debt assets and liabilities in relation to the amount of goods and services being produced until the time comes when those holding the enormous amount of debt will try to turn it in for goods and services, which will […] result in either debt defaults or the devaluation of money.<\/span><br><br><span>When a country needs more money and credit than it currently has, whether to deal with debts, wars, or other problems, it naturally moves from Type 1 to Type 2, or Type 2 to Type 3, so that it has more flexibility to print money. Then creating too much money and debt depreciates their value, causing people to get out of holding debt and money as a <\/span><span>storehold<\/span><span> of wealth and move back into hard assets (like gold and silver) and other currencies. Since this typically takes place when there is wealth conflict and sometimes war, there is also typically a desire to get out of the country. Such countries need to re-establish confidence in their currency as a store<\/span><span> <\/span><span>hold of wealth before they can restore their credit markets.<\/span><br><br><span>… This <\/span><span>‘<\/span><span>big cycle<\/span><span>’<\/span><span> typically plays out over something like 50 to 75 years; its ending is characterized by a restructuring of debts and the monetary system itself. The abrupt parts of these restructurings—i.e., the periods of debt and currency crisis—typically happen quickly, lasting only a few months to up to three years, depending on how long it takes the government to act. However, their ripple effects can be long-lasting…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>In the THIRD type of system, the possibility of the central bank defaulting on its promises never arises because:<\/span>", "options": ["<span>Defaults on debts or devaluation of money will occur.<\/span>", "<span><\/span>\t<span>The governments will create more money and debt assets<\/span><span> as required<\/span><span>.<\/span>", "<span><\/span>\t<span>Those with enormous debt will try to turn it in for goods and services.<\/span>", "<span><\/span>\t<span>The banks will close their doors and depositors will lose their money.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>Refer to the third paragraph, though the quoted part is from the second paragraph: “So when the system of hard money and claims on hard money becomes too painfully constrictive, governments typically abandon it in&nbsp;<\/span><span>favor<\/span><span> of what<\/span><span> is called “fiat money.”  This i<\/span><span>s explained to mean: “there is no risk that the central bank will have its stash of hard money drawn down and&nbsp;<\/span><span>have to<\/span><span> default on its promises to deliver it. Rather, the risk is that, freed from guishes Type 3 monetary system from the other types?<\/span>", "options": ["<span>The value of its money is tied to a tangible asset that is not subject to significant fluctuations.<\/span>", "<span><\/span>\t<span>Its money is backed by a promise to exchange the money for a specific amount of a physical commodity, such as gold or silver.<\/span>", "<span><\/span>\t<span>Its money is not backed by a physical commodity or a promise to exchange it for a commodity, and it is not redeemable for anything else.<\/span>", "<span><\/span>\t<span>Its money is the most trusted and stable instrument in times of economic problems or geopolitical tensions.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<span>Option 1. Incorrect. This is a characteristic of Type 1 not of type 3.<\/span>\r<br /><span>Option 2. Incorrect. This is a characteristic of Type 2 not of type 3.<\/span>\r<br /><span>Option 3. Correct. This is<\/span><span> the characteristic of Type 3. T<\/span><span>he value of the money is not tied to a tangible asset or&nbsp;<\/span><span>promise, and<\/span><span> is instead dependent only on the perceived strength of the issuing government. (printed freely) This can be inferred from the second to last paragraph.<\/span>\r<br /><span>Option 4. Incorrect. Trusted and stable is unsustainable. But the contrary can be inferred from “Then creating too much money and debt depreciates their value, causing people to get out … Since this typically takes place when there is wealth conflict and sometimes war, there is also typically a desire to get out of the country. Such countries need to re-establish confidence in their currency as a&nbsp;<\/span><span>storehold<\/span><span> of wealth before they can restore their credit markets.”<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Inference"}, {"number": 8, "sourceId": "16833653050817", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>For thousands of years, there have always been three types of monetary systems: Type 1: Hard money (e.g., metal coins), Type 2: Paper money (claims on hard money) and Type 3: Fiat money.<\/span><br><br><span>Hard money is the most restrictive system because money can’t be created unless the supply of the metal or other intrinsically valuable commodity that is the money is increased. Money and credit are more easily created in the second type of system, so the ratio of the claims on hard money to the actual hard money held rises… The result is a) defaults, when the bank closes its doors and depositors lose their hard assets, and/or b) devaluations of the claims on money, which mean depositors get back less.<\/span><br><br><span>In the third type of system, governments can create money and credit freely… <\/span><span>So<\/span><span> when the system of hard money and claims on hard money becomes too painfully constrictive, governments typically abandon it in <\/span><span>favor<\/span><span> of what is called “fiat money.” No hard money is involved in fiat systems; there is just paper money that the central bank can print without restriction. As a result, there is no risk that <\/span>the central bank will have its stash of hard money drawn down and <span>have to<\/span><span> default on its promises to deliver it. Rather, the risk is that, freed from the constraints on the supply of tangible gold, silver, or some other hard asset, the people who control the printing presses (i.e., the central bankers working with the commercial bankers) will create ever more money and debt assets and liabilities in relation to the amount of goods and services being produced until the time comes when those holding the enormous amount of debt will try to turn it in for goods and services, which will […] result in either debt defaults or the devaluation of money.<\/span><br><br><span>When a country needs more money and credit than it currently has, whether to deal with debts, wars, or other problems, it naturally moves from Type 1 to Type 2, or Type 2 to Type 3, so that it has more flexibility to print money. Then creating too much money and debt depreciates their value, causing people to get out of holding debt and money as a <\/span><span>storehold<\/span><span> of wealth and move back into hard assets (like gold and silver) and other currencies. Since this typically takes place when there is wealth conflict and sometimes war, there is also typically a desire to get out of the country. Such countries need to re-establish confidence in their currency as a store<\/span><span> <\/span><span>hold of wealth before they can restore their credit markets.<\/span><br><br><span>… This <\/span><span>‘<\/span><span>big cycle<\/span><span>’<\/span><span> typically plays out over something like 50 to 75 years; its ending is characterized by a restructuring of debts and the monetary system itself. The abrupt parts of these restructurings—i.e., the periods of debt and currency crisis—typically happen quickly, lasting only a few months to up to three years, depending on how long it takes the government to act. However, their ripple effects can be long-lasting…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>The ‘big cycle’ the author talks about in the last paragraph of the passage most likely refers to:<\/span>", "options": ["<span>The long-term cycles of ups and downs of monetary systems that result in previously existing debt being restructured to avoid long lasting consequences.<\/span>", "<span><\/span>\t<span>The cycle of money in which it changes <\/span><span>from hard money,<\/span><span> to paper money backed by hard assets and then to a fiat monetary system.<\/span>", "<span><\/span>\t<span>Movement of an economy from a stable monetary system to too much money and debt leading to devaluation of the money, and even a restructuring of the system itself.<\/span>", "<span><\/span>\t<span>Fluctuations of the economy between periods of expansion and contraction leading to a devaluation of the currency and a loss of confidence in the monetary system.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>Option 1 is partially correct. However, the 'big cycle' referred to in the passage is specifically referring to the broader historical pattern of the evolution of monetary systems over time, rather than the specific process of restructuring debt to avoid long-lasting consequences.<\/span>\r<br /><span>Option 2: Correct. The paragraph before the last one  sta<\/span><span>t<\/span><span>es that “… it naturally moves from Type 1 to Type 2, or Type 2 to Type 3, so that it has more flexibility to print money.” This is the big cycle.<\/span>\r<br /><span>Option 3 is also partially correct. However, the 'big cycle' referred to in the passage specifically refers to the historical evolution of monetary systems from hard money to paper money and then to fiat money, as described in option 2. Option 3 describes one of the consequences of the 'big cycle' but not the cycle itself.<\/span>\r<br /><span>Option 4: Incorrect. The cycle is not mere fluctuation in the economy – the passage calls it a cycle but does not suggest that it repeats itself (… between periods of expansion and contraction).<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Inference"}, {"number": 9, "sourceId": "16833653050818", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Most species, it turns out, are parasitized by multiple others. Parasites proliferate because every living thing is a smorgasbord of nutrients and energy, and being a top predator isn’t the only way to get a bite of that bounty. Parasites opt out of the arms race between predator and prey entirely, choosing an easier path. It’s clever, when you think about it, and <\/span><span>it’s<\/span><span> exactly why parasitism is so common. Nature abhors a vacuum. If there’s an opportunity, someone’s going to evolve to fill it.<\/span><br><br><span>Parasitism has evolved as a way of life again and again, over billions of years, from the smallest and simplest microbes to the most complex vertebrates.<\/span><span> <\/span><span>Yet, we have barely begun to identify all the parasites, much less learn their lifestyles or monitor their populations. One of the things Skylar Hopkins, an ecologist at North Carolina State University, and her colleagues have noticed is what they call the paradox of co-extinction. Since parasites <\/span><span>by definition need<\/span><span> other species, they’re particularly vulnerable to the phenomenon. Take, for example, the endangered pygmy hog-sucking louse. It lives only on another endangered species, the pygmy hog, which is disappearing from the grasslands it inhabits in the foothills of the Himalaya. Because they’re so sensitive to extinction, it seems likely that many parasite species have already disappeared.<\/span><br><span><\/span><br><span>The poster child for parasite conservation, if there is one, is the California condor louse, an ironic victim of the conservation movement itself. In the 1970s, desperate to save the California condor, biologists began rearing the birds in captivity. Part of the protocol was to de-louse every bird with pesticides, on the assumption that parasites were bad for condors, though it’s not clear they <\/span><span>actually were<\/span><span>. The California condor louse hasn’t been seen since. Untold other parasitic worms, protozoans, and insects are presumed to have gone down with the ship, so to speak, as their hosts died out.<\/span><br><br><span>While the demise of life’s hangers-on might seem like no big deal, or even something to strive for, ecologists caution that wiping them all out would probably spell planetary doom. Without parasites keeping them in check, populations of some animals would explode, just as invasive species do when they’re transplanted away from natural predators. Other species would likely crash in the ensuing <\/span><span>melée<\/span><span>.<\/span><br><br><span>Big, charismatic predators would lose out, too. Many parasites have evolved to move into their next host by manipulating the host they’re in, which tends to drive that host into a predator’s mouth. Nematomorph worms, for instance, mature inside crickets but then need to be in water to mate. <\/span><span>So<\/span><span> they influence the crickets’ brains, driving the insects to jump into streams, where they become an important food source for trout. Similar phenomena feed birds, cats, and other predators the world over.<\/span><br><br><span>Even human health wouldn’t entirely benefit from wiping out parasites.<\/span><span><\/span><span>In countries such as the United States, where we have eliminated most intestinal parasites, we have autoimmune diseases that are virtually unheard of in places where everyone still has those parasites. According to one line of thinking, the human immune system evolved with a coterie of worms and protozoan parasites, and when we killed them off, our immune systems began attacking ourselves…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>According to the passage, parasitism is common for all the following reasons EXCEPT:<\/span>", "options": ["<span>They occupy the evolutionary niche where nutrients and energy are in surplus.<\/span>", "<span>They evade the host's immune system, making it difficult for the host to eliminate them.<\/span>", "<span><\/span>\t<span>They alter the <\/span><span>behavior<\/span><span> of their hosts to increase their transmission to new hosts.<\/span>", "<span><\/span>\t<span>They are less vulnerable to extinction as they exploit the divide between predators and prey.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>Option 1. Not an exception. “Nature abhors a vacuum. If there’s an opportunity, someone’s going to evolve to fill it.” – the vacuum refers to the space left by predators and prey where nutrients and energy are not exploited by any organism.<\/span>\r<br /><span>Option 2. Not an exception. “… the human immune system evolved with a coterie of worms and protozoan parasites, and when we killed them off, our immune systems began attacking ourselves…”<\/span>\r<br /><span>Option 3.  Not an exception. “Many parasites have evolved to move into their next host by manipulating the host they’re in, which tends to drive that host into a predator’s mouth.”<\/span>\r<br /><span>Option 4. Exception. Though they proliferate there is no concrete data to determine whether they are less vulnerable to extinction. They are just caught in the ‘paradox of co-extinction.’<\/span>\r<br />Hence<span>,<\/span><span>&nbsp;<\/span><span>[<\/span><span>4<\/span><span>]<\/span><span>.<\/span>", "topic": "Specific Detail Question"}, {"number": 10, "sourceId": "16833653050829", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Most species, it turns out, are parasitized by multiple others. Parasites proliferate because every living thing is a smorgasbord of nutrients and energy, and being a top predator isn’t the only way to get a bite of that bounty. Parasites opt out of the arms race between predator and prey entirely, choosing an easier path. It’s clever, when you think about it, and <\/span><span>it’s<\/span><span> exactly why parasitism is so common. Nature abhors a vacuum. If there’s an opportunity, someone’s going to evolve to fill it.<\/span><br><br><span>Parasitism has evolved as a way of life again and again, over billions of years, from the smallest and simplest microbes to the most complex vertebrates.<\/span><span> <\/span><span>Yet, we have barely begun to identify all the parasites, much less learn their lifestyles or monitor their populations. One of the things Skylar Hopkins, an ecologist at North Carolina State University, and her colleagues have noticed is what they call the paradox of co-extinction. Since parasites <\/span><span>by definition need<\/span><span> other species, they’re particularly vulnerable to the phenomenon. Take, for example, the endangered pygmy hog-sucking louse. It lives only on another endangered species, the pygmy hog, which is disappearing from the grasslands it inhabits in the foothills of the Himalaya. Because they’re so sensitive to extinction, it seems likely that many parasite species have already disappeared.<\/span><br><span><\/span><br><span>The poster child for parasite conservation, if there is one, is the California condor louse, an ironic victim of the conservation movement itself. In the 1970s, desperate to save the California condor, biologists began rearing the birds in captivity. Part of the protocol was to de-louse every bird with pesticides, on the assumption that parasites were bad for condors, though it’s not clear they <\/span><span>actually were<\/span><span>. The California condor louse hasn’t been seen since. Untold other parasitic worms, protozoans, and insects are presumed to have gone down with the ship, so to speak, as their hosts died out.<\/span><br><br><span>While the demise of life’s hangers-on might seem like no big deal, or even something to strive for, ecologists caution that wiping them all out would probably spell planetary doom. Without parasites keeping them in check, populations of some animals would explode, just as invasive species do when they’re transplanted away from natural predators. Other species would likely crash in the ensuing <\/span><span>melée<\/span><span>.<\/span><br><br><span>Big, charismatic predators would lose out, too. Many parasites have evolved to move into their next host by manipulating the host they’re in, which tends to drive that host into a predator’s mouth. Nematomorph worms, for instance, mature inside crickets but then need to be in water to mate. <\/span><span>So<\/span><span> they influence the crickets’ brains, driving the insects to jump into streams, where they become an important food source for trout. Similar phenomena feed birds, cats, and other predators the world over.<\/span><br><br><span>Even human health wouldn’t entirely benefit from wiping out parasites.<\/span><span><\/span><span>In countries such as the United States, where we have eliminated most intestinal parasites, we have autoimmune diseases that are virtually unheard of in places where everyone still has those parasites. According to one line of thinking, the human immune system evolved with a coterie of worms and protozoan parasites, and when we killed them off, our immune systems began attacking ourselves…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>According to the passage, which of the following parasites are more likely to escape the ‘paradox of co-extinction’?<\/span>", "options": ["<span>Pygmy hog-sucking lice.<\/span>", "<span><\/span>\t<span>California condor lice.<\/span>", "<span><\/span>\t<span>Nematomorph worms.<\/span>", "<span><\/span>\t<span>Protozoan parasites in humans.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>The paradox of co-extinction is the host and the parasite becoming extinct together.<\/span>\r<br /><span>Option 1. Incorrect. The pygmy hog-sucking lice are advanced as an example to illustrate the paradox of co-extinction.<\/span>\r<br /><span>Option 2. Incorrect. “…&nbsp;<\/span><span>insects (California condor lice) are presumed to have gone down with the ship, so to speak, as their hosts died out.” Is another example of co-extinction.<\/span>\r<br /><span>Option 3. Correct. Nematomorph worms are “parasites (that) have evolved to move into their next host by manipulating the host they’re in…” are less vulnerable to co-extinction, because they find a new host.<\/span>\r<br /><span>Option 4. Incorrect. There is no information about how vulnerable they are with the extinction of human beings. They may become extinct with human beings.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Inference"}, {"number": 11, "sourceId": "168336530508210", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Most species, it turns out, are parasitized by multiple others. Parasites proliferate because every living thing is a smorgasbord of nutrients and energy, and being a top predator isn’t the only way to get a bite of that bounty. Parasites opt out of the arms race between predator and prey entirely, choosing an easier path. It’s clever, when you think about it, and <\/span><span>it’s<\/span><span> exactly why parasitism is so common. Nature abhors a vacuum. If there’s an opportunity, someone’s going to evolve to fill it.<\/span><br><br><span>Parasitism has evolved as a way of life again and again, over billions of years, from the smallest and simplest microbes to the most complex vertebrates.<\/span><span> <\/span><span>Yet, we have barely begun to identify all the parasites, much less learn their lifestyles or monitor their populations. One of the things Skylar Hopkins, an ecologist at North Carolina State University, and her colleagues have noticed is what they call the paradox of co-extinction. Since parasites <\/span><span>by definition need<\/span><span> other species, they’re particularly vulnerable to the phenomenon. Take, for example, the endangered pygmy hog-sucking louse. It lives only on another endangered species, the pygmy hog, which is disappearing from the grasslands it inhabits in the foothills of the Himalaya. Because they’re so sensitive to extinction, it seems likely that many parasite species have already disappeared.<\/span><br><span><\/span><br><span>The poster child for parasite conservation, if there is one, is the California con
