illed them off, our immune systems began attacking ourselves…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>According to the passage, parasite conservation is important because:<\/span>", "options": ["<span>Parasites manipulate their hosts to benefit their next host.<\/span>", "<span><\/span>\t<span>Parasites help regulate the populations of their hosts.<\/span>", "<span><\/span>\t<span>Parasites are responsible for the co-evolution of the human immune system.<\/span>", "<span><\/span>\t<span>Parasites keep the population of natural predators under control.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>Option 1: Incorrect. Parasites manipulate their&nbsp;<\/span><span>hosts<\/span><span> so they take the parasites closer to the next host. However, the next host may not necessarily be benefitted.<\/span>\r<br /><span>Option 2: Correct. This is true as can be understood from: ‘Without parasites keeping them in check, populations of some animals would explode …’ There is also the example of how “they influence the crickets’ brains, driving the insects to jump into streams, where they become an important food source for trout.”<\/span>\r<br /><span>Option 3: Incorrect<\/span><span>.<\/span><span> Parasites are not ‘responsible’ for the convolution of the human immune system. The human immune system coevolved with the parasites.<\/span>\r<br /><span>Option 4: Incorrect. Requires the unwarranted assumption that the hosts are necessarily ‘predators.’ Option 2 is specific and clear with ‘their hosts’<\/span><span>.<\/span><span><\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Inference"}, {"number": 12, "sourceId": "168336530508211", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Most species, it turns out, are parasitized by multiple others. Parasites proliferate because every living thing is a smorgasbord of nutrients and energy, and being a top predator isn’t the only way to get a bite of that bounty. Parasites opt out of the arms race between predator and prey entirely, choosing an easier path. It’s clever, when you think about it, and <\/span><span>it’s<\/span><span> exactly why parasitism is so common. Nature abhors a vacuum. If there’s an opportunity, someone’s going to evolve to fill it.<\/span><br><br><span>Parasitism has evolved as a way of life again and again, over billions of years, from the smallest and simplest microbes to the most complex vertebrates.<\/span><span> <\/span><span>Yet, we have barely begun to identify all the parasites, much less learn their lifestyles or monitor their populations. One of the things Skylar Hopkins, an ecologist at North Carolina State University, and her colleagues have noticed is what they call the paradox of co-extinction. Since parasites <\/span><span>by definition need<\/span><span> other species, they’re particularly vulnerable to the phenomenon. Take, for example, the endangered pygmy hog-sucking louse. It lives only on another endangered species, the pygmy hog, which is disappearing from the grasslands it inhabits in the foothills of the Himalaya. Because they’re so sensitive to extinction, it seems likely that many parasite species have already disappeared.<\/span><br><span><\/span><br><span>The poster child for parasite conservation, if there is one, is the California condor louse, an ironic victim of the conservation movement itself. In the 1970s, desperate to save the California condor, biologists began rearing the birds in captivity. Part of the protocol was to de-louse every bird with pesticides, on the assumption that parasites were bad for condors, though it’s not clear they <\/span><span>actually were<\/span><span>. The California condor louse hasn’t been seen since. Untold other parasitic worms, protozoans, and insects are presumed to have gone down with the ship, so to speak, as their hosts died out.<\/span><br><br><span>While the demise of life’s hangers-on might seem like no big deal, or even something to strive for, ecologists caution that wiping them all out would probably spell planetary doom. Without parasites keeping them in check, populations of some animals would explode, just as invasive species do when they’re transplanted away from natural predators. Other species would likely crash in the ensuing <\/span><span>melée<\/span><span>.<\/span><br><br><span>Big, charismatic predators would lose out, too. Many parasites have evolved to move into their next host by manipulating the host they’re in, which tends to drive that host into a predator’s mouth. Nematomorph worms, for instance, mature inside crickets but then need to be in water to mate. <\/span><span>So<\/span><span> they influence the crickets’ brains, driving the insects to jump into streams, where they become an important food source for trout. Similar phenomena feed birds, cats, and other predators the world over.<\/span><br><br><span>Even human health wouldn’t entirely benefit from wiping out parasites.<\/span><span><\/span><span>In countries such as the United States, where we have eliminated most intestinal parasites, we have autoimmune diseases that are virtually unheard of in places where everyone still has those parasites. According to one line of thinking, the human immune system evolved with a coterie of worms and protozoan parasites, and when we killed them off, our immune systems began attacking ourselves…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following, if true, undermines the argument in the last paragraph?<\/span>", "options": ["<span>Whether parasitic infections precipitate or prevent autoimmune disorders is a contentious issue.<\/span>", "<span><\/span>\t<span>Decreasing parasitic infection rates has an important role to play in the rising prevalence of autoimmune disorders.<\/span>", "<span><\/span>\t<span>Parasites have been important for the evolution of the human immune system.<\/span>", "<span><\/span>\t<span>Many autoimmune diseases have an infectious trigger as the root cause including viruses.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>The argument in the last paragraph is: “human health wouldn’t entirely benefit from wiping out parasites.” To support this argument, the paragraph states that autoimmune diseases have surfaced after eliminating intestinal parasites, whereas elsewhere where the parasites are present these autoimmune diseases are not present. In short, parasites prevent autoimmune diseases. Option 4 states another cause for autoimmune diseases – infections including viral infections. Eliminating parasites may not be reason for autoimmune diseases; hence it undermines the argument.<\/span>\r<br />Option 1. Incorrect. If the issue is&nbsp;<span>contentious<\/span><span> it does not weaken or strengthen either side – whether parasites cause or prevent autoimmune diseases.<\/span>\r<br /><span>Option 2. Incorrect. Option 2 repeats the argument.<\/span>\r<br /><span>Option 3. Incorrect Similar to option 1. It does not weaken or strengthen the argument .<\/span>\r<br /><span>Option 4. Correct. As above.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Application Question"}, {"number": 13, "sourceId": "168336530508212", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>Current explanations for why humans dance tend to follow one of two approaches. The first, seen in psychological and some philosophical circles, begins with a human as an individual person who chooses to dance (or not) for entertainment, exercise, artistic <span>expression<\/span><span> or some other personal reason. Such approaches assume that dance is one activity among others offering benefits to an individual that may be desirable, but not necessary, for human wellbeing. Alternatively, a raft of sociological and anthropological explanations <\/span><span>focus<\/span><span> on community, asserting that dancing is one of the first means by which the earliest humans solidified strong social bonds irrespective of blood lines. In these accounts, dancing is eventually replaced by more rational and effective means of social bonding that the dancing itself makes possible, such as language, <\/span><span>morality<\/span><span> and religion. While the first type of reasoning struggles to explain why so many humans choose to dance, the second struggles to explain why humans continue to dance. What is missing from these accounts?<\/span><br><br><span>What if humans are the primates whose capacity to dance (shared by some birds and mammals) was the signature strategy enabling the evolution of a distinctively large and interconnected brain, empathic <\/span><span>heart<\/span><span> and ecological adaptability? And what if dancing plays this role for humans not just in prehistoric times, but continuing into the present? What if humans are creatures who evolved to dance as the enabling condition of their own bodily becoming?<\/span><br><br><span>Recent evidence for such a thesis is gathering across scientific and scholarly disciplines. Time and again, researchers are discovering the vital role played by bodily movement not only in the evolution of the human species, but in the present-day social and psychological development of healthy individuals. Moreover, it is not just bodily movement itself that registers as vital in these cases, but a threefold capacity: to notice and recreate movement patterns; to remember and share movement patterns; and to mobilise these movement patterns as a means for sensing and responding to whatever appears. This threefold capacity is what every dance technique or tradition exercises and educates.<\/span><br><br><span>According to the New York University neuroscientist Rodolfo <\/span><span>Llinás<\/span><span>, bodily movement builds brains. A brain takes shape as it records patterns of neuromuscular coordination, and then remembers the outcomes in terms of pain or pleasure, emotional tags that help it assess whether to mobilise that movement again, and if so, how.<\/span><br><br><span>In so far as bodily movements build the brain, every movement a human makes matters. Each repetition of a movement deepens and strengthens the pattern of mind-body coordination that making that movement requires; and the repetition also defines avenues along which future attention and energy flow. Every movement made and remembered shapes how an organism grows – what it senses and how it responds. From this perspective, every aspect of a human bodily self – from chromosomal couplet to sense organ to limb shape – is a capacity for moving that develops through a process of its own movement making.<\/span><br><br>In this sense, a human being is what I call a rhythm of bodily becoming. A human is always creating patterns of bodily movement, where every new movement unfolds along an open-ended trajectory made possible by movements already made. Dancing can be seen as a means of participating in this rhythm of bodily becoming.", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>According to the first paragraph, the two approaches to the explanations for why humans dance …<\/span>", "options": ["<span>Reduce dance to its physical component in terms of physical activity.<\/span>", "<span>Overlook the meanings that dance has for the individual and community.<\/span>", "<span>Fail to explain humans’ preference for dance in contemporary societies.<\/span>", "<span>Disregard the psychological and anthropological significance of dance.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>“While the first type of reasoning struggles to explain why so many humans choose to dance, the second struggles to explain why humans continue to dance.” The paragraph explains that the first approach looks at dance as a personal choice – exercise, artistic&nbsp;<\/span><span>expression<\/span><span> or entertainment.  According to the author, it does not explain why someone chooses dancing over (for example) swimming or something else. The second approach looks at dance as a community activity meant to achieve social bonding which will be eventually replaced by language, religion etc. According to the author, it does not explain why humans choose dance when language, religion etc. are already available to them? (“continue to dance”). Option 3 combines both as a single reason in “preference in contemporary societies”.<\/span>\r<br /><span>Option 1 is incorrect because the second approach does not reduce dance to mere physical activity.<\/span>\r<br /><span>Option 2 is incorrect because the approaches do deal with both personal and community reasons.<\/span>\r<br /><span>Option 4 is incorrect because the two approaches do not disregard the psychological and anthropological views.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Inference"}, {"number": 14, "sourceId": "168336530508313", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>Current explanations for why humans dance tend to follow one of two approaches. The first, seen in psychological and some philosophical circles, begins with a human as an individual person who chooses to dance (or not) for entertainment, exercise, artistic <span>expression<\/span><span> or some other personal reason. Such approaches assume that dance is one activity among others offering benefits to an individual that may be desirable, but not necessary, for human wellbeing. Alternatively, a raft of sociological and anthropological explanations <\/span><span>focus<\/span><span> on community, asserting that dancing is one of the first means by which the earliest humans solidified strong social bonds irrespective of blood lines. In these accounts, dancing is eventually replaced by more rational and effective means of social bonding that the dancing itself makes possible, such as language, <\/span><span>morality<\/span><span> and religion. While the first type of reasoning struggles to explain why so many humans choose to dance, the second struggles to explain why humans continue to dance. What is missing from these accounts?<\/span><br><br><span>What if humans are the primates whose capacity to dance (shared by some birds and mammals) was the signature strategy enabling the evolution of a distinctively large and interconnected brain, empathic <\/span><span>heart<\/span><span> and ecological adaptability? And what if dancing plays this role for humans not just in prehistoric times, but continuing into the present? What if humans are creatures who evolved to dance as the enabling condition of their own bodily becoming?<\/span><br><br><span>Recent evidence for such a thesis is gathering across scientific and scholarly disciplines. Time and again, researchers are discovering the vital role played by bodily movement not only in the evolution of the human species, but in the present-day social and psychological development of healthy individuals. Moreover, it is not just bodily movement itself that registers as vital in these cases, but a threefold capacity: to notice and recreate movement patterns; to remember and share movement patterns; and to mobilise these movement patterns as a means for sensing and responding to whatever appears. This threefold capacity is what every dance technique or tradition exercises and educates.<\/span><br><br><span>According to the New York University neuroscientist Rodolfo <\/span><span>Llinás<\/span><span>, bodily movement builds brains. A brain takes shape as it records patterns of neuromuscular coordination, and then remembers the outcomes in terms of pain or pleasure, emotional tags that help it assess whether to mobilise that movement again, and if so, how.<\/span><br><br><span>In so far as bodily movements build the brain, every movement a human makes matters. Each repetition of a movement deepens and strengthens the pattern of mind-body coordination that making that movement requires; and the repetition also defines avenues along which future attention and energy flow. Every movement made and remembered shapes how an organism grows – what it senses and how it responds. From this perspective, every aspect of a human bodily self – from chromosomal couplet to sense organ to limb shape – is a capacity for moving that develops through a process of its own movement making.<\/span><br><br>In this sense, a human being is what I call a rhythm of bodily becoming. A human is always creating patterns of bodily movement, where every new movement unfolds along an open-ended trajectory made possible by movements already made. Dancing can be seen as a means of participating in this rhythm of bodily becoming.", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>According to the author, the second approach to the explanations for why humans dance is inadequate because:<\/span>", "options": ["<span>Sociological and anthropological explanations have been replaced by more rational views.<\/span>", "<span><\/span>\t<span>Dance occupies an important place in the social structure of all human communities.<\/span>", "<span><\/span>\t<span>Most of the humans who dance do it only for entertainment, exercise, or for personal reasons.<\/span>", "<span><\/span>\t<span>Humans no longer require <\/span><span>to dance<\/span><span> for social bonding as more effective means are available.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>The second approach: “Alternatively, a raft of sociological and anthropological explanations&nbsp;<\/span><span>focus<\/span><span> on community, asserting that dancing is one of the first means by which the earliest humans solidified strong social bonds irrespective of blood lines. In these accounts, dancing is eventually replaced by more rational and effective means of social bonding that the dancing itself makes possible, such as language,&nbsp;<\/span><span>morality<\/span><span> and religion. (It) struggles to explain why humans continue to dance.” The assumption is that humans no longer need to turn to dance to create social bonding. Hence 4.<\/span>\r<br /><span>Option 1. Incorrect. “… replaced by more rational views” is incorrect.<\/span>\r<br /><span>Option 2. Incorrect. It does not explain why the second approach is inadequate.<\/span>\r<br /><span>Option 3. Incorrect. This is related to the first approach.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Specific Detail Question"}, {"number": 15, "sourceId": "168336530508314", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>Current explanations for why humans dance tend to follow one of two approaches. The first, seen in psychological and some philosophical circles, begins with a human as an individual person who chooses to dance (or not) for entertainment, exercise, artistic <span>expression<\/span><span> or some other personal reason. Such approaches assume that dance is one activity among others offering benefits to an individual that may be desirable, but not necessary, for human wellbeing. Alternatively, a raft of sociological and anthropological explanations <\/span><span>focus<\/span><span> on community, asserting that dancing is one of the first means by which the earliest humans solidified strong social bonds irrespective of blood lines. In these accounts, dancing is eventually replaced by more rational and effective means of social bonding that the dancing itself makes possible, such as language, <\/span><span>morality<\/span><span> and religion. While the first type of reasoning struggles to explain why so many humans choose to dance, the second struggles to explain why humans continue to dance. What is missing from these accounts?<\/span><br><br><span>What if humans are the primates whose capacity to dance (shared by some birds and mammals) was the signature strategy enabling the evolution of a distinctively large and interconnected brain, empathic <\/span><span>heart<\/span><span> and ecological adaptability? And what if dancing plays this role for humans not just in prehistoric times, but continuing into the present? What if humans are creatures who evolved to dance as the enabling condition of their own bodily becoming?<\/span><br><br><span>Recent evidence for such a thesis is gathering across scientific and scholarly disciplines. Time and again, researchers are discovering the vital role played by bodily movement not only in the evolution of the human species, but in the present-day social and psychological development of healthy individuals. Moreover, it is not just bodily movement itself that registers as vital in these cases, but a threefold capacity: to notice and recreate movement patterns; to remember and share movement patterns; and to mobilise these movement patterns as a means for sensing and responding to whatever appears. This threefold capacity is what every dance technique or tradition exercises and educates.<\/span><br><br><span>According to the New York University neuroscientist Rodolfo <\/span><span>Llinás<\/span><span>, bodily movement builds brains. A brain takes shape as it records patterns of neuromuscular coordination, and then remembers the outcomes in terms of pain or pleasure, emotional tags that help it assess whether to mobilise that movement again, and if so, how.<\/span><br><br><span>In so far as bodily movements build the brain, every movement a human makes matters. Each repetition of a movement deepens and strengthens the pattern of mind-body coordination that making that movement requires; and the repetition also defines avenues along which future attention and energy flow. Every movement made and remembered shapes how an organism grows – what it senses and how it responds. From this perspective, every aspect of a human bodily self – from chromosomal couplet to sense organ to limb shape – is a capacity for moving that develops through a process of its own movement making.<\/span><br><br>In this sense, a human being is what I call a rhythm of bodily becoming. A human is always creating patterns of bodily movement, where every new movement unfolds along an open-ended trajectory made possible by movements already made. Dancing can be seen as a means of participating in this rhythm of bodily becoming.", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>The “threefold capacity…what every dance technique or tradition exercises and educates” (Paragraph 3) does NOT include:<\/span>", "options": ["<span>Using movement as a means of controlling the environment.<\/span>", "<span><\/span>\t<span>Being aware of one's own movements and those of others.<\/span>", "<span><\/span>\t<span>Being able to communicate movement sequences to others.<\/span>", "<span><\/span>\t<span>Using movement as a tool for gathering information.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<span>Refer to the third paragraph: “threefold capacity: to notice and recreate movement patterns; to remember and share movement patterns; and to mobilise these movement patterns as a means for sensing and responding to whatever appears.”<\/span>\r<br /><span>Option 2. Included. “to notice and recreate movement patterns” – implies&nbsp;<\/span><span>2<\/span>\r<br /><span>Option 3. Included. “to remember and share movement patterns.”<\/span>\r<br /><span>Option 4. Included. “as a means for sensing and responding to whatever appears.”<\/span>\r<br /><span>Option 1. NOT included. It may involve using movement to explore and interact with the environment- but not controlling the environment.<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Inference"}, {"number": 16, "sourceId": "168336530508315", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>Current explanations for why humans dance tend to follow one of two approaches. The first, seen in psychological and some philosophical circles, begins with a human as an individual person who chooses to dance (or not) for entertainment, exercise, artistic <span>expression<\/span><span> or some other personal reason. Such approaches assume that dance is one activity among others offering benefits to an individual that may be desirable, but not necessary, for human wellbeing. Alternatively, a raft of sociological and anthropological explanations <\/span><span>focus<\/span><span> on community, asserting that dancing is one of the first means by which the earliest humans solidified strong social bonds irrespective of blood lines. In these accounts, dancing is eventually replaced by more rational and effective means of social bonding that the dancing itself makes possible, such as language, <\/span><span>morality<\/span><span> and religion. While the first type of reasoning struggles to explain why so many humans choose to dance, the second struggles to explain why humans continue to dance. What is missing from these accounts?<\/span><br><br><span>What if humans are the primates whose capacity to dance (shared by some birds and mammals) was the signature strategy enabling the evolution of a distinctively large and interconnected brain, empathic <\/span><span>heart<\/span><span> and ecological adaptability? And what if dancing plays this role for humans not just in prehistoric times, but continuing into the present? What if humans are creatures who evolved to dance as the enabling condition of their own bodily becoming?<\/span><br><br><span>Recent evidence for such a thesis is gathering across scientific and scholarly disciplines. Time and again, researchers are discovering the vital role played by bodily movement not only in the evolution of the human species, but in the present-day social and psychological development of healthy individuals. Moreover, it is not just bodily movement itself that registers as vital in these cases, but a threefold capacity: to notice and recreate movement patterns; to remember and share movement patterns; and to mobilise these movement patterns as a means for sensing and responding to whatever appears. This threefold capacity is what every dance technique or tradition exercises and educates.<\/span><br><br><span>According to the New York University neuroscientist Rodolfo <\/span><span>Llinás<\/span><span>, bodily movement builds brains. A brain takes shape as it records patterns of neuromuscular coordination, and then remembers the outcomes in terms of pain or pleasure, emotional tags that help it assess whether to mobilise that movement again, and if so, how.<\/span><br><br><span>In so far as bodily movements build the brain, every movement a human makes matters. Each repetition of a movement deepens and strengthens the pattern of mind-body coordination that making that movement requires; and the repetition also defines avenues along which future attention and energy flow. Every movement made and remembered shapes how an organism grows – what it senses and how it responds. From this perspective, every aspect of a human bodily self – from chromosomal couplet to sense organ to limb shape – is a capacity for moving that develops through a process of its own movement making.<\/span><br><br>In this sense, a human being is what I call a rhythm of bodily becoming. A human is always creating patterns of bodily movement, where every new movement unfolds along an open-ended trajectory made possible by movements already made. Dancing can be seen as a means of participating in this rhythm of bodily becoming.", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>The “rhythm of bodily becoming” most likely means which of the following?<\/span>", "options": ["<span>The body being in a constant state of developing and evolving through movement.<\/span>", "<span><\/span>\t<span>The process of constantly changing movement patterns in the environment.<\/span>", "<span><\/span>\t<span>The pattern of rhythmic movement that is unique to each individual dancer.<\/span>", "<span><\/span>\t<span>The process that allows individuals to respond to their environment and to connect with others.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span>The last two paragraphs give us some idea about what the author means by “rhythm of bodily becoming”. “In so far as bodily movements build the brain, every movement a human makes matters. Each repetition of a movement deepens and strengthens the pattern of mind-body coordination that making that movement requires; and the repetition also defines avenues along which future attention and energy flow. (simply put, this is most likely referring to evolution) Every movement made and remembered shapes how an organism grows – what it senses and how it responds. From this perspective, every aspect of a human bodily self – from chromosomal couplet to sense organ to limb shape – is a capacity for moving that develops through a process of its own movement making.” This is what the author calls the “rhythm of bodily becoming”. Option 1 best corresponds to this idea. Option 2 talks about the environment, hence incorrect. Option 3 refers to the dancer – whereas the author is more abstract. Option 4 is only part of the ‘bodily becoming.’<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Inference"}, {"number": 17, "sourceId": "168336530508316", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br>1.\t<span>Inflation can also occur when governments inject money into the economy lowering the value of the currency relative to the things it will buy.<\/span><br>2.\t<span>Prices rise as populations grow, economies get richer, demand increases, and commodities get scarcer and more expensive.<\/span><br><span>3.<\/span>\t<span>Inflation is a natural and healthy part of a growing economy, provided it stays under control and peoples’ salaries don’t <\/span><span>lag behind<\/span><span> the general rise in prices.<\/span><br>4.\t<span>Companies hike prices to meet rising demand, or to pay higher wages and buy more expensive raw materials.<\/span><br><br><span>", "options": [], "answer": "3241", "answerLabel": "3241", "solution": "<\/span>\t<span>Sentence 1. “… can also occur” is rejoinder. So, it follows another sentence.<\/span>\r<br /><span>Sentence 2. Good for a starter, unless it is preceded by the cause of which this is an effect.<\/span>\r<br /><span>Sentence 3. Good for a starter. Introduces ‘inflation’ – that it is healthy&nbsp;<\/span><span>as long as<\/span><span> it is under control.<\/span>\r<br /><span>Sentence 4. Another effect of inflation.<\/span>\r<br /><span>Sentences 2 and 4 are effects of inflation. They are best placed as 2- 4. 3 introduces the topic of inflation .&nbsp;<\/span><span>So<\/span><span> 3-2-4 is a sequence which is concluded by 1 , provoked by the phrase  “can also occur” stating another cause for  inflation.<\/span>\r<br /><span>The<\/span><span>refore, the&nbsp;<\/span><span>correct&nbsp;<\/span><span>answer is<\/span><span> 3241.<\/span><span><b>&nbsp;<\/b><\/span>", "topic": "Jumbled Paragraphs"}, {"number": 18, "sourceId": "168336530508617", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br>1.\t<span>In reality the<\/span><span> “future of work” is not some distant or discrete mode of social organization so unlike the one we have today; the management practices of tomorrow are not particularly different from those of the past.<\/span><br><span>2.<\/span>\t<span>They’re built on the same foundations—motivating efficiency, minimizing loss, optimizing processes, and improving productivity.<\/span><br><span>3.<\/span>\t<span>The way we talk about technology tends to be more focused on what is occurring now, but when it comes to “future of work,” we maintain some temporal distance from the current changes.<\/span><br><span>4.<\/span>\t<span>And one of the most common strategies for achieving these goals, then and now, is increased oversight over the activities of workers.<\/span><br><span>", "options": [], "answer": "3124", "answerLabel": "3124", "solution": "<\/span>\t<span>Sentence 1. “In reality…” juxtaposes the idea in the sentence rather than make it standalone. Hence it will come after another sentence.<\/span>\r<br />Sentence 2. 2 is closely related to 1. “They are built on the same foundation…” most likely refers to “the management practices…” mentioned in 1. Hence 1-2 is a possibility.\r<br /><span>Sentence 3. 3 talks about a general trend,&nbsp;<\/span><span>hence<\/span><span> could be the beginning of the paragraph. Also, ‘In reality’ in 1 links to “…we maintain some temporal distance” is 3. Hence 3-1 is also a pair.<\/span>\r<br /><span>Sentence 4. “… for achieving these goals’ links directly to ‘motivating efficiency’ etc. in 2.&nbsp;<\/span><span>So<\/span><span> 2-4 is also a pair.<\/span>\r<br /><span>The<\/span><span>refore, the<\/span><span> correct&nbsp;<\/span><span>answer&nbsp;<\/span><span>is 3124<\/span><span>.<\/span><span><\/span>", "topic": "Jumbled Paragraphs"}, {"number": 19, "sourceId": "168336530509018", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br>1.\t<span>Additionally, prompts written by large language models may include repetitions or unusual combinations of words and phrases.<\/span><br><span>2.<\/span>\t<span>One of the main differences between a prompt written by a human and one <\/span><span>machine-generated <\/span><span>by a large language model is the level of complexity and coherence.<\/span><br><span>3.<\/span>\t<span>This is because language models are trained to generate text by identifying patterns and regularities in the data and may sometimes produce responses that contain repetitive or unusual elements.<\/span><br><span>4.<\/span>\t<span>Large language models like Chat<\/span><span> <\/span><span>GPT are trained to generate text that is fluent and coherent, but they may not always be able to generate responses that are as nuanced or creative as those written by a human.<\/span><br><br><span>", "options": [], "answer": "2413", "answerLabel": "2413", "solution": "<\/span>\tS<span>entence 1. The presence of the word ‘Additionally…’ could mean that the sentence has to  come after something else or  could  be a conclusion.<\/span>\r<br /><span>Sentence 2.  Good candidate for being a  starter.<\/span>\r<br /><span>Sentence 3. Could provide the reason for sentence 2 . Hence 2-3 is a possible combination.<\/span>\r<br /><span>Sentence 4. The phrase  “not always be able to generate responses that are as nuanced or creative as those written by a human,” links it directly to sentence 2 as further explanation of the phrase “large language model (lack) the level of complexity and coherence.” Hence 2-4 is a a compulsory&nbsp;<\/span><span>combination..<\/span><span> 2431 and 2413 are possibilities. However, Additionally there are enough clues to suggest that  1 is not a conclusion but an addition to what 2-4 explains (“Additionally…”).&nbsp;<\/span><span>Also<\/span><span> the phrase “ may include repetitions or unusual combinations of words and phrases,” is further mentioned in 3. 2413 is thus a better sequence.<\/span><span>(The paragraph was generated by Chat<\/span><span>&nbsp;<\/span><span>GPT in an exercise by the Scientific American)<\/span>\r<br /><span>The<\/span><span>refore, the&nbsp;<\/span><span>correct answer is 2413.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 20, "sourceId": "168336530509119", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><span><b>Sentence:<\/b><\/span><span><b> <\/b><\/span><br>Users transferring the coins sign with their private keys, and the transaction is then transmitted over the Bitcoin network.<br><span><b>Paragraph:<\/b><\/span><span><b> <\/b><\/span><br><span>The first cryptocurrency was Bitcoin, created by an anonymous computer programmer or group of programmers known as Satoshi Nakamoto in 2009. _____1____. Satoshi Nakamoto was concerned that traditional currencies were too reliant on the trustworthiness of banks or governments to work <\/span>properly._____2____. Bitcoin relies on public key cryptography, in which users have a public key that is available for everyone to <span>see<\/span><span> and a private key known only to their computers. In a Bitcoin transaction users receiving Bitcoins send their public keys to users transferring the Bitcoins. _____3____. So that no Bitcoin can be spent more than once at the same time, the time and amount of each transaction is recorded in a ledger file that exists at each node of the network. _____4____. The identities of the users remain relatively anonymous, but everyone can see that certain Bitcoins were transferred.<\/span>", "options": ["<span>Option 1<\/span>", "<span><\/span>\t<span>Option 2<\/span>", "<span><\/span>\t<span>Option 3<\/span>", "<span><\/span>\t<span>Option 4<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>Blank 1 interrupts the narrative about Satoshi Nakamoto, hence no sentence is required in its place. Users of bitcoin are mentioned only in sentence after blank 2; hence the given sentence can come only later in the paragraph. Blank 3 is the ideal place as the description of the transaction gets  complete with the given sentence in the blank. Blank 4 is superfluous.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Paragraph Completion"}, {"number": 21, "sourceId": "168336530509220", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><span><b>Sentence: <\/b><\/span><br><span>China, in contrast to Hong Kong’s status as a British colony, began that period with its imperial dynasty in decline and ended it as a republic under communist rule.<\/span><br><span><b>Paragraph: <\/b><\/span><br><span>Is Hong Kong a Country? No, Hong Kong is not a country. Hong Kong is a special administrative region of China. _____1____.Hong Kong’s status as a special administrative region stems from its history as a former British colony. By way of treaty or lease with China, the islands and mainland area now known as Hong Kong came under the control of Great Britain at various points in the 19th century. _____2____.From that time until its transfer back to China in the late 20th century, Hong Kong developed on a different trajectory, both politically and economically, than mainland China. _____3____.Spurred by the pending expiration of a 99-year lease (1898–1997) for part of the territory, the 1984 Chinese-British joint declaration paved the way for all of Hong Kong to be returned to China. _____4____.<\/span>", "options": ["<span>Option 1<\/span>", "<span><\/span>\t<span>Option 2<\/span>", "<span><\/span>\t<span>Option 3<\/span>", "<span><\/span>\t<span>Option 4<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>The sentence after blank 1 refers to the colonization of Hong Kong. Hence, the given sentence cannot be placed in blank 1 and should come later in the paragraph. Blank 2 is inappropriate for the given sentence as the pronoun in the sentence ( its transfer )after blank 2  refers to Honk Kong and not to China. The given sentence is about China. Blank 3 is the appropriate place. The sentence before  blank 3 properly justifies the contrast.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Paragraph Completion"}, {"number": 22, "sourceId": "168336530509421", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br><span>While the problem of humanization has always, from an axiological point of view, been humankind's central  problem, it now takes on the character of an inescapable concern. Concern for humanization leads at once to the recognition of dehumanization, not only as an ontological possibility but as a historical reality. And as an individual perceives the extent of dehumanization, he or she may ask if humanization is a viable possibility. Within history, in concrete, objective contexts, both humanization and dehumanization are possibilities for a person as an uncompleted being conscious of their incompletion.<\/span>", "options": ["<span><\/span>\t<span>A concern for humanization, humankind’s central problem, leads to the recognition of the reality and extent of dehumanization, and one may question the viability of humanization.<\/span>", "<span><\/span>\t<span>While humanization and dehumanisation are real alternatives for individuals, the concern for humanization, in the face of the extent of dehumanization, raises questions about its viability.<\/span>", "<span><\/span>\t<span>Though humanization and dehumanization both are possibilities for individuals in the context of history, humanization has become an inescapable concern in the face of dehumanization.<\/span>", "<span><\/span>\t<span>A concern for humanization, as an inescapable alternative for individuals who are conscious of their incompletion is questionable in the face of the reality and extent of dehumanization.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<span><b>Points:<\/b><\/span><span><\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>Concern of humanization leads to recognition of dehumanization.<\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>The extent of dehumanization (that exists)&nbsp;<\/span><span>make<\/span><span> the viability of humanization questionable.<\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>Historically, both humanization and dehumanization were distinct possibilities for individuals.<\/span>\r<br />\r<br /><span>Option 1. Correct. Simple and brief essence.<\/span>\r<br /><span>Option 2. Incorrect.  ‘real alternatives for individuals’&nbsp;<\/span><span>is<\/span><span> unclear.<\/span>\r<br /><span>Option 3. Incorrect. Viability issue is missing.<\/span>\r<br /><span>Option 4. Incorrect The possibilities for individuals are not mentioned.<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Summary"}, {"number": 23, "sourceId": "168336530509522", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br><span>The matter of being able to define/ bestow the accolade of creativity is of extreme importance to the modern intellectual establishment – indeed, fake creativity stands close to the heart of the ideological project of the modern elite – because the elites work mainly via manipulations of esteem, including self-esteem. Its enemies are portrayed as immoral (especially ‘selfish, <\/span><span>judgemental<\/span><span> or ‘racist’ and thus associated with the Nazis and their horrors) and of low intelligence, knuckle-dragging crudity, retardation and lunacy. <\/span><span>Thus<\/span><span> to claim to be a ‘creative’ person has been changed from being the mere observation of a psychological fact; to an arrogant claim of deserving high social status for having achieved something which is approved by social arbiters.<\/span>", "options": ["<span>Creativity has become a fake status symbol for elites who work mainly via manipulation, and those who are not deemed “creative” are viewed as immoral or intellectually inferior.<\/span>", "<span><\/span>\t<span>The concept of creativity has become politicized and is used as a tool for manipulating esteem and social status and for attacking those who are immoral or unintelligent.<\/span>", "<span>Creativity is highly valued by the modern intellectual establishment and is often used as a means of manipulation by attributing to it a measure of achievement and social status.<\/span>", "<span><\/span>\t<span>The concept of creativity is used by the intellectual elites to manipulate esteem and to accord social status, and its enemies are portrayed as immoral, unintelligent, and crude.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t\r<br /><span><b>Points:<\/b><\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>Modern intellectuals hold creativity very important.<\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>They work via manipulation of esteem including self-esteem<\/span><span>.<\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>Its enemies are termed low life.<\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>(For modern intellectuals) Creativity is no longer a psychological fact, but a (fake) status<\/span><span>&nbsp;<\/span><span>symbol.<\/span>\r<br /><span>Option 1. Incorrect. ‘Fake status symbol’ is a misrepresentation of ‘fake creativity.’ “who are not deemed “creative”, is not accurate because the passage states ‘its enemies’. Option 1 is close but essentially incorrect.<\/span>\r<br /><span>Option 2. Incorrect. “for attacking those who are immoral or unintelligent,” is a misrepresentation of  “its enemies are portrayed as immoral ….etc.”<\/span>\r<br /><span>Option 3. Incorrect.  “ its enemies” part is missing.<\/span>\r<br /><span>Option 4. Correct. Captures the essence without distortion.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Summary"}, {"number": 24, "sourceId": "168336530509723", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br><span>If we wished to sum up in a word the great transformations which have been <\/span><span>effected<\/span><span> in France by a century of riots and revolutions, we might say that individual tyranny, which was weak and therefore easily overthrown, has been replaced by collective tyrannies, which are very strong and difficult to destroy. To a people avid of equality and habituated to hold its Governments responsible for every event individual tyranny seemed insupportable, while a collective tyranny is readily endured, although generally much more severe. The extension of the tyranny of the State has therefore been <\/span><span>the final result<\/span><span> of all our revolutions, and the common characteristic of all systems of government which we have known in France.<\/span>", "options": ["<span>The common characteristic of all systems of government in France is the extension of tyranny of the State which people readily endure, and the riots and the revolutions of a century could merely destroy the weak individual tyrannies.<\/span>", "<span><\/span>\t<span>A century of revolutions in France for equality and accountability had merely resulted in weak individual tyrannies being replaced by a more severe collective tyranny of the State which people readily endure.<\/span>", "<span><\/span>\t<span>The great transformations in France achieved through a century of riots and revolutions can be reduced to merely replacing weak individual tyrannies with the more severe collective tyranny of the State.<\/span>", "<span><\/span>\t<span>In France, the desire for equality and accountability has led to the replacement of individual tyrannies with strong collective tyrannies, which have ultimately resulted in the expansion of state tyranny.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t\r<br /><span><b>Points:<\/b><\/span>\r<br /><span>·<\/span><span><b>&nbsp;<\/b><\/span>\t<span>A century of riots and revolutions in France for equality and accountability.<\/span>\r<br /><span>·<\/span><span><b>&nbsp;<\/b><\/span>\t<span>They replaced the weak individual tyrannies with a more powerful collective tyranny of the State.<\/span>\r<br /><span>Option 1. Incorrect. The reason for the riots and revolutions is missing.<\/span>\r<br /><span>Option 2. Correct. Captures the essence.<\/span>\r<br /><span>Option 3. Incorrect.&nbsp;<\/span><span>Similar to<\/span><span> 1. The reason is missing.<\/span>\r<br /><span>Option 4. Incorrect. The point about prolonged riots and revolutions is missing.<\/span>\r<br />Hence, [2].", "topic": "Summary"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;
function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
