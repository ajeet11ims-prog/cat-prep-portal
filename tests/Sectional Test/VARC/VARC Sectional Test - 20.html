<script type="application/json" id="test-data">{"testNumber": 20, "simcat": 5, "minutes": 40, "questions": [{"number": 1, "sourceId": "34012", "type": "mcq", "passage": "<p>The foibles of journalism are most noticeable and a threat to journalistic integrity when they coalesce into a cause: so-called 'advocacy' or 'social' journalism. To begin with, there are legitimate questions about whether journalism should even have causes. Does the journalist alone know what's objectively, abstractly good or evil? What deserves supporting or reforming? The moment journalists claim licence to cover events sympathetically or cynically, we confront the problem of what to cover sympathetically or cynically, where to draw such lines and – above all – who gets to draw them. There are very few issues that unite the whole of mankind. Regardless, as Tom Rosenstiel of the Project for Excellence in Journalism told <em>USA Today<\/em>, 'News outlets have found they can create more ... identity by creating franchise brands around issues or around a point of view.'<\/p><p>Worse, for our purposes, the data on which journalists premise their crusades are drawn from the same marginalia discussed above. When Francisco Serrano was discovered to be living in the Minnesota high school he once attended, the media covered the 2005 story as if every American high school had a half-dozen homeless people living in it. The actual episode, though exceedingly rare if not one-of-a-kind, became a window to the nation's social failings.<\/p><p>Food for thought: Every time I fly, I'm amazed that these huge, winged machines get off the ground, stay off the ground, and don't return to ground until they're supposed to. Think about the failure rate of commonplace products: Light bulbs burn out. Fan belts snap. Refrigerators stop refrigerating. But planes don't crash. Actuarially speaking, they simply don't. The entire process of commercial flight and the systems that support it is remarkable. Do you fully understand it? I don't. I'm sure lots of people don't. Still, you won't win a Pulitzer prize for a piece that sheds light on the myriad 'little miracles' that conspire to produce aviation's normalcy, stability and success. You'd be laughed out of today's newsrooms for even proposing such a piece (unless you were doing it as the kind of feel-good feature that editors like to give audiences as gifts for the holidays). Have a flight go down, however – one flight, one time – and have a reporter find some overworked ATC operator or other aberration that may have caused the disaster, and <em>voila<\/em> <em>!<\/em> You're in Pulitzer territory for writing about something that – essentially – never happens.<\/p><p>Just as journalists who run out of news may create it, journalists who run out of real causes may invent them. It's not hard to do. All you need is a fact or two, which you then 'contextualize' with more so-called expert opinion. December 10, 2004 was a banner night for exposing those well-known dens of iniquity that masquerade as Amish settlements. Stories about rape and incest among the Amish appeared on both <em>Dateline<\/em> and <em>20/20<\/em>. The <em>Dateline<\/em> story even made reference to the principal character in the story that aired an hour later on <em>20/20 – <\/em>which gives you some idea how common the abuse may be, if seasoned journalists must choreograph their exposes around the same incident. That brings us to Elizabeth Vargas and her question for <em>20/20<\/em>'s expert on Amish affairs: Just how widespread is this abuse? Amid stock footage of adorable children strolling down a dusky road in suspenders and bonnets, the expert tells America that it's 'not a gross exception'.<\/p><p>What kind of reporting is that? Does it indicate that 1 percent of Amish children are abused? Ten percent? Forty percent? Who knows?<\/p><p>This is what passes for investigative journalism nowadays.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong> The passage given below is followed by a set of questions. Choose the correct answer to each question.<\/strong><\/p><\/div><p>What, according to the passage, is one of the biggest drawbacks of crusades undertaken by journalists?<\/p>", "options": ["<p>These crusades are not well-researched or well-defined.<\/p>", "<p>The journalists inevitably wind up supporting the dominant point of view.<\/p>", "<p>Journalistic crusades tend to be highly objective and unfeeling in nature.<\/p>", "<p>Journalists may not be the ideal people to decide which causes need to be advocated.<\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p>While the author bemoans the lack of research regarding journalistic crusades, he does not say that they are not well-defined. [2] is a vague statement which doesn't even define what is the 'dominant' view point. Also, the author doesn't even allude to issues of 'dominant' perspectives. [3] contradicts the very point put across in the 1st paragraph, which the author questions – 'Does the journalist alone know what's objectively, abstractly good or evil?'. Only [4] is a major drawback, as can be inferred from paragraph 1. Hence, [4].<\/p>", "topic": "Specific Detail"}, {"number": 2, "sourceId": "34013", "type": "mcq", "passage": "<p>The foibles of journalism are most noticeable and a threat to journalistic integrity when they coalesce into a cause: so-called 'advocacy' or 'social' journalism. To begin with, there are legitimate questions about whether journalism should even have causes. Does the journalist alone know what's objectively, abstractly good or evil? What deserves supporting or reforming? The moment journalists claim licence to cover events sympathetically or cynically, we confront the problem of what to cover sympathetically or cynically, where to draw such lines and – above all – who gets to draw them. There are very few issues that unite the whole of mankind. Regardless, as Tom Rosenstiel of the Project for Excellence in Journalism told <em>USA Today<\/em>, 'News outlets have found they can create more ... identity by creating franchise brands around issues or around a point of view.'<\/p><p>Worse, for our purposes, the data on which journalists premise their crusades are drawn from the same marginalia discussed above. When Francisco Serrano was discovered to be living in the Minnesota high school he once attended, the media covered the 2005 story as if every American high school had a half-dozen homeless people living in it. The actual episode, though exceedingly rare if not one-of-a-kind, became a window to the nation's social failings.<\/p><p>Food for thought: Every time I fly, I'm amazed that these huge, winged machines get off the ground, stay off the ground, and don't return to ground until they're supposed to. Think about the failure rate of commonplace products: Light bulbs burn out. Fan belts snap. Refrigerators stop refrigerating. But planes don't crash. Actuarially speaking, they simply don't. The entire process of commercial flight and the systems that support it is remarkable. Do you fully understand it? I don't. I'm sure lots of people don't. Still, you won't win a Pulitzer prize for a piece that sheds light on the myriad 'little miracles' that conspire to produce aviation's normalcy, stability and success. You'd be laughed out of today's newsrooms for even proposing such a piece (unless you were doing it as the kind of feel-good feature that editors like to give audiences as gifts for the holidays). Have a flight go down, however – one flight, one time – and have a reporter find some overworked ATC operator or other aberration that may have caused the disaster, and <em>voila<\/em> <em>!<\/em> You're in Pulitzer territory for writing about something that – essentially – never happens.<\/p><p>Just as journalists who run out of news may create it, journalists who run out of real causes may invent them. It's not hard to do. All you need is a fact or two, which you then 'contextualize' with more so-called expert opinion. December 10, 2004 was a banner night for exposing those well-known dens of iniquity that masquerade as Amish settlements. Stories about rape and incest among the Amish appeared on both <em>Dateline<\/em> and <em>20/20<\/em>. The <em>Dateline<\/em> story even made reference to the principal character in the story that aired an hour later on <em>20/20 – <\/em>which gives you some idea how common the abuse may be, if seasoned journalists must choreograph their exposes around the same incident. That brings us to Elizabeth Vargas and her question for <em>20/20<\/em>'s expert on Amish affairs: Just how widespread is this abuse? Amid stock footage of adorable children strolling down a dusky road in suspenders and bonnets, the expert tells America that it's 'not a gross exception'.<\/p><p>What kind of reporting is that? Does it indicate that 1 percent of Amish children are abused? Ten percent? Forty percent? Who knows?<\/p><p>This is what passes for investigative journalism nowadays.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong> The passage given below is followed by a set of questions. Choose the correct answer to each question.<\/strong><\/p><\/div><p>In the passage, what is the author's main attitude?<\/p>", "options": ["<p>He is worried about the consequences of the direction taken by contemporary journalism.<\/p>", "<p>He is saddened by the decline in journalistic standards of the 20th century.<\/p>", "<p>He is critical of the advocacy journalism of today's era.<\/p>", "<p>He is disgusted with the obsession for negative news in media today.<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p>The passage concentrates on critically dissecting the whole lot of the so-called investigative journalists inspired by 'social journalism' or 'advocacy'. So, option [3] is correct. Option [4] is just one of the concerns expressed in the passage. [2] is false because the only specifically dated examples given in the passage are from the 21st, not the 20th century. The 'consequences of the direction taken by contemporary journalism' are not mentioned anywhere in the passage, so [1] is wrong. Hence, [3].<\/p>", "topic": "Style, Tone & Attitude"}, {"number": 3, "sourceId": "34014", "type": "mcq", "passage": "<p>The foibles of journalism are most noticeable and a threat to journalistic integrity when they coalesce into a cause: so-called 'advocacy' or 'social' journalism. To begin with, there are legitimate questions about whether journalism should even have causes. Does the journalist alone know what's objectively, abstractly good or evil? What deserves supporting or reforming? The moment journalists claim licence to cover events sympathetically or cynically, we confront the problem of what to cover sympathetically or cynically, where to draw such lines and – above all – who gets to draw them. There are very few issues that unite the whole of mankind. Regardless, as Tom Rosenstiel of the Project for Excellence in Journalism told <em>USA Today<\/em>, 'News outlets have found they can create more ... identity by creating franchise brands around issues or around a point of view.'<\/p><p>Worse, for our purposes, the data on which journalists premise their crusades are drawn from the same marginalia discussed above. When Francisco Serrano was discovered to be living in the Minnesota high school he once attended, the media covered the 2005 story as if every American high school had a half-dozen homeless people living in it. The actual episode, though exceedingly rare if not one-of-a-kind, became a window to the nation's social failings.<\/p><p>Food for thought: Every time I fly, I'm amazed that these huge, winged machines get off the ground, stay off the ground, and don't return to ground until they're supposed to. Think about the failure rate of commonplace products: Light bulbs burn out. Fan belts snap. Refrigerators stop refrigerating. But planes don't crash. Actuarially speaking, they simply don't. The entire process of commercial flight and the systems that support it is remarkable. Do you fully understand it? I don't. I'm sure lots of people don't. Still, you won't win a Pulitzer prize for a piece that sheds light on the myriad 'little miracles' that conspire to produce aviation's normalcy, stability and success. You'd be laughed out of today's newsrooms for even proposing such a piece (unless you were doing it as the kind of feel-good feature that editors like to give audiences as gifts for the holidays). Have a flight go down, however – one flight, one time – and have a reporter find some overworked ATC operator or other aberration that may have caused the disaster, and <em>voila<\/em> <em>!<\/em> You're in Pulitzer territory for writing about something that – essentially – never happens.<\/p><p>Just as journalists who run out of news may create it, journalists who run out of real causes may invent them. It's not hard to do. All you need is a fact or two, which you then 'contextualize' with more so-called expert opinion. December 10, 2004 was a banner night for exposing those well-known dens of iniquity that masquerade as Amish settlements. Stories about rape and incest among the Amish appeared on both <em>Dateline<\/em> and <em>20/20<\/em>. The <em>Dateline<\/em> story even made reference to the principal character in the story that aired an hour later on <em>20/20 – <\/em>which gives you some idea how common the abuse may be, if seasoned journalists must choreograph their exposes around the same incident. That brings us to Elizabeth Vargas and her question for <em>20/20<\/em>'s expert on Amish affairs: Just how widespread is this abuse? Amid stock footage of adorable children strolling down a dusky road in suspenders and bonnets, the expert tells America that it's 'not a gross exception'.<\/p><p>What kind of reporting is that? Does it indicate that 1 percent of Amish children are abused? Ten percent? Forty percent? Who knows?<\/p><p>This is what passes for investigative journalism nowadays.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong> The passage given below is followed by a set of questions. Choose the correct answer to each question.<\/strong><\/p><\/div><p> What point does the author want to drive home through the quoted examples of the Fransisco Serrano case and the Amish child abuse issue?<\/p>", "options": ["<p>Journalists see only one side of the issue and are quick to point fingers.<\/p>", "<p>One-off events are blown out of proportion to their actual relevance.<\/p>", "<p>They successfully create awareness among masses.<\/p>", "<p>Journalists use vague quantities instead of precise figures, which obscure the exact extent of the problem.<\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p>Option [3] contradicts the main idea of the passage, which is that journalists create issues when none exist. [1] is too general and does not relate specifically to either of these issues. Refer to paragraphs 4 and 5 – [4] is a problem only with the latter issue, not the former. Only [2] relates to both – in case of the Francisco Serrano issue, it is stated in paragraph 2. In the Amish child abuse case, it can be inferred from the author's observation that both the expose of the case revolved around the same character. Hence, [2].<\/p>", "topic": "Application Question"}, {"number": 4, "sourceId": "34015", "type": "mcq", "passage": "<p>Foucault attempted to analyse the 'discursive practices' or serious speech acts that lay claim to revealing knowledge. Rather than analyse these discursive practices in terms of their truth, he analyses them in terms of their history or genesis. He claimed that he was attempting to do an 'archaeology' of knowledge, to show the history of truthful claims.<\/p><p>In his latter work, he borrowed from Nietzsche, the 'genealogical' approach and from Marx, his analyses of ideology. Foucault sought to show how the development of knowledge was intertwined with the mechanisms of (political) power. Unlike Marx, Foucault had no underlying belief in a deep underlying truth or structure: there was no objective viewpoint from which one could analyse a discourse or a society.<\/p><p>Foucault focused on the way that knowledge and the increase of the power of the state over the individual has developed in the modern era. In his 'History of Sexuality' he argued that the rise of medical and psychiatric science has created a discourse of sexuality as deep, instinctual and mysterious. This discourse became accepted as the dominant explanation, and its assumptions began to seep into the discourse of the everyday life. In this way, the human subjects' experience of their own sexuality is shaped and controlled by the discourses that purport to explain it. Foucault does not offer any all-embracing theory of human nature. He was critical of 'meta-theory': beliefs that claimed to give an exclusive objective explanation of reality. For Foucault, there is no ultimate answer waiting to be uncovered. The 'discursive practices' of knowledge are not independent of the objects that are studied and must be understood in their social and political context.<\/p><p>For Derrida, language or 'texts' are not a natural reflection of the world. Text structures our interpretation of the world. Following Heidegger, Derrida thinks that language shapes us: texts create a clearing that we understand as reality. Derrida sees the history of Western thought as based on opposition: good vs. evil, spiritual vs. material, man vs. woman, speech vs. writing. These oppositions are defined hierarchically: the second term is seen as a corruption of the first, the terms are not equal opposites.<\/p><p>Derrida thought that all text contained a legacy of these assumptions, and as a result of this, these texts could be re-interpreted with an awareness of the hierarchies implicit in language. Derrida does not think that we can reach an end point of interpretation, a truth. For Derrida, all texts exhibit 'differance': they allow multiple interpretations. Meaning is diffuse, not settled. Textuality always gives us a surplus of possibilities, yet we cannot stand outside of textuality in an attempt to find objectivity.<\/p><p>One consequence of deconstruction is that certainty in textual analyses becomes impossible. There may be competing interpretations, but there is no uninterpreted way one could assess the validity of these competing interpretations. Rather than basing our philosophical understanding on undeniable truths, the deconstructionist turns the settled bedrock of rationalism into the shifting sands of a multiplicity of interpretations.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong> The passage given below is followed by a set of questions. Choose the correct answer to each question.<\/strong><\/p><\/div><p> According to Derrida, all texts exhibit 'differance' which implies:<\/p>", "options": ["<p>a dissemination of meaning.<\/p>", "<p>the uninterpretability of textual meaning.<\/p>", "<p>many different meanings.<\/p>", "<p>diffusion of unsettled meanings.<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p>Refer to paragraph 5. According to Derrida, all texts exhibit 'differance': they allow multiple interpretations. It is not only a distribution of meaning as option [1] states. Option [2] is incorrect, as a text can be interpreted. Option [4] does not make sense. Hence, [3].<\/p>", "topic": "Contextual Vocabulary"}, {"number": 5, "sourceId": "34016", "type": "mcq", "passage": "<p>Foucault attempted to analyse the 'discursive practices' or serious speech acts that lay claim to revealing knowledge. Rather than analyse these discursive practices in terms of their truth, he analyses them in terms of their history or genesis. He claimed that he was attempting to do an 'archaeology' of knowledge, to show the history of truthful claims.<\/p><p>In his latter work, he borrowed from Nietzsche, the 'genealogical' approach and from Marx, his analyses of ideology. Foucault sought to show how the development of knowledge was intertwined with the mechanisms of (political) power. Unlike Marx, Foucault had no underlying belief in a deep underlying truth or structure: there was no objective viewpoint from which one could analyse a discourse or a society.<\/p><p>Foucault focused on the way that knowledge and the increase of the power of the state over the individual has developed in the modern era. In his 'History of Sexuality' he argued that the rise of medical and psychiatric science has created a discourse of sexuality as deep, instinctual and mysterious. This discourse became accepted as the dominant explanation, and its assumptions began to seep into the discourse of the everyday life. In this way, the human subjects' experience of their own sexuality is shaped and controlled by the discourses that purport to explain it. Foucault does not offer any all-embracing theory of human nature. He was critical of 'meta-theory': beliefs that claimed to give an exclusive objective explanation of reality. For Foucault, there is no ultimate answer waiting to be uncovered. The 'discursive practices' of knowledge are not independent of the objects that are studied and must be understood in their social and political context.<\/p><p>For Derrida, language or 'texts' are not a natural reflection of the world. Text structures our interpretation of the world. Following Heidegger, Derrida thinks that language shapes us: texts create a clearing that we understand as reality. Derrida sees the history of Western thought as based on opposition: good vs. evil, spiritual vs. material, man vs. woman, speech vs. writing. These oppositions are defined hierarchically: the second term is seen as a corruption of the first, the terms are not equal opposites.<\/p><p>Derrida thought that all text contained a legacy of these assumptions, and as a result of this, these texts could be re-interpreted with an awareness of the hierarchies implicit in language. Derrida does not think that we can reach an end point of interpretation, a truth. For Derrida, all texts exhibit 'differance': they allow multiple interpretations. Meaning is diffuse, not settled. Textuality always gives us a surplus of possibilities, yet we cannot stand outside of textuality in an attempt to find objectivity.<\/p><p>One consequence of deconstruction is that certainty in textual analyses becomes impossible. There may be competing interpretations, but there is no uninterpreted way one could assess the validity of these competing interpretations. Rather than basing our philosophical understanding on undeniable truths, the deconstructionist turns the settled bedrock of rationalism into the shifting sands of a multiplicity of interpretations.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>The passage given below is followed by a set of questions. Choose the correct answer to each question.<\/strong><\/p><\/div><p> According to the passage, which of the following is NOT the outcome of the deconstructionist position on language?<\/p>", "options": ["<p>It is not possible to tell which of the interpretations of a text is the correct one.<\/p>", "<p>Contradictory meanings are not impossible in a text.<\/p>", "<p>The hierarchical oppositions created by Western thought can be neutralized in a way that lets us see the underlying truth.<\/p>", "<p>There is nothing called an 'undeniable truth', as everything is open to multiple interpretations.<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p>Refer to the last paragraph – 'there is no uninterpreted way one could assess the validity of these competing interpretations' – this implies that there is no 'correct' way to interpret a text. Option [2] is possible as multiple interpretations can give rise to contradictions. Option [4] can be understood from the last paragraph of the passage. So [1], [2] and [4] are all outcomes of the deconstructionist position on language. However, [3] is not – refer to paragraph 5, which states that there is no 'end point of interpretation', no 'truth'. Hence, [3].<\/p>", "topic": "Specific Detail"}, {"number": 6, "sourceId": "34017", "type": "mcq", "passage": "<p>Foucault attempted to analyse the 'discursive practices' or serious speech acts that lay claim to revealing knowledge. Rather than analyse these discursive practices in terms of their truth, he analyses them in terms of their history or genesis. He claimed that he was attempting to do an 'archaeology' of knowledge, to show the history of truthful claims.<\/p><p>In his latter work, he borrowed from Nietzsche, the 'genealogical' approach and from Marx, his analyses of ideology. Foucault sought to show how the development of knowledge was intertwined with the mechanisms of (political) power. Unlike Marx, Foucault had no underlying belief in a deep underlying truth or structure: there was no objective viewpoint from which one could analyse a discourse or a society.<\/p><p>Foucault focused on the way that knowledge and the increase of the power of the state over the individual has developed in the modern era. In his 'History of Sexuality' he argued that the rise of medical and psychiatric science has created a discourse of sexuality as deep, instinctual and mysterious. This discourse became accepted as the dominant explanation, and its assumptions began to seep into the discourse of the everyday life. In this way, the human subjects' experience of their own sexuality is shaped and controlled by the discourses that purport to explain it. Foucault does not offer any all-embracing theory of human nature. He was critical of 'meta-theory': beliefs that claimed to give an exclusive objective explanation of reality. For Foucault, there is no ultimate answer waiting to be uncovered. The 'discursive practices' of knowledge are not independent of the objects that are studied and must be understood in their social and political context.<\/p><p>For Derrida, language or 'texts' are not a natural reflection of the world. Text structures our interpretation of the world. Following Heidegger, Derrida thinks that language shapes us: texts create a clearing that we understand as reality. Derrida sees the history of Western thought as based on opposition: good vs. evil, spiritual vs. material, man vs. woman, speech vs. writing. These oppositions are defined hierarchically: the second term is seen as a corruption of the first, the terms are not equal opposites.<\/p><p>Derrida thought that all text contained a legacy of these assumptions, and as a result of this, these texts could be re-interpreted with an awareness of the hierarchies implicit in language. Derrida does not think that we can reach an end point of interpretation, a truth. For Derrida, all texts exhibit 'differance': they allow multiple interpretations. Meaning is diffuse, not settled. Textuality always gives us a surplus of possibilities, yet we cannot stand outside of textuality in an attempt to find objectivity.<\/p><p>One consequence of deconstruction is that certainty in textual analyses becomes impossible. There may be competing interpretations, but there is no uninterpreted way one could assess the validity of these competing interpretations. Rather than basing our philosophical understanding on undeniable truths, the deconstructionist turns the settled bedrock of rationalism into the shifting sands of a multiplicity of interpretations.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>The passage given below is followed by a set of questions. Choose the correct answer to each question.<\/strong><\/p><\/div><p>Which of the following does NOT illustrate Derrida's idea of a binary opposition of terms, in which the second term is seen as a corruption of the first?<\/p>", "options": ["<p>Aditya's father agreed that Aditya might be better off following his dream of a career in modelling rather than following the family tradition and becoming a monk.<\/p>", "<p>The college authorities decided that the prize money for the elocution competition was Rs.1500 and the prize money for the essay competition was just Rs. 500.<\/p>", "<p>Many people expected the outcome of the local elections to be predetermined, as only one of the two final candidates was a man.<\/p>", "<p>A local newspaper reported that once again, the Sports Authorities had marked a bigger budget for the men's hockey team as opposed to the women's hockey team.<\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p>Refer to paragraph 4 where Derrida says that the history of Western thought is based on binary opposition where the first term is considered more important than the second. Option [2] illustrates the speech/writing opposition, where speech (elocution) is given more importance than writing (essay). In options [3] and [4], the man/woman divide is illustrated where the man is given more importance than the woman. However, in option [1], in spiritual/material opposition, the material (a career in modelling) is given more importance over spiritual (becoming a monk). Thus, option [1] does not follow Derrida's theory. Hence, [1].<\/p>", "topic": "Application Question"}, {"number": 7, "sourceId": "34018", "type": "mcq", "passage": "<p>Foucault attempted to analyse the 'discursive practices' or serious speech acts that lay claim to revealing knowledge. Rather than analyse these discursive practices in terms of their truth, he analyses them in terms of their history or genesis. He claimed that he was attempting to do an 'archaeology' of knowledge, to show the history of truthful claims.<\/p><p>In his latter work, he borrowed from Nietzsche, the 'genealogical' approach and from Marx, his analyses of ideology. Foucault sought to show how the development of knowledge was intertwined with the mechanisms of (political) power. Unlike Marx, Foucault had no underlying belief in a deep underlying truth or structure: there was no objective viewpoint from which one could analyse a discourse or a society.<\/p><p>Foucault focused on the way that knowledge and the increase of the power of the state over the individual has developed in the modern era. In his 'History of Sexuality' he argued that the rise of medical and psychiatric science has created a discourse of sexuality as deep, instinctual and mysterious. This discourse became accepted as the dominant explanation, and its assumptions began to seep into the discourse of the everyday life. In this way, the human subjects' experience of their own sexuality is shaped and controlled by the discourses that purport to explain it. Foucault does not offer any all-embracing theory of human nature. He was critical of 'meta-theory': beliefs that claimed to give an exclusive objective explanation of reality. For Foucault, there is no ultimate answer waiting to be uncovered. The 'discursive practices' of knowledge are not independent of the objects that are studied and must be understood in their social and political context.<\/p><p>For Derrida, language or 'texts' are not a natural reflection of the world. Text structures our interpretation of the world. Following Heidegger, Derrida thinks that language shapes us: texts create a clearing that we understand as reality. Derrida sees the history of Western thought as based on opposition: good vs. evil, spiritual vs. material, man vs. woman, speech vs. writing. These oppositions are defined hierarchically: the second term is seen as a corruption of the first, the terms are not equal opposites.<\/p><p>Derrida thought that all text contained a legacy of these assumptions, and as a result of this, these texts could be re-interpreted with an awareness of the hierarchies implicit in language. Derrida does not think that we can reach an end point of interpretation, a truth. For Derrida, all texts exhibit 'differance': they allow multiple interpretations. Meaning is diffuse, not settled. Textuality always gives us a surplus of possibilities, yet we cannot stand outside of textuality in an attempt to find objectivity.<\/p><p>One consequence of deconstruction is that certainty in textual analyses becomes impossible. There may be competing interpretations, but there is no uninterpreted way one could assess the validity of these competing interpretations. Rather than basing our philosophical understanding on undeniable truths, the deconstructionist turns the settled bedrock of rationalism into the shifting sands of a multiplicity of interpretations.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>The passage given below is followed by a set of questions. Choose the correct answer to each question.<\/strong><\/p><\/div><p> Which of the following is NOT implied in the passage?<\/p>", "options": ["<p>A text's meaning cannot be found beyond its boundaries.<\/p>", "<p>Reality is not just what 'is', but a construct.<\/p>", "<p>The meaning of a text is unclear.<\/p>", "<p>Knowledge can be twisted according to wishes of the dominating power.<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p>Refer to paragraph 5 – 'Textuality always gives us ... objectivity'. This implies that meaning is embedded in the text and cannot be found outside it. Thus, option [1] can be negated. According to paragraph 3, if discourses control human knowledge – 'In this way ... purport to explain it' – then reality is not just what exists but can be made/constructed. It also implies that the dominating power has a hold over human knowledge and can twist it. Thus, options [2] and [4] are implied. However, option [3] is not implied because although there are multiple interpretations of a text, it is not true that the meaning is unclear. Hence, [3].<\/p>", "topic": "Application Question"}, {"number": 8, "sourceId": "31994", "type": "mcq", "passage": "<p> When Adidas-Salomon reported its second-quarter results last week, the German maker of sports shoes and apparel exceeded most analysts' predictions. Sales increased by 10% in the quarter to $1.25 billion, while profits were up by 22%. So why was Herbert Hainer, who took over as CEO of the Bavarian company in March, not entirely a happy camper? The answer lies in the U.S. market, the world's largest for sporting goods, where sales fell about 13% in dollar terms. \"Even in the tough environment in the U.S., there are winners and losers,\" says Hainer, \"and we want to be a winner.\"<\/p><p>In the U.S. race, the clear No.1 is Nike, with a 37% market share. To break out of the pack (Adidas, Reebok and New Balance each have a 11% share), Hainer has installed Ross McMullin, a former executive at razor maker Gillette, as head of U.S. operations. Adidas has a raft of innovative new shoes coming out this autumn. It is also focusing sales on more upmarket stores than in previous years, when it depended on mass-market, high-volume sellers. \"The North American market is slowly beginning to turn for us,\" Hainer says. He predicts the company's U.S. market share will jump to 20% in three years.<\/p><p>It was just three years ago that Adidas limped along with only a 5% share. \"Adidas was not seen as cool,\" concedes Hainer, \"design was not up to speed and not up to the competition.\" One painful result: the company's stock price, which reached $143 in 1997, plummeted to $47 last year. The stock has since bounced back to $66, near its 52-week high, but success is never guaranteed when it depends on fickle urban American teenagers to set the trends.<\/p><p>Adidas remains strongest in Europe, where it gets more than half its annual sales. It is a sponsor of the soccer World Cup, is endorsed by Swiss Tennis star Martina Hingis and has a long-term relationship with its customers in other sports like track and field. While sales in Europe were up by 8% in the first half of this year, the strong dollar was a problem – the company buys its products in Asia for dollars, but gets back weaker euros in sales.<\/p><p>The company is counting on new products to sustain a 3-5% annual growth rate. In November, Adidas will introduce a new basketball shoe named after Los Angeles Lakers' star Kobe Bryant. It is also reissuing some successful designs from the past in its \"Originals\" collection. In New York City, there is so much buzz about the Adidas Italia that Barney's, the trendy Manhattan emporium, already has a waiting list. Next year, two entirely new models are set to debut: the Climacool and the a3 (pronounced A-cubed), embodying the first technical innovations from the company in four years. Adidas claims Climacool can reduce foot sweat by 20%, while the a3 is designed to offer runners not only a smooth ride but also an extra push.<\/p><p>Hainer is predicting Climacool sales at 500,000 the first year, with 1 million in 3 years. With that kind of growth for top-of-the-market, $125 shoes, Hainer may finally become a happy man. With happy feet.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong> The passage given below is followed by a set of questions. Choose the best answer to each question.<\/strong><\/p><\/div><p> According to Hainer the turnaround in sales will be largely due to the fact that:<\/p>", "options": ["<p>the U.S. is bound to come out of recession this year.<\/p>", "<p>sales will refocus more on an up-market clientele this year.<\/p>", "<p>the company is about to launch a whole range of innovative products.<\/p>", "<p>Adidas has shifted its production houses to low-cost countries in Asia.<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p>Paragraph 2 states that Hainer feels that the turnaround in sales will be for two reasons – Adidas's focus on an up-market clientele and the company's decision to launch new, innovative products. We cannot tell whether it used to focus on an up-market clientele earlier, so [2] is wrong. The change in the production houses may be a reason for Adidas's changing fortunes, but this hasn't been mentioned by Hainer. Hence, [3].<\/p>", "topic": "Specific Detail"}, {"number": 9, "sourceId": "31995", "type": "mcq", "passage": "<p> When Adidas-Salomon reported its second-quarter results last week, the German maker of sports shoes and apparel exceeded most analysts' predictions. Sales increased by 10% in the quarter to $1.25 billion, while profits were up by 22%. So why was Herbert Hainer, who took over as CEO of the Bavarian company in March, not entirely a happy camper? The answer lies in the U.S. market, the world's largest for sporting goods, where sales fell about 13% in dollar terms. \"Even in the tough environment in the U.S., there are winners and losers,\" says Hainer, \"and we want to be a winner.\"<\/p><p>In the U.S. race, the clear No.1 is Nike, with a 37% market share. To break out of the pack (Adidas, Reebok and New Balance each have a 11% share), Hainer has installed Ross McMullin, a former executive at razor maker Gillette, as head of U.S. operations. Adidas has a raft of innovative new shoes coming out this autumn. It is also focusing sales on more upmarket stores than in previous years, when it depended on mass-market, high-volume sellers. \"The North American market is slowly beginning to turn for us,\" Hainer says. He predicts the company's U.S. market share will jump to 20% in three years.<\/p><p>It was just three years ago that Adidas limped along with only a 5% share. \"Adidas was not seen as cool,\" concedes Hainer, \"design was not up to speed and not up to the competition.\" One painful result: the company's stock price, which reached $143 in 1997, plummeted to $47 last year. The stock has since bounced back to $66, near its 52-week high, but success is ne e American teenage market.<\/p>\n<p> III. Annual growth rates can be sustained only if Adidas introduces a new range of shoes.<\/p>", "options": ["<p>All of the above<\/p>", "<p>II and III<\/p>", "<p>Only II<\/p>", "<p>Only I<\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p>II and III are too categorical and exclusive to be true, whereas I can be inferred from the last sentence of paragraph 4: \"While sales in Europe were up by 8% in the first half of this year, the strong dollar was a problem – the company buys its products in Asia for dollars, but gets back weaker euros in sales.\" Hence, [4].<\/p>", "topic": "Application Question"}, {"number": 10, "sourceId": "31996", "type": "mcq", "passage": "<p> When Adidas-Salomon reported its second-quarter results last week, the German maker of sports shoes and apparel exceeded most analysts' predictions. Sales increased by 10% in the quarter to $1.25 billion, while profits were up by 22%. So why was Herbert Hainer, who took over as CEO of the Bavarian company in March, not entirely a happy camper? The answer lies in the U.S. market, the world's largest for sporting goods, where sales fell about 13% in dollar terms. \"Even in the tough environment in the U.S., there are winners and losers,\" says Hainer, \"and we want to be a winner.\"<\/p><p>In the U.S. race, the clear No.1 is Nike, with a 37% market share. To break out of the pack (Adidas, Reebok and New Balance each have a 11% share), Hainer has installed Ross McMullin, a former executive at razor maker Gillette, as head of U.S. operations. Adidas has a raft of innovative new shoes coming out this autumn. It is also focusing sales on more upmarket stores than in previous years, when it depended on mass-market, high-volume sellers. \"The North American market is slowly beginning to turn for us,\" Hainer says. He predicts the company's U.S. market share will jump to 20% in three years.<\/p><p>It was just three years ago that Adidas limped along with only a 5% share. \"Adidas was not seen as cool,\" concedes Hainer, \"design was not up to speed and not up to the competition.\" One painful result: the company's stock price, which reached $143 in 1997, plummeted to $47 last year. The stock has since bounced back to $66, near its 52-week high, but success is never guaranteed when it depends on fickle urban American teenagers to set the trends.<\/p><p>Adidas remains strongest in Europe, where it gets more than half its annual sales. It is a sponsor of the soccer World Cup, is endorsed by Swiss Tennis star Martina Hingis and has a long-term relationship with its customers in other sports like track and field. While sales in Europe were up by 8% in the first half of this year, the strong dollar was a problem – the company buys its products in Asia for dollars, but gets back weaker euros in sales.<\/p><p>The company is counting on new products to sustain a 3-5% annual growth rate. In November, Adidas will introduce a new basketball shoe named after Los Angeles Lakers' star Kobe Bryant. It is also reissuing some successful designs from the past in its \"Originals\" collection. In New York City, there is so much buzz about the Adidas Italia that Barney's, the trendy Manhattan emporium, already has a waiting list. Next year, two entirely new models are set to debut: the Climacool and the a3 (pronounced A-cubed), embodying the first technical innovations from the company in four years. Adidas claims Climacool can reduce foot sweat by 20%, while the a3 is designed to offer runners not only a smooth ride but also an extra push.<\/p><p>Hainer is predicting Climacool sales at 500,000 the first year, with 1 million in 3 years. With that kind of growth for top-of-the-market, $125 shoes, Hainer may finally become a happy man. With happy feet.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong> The passage given below is followed by a set of questions. Choose the best answer to each question.<\/strong><\/p><\/div><p> A suitable title for this passage would be:<\/p>", "options": ["<p>Taking on the American Market: Adidas Inches Past Nike<\/p>", "<p>Hot on Nike's Heels: Adidas<\/p>", "<p>Adidas Loses Ground to Nike<\/p>", "<p>Adidas says: \"We Will Just Do It!\"<\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p>The author's main point is that, spurred on by a strong comeback, Adidas is determined to close in on the industry leader Nike. It has not overtaken Nike yet, so [1] is wrong. [3] is too negative, while [4] is too vague. Hence, [2].<\/p>", "topic": "Title"}, {"number": 11, "sourceId": "31997", "type": "mcq", "passage": "<p> When Adidas-Salomon reported its second-quarter results last week, the German maker of sports shoes and apparel exceeded most analysts' predictions. Sales increased by 10% in the quarter to $1.25 billion, while profits were up by 22%. So why was Herbert Hainer, who took over as CEO of the Bavarian company in March, not entirely a happy camper? The answer lies in the U.S. market, the world's largest for sporting goods, where sales fell about 13% in dollar terms. \"Even in the tough environment in the U.S., there are winners and losers,\" says Hainer, \"and we want to be a winner.\"<\/p><p>In the U.S. race, the clear No.1 is Nike, with a 37% market share. To break out of the pack (Adidas, Reebok and New Balance each have a 11% share), Hainer has installed Ross McMullin, a former executive at razor maker Gillette, as head of U.S. operations. Adidas has a raft of innovative new shoes coming out this autumn. It is also focusing sales on more upmarket stores than in previous years, when it depended on mass-market, high-volume sellers. \"The North American market is slowly beginning to turn for us,\" Hainer says. He predicts the company's U.S. market share will jump to 20% in three years.<\/p><p>It was just three years ago that Adidas limped along with only a 5% share. \"Adidas was not seen as cool,\" concedes Hainer, \"design was not up to speed and not up to the competition.\" One painful result: the company's stock price, which reached $143 in 1997, plummeted to $47 last year. The stock has since bounced back to $66, near its 52-week high, but success is never guaranteed when it depends on fickle urban American teenagers to set the trends.<\/p><p>Adidas remains strongest in Europe, where it gets more than half its annual sales. It is a sponsor of the soccer World Cup, is endorsed by Swiss Tennis star Martina Hingis and has a long-term relationship with its customers in other sports like track and field. While sales in Europe were up by 8% in the first half of this year, the strong dollar was a problem – the company buys its products in Asia for dollars, but gets back weaker euros in sales.<\/p><p>The company is counting on new products to sustain a 3-5% annual growth rate. In November, Adidas will introduce a new basketball shoe named after Los Angeles Lakers' star Kobe Bryant. It is also reissuing some successful designs from the past in its \"Originals\" collection. In New York City, there is so much buzz about the Adidas Italia that Barney's, the trendy Manhattan emporium, already has a waiting list. Next year, two entirely new models are set to debut: the Climacool and the a3 (pronounced A-cubed), embodying the first technical innovations from the company in four years. Adidas claims Climacool can reduce foot sweat by 20%, while the a3 is designed to offer runners not only a smooth ride but also an extra push.<\/p><p>Hainer is predicting Climacool sales at 500,000 the first year, with 1 million in 3 years. With that kind of growth for top-of-the-market, $125 shoes, Hainer may finally become a happy man. With happy feet.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong> The passage given below is followed by a set of questions. Choose the best answer to each question.<\/strong><\/p><\/div><p> The author of this passage could be:<\/p>", "options": ["<p>an employee of Adidas writing the company's annual report.<\/p>", "<p>a stock market analyst.<\/p>", "<p>a journalist writing for a financial magazine.<\/p>", "<p>a fashion writer discussing Adidas's new range of shoes.<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p>The passage focusses on the finances of Adidas, not on its shoe designs, so [4] is unlikely. The passage is clearly written by an objective outsider, not an Adidas employee. Between [2] and [3], [3] is a better choice as the writing is in the form of a news report. Hence, [3].<\/p>", "topic": "Application Question"}, {"number": 12, "sourceId": "67670", "type": "mcq", "passage": "<p>The only society that can be thought of as purely secular is that of the Roman Empire, unless so far as Hellenistic Greeks had already come to the same principle. In other societies there either was not a subjective or self-consciousness which was to itself the unity of its technical, practical, and theoretical relations to nature or this human independence was itself taken into a religious attitude. The rational individuality or personality, which was the principle of this society, is a radical separation of humans from the passivity and dependence of an immediate unity with nature. It carries to its extreme consequence the freedom of Hebraic and Hellenic society, which regard nature as derivative, dependent and ordered by divine subjectivity. This freedom and unity of ends is seen as belonging also to human activity. The harsh discipline of the Republic, the subordination in the words of a Roman of all other vices to the lust for state power, provoked in reaction an individuality which related to itself the whole extent of private interests – the equivalent in those conditions of a liberal reaction to puritanical suppression.<\/p>\n\n<p>The old Roman religion which saw as divine what could give effect to particular human ends and especially the advancement of the Republic, can remain only so far as this society is not fully conscious of its principle. For this principle may be looked at positively in the manner of the Stoics as giving a universal end to which all particular ends can be related. In this case the old gods can be represented as powers within a universal teleology. But equally it has the negative or Epicurean form in which individuals have set themselves apart from all natural or limited involvements. For that view, if there be gods, they cannot be less than such self-related individuals and are therefore not the gods of popular religion who promote human desires, ambitions or collective love of power.<\/p>\n\n<p>The complete form of the principle is however the scepticism for which there stands on the one side a plurality of endlessly open and incomplete relations to the world, on the other a detached rational subjectivity without content. Between the two no logical bond can be found. The world of the ancient sceptic is in general the same as that of modern empiricism, so far as this has purged itself of extraneous elements with equal vigour. But the modern liberal or socialist is moved altogether differently than the ancient sceptic. His open, pluralistic world is a field for always more specialised research, for ever closer technical and practical control. To the ancients this response is unthinkable: progressive research and more obviously technocratic control suppose a unity of ends not, as with personality, altogether abstract but able to penetrate the multiple and divided interests.<\/p>\n\n<p>The Romans did indeed discover a science by which a certain regulation of all interests and activities was possible. Roman law or abstract right determines the rights of persons in relation to property and to one another. It appears therefore to be beyond the sceptical division of persons from the uncertain world of particular interests. But it is rather the authentic scepticism which can deal with the puzzle whether the sceptic can know that he cannot know. For by imposing a uniformity and objectivity on property and personal relations, it brings to light that rights only attach in an unstable and contradictory way to persons as atomic individuals, that personality is rather that in which individuals are one and universal.<\/p>\n\n<p>It is only if one supposes that this reduction of atomic individuality to universal self-consciousness has somehow been completed that liberal or socialist societies are in any way comprehensible. For they are not founded on race or any other natural bond but on the equality of their members, that is on rationality in which alone they are equal. But neither do they stay with the abstract independence of individuals and their indifference to common social interests. One has instead societies whose members are thought to carry out a common work through their various and divided occupations, in general or to a tolerable degree to satisfy their special interests and at the same time to act morally or in view of their common rationality.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Read the passage below and answer the questions that follow.<\/strong><\/p><\/div><p>Pick out the true statement from your reading of the passage.<\/p>", "options": ["<p>The Roman Empire was not without gods, in that there were old gods who can be represented as powers within a universal teleology.<\/p>", "<p>Individuality arose in the Roman Empire in the form of a liberal reaction to puritanical suppression. <\/p>", "<p>The freedom and unity of ends with respect to nature extended to human activity so that the Romans did not possess a system of gods.<\/p>", "<p>The Roman system involved the passivity and dependence of an immediate unity with nature.<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p>[1] is false because the statement is a modern reasoning of the old Roman religion, not a representation of how matters stood in th
