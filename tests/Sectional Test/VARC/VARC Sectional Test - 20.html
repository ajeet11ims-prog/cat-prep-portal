s somehow been completed that liberal or socialist societies are in any way comprehensible. For they are not founded on race or any other natural bond but on the equality of their members, that is on rationality in which alone they are equal. But neither do they stay with the abstract independence of individuals and their indifference to common social interests. One has instead societies whose members are thought to carry out a common work through their various and divided occupations, in general or to a tolerable degree to satisfy their special interests and at the same time to act morally or in view of their common rationality.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Read the passage below and answer the questions that follow.<\/strong><\/p><\/div><p>How do the modern and ancient sceptic differ?<\/p>", "options": ["<p>They have purged themselves of extraneous elements with equal vigour.<\/p>", "<p>The modern sceptic follows the authentic scepticism and can hence deal with more complexpuzzles unlike the ancient sceptics. <\/p>", "<p>The ancient sceptics discovered a science by which a certain regulation of all interests and activities was possible but the moderns regulated their society on the basis of equality. <\/p>", "<p>The modern sceptic takes for granted a unity of ends, which is alien to the thinking of the ancient sceptic. <\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p>To the ancient sceptic, the relations to the world were pluralistic and open-ended. The moderns however, believed in a unity of ends. The question is asking the reader to differentiate between the two. Option [1] provides a similarity. Hence, option [1] can be negated. Option [2] is not mentioned in the passage. Hence, [2] can be negated. The moderns regulated their society on the basis of equality of members. This isn’t given in the passage. Hence, [3] can be negated. Option [4] explains the difference between the two types of sceptics very succintly. Hence, [4].<\/p>", "topic": "Specific Detail"}, {"number": 15, "sourceId": "67709", "type": "mcq", "passage": "<p>The only society that can be thought of as purely secular is that of the Roman Empire, unless so far as Hellenistic Greeks had already come to the same principle. In other societies there either was not a subjective or self-consciousness which was to itself the unity of its technical, practical, and theoretical relations to nature or this human independence was itself taken into a religious attitude. The rational individuality or personality, which was the principle of this society, is a radical separation of humans from the passivity and dependence of an immediate unity with nature. It carries to its extreme consequence the freedom of Hebraic and Hellenic society, which regard nature as derivative, dependent and ordered by divine subjectivity. This freedom and unity of ends is seen as belonging also to human activity. The harsh discipline of the Republic, the subordination in the words of a Roman of all other vices to the lust for state power, provoked in reaction an individuality which related to itself the whole extent of private interests – the equivalent in those conditions of a liberal reaction to puritanical suppression.<\/p>\n\n<p>The old Roman religion which saw as divine what could give effect to particular human ends and especially the advancement of the Republic, can remain only so far as this society is not fully conscious of its principle. For this principle may be looked at positively in the manner of the Stoics as giving a universal end to which all particular ends can be related. In this case the old gods can be represented as powers within a universal teleology. But equally it has the negative or Epicurean form in which individuals have set themselves apart from all natural or limited involvements. For that view, if there be gods, they cannot be less than such self-related individuals and are therefore not the gods of popular religion who promote human desires, ambitions or collective love of power.<\/p>\n\n<p>The complete form of the principle is however the scepticism for which there stands on the one side a plurality of endlessly open and incomplete relations to the world, on the other a detached rational subjectivity without content. Between the two no logical bond can be found. The world of the ancient sceptic is in general the same as that of modern empiricism, so far as this has purged itself of extraneous elements with equal vigour. But the modern liberal or socialist is moved altogether differently than the ancient sceptic. His open, pluralistic world is a field for always more specialised research, for ever closer technical and practical control. To the ancients this response is unthinkable: progressive research and more obviously technocratic control suppose a unity of ends not, as with personality, altogether abstract but able to penetrate the multiple and divided interests.<\/p>\n\n<p>The Romans did indeed discover a science by which a certain regulation of all interests and activities was possible. Roman law or abstract right determines the rights of persons in relation to property and to one another. It appears therefore to be beyond the sceptical division of persons from the uncertain world of particular interests. But it is rather the authentic scepticism which can deal with the puzzle whether the sceptic can know that he cannot know. For by imposing a uniformity and objectivity on property and personal relations, it brings to light that rights only attach in an unstable and contradictory way to persons as atomic individuals, that personality is rather that in which individuals are one and universal.<\/p>\n\n<p>It is only if one supposes that this reduction of atomic individuality to universal self-consciousness has somehow been completed that liberal or socialist societies are in any way comprehensible. For they are not founded on race or any other natural bond but on the equality of their members, that is on rationality in which alone they are equal. But neither do they stay with the abstract independence of individuals and their indifference to common social interests. One has instead societies whose members are thought to carry out a common work through their various and divided occupations, in general or to a tolerable degree to satisfy their special interests and at the same time to act morally or in view of their common rationality.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Read the passage below and answer the questions that follow.<\/strong><\/p><\/div><p>Why does the achievement of universal self-consciousness and reduction of atomic individuality become necessary to understand liberal or socialist societies?<\/p>", "options": ["<p>Universal self-consciousness implies that the processes of such societies are not founded on race or any other natural bond but on the equality of their members.<\/p>", "<p>With the decline of atomic individuality and the rise of universal self-consciousness, came the necessary, concurrent rationality which is the base of such societies.<\/p>", "<p>Individuals in this society show such influences since they carry out a common work while satisfying their own special interests, with an eye to being both moral and rational.<\/p>", "<p>Individuals in liberal or socialist societies do not stay with the abstract independence of individuals and their indifference to common social interests.<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p>The liberal or socialist societies focus on the society as well as the individual. Thus, the individual works for himself/herself and the society too. Option [1] does not explain how the reduction of atomic individually is important to understand liberal or socialist societies. Hence, it can be negated. Option [2] is not stated in the passage. Hence, it can be negated. Option [4] is an incomplete argument. It is moving towards the idea mentioned in option [3]. Since, it is not mentioned, option [4] can be negated. Option [3] fulfills both the conditions. Hence, [3].<\/p>", "topic": "Specific Detail"}, {"number": 16, "sourceId": "76925", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>Labour is that activity which corresponds to the\r\n  biological processes and necessities of human existence, the practices that\r\n  are necessary for the maintenance of life itself. Labour is distinguished by\r\n  its never-ending character; it creates nothing of permanence, its efforts are\r\n  quickly consumed, and must therefore be perpetually renewed so as to sustain\r\n  life. In this aspect of its existence humanity is closest to the animals and\r\n  so, in a significant sense, the least human. Indeed, Arendt refers to\r\n  humanity in this mode as animal Labourans. Because the activity of Labour is\r\n  commanded by necessity, the human being as Labourer is the equivalent of the\r\n  slave; Labour is characterized by 'unfreedom'. Arendt argues that it is\r\n  precisely the recognition of Labour as contrary to freedom, and thus to what\r\n  is distinctively human, which underlay the institution of slavery amongst the\r\n  ancient Greeks; it was the attempt to exclude Labour from the conditions of\r\n  human life. In view of this characterization of Labour, it is unsurprising\r\n  that Arendt is highly critical of Marx's elevation of animal Labourans to a\r\n  position of primacy in his vision of the highest ends of human existence.\r\n  Drawing on the Aristotelian distinction of the <i>oikos<\/i> (the private\r\n  realm of the household) from the <i>polis<\/i> (the public realm of the\r\n  political community), Arendt argues that matters of Labour, economy and the\r\n  like properly belong to the former, not the latter. The emergence of\r\n  necessary Labour, the private concerns of the<i> oikos<\/i>, into the public\r\n  sphere (what Arendt calls 'the rise of the social') has for her the effect of\r\n  destroying the properly political by subordinating the public realm of human\r\n  freedom to the concerns of mere animal necessity. The prioritisation of the\r\n  economic, which has attended the rise of capitalism, has for Arendt all but\r\n  eclipsed the possibilities of meaningful political agency and the pursuit of\r\n  higher ends which should be the proper concern of public life.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span lang=EN-US>If Labour relates to the natural and\r\n  biologically necessitated dimension of human existence, then work is 'the\r\n  activity which corresponds to the unnaturalness of human existence, which is\r\n  not embedded in, and whose mortality is not compensated by, the species'\r\n  ever-recurring life-cycle'. Work corresponds to the fabrication of an\r\n  artificial world of things, 'artifactual constructions', which endure\r\n  temporally beyond the act of creation itself. Work thus creates a world\r\n  distinct from anything given in nature, a world distinguished by its\r\n  durability, its semi-permanence and relative independence from the individual\r\n  actors and acts, which call it into being. Humanity in this mode of its\r\n  activity Arendt names homo faber; he/she is the builder of walls (both\r\n  physical and cultural) which divide the human realm from that of nature and\r\n  provide a stable context (a 'common world') of spaces and institutions within\r\n  which human life can unfold. Homo Faber's typical representatives are the\r\n  builder, the architect, the craftsperson, the artist and the legislator, as\r\n  they create the public world both physically and institutionally by\r\n  constructing buildings and making laws. The common world of institutions and\r\n  spaces that work creates furnish the arena in which citizens may come\r\n  together as members of that shared world to engage in political activity.<\/span><span\r\n  lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following points out the problem with the definition of and distinction between, work and labour made by Arendt that she uses to criticize Marx's position?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">The labourer whom Marx elevates is not aware of the distinction between labour and work as postulated by Arendt and hence will be incapable of political activity.<\/span><\/p>", "<p><span lang=\"EN-US\">Confining matters of labour to the extra-political realm of the <em>oikos <\/em>delegitimizes questions of social justice, poverty and exploitation from political discussion and contestation.<\/span><\/p>", "<p><span lang=\"EN-US\">The labourer whom Marx elevates is not only involved in labour, as defined by Arendt, but also in what is defined by her as work such as construction of buildings, automobiles etc.<\/span><\/p>", "<p><span lang=\"EN-US\">Arendt's definition of labour might be relevant only in the context of Greek <em>polis<\/em> and <em>oikos<\/em>, and not in the modern political regimes and institutions.<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">Arendt defines labour as activities that are temporary and necessitated by nature and work as activities that are not necessitated by nature and result in creation of artificial things. In defining things as such, she ignores the fact that labour is also involved in the production of artificial things; it is this labour that Marx elevates. Option [3] best states this. Option [1] is incorrect since the problem stated is not with the distinction that Arendt makes but with the awareness of the same. Option [2] is incorrect since it points out an outcome of the distinction made by Arendt but not the problem with the distinction itself. Option [4] is incorrect since it is not supported by information in the passage. Hence, [3].<\/span><\/p>", "topic": "Application Question"}, {"number": 17, "sourceId": "76926", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>Labour is that activity which corresponds to the\r\n  biological processes and necessities of human existence, the practices that\r\n  are necessary for the maintenance of life itself. Labour is distinguished by\r\n  its never-ending character; it creates nothing of permanence, its efforts are\r\n  quickly consumed, and must therefore be perpetually renewed so as to sustain\r\n  life. In this aspect of its existence humanity is closest to the animals and\r\n  so, in a significant sense, the least human. Indeed, Arendt refers to\r\n  humanity in this mode as animal Labourans. Because the activity of Labour is\r\n  commanded by necessity, the human being as Labourer is the equivalent of the\r\n  slave; Labour is characterized by 'unfreedom'. Arendt argues that it is\r\n  precisely the recognition of Labour as contrary to freedom, and thus to what\r\n  is distinctively human, which underlay the institution of slavery amongst the\r\n  ancient Greeks; it was the attempt to exclude Labour from the conditions of\r\n  human life. In view of this characterization of Labour, it is unsurprising\r\n  that Arendt is highly critical of Marx's elevation of animal Labourans to a\r\n  position of primacy in his vision of the highest ends of human existence.\r\n  Drawing on the Aristotelian distinction of the <i>oikos<\/i> (the private\r\n  realm of the household) from the <i>polis<\/i> (the public realm of the\r\n  political community), Arendt argues that matters of Labour, economy and the\r\n  like properly belong to the former, not the latter. The emergence of\r\n  necessary Labour, the private concerns of the<i> oikos<\/i>, into the public\r\n  sphere (what Arendt calls 'the rise of the social') has for her the effect of\r\n  destroying the properly political by subordinating the public realm of human\r\n  freedom to the concerns of mere animal necessity. The prioritisation of the\r\n  economic, which has attended the rise of capitalism, has for Arendt all but\r\n  eclipsed the possibilities of meaningful political agency and the pursuit of\r\n  higher ends which should be the proper concern of public life.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span lang=EN-US>If Labour relates to the natural and\r\n  biologically necessitated dimension of human existence, then work is 'the\r\n  activity which corresponds to the unnaturalness of human existence, which is\r\n  not embedded in, and whose mortality is not compensated by, the species'\r\n  ever-recurring life-cycle'. Work corresponds to the fabrication of an\r\n  artificial world of things, 'artifactual constructions', which endure\r\n  temporally beyond the act of creation itself. Work thus creates a world\r\n  distinct from anything given in nature, a world distinguished by its\r\n  durability, its semi-permanence and relative independence from the individual\r\n  actors and acts, which call it into being. Humanity in this mode of its\r\n  activity Arendt names homo faber; he/she is the builder of walls (both\r\n  physical and cultural) which divide the human realm from that of nature and\r\n  provide a stable context (a 'common world') of spaces and institutions within\r\n  which human life can unfold. Homo Faber's typical representatives are the\r\n  builder, the architect, the craftsperson, the artist and the legislator, as\r\n  they create the public world both physically and institutionally by\r\n  constructing buildings and making laws. The common world of institutions and\r\n  spaces that work creates furnish the arena in which citizens may come\r\n  together as members of that shared world to engage in political activity.<\/span><span\r\n  lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p>Which of the following have been marked out by Arendt as the distinction between labour and work?<\/p>\n<p>I.     Work violates the realm of nature by shaping and transforming it according to the specific plans and needs of humans whereas labour is bound to the demands of biology and nature.<\/p>\n<p>II.    Work is under humans’ sovereignty and control and thus exhibits a certain quality of freedom unlike labour, which is subject to nature and necessity.<\/p>\n<p>III.   Labour is concerned with satisfying the individual’s life-needs and so remains essentially a private affair, work is inherently public.<\/p>", "options": ["<p><span lang=\"EN-US\">Both I and II<\/span><\/p>", "<p><span lang=\"EN-US\">Both II and III<\/span><\/p>", "<p><span lang=\"EN-US\">Both I and III<\/span><\/p>", "<p><span lang=\"EN-US\">I, II and III<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">The passage makes the following distinction between labour and work: labour is defined by nature whereas work is defined by man, labour unlike work is something that man cannot escape and hence shackles his freedom, labour is private and work is public. The three statements capture each of the distinctions drawn by Arendt. Hence, [4].<\/span><\/p>", "topic": "Specific Detail"}, {"number": 18, "sourceId": "76927", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>Labour is that activity which corresponds to the\r\n  biological processes and necessities of human existence, the practices that\r\n  are necessary for the maintenance of life itself. Labour is distinguished by\r\n  its never-ending character; it creates nothing of permanence, its efforts are\r\n  quickly consumed, and must therefore be perpetually renewed so as to sustain\r\n  life. In this aspect of its existence humanity is closest to the animals and\r\n  so, in a significant sense, the least human. Indeed, Arendt refers to\r\n  humanity in this mode as animal Labourans. Because the activity of Labour is\r\n  commanded by necessity, the human being as Labourer is the equivalent of the\r\n  slave; Labour is characterized by 'unfreedom'. Arendt argues that it is\r\n  precisely the recognition of Labour as contrary to freedom, and thus to what\r\n  is distinctively human, which underlay the institution of slavery amongst the\r\n  ancient Greeks; it was the attempt to exclude Labour from the conditions of\r\n  human life. In view of this characterization of Labour, it is unsurprising\r\n  that Arendt is highly critical of Marx's elevation of animal Labourans to a\r\n  position of primacy in his vision of the highest ends of human existence.\r\n  Drawing on the Aristotelian distinction of the <i>oikos<\/i> (the private\r\n  realm of the household) from the <i>polis<\/i> (the public realm of the\r\n  political community), Arendt argues that matters of Labour, economy and the\r\n  like properly belong to the former, not the latter. The emergence of\r\n  necessary Labour, the private concerns of the<i> oikos<\/i>, into the public\r\n  sphere (what Arendt calls 'the rise of the social') has for her the effect of\r\n  destroying the properly political by subordinating the public realm of human\r\n  freedom to the concerns of mere animal necessity. The prioritisation of the\r\n  economic, which has attended the rise of capitalism, has for Arendt all but\r\n  eclipsed the possibilities of meaningful political agency and the pursuit of\r\n  higher ends which should be the proper concern of public life.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span lang=EN-US>If Labour relates to the natural and\r\n  biologically necessitated dimension of human existence, then work is 'the\r\n  activity which corresponds to the unnaturalness of human existence, which is\r\n  not embedded in, and whose mortality is not compensated by, the species'\r\n  ever-recurring life-cycle'. Work corresponds to the fabrication of an\r\n  artificial world of things, 'artifactual constructions', which endure\r\n  temporally beyond the act of creation itself. Work thus creates a world\r\n  distinct from anything given in nature, a world distinguished by its\r\n  durability, its semi-permanence and relative independence from the individual\r\n  actors and acts, which call it into being. Humanity in this mode of its\r\n  activity Arendt names homo faber; he/she is the builder of walls (both\r\n  physical and cultural) which divide the human realm from that of nature and\r\n  provide a stable context (a 'common world') of spaces and institutions within\r\n  which human life can unfold. Homo Faber's typical representatives are the\r\n  builder, the architect, the craftsperson, the artist and the legislator, as\r\n  they create the public world both physically and institutionally by\r\n  constructing buildings and making laws. The common world of institutions and\r\n  spaces that work creates furnish the arena in which citizens may come\r\n  together as members of that shared world to engage in political activity.<\/span><span\r\n  lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\"> The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following, according to Arendt, is the relationship between work and political activity?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\"> Work is the mode of human activity that corresponds to politics, since it creates the institutions and spaces that facilitate people to engage in political activity.<\/span><\/p>", "<p><span lang=\"EN-US\"> While work is not the mode of human activity that corresponds to politics, its fabrications are the preconditions for the existence of a political community. <\/span><\/p>", "<p><span lang=\"EN-US\"> While work is not the mode of human activity that corresponds to politics, it creates the need for political activity due to the web of relations it engenders in the realm of the public.<\/span><\/p>", "<p><span lang=\"EN-US\"> Work is the mode of human activity that corresponds to politics, since it enables the demarcation of human life into work and labour and related political activity.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\"> The last sentence of the passage states that the common world of institutions and spaces that work creates furnish the arena in which citizens may come together as members of that shared world to engage in political activity. So, work in itself is not a political activity, it creates the common ground or space for people to come together and engage in political activity. Only options [2] and [3] correctly classify work itself as not being directly political activity. But option [3] is incorrect since it states that work creates the need for political activity, which is not mentioned in the passage. Hence, [2].<\/span><\/p>", "topic": "Specific Detail"}, {"number": 19, "sourceId": "76928", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>Labour is that activity which corresponds to the\r\n  biological processes and necessities of human existence, the practices that\r\n  are necessary for the maintenance of life itself. Labour is distinguished by\r\n  its never-ending character; it creates nothing of permanence, its efforts are\r\n  quickly consumed, and must therefore be perpetually renewed so as to sustain\r\n  life. In this aspect of its existence humanity is closest to the animals and\r\n  so, in a significant sense, the least human. Indeed, Arendt refers to\r\n  humanity in this mode as animal Labourans. Because the activity of Labour is\r\n  commanded by necessity, the human being as Labourer is the equivalent of the\r\n  slave; Labour is characterized by 'unfreedom'. Arendt argues that it is\r\n  precisely the recognition of Labour as contrary to freedom, and thus to what\r\n  is distinctively human, which underlay the institution of slavery amongst the\r\n  ancient Greeks; it was the attempt to exclude Labour from the conditions of\r\n  human life. In view of this characterization of Labour, it is unsurprising\r\n  that Arendt is highly critical of Marx's elevation of animal Labourans to a\r\n  position of primacy in his vision of the highest ends of human existence.\r\n  Drawing on the Aristotelian distinction of the <i>oikos<\/i> (the private\r\n  realm of the household) from the <i>polis<\/i> (the public realm of the\r\n  political community), Arendt argues that matters of Labour, economy and the\r\n  like properly belong to the former, not the latter. The emergence of\r\n  necessary Labour, the private concerns of the<i> oikos<\/i>, into the public\r\n  sphere (what Arendt calls 'the rise of the social') has for her the effect of\r\n  destroying the properly political by subordinating the public realm of human\r\n  freedom to the concerns of mere animal necessity. The prioritisation of the\r\n  economic, which has attended the rise of capitalism, has for Arendt all but\r\n  eclipsed the possibilities of meaningful political agency and the pursuit of\r\n  higher ends which should be the proper concern of public life.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span lang=EN-US>If Labour relates to the natural and\r\n  biologically necessitated dimension of human existence, then work is 'the\r\n  activity which corresponds to the unnaturalness of human existence, which is\r\n  not embedded in, and whose mortality is not compensated by, the species'\r\n  ever-recurring life-cycle'. Work corresponds to the fabrication of an\r\n  artificial world of things, 'artifactual constructions', which endure\r\n  temporally beyond the act of creation itself. Work thus creates a world\r\n  distinct from anything given in nature, a world distinguished by its\r\n  durability, its semi-permanence and relative independence from the individual\r\n  actors and acts, which call it into being. Humanity in this mode of its\r\n  activity Arendt names homo faber; he/she is the builder of walls (both\r\n  physical and cultural) which divide the human realm from that of nature and\r\n  provide a stable context (a 'common world') of spaces and institutions within\r\n  which human life can unfold. Homo Faber's typical representatives are the\r\n  builder, the architect, the craftsperson, the artist and the legislator, as\r\n  they create the public world both physically and institutionally by\r\n  constructing buildings and making laws. The common world of institutions and\r\n  spaces that work creates furnish the arena in which citizens may come\r\n  together as members of that shared world to engage in political activity.<\/span><span\r\n  lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\"> The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Based on the passage, it can be inferred that Arendt would consider the role of economic policy in politics to be:<\/span><\/p>", "options": ["<p><span lang=\"EN-US\"> integral<\/span><\/p>", "<p><span lang=\"EN-US\"> secondary<\/span><\/p>", "<p><span lang=\"EN-US\"> ambiguous<\/span><\/p>", "<p><span lang=\"EN-US\"> heterodox<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\"> The last sentence of the first paragraph indicates that Ardent considers that economic matters should not be given primary importance in politics and the latter should be used to pursue higher ends. Option [1] states the opposite of this, option [3] means unclear and option [4] means not conforming to traditional principles, option [2] best answers the question. Hence, [2].<\/span><\/p>", "topic": "Inference"}, {"number": 20, "sourceId": "31998", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>The sentences given in the question  below when properly sequenced, form a coherent paragraph. Each sentence is labelled with a letter. Enter in the box provided below the most logical order of sentences  to construct a coherent paragraph.<\/p>\n<p><strong>Note: <em>Your answer should  be a combination of   letters indicating the order of the sentences<em> .Use the virtual keyboard to enter your answer<\/em><\/em><br /><\/strong><\/p><\/div><p>A. Fields as dissimilar as biology and astronomy demanded whole catalogues of new photographs to record and classify a rapidly expanding body of knowledge.<\/p>\n<p>B. In addition to recording the construction of railroads, ships, buildings and bridges, photography proved useful to medicine and the fledgling social sciences, such as psychology and criminology.<\/p>\n<p>C. Photographers recorded the features of criminals, not only as a means of identification, but also in an effort to identify physical characteristics that criminologists then believed might correspond with criminal behaviour.<\/p>\n<p>D. Psychologists studied photographs of mental patients in an attempt to visually discern their disorders.<\/p>\n<p>E. Doctors wanted before-and-after pictures of wounded Civil War soldiers to study the effects of amputation and invasive surgery.<\/p>", "options": [], "answer": "BEDCA", "answerLabel": "BEDCA", "solution": "<p>Only B is possible as an opening sentence. Logically, it should be followed by E as 'medicine' is mentioned first, followed by D (Psychology) and C ('Criminology'). Thus, we have BEDCA. <\/p>", "topic": "Jumbled Paragraphs"}, {"number": 21, "sourceId": "67669", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>The sentences given below, when properly sequenced form a coherent paragraph. Each statement is labelled with a letter. <strong>Decide on the proper sequencing of the order of the sentences and key in the sequence of the four letters as your answer:<\/strong>.<\/strong><\/p><\/div><p>A. Anyone of these may happen to lead us to true beliefs, but is more likely to lead us in the opposite direction.<br />B. A man imbued with the philosophic spirit will wish his beliefs to be as true as he can make them, and will in equal measure, love to know and hate to be in error.<br />C. Our beliefs spring from a great variety of causes: what we were told in youth by parents and school teachers; what powerful organisations tell us in order to make us act as they wish.<br />D. Intellectual sobriety, therefore, will lead us to scrutinise our beliefs closely, with the view to discovering which of them there is any reason to believe true.<br />E. This principle has a wider scope than may be apparent at first sight.<\/p>\n<div>\n<p><strong>Note: <em>Your answer should  be a combination of   letters indicating the order of the sentences<em>. Use the virtual keyboard to enter your answer.<\/em><\/em><br /><\/strong><\/p>\n<\/div>\n<div> <\/div>\n<div> <\/div>\n<p><em><\/em><\/p>", "options": [], "answer": "BECAD", "answerLabel": "BECAD", "solution": "<p>Both statements B and C could be potential opening statements for the given sequence. One will notice the BE link. B introduces the principle, while E tells us how the principle has a ‘wider scope’. The BE link is further elaborated by C. ‘Anyone of these’ in A refers to the causes mentioned earlier in C. D concludes the sequence by telling us how to arrive at our true beliefs. Hence, BECAD is the sequence.<\/p>", "topic": "Jumbled Paragraphs"}, {"number": 22, "sourceId": "85153", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Four alternative summaries are given below each text. Choose the option that best captures the essence of the text.<\/strong><\/p><\/div><p><span lang=\"EN-US\">Consider the wristwatch. A few decades ago, watches were simple. All you had to do was set the time and keep the watch wound. The standard control was the stem: a knob at the side of the watch. Turning the knob would wind the spring that provided power to the watch movement. Pulling out the knob and turning it rotated the hands. The operations were easy to learn and easy to do. There was a reasonable relationship between the turning of the knob and the resulting turning of the hands. The design even took into account human error. In its normal position, turning the stem wound the mainspring of the clock. The stem had to be pulled before it would engage the gears for setting the time. thus accidental turns of the stem did no harm.<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Watches from a few decades ago were the wind-up kind, and thus were easy to learn to use.<\/span><\/p>", "<p><span lang=\"EN-US\">Until a few decades ago, watch design was simplistic, and watches were prone to mistakes.<\/span><\/p>", "<p><span lang=\"EN-US\">A few decades ago, the design of watches took into consideration that people would make mistakes winding them.<\/span><\/p>", "<p><span lang=\"EN-US\">The wind-up watches of a few decades ago were easy to learn control, and the design allowed for human error.<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">In this paragraph, the author praises the simple design of the watches of the past. [2], however, talks about them negatively, and states that they 'were prone to mistakes', which is not mentioned in the paragraph. [1] fails to mention the point that the watches took into consideration that people might make mistakes while winding them. On the other hand, [3] does not mention the simple design. Only [4], which is a positive sentence that mentions both these points, is the correct summary. Hence, [4].<\/span><\/p>", "topic": "Summary"}, {"number": 23, "sourceId": "85154", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong>Four alternative summaries are given below each text. Choose the option that best captures the essence of the text.<\/strong><\/p><\/div><p><span lang=\"EN-US\">It is unusual to find human beings sitting in empty rooms with barren walls. We tend to fill up any living or working space with photos and art, artefacts and souvenirs. Cubicles accumulate the ephemera of the occupant's personality, and the interior of a home expands to project that which the owner finds beautiful and expressive, that which demonstrates the ideas the owner admires. As George Carlin put it, when you get down to it, a house is just 'a pile of stuff with a cover on it'. We can't help it. Wherever we go, we amass objects.<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">We human beings tend to fill up our surroundings with objects that express what we like.<\/span><\/p>", "<p><span lang=\"EN-US\">As George Carlin says, we human beings cannot help expressing our personality through our surroundings.<\/span><\/p>", "<p><span lang=\"EN-US\">According to George Carlin, we human beings tend to fill our homes with piles of possessions.<\/span><\/p>", "<p><span lang=\"EN-US\">We human beings don't like emptiness, and so we fill up our work and home environments with possessions.<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\">George Carlin is mentioned only in the context of a quotation that illustrates the author's main point; he is not the main focus of the paragraph. So both [2] and [3], which frame the paragraph as being as summary of his ideas, are incorrect. [4] is more an inference rather than a summary, as the idea that human beings don't like emptiness is not mentioned in this paragraph. Only [1] correctly summarizes the paragraph. Hence, [1].<\/span><\/p>", "topic": "Summary"}, {"number": 24, "sourceId": "84491", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">Three out of four sentences in the options, when correctly sequenced, form a coherent paragraph. Which of the following sentences does not fit into the context?<\/span><\/strong><\/p><\/div><p><br /><br /><\/p>", "options": [], "answer": "1", "answerLabel": "1", "solution": "<p><span lang=\"EN-US\">Sentences [4] and [2] are clearly linked, as they both list 'reasons' for something. That something is people's belief in astrology, as the question in [3] asks. [1], on the other hand, does not fit into the sequence formed by [4]-[2]-[3], as it is about what astrology is, not why people believe in it. Hence, 1.<\/span><\/p>", "topic": "Sentence out of context"}]}</script><script>

function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
