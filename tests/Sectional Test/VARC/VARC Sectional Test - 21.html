 "mcq", "passage": "<p><span lang=\"EN-US\">Many extinct species – from the passenger pigeon to the woolly mammoth – might now be reclassified as 'bodily, but not genetically, extinct'. They're dead, but their DNA is recoverable from museum specimens and fossils, even those up to 200,000 years old. Thanks to new developments in genetic technology, that DNA may eventually bring the animals back to life.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">But why bring vanished creatures back to life? It will be expensive and difficult. It won't always succeed. Why even try? Why do we take enormous trouble to protect endangered species? The same reasons will apply to species brought back from extinction: to preserve biodiversity, to restore diminished ecosystems, to advance the science of preventing extinctions, and to undo the harm that humans have caused in the past. <\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Species brought back from extinction will be beacons of hope. Useful science will also emerge. Close examination of the genomes of extinct species can tell us much about what made them vulnerable in the first place. Were they in a bottleneck with too little genetic variability? How were they different from close relatives that survived? Living specimens will reveal even more. Techniques being developed for de-extinction will also be directly applicable to living species that are close to extinction. Tiny populations can have their genetic variability restored. A species with a genetic Achilles' heel might be totally cured with an adjustment introduced through cloning. For instance, the transmissible cancer on the faces of Tasmanian devils is thought to be caused by a single gene. That gene can be silenced in a generation of the animals released to the wild. The cancer would disappear in the wild soon after, because the immune animals won't transmit it, and animals with the immunity will out-reproduce the susceptible until the entire population is immune.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Some extinct species were important 'keystones' in their region. Restoring them would help restore a great deal of ecological richness. Woolly mammoths, for instance, were the dominant herbivore of the 'mammoth steppe' in the far north, once the largest biome on Earth. In their absence, the grasslands they helped sustain were replaced by species-poor tundra and boreal forest. Their return to the north would bring back carbon-fixing grass and reduce greenhouse-gas-releasing tundra. Similarly, the European aurochs (extinct since 1627) helped to keep forests across all of Europe and Asia mixed with bio-diverse meadows and grasslands.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The passenger pigeon was a keystone species for the whole eastern deciduous forest in North America, from the Mississippi to the Atlantic, from the U.S. Deep South clear up into Canada. Such animals can also serve as icons, flagship species inspiring the protection of a whole region. The prospect of bringing back the aurochs is helping to boost the vibrant European 're-wilding' movement to connect tracts of abandoned farmland into wildlife corridors spanning national boundaries. <\/span><\/p><p><span lang=\"EN-US\">The current generation of children will experience the return of some remarkable creatures in their lifetime. They will drag their parents to zoos to see the woolly mammoth and growing populations of captive-bred passenger pigeons, Carolina parakeets, Labrador ducks, and maybe even dodos. (Entrance fees at zoos provide a good deal of conservation funding, and zoos will be in the thick of extinct species revival and restoration.) <\/span><\/p><p><span lang=\"EN-US\">Humans killed off a lot of species over the last 10,000 years. Some resurrection is in order. A bit of redemption might come with it.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">'It won't always succeed. Why even try?' This statement, considering its purpose in the passage, can best be described as a:<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">harsh criticism<\/span><\/p>", "<p><span lang=\"EN-US\">cynical view.<\/span><\/p>", "<p><span lang=\"EN-US\">counter-argument.<\/span><\/p>", "<p><span lang=\"EN-US\">tongue-in-cheek statement.<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">This passage talks, among other things, about the practicality of reviving extinct species. The statement is not a harsh criticism of the idea, ruling out [1]. It is also not a tongue-in-cheek statement, since it is not indirect humour. Hence, [4] is ruled out. Though it sounds like a cynical view, a look at the larger context shows that it is in fact a counter-argument to the author's argument in favour of reviving extinct species, which he goes on to rebut in the rest of the passage. Hence, [3].<\/span><\/p>", "topic": "Application Question"}, {"number": 17, "sourceId": "84892", "type": "mcq", "passage": "<p><span>In the early Platonic dialogue, <\/span><em>Crito<\/em><span>, Socrates makes a compelling argument as to why he must stay in prison and accept the death penalty, rather than escape and go into exile in another Greek city. He personifies the Laws of Athens, and, speaking in their voice, explains that he has acquired an overwhelming obligation to obey the Laws because they have made his entire way of life, and even the fact of his very existence, possible. They made it possible for his mother and father to marry, and therefore to have legitimate children, including himself. Having been born, the city of Athens, through its laws, then required that his father care for and educate him. Socrates' life and the way in which that life has flourished in Athens are each dependent upon the Laws. Importantly, however, this relationship between citizens and the Laws of the city are not coerced. Citizens, once they have grown up, and have seen how the city conducts itself, can choose whether to leave, taking their property with them, or stay. Staying implies an agreement to abide by the Laws and accept the punishments that they mete out. And, having made an agreement that is itself just, Socrates asserts that he must keep to this agreement that he has made and obey the Laws, in this case, by staying and accepting the death penalty. Importantly, the contract described by Socrates is an implicit one: it is implied by his choice to stay in Athens, even though he is free to leave.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">In Plato's most well-known dialogue, <em>Republic<\/em>, social contract theory is represented again, although this time less favourably. In Book II, Glaucon offers a candidate for an answer to the question \"what is justice?\" by representing a social contract explanation for the nature of justice. What men would most want is to be able to commit injustices against others without the fear of reprisal, and what they most want to avoid is being treated unjustly by others without being able to do injustice in return. Justice then, he says, is the conventional result of the laws and covenants that men make in order to avoid these extremes. Being unable to commit injustice with impunity (as those who wear the ring of Gyges would), and fearing becoming victims themselves, men decide that it is in their interests to submit themselves to the convention of justice. Socrates rejects this view, and most of the rest of the dialogue centres on showing that justice is worth having for its own sake, and that the just man is the happy man. So, from Socrates' point of view, justice has a value that greatly exceeds the prudential value that Glaucon assigns to it.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">These views, in the <em>Crito<\/em> and the <em>Republic<\/em>, might seem at first glance inconsistent: in the former dialogue Socrates uses a social contract type of argument to show why it is just for him to remain in prison, whereas in the latter he rejects social contract as the source of justice. These two views are, however, reconcilable. From Socrates' point of view, a just man is one who will, among other things, recognize his obligation to the state by obeying its laws. The state is the morally and politically most fundamental entity, and as such deserves our highest allegiance and deepest respect. Just men know this and act accordingly. Justice, however, is more than simply obeying laws in exchange for others obeying them as well. Justice is the state of a well-regulated soul, and so the just man will also necessarily be the happy man. So, justice is more than the simple reciprocal obedience to law, as Glaucon suggests, but it does nonetheless include obedience to the state and the laws that sustain it. So in the end, although Plato is perhaps the first philosopher to offer a representation of the argument at the heart of social contract theory, Socrates ultimately rejects the idea that social contract is the original source of justice.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of four questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span>Which of the following is the primary purpose of the passage?<\/p>", "options": ["<p><span lang=\"EN-US\">To prove that social contract theory was better understood by Socrates than by Plato.<\/span><\/p>", "<p><span lang=\"EN-US\">To demonstrate how Socrates repudiated Plato's position on the origins of justice.<\/span><\/p>", "<p><span lang=\"EN-US\">To reconcile the contradictions in the social contract theory as represented by Plato.<\/span><\/p>", "<p><span lang=\"EN-US\">To evaluate the representation of the social contract in the Platonic dialogues.<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">The author begins by outlining the representation of social contract in the early Platonic dialogue, <em>Crito<\/em>, in the first paragraph. He then contrasts it with the representation in the most famous Platonic dialogue, <em>Republic<\/em>, in the second paragraph. In the final paragraph he tries to reconcile the two representations. This is best captured in option (4).<span>   <\/span>Options (1) and (2) are incorrect; the intent of the author is not to prove or demonstrate that Socrates better understood or repudiated Plato's stand. In fact Socrates only features as a character or voice in the Platonic dialogue, <em>Crito<\/em>, just as Glaucon and Pluto are characters in the <em>Republic<\/em>. Option (3) is incorrect since the contradiction or inconsistency is in the relationship between justice and social contract, and not between how social contract theory itself is represented in <em>Crito<\/em> and <em>Republic<\/em>. Hence, (4).<\/span><\/p>", "topic": "Primary Purpose"}, {"number": 18, "sourceId": "84893", "type": "mcq", "passage": "<p><span>In the early Platonic dialogue, <\/span><em>Crito<\/em><span>, Socrates makes a compelling argument as to why he must stay in prison and accept the death penalty, rather than escape and go into exile in another Greek city. He personifies the Laws of Athens, and, speaking in their voice, explains that he has acquired an overwhelming obligation to obey the Laws because they have made his entire way of life, and even the fact of his very existence, possible. They made it possible for his mother and father to marr g that justice is worth having for its own sake, and that the just man is the happy man. So, from Socrates' point of view, justice has a value that greatly exceeds the prudential value that Glaucon assigns to it.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">These views, in the <em>Crito<\/em> and the <em>Republic<\/em>, might seem at first glance inconsistent: in the former dialogue Socrates uses a social contract type of argument to show why it is just for him to remain in prison, whereas in the latter he rejects social contract as the source of justice. These two views are, however, reconcilable. From Socrates' point of view, a just man is one who will, among other things, recognize his obligation to the state by obeying its laws. The state is the morally and politically most fundamental entity, and as such deserves our highest allegiance and deepest respect. Just men know this and act accordingly. Justice, however, is more than simply obeying laws in exchange for others obeying them as well. Justice is the state of a well-regulated soul, and so the just man will also necessarily be the happy man. So, justice is more than the simple reciprocal obedience to law, as Glaucon suggests, but it does nonetheless include obedience to the state and the laws that sustain it. So in the end, although Plato is perhaps the first philosopher to offer a representation of the argument at the heart of social contract theory, Socrates ultimately rejects the idea that social contract is the original source of justice.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of four questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span>Which of the following best captures the difference between Glaucon's and Socrates' conception of justice?<\/p>", "options": ["<p><span lang=\"EN-US\">The former viewed it as arising from the point of view of a selfish man while the latter viewed it as arising from the point of view of a just man.<\/span><\/p>", "<p><span lang=\"EN-US\">The former viewed it as arising out of man's innate self-interest while the latter viewed it as something that is to be sought for its own intrinsic worth.<\/span><\/p>", "<p><span lang=\"EN-US\">The former viewed is as a way of curbing the extremes while the latter viewed it as a way of reaching the sublime.<\/span><\/p>", "<p><span lang=\"EN-US\">The former viewed it as arising out of the social contract while the latter thought it upended the social contract.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">The difference between the two views is elaborated in the second paragraph. While Glaucon feels that justice is something that men consent to since it is in their best interest to do so, Socrates feels that justice is worth having for its own sake. Option (1) is incomplete because it does not highlight the fundamental difference in the conception. Option (2) best captures this difference. Option (3) is incorrect since the passage does not mention that Socrates viewed justice as a way of reaching the sublime. Option (4) is incorrect since the passage does not mention that Socrates thought justice <em>upended<\/em>, meaning overthrew, the social contract. Hence, (2).<\/span><\/p>", "topic": "Application Question"}, {"number": 19, "sourceId": "84894", "type": "mcq", "passage": "<p><span>In the early Platonic dialogue, <\/span><em>Crito<\/em><span>, Socrates makes a compelling argument as to why he must stay in prison and accept the death penalty, rather than escape and go into exile in another Greek city. He personifies the Laws of Athens, and, speaking in their voice, explains that he has acquired an overwhelming obligation to obey the Laws because they have made his entire way of life, and even the fact of his very existence, possible. They made it possible for his mother and father to marry, and therefore to have legitimate children, including himself. Having been born, the city of Athens, through its laws, then required that his father care for and educate him. Socrates' life and the way in which that life has flourished in Athens are each dependent upon the Laws. Importantly, however, this relationship between citizens and the Laws of the city are not coerced. Citizens, once they have grown up, and have seen how the city conducts itself, can choose whether to leave, taking their property with them, or stay. Staying implies an agreement to abide by the Laws and accept the punishments that they mete out. And, having made an agreement that is itself just, Socrates asserts that he must keep to this agreement that he has made and obey the Laws, in this case, by staying and accepting the death penalty. Importantly, the contract described by Socrates is an implicit one: it is implied by his choice to stay in Athens, even though he is free to leave.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">In Plato's most well-known dialogue, <em>Republic<\/em>, social contract theory is represented again, although this time less favourably. In Book II, Glaucon offers a candidate for an answer to the question \"what is justice?\" by representing a social contract explanation for the nature of justice. What men would most want is to be able to commit injustices against others without the fear of reprisal, and what they most want to avoid is being treated unjustly by others without being able to do injustice in return. Justice then, he says, is the conventional result of the laws and covenants that men make in order to avoid these extremes. Being unable to commit injustice with impunity (as those who wear the ring of Gyges would), and fearing becoming victims themselves, men decide that it is in their interests to submit themselves to the convention of justice. Socrates rejects this view, and most of the rest of the dialogue centres on showing that justice is worth having for its own sake, and that the just man is the happy man. So, from Socrates' point of view, justice has a value that greatly exceeds the prudential value that Glaucon assigns to it.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">These views, in the <em>Crito<\/em> and the <em>Republic<\/em>, might seem at first glance inconsistent: in the former dialogue Socrates uses a social contract type of argument to show why it is just for him to remain in prison, whereas in the latter he rejects social contract as the source of justice. These two views are, however, reconcilable. From Socrates' point of view, a just man is one who will, among other things, recognize his obligation to the state by obeying its laws. The state is the morally and politically most fundamental entity, and as such deserves our highest allegiance and deepest respect. Just men know this and act accordingly. Justice, however, is more than simply obeying laws in exchange for others obeying them as well. Justice is the state of a well-regulated soul, and so the just man will also necessarily be the happy man. So, justice is more than the simple reciprocal obedience to law, as Glaucon suggests, but it does nonetheless include obedience to the state and the laws that sustain it. So in the end, although Plato is perhaps the first philosopher to offer a representation of the argument at the heart of social contract theory, Socrates ultimately rejects the idea that social contract is the original source of justice.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of four questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p>Which of the statements represent Socrates’ view of the relationship between justice and the social contract?<\/p>\n<p>I.     The social contract arises out of one of the many obligations that a just, self-regulated man will undertake.<\/p>\n<p>II.    Justice does not arise from the social contract; rather the social contract arises out of justice.<\/p>\n<p>III.   Justice is one of the attributes only of a well-regulated soul and is a part of the social contract.<\/p>", "options": ["<p><span lang=\"EN-US\">Only I<\/span><\/p>", "<p><span lang=\"EN-US\">Only II<\/span><\/p>", "<p><span lang=\"EN-US\">Both I and III<\/span><\/p>", "<p><span lang=\"EN-US\">I, II and III<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\">The passage clearly states that Socrates rejects the idea that the social contract is the original source of justice but it does not state the converse; i.e. justice is the cause of the social contract. Statement II thus does not represent Socrates' view of the relationship between justice and the social contract. Statement I is in line with the last paragraph of the passage which states the views held by Socrates. Statement III is incorrect since Socrates does not say that justice is one of the attributes \"only\" of a well-regulated soul. Hence, (1).<\/span><\/p>", "topic": "Application Question"}, {"number": 20, "sourceId": "84895", "type": "mcq", "passage": "<p><span>In the early Platonic dialogue, <\/span><em>Crito<\/em><span>, Socrates makes a compelling argument as to why he must stay in prison and accept the death penalty, rather than escape and go into exile in another Greek city. He personifies the Laws of Athens, and, speaking in their voice, explains that he has acquired an overwhelming obligation to obey the Laws because they have made his entire way of life, and even the fact of his very existence, possible. They made it possible for his mother and father to marry, and therefore to have legitimate children, including himself. Having been born, the city of Athens, through its laws, then required a value that greatly exceeds the prudential value that Glaucon assigns to it.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">These views, in the <em>Crito<\/em> and the <em>Republic<\/em>, might seem at first glance inconsistent: in the former dialogue Socrates uses a social contract type of argument to show why it is just for him to remain in prison, whereas in the latter he rejects social contract as the source of justice. These two views are, however, reconcilable. From Socrates' point of view, a just man is one who will, among other things, recognize his obligation to the state by obeying its laws. The state is the morally and politically most fundamental entity, and as such deserves our highest allegiance and deepest respect. Just men know this and act accordingly. Justice, however, is more than simply obeying laws in exchange for others obeying them as well. Justice is the state of a well-regulated soul, and so the just man will also necessarily be the happy man. So, justice is more than the simple reciprocal obedience to law, as Glaucon suggests, but it does nonetheless include obedience to the state and the laws that sustain it. So in the end, although Plato is perhaps the first philosopher to offer a representation of the argument at the heart of social contract theory, Socrates ultimately rejects the idea that social contract is the original source of justice.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of four questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span>Which of the following pairs of words best characterizes the representation of the social contract in the <em>Crito<\/em> and the <em>Republic<\/em>, respectively?<\/p>", "options": ["<p><span lang=\"EN-US\">Implicit, Explicit<\/span><\/p>", "<p><span lang=\"EN-US\">Principled, Agnostic<\/span><\/p>", "<p><span lang=\"EN-US\">Exalted, Utilitarian<\/span><\/p>", "<p><span lang=\"EN-US\">Subjective, Objective<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">In the first paragraph, it is clearly mentioned that in the <em>Crito<\/em>, the social contract is viewed as something that is vital to life in Athens. Something for which Socrates is ready to give up his life even if he has the freedom to escape. It is thus represented as something that Athens and Socrates viewed with deep respect. In the <em>Republic<\/em>, the social contract is viewed as something that men decided to consent to since it is in their best interest. Both these attitudes are best captured in option (3); <em>exalted<\/em> means noble or elevated or treated with deep respect and <em>utilitarian<\/em> means concerned purely with practical use, sensible. Option (1) is incorrect since implicit and explicit refer to the social contract itself whereas the question is about the way the social contract is represented. A clue would be the first sentence of the second paragraph, <em>In Plato's most well-known dialogue, Republic, social contract theory is represented again, although this time less favourably<\/em>. Options (2) and (4) are incorrect as they fail to define the correct representation of the social contract in the Crito and the Republic. Hence, (3).<\/span><\/p>", "topic": "Application Question"}, {"number": 21, "sourceId": "85644", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The sentences given in each question, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a letter. Enter in the box provided below the most logical order of sentences to construct a coherent paragraph. <\/span><\/strong><\/p>\n<p><strong><span lang=\"EN-US\">Note: Use the virtual keyboard provided to enter your answer.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">A. Previously the River Thames ran through St Albans to the north of London and met the North Sea in Essex.<\/span><\/p>\n<p>B. The last but one ice age was so intense in Europe that the ice sheet made it down as far as north London.<\/p>\n<p>C. The current position of the River Thames is due to the glaciers of the ice ages.<\/p>\n<p>D.So the geography of London was primarily controlled by the ice ages.<\/p>\n<p>E. This re-routed the River Thames to its current path.<\/p>", "options": [], "answer": "CABED", "answerLabel": "CABED", "solution": "<p><span lang=\"EN-US\"> C, which states the topic of the paragraph (the influence of the ice ages on the position of the Thames), has to be the first sentence. A, B and E explain why this is so: A states the original situation, and B and E together state how the position of the river changed. 'So' in D suggests that it is the conclusion. Hence, CABED.<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 22, "sourceId": "85645", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\"> The sentences given in each question, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a letter. Enter in the box provided below the most logical order of sentences to construct a coherent paragraph. <\/span><\/strong><\/p>\n<p><strong><span lang=\"EN-US\">Note: Use the virtual keyboard provided to enter your answer.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">A. The offspring of their unnatural union was the Minotaur, a monstrous creature, part man and part bull, who lived at the centre of a labyrinth (maze) in the Palace of Minos at Knossos, and killed seven girls and seven boys every year. <\/span><\/p>\n<p><span lang=\"EN-US\">B.In revenge, Poseidon caused Minos's wife to fall in love with a bull. <\/span><\/p>\n<p><span lang=\"EN-US\">C.Eventually, the Athenian hero Theseus killed the Minotaur and was rescued from the labyrinth by Minos's daughter Ariadne.<\/span><\/p>\n<p><span lang=\"EN-US\">D.Minos broke an oath to Poseidon, god of the sea, who had guaranteed his kingship. <\/span><\/p>\n<p><span lang=\"EN-US\">E.<span> <\/span>In Greek mythology, Crete was the home of the tyrant King Minos, son of Zeus, and the mortal woman Europa.<\/span><\/p>\n<p><span lang=\"EN-US\"><br /><\/span><\/p>\n\n<p><span lang=\"EN-US\"><br /><\/span><\/p>", "options": [], "answer": "EDBAC", "answerLabel": "EDBAC", "solution": "<p><span lang=\"EN-US\"> E, which introduces the topic as a tale from Greek mythology, has to be the first sentence of the paragraph. The DB link is clear: in D, Minos is said to have broken an oath to Poseidon, and in B, Poseidon's revenge is described. The 'unnatural union' in A is the one resulting from the situation mentioned in B (between Europa and a bull), so A follows B. 'Eventually' in C marks it as the concluding sentence; also, it describes the end of the Minotaur, so it is a logical end to the tale told in this paragraph. Hence, EDBAC.<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 23, "sourceId": "85646", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\"> The sentences given in each question, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a letter. Enter in the box provided below the most logical order of sentences to construct a coherent paragraph. <\/span><\/strong><\/p>\n<p><strong><span lang=\"EN-US\">Note: Use the virtual keyboard provided to enter your answer.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">A.Oxidation strips off the electron paint, whereas reduction has the blanketing effect of a fresh coat of paint. <\/span><\/p>\n<p><span lang=\"EN-US\">B.Chemically speaking, <em>oxidation <\/em>refers to the removal of electrons from an atom or molecule. <\/span><\/p>\n<p><span lang=\"EN-US\">C.The point is that oxygen can strip organic molecules of electrons, often shredding the molecules, which give up their own electrons as a sacrificial offering, in the process.<\/span><\/p>\n<p><span lang=\"EN-US\">D.Oxidation is named after oxygen, which is good at stripping electrons from molecules; to help you remember, think of oxygen as being caustic or destructive, like a paint-stripper. <\/span><\/p>\n<p><span lang=\"EN-US\">E.The reverse process is called <em>reduction<\/em>, which involves the addition of electrons.<\/span><\/p>\n<p><span lang=\"EN-US\"><br /><\/span><\/p>\n\n\n<p><span lang=\"EN-US\"><br /><\/span><\/p>", "options": [], "answer": "BEDAC", "answerLabel": "BEDAC", "solution": "<p><span lang=\"EN-US\"> B, which introduces the topic of the paragraph \"“ oxidation \"“, is clearly the first sentence. At first glance, it might seem as if D is the next sentence; but the DA link makes this unlikely. A continues the point made in D (that oxidation strips off electrons) and explains reduction based on the same metaphor. But reduction is introduced in E \"“ so E must precede both D and A. C fits in best as the last sentence, as it sums up the point made in the preceding sentences. Hence, BEDAC.<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 24, "sourceId": "217586", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<p><strong> <\/strong><\/p>\n<p><span lang=\"EN-IN\"><strong>Sentence: <\/strong>So, he created his own style of character portrayal.<\/span><\/p>\n<div><span lang=\"EN-IN\"><br /><\/span><\/div>\n<p><strong>Paragraph: <\/strong><\/p>\n<p>Chaucer was the first notable creator of characters in English literature. He had no model. _ (1) _ In his such works as Troilus and Crisede, The Prologue to the Canterbury Tales, The Canterbury Tales, The Legend of Good Women, Chaucer created some unforgettable characters and gave the picture of his age. _ (2) _ His art of characterization is specially marked by three things namely realism, types and individuals and wit and humour.  He is very realistic in the portrayal of his age as well as his characters. _ (3) _ His realism is particularly evident in his The Prologue to The Canterbury Tales and The Canterbury Tales. In these works, he gave a minute and comprehensive picture of the English society of the fourteenth century. _ (4) _The pilgrims, whom Chaucer describes in the Prologue, are the living characters in the great drama of the social life of the period. In this way he realistically describes the social and religious condition of his age. <\/p>", "options": ["<p><span lang=\"EN-IN\">Option 1<\/span><\/p>", "<p><span lang=\"EN-IN\">Option 2<\/span><\/p>", "<p><span lang=\"EN-IN\">Option 3<\/span><\/p>", "<p><span lang=\"EN-IN\">Option 4<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p>Avoid the blanks and read the paragraph. The blank at option 1 needs an outcome of his action of not choosing any model to define a character. In that case he must have built his own characters and their traits which were unique. The statements fit here perfectly. Hence, <strong>answer is Option 1<\/strong>.<\/p>\n<p>Option 2: Eliminated as the preceding line does not give reason to his own style of character formation but rather examples of character he had formed.<\/p>\n<p>Option 3: Eliminated as the previous line praises the characters in terms of he has formed cannot be followed by how he formed the character which has nothing to do with age.<\/p>\n<p>Option 4:  It is out of context as the former line speaks about the real depiction of society in a particular era cannot have unique characters created as a follow up sentence.<\/p>\n<p>Hence, [1].<\/p>", "topic": "Paragraph Completion"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;
function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
