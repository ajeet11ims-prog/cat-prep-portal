<script type="application/json" id="test-data">{"testNumber": 21, "simcat": 6, "minutes": 40, "questions": [{"number": 1, "sourceId": "84902", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">It was possible for Aristotle,<\/span><span lang=\"EN-US\">starting from the premise that a man, being actually cultured, may <em>also <\/em>become literate, to ask whether there is a necessary or merely an accidental connection of literacy with culture. Such a question can hardly arise for us, to whom illiteracy implies, as a matter of course, ignorance, backwardness, unfitness for self-government: for us, unlettered peoples are uncivilized peoples, and vice versa.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">As against the complacent prejudice, there is no necessary connection of literacy with culture, and that to impose our literacy (and our contemporary \"literature\") upon a cultured but illiterate people is to destroy their culture in the name of our own. For the sake of brevity we shall assume without argument that \"culture\" implies an ideal quality and a good form that can be realized by all men irrespective of condition: and, since we are treating of culture chiefly as expressed in words, we shall identify culture with \"poetry\"; not having in view the kind of poetry that nowadays babbles of green fields or that merely reflects social behavior or our private reactions to passing events, but with reference to that whole class of prophetic literature that includes the Bible, the Vedas, the Edda, the great epics. Of these \"books\" many existed long before they were written down, many have never been written down, and others have been or will be lost.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">While the merely literate are often very proud of their literacy, such as it is, it is only by men who are \"not only literate but also cultured\" that it has been widely recognized that \"letters\" at their best are only a means to an end and never an end in themselves, or, indeed, that \"the letter kills.\" A \"literary\" man, if ever there was one, the late Professor G. L. Kittredge writes: \"The ability of oral tradition to transmit great masses of verse for hundreds of years is proved and admitted. To this oral literature, education is no friend. When a nation begins to read, what was once the possession of the folk as a whole, becomes the heritage of the illiterate only, and soon, unless it is gathered up by the antiquary, vanishes altogether.\" Mark, too, that this oral literature once belonged \"to the whole people, the community whose intellectual interests are the same from the top of the social structure to the bottom,\" while in the reading society it is accessible only to antiquaries, and is no longer bound up with everyday life. A point of further importance is that the traditional oral literatures interested not only all <em>classes<\/em>, but also all <em>ages <\/em>of the population, while the books that are nowadays written expressly \"for children\" are such as no mature mind could tolerate; it is now only the comic strips that appeal alike to children who have been given nothing better and at the same time to \"adults\" who have never grown up. <\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">A master who can himself not only read, but also <em>write <\/em>good classical Latin and Greek, remarks that \"there is no doubt of the quantitative increase in literacy of a kind, and amid the general satisfaction that something is being multiplied it escapes enquiry whether the something is profit or deficit.\" He is discussing only the \"worst effects\" of enforced literacy, and concludes: \"Learning and wisdom have often been divided; perhaps the clearest result of modern literacy has been to maintain and enlarge the gulf.\"<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following is the primary purpose of the passage?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">To advocate a return to the oral traditions as a way of creating a purer culture and achieving truer wisdom.<\/span><\/p>", "<p><span lang=\"EN-US\">To argue that contemporary notions about the cultural superiority of literate people over the illiterate are grossly misplaced.<\/span><\/p>", "<p><span lang=\"EN-US\">To argue against the imposition of literacy by bringing to light its withering effects on indigenous culture, traditions and wisdom.<\/span><\/p>", "<p><span lang=\"EN-US\">To outline the effect of literacy on indigenous people and argue for a culture that is inclusive of oral traditions.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">The central idea that the author puts forth is that literacy does not bear any relationship whatsoever with true culture; far from making an indigenous people cultured, it robs them of their own culture, tradition and wisdom. The author is not anti-literacy; right from the first paragraph he is solely concerned with countering the common notion that <em>illiteracy implies, as a matter of course, ignorance, backwardness, unfitness for self-government: for us, unlettered peoples are uncivilized peoples, and vice versa<\/em>. Therefore option (3) is incorrect. Option (1) is incorrect since the author never advocates this. Option (4) is incorrect since the author is not arguing for an inclusive culture. Option (2) correctly states the primary purpose. Hence, (2).<\/span><\/p>", "topic": "Primary Purpose"}, {"number": 2, "sourceId": "84903", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">It was possible for Aristotle,<\/span><span lang=\"EN-US\">starting from the premise that a man, being actually cultured, may <em>also <\/em>become literate, to ask whether there is a necessary or merely an accidental connection of literacy with culture. Such a question can hardly arise for us, to whom illiteracy implies, as a matter of course, ignorance, backwardness, unfitness for self-government: for us, unlettered peoples are uncivilized peoples, and vice versa.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">As against the complacent prejudice, there is no necessary connection of literacy with culture, and that to impose our literacy (and our contemporary \"literature\") upon a cultured but illiterate people is to destroy their culture in the name of our own. For the sake of brevity we shall assume without argument that \"culture\" implies an ideal quality and a good form that can be realized by all men irrespective of condition: and, since we are treating of culture chiefly as expressed in words, we shall identify culture with \"poetry\"; not having in view the kind of poetry that nowadays babbles of green fields or that merely reflects social behavior or our private reactions to passing events, but with reference to that whole class of prophetic literature that includes the Bible, the Vedas, the Edda, the great epics. Of these \"books\" many existed long before they were written down, many have never been written down, and others have been or will be lost.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">While the merely literate are often very proud of their literacy, such as it is, it is only by men who are \"not only literate but also cultured\" that it has been widely recognized that \"letters\" at their best are only a means to an end and never an end in themselves, or, indeed, that \"the letter kills.\" A \"literary\" man, if ever there was one, the late Professor G. L. Kittredge writes: \"The ability of oral tradition to transmit great masses of verse for hundreds of years is proved and admitted. To this oral literature, education is no friend. When a nation begins to read, what was once the possession of the folk as a whole, becomes the heritage of the illiterate only, and soon, unless it is gathered up by the antiquary, vanishes altogether.\" Mark, too, that this oral literature once belonged \"to the whole people, the community whose intellectual interests are the same from the top of the social structure to the bottom,\" while in the reading society it is accessible only to antiquaries, and is no longer bound up with everyday life. A point of further importance is that the traditional oral literatures interested not only all <em>classes<\/em>, but also all <em>ages <\/em>of the population, while the books that are nowadays written expressly \"for children\" are such as no mature mind could tolerate; it is now only the comic strips that appeal alike to children who have been given nothing better and at the same time to \"adults\" who have never grown up. <\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">A master who can himself not only read, but also <em>write <\/em>good classical Latin and Greek, remarks that \"there is no doubt of the quantitative increase in literacy of a kind, and amid the general satisfaction that something is being multiplied it escapes enquiry whether the something is profit or deficit.\" He is discussing only the \"worst effects\" of enforced literacy, and concludes: \"Learning and wisdom have often been divided; perhaps the clearest result of modern literacy has been to maintain and enlarge the gulf.\"<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p>The author clearly defines what he means by culture in order to.<\/p>\n<p>I.     show that culture predates the invention of writing.<\/p>\n<p>II.    distinguish what is generally considered to be culture from what culture truly is.<\/p>\n<p>III.   demonstrate the superiority of oral literature over contemporary literature.<\/p>", "options": ["<p><span lang=\"EN-US\">Only I<\/span><\/p>", "<p><span lang=\"EN-US\">Only III<\/span><\/p>", "<p><span lang=\"EN-US\">Both I and II<\/span><\/p>", "<p><span lang=\"EN-US\">I, II and III<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">Throughout the second paragraph, the author argues that literacy has no necessary connection with culture. He takes the example of poetry like the Bible, the Vedas, etc. to show that culture existed before writing, as these epics existed before they were written down. Through the example, he also clarifies what culture truly is. Thus, I and II are correct. III is not the author's concern at all. Hence, (3).<\/span><\/p>", "topic": "Specific Detail"}, {"number": 3, "sourceId": "84904", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">It was possible for Aristotle,<\/span><span lang=\"EN-US\">starting from the premise that a man, being actually cultured, may <em>also <\/em>become literate, to ask whether there is a necessary or merely an accidental connection of literacy with culture. Such a question can hardly arise for us, to whom illiteracy implies, as a matter of course, ignorance, backwardness, unfitness for self-government: for us, unlettered peoples are uncivilized peoples, and vice versa.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">As against the complacent prejudice, there is no necessary connection of literacy with culture, and that to impose our literacy (and our contemporary \"literature\") upon a cultured but illiterate people is to destroy their culture in the name of our own. For the sake of brevity we shall assume without argument that \"culture\" implies an ideal quality and a good form that can be realized by all men irrespective of condition: and, since we are treating of culture chiefly as expressed in words, we shall identify culture with \"poetry\"; not having in view the kind of poetry that nowadays babbles of green fields or that merely reflects social behavior or our private reactions to passing events, but with reference to that whole class of prophetic literature that includes the Bible, the Vedas, the Edda, the great epics. Of these \"books\" many existed long before they were written down, many have never been written down, and others have been or will be lost.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">While the merely literate are often very proud of their literacy, such as it is, it is only by men who are \"not only literate but also cultured\" that it has been widely recognized that \"letters\" at their best are only a means to an end and never an end in themselves, or, indeed, that \"the letter kills.\" A \"literary\" man, if ever there was one, the late Professor G. L. Kittredge writes: \"The ability of oral tradition to transmit great masses of verse for hundreds of years is proved and admitted. To this oral literature, education is no friend. When a nation begins to read, what was once the possession of the folk as a whole, becomes the heritage of the illiterate only, and soon, unless it is gathered up by the antiquary, vanishes altogether.\" Mark, too, that this oral literature once belonged \"to the whole people, the community whose intellectual interests are the same from the top of the social structure to the bottom,\" while in the reading society it is accessible only to antiquaries, and is no longer bound up with everyday life. A point of further importance is that the traditional oral literatures interested not only all <em>classes<\/em>, but also all <em>ages <\/em>of the population, while the books that are nowadays written expressly \"for children\" are such as no mature mind could tolerate; it is now only the comic strips that appeal alike to children who have been given nothing better and at the same time to \"adults\" who have never grown up. <\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">A master who can himself not only read, but also <em>write <\/em>good classical Latin and Greek, remarks that \"there is no doubt of the quantitative increase in literacy of a kind, and amid the general satisfaction that something is being multiplied it escapes enquiry whether the something is profit or deficit.\" He is discussing only the \"worst effects\" of enforced literacy, and concludes: \"Learning and wisdom have often been divided; perhaps the clearest result of modern literacy has been to maintain and enlarge the gulf.\"<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p>Which of the following does the passage suggest about the state of culture before and after people learn or are forced to learn to read and write?<\/p>\n<p>I.     From being homogenous, culture becomes stratified along the lines of age and literacy levels.<\/p>\n<p>II.    Literature, accessed and created through written form becomes dominant, while oral traditions perish, unless conscientiously preserved.<\/p>\n<p>III.   Oral traditions no longer have any organic relationship to everyday life and are reduced to becoming relics.<\/p>", "options": ["<p><span lang=\"EN-US\">Only I<\/span><\/p>", "<p><span lang=\"EN-US\">Only III<\/span><\/p>", "<p><span lang=\"EN-US\">Both I and II<\/span><\/p>", "<p><span lang=\"EN-US\">I, II and III<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p>When a nation begins to read, what was once the possession of the folk as a whole, becomes the heritage of the illiterate only. From this sentence, it is clear that culture is divided along the lines of literacy; later the author says, oral literatures interested not only all classes, but also all ages of the population; while the books that are nowadays written. Statement I combines both these arguments. Oral literature once belonged \"to the whole people, the community whose intellectual interests are the same from the top of the social structure to the bottom,\" while in the reading society it is accessible only to antiquaries, and is no longer bound up with everyday life.<\/p>\n<p><span lang=\"EN-US\">The next two statements are implied by the above sentence; an antiquary is a person who collects and preserves things belonging to a different time-period, thus the things he collects and preserves, in this case oral traditions, become relics or surviving things from the past. Hence, (4).<\/span><\/p>", "topic": "Application Question"}, {"number": 4, "sourceId": "84905", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">In evolutionary biology, an organism is said to behave altruistically when its behaviour benefits other organisms, at a cost to itself. The costs and benefits are measured in terms of <em>reproductive fitness<\/em>, or expected number of offspring. So by behaving altruistically, an organism reduces the number of offspring it is likely to produce itself, but boosts the number that other organisms are likely to produce. This biological notion of altruism is not identical to the everyday concept. In everyday parlance, an action would only be called 'altruistic' if it was done with the conscious intention of helping another. But in the biological sense there is no such requirement. Indeed, some of the most interesting examples of biological altruism are found among creatures that are (presumably) not capable of conscious thought at all, e.g. insects. For the biologist, it is the consequences of an action for reproductive fitness that determine whether the action counts as altruistic, not the intentions, if any, with which the action is performed.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Altruistic behaviour is common throughout the animal kingdom, particularly in species with complex social structures. For example, vampire bats regularly regurgitate blood and donate it to other members of their group who have failed to feed that night, ensuring they do not starve. In numerous bird species, a breeding pair receives help in raising its young from other 'helper' birds, who protect the nest from predators and help to feed the fledglings. Vervet monkeys give alarm calls to warn fellow monkeys of the presence of predators, even though in doing so they attract attention to themselves, increasing their personal chance of being attacked. In social insect colonies (ants, wasps, bees and termites), sterile workers devote their whole lives to caring for the queen, constructing and protecting the nest, foraging for food, and tending the larvae. Such behaviour is maximally altruistic: sterile workers obviously do not leave any offspring of their own – so have personal fitness of zero – but their actions greatly assist the reproductive efforts of the queen.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">From a Darwinian viewpoint, the existence of altruism in nature is at first sight puzzling, as Darwin himself realized. Natural selection leads us to expect animals to behave in ways that increase their <em>own<\/em> chances of survival and reproduction, not those of others. But by behaving altruistically an animal reduces its own fitness, so should be at a selective disadvantage vis-à-vis one which behaves selfishly. To see this, imagine that some members of a group of Vervet monkeys give alarm calls when they see predators, but others do not. Other things being equal, the latter will have an advantage. By selfishly refusing to give an alarm call, a monkey can reduce the chance that it will itself be attacked, while at the same time benefiting from the alarm calls of others. So we should expect natural selection to favour those monkeys that do not give alarm calls over those that do. But this raises an immediate puzzle. How did the alarm-calling behaviour evolve in the first place, and why has it not been eliminated by natural selection? How can the existence of altruism be reconciled with basic Darwinian principles?<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following is the primary purpose of the passage?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">To highlight the shortcomings in the definition of altruism according to evolutionary biology by pointing out its contradictions with Darwinian principles of altruism.<\/span><\/p>", "<p><span lang=\"EN-US\">To argue for a need to re-evaluate the definition of altruism according to evolutionary biology since it is inconsistent with Darwinian principles of natural selection.<\/span><\/p>", "<p><span lang=\"EN-US\">To illustrate the definition of altruism according to evolutionary biology and point out its contradiction with Darwinian principles of natural selection.<\/span><\/p>", "<p><span lang=\"EN-US\">To demonstrate that the Darwinian principles of natural selection are inconsistent since they do not explain altruistic behaviour as defined by evolutionary biology.<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">The passage starts by defining altruistic behaviour according to evolutionary biology; it then proceeds to give examples of the same in the second paragraph. In the third paragraph it shows how Darwinism and altruistic behaviour are inconsistent with each other. Option (3) best captures this. The author is not arguing for or against the principles of Darwinism or the definition of altruism; he/she is merely describing altruistic behaviour and outlining the inconsistency between the two. Thus, (2) and (4) are negated. (1), though very close to (3), is ruled out because the author does not<strong> highlight<\/strong> the shortcomings in the definition of altruism. Hence, (3).<\/span><\/p>", "topic": "Primary Purpose"}, {"number": 5, "sourceId": "84906", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">In evolutionary biology, an organism is said to behave altruistically when its behaviour benefits other organisms, at a cost to itself. The costs and benefits are measured in terms of <em>reproductive fitness<\/em>, or expected number of offspring. So by behaving altruistically, an organism reduces the number of offspring it is likely to produce itself, but boosts the number that other organisms are likely to produce. This biological notion of altruism is not identical to the everyday concept. In everyday parlance, an action would only be called 'altruistic' if it was done with the conscious intention of helping another. But in the biological sense there is no such requirement. Indeed, some of the most interesting examples of biological altruism are found among creatures that are (presumably) not capable of conscious thought at all, e.g. insects. For the biologist, it is the consequences of an action for reproductive fitness that determine whether the action counts as altruistic, not the intentions, if any, with which the action is performed.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Altruistic behaviour is common throughout the animal kingdom, particularly in species with complex social structures. For example, vampire bats regularly regurgitate blood and donate it to other members of their group who have failed to feed that night, ensuring they do not starve. In numerous bird species, a breeding pair receives help in raising its young from other 'helper' birds, who protect the nest from predators and help to feed the fledglings. Vervet monkeys give alarm calls to warn fellow monkeys of the presence of predators, even though in doing so they attract attention to themselves, increasing their personal chance of being attacked. In social insect colonies (ants, wasps, bees and termites), sterile workers devote their whole lives to caring for the queen, constructing and protecting the nest, foraging for food, and tending the larvae. Such behaviour is maximally altruistic: sterile workers obviously do not leave any offspring of their own – so have personal fitness of zero – but their actions greatly assist the reproductive efforts of the queen.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">From a Darwinian viewpoint, the existence of altruism in nature is at first sight puzzling, as Darwin himself realized. Natural selection leads us to expect animals to behave in ways that increase their <em>own<\/em> chances of survival and reproduction, not those of others. But by behaving altruistically an animal reduces its own fitness, so should be at a selective disadvantage vis-à-vis one which behaves selfishly. To see this, imagine that some members of a group of Vervet monkeys give alarm calls when they see predators, but others do not. Other things being equal, the latter will have an advantage. By selfishly refusing to give an alarm call, a monkey can reduce the chance that it will itself be attacked, while at the same time benefiting from the alarm calls of others. So we should expect natural selection to favour those monkeys that do not give alarm calls over those that do. But this raises an immediate puzzle. How did the alarm-calling behaviour evolve in the first place, and why has it not been eliminated by natural selection? How can the existence of altruism be reconciled with basic Darwinian principles?<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p>Which of the following statements are correct according to the passage?<\/p>\n<p>I.     In several bird species, the whole community, rather than parents, looks after the needs of the children.<\/p>\n<p>II.    Vervet monkeys are the most altruistic of all monkey species and several instances of their altruism have been recorded.<\/p>\n<p>III.   Some bees spend their whole life caring for the queen and consequently go sterile.<\/p>", "options": ["<p><span lang=\"EN-US\">Both I & II<\/span><\/p>", "<p><span lang=\"EN-US\">Both I & III<\/span><\/p>", "<p><span lang=\"EN-US\">Only III<\/span><\/p>", "<p><span lang=\"EN-US\">None of the statements are correct<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p>Statement I is incorrect since the passage mentions that in bird communities, the parents take the help of other \"helper\" birds (not the whole community). Statement II is incorrect since the passage does not compare the altruism of Vervet monkeys with that of other monkeys. Statement III is incorrect since it is the sterile bees who care for the queen; caring for queen does not make them sterile. Hence, (4).<\/p>", "topic": "Specific Detail"}, {"number": 6, "sourceId": "84907", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">In evolutionary biology, an organism is said to behave altruistically when its behaviour benefits other organisms, at a cost to itself. The costs and benefits are measured in terms of <em>reproductive fitness<\/em>, or expected number of offspring. So by behaving altruistically, an organism reduces the number of offspring it is likely to produce itself, but boosts the number that other organisms are likely to produce. This biological notion of altruism is not identical to the everyday concept. In everyday parlance, an action would only be called 'altruistic' if it was done with the conscious intention of helping another. But in the biological sense there is no such requirement. Indeed, some of the most interesting examples of biological altruism are found among creatures that are (presumably) not capable of conscious thought at all, e.g. insects. For the biologist, it is the consequences of an action for reproductive fitness that determine whether the action counts as altruistic, not the intentions, if any, with which the action is performed.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Altruistic behaviour is common throughout the animal kingdom, particularly in species with complex social structures. For example, vampire bats regularly regurgitate blood and donate it to other members of their group who have failed to feed that night, ensuring they do not starve. In numerous bird species, a breeding pair receives help in raising its young from other 'helper' birds, who protect the nest from predators and help to feed the fledglings. Vervet monkeys give alarm calls to warn fellow monkeys of the presence of predators, even though in doing so they attract attention to themselves, increasing their personal chance of being attacked. In social insect colonies (ants, wasps, bees and termites), sterile workers devote their whole lives to caring for the queen, constructing and protecting the nest, foraging for food, and tending the larvae. Such behaviour is maximally altruistic: sterile workers obviously do not leave any offspring of their own – so have personal fitness of zero – but their actions greatly assist the reproductive efforts of the queen.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">From a Darwinian viewpoint, the existence of altruism in nature is at first sight puzzling, as Darwin himself realized. Natural selection leads us to expect animals to behave in ways that increase their <em>own<\/em> chances of survival and reproduction, not those of others. But by behaving altruistically an animal reduces its own fitness, so should be at a selective disadvantage vis-à-vis one which behaves selfishly. To see this, imagine that some members of a group of Vervet monkeys give alarm calls when they see predators, but others do not. Other things being equal, the latter will have an advantage. By selfishly refusing to give an alarm call, a monkey can reduce the chance that it will itself be attacked, while at the same time benefiting from the alarm calls of others. So we should expect natural selection to favour those monkeys that do not give alarm calls over those that do. But this raises an immediate puzzle. How did the alarm-calling behaviour evolve in the first place, and why has it not been eliminated by natural selection? How can the existence of altruism be reconciled with basic Darwinian principles?<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p>Which of following statements, if true, reconciles the conflict between Darwinism and altruistic behaviour as explained in the passage?<\/p>\n<p>I.     Altruistic behaviours that help other species have found to be consistent with the modern theories of evolution.<\/p>\n<p>II.    Altruism and natural selection work to ensure survival of a species as a whole and not its individual organisms.<\/p>\n<p>III.   Natural selection does not retain or eliminate behavioural patterns but it limited only to physical characteristics.<\/p>", "options": ["<p><span lang=\"EN-US\">Only<span>   <\/span>I<\/span><\/p>", "<p><span lang=\"EN-US\">Only II<\/span><\/p>", "<p><span lang=\"EN-US\">Only III<\/span><\/p>", "<p><span lang=\"EN-US\">Both II & III<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">The passage says that natural selection eliminates behaviours that do not increase an organism's own chances of survival. If it is true that natural selection is not concerned with individual organisms but with a species as a whole then the conflict is reconciled since the altruistic behaviour, like the alarm calling behaviour of the Vervet monkeys increases the chances of survival of the species as a whole. Statement III states that natural selection is concerned only with physical not behavioural characteristics, which means that altruistic behaviour is not inconsistent with Darwinian principles. In fact, that leaves no scope for conflict between Darwinism and altruistic behaviour – their spheres are completely separate. Hence, (4).<\/span><\/p>", "topic": "Application Question"}, {"number": 7, "sourceId": "84908", "type": "mcq", "passage": "<p><span lang=\"EN-US\">What is history? Most prosaically, it is the human past and our organized representations of that past. We can of course write about the chronology of non-human events\"”the history of the solar system, the history of the earth's environment over a billion-year expanse of time. But the key issues in the philosophy of history arise in our representations of the human past. And history is fascinating for us, because, in Marx's words, \"Men make their own history, but not in circumstances of their own choosing\". That is to say: history reflects agency\"”the choices by individuals and groups; and it reflects constraining structures and circumstances. So historical outcomes are neither causally determined nor entirely plastic and accidental. Therefore it is open to the historian to attempt to discover the historical circumstances that induced and constrained historical agents to act in one way rather than another\"”thus bringing about a historical outcome of interest. So we might begin by saying that history is a temporally ordered sequence of events and processes involving human doings, within which there are interconnections of causality, structure, and action, within which there is the play of accident, contingency, and outside forces.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">But we might also say: there is no such thing as \"history in general.\"The description just provided suggests that there is a comprehensible collection of historical processes that might be characterized as a \"total\" human history: population growth, urbanization, technological innovation, economic differentiation, the growth of knowledge and culture, etc. But this impression is highly misleading. It suggests a degree of order and structure that history does not possess. There are only specific histories: histories of various conditions or circumstances of interest to us. Historical space is dense: at any given time there are countless human actions and social processes underway in the world. So to single out the history of something specific–agriculture, the French Revolution, modern science, Islam–is unavoidably to select, from the full complexity of events and actions, a limited set of related historical features that will be traced through a process of development. And this in turn raises the point that \"history\" depends partly on \"what occurred\" and partly on \"what we are interested in\". This point does not undercut the objectivity of judgments about the past. Events and actions happened in the past, separate from our interest in them. But organizing them into a narrative about \"religious awakening\" or \"formation of the absolutist state\" imposes an interpretive structure on them that depends inherently on the observer's interests. There is no such thing as \"perspective-free history\".<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following is the central idea of the passage?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Historical studies are misleading and are only valid when applied to specific contexts and viewed through specific lenses.<\/span><\/p>", "<p><span lang=\"EN-US\">There is no such thing as a universal history since it is impossible to structure and order specific histories occurring simultaneously in different circumstances.<\/span><\/p>", "<p><span lang=\"EN-US\">Human beings make their own history but they do so within the bounded limits of the constraints placed on them by societal structure and circumstances.<\/span><\/p>", "<p><span lang=\"EN-US\">History is constituted by historical interpretation and traditions of historical interest\"”even though the underlying happenings themselves are not.<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">The passage deals with the question of what history is and analyses the process of trying to look at the past. It concludes by saying that history, which is actually composed of a large number of complex events, depends on the perspective with which we tend to look at the past and the particular context since there can be no universal history. Option (4) best captures this. Options (2) and (3) limit themselves to specific arguments and do not capture the central idea of the passage. Option (1) does not make a reference to history as a whole and limits itself to historical studies. Hence, (4).<\/span><\/p>", "topic": "Central Idea"}, {"number": 8, "sourceId": "84909", "type": "mcq", "passage": "<p><span lang=\"EN-US\">What is history? Most prosaically, it is the human past and our organized representations of that past. We can of course write about the chronology of non-human events\"”the history of the solar system, the history of the earth's environment over a billion-year expanse of time. But the key issues in the philosophy of history arise in our representations of the human past. And history is fascinating for us, because, in Marx's words, \"Men make their own history, but not in circumstances of their own choosing\". That is to say: history reflects agency\"”the choices by individuals and groups; and it reflects constraining structures and circumstances. So historical outcomes are neither causally determined nor entirely plastic and accidental. Therefore it is open to the historian to attempt to discover the historical circumstances that induced and constrained historical agents to act in one way rather than another\"”thus bringing about a historical outcome of interest. So we might begin by saying that history is a temporally ordered sequence of events and processes involving human doings, within which there are interconnections of causality, structure, and action, within which there is the play of accident, contingency, and outside forces.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">But we might also say: there is no such thing as \"history in general.\"The description just provided suggests that there is a comprehensible collection of historical processes that might be characterized as a \"total\" human history: population growth, urbanization, technological innovation, economic differentiation, the growth of knowledge and culture, etc. But this impression is highly misleading. It suggests a degree of order and structure that history does not possess. There are only specific histories: histories of various conditions or circumstances of interest to us. Historical space is dense: at any given time there are countless human actions and social processes underway in the world. So to single out the history of something specific–agriculture, the French Revolution, modern science, Islam–is unavoidably to select, from the full complexity of events and actions, a limited set of related historical features that will be traced through a process of development. And this in turn raises the point that \"history\" depends partly on \"what occurred\" and partly on \"what we are interested in\". This point does not undercut the objectivity of judgments about the past. Events and actions happened in the past, separate from our interest in them. But organizing them into a narrative about \"religious awakening\" or \"formation of the absolutist state\" imposes an interpretive structure on them that depends inherently on the observer's interests. There is no such thing as \"perspective-free history\".<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following is the reason why the author suggests that there is no such thing as \"history in general\"?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">The idea of a history in general means imposing a non-existent order and causality on a large number of complex human actions.<\/span><\/p>", "<p><span lang=\"EN-US\">The idea of a history in general foregoes the accidental and the unrelated in favour of a narrative based on temporal and causal order.<\/span><\/p>", "<p><span lang=\"EN-US\">A history in general is impossible to define since there can be no causal relationship between people and events belonging to different times, places and contexts.<\/span><\/p>", "<p><span lang=\"EN-US\">A history in general presupposes an objective view of events, which is possible only within the framework of our interpretive structure.<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\">The key reason is stated in the beginning of the second paragraph, <em>it suggests a degree of order and structure that history does not possess….Historical space is dense: at any given time there are countless human actions and social processes underway in the world<\/em>. Option (1) best captures this.<span> <\/span>Option (2) is incorrect since it does not state that order is non-existent and it does not refer to the large number of human actions. Options (3) and (4) are later arguments and not the core reason why the author thinks that there can be no \"history in general\". Hence, (1).<\/span><\/p>", "topic": "Specific Detail"}, {"number": 9, "sourceId": "84910", "type": "mcq", "passage": "<p><span lang=\"EN-US\">What is history? Most prosaically, it is the human past and our organized representations of that past. We can of course write about the chronology of non-human events\"”the history of the solar system, the history of the earth's environment over a billion-year expanse of time. But the key issues in the philosophy of history arise in our representations of the human past. And history is fascinating for us, because, in Marx's words, \"Men make their own history, but not in circumstances of their own choosing\". That is to say: history reflects agency\"”the choices by individuals and groups; and it reflects constraining structures and circumstances. So historical outcomes are neither causally determined nor entirely plastic and accidental. Therefore it is open to the historian to attempt to discover the historical circumstances that induced and constrained historical agents to act in one way rather than another\"”thus bringing about a historical outcome of interest. So we might begin by saying that history is a temporally ordered sequence of events and processes involving human doings, within which there are interconnections of causality, structure, and action, within which there is the play of accident, contingency, and outside forces.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">But we might also say: there is no such thing as \"history in general.\"The description just provided suggests that there is a comprehensible collection of historical processes that might be characterized as a \"total\" human history: population growth, urbanization, technological innovation, economic differentiation, the growth of knowledge and culture, etc. But this impression is highly misleading. It suggests a degree of order and structure that history does not possess. There are only specific histories: histories of various conditions or circumstances of interest to us. Historical space is dense: at any given time there are countless human actions and social processes underway in the world. So to single out the history of something specific–agriculture, the French Revolution, modern science, Islam–is unavoidably to select, from the full complexity of events and actions, a limited set of related historical features that will be traced through a process of development. And this in turn raises the point that \"history\" depends partly on \"what occurred\" and partly on \"what we are interested in\". This point does not undercut the objectivity of judgments about the past. Events and actions happened in the past, separate from our interest in them. But organizing them into a narrative about \"religious awakening\" or \"formation of the absolutist state\" imposes an interpretive structure on them that depends inherently on the observer's interests. There is no such thing as \"perspective-free history\".<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p> Which of the following statements is true according to the passage?<\/p>\n<p>I.     Our judgements about the past cannot be objective since they are always based on the perspective through which we view the past.<\/p>\n<p>II.    The actual events in the past are independent of the interpretive structure through which we want to view them.<\/p>\n<p>III.   Historical studies can never capture events in all of their complexity.<\/p>", "options": ["<p><span lang=\"EN-US\">Only I<\/span><\/p>", "<p><span lang=\"EN-US\">Only II<\/span><\/p>", "<p><span lang=\"EN-US\">Both II and III<\/span><\/p>", "<p><span lang=\"EN-US\">Both I and II<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">Statement I is incorrect since the passage clearly states, <em>\"history\" depends partly on \"what occurred\" and partly on \"what we are interested in.\" That does not undercut the objectivity of judgements about the past. <\/em>Statements II and III are clearly stated in the second half of the 2nd paragraph. Refer to \"So to single out the history of ...\"perspective-free history\".\" Hence, (3).<\/span><\/p>", "topic": "Application Question"}, {"number": 10, "sourceId": "84911", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">Colonialism is not a modern phenomenon. World history is full of examples of one society gradually expanding by incorporating adjacent territory and settling its people on newly conquered territory. The ancient Greeks set up colonies as did the Romans, the Moors, and the Ottomans, to name just a few of the most notorious examples. Colonialism, then, is not restricted to a specific time or place. Nevertheless, in the sixteenth century, colonialism changed decisively because of technological developments in navigation that began to connect more remote parts of the world. Fast sailing ships made it possible to reach distant ports while sustaining closer ties between the centre and colonies. Thus, the modern European colonial project emerged when it became possible to move large numbers of people across the ocean and to maintain political sovereignty in spite of geographical dispersion. <\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The difficulty of defining colonialism stems from the fact that the term is often used as a synonym for imperialism. Both colonialism and imperialism were forms of conquest that were expected to benefit Europe economically and strategically. The term colonialism is frequently used to describe the settlement of places such as North America, Australia, New Zealand, Algeria and Brazil that were controlled by a large population of permanent European residents. The term imperialism often describes cases in which a foreign government administers a territory without significant settlement; typical examples include the scramble for Africa in the late nineteenth century and the American domination of the Philippines and Puerto Rico. The distinction between the two, however, is not entirely consistent in the literature. Some scholars distinguish between colonies for settlement and colonies for economic exploitation. Others use the term colonialism to describe dependencies that are directly governed by a foreign nation and contrast this with imperialism, which involves indirect forms of domination.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The confusion about the meaning of the term imperialism reflects the way that the concept has changed over time. Although the English word imperialism was not commonly used before the nineteenth century, Elizabethans already described the United Kingdom as \"the British Empire\". As Britain began to acquire overseas dependencies, the concept of empire was employed more frequently. Thus, the traditional understanding of imperialism was a system of military domination and sovereignty over territories. The day-to-day work of government might be exercised indirectly through local assemblies or indigenous rulers who paid tribute but sovereignty rested with the British. The shift away from this traditional understanding of empire was influenced by the Leninist analysis of imperialism as a system oriented towards economic exploitation. According to Lenin, imperialism was the necessary and inevitable result of the logic of accumulation in late capitalism. Thus, for Lenin and subsequent Marxists, imperialism described a historical stage of capitalism rather than a trans-historical practice of political and military domination. The lasting impact of the Marxist approach is apparent in contemporary debates about American imperialism, a term which usually means American economic hegemony, regardless of whether such power is exercised directly or indirectly.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\">Which of the following is the primary purpose of the passage?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">To show the similarities between colonialism and imperialism in practice despite the difference in their theoretical definitions.<\/span><\/p>", "<p><span lang=\"EN-US\">To argue that colonialism and imperialism have always gone hand in hand with military and economic exploitation.<\/span><\/p>", "<p><span lang=\"EN-US\">To explore the definitions of the terms colonialism and imperialism, their usage, evolution and inter-linkages.<\/span><\/p>", "<p><span lang=\"EN-US\">To argue that colonialism and imperialism are not new phenomena but have always existed since ancient times.<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">The passage deals with the evolution of the definitions of the terms colonialism and imperialism over a period of time and the relationship between the two terms. Option (3) best captures this. Option (1) is incorrect since the passage does not say that both terms are similar. Options (2) and (4) do not mention the definition of the terms. The author's tone is not at all argumentative. Hence, (3).<\/span><\/p>", "topic": "Primary Purpose"}, {"number": 11, "sourceId": "84912", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">Colonialism is not a modern phenomenon. World history is full of examples of one society gradually expanding by incorporating adjacent territory and settling its people on newly conquered territory. The ancient Greeks set up colonies as did the Romans, the Moors, and the Ottomans, to name just a few of the most notorious examples. Colonialism, then, is not restricted to a specific time or place. Nevertheless, in the sixteenth century, colonialism changed decisively because of technological developments in navigation that began to connect more remote parts of the world. Fast sailing ships made it possible to reach distant ports while sustaining closer ties between the centre and colonies. Thus, the modern European colonial project emerged when it became possible to move large numbers of people across the ocean and to maintain political sovereignty in spite of geographical dispersion. <\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The difficulty of defining colonialism stems from the fact that the term is often used as a synonym for imperialism. Both colonialism and imperialism were forms of conquest that were expected to benefit Europe economically and strategically. The term colonialism is frequently used to describe the settlement of places such as North America, Australia, New Zealand, Algeria and Brazil that were controlled by a large population of permanent European residents. The term imperialism often describes cases in which a foreign government administers a territory without significant settlement; typical examples include the scramble for Africa in the late nineteenth century and the American domination of the Philippines and Puerto Rico. The distinction between the two, however, is not entirely consistent in the literature. Some scholars distinguish between colonies for settlement and colonies for economic exploitation. Others use the term colonialism to describe dependencies that are directly governed by a foreign nation and contrast this with imperialism, which involves indirect forms of domination.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The confusion about the meaning of the term imperialism reflects the way that the concept has changed over time. Although the English word imperialism was not commonly used before the nineteenth century, Elizabethans already described the United Kingdom as \"the British Empire\". As Britain began to acquire overseas dependencies, the concept of empire was employed more frequently. Thus, the traditional understanding of imperialism was a system of military domination and sovereignty over territories. The day-to-day work of government might be exercised indirectly through local assemblies or indigenous rulers who paid tribute but sovereignty rested with the British. The shift away from this traditional understanding of empire was influenced by the Leninist analysis of imperialism as a system oriented towards economic exploitation. According to Lenin, imperialism was the necessary and inevitable result of the logic of accumulation in late capitalism. Thus, for Lenin and subsequent Marxists, imperialism described a historical stage of capitalism rather than a trans-historical practice of political and military domination. The lasting impact of the Marxist approach is apparent in contemporary debates about American imperialism, a term which usually means American economic hegemony, regardless of whether such power is exercised directly or indirectly.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p>Which of the following have been cited in the passage as the difference(s) between colonialism and imperialism?<\/p>\n<p>I.     Colonies are directly governed while imperialism involves indirect control.<\/p>\n<p>II.    Colonizers move and settle a large number of people from their own country into colonies while imperialism does not involve large settlement in colonies.<\/p>\n<p>III.   Unlike imperialism, colonialism involves only administrative control and not military control.<\/p>", "options": ["<p><span lang=\"EN-US\">Both I and II<\/span><\/p>", "<p><span lang=\"EN-US\">Both II and III<\/span><\/p>", "<p><span lang=\"EN-US\">Both I and III<\/span><\/p>", "<p><span lang=\"EN-US\">I, II and III<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\">Statements I and II are clearly stated in the second paragraph. Statement III is not mentioned in the passage. Hence, (1).<\/span><\/p>", "topic": "Specific Detail"}, {"number": 12, "sourceId": "84913", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">Colonialism is not a modern phenomenon. World history is full of examples of one society gradually expanding by incorporating adjacent territory and settling its people on newly conquered territory. The ancient Greeks set up colonies as did the Romans, the Moors, and the Ottomans, to name just a few of the most notorious examples. Colonialism, then, is not restricted to a specific time or place. Nevertheless, in the sixteenth century, colonialism changed decisively because of technological developments in navigation that began to connect more remote parts of the world. Fast sailing ships made it possible to reach distant ports while sustaining closer ties between the centre and colonies. Thus, the modern European colonial project emerged when it became possible to move large numbers of people across the ocean and to maintain political sovereignty in spite of geographical dispersion. <\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The difficulty of defining colonialism stems from the fact that the term is often used as a synonym for imperialism. Both colonialism and imperialism were forms of conquest that were expected to benefit Europe economically and strategically. The term colonialism is frequently used to describe the settlement of places such as North America, Australia, New Zealand, Algeria and Brazil that were controlled by a large population of permanent European residents. The term imperialism often describes cases in which a foreign government administers a territory without significant settlement; typical examples include the scramble for Africa in the late nineteenth century and the American domination of the Philippines and Puerto Rico. The distinction between the two, however, is not entirely consistent in the literature. Some scholars distinguish between colonies for settlement and colonies for economic exploitation. Others use the term colonialism to describe dependencies that are directly governed by a foreign nation and contrast this with imperialism, which involves indirect forms of domination.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The confusion about the meaning of the term imperialism reflects the way that the concept has changed over time. Although the English word imperialism was not commonly used before the nineteenth century, Elizabethans already described the United Kingdom as \"the British Empire\". As Britain began to acquire overseas dependencies, the concept of empire was employed more frequently. Thus, the traditional understanding of imperialism was a system of military domination and sovereignty over territories. The day-to-day work of government might be exercised indirectly through local assemblies or indigenous rulers who paid tribute but sovereignty rested with the British. The shift away from this traditional understanding of empire was influenced by the Leninist analysis of imperialism as a system oriented towards economic exploitation. According to Lenin, imperialism was the necessary and inevitable result of the logic of accumulation in late capitalism. Thus, for Lenin and subsequent Marxists, imperialism described a historical stage of capitalism rather than a trans-historical practice of political and military domination. The lasting impact of the Marxist approach is apparent in contemporary debates about American imperialism, a term which usually means American economic hegemony, regardless of whether such power is exercised directly or indirectly.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">According to the passage, how do the Marxist-Leninist analyses of imperialism differ from earlier definitions of imperialism?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">From the Marxist –Leninist perspective, imperialism was primarily an economic phe-nomenon and not a military one as per the earlier definitions.<\/span><\/p>", "<p><span lang=\"EN-US\">From the Marxist-Leninist perspective, imperialism was an outcome of capitalism and not a political- military domination as was believed earlier.<\/span><\/p>", "<p><span lang=\"EN-US\">While imperialism was traditionally viewed as being a political and military domination, from the Marxists-Leninist perspective, it was the domination of capitalism over communism.<\/span><\/p>", "<p><span lang=\"EN-US\">Traditional definitions of imperialism, unlike the Marxist-Leninist analyses, failed to take into account the American economic hegemony, which is a form of imperialism.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">The third paragraph clearly states that according to the Marxist-Leninist analyses, imperialism is an outcome of capitalism. Option (2) best states this. Option (1) is incorrect since it interchanges economic exploitation with economic phenomenon; also capitalism is not an economic phenomenon like inflation but a political/economic ideology. Option (3) introduces communism, which is not mentioned in the passage. Option (4) does not mention capitalism and talks of American economic hegemony, which is an example of the phenomenon described. Hence, (2).<\/span><\/p>", "topic": "Specific Detail"}, {"number": 13, "sourceId": "83455", "type": "mcq", "passage": "<p><span lang=\"EN-US\">Many extinct species – from the passenger pigeon to the woolly mammoth – might now be reclassified as 'bodily, but not genetically, extinct'. They're dead, but their DNA is recoverable from museum specimens and fossils, even those up to 200,000 years old. Thanks to new developments in genetic technology, that DNA may eventually bring the animals back to life.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">But why bring vanished creatures back to life? It will be expensive and difficult. It won't always succeed. Why even try? Why do we take enormous trouble to protect endangered species? The same reasons will apply to species brought back from extinction: to preserve biodiversity, to restore diminished ecosystems, to advance the science of preventing extinctions, and to undo the harm that humans have caused in the past. <\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Species brought back from extinction will be beacons of hope. Useful science will also emerge. Close examination of the genomes of extinct species can tell us much about what made them vulnerable in the first place. Were they in a bottleneck with too little genetic variability? How were they different from close relatives that survived? Living specimens will reveal even more. Techniques being developed for de-extinction will also be directly applicable to living species that are close to extinction. Tiny populations can have their genetic variability restored. A species with a genetic Achilles' heel might be totally cured with an adjustment introduced through cloning. For instance, the transmissible cancer on the faces of Tasmanian devils is thought to be caused by a single gene. That gene can be silenced in a generation of the animals released to the wild. The cancer would disappear in the wild soon after, because the immune animals won't transmit it, and animals with the immunity will out-reproduce the susceptible until the entire population is immune.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Some extinct species were important 'keystones' in their region. Restoring them would help restore a great deal of ecological richness. Woolly mammoths, for instance, were the dominant herbivore of the 'mammoth steppe' in the far north, once the largest biome on Earth. In their absence, the grasslands they helped sustain were replaced by species-poor tundra and boreal forest. Their return to the north would bring back carbon-fixing grass and reduce greenhouse-gas-releasing tundra. Similarly, the European aurochs (extinct since 1627) helped to keep forests across all of Europe and Asia mixed with bio-diverse meadows and grasslands.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The passenger pigeon was a keystone species for the whole eastern deciduous forest in North America, from the Mississippi to the Atlantic, from the U.S. Deep South clear up into Canada. Such animals can also serve as icons, flagship species inspiring the protection of a whole region. The prospect of bringing back the aurochs is helping to boost the vibrant European 're-wilding' movement to connect tracts of abandoned farmland into wildlife corridors spanning national boundaries. <\/span><\/p><p><span lang=\"EN-US\">The current generation of children will experience the return of some remarkable creatures in their lifetime. They will drag their parents to zoos to see the woolly mammoth and growing populations of captive-bred passenger pigeons, Carolina parakeets, Labrador ducks, and maybe even dodos. (Entrance fees at zoos provide a good deal of conservation funding, and zoos will be in the thick of extinct species revival and restoration.) <\/span><\/p><p><span lang=\"EN-US\">Humans killed off a lot of species over the last 10,000 years. Some resurrection is in order. A bit of redemption might come with it.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p>According to the information provided in the passage, which of the following would come true, if the woolly mammoth were to be revived?<\/p>\n<p>A.    Bringing back woolly mammoths would revive conservation funding by the increase in number of visitors to zoos.<\/p>\n<p>B.    Revival of the woolly mammoth would act as an example of reintroducing extinct species to revive bio-diversity in their respective habitats.<\/p>\n<p>C.    Woolly mammoths would bring back grasslands in the far north and reduce greenhouse-gas-releasing tundra and boreal forests.<\/p>\n<p>D.    Techniques being developed for de-extinction of the woolly mammoth would be directly applicable of living species that are close to extinction.<\/p>", "options": ["<p><span lang=\"EN-US\">Only C<\/span><\/p>", "<p><span lang=\"EN-US\">All of the above<\/span><\/p>", "<p><span lang=\"EN-US\">A, B and C<\/span><\/p>", "<p><span lang=\"EN-US\">A and C<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">Statement A is clear from the penultimate paragraph, which states that woolly mammoths and other species would lead to an increase in the number of visitors to zoos, and that entrance fees at zoos are a good source of conservation funding. Statement C is stated in the fourth paragraph. Statements B and D are points made for the revival of extinct species in general. So, they are applicable to the revival of woolly mammoths as well. So, all of the statements would be true. Hence, [2].<\/span><\/p>", "topic": "Application Question"}, {"number": 14, "sourceId": "83456", "type": "mcq", "passage": "<p><span lang=\"EN-US\">Many extinct species – from the passenger pigeon to the woolly mammoth – might now be reclassified as 'bodily, but not genetically, extinct'. They're dead, but their DNA is recoverable from museum specimens and fossils, even those up to 200,000 years old. Thanks to new developments in genetic technology, that DNA may eventually bring the animals back to life.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">But why bring vanished creatures back to life? It will be expensive and difficult. It won't always succeed. Why even try? Why do we take enormous trouble to protect endangered species? The same reasons will apply to species brought back from extinction: to preserve biodiversity, to restore diminished ecosystems, to advance the science of preventing extinctions, and to undo the harm that humans have caused in the past. <\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Species brought back from extinction will be beacons of hope. Useful science will also emerge. Close examination of the genomes of extinct species can tell us much about what made them vulnerable in the first place. Were they in a bottleneck with too little genetic variability? How were they different from close relatives that survived? Living specimens will reveal even more. Techniques being developed for de-extinction will also be directly applicable to living species that are close to extinction. Tiny populations can have their genetic variability restored. A species with a genetic Achilles' heel might be totally cured with an adjustment introduced through cloning. For instance, the transmissible cancer on the faces of Tasmanian devils is thought to be caused by a single gene. That gene can be silenced in a generation of the animals released to the wild. The cancer would disappear in the wild soon after, because the immune animals won't transmit it, and animals with the immunity will out-reproduce the susceptible until the entire population is immune.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Some extinct species were important 'keystones' in their region. Restoring them would help restore a great deal of ecological richness. Woolly mammoths, for instance, were the dominant herbivore of the 'mammoth steppe' in the far north, once the largest biome on Earth. In their absence, the grasslands they helped sustain were replaced by species-poor tundra and boreal forest. Their return to the north would bring back carbon-fixing grass and reduce greenhouse-gas-releasing tundra. Similarly, the European aurochs (extinct since 1627) helped to keep forests across all of Europe and Asia mixed with bio-diverse meadows and grasslands.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The passenger pigeon was a keystone species for the whole eastern deciduous forest in North America, from the Mississippi to the Atlantic, from the U.S. Deep South clear up into Canada. Such animals can also serve as icons, flagship species inspiring the protection of a whole region. The prospect of bringing back the aurochs is helping to boost the vibrant European 're-wilding' movement to connect tracts of abandoned farmland into wildlife corridors spanning national boundaries. <\/span><\/p><p><span lang=\"EN-US\">The current generation of children will experience the return of some remarkable creatures in their lifetime. They will drag their parents to zoos to see the woolly mammoth and growing populations of captive-bred passenger pigeons, Carolina parakeets, Labrador ducks, and maybe even dodos. (Entrance fees at zoos provide a good deal of conservation funding, and zoos will be in the thick of extinct species revival and restoration.) <\/span><\/p><p><span lang=\"EN-US\">Humans killed off a lot of species over the last 10,000 years. Some resurrection is in order. A bit of redemption might come with it.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following cannot be <span>inferred<\/span> from the passage?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Genetic study of revived specimens of extinct species could help in conserving endangered species.<\/span><\/p>", "<p><span lang=\"EN-US\">Attempts to bring back extinct species may not always be successful.<\/span><\/p>", "<p><span lang=\"EN-US\">Cloning could help remove genetic anomalies in animals and find a cure for incurable diseases like cancer.<\/span><\/p>", "<p><span lang=\"EN-US\">Reviving certain species can help convert vast tracts of land into wildlife corridors transcending national boundaries.<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">Option [1] can be inferred from the third paragraph of the passage. Option [2] can be inferred from the second paragraph. Option [4] can be inferred from the fifth paragraph. The third paragraph talks about curing a particular type of cancer that is thought to be caused by a single gene. So, statement [3], which talks about cancer in general, cannot be inferred from the passage. Hence, [3].<\/span><\/p>", "topic": "Inference"}, {"number": 15, "sourceId": "83457", "type": "mcq", "passage": "<p><span lang=\"EN-US\">Many extinct species – from the passenger pigeon to the woolly mammoth – might now be reclassified as 'bodily, but not genetically, extinct'. They're dead, but their DNA is recoverable from museum specimens and fossils, even those up to 200,000 years old. Thanks to new developments in genetic technology, that DNA may eventually bring the animals back to life.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">But why bring vanished creatures back to life? It will be expensive and difficult. It won't always succeed. Why even try? Why do we take enormous trouble to protect endangered species? The same reasons will apply to species brought back from extinction: to preserve biodiversity, to restore diminished ecosystems, to advance the science of preventing extinctions, and to undo the harm that humans have caused in the past. <\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Species brought back from extinction will be beacons of hope. Useful science will also emerge. Close examination of the genomes of extinct species can tell us much about what made them vulnerable in the first place. Were they in a bottleneck with too little genetic variability? How were they different from close relatives that survived? Living specimens will reveal even more. Techniques being developed for de-extinction will also be directly applicable to living species that are close to extinction. Tiny populations can have their genetic variability restored. A species with a genetic Achilles' heel might be totally cured with an adjustment introduced through cloning. For instance, the transmissible cancer on the faces of Tasmanian devils is thought to be caused by a single gene. That gene can be silenced in a generation of the animals released to the wild. The cancer would disappear in the wild soon after, because the immune animals won't transmit it, and animals with the immunity will out-reproduce the susceptible until the entire population is immune.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Some extinct species were important 'keystones' in their region. Restoring them would help restore a great deal of ecological richness. Woolly mammoths, for instance, were the dominant herbivore of the 'mammoth steppe' in the far north, once the largest biome on Earth. In their absence, the grasslands they helped sustain were replaced by species-poor tundra and boreal forest. Their return to the north would bring back carbon-fixing grass and reduce greenhouse-gas-releasing tundra. Similarly, the European aurochs (extinct since 1627) helped to keep forests across all of Europe and Asia mixed with bio-diverse meadows and grasslands.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The passenger pigeon was a keystone species for the whole eastern deciduous forest in North America, from the Mississippi to the Atlantic, from the U.S. Deep South clear up into Canada. Such animals can also serve as icons, flagship species inspiring the protection of a whole region. The prospect of bringing back the aurochs is helping to boost the vibrant European 're-wilding' movement to connect tracts of abandoned farmland into wildlife corridors spanning national boundaries. <\/span><\/p><p><span lang=\"EN-US\">The current generation of children will experience the return of some remarkable creatures in their lifetime. They will drag their parents to zoos to see the woolly mammoth and growing populations of captive-bred passenger pigeons, Carolina parakeets, Labrador ducks, and maybe even dodos. (Entrance fees at zoos provide a good deal of conservation funding, and zoos will be in the thick of extinct species revival and restoration.) <\/span><\/p><p><span lang=\"EN-US\">Humans killed off a lot of species over the last 10,000 years. Some resurrection is in order. A bit of redemption might come with it.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/strong><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">'Some resurrection is in order. A bit of redemption might come with it.' What do these lines signify, in the context of the passage?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">The world could do with some integrity and revive extinct species, earning some lost reputation back in the process.<\/span><\/p>", "<p><span lang=\"EN-US\">Humankind could do well to undo some of its past sins by deciding to revive some of the extinct species.<\/span><\/p>", "<p><span lang=\"EN-US\">The extinct species deserve another chance at existence. They might regain their rightful place in the ecology in the process.<\/span><\/p>", "<p><span lang=\"EN-US\">We owe the extinct species their revival. They will regain some lost prestige in the process.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">The terms 'resurrection', which means 'bringing back to life', refers to the extinct species. 'Redemption', which means 'atoning for one's sins', applies to humans for their contribution in the extinction of some animal species mention in the passage. Redemption does not apply to animals or to the world in general. So, options [1], [3] and [4] are eliminated. Option [2] best sums up the line, by implying that humans could undo the wrong they did, by resurrecting some of the species they killed off in the past 10,000 years. Hence, [2].<\/span><\/p>", "topic": "Application Question"}, {"number": 16, "sourceId": "83458", "type":
