<script type="application/json" id="test-data">{"testNumber": 22, "simcat": 7, "minutes": 40, "questions": [{"number": 1, "sourceId": "114547", "type": "mcq", "passage": "<p>USA has been the most expansionist and successful empire of the modern age. The early American settlers proved to be hardy adventurers; a spirit of enterprise and taste for commercial venture ran through their veins, and above everything, they possessed an all-consuming appetite for acquiring land. The achievements of these early pioneers and their successors were truly astonishing. From their tenuous foothold on the eastern seaboard of America, the colonists survived their early hardships in the seventeenth century, won independence and established nationhood in the eighteenth, and then conquered the North American continent in the nineteenth. Old empires were challenged. Both Spain and France were overwhelmed by the newcomers. Great Britain was forced to agree to American suzerainty over the Oregon territories.<\/p>\n\n<p>The independent kingdom of Hawaii was colonized and its people subjugated. Having become a major participant in the Chinese opium trade, American forces landed in Guangzhou and defeated a Chinese army in a pitched battle. Also, Commander Matthew Perry’s black-hulled gunboats forced Japan to open its markets. By the end of the nineteenth century, Imperial Russia, aware that it could no longer defend Alaska and Oregon from the pioneer onslaught, sold Alaska and all its claims and was pushed off the American continent. In a dispute over Cuba, the American fleet stationed in Hong Kong sailed to the Philippines, sank the Spanish fleet in Manila Bay and took its colonial possessions in Asia. The USA had become the emerging new power in Asia; the formerly dominant position of Great Britain was now challenged. Towards the end of the nineteenth century, Admiral Shufeldt wrote that the Pacific was the ocean bride of America and that Japan and China were the bridesmaids.<\/p>\n\n<p>By the end of the First World War, USA, under President Woodrow Wilson, had victoriously sent an army to Europe, and then dominated the protracted peace negotiations at Versailles. America subsequently dictated the size of British and Japanese navies at the Washington Naval Treaty (1922) and the subsequent London Treaties (1930 and 1936). The Great Depression notwithstanding, by the end of the Second World War, USA accounted for more than half of global economic output. By 1945, in just 324 years after the arrival of the Pilgrim Fathers, USA had become an economically prolific and populous nation and one of the greatest arbiters of world power. As historian Paul Johnson has concluded, the Americans had achieved ‘the transformation of a mostly uninhabited wilderness’.<\/p>\n\n<p>In Asia, moreover, in the vacuum created by the defeat of Japan, the collapse of the European Empire and the economic exhaustion of Great Britain, America was left standing at the head of a vast Asian hegemony. Also, as the world’s only nuclear power, not just Asia but the world lay at its feet. In explaining the origins of this great surge of humanity across the American continent and beyond Asia, which catapulted America to the head of the world’s nations, it is necessary to look at the origins and character of the mass migration which made it possible. This had its beginnings in Europe in the seventeenth and eighteenth centuries with the emergence of modern nation states which had intellectually revolutionary concepts of government, technological advances, rapidly growing economies and burgeoning populations.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/p><\/div><p>Which one of the following is not true according to the passage?<\/p>", "options": ["<p>The peace talks after the end of World War I were directed by the American President, Woodrow Wilson.<\/p>", "<p>By the 20th century, America gained prominence in world politics.<\/p>", "<p>America gained its independence from Great Britain, Spain and France.<\/p>", "<p>America was the first to harness nuclear power.<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p>The first sentence of the third paragraph states that ‘… and then dominated the protracted peace talks’ hence option [1] is true. The third paragraph states ‘By 1945, in just 324 years….’ which makes option [2] also true. Option [4] is also true as per the last paragraph, which states: ‘Also the world’s only nuclear power…’. Although the passage talks about America winning independence, it does not specifically give the name(s) of the nation(s) from which America may have won its independence. Hence option [3] cannot be said to be true, based on the information given in the passage. Hence [3].<\/p>", "topic": "Specific Detail  Question"}, {"number": 2, "sourceId": "114548", "type": "mcq", "passage": "<p>USA has been the most expansionist and successful empire of the modern age. The early American settlers proved to be hardy adventurers; a spirit of enterprise and taste for commercial venture ran through their veins, and above everything, they possessed an all-consuming appetite for acquiring land. The achievements of these early pioneers and their successors were truly astonishing. From their tenuous foothold on the eastern seaboard of America, the colonists survived their early hardships in the seventeenth century, won independence and established nationhood in the eighteenth, and then conquered the North American continent in the nineteenth. Old empires were challenged. Both Spain and France were overwhelmed by the newcomers. Great Britain was forced to agree to American suzerainty over the Oregon territories.<\/p>\n\n<p>The independent kingdom of Hawaii was colonized and its people subjugated. Having become a major participant in the Chinese opium trade, American forces landed in Guangzhou and defeated a Chinese army in a pitched battle. Also, Commander Matthew Perry’s black-hulled gunboats forced Japan to open its markets. By the end of the nineteenth century, Imperial Russia, aware that it could no longer defend Alaska and Oregon from the pioneer onslaught, sold Alaska and all its claims and was pushed off the American continent. In a dispute over Cuba, the American fleet stationed in Hong Kong sailed to the Philippines, sank the Spanish fleet in Manila Bay and took its colonial possessions in Asia. The USA had become the emerging new power in Asia; the formerly dominant position of Great Britain was now challenged. Towards the end of the nineteenth century, Admiral Shufeldt wrote that the Pacific was the ocean bride of America and that Japan and China were the bridesmaids.<\/p>\n\n<p>By the end of the First World War, USA, under President Woodrow Wilson, had victoriously sent an army to Europe, and then dominated the protracted peace negotiations at Versailles. America subsequently dictated the size of British and Japanese navies at the Washington Naval Treaty (1922) and the subsequent London Treaties (1930 and 1936). The Great Depression notwithstanding, by the end of the Second World War, USA accounted for more than half of global economic output. By 1945, in just 324 years after the arrival of the Pilgrim Fathers, USA had become an economically prolific and populous nation and one of the greatest arbiters of world power. As historian Paul Johnson has concluded, the Americans had achieved ‘the transformation of a mostly uninhabited wilderness’.<\/p>\n\n<p>In Asia, moreover, in the vacuum created by the defeat of Japan, the collapse of the European Empire and the economic exhaustion of Great Britain, America was left standing at the head of a vast Asian hegemony. Also, as the world’s only nuclear power, not just Asia but the world lay at its feet. In explaining the origins of this great surge of humanity across the American continent and beyond Asia, which catapulted America to the head of the world’s nations, it is necessary to look at the origins and character of the mass migration which made it possible. This had its beginnings in Europe in the seventeenth and eighteenth centuries with the emergence of modern nation states which had intellectually revolutionary concepts of government, technological advances, rapidly growing economies and burgeoning populations.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/p><\/div>", "options": ["<p>CABD<\/p>", "<p>DCAB<\/p>", "<p>CBAD<\/p>", "<p>ACBD<\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p>Refer to the last paragraph of the passage which states ‘This had its beginnings in Europe...’. According to this sentence, the emergence of modern nation states in Europe in the seventeenth and eighteenth centuries led to mass migrations to America. Hence this is the first event leading America to power. The next event would be the conquest of the North American continent, which was done in the nineteenth century. We can ascertain this from the first paragraph of the passage ‘From their tenuous foothold…’. According to the second paragraph, the colonization of the kingdom of Hawaii would come after the conquest of the North American continent and before the end of World War I. Hence it would be the third event. The third paragraph states that the Washington treaty was signed in the year 1922, after the end of World War I, hence this would come last. The correct sequence is DCAB. Hence, [2].<\/p>", "topic": "Specific Detail  Question"}, {"number": 3, "sourceId": "114549", "type": "mcq", "passage": "<p>USA has been the most expansionist and successful empire of the modern age. The early American settlers proved to be hardy adventurers; a spirit of enterprise and taste for commercial venture ran through their veins, and above everything, they possessed an all-consuming appetite for acquiring land. The achievements of these early pioneers and their successors were truly astonishing. From their tenuous foothold on the eastern seaboard of America, the colonists survived their early hardships in the seventeenth century, won independence and established nationhood in the eighteenth, and then conquered the North American continent in the nineteenth. Old empires were challenged. Both Spain and France were overwhelmed by the newcomers. Great Britain was forced to agree to American suzerainty over the Oregon territories.<\/p>\n\n<p>The independent kingdom of Hawaii was colonized and its people subjugated. Having become a major participant in the Chinese opium trade, American forces landed in Guangzhou and defeated a Chinese army in a pitched battle. Also, Commander Matthew Perry’s black-hulled gunboats forced Japan to open its markets. By the end of the nineteenth century, Imperial Russia, aware that it could no longer defend Alaska and Oregon from the pioneer onslaught, sold Alaska and all its claims and was pushed off the American continent. In a dispute over Cuba, the American fleet stationed in Hong Kong sailed to the Philippines, sank the Spanish fleet in Manila Bay and took its colonial possessions in Asia. The USA had become the emerging new power in Asia; the formerly dominant position of Great Britain was now challenged. Towards the end of the nineteenth century, Admiral Shufeldt wrote that the Pacific was the ocean bride of America and that Japan and China were the bridesmaids.<\/p>\n\n<p>By the end of the First World War, USA, under President Woodrow Wilson, had victoriously sent an army to Europe, and then dominated the protracted peace negotiations at Versailles. America subsequently dictated the size of British and Japanese navies at the Washington Naval Treaty (1922) and the subsequent London Treaties (1930 and 1936). The Great Depression notwithstanding, by the end of the Second World War, USA accounted for more than half of global economic output. By 1945, in just 324 years after the arrival of the Pilgrim Fathers, USA had become an economically prolific and populous nation and one of the greatest arbiters of world power. As historian Paul Johnson has concluded, the Americans had achieved ‘the transformation of a mostly uninhabited wilderness’.<\/p>\n\n<p>In Asia, moreover, in the vacuum created by the defeat of Japan, the collapse of the European Empire and the economic exhaustion of Great Britain, America was left standing at the head of a vast Asian hegemony. Also, as the world’s only nuclear power, not just Asia but the world lay at its feet. In explaining the origins of this great surge of humanity across the American continent and beyond Asia, which catapulted America to the head of the world’s nations, it is necessary to look at the origins and character of the mass migration which made it possible. This had its beginnings in Europe in the seventeenth and eighteenth centuries with the emergence of modern nation states which had intellectually revolutionary concepts of government, technological advances, rapidly growing economies and burgeoning populations.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/p><\/div><p>According to the passage, which of the following places were acquired or colonized by America?<\/p>", "options": ["<p>Oregon, Hawaii, Alaska and the Philippines<\/p>", "<p>Hawaii, Alaska and the Philippines<\/p>", "<p>Oregon, Hawaii, Alaska, and China<\/p>", "<p>Hawaii and Alaska<\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p>The passage specifically mentions that Hawaii was colonized by America, and that Russia sold Alaska to America; hence these two places were certainly ruled by America. The last line in the first paragraph states that ‘Great Britain was forced to agree to American suzerainty over the Oregon territories’. The word ‘suzerainty’ means position or power; hence we can conclude that Oregon was also colonized by America. The other place which the passage specifically mentions is the Philippines. This can be ascertained by the fourth line in the second paragraph: ‘In a dispute over Cuba, the American fleet stationed in Hong Kong sailed to the Philippines, sank the Spanish fleet in Manila Bay and took its colonial possessions in Asia’. Hence, [1].<\/p>", "topic": "Specific Detail  Question"}, {"number": 4, "sourceId": "114550", "type": "mcq", "passage": "<p>USA has been the most expansionist and successful empire of the modern age. The early American settlers proved to be hardy adventurers; a spirit of enterprise and taste for commercial venture ran through their veins, and above everything, they possessed an all-consuming appetite for acquiring land. The achievements of these early pioneers and their successors were truly astonishing. From their tenuous foothold on the eastern seaboard of America, the colonists survived their early hardships in the seventeenth century, won independence and established nationhood in the eighteenth, and then conquered the North American continent in the nineteenth. Old empires were challenged. Both Spain and France were overwhelmed by the newcomers. Great Britain was forced to agree to American suzerainty over the Oregon territories.<\/p>\n\n<p>The independent kingdom of Hawaii was colonized and its people subjugated. Having become a major participant in the Chinese opium trade, American forces landed in Guangzhou and defeated a Chinese army in a pitched battle. Also, Commander Matthew Perry’s black-hulled gunboats forced Japan to open its markets. By the end of the nineteenth century, Imperial Russia, aware that it could no longer defend Alaska and Oregon from the pioneer onslaught, sold Alaska and all its claims and was pushed off the American continent. In a dispute over Cuba, the American fleet stationed in Hong Kong sailed to the Philippines, sank the Spanish fleet in Manila Bay and took its colonial possessions in Asia. The USA had become the emerging new power in Asia; the formerly dominant position of Great Britain was now challenged. Towards the end of the nineteenth century, Admiral Shufeldt wrote that the Pacific was the ocean bride of America and that Japan and China were the bridesmaids.<\/p>\n\n<p>By the end of the First World War, USA, under President Woodrow Wilson, had victoriously sent an army to Europe, and then dominated the protracted peace negotiations at Versailles. America subsequently dictated the size of British and Japanese navies at the Washington Naval Treaty (1922) and the subsequent London Treaties (1930 and 1936). The Great Depression notwithstanding, by the end of the Second World War, USA accounted for more than half of global economic output. By 1945, in just 324 years after the arrival of the Pilgrim Fathers, USA had become an economically prolific and populous nation and one of the greatest arbiters of world power. As historian Paul Johnson has concluded, the Americans had achieved ‘the transformation of a mostly uninhabited wilderness’.<\/p>\n\n<p>In Asia, moreover, in the vacuum created by the defeat of Japan, the collapse of the European Empire and the economic exhaustion of Great Britain, America was left standing at the head of a vast Asian hegemony. Also, as the world’s only nuclear power, not just Asia but the world lay at its feet. In explaining the origins of this great surge of humanity across the American continent and beyond Asia, which catapulted America to the head of the world’s nations, it is necessary to look at the origins and character of the mass migration which made it possible. This had its beginnings in Europe in the seventeenth and eighteenth centuries with the emergence of modern nation states which had intellectually revolutionary concepts of government, technological advances, rapidly growing economies and burgeoning populations.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/p><\/div><p>Which one of the following would be an apt title for the passage?<\/p>", "options": ["<p>The Great Economies of the World<\/p>", "<p>World War I – The Role of America<\/p>", "<p>European Revolution – The Birth of America<\/p>", "<p>America – The Rise to Power<\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p>The passage concentrates on the formation of America as a nation and of its subsequent rise to power in world politics. Hence the most apt title, from the given options, would be ‘America – The Rise to Power’. Hence, [4].<\/p>", "topic": "Title"}, {"number": 5, "sourceId": "83434", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>In the eighteenth and nineteenth\r\n  centuries, European scholars developed the hypothesis that the Indian and\r\n  European languages had a common ancestry, and from that, it was the next\r\n  logical step to posit a common ancestry for the peoples of these regions. These\r\n  putative ancestors were called the 'Aryans'. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>Distinguished\r\n  scholars claimed that the Aryans were 'the rulers of history'. Soon, Aryan\r\n  descent was popularly seen as the mark, if not yet of a master race, at least\r\n  of ethnic distinction. Gratified by the discovery of their proud historical\r\n  pedigree, India's aspiring nationalists embraced the Aryans as readily as did\r\n  Europe's cultural supremacists. An Aryan homeland was sought somewhere in the\r\n  middle of the Eurasian landmass, the place from where the Aryans spread out\r\n  across to Europe and northern India.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>India's Aryans were\r\n  therefore originally immigrants, and to judge by their exploits as recorded\r\n  in the <i>Vedas<\/i>, highly combative ones. The Aryan conquistadors were seen\r\n  as having hurtled down the passes from Afghanistan to career across the\r\n  plains of Punjab. Dealing death and destruction from fleets of horse-drawn\r\n  chariots, they subdued the indigenous peoples and appropriated their herds.\r\n  These indigenes were characterized as dark, flat-nosed, uncouth, incomprehensible\r\n  and generally inferior. The Aryans, on the other hand, were finer-featured,\r\n  fairer, taller, favoured above others in the excellence of their gods, and\r\n  their horses, and altogether a very superior people.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>Nineteenth-century\r\n  British colonialists, reflecting on this new and unexpected Aryan dimension\r\n  to India's history, could draw great comfort. All that was fine and\r\n  'classical' in ancient India's history could now be credited to this influx\r\n  of manly heroes from the west. The Aryans, spreading their superior culture\r\n  right down the valley of the Ganga and then deep into the peninsula, had\r\n  conferred on India an unprecedented cultural integrity and an enviably high\r\n  degree of civilization. And the British were the neo-Aryans, showering\r\n  Indians with the incomparable benefits of a superior civilization and a\r\n  humane religion, and ushering in a new and golden age. Or so some liked to\r\n  think.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>This illusion was\r\n  rudely shattered in the 1930s. Just when Indian demands for self-government\r\n  were obliging the British to reconsider their colonial mission, the Aryan\r\n  thesis became both discredited by Nazi propaganda in Europe and challenged by\r\n  the archaeological reports coming from Mohenjo-daro and elsewhere in India.\r\n  Initially, with the chronology even vaguer than now, it was not clear that\r\n  the Harappans pre-dated the Aryan 'invasions'. Indeed, there are still some\r\n  scholars who insist that it was the Aryans who preceded the Harappans and,\r\n  despite ample testimony to the contrary, that the Harappan civilization was\r\n  therefore an Aryan achievement. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>Another theory in the\r\n  1940s and 50s was that, if the Aryans could not possibly have created the\r\n  Harappan cities, they might have been responsible for destroying them. This,\r\n  of course, assumed that the Harappan cities had succumbed to conquest. But in\r\n  1964 this theory too collapsed. There is no evidence of destruction or a\r\n  final defence covering the latest period of Mohenjo-daro. Nor is it clear\r\n  that Aryan chariots and catapults could have made much impression on Harappan\r\n  walls thirteen metres thick, according to the archaeologists, and every bit\r\n  as high.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span\r\n  lang=EN-US>The possibility of some contact between Aryans and Harappans can\r\n  never, of course, be totally dismissed. As the dates for the Late Harappan\r\n  phase have been slowly pushed forward to around 1700 BC, the gap, if there is\r\n  one, between Harappan and Aryan has closed to perhaps a couple of centuries.\r\n  Across such a timespan, some web of collective memory could well have spread.<\/span><span\r\n  lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/p><\/div><p><span lang=\"EN-US\"> <\/span>What is the author's tone in the first four paragraphs of this passage?<\/p>", "options": ["<p><span lang=\"EN-US\">Amused<\/span><\/p>", "<p><span lang=\"EN-US\">Sceptical<\/span><\/p>", "<p><span lang=\"EN-US\">Neutral<\/span><\/p>", "<p><span lang=\"EN-US\">Proud<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">In the first four paragraphs, the author is clearly sceptical of the hype surrounding the Aryan ancestry hypothesis. This can be best seen in the last sentence of paragraph 4: 'Or so some liked to think'. He may be slightly amused at people's attitudes, but that is not the overall tone. He is certainly not proud of anything, and the tone is by no means neutral. Hence, [2].<\/span><\/p>", "topic": "Style Tone & Attitude"}, {"number": 6, "sourceId": "83435", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>In the eighteenth and nineteenth\r\n  centuries, European scholars developed the hypothesis that the Indian and\r\n  European languages had a common ancestry, and from that, it was the next\r\n  logical step to posit a common ancestry for the peoples of these regions. These\r\n  putative ancestors were called the 'Aryans'. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>Distinguished\r\n  scholars claimed that the Aryans were 'the rulers of history'. Soon, Aryan\r\n  descent was popularly seen as the mark, if not yet of a master race, at least\r\n  of ethnic distinction. Gratified by the discovery of their proud historical\r\n  pedigree, India's aspiring nationalists embraced the Aryans as readily as did\r\n  Europe's cultural supremacists. An Aryan homeland was sought somewhere in the\r\n  middle of the Eurasian landmass, the place from where the Aryans spread out\r\n  across to Europe and northern India.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><sp came both discredited by Nazi propaganda in Europe and challenged by\r\n  the archaeological reports coming from Mohenjo-daro and elsewhere in India.\r\n  Initially, with the chronology even vaguer than now, it was not clear that\r\n  the Harappans pre-dated the Aryan 'invasions'. Indeed, there are still some\r\n  scholars who insist that it was the Aryans who preceded the Harappans and,\r\n  despite ample testimony to the contrary, that the Harappan civilization was\r\n  therefore an Aryan achievement. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>Another theory in the\r\n  1940s and 50s was that, if the Aryans could not possibly have created the\r\n  Harappan cities, they might have been responsible for destroying them. This,\r\n  of course, assumed that the Harappan cities had succumbed to conquest. But in\r\n  1964 this theory too collapsed. There is no evidence of destruction or a\r\n  final defence covering the latest period of Mohenjo-daro. Nor is it clear\r\n  that Aryan chariots and catapults could have made much impression on Harappan\r\n  walls thirteen metres thick, according to the archaeologists, and every bit\r\n  as high.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span\r\n  lang=EN-US>The possibility of some contact between Aryans and Harappans can\r\n  never, of course, be totally dismissed. As the dates for the Late Harappan\r\n  phase have been slowly pushed forward to around 1700 BC, the gap, if there is\r\n  one, between Harappan and Aryan has closed to perhaps a couple of centuries.\r\n  Across such a timespan, some web of collective memory could well have spread.<\/span><span\r\n  lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/p><\/div><p><span lang=\"EN-US\"> <\/span>Which of the following is true, based on the last three paragraphs?<\/p>", "options": ["<p><span lang=\"EN-US\">The evidence suggests that the Harappans pre-dated the Aryans in India.<\/span><\/p>", "<p><span lang=\"EN-US\">The evidence suggests that the Aryans pre-dated the Harappans in India.<\/span><\/p>", "<p><span lang=\"EN-US\">The Aryans may have been responsible for the destruction of the Harappan civilization in India.<\/span><\/p>", "<p><span lang=\"EN-US\">The Harappan and Aryan civilizations never came into contact in India.<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\">According to the last three paragraphs, archaeological evidence shows that Harappan civilization pre-dated the Aryans' arrival in India: this can be inferred from the last two sentences of paragraph 5, and the second sentence of the last paragraph. Therefore, [1] is the right answer. Note that the author dismisses [3] and [4] in paragraphs 6 and 7 respectively. Hence, [1].<\/span><\/p>", "topic": "Application Question"}, {"number": 7, "sourceId": "83436", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>In the eighteenth and nineteenth\r\n  centuries, European scholars developed the hypothesis that the Indian and\r\n  European languages had a common ancestry, and from that, it was the next\r\n  logical step to posit a common ancestry for the peoples of these regions. These\r\n  putative ancestors were called the 'Aryans'. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>Distinguished\r\n  scholars claimed that the Aryans were 'the rulers of history'. Soon, Aryan\r\n  descent was popularly seen as the mark, if not yet of a master race, at least\r\n  of ethnic distinction. Gratified by the discovery of their proud historical\r\n  pedigree, India's aspiring nationalists embraced the Aryans as readily as did\r\n  Europe's cultural supremacists. An Aryan homeland was sought somewhere in the\r\n  middle of the Eurasian landmass, the place from where the Aryans spread out\r\n  across to Europe and northern India.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>India's Aryans were\r\n  therefore originally immigrants, and to judge by their exploits as recorded\r\n  in the <i>Vedas<\/i>, highly combative ones. The Aryan conquistadors were seen\r\n  as having hurtled down the passes from Afghanistan to career across the\r\n  plains of Punjab. Dealing death and destruction from fleets of horse-drawn\r\n  chariots, they subdued the indigenous peoples and appropriated their herds.\r\n  These indigenes were characterized as dark, flat-nosed, uncouth, incomprehensible\r\n  and generally inferior. The Aryans, on the other hand, were finer-featured,\r\n  fairer, taller, favoured above others in the excellence of their gods, and\r\n  their horses, and altogether a very superior people.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>Nineteenth-century\r\n  British colonialists, reflecting on this new and unexpected Aryan dimension\r\n  to India's history, could draw great comfort. All that was fine and\r\n  'classical' in ancient India's history could now be credited to this influx\r\n  of manly heroes from the west. The Aryans, spreading their superior culture\r\n  right down the valley of the Ganga and then deep into the peninsula, had\r\n  conferred on India an unprecedented cultural integrity and an enviably high\r\n  degree of civilization. And the British were the neo-Aryans, showering\r\n  Indians with the incomparable benefits of a superior civilization and a\r\n  humane religion, and ushering in a new and golden age. Or so some liked to\r\n  think.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>This illusion was\r\n  rudely shattered in the 1930s. Just when Indian demands for self-government\r\n  were obliging the British to reconsider their colonial mission, the Aryan\r\n  thesis became both discredited by Nazi propaganda in Europe and challenged by\r\n  the archaeological reports coming from Mohenjo-daro and elsewhere in India.\r\n  Initially, with the chronology even vaguer than now, it was not clear that\r\n  the Harappans pre-dated the Aryan 'invasions'. Indeed, there are still some\r\n  scholars who insist that it was the Aryans who preceded the Harappans and,\r\n  despite ample testimony to the contrary, that the Harappan civilization was\r\n  therefore an Aryan achievement. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>Another theory in the\r\n  1940s and 50s was that, if the Aryans could not possibly have created the\r\n  Harappan cities, they might have been responsible for destroying them. This,\r\n  of course, assumed that the Harappan cities had succumbed to conquest. But in\r\n  1964 this theory too collapsed. There is no evidence of destruction or a\r\n  final defence covering the latest period of Mohenjo-daro. Nor is it clear\r\n  that Aryan chariots and catapults could have made much impression on Harappan\r\n  walls thirteen metres thick, according to the archaeologists, and every bit\r\n  as high.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span\r\n  lang=EN-US>The possibility of some contact between Aryans and Harappans can\r\n  never, of course, be totally dismissed. As the dates for the Late Harappan\r\n  phase have been slowly pushed forward to around 1700 BC, the gap, if there is\r\n  one, between Harappan and Aryan has closed to perhaps a couple of centuries.\r\n  Across such a timespan, some web of collective memory could well have spread.<\/span><span\r\n  lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/p><\/div><p><span lang=\"EN-US\"> <\/span>The Aryans migrated to India from somewhere in central Eurasia. According to the author, this statement is:<\/p>", "options": ["<p><span lang=\"EN-US\">Probably true.<\/span><\/p>", "<p><span lang=\"EN-US\">Definitely true.<\/span><\/p>", "<p><span lang=\"EN-US\">Definitely false.<\/span><\/p>", "<p><span lang=\"EN-US\">Probably false.<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\">Refer to paragraphs 2 and 3. The author states that 'India's Aryans were therefore originally immigrants', and that they reached India via Afghanistan. He also states that scholars looked for an Aryan homeland 'somewhere in the middle of the Eurasian landmass'. Though he is sceptical about the reverent attitude towards the Aryans, and about some of the deeds ascribed to them, he does not seem to doubt the story of their origin. So he would probably agree with the given statement. Note that the story of their origin is not presented as an established fact, but a hypothesis, so it is only probably, not definitely, true. Hence, [1].<\/span><\/p>", "topic": "Application Question"}, {"number": 8, "sourceId": "83437", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>In the eighteenth and nineteenth\r\n  centuries, European scholars developed the hypothesis that the Indian and\r\n  European languages had a common ancestry, and from that, it was the next\r\n  logical step to posit a common ancestry for the peoples of these regions. These\r\n  putative ancestors were called the 'Aryans'. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>Distinguished\r\n  scholars claimed that the Aryans were 'the rulers of history'. Soon, Aryan\r\n  descent was popularly seen as the mark, if not yet of a master race, at least\r\n  of ethnic distinction. Gratified by the discovery of their proud historical\r\n  pedigree, India's aspiring nationalists embraced the Aryans as readily as did\r\n  Europe's cultural supremacists. An Aryan homeland was sought somewhere in the\r\n  middle of the Eurasian landmass, the place from where the Aryans spread out\r\n  across to Europe and northern India.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>India's Aryans were\r\n  therefore originally immigrants, and to judge by their exploits as recorded\r\n  in the <i>Vedas<\/i>, highly combative ones. The Aryan conquistadors were seen\r\n  as having hurtled down the passes from Afghanistan to career across the\r\n  plains of Punjab. Dealing death and destruction from fleets of horse-drawn\r\n  chariots, they subdued the indigenous peoples and appropriated their herds.\r\n  These indigenes were characterized as dark, flat-nosed, uncouth, incomprehensible\r\n  and generally inferior. The Aryans, on the other hand, were finer-featured,\r\n  fairer, taller, favoured above others in the excellence of their gods, and\r\n  their horses, and altogether a very superior people.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>Nineteenth-century\r\n  British colonialists, reflecting on this new and unexpected Aryan dimension\r\n  to India's history, could draw great comfort. All that was fine and\r\n  'classical' in ancient India's history could now be credited to this influx\r\n  of manly heroes from the west. The Aryans, spreading their superior culture\r\n  right down the valley of the Ganga and then deep into the peninsula, had\r\n  conferred on India an unprecedented cultural integrity and an enviably high\r\n  degree of civilization. And the British were the neo-Aryans, showering\r\n  Indians with the incomparable benefits of a superior civilization and a\r\n  humane religion, and ushering in a new and golden age. Or so some liked to\r\n  think.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>This illusion was\r\n  rudely shattered in the 1930s. Just when Indian demands for self-government\r\n  were obliging the British to reconsider their colonial mission, the Aryan\r\n  thesis became both discredited by Nazi propaganda in Europe and challenged by\r\n  the archaeological reports coming from Mohenjo-daro and elsewhere in India.\r\n  Initially, with the chronology even vaguer than now, it was not clear that\r\n  the Harappans pre-dated the Aryan 'invasions'. Indeed, there are still some\r\n  scholars who insist that it was the Aryans who preceded the Harappans and,\r\n  despite ample testimony to the contrary, that the Harappan civilization was\r\n  therefore an Aryan achievement. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>Another theory in the\r\n  1940s and 50s was that, if the Aryans could not possibly have created the\r\n  Harappan cities, they might have been responsible for destroying them. This,\r\n  of course, assumed that the Harappan cities had succumbed to conquest. But in\r\n  1964 this theory too collapsed. There is no evidence of destruction or a\r\n  final defence covering the latest period of Mohenjo-daro. Nor is it clear\r\n  that Aryan chariots and catapults could have made much impression on Harappan\r\n  walls thirteen metres thick, according to the archaeologists, and every bit\r\n  as high.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span\r\n  lang=EN-US>The possibility of some contact between Aryans and Harappans can\r\n  never, of course, be totally dismissed. As the dates for the Late Harappan\r\n  phase have been slowly pushed forward to around 1700 BC, the gap, if there is\r\n  one, between Harappan and Aryan has closed to perhaps a couple of centuries.\r\n  Across such a timespan, some web of collective memory could well have spread.<\/span><span\r\n  lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/p><\/div><p><span lang=\"EN-US\"> <\/span>How do the first four paragraphs of this passage relate to the last three paragraphs?<\/p>", "options": ["<p><span lang=\"EN-US\">The former describe the result of a scholarly hypothesis; the latter describe the result of contradictory scholarly hypotheses.<\/span><\/p>", "<p><span lang=\"EN-US\">The former describe the result of a scholarly hypothesis; the latter describe a popular revolt against that hypothesis.<\/span><\/p>", "<p><span lang=\"EN-US\">The former describe a widely held attitude; the latter show why this attitude was founded in a fallacy.<\/span><\/p>", "<p><span lang=\"EN-US\">The former describe a widely held attitude; the latter show how repugnant this attitude is.<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">The first half of options [1] and [2] incorrect-- the first half of the passage doesn't portray 'the results of scolarly hypotheses' but describes a widely-held belief. The author makes no mention of a 'repugnant attitude', so [4] is incorrect. There is no 'popular revolt' mentioned in the passage at all, so there is no basis for [2]. Only [3] is correct: the first four paragraphs describe the widely held attitude towards the Aryans in Europe and in India; and the last three paragraphs shows how archaeological evidence showed this attitude to be based on a fallacy. Hence, [3].<\/span><\/p>", "topic": "Application Question"}, {"number": 9, "sourceId": "77357", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\">According to the passage, why is journalistic truth problematic?<\/span><\/p>\n<p><span lang=\"EN-US\">I.<span>       <\/span>The onus of the veracity of journalistic truth lies not with the journalists but with those making the claims, be it<\/span><\/p>\n<p><span lang=\"EN-US\">         public officials or covert sources.<\/span><\/p>\n<p><span lang=\"EN-US\">II.<span>     <\/span>It is concerned more with transmitting information, preferably from legitimate sources, rather than ascertaining<\/span><\/p>\n<p><span lang=\"EN-US\">         the truth of the information.<\/span><\/p>\n<p><span lang=\"EN-US\">III.<span>    <\/span>It is impossible to ascertain the truth in the short-time frame often afforded to gather, verify and disseminate<\/span><\/p>\n<p>         journalistic information.<\/p>", "options": ["<p><span lang=\"EN-US\">Both I and II<\/span><\/p>", "<p><span lang=\"EN-US\">Both II and III<\/span><\/p>", "<p><span lang=\"EN-US\">Both I and III<\/span><\/p>", "<p><span lang=\"EN-US\">I, II and III<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">Statements II and III are clearly stated in the second and fourth paragraphs of the passage <\/span><span>respectively. Statement I is not stated in the passage. Hence, [2].<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 10, "sourceId": "77358", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\">Based on the passage, which of the following words best describes the truth produced by think-tanks?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">definitive<\/span><\/p>", "<p><span lang=\"EN-US\">partisan<\/span><\/p>", "<p><span lang=\"EN-US\">equivocal<\/span><\/p>", "<p><span lang=\"EN-US\">specious<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">The third paragraph clearly states that think-tanks don't entertain any counterarguments and mock contrary views. They are only interested in putting forward their point of view, even if it means using unreliable footnotes. Option [2] best captures this; <em>partisan<\/em> means biased towards one point of view. Hence, [2].<\/span><\/p>", "topic": "Contextual Vocabulary"}, {"number": 11, "sourceId": "77359", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\">According to the passage, which of the following is the reason for the difference in the nature of the truth as it is presented by academics, journalists and think-tanks?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">People look to different sources for different kinds of information and hence the nature of truth differs according to the source reporting it. <\/span><\/p>", "<p><span lang=\"EN-US\">Unlike journalists and think-tanks, academics are under no compulsion to present truth in particular format.<\/span><\/p>", "<p><span lang=\"EN-US\">The time taken to gather and extensively investigate information is much longer than the time available with individuals, corporations and governments.<\/span><\/p>", "<p><span lang=\"EN-US\">The truth as it is researched and reported is contingent upon the demands placed by the interests of professional bodies they represent. <\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">The first sentence of the last paragraph clearly states the reason asked in the question, <em>In each of these realms, the actor in question is responding to professional stimuli that are fairly well defined and result, at least originally, from sensible conclusions.<\/em> Option [4] best paraphrases this. Hence, [4].<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 12, "sourceId": "77360", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/p><\/div><p><span lang=\"EN-US\">Which of the following best captures the main idea of the passage?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Unlike earlier, it is cities and not villages that hold the majority of the world's population and the negative view of cities propagated by thinkers of the past is slowly beginning to change.<\/span><\/p>", "<p><span lang=\"EN-US\">Cities are the best places to utilize the potential of technology to stimulate the exchange of ideas and creation of intellectual capital.<\/span><\/p>", "<p><span lang=\"EN-US\">Cities, where a majority of the human population now lives, might hold a solution to the many problems of our age.<\/span><\/p>", "<p><span lang=\"EN-US\">Cities offer the blueprint for solving all the major problems of our time, like climate change, disease and sanitation and are also our best source of generating new ideas.<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">Option [1] is incorrect since it does not state the central idea that cities might hold a key to <\/span><span>solving our problems. Option [2] limits itself to technology and information exchange. <\/span><span>Option [4] is incorrect since it states that cities can solve all the problems of our time. <\/span><span>Option [3] rightly summarizes the central idea that cities, where a majority of the human <\/span><span>population is now concentrated, offers a key to solving the problems we face today. <\/span><span>Hence, [3].<\/span><\/p>", "topic": "Central Idea"}, {"number": 13, "sourceId": "77361", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/p><\/div><p><span lang=\"EN-US\">Which of the following does the passage mention about cities?<\/span><\/p>\n<p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">I. Cities have better sanitation and fewer diseases than villages.<\/span><\/p>\n<p><span lang=\"EN-US\">II. Cities leave lesser carbon footprints than suburbs and villages.<\/span><\/p>\n<p><span lang=\"EN-US\">III. Solving climate change will be greatly influenced by the way we build and live in our cities.<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Both I and II<\/span><\/p>", "<p><span lang=\"EN-US\">Both I and III<\/span><\/p>", "<p><span lang=\"EN-US\">Both II and III<\/span><\/p>", "<p><span lang=\"EN-US\">Only III<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">Statements I and II are incorrect since the third paragraph does not compare cities and  <\/span><span>villages with respect to health, sanitation and carbon footprints. Only III is stated in the <\/span><span>last sentence of the passage. Hence, [4].<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 14, "sourceId": "77362", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/p><\/div><p><span lang=\"EN-US\">Based on the passage, it can be said that the author's view of the city and its potential is:<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">balanced and circumspect.<\/span><\/p>", "<p><span lang=\"EN-US\">tendentious and questionable.<\/span><\/p>", "<p><span lang=\"EN-US\">unequivocally sanguine.<\/span><\/p>", "<p><span lang=\"EN-US\">incisive and cogent.<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">From the passage it is clear that the author views cities and their potential in a very positive light, he barely mentions any drawbacks of cities or any benefits of village life. So, it can be inferred that he is excessively optimistic about cities. Option [3] best states this. Circumspect, meaning discreet, is not an appropriate word to describe the author's attitude towards cities. In option (2), the word tendentious means to promote a particular cause or point of view, especially a controversial one. The author does not make any such conclusions that can be claimed to be controversial. Similarly, in option (4), the words incisive and cogent mean making a remarkably clear, fact-based and direct argument to convince readers towards forming a particular opinion. Thus, options [2] and [4] cannot be selected since we cannot prove or disprove the author's hypothesis based on the passage. Hence, [3]. <\/span><\/p>", "topic": "Application Question"}, {"number": 15, "sourceId": "77352", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of three questions.Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\">Which of the following best captures the main idea of the passage? <\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Clothing wears the traces and bears the exploitative burdens of a global economic history in progress.<\/span><\/p>", "<p><span lang=\"EN-US\">Clothing's portability grants it a history of embodiment and transmutation, moving across bodies, cultures, nations and economies.<\/span><\/p>", "<p><span lang=\"EN-US\">Clothing is a portable currency whose materiality is culturally transformed by multiple processes of alteration, exchange and wear.<\/span><\/p>", "<p><span lang=\"EN-US\">The paths by which clothing moves among people and countries have increased exponentially since the advent of mass production and transportation.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">The passage primarily deals with clothing and how its use transforms the piece of clothing itself. This is discussed in terms of the historical developments in the manufacture and distribution of clothing, especially secondhand clothing. Clothes take on the marks of their lifetime use, as they move across users who, in the current era, are located across continents and cultures. Option (2) best captures this. Option (1) is only incorrect due the use of the word 'exploitative' since the passage does not refer to any form of exploitation anywhere. Option (3) is incorrect since the passage does not mention that the materiality of clothing is culturally transformed; rather the people wearing it transform it. Option (4) is incorrect since it deals with only a small part of the passage. Hence, (2).<\/span><\/p>", "topic": "Central Idea"}, {"number": 16, "sourceId": "77353", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following situations exemplifies the portability of clothing before the <\/span><span>nineteenth century?<\/span><\/p>\n<p><span lang=\"EN-US\">I.<span>         <\/span>A dress being passed on from mother to daughter, carrying with it signs and markers of generational passing.<\/span><\/p>\n<p><span lang=\"EN-US\">II.<span>        <\/span>Servants selling their masters' old clothing handed over to them to peasants in neighbouring villages.<\/span><\/p>\n<p><span lang=\"EN-US\">III.<span>       <\/span>People getting to wear clothes from a different culture, thanks to the transportation of secondhand clothes<\/span><\/p>\n<p><span lang=\"EN-US\">           across the globe.<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Only I<\/span><\/p>", "<p><span lang=\"EN-US\">Only III<\/span><\/p>", "<p><span lang=\"EN-US\">Both I and II<\/span><\/p>", "<p><span lang=\"EN-US\">Both I and III<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">The portability (from <em>portable<\/em>, easily movable) of clothing is discussed in the second <\/span><span>paragraph with the example of a master giving his clothes to his servant, who can either <\/span><span>use it as clothing or as portable currency. Statement I is a similar example of portability <\/span><span>where a piece of clothing is passed down to use from one person to another. Statement II <\/span><span lang=\"EN-US\">is an example of clothing being used as portable currency since the servant is selling <\/span><span>them. Statement III is incorrect since the mass production and transportation of clothing <\/span><span>occurred after the nineteenth century. Hence, (3).<\/span><\/p>", "topic": "Application Question"}, {"number": 17, "sourceId": "77354", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\">Which of the following does the passage suggest increased as a result of the advent of <\/span><span>mass production and movement of clothing after the nineteenth century?<\/span><\/p>\n<p><span lang=\"EN-US\">I.<span>          <\/span>The quantity of used clothing available for use.<\/span><\/p>\n<p><span lang=\"EN-US\">II.<span>         <\/span>The methods and means for circulation and exchange of used clothing.<\/span><\/p>\n<p><span lang=\"EN-US\">III.<span>       <\/span>The number of histories carried by an article of clothing during its lifetime.<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Both I and II<\/span><\/p>", "<p><span lang=\"EN-US\">Both II and III<\/span><\/p>", "<p><span lang=\"EN-US\">Both I and III<\/span><\/p>", "<p><span lang=\"EN-US\">I, II and III<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">The passage clearly mentions statements I and II as the results of mass production. Statement III is mentioned in the third paragraph: second, third and fourth hand use of clothing spread across income groups and continents. Hence, (4).<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 18, "sourceId": "85157", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The sentences given in each question, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a letter. Choose the most logical order of sentences, from among the given choices, to construct a coherent paragraph. <\/span><\/p>\n<p>Note: Use the virtual keyboard provided to enter your answer.<\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\"><\/span><\/p>", "options": [], "answer": "BDCA", "answerLabel": "BDCA", "solution": "<p><span lang=\"EN-US\">B introduces the topic of the paragraph: the introduction of coffee in seventeenth century Europe, and its effects. So it has to be the first sentence. Thus options [1] and [3] are ruled out. 'Them' in C has no antecedent in B, so the BC link in [4] is invalid. Only BDCA in [2] is a logical sequence: D links the spread of rationalism (mentioned in B) to the kind of people who drank coffee; and C and A talk about how coffee helped them. Hence BDCA.<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 19, "sourceId": "85158", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The sentences given in each question, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a letter. Choose the most logical order of sentences, from among the given choices, to construct a coherent paragraph. <\/span><\/p>\n<p>Note: Use the virtual keyboard provided to enter your answer.<\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\"><\/span><\/p>", "options": [], "answer": "DECAB", "answerLabel": "DECAB", "solution": "<p><span lang=\"EN-US\">The word 'similar' in B suggests that it follows from some other sentence, i.e. that it is not a standalone sentence. So it cannot be the first sentence, and thus options [1] and [2] are ruled out. D makes a suitable opening sentence, as it introduces the topic of online arguments. The questions asked in E and C follow naturally from the one asked in D. 'Did she thank you...' in C follows from the idea of teaching a lesson in E, so the correct order of these two sentences is EC. A is the answer to these questions. B ends the sequence by expanding on the negative point made in A. Thus, the correct sequence is DECAB. Hence, DECAB.<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 20, "sourceId": "85159", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The sentences given in each question, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a letter. Choose the most logical order of sentences, from among the given choices, to construct a coherent paragraph. <\/span><\/p>\n<p>Note: Use the virtual keyboard provided to enter your answer.<\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\"><\/span><\/p>", "options": [], "answer": "FCADBE", "answerLabel": "FCADBE", "solution": "<p><span lang=\"EN-US\">F makes the most sense as the first sentence, as it introduces the topic of the loss of hydrogen molecules from the Earth's atmosphere into space. C, A and D make a logical sequence: C states how water molecules can be split into hydrogen and oxygen; A continues this point; and D mentions how the resulting hydrogen molecules escape into space. B and E conclude the sequence, with B talking about this process in the past, and E stating that it continues in the present. Therefore, the correct sequence is FCADBE.<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 21, "sourceId": "83011", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>In the following questions, a word has been used in sentences in four different ways. Select the option corresponding to the sentence in which the usage of the word is incorrect or inappropriate and enter it in the box.<\/p>\n<p>Note: Use the virtual keyboard to enter your answer.<\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">FOUL<\/span><\/p>\n<p><span lang=\"EN-US\">1] Dogs don't like to foul the place where they sleep.<\/span><\/p>\n<p><span lang=\"EN-US\">2] Nawab Hurmut Khan succeeded his father's inheritance but soon fell foul with his<em> <\/em>Maratha allies.<\/span><\/p>\n<p><span lang=\"EN-US\">3] With the kind of effort they have put in to develop the programs, it would only take an act of God to foul them up.<\/span><\/p>\n<p><span lang=\"EN-US\">4] In football, the penalty for a foul between downs is enforced from the succeeding spot.<\/span><\/p>\n<p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\"><\/span><\/p>", "options": [], "answer": "2", "answerLabel": "2", "solution": "<p><span lang=\"EN-US\">In (1), 'foul' is used correctly as a verb and means to make dirty or pollute. 'To foul up' something means to spoil or mess up something. So, (3) uses the correct expression. In (4), 'foul' means a violation of rules or collision. In (2), 'fell foul with' is an invalid expression. The correct phrase is 'fell foul of', which means came in conflict with. Hence, 2.<\/span><\/p>", "topic": "Incorrect Usage"}, {"number": 22, "sourceId": "83012", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>In the following questions, a word has been used in sentences in four different ways. Select the option corresponding to the sentence in which the usage of the word is incorrect or inappropriate and enter it in the box.<\/p>\n<p>Note: Use the virtual keyboard to enter your answer.<\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">GOOD<\/span><\/p>\n<p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">1] I expect a good number of people for the premiere of <em>The Great Gatsby<\/em>.<\/span><\/p>\n<p><span lang=\"EN-US\">2] Carlos played good today, though yesterday he had seemed completely out of form.<\/span><\/p>\n<p><span lang=\"EN-US\">3] Surely a person with such an unprepossessing visage can be up to no good?<\/span><\/p>\n<p><span lang=\"EN-US\">4] He claimed his actions were for the greater good, but few others would agree.<\/span><\/p>\n<p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\"><\/span><\/p>", "options": [], "answer": "2", "answerLabel": "2", "solution": "<p><span lang=\"EN-US\">In [1], 'good' means ample. In [3], the idiomatic phrase 'up to no good' means doing something bad. 'Greater good' in [4] means general benefit. Only in [2] is the word used incorrectly - the correct word should be 'well', i.e. the adverbial form of the adjective 'good'. Hence, 2.<\/span><\/p>", "topic": "Incorrect Usage"}, {"number": 23, "sourceId": "83013", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>In the following questions, a word has been used in sentences in four different ways. Select the option corresponding to the sentence in which the usage of the word is incorrect or inappropriate and enter it in the box.<\/p>\n<p>Note: Use the virtual keyboard to enter your answer.<\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">STICK<\/span><\/p>\n<p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">1] Commissioner Gordon tried to stick up for Batman but nobody was willing to listen.<\/span><\/p>\n<p><span lang=\"EN-US\">2] Please stick to the facts; we have no time to listen to long and rambling stories.<\/span><\/p>\n<p><span lang=\"EN-US\">3] In a team full of mediocre talents, her work tends to stick out for its originality.<\/span><\/p>\n<p><span lang=\"EN-US\">4] Please stick on this notice on the bulletin board on your way out.<\/span><\/p>\n<p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\"><\/span><\/p>", "options": [], "answer": "4", "answerLabel": "4", "solution": "<p><span lang=\"EN-US\">'To stick up for' in [1] means to support or defend. 'Stick to' in [2] means to stay faithful to. 'Stick out' in [3] means to be prominent. But the usage of 'stick' in [4] is incorrect: it should be 'stick this notice' rather than 'stick on this notice'. Hence, 4.<\/span><\/p>", "topic": "Incorrect Usage"}, {"number": 24, "sourceId": "218158", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><strong><span lang=\"EN-IN\">There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/span><\/strong><\/p><\/div><p><strong>Sentence:<\/strong>  The experience led to what can be described as Wonhyo’s ‘sudden enlightenment’.<\/p>\n<p><strong>Paragraph:<\/strong><\/p>\n<p>There is a tale that is widely known by Koreans, a tale even known by the dogs in the street (to draw on a Korean expression), and this is a good way to introduce Korean philosophy because it is symbolic of the tradition’s focus on the mind, or rather how the mind controls our lives. _ (1) _ Wonhyo (617-686 CE) and Uisang (625-702 CE) were two Korean monks who wanted to travel to Tang China to study with great Buddhist masters. However, their journey was derailed by a terrible storm. The two monks sought shelter, and retreated into a dark cave. There they became thirsty waiting for the treacherous storm to pass. _ (2) _ Fortunately, in the darkness of the cave, Wonhyo found a smooth vessel. He filled it with rainwater, and they drank deeply from it. Feeling refreshed, they peacefully slept. _ (3) _ But when they awoke the next morning, they were shocked. It turned out that they had slept in a tomb surrounded by skeletons, and the water that had refreshed them had been scooped up in a decaying human skull. _ (4) _. Wonhyo remained in Korea, convinced that he did not need to travel afar to understand the nature of reality, while his friend went to China where his ideas were very influential.<\/p>", "options": ["<p><span lang=\"EN-IN\">Option 1<\/span><\/p>", "<p><span lang=\"EN-IN\">Option 2<\/span><\/p>", "<p><span lang=\"EN-IN\">Option 3<\/span><\/p>", "<p><span lang=\"EN-IN\">Option 4<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p>At blank 4, the statement is best suited as it is conclusive of all the above mentioned experiences followed with the ultimate fate of Wonhyo. <strong>So, answer is option 4.<\/strong><\/p>\n<p>Option 1: At this blank the lines preceding are not related to any experience of enlightenment.<\/p>\n<p>Option 2: At this blank the statement interrupts the continuity of events in the cave.<\/p>\n<p>Option 3:  It serves to disjoin the clear link between asleep and awoke.<\/p>\n<p>Hence, [4].<\/p>", "topic": "Paragraph Completion"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;
function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
