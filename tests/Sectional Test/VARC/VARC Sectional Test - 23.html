 to count against videogames as being\r\n  fictional, it also counts against uncontested fictions like plays, special\r\n  effects-laden films and television drama.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>To illustrate this,\r\n  let us imagine a fiction in which it is the case that a man named Liberty\r\n  Valance is shot with a gun. In a short story about these events, the gun is\r\n  referred to through the descriptions in the text. This kind of linguistic\r\n  fictive <i>prop<\/i> uses descriptions to depict the gun, and relies on the\r\n  reader's imagination to fill out the representational gaps; subsequently,\r\n  different readers might imagine the gun in quite different ways. The same or\r\n  similar fiction might be represented through a picture book: in this case\r\n  simple line drawings are used, in addition to the text, to represent the gun.\r\n  But though the gun is now given a much more determinate appearance \"“ it is\r\n  now clearly a six-shooter, perhaps \"“ it is no less fictional in having no\r\n  real existence. Now imagine the same fiction in a movie setting. The fictive\r\n  representation is now film footage of an actor holding a prop gun, and so the\r\n  fiction has become even more representationally robust than the picture book,\r\n  so much so that the gun might obviously be a Smith and Wesson six-shooter. In\r\n  fact, the movie drama might not even use a filmed physical prop gun to\r\n  represent the gun, given that computer graphics might be used instead, as\r\n  they have increasingly been used in many recent movies. Nevertheless, whether\r\n  the gun is depicted by a physical prop, computer graphics, or even a real\r\n  unloaded gun, the gun that shot Liberty Valance is no less fictional because\r\n  it is only imaginary that Liberty Valance was shot.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>Next, imagine a\r\n  videogame based on this fiction, in which the player-character is the man who\r\n  shot Liberty Valance. The gun in this case is a dynamical graphical model,\r\n  and in this case, the player uses it to shoot Liberty Valance. Note that the\r\n  videogame gun is very similar in terms of media to a computer-generated film\r\n  gun, so on Aarseth's logic if one is to be virtual so should the other. But\r\n  there is absolutely no temptation to think that the gun in the film is\r\n  virtual <i>rather<\/i> <i>than <\/i>fictional because we can clearly see that\r\n  its only difference to a traditional prop gun is in terms of its\r\n  representational medium: both artefacts represent an event that is only\r\n  imagined to exist, though one is made of wood and metal, and the other of\r\n  polygons. Perhaps we might say that the virtuality of the computer-generated\r\n  gun derives directly from its medium, and so that computer-generated guns are\r\n  virtual <i>as well<\/i> <i>as <\/i>fictional. But what this would show is that<i>\r\n  fictional <\/i>and<i> virtual <\/i>are non-contradictory categorizations, in\r\n  that a computer-generated film prop can be both fictional and virtual. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span\r\n  lang=EN-US>What is common to all of these cases of prop guns is that the\r\n  representational prop stands <i>proxy<\/i> for a fictional object having no\r\n  real existence: there really was no gun used to shoot Liberty Valance. This\r\n  commonality across all these cases motivates extending the classification of <i>fiction<\/i>\r\n  to videogames, though they are a different <i>kind<\/i> of fiction.<\/span><span\r\n  lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following would the author agree with?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">A physical prop gun used in a movie is less fictional than a computer-generated gun.<\/span><\/p>", "<p><span lang=\"EN-US\">A gun used in a movie or a play is less fictional than a gun in a book or videogame, as an actual gun can be used in the former media.<\/span><\/p>", "<p><span lang=\"EN-US\">A gun in a book is more fictional than a gun in a movie, as in the former case, people have to rely on their own imagination to picture it.<\/span><\/p>", "<p><span lang=\"EN-US\">None of the above.<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">The author's main point in paragraphs 3 and 4 (and indeed, in the passage as a whole) is that a prop such as a gun used in any form of fiction \"“ books, movies, plays, videogames \"“ is equally fictional. He rejects the idea that the physical reality of the prop in question makes it less fictional/non-fictional. Thus he would disagree with options [1], [2] and [3]. Hence, [4].<\/span><\/p>", "topic": "Application Question"}, {"number": 14, "sourceId": "84494", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">One common response of human beings to infection is to develop a fever. We're used to considering fever as a 'symptom of disease', as if it developed inevitably without serving any function. But regulation of body temperature is under our genetic control and doesn't just happen by accident. A few microbes are more sensitive to heat than our own bodies are. By raising our body temperature, we in effect try to bake the germs to death before we get baked ourselves.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Another common response of ours is to mobilize our immune system. White blood cells and other cells of ours actively seek out and kill foreign microbes. The specific antibodies that we gradually build up against a particular microbe infecting us make us less likely to get reinfected once we become cured. As we all know from experience, there are some illnesses, such as flu and the common cold, to which our resistance is only temporary; we can eventually contract the illness again. Against other illnesses, though – including measles, mumps, rubella, pertussis and the now defeated smallpox – our antibodies stimulated by one infection confer lifelong immunity. That's the principle of vaccination: to stimulate our antibody production without our having to go through the actual experience of the disease, by inoculating us with a dead or weakened strain of microbe.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Alas, some clever microbes don't just cave in to our immune defences. Some have learned to trick us by changing those molecular pieces of the microbe (its so-called antigens) that our antibodies recognize. The constant evolution or recycling of new strains of flu, with differing antigens, explains why your having gotten flu two years ago didn't protect you against the different strain that arrived this year. Malaria and sleeping sickness are even more slippery customers in their ability rapidly to change their antigens. Among the slipperiest of all is AIDS, which evolves new antigens even as it sits within an individual patient, thereby eventually overwhelming his or her immune system.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Our slowest defensive response is through natural selection, which changes our gene frequencies from generation to generation. For almost any disease, some people prove to be genetically more resistant than are others. In an epidemic those people with genes for resistance to that particular microbe are more likely to survive than are people lacking such genes. As a result, over the course of history, human populations repeatedly exposed to a particular pathogen have come to consist of a higher proportion of individuals with those genes for resistance – just because unfortunate individuals without the genes were less likely to survive to pass their genes on to babies.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">While this evolutionary response is not one that does the genetically susceptible dying individual any good, it does mean, though, that a human population as a whole becomes better protected against the pathogen. Examples of those genetic defences include the protections (at a price) that the sickle-cell gene, Tay-Sachs gene, and cystic fibrosis gene may confer on African blacks, Ashkenazi Jews and northern Europeans against malaria, tuberculosis and, respectively.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Microbes evolved to feed on the nutrients within our bodies, and they need to reach a new victim's body once the original victim is dead or resistant. Hence many germs have had to evolve tricks to let them spread between potential victims, and many of those tricks are what we experience as 'symptoms of disease'. We've evolved countertricks of our own, to which the germs have responded by evolving counter-countertricks. We and our pathogens are now locked in an escalating evolutionary contest, with the death of one contestant the price of defeat, and with natural selection playing the role of umpire.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">What is the author's main purpose in writing this passage?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">To explain how microbes evolve and affect human beings<\/span><\/p>", "<p><span lang=\"EN-US\">To explain why humans are more susceptible to certain diseases than others<\/span><\/p>", "<p><span lang=\"EN-US\">To describe the evolutionary contest between human beings and microbes<\/span><\/p>", "<p><span lang=\"EN-US\">To describe human beings' responses to disease-causing microbes<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">While the evolution of microbes is mentioned in paragraphs 3 and 6, it is not dealt with in any great detail in this passage, so [1] is incorrect. [2] is not discussed at all in the passage, so it can be dismissed completely. The idea of an 'evolutionary contest' is brought up only in the last paragraph, so it cannot be said to be the author's main purpose in writing this passage. [4] is the most suitable answer: throughout this passage, the author describes how human beings respond to microbial infection: by developing a fever or mobilizing the immune system, or through natural selection (with people without resistance to certain diseases dying off). Hence, [4].<\/span><\/p>", "topic": "Primary Purpose"}, {"number": 15, "sourceId": "84495", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">One common response of human beings to infection is to develop a fever. We're used to considering fever as a 'symptom of disease', as if it developed inevitably without serving any function. But regulation of body temperature is under our genetic control and doesn't just happen by accident. A few microbes are more sensitive to heat than our own bodies are. By raising our body temperature, we in effect try to bake the germs to death before we get baked ourselves.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Another common response of ours is to mobilize our immune system. White blood cells and other cells of ours actively seek out and kill foreign microbes. The specific antibodies that we gradually build up against a particular microbe infecting us make us less likely to get reinfected once we become cured. As we all know from experience, there are some illnesses, such as flu and the common cold, to which our resistance is only temporary; we can eventually contract the illness again. Against other illnesses, though – including measles, mumps, rubella, pertussis and the now defeated smallpox – our antibodies stimulated by one infection confer lifelong immunity. That's the principle of vaccination: to stimulate our antibody production without our having to go through the actual experience of the disease, by inoculating us with a dead or weakened strain of microbe.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Alas, some clever microbes don't just cave in to our immune defences. Some have learned to trick us by changing those molecular pieces of the microbe (its so-called antigens) that our antibodies recognize. The constant evolution or recycling of new strains of flu, with differing antigens, explains why your having gotten flu two years ago didn't protect you against the different strain that arrived this year. Malaria and sleeping sickness are even more slippery customers in their ability rapidly to change their antigens. Among the slipperiest of all is AIDS, which evolves new antigens even as it sits within an individual patient, thereby eventually overwhelming his or her immune system.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Our slowest defensive response is through natural selection, which changes our gene frequencies from generation to generation. For almost any disease, some people prove to be genetically more resistant than are others. In an epidemic those people with genes for resistance to that particular microbe are more likely to survive than are people lacking such genes. As a result, over the course of history, human populations repeatedly exposed to a particular pathogen have come to consist of a higher proportion of individuals with those genes for resistance – just because unfortunate individuals without the genes were less likely to survive to pass their genes on to babies.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">While this evolutionary response is not one that does the genetically susceptible dying individual any good, it does mean, though, that a human population as a whole becomes better protected against the pathogen. Examples of those genetic defences include the protections (at a price) that the sickle-cell gene, Tay-Sachs gene, and cystic fibrosis gene may confer on African blacks, Ashkenazi Jews and northern Europeans against malaria, tuberculosis and, respectively.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Microbes evolved to feed on the nutrients within our bodies, and they need to reach a new victim's body once the original victim is dead or resistant. Hence many germs have had to evolve tricks to let them spread between potential victims, and many of those tricks are what we experience as 'symptoms of disease'. We've evolved countertricks of our own, to which the germs have responded by evolving counter-countertricks. We and our pathogens are now locked in an escalating evolutionary contest, with the death of one contestant the price of defeat, and with natural selection playing the role of umpire.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">Choose the correct statement.<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">The cystic fibrosis gene protects African blacks against malaria.<\/span><\/p>", "<p><span lang=\"EN-US\">Diseases such as sleeping sickness cannot be vaccinated against.<\/span><\/p>", "<p><span lang=\"EN-US\">Human beings have a natural immunity against diseases such as rubella.<\/span><\/p>", "<p><span lang=\"EN-US\">Human populations that are regularly exposed to particular microbes do not get a chance to develop resistance to them.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">Refer to the penultimate paragraph: the cystic fibrosis gene protects northern Europeans against bacterial diarrhoeas. So [1] is incorrect. According to the second paragraph, human beings have to be vaccinated against rubella, so [3] cannot be true. [4] contradicts the last sentence of the fourth paragraph. Only [2] is correct: according to paragraph 3, the microbes causing diseases such as malaria, sleeping sickness and AIDS change their antigens rapidly, and so (as can be inferred from paragraphs 2 and 3), vaccination would not work against them. Hence, [2].<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 16, "sourceId": "84496", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">One common response of human beings to infection is to develop a fever. We're used to considering fever as a 'symptom of disease', as if it developed inevitably without serving any function. But regulation of body temperature is under our genetic control and doesn't just happen by accident. A few microbes are more sensitive to heat than our own bodies are. By raising our body temperature, we in effect try to bake the germs to death before we get baked ourselves.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Another common response of ours is to mobilize our immune system. White blood cells and other cells of ours actively seek out and kill foreign microbes. The specific antibodies that we gradually build up against a particular microbe infecting us make us less likely to get reinfected once we become cured. As we all know from experience, there are some illnesses, such as flu and the common cold, to which our resistance is only temporary; we can eventually contract the illness again. Against other illnesses, though – including measles, mumps, rubella, pertussis and the now defeated smallpox – our antibodies stimulated by one infection confer lifelong immunity. That's the principle of vaccination: to stimulate our antibody production without our having to go through the actual experience of the disease, by inoculating us with a dead or weakened strain of microbe.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Alas, some clever microbes don't just cave in to our immune defences. Some have learned to trick us by changing those molecular pieces of the microbe (its so-called antigens) that our antibodies recognize. The constant evolution or recycling of new strains of flu, with differing antigens, explains why your having gotten flu two years ago didn't protect you against the different strain that arrived this year. Malaria and sleeping sickness are even more slippery customers in their ability rapidly to change their antigens. Among the slipperiest of all is AIDS, which evolves new antigens even as it sits within an individual patient, thereby eventually overwhelming his or her immune system.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Our slowest defensive response is through natural selection, which changes our gene frequencies from generation to generation. For almost any disease, some people prove to be genetically more resistant than are others. In an epidemic those people with genes for resistance to that particular microbe are more likely to survive than are people lacking such genes. As a result, over the course of history, human populations repeatedly exposed to a particular pathogen have come to consist of a higher proportion of individuals with those genes for resistance – just because unfortunate individuals without the genes were less likely to survive to pass their genes on to babies.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">While this evolutionary response is not one that does the genetically susceptible dying individual any good, it does mean, though, that a human population as a whole becomes better protected against the pathogen. Examples of those genetic defences include the protections (at a price) that the sickle-cell gene, Tay-Sachs gene, and cystic fibrosis gene may confer on African blacks, Ashkenazi Jews and northern Europeans against malaria, tuberculosis and, respectively.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Microbes evolved to feed on the nutrients within our bodies, and they need to reach a new victim's body once the original victim is dead or resistant. Hence many germs have had to evolve tricks to let them spread between potential victims, and many of those tricks are what we experience as 'symptoms of disease'. We've evolved countertricks of our own, to which the germs have responded by evolving counter-countertricks. We and our pathogens are now locked in an escalating evolutionary contest, with the death of one contestant the price of defeat, and with natural selection playing the role of umpire.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">What is the most likely source of this passage?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">An article in a medical journal<\/span><\/p>", "<p><span lang=\"EN-US\">An article in a popular science magazine<\/span><\/p>", "<p><span lang=\"EN-US\">A chapter on genetic diseases in a biology textbook<\/span><\/p>", "<p><span lang=\"EN-US\">A blog post on microbes and infections<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">This passage provides very basic information on how the human body defends against diseases caused by microbes. A medical journal would publish much more specialized information, so [1] is not a likely source. This passage talks about infectious diseases (i.e. those caused by germs) not genetic diseases, so [3] is completely incorrect. A blog post would probably be more informal in style, so [4] can also be ruled out. The most likely answer is [2]: an article in a popular science magazine would likely feature such basic scientific information written in moderately formal language. Hence, [2].<\/span><\/p>", "topic": "Application Question"}, {"number": 17, "sourceId": "84497", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">One common response of human beings to infection is to develop a fever. We're used to considering fever as a 'symptom of disease', as if it developed inevitably without serving any function. But regulation of body temperature is under our genetic control and doesn't just happen by accident. A few microbes are more sensitive to heat than our own bodies are. By raising our body temperature, we in effect try to bake the germs to death before we get baked ourselves.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Another common response of ours is to mobilize our immune system. White blood cells and other cells of ours actively seek out and kill foreign microbes. The specific antibodies that we gradually build up against a particular microbe infecting us make us less likely to get reinfected once we become cured. As we all know from experience, there are some illnesses, such as flu and the common cold, to which our resistance is only temporary; we can eventually contract the illness again. Against other illnesses, though – including measles, mumps, rubella, pertussis and the now defeated smallpox – our antibodies stimulated by one infection confer lifelong immunity. That's the principle of vaccination: to stimulate our antibody production without our having to go through the actual experience of the disease, by inoculating us with a dead or weakened strain of microbe.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Alas, some clever microbes don't just cave in to our immune defences. Some have learned to trick us by changing those molecular pieces of the microbe (its so-called antigens) that our antibodies recognize. The constant evolution or recycling of new strains of flu, with differing antigens, explains why your having gotten flu two years ago didn't protect you against the different strain that arrived this year. Malaria and sleeping sickness are even more slippery customers in their ability rapidly to change their antigens. Among the slipperiest of all is AIDS, which evolves new antigens even as it sits within an individual patient, thereby eventually overwhelming his or her immune system.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Our slowest defensive response is through natural selection, which changes our gene frequencies from generation to generation. For almost any disease, some people prove to be genetically more resistant than are others. In an epidemic those people with genes for resistance to that particular microbe are more likely to survive than are people lacking such genes. As a result, over the course of history, human populations repeatedly exposed to a particular pathogen have come to consist of a higher proportion of individuals with those genes for resistance – just because unfortunate individuals without the genes were less likely to survive to pass their genes on to babies.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">While this evolutionary response is not one that does the genetically susceptible dying individual any good, it does mean, though, that a human population as a whole becomes better protected against the pathogen. Examples of those genetic defences include the protections (at a price) that the sickle-cell gene, Tay-Sachs gene, and cystic fibrosis gene may confer on African blacks, Ashkenazi Jews and northern Europeans against malaria, tuberculosis and, respectively.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Microbes evolved to feed on the nutrients within our bodies, and they need to reach a new victim's body once the original victim is dead or resistant. Hence many germs have had to evolve tricks to let them spread between potential victims, and many of those tricks are what we experience as 'symptoms of disease'. We've evolved countertricks of our own, to which the germs have responded by evolving counter-countertricks. We and our pathogens are now locked in an escalating evolutionary contest, with the death of one contestant the price of defeat, and with natural selection playing the role of umpire.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">According to the author, 'symptoms of disease' really are:<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Tricks used by microbes to kill their human hosts.<\/span><\/p>", "<p><span lang=\"EN-US\">Tricks that microbes have evolved to infect their human victims.<\/span><\/p>", "<p><span lang=\"EN-US\">A reaction to a microbial infection by the human body.<\/span><\/p>", "<p><span lang=\"EN-US\">Both [2] and [3].<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">Refer to the first paragraph. The author shows that fever, which we consider a 'symptom of disease', is in fact our bodies' way of fighting against microbial infection. So [3] is correct. In the last paragraph, the author also says that the tricks that let germs spread between potential victims are what we experience as 'symptoms of disease'. So [2] is also correct. [1] is not mentioned in this context. Hence, [4].<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 18, "sourceId": "86503", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">Four alternative summaries are given below each text. Choose the option that best captures the essence of the text and enter its number in the box provided below.<\/span><\/p>\n<p><span lang=\"EN-US\">Note: Use the virtual keyboard provided to enter your answer.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">Since all decisions involve uncertainty about the future, the human brain you use to make decisions has evolved an automatic and unconscious system for judging how to proceed when a potential for loss arises. Organisms that placed more urgency on avoiding threats than they did on maximizing opportunities were more likely to pass on their genes. So, over time, the prospect of losses has become a more powerful motivator on your behaviour than the promise of gains. Whenever possible, you try to avoid losses of any kind, and when comparing losses to gains you don't treat them equally.<\/span><\/p>\n<p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p>1. Human behaviour is nowadays motivated more by the prospect of loss rather than the promise of gain.<\/p>\n\n<p>2. Over time, human behaviour has evolved to favour the prospect of loss over the promise of gain.<\/p>\n\n<p>3. The human brain has now evolved to such an extent that it prefers the prospect of loss to the promise of gain.<\/p>\n\n<p>4. Evolution has resulted in the prospect of loss being a bigger motivator for human behaviour than the promise of gain.<\/p>\n<p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\"><\/span><\/p>", "options": [], "answer": "4", "answerLabel": "4", "solution": "<p><span lang=\"EN-US\">According to the paragraph, human beings are more motivated by the prospect of loss (i.e. they are motivated to <em>avoid<\/em> loss) than by the promise of gain. They do not <em>prefer<\/em> loss over gain, as stated in 2 and 3. Between 1 and 4, the latter is a better answer, as it includes the important point in the paragraph that these motivations have an evolutionary basis. Hence, 4.<\/span><\/p>", "topic": "Summary"}, {"number": 19, "sourceId": "86504", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">Four alternative summaries are given below each text. Choose the option that best captures the essence of the text and enter its number in the box provided below.<\/span><\/p>\n<p><span lang=\"EN-US\">Note: Use the virtual keyboard provided to enter your answer.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">Imagine playing the role of an intelligent designer, planning a universe fit for life. The present universe works well enough, but how much could you change without spoiling things? It's possible that you could do away with some sorts of galaxies or eliminate giant black holes. Some small stars and large planets might be superfluous. At the atomic level, you could probably get rid of a few elements, but most are needed somewhere in the life story. At a more fundamental level, you would be wise to leave things completely alone. Getting rid of electrons would be a disaster, as chemistry would then be impossible. Abolishing neutrons would rule out any element other than hydrogen. The inventory of fundamental particles is not a good place to tinker. Even meddling with the properties of these particles would be risky.<\/span><\/p>\n<p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p>1. An intelligent designer planning a universe fit for life could change some things like stars and galaxies, but changing things like electrons and neutrons would be impossible.<\/p>\n\n<p>2. An intelligent designer planning a universe fit for life would be allowed to make changes at the level of stars and galaxies, but not at more fundamental levels, such as atoms.<\/p>\n\n<p>3. An intelligent designer planning a universe fit for life could change some things at the level of stars and galaxies, but changes at more fundamental levels would be inadvisable.<\/p>\n\n<p>4. An intelligent designer planning a universe fit for life could make some changes in stars, galaxies, elements, electrons, etc., but changes at the fundamental level would be risky.<\/p>\n<p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\"><\/span><\/p>", "options": [], "answer": "3", "answerLabel": "3", "solution": "<p><span lang=\"EN-US\">According to the paragraph, making changes at the level of electrons and neutrons would not be a good idea as it would be risky; but it would not necessarily be 'impossible' or 'not allowed'. So both 1 and 2 change the meaning of the paragraph, and thus can be eliminated. 4 wrongly includes electrons in the list of things that would be safe to change. Only 3 summarizes the paragraph correctly. Hence, 3.<\/span><\/p>", "topic": "Summary"}, {"number": 20, "sourceId": "84467", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The sentences given in the following question, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a letter. Choose the most logical order of sentences, from among the given choices, to construct a coherent paragraph.<\/span><\/p>\n<p><span lang=\"EN-US\">Note: Use the virtual keyboard provided to enter your answer.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\"><\/span><\/p>", "options": [], "answer": "DCBEA", "answerLabel": "DCBEA", "solution": "<p><span lang=\"EN-US\">In this sequence, the first and last sentences are the easiest to identify. D has to be the first one, as it introduces the topic of the paragraph: difficulty in describing the supernatural. A has to be the last sentence, as it states that despite this difficulty (examples of which are given in the remaining three sentences), people have managed to create images of the supernatural. Thus, options [1] and [2], which do not have both D and A as the first and concluding sentences respectively, can be ruled out. The DE link in [3] makes no sense, as there is nothing in D that 'much earlier' in E could be referring to. E can follow only from either B or C, both of which refer to time periods. Therefore, only [4] has the correct sequence: DCBEA.<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 21, "sourceId": "84468", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The sentences given in the following question, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a letter. Choose the most logical order of sentences, from among the given choices, to construct a coherent paragraph.<\/span><\/p>\n<p><span lang=\"EN-US\">Note: Use the virtual keyboard provided to enter your answer.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\"><\/span><\/p>", "options": [], "answer": "EBADC", "answerLabel": "EBADC", "solution": "<p><span lang=\"EN-US\">Sentence E introduces the topic of the paragraph: the use of lead white in makeup. 'It' in B refers to 'lead white', so B follows from E; also, B continues the point made in E chronologically. A and D are clearly linked, as D explains how the lead makeup would make the wearer 'feel more attractive' (as stated in A). C concludes the point about the damage caused by using lead white in makeup. Thus, the correct sequence is EBADC. Hence, [3].<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 22, "sourceId": "84469", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The sentences given in each question, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a letter. Enter in the box provided below the most logical order of sentences to construct a coherent paragraph.<\/span><\/p>\n<p><em><span lang=\"EN-US\">Note: Use the virtual keyboard provided to enter your answer. <\/span><\/em><\/p><\/div><p><span><\/span><\/p>", "options": [], "answer": "AECBD", "answerLabel": "AECBD", "solution": "<p><span lang=\"EN-US\">A and D are the only standalone sentences in this paragraph. The mention of 'Einstein' links A to both C and E. E logically follows from A, as it expands on Einstein's view of an eternal universe, while C contradicts them both by providing evidence of an expanding universe. 'This evidence' in B refers to the 'astronomical observations' in C. D thus makes most sense as a concluding sentence (since it provides an example of what is stated in B), rather than an introductory one. The BD link at the end means A can be accommodated only as the introductory sentence of the paragraph. Hence, AECBD.<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 23, "sourceId": "84485", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">In the following question, there are sentences that form a paragraph. Identify the sentence(s) or part(s) of sentence(s) that is/are correct in terms of grammar and usage (including spelling, punctuation and logical consistency). Enter in the box provided below the letters corresponding only to the correct sentences in alphabetical order.<\/span><\/p>\n<p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><em><span lang=\"EN-US\">Note: Your answer should be in alphabetical order. Use the virtual keyboard provided to enter your answer. <\/span><\/em><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\"> <\/span><\/p>", "options": [], "answer": "BD", "answerLabel": "BD", "solution": "<p><span lang=\"EN-US\">In A, the correct word should be 'mendicant' (meaning 'beggar') not 'medicant' (meaning 'medicine'). In C, 'identification' should be followed by the preposition 'with' not 'of' in this context, to suggest empathy or similarity rather than recognition. In E, the verb 'had transmitted' is incorrectly in the active voice; it should be in the passive form 'had been transmitted'. The remaining two statements, B and D are fully correct. Hence, BD.<\/span><\/p>", "topic": "Miscellaneous Concepts"}, {"number": 24, "sourceId": "85930", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">In the following question, a word has been used in sentences in four different ways. Identify the sentence/s in which the usage of the word is incorrect or inappropriate. Enter in the box provided below the numbers corresponding only to the sentence/s in which the usage of the word is incorrect or inappropriate, in increasing order. If the word has been used correctly in all the sentences, indicate your answer as 5.<\/span><\/p>\n<p><span lang=\"EN-US\">Note: Use the virtual keyboard provided to enter your answer.<\/span><\/p><\/div><p><span><br /><\/span><\/p>\n<p><span>PUSH<\/span><\/p>\n<p><span><br /><\/span><\/p>\n<p><span>1.<\/span><span>   <\/span><span>The senior members of the staff push the junior ones around unmercifully.<\/span><\/p>\n<p><span lang=\"EN-US\">2.<span>   <\/span>They intend to push up with the project, despite the financial difficulties.<\/span><\/p>\n<p><span lang=\"EN-US\">3.<span>   <\/span>The workers have joined together to push for better working hours and overtime pay.<\/span><\/p>\n<p><span lang=\"EN-US\">4.<span>   <\/span>The engineers are trying to push at the envelope in coming up with new features for the product.<\/span><\/p>\n<p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span><\/span><\/p>\n<p><span lang=\"EN-US\"> <\/span><\/p>", "options": [], "answer": "24", "answerLabel": "24", "solution": "<p><span lang=\"EN-US\"> In 1, to 'push someone around' means to 'bully them' or 'give them orders', so it is correct. 'Push up' in 2 is used incorrectly – the correct phrasal verb in the context should be 'push on', meaning to 'proceed' or 'continue with something'. To 'push for' in 3 means to 'demand something', so it correct. In 4, the correct idiomatic phrase should be 'push the envelope' (exceed existing limits), not 'push at the envelope'. Thus, 'push' is used incorrectly in both 2 and 4. Hence, 24.<\/span><\/p>", "topic": "Incorrect Usage"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;
function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
