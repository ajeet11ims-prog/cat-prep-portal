<script type="application/json" id="test-data">{"testNumber": 23, "simcat": 8, "minutes": 40, "questions": [{"number": 1, "sourceId": "85135", "type": "mcq", "passage": "<p><span lang=\"EN-US\">Most languages have a number of relatives, sharing some common familial features. However, even speakers of closely related varieties - Spanish and Italian, for instance - cannot expect full mutual comprehension, and reciprocal unintelligibility clearly increases with linguistic distance. Indeed, one would expect no overlapping between languages as far apart as Finnish and Thai. As subvarieties under a common language roof, <em>dialects<\/em> are formally defined as mutually intelligible variants, differing one from another along three dimensions: vocabulary, grammar and pronunciation. In some English dialects, speakers <em>brew<\/em> their tea; others let it <em>mash<\/em>, or <em>sit<\/em>, or <em>steep<\/em>. In others, <em>frying-pans<\/em> become <em>skillets<\/em>, and <em>milk shakes<\/em> become <em>frappes<\/em> or perhaps even <em>cabinets<\/em>. Few would deny that these lexical variants are anything other than different from one another or would assert that <em>bonnet<\/em> is better than <em>hood<\/em>, that <em>boot<\/em> makes more sense than <em>trunk<\/em>, that <em>tube<\/em> is more appropriate than <em>subway<\/em>. <\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">When it comes to grammatical variation, however, many people are rather less tolerant: when, for instance, they hear someone say, 'I done it yesterday,' or 'I ain't never goin' there again,' or 'I ax Billy can he play tomorrow.' There is in fact ample scholarly evidence that <em>all<\/em> dialects are valid systems of communication, and that none is intrinsically better or worse than another. It is logical to assume that every group of speakers has a communication system that works for them with the precision called for in their social circumstances and without ambiguity. It is illogical to think that some groups manage to get by without such a system. Speakers of all dialects, then, speak correctly. The only appropriate yardsticks of correctness are community norms. Problems arise because not all communities and dialects have equal social clout, because the linguistic standards of those in power become dominant, and because social dominance (in language as elsewhere) allows difference to be considered deficiency.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Despite the definition, dialects of a language are not always mutual intelligible. The inhabitants of Tangier Island in Chesapeake Bay, USA, certainly speak English, but their dialect is virtually impenetrable for mainland American speakers. In UK, a popular English television programme, <em>Auf Wiedersehen, Pet<\/em>, had characters who had such thick Geordie accents (the working-class dialect of Newcastle-upon-Tyne, a city in northern England) that viewers in the south of England requested subtitles. Indeed, most of us have encountered varieties of our own language that fail the mutual-intelligibility test.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Suppose that there are four dialect communities, A, B, C and D. Suppose that speakers of A and B can easily understand one another, that those in groups A and C have some considerable difficulty, and that speakers of A and D simply cannot communicate. Does this mean that A and D are actually different languages? Not necessarily. If speakers of B and C can understand each other, and so can speakers of C and D, then at what point can A and D be said to become separate languages?<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The suggestion made by the linguist Max Weinreich that 'a language is a dialect that has an army and navy' illustrates another point of confusion between languages and dialects. Speakers of Norwegian and Danish can understand each other well \"“ Swedish might go into the mix, as well \"“ but the demands of political identity require that their varieties are styled languages. A similar situation applies to Hindi and Urdu, to Czech and Slovak, and to other pairs and triplets.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The story of Serbo-Croatian is a rather poignant example of social interference in the name of identity. The language was a common variety among not just Serbs and Croats but also Bosnians and Montenegrins. There were, to be sure, internal variants, pressures and complaints, but the language as such was widely used and accepted. With the breakup of Yugoslavia, Serbo-Croatian lost its official existence, to be replaced by Bosnian, Serbian and Croatian.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following questions is not answered in this passage?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">How do dialects arise?<\/span><\/p>", "<p><span lang=\"EN-US\">What is the difference between languages and dialects?<\/span><\/p>", "<p><span lang=\"EN-US\">In what ways do dialects differ from each other?<\/span><\/p>", "<p><span lang=\"EN-US\">Are some dialects better than others?<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\">In the first paragraph, the author defines dialects by calling them subvarieties of a common language. So the question in [2] is answered in this passage. In the same paragraph, it is stated that dialects differ from one another along three dimensions: vocabulary, grammar and pronunciation. So [3] is answered as well. [4] is answered in the negative in the second paragraph. Only [1] is not answered rwegian and Danish can understand each other well \"“ Swedish might go into the mix, as well \"“ but the demands of political identity require that their varieties are styled languages. A similar situation applies to Hindi and Urdu, to Czech and Slovak, and to other pairs and triplets.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The story of Serbo-Croatian is a rather poignant example of social interference in the name of identity. The language was a common variety among not just Serbs and Croats but also Bosnians and Montenegrins. There were, to be sure, internal variants, pressures and complaints, but the language as such was widely used and accepted. With the breakup of Yugoslavia, Serbo-Croatian lost its official existence, to be replaced by Bosnian, Serbian and Croatian.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following statements would the author most likely agree with?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">The Serbo-Croatian language was replaced by completely different languages when Yugoslavia broke up.<\/span><\/p>", "<p><span lang=\"EN-US\">There is no significant difference between the dialects of northern and southern England.<\/span><\/p>", "<p><span lang=\"EN-US\">The language spoken on Tangier Island cannot be called English, as it is not understood by mainstream English speakers.<\/span><\/p>", "<p><span lang=\"EN-US\">Most speakers of English would agree that both the British English word <em>lift<\/em> and the American English word <em>elevator<\/em> are equally correct.<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">Refer to the last two paragraphs. The point the author i dialect communities, A, B, C and D. Suppose that speakers of A and B can easily understand one another, that those in groups A and C have some considerable difficulty, and that speakers of A and D simply cannot communicate. Does this mean that A and D are actually different languages? Not necessarily. If speakers of B and C can understand each other, and so can speakers of C and D, then at what point can A and D be said to become separate languages?<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The suggestion made by the linguist Max Weinreich that 'a language is a dialect that has an army and navy' illustrates another point of confusion between languages and dialects. Speakers of Norwegian and Danish can understand each other well \"“ Swedish might go into the mix, as well \"“ but the demands of political identity require that their varieties are styled languages. A similar situation applies to Hindi and Urdu, to Czech and Slovak, and to other pairs and triplets.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The story of Serbo-Croatian is a rather poignant example of social interference in the name of identity. The language was a common variety among not just Serbs and Croats but also Bosnians and Montenegrins. There were, to be sure, internal variants, pressures and complaints, but the language as such was widely used and accepted. With the breakup of Yugoslavia, Serbo-Croatian lost its official existence, to be replaced by Bosnian, Serbian and Croatian.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">What is the point the author is making in the second paragraph?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Grammatical variation in dialects is less tolerable than lexical variation.<\/span><\/p>", "<p><span lang=\"EN-US\">There is no such thing as an inherently grammatically incorrect dialect.<\/span><\/p>", "<p><span lang=\"EN-US\">Some dialects are less adaptable to social circumstances than others.<\/span><\/p>", "<p><span lang=\"EN-US\">Socially speaking, all dialects are valid, regardless of their grammatical correctness.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">According to the second paragraph, grammatical variation in dialects is less <em>tolerated<\/em> by people in general than lexical variation, not less <em>tolerable<\/em> (the latter would imply that this is an objective characteristic, which is not the case), so [1] is incorrect. [3] is the exact opposite of what the author states in this paragraph. According to the author, all dialects are valid from the linguistic point of view, not the social, so [4] misinterprets his point. Only [2] correctly states his point in the second paragraph: he states that '<em>all<\/em> dialects are valid systems of communication, and that none is intrinsically better or worse than another' and that 'speakers of all dialects, then, speak correctly'. Hence, [2].<\/span><\/p>", "topic": "Logical Structure"}, {"number": 4, "sourceId": "85139", "type": "mcq", "passage": "<p><span lang=\"EN-US\">Most languages have a number of relatives, sharing some common familial features. However, even speakers of closely related varieties - Spanish and Italian, for instance - cannot expect full mutual comprehension, and reciprocal unintelligibility clearly increases with linguistic distance. Indeed, one would expect no overlapping between languages as far apart as Finnish and Thai. As subvarieties under a common language roof, <em>dialects<\/em> are formally defined as mutually intelligible variants, differing one from another along three dimensions: vocabulary, grammar and pronunciation. In some English dialects, speakers <em>brew<\/em> their tea; others let it <em>mash<\/em>, or <em>sit<\/em>, or <em>steep<\/em>. In others, <em>frying-pans<\/em> become <em>skillets<\/em>, and <em>milk shakes<\/em> become <em>frappes<\/em> or perhaps even <em>cabinets<\/em>. Few would deny that these lexical variants are anything other than different from one another or would assert that <em>bonnet<\/em> is better than <em>hood<\/em>, that <em>boot<\/em> makes more sense than <em>trunk<\/em>, that <em>tube<\/em> is more appropriate than <em>subway<\/em>. <\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">When it comes to grammatical variation, however, many people are rather less tolerant: when, for instance, they hear someone say, 'I done it yesterday,' or 'I ain't never goin' there again,' or 'I ax Billy can he play tomorrow.' There is in fact ample scholarly evidence that <em>all<\/em> dialects are valid systems of communication, and that none is intrinsically better or worse than another. It is logical to assume that every group of speakers has a communication system that works for them with the precision called for in their social circumstances and without ambiguity. It is illogical to think that some groups manage to get by without such a system. Speakers of all dialects, then, speak correctly. The only appropriate yardsticks of correctness are community norms. Problems arise because not all communities and dialects have equal social clout, because the linguistic standards of those in power become dominant, and because social dominance (in language as elsewhere) allows difference to be considered deficiency.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Despite the definition, dialects of a language are not always mutual intelligible. The inhabitants of Tangier Island in Chesapeake Bay, USA, certainly speak English, but their dialect is virtually impenetrable for mainland American speakers. In UK, a popular English television programme, <em>Auf Wiedersehen, Pet<\/em>, had characters who had such thick Geordie accents (the working-class dialect of Newcastle-upon-Tyne, a city in northern England) that viewers in the south of England requested subtitles. Indeed, most of us have encountered varieties of our own language that fail the mutual-intelligibility test.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Suppose that there are four dialect communities, A, B, C and D. Suppose that speakers of A and B can easily understand one another, that those in groups A and C have some considerable difficulty, and that speakers of A and D simply cannot communicate. Does this mean that A and D are actually different languages? Not necessarily. If speakers of B and C can understand each other, and so can speakers of C and D, then at what point can A and D be said to become separate languages?<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The suggestion made by the linguist Max Weinreich that 'a language is a dialect that has an army and navy' illustrates another point of confusion between languages and dialects. Speakers of Norwegian and Danish can understand each other well \"“ Swedish might go into the mix, as well \"“ but the demands of political identity require that their varieties are styled languages. A similar situation applies to Hindi and Urdu, to Czech and Slovak, and to other pairs and triplets.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The story of Serbo-Croatian is a rather poignant example of social interference in the name of identity. The language was a common variety among not just Serbs and Croats but also Bosnians and Montenegrins. There were, to be sure, internal variants, pressures and complaints, but the language as such was widely used and accepted. With the breakup of Yugoslavia, Serbo-Croatian lost its official existence, to be replaced by Bosnian, Serbian and Croatian.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">The speakers of two hypothetical dialects/languages, X and Y, can understand each others' speech considerably well. Based on this passage, can we say that X and Y are dialects of the same language?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Yes, as dialects are defined as mutually intelligible forms of language.<\/span><\/p>", "<p><span lang=\"EN-US\">It depends on whether a continuum of dialects exists between X and Y.<\/span><\/p>", "<p><span lang=\"EN-US\">It depends on whether X and Y are spoken by people with the same political identity.<\/span><\/p>", "<p><span lang=\"EN-US\">Cannot be determined on the basis of this passage.<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">The passage begins with a definition of 'dialects' as 'mutually intelligible variants' of a language. But the rest of the passage shows that there are cases in which dialects are not mutually intelligible, and in which mutually intelligible dialects are considered separate languages. So [1] is incorrect. The 'continuum of dialects' scenario described in paragraph 4 serves to investigate whether two dialects (A and D) can be considered dialects of the same language even if they are not mutually intelligible. But since X and Y are said to be by and large mutually intelligible, this situation does not apply to them, so [2] is incorrect as well. The examples in the last two paragraphs show that even when languages are mutually intelligible, they are considered separate languages, not dialects of the same language, based on the political identity of the speakers. So if X and Y were spoken by people from separate countries, they may not be considered dialects of the same language \"“ and vice versa. Hence, [3].<\/span><\/p>", "topic": "Application Question"}, {"number": 5, "sourceId": "85140", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">The idea that our bodies are a mass of cellular communities of proteins does not tally with our experience. We experience ourselves as a composite of fabrics: skin, bone, muscle, hair, fingernails. This material framework has the properties necessary to let us interact with the world. The outer layer of skin is just cladding, made up of cells that are programmed to die once they have formed the tissue. The same is true of hair, which provides insulation, and of fingernails, the evolutionary remnants of claws that once punctured and ripped. Bone and tooth are composed largely of a hard, inorganic material: calcium phosphate. Most of these materials are continuously renewed while we live; some, such as the proteins in the eye's lens, are not.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">These natural materials of the body serve mechanical roles and maintain our structural integrity. They are like the bricks, girders and cladding of a building, which protect the inhabitants from the elements, and house all the complex wiring and plumbing that is necessary to conduct business as usual. Many of the body's structural fabrics are proteins. Unlike enzymes, structural proteins do not have to conduct any delicate chemistry, but must simply be (for instance) tough, or flexible, or waterproof. In principle many other materials besides proteins would suffice; and indeed, plants use cellulose (a sugar-based polymer) to make their tissues. Yet the marvel of proteins is that they are so versatile. The molecular chains can be woven into strong fibres; cross-linked or entangled, they form the stiff matrix of horn and claw, or elastic sheets. What is more, the raw materials for making proteins are abundant in the cell. And because proteins are encoded in genes, the molecular features that give a structural protein its mechanical properties can be delicately tuned and then reliably reproduced.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The most abundant structural protein in the human body, comprising about a quarter of our total protein mass, is collagen. This is a relatively simple protein whose chainlike molecules contain mostly two sorts of amino acids: glycine and proline. Glycine constitutes every third link of the chain, with proline and other amino acids (particularly lysine) in between. Some of the proline units are chemically modified, having an oxygen atom added. This takes place in a reaction that involves vitamin C, which is why this compound is needed to maintain healthy tissues. Lack of vitamin C leads to the condition known as scurvy, caused by damaged collagen that has not been replaced.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Collagen exemplifies the way in which natural protein-based structural materials differ from most synthetic polymer-based plastics. Both are composed of chain molecules; but in structural proteins these chains gather together in complex arrangements, forming thicker fibrils like ropes woven from string woven from thread. This kind of arrangement, in which structural elements are built up at successively larger scales from smaller components, is said to be <em>hierarchical.<\/em> Engineers have learnt to use the same principle: the Eiffel tower, for instance, contains struts made of a network of smaller girders, some of which are built up from even smaller girders.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Collagen displays several different kinds of large-scale structure, like several different designs of tower, but all are constructed from the same basic small-scale elements. Each collagen molecular chain crimples up into a helix. Three of these twist around one another to form a ropelike triple-helical 'microfibril'. These microfibrils aggregate together in various ways. For example, they can gather in a staggered arrangement to form thick strands called banded fibrils. These constitute the connective tissues between cells \"“ they are the cables that hold our flesh together. Bone consists of collagen banded fibrils sprinkled with tiny crystals of the mineral hydroxyapatite, which is basically calcium phosphate. Because of the high protein content of bone, it is flexible and resilient as well as hard.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">In contrast to the disorderly tangle of connective tissue, the eye's cornea contains collagen fibrils packed side by side in an orderly manner. These fibrils are too small to scatter light, and so the material is virtually transparent. The basic design principle \"“ one that recurs often in nature \"“ is that, by tinkering with the chemical composition and, most importantly, the hierarchical arrangement of the same basic molecules, it is possible to extract several different kinds of material properties.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p>What is this passage about?<\/p>", "options": ["<p><span lang=\"EN-US\">The structural properties of the human body<\/span><\/p>", "<p><span lang=\"EN-US\">The various chemicals that are found in the human body<\/span><\/p>", "<p><span lang=\"EN-US\">The proteins that make up the structure of the human body<\/span><\/p>", "<p><span lang=\"EN-US\">The chemical balances that are necessary for the human body to function<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">There is no mention of 'chemical balances' in the passage, so [4] can be ruled out at once. The passage is not about the structural <em>properties<\/em> of the human body, but rather the proteins that constitute its structure. There is no particularly great variety of chemicals mentioned; the passage focuses primarily on proteins (especially in the form of collagen). Thus, between [2] and [3], the latter is a better answer. Hence, [3].<\/span><\/p>", "topic": "Central Idea"}, {"number": 6, "sourceId": "85141", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">The idea that our bodies are a mass of cellular communities of proteins does not tally with our experience. We experience ourselves as a composite of fabrics: skin, bone, muscle, hair, fingernails. This material framework has the properties necessary to let us interact with the world. The outer layer of skin is just cladding, made up of cells that are programmed to die once they have formed the tissue. The same is true of hair, which provides insulation, and of fingernails, the evolutionary remnants of claws that once punctured and ripped. Bone and tooth are composed largely of a hard, inorganic material: calcium phosphate. Most of these materials are continuously renewed while we live; some, such as the proteins in the eye's lens, are not.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">These natural materials of the body serve mechanical roles and maintain our structural integrity. They are like the bricks, girders and cladding of a building, which protect the inhabitants from the elements, and house all the complex wiring and plumbing that is necessary to conduct business as usual. Many of the body's structural fabrics are proteins. Unlike enzymes, structural proteins do not have to conduct any delicate chemistry, but must simply be (for instance) tough, or flexible, or waterproof. In principle many other materials besides proteins would suffice; and indeed, plants use cellulose (a sugar-based polymer) to make their tissues. Yet the marvel of proteins is that they are so versatile. The molecular chains can be woven into strong fibres; cross-linked or entangled, they form the stiff matrix of horn and claw, or elastic sheets. What is more, the raw materials for making proteins are abundant in the cell. And because proteins are encoded in genes, the molecular features that give a structural protein its mechanical properties can be delicately tuned and then reliably reproduced.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The most abundant structural protein in the human body, comprising about a quarter of our total protein mass, is collagen. This is a relatively simple protein whose chainlike molecules contain mostly two sorts of amino acids: glycine and proline. Glycine constitutes every third link of the chain, with proline and other amino acids (particularly lysine) in between. Some of the proline units are chemically modified, having an oxygen atom added. This takes place in a reaction that involves vitamin C, which is why this compound is needed to maintain healthy tissues. Lack of vitamin C leads to the condition known as scurvy, caused by damaged collagen that has not been replaced.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Collagen exemplifies the way in which natural protein-based structural materials differ from most synthetic polymer-based plastics. Both are composed of chain molecules; but in structural proteins these chains gather together in complex arrangements, forming thicker fibrils like ropes woven from string woven from thread. This kind of arrangement, in which structural elements are built up at successively larger scales from smaller components, is said to be <em>hierarchical.<\/em> Engineers have learnt to use the same principle: the Eiffel tower, for instance, contains struts made of a network of smaller girders, some of which are built up from even smaller girders.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Collagen displays several different kinds of large-scale structure, like several different designs of tower, but all are constructed from the same basic small-scale elements. Each collagen molecular chain crimples up into a helix. Three of these twist around one another to form a ropelike triple-helical 'microfibril'. These microfibrils aggregate together in various ways. For example, they can gather in a staggered arrangement to form thick strands called banded fibrils. These constitute the connective tissues between cells \"“ they are the cables that hold our flesh together. Bone consists of collagen banded fibrils sprinkled with tiny crystals of the mineral hydroxyapatite, which is basically calcium phosphate. Because of the high protein content of bone, it is flexible and resilient as well as hard.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">In contrast to the disorderly tangle of connective tissue, the eye's cornea contains collagen fibrils packed side by side in an orderly manner. These fibrils are too small to scatter light, and so the material is virtually transparent. The basic design principle \"“ one that recurs often in nature \"“ is that, by tinkering with the chemical composition and, most importantly, the hierarchical arrangement of the same basic molecules, it is possible to extract several different kinds of material properties.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/p><\/div><p>Which of the following is true about collagen?<\/p>", "options": ["<p><span lang=\"EN-US\">Collagen is a hard, inorganic material.<\/span><\/p>", "<p><span lang=\"EN-US\">Collagen is made up of links of amino acids.<\/span><\/p>", "<p><span lang=\"EN-US\">A lack of vitamin C in collagen causes scurvy.<\/span><\/p>", "<p><span lang=\"EN-US\">Collagen comprises about a quarter of the mass of the body.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">'Hard, inorganic material' in [1] is a description of calcium phosphate, not collagen. According to paragraph 3, vitamin C is not actually a part of collagen, but rather is necessary in a chemical reaction involving collagen. So [3], which implies that vitamin C is found in collagen, is incorrect. Collagen comprises a quarter of our total protein mass, not of the whole body, so [4] is wrong as well. Only [2] is true about collagen, as per the description in paragraph 3. Hence, [2].<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 7, "sourceId": "85142", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">The idea that our bodies are a mass of cellular communities of proteins does not tally with our experience. We experience ourselves as a composite of fabrics: skin, bone, muscle, hair, fingernails. This material framework has the properties necessary to let us interact with the world. The outer layer of skin is just cladding, made up of cells that are programmed to die once they have formed the tissue. The same is true of hair, which provides insulation, and of fingernails, the evolutionary remnants of claws that once punctured and ripped. Bone and tooth are composed largely of a hard, inorganic material: calcium phosphate. Most of these materials are continuously renewed while we live; some, such as the proteins in the eye's lens, are not.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">These natural materials of the body serve mechanical roles and maintain our structural integrity. They are like the bricks, girders and cladding of a building, which protect the inhabitants from the elements, and house all the complex wiring and plumbing that is necessary to conduct business as usual. Many of the body's structural fabrics are proteins. Unlike enzymes, structural proteins do not have to conduct any delicate chemistry, but must simply be (for instance) tough, or flexible, or waterproof. In principle many other materials besides proteins would suffice; and indeed, plants use cellulose (a sugar-based polymer) to make their tissues. Yet the marvel of proteins is that they are so versatile. The molecular chains can be woven into strong fibres; cross-linked or entangled, they form the stiff matrix of horn and claw, or elastic sheets. What is more, the raw materials for making proteins are abundant in the cell. And because proteins are encoded in genes, the molecular features that give a structural protein its mechanical properties can be delicately tuned and then reliably reproduced.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The most abundant structural protein in the human body, comprising about a quarter of our total protein mass, is collagen. This is a relatively simple protein whose chainlike molecules contain mostly two sorts of amino acids: glycine and proline. Glycine constitutes every third link of the chain, with proline and other amino acids (particularly lysine) in between. Some of the proline units are chemically modified, having an oxygen atom added. This takes place in a reaction that involves vitamin C, which is why this compound is needed to maintain healthy tissues. Lack of vitamin C leads to the condition known as scurvy, caused by damaged collagen that has not been replaced.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Collagen exemplifies the way in which natural protein-based structural materials differ from most synthetic polymer-based plastics. Both are composed of chain molecules; but in structural proteins these chains gather together in complex arrangements, forming thicker fibrils like ropes woven from string woven from thread. This kind of arrangement, in which structural elements are built up at successively larger scales from smaller components, is said to be <em>hierarchical.<\/em> Engineers have learnt to use the same principle: the Eiffel tower, for instance, contains struts made of a network of smaller girders, some of which are built up from even smaller girders.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Collagen displays several different kinds of large-scale structure, like several different designs of tower, but all are constructed from the same basic small-scale elements. Each collagen molecular chain crimples up into a helix. Three of these twist around one another to form a ropelike triple-helical 'microfibril'. These microfibrils aggregate together in various ways. For example, they can gather in a staggered arrangement to form thick strands called banded fibrils. These constitute the connective tissues between cells \"“ they are the cables that hold our flesh together. Bone consists of collagen banded fibrils sprinkled with tiny crystals of the mineral hydroxyapatite, which is basically calcium phosphate. Because of the high protein content of bone, it is flexible and resilient as well as hard.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">In contrast to the disorderly tangle of connective tissue, the eye's cornea contains collagen fibrils packed side by side in an orderly manner. These fibrils are too small to scatter light, and so the material is virtually transparent. The basic design principle \"“ one that recurs often in nature \"“ is that, by tinkering with the chemical composition and, most importantly, the hierarchical arrangement of the same basic molecules, it is possible to extract several different kinds of material properties.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p>What is a microfibril?<\/p>", "options": ["<p><span lang=\"EN-US\">A collagen molecular chain<\/span><\/p>", "<p><span lang=\"EN-US\">A helix formed by a collagen molecular chain<\/span><\/p>", "<p><span lang=\"EN-US\">A triple helix formed by collagen molecular chains<\/span><\/p>", "<p><span lang=\"EN-US\">A staggered arrangement of thick strands of collagen<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">Refer to the penultimate paragraph: 'Each collagen molecular chain crimples up into a helix. Three of these twist around one another to form a ropelike triple-helical \"microfibril\".' Thus, [3] is the correct description of a microfibril. [2] omits the 'triple' helix part and can therefore be eliminated. Hence, [3].<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 8, "sourceId": "85143", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">The idea that our bodies are a mass of cellular communities of proteins does not tally with our experience. We experience ourselves as a composite of fabrics: skin, bone, muscle, hair, fingernails. This material framework has the properties necessary to let us interact with the world. The outer layer of skin is just cladding, made up of cells that are programmed to die once they have formed the tissue. The same is true of hair, which provides insulation, and of fingernails, the evolutionary remnants of claws that once punctured and ripped. Bone and tooth are composed largely of a hard, inorganic material: calcium phosphate. Most of these materials are continuously renewed while we live; some, such as the proteins in the eye's lens, are not.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">These natural materials of the body serve mechanical roles and maintain our structural integrity. They are like the bricks, girders and cladding of a building, which protect the inhabitants from the elements, and house all the complex wiring and plumbing that is necessary to conduct business as usual. Many of the body's structural fabrics are proteins. Unlike enzymes, structural proteins do not have to conduct any delicate chemistry, but must simply be (for instance) tough, or flexible, or waterproof. In principle many other materials besides proteins would suffice; and indeed, plants use cellulose (a sugar-based polymer) to make their tissues. Yet the marvel of proteins is that they are so versatile. The molecular chains can be woven into strong fibres; cross-linked or entangled, they form the stiff matrix of horn and claw, or elastic sheets. What is more, the raw materials for making proteins are abundant in the cell. And because proteins are encoded in genes, the molecular features that give a structural protein its mechanical properties can be delicately tuned and then reliably reproduced.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The most abundant structural protein in the human body, comprising about a quarter of our total protein mass, is collagen. This is a relatively simple protein whose chainlike molecules contain mostly two sorts of amino acids: glycine and proline. Glycine constitutes every third link of the chain, with proline and other amino acids (particularly lysine) in between. Some of the proline units are chemically modified, having an oxygen atom added. This takes place in a reaction that involves vitamin C, which is why this compound is needed to maintain healthy tissues. Lack of vitamin C leads to the condition known as scurvy, caused by damaged collagen that has not been replaced.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Collagen exemplifies the way in which natural protein-based structural materials differ from most synthetic polymer-based plastics. Both are composed of chain molecules; but in structural proteins these chains gather together in complex arrangements, forming thicker fibrils like ropes woven from string woven from thread. This kind of arrangement, in which structural elements are built up at successively larger scales from smaller components, is said to be <em>hierarchical.<\/em> Engineers have learnt to use the same principle: the Eiffel tower, for instance, contains struts made of a network of smaller girders, some of which are built up from even smaller girders.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Collagen displays several different kinds of large-scale structure, like several different designs of tower, but all are constructed from the same basic small-scale elements. Each collagen molecular chain crimples up into a helix. Three of these twist around one another to form a ropelike triple-helical 'microfibril'. These microfibrils aggregate together in various ways. For example, they can gather in a staggered arrangement to form thick strands called banded fibrils. These constitute the connective tissues between cells \"“ they are the cables that hold our flesh together. Bone consists of collagen banded fibrils sprinkled with tiny crystals of the mineral hydroxyapatite, which is basically calcium phosphate. Because of the high protein content of bone, it is flexible and resilient as well as hard.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">In contrast to the disorderly tangle of connective tissue, the eye's cornea contains collagen fibrils packed side by side in an orderly manner. These fibrils are too small to scatter light, and so the material is virtually transparent. The basic design principle \"“ one that recurs often in nature \"“ is that, by tinkering with the chemical composition and, most importantly, the hierarchical arrangement of the same basic molecules, it is possible to extract several different kinds of material properties.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p>The author uses comparisons to architecture and engineering in order to emphasize:<\/p>", "options": ["<p><span lang=\"EN-US\">The mechanical and structural roles of the chemicals in the human body.<\/span><\/p>", "<p><span lang=\"EN-US\">The human body's adoption of some of the same principles as these disciplines.<\/span><\/p>", "<p><span lang=\"EN-US\">The similarity between the human body and iconic buildings such as the Eiffel Tower.<\/span><\/p>", "<p><span lang=\"EN-US\">None of the above \"“ the author does not use such comparisons at all.<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\">Refer to the beginning of paragraph 2 and the end of paragraph 4. The author explicitly compares the structure of the human body to buildings and architectural structures. So [4] is completely incorrect. The author does not claim that the human body is similar to the Eiffel Tower \"“ only that they both use the same principle of hierarchical elements. So [3] is not quite correct. [2] incorrectly describes the direction of influence: according to paragraph 4, engineers have adopted the principles of the human body, not vice versa. Only [1] is correct: throughout this passage, the author talks about the chemicals of the human body, and he uses the comparisons to architecture and engineering in order to point out the mechanical and structural roles of these chemicals. Hence, [1].<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 9, "sourceId": "85144", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">The idea that our bodies are a mass of cellular communities of proteins does not tally with our experience. We experience ourselves as a composite of fabrics: skin, bone, muscle, hair, fingernails. This material framework has the properties necessary to let us interact with the world. The outer layer of skin is just cladding, made up of cells that are programmed to die once they have formed the tissue. The same is true of hair, which provides insulation, and of fingernails, the evolutionary remnants of claws that once punctured and ripped. Bone and tooth are composed largely of a hard, inorganic material: calcium phosphate. Most of these materials are continuously renewed while we live; some, such as the proteins in the eye's lens, are not.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">These natural materials of the body serve mechanical roles and maintain our structural integrity. They are like the bricks, girders and cladding of a building, which protect the inhabitants from the elements, and house all the complex wiring and plumbing that is necessary to conduct business as usual. Many of the body's structural fabrics are proteins. Unlike enzymes, structural proteins do not have to conduct any delicate chemistry, but must simply be (for instance) tough, or flexible, or waterproof. In principle many other materials besides proteins would suffice; and indeed, plants use cellulose (a sugar-based polymer) to make their tissues. Yet the marvel of proteins is that they are so versatile. The molecular chains can be woven into strong fibres; cross-linked or entangled, they form the stiff matrix of horn and claw, or elastic sheets. What is more, the raw materials for making proteins are abundant in the cell. And because proteins are encoded in genes, the molecular features that give a structural protein its mechanical properties can be delicately tuned and then reliably reproduced.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The most abundant structural protein in the human body, comprising about a quarter of our total protein mass, is collagen. This is a relatively simple protein whose chainlike molecules contain mostly two sorts of amino acids: glycine and proline. Glycine constitutes every third link of the chain, with proline and other amino acids (particularly lysine) in between. Some of the proline units are chemically modified, having an oxygen atom added. This takes place in a reaction that involves vitamin C, which is why this compound is needed to maintain healthy tissues. Lack of vitamin C leads to the condition known as scurvy, caused by damaged collagen that has not been replaced.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Collagen exemplifies the way in which natural protein-based structural materials differ from most synthetic polymer-based plastics. Both are composed of chain molecules; but in structural proteins these chains gather together in complex arrangements, forming thicker fibrils like ropes woven from string woven from thread. This kind of arrangement, in which structural elements are built up at successively larger scales from smaller components, is said to be <em>hierarchical.<\/em> Engineers have learnt to use the same principle: the Eiffel tower, for instance, contains struts made of a network of smaller girders, some of which are built up from even smaller girders.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Collagen displays several different kinds of large-scale structure, like several different designs of tower, but all are constructed from the same basic small-scale elements. Each collagen molecular chain crimples up into a helix. Three of these twist around one another to form a ropelike triple-helical 'microfibril'. These microfibrils aggregate together in various ways. For example, they can gather in a staggered arrangement to form thick strands called banded fibrils. These constitute the connective tissues between cells \"“ they are the cables that hold our flesh together. Bone consists of collagen banded fibrils sprinkled with tiny crystals of the mineral hydroxyapatite, which is basically calcium phosphate. Because of the high protein content of bone, it is flexible and resilient as well as hard.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">In contrast to the disorderly tangle of connective tissue, the eye's cornea contains collagen fibrils packed side by side in an orderly manner. These fibrils are too small to scatter light, and so the material is virtually transparent. The basic design principle \"“ one that recurs often in nature \"“ is that, by tinkering with the chemical composition and, most importantly, the hierarchical arrangement of the same basic molecules, it is possible to extract several different kinds of material properties.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p>The author of this passage is least likely to be a:<\/p>", "options": ["<p><span lang=\"EN-US\">Microbiologist.<\/span><\/p>", "<p><span lang=\"EN-US\">Molecular biologist.<\/span><\/p>", "<p><span lang=\"EN-US\">Professor of medicine.<\/span><\/p>", "<p><span lang=\"EN-US\">Biochemist.<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\">Both molecular biology and biochemistry are closely related fields involving the study of the molecular/chemical aspects of living organisms and biological processes. Since this passage is about some of the chemicals that make up the human body (particularly proteins), the author could belong to either of these fields. The author could also be a professor describing the structure of the human body to medical students, so [3] is also a possibility. On the other hand, a microbiologist studies microscopic organisms, such as bacteria and viruses. The passage does not deal with microorganisms at all. So the author is not very likely to be [1]. Hence, [1].<\/span><\/p>", "topic": "Application Question"}, {"number": 10, "sourceId": "85145", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>Some writers are actually opposed to the\r\n  idea that videogames are fictional, preferring some other term such as <i>virtual\r\n  worlds<\/i>, <i>simulations<\/i> or instances of <i>cyberspace<\/i>. In a paper\r\n  on fiction and virtuality in videogames, Espen Aarseth challenges the idea\r\n  that games are fictions by claiming that some of the apparent fictive\r\n  elements in videogames \"“ dragons, doors, mazes \"“ are not <i>fictional<\/i> but\r\n  instead <i>virtual<\/i> items. Aarseth argues that 'Game worlds and their\r\n  objects are ontologically different from fictional worlds', by which I take\r\n  him to mean that games belong in a different cultural category than fictions.\r\n  His argument notes a number of key differences between videogames and\r\n  traditional fictions and infers from these differences that videogames are\r\n  not fictions. Virtual objects 'can typically be acted upon in ways that\r\n  fictional content is <i>not<\/i> acted upon'. This seems, for the most part,\r\n  to be true: videogames do involve their players in forms of engagement that\r\n  are quite different to those involved in traditional literary fictions.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>A videogame is quite\r\n  different from a novel, but I am not convinced that<i> <\/i>Aarseth has\r\n  established that these differences are sufficient to make a videogame\r\n  something other than a fiction. A minor revision allows us to escape\r\n  Aarseth's conclusion: videogames allow the player to interact in ways that\r\n  are clearly denied by <i>most traditional forms of fiction<\/i>. Furthermore,\r\n  the robust props seen in videogames and their accompanying modes of\r\n  interaction do not as a matter of fact distinguish videogames from fictions,\r\n  because these things can also be seen in uncontested fictions. Fiction covers\r\n  a wide range of artefacts, from novels, television programmes, plays and\r\n  films. Many of these include the representationally robust props that Aarseth\r\n  thinks count videogames outside of the category of fiction. Thus, if\r\n  representational robustness is to count against videogames as being\r\n  fictional, it also counts against uncontested fictions like plays, special\r\n  effects-laden films and television drama.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>To illustrate this,\r\n  let us imagine a fiction in which it is the case that a man named Liberty\r\n  Valance is shot with a gun. In a short story about these events, the gun is\r\n  referred to through the descriptions in the text. This kind of linguistic\r\n  fictive <i>prop<\/i> uses descriptions to depict the gun, and relies on the\r\n  reader's imagination to fill out the representational gaps; subsequently,\r\n  different readers might imagine the gun in quite different ways. The same or\r\n  similar fiction might be represented through a picture book: in this case\r\n  simple line drawings are used, in addition to the text, to represent the gun.\r\n  But though the gun is now given a much more determinate appearance \"“ it is\r\n  now clearly a six-shooter, perhaps \"“ it is no less fictional in having no\r\n  real existence. Now imagine the same fiction in a movie setting. The fictive\r\n  representation is now film footage of an actor holding a prop gun, and so the\r\n  fiction has become even more representationally robust than the picture book,\r\n  so much so that the gun might obviously be a Smith and Wesson six-shooter. In\r\n  fact, the movie drama might not even use a filmed physical prop gun to\r\n  represent the gun, given that computer graphics might be used instead, as\r\n  they have increasingly been used in many recent movies. Nevertheless, whether\r\n  the gun is depicted by a physical prop, computer graphics, or even a real\r\n  unloaded gun, the gun that shot Liberty Valance is no less fictional because\r\n  it is only imaginary that Liberty Valance was shot.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>Next, imagine a\r\n  videogame based on this fiction, in which the player-character is the man who\r\n  shot Liberty Valance. The gun in this case is a dynamical graphical model,\r\n  and in this case, the player uses it to shoot Liberty Valance. Note that the\r\n  videogame gun is very similar in terms of media to a computer-generated film\r\n  gun, so on Aarseth's logic if one is to be virtual so should the other. But\r\n  there is absolutely no temptation to think that the gun in the film is\r\n  virtual <i>rather<\/i> <i>than <\/i>fictional because we can clearly see that\r\n  its only difference to a traditional prop gun is in terms of its\r\n  representational medium: both artefacts represent an event that is only\r\n  imagined to exist, though one is made of wood and metal, and the other of\r\n  polygons. Perhaps we might say that the virtuality of the computer-generated\r\n  gun derives directly from its medium, and so that computer-generated guns are\r\n  virtual <i>as well<\/i> <i>as <\/i>fictional. But what this would show is that<i>\r\n  fictional <\/i>and<i> virtual <\/i>are non-contradictory categorizations, in\r\n  that a computer-generated film prop can be both fictional and virtual. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span\r\n  lang=EN-US>What is common to all of these cases of prop guns is that the\r\n  representational prop stands <i>proxy<\/i> for a fictional object having no\r\n  real existence: there really was no gun used to shoot Liberty Valance. This\r\n  commonality across all these cases motivates extending the classification of <i>fiction<\/i>\r\n  to videogames, though they are a different <i>kind<\/i> of fiction.<\/span><span\r\n  lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following is the most suitable title for this passage?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Are Videogames Fiction?<\/span><\/p>", "<p><span lang=\"EN-US\">Videogames: Virtual or Real?<\/span><\/p>", "<p><span lang=\"EN-US\">Virtual Reality in Videogames<\/span><\/p>", "<p><span lang=\"EN-US\">The Props of Videogames<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\">The concept of 'virtual reality' is not mentioned at all in this passage, so [3] can be dismissed at once. While this passage does involve a discussion of props used in videogames, it also discusses props used in various other forms of fiction; also, the example of the props serves only to illustrate a larger point \"“ it is not the main point of the passage. So [4] is not a suitable title either. The dichotomy that the author argues against is whether videogames are virtual or fictional, not whether they are virtual or real, so [2] is incorrect as well. The passage is primarily an analysis of whether or not videogames can be considered a form of fiction. Hence, [1].<\/span><\/p>", "topic": "Title"}, {"number": 11, "sourceId": "85146", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>Some writers are actually opposed to the\r\n  idea that videogames are fictional, preferring some other term such as <i>virtual\r\n  worlds<\/i>, <i>simulations<\/i> or instances of <i>cyberspace<\/i>. In a paper\r\n  on fiction and virtuality in videogames, Espen Aarseth challenges the idea\r\n  that games are fictions by claiming that some of the apparent fictive\r\n  elements in videogames \"“ dragons, doors, mazes \"“ are not <i>fictional<\/i> but\r\n  instead <i>virtual<\/i> items. Aarseth argues that 'Game worlds and their\r\n  objects are ontologically different from fictional worlds', by which I take\r\n  him to mean that games belong in a different cultural category than fictions.\r\n  His argument notes a number of key differences between videogames and\r\n  traditional fictions and infers from these differences that videogames are\r\n  not fictions. Virtual objects 'can typically be acted upon in ways that\r\n  fictional content is <i>not<\/i> acted upon'. This seems, for the most part,\r\n  to be true: videogames do involve their players in forms of engagement that\r\n  are quite different to those involved in traditional literary fictions.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>A videogame is quite\r\n  different from a novel, but I am not convinced that<i> <\/i>Aarseth has\r\n  established that these differences are sufficient to make a videogame\r\n  something other than a fiction. A minor revision allows us to escape\r\n  Aarseth's conclusion: videogames allow the player to interact in ways that\r\n  are clearly denied by <i>most traditional forms of fiction<\/i>. Furthermore,\r\n  the robust props seen in videogames and their accompanying modes of\r\n  interaction do not as a matter of fact distinguish videogames from fictions,\r\n  because these things can also be seen in uncontested fictions. Fiction covers\r\n  a wide range of artefacts, from novels, television programmes, plays and\r\n  films. Many of these include the representationally robust props that Aarseth\r\n  thinks count videogames outside of the category of fiction. Thus, if\r\n  representational robustness is to count against videogames as being\r\n  fictional, it also counts against uncontested fictions like plays, special\r\n  effects-laden films and television drama.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>To illustrate this,\r\n  let us imagine a fiction in which it is the case that a man named Liberty\r\n  Valance is shot with a gun. In a short story about these events, the gun is\r\n  referred to through the descriptions in the text. This kind of linguistic\r\n  fictive <i>prop<\/i> uses descriptions to depict the gun, and relies on the\r\n  reader's imagination to fill out the representational gaps; subsequently,\r\n  different readers might imagine the gun in quite different ways. The same or\r\n  similar fiction might be represented through a picture book: in this case\r\n  simple line drawings are used, in addition to the text, to represent the gun.\r\n  But though the gun is now given a much more determinate appearance \"“ it is\r\n  now clearly a six-shooter, perhaps \"“ it is no less fictional in having no\r\n  real existence. Now imagine the same fiction in a movie setting. The fictive\r\n  representation is now film footage of an actor holding a prop gun, and so the\r\n  fiction has become even more representationally robust than the picture book,\r\n  so much so that the gun might obviously be a Smith and Wesson six-shooter. In\r\n  fact, the movie drama might not even use a filmed physical prop gun to\r\n  represent the gun, given that computer graphics might be used instead, as\r\n  they have increasingly been used in many recent movies. Nevertheless, whether\r\n  the gun is depicted by a physical prop, computer graphics, or even a real\r\n  unloaded gun, the gun that shot Liberty Valance is no less fictional because\r\n  it is only imaginary that Liberty Valance was shot.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>Next, imagine a\r\n  videogame based on this fiction, in which the player-character is the man who\r\n  shot Liberty Valance. The gun in this case is a dynamical graphical model,\r\n  and in this case, the player uses it to shoot Liberty Valance. Note that the\r\n  videogame gun is very similar in terms of media to a computer-generated film\r\n  gun, so on Aarseth's logic if one is to be virtual so should the other. But\r\n  there is absolutely no temptation to think that the gun in the film is\r\n  virtual <i>rather<\/i> <i>than <\/i>fictional because we can clearly see that\r\n  its only difference to a traditional prop gun is in terms of its\r\n  representational medium: both artefacts represent an event that is only\r\n  imagined to exist, though one is made of wood and metal, and the other of\r\n  polygons. Perhaps we might say that the virtuality of the computer-generated\r\n  gun derives directly from its medium, and so that computer-generated guns are\r\n  virtual <i>as well<\/i> <i>as <\/i>fictional. But what this would show is that<i>\r\n  fictional <\/i>and<i> virtual <\/i>are non-contradictory categorizations, in\r\n  that a computer-generated film prop can be both fictional and virtual. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span\r\n  lang=EN-US>What is common to all of these cases of prop guns is that the\r\n  representational prop stands <i>proxy<\/i> for a fictional object having no\r\n  real existence: there really was no gun used to shoot Liberty Valance. This\r\n  commonality across all these cases motivates extending the classification of <i>fiction<\/i>\r\n  to videogames, though they are a different <i>kind<\/i> of fiction.<\/span><span\r\n  lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">What is the author's opinion of Espen Aarseth's views on videogames?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">The author mocks Aarseth's views, and considers them illogical.<\/span><\/p>", "<p><span lang=\"EN-US\">The author disagrees vehemently with Aarseth's logic, and rants against his views.<\/span><\/p>", "<p><span lang=\"EN-US\">The author agrees with Aarseth for the most part, and disagrees with him only on one point.<\/span><\/p>", "<p><span lang=\"EN-US\">While the author accepts one of Aarseth's premises, he disagrees with his conclusion.<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">This passage is written in a completely objective tone; the author does not 'mock' anything or 'rant' at all. So [1] and [2] can be ruled out at once. Refer to the last three sentences of the first paragraph: the author agrees with Aarseth that videogames involve forms of engagement that are different from those of traditional fictions. But in the second paragraph, the author demonstrates how to 'escape Aarseth's conclusion' \"“ i.e. he thinks that Aarseth's conclusion does not follow from that premise, and thus is not necessarily valid. The author also goes on to show that Aarseth's dichotomy between the terms 'virtual' and 'fictional' is not valid, by showing that videogames can be both. Thus, the author disagrees with more than one of Aarseth's points; and he disagrees with his conclusion. Hence, [4].<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 12, "sourceId": "85147", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>Some writers are actually opposed to the\r\n  idea that videogames are fictional, preferring some other term such as <i>virtual\r\n  worlds<\/i>, <i>simulations<\/i> or instances of <i>cyberspace<\/i>. In a paper\r\n  on fiction and virtuality in videogames, Espen Aarseth challenges the idea\r\n  that games are fictions by claiming that some of the apparent fictive\r\n  elements in videogames \"“ dragons, doors, mazes \"“ are not <i>fictional<\/i> but\r\n  instead <i>virtual<\/i> items. Aarseth argues that 'Game worlds and their\r\n  objects are ontologically different from fictional worlds', by which I take\r\n  him to mean that games belong in a different cultural category than fictions.\r\n  His argument notes a number of key differences between videogames and\r\n  traditional fictions and infers from these differences that videogames are\r\n  not fictions. Virtual objects 'can typically be acted upon in ways that\r\n  fictional content is <i>not<\/i> acted upon'. This seems, for the most part,\r\n  to be true: videogames do involve their players in forms of engagement that\r\n  are quite different to those involved in traditional literary fictions.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>A videogame is quite\r\n  different from a novel, but I am not convinced that<i> <\/i>Aarseth has\r\n  established that these differences are sufficient to make a videogame\r\n  something other than a fiction. A minor revision allows us to escape\r\n  Aarseth's conclusion: videogames allow the player to interact in ways that\r\n  are clearly denied by <i>most traditional forms of fiction<\/i>. Furthermore,\r\n  the robust props seen in videogames and their accompanying modes of\r\n  interaction do not as a matter of fact distinguish videogames from fictions,\r\n  because these things can also be seen in uncontested fictions. Fiction covers\r\n  a wide range of artefacts, from novels, television programmes, plays and\r\n  films. Many of these include the representationally robust props that Aarseth\r\n  thinks count videogames outside of the category of fiction. Thus, if\r\n  representational robustness is to count against videogames as being\r\n  fictional, it also counts against uncontested fictions like plays, special\r\n  effects-laden films and television drama.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>To illustrate this,\r\n  let us imagine a fiction in which it is the case that a man named Liberty\r\n  Valance is shot with a gun. In a short story about these events, the gun is\r\n  referred to through the descriptions in the text. This kind of linguistic\r\n  fictive <i>prop<\/i> uses descriptions to depict the gun, and relies on the\r\n  reader's imagination to fill out the representational gaps; subsequently,\r\n  different readers might imagine the gun in quite different ways. The same or\r\n  similar fiction might be represented through a picture book: in this case\r\n  simple line drawings are used, in addition to the text, to represent the gun.\r\n  But though the gun is now given a much more determinate appearance \"“ it is\r\n  now clearly a six-shooter, perhaps \"“ it is no less fictional in having no\r\n  real existence. Now imagine the same fiction in a movie setting. The fictive\r\n  representation is now film footage of an actor holding a prop gun, and so the\r\n  fiction has become even more representationally robust than the picture book,\r\n  so much so that the gun might obviously be a Smith and Wesson six-shooter. In\r\n  fact, the movie drama might not even use a filmed physical prop gun to\r\n  represent the gun, given that computer graphics might be used instead, as\r\n  they have increasingly been used in many recent movies. Nevertheless, whether\r\n  the gun is depicted by a physical prop, computer graphics, or even a real\r\n  unloaded gun, the gun that shot Liberty Valance is no less fictional because\r\n  it is only imaginary that Liberty Valance was shot.<o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>Next, imagine a\r\n  videogame based on this fiction, in which the player-character is the man who\r\n  shot Liberty Valance. The gun in this case is a dynamical graphical model,\r\n  and in this case, the player uses it to shoot Liberty Valance. Note that the\r\n  videogame gun is very similar in terms of media to a computer-generated film\r\n  gun, so on Aarseth's logic if one is to be virtual so should the other. But\r\n  there is absolutely no temptation to think that the gun in the film is\r\n  virtual <i>rather<\/i> <i>than <\/i>fictional because we can clearly see that\r\n  its only difference to a traditional prop gun is in terms of its\r\n  representational medium: both artefacts represent an event that is only\r\n  imagined to exist, though one is made of wood and metal, and the other of\r\n  polygons. Perhaps we might say that the virtuality of the computer-generated\r\n  gun derives directly from its medium, and so that computer-generated guns are\r\n  virtual <i>as well<\/i> <i>as <\/i>fictional. But what this would show is that<i>\r\n  fictional <\/i>and<i> virtual <\/i>are non-contradictory categorizations, in\r\n  that a computer-generated film prop can be both fictional and virtual. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span\r\n  lang=EN-US>What is common to all of these cases of prop guns is that the\r\n  representational prop stands <i>proxy<\/i> for a fictional object having no\r\n  real existence: there really was no gun used to shoot Liberty Valance. This\r\n  commonality across all these cases motivates extending the classification of <i>fiction<\/i>\r\n  to videogames, though they are a different <i>kind<\/i> of fiction.<\/span><span\r\n  lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">Why, according to the author, would 'the gun that shot Liberty Valance' be considered fictional, even when a real gun is used in a movie?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Since a movie is an example of fiction, any items used in the movie are also fictional.<\/span><\/p>", "<p><span lang=\"EN-US\">Since Liberty Valance is a fictional character, he cannot be shot, so there is no question of using a real gun to shoot him in a movie.<\/span><\/p>", "<p><span lang=\"EN-US\">Since the shooting of Liberty Valance is a fictional event, the gun used is fictional as well, whether or not a real gun is used to depict the scene in a movie.<\/span><\/p>", "<p><span lang=\"EN-US\">It is not; the author talks only about fake prop guns and computer-generated guns when talking about the guns used in movies.<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">Refer to paragraph 3, the last sentence. The author states clearly that even if a real gun is used to shoot Liberty Valance in a movie, it is still a fictional gun. So [4] can be dismissed immediately. The author's point does not rest on whether or not Liberty Valance is a fictional character, only that his being shot is fictional. So [2] is not quite correct. [1] may be true, but as far as the passage goes, it is an over-generalization, as the author does not discuss all the items used in a movie, only a gun as a part of a particular fictional event (Liberty Valance getting shot). The author's categorization of 'the gun that shot Liberty Valance' as fictional rests on the fact that 'it is only imaginary that Liberty Valance was shot'. Hence, [3].<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 13, "sourceId": "85149", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>Some writers are actually opposed to the\r\n  idea that videogames are fictional, preferring some other term such as <i>virtual\r\n  worlds<\/i>, <i>simulations<\/i> or instances of <i>cyberspace<\/i>. In a paper\r\n
