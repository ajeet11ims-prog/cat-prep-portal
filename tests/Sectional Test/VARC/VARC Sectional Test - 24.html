<script type="application/json" id="test-data">{"testNumber": 24, "simcat": 9, "minutes": 40, "questions": [{"number": 1, "sourceId": "85943", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">Some historians think the idea of democracy arose among the Greek soldier-sailors of the 7<\/span><span lang=\"EN-US\">th<\/span><span lang=\"EN-US\"><span>  <\/span>to 4<\/span><span lang=\"EN-US\">th<\/span><span lang=\"EN-US\"><span>  <\/span>centuries BC who manned the trireme warships. Up to sixty men – a 'deme' – rowed these daunting three-tiered ships. Their effectiveness in battle depended upon precise and coordinated teamwork. Deme-ocracy arose when the rower-fighters realized that the same kind of coordinated pulling together that powered the boat could be used to influence which battles their masters had them fight and the conditions of their service. Modern democracies owe a debt to the actions of these wretched fellows whose fates were gambled by rulers who did not always have the rowers' best interests at heart.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">In spite of this, and two and a half thousand years on, I am optimistic that the world is glimpsing the limits of democracy. I speak of democracy in its wider manifestations, and not just as government. The common idea of democracy – that everyone has a 'right' to be heard – naturally flourishes among the smallest collections of people that can organize themselves into a group. To survive, these groups compete for what they see as their share of the pie. Look no further than the ultra-democracies of some Western European nations, deadlocked coalition governments legitimized from systems of proportional representation that reward small special interest demes. Look to the intolerance that arises when this or that group asserts rights over this or that groups' rights. Look to 'focus groups'. Look to a state of numerical populism in which the most votes or text messages or viewers is what is to be delivered, crowned or sold. In the artist Paul Klee's words 'democracy with its semi-civilization sincerely cherishes junk'. Strong words perhaps, but there is that old saying about decision making by committee.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The British playwright Dennis Potter in a public speech not long before his death defended the BBC – a decidedly undemocratic and state-owned institution – for its very lack of populism. To Potter the role of the BBC was to decide for the rest of us the standards of what should be deemed good art, drama, history and reporting, and to challenge us intellectually and aesthetically. A dangerous state of affairs? Elitism? Maybe. But I am optimistic that people are recognizing that democracy simplistically applied, without an eye on the larger project, can easily descend into an ochlocracy ruled by the groups that shout the loudest. Even by the middle of the 19<\/span><span lang=\"EN-US\">th<\/span><span lang=\"EN-US\"><span>  <\/span>century Disraeli was saying 'the world is wearied of statesmen whom democracy has degraded into politicians'.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">A hopeful sign: some nations and especially some American states are researching new low carbon-footprint technologies and voluntarily committing to what will be burdensome and expensive climate-change targets. In most cases they are doing so without any democratic mandate. They realize that there may be larger and longer term stakes to play for than the 'right' to behave as one pleases or to have what one wants. <\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\"> The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p>What is the author's opinion of democracy?<\/p>", "options": ["<p><span lang=\"EN-US\"> He thinks that it results in pointless populism, and is hopeful that it is on its way out.<\/span><\/p>", "<p><span lang=\"EN-US\"> He thinks that it is an idea whose time is past, and hopes that a new form of government can be found soon.<\/span><\/p>", "<p><span lang=\"EN-US\"> He admires it as a principle, but thinks that the way it manifests itself in the modern world is problematic.<\/span><\/p>", "<p><span lang=\"EN-US\"> He appreciates the fact that it provides power to the people, and is concerned that it may have reached its limits.<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\"> Apart from in the first paragraph, the author demonstrates a negative attitude towards democracy throughout this passage, and clearly states that he is optimistic that the world is seeing its limits. So [4], which suggests a positive attitude, is clearly incorrect. While one could imagine that the author admires democracy based on the first paragraph, the rest of the passage belies this, so [3] is incorrect as well. Between [1] and [2], the former sums up the author's problem with democracy more precisely (that it results in populism that erodes standards and encourages intolerance), and highlights the fact that he is optimistic about seeing it on its way out. Secondly, the author uses the term 'democracy' in its broader sense and not just limited to forms of government. Hence, [1].<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 2, "sourceId": "85944", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">Some historians think the idea of democracy arose among the Greek soldier-sailors of the 7<\/span><span lang=\"EN-US\">th<\/span><span lang=\"EN-US\"><span>  <\/span>to 4<\/span><span lang=\"EN-US\">th<\/span><span lang=\"EN-US\"><span>  <\/span>centuries BC who manned the trireme warships. Up to sixty men – a 'deme' – rowed these daunting three-tiered ships. Their effectiveness in battle depended upon precise and coordinated teamwork. Deme-ocracy arose when the rower-fighters realized that the same kind of coordinated pulling together that powered the boat could be used to influence which battles their masters had them fight and the conditions of their service. Modern democracies owe a debt to the actions of these wretched fellows whose fates were gambled by rulers who did not always have the rowers' best interests at heart.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">In spite of this, and two and a half thousand years on, I am optimistic that the world is glimpsing the limits of democracy. I speak of democracy in its wider manifestations, and not just as government. The common idea of democracy – that everyone has a 'right' to be heard – naturally flourishes among the smallest collections of people that can organize themselves into a group. To survive, these groups compete for what they see as their share of the pie. Look no further than the ultra-democracies of some Western European nations, deadlocked coalition governments legitimized from systems of proportional representation that reward small special interest demes. Look to the intolerance that arises when this or that group asserts rights over this or that groups' rights. Look to 'focus groups'. Look to a state of numerical populism in which the most votes or text messages or viewers is what is to be delivered, crowned or sold. In the artist Paul Klee's words 'democracy with its semi-civilization sincerely cherishes junk'. Strong words perhaps, but there is that old saying about decision making by committee.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The British playwright Dennis Potter in a public speech not long before his death defended the BBC – a decidedly undemocratic and state-owned institution – for its very lack of populism. To Potter the role of the BBC was to decide for the rest of us the standards of what should be deemed good art, drama, history and reporting, and to challenge us intellectually and aesthetically. A dangerous state of affairs? Elitism? Maybe. But I am optimistic that people are recognizing that democracy simplistically applied, without an eye on the larger project, can easily descend into an ochlocracy ruled by the groups that shout the loudest. Even by the middle of the 19<\/span><span lang=\"EN-US\">th<\/span><span lang=\"EN-US\"><span>  <\/span>century Disraeli was saying 'the world is wearied of statesmen whom democracy has degraded into politicians'.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">A hopeful sign: some nations and especially some American states are researching new low carbon-footprint technologies and voluntarily committing to what will be burdensome and expensive climate-change targets. In most cases they are doing so without any democratic mandate. They realize that there may be larger and longer term stakes to play for than the 'right' to behave as one pleases or to have what one wants. <\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\"> The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p>Which of the following is most likely to be the 'old saying about decision making by committee' that the author refers to in the second paragraph?<\/p>", "options": ["<p><span lang=\"EN-US\"> A committee is a group that keeps minutes and loses hours.<\/span><\/p>", "<p><span lang=\"EN-US\"> A committee is a cul-de-sac down which good ideas are lured and then quietly strangled.<\/span><\/p>", "<p><span lang=\"EN-US\"> To get something done a committee should consist of three men, two of whom are absent.<\/span><\/p>", "<p><span lang=\"EN-US\"> A committee is a group of people who individually can do nothing, but who, as a group, decide that nothing can be done.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\"> The saying in option [1] suggests that committees waste time; both [3] and [4] disparage decision-making by committee, and suggest that committees cannot get anything done. The author might agree with all of these in general. But the point he is making in the second paragraph is that democracy (which he considers to be essentially the same as 'decision making by committee') results in a lowering of quality due to its populist tendencies (see the quote by Paul Klee). Thus, it is most likely that the saying the author is referring to is [2], which suggests that committees (and thus democracy) are inimical to good ideas. Hence, [2].<\/span><\/p>", "topic": "Application Question"}, {"number": 3, "sourceId": "85945", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">Some historians think the idea of democracy arose among the Greek soldier-sailors of the 7<\/span><span lang=\"EN-US\">th<\/span><span lang=\"EN-US\"><span>  <\/span>to 4<\/span><span lang=\"EN-US\">th<\/span><span lang=\"EN-US\"><span>  <\/span>centuries BC who manned the trireme warships. Up to sixty men – a 'deme' – rowed these daunting three-tiered ships. Their effectiveness in battle depended upon precise and coordinated teamwork. Deme-ocracy arose when the rower-fighters realized that the same kind of coordinated pulling together that powered the boat could be used to influence which battles their masters had them fight and the conditions of their service. Modern democracies owe a debt to the actions of these wretched fellows whose fates were gambled by rulers who did not always have the rowers' best interests at heart.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">In spite of this, and two and a half thousand years on, I am optimistic that the world is glimpsing the limits of democracy. I speak of democracy in its wider manifestations, and not just as government. The common idea of democracy – that everyone has a 'right' to be heard – naturally flourishes among the smallest collections of people that can organize themselves into a group. To survive, these groups compete for what they see as their share of the pie. Look no further than the ultra-democracies of some Western European nations, deadlocked coalition governments legitimized from systems of proportional representation that reward small special interest demes. Look to the intolerance that arises when this or that group asserts rights over this or that groups' rights. Look to 'focus groups'. Look to a state of numerical populism in which the most votes or text messages or viewers is what is to be delivered, crowned or sold. In the artist Paul Klee's words 'democracy with its semi-civilization sincerely cherishes junk'. Strong words perhaps, but there is that old saying about decision making by committee.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The British playwright Dennis Potter in a public speech not long before his death defended the BBC – a decidedly undemocratic and state-owned institution – for its very lack of populism. To Potter the role of the BBC was to decide for the rest of us the standards of what should be deemed good art, drama, history and reporting, and to challenge us intellectually and aesthetically. A dangerous state of affairs? Elitism? Maybe. But I am optimistic that people are recognizing that democracy simplistically applied, without an eye on the larger project, can easily descend into an ochlocracy ruled by the groups that shout the loudest. Even by the middle of the 19<\/span><span lang=\"EN-US\">th<\/span><span lang=\"EN-US\"><span>  <\/span>century Disraeli was saying 'the world is wearied of statesmen whom democracy has degraded into politicians'.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">A hopeful sign: some nations and especially some American states are researching new low carbon-footprint technologies and voluntarily committing to what will be burdensome and expensive climate-change targets. In most cases they are doing so without any democratic mandate. They realize that there may be larger and longer term stakes to play for than the 'right' to behave as one pleases or to have what one wants. <\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\"> The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p>From this paragraph, it can inferred that 'ochlocracy' means:<\/p>", "options": ["<p><span lang=\"EN-US\"> Rule by the mob.<\/span><\/p>", "<p><span lang=\"EN-US\"> Rule by the wealthy.<\/span><\/p>", "<p><span lang=\"EN-US\"> Rule by the worst people.<\/span><\/p>", "<p><span lang=\"EN-US\"> Rule by the most able people.<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\"> In the third paragraph, the author says that 'democracy simplistically applied, without an eye on the larger project, can easily descend into an ochlocracy ruled by the groups that shout the loudest'. Thus, 'ochlocracy' has a negative connotation, so [4] can be ruled out immediately. There is no suggestion of [2] in this context. [3] is too extreme. 'Groups that shout the loudest' points to [1] as the answer. Hence, [1].<\/span><\/p>", "topic": "Inference"}, {"number": 4, "sourceId": "85946", "type": "mcq", "passage": "<p><span lang=\"EN-US\"> Cortisol is used in virtually every system in the body, a hormone that literally integrates the body and the mind by altering the configuration of the brain. Cortisol interferes with the immune system, changes the sensitivity of the ears, nose and eyes, and alters various bodily functions. When you have a lot of Cortisol coursing through your veins, you are – by definition – under stress. Cortisol and stress are virtually synonymous.<\/span><\/p><p><span lang=\"EN-US\"><br /><\/span><\/p><p>One of Cortisol's most surprising effects is that it suppresses the working of the immune system. In white blood cells, Cortisol is almost certainly involved in switching on a gene called TCF, on chromosome 10, thus enabling TCF to make its own protein, whose job is to suppress the expression of another protein called interleukin 2, and interleukin 2 is a chemical that puts white blood cells on alert to be especially vigilant for germs. So Cortisol suppresses the immune alertness of white blood cells and makes you more susceptible to disease.<\/p><p>The question I want to put in front of you is: who's in charge? Who ordered all these switches to be set in the right way in the first place, and who decides when to start to let loose the Cortisol? You could argue that the genes are in charge, because the differentiation of the body into different cell types, each with different genes switched on, was at root a genetic process. But that's misleading, because genes are not the cause of stress. Events in one's life, such as the death of a loved one or an impending exam, cause stress, but they do not speak directly to the genes. They are information processed by the brain.<\/p><p>So the brain is in charge. The hypothalamus of the brain sends out the signal that tells the pituitary gland to release a hormone that tells the adrenal gland to make and secrete Cortisol. The hypothalamus takes its orders from the conscious part of the brain which gets its information from the outside world.<\/p><p>But that's not much of an answer either, because the brain is part of the body. The reason the hypothalamus stimulates the pituitary which stimulates the adrenal cortex is not because the brain decided or learnt that this was a good way to do things. It did not set up the system in such a way that thinking about an impending exam would make you less resistant to catching a cold. Natural selection did that. And in any case, it is a wholly involuntary and unconscious reaction, which implies that it is the exam, rather than the brain, that is in charge of events. And if the exam is in charge, then society is to blame, but what is society but a collection of individuals, which brings us back to bodies. Besides, people vary in their susceptibility to stress. Some find impending exams terrifying, others take them in their stride. What is the difference? Somewhere down the cascade of events that is the production, control and reaction to Cortisol, stress-prone people must have subtly different genes from phlegmatic folk. But who or what controls these genetic differences?<\/p><p>The truth is that nobody is in charge. It is the hardest thing for human beings to get used to, but the world is full of intricate, cleverly designed and interconnected systems that do not have control centres. The economy is such a system. The illusion that economies run better if somebody is put in charge of them – and decides what gets manufactured where and by whom – has done devastating harm to the wealth and health of peoples all over the world, not just in the formerly communist countries. Centralized decisions about what to invest in have been disastrously worse than the decentralized chaos of the market. Economies are not centralized systems; they are markets with decentralized, diffuse controls.<\/p><p>It is the same with the body. You are not a brain running a body by switching on hormones. Nor are you a body running a genome by switching on hormone receptors. Nor are you a genome running a brain by switching on genes that switch on hormones. You are all of these at once.<\/p><p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\"> The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">Does Cortisol cause stress, according to this passage?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\"> Yes - Cortisol and stress are virtually synonymous.<\/span><\/p>", "<p><span lang=\"EN-US\"> Yes - Cortisol makes you more susceptible to disease, thus increasing your stress levels.<\/span><\/p>", "<p><span lang=\"EN-US\"> No - events in the outside world cause stress, and it has nothing to do with Cortisol.<\/span><\/p>", "<p><span lang=\"EN-US\"> No - stress results in Cortisol being released in the body.<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\"> While it is stated in the first paragraph that 'Cortisol and stress are virtually synonymous', this does not mean that Cortisol causes stress, so [1] is not necessarily correct. However, given that the two are definitely connected, [3], which states that stress has nothing to do with Cortisol, is also wrong. [2] makes a connection that is not found in the passage, so it is incorrect. Only [4] correctly states the relationship between stress and Cortisol: outside events cause stress, which is processed by the brain, which sends the signal to various glands to secrete Cortisol. Thus, in a roundabout way, stress causes Cortisol to be released in the body. Hence, [4].<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 5, "sourceId": "85947", "type": "mcq", "passage": "<p><span lang=\"EN-US\"> Cortisol is used in virtually every system in the body, a hormone that literally integrates the body and the mind by altering the configuration of the brain. Cortisol interferes with the immune system, changes the sensitivity of the ears, nose and eyes, and alters various bodily functions. When you have a lot of Cortisol coursing through your veins, you are – by definition – under stress. Cortisol and stress are virtually synonymous.<\/span><\/p><p><span lang=\"EN-US\"><br /><\/span><\/p><p>One of Cortisol's most surprising effects is that it suppresses the working of the immune system. In white blood cells, Cortisol is almost certainly involved in switching on a gene called TCF, on chromosome 10, thus enabling TCF to make its own protein, whose job is to suppress the expression of another protein called interleukin 2, and interleukin 2 is a chemical that puts white blood cells on alert to be especially vigilant for germs. So Cortisol suppresses the immune alertness of white blood cells and makes you more susceptible to disease.<\/p><p>The question I want to put in front of you is: who's in charge? Who ordered all these switches to be set in the right way in the first place, and who decides when to start to let loose the Cortisol? You could argue that the genes are in charge, because the differentiation of the body into different cell types, each with different genes switched on, was at root a genetic process. But that's misleading, because genes are not the cause of stress. Events in one's life, such as the death of a loved one or an impending exam, cause stress, but they do not speak directly to the genes. They are information processed by the brain.<\/p><p>So the brain is in charge. The hypothalamus of the brain sends out the signal that tells the pituitary gland to release a hormone that tells the adrenal gland to make and secrete Cortisol. The hypothalamus takes its orders from the conscious part of the brain which gets its information from the outside world.<\/p><p>But that's not much of an answer either, because the brain is part of the body. The reason the hypothalamus stimulates the pituitary which stimulates the adrenal cortex is not because the brain decided or learnt that this was a good way to do things. It did not set up the system in such a way that thinking about an impending exam would make you less resistant to catching a cold. Natural selection did that. And in any case, it is a wholly involuntary and unconscious reaction, which d. The word 'phlegmatic' can mean either 'composed / unemotional' or 'sluggish / unenergetic'. But in terms of a contrast to 'stress-prone people', the former meaning makes more sense. Hence, [3].<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 9, "sourceId": "85951", "type": "mcq", "passage": "<p><span lang=\"EN-US\"> Cortisol is used in virtually every system in the body, a hormone that literally integrates the body and the mind by altering the configuration of the brain. Cortisol interferes with the immune system, changes the sensitivity of the ears, nose and eyes, and alters various bodily functions. When you have a lot of Cortisol coursing through your veins, you are – by definition – under stress. Cortisol and stress are virtually synonymous.<\/span><\/p><p><span lang=\"EN-US\"><br /><\/span><\/p><p>One of Cortisol's most surprising effects is that it suppresses the working of the immune system. In white blood cells, Cortisol is almost certainly involved in switching on a gene called TCF, on chromosome 10, thus enabling TCF to make its own protein, whose job is to suppress the expression of another protein called interleukin 2, and interleukin 2 is a chemical that puts white blood cells on alert to be especially vigilant for germs. So Cortisol suppresses the immune alertness of white blood cells and makes you more susceptible to disease.<\/p><p>The question I want to put in front of you is: who's in charge? Who ordered all these switches to be set in the right way in the first place, and who decides when to start to let loose the Cortisol? You could argue that the genes are in charge, because the differentiation of the body into different cell types, each with different genes switched on, was at root a genetic process. But that's misleading, because genes are not the cause of stress. Events in one's life, such as the death of a loved one or an impending exam, cause stress, but they do not speak directly to the genes. They are information proce sly worse than the decentralized chaos of the market. Economies are not centralized systems; they are markets with decentralized, diffuse controls.<\/p><p>It is the same with the body. You are not a brain running a body by switching on hormones. Nor are you a body running a genome by switching on hormone receptors. Nor are you a genome running a brain by switching on genes that switch on hormones. You are all of these at once.<\/p><p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\"> The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following statements would the author agree with?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\"> People are not in charge of their own actions.<\/span><\/p>", "<p><span lang=\"EN-US\"> Economies function very well without someone in charge of them. <\/span><\/p>", "<p><span lang=\"EN-US\"> People who handle stress well have more Cortisol than those who react badly to it.<\/span><\/p>", "<p><span lang=\"EN-US\"> All of the above.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\"> The author's point that 'nobody is in charge' simply means that there is no specific centre in the human body that controls all its actions; it does not mean that people are not in control of their own actions. So he would not agree with [1]. [3] involves a complete misunderstanding of the relationship between stress and Cortisol as explained in this passage, so it can be dismissed completely. The author would agree only with [2], as it is a major point he makes in the penultimate paragraph. Hence, [2].<\/span><\/p>", "topic": "Application Question"}, {"number": 10, "sourceId": "85952", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">I wanted to write that the Internet keeps people honest. The image of thousands of readers bursting into laughter gave me pause.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">So let me put it this way: the Internet helps enable honesty. Many of us basically want to be honest, but we're fighting all sorts of other impulses – the desire to appear clever or knowledgeable, to support a point we're trying to make, to feel the satisfaction of a rant well ranted. In everyday conversation, when we know something specific about the expertise and inclinations of our audience, these impulses may tempt us into laziness: pushing a point too hard, claiming as fact some anecdote whose veracity isn't completely reliable. We're only human.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Nothing highlights our natural tendencies to exaggerate and overclaim quite like a widely distributed, highly interconnected communication network with nearly instantaneous feedback. There is no shortage of overblown and untrue claims on the Internet. But for those of us who would really like to be as honest and accurate as is reasonably possible, the Internet is an invaluable corrective.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">All else being equal, it is a virtue to know true things. But there is also the virtue of assigning accurate degrees of confidence to the things we think we know. There are some things I have studied personally and in depth, such that I have acquired some expertise; there are other things I've read somewhere, or heard from a friend, that sound pretty reasonable. And there are still other things that wouldn't sound at all reasonable to an objective observer but that line up with my cherished beliefs. Distinguishing between these categories is a major part of being intellectually honest.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Engaging with ideas online – stating what I believe, arguing in favour of it to the best of my ability, and stretching my mind by reading things outside my comfort zone – is immensely helpful in separating well-established facts from wishful thinking. The thing about the Internet is, people will call you on your crap. Even if I don't know exactly what I'm talking about, somebody out there does. On discussion boards, in blog comment threads, on websites of colleagues or students on another continent, if I say something that manages to be interesting but wrong, chances are someone will set me straight. Not that everyone necessarily listens. It's my responsibility to be open enough to listen to the critiques and improve my position – but that's always been my duty. The Internet merely helps us along.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The distinction is not only between the Internet and sitting around a table having a bull session with your friends; it applies to conventional print media as well, from books to newspapers and magazines. Sure, someone can write a book review or pen a strident letter to the editor. But time scales matter. If I put up a blog post in the morning and get several comments before lunchtime along the lines of 'That's about as wrong as anything I've ever seen you write' or 'What were you thinking?' complete with links to sources that set me straight, it's difficult to simply pretend I don't notice.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The Internet is a great help to those of us who prefer to be kept honest – it's just up to us to take advantage.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\"> The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p>Choose a suitable title for this passage.<\/p>", "options": ["<p><span lang=\"EN-US\"> How to be Honest on the Internet<\/span><\/p>", "<p><span lang=\"EN-US\"> The Internet: an Aid to Intellectual Honesty<\/span><\/p>", "<p><span lang=\"EN-US\"> The Internet: an Avenue for Occasional Honesty<\/span><\/p>", "<p><span lang=\"EN-US\"> When to be and Not be Honest on the Internet<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\"> At the beginning of the passage, the author admits that people are not always honest, and that the Internet can provide an avenue for this dishonesty. But this is not the main topic of the passage; the author focuses on honesty in this passage, not dishonesty. So neither [3] nor [4] is a suitable title. The author describes how the Internet can help promote honesty or provide checks and balances to assure it. However, he does not provide instructions for doing so, so [1] is not quite correct as a title either. The main point the author is trying to make in this passage is that 'the Internet helps enable honesty'. So [2] is the most suitable title. Hence, [2].<\/span><\/p>", "topic": "Title"}, {"number": 11, "sourceId": "85953", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">I wanted to write that the Internet keeps people honest. The image of thousands of readers bursting into laughter gave me pause.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">So let me put it this way: the Internet helps enable honesty. Many of us basically want to be honest, but we're fighting all sorts of other impulses – the desire to appear clever or knowledgeable, to support a point we're trying to make, to feel the satisfaction of a rant well ranted. In everyday conversation, when we know something specific about the expertise and inclinations of our audience, these impulses may tempt us into laziness: pushing a point too hard, claiming as fact some anecdote whose veracity isn't completely reliable. We  it does not explain why the people would 'burst into laughter'. People do not 'burst into laughter' if they think someone is 'crazy'; but they do if they think that that person's views are 'ridiculous'. The quoted sentence implies that the author hesitated before stating that the Internet keeps people honest, because he was aware that thousands of people find this notion untrue to the point that they would consider anyone stating it to be ridiculous. Hence, [4].<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 12, "sourceId": "85954", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">I wanted to write that the Internet keeps people honest. The image of thousands of readers bursting into laughter gave me pause.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">So let me put it this way: the Internet helps enable honesty. Many of us basically want to be honest, but we're fighting all sorts of other impulses – the desire to appear clever or knowledgeable, to support a point we're trying to make, to feel the satisfaction of a rant well ranted. In everyday conversation, when we know something specific about the expertise and inclinations of our audience, these impulses may tempt us into laziness: pushing a point too hard, claiming as fact some anecdote whose veracity isn't completely reliable. We're only human.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Nothing highlights our natural tendencies to exaggerate and overclaim quite like a widely distributed, highly interconnected communication network with nearly instantaneous feedback. There is no shortage of overblown and untrue claims on the Internet. But for those of us who would really like to be as honest and accurate as is reasonably possible, the Internet is an invaluable corrective.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">All else being equal, it is a virtue to know tr ne – is immensely helpful in separating well-established facts from wishful thinking. The thing about the Internet is, people will call you on your crap. Even if I don't know exactly what I'm talking about, somebody out there does. On discussion boards, in blog comment threads, on websites of colleagues or students on another continent, if I say something that manages to be interesting but wrong, chances are someone will set me straight. Not that everyone necessarily listens. It's my responsibility to be open enough to listen to the critiques and improve my position – but that's always been my duty. The Internet merely helps us along.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The distinction is not only between the Internet and sitting around a table having a bull session with your friends; it applies to conventional print media as well, from books to newspapers and magazines. Sure, someone can write a book review or pen a strident letter to the editor. But time scales matter. If I put up a blog post in the morning and get several comments before lunchtime along the lines of 'That's about as wrong as anything I've ever seen you write' or 'What were you thinking?' complete with links to sources that set me straight, it's difficult to simply pretend I don't notice.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The Internet is a great help to those of us who prefer to be kept honest – it's just up to us to take advantage.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\"> The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p>What is the author's point in the fourth paragraph?<\/p>", "options": ["<p><span lang=\"EN-US\"> We are not very confident about all the things we know.<\/span><\/p>", "<p><span lang=\"EN-US\"> We do not know all the things we know with equal degrees of confidence.<\/span><\/p>", "<p><span lang=\"EN-US\"> It is important to assign degrees of confidence to the things we know.<\/span><\/p>", "<p><span lang=\"EN-US\"> It is important not to be overly confident about the things we know.<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\"> In the fourth paragraph, the author points out that we do not know all the things we think we know with equal degrees of confidence, and talks about 'the virtue of assigning accurate degrees of confidence to the things we think we know' in order to be intellectually honest. So [1] is a complete misunderstanding of his point. While he would agree with [2] and [4], they are not the point he is making either. Only [3], which mentions the importance of assigning degrees of confidence to our knowledge, correctly states that author's point. Hence, [3].<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 14, "sourceId": "85956", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">I wanted to write that the Internet keeps people honest. The image of thousands of readers bursting into laughter gave me pause.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">So let me put it this way: the Internet helps enable honesty. Many of us basically want to be honest, but we're fighting all sorts of other impulses – the desire to appear clever or knowledgeable, to support a point we're trying to make, to feel the satisfaction of a rant well ranted. In everyday conversation, when we know something specific about the expertise and inclinations of our audience, these impulses may tempt us into laziness: pushing a point too hard, claiming as fact some anecdote whose veracity isn't completely reliable. We're only human.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Nothing highlights our natural tendencies to exaggerate and overclaim quite like a widely distributed, highly interconnected communication network with nearly instantaneous feedback. There is no shortage of overblown and untrue claims on the Internet. But for those of us who would really like to be as honest and accurate as is reasonably possible, the Internet is an invaluable corrective.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">All else being equal, it is a virtue to know true things. But there is also the virtue of assigning accurate degrees of confidence to the things we think we know. There are some things I have studied personally and in depth, such that I have acquired some expertise; there are other things I've read somewhere, or heard from a friend, that sound pretty reasonable. And there are still other things that wouldn't sound at all reasonable to an objective observer but that line up with my cherished beliefs. Distinguishing between these categories is a major part of being intellectually honest.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Engaging with ideas online – stating what I believe, arguing in favour of it to the best of my ability, and stretching my mind by reading things outside my comfort zone – is immensely helpful in separating well-established facts from wishful thinking. The thing about the Internet is, people will call you on your crap. Even if I don't know exactly what I'm talking about, somebody out there does. On discussion boards, in blog comment threads, on websites of colleagues or students on another continent, if I say something that manages to be interesting but wrong, chances are someone will set me straight. Not that everyone necessarily listens. It's my responsibility to be open enough to listen to the critiques and improve my position – but that's always been my duty. The Internet merely helps us along.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The distinction is not only between the Internet and sitting around a table having a bull session with your friends; it applies to conventional print media as well, from books to newspapers and magazines. Sure, someone can write a book review or pen a strident letter to the editor. But time scales matter. If I put up a blog post in the morning and get several comments before lunchtime along the lines of 'That's about as wrong as anything I've ever seen you write' or 'What were you thinking?' complete with links to sources that set me straight, it's difficult to simply pretend I don't notice.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The Internet is a great help to those of us who prefer to be kept honest – it's just up to us to take advantage.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\"> The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p>Which of the following, if true, would weaken the author's main argument the most?<\/p>", "options": ["<p><span lang=\"EN-US\"> The person correcting you on the Internet may be pointing out your mistakes simply in order to feel superior to you.<\/span><\/p>", "<p><span lang=\"EN-US\"> It is difficult to know who the people whom you are interacting with on the Internet really are.<\/span><\/p>", "<p><span lang=\"EN-US\"> If no one challenges your statements on the Internet, that does not necessarily mean that you are actually right.<\/span><\/p>", "<p><span lang=\"EN-US\"> On the Internet, it is impossible to know for certain whether the people correcting you actually know what they are talking about.<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\"> The author's main argument is that on the Internet, people immediately correct you when you are wrong. [1] does not question the author's main point at all – as long as the correction still occurs, the motives of the person correcting you are irrelevant. The identity of the person correcting you is similarly irrelevant, so [2] is invalid as well. The author's main argument is not about the validity of what you state on the Internet, but the idea that the Internet serves as a corrective if you are wrong. So [3] misses the point altogether. Only [4] weakens the author's main argument: if the people correcting you are also wrong, and if there is no way for you to ascertain this, then the Internet does not really function as a corrective tool. Hence, [4].<\/span><\/p>", "topic": "Application Question"}, {"number": 15, "sourceId": "85957", "type": "mcq", "passage": "<p><span lang=\"EN-US\">The nature of a volcanic eruption depends on the viscosity, or stickiness, of the magma and also on the amount of dissolved gas and water it contains. Early in an eruption any groundwater will be flashed explosively to steam. As the gas comes out of solution when the pressure is released, it will expand rapidly, sometimes explosively. Moderate amounts of gas in runny basalt lava produces the fire fountains of Hawaii. Greater quantities of gas will carry with it finely divided solid material such as ash and cinders. Eruptions tend to be more violent early on when the magma still contains a lot of gas. If it has had time to settle in a comparatively shallow magma chamber, it will be better behaved. Sometimes the gas and ash rise so high into the air that they spread widely before the ash falls. This was the sort of eruption witnessed on Vesuvius in 79 AD and has been called a Plinian eruption after the account by the ancient Roman writer Pliny the Younger.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">As long as you keep clear of the fire fountains and the fast-flowing lava, Hawaiian eruptions are reasonably safe. But that is not true of most volcanoes. Much of the Pacific is circled by a 'ring of fire' – volcanoes of a much more temperamental nature. Where an ocean plate dives down in a subduction zone beneath a continent or an island arc, so-called stratovolcanoes develop. These can be picture-postcard volcanoes. Mount Fuji in Japan is one, with steep, conical slopes and a snow-capped peak topped by a smoking crater. But the beauty of such mountains can mask their sinister behaviour. They are notorious for earthquakes and sudden, violent eruptions, as Mount Unzen in Japan and Mount Pinatubo in the Philippines both showed in 1991. They are called stratovolcanoes because of their stratified structure of alternate layers of lava and ash or cinders, which can spew over an area far wider than the peak itself.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The reason for their violent behaviour compared to Hawaiian volcanoes is that they are not fed by clean, fresh magma from the mantle. The material sinking down beneath them is old ocean crust. It is saturated with water, both as liquid in pores and fissures but also bound into hydrous minerals. As the slab descends, it heats, due to its depth and also possibly due to friction. The presence of water lowers the melting point, so partial melting occurs. The pressure is so great that the water easily dissolves in the melt, lubricating it, and this magma squeezes up through the continental crust above. As it nears the surface, the pressure drops and the water starts to escape as steam. It can do so very rapidly and violently, in much the same way as gas escapes when a well-shaken bottle of champagne is uncorked.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">On its way up, the magma may accumulate in chambers until there is enough pressure to erupt. During this time, dense minerals can solidify and fall to the floor of the chamber. The melt that remains for the eruption is richer in silica. Their eruption is violent, not only due to the high water content but also because such silica-rich lavas are much more viscous and sticky. They do not flow easily, and bubbles can't easily escape. Such lava cannot fountain like a Hawaiian eruption but is flung out of the way explosively.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\"> The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">Choose the option that best describes this passage.<\/span><\/p>", "options": ["<p><span lang=\"EN-US\"> A narration of the events leading up to a typical volcanic eruption<\/span><\/p>", "<p><span lang=\"EN-US\"> A narration of the events during and after a typical volcanic eruption<\/span><\/p>", "<p><span lang=\"EN-US\"> A description of the various types of volcanic eruptions based on geographic location<\/span><\/p>", "<p><span lang=\"EN-US\"> A description of the effect of the viscosity of magma on the type of volcanic eruption<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\"> While there is a certain amount of a narration in this passage (for example in paragraph 4), this passage as a whole is not in a narrative style. So both [1] and [2] can be eliminated at once. There are not a lot of 'various types of volcanoes mentioned in this passage – stratovolcanoes and the kind found in Hawaii are the only two types – and they are only partially classified in terms of geographic location. So [3] does not describe this passage very well. The main focus of this passage is how the viscosity of magma results in different types of volcanic eruptions, from the 'runny lava flows' and 'fire fountains' of Hawaii, to the much more violent eruptions of stratovolcanoes that result from their more viscous magma. Hence, [4].<\/span><\/p>", "topic": "Application Question"}, {"number": 16, "sourceId": "85958", "type": "mcq", "passage": "<p><span lang=\"EN-US\">The nature of a volcanic eruption depends on the viscosity, or stickiness, of the magma and also on the amount of dissolved gas and water it contains. Early in an eruption any groundwater will be flashed explosively to steam. As the gas comes out of solution when the pressure is released, it will expand rapidly, sometimes explosively. Moderate amounts of gas in runny basalt lava produces the fire fountains of Hawaii. Greater quantities of gas will carry with it finely divided solid material such as ash and cinders. Eruptions tend to be more violent early on when the magma still contains a lot of gas. If it has had time to settle in a comparatively shallow magma chamber, it will be better behaved. Sometimes the gas and ash rise so high into the air that they spread widely before the ash falls. This was the sort of eruption witnessed on Vesuvius in 79 AD and has been called a Plinian eruption after the account by the ancient Roman writer Pliny the Younger.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">As long as you keep clear of the fire fountains and the fast-flowing lava, Hawaiian eruptions are reasonably safe. But that is not true of most volcanoes. Much of the Pacific is circled by a 'ring of fire' – volcanoes of a much more temperamental nature. Where an ocean plate dives down in a subduction zone beneath a continent or an island arc, so-called stratovolcanoes develop. These can be picture-postcard volcanoes. Mount Fuji in Japan is one, with steep, conical slopes and a snow-capped peak topped by a smoking crater. But the beauty of such mountains can mask their sinister behaviour. They are notorious for earthquakes and sudden, violent eruptions, as Mount Unzen in Japan and Mount Pinatubo in the Philippines both showed in 1991. They are called stratovolcanoes because of their stratified structure of alternate layers of lava and ash or cinders, which can spew over an area far wider than the peak itself.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The reason for their violent behaviour compared to Hawaiian volcanoes is that they are not fed by clean, fresh magma from the mantle. The material sinking down beneath them is old ocean crust. It is saturated with water, both as liquid in pores and fissures but also bound into hydrous minerals. As the slab descends, it heats, due to its depth and also possibly due to friction. The presence of water lowers the melting point, so partial melting occurs. The pressure is so great that the water easily dissolves in the melt, lubricating it, and this magma squeezes up through the continental crust above. As it nears the surface, the pressure drops and the water starts to escape as steam. It can do so very rapidly and violently, in much the same way as gas escapes when a well-shaken bottle of champagne is uncorked.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">On its way up, the magma may accumulate in chambers until there is enough pressure to erupt. During this time, dense minerals can solidify and fall to the floor of the chamber. The melt that remains for the eruption is richer in silica. Their eruption is violent, not only due to the high water content but also because such silica-rich lavas are much more viscous and sticky. They do not flow easily, and bubbles can't easily escape. Such lava cannot fountain like a Hawaiian eruption but is flung out of the way explosively.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\"> The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">What are stratovolcanoes?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\"> Volcanoes with steep, conical slopes and a snow-capped peak topped by a smoking crater<\/span><\/p>", "<p><span lang=\"EN-US\"> Volcanoes that are formed when an ocean plate dives down in a subduction zone beneath a continent or an island arc<\/span><\/p>", "<p><span lang=\"EN-US\"> Volcanoes that are responsible for earthquakes and sudden, violent eruptions in the 'ring of fire' around the Pacific<\/span><\/p>", "<p><span lang=\"EN-US\"> Volcanoes that have a stratified structure of alternate layers of lava and crust<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\"> Refer to paragraph 2. [1] is a description of Mount Fuji in Japan, which is one example of a stratovolcano; but it is not necessarily a description of <em>all<\/em> stratovolcanoes (especially the 'snow-capped peak' part). The author talks about the stratovolcanoes surrounding the 'ring of fire' in the Pacific in this passage; however, it is not inferable from this passage that only these volcanoes are called stratovolcanoes. Secondly, [3] does not state what stratovolcanoes are, only what they are responsible for. So [3] is not correct. The stratified structure of stratovolcanoes is made up of alternate layers of 'lava and ash or cinders' not 'lava and crust', so [4] is incorrect. Only [2] correctly states what stratovolcanoes are in general. Hence, [2].<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 17, "sourceId": "85959", "type": "mcq", "passage": "<p><span lang=\"EN-US\">The nature of a volcanic eruption depends on the viscosity, or stickiness, of the magma and also on the amount of dissolved gas and water it contains. Early in an eruption any groundwater will be flashed explosively to steam. As the gas comes out of solution when the pressure is released, it will expand rapidly, sometimes explosively. Moderate amounts of gas in runny basalt lava produces the fire fountains of Hawaii. Greater quantities of gas will carry with it finely divided solid material such as ash and cinders. Eruptions tend to be more violent early on when the magma still contains a lot of gas. If it has had time to settle in a comparativel rs the surface, the pressure drops and the water starts to escape as steam. It can do so very rapidly and violently, in much the same way as gas escapes when a well-shaken bottle of champagne is uncorked.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">On its way up, the magma may accumulate in chambers until there is enough pressure to erupt. During this time, dense minerals can solidify and fall to the floor of the chamber. The melt that remains for the eruption is richer in silica. Their eruption is violent, not only due to the high water content but also because such silica-rich lavas are much more viscous and sticky. They do not flow easily, and bubbles can't easily escape. Such lava cannot fountain like a Hawaiian eruption but is flung out of the way explosively.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\"> The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">According to this passage, which of the following is not true about the volcanoes in Hawaii?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\"> They are less violent than stratovolcanoes.<\/span><\/p>", "<p><span lang=\"EN-US\"> Their lava is relatively thin and gushes out in fountains.<\/span><\/p>", "<p><span lang=\"EN-US\"> Their lava contains more water and therefore flows easily.<\/span><\/p>", "<p><span lang=\"EN-US\"> Their magma comes directly from the mantle rather than the crust.<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\"> Both [1] and [4] are stated in the first sentence of paragraph 3. According to paragraph 1, the lava in Hawaiian volcanoes is 'runny', and forms fountains; later in the passage, it is contrasted to the more viscous lava of stratovolcanoes. So [2] is also true. While it is correct that the lava of Hawaiian volcanoes flows easily, this is not due to the presence of water – the contrast with stratovolcanoes (whose lava does contain considerable amounts of water) suggests that the lava of Hawaiian volcanoes does not contain much water. Hence, [3].<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 18, "sourceId": "85960", "type": "mcq", "passage": "<p><span lang=\"EN-US\">The nature of a volcanic eruption depends on the viscosity, or stickiness, of the magma and also on the amount of dissolved gas and water it contains. Early in an eruption any groundwater will be flashed explosively to steam. As the gas comes out of solution when the pressure is released, it will expand rapidly, sometimes explosively. Moderate amounts of gas in runny basalt lava produces the fire fountains of Hawaii. Greater quantities of gas will carry with it finely divided solid material such as ash and cinders. Eruptions tend to be more violent early on when the magma still contains a lot of gas. If it has had time to settle in a comparatively shallow magma chamber, it will be better behaved. Sometimes the gas and ash rise so high into the air that they spread widely before the ash falls. This was the sort of eruption witnessed on Vesuvius in 79 AD and has been called a Plinian eruption after the account by the ancient Roman writer Pliny the Younger.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">As long as you keep clear of the fire fountains and the fast-flowing lava, Hawaiian eruptions are reasonably safe. But that is not true of most volcanoes. Much of the Pacific is circled by a 'ring of fire' – volcanoes of a much more temperamental nature. Where an ocean plate dives down in a subduction zone beneath a continent or an island arc, so-called stratovolcanoes develop. These can be picture-postcard volcanoes. Mount Fuji in Japan is one, with steep, conical slopes and a snow-capped peak topped by a smoking crater. But the beauty of such mountains can mask their sinister behaviour. They are notorious for earthquakes and sudden, violent eruptions, as Mount Unzen in Japan and Mount Pinatubo in the Philippines both showed in 1991. They are called stratovolcanoes because of their stratified structure of alternate layers of lava and ash or cinders, which can spew over an area far wider than the peak itself.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The reason for their violent behaviour compared to Hawaiian volcanoes is that they are not fed by clean, fresh magma from the mantle. The material sinking down beneath them is old ocean crust. It is saturated with water, both as liquid in pores and fissures but also bound into hydrous minerals. As the slab descends, it heats, due to its depth and also possibly due to friction. The presence of water lowers the melting point, so partial melting occurs. The pressure is so great that the water easily dissolves in the melt, lubricating it, and this magma squeezes up through the continental crust above. As it nears the surface, the pressure drops and the water starts to escape as steam. It can do so very rapidly and violently, in much the same way as gas escapes when a well-shaken bottle of champagne is uncorked.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">On its way up, the magma may accumulate in chambers until there is enough pressure to erupt. During this time, dense minerals can solidify and fall to the floor of the chamber. The melt that remains for the eruption is richer in silica. Their eruption is violent, not only due to the high water content but also because such silica-rich lavas are much more viscous and sticky. They do not flow easily, and bubbles can't easily escape. Such lava cannot fountain like a Hawaiian eruption but is flung out of the way explosively.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\"> The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following can be inferred from this passage?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\"> Lavas that consist of a lot of silica result in more violent eruptions.<\/span><\/p>", "<p><span lang=\"EN-US\"> A Plinian eruption is one in which the lava spreads far and wide.<\/span><\/p>", "<p><span lang=\"EN-US\"> Volcanoes are mainly found in places where the ocean crust melts underground.<\/span><\/p>", "<p><span lang=\"EN-US\"> As long as the water dissolved in lava escapes as steam, the eruption is not very violent.<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\"> Refer to the last two sentences of the first paragraph: a Plinian eruption is one in which ash is spread far and wide, not lava. So [2] is incorrect. [3] is true about stratovolcanoes, but not necessarily about other kinds of volcanoes (for example, the kind found in Hawaii). [4] contradicts the last two sentences of paragraph 3. Only [1] is correct, as it is stated clearly in the last paragraph. Hence, [1].<\/span><\/p>", "topic": "Inference"}, {"number": 19, "sourceId": "86506", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The sentences given in each question, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Enter in the box provided below the most logical order of sentences to construct a coherent paragraph.<\/span><\/p>\n<p><span lang=\"EN-US\">Note: Use the virtual keyboard provided to enter your answer.<\/span><\/p><\/div>", "options": [], "answer": "25143", "answerLabel": "25143", "solution": "<p><span lang=\"EN-US\">This paragraph is about Georgia O'Keeffe's art and how it was interpreted by everyone in sexist terms. Sentence 2, which introduces this problem in terms of one faced by all female artists, fits best as an opening sentence, with the rest of the paragraph talking about Georgia O'Keeffe in particular. 5 introduces O'Keeffe, so it is the next sentence. 1 states how her art was received, and 4 elaborates on 1, so there is a 1-4 link. 3 states what O'Keeffe tried to do to avoid such criticism (though apparently she failed). Hence, 25143.<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 20, "sourceId": "86507", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The sentences given in each question, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Enter in the box provided below the most logical order of sentences to construct a coherent paragraph.<\/span><\/p>\n<p><span lang=\"EN-US\">Note: Use the virtual keyboard provided to enter your answer.<\/span><\/p><\/div>", "options": [], "answer": "54132", "answerLabel": "54132", "solution": "<p><span lang=\"EN-US\">Sentence 5 introduces the topic of the paragraph - explanations for why chillies are popular in food - and is thus the first sentence. The 4-1 and 3-2 links are clear: 4 and 3 put forth certain theories, and 1 and 2, respectively, state why these theories are not satisfactory (1 follows 4 as they both refer to geographical reasons; 2 follows 3 as they both talk about taste sensations). 'One theory' in 4 and 'another' in 3 make it clear that the 4-1 pair precedes the 3-2 pair. Hence, 54132.<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 21, "sourceId": "86508", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The sentences given in each question, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a number. Enter in the box provided below the most logical order of sentences to construct a coherent paragraph.<\/span><\/p>\n<p><span lang=\"EN-US\">Note: Use the virtual keyboard provided to enter your answer.<\/span><\/p><\/div>", "options": [], "answer": "14352", "answerLabel": "14352", "solution": "<p><span lang=\"EN-US\">It makes most sense to look for individual links in this sequence. The 3-5-2 link is very clear: 3 states that the mules made only a very soft sound; 5 refers to the resulting soothing quiet, which resulted in Catelyn feeling sleepy, as stated in 2. The remaining two sentences, 1 and 4 can be arranged as 1-4, as 'they' in 4 obviously refers to the 'mules' in 1. Sentence 2 does not link to 1 in any way, while 4 and 3 are both descriptions of the mules waking, so the 1-4 link precedes the 3-5-2 link. Hence, 14352.<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 22, "sourceId": "85942", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">Five sentences related to a topic are given below. Four of them can be put together to form a meaningful and coherent paragraph. Identify the odd one out. Choose its number as your answer and enter it in the box provided below.<\/span><\/p>\n<p><span lang=\"EN-US\">Note: Use the virtual keyboard provided to enter your answer.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">1.<span>   <\/span>The concept of place can be applied at a variety of scales from a state or country to a neighbourhood or home area. <\/span><\/p>\n<p><span lang=\"EN-US\">2.<span>   <\/span>When describing the differences between places, the focus may be on natural boundaries such as rivers or mountain ranges, but boundaries are also set by human decision-makers who may be intent upon identifying political states or arbitrating among disputed territories. <\/span><\/p>\n<p><span lang=\"EN-US\">3.<span>   <\/span>People attach special and often individual meanings to places, such as the place where they spent their childhood or the place they associate with some special event.<\/span><\/p>\n<p><span lang=\"EN-US\">4.<span>   <\/span><em>Place<\/em> is a core concept in geography. <\/span><\/p>\n<p><span lang=\"EN-US\">5.<span>   <\/span>The concept therefore includes the search for boundaries, edges and limits that contain a definable and recognized territory. <\/span><\/p>\n<p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\"> <\/span><span><\/span><\/p>\n<p><span> <\/span><\/p>", "options": [], "answer": "3", "answerLabel": "3", "solution": "<p><span lang=\"EN-US\"> The topic of this paragraph is the concept of place. 4 is the introductory sentence, which states that <em>place<\/em> is an important concept in geography. 1, 5 and 2 expand on the idea of place in the sense of a geographical concept. 3, however, talks about places in terms of people's emotional attachment to them, not in geographical terms. So it does not fit into the paragraph. Hence, 3.<\/span><\/p>", "topic": "Sentence out of context"}, {"number": 23, "sourceId": "85134", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">Three out of the four given sentences, when correctly sequenced, form a coherent paragraph. Which of the following sentences does not fit into the context? Enter in the box provided below the letter corresponding to the sentence that does not fit. If all the sentences fit into the context, indicate your answer as E.<\/span><\/p>\n<p>Note: Your answer should be a single letter only. Use the virtual keyboard to enter your answer. <\/p>\n<p><span lang=\"EN-US\"><br /><\/span><\/p><\/div>", "options": [], "answer": "A", "answerLabel": "A", "solution": "<p><span lang=\"EN-US\">All the four sentences are about what economics is and what is does (assuming that 'the discipline' in B refers to economics as well). The sentences D, B and C form a logical sequence: D explains what economics does in terms of 'processes that influence how people's lives come to be what they are'; B adds to this idea by stating that economics seeks to influence those processes; and C states why understanding those processes is important in economics. On the other hand, A, despite providing a definition of economics, talks about 'models', a concept not discussed at all in the rest of the sentences. So A does not fit into this context. Hence, A.<\/span><\/p>", "topic": "Sentence out of context"}, {"number": 24, "sourceId": "85632", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The following question has a sentence with two blanks. Given below it are four pairs of words. Choose the pair that best completes the sentence.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">The established hierarchy of today's architectural tradition leaves us with a sense that there seems to be a gap between the highest ______ of the medieval craftsmen employed on a project and the ______ of the church officials who commissioned the work.<\/span><\/p>", "options": ["<p><span lang=\"EN-US\"> echelons...stratum<\/span><\/p>", "<p><span lang=\"EN-US\"> calibre ... arcanum<\/span><\/p>", "<p><span lang=\"EN-US\"> juncture ... lineage<\/span><\/p>", "<p><span lang=\"EN-US\"> cachet ... entourage<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\"> 'Juncture', meaning 'a critical point in time', and 'cachet', meaning 'official seal' or 'prestige', make no sense whatsoever in the first blank. 'Arcanum', which means 'profound mystery', is nonsense in the second blank. This leaves us only with option [1]: both words mean 'levels' or 'ranks', and fit well in this sentence. Hence, [1].<\/span><\/p>", "topic": "Sentence Completion"}]}</script><script>

function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
