ort of way, Marx's theory could be made compatible with any possible course of events, just like Freud's. Therefore neither theory qualifies as genuinely scientific, according to Popper's criterion.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Popper contrasted Freud's and Marx's theories with Einstein's theory of gravitation, also known as general relativity. Unlike Freud's and Marx's theories, Einstein's theory made a very definite prediction: that light rays from distant stars would be deflected by the gravitational field of the sun. This effect was confirmed in 1919 by the English astrophysicist Sir Arthur Eddington. Popper was very impressed by this. Einstein's theory had made a definite, precise prediction, which was confirmed by observations. Had it turned out that starlight was not deflected by the sun, this would have showed that Einstein was wrong. So Einstein's theory satisfies the criterion of falsifiability.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Popper's attempt to demarcate science from pseudo-science is intuitively quite plausible. There is certainly something fishy about a theory that can be made to fit any empirical data whatsoever. But some philosophers regard Popper's criterion as overly simplistic. There is some evidence that even 'respectable' scientists – whom Popper would not want to accuse of engaging in pseudoscience – routinely explain away data that appears to conflict with their theories, and this has led to important scientific discoveries.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">This suggests that Popper's attempt to demarcate science from pseudo-science cannot be quite right, despite its initial plausibility. In general, scientists do not just abandon their theories whenever they conflict with the observational data. Usually they look for ways of eliminating the conflict without having to give up their theory. And it is worth remembering that virtually every theory in science conflicts with some observations – finding a theory that fits <em>all<\/em> the data perfectly is extremely difficult. Obviously if a theory persistently conflicts with more and more data, and no plausible ways of explaining away the conflict are found, it will eventually have to be rejected. But little progress would be made if scientists simply abandoned their theories at the first sign of trouble.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following, according to this passage, is not true about the Marxists?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">They expected capitalism to be replaced by socialism and then eventually communism.<\/span><\/p>", "<p><span lang=\"EN-US\">They anticipated a revolution among the proletariat.<\/span><\/p>", "<p><span lang=\"EN-US\">They were not happy about the rise of the welfare state.<\/span><\/p>", "<p><span lang=\"EN-US\">They believed that the form of economic organization gave rise to most other social phenomena.<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">Refer to paragraph 3. [1] is clearly stated as being the main point of Marx's theory. Both [2] and [3] can be inferred from the following sentence: 'they might say that the inevitable progress to communism had been temporarily slowed by the rise of the welfare state, which \"softened\" the proletariat and weakened their revolutionary zeal'. Only [4] is untrue, as it is not stated in the passage. Hence, [4].<\/span><\/p>", "topic": "Application Question"}, {"number": 19, "sourceId": "84489", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">What is sc lowed by the rise of the welfare state, which 'softened' the proletariat and weakened their revolutionary zeal. In this sort of way, Marx's theory could be made compatible with any possible course of events, just like Freud's. Therefore neither theory qualifies as genuinely scientific, according to Popper's criterion.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Popper contrasted Freud's and Marx's theories with Einstein's theory of gravitation, also known as general relativity. Unlike Freud's and Marx's theories, Einstein's theory made a very definite prediction: that light rays from distant stars would be deflected by the gravitational field of the sun. This effect was confirmed in 1919 by the English astrophysicist Sir Arthur Eddington. Popper was very impressed by this. Einstein's theory had made a definite, precise prediction, which was confirmed by observations. Had it turned out that starlight was not deflected by the sun, this would have showed that Einstein was wrong. So Einstein's theory satisfies the criterion of falsifiability.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Popper's attempt to demarcate science from pseudo-science is intuitively quite plausible. There is certainly something fishy about a theory that can be made to fit any empirical data whatsoever. But some philosophers regard Popper's criterion as overly simplistic. There is some evidence that even 'respectable' scientists – whom Popper would not want to accuse of engaging in pseudoscience – routinely explain away data that appears to conflict with their theories, and this has led to important scientific discoveries.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">This suggests that Popper's attempt to demarcate science from pseudo-science cannot be quite right, despite its initial plausibility. In general, scientists do not just abandon their theories whenever they conflict with the observational data. Usually they look for ways of eliminating the conflict without having to give up their theory. And it is worth remembering that virtually every theory in science conflicts with some observations – finding a theory that fits <em>all<\/em> the data perfectly is extremely difficult. Obviously if a theory persistently conflicts with more and more data, and no plausible ways of explaining away the conflict are found, it will eventually have to be rejected. But little progress would be made if scientists simply abandoned their theories at the first sign of trouble.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">Why, according to Popper, was Einstein's theory falsifiable, whereas Freud's and Marx's theories were not?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Einstein's theory was a scientific one, whereas Freud's theory was about psychology and Marx's was about history.<\/span><\/p>", "<p><span lang=\"EN-US\">Einstein's theory was confirmed by an astrophysicist, whereas Freud's and Marx's theories received no such confirmation.<\/span><\/p>", "<p><span lang=\"EN-US\">Einstein's theory fit with the observations, whereas Freud's and Marx's theories could not explain away data that contradicted them.<\/span><\/p>", "<p><span lang=\"EN-US\">Einstein's theory made predictions that could be verified or refuted based on data, whereas Freud's and Marx's theories were compatible with any data.<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\">There is no suggestion that Popper criticizes Freud's and Marx's theories because of the fields they belong to, so [1] is not inferable from the passage at all. There is no information in the passage about whether Freud's and Marx's theories were confirmed or not, so [2] is incorrect as well. The second half of [3] contradicts the passage: Freud's and Marx's theories <em>could<\/em>, in fact, explain away contradictory data – and this is why they were not falsifiable. Only [4] correctly states the difference between Einstein's theory on the one hand and Freud's and Marx's theories on the other: Einstein's theory made predictions that could be tested (and even if they had been refuted, this would still make the theory a falsifiable one), but Freud's and Marx's theories could be made compatible with any data whatsoever. Hence, [4].<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 20, "sourceId": "84490", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">What is science? Karl Popper, an influential 20<\/span><span lang=\"EN-US\">th<\/span><span lang=\"EN-US\">-century philosopher of science, thought that the fundamental feature of a scientific theory is that it should be falsifiable. To call a theory falsifiable is not to say that it is false. Rather, it means that the theory makes some definite predictions that are capable of being tested against experience. If these predictions turn out to be wrong, then the theory has been falsified, or disproved. So a falsifiable theory is one that we might discover to be false – it is not compatible with every possible course of experience. Popper thought that some supposedly scientific theories did not satisfy this condition and thus did not deserve to be called science at all; rather they were merely pseudo-science.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Freud's psychoanalytic theory was one of Popper's favourite examples of pseudo-science. According to Popper, Freud's theory could be reconciled with any empirical findings whatsoever. Whatever a patient's behaviour, Freudians could find an explanation of it in terms of their theory – they would never admit that their theory was wrong. Popper argued that through the use of such concepts as repression, sublimation and unconscious desires, Freud's theory could be rendered compatible with any clinical data whatever; it was thus unfalsifiable.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The same was true of Marx's theory of history, Popper maintained. Marx claimed that in industrialized societies around the world, capitalism would give way to socialism and ultimately to communism. But when this didn't happen, instead of admitting that Marx's theory was wrong, Marxists would invent an <em>ad hoc<\/em> explanation for why what happened was actually perfectly consistent with their theory. For example, they might say that the inevitable progress to communism had been temporarily slowed by the rise of the welfare state, which 'softened' the proletariat and weakened their revolutionary zeal. In this sort of way, Marx's theory could be made compatible with any possible course of events, just like Freud's. Therefore neither theory qualifies as genuinely scientific, according to Popper's criterion.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Popper contrasted Freud's and Marx's theories with Einstein's theory of gravitation, also known as general relativity. Unlike Freud's and Marx's theories, Einstein's theory made a very definite prediction: that light rays from distant stars would be deflected by the gravitational field of the sun. This effect was confirmed in 1919 by the English astrophysicist Sir Arthur Eddington. Popper was very impressed by this. Einstein's theory had made a definite, precise prediction, which was confirmed by observations. Had it turned out that starlight was not deflected by the sun, this would have showed that Einstein was wrong. So Einstein's theory satisfies the criterion of falsifiability.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Popper's attempt to demarcate science from pseudo-science is intuitively quite plausible. There is certainly something fishy about a theory that can be made to fit any empirical data whatsoever. But some philosophers regard Popper's criterion as overly simplistic. There is some evidence that even 'respectable' scientists – whom Popper would not want to accuse of engaging in pseudoscience – routinely explain away data that appears to conflict with their theories, and this has led to important scientific discoveries.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">This suggests that Popper's attempt to demarcate science from pseudo-science cannot be quite right, despite its initial plausibility. In general, scientists do not just abandon their theories whenever they conflict with the observational data. Usually they look for ways of eliminating the conflict without having to give up their theory. And it is worth remembering that virtually every theory in science conflicts with some observations – finding a theory that fits <em>all<\/em> the data perfectly is extremely difficult. Obviously if a theory persistently conflicts with more and more data, and no plausible ways of explaining away the conflict are found, it will eventually have to be rejected. But little progress would be made if scientists simply abandoned their theories at the first sign of trouble.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following hypothetical theories would Popper consider falsifiable?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">A theory that aliens have landed on Earth, and that their spaceships can be observed only in lonely rural areas<\/span><\/p>", "<p><span lang=\"EN-US\">A theory that life on Earth was designed by a creator who cannot be observed by human beings<\/span><\/p>", "<p><span lang=\"EN-US\">A theory that ghosts exist, but they cannot be seen by anyone who doubts their existence<\/span><\/p>", "<p><span lang=\"EN-US\">Both [2] and [3]<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\">Refer to the first paragraph for the definition of falsifiability: 'To call a theory falsifiable is not to say that it is false. Rather, it means that the theory makes some definite predictions that are capable of being tested against experience. If these predictions turn out to be wrong, then the theory has been falsified, or disproved.' Both [2] and [3] cannot possibly involve predictions that can be tested: if the creator cannot be observed by human beings, how can they test for his existence?; and since testing for the existence of ghosts would necessarily involve at least a shred of doubt, their existence could never be scientifically verified either. On the other hand, [1] does allow for concrete tests that could prove the theory false: lonely rural areas could be scoured for spaceships, people living in such areas could be interviewed, etc. A falsifiable theory may, of course, still be false. [1] quite likely is false – but it is also falsifiable, whereas the other two are not. Hence, [1].<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 21, "sourceId": "68049", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>The sentences given in the question  below when properly sequenced, form a coherent paragraph. Each sentence is labelled with a letter. Enter in the box provided below the most logical order of sentences  to construct a coherent paragraph.<\/p>\n<p>Note: Your answer should  be a combination of   letters indicating the order of the sentences .Use the virtual keyboard to enter your answer<strong><br /><\/strong><\/p><\/div><p>A. With powerful flippers, the green turtle excavates a pit where she lays her eggs.<\/p>\n<p><br />B. The sea greets a returning green turtle on the beaches of Portuguero, Costa Rica.<\/p>\n<p><br />C. Within a couple of months, at nightfall, the little hatchlings will emerge from beneath the sand and scramble to the water to begin their own journey to the open sea.<\/p>\n<p><br />D. Every two to four years, female green turtles instinctively navigate hundreds of miles across the open ocean and come ashore to nest on their native beaches.<\/p>\n<p><br />E. Though the green turtles’ range is worldwide, commercial exploitation, habitat destruction and pollution have reduced their numbers from tens of millions to scattered thousands.<\/p>", "options": [], "answer": "DBACE", "answerLabel": "DBACE", "solution": "<p>Statement D starts the sequence with a general statement that introduces a phenomenon — returning of green turtles. BAC form a logical sequence: a returning turtle digs a pit for her eggs where in a couple of months they will hatch and scramble to reach the open sea. The sequence DBAC is rounded up by E — another general statement about the dwindling numbers of green turtles. Hence, [DBACE]<\/p>", "topic": "Jumbled Paragraphs"}, {"number": 22, "sourceId": "84470", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The sentences given in each question, when properly sequenced, form a coherent paragraph. Each sentence is labelled with a letter. Enter in the box provided below the most logical order of sentences to construct a coherent paragraph.<\/span><\/p>\n<p><span lang=\"EN-US\">Note: Use the virtual keyboard provided to enter your answer. <\/span><\/p><\/div><p><span><br /><\/span><\/p>", "options": [], "answer": "BDECA", "answerLabel": "BDECA", "solution": "<p><span lang=\"EN-US\">B, which introduces the topic of glowing in the dark as well as the element phosphorus, is the best introductory sentence. D, which explains how the glow occurs, fits well after it. E, C and A form a logical link: E introduces the point about phosphorus not being responsible for all cases of so-called phosphorescence; C gives one example of such a case; and A talks of more organisms with 'similar chemistry'. Hence, BDECA.<\/span><\/p>", "topic": "Jumbled Paragraphs"}, {"number": 23, "sourceId": "76924", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">Each of the following questions has a paragraph from which the last sentence has been deleted. From the given options, choose the sentence that completes the paragraph in the most appropriate way.<\/span><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">I still relish my job as the office language nerd. People's questions sometimes get me thinking about a problem in a different way; I'll research a thorny question and learn something new as often as not. I'm aware that I disappoint people when I send them away with some Talmudic reasoning. As Truman complained of economists, they probably wish I had just one hand, rather than always saying \"on the other hand... And with grammar and usage, there seems to be an added element of masochism: they want that one hand to be a hard, unforgiving one, quick to shake a finger or slap a wrist. But the English language is far too rich for such rigidity.<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">And the study of it keeps my own two hands more than full.<\/span><\/p>", "<p><span lang=\"EN-US\">Languages grow when their users explore and extend its boundaries by suing it with freedom.<\/span><\/p>", "<p><span lang=\"EN-US\">Literature will testify that it has only gained by imaginative turns when all grammatical caution was thrown to the winds.<\/span><\/p>", "<p><span lang=\"EN-US\">But the freedom to bend the rules can be used judiciously only by a privileged few.<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\">The paragraph starts with the author stating that he enjoys his work as 'the office language nerd', which indicates that he is to some extent obsessed with the correct use of the language. The phrase 'Talmudic reasoning' implies that he is very serious about his job or a language checker and people around are often boggled by his hair-splitting arguments pertaining to the language. In the last sentence, he himself confesses that the English language is too rich to be bound by rigid rules. A natural progression of thought would be how this richness of the language could help him in his profession. Only [1] continues this idea. [2] talks of languages in general, hence beyond the purview of the passage. This paragraph is more concerned about the language and not the literary aspects per se; hence [3] is ruled out. Using [4] would make the passage clumsy because of the repeated use of 'but'. Hence, [1].<\/span><\/p>", "topic": "Paragraph Completion"}, {"number": 24, "sourceId": "77336", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-GB\">The question has a sentence with two blanks. Given below the sentence are four pairs of words. Choose the pair that best completes the sentence.<\/span><\/p><\/div><p><span lang=\"EN-US\"> <\/span>The factories that make the typewriters may be going silent, but India's typewriter culture remains ___________ alive, fighting on bravely against that ___________ upstart, the computer.<\/p>", "options": ["<p><span lang=\"EN-US\">imperceptibly; exalted<\/span><\/p>", "<p><span lang=\"EN-US\">defiantly; omnipresent<\/span><\/p>", "<p><span lang=\"EN-US\">impudently; immaculate<\/span><\/p>", "<p><span lang=\"EN-US\">brazenly; ambrosial<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">The sentence implies that typewriters are fast fading objects in India, replaced by computers. Though the companies manufacturing the typewriters are going silent, the culture of using the machine is still surviving or rather putting up a brave fight against the mighty computers. So, the first blank should have a word that means boldly resisting the mighty opponent. So, only 'defiantly' fits the first blank. 'Brazenly' and 'impudently' imply a bold attitude but with some shamelessness attached. 'Imperceptibly' means barely and contradicts the context. The word 'upstart' placed after the second blank implies that computer have suddenly become very powerful and all pervading. So, only 'omnipresent', which means ubiquitous, is the most appropriate option for the second blank. 'Ambrosial' means divine; 'immaculate' means spotlessly clean and 'exalted' means raised or elevated and none of them can contextually fit the second blank. Hence, (2).<\/span><\/p>", "topic": "Sentence Completion"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;
function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
