<script type="application/json" id="test-data">{"testNumber": 25, "simcat": 10, "minutes": 40, "questions": [{"number": 1, "sourceId": "83025", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>Every so often something will break\r\n  through the stimulus shield I hold up whenever I go online, which I do far\r\n  too often these days, we all do, and for various reasons, one being, I'm\r\n  sure, that the existence of the medium has created an unremitting\r\n  low-intensity neural disquiet that we feel only the medium can allay - even\r\n  though it cannot, never has. But it is an attribute of the Internet to\r\n  activate in me, and maybe in all its users, a persistent sense of deferred\r\n  expectancy, as if that thing that I might be looking for, that I couldn't name\r\n  but would know it if I saw it, were at every moment a finger tap away. That\r\n  is the root of the addiction right there - and it is an addiction, sure, if\r\n  only a lower-case one. To bear all this, therefore, to proof myself against\r\n  the unstanchable flow of unnecessary information and peripheral sensation, I\r\n  make use of this shield, which is really just an attention-averting reflex, a\r\n  way of filtering almost everything away, leaving just the barest bones of\r\n  whatever I happen to be looking at, and these only in case some tell-tale\r\n  name or expression requires me to peer a bit more closely.<o:p><\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span\r\n  lang=EN-US>I practice this defensive, exclusionary scanning not only with the\r\n  incidental flotsam I encounter - the inescapable digests of happenings in the\r\n  world, celebrity divorces, killer storms, and so on - but also, more and\r\n  more, with texts about subjects that ostensibly concern me. A recent case in\r\n  point - I have it handy now because I finally printed it out - is an article\r\n  I found online called Wikipedia and the Death of the Expert by Maria\r\n  Bustillos. It came to me via several clicks at one of the so-called <i>aggregate<\/i>\r\n  sites I sometimes visit to keep myself <i>informed<\/i>. I scan a great many\r\n  articles in the course of my daily tours, but I am not avid. More often I\r\n  scroll my eyes down the screen with a pre-emptive weariness - which is an\r\n  angry and defensive posture, I agree - as if nothing truly worthy could ever\r\n  be found online (I know this is not true), as if I will have conceded\r\n  something to the opposition if I were to fully engage the Internet and profit\r\n  from the engagement.<\/span><span lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">According the passage, the Internet has led to:<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">all of us becoming neurotic and hoping in vain that the cure to our neurosis lies online, a few clicks away.<\/span><\/p>", "<p><span lang=\"EN-US\">all of us experiencing a slight but persistent anxiety that we feel, and incorrectly so, can be solved only by going online.<\/span><\/p>", "<p><span lang=\"EN-US\">all of us consuming unnecessarily trivial information thereby making us incapable of understanding texts that really concern us.<\/span><\/p>", "<p><span lang=\"EN-US\">all of us becoming weary of online content and thus developing defence mechanisms to filter out the unnecessary information.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">The author says in the first paragraph that we all experience a low-intensity neural disquiet that we think only the Internet can calm, which is not the case; disquiet means anxiety or worry. Only option (2) states this. Option (1) is incorrect since it exaggerates the intensity of the problem to neurosis, which is a mental illness. Option (3) is incorrect since the author does not state that all of us are becoming incapable of understanding content that concerns us; he only mentions that in his case he started reading all content superficially. Option (4) is incorrect since the author only states that all of us experience the disquiet and not that all of us develop defence mechanisms. Hence, (2).<\/span><\/p>", "topic": "Specific Detail"}, {"number": 2, "sourceId": "83026", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>Every so often something will break\r\n  through the stimulus shield I hold up whenever I go online, which I do far\r\n  too often these days, we all do, and for various reasons, one being, I'm\r\n  sure, that the existence of the medium has created an unremitting\r\n  low-intensity neural disquiet that we feel only the medium can allay - even\r\n  though it cannot, never has. But it is an attribute of the Internet to\r\n  activate in me, and maybe in all its users, a persistent sense of deferred\r\n  expectancy, as if that thing that I might be looking for, that I couldn't name\r\n  but would know it if I saw it, were at every moment a finger tap away. That\r\n  is the root of the addiction right there - and it is an addiction, sure, if\r\n  only a lower-case one. To bear all this, therefore, to proof myself against\r\n  the unstanchable flow of unnecessary information and peripheral sensation, I\r\n  make use of this shield, which is really just an attention-averting reflex, a\r\n  way of filtering almost everything away, leaving just the barest bones of\r\n  whatever I happen to be looking at, and these only in case some tell-tale\r\n  name or expression requires me to peer a bit more closely.<o:p><\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span\r\n  lang=EN-US>I practice this defensive, exclusionary scanning not only with the\r\n  incidental flotsam I encounter - the inescapable digests of happenings in the\r\n  world, celebrity divorces, killer storms, and so on - but also, more and\r\n  more, with texts about subjects that ostensibly concern me. A recent case in\r\n  point - I have it handy now because I finally printed it out - is an article\r\n  I found online called Wikipedia and the Death of the Expert by Maria\r\n  Bustillos. It came to me via several clicks at one of the so-called <i>aggregate<\/i>\r\n  sites I sometimes visit to keep myself <i>informed<\/i>. I scan a great many\r\n  articles in the course of my daily tours, but I am not avid. More often I\r\n  scroll my eyes down the screen with a pre-emptive weariness - which is an\r\n  angry and defensive posture, I agree - as if nothing truly worthy could ever\r\n  be found online (I know this is not true), as if I will have conceded\r\n  something to the opposition if I were to fully engage the Internet and profit\r\n  from the engagement.<\/span><span lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Based on the passage, which of the following words best describes the way the author goes through online content?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">comb<\/span><\/p>", "<p><span lang=\"EN-US\">peruse<\/span><\/p>", "<p><span lang=\"EN-US\">leaf<\/span><\/p>", "<p><span lang=\"EN-US\">thumb<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">The author uses the words scanning and scrolling with respect to the way he reads online content; in fact he says that he scans not only trivial content but also content that should concern him. So the word that describes the way the author reads online content should mean reading casually or superficially. Only option (3) means to read casually. Both (1) and (2) mean examine or read thoroughly; (4) refers to turning over pages using one's thumb and does not refer to the qualitative aspect of reading. Hence, (3).<\/span><\/p>", "topic": "Contextual Vocabulary"}, {"number": 3, "sourceId": "83027", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>Every so often something will break\r\n  through the stimulus shield I hold up whenever I go online, which I do far\r\n  too often these days, we all do, and for various reasons, one being, I'm\r\n  sure, that the existence of the medium has created an unremitting\r\n  low-intensity neural disquiet that we feel only the medium can allay - even\r\n  though it cannot, never has. But it is an attribute of the Internet to\r\n  activate in me, and maybe in all its users, a persistent sense of deferred\r\n  expectancy, as if that thing that I might be looking for, that I couldn't name\r\n  but would know it if I saw it, were at every moment a finger tap away. That\r\n  is the root of the addiction right there - and it is an addiction, sure, if\r\n  only a lower-case one. To bear all this, therefore, to proof myself against\r\n  the unstanchable flow of unnecessary information and peripheral sensation, I\r\n  make use of this shield, which is really just an attention-averting reflex, a\r\n  way of filtering almost everything away, leaving just the barest bones of\r\n  whatever I happen to be looking at, and these only in case some tell-tale\r\n  name or expression requires me to peer a bit more closely.<o:p><\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span\r\n  lang=EN-US>I practice this defensive, exclusionary scanning not only with the\r\n  incidental flotsam I encounter - the inescapable digests of happenings in the\r\n  world, celebrity divorces, killer storms, and so on - but also, more and\r\n  more, with texts about subjects that ostensibly concern me. A recent case in\r\n  point - I have it handy now because I finally printed it out - is an article\r\n  I found online called Wikipedia and the Death of the Expert by Maria\r\n  Bustillos. It came to me via several clicks at one of the so-called <i>aggregate<\/i>\r\n  sites I sometimes visit to keep myself <i>informed<\/i>. I scan a great many\r\n  articles in the course of my daily tours, but I am not avid. More often I\r\n  scroll my eyes down the screen with a pre-emptive weariness - which is an\r\n  angry and defensive posture, I agree - as if nothing truly worthy could ever\r\n  be found online (I know this is not true), as if I will have conceded\r\n  something to the opposition if I were to fully engage the Internet and profit\r\n  from the engagement.<\/span><span lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following best describes the author's attitude towards the utility of online content?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">ambivalent<\/span><\/p>", "<p><span lang=\"EN-US\">critical<\/span><\/p>", "<p><span lang=\"EN-US\">sardonic<\/span><\/p>", "<p><span lang=\"EN-US\">apathetic<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\">At the beginning of the second paragraph, the author says that there is a lot of unnecessary information online (celebrity divorces, killer storms etc.). Towards the end of the passage the author says that he is weary of online content and feels that nothing worthwhile could come out of it, which he admits is not true. So the author clearly has mixed feelings about the utility of online content; he admits that the Internet is not totally useless but at the same time refuses to make use of it since he feels that he would be conceding something to the opposition (those who believe that the Internet is useful). The word that best describes the presence of mixed feelings is <em>ambivalent; apathetic<\/em> means lack of feeling, <em>sardonic <\/em>and<em> critical<\/em> both denote a completely negative attitude. Hence, (1).<\/span><\/p>", "topic": "Style Tone & Attitude"}, {"number": 4, "sourceId": "83028", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>It is worth saying something about the\r\n  social position of beggars, for when one has consorted with them, and found\r\n  that they are ordinary human beings, one cannot help being struck by the\r\n  curious attitude that society takes towards them. People seem to feel that\r\n  there is some essential difference between beggars and ordinary\r\n  &quot;working&quot; men. They are a race apart--outcasts, like criminals and\r\n  prostitutes. Workingmen &quot;work,&quot; beggars do not &quot;work&quot;;\r\n  they are parasites, worthless in their very nature. It is taken for granted\r\n  that a beggar does not &quot;earn&quot; his living, as a bricklayer or a\r\n  literary critic &quot;earns&quot; his. He is a mere social excrescence,\r\n  tolerated because we live in a humane age, but essentially despicable. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>Yet if one looks\r\n  closely one sees that there is no essential difference between a beggar's\r\n  livelihood and that of numberless respectable people. Beggars do not work, it\r\n  is said; but, then, what is work? An accountant works by adding up figures. A\r\n  beggar works by standing out of doors in all weathers and getting varicose\r\n  veins, chronic bronchitis, etc. It is a trade like any other; quite useless,\r\n  of course--but then, many reputable trades are quite useless. And as a social\r\n  type a beggar compares well with scores of others. He is honest compared with\r\n  the sellers of most patent medicines; high-minded compared with a Sunday\r\n  newspaper proprietor, amiable compared with a hire-purchase tout--in short, a\r\n  parasite, but a fairly harmless parasite. He seldom extracts more than a bare\r\n  living from the community, and, what should justify him according to our\r\n  ethical ideas, he pays for it over and over in suffering. I do not think\r\n  there is anything about a beggar that sets him in a different class from\r\n  other people, or gives most modern men the right to despise him. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span\r\n  lang=EN-US>In practice nobody cares whether work is useful or useless,\r\n  productive or parasitic; the sole thing demanded is that it shall be\r\n  profitable. In all the modern talk about energy, efficiency, social service\r\n  and the rest of it, what meaning is there except &quot;Get money, get it\r\n  legally, and get a lot of it&quot;? If one could earn even ten pounds a week\r\n  at begging, it would become a respectable profession immediately. A beggar,\r\n  looked at realistically, is simply a businessman, getting his living, like\r\n  other businessmen, in the way that comes to hand. He has not, more than most\r\n  modern people, sold his honour; he has merely made the mistake of choosing a\r\n  trade at which it is impossible to grow rich.<\/span><span lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following is a valid question that the author aims to answer through this passage?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">How is a beggar different from an ordinary workingman?<\/span><\/p>", "<p><span lang=\"EN-US\">How does the money earning potential of a beggar affect his social standing?<\/span><\/p>", "<p><span lang=\"EN-US\">Why are beggars despised by society?<\/span><\/p>", "<p><span lang=\"EN-US\">Why are the health hazards associated with begging overlooked?<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">The author implies that it is unfair on the part of society to treat beggars as outcasts. He believes that a beggar does as much work as any other professional, like a literary critic, a businessman or a bricklayer. If we read the passage as a whole we realize that the author tries to answer the question why beggars are despised by society, when they are hardly different from any other person in society. (1) relates to the first segment of the discussion, hence a partial aspect. (2), though discussed in the last paragraph, is actually used as a prop to lead us to the bigger question as encapsulated by option (3). Again (4) is related to information mentioned in passing; hence incorrect. Hence, (3).<\/span><\/p>", "topic": "Application Question"}, {"number": 5, "sourceId": "83029", "type": "mcq", "passage": "<\/span><span\r\n  lang=EN-US>It is worth saying something about the\r\n  social position of beggars, for when one has consorted with them, and found\r\n  that they are ordinary human beings, one cannot help being struck by the\r\n  curious attitude that society takes towards them. People seem to feel that\r\n  there is some essential difference between beggars and ordinary\r\n  &quot;working&quot; men. They are a race apart--outcasts, like criminals and\r\n  prostitutes. Workingmen &quot;work,&quot; beggars do not &quot;work&quot;;\r\n  they are parasites, worthless in their very nature. It is taken for granted\r\n  that a beggar does not &quot;earn&quot; his living, as a bricklayer or a\r\n  literary critic &quot;earns&quot; his. He is a mere social excrescence,\r\n  tolerated because we live in a humane age, but essentially despicable. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>Yet if one looks\r\n  closely one sees that there is no essential difference between a beggar's\r\n  livelihood and that of numberless respectable people. Beggars do not work, it\r\n  is said; but, then, what is work? An accountant works by adding up figures. A\r\n  beggar works by standing out of doors in all weathers and getting varicose\r\n  veins, chronic bronchitis, etc. It is a trade like any other; quite useless,\r\n  of course--but then, many reputable trades are quite useless. And as a social\r\n  type a beggar compares well with scores of others. He is honest compared with\r\n  the sellers of most patent medicines; high-minded compared with a Sunday\r\n  newspaper proprietor, amiable compared with a hire-purchase tout--in short, a\r\n  parasite, but a fairly harmless parasite. He seldom extracts more than a bare\r\n  living from the community, and, what should justify him according to our\r\n  ethical ideas, he pays for it over and over in suffering. I do not think\r\n  there is anything about a beggar that sets him in a different class from\r\n  other people, or gives most modern men the right to despise him. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span\r\n  lang=EN-US>In practice nobody cares whether work is useful or useless,\r\n  productive or parasitic; the sole thing demanded is that it shall be\r\n  profitable. In all the modern talk about energy, efficiency, social service\r\n  and the rest of it, what meaning is there except &quot;Get money, get it\r\n  legally, and get a lot of it&quot;? If one could earn even ten pounds a week\r\n  at begging, it would become a respectable profession immediately. A beggar,\r\n  looked at realistically, is simply a businessman, getting his living, like\r\n  other businessmen, in the way that comes to hand. He has not, more than most\r\n  modern people, sold his honour; he has merely made the mistake of choosing a\r\n  trade at which it is impossible to grow rich.<\/span><span lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">From your reading of the last paragraph, decide which of the following would qualify as the author's view?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Ability to earn money has become the grand test of virtue and by this test beggars fail.<\/span><\/p>", "<p><span lang=\"EN-US\">Since there is a very fine line demarcating productive and non-productive work, it is not right to classify beggars as parasites.<\/span><\/p>", "<p><span lang=\"EN-US\">People who barter honour in order to extract maximum gains from the community are often held in high esteem.<\/span><\/p>", "<p><span lang=\"EN-US\">In modern times, amassing wealth using whatever means is revered as work of the highest order.<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\">The main idea of the third paragraph is that whatever is the end product of work, society considers money earning potential of an individual to be the most important parameter to judge a person. \"Get money, get it legally, and get a lot of it\"? is the mantra of modern times. One's ability to earn money is the litmus test and somehow the beggars have failed to qualify in this test. This idea is captured in option (1). There is no discussion regarding the definition of productive and non-productive work in the passage; so (2) is negated. (3) is not necessarily related to the third paragraph, it alludes to some information provided in the second paragraph. (4) is clearly wrong because only getting money is not the criterion; it has to be amassed legally. Hence, (1).<\/span><\/p>", "topic": "Application Question"}, {"number": 6, "sourceId": "83030", "type": "tita", "passage": "<\/span><span\r\n  lang=EN-US>It is worth saying something about the\r\n  social position of beggars, for when one has consorted with them, and found\r\n  that they are ordinary human beings, one cannot help being struck by the\r\n  curious attitude that society takes towards them. People seem to feel that\r\n  there is some essential difference between beggars and ordinary\r\n  &quot;working&quot; men. They are a race apart--outcasts, like criminals and\r\n  prostitutes. Workingmen &quot;work,&quot; beggars do not &quot;work&quot;;\r\n  they are parasites, worthless in their very nature. It is taken for granted\r\n  that a beggar does not &quot;earn&quot; his living, as a bricklayer or a\r\n  literary critic &quot;earns&quot; his. He is a mere social excrescence,\r\n  tolerated because we live in a humane age, but essentially despicable. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US>Yet if one looks\r\n  closely one sees that there is no essential difference between a beggar's\r\n  livelihood and that of numberless respectable people. Beggars do not work, it\r\n  is said; but, then, what is work? An accountant works by adding up figures. A\r\n  beggar works by standing out of doors in all weathers and getting varicose\r\n  veins, chronic bronchitis, etc. It is a trade like any other; quite useless,\r\n  of course--but then, many reputable trades are quite useless. And as a social\r\n  type a beggar compares well with scores of others. He is honest compared with\r\n  the sellers of most patent medicines; high-minded compared with a Sunday\r\n  newspaper proprietor, amiable compared with a hire-purchase tout--in short, a\r\n  parasite, but a fairly harmless parasite. He seldom extracts more than a bare\r\n  living from the community, and, what should justify him according to our\r\n  ethical ideas, he pays for it over and over in suffering. I do not think\r\n  there is anything about a beggar that sets him in a different class from\r\n  other people, or gives most modern men the right to despise him. <o:p><\/o:p><\/span><\/p>\r\n  <p class=body><span lang=EN-US><o:p>&nbsp;<\/o:p><\/span><\/p>\r\n  <p class=MsoNormal><span\r\n  lang=EN-US>In practice nobody cares whether work is useful or useless,\r\n  productive or parasitic; the sole thing demanded is that it shall be\r\n  profitable. In all the modern talk about energy, efficiency, social service\r\n  and the rest of it, what meaning is there except &quot;Get money, get it\r\n  legally, and get a lot of it&quot;? If one could earn even ten pounds a week\r\n  at begging, it would become a respectable profession immediately. A beggar,\r\n  looked at realistically, is simply a businessman, getting his living, like\r\n  other businessmen, in the way that comes to hand. He has not, more than most\r\n  modern people, sold his honour; he has merely made the mistake of choosing a\r\n  trade at which it is impossible to grow rich.<\/span><span lang=EN-US>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/p>\n<p><span lang=\"EN-US\"> <\/span><\/p><\/div><div>\n<p>Which of the following statements is/are implicit in the passage?<\/p>\n\n<p>Choose as many statements as applicable. Enter in the box below the letters corresponding to the correct statements.<br />Note: Your answer should be in letters and in alphabetical order. Use the virtual keyboard to enter your answer.<\/p>\n\n<p>A. Society should treat beggars not as parasites but as valid citizens, despite their mendicancy.<br />B. A beggar's honesty and work ethics are much better than those in some professions.<br />C. A person should have the free will to choose his profession and try to excel in it, even if it is begging, which is not at all a lucrative profession.<\/p>\n<\/div>\n<div> <\/div>", "options": [], "answer": "AB", "answerLabel": "AB", "solution": "<p><span lang=\"EN-US\">Since throughout the passage the author tries to justify the fact that a beggar is as mush a part of society as any other professional, like a literary critic, an accountant or a businessman, we can say that A is implicit in the passage. B is also implied by the comparison stated in the second paragraph: \"He is honest compared with the sellers … a fairly harmless parasite\". Though C may appear to be related to the information provided in the last two sentences of the passage, the author does not delve into the theme of selecting one's profession. In fact, he says that choosing a trade like begging is actually a mistake, as one can never aspire to grow rich in that. So, C cannot be derived. Hence, AB.<\/span><\/p>", "topic": "Application Question"}, {"number": 7, "sourceId": "76935", "type": "mcq", "passage": "<p>Before the \"general audience\" ascended to power, aristocratic benefactors ruled the art world. For centuries, authors subsisted outside the open market. Their readers were their patrons; the audience, in theory, an audience of one, plus the hangers-on. Patronage relationships spilled into personal ones.<\/p><p>As rates of literacy increased in Europe during the 17th and 18th centuries, so did the demand for and production of books. Lending libraries flourished, and fiction became the focus. Simultaneous with the rise of books–and of novels in particular–was the rise of book reviews. Earlier publications had short lives and small audiences, but as the number of readers went up and the cost of printing went down, reviews began to wield enormous influence. This unprecedented outpouring of reviews meant that for the first time an author's fortune was determined by the general public rather than by a private patron. This comparatively vast new audience was perceived by many authors as a serious threat to their social stability. No longer could an author identify or anticipate her audience's reaction. Her readers were too many, and they were strangers to her. How could she seduce them, and why?<\/p><p>As printing presses and distribution channels became more efficient, the number of reviews increased, muddying their original purpose. \"Now that [the author] has sixty reviews where in the nineteenth century he had perhaps six,\" Virginia Woolf wrote, \"he finds that there is no such thing as 'an opinion' of his work. Praise cancels blame; and blame praise. Soon he comes to discount both praise and blame; they are equally worthless. He values the review only for its effect upon his reputation and for its effect upon his sales.\" The effect could be hard to detect. The reader suspends judgment; waits for an opportunity of seeing the book himself; very probably forgets all about it, and keeps his seven and sixpence in his pocket.\"<\/p><p>As modified recapitulations of what already exists, reviews are inherently conservative. Space constraints inhibit speculation and dissent, which is why even elegant reviews tend to be dry, aimless and unmotivated. Still, cramped quarters tend to strike authors as preferable to homelessness. Many aspiring and even established writers who wish to see their work in print –and to be paid for it–find non-review outlets hard to come by. The result? \"A generation hid its real ideas in book reviews.\"<\/p><p>But true criticism, like an autopsy, can only be performed after death. \"It is impossible for the living to judge the works of the living. Years, many years, according to Matthew Arnold, have to pass before it is possible to deliver an opinion that is not \"'only personal, but personal with passion.\" Imagine a literary culture in which the relationship between reader and writer was as intimate and direct as the relationship between poet and patron. This would not be, and never was, a recipe for health or contentment–most marriages are unhappy. But the \"passion\" that Arnold thought needed to be neutralized could proudly speak its name.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\"> The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following is suggested in the passage as the reason why authors felt threatened by the advent of mass publication and proliferation of readers and reviews?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\"> An author's work would never be unfavorably received by his or her patron, since more often than not, the relationship between them was personal.<\/span><\/p>", "<p><span lang=\"EN-US\"> An author would receive the unconditional financial support of his or her patron irrespective of the quality of his or her work.<\/span><\/p>", "<p><span lang=\"EN-US\"> Unlike the masses, the patrons of authors had refined literary sensibilities which were in tune with the latter's skills.<\/span><\/p>", "<p><span lang=\"EN-US\"> The author and the patron were intimately aware of each other's work and tastes.<\/span><\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p><span lang=\"EN-US\"> Options (1) and (2) incorrectly extend the argument made in the passage about the relationship between an author and his or her patron. It is nowhere stated that patrons gave unconditional financial support or never unfavorably reviewed an author's work. Option (3) is incorrect since the passage does not compare the taste of the masses with the tastes of the patrons. The reasons for the author's fear are clearly stated in the last two sentences of the second paragraph: the author does not know the tastes of the masses and cannot anticipate their reaction, which is not the case with patrons. This point is also reiterated in the last paragraph. Hence, (4).<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 8, "sourceId": "76936", "type": "mcq", "passage": "<p>Before the \"general audience\" ascended to power, aristocratic benefactors ruled the art world. For centuries, authors subsisted outside the open market. Their readers were their patrons; the audience, in theory, an audience of one, plus the hangers-on. Patronage relationships spilled into personal ones.<\/p><p>As rates of literacy increased in Europe during the 17th and 18th centuries, so did the demand for and production of books. Lending libraries flourished, and fiction became the focus. Simultaneous with the rise of books–and of novels in particular–was the rise of book reviews. Earlier publications had short lives and small audiences, but as the number of readers went up and the cost of printing went down, reviews began to wield enormous influence. This unprecedented outpouring of reviews meant that for the first time an author's fortune was determined by the general public rather than by a private patron. This comparatively vast new audience was perceived by many authors as a serious threat to their social stability. No longer could an author identify or anticipate her audience's reaction. Her readers were too many, and they were strangers to her. How could she seduce them, and why?<\/p><p>As printing presses and distribution channels became more efficient, the number of reviews increased, muddying their original purpose. \"Now that [the author] has sixty reviews where in the nineteenth century he had perhaps six,\" Virginia Woolf wrote, \"he finds that there is no such thing as 'an opinion' of his work. Praise cancels blame; and blame praise. Soon he comes to discount both praise and blame; they are equally worthless. He values the review only for its effect upon his reputation and for its effect upon his sales.\" The effect could be hard to detect. The reader suspends judgment; waits for an opportunity of seeing the book himself; very probably forgets all about it, and keeps his seven and sixpence in his pocket.\"<\/p><p>As modified recapitulations of what already exists, reviews are inherently conservative. Space constraints inhibit speculation and dissent, which is why even elegant reviews tend to be dry, aimless and unmotivated. Still, cramped quarters tend to strike authors as preferable to homelessness. Many aspiring and even established writers who wish to see their work in print –and to be paid for it–find non-review outlets hard to come by. The result? \"A generation hid its real ideas in book reviews.\"<\/p><p>But true criticism, like an autopsy, can only be performed after death. \"It is impossible for the living to judge the works of the living. Years, many years, according to Matthew Arnold, have to pass before it is possible to deliver an opinion that is not \"'only personal, but personal with passion.\" Imagine a literary culture in which the relationship between reader and writer was as intimate and direct as the relationship between poet and patron. This would not be, and never was, a recipe for health or contentment–most marriages are unhappy. But the \"passion\" that Arnold thought needed to be neutralized could proudly speak its name.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\"> The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p>Which of the following is suggested by Virginia Woolf as the relationship between the author and reviews of his work?<\/p>\n\n<p>I. The tendency of reviewers to contradict themselves made their opinions on literary works useless to authors.<br />II. Authors did not judge the literary merit of their work based on the reviews it received.<br />III. Authors were concerned with reviews only insofar as much they helped or hurt the sales of their books.<\/p>", "options": ["<p><span lang=\"EN-US\"> Both I and II<\/span><\/p>", "<p><span lang=\"EN-US\"> Both II and III<\/span><\/p>", "<p><span lang=\"EN-US\"> Both I and III<\/span><\/p>", "<p><span lang=\"EN-US\"> I, II and III<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\"> Statements II and III are clearly stated in the third paragraph. Statement I is incorrect since the third paragraph states that reviews and reviewers contradict each other, and not themselves as stated in the option. Hence, (2).<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 9, "sourceId": "76937", "type": "mcq", "passage": "<p>Before the \"general audience\" ascended to power, aristocratic benefactors ruled the art world. For centuries, authors subsisted outside the open market. Their readers were their patrons; the audience, in theory, an audience of one, plus the hangers-on. Patronage relationships spilled into personal ones.<\/p><p>As rates of literacy increased in Europe during the 17th and 18th centuries, so did the demand for and production of books. Lending libraries flourished, and fiction became the focus. Simultaneous with the rise of books–and of novels in particular–was the rise of book reviews. Earlier publications had short lives and small audiences, but as the number of readers went up and the cost of printing went down, reviews began to wield enormous influence. This unprecedented outpouring of reviews meant that for the first time an author's fortune was determined by the general public rather than by a private patron. This comparatively vast new audience was perceived by many authors as a serious threat to their social stability. No longer could an author identify or anticipate her audience's reaction. Her readers were too many, and they were strangers to her. How could she seduce them, and why?<\/p><p>As printing presses and distribution channels became more efficient, the number of reviews increased, muddying their original purpose. \"Now that [the author] has sixty reviews where in the nineteenth century he had perhaps six,\" Virginia Woolf wrote, \"he finds that there is no such thing as 'an opinion' of his work. Praise cancels blame; and blame praise. Soon he comes to discount both praise and blame; they are equally worthless. He values the review only for its effect upon his reputation and for its effect upon his sales.\" The effect could be hard to detect. The reader suspends judgment; waits for an opportunity of seeing the book himself; very probably forgets all about it, and keeps his seven and sixpence in his pocket.\"<\/p><p>As modified recapitulations of what already exists, reviews are inherently conservative. Space constraints inhibit speculation and dissent, which is why even elegant reviews tend to be dry, aimless and unmotivated. Still, cramped quarters tend to strike authors as preferable to homelessness. Many aspiring and even established writers who wish to see their work in print –and to be paid for it–find non-review outlets hard to come by. The result? \"A generation hid its real ideas in book reviews.\"<\/p><p>But true criticism, like an autopsy, can only be performed after death. \"It is impossible for the living to judge the works of the living. Years, many years, according to Matthew Arnold, have to pass before it is possible to deliver an opinion that is not \"'only personal, but personal with passion.\" Imagine a literary culture in which the relationship between reader and writer was as intimate and direct as the relationship between poet and patron. This would not be, and never was, a recipe for health or contentment–most marriages are unhappy. But the \"passion\" that Arnold thought needed to be neutralized could proudly speak its name.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\"> The passage given below is followed by a set of three questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"> <\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following best captures the idea summarized by the last line of the fourth paragraph and the reason behind it?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\"> Reviewing offered writers a way to financially sustain themselves as well as pursue their literary ambitions.<\/span><\/p>", "<p><span lang=\"EN-US\"> The short space available to reviews inhibited writers from fully expressing their ideas who nevertheless stuck to reviewing since it offered financial stability.<\/span><\/p>", "<p><span lang=\"EN-US\"> Since reviewing became the only way to write as well as get printed and paid, many writers chose to write reviews rather than write what they wanted to.<\/span><\/p>", "<p><span lang=\"EN-US\"> Despite their elegance, even good reviews eventually turn out to be dull owing to the space constraints on reviews in general.<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\"> The last line of the fourth paragraph states that a generation hid its ideas in reviews instead of writing about their ideas. The reason being that there was no other way a writer, established or aspiring, could expect to get his work printed and get paid for it. Option (3) best captures this. Option (1) only offers the reason and does not elaborate the idea in the last line. Option (2) deals with the space constraints and does not mention why they wrote only reviews. Option (4) deals solely with the space constraint of reviews. Hence, (3).<\/span><\/p>", "topic": "Application Question"}, {"number": 10, "sourceId": "34409", "type": "mcq", "passage": "<p>No one is ever going to put a name to this face. Its owner lived before writing, agriculture, or towns existed, before there were states that kept records, before there was something called 'history'. The only reason we can be sure the people who painted in caves during the Ice Age were as human as we are – that is, they used their brains in the same way we do – is that they made art. No other animal makes art. And now the earliest art has a human face – literally.<\/p><p><br />The eye is a bold horizontal slash that connects to a downward diagonal apparently signifying a nose; below is a thinner line suggesting a mouth. These features are drawn in black on a face-shaped rocky mass in a cave near Angouleme in western France; discovered recently, the image has only now been made public after scientific testing by French archaeologists that has apparently convinced them of its authenticity and age – they claim the drawings in it were done 27,000 years ago, which makes the this grotto one of the oldest sites of rock art in the world.<br /> <br />This face was made by human beings whose lives were more animal-like than we can imagine, hunting and being hunted in a world of woolly mammoths, sabre-toothed tigers and the other animals who – up to now – have seemed to be the main characters in cave art. And yet the portrait shows they recognized the animal that was different, that could look back at you in a special way and mirror you (did they know the concept of a mirror? Presumably they noticed their reflections in water).<br /> <br />So familiar were these people with the emotional significance of the human face that they didn't need to fill in every detail as they did when they painted animals. It is, of course, ironic that an ancient image discovered in France so uncannily resembles the Parisian modernism of the 1920s – one visitor to the cave has said it reminded him of Modigliani; to me it resembles the way Picasso and Braque notated facial details in their synthetic cubist paintings; you might also think of Brancusi. Is this a bit fishy? Presumably not, because the bones and use of charcoal in the cave means its contents can be carbon-dated.<br /> <br />Why did the first artists draw like Picasso? It has to be because of their attitude to the face, to their own embodiment and that of the people they lived with – it has to be because of how they saw human beings specifically, because this is very different from the way they painted animals. Stone Age artists could paint with a verisimilitude that takes your breath away; the horse panel in the Chauvet cave, older than this drawing, is covered with acutely observed heads of aurochs (extinct relatives of cattle) and horses whose tufty manes are painted with a clarity Da Vinci would have admired. Why is the human face so much harder to decipher, so stylized? Looking at the other portraits made in prehistory or at history's dawn, you start to guess why. The earliest human instinct was not to photograph the face, but to decorate it, to ennoble it.<br /> <br />There are still books that will tell you that the portrait was invented in the Renaissance and reflects the irresistible rise of Western individualism. The discovery in France adds to evidence from all over the world, that people have been imagining the face for as long as we have been people. We are all the same under the skin, as they knew in Ice Age France.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>The passage given below is followed by a set of questions. Choose the best answer to each question.<\/p><\/div><p>What is the author's attitude towards the ancient portrait?<\/p>", "options": ["<p>He admires it as an archaeological discovery, but finds it very different from the modern concept of art.<\/p>", "<p>It fills him with awe and wonder, and makes him feel deeply connected to prehistoric humans.<\/p>", "<p>It makes him realize that though prehistoric humans may have led animal-like lives, their artistic sensibilities were not so different from ours.<\/p>", "<p>The portrait's strange resemblance to paintings by modern artists such as Picasso, Modigliani, etc. leaves the author puzzled but intrigued.<\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p>  by a set of questions. Choose the best answer to each question.<\/p><\/div><p>What does the author mean when he says 'Is this a bit fishy?'<\/p>", "options": ["<p>Considering how the ancient painting resembles 20th century artistic styles, one might think it is a fake.<\/p>", "<p>It is strange that the ancient portrait should resemble so many modern artists' styles.<\/p>", "<p>The ancient artwork is so good that it is difficult to believe that it was done by prehistoric people.<\/p>", "<p>It is surprising that 20th century artists painted in the same style as prehistoric people.<\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p>Refer to paragraph 4, where the quote occurs. While [2] is true in itself, it is not the whole answer. The sentence following the quoted one says that there is no doubt about the date of the ancient portrait. So the quoted sentence is asking whether the resemblance can mean that the painting might be faked (a possibility that the next sentence dismisses). Note that [3] is wrong because the author is not discussing the quality of the work in this paragraph, but the style. [4] inverts the reason for the surprise: prehistoric people seem to be painting in the same style as 20th century artists, not vice versa. Hence, [1].<\/p>", "topic": "Contextual Vocabulary"}, {"number": 12, "sourceId": "34411", "type": "mcq", "passage": "<p>No one is ever going to put a name to this face. Its owner lived before writing, agriculture, or towns existed, before there were states that kept records, before there was something called 'history'. The only reason we can be sure the people who painted in caves during the Ice Age were as human as we are – that is, they used their brains in the same way we do – is that they made art. No other animal makes art. And now the earliest art has a human face – literally.<\/p><p><br />The eye is a bold horizontal slash that connects to a downward diagonal apparently signifying a nose; below is a thinner line suggesting a awing, is covered with acutely observed heads of aurochs (extinct relatives of cattle) and horses whose tufty manes are painted with a clarity Da Vinci would have admired. Why is the human face so much harder to decipher, so stylized? Looking at the other portraits made in prehistory or at history's dawn, you start to guess why. The earliest human instinct was not to photograph the face, but to decorate it, to ennoble it.<br /> <br />There are still books that will tell you that the portrait was invented in the Renaissance and reflects the irresistible rise of Western individualism. The discovery in France adds to evidence from all over the world, that people have been imagining the face for as long as we have been people. We are all the same under the skin, as they knew in Ice Age France.<\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p>The passage given below is followed by a set of questions. Choose the best answer to each question.<\/p><\/div><p>The author of this passage is most likely to be:<\/p>", "options": ["<p>an art historian.<\/p>", "<p>an archaeologist.<\/p>", "<p>an anthropology professor.<\/p>", "<p>Cannot be determined<\/p>"], "answer": 3, "answerLabel": "D", "solution": "<p>There is no unequivocal clue in the passage about the author's profession. Though he speaks knowledgeably about art, art history and archaeological discoveries, there is nothing that marks him as an expert in any of these fields. Hence, [4].<\/p>", "topic": "Application Question"}, {"number": 13, "sourceId": "84471", "type": "tita", "passage": "<p><span lang=\"EN-US\">From the European perspective, it was Captain James Cook, a British navigator, who 'discovered' Australia and New Zealand in 1769–70. Cook tried to make friends with some Aboriginal people he and his crew encountered, but, as he recorded, 'all they seemed to want was for us to be gone'.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Cook described the Aboriginal inhabitants of Australia as 'timorous and inoffensive', living very happily without the 'necessary conveniences so much sought after in Europe'. To later settlers, however, the Aborigines' apparent disregard for property and material goods was proof of some subhuman state. So British administrators decreed the entire continent to be <em>terra nullius<\/em> — a Latin legal term meaning 'empty land', or 'land belonging to no one'.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Australia was anything but no one's land. In the eyes of its nomadic population, the entire continent was everywhere marked by the shapes and signs of ancestral handiwork – a visible, substantial legacy from the spirit world. To the outsider, Australia might seem a huge wilderness, but it was a place in which no Aboriginal wanderer was ever lost.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The tragedy prefigured by Cook's encounter with Aboriginals, who simply wanted him to go away, may be summarized in the phrase 'blood on the wattle': implying the near-extermination of Aboriginal communities across Australia and Tasmania in the process of colonization. British and other European settlers did not care to recognize that this 'new world' had been not only occupied for over 40,000 years, but supplied by its occupants with spiritual significance for eternity. At the heart of the matter, however, lies a conflict that is not unique to Australia.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">It is the conflict between two modes of subsistence. On the one side there is the system of hunting and gathering by which humankind survived through most phases of prehistory. On the other side there is agriculture, the settled raising of crops and animals that began approximately 10,000 years ago in the Middle East and Anatolia. For some archaeologists the diffusion of agriculture, with its capacity to produce surpluses of food, led to urban settlements and 'the birth of civilization'. And because we are inclined to think of farming as a stage of chronological progress in human history, we tend to forget that hunter-gatherers still survive in certain parts of the world, such as the Amazonian jungle and around the Arctic Circle.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Many generic differences could be outlined between hunter-gatherer societies and their agricultural rivals, and perhaps none is more conspicuous than the contrast in attitudes towards the environment. Broadly speaking, this contrast could be expressed as follows: hunter-gatherers work <em>with<\/em> the environment; agriculturists <em>against<\/em> it. Or, as anthropologists would confirm, hunter-gatherers tend to revere the environment, investing it with spirits of the place, while agriculturists regard it as a resource to be managed, a force to be subdued.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">To make this general paradigmatic opposition is not to deplore the many boons and benefits brought about by the intensive raising of crops and domestication of animals. Nor is it to revive the antique notion of a 'noble savage' \"“ the fantasy of some supremely unfettered and virtuous human existence in the wilds. (This was a romantic notion made intellectually fashionable in Europe at around the time of Captain Cook.) Hunters have, in some places, hunted certain species to extinction, and the Australian Aboriginal practice of creating seasonal bushfires arguably qualifies as working against the environment. But beyond any ecological debate lies a simple distinction of lifestyle that demands our acknowledgment here.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">What is this passage about? Choose as many statements as apply.<\/span><\/p>\n<p><em>Note: Your answer should be in letters and in alphabetical order. Use the virtual keyboard provided to enter your answer<\/em>.<\/p>\n\n\n<p>A. The conflict between the Australian Aboriginal people and European colonists.<\/p>\n<p>B. The conflict between hunter-gatherer and agricultural societies.<\/p>\n<p>C. The conflict between the hunter-gatherer and the agricultural lifestyles.<\/p>", "options": [], "answer": "AC", "answerLabel": "AC", "solution": "<p><span lang=\"EN-US\">The first half of the passage tells the story of the colonization of Australia in brief, with an emphasis on the different attitudes towards the land harboured by its Aboriginal inhabitants and the European colonists. So A is correct. The second half of the passage talks about the more general form of this conflict: the difference between hunter-gatherer lifestyles and attitudes and those of agricultural societies. It does not talk about conflicts per se between particular hunter-gatherer societies and agricultural societies. So C is correct, while B is not. Therefore, both A and C are correct. Hence, AC. <\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 14, "sourceId": "84472", "type": "mcq", "passage": "<p><span lang=\"EN-US\">From the European perspective, it was Captain James Cook, a British navigator, who 'discovered' Australia and New Zealand in 1769–70. Cook tried to make friends with some Aboriginal people he and his crew encountered, but, as he recorded, 'all they seemed to want was for us to be gone'.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Cook described the Aboriginal inhabitants of Australia as 'timorous and inoffensive', living very happily without the 'necessary conveniences so much sought after in Europe'. To later settlers, however, the Aborigines' apparent disregard for property and material goods was proof of some subhuman state. So British administrators decreed the entire continent to be <em>terra nullius<\/em> — a Latin legal term meaning 'empty land', or 'land belonging to no one'.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Australia was anything but no one's land. In the eyes of its nomadic population, the entire continent was everywhere marked by the shapes and signs of ancestral handiwork – a visible, substantial legacy from the spirit world. To the outsider, Australia might seem a huge wilderness, but it was a place in which no Aboriginal wanderer was ever lost.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The tragedy prefigured by Cook's encounter with Aboriginals, who simply wanted him to go away, may be summarized in the phrase 'blood on the wattle': implying the near-extermination of Aboriginal communities across Australia and Tasmania in the process of colonization. British and other European settlers did not care to recognize that this 'new world' had been not only occupied for over 40,000 years, but supplied by its occupants with spiritual significance for eternity. At the heart of the matter, however, lies a conflict that is not unique to Australia.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">It is the conflict between two modes of subsistence. On the one side there is the system of hunting and gathering by which humankind survived through most phases of prehistory. On the other side there is agriculture, the settled raising of crops and animals that began approximately 10,000 years ago in the Middle East and Anatolia. For some archaeologists the diffusion of agriculture, with its capacity to produce surpluses of food, led to urban settlements and 'the birth of civilization'. And because we are inclined to think of farming as a stage of chronological progress in human history, we tend to forget that hunter-gatherers still survive in certain parts of the world, such as the Amazonian jungle and around the Arctic Circle.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Many generic differences could be outlined between hunter-gatherer societies and their agricultural rivals, and perhaps none is more conspicuous than the contrast in attitudes towards the environment. Broadly speaking, this contrast could be expressed as follows: hunter-gatherers work <em>with<\/em> the environment; agriculturists <em>against<\/em> it. Or, as anthropologists would confirm, hunter-gatherers tend to revere the environment, investing it with spirits of the place, while agriculturists regard it as a resource to be managed, a force to be subdued.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">To make this general paradigmatic opposition is not to deplore the many boons and benefits brought about by the intensive raising of crops and domestication of animals. Nor is it to revive the antique notion of a 'noble savage' \"“ the fantasy of some supremely unfettered and virtuous human existence in the wilds. (This was a romantic notion made intellectually fashionable in Europe at around the time of Captain Cook.) Hunters have, in some places, hunted certain species to extinction, and the Australian Aboriginal practice of creating seasonal bushfires arguably qualifies as working against the environment. But beyond any ecological debate lies a simple distinction of lifestyle that demands our acknowledgment here.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">What was Captain Cook's attitude towards the Australian Aboriginal people?<\/span><\/p>", "options": ["<p><span lang=\"EN-US  for property and material goods was proof of some subhuman state. So British administrators decreed the entire continent to be <em>terra nullius<\/em> — a Latin legal term meaning 'empty land', or 'land belonging to no one'.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Australia was anything but no one's land. In the eyes of its nomadic population, the entire continent was everywhere marked by the shapes and signs of ancestral handiwork – a visible, substantial legacy from the spirit world. To the outsider, Australia might seem a huge wilderness, but it was a place in which no Aboriginal wanderer was ever lost.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The tragedy prefigured by Cook's encounter with Aboriginals, who simply wanted him to go away, may be summarized in the phrase 'blood on the wattle': implying the near-extermination of Aboriginal communities across Australia and Tasmania in the process of colonization. British and other European settlers did not care to recognize that this 'new world' had been not only occupied for over 40,000 years, but supplied by its occupants with spiritual significance for eternity. At the heart of the matter, however, lies a conflict that is not unique to Australia.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">It is the conflict between two modes of subsistence. On the one side there is the system of hunting and gathering by which humankind survived through most phases of prehistory. On the other side there is agriculture, the settled raising of crops and animals that began approximately 10,000 years ago in the Middle East and Anatolia. For some archaeologists the diffusion of agriculture, with its capacity to produce surpluses of food, led to urban settlements and 'the birth of civilization'. And because we are inclined to think of farming as a stage of chronological progress in human history, we tend to forget that hunter-gatherers still survive in certain parts of the world, such as the Amazonian jungle and around the Arctic Circle.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Many generic differences could be outlined between hunter-gatherer societies and their agricultural rivals, and perhaps none is more conspicuous than the contrast in attitudes towards the environment. Broadly speaking, this contrast could be expressed as follows: hunter-gatherers work <em>with<\/em> the environment; agriculturists <em>against<\/em> it. Or, as anthropologists would confirm, hunter-gatherers tend to revere the environment, investing it with spirits of the place, while agriculturists regard it as a resource to be managed, a force to be subdued.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">To make this general paradigmatic opposition is not to deplore the many boons and benefits brought about by the intensive raising of crops and domestication of animals. Nor is it to revive the antique notion of a 'noble savage' \"“ the fantasy of some supremely unfettered and virtuous human existence in the wilds. (This was a romantic notion made intellectually fashionable in Europe at around the time of Captain Cook.) Hunters have, in some places, hunted certain species to extinction, and the Australian Aboriginal practice of creating seasonal bushfires arguably qualifies as working against the environment. But beyond any ecological debate lies a simple distinction of lifestyle that demands our acknowledgment here.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following is true about hunter-gatherers in general, as per this passage?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">Hunter-gatherers live more virtuous lives than their agricultural rivals.<\/span><\/p>", "<p><span lang=\"EN-US\">Hunter-gatherers are never lost in the wilderness of their own lands.<\/span><\/p>", "<p><span lang=\"EN-US\">Hunter-gatherers tend to invest the environment with spiritual significance.<\/span><\/p>", "<p><span lang=\"EN-US\">Hunter-gatherers have been replaced by agricultural societies all over the world today.<\/span><\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p><span lang=\"EN-US\">In the last paragraph, the author dismisses the idea that hunter-gatherers are more virtuous as a 'fantasy', so [1] is incorrect. In the last sentence of the fifth paragraph, it is clearly stated that hunter-gatherers still survive in parts of the modern world, so [4] is false. [2] may be true specifically about Australian Aboriginals, but we cannot infer that it applies to all hunter-gatherers in general. Only [3] is true for all of them, as stated in the last sentence of the penultimate paragraph. Hence, [3].<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 16, "sourceId": "84474", "type": "mcq", "passage": "<p><span lang=\"EN-US\">From the European perspective, it was Captain James Cook, a British navigator, who 'discovered' Australia and New Zealand in 1769–70. Cook tried to make friends with some Aboriginal people he and his crew encountered, but, as he recorded, 'all they seemed to want was for us to be gone'.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Cook described the Aboriginal inhabitants of Australia as 'timorous and inoffensive', living very happily without the 'necessary conveniences so much sought after in Europe'. To later settlers, however, the Aborigines' apparent disregard for property and material goods was proof of some subhuman state. So British administrators decreed the entire continent to be <em>terra nullius<\/em> — a Latin legal term meaning 'empty land', or 'land belonging to no one'.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Australia was anything but no one's land. In the eyes of its nomadic population, the entire continent was everywhere marked by the shapes and signs of ancestral handiwork – a visible, substantial legacy from the spirit world. To the outsider, Australia might seem a huge wilderness, but it was a place in which no Aboriginal wanderer was ever lost.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The tragedy prefigured by Cook's encounter with Aboriginals, who simply wanted him to go away, may be summarized in the phrase 'blood on the wattle': implying the near-extermination of Aboriginal communities across Australia and Tasmania in the process of colonization. British and other European settlers did not care to recognize that this 'new world' had been not only occupied for over 40,000 years, but supplied by its occupants with spiritual significance for eternity. At the heart of the matter, however, lies a conflict that is not unique to Australia.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">It is the conflict between two modes of subsistence. On the one side there is the system of hunting and gathering by which humankind survived through most phases of prehistory. On the other side there is agriculture, the settled raising of crops and animals that began approximately 10,000 years ago in the Middle East and Anatolia. For some archaeologists the diffusion of agriculture, with its capacity to produce surpluses of food, led to urban settlements and 'the birth of civilization'. And because we are inclined to think of farming as a stage of chronological progress in human history, we tend to forget that hunter-gatherers still survive in certain parts of the world, such as the Amazonian jungle and around the Arctic Circle.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Many generic differences could be outlined between hunter-gatherer societies and their agricultural rivals, and perhaps none is more conspicuous than the contrast in attitudes towards the environment. Broadly speaking, this contrast could be expressed as follows: hunter-gatherers work <em>with<\/em> the environment; agriculturists <em>against<\/em> it. Or, as anthropologists would confirm, hunter-gatherers tend to revere the environment, investing it with spirits of the place, while agriculturists regard it as a resource to be managed, a force to be subdued.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">To make this general paradigmatic opposition is not to deplore the many boons and benefits brought about by the intensive raising of crops and domestication of animals. Nor is it to revive the antique notion of a 'noble savage' \"“ the fantasy of some supremely unfettered and virtuous human existence in the wilds. (This was a romantic notion made intellectually fashionable in Europe at around the time of Captain Cook.) Hunters have, in some places, hunted certain species to extinction, and the Australian Aboriginal practice of creating seasonal bushfires arguably qualifies as working against the environment. But beyond any ecological debate lies a simple distinction of lifestyle that demands our acknowledgment here.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">Which of the following can be inferred from this passage?<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">The Aborigines first came to Australia over 40,000 years ago.<\/span><\/p>", "<p><span lang=\"EN-US\">Australia was settled by human beings far earlier than Europe was.<\/span><\/p>", "<p><span lang=\"EN-US\">The Aborigines of Australia were forced to adopt an agricultural lifestyle after the British took over their land.<\/span><\/p>", "<p><span lang=\"EN-US\">The Aborigines of Australia had no right to their land, as they did not care about property rights.<\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p><span lang=\"EN-US\">According to paragraph 4, Australia had been occupied for over 40,000 years when European settlers reached there in the 18<\/span><span lang=\"EN-US\">th<\/span><span lang=\"EN-US\"><span>  <\/span>century, so [1] is correct. There is no information in the passage about when Europe was settled, so [2] cannot be inferred at all. The Australian Aborigines are said to have followed a hunter-gatherer lifestyle before the European contact; but there is no suggestion in the passage that they were forced to switch to a farming lifestyle afterwards. So [3] is incorrect. While it is true that the Aborigines apparently did not care about property rights, this does not mean that they had <em>no<\/em> right to their land – they had a moral right to the land they had lived in for thousands of years. So [4] is not inferable either. Hence, [1].<\/span><\/p>", "topic": "Specific Detail  Question"}, {"number": 17, "sourceId": "84487", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">What is science? Karl Popper, an influential 20<\/span><span lang=\"EN-US\">th<\/span><span lang=\"EN-US\">-century philosopher of science, thought that the fundamental feature of a scientific theory is that it should be falsifiable. To call a theory falsifiable is not to say that it is false. Rather, it means that the theory makes some definite predictions that are capable of being tested against experience. If these predictions turn out to be wrong, then the theory has been falsified, or disproved. So a falsifiable theory is one that we might discover to be false – it is not compatible with every possible course of experience. Popper thought that some supposedly scientific theories did not satisfy this condition and thus did not deserve to be called science at all; rather they were merely pseudo-science.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Freud's psychoanalytic theory was one of Popper's favourite examples of pseudo-science. According to Popper, Freud's theory could be reconciled with any empirical findings whatsoever. Whatever a patient's behaviour, Freudians could find an explanation of it in terms of their theory – they would never admit that their theory was wrong. Popper argued that through the use of such concepts as repression, sublimation and unconscious desires, Freud's theory could be rendered compatible with any clinical data whatever; it was thus unfalsifiable.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">The same was true of Marx's theory of history, Popper maintained. Marx claimed that in industrialized societies around the world, capitalism would give way to socialism and ultimately to communism. But when this didn't happen, instead of admitting that Marx's theory was wrong, Marxists would invent an <em>ad hoc<\/em> explanation for why what happened was actually perfectly consistent with their theory. For example, they might say that the inevitable progress to communism had been temporarily slowed by the rise of the welfare state, which 'softened' the proletariat and weakened their revolutionary zeal. In this sort of way, Marx's theory could be made compatible with any possible course of events, just like Freud's. Therefore neither theory qualifies as genuinely scientific, according to Popper's criterion.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Popper contrasted Freud's and Marx's theories with Einstein's theory of gravitation, also known as general relativity. Unlike Freud's and Marx's theories, Einstein's theory made a very definite prediction: that light rays from distant stars would be deflected by the gravitational field of the sun. This effect was confirmed in 1919 by the English astrophysicist Sir Arthur Eddington. Popper was very impressed by this. Einstein's theory had made a definite, precise prediction, which was confirmed by observations. Had it turned out that starlight was not deflected by the sun, this would have showed that Einstein was wrong. So Einstein's theory satisfies the criterion of falsifiability.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">Popper's attempt to demarcate science from pseudo-science is intuitively quite plausible. There is certainly something fishy about a theory that can be made to fit any empirical data whatsoever. But some philosophers regard Popper's criterion as overly simplistic. There is some evidence that even 'respectable' scientists – whom Popper would not want to accuse of engaging in pseudoscience – routinely explain away data that appears to conflict with their theories, and this has led to important scientific discoveries.<\/span><\/p><p><span lang=\"EN-US\"> <\/span><\/p><p><span lang=\"EN-US\">This suggests that Popper's attempt to demarcate science from pseudo-science cannot be quite right, despite its initial plausibility. In general, scientists do not just abandon their theories whenever they conflict with the observational data. Usually they look for ways of eliminating the conflict without having to give up their theory. And it is worth remembering that virtually every theory in science conflicts with some observations – finding a theory that fits <em>all<\/em> the data perfectly is extremely difficult. Obviously if a theory persistently conflicts with more and more data, and no plausible ways of explaining away the conflict are found, it will eventually have to be rejected. But little progress would be made if scientists simply abandoned their theories at the first sign of trouble.<\/span><\/p>", "passageTitle": "Reading Comprehension Passage", "question": "<div class=\"direction\"><p><span lang=\"EN-US\">The passage given below is followed by a set of questions. Choose the most appropriate answer to each question.<\/span><\/p><\/div><p><span lang=\"EN-US\"><br /><\/span><\/p>\n<p><span lang=\"EN-US\">According to the author, Popper's criterion of falsifiability is:<\/span><\/p>", "options": ["<p><span lang=\"EN-US\">A valid idea, though scientists nowadays pay little attention to it.<\/span><\/p>", "<p><span lang=\"EN-US\">Useful to some extent, but does not apply to science as it is actually practised.<\/span><\/p>", "<p><span lang=\"EN-US\">Plausible, but problematic as it does not distinguish science from pseudo-science.<\/span><\/p>", "<p><span lang=\"EN-US\">A fundamentally flawed idea, with very little evidence to support it.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<p><span lang=\"EN-US\">Though the passage begins with the author describing Popper's criterion of falsifiability in neutral terms, in the last two paragraphs, he shows that it does not really describe how even 'respectable' scientists practise science. So the author does not consider the idea to be 'valid', and thus [1] is incorrect. On the other hand, [4] is too harsh and negative. Since the point of the idea of falsifiability is to distinguish science from pseudo-science, the fact that it doesn't do so consistently is more than just 'problematic', so [3] is not quite correct either. [2] best summarizes the author's views: he shows how Popper's criterion of falsifiability can be useful for categorizing Freudian and Marxist theories as pseudo-science, but he also points out that it does not apply to science as it is actually practised. Hence, [2].<\/span><\/p>", "topic": "Application Question"}, {"number": 18, "sourceId": "84488", "type": "mcq", "passage": "<p><span lang=\"EN-US\"><br /><\/span><\/p><p><span lang=\"EN-US\">What is science? Karl Popper, an influential 20<\/span><span lang=\"EN-US\">th<\/span><span lang=\"EN-US\">-century philosopher of
