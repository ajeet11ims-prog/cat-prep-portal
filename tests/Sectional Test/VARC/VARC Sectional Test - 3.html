<script type="application/json" id="test-data">{"testNumber": 3, "simcat": 3, "minutes": 40, "questions": [{"number": 1, "sourceId": "16854432482730", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span>\r<br>\r<br><span>At the dawn of representative democracy in Europe, two significant voices were raised that questioned its meaning and value at the root. The first – well known, and tainted by all manner of accusations, from naivety to historical disinformation, an innate tendency towards ‘‘totalitarianism,’’ and so forth – was that of Jean-Jacques Rousseau. His premise, is that ‘‘sovereignty cannot be represented for the same reason that it cannot be transferred.’’<\/span>\r<br>\r<br><span>Sovereignty consists of ‘‘the general will, and the general will cannot be represented.” From this comes Rousseau’s famous devaluing of the representative system, which by then had been in place in England for many decades: ‘‘The English people believe they are free, but they are grossly mistaken. They are only so during the elections of members of parliament. As soon as these have been elected, the people are immediately consigned to slavery; they are nothing. The way they use their freedom during the brief moments when they possess it means that they thoroughly deserve to lose it.’’<\/span>\r<br>\r<br><span>The acid test, so to speak, for Rousseau lies in the historical precedent of antiquity: ‘‘In the ancient republics, and also in monarchies, the people never had representatives.” It is striking that he is not especially concerned with highlighting the severe limits that the ‘‘free\" English system placed on representation, that is, the system by which members were elected to the House of Commons; it is the existence of representation in itself that is called into question.<\/span>\r<br>\r<br><span>This may seem an extreme paradox but, in a far-seeing way, he emphasizes a disastrous effect of the representative system: the transformation of elected representatives into what we now call a ‘‘political class’’ (whatever their political affiliations), their essential separateness from the specific interests of those who have designated them their representatives, and the way in which they function, at decisive moments, as a separate, self-referential body. Rousseau condemned this vice at the outset from a logical and philosophical standpoint but also from a legal one. This is therefore both an admonition and a premonition.<\/span>\r<br>\r<br><span>The other ‘‘preventive admonition’’ is that formulated by Condorcet in 1785… He argues that confusion must result from any electoral procedure in which voters are presented with more than two choices. According to the now famous ‘‘paradox,’’ it is manifestly impossible to obtain a meaningful overall result (or, as the phrase goes, ‘‘extend the transitivity of individual preferences to social ones’’).<\/span><span><sup> <\/sup><\/span><span>An individual’s choices regarding three options, expressed in an order of preference (A, B, C), can be stated and are meaningful – ‘’ Mr x prefers A to B and B to C’’ is perfectly clear. The same is not true of the ‘‘sum’’ (or the balance) of many individual choices of the same kind…<\/span>\r<br>\r<br><span>The illustration of this apparent paradox is based upon three options and three ‘‘voters’’: x, y, and z. Assume their cyclic orders of preferences are ABC, BCA, and CAB respectively. It follows that A defeats B and B defeats C. However, C also defeats A since, if we compare its result directly with that of A, we see that two voters have preferred C to A, whereas only one – x – has preferred A to C.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>What is the main idea of the passage?<\/span>", "options": ["<span>To describe the political ideologies of Jean-Jacques Rousseau and Condorcet and how they influenced the development of representative democracy.<\/span>", "<span><\/span>\t<span>To outline the history of the development of representative democracy in Europe and its impact on the political system.<\/span>", "<span><\/span>\t<span>To present a comparison of the political systems of England and the ancient republics and monarchies.<\/span>", "<span><\/span>\t<span>To present two critical voices in the early days of representative democracy in Europe, who questioned its meaning and value.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>Option 1. Incorrect. While the passage does mention the political ideologies of Rousseau and Condorcet, it does not describe how they influenced the development of representative democracy.<\/span>\r<br /><span>Option 2. Incorrect. The passage does not provide a detailed history of the development of representative democracy or its impact on the political system.<\/span>\r<br /><span>Option 3. Incorrect. The passage does not provide comparison of political systems in England and ancient republics and monarchies.<\/span>\r<br /><span>Option 4. Correct. It accurately reflects the main idea of the passage, which is to present two critical voices in the early days of representative democracy in Europe who questioned its meaning and value.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Central Idea"}, {"number": 2, "sourceId": "16854432482761", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span>\r<br>\r<br><span>At the dawn of representative democracy in Europe, two significant voices were raised that questioned its meaning and value at the root. The first – well known, and tainted by all manner of accusations, from naivety to historical disinformation, an innate tendency towards ‘‘totalitarianism,’’ and so forth – was that of Jean-Jacques Rousseau. His premise, is that ‘‘sovereignty cannot be represented for the same reason that it cannot be transferred.’’<\/span>\r<br>\r<br><span>Sovereignty consists of ‘‘the general will, and the general will cannot be represented.” From this comes Rousseau’s famous devaluing of the representative system, which by then had been in place in England for many decades: ‘‘The English people believe they are free, but they are grossly mistaken. They are only so during the elections of members of parliament. As soon as these have been elected, the people are immediately consigned to slavery; they are nothing. The way they use their freedom during the brief moments when they possess it means that they thoroughly deserve to lose it.’’<\/span>\r<br>\r<br><span>The acid test, so to speak, for Rousseau lies in the historical precedent of antiquity: ‘‘In the ancient republics, and also in monarchies, the people never had representatives.” It is striking that he is not especially concerned with highlighting the severe limits that the ‘‘free\" English system placed on representation, that is, the system by which members were elected to the House of Commons; it is the existence of representation in itself that is called into question.<\/span>\r<br>\r<br><span>This may seem an extreme paradox but, in a far-seeing way, he emphasizes a disastrous effect of the representative system: the transformation of elected representatives into what we now call a ‘‘political class’’ (whatever their political affiliations), their essential separateness from the specific interests of those who have designated them their representatives, and the way in which they function, at decisive moments, as a separate, self-referential body. Rousseau condemned this vice at the outset from a logical and philosophical standpoint but also from a legal one. This is therefore both an admonition and a premonition.<\/span>\r<br>\r<br><span>The other ‘‘preventive admonition’’ is that formulated by Condorcet in 1785… He argues that confusion must result from any electoral procedure in which voters are presented with more than two choices. According to the now famous ‘‘paradox,’’ it is manifestly impossible to obtain a meaningful overall result (or, as the phrase goes, ‘‘extend the transitivity of individual preferences to social ones’’).<\/span><span><sup> <\/sup><\/span><span>An individual’s choices regarding three options, expressed in an order of preference (A, B, C), can be stated and are meaningful – ‘’ Mr x prefers A to B and B to C’’ is perfectly clear. The same is not true of the ‘‘sum’’ (or the balance) of many individual choices of the same kind…<\/span>\r<br>\r<br><span>The illustration of this apparent paradox is based upon three options and three ‘‘voters’’: x, y, and z. Assume their cyclic orders of preferences are ABC, BCA, and CAB respectively. It follows that A defeats B and B defeats C. However, C also defeats A since, if we compare its result directly with that of A, we see that two voters have preferred C to A, whereas only one – x – has preferred A to C.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Rousseau’s view of democracy is all of the following EXCEPT:<\/span>", "options": ["<span>Representative regimes are incompatible with democracy.<\/span>", "<span><\/span>\t<span>Representative sovereignty cannot have legitimacy.<\/span>", "<span><\/span>\t<span>Representation is possible only through elections.<\/span>", "<span><\/span>\t<span>People lose their freedom when they are represented.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>Option 3 is not in line with Rousseau's view of democracy. The passage does not mention that Rousseau believed that representation was only possible through elections, but rather that the general will could not be&nbsp;<\/span><span>represented<\/span><span> and sovereignty cannot be transferred, which calls into question the representative system. Option 2 is not the answer because “Rousseau condemned this vice at the outset from a logical and philosophical standpoint but also from a legal one.”<\/span>\r<br /><span>Hence, [<\/span><span>3<\/span><span>].<\/span>", "topic": "Specific Detail Question"}, {"number": 3, "sourceId": "16854432482762", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span>\r<br>\r<br><span>At the dawn of representative democracy in Europe, two significant voices were raised that questioned its meaning and value at the root. The first – well known, and tainted by all manner of accusations, from naivety to historical disinformation, an innate tendency towards ‘‘totalitarianism,’’ and so forth – was that of Jean-Jacques Rousseau. His premise, is that ‘‘sovereignty cannot be represented for the same reason that it cannot be transferred.’’<\/span>\r<br>\r<br><span>Sovereignty consists of ‘‘the general will, and the general will cannot be represented.” From this comes Rousseau’s famous devaluing of the representative system, which by then had been in place in England for many decades: ‘‘The English people believe they are free, but they are grossly mistaken. They are only so during the elections of members of parliament. As soon as these have been elected, the people are immediately consigned to slavery; they are nothing. The way they use their freedom during the brief moments when they possess it means that they thoroughly deserve to lose it.’’<\/span>\r<br>\r<br><span>The acid test, so to speak, for Rousseau lies in the historical precedent of antiquity: ‘‘In the ancient republics, and also in monarchies, the people never had representatives.” It is striking that he is not especially concerned with highlighting the severe limits that the ‘‘free\" English system placed on representation, that is, the system by which members were elected to the House of Commons; it is the existence of representation in itself that is called into question.<\/span>\r<br>\r<br><span>This may seem an extreme paradox but, in a far-seeing way, he emphasizes a disastrous effect of the representative system: the transformation of elected representatives into what we now call a ‘‘political class’’ (whatever their political affiliations), their essential separateness from the specific interests of those who have designated them their representatives, and the way in which they function, at decisive moments, as a separate, self-referential body. Rousseau condemned this vice at the outset from a logical and philosophical standpoint but also from a legal one. This is therefore both an admonition and a premonition.<\/span>\r<br>\r<br><span>The other ‘‘preventive admonition’’ is that formulated by Condorcet in 1785… He argues that confusion must result from any electoral procedure in which voters are presented with more than two choices. According to the now famous ‘‘paradox,’’ it is manifestly impossible to obtain a meaningful overall result (or, as the phrase goes, ‘‘extend the transitivity of individual preferences to social ones’’).<\/span><span><sup> <\/sup><\/span><span>An individual’s choices regarding three options, expressed in an order of preference (A, B, C), can be stated and are meaningful – ‘’ Mr x prefers A to B and B to C’’ is perfectly clear. The same is not true of the ‘‘sum’’ (or the balance) of many individual choices of the same kind…<\/span>\r<br>\r<br><span>The illustration of this apparent paradox is based upon three options and three ‘‘voters’’: x, y, and z. Assume their cyclic orders of preferences are ABC, BCA, and CAB respectively. It follows that A defeats B and B defeats C. However, C also defeats A since, if we compare its result directly with that of A, we see that two voters have preferred C to A, whereas only one – x – has preferred A to C.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>“This is therefore both an admonition and a premonition.”<\/span><br><span>In the context of the passage, which one of the following is NOT a possible implication of the quoted statement?<\/span>", "options": ["<span>Rousseau's critique of democracy is based on the idea that sovereignty cannot be represented as it consists of the general will, which cannot be represented.<\/span>", "<span><\/span>\t<span>Rousseau highlighted the disastrous effects of the free English system that had significant restrictions on how representatives were elected.<\/span>", "<span><\/span>\t<span>Rousseau argues that democracy has the potential to transform elected representatives into a self-referential political class, separate from the interests of the people.<\/span>", "<span><\/span>\t<span>Rousseau devalues the representative system of democracy and forewarns about its negative consequences leading to a loss of freedom for the general public.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>The \"admonition\" (criticism) referred to in the passage is Rousseau's warning or caution about the representative system of democracy. According to the passage, Rousseau's critique of the representative system was based on the idea that sovereignty cannot be represented as it consists of the general will, which cannot be represented.  The word \"premonition\"(apprehension or foreboding) in the passage refers to the potential negative consequences of the representative democracy system. He argues that it has the potential to transform elected representatives into a self-referential political class, separate from the interests of the people who elected them, leading to a loss of freedom for the&nbsp;<\/span><span>general public<\/span><span>. Options 1, 3 and 4 highlight these aspects generally.<\/span>\r<br /><span>The passage states: “It is striking that he is not especially concerned with highlighting the severe limits that the ‘‘free\" English system placed on representation…” Hence option 2 is not his main concern – included in the admonition and premonition. His concern is not the deficiency of the English system or any other specific system. His concern is about the idea of representation in general.<\/span>\r<br /><span>Hence, [<\/span><span>2<\/span><span>].<\/span>", "topic": "Specific Detail Question"}, {"number": 4, "sourceId": "16854432482763", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span>\r<br>\r<br><span>At the dawn of representative democracy in Europe, two significant voices were raised that questioned its meaning and value at the root. The first – well known, and tainted by all manner of accusations, from naivety to historical disinformation, an innate tendency towards ‘‘totalitarianism,’’ and so forth – was that of Jean-Jacques Rousseau. His premise, is that ‘‘sovereignty cannot be represented for the same reason that it cannot be transferred.’’<\/span>\r<br>\r<br><span>Sovereignty consists of ‘‘the general will, and the general will cannot be represented.” From this comes Rousseau’s famous devaluing of the representative system, which by then had been in place in England for many decades: ‘‘The English people believe they are free, but they are grossly mistaken. They are only so during the elections of members of parliament. As soon as these have been elected, the people are immediately consigned to slavery; they are nothing. The way they use their freedom during the brief moments when they possess it means that they thoroughly deserve to lose it.’’<\/span>\r<br>\r<br><span>The acid test, so to speak, for Rousseau lies in the historical precedent of antiquity: ‘‘In the ancient republics, and also in monarchies, the people never had representatives.” It is striking that he is not especially concerned with highlighting the severe limits that the ‘‘free\" English system placed on representation, that is, the system by which members were elected to the House of Commons; it is the existence of representation in itself that is called into question.<\/span>\r<br>\r<br><span>This may seem an extreme paradox but, in a far-seeing way, he emphasizes a disastrous effect of the representative system: the transformation of elected representatives into what we now call a ‘‘political class’’ (whatever their political affiliations), their essential separateness from the specific interests of those who have designated them their representatives, and the way in which they function, at decisive moments, as a separate, self-referential body. Rousseau condemned this vice at the outset from a logical and philosophical standpoint but also from a legal one. This is therefore both an admonition and a premonition.<\/span>\r<br>\r<br><span>The other ‘‘preventive admonition’’ is that formulated by Condorcet in 1785… He argues that confusion must result from any electoral procedure in which voters are presented with more than two choices. According to the now famous ‘‘paradox,’’ it is manifestly impossible to obtain a meaningful overall result (or, as the phrase goes, ‘‘extend the transitivity of individual preferences to social ones’’).<\/span><span><sup> <\/sup><\/span><span>An individual’s choices regarding three options, expressed in an order of preference (A, B, C), can be stated and are meaningful – ‘’ Mr x prefers A to B and B to C’’ is perfectly clear. The same is not true of the ‘‘sum’’ (or the balance) of many individual choices of the same kind…<\/span>\r<br>\r<br><span>The illustration of this apparent paradox is based upon three options and three ‘‘voters’’: x, y, and z. Assume their cyclic orders of preferences are ABC, BCA, and CAB respectively. It follows that A defeats B and B defeats C. However, C also defeats A since, if we compare its result directly with that of A, we see that two voters have preferred C to A, whereas only one – x – has preferred A to C.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>It can be deduced from the last paragraph that:<\/span>", "options": ["<span>Voters will remain unhappy with their decision.<\/span>", "<span><\/span>\t<span>It is not possible for voters to elect a candidate.<\/span>", "<span><\/span>\t<span>No candidate can beat all the other candidates.<\/span>", "<span><\/span>\t<span>The election will always be tied.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>Directly available from the cyclic orders of preferences: “It follows that A defeats B and B defeats C. However, C also defeats A”. That means no candidate can beat the other two candidates (but only one of them). Option 3 will always be true in the cyclic order of preferences mentioned in the last paragraph.<\/span>\r<br /><span>Hence, [<\/span><span>3<\/span><span>].<\/span>", "topic": "Inference"}, {"number": 5, "sourceId": "16854432482764", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>In 1873 Alexander Fedorovich Rittikh, one of the Russian Empire’s most eminent cartographers, published two maps of the Baltic provinces depicting the ethnographic and religious composition of the region’s inhabitants. Rittikh’s maps painted a vivid portrait of a multi-ethnic and confessionally diverse imperial borderlands. Yet, behind the veneer of scientific objectivity, the maps were also a politically motivated attempt to use cartography to legitimise Russian imperial rule over the region.<\/span><br><br><span>The three Baltic provinces of Estland, Livland and Kurland, which correspond to present-day Estonia and Latvia, had been incorporated into the Russian Empire over the 18th century. They continued, however, to be regarded as a distinct region within the empire, characterised by a degree of autonomy <\/span>over local governance, special laws, German-speaking elites, Estonian- and Latvian-speaking peasantry, majority Lutheran faith and a manorial economy system. Over the course of the 19th century, the particularities of imperial rule in the Baltic, the ‘Baltic Question’, sparked debates among intellectuals about how to justify Russian imperial rule over non-Russian populations and the relationship between the empire and emerging ideas around a distinctive Russian national culture. One view held that the Baltic provinces were perceived by some as culturally part of ‘the West’ and used to present Russia as a truly European empire. Conversely, the ethnolinguistic and religious diversity of the borderlands was perceived by others as an extension of ‘the West’ into Russia’s borders and a potential threat to the development of Russia’s unique national culture.<br><br><span>Rittikh’s peers in the Geographical Society held his maps in high esteem. Readers in the Baltic provinces, however, reacted with condemnation. Critiques slated his poor scientific research practices and subjective interpretation of statistical data. In the text accompanying the maps, Rittikh argued for the close historical and cultural contacts between Estonians, Latvians and Russians. Germans, by contrast, were cast as foreign colonisers who had violently occupied the region since the 12th century.<\/span><br><br><span>Rittikh’s politicisation of language and claims about the deep-rooted kinship of the Baltic provinces with the Russian sphere of influence are echoed in Kremlin discourse about these territories being part of Russia’s ‘near abroad’. Moreover, Rittikh was also one of the first to term the Baltic provinces <\/span><span>pribaltiskii krai <\/span><span>‘border territory by the Baltic Sea’. This appropriated the Baltics as an integral, natural part of the Russian state…<\/span><br><br><span>Influential though Rittikh’s maps were for shaping perceptions of the Baltic provinces, his was not the only voice. By the late 19th century, Estonian and Latvian mapmakers, thanks to high literacy rates and growing opportunities for social advancement, began to produce maps that challenged this imperialist outlook. One such mapmaker was Matīss Siliņš, a schoolteacher and publisher of popular calendars, who began regularly creating Latvian-language maps in Riga in the 1890s for mass audiences. While Matīss did not go so far as to advocate Latvian independence, his maps consolidated the idea of a distinctive and vibrant Latvian territory within the Russian Empire. They signified a radical departure from seeing the Baltics only through the lens of Russian or German possessions or sphere of influence. These maps demonstrated how ethnographic cartography was not only a tool of imperial legitimation in the Baltic provinces but could also be a powerful means of expressing the political claims for Estonian and Latvian self-determination by the early 20th century.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following statements accurately describes what the passage is about?<\/span>", "options": ["<span>The depiction of the Baltic provinces in maps produced by the Russian Empire was politically motivated, serving as a justification for its rule over non-Russian populations.<\/span>", "<span><\/span>\t<span>The depiction of the Baltic regions in maps from the Russian Empire was shaped by discussions surrounding the empire's rule over the non-Russian populations in the area.<\/span>", "<span><\/span>\t<span>Historically, maps have been employed as a political tool for propaganda, targeting the ethnic and religious make-up of the residents of the Baltic provinces.<\/span>", "<span><\/span>\t<span>Maps created by Russian, Estonian, and Latvian cartographers in the late 19th century demonstrate the political potency of ethnographic cartography.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>Option 1 only partially captures the complexity of what the passage is about. The passage also mentions how Estonian and Latvian mapmakers challenged the Russian Empire's depiction of the Baltic provinces and used cartography to express their political claims for self-determination.<\/span>\r<br /><span>Option 2 is partially accurate, as it acknowledges that the depiction of the Baltic regions in maps was influenced by debates surrounding the empire's rule over non-Russian populations, it does not fully capture the political motivations behind the maps.<\/span>\r<br /><span>Option 3 is too limited in scope, as it only mentions maps being used as a tool of propaganda, without acknowledging the complexity and diversity of motivations behind the production of maps of the Baltic provinces.<\/span>\r<br /><span>Option 4 is the statement that best describes what the passage is about. The passage focuses on the use of maps in the late 19th century by Russian, Estonian, and Latvian cartographers to represent the ethnographic and religious composition of the residents of the Baltic provinces. The maps produced&nbsp;<\/span>by the Russian Empire were seen as politically motivated attempts to legitimize its rule over the non-Russian populations, while maps produced by Estonian and Latvian cartographers showed how ethnographic cartography could be a means of expressing political claims for self-determination. The passage highlights the potential of maps as a powerful political expression in the late 19th century.\r<br /><span>Hence, [4].<\/span>", "topic": "Central Idea"}, {"number": 6, "sourceId": "16854432482785", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>In 1873 Alexander Fedorovich Rittikh, one of the Russian Empire’s most eminent cartographers, published two maps of the Baltic provinces depicting the ethnographic and religious composition of the region’s inhabitants. Rittikh’s maps painted a vivid portrait of a multi-ethnic and confessionally diverse imperial borderlands. Yet, behind the veneer of scientific objectivity, the maps were also a politically motivated attempt to use cartography to legitimise Russian imperial rule over the region.<\/span><br><br><span>The three Baltic provinces of Estland, Livland and Kurland, which correspond to present-day Estonia and Latvia, had been incorporated into the Russian Empire over the 18th century. They continued, however, to be regarded as a distinct region within the empire, characterised by a degree of autonomy <\/span>over local governance, special laws, German-speaking elites, Estonian- and Latvian-speaking peasantry, majority Lutheran faith and a manorial economy system. Over the course of the 19th century, the particularities of imperial rule in the Baltic, the ‘Baltic Question’, sparked debates among intellectuals about how to justify Russian imperial rule over non-Russian populations and the relationship between the empire and emerging ideas around a distinctive Russian national culture. One view held that the Baltic provinces were perceived by some as culturally part of ‘the West’ and used to present Russia as a truly European empire. Conversely, the ethnolinguistic and religious diversity of the borderlands was perceived by others as an extension of ‘the West’ into Russia’s borders and a potential threat to the development of Russia’s unique national culture.<br><br><span>Rittikh’s peers in the Geographical Society held his maps in high esteem. Readers in the Baltic provinces, however, reacted with condemnation. Critiques slated his poor scientific research practices and subjective interpretation of statistical data. In the text accompanying the maps, Rittikh argued for the close historical and cultural contacts between Estonians, Latvians and Russians. Germans, by contrast, were cast as foreign colonisers who had violently occupied the region since the 12th century.<\/span><br><br><span>Rittikh’s politicisation of language and claims about the deep-rooted kinship of the Baltic provinces with the Russian sphere of influence are echoed in Kremlin discourse about these territories being part of Russia’s ‘near abroad’. Moreover, Rittikh was also one of the first to term the Baltic provinces <\/span><span>pribaltiskii krai <\/span><span>‘border territory by the Baltic Sea’. This appropriated the Baltics as an integral, natural part of the Russian state…<\/span><br><br><span>Influential though Rittikh’s maps were for shaping perceptions of the Baltic provinces, his was not the only voice. By the late 19th century, Estonian and Latvian mapmakers, thanks to high literacy rates and growing opportunities for social advancement, began to produce maps that challenged this imperialist outlook. One such mapmaker was Matīss Siliņš, a schoolteacher and publisher of popular calendars, who began regularly creating Latvian-language maps in Riga in the 1890s for mass audiences. While Matīss did not go so far as to advocate Latvian independence, his maps consolidated the idea of a distinctive and vibrant Latvian territory within the Russian Empire. They signified a radical departure from seeing the Baltics only through the lens of Russian or German possessions or sphere of influence. These maps demonstrated how ethnographic cartography was not only a tool of imperial legitimation in the Baltic provinces but could also be a powerful means of expressing the political claims for Estonian and Latvian self-determination by the early 20th century.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following best explains the “Baltic Question”?<\/span>", "options": ["<span>The \"Baltic Question\" refers to the conflicting interests of the powers in the region and the challenge of the demands of national self-determination.<\/span>", "<span>The “Baltic Question” refers to the concern of the major European powers because of the region's importance as a bridge between Russia and the rest of Europe.<\/span>", "<span><\/span>\t<span>The \"Baltic Question\" refers to debates about Russian rule over non-Russian populations in the Baltic states and their relationship with Russian national culture.<\/span>", "<span><\/span>\t<span>The “Baltic Question’ refers to the significant role played by Estonia and Latvia in shaping the geopolitical landscape of Europe in the 19th century.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>Option 3. Refer to the second paragraph: In the 19th century, there were debates among intellectuals about the relationship between the Russian Empire and the Baltic provinces, and how to justify Russian imperial rule over the non-Russian populations in these provinces. Some viewed the Baltic provinces as culturally part of \"the West\" and saw them&nbsp;<\/span><span>as a way to<\/span><span> present Russia as a truly European empire. On the other hand, others saw the ethnolinguistic and religious diversity of the borderlands as a potential threat to the development of Russia's unique national culture. The debates surrounding these issues came to be known as the \"Baltic Question.\"<\/span>\r<br /><span>Option 1. It comes very close to the answer. However, Option 1 is not the best explanation of the \"Baltic Question\" as it only mentions the conflicting interests of the powers in the region and the challenge of the demands of national&nbsp;<\/span><span>self-determination, but<\/span><span> doesn't explain the context of the debate specifically in the Baltic region. The \"Baltic Question\" referred to debates in the 19th century about the relationship between the Russian empire and the Baltic provinces, and their place in the Russian national culture, not just a general conflict of interests and self-determination.<\/span>\r<br /><span>Options 2 and 4 are similarly limiting in their scope.<\/span>\r<br /><span>Hence, [<\/span><span>3<\/span><span>].<\/span>", "topic": "Inference"}, {"number": 7, "sourceId": "16854432482786", "type": "mcq", "passage":
