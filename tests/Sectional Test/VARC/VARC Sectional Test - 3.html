s slated his poor scientific research practices and subjective interpretation of statistical data. In the text accompanying the maps, Rittikh argued for the close historical and cultural contacts between Estonians, Latvians and Russians. Germans, by contrast, were cast as foreign colonisers who had violently occupied the region since the 12th century.<\/span><br><br><span>Rittikh’s politicisation of language and claims about the deep-rooted kinship of the Baltic provinces with the Russian sphere of influence are echoed in Kremlin discourse about these territories being part of Russia’s ‘near abroad’. Moreover, Rittikh was also one of the first to term the Baltic provinces <\/span><span>pribaltiskii krai <\/span><span>‘border territory by the Baltic Sea’. This appropriated the Baltics as an integral, natural part of the Russian state…<\/span><br><br><span>Influential though Rittikh’s maps were for shaping perceptions of the Baltic provinces, his was not the only voice. By the late 19th century, Estonian and Latvian mapmakers, thanks to high literacy rates and growing opportunities for social advancement, began to produce maps that challenged this imperialist outlook. One such mapmaker was Matīss Siliņš, a schoolteacher and publisher of popular calendars, who began regularly creating Latvian-language maps in Riga in the 1890s for mass audiences. While Matīss did not go so far as to advocate Latvian independence, his maps consolidated the idea of a distinctive and vibrant Latvian territory within the Russian Empire. They signified a radical departure from seeing the Baltics only through the lens of Russian or German possessions or sphere of influence. These maps demonstrated how ethnographic cartography was not only a tool of imperial legitimation in the Baltic provinces but could also be a powerful means of expressing the political claims for Estonian and Latvian self-determination by the early 20th century.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>In the context of the passage, all of the following statements are true EXCEPT:<\/span>", "options": ["<span><span><\/span>\t<span>The Baltic provinces were exposed to European cultural and political influences.<\/span>", "<span>Russian cartography suppressed the multiethnicity and diversity of its borderlands.<\/span>", "<span>Russia ruled over the Baltic provinces in the 18th and 19th centuries.<\/span>", "<span><\/span>\t<span>A sense of distinct national identity arose in Estonia and Latvia in the late 19th century.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>In the context of the passage, option 2, \"Russian cartography suppressed the multiethnicity and diversity of its borderlands,\" is false. The opposite is&nbsp;<\/span><span>actually stated<\/span><span> in the passage, which says that&nbsp;<\/span><span>Rittikh's<\/span><span> maps painted a vivid portrait of the multi-ethnic and confessionally diverse imperial borderlands.(Paragraph 1) The other options, 1, 3, and 4, are all true based on the information provided in the passage.<\/span><span>&nbsp;<\/span><span>Hence, [<\/span><span>2<\/span><span>].<\/span>", "topic": "Specific Detail Question"}, {"number": 8, "sourceId": "16854432482787", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>In 1873 Alexander Fedorovich Rittikh, one of the Russian Empire’s most eminent cartographers, published two maps of the Baltic provinces depicting the ethnographic and religious composition of the region’s inhabitants. Rittikh’s maps painted a vivid portrait of a multi-ethnic and confessionally diverse imperial borderlands. Yet, behind the veneer of scientific objectivity, the maps were also a politically motivated attempt to use cartography to legitimise Russian imperial rule over the region.<\/span><br><br><span>The three Baltic provinces of Estland, Livland and Kurland, which correspond to present-day Estonia and Latvia, had been incorporated into the Russian Empire over the 18th century. They continued, however, to be regarded as a distinct region within the empire, characterised by a degree of autonomy <\/span>over local governance, special laws, German-speaking elites, Estonian- and Latvian-speaking peasantry, majority Lutheran faith and a manorial economy system. Over the course of the 19th century, the particularities of imperial rule in the Baltic, the ‘Baltic Question’, sparked debates among intellectuals about how to justify Russian imperial rule over non-Russian populations and the relationship between the empire and emerging ideas around a distinctive Russian national culture. One view held that the Baltic provinces were perceived by some as culturally part of ‘the West’ and used to present Russia as a truly European empire. Conversely, the ethnolinguistic and religious diversity of the borderlands was perceived by others as an extension of ‘the West’ into Russia’s borders and a potential threat to the development of Russia’s unique national culture.<br><br><span>Rittikh’s peers in the Geographical Society held his maps in high esteem. Readers in the Baltic provinces, however, reacted with condemnation. Critiques slated his poor scientific research practices and subjective interpretation of statistical data. In the text accompanying the maps, Rittikh argued for the close historical and cultural contacts between Estonians, Latvians and Russians. Germans, by contrast, were cast as foreign colonisers who had violently occupied the region since the 12th century.<\/span><br><br><span>Rittikh’s politicisation of language and claims about the deep-rooted kinship of the Baltic provinces with the Russian sphere of influence are echoed in Kremlin discourse about these territories being part of Russia’s ‘near abroad’. Moreover, Rittikh was also one of the first to term the Baltic provinces <\/span><span>pribaltiskii krai <\/span><span>‘border territory by the Baltic Sea’. This appropriated the Baltics as an integral, natural part of the Russian state…<\/span><br><br><span>Influential though Rittikh’s maps were for shaping perceptions of the Baltic provinces, his was not the only voice. By the late 19th century, Estonian and Latvian mapmakers, thanks to high literacy rates and growing opportunities for social advancement, began to produce maps that challenged this imperialist outlook. One such mapmaker was Matīss Siliņš, a schoolteacher and publisher of popular calendars, who began regularly creating Latvian-language maps in Riga in the 1890s for mass audiences. While Matīss did not go so far as to advocate Latvian independence, his maps consolidated the idea of a distinctive and vibrant Latvian territory within the Russian Empire. They signified a radical departure from seeing the Baltics only through the lens of Russian or German possessions or sphere of influence. These maps demonstrated how ethnographic cartography was not only a tool of imperial legitimation in the Baltic provinces but could also be a powerful means of expressing the political claims for Estonian and Latvian self-determination by the early 20th century.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>According to the last paragraph, Latvian-language maps by Matīss Siliņš and others signified all of the following EXCEPT:<\/span>", "options": ["<span><\/span>\t<span>They showed that ethnographic cartography could be an effective tool of imperial legitimation.<\/span>", "<span><\/span>\t<span>They challenged the dominant Russian and German outlook on the Baltics.<\/span>", "<span><\/span>\t<span>They were a means of expressing the political claims for Estonian and Latvian self-determination.<\/span>", "<span><\/span>\t<span>They consolidated the idea of a distinctive and vibrant Latvian territory within the Russian Empire.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span>The Russian empire used ethnographic cartography in the Baltic provinces as a tool of imperial legitimation. Hence option 1 is the exception.&nbsp;<\/span><span>Matiss<\/span><span>&nbsp;<\/span><span>Siliņš<\/span><span> and others used the same as a powerful means of expressing the political claims for Estonian and Latvian self-determination by the early 20th century. Through the creation of Latvian-language maps by&nbsp;<\/span><span>Matīss<\/span><span>&nbsp;<\/span><span>Siliņš<\/span><span> and others, it was demonstrated that cartography could be used as a means of consolidating the idea of a distinctive and vibrant Latvian territory within the Russian Empire and as a means of challenging the dominant Russian or German outlook on the Baltics.<\/span>\r<br /><span>Hence, [<\/span><span>1<\/span><span>].<\/span>", "topic": "Specific Detail Question"}, {"number": 9, "sourceId": "16854432482788", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>Why did wealth and power become distributed as they now are, rather than in some other way? […] We can easily push this question back one step. As of AD 1500, when Europe’s worldwide colonial expansion was just beginning, peoples on different continents already differed greatly in technology and political organization. Much of Europe, Asia, and North Africa was the site of metal-equipped states or empires, some of them on the threshold of industrialization. Two Native American peoples, the Aztecs and the Incas, ruled over empires with stone tools. Parts of sub-Saharan Africa were divided among small states or chiefdoms with iron tools. Most other peoples […] lived as farming tribes or even still as hunter-gatherer bands using stone tools.<\/span><br><br><span>…Empires with steel weapons were able to conquer or exterminate tribes with weapons of stone and wood…Once again, we can easily push this question back one step further, by drawing on written histories and archaeological discoveries. Until the end of the last Ice Age, around 11,000 BC, all peoples on all continents were still hunter-gatherers. Different rates of development on different continents, from 11,000 BC to AD 1500, were what led to the technological and political inequalities of AD 1500. While Aboriginal Australians and many Native Americans remained hunter-gatherers, most of Eurasia and much of the Americas and sub-Saharan Africa gradually developed agriculture, herding, metallurgy, and complex political organization…<\/span><br><br><span>[So] why did human development proceed at such different rates on different continents? Probably the commonest explanation involves implicitly or explicitly assuming biological differences among peoples… The displacement of [technologically primitive peoples] by colonists from industrialized <\/span>societies exemplified the survival of the fittest… Europeans became considered genetically more intelligent than Africans and Aboriginal Australians.<br><br><span>Today, segments of Western society publicly repudiate racism. Yet many Westerners continue to accept racist explanations privately or sub-consciously… The objection to such racist explanations is not just that they are loathsome, but also that they are wrong… An enormous effort by cognitive psychologists has gone into the search for differences in IQ between peoples of different geographic origins now living in the same country… However, the peoples compared differ greatly in their social environment and educational opportunities. First, even our cognitive abilities as adults are heavily influenced by the social environment that we experienced during childhood, making it hard to discern any influence of preexisting genetic differences. Second, tests of cognitive ability (like IQ test) tend to measure cultural learning and not pure innate intelligence, whatever that is…<\/span><br><br><span>[So], there is no generally accepted answer to the [original] question. On the one hand, the proximate explanations are clear: some peoples developed guns, germs, steel, and other factors conferring political and economic power before others did… On the other hand, the ultimate explanations – for example, why bronze tools appeared early in parts of Eurasia – remain unclear.<\/span><br><br><span>Our present lack of such ultimate explanations leaves a big intellectual gap… Much more serious, though, is the moral gap left unfilled. It is perfectly obvious to everyone, whether an overt racist or not, […] [that] history followed different courses for different peoples because of differences among peoples’ environments, not because of biological differences among peoples themselves…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following best expresses the main argument of the passage?<\/span>", "options": ["<span>Different rates of development among different peoples can be explained by biological differences among peoples themselves..<\/span>", "<span><\/span>\t<span>The differences in wealth and power distribution are primarily due to historical events and environmental factors.<\/span>", "<span><\/span>\t<span>Cognitive abilities as adults are heavily influenced by the social environment during childhood and IQ tests tend to measure only cultural learning.<\/span>", "<span><\/span>\t<span>Genetics explain the intellectual and moral gaps in understanding why human development proceeded at different rates on different continents.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>The passage traces the differences in technology and political organization among different peoples from the end of the last Ice Age to AD 1500, when Europe's colonial expansion was just beginning. It mentions that some peoples had already developed metal-equipped states or empires and were on the threshold of industrialization, while others were still living as hunter-gatherers or farming tribes using stone tools. The passage argues that the displacement of technologically primitive peoples by colonists from industrialized societies was due to the survival of the fittest, not because of biological differences among peoples. Ultimately, the passage asserts that history followed different courses for different peoples because of differences in their environments, not because of biological differences among peoples themselves. Hence option 2 best captures the main argument of the passage.<\/span>\r<br /><span>Option 1. Contrary to the answer and the main argument of the passage.<\/span>\r<br /><span>Option 3. This option is factually correct. But it is not the main argument in the passage. In stating that cognitive abilities as adults are heavily influenced by the social environment during childhood and that&nbsp;<\/span>IQ tests tend to measure cultural learning rather than pure innate intelligence, the author is trying to support his main argument.\r<br /><span>Option 4. The passage acknowledges the lack of an answer to the ultimate question of why human development proceeded at different rates on different continents and mentions the existence of both an intellectual gap and a moral gap in understanding the subject. The passage argues that the gaps cannot be filled by genetics.<\/span>\r<br /><span>Hence, [<\/span><span>2<\/span><span>].<\/span>", "topic": "Central Idea"}, {"number": 10, "sourceId": "16854432482799", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>Why did wealth and power become distributed as they now are, rather than in some other way? […] We can easily push this question back one step. As of AD 1500, when Europe’s worldwide colonial expansion was just beginning, peoples on different continents already differed greatly in technology and political organization. Much of Europe, Asia, and North Africa was the site of metal-equipped states or empires, some of them on the threshold of industrialization. Two Native American peoples, the Aztecs and the Incas, ruled over empires with stone tools. Parts of sub-Saharan Africa were divided among small states or chiefdoms with iron tools. Most other peoples […] lived as farming tribes or even still as hunter-gatherer bands using stone tools.<\/span><br><br><span>…Empires with steel weapons were able to conquer or exterminate tribes with weapons of stone and wood…Once again, we can easily push this question back one step further, by drawing on written histories and archaeological discoveries. Until the end of the last Ice Age, around 11,000 BC, all peoples on all continents were still hunter-gatherers. Different rates of development on different continents, from 11,000 BC to AD 1500, were what led to the technological and political inequalities of AD 1500. While Aboriginal Australians and many Native Americans remained hunter-gatherers, most of Eurasia and much of the Americas and sub-Saharan Africa gradually developed agriculture, herding, metallurgy, and complex political organization…<\/span><br><br><span>[So] why did human development proceed at such different rates on different continents? Probably the commonest explanation involves implicitly or explicitly assuming biological differences among peoples… The displacement of [technologically primitive peoples] by colonists from industrialized <\/span>societies exemplified the survival of the fittest… Europeans became considered genetically more intelligent than Africans and Aboriginal Australians.<br><br><span>Today, segments of Western society publicly repudiate racism. Yet many Westerners continue to accept racist explanations privately or sub-consciously… The objection to such racist explanations is not just that they are loathsome, but also that they are wrong… An enormous effort by cognitive psychologists has gone into the search for differences in IQ between peoples of different geographic origins now living in the same country… However, the peoples compared differ greatly in their social environment and educational opportunities. First, even our cognitive abilities as adults are heavily influenced by the social environment that we experienced during childhood, making it hard to discern any influence of preexisting genetic differences. Second, tests of cognitive ability (like IQ test) tend to measure cultural learning and not pure innate intelligence, whatever that is…<\/span><br><br><span>[So], there is no generally accepted answer to the [original] question. On the one hand, the proximate explanations are clear: some peoples developed guns, germs, steel, and other factors conferring political and economic power before others did… On the other hand, the ultimate explanations – for example, why bronze tools appeared early in parts of Eurasia – remain unclear.<\/span><br><br><span>Our present lack of such ultimate explanations leaves a big intellectual gap… Much more serious, though, is the moral gap left unfilled. It is perfectly obvious to everyone, whether an overt racist or not, […] [that] history followed different courses for different peoples because of differences among peoples’ environments, not because of biological differences among peoples themselves…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>According to the author, the failure of cognitive psychologists to find differences in IQ between peoples of different geographic origins …<\/span>", "options": ["<span><\/span>\t<span>Makes racist explanations of human differences unsustainable on scrutiny.<\/span>", "<span><\/span>\t<span>Makes objections to racist explanations loathsome and essentially wrong.<\/span>", "<span><\/span>\t<span>Suggests that studies that claim inborn differences suffer from technical flaws.<\/span>", "<span><\/span>\t<span>Confirms the fact that there is nothing called pure innate intelligence.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span>Option 1 . Correct. This means that the failure challenges the idea that differences in IQ can be attributed to innate differences based on geographic&nbsp;<\/span><span>origin, and<\/span><span> support the idea that such differences are more likely the result of environmental factors such as social and economic conditions.<\/span>\r<br /><span>Option 2. Incorrect. This option suggests that any objections to racist explanations of intelligence differences between different groups of people are considered morally wrong and without merit. This is contrary to the author’s stance. According to the passage, the racist explanations are&nbsp;<\/span><span>wrong<\/span>\r<br /><span>Option 3. Incorrect. “Technical flaws” of these studies (not suggested in the passage) is beyond the scope of the passage.<\/span>\r<br /><span>Option 4. Incorrect. This is also not the author’s stance or related to the failure of psychologists.<\/span>\r<br /><span>Hence, [<\/span><span>1<\/span><span>].<\/span>", "topic": "Inference"}, {"number": 11, "sourceId": "168544324827910", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>Why did wealth and power become distributed as they now are, rather than in some other way? […] We can easily push this question back one step. As of AD 1500, when Europe’s worldwide colonial expansion was just beginning, peoples on different continents already differed greatly in technology and political organization. Much of Europe, Asia, and North Africa was the site of metal-equipped states or empires, some of them on the threshold of industrialization. Two Native American peoples, the Aztecs and the Incas, ruled over empires with stone tools. Parts of sub-Saharan Africa were divided among small states or chiefdoms with iron tools. Most other peoples […] lived as farming tribes or even still as hunter-gatherer bands using stone tools.<\/span><br><br><span>…Empires with steel weapons were able to conquer or exterminate tribes with weapons of stone and wood…Once again, we can easily push this question back one step further, by drawing on written histories and archaeological discoveries. Until the end of the last Ice Age, around 11,000 BC, all peoples on all continents were still hunter-gatherers. Different rates of development on different continents, from 11,000 BC to AD 1500, were what led to the technological and political inequalities of AD 1500. While Aboriginal Australians and many Native Americans remained hunter-gatherers, most of Eurasia and much of the Americas and sub-Saharan Africa gradually developed agriculture, herding, metallurgy, and complex political organization…<\/span><br><br><span>[So] why did human development proceed at such different rates on different continents? Probably the commonest explanation involves implicitly or explicitly assuming biological differences among peoples… The displacement of [technologically primitive peoples] by colonists from industrialized <\/span>societies exemplified the survival of the fittest… Europeans became considered genetically more intelligent than Africans and Aboriginal Australians.<br><br><span>Today, segments of Western society publicly repudiate racism. Yet many Westerners continue to accept racist explanations privately or sub-consciously… The objection to such racist explanations is not just that they are loathsome, but also that they are wrong… An enormous effort by cognitive psychologists has gone into the search for differences in IQ between peoples of different geographic origins now living in the same country… However, the peoples compared differ greatly in their social environment and educational opportunities. First, even our cognitive abilities as adults are heavily influenced by the social environment that we experienced during childhood, making it hard to discern any influence of preexisting genetic differences. Second, tests of cognitive ability (like IQ test) tend to measure cultural learning and not pure innate intelligence, whatever that is…<\/span><br><br><span>[So], there is no generally accepted answer to the [original] question. On the one hand, the proximate explanations are clear: some peoples developed guns, germs, steel, and other factors conferring political and economic power before others did… On the other hand, the ultimate explanations – for example, why bronze tools appeared early in parts of Eurasia – remain unclear.<\/span><br><br><span>Our present lack of such ultimate explanations leaves a big intellectual gap… Much more serious, though, is the moral gap left unfilled. It is perfectly obvious to everyone, whether an overt racist or not, […] [that] history followed different courses for different peoples because of differences among peoples’ environments, not because of biological differences among peoples themselves…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>It can be inferred from the passage that the lack of an ultimate explanation for the differences in wealth and power distribution…<\/span>", "options": ["<span><\/span>\t<span>Forms the basis of racism<\/span>", "<span><\/span>\t<span>Repudiates racism<\/span>", "<span><\/span>\t<span>Forces a rejection of proximate explanations<\/span>", "<span><\/span>\t<span>Undermines the concept of pure intelligence.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span>According to the passage, the lack of an ultimate explanation for the differences in wealth and power distribution has led some people to assume racist explanations, such as the assumption of biological differences among peoples, which is implicitly or explicitly based on the idea of the survival of the fittest. The passage argues that such racist explanations are both loathsome and wrong. However, it is the lack of such ultimate explanation that forms the basis of racist thinking. Hence 1.<\/span>\r<br /><span>Option 2. Is contrary to the answer choice.<\/span>\r<br /><span>Option 3. The lack of an explanation encourages proximate explanations.<\/span>\r<br /><span>Option 4. The concept of pure intelligence is not affected by the lack of explanation. The author dismisses this concept as ‘what that&nbsp;<\/span><span>is’<\/span><span>!<\/span>\r<br /><span>Hence, [<\/span><span>1<\/span><span>].<\/span>", "topic": "Inference"}, {"number": 12, "sourceId": "168544324827911", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>Why did wealth and power become distributed as they now are, rather than in some other way? […] We can easily push this question back one step. As of AD 1500, when Europe’s worldwide colonial expansion was just beginning, peoples on different continents already differed greatly in technology and political organization. Much of Europe, Asia, and North Africa was the site of metal-equipped states or empires, some of them on the threshold of industrialization. Two Native American peoples, the Aztecs and the Incas, ruled over empires with stone tools. Parts of sub-Saharan Africa were divided among small states or chiefdoms with iron tools. Most other peoples […] lived as farming tribes or even still as hunter-gatherer bands using stone tools.<\/span><br><br><span>…Empires with steel weapons were able to conquer or exterminate tribes with weapons of stone and wood…Once again, we can easily push this question back one step further, by drawing on written histories and archaeological discoveries. Until the end of the last Ice Age, around 11,000 BC, all peoples on all continents were still hunter-gatherers. Different rates of development on different continents, from 11,000 BC to AD 1500, were what led to the technological and political inequalities of AD 1500. While Aboriginal Australians and many Native Americans remained hunter-gatherers, most of Eurasia and much of the Americas and sub-Saharan Africa gradually developed agriculture, herding, metallurgy, and complex political organization…<\/span><br><br><span>[So] why did human development proceed at such different rates on different continents? Probably the commonest explanation involves implicitly or explicitly assuming biological differences among peoples… The displacement of [technologically primitive peoples] by colonists from industrialized <\/span>societies exemplified the survival of the fittest… Europeans became considered genetically more intelligent than Africans and Aboriginal Australians.<br><br><span>Today, segments of Western society publicly repudiate racism. Yet many Westerners continue to accept racist explanations privately or sub-consciously… The objection to such racist explanations is not just that they are loathsome, but also that they are wrong… An enormous effort by cognitive psychologists has gone into the search for differences in IQ between peoples of different geographic origins now living in the same country… However, the peoples compared differ greatly in their social environment and educational opportunities. First, even our cognitive abilities as adults are heavily influenced by the social environment that we experienced during childhood, making it hard to discern any influence of preexisting genetic differences. Second, tests of cognitive ability (like IQ test) tend to measure cultural learning and not pure innate intelligence, whatever that is…<\/span><br><br><span>[So], there is no generally accepted answer to the [original] question. On the one hand, the proximate explanations are clear: some peoples developed guns, germs, steel, and other factors conferring political and economic power before others did… On the other hand, the ultimate explanations – for example, why bronze tools appeared early in parts of Eurasia – remain unclear.<\/span><br><br><span>Our present lack of such ultimate explanations leaves a big intellectual gap… Much more serious, though, is the moral gap left unfilled. It is perfectly obvious to everyone, whether an overt racist or not, […] [that] history followed different courses for different peoples because of differences among peoples’ environments, not because of biological differences among peoples themselves…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span>All of the following, if true, would seriously undermine the argument in the last paragraph EXCEPT:<\/span>", "options": ["<span>The existence of human differences in intelligence parallels human differences in technology.<\/span>", "<span>History's pattern reflects innate differences among people themselves in different continents.<\/span>", "<span>The conquered peoples continue to be underclass even after technological advancement.<\/span>", "<span>Class differences can be attributed to social disadvantages and limited opportunities.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>(EXCEPT question): The statement that does NOT seriously undermine the argument in the last paragraph is option 4. This statement aligns with the author's argument that the differences in wealth and power distribution are largely a result of social and environmental factors, rather than innate differences among peoples. The author argues that the lack of an ultimate explanation for these differences has led to racist explanations, and option 4 supports this view by emphasizing the impact of social disadvantage and limited opportunity on class differences.<\/span>\r<br /><span>Options 1, 2, and 3, on the other hand, would seriously undermine the author's argument. Option 1 suggests that human differences in intelligence are responsible for differences in technology, which is contrary to the author's argument that the differences in wealth and power distribution are largely a result of social and environmental factors. Option 2 asserts that history's pattern reflects innate differences among peoples, which again contradicts the author's argument. Option 3 suggests that the conquered peoples continue to be underclass even after technological advancement, which would call into question the idea that social and environmental factors are primarily responsible for differences in wealth and power distribution.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Application Question"}, {"number": 13, "sourceId": "168544324827912", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>DNA, the cell’s instruction manual and evolutionary memory, is fiendishly complex, but it has only four distinct components, called nucleotides. The complexity—and the information—in DNA come from the linear arrangement of these nucleotides along the molecule. Like the amino acids in proteins, nucleotides in DNA form the alphabet in which DNA’s information is encoded. Nucleotides, in turn, can be broken down into even simpler components: a sugar, a phosphate ion, and a simple organic molecule called a base. The bases can be synthesized from simple compounds likely to have been present when the Earth was young. Moreover, sugars can be generated from simple precursors like formaldehyde, also thought to have been present on the ancient Earth. And phosphate ions would have been supplied by the chemical weathering of volcanic rocks. Combining these components to form nucleotides challenged scientists for decades, but in 2009, British chemist John Sutherland and his colleagues generated two types of nucleotides under plausible early Earth conditions.<\/span><br><span>Finally, there are lipids, molecular constituents of the membranes that bound all cells. Like proteins and DNA, lipids are made of simpler units, in this case long, chain-like molecules called fatty acids, again likely generated chemically on the early Earth. Remarkably, if you splash or evaporate water that contains dispersed fatty acids, they spontaneously come together to form spheroidal microstructures that have a lot in common with the membranes that bound bacteria.<\/span><br><br><span>So, the principal building blocks of life, the molecules from which our cells are built, can form from natural processes under conditions plausibly found locally if not ubiquitously in our planet’s infancy. It is important to underscore that this conclusion is not merely theoretical, or, for that matter, experimental. We know that reactions of the type just outlined did occur billions of years ago; their record is preserved in meteorites, those remarkable relics of our solar system in statu nascendi… The chemistry from which life emerged may be widespread in the universe.<\/span><br><br><span>So far, so good, but from here things get trickier. We know that amino acids can combine to form short linear molecules called peptides. And nucleotides can do much the same. Function and memory seem to be imminent in such molecules, but in living organisms, DNA provides the molecular instructions for protein synthesis, and proteins are needed to replicate DNA. How do we escape the chicken-and-egg dilemma of which came first?<\/span><br><br><span>The answer may be that neither DNA nor proteins were present in the first evolving protoorganisms. Since 1970, the known diversity of RNA molecules has expanded amazingly, as has their documented range of function. RNA stores information, like its cousin DNA, but some RNAs act like enzymes, doing the cell’s molecular work in a way once thought to be the exclusive domain of proteins. Also, small <\/span>RNA molecules are now known to play a role in regulating gene expression within cells… Finally, recent experiments have shown that RNA molecules synthesized in the laboratory can evolve, shaped by selection to perform specific tasks. The discovery that RNA molecules can store information, function as enzymes, and evolve leads to a big thought: perhaps the earliest entities that reproduced and evolved were made of RNA, not DNA and proteins.", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following best expresses the main argument of the passage?<\/span>", "options": ["<span>The building blocks of life, including DNA which is the cell’s instruction manual, were formed through natural processes that occurred under conditions that were present on the early Earth<\/span><span>.<\/span><span><\/span>", "<span><\/span>\t<span>Evidence from meteorites and laboratory experiments on the basic components of DNA suggest that the process of life's origin on Earth may be a widespread occurrence in the universe.<\/span>", "<span><\/span>\t<span>As DNA provides instructions for protein synthesis and proteins are required for replicating DNA, the origin of initial evolving protoorganisms on Earth leaves a conundrum about which came first.<\/span>", "<span><\/span>\t<span>The earliest life forms on Earth may not have been made of DNA and proteins, but of RNA molecules which had the ability to store information, work as enzymes, and change over time.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>Main Idea: The passage is discussing the building blocks of life and the origin of life on Earth. It explains that DNA, which is the cell's instruction manual, has only four components called nucleotides that are formed from simple components like sugars, phosphate ions, and bases. It also mentions lipids, which are molecular constituents of cell membranes and are made of fatty acids. The passage goes on to discuss the challenge of combining these components to form the building blocks&nbsp;<\/span>of life and explains that reactions of this type did occur billions of years ago as evidenced by meteorites. The author then introduces the idea that the first evolving protoorganisms may not have consisted of DNA and proteins, but RNA molecules, which can store information, function as enzymes, and evolve.\r<br /><span>Option 1. Nothing about the RNA – does not encapsulate the main idea or argument .<\/span>\r<br /><span>Option 2. Major points missing. Presents only one secondary idea.<\/span>\r<br /><span>Option 3. Nothing about RNA – the last part of the paragraph.<\/span>\r<br /><span>Option 4. It best expresses the main argument of the passage.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Central Idea"}, {"number": 14, "sourceId": "168544324828013", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>DNA, the cell’s instruction manual and evolutionary memory, is fiendishly complex, but it has only four distinct components, called nucleotides. The complexity—and the information—in DNA come from the linear arrangement of these nucleotides along the molecule. Like the amino acids in proteins, nucleotides in DNA form the alphabet in which DNA’s information is encoded. Nucleotides, in turn, can be broken down into even simpler components: a sugar, a phosphate ion, and a simple organic molecule called a base. The bases can be synthesized from simple compounds likely to have been present when the Earth was young. Moreover, sugars can be generated from simple precursors like formaldehyde, also thought to have been present on the ancient Earth. And phosphate ions would have been supplied by the chemical weathering of volcanic rocks. Combining these components to form nucleotides challenged scientists for decades, but in 2009, British chemist John Sutherland and his colleagues generated two types of nucleotides under plausible early Earth conditions.<\/span><br><span>Finally, there are lipids, molecular constituents of the membranes that bound all cells. Like proteins and DNA, lipids are made of simpler units, in this case long, chain-like molecules called fatty acids, again likely generated chemically on the early Earth. Remarkably, if you splash or evaporate water that contains dispersed fatty acids, they spontaneously come together to form spheroidal microstructures that have a lot in common with the membranes that bound bacteria.<\/span><br><br><span>So, the principal building blocks of life, the molecules from which our cells are built, can form from natural processes under conditions plausibly found locally if not ubiquitously in our planet’s infancy. It is important to underscore that this conclusion is not merely theoretical, or, for that matter, experimental. We know that reactions of the type just outlined did occur billions of years ago; their record is preserved in meteorites, those remarkable relics of our solar system in statu nascendi… The chemistry from which life emerged may be widespread in the universe.<\/span><br><br><span>So far, so good, but from here things get trickier. We know that amino acids can combine to form short linear molecules called peptides. And nucleotides can do much the same. Function and memory seem to be imminent in such molecules, but in living organisms, DNA provides the molecular instructions for protein synthesis, and proteins are needed to replicate DNA. How do we escape the chicken-and-egg dilemma of which came first?<\/span><br><br><span>The answer may be that neither DNA nor proteins were present in the first evolving protoorganisms. Since 1970, the known diversity of RNA molecules has expanded amazingly, as has their documented range of function. RNA stores information, like its cousin DNA, but some RNAs act like enzymes, doing the cell’s molecular work in a way once thought to be the exclusive domain of proteins. Also, small <\/span>RNA molecules are now known to play a role in regulating gene expression within cells… Finally, recent experiments have shown that RNA molecules synthesized in the laboratory can evolve, shaped by selection to perform specific tasks. The discovery that RNA molecules can store information, function as enzymes, and evolve leads to a big thought: perhaps the earliest entities that reproduced and evolved were made of RNA, not DNA and proteins.", "passageTitle": "Reading Comprehension Passage", "question": "<span>Which one of the following sets of phrases best reflects the key ideas in the passage?<\/span>", "options": ["<span>Nucleotides, sugars, phosphate ions; Early Earth conditions; Chicken-and-egg dilemma; Information storage, evolution.<\/span>", "<span>DNA Composition; Life's Origin on Earth; The Chicken-and-Egg Dilemma; The Role of RNA in Evolution.<\/span>", "<span>Building blocks of life; Formation of life components; DNA and Protein synthesis; RNA as an alternative.<\/span>", "<span>DNA, nucleotides; Formation of Life's Building Blocks; The Dilemma of DNA and Proteins; The Role of RNA in Early Evolution.<\/span>\n<span> <\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>The key ideas in the passage as they are structured can be organised as:<\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>Building blocks of life: nucleotides, sugars, phosphate ions, bases, lipids, fatty acids<\/span><span>.<\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>Formation of life components: chemical processes, early Earth conditions, meteorites<\/span><span>.<\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>DNA and protein synthesis: information storage, molecular instructions, chicken-and-egg&nbsp;<\/span>\t<span>dilemma<\/span><span>.<\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>RNA as an alternative: information storage, enzyme functions, regulating gene&nbsp;<\/span>\t<span>expression, evolution.<\/span>\r<br /><span>The options are confusing because all of them combine the above ideas in parts. Option 4 comes closest to the combination in the answer choice. However, the first group - DNA, nucleotides – misses the other elements in the building blocks of life. Also, DNA and Protein synthesis is better than The Dilemma of DNA and Proteins, because the idea of protein synthesis is crucial. RNA as an alternative is better than the role of RNA – though both are good.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Logical Structure"}, {"number": 15, "sourceId": "168544324828014", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>DNA, the cell’s instruction manual and evolutionary memory, is fiendishly complex, but it has only four distinct components, called nucleotides. The complexity—and the information—in DNA come from the linear arrangement of these nucleotides along the molecule. Like the amino acids in proteins, nucleotides in DNA form the alphabet in which DNA’s information is encoded. Nucleotides, in turn, can be broken down into even simpler components: a sugar, a phosphate ion, and a simple organic molecule called a base. The bases can be synthesized from simple compounds likely to have been present when the Earth was young. Moreover, sugars can be generated from simple precursors like formaldehyde, also thought to have been present on the ancient Earth. And phosphate ions would have been supplied by the chemical weathering of volcanic rocks. Combining these components to form nucleotides challenged scientists for decades, but in 2009, British chemist John Sutherland and his colleagues generated two types of nucleotides under plausible early Earth conditions.<\/span><br><span>Finally, there are lipids, molecular constituents of the membranes that bound all cells. Like proteins and DNA, lipids are made of simpler units, in this case long, chain-like molecules called fatty acids, again likely generated chemically on the early Earth. Remarkably, if you splash or evaporate water that contains dispersed fatty acids, they spontaneously come together to form spheroidal microstructures that have a lot in common with the membranes that bound bacteria.<\/span><br><br><span>So, the principal building blocks of life, the molecules from which our cells are built, can form from natural processes under conditions plausibly found locally if not ubiquitously in our planet’s infancy. It is important to underscore that this conclusion is not merely theoretical, or, for that matter, experimental. We know that reactions of the type just outlined did occur billions of years ago; their record is preserved in meteorites, those remarkable relics of our solar system in statu nascendi… The chemistry from which life emerged may be widespread in the universe.<\/span><br><br><span>So far, so good, but from here things get trickier. We know that amino acids can combine to form short linear molecules called peptides. And nucleotides can do much the same. Function and memory seem to be imminent in such molecules, but in living organisms, DNA provides the molecular instructions for protein synthesis, and proteins are needed to replicate DNA. How do we escape the chicken-and-egg dilemma of which came first?<\/span><br><br><span>The answer may be that neither DNA nor proteins were present in the first evolving protoorganisms. Since 1970, the known diversity of RNA molecules has expanded amazingly, as has their documented range of function. RNA stores information, like its cousin DNA, but some RNAs act like enzymes, doing the cell’s molecular work in a way once thought to be the exclusive domain of proteins. Also, small <\/span>RNA molecules are now known to play a role in regulating gene expression within cells… Finally, recent experiments have shown that RNA molecules synthesized in the laboratory can evolve, shaped by selection to perform specific tasks. The discovery that RNA molecules can store information, function as enzymes, and evolve leads to a big thought: perhaps the earliest entities that reproduced and evolved were made of RNA, not DNA and proteins.", "passageTitle": "Reading Comprehension Passage", "question": "<span>The passage supports which of the following inferences?<\/span>", "options": ["<span>The first evolving protoorganisms consisted of DNA and proteins.<\/span>", "<span>RNA molecules on the early Earth were self-replicating.<\/span>", "<span>Solution to the chicken-and-egg dilemma would explain life’s origins.<\/span>", "<span>Life on Earth arose from non-living matter through chemical reactions.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>Option 1. This inference is not directly supported by the passage, which only mentions the chicken-and-egg dilemma between DNA and proteins and does not state that the first evolving protoorganisms consisted of these molecules.<\/span>\r<br /><span>Option 2. This inference is not directly supported by the passage, which does not mention the self-replication of RNA molecules on the early Earth, though it mentions laboratory experiments.<\/span>\r<br /><span>Option 3. This inference is not directly supported by the passage, which only mentions the chicken-and-egg dilemma between DNA and proteins and does not state that solving this dilemma would fully explain the origins of life on Earth. It would solve which came first – DNA or proteins.<\/span>\r<br /><span>Option 4. The passage discusses only primordial geologic chemistry and how evolving protoorganisms arose from this chemistry.<\/span>\r<br /><span>Hence, [<\/span><span>4]<\/span><span>.<\/span>", "topic": "Inference"}, {"number": 16, "sourceId": "168544324828015", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>DNA, the cell’s instruction manual and evolutionary memory, is fiendishly complex, but it has only four distinct components, called nucleotides. The complexity—and the information—in DNA come from the linear arrangement of these nucleotides along the molecule. Like the amino acids in proteins, nucleotides in DNA form the alphabet in which DNA’s information is encoded. Nucleotides, in turn, can be broken down into even simpler components: a sugar, a phosphate ion, and a simple organic molecule called a base. The bases can be synthesized from simple compounds likely to have been present when the Earth was young. Moreover, sugars can be generated from simple precursors like formaldehyde, also thought to have been present on the ancient Earth. And phosphate ions would have been supplied by the chemical weathering of volcanic rocks. Combining these components to form nucleotides challenged scientists for decades, but in 2009, British chemist John Sutherland and his colleagues generated two types of nucleotides under plausible early Earth conditions.<\/span><br><span>Finally, there are lipids, molecular constituents of the membranes that bound all cells. Like proteins and DNA, lipids are made of simpler units, in this case long, chain-like molecules called fatty acids, again likely generated chemically on the early Earth. Remarkably, if you splash or evaporate water that contains dispersed fatty acids, they spontaneously come together to form spheroidal microstructures that have a lot in common with the membranes that bound bacteria.<\/span><br><br><span>So, the principal building blocks of life, the molecules from which our cells are built, can form from natural processes under conditions plausibly found locally if not ubiquitously in our planet’s infancy. It is important to underscore that this conclusion is not merely theoretical, or, for that matter, experimental. We know that reactions of the type just outlined did occur billions of years ago; their record is preserved in meteorites, those remarkable relics of our solar system in statu nascendi… The chemistry from which life emerged may be widespread in the universe.<\/span><br><br><span>So far, so good, but from here things get trickier. We know that amino acids can combine to form short linear molecules called peptides. And nucleotides can do much the same. Function and memory seem to be imminent in such molecules, but in living organisms, DNA provides the molecular instructions for protein synthesis, and proteins are needed to replicate DNA. How do we escape the chicken-and-egg dilemma of which came first?<\/span><br><br><span>The answer may be that neither DNA nor proteins were present in the first evolving protoorganisms. Since 1970, the known diversity of RNA molecules has expanded amazingly, as has their documented range of function. RNA stores information, like its cousin DNA, but some RNAs act like enzymes, doing the cell’s molecular work in a way once thought to be the exclusive domain of proteins. Also, small <\/span>RNA molecules are now known to play a role in regulating gene expression within cells… Finally, recent experiments have shown that RNA molecules synthesized in the laboratory can evolve, shaped by selection to perform specific tasks. The discovery that RNA molecules can store information, function as enzymes, and evolve leads to a big thought: perhaps the earliest entities that reproduced and evolved were made of RNA, not DNA and proteins.", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>RNA and DNA are similar in all these aspects EXCEPT:<\/span>", "options": ["<span>Information storage<\/span>", "<span><\/span>\t<span>Protein synthesis<\/span>", "<span><\/span>\t<span>Enzyme activity<\/span>", "<span><\/span>\t<span>Gene regulation<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>Enzyme activity was “once thought to be the exclusive domain of proteins.” – that means nothing else, including DNA, does enzyme activity. Last paragraph gives all the functions.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Specific Detail Question"}, {"number": 17, "sourceId": "168544324828016", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<span><b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><\/span><br><br><span>1.<\/span>\t<span>The use of technology and late nights are contributing factors, but school start times also play a major role.<\/span><br>2.\t<span>This has been endorsed by the Centers for Disease Control and Prevention and several medical societies, and some school districts and the state of California have already made the changes.<\/span><br><span>3.<\/span>\t<span>The lack of sleep among teenagers in the U.S is a growing concern.<\/span><br><span>4.<\/span>\t<span>Pushing back the start time of middle and high school has been proven to improve the physical, mental and emotional health of students, as well as their academic performance.<\/span><br><br><span>", "options": [], "answer": "3142", "answerLabel": "3142", "solution": "<\/span>\t\r<br /><span>Sentence 1. ‘Contributing factors’ links to some other sentence before it.<\/span>\r<br /><span>Sentence 2.  ‘This has been endorsed by …’ links it to some other sentence, but not to sentence 1.<\/span>\r<br /><span>Sentence 3. Standalone sentence. Links well to 1 as 3-1.<\/span>\r<br /><span>Sentence 4. ‘…California (has) already made the changes…’ comes after 1. Sentence 4 is a solution to the problem stated in 1 (school start time). So, 14 should be a pair. The ‘this has been endorsed’ in Sentence 2 refers to ‘pushing back school timings’ in Sentence 4. So, 42 becomes the last pair.  3142 makes a good sequence.<\/span>\r<br />Therefore, the required answer is 3142.", "topic": "Jumbled Paragraphs"}, {"number": 18, "sourceId": "168544324828617", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<span><b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><\/span><br><br>1.\t<span>It is critically important to keep an open mind about the trajectory of inflation, including by avoiding an over-simplified transitory narrative that risks obfuscating the real issues.<\/span><br><span>2.<\/span>\t<span>The concept assumes away the need to adjust behaviors, which is why it could exacerbate an already serious problem and make it harder to solve.<\/span><br><span>3.<\/span>\t<span>\"Transitory inflation\" is making a comeback as the COVID-related supply shocks dissipate.<\/span><br><span>4.<\/span>\t<span>The US Federal Reserve rushed to characterize higher inflation as transitory in 2021 and doubled down on this approach even after the data went against it.<\/span><br><span><b> <\/b><\/span><br><span>", "options": [], "answer": "3241", "answerLabel": "3241", "solution": "<\/span>\t<span>Sentence 1. General sentence. Unlikely starter because ‘by avoiding an oversimplified transitory narrative’ has reference to some kind of narrative.<\/span>\r<br /><span>Sentence 2. ‘The concept assumes…’ comes after a reference is made to a concept.<\/span>\r<br /><span>Sentence 3. Good for the start, with the concept in inverted commas. 3-2 is a pair.<\/span>\r<br /><span>Sentence 4. Comes after 4 – as 324- ‘it could exacerbate an already serious problem’ in 2 is exemplified by what US did in 2021.<\/span>\r<br /><span>324 being continuous 1&nbsp;<\/span><span>acts<\/span><span> as a good conclusion.<\/span>\r<br /><span>Therefore, the required answer is 3241.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 19, "sourceId": "168544324828718", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<span><b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><\/span><br><br>1.\t<span>There are different opinions on whether it will take just people switching to lower-carbon technologies or a more fundamental change in society to solve the problem.<\/span><br><span>2.<\/span>\t<span>Recognizing the dichotomy can help in understanding and improving the reception of clean-technology developments.<\/span><br><span>3.<\/span>\t<span>These questions have become highly divisive in today's political culture, with one side relying on markets and technology and the other on public policy.<\/span><br><span>4.<\/span>\t<span>The climate-policy debate often raises the question of whether we can rely on simple and cheap technofixes to address climate change.<\/span><br><br><span>", "options": [], "answer": "4132", "answerLabel": "4132", "solution": "<\/span>\t\r<br /><span>Sentence 1. Standalone sentence.<\/span>\r<br /><span>Sentence 2. If “The dichotomy …’ refers to “just people switching to lower-carbon technologies or a more fundamental change in society”, 1-2 is a possibility.<\/span>\r<br /><span>Sentence 3. “These questions…” refers to ‘whether it will take just people…’ etc. in 1. Hence 1-3 has to a be a pair.<\/span>\r<br /><span>Sentence 4. Standalone sentence. Good for the starter.<\/span>\r<br /><span>1-3 being  a pair and 2 referring to the two sides in 3 as the dichotomy 132 is a sequence. The question then is whether 4 ends the paragraph or beings the paragraph. 4-1 makes good sense too.<\/span>\r<br /><span>Therefore, the required answer is 4132.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 20, "sourceId": "168544324828919", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<span><b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><\/span><br><br><span><b>Sentence:<\/b><\/span><span> <\/span><br><span>Many of these risks are associated with the inhalation of tobacco smoke through the mouth.<\/span><br><br><span><b>Paragraph:<\/b><\/span><span> <\/span><br><span>_____1____.  In most countries, cardboard cigarette packages display imagery or text that warns smokers of the increased risks of heart attacks, cancer and pregnancy complications that accompany lighting up. _____2____.  But what is less often spotlighted is the effect smoking can have on the surface of the eyes. Tobacco smoking has been tied to age-related macular degeneration, glaucoma and cataracts—some of the leading causes of blindness and severe vision loss worldwide. _____3____. But these afflictions occur in inner regions of the eye: the retina, optic nerve and lens, respectively. Now researchers have discovered how cigarette smoke and aerosols from heated tobacco devices—which bake tobacco leaves rather than burning them or vaporizing liquid tobacco products—also kill cells in the eye’s most exposed layer: the cornea. _____4____.<\/span>", "options": ["<span>Option 1<\/span>", "<span><\/span>\t<span>Option 2<\/span>", "<span><\/span><span> <\/span>\t<span>Option 3<\/span>", "<span><\/span><span> <\/span>\t<span>Option 4<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>Blank 1 need not be considered because of ‘many of these risks’ in the key sentence. The phrase refers to the risks listed in the sentence before blank 2, and the contrasting sentence after blank 2 makes it the ideal place for the key sentence. In place of 3 and 4 the key sentence would be an interruption.&nbsp;<\/span><span>Hence, [2].<\/span>", "topic": "Paragraph Completion"}, {"number": 21, "sourceId": "168544324829020", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span><b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><\/span><br><br><span><b>Sentence:<\/b><\/span><span> <\/span><br><span>That’s the wrong approach.<\/span><br><br><span><b>Paragraph:<\/b><\/span><span> <\/span><br><span>To read the news, the sanctity of everything from college application essays to graduate school tests to medical licensing exams is imperilled by easy access to advanced artificial intelligence like ChatGPT, <\/span>the AI chatbot that can produce remarkably clear, long-form answers to complex questions. _____1____. Educators in particular worry about students turning to ChatGPT to help them complete assignments. _____2____. One proposed solution is to roll back the clock to the 20th century, making students write exam essays using pen and paper, without the use of any Internet-connected electronic devices. _____3____. The University of California, Los Angeles, where I teach, is considering making it an honor code violation to use ChatGPT for taking an exam or writing a paper. _____4____. This semester, I am telling the students in my class at the UCLA School of Law that they are free to use ChatGPT in their writing assignments.", "options": ["<span>Option 1<\/span>", "<span><\/span>\t<span>Option 2<\/span>", "<span><\/span>\t<span>Option 3<\/span>", "<span><\/span>\t<span>Option 4<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>The key sentence is so general and the paragraph so structured that the sentence seems to fit in almost all blanks. However, the sentence after these blanks&nbsp;<\/span><span>make<\/span><span> the key sentence unsuitable to maintain continuity. Blank 4 is the appropriate place as the sentences before and after blank 4  would be bridged by the key sentence.<\/span>\r<br /><span>Hence, [<\/span><span>4<\/span><span>].<\/span>", "topic": "Paragraph Completion"}, {"number": 22, "sourceId": "168544324829221", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span><b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><\/span><br><br><span>Not all distractions are bad. As most of us know from experience, if we concentrate too intensively on a tough problem, we can get stuck in a mental rut. But if we let the problem sit unattended for a time—if we “sleep on it”—we often return to it with a fresh perspective and a burst of creativity. Research by Dijksterhuis, a Dutch psychologist, indicates that such breaks in our attention give our unconscious mind time to grapple with a problem, bringing to bear information and cognitive processes unavailable to conscious deliberation. But Dijksterhuis’s work also shows that our unconscious thought processes don’t engage with a problem until we’ve clearly and consciously defined the problem. If we don’t have a particular intellectual goal in mind, Dijksterhuis writes, “unconscious thought does not occur.”<\/span>", "options": ["<span>Research indicates that breaks in attention while solving tough problems lead to fresh perspectives and creativity, but the unconscious mind needs a clear problem to engage with to be effective.<\/span>", "<span><\/span>\t<span>Taking attention off a tough problem allows the unconscious mind to act on it and bring fresh perspectives and increase creativity provided that the problem is clearly defined in the conscious mind.<\/span>", "<span><\/span>\t<span>Research and experience dictate that it is important that a problem is clearly and consciously defined before taking a break if the unconscious mind is to engage with it and bring in new perspectives and increased creativity.<\/span>", "<span><\/span>\t<span>Taking breaks and allowing for distractions can lead to fresh perspectives and creativity, but it only occurs when the conscious mind has clearly defined the problem and the particular intellectual goal.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>Option 1. Almost correct. The first part of the passage is about experience. Research is quoted to back it up. 1 also lacks the point about allowing the unconscious ‘to engage with the problem’ for perspectives and creativity to arise. So, it is close call between options 1 and 2. 2 is more straightforward.<\/span>\r<br /><span>Option 2. The experience and research (without mentioning&nbsp;<\/span><span>either)<\/span><span> are summarized to capture the essence.<\/span>\r<br /><span>Option 3. “Research and experience dictate that it is important…” is a distortion- they inform and not dictate.<\/span>\r<br /><span>Option 4. It does not say the unconscious is operating.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Summary"}, {"number": 23, "sourceId": "168544324829322", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<p><span><strong>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/strong><\/span><br /><br /><span>The modern man seemingly cannot any longer believe that human group cohesion is vital for continued existence and prospering &ndash; we see ourselves as in essence atomistic, autonomous individuals and not as integral members of a group. All this can be seen in the often-remarked loss of social cohesion at the level of neighbourhoods, clubs, hobbies, churches, schools, colleges, crafts and professions &ndash; what is termed the decline in Civil Society &ndash; all these groups have been weakened, <\/span>subverted or even destroyed by The State to which most people now look to provide their wants. Since civic involvement has been shown to be positively associated with intelligence, we should not be surprised to observe its decline.<\/p>", "options": ["<span>Human group cohesion essential for the continuation and prosperity of society is currently in decline due to a focus on individual autonomy and a weakening of Civil Society leading to a reliance on The State to meet needs.<\/span>", "<span><\/span>\t<span>The decline of social cohesion of neighbourhoods, clubs, hobbies, churches, schools, colleges, crafts, and professions has been caused by the subversion of Civil Society by The State, leading to a perception of individuals as autonomous rather than integral members of a group.<\/span>", "<span><\/span>\t<span>Modern societies have lost the sense of group cohesion and turned towards The State to fulfill their needs, resulting in a decline in social groups and a decrease in civic involvement and intelligence.<\/span>", "<span><\/span>\t<span>The perception of individuals as autonomous rather than integral members of a group has led to a decline in human group cohesion and the weakening of Civil Society, causing a reliance on The State to meet needs.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<p><span><strong>Points:<\/strong><br /><span>&middot;<\/span>&nbsp;Decline in human group cohesion.<br /><span>&middot;<\/span>&nbsp;Perception of individuals as autonomous rather integral units of a group.<br /><span>&middot;<\/span>&nbsp;The weakening of Civil Society, and the reliance on The State to meet needs.<br /><span>&middot;<\/span>&nbsp;Positive association between civic involvement and intelligence.<\/span><\/p>\n<p><span>Option 1. Incorrect. It is too broad and not as specific as option 4. It does not directly address the causes of the decline or the specific consequences of it, such as the weakening of Civil Society and the reliance on The State to meet needs. Also, option 1 includes the phrase \"continuation and prosperity of society,\" which are too broad and abstract for a summary.<\/span> <br /><span>Option 2. Incorrect. Option 2 is less comprehensive. While it mentions the decline of social cohesion at the level of various social groups and attributes this decline to the subversion of Civil Society by The State, it does not directly address the perception of individuals as autonomous or the consequences of this decline, such as the reliance on The State to meet needs.<\/span> <br /><span>Option 3. Incorrect. While it mentions the loss of group cohesion and the reliance on The State to&nbsp;<\/span><span>fulfill<\/span><span> needs in modern societies, it does not directly address the causes of this shift or the specific consequences of it, such as the decline in social groups and the decrease in civic involvement and intelligence.<\/span> <br /><span>Option 4. Correct. It is a clearer and more specific summary of the given paragraph by addressing&nbsp;<\/span><span>all of<\/span><span> the main points discussed in the paragraph, including the decline in human group cohesion, the perception of&nbsp;<\/span><span>individual<\/span><span>s as autonomous, the weakening of Civil Society, and the reliance on The State to meet needs.<\/span> <br /><span>Hence, [4].<\/span><\/p>", "topic": "Summary"}, {"number": 24, "sourceId": "168544324829523", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span><b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><\/span><br><br><span>The offloading of memory to external data banks doesn’t just threaten the depth and distinctiveness of the self. It threatens the depth and distinctiveness of the culture we all share. The replacement of a complex inner density with a new kind of self—evolving under the pressure of instantly available technology drains us of our inner repertory of dense cultural inheritance. We risk turning into “pancake people”—spread wide and thin as we connect with that vast network of information accessed by the mere touch of a button. Culture is more than the aggregate of what Google describes as “the world’s information.” It’s more than what can be reduced to binary code and uploaded onto the Net. To remain vital, culture must be renewed in the minds of the members of every generation. Outsource memory, and culture withers.<\/span>", "options": ["<span><\/span>\t<span>Offloading of memory to data banks threatens the depth and distinctiveness of the self and culture which then evolve under the pressure of technology, reduce us to pancake people -spread thin and drained of inner cultural inheritance and vitality.<\/span>", "<span><\/span>\t<span>Outsourcing memory to external data banks can threaten the depth and distinctiveness of the self and culture draining us of our inner repository of dense cultural inheritance making us \"pancake people\" spread thin and reduced to binary codes.<\/span>", "<span><\/span>\t<span>Outsourcing memory to data banks threatens the self and culture by imposing on us a new self-created by technology and drains us of our inner cultural inheritance which otherwise is renewed in the minds of every generation.<\/span>", "<span><\/span>\t<span>Offloading of memory to external data banks threatens not only the self but also culture draining us of our inner repository of cultural inheritance, reducing us to binary code, and losing the vitality that comes with changing generations.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span>Option 1. Correct. The effect of off-loading memory to external databanks on the self and culture are clearly brought out in the précis with just enough details.  The answer is a close call between 1 and 3.<\/span>\r<br /><span>Option 2. Incorrect. In contrast to 1, 2 is not clear in terms of how offloading memory threatens the self and culture (evolving under the pressure of technology) It includes less relevant information like reducing to binary codes. 1 scores over 2.<\/span>\r<br /><span>Option 3. Good but incorrect.&nbsp;<\/span><span>Similar to<\/span><span> 2, 3 is also not specific about the impact on the self and culture (resulting in \"pancake people\" spread thin and drained of vitality.) Unlike 1, it does not quite explain the impact of technology on our self and culture.<\/span>\r<br /><span>Option 4.&nbsp;<\/span><span>Similar to<\/span><span> 2 and 3. The impact of technology is not made clear, how the self and culture are affected is also not clear, contains less important information about reducing us to binary code.<\/span>\r<br /><span>Note: All three remaining options capture the main idea, but all are not equally good. 1 is precise and clear.<\/span>\r<br /><span>Hence, [1].<\/span>\r<br /><span>&nbsp;<\/span", "topic": "Summary"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;
function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
