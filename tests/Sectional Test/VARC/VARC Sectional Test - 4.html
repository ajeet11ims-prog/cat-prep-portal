f molten rocks contributes to the ascent of magma together with gas bubble coalescence that, as soon as reaches the surface, finds an opposite gradient producing lava flows on the sides of the volcanic apparatus, or disperses with pyroclastic clouds. The higher is the viscosity of magmas, the greater is the pressure gradient that manages to accumulate, and the viscosity generally tends to increase with the silica content of the magma. The higher the magma viscosity, the greater the explosiveness and the episodic nature of volcanism: this is an example of chemical gradient affecting geophysical dynamics.<\/span><br><br><span>Gradients are determined by variations in pressure, temperature, chemical and mineralogical composition, friction, rigidity, viscosity, electromagnetic field, etc. The greatest the gradient, the largest the energy involved, yielding a wide range of manifestations at different spatial and temporal scales. The surface of the Earth is featured by complex geological patterns produced by both endogenous and exogenous events playing as a mirror of phenomena acting since the dawn of our planet. The lack of direct investigations still makes Earth interior poorly understood <\/span><span>and also<\/span><span> prevents complete clarification of peculiar mechanisms ruling geodynamics and related phenomena. For the same reason, the effective roles of the different forces contributing to plate tectonics remain elusive.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\tIt can be inferred from the passage that the non-linear and chaotic behaviours of gradients in Earth's systems can lead to <span>all of<\/span><span> the following EXCEPT:<\/span>", "options": ["<span>Increase in the frequency of natural disasters, such as landslides and volcanic eruptions.<\/span>", "Change in collective behaviours and catastrophic events like sudden, massive earthquakes.", "<span><\/span>\tEmergence of complex geological processes which can sometimes be beneficial.", "<span><\/span>\tSelf-organisation of the system and defying of laws of physics including gravitational force."], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>“Several gradients of parameters acting together with different times and rates on systems with a large number of&nbsp;<\/span><span>degree<\/span><span> of freedom can determine non-linearity, chaos and self-organization that can ultimately evolve into catastrophic collective&nbsp;<\/span><span>behaviors<\/span><span>.” Options 1 and 2 can be inferred from the passage from different places. Option 3 can be inferred from the ‘self-organization’ part. In the context of the given passage, self-organization refers to the emergence of complex patterns or structures that arise spontaneously from the interactions between the different elements of a system. These patterns or structures can be seen as organized&nbsp;<\/span><span>behavior<\/span><span> that emerges from the system itself, rather than being imposed from outside. In the context of Earth's systems, self-organization can lead to the emergence of complex phenomena such as Life, ocean currents, weather patterns, and geological processes. While self-organization can sometimes be beneficial, it can also contribute to non-linear and chaotic&nbsp;<\/span><span>behaviors<\/span><span> that can result in catastrophic events. Hence option 3 can be inferred. Option 4, however, cannot be inferred that any of the processes defy laws of physics or gravitation.<\/span>\r<br /><span>Hence, [<\/span><span>4<\/span><span>].<\/span>", "topic": "Inference"}, {"number": 11, "sourceId": "168672949285710", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>A gradient indicates a variation of any parameter, such as the degree of inclination of a plane; in physics, the rate at which, for example, pressure or temperature vary in space or time; in chemistry, a gradient can be identified as the variation of electro-chemical potential differences between two bodies; in biology, a gradient can be considered as the progressively increasing or decreasing differences in the growth rate, metabolism, physiological activity of a cell, organ or organism. Several gradients of parameters acting together with different times and rates on systems with a large number of <\/span><span>degree<\/span><span> of freedom can determine non-linearity, chaos and self-organization that can ultimately evolve into catastrophic collective <\/span><span>behaviors<\/span><span>.<\/span><br><br><span>A gradient generates forces producing or being the expression of a difference of a certain physical observable in time or space. Earth hosts Life because of the mobility of its mantle, thermal gradients inducing volcanic eruptions and velocity differences among crustal volumes provoking faulting, mountain growth and ocean spreading.<\/span><br><br>What is the nature of these planetary gradients? How can we study them and how do they punctuate Earth dynamics? Each gust of wind is determined by atmospheric pressure gradient: areas where atmospheric pressure is greater push air toward areas of lower pressure. The greater the gradient, the faster the winds. Cyclones, tornadoes, <span>rain<\/span><span> and snow are controlled by those gradients. For analogous reasons, in the two hemispheres, the Coriolis force plays <\/span><span>opposite<\/span><span> and the linear velocity gradient induces clockwise or counter<\/span><span> <\/span><span>clockwise atmospheric circulation. Rivers flow downstream because of a topographic gradient and therefore a gravitational one: gravity never stops working. Atmospheric disturbances determine heavy rains, which in turn lower the friction in the soil and rocks, causing landslides: it is a succession of gradients that shape the Earth’s surface, with a tendency to decrease or eliminate morphological irregularities.<\/span><br><br><span>Volcanoes erupt violently because inside the magma chambers, where the lava accumulates and melts the embedded rocks, pressure gradients are created that break through the overlying Earth’s crust. The density gradient that is generated for the thermal expansion of molten rocks contributes to the ascent of magma together with gas bubble coalescence that, as soon as reaches the surface, finds an opposite gradient producing lava flows on the sides of the volcanic apparatus, or disperses with pyroclastic clouds. The higher is the viscosity of magmas, the greater is the pressure gradient that manages to accumulate, and the viscosity generally tends to increase with the silica content of the magma. The higher the magma viscosity, the greater the explosiveness and the episodic nature of volcanism: this is an example of chemical gradient affecting geophysical dynamics.<\/span><br><br><span>Gradients are determined by variations in pressure, temperature, chemical and mineralogical composition, friction, rigidity, viscosity, electromagnetic field, etc. The greatest the gradient, the largest the energy involved, yielding a wide range of manifestations at different spatial and temporal scales. The surface of the Earth is featured by complex geological patterns produced by both endogenous and exogenous events playing as a mirror of phenomena acting since the dawn of our planet. The lack of direct investigations still makes Earth interior poorly understood <\/span><span>and also<\/span><span> prevents complete clarification of peculiar mechanisms ruling geodynamics and related phenomena. For the same reason, the effective roles of the different forces contributing to plate tectonics remain elusive.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\tWhich of the following statements best describes the main idea of paragraph 2 in the context of the essay?", "options": ["<span>The paragraph discusses the important role of gradients in the emergence of life on Earth.<\/span>", "<span><\/span>\tThe paragraph emphasizes the interconnectedness of Earth's systems and the critical role that gradients play in shaping and sustaining the planet.", "<span><\/span>\tThe paragraph focuses on the geological processes that gradients generate through variations in physical observables.", "<span><\/span>\tThe paragraph highlights the key factor of the mobility of Earth's mantle in creating gradients and the complex phenomena that support life."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>The main point of this paragraph is to highlight the important role that gradients play in shaping Earth's systems (and, if at all, ultimately allowing for the existence of life on our planet.) The paragraph describes how gradients, which are variations in physical observables such as pressure, temperature, and chemical composition, generate forces that contribute to a wide range of geological processes such as volcanic eruptions, faulting, mountain growth, and ocean spreading. The author also emphasizes how the mobility of Earth's mantle is a key factor in creating these gradients and allowing for the emergence of complex phenomena that support life. Overall, the paragraph emphasizes the interconnectedness of Earth's systems and the crucial role that gradients play in shaping and sustaining our planet.<\/span>\r<br /><span>Paragraph 2 discusses the role of Earth's mantle in creating gradients and contributing to various geological processes. While the paragraph also mentions the role of gradients in allowing for the emergence of life, this is not the main point that the author is making. Similarly, while the paragraph&nbsp;<\/span>describes the nature of gradients, this is not the&nbsp;<span>main focus<\/span><span> of the passage. It is possible to argue that ‘life’ is the most important point here. But in the context of the essay, it is not.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Inference"}, {"number": 12, "sourceId": "168672949285711", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>A gradient indicates a variation of any parameter, such as the degree of inclination of a plane; in physics, the rate at which, for example, pressure or temperature vary in space or time; in chemistry, a gradient can be identified as the variation of electro-chemical potential differences between two bodies; in biology, a gradient can be considered as the progressively increasing or decreasing differences in the growth rate, metabolism, physiological activity of a cell, organ or organism. Several gradients of parameters acting together with different times and rates on systems with a large number of <\/span><span>degree<\/span><span> of freedom can determine non-linearity, chaos and self-organization that can ultimately evolve into catastrophic collective <\/span><span>behaviors<\/span><span>.<\/span><br><br><span>A gradient generates forces producing or being the expression of a difference of a certain physical observable in time or space. Earth hosts Life because of the mobility of its mantle, thermal gradients inducing volcanic eruptions and velocity differences among crustal volumes provoking faulting, mountain growth and ocean spreading.<\/span><br><br>What is the nature of these planetary gradients? How can we study them and how do they punctuate Earth dynamics? Each gust of wind is determined by atmospheric pressure gradient: areas where atmospheric pressure is greater push air toward areas of lower pressure. The greater the gradient, the faster the winds. Cyclones, tornadoes, <span>rain<\/span><span> and snow are controlled by those gradients. For analogous reasons, in the two hemispheres, the Coriolis force plays <\/span><span>opposite<\/span><span> and the linear velocity gradient induces clockwise or counter<\/span><span> <\/span><span>clockwise atmospheric circulation. Rivers flow downstream because of a topographic gradient and therefore a gravitational one: gravity never stops working. Atmospheric disturbances determine heavy rains, which in turn lower the friction in the soil and rocks, causing landslides: it is a succession of gradients that shape the Earth’s surface, with a tendency to decrease or eliminate morphological irregularities.<\/span><br><br><span>Volcanoes erupt violently because inside the magma chambers, where the lava accumulates and melts the embedded rocks, pressure gradients are created that break through the overlying Earth’s crust. The density gradient that is generated for the thermal expansion of molten rocks contributes to the ascent of magma together with gas bubble coalescence that, as soon as reaches the surface, finds an opposite gradient producing lava flows on the sides of the volcanic apparatus, or disperses with pyroclastic clouds. The higher is the viscosity of magmas, the greater is the pressure gradient that manages to accumulate, and the viscosity generally tends to increase with the silica content of the magma. The higher the magma viscosity, the greater the explosiveness and the episodic nature of volcanism: this is an example of chemical gradient affecting geophysical dynamics.<\/span><br><br><span>Gradients are determined by variations in pressure, temperature, chemical and mineralogical composition, friction, rigidity, viscosity, electromagnetic field, etc. The greatest the gradient, the largest the energy involved, yielding a wide range of manifestations at different spatial and temporal scales. The surface of the Earth is featured by complex geological patterns produced by both endogenous and exogenous events playing as a mirror of phenomena acting since the dawn of our planet. The lack of direct investigations still makes Earth interior poorly understood <\/span><span>and also<\/span><span> prevents complete clarification of peculiar mechanisms ruling geodynamics and related phenomena. For the same reason, the effective roles of the different forces contributing to plate tectonics remain elusive.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t“ … it is a succession of gradients that shape the Earth’s surface, with a tendency to decrease or eliminate morphological irregularities.” In the context of the passage, which one of the following is not a possible implication of the quoted statement?", "options": ["<span>Earth’s gradients are responsible for creating a certain degree of regularity or uniformity in the Earth's surface.<\/span>", "<span><\/span>\tWhen a river flows from a high to a low elevation, it creates a gradient that causes the surface to become smoother and flatter as the water erodes the land.", "<span><\/span>\tAs the wind moves across a desert, the gradient can cause the sand to accumulate in certain areas causing huge sand dunes.", "<span><\/span>\tThe gradual cooling and solidification of magma beneath the Earth's surface can create gradients that lead to the formation of regular patterns of mineral crystals."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>\"Morphological irregularities\" refer to the natural variations and imperfections in the surface features of the Earth, such as hills, valleys, mountains, canyons, and other landforms. The writer suggests that gradients tend to decrease or eliminate these irregularities over time, resulting in a more uniform or smoothed-out surface. By implication, the forces generated by gradients tend to push matter from areas of high concentration to areas of low concentration, evening out the differences in elevation and other features.<\/span>\r<br /><span>Option 1. Straightforward simplification of the quoted statement.<\/span>\r<br /><span>Option 2. Example of eliminating a morphological irregularity.<\/span>\r<br /><span>Option 3. Creation of a morphological irregularity. Hence the answer.<\/span>\r<br /><span>Option 4.Refer to paragraph 4. Not a straightforward option which can be seen as an example of ‘decreasing or eliminating a morphological irregularity’ – however the example comes immediately after the quoted statement in the next paragraph and ends with “this is an example of chemical gradient affecting geophysical dynamics.” Since the writer has already stated that the succession of events is towards reducing irregularity, it can only be seen as the same work done by chemical gradient- the option mentions ‘regular&nbsp;<\/span><span>patterns’<\/span><span>. Hence option 4 is an implication of the statement.<\/span>\r<br /><span>Hence, [<\/span><span>3<\/span><span>].<\/span>", "topic": "Inference"}, {"number": 13, "sourceId": "168672949285712", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>The challenge confronting the informational state of the public is the accelerating spread of misinformation and disinformation on the internet. On Twitter falsehoods spread further and faster than the truth. <\/span><span>And,<\/span><span> online misinformation and disinformation in a wide variety of forms have created serious issues vis-à-vis public belief and democratic functioning.<\/span><br><br><span>In response to “fake news”, programmers have built algorithms that aim to judge the veracity of online stories. Researchers explore which features of an article are the most reliable identifiers of fake news. These sorts of tools have some promise as part of the enterprise of social epistemology. But their power to discriminate true stories from false ones has limited reliability.  As O’Connor and Weatherall (2019) point out, online misinformation constitutes a kind of arms race. As platforms and programmers and governments develop tools to fight it, the purveyors of misinformation will develop new methods of shaping public belief.<\/span><br><br><span>All ill-informed <\/span><span>populace<\/span><span> may not be able to effectively represent their interests in a democratic society. It will be necessary for those fighting online misinformation to keep adapting with the best tools and theory available to them. This includes understanding social aspects of knowledge and belief formation. In other words, social epistemology has much to say to those faced with the challenging task of protecting democracy from misinformation.<\/span><br><br><span>Some recent writers seek to expand the notion of social epistemology by incorporating moral or ethical elements. Miranda Fricker has made significant contributions to this literature. Fricker introduces the notion of “epistemic injustice,” which arises when somebody is wronged in their capacity as a knower – when a person or a social group is unfairly deprived of knowledge because of their lack of adequate access to education or other epistemic resources. Fricker’s work also focuses on two less obvious forms of epistemic injustice. The first is testimonial injustice, which occurs when a speaker is given less credibility than she deserves because the hearer has prejudices about a social group to which the speaker belongs. The second kind is hermeneutical injustice. This occurs when, <\/span><span>as a result of<\/span><span> a group being socially powerless, members of the group lack the conceptual resources to make sense of certain distinctive social experiences.<\/span><br><br><span>These issues are relevant epistemological ones for those in democratic societies. Epistemic injustices may leave some members of society ill-equipped to engage in the debates that fuel a well-functioning democracy. Testimonial injustice may prevent the spread of important information and perspectives through a community.<\/span><br><br><span>Misinformation can also pose epistemic threats to democratic functioning. With respect to internet misinformation, we might ask: do we have a right to protection against such misinformation? Is it morally acceptable for internet platforms, or government bodies, to protect public belief by regulating and limiting misinformation? There are deep political and moral issues here. Free speech is protected in most democratic societies, but part of the <\/span><span>defense<\/span><span> of free speech is that it is crucial for freedom of thought. Once we recognize that human beliefs are deeply social, we might acknowledge that some sorts of speech interfere with our freedom of thought, and in some <\/span><span>cases<\/span><span> we may need to decide to protect one in lieu of the other.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "All of the following statements, if false, would contradict the arguments in the passage EXCEPT:", "options": ["<span>Social epistemology cannot help us understand how disinformation is spread on the internet.<\/span>", "<span>Social epistemology helps us understand how misinformation can pose a threat to democracy.<\/span>", "<span>Social epistemology considers how social structures and institutions shape our beliefs.<\/span>", "<span>Social epistemology does not consider knowledge as a product of individual achievement.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span>(<\/span><span>If false… contradict … except<\/span><span> = Which one contradicts? OR All these support except:)<\/span>\r<br /><br />\t<span>1.<\/span>\t<span>Social epistemology&nbsp;<\/span><span>can help<\/span><span> us (If false, the statement does not contradict). Exception<\/span>\r<br />2.\t<span>Social epistemology&nbsp;<\/span><span>does not help<\/span><span> us understand… (If false, the statement contradicts)<\/span>\r<br /><br />\t<span>3.<\/span>\t<span>Social epistemology&nbsp;<\/span><span>does not consider<\/span><span> how social …(If false, the statement contradicts)<\/span>\r<br /><br />\t<span>4.<\/span>\t<span>Social epistemology&nbsp;<\/span><span>considers<\/span><span> knowledge  …(If false, the statement contradicts)<\/span>\r<br /><span>Option 1 is not supported by the passage. The passage suggests that social epistemology can indeed help us understand how disinformation is spread on the internet. Social epistemology examines the social processes that shape how knowledge is produced, validated, and disseminated, including the spread of false or misleading information online.<\/span>\r<br /><span>Option 2. The passage suggests that social epistemology can help us understand how misinformation can pose a threat to democracy by leaving some members of society ill-equipped to engage in debates, preventing the spread of important information, and interfering with freedom of thought.<\/span>\r<br /><span>Option 3. This statement is supported by the passage. The passage states that social epistemology examines the social factors and processes that influence the production and distribution of knowledge.<\/span>\r<br /><span>Option 4. This statement is supported by the passage. The passage suggests that social epistemology provides a framework for understanding how knowledge is a product of social interactions, rather than an individual achievement.<\/span>\r<br /><span>Hence, [<\/span><span>1<\/span><span>].<\/span>", "topic": "Inference"}, {"number": 14, "sourceId": "168672949285813", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>The challenge confronting the informational state of the public is the accelerating spread of misinformation and disinformation on the internet. On Twitter falsehoods spread further and faster than the truth. <\/span><span>And,<\/span><span> online misinformation and disinformation in a wide variety of forms have created serious issues vis-à-vis public belief and democratic functioning.<\/span><br><br><span>In response to “fake news”, programmers have built algorithms that aim to judge the veracity of online stories. Researchers explore which features of an article are the most reliable identifiers of fake news. These sorts of tools have some promise as part of the enterprise of social epistemology. But their power to discriminate true stories from false ones has limited reliability.  As O’Connor and Weatherall (2019) point out, online misinformation constitutes a kind of arms race. As platforms and programmers and governments develop tools to fight it, the purveyors of misinformation will develop new methods of shaping public belief.<\/span><br><br><span>All ill-informed <\/span><span>populace<\/span><span> may not be able to effectively represent their interests in a democratic society. It will be necessary for those fighting online misinformation to keep adapting with the best tools and theory available to them. This includes understanding social aspects of knowledge and belief formation. In other words, social epistemology has much to say to those faced with the challenging task of protecting democracy from misinformation.<\/span><br><br><span>Some recent writers seek to expand the notion of social epistemology by incorporating moral or ethical elements. Miranda Fricker has made significant contributions to this literature. Fricker introduces the notion of “epistemic injustice,” which arises when somebody is wronged in their capacity as a knower – when a person or a social group is unfairly deprived of knowledge because of their lack of adequate access to education or other epistemic resources. Fricker’s work also focuses on two less obvious forms of epistemic injustice. The first is testimonial injustice, which occurs when a speaker is given less credibility than she deserves because the hearer has prejudices about a social group to which the speaker belongs. The second kind is hermeneutical injustice. This occurs when, <\/span><span>as a result of<\/span><span> a group being socially powerless, members of the group lack the conceptual resources to make sense of certain distinctive social experiences.<\/span><br><br><span>These issues are relevant epistemological ones for those in democratic societies. Epistemic injustices may leave some members of society ill-equipped to engage in the debates that fuel a well-functioning democracy. Testimonial injustice may prevent the spread of important information and perspectives through a community.<\/span><br><br><span>Misinformation can also pose epistemic threats to democratic functioning. With respect to internet misinformation, we might ask: do we have a right to protection against such misinformation? Is it morally acceptable for internet platforms, or government bodies, to protect public belief by regulating and limiting misinformation? There are deep political and moral issues here. Free speech is protected in most democratic societies, but part of the <\/span><span>defense<\/span><span> of free speech is that it is crucial for freedom of thought. Once we recognize that human beliefs are deeply social, we might acknowledge that some sorts of speech interfere with our freedom of thought, and in some <\/span><span>cases<\/span><span> we may need to decide to protect one in lieu of the other.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\tWhich of the following statements best explains the threat that epistemic injustices pose to democratic functioning?", "options": ["<span>Epistemic injustices hinder the dissemination of significant viewpoints and information among a community.<\/span>", "<span><\/span>\tCertain social groups are deprived of educational opportunities and other resources due to epistemic injustices.", "<span><\/span>\tThe internet may become a breeding ground for misinformation and disinformation due to epistemic injustices.", "<span><\/span>\tSome individuals may lack the necessary skills to participate in discussions and decision-making processes."], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>The passage states that \"Epistemic injustices may leave some members of society ill-equipped to engage in the debates that fuel a well-functioning democracy.\" Therefore, option 4 is the correct answer. Options 1 and 2 are also mentioned in the passage as forms of epistemic injustice, but they are not directly linked to democratic functioning. Option 3, on the other hand, is not mentioned in relation to epistemic injustices and is therefore not supported by the passage.<\/span>\r<br /><span>Hence, [<\/span><span>4<\/span><span>].<\/span>", "topic": "Specific Detail Question"}, {"number": 15, "sourceId": "168672949285814", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>The challenge confronting the informational state of the public is the accelerating spread of misinformation and disinformation on the internet. On Twitter falsehoods spread further and faster than the truth. <\/span><span>And,<\/span><span> online misinformation and disinformation in a wide variety of forms have created serious issues vis-à-vis public belief and democratic functioning.<\/span><br><br><span>In response to “fake news”, programmers have built algorithms that aim to judge the veracity of online stories. Researchers explore which features of an article are the most reliable identifiers of fake news. These sorts of tools have some promise as part of the enterprise of social epistemology. But their power to discriminate true stories from false ones has limited reliability.  As O’Connor and Weatherall (2019) point out, online misinformation constitutes a kind of arms race. As platforms and programmers and governments develop tools to fight it, the purveyors of misinformation will develop new methods of shaping public belief.<\/span><br><br><span>All ill-informed <\/span><span>populace<\/span><span> may not be able to effectively represent their interests in a democratic society. It will be necessary for those fighting online misinformation to keep adapting with the best tools and theory available to them. This includes understanding social aspects of knowledge and belief formation. In other words, social epistemology has much to say to those faced with the challenging task of protecting democracy from misinformation.<\/span><br><br><span>Some recent writers seek to expand the notion of social epistemology by incorporating moral or ethical elements. Miranda Fricker has made significant contributions to this literature. Fricker introduces the notion of “epistemic injustice,” which arises when somebody is wronged in their capacity as a knower – when a person or a social group is unfairly deprived of knowledge because of their lack of adequate access to education or other epistemic resources. Fricker’s work also focuses on two less obvious forms of epistemic injustice. The first is testimonial injustice, which occurs when a speaker is given less credibility than she deserves because the hearer has prejudices about a social group to which the speaker belongs. The second kind is hermeneutical injustice. This occurs when, <\/span><span>as a result of<\/span><span> a group being socially powerless, members of the group lack the conceptual resources to make sense of certain distinctive social experiences.<\/span><br><br><span>These issues are relevant epistemological ones for those in democratic societies. Epistemic injustices may leave some members of society ill-equipped to engage in the debates that fuel a well-functioning democracy. Testimonial injustice may prevent the spread of important information and perspectives through a community.<\/span><br><br><span>Misinformation can also pose epistemic threats to democratic functioning. With respect to internet misinformation, we might ask: do we have a right to protection against such misinformation? Is it morally acceptable for internet platforms, or government bodies, to protect public belief by regulating and limiting misinformation? There are deep political and moral issues here. Free speech is protected in most democratic societies, but part of the <\/span><span>defense<\/span><span> of free speech is that it is crucial for freedom of thought. Once we recognize that human beliefs are deeply social, we might acknowledge that some sorts of speech interfere with our freedom of thought, and in some <\/span><span>cases<\/span><span> we may need to decide to protect one in lieu of the other.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\tWhich of the following is most likely NOT an example of hermeneutical injustice?", "options": ["<span>A mother explaining the nuances of sexual harassment to her young child.<\/span>", "<span><\/span>\tWomen being offered less remuneration than men for doing the same work.", "<span><\/span>\tOstracizing a community of tribals because they are untouchables.", "<span><\/span>\tAn Alzheimer patient being asked to explain his condition to a doctor."], "answer": 1, "answerLabel": "B", "solution": "<span>“hermeneutical injustice… occurs when, as a result of a group being socially powerless, members of the group lack the conceptual resources to make sense of certain distinctive social experiences.”<\/span>\r<br /><span>Lack of conceptual resources would mean there is no defined framework in which an experience can be communicated or understood. Option 1. The child lacks the conceptual framework to understand. Option 2. Framework is available to decide it is less. Option 3. No framework is available. Option 4. Both the patient and the doctor&nbsp;<\/span><span>lacks<\/span><span> the conceptual framework to communicate the experience.<\/span>\r<br /><span>Option 2 - Women being offered less remuneration than men for doing the same work - is not an example of hermeneutical injustice. It is an example of a different type of epistemic injustice, namely testimonial&nbsp;<\/span><span>injustice<\/span><span> or credibility deficit, where an individual is not given proper credibility or recognition for their knowledge, skills or experiences. Gender discrimination.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Application Question"}, {"number": 16, "sourceId": "168672949285815", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>The challenge confronting the informational state of the public is the accelerating spread of misinformation and disinformation on the internet. On Twitter falsehoods spread further and faster than the truth. <\/span><span>And,<\/span><span> online misinformation and disinformation in a wide variety of forms have created serious issues vis-à-vis public belief and democratic functioning.<\/span><br><br><span>In response to “fake news”, programmers have built algorithms that aim to judge the veracity of online stories. Researchers explore which features of an article are the most reliable identifiers of fake news. These sorts of tools have some promise as part of the enterprise of social epistemology. But their power to discriminate true stories from false ones has limited reliability.  As O’Connor and Weatherall (2019) point out, online misinformation constitutes a kind of arms race. As platforms and programmers and governments develop tools to fight it, the purveyors of misinformation will develop new methods of shaping public belief.<\/span><br><br><span>All ill-informed <\/span><span>populace<\/span><span> may not be able to effectively represent their interests in a democratic society. It will be necessary for those fighting online misinformation to keep adapting with the best tools and theory available to them. This includes understanding social aspects of knowledge and belief formation. In other words, social epistemology has much to say to those faced with the challenging task of protecting democracy from misinformation.<\/span><br><br><span>Some recent writers seek to expand the notion of social epistemology by incorporating moral or ethical elements. Miranda Fricker has made significant contributions to this literature. Fricker introduces the notion of “epistemic injustice,” which arises when somebody is wronged in their capacity as a knower – when a person or a social group is unfairly deprived of knowledge because of their lack of adequate access to education or other epistemic resources. Fricker’s work also focuses on two less obvious forms of epistemic injustice. The first is testimonial injustice, which occurs when a speaker is given less credibility than she deserves because the hearer has prejudices about a social group to which the speaker belongs. The second kind is hermeneutical injustice. This occurs when, <\/span><span>as a result of<\/span><span> a group being socially powerless, members of the group lack the conceptual resources to make sense of certain distinctive social experiences.<\/span><br><br><span>These issues are relevant epistemological ones for those in democratic societies. Epistemic injustices may leave some members of society ill-equipped to engage in the debates that fuel a well-functioning democracy. Testimonial injustice may prevent the spread of important information and perspectives through a community.<\/span><br><br><span>Misinformation can also pose epistemic threats to democratic functioning. With respect to internet misinformation, we might ask: do we have a right to protection against such misinformation? Is it morally acceptable for internet platforms, or government bodies, to protect public belief by regulating and limiting misinformation? There are deep political and moral issues here. Free speech is protected in most democratic societies, but part of the <\/span><span>defense<\/span><span> of free speech is that it is crucial for freedom of thought. Once we recognize that human beliefs are deeply social, we might acknowledge that some sorts of speech interfere with our freedom of thought, and in some <\/span><span>cases<\/span><span> we may need to decide to protect one in lieu of the other.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\tWhich of the following statements best represents the essence of the passage?", "options": ["<span>The development of algorithms to judge the veracity of online stories.<\/span>", "<span><\/span>\tThe use of social epistemology to protect democracy from misinformation.", "<span><\/span>\tThe spread of fake news on the internet and its effect on democratic functioning.", "<span><\/span>\tThe notion of epistemic injustice and its relevance in democratic societies."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>The passage primarily focuses on the issue of misinformation and disinformation on the internet and its effects on democratic functioning. It discusses the challenges in combating fake news, including the development of algorithms and the importance of social epistemology in protecting democracy from misinformation. It also explores the concept of epistemic injustice, specifically testimonial and hermeneutical injustice, and their relevance in democratic societies. Therefore, option 3 is the correct answer.<\/span>\r<br /><span>Hence, [<\/span><span>3<\/span><span>].<\/span>", "topic": "Central Idea"}, {"number": 17, "sourceId": "168672949285816", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br>1.\t<span>The concept of time is central to many scientific and philosophical debates, yet it remains one of the most elusive and complex concepts to fully understand.<\/span><br>2.\t<span>Philosophers and scientists have been exploring the nature of time for centuries, and many different theories and models have been proposed.<\/span><br>3.\t<span>Einstein's theory of relativity is one of the most influential and widely accepted models of time, and it has revolutionized our understanding of the universe.<\/span><br>4.\t<span>Despite the many different perspectives and debates about time, one thing is clear: time is a fundamental and essential aspect of our experience of the world.<\/span><br><br><span>", "options": [], "answer": "4231", "answerLabel": "4231", "solution": "<\/span>\t<span>Sentence 1. General statement. Good for the beginning.<\/span>\r<br /><span>Sentence 2. Appears connected to 1 – if it is, it should come in some place after 2. Exploration of time will precede debates.<\/span>\r<br /><span>Sentence 3. One of the influential scientific theories about time. Can follow 2.<\/span>\r<br /><span>Sentence 4. Introduces the topic. Good for the beginning.<\/span>\r<br /><span>Time as a fundamental aspect of our experience of the world (4) – concern of philosophers and scientists, debates different theories–  Einstein’s most influential theory (2-3 constant) -   many other theories but  yet time remains most elusive.<\/span>\r<br /><span>Sentence 4 presents a general statement about time that provides a good starting point for the paragraph. Sentence 2 follows logically from this, as it introduces the fact that many different theories and models of time have been proposed. Sentence 3 then expands on this&nbsp;<\/span><span>idea, and<\/span><span> provides a specific example of one of the most influential models of time. Finally, sentence 1 provides a more philosophical perspective on the concept of time – yet it remains one of the most elusive concepts.<\/span>\r<br /><span>1234 appears good enough too. However, “yet it remains one of the most elusive and complex concepts to fully understand,” is better as a conclusion rather than an introduction. “time is a fundamental and essential aspect of our experience of the world,” is better introduction to the paragraph.&nbsp;<\/span><span>So<\/span><span> the sequence, Time as a fundamental aspect of our experience of the world (4) – concern of philosophers and scientists, debates different theories–  Einstein’s most influential theory (2-3 constant) -   many other theories but  yet time remains most elusive, is most logical.<\/span>\r<br /><span><\/span>\r<br /><span>The<\/span><span>refore<\/span><span>.<\/span><span> the required answer is&nbsp;<\/span><span>4231.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 18, "sourceId": "168672949286017", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br>1.\t<span>Abstract thought is often associated with creativity and <\/span><span>innovation, and<\/span><span> has been the subject of much research in the field of cognitive science.<\/span><br><span>2.<\/span>\tThe ability to think abstractly is linked to higher intelligence and cognitive flexibility, allowing individuals to solve complex problems and adapt to new situations.<br><span>3.<\/span>\tDespite these limitations, the study of abstract thought continues to be an important area of investigation in the pursuit of understanding human cognition and consciousness.<br><span>4.<\/span>\tHowever, the use of abstract thinking can also be limited by a variety of factors, including cognitive biases, environmental influences, and cultural conditioning.<br><br><span>", "options": [], "answer": "2143", "answerLabel": "2143", "solution": "<\/span>\t<span>Sentence 1. Standalone sentence. Good for starting the paragraph.<\/span>\r<br /><span>Sentence 2. Standalone sentence. Good for starting the paragraph. However, better than 1 as it introduces ‘the ability to think abstractly’ and how it is generally understood. 2-1 is a distinct possibility.<\/span>\r<br /><span>Sentence 3. Mentions ‘these&nbsp;<\/span><span>limitations’<\/span><span>. Must follow a sentence which spells out the limitations.<\/span>\r<br /><span>Sentence 4. Spells out the limitations. 4-3 is a pair.<\/span>\r<br />Though 2-1 and 1-2 are distinct possibilities, 2-1 is better than 1-2 as explained above.  1 seems to explain 2 as to why abstract thought is “often” considered positive.  2-1 can be followed by 4-3.\r<br /><span>The<\/span><span>refore, the required answer is<\/span><span> 2143.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 19, "sourceId": "168672949286318", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br>1.\t<span>The question of whether machines can truly think and have consciousness has been a topic of debate for many years.<\/span><br><span>2.<\/span>\tArtificial intelligence (AI) is a field that has made significant progress in recent decades, with machines now capable of complex tasks such as playing chess, recognizing faces, and even driving cars.<br><span>3.<\/span>\tWhile many experts agree that machines can exhibit intelligent <span>behavior<\/span><span>, others argue that this does not necessarily mean they possess true consciousness.<\/span><br><span>4.<\/span>\tOne of the main challenges in creating machines with consciousness is understanding what consciousness is, and how it arises in the human brain.<br><br><span>", "options": [], "answer": "4231", "answerLabel": "4231", "solution": "<\/span>\t<span>Sentence 1. Standalone sentence. Could be starting the paragraph. – debate of machine vs. consciousness.<\/span>\r<br /><span>Sentence 2. What machines&nbsp;<\/span><span>are capable of doing<\/span><span>. No concrete clue for where it can go in the paragraph.<\/span>\r<br /><span>Sentence 3. What machines are capable of – related to 2 ( explaining the examples as intelligence). “does not possess consciousness” links it with the ‘debate’ mentioned in 1 as well.  So, 1 should follow 3.<\/span>\r<br /><span>Sentence 4. Standalone sentence. Could be the starter or the conclusion.<\/span>\r<br />\r<br /><span>Sentence 4 states the theme of the paragraph: “challenges in creating machines with consciousness” Sentence 2 follows logically from this, as it discusses the progress made in the field of AI and the capabilities of modern machines and in a way explains the next step of addressing the ‘challenges’ in 4 . Sentence 3 then introduces a debate around whether machines (AI) are merely  intelligent or conscious. Sentence 1 provides the conclusion.<\/span>\r<br />\r<br /><span>The<\/span><span>refore, the required answer is<\/span><span> 4231<\/span><span>.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 20, "sourceId": "168672949286419", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><span><b>Sentence:<\/b><\/span><span> <\/span><br><span>Moreover, sustainable tourism can provide economic benefits to local communities by creating jobs and supporting small businesses.<\/span><br><span><b>Paragraph:<\/b><\/span><br><span>_____1____. The concept of sustainable tourism has gained popularity in recent years. Sustainable tourism is a way of traveling while considering the impact on the environment, local communities, and economies. It aims to preserve natural resources, protect wildlife and biodiversity, and promote cultural diversity and local traditions. _____2____. This includes reducing the use of plastic, <\/span>supporting local businesses, and respecting the customs and traditions of the places visited. _____3____. Sustainable tourism also promotes responsible travel <span>behaviors<\/span><span>, such as minimizing waste, conserving energy, and using public transportation. _____4____.<\/span>", "options": ["<span>Option 1<\/span>", "<span><\/span>\tOption 2", "<span><\/span>\tOption 3", "<span><\/span>\tOption 4"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>The most appropriate blank to fit the given sentence would be the concluding sentence of the paragraph, which provides an end to the topic of sustainable tourism. Option 4 serves this purpose by concluding the topic of sustainable tourism. The key statement concludes by talking about impact on local communities, whereas the previous statements talk mainly about the travellers.<\/span>\r<br /><span>Hence, [<\/span><span>4<\/span><span>].<\/span>", "topic": "Paragraph Completion"}, {"number": 21, "sourceId": "168672949286520", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><span><b>Sentence:<\/b><\/span><span> <\/span><br><span>Furthermore, sleep deprivation can have negative effects on cognitive functions such as attention and memory.<\/span><br><span><b>Paragraph:<\/b><\/span><span> <\/span><br><span>_____1____.  Sleep is essential for a healthy body and mind. During sleep, the body undergoes important restorative processes that help to repair and regenerate tissues and promote the immune system. _____2____.  Lack of sleep has been linked to a range of health problems, including obesity, diabetes, cardiovascular disease, and depression. _____3____. In addition, sleep-deprived individuals are more likely to make mistakes and have accidents, both at home and in the workplace. _____4____. Therefore, it is important to prioritize getting enough quality sleep each night to maintain good physical and mental health.<\/span>", "options": ["<span>Option 1<\/span>", "Option 2", "Option 3", "<span><\/span>\tOption 4"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>The given sentence talks about the negative effects of sleep deprivation on cognitive functions. The blank that best fits this sentence is option 3 as it talks about the impact of sleep deprivation on cognitive functions like memory and concentration. The other options do not mention cognitive functions or sleep deprivation.<\/span>\r<br /><span>Hence, [<\/span><span>3<\/span><span>].<\/span>", "topic": "Paragraph Completion"}, {"number": 22, "sourceId": "168672949286621", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br>A few months before he died, Franz Kafka wrote one of his finest and saddest tales. In ‘The Burrow’, a solitary, mole-like creature has dedicated its life to building an elaborate underground home <span>in order to<\/span><span> protect itself from outsiders. ‘I have completed the construction of my burrow and it seems to be successful,’ the protagonist notes at the outset. Quickly, however, the creature’s confidence begins to wane: how can it know if its defences are working? How can it be certain? ‘The Burrow’ seems to serve as a retrospective commentary upon Kafka’s own life. By the time he was diagnosed with tuberculosis at the age of 34, Kafka had already spent two decades worrying about disease.<\/span>", "options": ["<span>‘The burrow’, the finest and the saddest of Kafka’s works, serves as a commentary on Kafka’s own life and his anxieties about his own safety.<\/span>", "<span><\/span>\tThe protagonist of Kafka’s “the Burrow’, is a metaphor for Kafka’s uncertainty about the effectiveness of his own <span>defenses<\/span><span> against disease.<\/span>", "<span><\/span>\tKafka’s “the Burrow” highlights the human tendency to strive for security and safety, but ultimately failing to attain certainty or peace of mind.", "<span><\/span>\t\"The Burrow\" by Kafka is a story about a mole-like creature building a home for protection, but becomes consumed by uncertainty, reflecting Kafka's own anxieties before his death."], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>The best precis is the fourth one, \"The Burrow\" by Kafka is a story about a mole-like creature building a home for protection, but becomes consumed by uncertainty, reflecting Kafka's own anxieties before his death. Option 4 is correct Because it's short, and it's providing the main idea of the passage in a clear, concise, and accurate way. It includes the information about the story, the character, and the connection to Kafka's own life, and it also reflects the main idea of the passage which is the commentary on Kafka's anxieties and fears. Option 1 fails to mention that ‘The Burrow” is an allegory. It has no suggestion about its story (of the mole). Option 1 makes it sound like an autobiography.  Options 2 and 3,&nbsp;<\/span><span>similar to<\/span><span> option 1, talk about the significance of the story without summarising what the passage is about.  Option 2 is incorrect because it talks about Kafka’s ‘<\/span><span>defenses<\/span><span>’ about his disease whereas the passage simply says he worried about it for many years. Option 3 is incorrect because it generalizes the allegory to represent all humans whereas it is a reflection only of Kafka’s life.<\/span>\r<br /><span>Hence, [<\/span><span>4<\/span><span>].<\/span>", "topic": "Summary"}, {"number": 23, "sourceId": "168672949286722", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br><span>People with long COVID syndrome have symptoms such as pain, extreme fatigue and “brain fog,” or difficulty concentrating or remembering things. The syndrome was estimated to affect about 16 million adults in the U.S. and had forced between two million and four million Americans out of the workforce, many of whom have yet to return. The most common, <\/span><span>persistent<\/span><span> and disabling symptoms of long COVID are neurological. The syndrome is still mired in a lot of medical uncertainty. Patients might have one or a combination of the problems investigated so far: Long COVID might be caused by viral particles that persist in the brain or other parts of the nervous system. Or it might be an autoimmune disorder that lasts long after the virus has disappeared. Maybe overactive immune cells continue to perturb the nervous system and nearby blood vessels.<\/span>", "options": ["<span>Long COVID causes fatigue, memory loss, and persistent and disabling neurological disorders; caused by viral particles that persist in the brain or an autoimmune disorder- overactive cells that perturb the nervous system.<\/span>", "<span><\/span>\tMillions of Americans suffer from Long COVID, which causes pain, fatigue, and difficulty remembering things, and its most common symptoms are neurological, the causes of which are still mired in medical controversy.", "<span><\/span>\tLong COVID affects millions of Americans with symptoms such as pain, fatigue, and brain fog, and its most common and disabling symptoms are neurological, but its cause remains uncertain.", "Long COVID affects up to 16 million Americans and has forced millions out of the workforce, and its most persistent symptoms are neurological; its cause might be viral particles in the nervous system or an autoimmune disorder."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t\r<br /><span><b>Points:<\/b><\/span>\r<br /><br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>Long COVID affects millions of Americans with symptoms such as pain, fatigue, and brain fog<\/span><span>.<\/span>\r<br /><br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>its most common and disabling symptoms are neurological<\/span><span>.<\/span>\r<br /><br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>The syndrome is still mired in a lot of medical uncertainty (uncertainty surrounding the cause of<\/span>\r<br /><br />\t<span>Long COVID)<\/span><span>.<\/span>\r<br />\r<br /><span>The best precis of the paragraph is option 3.<\/span>\r<br /><span>Option 1. “caused by” makes the causes certain.<\/span>\r<br /><span>Option 2. “causes of which” seems to refer to only neurological disorders. Also, the word “controversy’ is misleading.<\/span>\r<br /><span>Option 3. Correct. No distortion.<\/span>\r<br /><span>Option 4. Some of the key elements, such as symptoms and the fact that common and disabling symptoms are attributable to neurological causes, are missing.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Summary"}, {"number": 24, "sourceId": "168672949286823", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br><span>More than two millennia before its advent, Socrates and Adeimantus understood something unrecognized by modern economics. Desire and reason are component parts of the human psyche (soul), but a third part, <\/span><span>thymos<\/span><span>, acts completely independently of the first two. <\/span><span>Thymos<\/span><span> is the seat of judgments of worth: General <\/span><span>Leontius<\/span><span> who believed he was above staring at corpses, just as a drug addict wants to be a productive employee or a loving mother. Human beings do not just want things that are external to themselves, such as food, drink, Lamborghinis, or that next hit. They also crave positive judgments about their worth or dignity. Those judgments can come from within, as in <\/span><span>Leontius<\/span><span>’ case, but they are most often made by other people in the society around them who recognize their worth. If they receive that positive judgment, they feel pride, and if they do not receive it, they feel either anger or shame.<\/span>", "options": ["<span>The human psyche consists of three parts: desire, reason, and <\/span><span>thymos<\/span><span>, recognized by Socrates and Adeimantus more than two millennia ago<\/span>;<span> <\/span><span>Thymos<\/span><span>, which was overlooked by modern economics, plays a crucial role in determining judgments of worth, leading to positive emotions like pride, or negative emotions like anger or shame, depending on recognition by others.<\/span>", "<span><\/span>\tSocrates and Adeimantus understood that the human psyche is composed of three parts: desire, reason, and <span>thymos<\/span><span>, which is the seat of judgments of worth and responsible for positive emotions like pride or negative emotions like anger or shame, depending on recognition by others, but ignored by modern economics.<\/span>", "<span><\/span>\t<span>Thymos<\/span><span>, the third component of the human psyche recognized by Socrates and Adeimantus, plays a key role in determining judgments of worth, leading to positive emotions like pride, or negative emotions like anger or shame, depending on recognition by others, while desire and reason play minor roles, but its relevance is not acknowledged by modern economics.<\/span>", "<span><\/span>\tSocrates and Adeimantus understood the role of <span>thymos<\/span><span>, unrecognized by modern economics, as the seat of judgments of worth, in human psychology, which is essential for understanding desire and reason, and their relationship with positive emotions like pride, or negative emotions like anger or shame, depending on recognition by others.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t\r<br /><span><b>Points:<\/b><\/span><span><\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>Socrates and Adeimantus recognized the role of&nbsp;<\/span><span>thymos<\/span><span> in human psychology<\/span><span>.<\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>Thymos<\/span><span> is responsible for judgments of worth that can result in positive emotions such as pride<\/span><span>.<\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>or negative emotions such as anger or shame,<\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>depending on whether they are recognized or not by others.<\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>this understanding is essential for comprehending the relationship between desire, reason, and emotions (Lamborghini example)<\/span>\r<br />\r<br /><span>(<\/span><span>Leontius<\/span><span> example is too historical and must refer to some background history which would render the precis incomprehensible if included, as it makes the paragraph too a little incomprehensible)<\/span>\r<br />\r<br /><span>The best precis is option 4.<\/span>\r<br /><span>Option 1. “which was  overlooked by modern economics” is incorrect. As we understand the passage, modern economics does not know anything of ‘<\/span><span>thymos<\/span><span>’<\/span><span><\/span>\r<br /><span>Option 2. “ignored by modern economics” is incorrect.<\/span>\r<br /><span>Option 3. “but its relevance is not acknowledged by modern economics” is incorrect.<\/span>\r<br /><span>Option 4, Correct. Captures the essence of the paragraph. “Human beings do not just want things that are external to themselves, such as food, drink, Lamborghinis, or that next hit.” Implicitly modern economics would attribute this to desire and reason. The paragraph says that as Socrates and Adeimantus understood that&nbsp;<\/span><span>Thymos<\/span><span> is necessary to understand this desire or reason – because&nbsp;<\/span><span>thymos<\/span><span> makes us “crave positive judgments about their worth or dignity.” Hence the implicitly&nbsp;<\/span><span>thymos<\/span><span> “essential for understanding desire and reason” as option 4 states.<\/span>\r<br />Hence, [4]", "topic": "Summary"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;
function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
