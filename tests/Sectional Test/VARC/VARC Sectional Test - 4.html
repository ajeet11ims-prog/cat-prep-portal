<script type="application/json" id="test-data">{"testNumber": 4, "simcat": 4, "minutes": 40, "questions": [{"number": 1, "sourceId": "16867294928520", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question. <\/b>\r<br>\r<br><span>Mancur<\/span><span> Olson was among the first economists who studied the private provision of public goods in detail: “It is of the essence of an organization that it provides an inseparable, generalized benefit. It follows that the provision of public or collective goods is the fundamental function of organizations generally…. There is no suggestion here that <\/span><span>states<\/span><span> or other organizations provide only public or collective goods. Governments often provide noncollective goods like electric power and they usually sell such goods on the market.”<\/span>\r<br>\r<br><span>The coupling of private and public goods is one mechanism through which private enterprises can be enabled to provide public goods. In the eighteenth century, lighthouses were non-rivalrous and non-excludable public good. But port spaces were private goods. British lighthouses were financed by imposing dues on ship owners at the ports. A public good that is coupled with a private good is called an “impure” public good. Some shopping malls offer common spaces and infrastructure for which shoppers pay through supplements to the merchandise. If charging for parking is too expensive, parking becomes a public good, allowing non-shoppers to use it for free. If a nearby landowner builds a shopping mall without parking, they can offer lower prices and drive out competitors. To avoid this, the first mall owner can buy the surrounding land before free parking is allowed. This is known as \"extending the role of the firm\" to solve externalities.<\/span>\r<br>\r<br><span>Private provision of public goods may occur because people do not always act purely in their self-interest. Economic models often assume that individuals only care about the benefits they receive from a public good, but people also care about how the public good affects others. Donations to charity and political campaigns illustrate this <\/span><span>behavior<\/span><span>. Some models incorporate the notion that the act of giving itself provides additional satisfaction beyond the actual public good provided.<\/span>\r<br>\r<br><span>A third reason for the ability of public goods to be provided privately is the existence of social norms. Social norms can encourage private provision of public goods. That a non-co-operative strategy is not necessarily optimal in repeated games is a well-known result in game theory. In repeated games norms like fairness and equality can increase private contributions. Social norms can motivate people to act altruistically but also help to solve co-ordination problems by specifying property rights and the terms of contracts. Clean streets can be regarded as a public <\/span><span>good, and<\/span><span> let us assume that littering isn’t punishable by law. In a game-theoretic setting, individuals would be expected to underproduce the public good, i.e., to litter too much. A norm not to litter can now help to induce people to co-operate and play the non-Nash equilibrium but Pareto superior strategy. The punishment of norm-violators through social sanctions will help to make people follow the norm without the government having to police norm following.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\tWhich of the following is NOT an implication of the first paragraph?", "options": ["The provision of collective goods is a key responsibility of governments.", "<span><\/span>\tUnemployment, housing, and food assistance are examples of collective goods.", "<span><\/span>\tIt is difficult for private organizations to provide collective goods efficiently.", "<span><\/span>\tOrganizations provide offerings that provide benefits universally to consumers."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>Mancur<\/span><span> Olson: “the provision of public or collective goods is the fundamental function of organizations generally” This implies that not only&nbsp;<\/span><span>governments’<\/span><span> but all organizations’ key responsibility is to provide collective goods. Option 1 is implied.<\/span>\r<br /><span>Option 2. These are noncollective goods because collective goods provide “inseparable, generalized benefit.” The examples provide benefit to selective people. Not implied.<\/span>\r<br /><span>Option 3. Collective goods provide” an inseparable, generalized benefit.”– e.g., public roads are a collective good - a non-<\/span><span>tax payer<\/span><span> cannot be prevented from using it. Private organizations do not have the means or incentive to provide such facilities effectively. Implied.<\/span>\r<br /><span>Option 4. According to&nbsp;<\/span><span>Mancur<\/span><span> Olson, (first paragraph) it is fundamental aspect of “organizations.” (<\/span><span>Organizations are groups of individuals who come together to achieve a common goal. In his analysis of the provision of public goods, Olson emphasized that it is the fundamental function of organizations to provide public or collective goods.)&nbsp;<\/span><span><\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Inference"}, {"number": 2, "sourceId": "16867294928551", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question. <\/b>\r<br>\r<br><span>Mancur<\/span><span> Olson was among the first economists who studied the private provision of public goods in detail: “It is of the essence of an organization that it provides an inseparable, generalized benefit. It follows that the provision of public or collective goods is the fundamental function of organizations generally…. There is no suggestion here that <\/span><span>states<\/span><span> or other organizations provide only public or collective goods. Governments often provide noncollective goods like electric power and they usually sell such goods on the market.”<\/span>\r<br>\r<br><span>The coupling of private and public goods is one mechanism through which private enterprises can be enabled to provide public goods. In the eighteenth century, lighthouses were non-rivalrous and non-excludable public good. But port spaces were private goods. British lighthouses were financed by imposing dues on ship owners at the ports. A public good that is coupled with a private good is called an “impure” public good. Some shopping malls offer common spaces and infrastructure for which shoppers pay through supplements to the merchandise. If charging for parking is too expensive, parking becomes a public good, allowing non-shoppers to use it for free. If a nearby landowner builds a shopping mall without parking, they can offer lower prices and drive out competitors. To avoid this, the first mall owner can buy the surrounding land before free parking is allowed. This is known as \"extending the role of the firm\" to solve externalities.<\/span>\r<br>\r<br><span>Private provision of public goods may occur because people do not always act purely in their self-interest. Economic models often assume that individuals only care about the benefits they receive from a public good, but people also care about how the public good affects others. Donations to charity and political campaigns illustrate this <\/span><span>behavior<\/span><span>. Some models incorporate the notion that the act of giving itself provides additional satisfaction beyond the actual public good provided.<\/span>\r<br>\r<br><span>A third reason for the ability of public goods to be provided privately is the existence of social norms. Social norms can encourage private provision of public goods. That a non-co-operative strategy is not necessarily optimal in repeated games is a well-known result in game theory. In repeated games norms like fairness and equality can increase private contributions. Social norms can motivate people to act altruistically but also help to solve co-ordination problems by specifying property rights and the terms of contracts. Clean streets can be regarded as a public <\/span><span>good, and<\/span><span> let us assume that littering isn’t punishable by law. In a game-theoretic setting, individuals would be expected to underproduce the public good, i.e., to litter too much. A norm not to litter can now help to induce people to co-operate and play the non-Nash equilibrium but Pareto superior strategy. The punishment of norm-violators through social sanctions will help to make people follow the norm without the government having to police norm following.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\tWhich of the following is NOT an externality arising from an ‘impure public good’?", "options": ["<span>Benefits derived from the knowledge developed by R&D of a pharmaceutical firm.<\/span>", "Noise pollution generated by a factory producing goods for public consumption.", "<span><\/span>\tBenefits derived by an individual from having a public park in their residential area.", "<span><\/span>\tGlobal warming caused by accumulation of greenhouse gases due to human activity."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>An impure public good is one wherein the users of a collective good pay for its benefits indirectly. Externalities refer to the unintended costs or benefits that affect people who are not directly involved in the production or consumption of a good or service.<\/span>\r<br /><span>The direct benefits received by an individual due to a public park in a residential area are not an externality since they are the intended beneficiaries of the public good. Public parks cannot even be considered an ‘impure public good.’ Hence option 3 does not meet the criteria.<\/span>\r<br /><span>Options 1, 2 and 4 meet the above criteria of ‘impure public good’ as well as externality.<\/span>\r<br /><span>Hence, [<\/span><span>3<\/span><span>].<\/span>", "topic": "Application Question"}, {"number": 3, "sourceId": "16867294928552", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question. <\/b>\r<br>\r<br><span>Mancur<\/span><span> Olson was among the first economists who studied the private provision of public goods in detail: “It is of the essence of an organization that it provides an inseparable, generalized benefit. It follows that the provision of public or collective goods is the fundamental function of organizations generally…. There is no suggestion here that <\/span><span>states<\/span><span> or other organizations provide only public or collective goods. Governments often provide noncollective goods like electric power and they usually sell such goods on the market.”<\/span>\r<br>\r<br><span>The coupling of private and public goods is one mechanism through which private enterprises can be enabled to provide public goods. In the eighteenth century, lighthouses were non-rivalrous and non-excludable public good. But port spaces were private goods. British lighthouses were financed by imposing dues on ship owners at the ports. A public good that is coupled with a private good is called an “impure” public good. Some shopping malls offer common spaces and infrastructure for which shoppers pay through supplements to the merchandise. If charging for parking is too expensive, parking becomes a public good, allowing non-shoppers to use it for free. If a nearby landowner builds a shopping mall without parking, they can offer lower prices and drive out competitors. To avoid this, the first mall owner can buy the surrounding land before free parking is allowed. This is known as \"extending the role of the firm\" to solve externalities.<\/span>\r<br>\r<br><span>Private provision of public goods may occur because people do not always act purely in their self-interest. Economic models often assume that individuals only care about the benefits they receive from a public good, but people also care about how the public good affects others. Donations to charity and political campaigns illustrate this <\/span><span>behavior<\/span><span>. Some models incorporate the notion that the act of giving itself provides additional satisfaction beyond the actual public good provided.<\/span>\r<br>\r<br><span>A third reason for the ability of public goods to be provided privately is the existence of social norms. Social norms can encourage private provision of public goods. That a non-co-operative strategy is not necessarily optimal in repeated games is a well-known result in game theory. In repeated games norms like fairness and equality can increase private contributions. Social norms can motivate people to act altruistically but also help to solve co-ordination problems by specifying property rights and the terms of contracts. Clean streets can be regarded as a public <\/span><span>good, and<\/span><span> let us assume that littering isn’t punishable by law. In a game-theoretic setting, individuals would be expected to underproduce the public good, i.e., to litter too much. A norm not to litter can now help to induce people to co-operate and play the non-Nash equilibrium but Pareto superior strategy. The punishment of norm-violators through social sanctions will help to make people follow the norm without the government having to police norm following.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\tWhich one of the following statements, if false, could be seen as contradicting the facts/arguments in the passage?", "options": ["<span>Social norms cannot encourage private provision of public goods by increasing private contributions.<\/span>", "<span><\/span>\tPrivate enterprises cannot provide public goods by financing them through the coupling of a public good with a related private good.", "<span><\/span>\tGovernment provision of public goods does not inherently ensure that the good is non-rivalrous and non-excludable.", "<span><\/span>\tOther than just the benefits of public good to themselves, people are not influenced by the outcomes that the public good generates for others."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>If false contradict = The statement&nbsp;<\/span><span>has to<\/span><span> be falsified to contradict the passage. The question is then equal to,&nbsp;<\/span><span>Which statement is in accordance with (does not contradict) the passage?<\/span><span><\/span>\r<br /><span>Option 3 (as it stands) does not contradict the passage. No need to falsify it.<\/span>\r<br /><span>Statements 1, 2, and 4 if falsified will not contradict the passage but support the passage (refer to the last paragraph, second paragraph and third paragraph respectively). Option 3, if falsified would read:  Government provision of public goods inherently ensures that the good is non-rivalrous and non-excludable. Electricity is an example cited in the passage where the government acts like private enterprises to sell it in the market.&nbsp;<\/span><span>So<\/span><span> when the statement is falsified as above, it contradicts the passage.<\/span>\r<br /><span>Hence, [<\/span><span>3<\/span><span>].<\/span>\r<br /><span><\/span>", "topic": "Inference"}, {"number": 4, "sourceId": "16867294928553", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question. <\/b>\r<br>\r<br><span>Mancur<\/span><span> Olson was among the first economists who studied the private provision of public goods in detail: “It is of the essence of an organization that it provides an inseparable, generalized benefit. It follows that the provision of public or collective goods is the fundamental function of organizations generally…. There is no suggestion here that <\/span><span>states<\/span><span> or other organizations provide only public or collective goods. Governments often provide noncollective goods like electric power and they usually sell such goods on the market.”<\/span>\r<br>\r<br><span>The coupling of private and public goods is one mechanism through which private enterprises can be enabled to provide public goods. In the eighteenth century, lighthouses were non-rivalrous and non-excludable public good. But port spaces were private goods. British lighthouses were financed by imposing dues on ship owners at the ports. A public good that is coupled with a private good is called an “impure” public good. Some shopping malls offer common spaces and infrastructure for which shoppers pay through supplements to the merchandise. If charging for parking is too expensive, parking becomes a public good, allowing non-shoppers to use it for free. If a nearby landowner builds a shopping mall without parking, they can offer lower prices and drive out competitors. To avoid this, the first mall owner can buy the surrounding land before free parking is allowed. This is known as \"extending the role of the firm\" to solve externalities.<\/span>\r<br>\r<br><span>Private provision of public goods may occur because people do not always act purely in their self-interest. Economic models often assume that individuals only care about the benefits they receive from a public good, but people also care about how the public good affects others. Donations to charity and political campaigns illustrate this <\/span><span>behavior<\/span><span>. Some models incorporate the notion that the act of giving itself provides additional satisfaction beyond the actual public good provided.<\/span>\r<br>\r<br><span>A third reason for the ability of public goods to be provided privately is the existence of social norms. Social norms can encourage private provision of public goods. That a non-co-operative strategy is not necessarily optimal in repeated games is a well-known result in game theory. In repeated games norms like fairness and equality can increase private contributions. Social norms can motivate people to act altruistically but also help to solve co-ordination problems by specifying property rights and the terms of contracts. Clean streets can be regarded as a public <\/span><span>good, and<\/span><span> let us assume that littering isn’t punishable by law. In a game-theoretic setting, individuals would be expected to underproduce the public good, i.e., to litter too much. A norm not to litter can now help to induce people to co-operate and play the non-Nash equilibrium but Pareto superior strategy. The punishment of norm-violators through social sanctions will help to make people follow the norm without the government having to police norm following.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\tAccording to the last paragraph, what does the \"well-known result in game theory\" suggest about the provision of public goods?", "options": ["<span>Private provision of public goods makes consumers behave in a more cooperative manner than in government provision.<\/span>", "<span><\/span>\tSocial norms and punishment of norm-violators can play an important role in the provision of public goods.", "<span><\/span>\tDecision-making in the provision of public goods should be governed by principles of game theory.", "Social norms of fairness and equality make government provision of public goods preferable to private provision."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>The last paragraph discusses the role of social norms in promoting private provision of public goods. It mentions that social norms can encourage people to act altruistically and help to solve coordination problems by specifying property rights and the terms of contracts. It also gives an example of how a norm against littering can induce people to cooperate and play the non-Nash equilibrium but Pareto superior strategy. Therefore, the \"well-known result in game theory\" mentioned in the paragraph suggests that social norms and punishment of norm-violators can play an important role in the provision of public goods.<\/span>\r<br /><span>Option 1 is incorrect because the paragraph does not compare the cooperative&nbsp;<\/span><span>behavior<\/span><span> of consumers in private provision and government provision of public goods.<\/span>\r<br /><span>Option 3 is incorrect because the paragraph does not suggest that decision-making in the provision of public goods should be governed by principles of game theory. Rather, it uses game theory as an example to illustrate the role of social norms in promoting private provision of public goods.<\/span>\r<br /><span>Option 4 is incorrect because the paragraph does not discuss the relative merits of government provision and private provision of public goods. It only discusses the role of social norms in promoting private provision of public goods.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Inference"}, {"number": 5, "sourceId": "16867294928554", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>The mantra “what doesn't kill you makes you stronger” resonates with many people and ties into a compelling cultural narrative proclaiming that adversity can be a source of strength and opportunity for post-traumatic growth (PTG). Given both the degree and types of adversity individuals confront over the course of their lives, this narrative can be a source of hope and optimism.<\/span><br><br><span>Despite the strong appeal of this narrative, empirical research provides limited evidence that adversity reliably leads to improved psychological functioning. This lack of evidence is due to a host of challenges making this type of research extraordinarily difficult. For example, most research on PTG has employed cross-sectional designs, which are economical and feasible, but potentially reflect post hoc reconstruction of change rather than actual change. Several prospective studies have now found very small (or nonsignificant) correlations between perceived change and actual change. In cross-sectional studies […], it is impossible to know whether such perceived change reflects actual change; participants may misremember their prior state, be influenced by social desirability pressures resulting from the cultural narrative, or they may be motivated to perceive growth where it has not occurred.<\/span><br><br><span>Responses to these methodological challenges proposed that researchers should examine PTG in terms of personality change - changes in any set of “relatively enduring patterns of thoughts, feelings, and <\/span><span>behaviors<\/span><span> that reflect the tendency to respond in certain ways under certain circumstances”…Given that theories of PTG frame the phenomenon in terms of personality change, it should be evaluated in those terms… Doing so opens a set of interesting questions that can be answered through a personality framework. Adopting a personality framework allows us to examine whether changes in people's life narratives or changes in momentary manifestations of thoughts, feelings, and <\/span><span>behavior<\/span><span> following the experience of adversity lead to changes in specific personality traits…<\/span><br><br><span>Examining PTG in terms of personality change can also help clarify theoretical claims. For example, some PTG theories claim that PTG reflects enduring changes in meaning and purpose. Dynamic personalities theories claim that meaningful and lasting changes in <\/span><span>behaviors<\/span><span> are likely driven by changes in specific goals e.g., someone becoming more generative and care-oriented after the experience of taking care of a sick loved one. Given that people typically report PTG immediately following the experience of an adverse event, these immediate changes can be better <\/span>conceptualized as short-term coping that may or may not lead to long-term growth depending on changes in those goals.<br><br><span>An additional benefit of examining PTG in terms of personality change is that it affords the examination of what type of change is most likely to occur in the wake of adversity. PTG may consist of changes in goals (i.e., the “doing” side of personality) that subsequently lead to changes in characteristic thoughts, feelings, and <\/span><span>behaviors<\/span><span> (the “having” side of personality). However, some personality changes following adversity may be best characterized as changes in how an individual narrates their life (the “being” side of personality). Understanding the “level” of personality at which PTG occurs, the benefits of such change, and the extent to which PTG occurs across multiple “levels” of personality can help illuminate how life events impact personality and broader developmental outcomes across the lifespan.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\tWhich of the following statements best captures the main argument of the passage?", "options": ["<span>Studying personality trait changes will help researchers understand PTG's extent and impact on lifelong development.<\/span>", "<span><\/span>\tThe current narrative that adversity can lead to PTG is not well supported by empirical research, which faces methodological challenges.", "<span><\/span>\tExamining PTG in terms of personality change can help to clarify theoretical claims and allow for a more nuanced understanding of the types of change that occur following adversity.", "<span><\/span>\tThe experience of adversity leads to short-term coping, which may or may not lead to long-term growth depending on changes in specific goals"], "answer": 2, "answerLabel": "C", "solution": "<span>Option 1. The passage does not focus on the extent and impact of PTG on lifelong development. While the passage briefly mentions that examining PTG in terms of personality change can help illuminate how life events impact personality and broader developmental outcomes across the lifespan, this is not the main argument of the passage.<\/span>\r<br /><span>Option 2, It is only partially correct, as the passage does acknowledge that the current narrative of adversity leading to PTG is not well supported by empirical research due to methodological challenges. However, this is not the main argument of the passage, which focuses on the proposed solution of examining PTG in terms of personality change.<\/span>\r<br /><span>Option 3. Correct. It best captures the main argument of the passage. The passage discusses the challenges of studying post-traumatic growth (PTG) and proposes examining PTG in terms of personality change as a solution. This allows for a more nuanced understanding of the types of change that occur following adversity and helps to clarify theoretical claims about PTG.<\/span>\r<br /><span>Option 4. It oversimplifies the relationship between adversity, short-term coping, and long-term growth. While the passage does mention that short-term coping may or may not lead to long-term growth depending on changes in specific goals, this is not the main argument of the passage.<\/span>\r<br /><span>Hence, [<\/span><span>3<\/span><span>].<\/span>", "topic": "Central Idea"}, {"number": 6, "sourceId": "16867294928565", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>The mantra “what doesn't kill you makes you stronger” resonates with many people and ties into a compelling cultural narrative proclaiming that adversity can be a source of strength and opportunity for post-traumatic growth (PTG). Given both the degree and types of adversity individuals confront over the course of their lives, this narrative can be a source of hope and optimism.<\/span><br><br><span>Despite the strong appeal of this narrative, empirical research provides limited evidence that adversity reliably leads to improved psychological functioning. This lack of evidence is due to a host of challenges making this type of research extraordinarily difficult. For example, most research on PTG has employed cross-sectional designs, which are economical and feasible, but potentially reflect post hoc reconstruction of change rather than actual change. Several prospective studies have now found very small (or nonsignificant) correlations between perceived change and actual change. In cross-sectional studies […], it is impossible to know whether such perceived change reflects actual change; participants may misremember their prior state, be influenced by social desirability pressures resulting from the cultural narrative, or they may be motivated to perceive growth where it has not occurred.<\/span><br><br><span>Responses to these methodological challenges proposed that researchers should examine PTG in terms of personality change - changes in any set of “relatively enduring patterns of thoughts, feelings, and <\/span><span>behaviors<\/span><span> that reflect the tendency to respond in certain ways under certain circumstances”…Given that theories of PTG frame the phenomenon in terms of personality change, it should be evaluated in those terms… Doing so opens a set of interesting questions that can be answered through a personality framework. Adopting a personality framework allows us to examine whether changes in people's life narratives or changes in momentary manifestations of thoughts, feelings, and <\/span><span>behavior<\/span><span> following the experience of adversity lead to changes in specific personality traits…<\/span><br><br><span>Examining PTG in terms of personality change can also help clarify theoretical claims. For example, some PTG theories claim that PTG reflects enduring changes in meaning and purpose. Dyn orrect. The author points out that cross sectional designs have not produced evidence of PTG and that there are methodological inadequacies.&nbsp;<\/span><span>So<\/span><span> the author is not likely to support this option.&nbsp;<\/span>\r<br /><span>Option 2.  Incorrect. Among other details present throughout the passage the author quotes “… relatively enduring patterns of thoughts, feelings, and&nbsp;<\/span><span>behaviors<\/span><span> that reflect the tendency to respond in certain ways under certain circumstances”…Given that theories of PTG frame the phenomenon in&nbsp;<\/span>terms of personality change, it should be evaluated in those terms”. This makes option 2 agreeable to the author.\r<br /><span>Option 3.  Incorrect. This will be agreeable to the author because: “Adopting a personality framework allows us to examine whether changes in people's life narratives or changes in momentary manifestations of thoughts, feelings, and&nbsp;<\/span><span>behavior<\/span><span> following the experience of adversity lead to changes in specific personality traits…”<\/span>\r<br /><span>Option 4. Incorrect. Since the author points out that the retrospective reconstruction of PTG may be compromised by cultural pressures, the author would be agreeable to evaluate the dominant culture that may influence retrospective construction of life narratives.<\/span>\r<br /><span>Hence, [<\/span><span>1<\/span><span>].<\/span>", "topic": "Inference"}, {"number": 9, "sourceId": "16867294928568", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>A gradient indicates a variation of any parameter, such as the degree of inclination of a plane; in physics, the rate at which, for example, pressure or temperature vary in space or time; in chemistry, a gradient can be identified as the variation of electro-chemical potential differences between two bodies; in biology, a gradient can be considered as the progressively increasing or decreasing differences in the growth rate, metabolism, physiological activity of a cell, organ or organism. Several gradients of parameters acting together with different times and rates on systems with a large number of <\/span><span>degree<\/span><span> of freedom can determine non-linearity, chaos and self-organization that can ultimately evolve into catastrophic collective <\/span><span>behaviors<\/span><span>.<\/span><br><br><span>A gradient generates forces producing or being the expression of a difference of a certain physical observable in time or space. Earth hosts Life because of the mobility of its mantle, thermal gradients inducing volcanic eruptions and velocity differences among crustal volumes provoking faulting, mountain growth and ocean spreading.<\/span><br><br>What is the nature of these planetary gradients? How can we study them and how do they punctuate Earth dynamics? Each gust of wind is determined by atmospheric pressure gradient: areas where atmospheric pressure is greater push air toward areas of lower pressure. The greater the gradient, the faster the winds. Cyclones, tornadoes, <span>rain<\/span><span> and snow are controlled by those gradients. For analogous reasons, in the two hemispheres, the Coriolis force plays <\/span><span>opposite<\/span><span> and the linear velocity gradient induces clockwise or counter<\/span><span> <\/span><span>clockwise atmospheric circulation. Rivers flow downstream because of a topographic gradient and therefore a gravitational one: gravity never stops working. Atmospheric disturbances determine heavy rains, which in turn lower the friction in the soil and rocks, causing landslides: it is a succession of gradients that shape the Earth’s surface, with a tendency to decrease or eliminate morphological irregularities.<\/span><br><br><span>Volcanoes erupt violently because inside the magma chambers, where the lava accumulates and melts the embedded rocks, pressure gradients are created that break through the overlying Earth’s crust. The density gradient that is generated for the thermal expansion of molten rocks contributes to the ascent of magma together with gas bubble coalescence that, as soon as reaches the surface, finds an opposite gradient producing lava flows on the sides of the volcanic apparatus, or disperses with pyroclastic clouds. The higher is the viscosity of magmas, the greater is the pressure gradient that manages to accumulate, and the viscosity generally tends to increase with the silica content of the magma. The higher the magma viscosity, the greater the explosiveness and the episodic nature of volcanism: this is an example of chemical gradient affecting geophysical dynamics.<\/span><br><br><span>Gradients are determined by variations in pressure, temperature, chemical and mineralogical composition, friction, rigidity, viscosity, electromagnetic field, etc. The greatest the gradient, the largest the energy involved, yielding a wide range of manifestations at different spatial and temporal scales. The surface of the Earth is featured by complex geological patterns produced by both endogenous and exogenous events playing as a mirror of phenomena acting since the dawn of our planet. The lack of direct investigations still makes Earth interior poorly understood <\/span><span>and also<\/span><span> prevents complete clarification of peculiar mechanisms ruling geodynamics and related phenomena. For the same reason, the effective roles of the different forces contributing to plate tectonics remain elusive.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\tAll of the following can be inferred from the first paragraph EXCEPT:", "options": ["<span>Gradients can be caused by different factors acting independently in a system.<\/span>", "Interdependent factors in a system can influence each other in non-linear ways.", "<span><\/span>\tNon-linearity in a system leads to inevitable catastrophic collective behaviour.", "<span><\/span>\tGradient means an increase or decrease in some parameter in space and time."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>Option 1 is factually correct and can be inferred from paragraph 1, as the paragraph mentions that gradients can be caused by variations in physical observables such as pressure, temperature, and chemical composition.&nbsp;<\/span>Not an exception.\r<br /><span>Option 2 can also be inferred from paragraph 1, as the paragraph discusses how different gradients can act together with different times and rates to determine non-linearity, chaos, and self-organization in a system.&nbsp;<\/span>Not an exception.\r<br /><span>Option 3,&nbsp;<\/span>Exception<span>. In statement 3, the word ‘inevitable’ is problematic. Non-linearity in a system does not always lead to catastrophic collective&nbsp;<\/span><span>behavior<\/span><span>. Sometimes, it can lead to self-organization and complex patterns. Therefore, option 3 is the correct answer.<\/span>\r<br /><span>Option 4 is also factually correct and can be inferred from the paragraph, as the paragraph defines gradient as a variation in physical observables in space and time.&nbsp;<\/span>Not an exception.\r<br /><span>Hence, [<\/span><span>3<\/span><span>].<\/span>", "topic": "Inference"}, {"number": 10, "sourceId": "16867294928579", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>A gradient indicates a variation of any parameter, such as the degree of inclination of a plane; in physics, the rate at which, for example, pressure or temperature vary in space or time; in chemistry, a gradient can be identified as the variation of electro-chemical potential differences between two bodies; in biology, a gradient can be considered as the progressively increasing or decreasing differences in the growth rate, metabolism, physiological activity of a cell, o
