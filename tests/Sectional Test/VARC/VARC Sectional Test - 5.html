s"}, {"number": 19, "sourceId": "168777154141018", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span><b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><\/span><br><br><span>1.<\/span>\t<span>This, according to Kant, is the freedom of any form of art, but we don’t need to visit a museum <\/span><span>in order to<\/span><span> be absorbed in artful perception and contemplation.<\/span><br><span>2.<\/span>\t<span>The art of walking is antithetical to ‘screening’ the world we live in - to live with eyes on the screen - and there is no pre-programmed set of rules or calculations involved.<\/span><br><span>3.<\/span>\t<span>We can just step out the front door, pay attention, and perceive and feel for ourselves.<\/span><br><span>4.<\/span>\t<span>Walking, simply for the sake of a walk, can be a brief respite in our otherwise frenetic lives, allowing us to detach so we might see life for ourselves again, not unlike a child does.<\/span><br><br><span>", "options": [], "answer": "2413", "answerLabel": "2413", "solution": "<\/span>\t<span>Sentence 1. ‘This according to Kant…’ rules it out as the starter. Some other sentence would suggest what ‘the freedom of any art’ probably is.<\/span>\r<br /><span>Sentence 2. Good as the starter. Introduces a contemporary issue – walk rather than screen. 2-1 also looks like a possibility.<\/span>\r<br /><span>Sentence 3. Appears related to both 1 and 2.<\/span>\r<br />Sentence 4. Good as the starter. Appears related to 1 and 3.\r<br /><span>Since we can begin with 4 or 2, we get two almost equally good sequences: 4123 and 2413.<\/span>\r<br /><span>In both possible sequences, 4-1 is paired, and 3 closes the paragraph.  1-2 is jarring, - “we don’t need to visit a museum” followed by “the art of walking is antithetical to screening”.  But, “but we don’t need to visit a museum…” and “We can just step out the front door, pay attention…” is smooth. So 2413 is better.<\/span>\r<br /><span>Therefore, the required answer is 2413.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 20, "sourceId": "168777154141119", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span><b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><\/span><br><br><span><b>Sentence:<\/b><\/span><span> <\/span><br><span>Now the creature represents extinction itself—you can’t get deader than a dodo.<\/span><br><br><span><b>Paragraph:<\/b><\/span><br><span> _____1____. In the world of extinct animals, the dodo carries some heavy symbolic weight. Native to Mauritius in the Indian Ocean, it went extinct in the mid-to-late 17th century, after humans arrived on the island. _____2____. The ungainly bird, which stood around one meter tall and weighed about 15 to 20 kilograms, represents a particular kind of evolutionary misfortune: It should have been afraid of humans, but it wasn’t. _____3____. The birds blithely walked up to sailors, so received history goes, and didn’t flinch as their peers were killed around them. The <\/span><span>dodoes<\/span><span>, which reproduced by laying a single egg on the ground, were also predated by other species, such as monkeys and rats, which humans brought with them. _____4____.<\/span>", "options": ["<span>Option 1<\/span>", "<span><\/span>\t<span>Option 2<\/span>", "<span><\/span>\t<span>Option 3<\/span>", "<span><\/span>\t<span>Option 4<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>Now the creature in the sentence cannot start the paragraph. It will be inappropriate in blank 1. Blank 2 looks like a possibility<\/span><span> but it does not seem to connect well before 3. Moreover<\/span><span>, even without a sentence in blank 2, the narrative is fine. Sentences before and after blank 3 do not need a connector. The key sentence works fine as a conclusion in blank 4.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Paragraph Completion"}, {"number": 21, "sourceId": "168777154141320", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<p><span><strong>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/strong><\/span><br /><br /><span><strong>Sentence:<\/strong><\/span><span> <\/span><br /><span>The slowdown could change how rapidly the entire planet spins, as well as influence how the core evolves with time.<\/span><\/p>\n<p><br /><span><strong>Paragraph:<\/strong><\/span><br />The spin of Earth&rsquo;s inner core may have slowed, with the heart of the planet now rotating at a slightly more sluggish clip than the layers above, new research finds. _____1____. For the new study, published in the journal Nature Geoscience, scientists used a database of earthquakes to probe the <span>behavior<\/span><span> of Earth&rsquo;s solid inner core over time. _____2____. The inner core sits suspended like a ball bearing in the molten-metal ocean of the outer core. Because of this liquid cocoon, the &ldquo;ball bearing&rdquo; may not spin at the same rate as the rest of the planet. _____3____. Over the years, some researchers have found that the core rotates slightly faster than the mantle and crust, a condition called &ldquo;super rotation.&rdquo; _____4____. But studies have not returned consistent numbers.<\/span><\/p>", "options": ["<span><\/span>\t<span>Option 1<\/span>", "<span><\/span>\t<span>Option 2<\/span>", "<span><\/span>\t<span>Option 3<\/span>", "<span><\/span>\t<span>Option 4<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span>The key sentence talks about the effect of the slowdown (of the core of the earth). The sentence before blank 1 introduces the topic and the one after the blank speaks more of the new study- the discovery – its effect – and how the discovery happened is logical. Hence the key sentence fits in blank 1. Blank 2 interrupts the flow, hence it is eliminated. Blank 3 can be considered but the sentence after blank 3 does not share the idea of slowdown. Blank 4, similar to 2 is an interruption.<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Paragraph Completion"}, {"number": 22, "sourceId": "168777154141421", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span><b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><\/span><br><br><span>There are fair reasons to mistrust knowledge and those who have it. It can be (and is) used to gatekeep, to exclude those who lack it – that is, those who lack the background, <\/span><span>education<\/span><span> or life circumstances necessary to have acquired it. More fundamentally, there are problems with competitive hierarchies of knowledge in which certain knowledge forms or learning traditions are privileged or elbowed out, with concomitant impacts on justice and representation across a host of socio-political variables (class, ethnicity, <\/span><span>sex<\/span><span> and culture among them). It can also be hard not to track the obvious connections – historical, cultural, though perhaps not inevitable – between identification, collection, <\/span><span>colonialism<\/span><span> and plunder.<\/span>", "options": ["<span>Valid reasons to mistrust knowledge and those who possess it exist, as it can be used to exclude hosts of socio-political classes and to reinforce hierarchies leading to issues of justice and representation, colonialism, and plunder.<\/span>", "<span><\/span>\t<span>It is fair to mistrust knowledge and those who have it, as it can be used to exclude and reinforce hierarchies leading to issues of justice and <\/span><span>representation, and<\/span><span> is historically connected to colonialism and exploitation.<\/span>", "<span><\/span>\t<span>There are reasons to mistrust knowledge and those who have it, as knowledge has been used to marginalize and subjugate socio-political groups, as in colonialism, leading to injustice, <\/span><span>misrepresentation<\/span><span> and exploitation.<\/span>", "<span>Knowledge has been misused to exclude socio-political variables of class, <\/span><span>ethnicity<\/span><span> and sex, and to reinforce hierarchies in society, leading to issues of justice and representation, with connections to colonialism and exploitation.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<p><span><strong>Points<\/strong><\/span> <br /><span>&middot;<\/span><span>&nbsp;<\/span> <span>There are reasons to mistrust knowledge and those who have it<\/span><span>.<\/span> <br /><span>&middot;<\/span><span>&nbsp;<\/span> <span>Knowledge can be, and is, used to exclude people who lack it.<\/span> <br /><span>&middot;<\/span><span>&nbsp;<\/span> <span>It leads to issues of justice and representation and reinforces hierarchies across socio-political classes.<\/span> <br /><span>&middot;<\/span><span>&nbsp;<\/span> <span>There are historical connections between knowledge, colonialism, and plunder.<\/span> <br /><br /><span>Option 1. &ldquo;leading to issues of justice and representation, colonialism, and plunder,&rdquo; is problematic.<\/span> <br /><span>Option 2. &ldquo;it is fair to mistrust&rdquo; is problematic, and &ldquo;it can be used to exclude and reinforce hierarchies&rdquo; is ambiguous ( does it&nbsp;<\/span><span>exclude<\/span><span> hierarchies?).<\/span> <br />Option 3. Includes all the main points. <br /><span>Option 4. Good precis. But it is too categorical, as it does not suggest&nbsp; why all this is a reason to mistrust knowledge and those who have it. Otherwise<\/span><span>,<\/span><span> it is a good precis.<\/span> <br /><span>Hence, [3].<\/span><\/p>", "topic": "Summary"}, {"number": 23, "sourceId": "168777154141522", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span><b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><\/span><br><br><span>A radical reformulation in the educational universe has taken place in our midst. It has slowly tilted away from its original mission of transforming and improving the inner <\/span><span>fiber<\/span><span> of young people. It used to be understood that because life is difficult, because success is fleeting, because relationships are enigmatic, and because our bodies and minds constantly disappoint us, a good life requires strength in <\/span><span>all of<\/span><span> its forms—moral, physical, intellectual. We can successfully confront the world by improving ourselves. However, this view is now passé in the world of therapeutically politicized education. Now, instead of changing what’s inside our children, we are expected to alter and soften the outer world they <\/span><span>have to<\/span><span> confront. We are expected to make the world as pleasant and simple and amenable as possible. Classrooms have become emotive enclaves of a stark student-<\/span><span>centered<\/span><span> universe.<\/span>", "options": ["<span><\/span>\t<span>Education has shifted away from its mission of improving the inner <\/span><span>fiber<\/span><span> of young people, instead focusing on altering the outer world to make it more pleasant for them.<\/span>", "<span><\/span>\t<span>Education has moved away from personal development to altering the world to make it more pleasant for students, resulting in emotive and student-<\/span><span>centered<\/span><span> classrooms.<\/span>", "<span><\/span>\t<span>Education is no longer focused on the young people who confront a difficult world, but on making the world more pleasant, resulting in emotive and student-<\/span><span>centered<\/span><span> classrooms.<\/span>", "<span><\/span>\t<span>Education has shifted away from its original goal of helping the students succeed in a difficult world to a focus on altering the world to make it softer and simpler.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<p><span><strong>Points<\/strong><\/span> <br /><span>&middot;<\/span><span>&nbsp;<\/span> <span>Education has moved away from its original mission of improving the inner&nbsp;<\/span><span>fiber<\/span><span> of young people<\/span><span>.<\/span> <br /><span>&middot;<\/span><span>&nbsp;<\/span> <span>The mission was to prepare them to confront the difficult world outside.<\/span> <br /><span>&middot;<\/span><span>&nbsp;<\/span> <span>The focus is now on altering the outer world to make it more pleasant for students<\/span><span>.<\/span> <br /><span>&middot;<\/span><span>&nbsp;<\/span> <span>Classrooms have become emotive and student-<\/span><span>centered<\/span><span>.<\/span> <br /><br /><span>Option 1. Best precis.<\/span> <br /><span>Option 2. The shift from &lsquo;inner&rsquo; to outer&rsquo; is clearly brought out in 1. Details about &lsquo;emotive and student<\/span><span>-<\/span><span>c<\/span><span>e<\/span><span>ntered<\/span><span> classrooms&rsquo; is a part of the shift included in &lsquo;education&rsquo;- unnecessary to repeat.<\/span> <br /><span>Option 3.&nbsp; &ldquo;no longer focused on the young people who confront a difficult world,&rdquo; is not as clear and succinct as option 1.<\/span><span>It can be problematic in its implication that in the past education was focused only on young people who faced a difficult world.<\/span> <br /><span>Option 4. The &lsquo;inner&rsquo; vs. outer focus is missed.<\/span> <br /><span>Hence, [1].<\/span><\/p>", "topic": "Summary"}, {"number": 24, "sourceId": "168777154141723", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span><b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><\/span><br><br><span>In a society now dominated by reassuringly reductive tweets and memes, where supposedly learned people choose to boycott long-form podcasts, encourage publishers to ditch books by controversial authors, or lean on streaming providers to sever ties with comedians and other artists, author Ray Bradbury’s prediction published in his 1953 book<\/span><span> Fahrenheit 451<\/span><span>, that people, disturbed by confusing or challenging ideas, might one day demand censorship for themselves and protection <\/span>from any information that pierced the veil of their own simplified reality sounds eerily familiar. The Internet places an impossibly vast array of information at our fingertips, yet our apps allow us to pick and choose which facts to believe and which ideological silos we wish to inhabit. And from those choices comes the inevitable desire to stamp out contrary ideas that make us uncomfortable.", "options": ["<span>In a society dominated by tweets and memes, people’s desire to force out contrary ideas, books, and artists and comedians reminds one of Bradbury's <\/span><span>prediction<\/span><span> in 1953 that people may demand censorship for themselves when confronted by uncomfortable ideas.<\/span>", "<span><\/span>\t<span>Bradbury's prediction in \"Fahrenheit 451\" that people may demand censorship for themselves sounds familiar <\/span><span>in today's society<\/span><span>, where people choose to boycott long-form podcasts or lean on streaming providers to sever ties with comedians and other artists.<\/span>", "<span><\/span>\t<span>Ray Bradbury's prediction of censorship and protection from challenging ideas in \"Fahrenheit 451\" resonates <\/span><span>in today's society<\/span><span> where people choose to limit exposure to diverse and opposing ideas available on the internet which makes them uncomfortable.<\/span>", "<span><\/span>\t<span>People may demand censorship and protection from challenging ideas, as predicted by Ray Bradbury's \"Fahrenheit 451\", due to the ease of choosing and siloing information on the internet, leading to a desire to stamp out contrary and uncomfortable ideas.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t\r<br /><span><b>Points:<\/b><\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>Today’s society is dominated by tweets and memes.<\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>We choose what to believe from the vast internet.<\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>We want contrary ideas, artists etc. to be stopped from making us uncomfortable.<\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>In such situations people may demand censorship for themselves.<\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\t<span>This reminds one of Ray Bradbury’s&nbsp;<\/span><span>predictions<\/span><span> in 1953 in “Fahrenheit 451.”<\/span>\r<br />\r<br /><span>The story is that the internet provides vast amounts of information, we choose our narrow points of view and simplify our thoughts and live by short tweets and memes. We become uncomfortable with anything long and complex and contrary – long podcasts, books, artists, comedians all fall in this class. We boycott them, ban them. We start asking for censorship ourselves, from this uncomfortable stuff. Ray Bradbury in his book Fahrenheit 451 had predicted the same thing in 1953.<\/span>\r<br />\r<br /><span>Options 1 and 2 among other things do not quite specify the internet. ‘Remind one of…’&nbsp;<\/span><span>in option 1&nbsp;<\/span><span>lacks the impact of the prediction.<\/span><span>Option 2 does not state that people boycott because they are uncomfortable with complex or contrary information.<\/span>\r<br /><span>Option 3 is less detailed. The reason for limiting exposure is not clear.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Summary"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;
function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
