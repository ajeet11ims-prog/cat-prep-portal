<script type="application/json" id="test-data">{"testNumber": 5, "simcat": 5, "minutes": 40, "questions": [{"number": 1, "sourceId": "16877715413980", "type": "mcq", "passage": "<p><strong>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/strong><\/p>\n<p><br />There is a widespread conviction among literary scholars that there is no such thing as a great book. Better put, [&hellip;] there is no basis upon which one can make generalisable judgments about the greatness of a book. The claim extends to works of art in general. At first sight, this may sound odd &ndash; what are museums for, if not to single out and display works that command special attention? <br /><br />But the challenge to the idea of &lsquo;greatness&rsquo; &ndash; the challenge to assigning hierarchical value to cultural expressions &ndash; isn&rsquo;t as preposterous as it might first appear. If, for example, one points to the aesthetic qualities of a work, one must reckon with the fact that aesthetic quality is notoriously difficult to pin down, and that attempts going back to antiquity have failed to give us an objective standard by which to judge. Moreover, aesthetic judgments can easily boil down to individual preferences, which, though perhaps finely attuned to prevailing social norms, are actually the result of particular kinds of education. In other words, it&rsquo;s hard to extricate aesthetic value from cultural &ndash; and aristocratic &ndash; prejudice. <br /><br />One might also justify the judgment of greatness in a book or work of art by pointing to its influence on a tradition of thought or to its impact on how we have come to see the world. In that case, a theoretically sophisticated sceptic might argue that such value judgments point not to anything intrinsic in the work, but to a historically contingent configuration of social power, which, the conscientious critic might add, is inextricable from forms of oppression, exclusion and domination present in our contemporary world. In this critical reading, the elite forms of cultural power embodied in values of &lsquo;greatness&rsquo; are undergirded by the exploitation and dehumanisation of &lsquo;the other&rsquo;. <br /><br />These anti-foundational critiques of &lsquo;greatness&rsquo; carry the high-voltage implication that any hierarchy of artistic value is probably complicit in moral corruption. Up-and-coming scholars who endorse the particular value of certain works, especially canonical ones, do so at their own career-ending peril. In contemporary literary scholarship, it&rsquo;s better to stick to critique &ndash; all the more so when it comes to old books. <br /><br />But without minimising the insights of critical theory, we can contain its paralysing force by eschewing any effort to define a great book &ndash; or a classic &ndash; with reference to some defining essence, whether aesthetic, ideological or historical. We can simply survey the bodies of texts that have come down to us in our few thousand years of written records and note that certain works, and not others, have demonstrated a capacity to illuminate the lives of many different kinds of people in many different historical circumstances. These works somehow transcended the conditions of their own creation &ndash; they spoke within their time, but also beyond it. I don&rsquo;t need to understand much &ndash; or anything, really &ndash; about the political struggles of 14th-century Florence, ubiquitous as they are in Dante&rsquo;s Divine Comedy, to have that work inspire deeper reflection of my own humanity, beginning with its invocation of an individual reaching a crisis point in the life journey we all travel.<\/p>", "passageTitle": "q1-4", "question": "<p>Which of the following is the main argument of the passage?<\/p>", "options": ["<p>Instead of trying to define the greatness of books by some essential feature, we can evaluate them based on their ability to inspire people across different time periods and cultures.<\/p>", "<p>The idea of greatness in works of art is challenged by the fact that aesthetic quality is difficult to pin down and that aesthetic judgments can easily boil down to individual preferences.<\/p>", "<p>Greatness in a book or work of art that is based on its influence on a tradition of thought has a history of privilege, and configuration of social oppression, exclusion, and domination.<\/p>", "<p>Great books or art provides the oppressed and the &lsquo;dehumanized&rsquo; access to the cultural wealth that is the exclusive purview of the elite, and the tools to subvert the social hierarchies.<\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p>Main Argument: The main argument of the passage is that literary scholars have a widespread conviction that there is no such thing as a great book. The idea of greatness is challenged by 1. Aesthetic quality is difficult to define 2.&nbsp; Aesthetic judgments are subjective and influenced by social norms and cultural prejudices. The passage suggests that instead of trying to define a great book or classic with reference to some defining essence, we can simply survey the bodies of texts that have come down to us and note that certain works have demonstrated a capacity to illuminate the lives of many different kinds of people in many different historical circumstances. <br />Option 1. Correct. <br />Option 2. Repeats a sentence from the passage &ndash; but it does not capture the main argument. <br />Option 3. Repeats an idea from the passage &ndash; but not the main idea. <br />Option 4. Beyond the scope of the passage. Nothing to this effect is stated or implied in the passage. <br />Hence, [1].<\/p>", "topic": "Central Idea"}, {"number": 2, "sourceId": "16877715414011", "type": "mcq", "passage": "<p><strong>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/strong><\/p>\n<p><br />There is a widespread conviction among lit rinsic in the work, but to a historically contingent configuration of social power, which, the conscientious critic might add, is inextricable from forms of oppression, exclusion and domination present in our contemporary world. In this critical reading, the elite forms of cultural power embodied in values of &lsquo;greatness&rsquo; are undergirded by the exploitation and dehumanisation of &lsquo;the other&rsquo;. <br /><br />These anti-foundational critiques of &lsquo;greatness&rsquo; carry the high-voltage implication that any hierarchy of artistic value is probably complicit in moral corruption. Up-and-coming scholars who endorse the particular value of certain works, especially canonical ones, do so at their own career-ending peril. In contemporary literary scholarship, it&rsquo;s better to stick to critique &ndash; all the more so when it comes to old books. <br /><br />But without minimising the insights of critical theory, we can contain its paralysing force by eschewing any effort to define a great book &ndash; or a classic &ndash; with reference to some defining essence, whether aesthetic, ideological or historical. We can simply survey the bodies of texts that have come down to us in our few thousand years of written records and note that certain works, and not others, have demonstrated a capacity to illuminate the lives of many different kinds of people in many different historical circumstances. These works somehow transcended the conditions of their own creation &ndash; they spoke within their time, but also beyond it. I don&rsquo;t need to understand much &ndash; or anything, really &ndash; about the political struggles of 14th-century Florence, ubiquitous as they are in Dante&rsquo;s Divine Comedy, to have that work inspire deeper reflection of my own humanity, beginning with its invocation of an individual reaching a crisis point in the life journey we all travel.<\/p>", "passageTitle": "q1-4", "question": "<p>&ldquo;These anti-foundational critiques of &lsquo;greatness&rsquo; carry the high-voltage implication that any hierarchy of artistic value is probably complicit in moral corruption.&rdquo; (Paragraph 4)<br /><br />In the context of the passage, which one of the following observations is a valid conclusion to draw from the statement?<\/p>", "options": ["<p>By assigning value or hierarchy to certain works of art or books, we are also perpetuating systems of oppression and exclusion.<\/p>", "<p>The way the &lsquo;great&rsquo; books&nbsp;change our perspective and understanding can be used as a way to determine its moral greatness.<\/p>", "<p>By assigning to a hierarchy, the works acquire an impact that goes beyond the time they were created and have lasting impact on morality.<\/p>", "<p>The anti-foundational critique of &lsquo;greatness&rsquo; expects us to express positive judgments about certain works, especially the literary canon. <span> <\/span><\/p>"], "answer": 0, "answerLabel": "A", "solution": "<p>&ldquo;These anti-foundational critiques&hellip;&rdquo; refer to the third paragraph: The anti-foundational critiques mentioned in the third paragraph is that 1. &lsquo;greatness&rsquo; is not intrinsic to the work but rather a historically contingent configuration of social power. 2. such value judgments (greatness) are undergirded by forms of oppression, and&nbsp;exploitation and dehumanisation of &lsquo;the other&rsquo;. So, the moral corruption mentioned in the fourth paragraph refers to oppression and exclusion. Since the quoted sentence says &lsquo;complicit in moral corruption&rsquo;, we become accomplices in the perpetuation of the oppression etc. <br />Option 1. Correct. <br />Option 2. There is no way to determine the moral greatness of a book or art. <br />Option 3. The critique is that there can be no basis for assigning books to a hierarchy or its lasting impact on morality.Moreover, it is not related to the question. <br />Option 4. There is no expectation of positive judgments coming from  contemporary world. In this critical reading, the elite forms of cultural power embodied in values of &lsquo;greatness&rsquo; are undergirded by the exploitation and dehumanisation of &lsquo;the other&rsquo;. <br /><br />These anti-foundational critiques of &lsquo;greatness&rsquo; carry the high-voltage implication that any hierarchy of artistic value is probably complicit in moral corruption. Up-and-coming scholars who endorse the particular value of certain works, especially canonical ones, do so at their own career-ending peril. In contemporary literary scholarship, it&rsquo;s better to stick to critique &ndash; all the more so when it comes to old books. <br /><br />But without minimising the insights of critical theory, we can contain its paralysing force by eschewing any effort to define a great book &ndash; or a classic &ndash; with reference to some defining essence, whether aesthetic, ideological or historical. We can simply survey the bodies of texts that have come down to us in our few thousand years of written records and note that certain works, and not others, have demonstrated a capacity to illuminate the lives of many different kinds of people in many different historical circumstances. These works somehow transcended the conditions of their own creation &ndash; they spoke within their time, but also beyond it. I don&rsquo;t need to understand much &ndash; or anything, really &ndash; about the political struggles of 14th-century Florence, ubiquitous as they are in Dante&rsquo;s Divine Comedy, to have that work inspire deeper reflection of my own humanity, beginning with its invocation of an individual reaching a crisis point in the life journey we all travel.<\/p>", "passageTitle": "q1-4", "question": "<p>In light of the criticisms of the concept of &lsquo;greatness&rsquo; in literary scholarship, what is the suggested alternative approach to evaluating literary works?<\/p>", "options": ["<p>Define a great book or work of art with reference to some defining essence.<\/p>", "<p>Evaluate the book&nbsp;or work of art from the aesthetic, ideological and historical points of view.<\/p>", "<p>Identify works that have a kind of universality or timelessness to them.<\/p>", "<p>Surveying the vast collection of texts that have been produced throughout human history.<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<p>The passage is suggesting that instead of trying to define or judge a book or work of art by some abstract quality or essence, we can simply look at the historical record and observe which works have had a lasting impact and resonance across different cultures and time periods. It's saying that by surveying the vast collection of texts that have been produced throughout human history, and noting which works have been able to connect with and speak to a wide variety of people in different eras, we can identify greatness. <br />Options 1 and 2. The passage suggests that we avoid this kind of evaluation&nbsp;(we counter the criticism by &ldquo;by eschewing any effort to define a great book &ndash; or a classic &ndash; with reference to some defining essence, whether aesthetic, ideological or historical.&rdquo; <br />Option 3. Correct. <br />Option 4. A mere survey would not help. The purpose of the survey is to identify the books that have lasted the onslaught of time and changing cultures. <br />Hence, [3].<\/p>", "topic": "Specific Detail Question"}, {"number": 5, "sourceId": "16877715414014", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>…Does it matter whether a seemingly obscure language spoken by a few people in one isolated corner of the world goes out of existence? Some people argue that language loss, like species loss, is simply a fact of life on an ever-evolving planet. But counter arguments are abundant. “A lot of people invoke social Darwinism to <\/span><span>say<\/span><span> ‘who cares’,” says Mark Turin, an anthropologist and linguist at Yale University. “But we spend huge amounts of money protecting species and biodiversity, so why should it be that the one thing that makes us singularly human shouldn’t be similarly nourished and protected?”<\/span><br><br><span>What’s more, languages are conduits of human heritage. Writing is a relatively recent development in our history (written systems currently exist for only about one-third of the world’s languages), so language itself is often the only way to convey a community’s songs, <\/span><span>stories<\/span><span> and poems. The Iliad was an oral story before it was written, as was The Odyssey. How many other traditions are out there in the world that we’ll never know about because no-one recorded them before the language disappeared?<\/span><br><br><span>Languages also convey unique cultures. Cherokee, for example, has no word for goodbye, only “I will see you again”… On the other hand, it has special expressions all its own. One word – <\/span><span>oo<\/span><span>-<\/span><span>kah<\/span><span>-huh-<\/span><span>sdee<\/span><span> –represents the mouth-watering, cheek-pinching delight experienced when seeing an adorable baby or a kitten. <\/span><span>All of<\/span><span> these things convey a culture, a way of interpreting human behaviour and emotion that’s not conveyed the same way as in the English language…<\/span><br><br><span>Another argument mirrors that of biodiversity conservation. Just as ecosystems provide a wealth of services for humanity, languages, too, are ripe with possibility. They contain an accumulated body of knowledge, including about geography, zoology, mathematics, navigation, astronomy, pharmacology, botany, meteorology and more. In the case of Cherokee, that language was born of thousands of years spent inhabiting the southern Appalachia Mountains. Cherokee words exist for <\/span><span>every last<\/span><span> berry, stem, frond and toadstool in the region, and those names also convey what kind of properties that object might have – whether it’s edible, poisonous or has some medicinal value… We lose ancient knowledge if we lose languages.<\/span><br><br><span>Finally, languages are ways of interpreting the world, and no two are the same. As such, they can provide insight into neurology, <\/span><span>psychology<\/span><span> and the linguistic capacities of our species. Different languages provide distinct pathways of thought and frameworks for thinking and solving problems. Returning to Cherokee, unlike English it is verb rather than noun-based, and those verbs can be conjugated in a multitude of ways based on who they are acting upon. And depending on the suffix, speakers can indicate whether a noun is toward or away from them… It’s a much more precise way of dealing with the world than English… For <\/span><span>all of<\/span><span> these reasons, linguists are scrambling to document and archive the diversity of quickly disappearing languages. Their efforts include making dictionaries, recording histories and traditions, and translating oral stories. “If there’s really good documentation, then there’s a chance that these languages could be revitalised in the future even after they cease to be spoken,” Turin says.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which one of the following statements best describes what the passage is about?<\/span>", "options": ["<span>A comparison of language loss to species loss and its impact on species diversity.<\/span>", "<span><\/span>\t<span>The role of linguists in documenting the diversity of quickly disappearing languages.<\/span>", "<span><\/span>\t<span>The significance of written systems in the preservation of human heritage and culture.<\/span>", "<span><\/span>\t<span>The importance of languages as carriers of human heritage, culture, and knowledge.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<span>Option 1. This statement is not the main focus of the passage. The passage mentions the comparison of language loss to species loss, but the main argument is the importance of language in preserving human heritage, culture, and knowledge.<\/span>\r<br /><span>Option 2. This statement is partially correct and is mentioned in the passage. The passage states that linguists are scrambling to document and archive the diversity of quickly disappearing languages, including making dictionaries, recording histories and traditions, and translating oral stories. But it is not the main idea.<\/span>\r<br /><span>Option 3 This statement is also partially correct and is mentioned in the passage. The passage mentions that writing is a relatively recent development in human history and exists for only about one-third of the world's languages. However, the main argument is not about written systems but rather the importance of language in preserving human heritage, culture, and knowledge.<\/span>\r<br /><span>Option 4.  The main argument of the passage is that language loss is a significant issue that should be addressed and languages should be protected, just like species and biodiversity, because languages are important carriers of human heritage, culture, knowledge, and linguistic capacities, and provide insight into human behaviour, emotions, and thought.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Central Idea"}, {"number": 6, "sourceId": "16877715414025", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>…Does it matter whether a seemingly obscure language spoken by a few people in one isolated corner of the world goes out of existence? Some people argue that language loss, like species loss, is simply a fact of life on an ever-evolving planet. But counter arguments are abundant. “A lot of people invoke social Darwinism to <\/span><span>say<\/span><span>  "<\/span>\t<span>Refer to the first paragraph. The author quotes Mark Turin to explain the main argument that is invoked by people against preservation of endangered languages. They invoke ‘social Darwinism’ or survival of the fittest to say ‘who cares.’ This is the same as ‘language loss, like species loss, is simply a fact of life on an ever-evolving planet.’<\/span>\r<br /><span>Option 1. Correct.<\/span>\r<br /><span>Option 2. The argument is not against but for language preservation.<\/span>\r<br /><span>Option 3. This is the author’s argument to support language preservation.<\/span>\r<br /><span>Option 4. This is not an argument that is invoked against the preservation of languages; it simply states a false assumption. ‘Social Darwinism’ is the argument.<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Specific Detail Question"}, {"number": 7, "sourceId": "16877715414026", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>…Does it matter whether a seemingly obscure language spoken by a few people in one isolated corner of the world goes out of existence? Some people argue that language loss, like species loss, is simply a fact of life on an ever-evolving planet. But counter arguments are abundant. “A lot of people invoke social Darwinism to <\/span><span>say<\/span><span> ‘who cares’,” says Mark Turin, an anthropologist and linguist at Yale University. “But we spend huge amounts of money protecting species and biodiversity, so why should it be that the one thing that makes us singularly human shouldn’t be similarly nourished and protected?”<\/span><br><br><span>What’s more, languages are conduits of human heritage. Writing is a relatively recent development in our history (written systems currently exist for only about one-third of the world’s languages), so language itself is often the only way to convey a community’s songs, <\/span><sp rb rather than noun-based, and those verbs can be conjugated in a multitude of ways based on who they are acting upon. And depending on the suffix, speakers can indicate whether a noun is toward or away from them… It’s a much more precise way of dealing with the world than English… For <\/span><span>all of<\/span><span> these reasons, linguists are scrambling to document and archive the diversity of quickly disappearing languages. Their efforts include making dictionaries, recording histories and traditions, and translating oral stories. “If there’s really good documentation, then there’s a chance that these languages could be revitalised in the future even after they cease to be spoken,” Turin says.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>The author cites <\/span><span>all of<\/span><span> the following reasons to argue against language loss EXCEPT:<\/span>", "options": ["<span>The loss of a language can <\/span><span>result<\/span><span> in the loss of unique cultural knowledge and practices, which cannot be regained.<\/span>", "<span><\/span>\t<span>Endangered languages often reflect the stories, experiences, and worldviews of indigenous people, and their loss is a loss of cultural diversity.<\/span>", "<span><\/span>\t<span>The spending of huge amounts of money on protecting species and biodiversity makes it important to also protect linguistic diversity.<\/span>", "<span><\/span>\t<span>Just as ecosystems provide a wealth of services for humanity, languages are important for <\/span><span>biodiversity conservation.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>Option 1. Not an exception. “What’s more, languages are conduits of human heritage.” (paragraph 2) and “Languages also convey unique cultures.” (paragraph 3)<\/span>\r<br /><span>Option 2. Not an exception. “so language itself is often the only way to convey a community’s songs, stories and poems.” (paragraph 3)<\/span>\r<br /><span>Option 3. Not an exception. “But we spend huge amounts of money protecting species and biodiversity, so why should it be that the one thing that makes us singularly human shouldn’t be similarly nourished and protected?” (paragraph 1)<\/span>\r<br />Option 4. Exception. “Another argument mirrors that of biodiversity conservation.”<span>&nbsp;<\/span><span>The argument is similar to that for biodiversity conservation. Languages are important for biodiversity conservation is a rather ridiculous distortion of this idea. The passage talks about language diversity.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Specific Detail Question"}, {"number": 8, "sourceId": "16877715414027", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>…Does it matter whether a seemingly obscure language spoken by a few people in one isolated corner of the world goes out of existence? Some people argue that language loss, like species loss, is simply a fact of life on an ever-evolving planet. But counter arguments are abundant. “A lot of people invoke social Darwinism to <\/span><span>say<\/span><span> ‘who cares’,” says Mark Turin, an anthropologist and linguist at Yale University. “But we spend huge amounts of money protecting species and biodiversity, so why should it be that the one thing that makes us singularly human shouldn’t be similarly nourished and protected?”<\/span><br><br><span>What’s more, languages are conduits of human heritage. Writing is a relatively recent development in our history (written systems currently exist for only about one-third of the world’s languages), so language itself is often the only way to convey a community’s songs, <\/span><span>stories<\/span><span> and poems. The Iliad was an oral story before it was written, as was The Odyssey. How many other traditions are out there in the world that we’ll never know about because no-one recorded them before the language disappeared?<\/span><br><br><span>Languages also convey unique cultures. Cherokee, for example, has no word for goodbye, only “I will see you again”… On the other hand, it has special expressions all its own. One word – <\/span><span>oo<\/span><span>-<\/span><span>kah<\/span><span>-huh-<\/span><span>sdee<\/span><span> –represents the mouth-watering, cheek-pinching delight experienced when seeing an adorable baby or a kitten. <\/span><span>All of<\/span><span> these things convey a culture, a way of interpreting human behaviour and emotion that’s not conveyed the same way as in the English language…<\/span><br><br><span>Another argument mirrors that of biodiversity conservation. Just as ecosystems provide a wealth of services for humanity, languages, too, are ripe with possibility. They contain an accumulated body of knowledge, including about geography, zoology, mathematics, navigation, astronomy, pharmacology, botany, meteorology and more. In the case of Cherokee, that language was born of thousands of years spent inhabiting the southern Appalachia Mountains. Cherokee words exist for <\/span><span>every last<\/span><span> berry, stem, frond and toadstool in the region, and those names also convey what kind of properties that object might have – whether it’s edible, poisonous or has some medicinal value… We lose ancient knowledge if we lose languages.<\/span><br><br><span>Finally, languages are ways of interpreting the world, and no two are the same. As such, they can provide insight into neurology, <\/span><span>psychology<\/span><span> and the linguistic capacities of our species. Different languages provide distinct pathways of thought and frameworks for thinking and solving problems. Returning to Cherokee, unlike English it is verb rather than noun-based, and those verbs can be conjugated in a multitude of ways based on who they are acting upon. And depending on the suffix, speakers can indicate whether a noun is toward or away from them… It’s a much more precise way of dealing with the world than English… For <\/span><span>all of<\/span><span> these reasons, linguists are scrambling to document and archive the diversity of quickly disappearing languages. Their efforts include making dictionaries, recording histories and traditions, and translating oral stories. “If there’s really good documentation, then there’s a chance that these languages could be revitalised in the future even after they cease to be spoken,” Turin says.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>The author uses the example of Cherokee in the passage to:<\/span>", "options": ["<span>Illustrate why endangered languages need preservation as they interpret <\/span><span>human <\/span><span>behavior<\/span><span> and emotions that are not easily conveyed through other languages.<\/span>", "<span><\/span>\t<span>Argue that extinction of languages should be prevented as they hold valuable information and knowledge, and are an aspect of human heritage, <\/span><span>culture<\/span><span> and identity.<\/span>", "<span><\/span>\t<span>Illustrate the ancient origins of endangered languages and why their loss entails loss of languages with a different structure which are more precise than English.<\/span>", "<span><\/span>\t<span>Argue that linguists are making efforts to preserve obscure languages that are spoken by small populations in remote areas of the world, before they become extinct.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>The author uses the example of Cherokee to support all the arguments he has in support of his main argument that endangered languages (like Cherokee) should be preserved for reasons spelt out in the  entire passage –  to protect and preserve cultures, accumulated ancient knowledge etc. Option 2 more closely summarises this argument than the other options do. Options&nbsp;<\/span><span>1,<\/span><span> 3 and 4 highlight the specific features of Cherokee and not the author’s general argument.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Logical Structure"}, {"number": 9, "sourceId": "16877715414028", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>…The first indication that there is any relation between black holes and our universe <\/span><span>as a whole is<\/span><span> that both manifest “event horizons”—points of no return beyond which two people seemingly fall <\/span>out of contact forever. A black hole attracts so strongly that at some point even light—the fastest thing in the universe—cannot escape its pull. The boundary where light becomes trapped is thus a spherical event horizon around the <span>center<\/span><span> of the black hole.<\/span><br><br><span>Our universe, too, has an event horizon—a fact confirmed by the stunning and unexpected discovery in 1998 that not only is space expanding, but its expansion is <\/span><span>accelerating<\/span><span>. Whatever is causing this speedup has been called dark energy. The acceleration traps light just as black holes <\/span><span>do:<\/span><span> as the cosmos expands, regions of space repel one another so strongly that at some point not even light can overcome the separation. This inside-out situation leads to a spherical cosmological event horizon that surrounds us, leaving everything beyond a certain distance in darkness.<\/span><br><br><span>There is a crucial difference between cosmological and black hole event horizons, however. In a black hole, spacetime is collapsing toward a single point—the singularity. In the universe at large, all of space is uniformly growing, like the surface of a balloon that is being inflated. This means that creatures in faraway galaxies will have their own distinct spherical event horizons, which surround them instead of us. Our current cosmological event horizon is about 16 billion light-years away. <\/span><span>As long as<\/span><span> this acceleration continues, any light emitted today that is beyond that distance will never reach us.<\/span><br><br><span>Cosmologists also speak of a particle horizon, which confusingly is often called a cosmological horizon as well. This refers to the distance beyond which light emitted in the early universe has not yet had time to reach us here on Earth. In our tale, we will be concerned only with the cosmological event horizon, which we will often just call the cosmological horizon. These are unique to universes that accelerate, like ours.<\/span><br><br><span>The similarities between black holes and our universe don't end there. In 1974 Stephen Hawking showed that black holes are not completely black: because of quantum mechanics, they have a temperature and therefore emit matter and radiation, just as all thermal bodies do. This emission, called Hawking radiation, is what causes black holes to eventually evaporate away. It turns out that cosmological horizons also have a temperature and emit matter and radiation because of a very similar effect…<\/span><br><br><span>Hawking's revelation posed a serious problem: if black holes can disappear, so can the information contained within them—which is against the rules of quantum mechanics. This is known as the black hole information paradox, and it is a deep puzzle complicating the quest to combine quantum mechanics and gravity. But in 2019 scientists made dramatic progress. Through a confluence of conceptual and technical advances, physicists argued that the information inside a black hole can <\/span>actually be<span> accessed from the Hawking radiation that leaves the black hole. This discovery has reinvigorated those of us studying quantum cosmology…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>According to the passage, a ‘cosmological event horizon’ is <\/span><span>all of<\/span><span> the following EXCEPT:<\/span>", "options": ["<span>The fundamental limitation to how much we can know about our universe.<\/span>", "<span><\/span>\t<span>The distance that light has travelled since the beginning of our universe.<\/span>", "<span><\/span>\t<span>The distance at which the universe expands at least equal to the speed of light.<\/span>", "<span><\/span>\t<span>Somewhat like the horizon at the beach, that delimits how far we can see.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>Statement 1 can be inferred from “This inside-out situation leads to a spherical cosmological event horizon that surrounds us, leaving everything beyond a certain distance in darkness.” And ‘can know’ in the option can be deduced from what the passage states about ‘information’.<\/span>\r<br /><span>Statement 2 is the exception. It describes the particle horizon and not the cosmological horizon.<\/span>\r<br /><span>Statement 3 can be inferred from “regions of space repel one another so strongly that at some point not even light can overcome the separation.”<\/span>\r<br /><span>Statement 4 is a simpler inference and comparison derived from option 1.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Inference"}, {"number": 10, "sourceId": "16877715414039", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>…The first indication that there is any relation between black holes and our universe <\/span><span>as a whole is<\/span><span> that both manifest “event horizons”—points of no return beyond which two people seemingly fall <\/span>out of contact forever. A black hole attracts so strongly that at some point even light—the fastest thing in the universe—cannot escape its pull. The boundary where light becomes trapped is thus a spherical event horizon around the <span>center<\/span><span> of the black hole.<\/span><br><br><span>Our universe, too, has an event horizon—a fact confirmed by the stunning and unexpected discovery in 1998 that not only is space expanding, but its expansion is <\/span><span>accelerating<\/span><span>. Whatever is causing this speedup has been called dark energy. The acceleration traps light just as black holes <\/span><span>do:<\/span><span> as the cosmos expands, regions of space repel one another so strongly that at some point not even light can overcome the separation. This inside-out situation leads to a spherical cosmological event horizon that surrounds us, leaving everything beyond a certain distance in darkness.<\/span><br><br><span>There is a crucial difference between cosmological and black hole event horizons, however. In a black hole, spacetime is collapsing toward a single point—the singularity. In the universe at large, all of space is uniformly growing, like the surface of a balloon that is being inflated. This means that creatures in faraway galaxies will have their own distinct spherical event horizons, which surround them instead of us. Our current cosmological event horizon is about 16 billion light-years away. <\/span><span>As long as<\/span><span> this acceleration continues, any light emitted today that is beyond that distance will never reach us.<\/span><br><br><span>Cosmologists also speak of a particle horizon, which confusingly is often called a cosmological horizon as well. This refers to the distance beyond which light emitted in the early universe has not yet had time to reach us here on Earth. In our tale, we will be concerned only with the cosmological event horizon, which we will often just call the cosmological horizon. These are unique to universes that accelerate, like ours.<\/span><br><br><span>The similarities between black holes and our universe don't end there. In 1974 Stephen Hawking showed that black holes are not completely black: because of quantum mechanics, they have a temperature and therefore emit matter and radiation, just as all thermal bodies do. This emission, called Hawking radiation, is what causes black holes to eventually evaporate away. It turns out that cosmological horizons also have a temperature and emit matter and radiation because of a very similar effect…<\/span><br><br><span>Hawking's revelation posed a serious problem: if black holes can disappear, so can the information contained within them—which is against the rules of quantum mechanics. This is known as the black hole information paradox, and it is a deep puzzle complicating the quest to combine quantum mechanics and gravity. But in 2019 scientists made dramatic progress. Through a confluence of conceptual and technical advances, physicists argued that the information inside a black hole can <\/span>actually be<span> accessed from the Hawking radiation that leaves the black hole. This discovery has reinvigorated those of us studying quantum cosmology…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which one of the following sets of terms best serves as keywords to the passage?<\/span>", "options": ["<span><\/span>\t<span>Event Horizons; Black holes; cosmological horizon; Hawking radiation; Information paradox.<\/span>", "<span><\/span>\t<span>Black hole event horizon; cosmological horizon; particle horizon; Stephen Hawking; Quantum cosmology.<\/span>", "<span><\/span>\t<span>Black Holes; Universe; Dark energy; Cosmological event horizon; Hawking radiation; Quantum mechanics and gravity.<\/span>", "<span><\/span>\t<span>Event Horizons; Singularity; Cosmological horizon; Particle horizon; Stephen Hawking; Quantum Cosmology.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span>The central idea of the passage is that both black holes and the universe as a whole have \"event horizons,\" and these event horizons have similar properties. The passage also states that Stephen Hawking's discovery that black holes emit matter and radiation and eventually evaporate away, known as Hawking radiation, posed a serious problem and that recent developments in physics have made progress towards resolving this problem (the information paradox). Option 1 best captures the keywords. In option<\/span><span>s<\/span><span> 2<\/span><span> and 4<\/span><span>, ‘particle horizon’ is merely a point that is clarified in the passage<\/span><span>, and “Stephen Hawking; Quantum Cosmology,” moves away from the focus of the passage<\/span><span>. Option 3 loses the main emphasis of the passage on ‘event horizons’.<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Logical Structure"}, {"number": 11, "sourceId": "168777154140310", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>…The first indication that there is any relation between black holes and our universe <\/span><span>as a whole is<\/span><span> that both manifest “event horizons”—points of no return beyond which two people seemingly fall <\/span>out of contact forever. A black hole attracts so strongly that at some point even light—the fastest thing in the universe—cannot escape its pull. The boundary where light becomes trapped is thus a spherical event horizon around the <span>center<\/span><span> of the black hole.<\/span><br><br><span>Our universe, too, has an event horizon—a fact confirmed by the stunning and unexpected discovery in 1998 that not only is space expanding, but its expansion is <\/span><span>accelerating<\/span><span>. Whatever is causing this speedup has been called dark energy. The acceleration traps light just as black holes <\/span><span>do:<\/span><span> as the cosmos expands, regions of space repel one another so strongly that at some point not even light can overcome the separation. This inside-out situation leads to a spherical cosmological event horizon that surrounds us, leaving everything beyond a certain distance in darkness.<\/span><br><br><span>There is a crucial difference between cosmological and black hole event horizons, however. In a black hole, spacetime is collapsing toward a single point—the singularity. In the universe at large, all of space is uniformly growing, like the surface of a balloon that is being inflated. This means that creatures in faraway galaxies will have their own distinct spherical event horizons, which surround them instead of us. Our current cosmological event horizon is about 16 billion light-years away. <\/span><span>As long as<\/span><span> this acceleration continues, any light emitted today that is beyond that distance will never reach us.<\/span><br><br><span>Cosmologists also speak of a particle horizon, which confusingly is often called a cosmological horizon as well. This refers to the distance beyond which light emitted in the early universe has not yet had time to reach us here on Earth. In our tale, we will be concerned only with the cosmological event horizon, which we will often just call the cosmological horizon. These are unique to universes that accelerate, like ours.<\/span><br><br><span>The similarities between black holes and our universe don't end there. In 1974 Stephen Hawking showed that black holes are not completely black: because of quantum mechanics, they have a temperature and therefore emit matter and radiation, just as all thermal bodies do. This emission, called Hawking radiation, is what causes black holes to eventually evaporate away. It turns out that cosmological horizons also have a temperature and emit matter and radiation because of a very similar effect…<\/span><br><br><span>Hawking's revelation posed a serious problem: if black holes can disappear, so can the information contained within them—which is against the rules of quantum mechanics. This is known as the black hole information paradox, and it is a deep puzzle complicating the quest to combine quantum mechanics and gravity. But in 2019 scientists made dramatic progress. Through a confluence of conceptual and technical advances, physicists argued that the information inside a black hole can <\/span>actually be<span> accessed from the Hawking radiation that leaves the black hole. This discovery has reinvigorated those of us studying quantum cosmology…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>It can be inferred from the 4<\/span><span><sup>th<\/sup><\/span><span> Paragraph that the particle horizon:<\/span>", "options": ["<span>is unaffected by the acceleration of the universe.<\/span>", "<span><\/span>\t<span>defines the size of the observable universe.<\/span>", "<span><\/span>\t<span>is effectively the end of our universe.<\/span>", "<span><\/span>\t<span>coincides with the cosmological event horizon.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>Option 1. Cannot be inferred – because ‘unaffected by’ is data inadequate as light travels within a universe (space) that is expanding.<\/span>\r<br />Option 2. Inference. That is the limit of the observable universe almost stated in “the distance beyond which light emitted in the early universe has not yet had time to reach us here on Earth”\r<br /><span>Option 3. Cannot be inferred. ‘Observable universe’ or ‘known universe’ would be correct.<\/span>\r<br /><span>Option 4. Cannot be inferred. No&nbsp;<\/span><span>coinciding<\/span><span> is&nbsp;<\/span><span>indicated.&nbsp;<\/span><span>And&nbsp;<\/span><span>it is&nbsp;<\/span><span>factually incorrect.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Specific Detail Question"}, {"number": 12, "sourceId": "168777154140311", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>…The first indication that there is any relation between black holes and our universe <\/span><span>as a whole is<\/span><span> that both manifest “event horizons”—points of no return beyond which two people seemingly fall <\/span>out of contact forever. A black hole attracts so strongly that at some point even light—the fastest thing in the universe—cannot escape its pull. The boundary where light becomes trapped is thus a spherical event horizon around the <span>center<\/span><span> of the black hole.<\/span><br><br><span>Our universe, too, has an event horizon—a fact confirmed by the stunning and unexpected discovery in 1998 that not only is space expanding, but its expansion is <\/span><span>accelerating<\/span><span>. Whatever is causing this speedup has been called dark energy. The acceleration traps light just as black holes <\/span><span>do:<\/span><span> as the cosmos expands, regions of space repel one another so strongly that at some point not even light can overcome the separation. This inside-out situation leads to a spherical cosmological event horizon that surrounds us, leaving everything beyond a certain distance in darkness.<\/span><br><br><span>There is a crucial difference between cosmological and black hole event horizons, however. In a black hole, spacetime is collapsing toward a single point—the singularity. In the universe at large, all of space is uniformly growing, like the surface of a balloon that is being inflated. This means that creatures in faraway galaxies will have their own distinct spherical event horizons, which surround them instead of us. Our current cosmological event horizon is about 16 billion light-years away. <\/span><span>As long as<\/span><span> this acceleration continues, any light emitted today that is beyond that distance will never reach us.<\/span><br><br><span>Cosmologists also speak of a particle horizon, which confusingly is often called a cosmological horizon as well. This refers to the distance beyond which light emitted in the early universe has not yet had time to reach us here on Earth. In our tale, we will be concerned only with the cosmological event horizon, which we will often just call the cosmological horizon. These are unique to universes that accelerate, like ours.<\/span><br><br><span>The similarities between black holes and our universe don't end there. In 1974 Stephen Hawking showed that black holes are not completely black: because of quantum mechanics, they have a temperature and therefore emit matter and radiation, just as all thermal bodies do. This emission, called Hawking radiation, is what causes black holes to eventually evaporate away. It turns out that cosmological horizons also have a temperature and emit matter and radiation because of a very similar effect…<\/span><br><br><span>Hawking's revelation posed a serious problem: if black holes can disappear, so can the information contained within them—which is against the rules of quantum mechanics. This is known as the black hole information paradox, and it is a deep puzzle complicating the quest to combine quantum mechanics and gravity. But in 2019 scientists made dramatic progress. Through a confluence of conceptual and technical advances, physicists argued that the information inside a black hole can <\/span>actually be<span> accessed from the Hawking radiation that leaves the black hole. This discovery has reinvigorated those of us studying quantum cosmology…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>According to the last paragraph, the ‘black hole information paradox’ …<\/span>", "options": ["<span>was resolved by the concept of Hawking radiation.<\/span>", "<span>is incompatible with the recent technical advances.<\/span>", "<span><\/span>\t<span>made quantum mechanics and gravity irreconcilable.<\/span>", "<span>causes black holes to eventually evaporate away.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>The last paragraph has all the details about the information paradox. The answer is stated almost directly: “it is a deep puzzle complicating the quest to combine quantum mechanics and gravity.” Hawking radiation posited that black holes evaporate away (with this all the information that it contains), which means information contained in the black holes is forever lost. Quantum mechanics states that information can never be completely lost. This is the black hole information paradox. Option 1 – Hawking radiation did not resolve it but created the paradox. Option 2 – recent conceptual and technical advances have pointed to the retrieval of information from the radiation – that means it is not incompatible but resolves the paradox.  Option 3 is correct.&nbsp;<\/span><span>The paradox was indeed widening the gap between quantum mechanics and gravity as explained above.&nbsp;<\/span><span>Option 4 – Hawking radiation causes the evaporation and not the paradox.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Inference"}, {"number": 13, "sourceId": "168777154140312", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>Continental Europe and especially France have entertained considerable nostalgia for what the French call the <\/span><span>Trente<\/span><span> <\/span><span>Glorieuses<\/span><span>, the thirty years from the late 1940s to the late 1970s during which economic growth was unusually rapid. People still do not understand what evil spirit condemned them to such a low rate of growth beginning in the late 1970s…<\/span><br><br><span>In fact, when viewed in historical perspective, the thirty postwar years were the exceptional period, quite simply because Europe had fallen far behind the United States over the period 1914–1945 but rapidly caught up during the <\/span><span>Trente<\/span><span> <\/span><span>Glorieuses<\/span><span>. Once this catch-up was complete, Europe and the United States both stood at the global technological frontier and began to grow at the same relatively slow pace, characteristic of economics at the frontier.<\/span><br><br><span>In North America, there is no nostalgia for the postwar period, quite simply because the <\/span><span>Trente<\/span><span> <\/span><span>Glorieuses<\/span><span> never existed there: per capita output grew at roughly the same rate of 1.5–2 percent per year throughout the period 1820–2012. In Western Europe, which suffered much more from the two world wars, the variations are considerably greater: per capita output stagnated between 1913 and 1950 and then leapt ahead to more than 4 percent from 1950 to 1970, before falling sharply to just slightly above US levels in the period 1970–1990 and to barely 1.5 percent between 1990 and 2012.<\/span><br><br><span>…These very different collective experiences of growth in the twentieth century largely explain why public opinion in different countries varies so widely <\/span><span>in regard to<\/span><span> commercial and financial globalization and indeed to capitalism in general. In continental Europe and especially France, people quite naturally continue to look on the first three postwar decades—a period of strong state intervention in the economy—as a period blessed with rapid growth, and many regard the liberalization of the economy that began around 1980 as the cause of a slowdown.<\/span><br><br><span>In Great Britain and the United States, postwar history is interpreted quite differently. Between 1950 and 1980, the gap between the English-speaking countries and the countries that had lost the war closed rapidly. By the late 1970s, in Britain, GDP per capita fell below the level of Germany, France, Japan, and even Italy. It may even be the case that this sense of being <\/span><span>rivaled<\/span><span> played an important part in the “conservative revolution.” Margaret Thatcher in Britain and Ronald Reagan in the United States promised to “roll back the welfare state” that had allegedly sapped the animal spirits of Anglo-Saxon entrepreneurs and thus to return to pure nineteenth-century capitalism, which would allow the United States and Britain to regain the upper hand. Even today, many people in both <\/span>countries believe that the conservative revolution was remarkably successful, because their growth rates once again matched continental European and Japanese levels.<br><br><span>In fact, neither the economic liberalization that began around 1980 nor the state interventionism that began in 1945 deserves such praise or blame. France, Germany, and Japan would very likely have caught up with Britain and the United States following their collapse of 1914–1945 regardless of what policies they had adopted… Similarly, once these countries had attained the global technological frontier, it is hardly surprising that they ceased to grow more rapidly than Britain and the United States or that growth rates in <\/span><span>all of<\/span><span> these wealthy countries more or less equalised…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>According to the passage why was there no nostalgia for the postwar period in North America?<\/span>", "options": ["<span><b><\/b><\/span>\t<span>It was a period of slow growth.<\/span>", "<span><\/span>\t<span>It was a period of weak state intervention.<\/span>", "<span><\/span>\t<span>The gap with Europe was not closed.<\/span>", "<span><\/span>\t<span>It was not a period of liberalization.<\/span>\n<span> <\/span>"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span>Option 1. Correct.  The article states that there is no nostalgia for the postwar period in North America because the&nbsp;<\/span><span>Trente<\/span><span>&nbsp;<\/span><span>Glorieuses<\/span><span> never existed there “per capita output grew at roughly the same rate of 1.5–2 percent per year throughout the period 1820–2012.<\/span>\r<br /><span>Option 2. The article does not mention anything about the level of state intervention in North America during the postwar period.<\/span>\r<br /><span>Option 3. The article does not mention anything about the gap between North America and Europe during the postwar period.<\/span>\r<br /><span>Option 4. The article does not mention anything about the level of liberalization in North America during the postwar period.<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Inference"}, {"number": 14, "sourceId": "168777154140713", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>Continental Europe and especially France have entertained considerable nostalgia for what the French call the <\/span><span>Trente<\/span><span> <\/span><span>Glorieuses<\/span><span>, the thirty years from the late 1940s to the late 1970s during which economic growth was unusually rapid. People still do not understand what evil spirit condemned them to such a low rate of growth beginning in the late 1970s…<\/span><br><br><span>In fact, when viewed in historical perspective, the thirty postwar years were the exceptional period, quite simply because Europe had fallen far behind the United States over the period 1914–1945 but rapidly caught up during the <\/span><span>Trente<\/span><span> <\/span><span>Glorieuses<\/span><span>. Once this catch-up was complete, Europe and the United States both stood at the global technological frontier and began to grow at the same relatively slow pace, characteristic of economics at the frontier.<\/span><br><br><span>In North America, there is no nostalgia for the postwar period, quite simply because the <\/span><span>Trente<\/span><span> <\/span><span>Glorieuses<\/span><span> never existed there: per capita output grew at roughly the same rate of 1.5–2 percent per year throughout the period 1820–2012. In Western Europe, which suffered much more from the two world wars, the variations are considerably greater: per capita output stagnated between 1913 and 1950 and then leapt ahead to more than 4 percent from 1950 to 1970, before falling sharply to just slightly above US levels in the period 1970–1990 and to barely 1.5 percent between 1990 and 2012.<\/span><br><br><span>…These very different collective experiences of growth in the twentieth century largely explain why public opinion in different countries varies so widely <\/span><span>in regard to<\/span><span> commercial and financial globalization and indeed to capitalism in general. In continental Europe and especially France, people quite naturally continue to look on the first three postwar decades—a period of strong state intervention in the economy—as a period blessed with rapid growth, and many regard the liberalization of the economy that began around 1980 as the cause of a slowdown.<\/span><br><br><span>In Great Britain and the United States, postwar history is interpreted quite differently. Between 1950 and 1980, the gap between the English-speaking countries and the countries that had lost the war closed rapidly. By the late 1970s, in Britain, GDP per capita fell below the level of Germany, France, Japan, and even Italy. It may even be the case that this sense of being <\/span><span>rivaled<\/span><span> played an important part in the “conservative revolution.” Margaret Thatcher in Britain and Ronald Reagan in the United States promised to “roll back the welfare state” that had allegedly sapped the animal spirits of Anglo-Saxon entrepreneurs and thus to return to pure nineteenth-century capitalism, which would allow the United States and Britain to regain the upper hand. Even today, many people in both <\/span>countries believe that the conservative revolution was remarkably successful, because their growth rates once again matched continental European and Japanese levels.<br><br><span>In fact, neither the economic liberalization that began around 1980 nor the state interventionism that began in 1945 deserves such praise or blame. France, Germany, and Japan would very likely have caught up with Britain and the United States following their collapse of 1914–1945 regardless of what policies they had adopted… Similarly, once these countries had attained the global technological frontier, it is hardly surprising that they ceased to grow more rapidly than Britain and the United States or that growth rates in <\/span><span>all of<\/span><span> these wealthy countries more or less equalised…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following is the main idea of the passage?<\/span>", "options": ["<span><\/span>\t<span>The different experiences of economic growth in the 20<\/span><span><sup>th<\/sup><\/span><span> century largely account for the varying opinions about capitalism and globalization.<\/span>", "<span><\/span>\t<span>State interventionism and economic liberalization are responsible for the differences in experiences of economic growth in the 20<\/span><span><sup>th<\/sup><\/span><span> century.<\/span>", "<span><\/span>\t<span>The conservative revolution in Britain and in the United States was largely successful in returning to pure 19th-century capitalism.<\/span>", "<span><\/span>\t<span>Cultural, political, or social factors have played no role in shaping public opinion about capitalism and globalization in the 20<\/span><span><sup>th<\/sup><\/span><span> century.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span>The main idea of the passage is to explain the difference in public opinion about commercial and financial globalization and capitalism in different countries (continental Europe, specifically France, compared to Great Britain and the United States) due to their different collective experiences of economic growth in the 20th century, specifically the existence of the&nbsp;<\/span><span>Trente<\/span><span>&nbsp;<\/span><span>Glorieuses<\/span><span> (a period of rapid economic growth in continental Europe) and the impact of the two world wars on Western Europe's economy. The passage suggests that these differences in experiences largely account for the varying opinions about capitalism and globalization. “These very&nbsp;<\/span>different collective experiences of growth in the twentieth century largely explain why public opinion in different countries varies so widely in regard to commercial and financial globalization and indeed to capitalism in general.” The last paragraph also states that state policy had almost nothing to do with it – growth would have happened anyway.\r<br /><span>Option 1. Correct.<\/span>\r<br /><span>Option 2. Contrary to the passage.<\/span>\r<br /><span>Option 3. Not the main idea.<\/span>\r<br /><span>Option 4. Contrary to the passage. “<\/span><span>global technological frontier” may imply that cultural and social factors had role to play, as part of the ‘economic growth experience.’<\/span>\r<br /><span>Hence, [1].<\/span>", "topic": "Central Idea"}, {"number": 15, "sourceId": "168777154140714", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>Continental Europe and especially France have entertained considerable nostalgia for what the French call the <\/span><span>Trente<\/span><span> <\/span><span>Glorieuses<\/span><span>, the thirty years from the late 1940s to the late 1970s during which economic growth was unusually rapid. People still do not understand what evil spirit condemned them to such a low rate of growth beginning in the late 1970s…<\/span><br><br><span>In fact, when viewed in historical perspective, the thirty postwar years were the exceptional period, quite simply because Europe had fallen far behind the United States over the period 1914–1945 but rapidly caught up during the <\/span><span>Trente<\/span><span> <\/span><span>Glorieuses<\/span><span>. Once this catch-up was complete, Europe and the United States both stood at the global technological frontier and began to grow at the same relatively slow pace, characteristic of economics at the frontier.<\/span><br><br><span>In North America, there is no nostalgia for the postwar period, quite simply because the <\/span><span>Trente<\/span><span> <\/span><span>Glorieuses<\/span><span> never existed there: per capita output grew at roughly the same rate of 1.5–2 percent per year throughout the period 1820–2012. In Western Europe, which suffered much more from the two world wars, the variations are considerably greater: per capita output stagnated between 1913 and 1950 and then leapt ahead to more than 4 percent from 1950 to 1970, before falling sharply to just slightly above US levels in the period 1970–1990 and to barely 1.5 percent between 1990 and 2012.<\/span><br><br><span>…These very different collective experiences of growth in the twentieth century largely explain why public opinion in different countries varies so widely <\/span><span>in regard to<\/span><span> commercial and financial globalization and indeed to capitalism in general. In continental Europe and especially France, people quite naturally continue to look on the first three postwar decades—a period of strong state intervention in the economy—as a period blessed with rapid growth, and many regard the liberalization of the economy that began around 1980 as the cause of a slowdown.<\/span><br><br><span>In Great Britain and the United States, postwar history is interpreted quite differently. Between 1950 and 1980, the gap between the English-speaking countries and the countries that had lost the war closed rapidly. By the late 1970s, in Britain, GDP per capita fell below the level of Germany, France, Japan, and even Italy. It may even be the case that this sense of being <\/span><span>rivaled<\/span><span> played an important part in the “conservative revolution.” Margaret Thatcher in Britain and Ronald Reagan in the United States promised to “roll back the welfare state” that had allegedly sapped the animal spirits of Anglo-Saxon entrepreneurs and thus to return to pure nineteenth-century capitalism, which would allow the United States and Britain to regain the upper hand. Even today, many people in both <\/span>countries believe that the conservative revolution was remarkably successful, because their growth rates once again matched continental European and Japanese levels.<br><br><span>In fact, neither the economic liberalization that began around 1980 nor the state interventionism that began in 1945 deserves such praise or blame. France, Germany, and Japan would very likely have caught up with Britain and the United States following their collapse of 1914–1945 regardless of what policies they had adopted… Similarly, once these countries had attained the global technological frontier, it is hardly surprising that they ceased to grow more rapidly than Britain and the United States or that growth rates in <\/span><span>all of<\/span><span> these wealthy countries more or less equalised…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following statements about the conservative revolution is true according to the passage in paragraph 5?<\/span>", "options": ["<span>The conservative revolution was aimed at increasing government intervention in the economy.<\/span>", "<span><\/span>\t<span>The conservative revolution aided Britain and the US in restoring capitalism of the 19th century and regaining a competitive advantage.<\/span>", "<span>The conservative revolution brought Britain and the United States to the forefront of technological advancement.<\/span>", "<span><\/span>\t<span>The conservative revolution ushered in an era of economic liberalization, <\/span><span>globalization<\/span><span> and economic growth in most countries.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>Option 1. Incorrect. It was a return to pure capitalism and not to regulations.<\/span>\r<br /><span>Option 2. Correct. Stated in paragraph 5.<\/span>\r<br /><span>Option 3. ‘technological advancement’ per se cannot be concluded – more about economy and growth rate.<\/span>\r<br /><span>Option 4. ‘most countries’ is incorrect.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Specific Detail Question"}, {"number": 16, "sourceId": "168777154140715", "type": "mcq", "passage": "<\/span>\t<span><b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><\/span><br><br><span>Continental Europe and especially France have entertained considerable nostalgia for what the French call the <\/span><span>Trente<\/span><span> <\/span><span>Glorieuses<\/span><span>, the thirty years from the late 1940s to the late 1970s during which economic growth was unusually rapid. People still do not understand what evil spirit condemned them to such a low rate of growth beginning in the late 1970s…<\/span><br><br><span>In fact, when viewed in historical perspective, the thirty postwar years were the exceptional period, quite simply because Europe had fallen far behind the United States over the period 1914–1945 but rapidly caught up during the <\/span><span>Trente<\/span><span> <\/span><span>Glorieuses<\/span><span>. Once this catch-up was complete, Europe and the United States both stood at the global technological frontier and began to grow at the same relatively slow pace, characteristic of economics at the frontier.<\/span><br><br><span>In North America, there is no nostalgia for the postwar period, quite simply because the <\/span><span>Trente<\/span><span> <\/span><span>Glorieuses<\/span><span> never existed there: per capita output grew at roughly the same rate of 1.5–2 percent per year throughout the period 1820–2012. In Western Europe, which suffered much more from the two world wars, the variations are considerably greater: per capita output stagnated between 1913 and 1950 and then leapt ahead to more than 4 percent from 1950 to 1970, before falling sharply to just slightly above US levels in the period 1970–1990 and to barely 1.5 percent between 1990 and 2012.<\/span><br><br><span>…These very different collective experiences of growth in the twentieth century largely explain why public opinion in different countries varies so widely <\/span><span>in regard to<\/span><span> commercial and financial globalization and indeed to capitalism in general. In continental Europe and especially France, people quite naturally continue to look on the first three postwar decades—a period of strong state intervention in the economy—as a period blessed with rapid growth, and many regard the liberalization of the economy that began around 1980 as the cause of a slowdown.<\/span><br><br><span>In Great Britain and the United States, postwar history is interpreted quite differently. Between 1950 and 1980, the gap between the English-speaking countries and the countries that had lost the war closed rapidly. By the late 1970s, in Britain, GDP per capita fell below the level of Germany, France, Japan, and even Italy. It may even be the case that this sense of being <\/span><span>rivaled<\/span><span> played an important part in the “conservative revolution.” Margaret Thatcher in Britain and Ronald Reagan in the United States promised to “roll back the welfare state” that had allegedly sapped the animal spirits of Anglo-Saxon entrepreneurs and thus to return to pure nineteenth-century capitalism, which would allow the United States and Britain to regain the upper hand. Even today, many people in both <\/span>countries believe that the conservative revolution was remarkably successful, because their growth rates once again matched continental European and Japanese levels.<br><br><span>In fact, neither the economic liberalization that began around 1980 nor the state interventionism that began in 1945 deserves such praise or blame. France, Germany, and Japan would very likely have caught up with Britain and the United States following their collapse of 1914–1945 regardless of what policies they had adopted… Similarly, once these countries had attained the global technological frontier, it is hardly surprising that they ceased to grow more rapidly than Britain and the United States or that growth rates in <\/span><span>all of<\/span><span> these wealthy countries more or less equalised…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>All of the following, if FALSE, could be seen as being in accordance with the author’s main argument in the passage EXCEPT:<\/span>", "options": ["<span>State interventionism played a significant role in shaping the economic growth of Europe in the 20<\/span><span><sup>th<\/sup><\/span><span> century.<\/span>", "<span><\/span>\t<span>Economic liberalization played a significant role in shaping the economic growth of the United States in the 20<\/span><span><sup>th<\/sup><\/span><span> century.<\/span>", "<span><\/span>\t<span>The existence of the <\/span><span>Trente<\/span><span> <\/span><span>Glorieuses<\/span><span> shaped the public opinion about capitalism and globalization in Europe.<\/span>", "<span><\/span>\t<span>A sense of being <\/span><span>rivaled<\/span><span> by other countries played no significant role in the conservative revolution in Britain and the United States.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>The question stem simplified means: Which of the following statements could be seen as being in accordance with the passage?&nbsp;<\/span><span><b>OR<\/b><\/span><span> Which of the following statements is TRUE as per the passage?<\/span>\r<br /><span>Option 1. If false, “<\/span><span>State interventionism did not play a significant role…”&nbsp;<\/span><span>Since, t<\/span><span>his is in accordance with the passage<\/span><span> on being falsified, it is n<\/span><span>ot an exception.<\/span>\r<br /><span>The author’s argument is given in the last paragraph of the passage - \"In fact, neither the economic liberalization that began around 1980 nor the state interventionism that began in 1945 deserves such praise or blame...\" So, option 1 (as given) is not in accordance with the passage. Hence, when it is falsified, it is in accordance with the passage and so, not an exception.<\/span>\r<br /><span>Option 2. If false, “Economic liberalization did not play a significant role…”–&nbsp;<\/span><span>Since, t<\/span><span>his is in accordance with the passage<\/span><span> on being falsified, it is n<\/span><span>ot an exception.<\/span>\r<br /><span>Option 3. If false, “<\/span><span>The existence of the&nbsp;<\/span><span>Trente<\/span><span>&nbsp;<\/span><span>Glorieuses<\/span><span> did not shape the public opinion…”&nbsp;<\/span><span> This is not in accordance with the passage<\/span><span> on being falsified<\/span><span>; hence, the exception. Or simply the&nbsp;<\/span><span>given&nbsp;<\/span><span>statement is true as per the passage.<\/span>\r<br />Option 4. If false, “A sense of being&nbsp;<span>rivaled<\/span><span> by other countries played a significant role…”&nbsp;<\/span><span>Since, t<\/span><span>his is in accordance with the passage<\/span><span> on being falsified, it is n<\/span><span>ot an exception.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Inference"}, {"number": 17, "sourceId": "168777154140716", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<p><span><strong>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/strong><\/span><\/p>\n<p><br /><span> <\/span><span>1.<\/span> <span>The study of comparative religion brought him to the conclusion that all religions were true and yet they were &lsquo;interpreted with poor intellects, poor hearts, and often misinterpreted.&rsquo;<\/span><br /><span>2.<\/span> <span>His Quaker friends in Pretoria failed to convert him to Christianity, but they quickened his appetite for religious studies.<\/span><br /><span>3.<\/span> <span>He was fascinated by the writings of Leo Tolstoy on Christianity, read the <\/span><span>Qurʾān<\/span><span> in translation, and delved into Hindu scriptures and philosophy.<\/span><br /><span>4.<\/span> <span>Gandhi&rsquo;s religious quest dated back to his childhood, the influence of his mother and of his home life in Porbandar, but it received a great impetus after his arrival in South Africa.<\/span><br /><br /><span><\/span><\/p>", "options": [], "answer": "4231", "answerLabel": "4231", "solution": "<\/span>\t<span>Sentence 1. “The study of comparative religion brought him to the conclusion…”. The antecedent of ‘him’ has to be clear’. Could be a concluding sentence.<\/span>\r<br /><span>Sentence 2. ‘appetite for religious studies could tangentially refer to ‘the study of comparative religion’ in 1. 2-1 is a possibility; however not a strong one.<\/span>\r<br /><span>Sentence 3. 3-1 appears a stronger possibility than 2-1.<\/span>\r<br /><span>Sentence 4. Good as the starter,&nbsp;<\/span><span>Introduces Gandhi as the antecedent to the pronouns in the other statements. 4 (“religious quest…received a great impetus) is&nbsp;<\/span><span>followed by 2&nbsp;<\/span><span>(quickened his appetite for&nbsp;<\/span><span>religious studies<\/span><span>)<\/span><span>. 4- 2 is a pair.<\/span><span> This is followed by 3 which gives examples of diverse religious studies, and finally 1 where all the different studies ( study of comparative religion”) help him reach a “conclusion”&nbsp;<\/span>\r<br /><span>4-2 followed by 3-1 gives a coherent paragraph.<\/span>\r<br /><span>Therefore, the required answer is 4231.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 18, "sourceId": "168777154140917", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<span><b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><\/span><br><br><span>1.<\/span>\t<span>Bluetooth, because it requires only an adapter on each device, tends to be simpler and needs less power, although at the expense of range and speed of data transfer, in which Wi-Fi typically exceeds Bluetooth’s capabilities.<\/span><br><span>2.<\/span>\t<span>Although both are wireless forms of communication, Bluetooth and Wi-Fi differ in terms of their purpose, capabilities, and other factors.<\/span><br><span>3.<\/span>\t<span>Bluetooth limits the number of devices that can connect at any one time, whereas Wi-Fi is open to more devices and more users.<\/span><br><span>4.<\/span>\t<span>Bluetooth allows for short-range data transfer between devices; Wi-Fi, on the other hand, allows devices to connect to the Internet.<\/span><br><br><span>", "options": [], "answer": "2431", "answerLabel": "2431", "solution": "<\/span>\t<span>Sentence 1: Too abrupt if used as a starter. In comparison the sentence is similar to 3 and 4 – all beginning with Bluetooth and comparing it with Wi-Fi.<\/span>\r<br /><span>Sentence 2: The only good sentence for the starter, though it is somewhat an abrupt beginning.<\/span>\r<br /><span>Sentence 3: Similar to sentence 1. Comparison of Bluetooth to Wi-Fi.<\/span>\r<br /><span>Sentence 4: Similar to sentences 1 and 3 . Comparison of Bluetooth to Wi-Fi.<\/span>\r<br /><span>Sentence 2 being the de facto starter 1, 3 and 4 need to be arranged with some coherence though they are similar. “purpose, capabilities, and other factors” in sentence 2 helps to arrange them as 431 – purpose, capabilities, and other factors.<\/span>\r<br /><span>Therefore, the required answer is 2431.<\/span>", "topic": "Jumbled Paragraph
