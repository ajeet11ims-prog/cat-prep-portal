an><br><br><span>Finally, some liberals maintain that international institutions enhance the prospects for cooperation among states and thus significantly reduce the likelihood of war. Institutions are not independent political entities that sit above states and force them to behave in acceptable ways. Instead, institutions are sets of rules that stipulate the ways in which states should cooperate and <\/span><span>compete with each other<\/span><span>. They prescribe acceptable forms of state behaviour and proscribe unacceptable kinds of behaviour. These rules are not imposed on states by some leviathan, but are negotiated by states, which agree to abide by the rules they created because it is in their interest to do so. Liberals claim that these institutions or rules can fundamentally change state behaviour. Institutions can discourage states from calculating self-interest <\/span><span>on the basis of<\/span><span> how their every move affects their relative power position, and thus they push states away from war and promote peace.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\tWhich one of the following sets of terms best serves as keywords for the passage?", "options": ["<span>Liberalism Core, Democracy, Economic Cooperation, State <\/span><span>Behavior<\/span><span>, International Relations.<\/span>", "<span><\/span>\tLiberalism, Democratic Peace Theory, Economic Interdependence, International Institutions, Peace", "<span><\/span>\tOptimistic Liberalism, Good and Bad states, Economic Interdependence, International Institutions", "<span><\/span>\tLiberalism, State <span>behavior<\/span><span>, Economic interdependence, International Relations, Peace<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\tThe passage is structured around liberal international relations theories and their views on state behaviour (including economic cooperation between them) and international cooperation. And how it all leads to peace.\r<br /><span>Option 1. ‘Liberalism core’ is misleading. ‘Democracy, Economic cooperation, International Institutions’ all come under state behaviour. Not the best set of key terms.<\/span>\r<br /><span>Option 2. Democratic peace theory and International institutions are unnecessarily stressed.<\/span>\r<br /><span>Option 3. Optimistic liberalism, good and bad states, and international institutions are not quite the key terms.<\/span>\r<br /><span>Option 4. Best set of key words. Follows the structure of the passage closely.<\/span>\r<br />Hence, [4].", "topic": "Central Idea"}, {"number": 13, "sourceId": "168846829575712", "type": "mcq", "passage": "<p><strong>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/strong><br /><br /><span>For nearly three decades, ecologists considered chaos in the living world to be surprisingly rare&hellip;[However], <\/span><span>analyzing<\/span><span> more than 170 sets of time-dependent ecosystem data, Tanya Rogers, a research ecologist at the University of California, Santa Cruz, and her colleagues found that chaos was present in a third of them &mdash; nearly three times more than the estimates in previous studies&hellip;<\/span><\/p>\n<p><span>Chaos reflects predictability over time. A system is said to be stable if it changes very little over a long timescale, and random if its fluctuations are unpredictable. But a chaotic system &mdash; one ruled by nonlinear responses to events &mdash; may be predictable over short periods but is subject to increasingly dramatic shifts the further out you go&hellip;<\/span><br /><br /><span>Ecologists began flirting with the concept of chaos in the 1970s, when the mathematical biologist Robert May developed a revolutionary tool called the logistic map. This branching diagram shows how chaos creeps into simple models of population growth and other systems over time&hellip; By the early &rsquo;90s, ecologists had amassed enough time-series data sets on species populations and enough computing power to test their ideas. There was just one problem: The chaos didn&rsquo;t seem to be there. Only about 10% of the examined populations seemed to change chaotically; the rest either cycled stably or fluctuated randomly&hellip;<\/span><br /><br /><span>The new results, however, suggest that the older work missed where the chaos was hiding. To detect chaos, the earlier studies used models with a single dimension &mdash; the population size of one species over time. They didn&rsquo;t consider corresponding changes in messy real-world factors like temperature, sunlight, <\/span><span>rainfall<\/span><span> and interactions with other species that might affect populations. Their one-dimensional models captured how the populations changed, but not why they changed.<\/span><\/p>\n<p><span>But,<\/span><span> [&hellip;] [Rogers and team] <\/span><span>analyzed<\/span><span> 172 time series of different organisms&rsquo; populations as models with as many as six dimensions rather than just one. In this way, they could check whether unnoticed <\/span>chaotic patterns might be embedded within the one-dimensional representation of the population shifts. For example, more rainfall might be chaotically linked to population increases or decreases, but only after a delay of several years.<br /><br /><span>In the population data for about 34% of the species, the signatures of nonlinear interactions were indeed present, which was significantly more chaos than was previously detected&hellip; The researchers also uncovered an inverse relationship between an organism&rsquo;s body size and how chaotic its population dynamics tend to be. This may be due to differences in generation time, with small organisms that breed more often also being more affected by outside variables more often&hellip;<\/span><br /><br /><span>Improved models with the right element of chaos could do a better job of forecasting toxic algal blooms, for example, or tracking fishery populations to prevent overfishing&hellip; However, [some ecologists caution against] placing too much faith in these chaos-conscious models. The classical concept of chaos is fundamentally a stationary concept. It is built on the assumption that chaotic fluctuations represent a departure from some predictable, stable norm. But as climate change progresses, most real-world ecosystems are becoming increasingly unstable even in the short term. Even taking many dimensions into account, scientists will have to be conscious of this ever-shifting baseline&hellip;<\/span><\/p>", "passageTitle": ".", "question": "<span><\/span>\tWhich one of the following statements, if FALSE, could be seen as contradicting the facts/arguments in the passage?", "options": ["<span>The <\/span><span>behavior<\/span><span> of chaotic systems is not completely determined by their interacting components.<\/span>", "<span><\/span>\tNonlinear systems do not exhibit complex and unpredictable <span>behavior<\/span><span> predicted using mathematical methods.<\/span>", "<span><\/span>\tThe outcome of random events can be predicted with certainty, though they occur without any discernible pattern.", "<span><\/span>\t<span>Chaotic systems’ apparently stable <\/span><span>behavior<\/span><span> in the short term is ultimately unpredictable over longer time scales.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<\/span>\t<span>‘If false … contradicts the passage’<\/span><span> is another complex stem equivalent to&nbsp;<\/span><span>‘all of the following if false … are in accordance&nbsp;<\/span><span>except<\/span><span>’<\/span><span>). So, reduced to the basics it simply means&nbsp;<\/span><span>which of the following … supports the passage<\/span><span>?<\/span>\r<br /><span>Option 1 – If false: The behaviour of chaotic systems is completely determined by their interacting components.  The whole passage, and&nbsp;<\/span><span>Tanya Rogers’ research is based on this assumption. It does not contradict the passage.<\/span>\r<br /><span>Option 2. – If false:&nbsp;<\/span><span>Nonlinear systems exhibit complex and unpredictable&nbsp;<\/span><span>behavior<\/span><span> predicted using mathematical methods. Nonlinear systems – both random and chaotic systems- act this way. Hence it does not contradict the passage.<\/span>\r<br /><span>Option 3. If false:   The outcome of random events cannot be predicted with certainty, though they occur without any discernible pattern.  Random events are&nbsp;<\/span><span>by definition unpredictable<\/span><span>. Hence it does not contradict the passage.<\/span>\r<br /><span>Option 4. If false: Chaotic systems’ apparently stable&nbsp;<\/span><span>behavior<\/span><span> in the short term is ultimately unpredictable over longer time scales. “<\/span><span>Chaos reflects predictability over time” (paragraph 2). The writer then immediately changes tracks and concludes in the same paragraph that in the long run chaotic systems can exhibit dramatic changes – which are unpredictable. What it boils down to is that chaotic systems may appear stable with very few changes in short periods and the changes are predictable but in the long run, they are completely unpredictable.<\/span>\r<br />Hence, [4].\r<br />\r<br />\r<br />", "topic": "Application Question"}, {"number": 14, "sourceId": "168846829575813", "type": "mcq", "passage": "<p><strong>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/strong><br /><br /><span>For nearly three decades, ecologists considered chaos in the living world to be surprisingly rare&hellip;[However], <\/span><span>analyzing<\/span><span> more than 170 sets of time-dependent ecosystem data, Tanya Rogers, a research ecologist at the University of California, Santa Cruz, and her colleagues found that chaos was present in a third of them &mdash; nearly three times more than the estimates in previous studies&hellip;<\/span><\/p>\n<p><span>Chaos reflects predictability over time. A system is said to be stable if it changes very little over a long timescale, and random if its fluctuations are unpredictable. But a chaotic system &mdash; one ruled by nonlinear responses to events &mdash; may be predictable over short periods but is subject to increasingly dramatic shifts the further out you go&hellip;<\/span><br /><br /><span>Ecologists began flirting with the concept of chaos in the 1970s, when the mathematical biologist Robert May developed a revolutionary tool called the logistic map. This branching diagram shows how chaos creeps into simple models of population growth and other systems over time&hellip; By the early &rsquo;90s, ecologists had amassed enough time-series data sets on species populations and enough computing power to test their ideas. There was just one problem: The chaos didn&rsquo;t seem to be there. Only about 10% of the examined populations seemed to change chaotically; the rest either cycled stably or fluctuated randomly&hellip;<\/span><br /><br /><span>The new results, however, suggest that the older work missed where the chaos was hiding. To detect chaos, the earlier studies used models with a single dimension &mdash; the population size of one species over time. They didn&rsquo;t consider corresponding changes in messy real-world factors like temperature, sunlight, <\/span><span>rainfall<\/span><span> and interactions with other species that might affect populations. Their one-dimensional models captured how the populations changed, but not why they changed.<\/span><\/p>\n<p><span>But,<\/span><span> [&hellip;] [Rogers and team] <\/span><span>analyzed<\/span><span> 172 time series of different organisms&rsquo; populations as models with as many as six dimensions rather than just one. In this way, they could check whether unnoticed <\/span>chaotic patterns might be embedded within the one-dimensional representation of the population shifts. For example, more rainfall might be chaotically linked to population increases or decreases, but only after a delay of several years.<br /><br /><span>In the population data for about 34% of the species, the signatures of nonlinear interactions were indeed present, which was significantly more chaos than was previously detected&hellip; The researchers also uncovered an inverse relationship between an organism&rsquo;s body size and how chaotic its population dynamics tend to be. This may be due to differences in generation time, with small organisms that breed more often also being more affected by outside variables more often&hellip;<\/span><br /><br /><span>Improved models with the right element of chaos could do a better job of forecasting toxic algal blooms, for example, or tracking fishery populations to prevent overfishing&hellip; However, [some ecologists caution against] placing too much faith in these chaos-conscious models. The classical concept of chaos is fundamentally a stationary concept. It is built on the assumption that chaotic fluctuations represent a departure from some predictable, stable norm. But as climate change progresses, most real-world ecosystems are becoming increasingly unstable even in the short term. Even taking many dimensions into account, scientists will have to be conscious of this ever-shifting baseline&hellip;<\/span><\/p>", "passageTitle": ".", "question": "<span><\/span>\tWhich one of the following statements best reflects the main argument of the LAST paragraph of the passage?", "options": ["Ecological models that incorporate chaos are the most effective way to predict the effects of climate change on ecosystems.", "<span><\/span>\tChaos is present in a larger proportion of ecological systems than previously understood from the traditional one-dimensional models.", "<span><\/span>\tThe concept of chaos may need to be re-evaluated as real-world ecosystems become increasingly unstable due to climate change.", "<span><\/span>\tPrevious studies missed chaos in ecological systems because the classical concept was stationary and excluded the external factors."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tOption 1: Option 1 is incorrect because the paragraph does not suggest that models that incorporate chaos are the most effective way to predict the effects of climate change.\r<br /><span>Option 2. This statement can be derived from the whole passage and is consistent with the new study. The last paragraph, however, takes this for granted and highlights the inadequacy of the classical as well as the new models in the background of fast-changing ecosystems due to climate change.<\/span>\r<br /><span>Option 3. Answer. The paragraph concludes that the classical concept of chaos, which&nbsp;<\/span><span>asumes<\/span><span> some stable norm from which fluctuations depart, may not be suitable for&nbsp;<\/span><span>modeling<\/span><span> these increasingly unstable ecosystems. Therefore, option 3 reflects the main argument of the last paragrap<\/span><span>3<\/span><span>.<\/span>\r<br /><span>Option 4. Stated in the last paragraph, but not its main argument.<\/span>\r<br />Hence, [3].", "topic": "Inference"}, {"number": 15, "sourceId": "168846829575814", "type": "mcq", "passage": "<p><strong>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/strong><br /><br /><span>For nearly three decades, ecologists considered chaos in the living world to be surprisingly rare&hellip;[However], <\/span><span>analyzing<\/span><span> more than 170 sets of time-dependent ecosystem data, Tanya Rogers, a research ecologist at the University of California, Santa Cruz, and her colleagues found that chaos was present in a third of them &mdash; nearly three times more than the estimates in previous studies&hellip;<\/span><\/p>\n<p><span>Chaos reflects predictability over time. A system is said to be stable if it changes very little over a long timescale, and random if its fluctuations are unpredictable. But a chaotic system &mdash; one ruled by nonlinear responses to events &mdash; may be predictable over short periods but is subject to increasingly dramatic shifts the further out you go&hellip;<\/span><br /><br /><span>Ecologists began flirting with the concept of chaos in the 1970s, when the mathematical biologist Robert May developed a revolutionary tool called the logistic map. This branching diagram shows how chaos creeps into simple models of population growth and other systems over time&hellip; By the early &rsquo;90s, ecologists had amassed enough time-series data sets on species populations and enough computing power to test their ideas. There was just one problem: The chaos didn&rsquo;t seem to be there. Only about 10% of the examined populations seemed to change chaotically; the rest either cycled stably or fluctuated randomly&hellip;<\/span><br /><br /><span>The new results, however, suggest that the older work missed where the chaos was hiding. To detect chaos, the earlier studies used models with a single dimension &mdash; the population size of one species over time. They didn&rsquo;t consider corresponding changes in messy real-world factors like temperature, sunlight, <\/span><span>rainfall<\/span><span> and interactions with other species that might affect populations. Their one-dimensional models captured how the populations changed, but not why they changed.<\/span><\/p>\n<p><span>But,<\/span><span> [&hellip;] [Rogers and team] <\/span><span>analyzed<\/span><span> 172 time series of different organisms&rsquo; populations as models with as many as six dimensions rather than just one. In this way, they could check whether unnoticed <\/span>chaotic patterns might be embedded within the one-dimensional representation of the population shifts. For example, more rainfall might be chaotically linked to population increases or decreases, but only after a delay of several years.<br /><br /><span>In the population data for about 34% of the species, the signatures of nonlinear interactions were indeed present, which was significantly more chaos than was previously detected&hellip; The researchers also uncovered an inverse relationship between an organism&rsquo;s body size and how chaotic its population dynamics tend to be. This may be due to differences in generation time, with small organisms that breed more often also being more affected by outside variables more often&hellip;<\/span><br /><br /><span>Improved models with the right element of chaos could do a better job of forecasting toxic algal blooms, for example, or tracking fishery populations to prevent overfishing&hellip; However, [some ecologists caution against] placing too much faith in these chaos-conscious models. The classical concept of chaos is fundamentally a stationary concept. It is built on the assumption that chaotic fluctuations represent a departure from some predictable, stable norm. But as climate change progresses, most real-world ecosystems are becoming increasingly unstable even in the short term. Even taking many dimensions into account, scientists will have to be conscious of this ever-shifting baseline&hellip;<\/span><\/p>", "passageTitle": ".", "question": "“<span>Chaos reflects predictability over time.” <\/span>In the context of the passage, what is the author trying to communicate in this quoted extract?", "options": ["A chaotic system exhibits unpredictable and dramatic shifts over longer timescales.", "<span><\/span>\tChaotic systems may appear stable in the short term but are fundamentally unstable.", "<span><\/span>\tThe apparently predictable behaviour of stable systems is ultimately unpredictable.", "<span><\/span>\tA chaotic system may remain constant with changes within predictable bounds."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t\"Chaos reflects predictability over time.\" This statement contradicts the definition of chaos, which is characterized by nonlinear responses to events and unpredictability over longer timescales. However, the author chooses to highlight the deceptive stability of chaotic systems in this sentence.&nbsp;<span>So<\/span><span> he links chaotic systems to predictability but finally explains it as “(chaotic systems)&nbsp;<\/span><span>may be predictable over short periods but is subject to increasingly dramatic shifts the further out you go<\/span><span>.” Option 2 captures this best.<\/span>\r<br /><span>Option 1. Factually correct. But the quoted sentences&nbsp;<\/span><span>talks<\/span><span> about the predictability of chaotic systems.<\/span>\r<br /><span>Option 2. Correct.<\/span>\r<br /><span>Option 3. Stable systems are always predictable – not unpredictable as the option states.<\/span>\r<br /><span>Option 4. Factually incorrect. They can exhibit dramatic shifts.<\/span>\r<br />Hence, [2].", "topic": "Inference"}, {"number": 16, "sourceId": "168846829575815", "type": "mcq", "passage": "<p><strong>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/strong><br /><br /><span>For nearly three decades, ecologists considered chaos in the living world to be surprisingly rare&hellip;[However], <\/span><span>analyzing<\/span><span> more than 170 sets of time-dependent ecosystem data, Tanya Rogers, a research ecologist at the University of California, Santa Cruz, and her colleagues found that chaos was present in a third of them &mdash; nearly three times more than the estimates in previous studies&hellip;<\/span><\/p>\n<p><span>Chaos reflects predictability over time. A system is said to be stable if it changes very little over a long timescale, and random if its fluctuations are unpredictable. But a chaotic system &mdash; one ruled by nonlinear responses to events &mdash; may be predictable over short periods but is subject to increasingly dramatic shifts the further out you go&hellip;<\/span><br /><br /><span>Ecologists began flirting with the concept of chaos in the 1970s, when the mathematical biologist Robert May developed a revolutionary tool called the logistic map. This branching diagram shows how chaos creeps into simple models of population growth and other systems over time&hellip; By the early &rsquo;90s, ecologists had amassed enough time-series data sets on species populations and enough computing power to test their ideas. There was just one problem: The chaos didn&rsquo;t seem to be there. Only about 10% of the examined populations seemed to change chaotically; the rest either cycled stably or fluctuated randomly&hellip;<\/span><br /><br /><span>The new results, however, suggest that the older work missed where the chaos was hiding. To detect chaos, the earlier studies used models with a single dimension &mdash; the population size of one species over time. They didn&rsquo;t consider corresponding changes in messy real-world factors like temperature, sunlight, <\/span><span>rainfall<\/span><span> and interactions with other species that might affect populations. Their one-dimensional models captured how the populations changed, but not why they changed.<\/span><\/p>\n<p><span>But,<\/span><span> [&hellip;] [Rogers and team] <\/span><span>analyzed<\/span><span> 172 time series of different organisms&rsquo; populations as models with as many as six dimensions rather than just one. In this way, they could check whether unnoticed <\/span>chaotic patterns might be embedded within the one-dimensional representation of the population shifts. For example, more rainfall might be chaotically linked to population increases or decreases, but only after a delay of several years.<br /><br /><span>In the population data for about 34% of the species, the signatures of nonlinear interactions were indeed present, which was significantly more chaos than was previously detected&hellip; The researchers also uncovered an inverse relationship between an organism&rsquo;s body size and how chaotic its population dynamics tend to be. This may be due to differences in generation time, with small organisms that breed more often also being more affected by outside variables more often&hellip;<\/span><br /><br /><span>Improved models with the right element of chaos could do a better job of forecasting toxic algal blooms, for example, or tracking fishery populations to prevent overfishing&hellip; However, [some ecologists caution against] placing too much faith in these chaos-conscious models. The classical concept of chaos is fundamentally a stationary concept. It is built on the assumption that chaotic fluctuations represent a departure from some predictable, stable norm. But as climate change progresses, most real-world ecosystems are becoming increasingly unstable even in the short term. Even taking many dimensions into account, scientists will have to be conscious of this ever-shifting baseline&hellip;<\/span><\/p>", "passageTitle": ".", "question": "<span><\/span>\tNone of the following is true regarding the use of chaos-conscious models in ecological forecasting EXCEPT:", "options": ["<span>Improved models with the right element of chaos may be effective in preventing overfishing.<\/span>", "<span><\/span>\tThe classical concept of chaos assumes that chaotic fluctuations represent a departure from some predictable, stable norm.", "<span><\/span>\tSome ecologists believe that chaos-conscious models should be relied upon entirely for ecological forecasting.", "<span><\/span>\tAs climate change progresses, real-world ecosystems are becoming more predictable over time."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\tOption 1. The passage states that improved models with the right element of chaos could do a better job of tracking fishery populations to prevent overfishing, but it does not say that these models are effective in preventing overfishing.\r<br /><span>Option 2. True. “<\/span><span>The classical concept of chaos is fundamentally a stationary concept. It is built on the assumption that chaotic fluctuations represent a departure from some predictable, stable norm.”<\/span>\r<br /><span>Option 3. The passage does not suggest that some ecologists believe chaos-conscious models should be relied upon entirely for ecological forecasting. Rather, it cautions against placing too much faith in these models.<\/span>\r<br /><span>Option 4. The passage says that real-world ecosystems are becoming increasingly unstable over time, which is the opposite of becoming more predictable over time.<\/span>\r<br />Hence, [2].", "topic": "Specific Detail Question"}, {"number": 17, "sourceId": "168846829575816", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br>1.\t<span>In order to<\/span><span> overcome this challenge, businesses must foster a culture of innovation and create an environment that encourages creativity and risk-taking.<\/span><br><span>2.<\/span>\tThis may involve investing in research and development, seeking out new ideas and perspectives, and empowering employees to share their ideas and take ownership of their work.<br><span>3.<\/span>\tMany businesses struggle to innovate because they are trapped in their existing processes and ways of thinking.<br><span>4.<\/span>\tIn the world of business, innovation is essential for companies to stay competitive and relevant.<br><br><span>", "options": [], "answer": "4312", "answerLabel": "4312", "solution": "<\/span>\tSentence 1. “to overcome this challenge” refers to a challenge specified earlier.\r<br /><span>Sentence 2. “this may involve investing in research…” is a strategy to solve some problem. Hence both sentences 1 and 2 must be linked to 3 and 4.<\/span>\r<br /><span>Sentence 3. Why businesses struggle to innovate. 3-1 is a distinct possibility.<\/span>\r<br /><span>Sentence 4. Good opening sentence. 4 is then followed by 3-1 and 2 closes the paragraph ‘this may involve’ referring to ‘fostering a culture of innovation’ in 1.<\/span>\r<br /><span><b>The<\/b><\/span><span><b>refore, the required answer is&nbsp;<\/b><\/span><span><b>4312<\/b><\/span><span><b>.<\/b><\/span>\r<br />\r<br />\r<br />\r<br />\r<br />", "topic": "Jumbled Paragraphs"}, {"number": 18, "sourceId": "168846829576317", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br>1.\t<span>McClellan's hesitation in the face of the attack delayed a counterattack, while the Confederates failed to gain an advantage.<\/span><br>2.\tPresident Abraham Lincoln denied McClellan's requests for reinforcements, reminding him that the Union army had superior size, manpower, and resources.<br><span>3.<\/span>\tIn the Battle of Seven Pines during the American Civil War, General George McClellan's Union Army stopped advancing towards the Confederate capital Richmond due to inaccurate intelligence reports.<br><span>4.<\/span>\tConfederate commander Joseph E. Johnston launched a surprise attack, resulting in no strategic gain for either side.<br><br><span>", "options": [], "answer": "3241", "answerLabel": "3241", "solution": "<\/span>\tSentence 1. Part of a historical narrative. Not the starter.\r<br /><span>Sentence 2.&nbsp;<\/span><span>Similar to<\/span><span> sentence 1. Not the starter.<\/span>\r<br /><span>Sentence 3. Sets the background for the narrative – mention of Battle of seven Pines as the background makes it the starter.<\/span>\r<br /><span>Sentence 4.&nbsp;<\/span><span>Similar to<\/span><span> 1 and 2.<\/span>\r<br /><span>Apparently, no conventional connectors can be seen. Sentence 3 starts the paragraph. 4-1 appears plausible with mention of ‘attack’ and ‘<\/span><span>counter attack<\/span><span>’. Assuming 4-1 is a pair and 3 as the starter, 2 can be placed after 3, as 3-2. ‘inaccurate intelligence&nbsp;<\/span><span>reports’<\/span><span> and Lincoln’s refusal to allow reinforcements are implicitly connected. 3241 gives coherence to the narrative as 1 is the outcome of the Battle of Pines.<\/span>\r<br /><span>Therefore, the required answer is 3241.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 19, "sourceId": "168846829576418", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br>1.\t<span>Revisiting economic theory and practice that have been overlooked is essential for achieving sustainable growth, as evidenced by the neglect of the care sector by governments and businesses despite the pandemic exposing flaws in how we think about it.<\/span><br><span>2.<\/span>\tThe current \"<span>polycrisis<\/span><span>\" has affected some positively, as extreme wealth and poverty have both increased for the first time in 25 years.<\/span><br><span>3.<\/span>\tNonetheless, feminist economics in Latin America is advancing new ways of thinking, driving policy <span>innovation<\/span><span> and increasing female participation in policymaking.<\/span><br><span>4.<\/span>\tHowever, there are numerous other problems that demand immediate attention, including rising debt, job insecurity, inflation, climate change, and food insecurity.<br><br><span>", "options": [], "answer": "2413", "answerLabel": "2413", "solution": "<\/span>\tSentence 1. Standalone sentence. Can be considered for the start.\r<br /><span>Sentence 2. ‘The current poly crisis…’ may also provide a good starting point.<\/span>\r<br /><span>Sentence 3. “Nonetheless…’ comes within somewhere the paragraph.<\/span>\r<br /><span>Sentence 4.&nbsp;<\/span><span>Similar to<\/span><span> 3. Comes within the paragraph.<\/span>\r<br /><span>So<\/span><span> we need to start the paragraph with either 1 or 2. 2-4 and 1-3 appear logical pairs. The pairs can be placed in that order (2413) to get a meaningful paragraph.<\/span>\r<br /><span>Therefore, the required answer is 2413.<\/span>", "topic": "Jumbled Paragraphs"}, {"number": 20, "sourceId": "168846829576619", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><span><b>Sentence: <\/b><\/span><br>The use of plastic bags has been banned in many countries due to their harmful impact on the environment.<br><br><span><b>Paragraph: <\/b><\/span><br><span>_____1____. However, plastic bags take a significant toll on the environment, particularly on wildlife. Marine animals, such as sea turtles and whales, often mistake plastic bags for food, leading to ingestion and eventual death. Furthermore, plastic bags do not biodegrade and can persist in the environment for hundreds of years. _____2____. For this reason, many countries have instituted bans on the use of plastic bags, instead promoting the use of reusable bags made of materials such as cotton or canvas. _____3____. These alternatives to plastic bags are not only better for the environment, but they are also more durable and can be used multiple times, making them more cost-effective in the long run. _____4____.<\/span>", "options": ["<span>Option 1<\/span>", "<span><\/span>\tOption 2", "<span><\/span>\tOption 3", "<span><\/span>\tOption 4"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\tThe given sentence \"The use of plastic bags has been banned in many countries due to their harmful impact on the environment\" fits best in the first blank. This is because the first sentence is a general statement about plastic bags and their impact on the environment, and the second sentence provides more specific details about their harmful effects on wildlife. The third sentence discusses alternatives to plastic bags, which implies that there is a problem with their use, but it does not explicitly state that plastic bags have been banned in many countries. The fourth sentence likely concludes the paragraph by discussing the benefits of using reusable bags. Therefore, the best option for the blank is option 1, as it provides a clear introduction to the topic of plastic bags and sets up the subsequent discussion about their negative impact on the environment.\r<br />Hence, [1].", "topic": "Paragraph Completion"}, {"number": 21, "sourceId": "168846829576720", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><span><b>Sentence: <\/b><\/span><br><span>The human brain is the most complex organ in the body.<\/span><br><br><span><b>Paragraph: <\/b><\/span><br><span>_____1____. It weighs only about 3 pounds but contains more than 100 billion nerve cells, or neurons, and trillions of connections between them. It is responsible for controlling all bodily functions, including movement, sensation, thought, and emotion. Despite decades of research, much of the brain's functioning and capabilities are still a mystery to scientists. _____2____. This complexity allows us to engage in creative <\/span><span>endeavors<\/span><span>, make complex decisions, and experience a range of emotions. However, it also makes the brain susceptible to a range of disorders and diseases, such as Alzheimer's disease, Parkinson's disease, and schizophrenia. _____3____. The brain also has the remarkable ability to adapt and change throughout our lives, a phenomenon known as neuroplasticity. This ability allows us to learn new skills and adapt to new situations, but it also means that the brain can be affected by negative experiences, such as trauma or addiction. _____4____.<\/span>", "options": ["Option 1", "<span><\/span>\tOption 2", "<span><\/span>\tOption 3", "<span><\/span>\tOption 4"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\tThe given sentence \"The human brain is the most complex organ in the body\" fits best in the second blank. This is because the first sentence introduces the topic of the brain without naming it, and the second sentence builds on this idea by discussing the brain's amazing capabilities. Though the key sentence fits well in blank 1 as well, “this complexity” in the sentence after blank 2 makes it the most appropriate place – with the ‘complexity explained’ well. Therefore, the best option for the blank is option 2. A paragraph or sentence can begin with a pronoun with the antecedent mentioned later for effect.\r<br />Hence, [2].", "topic": "Paragraph Completion"}, {"number": 22, "sourceId": "168846829576921", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><span><b> <\/b><\/span><br><span>While the economic inequalities arising from the last fifty <\/span><span>or<\/span><span> so years of globalization are a major factor explaining contemporary politics, economic grievances become much more acute when they are attached to feelings of indignity and disrespect. Indeed, much of what we understand to be economic motivation <\/span><span>actually reflects<\/span><span> not a straightforward desire for wealth and resources, but the fact that <\/span>money is perceived to be a marker of status and buys respect. Modern economic theory is built around the assumption that human beings are rational individuals who all want to maximize their “utility”—that is, their material well-being—and that politics is simply an extension of that maximizing <span>behavior<\/span><span>. However, if we are ever to properly interpret the <\/span><span>behavior<\/span><span> of real human beings in the contemporary world, we <\/span><span>have to<\/span><span> expand our understanding of human motivation beyond this simple economic model that so dominates much of our discourse.<\/span>", "options": ["<span>The assumption that people's political behaviour is driven by their desire to maximize their material well-being rather than dignity and respect exacerbates their economic grievances as money is perceived to be a marker of status.<\/span>", "<span><\/span>\tEconomic grievances caused by inequality get intensified when linked to disrespect, as people's economic motivation stems from a desire for respect rather than just wealth, challenging the contemporary economic theory.", "<span><\/span>\tEconomic grievances produced by inequality of globalization arise not merely from a desire to maximize wealth but from a desire for respect contrary to the economic model that explains politics as an extension of the maximizing <span>behavior<\/span><span>.<\/span>", "<span><\/span>\tInequality of globalization and political grievances are heightened when linked to feelings of disrespect; the assumption that individuals are primarily driven by a desire to maximize their material well-being can worsen economic inequality."], "answer": 2, "answerLabel": "C", "solution": "<span><b>Points:<\/b><\/span>\r<br />\t<span>·<\/span><span><b>&nbsp;<\/b><\/span>\t<span>Economic inequality (of globalization) is a major factor in contemporary politics.<\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\tIt is made more acute because it is attached to a feeling of disrespect.\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\tPeople seek not only wealth but status and dignity.\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\tEconomic theory assumes that people merely desire material well-being and that decides their political&nbsp;<span>behavior<\/span><span>.<\/span>\r<br />\r<br /><span>Option 1. Inequality, globalisation – missing<\/span><span>.<\/span><span><\/span>\r<br /><span>Option 2. 'economic inequalities arising from…globalisation' is missing. Contemporary economic theory is unclear - not spelt out.<\/span>\r<br /><span>Option 3 is the best precis. Captures the essence.<\/span>\r<br /><span>Option 4. The quest for dignity is not mentioned.<\/span>\r<br /><span>Hence, [3].<\/span>", "topic": "Summary"}, {"number": 23, "sourceId": "168846829577022", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br><span>Every technology is an expression of human will. Through our tools, we seek to expand our power and control over our circumstances—over nature, over time and distance, over one another. Our technologies can be divided, roughly, into four categories, according to the way they supplement or amplify our native capacities. One set, which encompasses the <\/span><span>plow<\/span><span> and the fighter jet, extends our physical strength or resilience. A second set, which includes the microscope and the amplifier, extends the range or sensitivity of our senses. A third group, spanning such technologies as the reservoir, and the genetically modified seeds, enables us to reshape nature to better serve our desires. The typewriter and the clock belong to the fourth category, which might best be called “intellectual technologies.” It is our intellectual technologies that have the greatest and most lasting power over what and how we think. They are our most intimate tools, the ones we use for self-expression, for shaping personal and public identity, and for cultivating relations with others.<\/span>", "options": ["<span>Technology is a manifestation of human desire to control the <\/span><span>world, and<\/span><span> can be divided into four categories based on how they extend our physical strength, sensory perception, relationship with nature, and intellectual enhancement.<\/span>", "<span><\/span>\tTechnologies, a reflection of human will, can be categorized as those that enhance physical strength, those that extend our senses, those that allow us to reshape nature, and those intellectual tools which shape our personal and public identities.", "<span><\/span>\tAll technologies are an expression of human <span>will, and<\/span><span> can be divided into categories based on how they supplement or amplify our physical, sensory and intellectual abilities, with the latter having the most lasting power over our thinking and personal relationships.<\/span>", "<span><\/span>\tTechnologies, a reflection of human will, can be divided into four distinct categories as those that augment our physical or mental skills, and those that allow us control nature, and those most intimate tools which can be called ‘intellectual technologies."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t\r<br /><span><b>Points:<\/b><\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\tEvery technology is an expression of human will.\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\tThey can roughly&nbsp;<span>categorised<\/span><span> into four classes: 1. Those that enhance our physical strength, 2. Those that enhance our senses 3. Those that help us reshape nature. 4. Intellectual technologies.<\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\tIntellectual technologies are most lasting and most intimate and shape our identities.\r<br /><span>Option 1. Relationship with nature is problematic.<\/span>\r<br /><span>Option 2. Correct<\/span>\r<br /><span>Option 3. Reshaping nature is not included.<\/span>\r<br /><span>Option 4. ‘distinct categories’ is distortion of ‘roughly into four categories.<\/span>\r<br /><span>Hence, [2].<\/span>", "topic": "Summary"}, {"number": 24, "sourceId": "168846829577223", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br><span>Psychologists have long suspected that a handful of fundamental differences in worldviews might underlie the conservative-liberal rift. Forty years of research has shown that, on average, conservatives see the world as a more dangerous place than liberals. This one core belief seemed to help explain many policy disagreements, such as conservative support of gun ownership, border enforcement and increased spending on the military—all of which, one can argue, aim to protect people from a threatening world. But new research at the University of Pennsylvania contradicts that long-standing theory. We find instead that the main difference between the left and right is the belief that the world is inherently hierarchical. Conservatives tend to have higher belief than liberals in a hierarchical world, which is essentially the view that the universe is a place where the lines between categories or concepts matter.<\/span>", "options": ["<span>Researchers at the University of Pennsylvania found that the policy disagreements between the right and the left stem from their belief that the world is more dangerous and from their differing view on the inherent hierarchy of the universe and the importance of categories.<\/span>", "<span><\/span>\tThe conservative-liberal rift is characterized by a difference in beliefs: conservatives tend to view the world as more dangerous than liberals and place greater importance on the lines between categories and concepts because the world is inherently more hierarchical.", "<span><\/span>\tThe conservative-liberal division is characterized by a few key differences, including the belief that the world is more dangerous and in need of protection, as well as that the world is inherently more hierarchical than liberals would acknowledge.", "<span><\/span>\tThe researchers from Pennsylvania found that the primary distinction between conservatives and liberals lies in the belief that the world is inherently hierarchical, and not that the right believed the world to be more dangerous than the left did."], "answer": 3, "answerLabel": "D", "solution": "<span><b>Points:<\/b><\/span>\r<br /><span>·<\/span><span>&nbsp;<\/span>\tPsychologists previously believed that the conservative-liberal rift stemmed from conservatives seeing the world as more dangerous than liberals.\r<br /><span>·<\/span><span>&nbsp;<\/span>\tNew research from the University of Pennsylvania contradicts this theory, finding that the primary difference between conservatives and liberals is the belief in an inherently hierarchical world.\r<br /><span>Option 1, 2 and 3 suggest that conservatives believe that the world is more dangerous and hierarchical whereas the passage states that the new research contradicts the earlier belief.<\/span>\r<br /><span>Hence, [4].<\/span>", "topic": "Summary"}]}</script><script>

function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
