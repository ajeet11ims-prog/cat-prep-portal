<script type="application/json" id="test-data">{"testNumber": 6, "simcat": 6, "minutes": 40, "questions": [{"number": 1, "sourceId": "16884682957500", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br>Today our supposedly revolutionary advancements in artificial intelligence are … a cause for both concern and optimism. Optimism because intelligence is the means by which we solve problems. Concern because we fear that the most popular and fashionable strain of A.I. — machine learning — will degrade our science and debase our ethics by incorporating into our technology a fundamentally flawed conception of language and knowledge…\r<br>\r<br>The human mind is not, like ChatGPT and its ilk, a lumbering statistical engine for pattern matching, gorging on hundreds of terabytes of data and extrapolating the most likely conversational response or most probable answer to a scientific question. On the contrary, the human mind is a surprisingly efficient and even elegant system that operates with small amounts of information; it seeks not to infer brute correlations among data points but to create explanations. For instance, a young child acquiring a language is developing — unconsciously, automatically and speedily from minuscule data — a grammar, a stupendously sophisticated system of logical principles and parameters. This grammar can be understood as an expression of the innate, genetically installed “operating system” that endows humans with the capacity to generate complex sentences and long trains of thought. When linguists seek to develop a theory for why a given language works as it does, they are building consciously and laboriously an explicit version of the grammar that the child builds instinctively and with minimal exposure to information. The child’s operating system is completely different from that of a machine learning program.\r<br>\r<br>Indeed, such programs are stuck in a prehuman or nonhuman phase of cognitive evolution. Their deepest flaw is the absence of the most critical capacity of any intelligence: to say not only what is the case, what was the case and what will be the case — that’s description and prediction — but also what is not the case and what could and could not be the case. Those are the ingredients of explanation, the mark of true intelligence.  An explanation includes not only descriptions and predictions but also counterfactual conjectures like “Any such object would fall,” plus the additional clause “because of the force of gravity” or “because of the curvature of space-time” or whatever. That is a causal explanation: “The apple would not have fallen but for the force of gravity.” That is thinking. The crux of machine learning is description and prediction; it does not posit any causal mechanisms or physical laws. Of course, any human-style explanation is not necessarily correct; we are fallible. But this is part of what it means to think: To be right, it must be possible to be wrong… Human-style thought is based on possible explanations and error correction, a process that gradually limits what possibilities can be rationally considered. \r<br>\r<br>But ChatGPT and similar programs are, by design, unlimited in what they can “learn” (which is to say, memorize); they are incapable of distinguishing the possible from the impossible...They trade merely in probabilities that change over time.… Even in instances when such programs can successfully generate correct “scientific” predictions without using explanations, such prediction is pseudoscience. While scientists certainly seek theories that have a high degree of empirical corroboration, they don’t seek highly probable theories but explanations; that is to say, powerful and highly improbable theories. True intelligence is demonstrated in the ability to think and express improbable but insightful things. True intelligence is also capable of moral thinking. This means constraining the otherwise limitless creativity of our minds with a set of ethical principles that determines what ought and ought not to be (and of course subjecting those principles themselves to creative criticism).", "passageTitle": "Reading Comprehension Passage", "question": "“AI will degrade our science and debase our ethics by incorporating into our technology a fundamentally flawed conception of language and knowledge…”. <br><br>Which of the following is NOT an example of the claim made in this statement?", "options": ["A machine learning model that accurately predicts the weather.", "A hiring algorithm perpetuating biases found in historical hiring data.", "An AI system translating a complex scientific paper without any errors.", "An AI-based analysis tool for human language to identify sarcasm."], "answer": 2, "answerLabel": "C", "solution": "Option 1. This option aligns with the claim because although the model can predict the weather accurately, it does not necessarily understand the underlying principles of meteorology. This demonstrates a potential degradation of scientific understanding.\r<br />Option 2: This option also aligns with the claim, as it highlights an ethical concern. The AI system unknowingly adopts biases from the data it was trained on, perpetuating unethical hiring practices.\r<br />Option 3: This option does NOT align with the claim because it demonstrates a successful application of AI in understanding and translating a complex scientific paper accurately. It showcases AI positively contributing to scientific understanding rather than degrading it.\r<br />Option 4: This option aligns with the claim because AI systems may struggle to understand the nuances of human language, such as sarcasm, leading to potential misunderstandings and inaccuracies. It highlights a flawed understanding of language by AI systems.\r<br />Hence, [3].", "topic": "Application Question"}, {"number": 2, "sourceId": "16884682957541", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br>Today our supposedly revolutionary advancements in artificial intelligence are … a cause for both concern and optimism. Optimism because intelligence is the means by which we solve problems. Concern because we fear that the most popular and fashionable strain of A.I. — machine learning — will degrade our science and debase our ethics by incorporating into our technology a fundamentally flawed conception of language and knowledge…\r<br>\r<br>The human mind is not, like ChatGPT and its ilk, a lumbering statistical engine for pattern matching, gorging on hundreds of terabytes of data and extrapolating the most likely conversational response or most probable answer to a scientific question. On the contrary, the human mind is a surprisingly efficient and even elegant system that operates with small amounts of information; it seeks not to infer brute correlations among data points but to create explanations. For instance, a young child acquiring a language is developing — unconsciously, automatically and speedily from minuscule data — a grammar, a stupendously sophisticated system of logical principles and parameters. This grammar can be understood as an expression of the innate, genetically installed “operating system” that endows humans with the capacity to generate complex sentences and long trains of thought. When linguists seek to develop a theory for why a given language works as it does, they are building consciously and laboriously an explicit version of the grammar that the child builds instinctively and with minimal exposure to information. The child’s operating system is completely different from that of a machine learning program.\r<br>\r<br>Indeed, such programs are stuck in a prehuman or nonhuman phase of cognitive evolution. Their deepest flaw is the absence of the most critical capacity of any intelligence: to say not only what is the case, what was the case and what will be the case — that’s description and prediction — but also what is not the case and what could and could not be the case. Those are the ingredients of explanation, the mark of true intelligence.  An explanation includes not only descriptions and predictions but also counterfactual conjectures like “Any such object would fall,” plus the additional clause “because of the force of gravity” or “because of the curvature of space-time” or whatever. That is a causal explanation: “The apple would not have fallen but for the force of gravity.” That is thinking. The crux of machine learning is description and prediction; it does not posit any causal mechanisms or physical laws. Of course, any human-style explanation is not necessarily correct; we are fallible. But this is part of what it means to think: To be right, it must be possible to be wrong… Human-style thought is based on possible explanations and error correction, a process that gradually limits what possibilities can be rationally considered. \r<br>\r<br>But ChatGPT and similar programs are, by design, unlimited in what they can “learn” (which is to say, memorize); they are incapable of distinguishing the possible from the impossible...They trade merely in probabilities that change over time.… Even in instances when such programs can successfully generate correct “scientific” predictions without using explanations, such prediction is pseudoscience. While scientists certainly seek theories that have a high degree of empirical corroboration, they don’t seek highly probable theories but explanations; that is to say, powerful and highly improbable theories. True intelligence is demonstrated in the ability to think and express improbable but insightful things. True intelligence is also capable of moral thinking. This means constraining the otherwise limitless creativity of our minds with a set of ethical principles that determines what ought and ought not to be (and of course subjecting those principles themselves to creative criticism).", "passageTitle": "Reading Comprehension Passage", "question": "Based on the passage, we can infer that human intelligence and AI are similar in:", "options": ["The innate operating system they use for language acquisition.", "Their capacity for moral thinking and evaluating ethical principles.", "Providing causal explanations for observed phenomena.", "Utilizing patterns to understand language and acquire knowledge."], "answer": 3, "answerLabel": "D", "solution": "Option 1: This option is incorrect because the passage explains that humans have an innate, genetically installed operating system for language acquisition, while AI, such as ChatGPT, relies on machine learning algorithms to process and generate responses.\r<br />Option 2: This option is incorrect because the passage suggests that true intelligence, as demonstrated by humans, involves moral thinking and adhering to ethical principles. AI, as it currently stands, lacks these capacities.\r<br />Option 3: This option is incorrect because the passage highlights that human intelligence seeks to provide causal explanations, while AI mainly focuses on pattern matching and prediction without offering causal explanations.\r<br />Option 4: This option is correct because the passage implies that both human intelligence and AI can recognize and utilize patterns in data to understand language and acquire knowledge. While AI relies heavily on pattern matching and prediction, the human mind also recognizes patterns and learns from them, albeit in a more efficient and elegant way.\r<br />Hence, [4].", "topic": "Inference"}, {"number": 3, "sourceId": "16884682957542", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br>Today our supposedly revolutionary advancements in artificial intelligence are … a cause for both concern and optimism. Optimism because intelligence is the means by which we solve problems. Concern because we fear that the most popular and fashionable strain of A.I. — machine learning — will degrade our science and debase our ethics by incorporating into our technology a fundamentally flawed conception of language and knowledge…\r<br>\r<br>The human mind is not, like ChatGPT and its ilk, a lumbering statistical engine for pattern matching, gorging on hundreds of terabytes of data and extrapolating the most likely conversational response or most probable answer to a scientific question. On the contrary, the human mind is a surprisingly efficient and even elegant system that operates with small amounts of information; it seeks not to infer brute correlations among data points but to create explanations. For instance, a young child acquiring a language is developing — unconsciously, automatically and speedily from minuscule data — a grammar, a stupendously sophisticated system of logical principles and parameters. This grammar can be understood as an expression of the innate, genetically installed “operating system” that endows humans with the capacity to generate complex sentences and long trains of thought. When linguists seek to develop a theory for why a given language works as it does, they are building consciously and laboriously an explicit version of the grammar that the child builds instinctively and with minimal exposure to information. The child’s operating system is completely different from that of a machine learning program.\r<br>\r<br>Indeed, such programs are stuck in a prehuman or nonhuman phase of cognitive evolution. Their deepest flaw is the absence of the most critical capacity of any intelligence: to say not only what is the case, what was the case and what will be the case — that’s description and prediction — but also what is not the case and what could and could not be the case. Those are the ingredients of explanation, the mark of true intelligence.  An explanation includes not only descriptions and predictions but also counterfactual conjectures like “Any such object would fall,” plus the additional clause “because of the force of gravity” or “because of the curvature of space-time” or whatever. That is a causal explanation: “The apple would not have fallen but for the force of gravity.” That is thinking. The crux of machine learning is description and prediction; it does not posit any causal mechanisms or physical laws. Of course, any human-style explanation is not necessarily correct; we are fallible. But this is part of what it means to think: To be right, it must be possible to be wrong… Human-style thought is based on possible explanations and error correction, a process that gradually limits what possibilities can be rationally considered. \r<br>\r<br>But ChatGPT and similar programs are, by design, unlimited in what they can “learn” (which is to say, memorize); they are incapable of distinguishing the possible from the impossible...They trade merely in probabilities that change over time.… Even in instances when such programs can successfully generate correct “scientific” predictions without using explanations, such prediction is pseudoscience. While scientists certainly seek theories that have a high degree of empirical corroboration, they don’t seek highly probable theories but explanations; that is to say, powerful and highly improbable theories. True intelligence is demonstrated in the ability to think and express improbable but insightful things. True intelligence is also capable of moral thinking. This means constraining the otherwise limitless creativity of our minds with a set of ethical principles that determines what ought and ought not to be (and of course subjecting those principles themselves to creative criticism).", "passageTitle": "Reading Comprehension Passage", "question": "How does the author differentiate between true science and pseudoscience in the context of prediction (Last paragraph)?", "options": ["True science seeks highly probable theories, while pseudoscience focuses on powerful and highly improbable theories.", "True science requires explanations, whereas pseudoscience is satisfied with correct predictions without explanations.", "True science focuses on causal explanations, while pseudoscience relies on statistical pattern matching and predictions.", "True science is based on empirical corroboration, while pseudoscience is based on anecdotal evidence."], "answer": 1, "answerLabel": "B", "solution": "Option 1. This option is misleading because the passage does not argue that true science seeks highly probable theories. Instead, it emphasizes that true science seeks explanations for phenomena, while pseudoscience is satisfied with generating correct predictions without understanding the underlying causal mechanisms.\r<br />Option 2. This option accurately captures the distinction between true science and pseudoscience as presented in the passage. The author emphasizes that true science seeks explanations behind phenomena, while pseudoscience is content with merely generating correct predictions without understanding the underlying causal mechanisms.\r<br />Option 3. While this option highlights an aspect of the distinction between true science and pseudoscience, it does not fully capture the main argument in the context of prediction. The focus on statistical pattern matching and predictions is more related to the limitations of machine learning rather than the main differentiation between true science and pseudoscience.\r<br />Option 4.  This option presents a general differentiation between true science and pseudoscience that is not specific to the context of prediction as discussed in the passage. While it is true that true science is based on empirical corroboration and pseudoscience often relies on anecdotal evidence, this distinction does not directly address the main argument in the context of prediction, which is the focus on explanations for true science and the lack of explanations for pseudoscience.\r<br />Hence, [2].", "topic": "Inference"}, {"number": 4, "sourceId": "16884682957543", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br>Today our supposedly revolutionary advancements in artificial intelligence are … a cause for both concern and optimism. Optimism because intelligence is the means by which we solve problems. Concern because we fear that the most popular and fashionable strain of A.I. — machine learning — will degrade our science and debase our ethics by incorporating into our technology a fundamentally flawed conception of language and knowledge…\r<br>\r<br>The human mind is not, like ChatGPT and its ilk, a lumbering statistical engine for pattern matching, gorging on hundreds of terabytes of data and extrapolating the most likely conversational response or most probable answer to a scientific question. On the contrary, the human mind is a surprisingly efficient and even elegant system that operates with small amounts of information; it seeks not to infer brute correlations among data points but to create explanations. For instance, a young child acquiring a language is developing — unconsciously, automatically and speedily from minuscule data — a grammar, a stupendously sophisticated system of logical principles and parameters. This grammar can be understood as an expression of the innate, genetically installed “operating system” that endows humans with the capacity to generate complex sentences and long trains of thought. When linguists seek to develop a theory for why a given language works as it does, they are building consciously and laboriously an explicit version of the grammar that the child builds instinctively and with minimal exposure to information. The child’s operating system is completely different from that of a machine learning program.\r<br>\r<br>Indeed, such programs are stuck in a prehuman or nonhuman phase of cognitive evolution. Their deepest flaw is the absence of the most critical capacity of any intelligence: to say not only what is the case, what was the case and what will be the case — that’s description and prediction — but also what is not the case and what could and could not be the case. Those are the ingredients of explanation, the mark of true intelligence.  An explanation includes not only descriptions and predictions but also counterfactual conjectures like “Any such object would fall,” plus the additional clause “because of the force of gravity” or “because of the curvature of space-time” or whatever. That is a causal explanation: “The apple would not have fallen but for the force of gravity.” That is thinking. The crux of machine learning is description and prediction; it does not posit any causal mechanisms or physical laws. Of course, any human-style explanation is not necessarily correct; we are fallible. But this is part of what it means to think: To be right, it must be possible to be wrong… Human-style thought is based on possible explanations and error correction, a process that gradually limits what possibilities can be rationally considered. \r<br>\r<br>But ChatGPT and similar programs are, by design, unlimited in what they can “learn” (which is to say, memorize); they are incapable of distinguishing the possible from the impossible...They trade merely in probabilities that change over time.… Even in instances when such programs can successfully generate correct “scientific” predictions without using explanations, such prediction is pseudoscience. While scientists certainly seek theories that have a high degree of empirical corroboration, they don’t seek highly probable theories but explanations; that is to say, powerful and highly improbable theories. True intelligence is demonstrated in the ability to think and express improbable but insightful things. True intelligence is also capable of moral thinking. This means constraining the otherwise limitless creativity of our minds with a set of ethical principles that determines what ought and ought not to be (and of course subjecting those principles themselves to creative criticism).", "passageTitle": "Reading Comprehension Passage", "question": "Based on the passage, which of the following statements best expresses the key distinction between the human mind and machine learning programs?", "options": ["The cognitive evolution of human minds and machine learning programs differs, with the latter being considered more primitive and ancestral in comparison to the former.", "Human minds, unlike machine learning programs don't rely on brute statistical correlations, instead efficiently seek explanations with limited data.", "Human minds grasp causal explanations, while machine learning relies on pattern matching without understanding causality or possibilities.", "Machine learning describes and predicts without positing causal mechanisms or laws; human thinking involves explanation, error correction, and rational limitation."], "answer": 3, "answerLabel": "D", "solution": "Option 1. This option highlights the difference in cognitive evolution between human minds and machine learning programs. While it is true that the passage describes machine learning programs as being in a \"prehuman or nonhuman phase of cognitive evolution,\" this option doesn't directly&nbsp;address the core distinction between the two: their approach to understanding and processing information.\r<br />Option 2. This option focuses on the difference in the way human minds and machine learning programs process information. While it is accurate that human minds seek explanations with limited data and don't rely on brute statistical correlations, this option only partially represents the key distinction. It doesn't emphasize the aspect of causal explanations and understanding of possibilities, which is central to the difference between human minds and machine learning programs.\r<br />Option 3. This option points out an important aspect of the key distinction between human minds and machine learning programs. It highlights that human minds focus on causal explanations, whereas machine learning programs rely on pattern matching without understanding causality or possibilities. While this option captures a significant part of the distinction, it doesn't fully encompass the idea of human thinking involving explanation, error correction, and rational limitation, as presented in the passage.\r<br />Option 4 best captures the key distinction between human minds and machine learning programs as described in the passage. The human mind focuses on understanding causal explanations, error correction, and rational limitation of possibilities, whereas machine learning programs rely on statistical pattern matching and predictions without providing causal explanations or understanding possible and impossible aspects of a situation. While options 2 and 3 touch on aspects of this distinction, option 4 more comprehensively encapsulates the main difference as presented in the passage.\r<br />Hence, [4].", "topic": "Inference"}, {"number": 5, "sourceId": "16884682957544", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question. <\/b><br><br><span>When interpreters of Korean cultural products such as films and TV shows mention <\/span><span>han<\/span><span>, they are referring to the works’ intense emotionality, especially the feelings of sorrow, regret, <\/span><span>resentment<\/span><span> and rage associated with the concept. <\/span><span>Parasite<\/span><span>, for instance, begins with a family of swindlers who target <\/span>a rich family, but their plot turns deadly with the explosion of seething anger from class resentment. <span>Squid Game<\/span><span> features the sad desperation of people whose lives are in such shambles that they willingly risk death in a series of sadistic games for a slim chance at salvation. Among other popular Korean films, one could point to the sorrow and rage of the inexplicably imprisoned man in <\/span><span>Oldboy<\/span><span> (2003), the abused and traumatised wife in <\/span><span>Lady Vengeance<\/span><span> (2005), and the colonial subjects having to humble themselves before their Japanese masters and their collaborators in <\/span><span>The Handmaiden<\/span><span> (2016)…<\/span><br><br><span>Seen from the perspective of <\/span><span>han<\/span><span>, such emotions seem to be the common theme running throughout all the works. That notion is a questionable one, yet, because <\/span><span>han<\/span><span> has become the unavoidable go-to term in explicating all things Korean, it is important to explore its exact origin and meanings…<\/span><br><br><span>…[Han] became a particularly important cultural concept starting in the 1960s when South Korea embarked on a concerted effort to overcome the tragedies of the recent past: colonisation by the Empire of Japan from 1910 to 1945; the forced division of the country into North and South following the defeat of Japan in the Second World War; and the devastation of the Korean War (1950-53). Even after South Korea took its place on the global stage as an emerging economic powerhouse, the stigma of <\/span><span>han<\/span><span> remained… Ultimately, <\/span><span>han<\/span><span> came to signify a kind of Korean exceptionalism defined by strength and resilience in the face of inherent sadness and pain.<\/span><br><br><span>The trope of <\/span><span>han<\/span><span> took powerful hold of the Korean imagination. In the cultural realm, major literary figures […] claimed <\/span><span>han<\/span><span> to be the central aesthetic principle in Korean art and literature… In recent years, many Korean Americans have taken up the idea to define their identity and describe their life experiences and heritage. They say <\/span><span>han<\/span><span> explains Korean character and culture in mainstream media. And the concept shows up frequently in fiction written by Korean Americans…<\/span><br><br><span>Yet few Korean Americans seem aware that the idea of <\/span><span>han<\/span><span> has undergone a significant decline in cultural importance in South Korea itself since the late 1990s, now to the point of irrelevance. With the achievement of prosperity and democracy, the notion of an essential character defined by a profound sorrow from trauma and unrealised potential no longer seems appropriate. Of course, the people of the country experience economic disparity, as brilliantly allegorised in <\/span><span>Parasite<\/span><span> and <\/span><span>Squid Game<\/span><span>… They are cognizant of […] quality-of-life issues stemming from the competitive, workaholic culture, sometimes referred to as ‘Hell Joseon’.<\/span><br><br><span>But given the astounding economic, <\/span><span>political<\/span><span> and social achievements of the recent past, South Korean people no longer feel that they are perennially condemned as the passive victims of history… For most contemporary South Koreans, the larger idea of <\/span><span>han<\/span><span> as a defining characteristic feels increasingly like a retrograde notion from the past…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\tWhich of the following statements best describes (the main idea) of the passage?", "options": ["<span>The passage examines how ‘<\/span><span>han<\/span><span>’ as portrayed in Korean literature and popular media has been used to define Korean identity and culture.<\/span>", "<span><\/span>\tThe passage traces how the concept of \"<span>han<\/span><span>\" has declined in importance in contemporary Korean society due to the country's economic, political, and social progress.<\/span>", "The passage explores the concept of \"<span>han<\/span><span>\" as a defining characteristic of Korean identity and culture, considering its historical context and contemporary significance.<\/span>", "<span><\/span>\tThe passage explains how the traumatic events of colonization, division, and war have infused the Korean culture with a sense of <span>sorrow, regret, <\/span><span>resentment<\/span><span> and rage.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tThe passage is focused on the cultural concept of \"<span>han<\/span><span>\" in Korean society, its historical context, and its contemporary significance. The passage discusses the origin and meaning of \"<\/span><span>han<\/span><span>\" and its role as a defining characteristic of Korean culture, especially in the aftermath of traumatic events such as colonization, division, and war. It examines how \"<\/span><span>han<\/span><span>\" has been portrayed in Korean literature and popular media and how it has been used to define Korean identity and culture. The passage also highlights how the concept of \"<\/span><span>han<\/span><span>\" has declined in importance in contemporary South Korea due to the country's economic, political, and social progress.<\/span>\r<br />Hence, [3].", "topic": "Central Idea"}, {"number": 6, "sourceId": "16884682957555", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question. <\/b><br><br><span>When interpreters of Korean cultural products such as films and TV shows mention <\/span><span>han<\/span><span>, they are referring to the works’ intense emotionality, especially the feelings of sorrow, regret, <\/span><span>resentment<\/span><span> and rage associated with the concept. <\/span><span>Parasite<\/span><span>, for instance, begins with a family of swindlers who target <\/span>a rich family, but their plot turns deadly with the explosion of seething anger from class resentment. <span>Squid Game<\/span><span> features the sad desperation of people whose lives are in such shambles that they willingly risk death in a series of sadistic games for a slim chance at salvation. Among other popular Korean films, one could point to the sorrow and rage of the inexplicably imprisoned man in <\/span><span>Oldboy<\/span><span> (2003), the abused and traumatised wife in <\/span><span>Lady Vengeance<\/span><span> (2005), and the colonial subjects having to humble themselves before their Japanese masters and their collaborators in <\/span><span>The Handmaiden<\/span><span> (2016)…<\/span><br><br><span>Seen from the perspective of <\/span><span>han<\/span><span>, such emotions seem to be the common theme running throughout all the works. That notion is a questionable one, yet, because <\/span><span>han<\/span><span> has become the unavoidable go-to term in explicating all things Korean, it is important to explore its exact origin and meanings…<\/span><br><br><span>…[Han] became a particularly important cultural concept starting in the 1960s when South Korea embarked on a concerted effort to overcome the tragedies of the recent past: colonisation by the Empire of Japan from 1910 to 1945; the forced division of the country into North and South following the defeat of Japan in the Second World War; and the devastation of the Korean War (1950-53). Even after South Korea took its place on the global stage as an emerging economic powerhouse, the stigma of <\/span><span>han<\/span><span> remained… Ultimately, <\/span><span>han<\/span><span> came to signify a kind of Korean exceptionalism defined by strength and resilience in the face of inherent sadness and pain.<\/span><br><br><span>The trope of <\/span><span>han<\/span><span> took powerful hold of the Korean imagination. In the cultural realm, major literary figures […] claimed <\/span><span>han<\/span><span> to be the central aesthetic principle in Korean art and literature… In recent years, many Korean Americans have taken up the idea to define their identity and describe their life experiences and heritage. They say <\/span><span>han<\/span><span> explains Korean character and culture in mainstream media. And the concept shows up frequently in fiction written by Korean Americans…<\/span><br><br><span>Yet few Korean Americans seem aware that the idea of <\/span><span>han<\/span><span> has undergone a significant decline in cultural importance in South Korea itself since the late 1990s, now to the point of irrelevance. With the achievement of prosperity and democracy, the notion of an essential character defined by a profound sorrow from trauma and unrealised potential no longer seems appropriate. Of course, the people of the country experience economic disparity, as brilliantly allegorised in <\/span><span>Parasite<\/span><span> and <\/span><span>Squid Game<\/span><span>… They are cognizant of […] quality-of-life issues stemming from the competitive, workaholic culture, sometimes referred to as ‘Hell Joseon’.<\/span><br><br><span>But given the astounding economic, <\/span><span>political<\/span><span> and social achievements of the recent past, South Korean people no longer feel that they are perennially condemned as the passive victims of history… For most contemporary South Koreans, the larger idea of <\/span><span>han<\/span><span> as a defining characteristic feels increasingly like a retrograde notion from the past…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\tWhat is the purpose of the many examples of popular Korean films and TV shows in the first paragraph of the passage?", "options": ["<span>To demonstrate that the concept of ‘<\/span><span>han<\/span><span>’ is an aspect of Korean identity and culture, deeply ingrained in its history, art, and society.<\/span>", "<span><\/span>\tTo illustrate how the recurring motif of ‘<span>han<\/span><span>’ is present across various genres of Korean cultural products.<\/span>", "<p>To offer a clearer understanding of the intricate and profound range of emotions associated with the notion of &lsquo;<span>han<\/span><span>&rsquo;.<\/span>&nbsp;<\/p>", "<p>To illustrate how the Korean cultural concept of '<span>han<\/span><span>&rsquo; is the ongoing struggle to overcome deep-rooted historical traumas.<\/span><\/p>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\tThe question is difficult because of the very close options.&nbsp;<span>But,<\/span><span> the purpose of these examples is suggested in the second paragraph:<\/span><span> “Seen from the perspective of&nbsp;<\/span><span>han<\/span><span>, such emotions seem to be the common theme running throughout all the works. That notion is a questionable one, yet, because&nbsp;<\/span><span>han<\/span><span> has become the unavoidable go-to term in explicating all things Korean, it is important to explore its exact origin and meanings…”<\/span>\r<br /><span>Option 1. Factually correct statement – but the examples in themselves cannot demonstrate that ‘<\/span><span>han<\/span><span>’ is an aspect of Korean identity and culture – it could just be particular to the character in the stories. An uninitiated reader cannot conclude 1, by looking at these examples.<\/span>\r<br /><span>Option 2. Correct. As a technique used in writing, the examples introduce us to the widespread prevalence of ‘<\/span><span>han<\/span><span>’ in Korean cultural products – from this point of view, it now becomes necessary to understand its origin and meanings.<\/span>\r<br /><span>Option 3. Incorrect. Factually correct. The author does not presume that the reader hasn’t understood what ‘<\/span><span>han<\/span><span>’ means when he has already stated that “… intense emotionality, especially the feelings of sorrow, regret, resentment and rage associated with the concept.”<\/span>\r<br /><span>Option 4. Incorrect. Factually correct. However,&nbsp;<\/span><span>similar to<\/span><span> option 1 – the particular association with ‘historical traumas’ is worked backwards from the predominance of the recurring theme.<\/span>\r<br /><span>Option 2 is correct because it plainly states that the purpose is to make the reader aware of the prevalence of ‘<\/span><span>han<\/span><span>’ everywhere in Korean cultural products – why and its origin and meanings, which are&nbsp;<\/span><span>as yet<\/span><span> unimportant, will be conclusions drawn from its prevalence.<\/span>\r<br />Hence, [2].", "topic": "Logical Structure"}, {"number": 7, "sourceId": "16884682957556", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question. <\/b><br><br><span>When interpreters of Korean cultural products such as films and TV shows mention <\/span><span>han<\/span><span>, they are referring to the works’ intense emotionality, especially the feelings of sorrow, regret, <\/span><span>resentment<\/span><span> and rage associated with the concept. <\/span><span>Parasite<\/span><span>, for instance, begins with a family of swindlers who target <\/span>a rich family, but their plot turns deadly with the explosion of seething anger from class resentment. <span>Squid Game<\/span><span> features the sad desperation of people whose lives are in such shambles that they willingly risk death in a series of sadistic games for a slim chance at salvation. Among other popular Korean films, one could point to the sorrow and rage of the inexplicably imprisoned man in <\/span><span>Oldboy<\/span><span> (2003), the abused and traumatised wife in <\/span><span>Lady Vengeance<\/span><span> (2005), and the colonial subjects having to humble themselves before their Japanese masters and their collaborators in <\/span><span>The Handmaiden<\/span><span> (2016)…<\/span><br><br><span>Seen from the perspective of <\/span><span>han<\/span><span>, such emotions seem to be the common theme running throughout all the works. That notion is a questionable one, yet, because <\/span><span>han<\/span><span> has become the unavoidable go-to term in explicating all things Korean, it is important to explore its exact origin and meanings…<\/span><br><br><span>…[Han] became a particularly important cultural concept starting in the 1960s when South Korea embarked on a concerted effort to overcome the tragedies of the recent past: colonisation by the Empire of Japan from 1910 to 1945; the forced division of the country into North and South following the defeat of Japan in the Second World War; and the devastation of the Korean War (1950-53). Even after South Korea took its place on the global stage as an emerging economic powerhouse, the stigma of <\/span><span>han<\/span><span> remained… Ultimately, <\/span><span>han<\/span><span> came to signify a kind of Korean exceptionalism defined by strength and resilience in the face of inherent sadness and pain.<\/span><br><br><span>The trope of <\/span><span>han<\/span><span> took powerful hold of the Korean imagination. In the cultural realm, major literary figures […] claimed <\/span><span>han<\/span><span> to be the central aesthetic principle in Korean art and literature… In recent years, many Korean Americans have taken up the idea to define their identity and describe their life experiences and heritage. They say <\/span><span>han<\/span><span> explains Korean character and culture in mainstream media. And the concept shows up frequently in fiction written by Korean Americans…<\/span><br><br><span>Yet few Korean Americans seem aware that the idea of <\/span><span>han<\/span><span> has undergone a significant decline in cultural importance in South Korea itself since the late 1990s, now to the point of irrelevance. With the achievement of prosperity and democracy, the notion of an essential character defined by a profound sorrow from trauma and unrealised potential no longer seems appropriate. Of course, the people of the country experience economic disparity, as brilliantly allegorised in <\/span><span>Parasite<\/span><span> and <\/span><span>Squid Game<\/span><span>… They are cognizant of […] quality-of-life issues stemming from the competitive, workaholic culture, sometimes referred to as ‘Hell Joseon’.<\/span><br><br><span>But given the astounding economic, <\/span><span>political<\/span><span> and social achievements of the recent past, South Korean people no longer feel that they are perennially condemned as the passive victims of history… For most contemporary South Koreans, the larger idea of <\/span><span>han<\/span><span> as a defining characteristic feels increasingly like a retrograde notion from the past…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\tWhat change did the concept of '<span>han<\/span><span>' undergo from the 1960s to the present day?<\/span>", "options": ["<span>It became an increasingly important cultural concept that defined Korean character and culture.<\/span>", "<span><\/span>\tFrom being an essential part of everything that is Korean, it became a retrograde notion from the past.", "<span><\/span>\tIt became associated with economic disparity and quality-of-life issues in contemporary South Korea.", "<span><\/span>\tIt became a defining characteristic of South Korea's emerging economic powerhouse status."], "answer": 1, "answerLabel": "B", "solution": "The last four paragraphs explain the change. The concept of '<span>han<\/span><span>' underwent a significant change from the 1960s to the present day. In the 1960s, South Korea was trying to overcome the tragedies of its recent past, including colonization by Japan and the devastation of the Korean War. At this time, the concept of '<\/span><span>han<\/span><span>' became a particularly important cultural concept that was used to express the inherent sadness and pain of the Korean people, who were seen as passive victims of history. However, as South Korea achieved prosperity and democracy in the late 1990s, the idea of '<\/span><span>han<\/span><span>' began to lose cultural importance to the point of irrelevance. The larger idea of '<\/span><span>han<\/span><span>' as a defining characteristic began to feel like a retrograde notion from the past. Option 2 correctly summarises this change. Option 3 is eliminated because the author mentions that while economic disparity and quality-of-life issues still exist people no longer consider ‘<\/span><span>han<\/span><span>’ as the defining characteristic of their culture.<\/span>\r<br />Hence, [2].", "topic": "Inference"}, {"number": 8, "sourceId": "16884682957557", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question. <\/b><br><br><span>When interpreters of Korean cultural products such as films and TV shows mention <\/span><span>han<\/span><span>, they are referring to the works’ intense emotionality, especially the feelings of sorrow, regret, <\/span><span>resentment<\/span><span> and rage associated with the concept. <\/span><span>Parasite<\/span><span>, for instance, begins with a family of swindlers who target <\/span>a rich family, but their plot turns deadly with the explosion of seething anger from class resentment. <span>Squid Game<\/span><span> features the sad desperation of people whose lives are in such shambles that they willingly risk death in a series of sadistic games for a slim chance at salvation. Among other popular Korean films, one could point to the sorrow and rage of the inexplicably imprisoned man in <\/span><span>Oldboy<\/span><span> (2003), the abused and traumatised wife in <\/span><span>Lady Vengeance<\/span><span> (2005), and the colonial subjects having to humble themselves before their Japanese masters and their collaborators in <\/span><span>The Handmaiden<\/span><span> (2016)…<\/span><br><br><span>Seen from the perspective of <\/span><span>han<\/span><span>, such emotions seem to be the common theme running throughout all the works. That notion is a questionable one, yet, because <\/span><span>han<\/span><span> has become the unavoidable go-to term in explicating all things Korean, it is important to explore its exact origin and meanings…<\/span><br><br><span>…[Han] became a particularly important cultural concept starting in the 1960s when South Korea embarked on a concerted effort to overcome the tragedies of the recent past: colonisation by the Empire of Japan from 1910 to 1945; the forced division of the country into North and South following the defeat of Japan in the Second World War; and the devastation of the Korean War (1950-53). Even after South Korea took its place on the global stage as an emerging economic powerhouse, the stigma of <\/span><span>han<\/span><span> remained… Ultimately, <\/span><span>han<\/span><span> came to signify a kind of Korean exceptionalism defined by strength and resilience in the face of inherent sadness and pain.<\/span><br><br><span>The trope of <\/span><span>han<\/span><span> took powerful hold of the Korean imagination. In the cultural realm, major literary figures […] claimed <\/span><span>han<\/span><span> to be the central aesthetic principle in Korean art and literature… In recent years, many Korean Americans have taken up the idea to define their identity and describe their life experiences and heritage. They say <\/span><span>han<\/span><span> explains Korean character and culture in mainstream media. And the concept shows up frequently in fiction written by Korean Americans…<\/span><br><br><span>Yet few Korean Americans seem aware that the idea of <\/span><span>han<\/span><span> has undergone a significant decline in cultural importance in South Korea itself since the late 1990s, now to the point of irrelevance. With the achievement of prosperity and democracy, the notion of an essential character defined by a profound sorrow from trauma and unrealised potential no longer seems appropriate. Of course, the people of the country experience economic disparity, as brilliantly allegorised in <\/span><span>Parasite<\/span><span> and <\/span><span>Squid Game<\/span><span>… They are cognizant of […] quality-of-life issues stemming from the competitive, workaholic culture, sometimes referred to as ‘Hell Joseon’.<\/span><br><br><span>But given the astounding economic, <\/span><span>political<\/span><span> and social achievements of the recent past, South Korean people no longer feel that they are perennially condemned as the passive victims of history… For most contemporary South Koreans, the larger idea of <\/span><span>han<\/span><span> as a defining characteristic feels increasingly like a retrograde notion from the past…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\tIt can be inferred from the passage that the author is NOT likely to support the view that:", "options": ["<span>The exceptionalism of the 1960s is no longer a feature of Korea’s imagination.<\/span>", "<span><\/span>\tProsperity and democracy in Korea make ‘<span>han<\/span><span>’ a regressive notion from the past.<\/span>", "<span><\/span>\t<span>Parasite <\/span><span>and<\/span><span> Squid Game <\/span><span>are brilliant allegories that symbolize the concept of '<\/span><span>han<\/span><span>'.<\/span>", "<span><\/span>\tKorean Americans are unaware of the significant decline in the concept of '<span>han<\/span><span>'.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\tOptions 1 and 2. The author would support. The author states the concept of ‘<span>han<\/span><span>’ that had a powerful hold over the country’s imagination in the 1960s has declined and most contemporary Koreans view it as a retrograde notion from the past.<\/span>\r<br /><span>Option 4. ‘<\/span><span>Yet few Korean Americans seem aware that the idea of&nbsp;<\/span><span>han<\/span><span> has undergone a significant decline in cultural importance in South Korea itself since the late 1990s, now to the point of irrelevance” The author would support 4.<\/span>\r<br /><span>Option 3. “Of course, the people of the country experience economic disparity, as brilliantly allegorised in&nbsp;<\/span><span>Parasite<\/span><span> and&nbsp;<\/span><span>Squid Game<\/span><span>… They are cognizant of […] quality-of-life issues stemming from the competitive, workaholic culture, sometimes referred to as ‘Hell Joseon’.” The author is unlikely to agree with 3.<\/span>\r<br />Hence, [3].", "topic": "Specific Detail Question"}, {"number": 9, "sourceId": "16884682957558", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Liberalism's optimistic view of international politics is based on three core beliefs, which are common to almost <\/span><span>all of<\/span><span> the theories in the paradigm. First, liberals consider states to be the main actors in international politics. Second, they emphasize that the internal characteristics of states vary considerably, and that these differences have profound effects on state <\/span><span>behavior<\/span><span>. Furthermore, liberal theorists often believe that some internal arrangements (e.g.<\/span><span>,<\/span><span> democracy) are inherently preferable to others (e.g., dictatorship). For liberals, therefore, there are \"good\" and \"bad\" states in the international system. Good states pursue cooperative policies and hardly ever start wars on their own, whereas bad states cause conflicts with other states and are prone to use force to get their way. Thus, the key to peace is to populate the world with good states.<\/span><br><br><span>Third, liberals believe that calculations about power matter little for explaining the behaviour of good states. Bad states might be motivated by the desire to gain power at the expense of other states…. In an ideal world, where there are only good states, power would be largely irrelevant.<\/span><br>Among the various theories found under the big tent of liberalism, the three main ones mentioned earlier are influential. The first argues that high levels of economic interdependence among states make them unlikely to fight each other. The taproot of stability, according to this theory, is the creation and maintenance of a liberal economic order that allows for free economic exchange among states. Such an order makes states more prosperous, thereby bolstering peace, because prosperous states are more economically satisfied and satisfied states are more peaceful. Many wars are waged to gain or preserve wealth, but states have much less motive to initiate war if they are already wealthy. Furthermore, wealthy states with interdependent economies stand to become less prosperous if they fight each other, since they are biting the hand that feeds them. Once states establish extensive economic ties, in short, they avoid war and can concentrate instead on accumulating wealth.<br><br><span>The second, democratic peace theory, claims that democracies do not go to war against other democracies. Thus, a world containing only democratic states would be a world without war. The argument here is not that democracies are less warlike than non-democracies, but rather that democracies do not fight among themselves.<\/span><br><br><span>Finally, some liberals maintain that international institutions enhance the prospects for cooperation among states and thus significantly reduce the likelihood of war. Institutions are not independent political entities that sit above states and force them to behave in acceptable ways. Instead, institutions are sets of rules that stipulate the ways in which states should cooperate and <\/span><span>compete with each other<\/span><span>. They prescribe acceptable forms of state behaviour and proscribe unacceptable kinds of behaviour. These rules are not imposed on states by some leviathan, but are negotiated by states, which agree to abide by the rules they created because it is in their interest to do so. Liberals claim that these institutions or rules can fundamentally change state behaviour. Institutions can discourage states from calculating self-interest <\/span><span>on the basis of<\/span><span> how their every move affects their relative power position, and thus they push states away from war and promote peace.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\tThe core beliefs in liberalism’s optimistic view of international politics does NOT include:", "options": ["<span>Economic interdependence is considered a crucial factor in fostering peace in the international system.<\/span>", "<span><\/span>\tThe notion that all states are inherently good and will naturally collaborate with each other.", "<span><\/span>\tThe acknowledgment that states vary in their internal characteristics, and some arrangements are more desirable than others.", "<span><\/span>\tInternational institutions are viewed as a vital component of liberalism's hopeful outlook on international politics."], "answer": 1, "answerLabel": "B", "solution": "<\/span>\tIn the context of international relations, liberalism is characterized by a belief in cooperation, interdependence, and the importance of international institutions in promoting peace and stability.\r<br /><span>Option 1: This is a core belief of liberalism, as it is believed that countries that have strong economic ties are less likely to go to war with each other, and more likely to collaborate on issues of mutual interest.<\/span>\r<br /><span>Option 2: This is not a core belief of liberalism. “For liberals, therefore, there are \"good\" and \"bad\" states in the international system.”<\/span>\r<br /><span>Option 3: This is a core belief of liberalism. Liberals recognize that different states have different political systems arrangements (democracy) may be more conducive to peace and prosperity than others.<\/span>\r<br /><span>Option 4: This is a core belief of liberalism. Liberals believe that international institutions, can help to promote cooperation and establish common standards and rules for international&nbsp;<\/span><span>behavior<\/span><span>.<\/span>\r<br />Hence, [2].", "topic": "Specific Detail Question"}, {"number": 10, "sourceId": "16884682957579", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Liberalism's optimistic view of international politics is based on three core beliefs, which are common to almost <\/span><span>all of<\/span><span> the theories in the paradigm. First, liberals consider states to be the main actors in international politics. Second, they emphasize that the internal characteristics of states vary considerably, and that these differences have profound effects on state <\/span><span>behavior<\/span><span>. Furthermore, liberal theorists often believe that some internal arrangements (e.g.<\/span><span>,<\/span><span> democracy) are inherently preferable to others (e.g., dictatorship). For liberals, therefore, there are \"good\" and \"bad\" states in the international system. Good states pursue cooperative policies and hardly ever start wars on their own, whereas bad states cause conflicts with other states and are prone to use force to get their way. Thus, the key to peace is to populate the world with good states.<\/span><br><br><span>Third, liberals believe that calculations about power matter little for explaining the behaviour of good states. Bad states might be motivated by the desire to gain power at the expense of other states…. In an ideal world, where there are only good states, power would be largely irrelevant.<\/span><br>Among the various theories found under the big tent of liberalism, the three main ones mentioned earlier are influential. The first argues that high levels of economic interdependence among states make them unlikely to fight each other. The taproot of stability, according to this theory, is the creation and maintenance of a liberal economic order that allows for free economic exchange among states. Such an order makes states more prosperous, thereby bolstering peace, because prosperous states are more economically satisfied and satisfied states are more peaceful. Many wars are waged to gain or preserve wealth, but states have much less motive to initiate war if they are already wealthy. Furthermore, wealthy states with interdependent economies stand to become less prosperous if they fight each other, since they are biting the hand that feeds them. Once states establish extensive economic ties, in short, they avoid war and can concentrate instead on accumulating wealth.<br><br><span>The second, democratic peace theory, claims that democracies do not go to war against other democracies. Thus, a world containing only democratic states would be a world without war. The argument here is not that democracies are less warlike than non-democracies, but rather that democracies do not fight among themselves.<\/span><br><br><span>Finally, some liberals maintain that international institutions enhance the prospects for cooperation among states and thus significantly reduce the likelihood of war. Institutions are not independent political entities that sit above states and force them to behave in acceptable ways. Instead, institutions are sets of rules that stipulate the ways in which states should cooperate and <\/span><span>compete with each other<\/span><span>. They prescribe acceptable forms of state behaviour and proscribe unacceptable kinds of behaviour. These rules are not imposed on states by some leviathan, but are negotiated by states, which agree to abide by the rules they created because it is in their interest to do so. Liberals claim that these institutions or rules can fundamentally change state behaviour. Institutions can discourage states from calculating self-interest <\/span><span>on the basis of<\/span><span> how their every move affects their relative power position, and thus they push states away from war and promote peace.<\/span>", "passageTitle": "Reading Comprehension Passage", " y democratic states would be a world without war. The argument here is not that democracies are less warlike than non-democracies, but rather that democracies do not fight among themselves.<\/span><br><br><span>Finally, some liberals maintain that international institutions enhance the prospects for cooperation among states and thus significantly reduce the likelihood of war. Institutions are not independent political entities that sit above states and force them to behave in acceptable ways. Instead, institutions are sets of rules that stipulate the ways in which states should cooperate and <\/span><span>compete with each other<\/span><span>. They prescribe acceptable forms of state behaviour and proscribe unacceptable kinds of behaviour. These rules are not imposed on states by some leviathan, but are negotiated by states, which agree to abide by the rules they created because it is in their interest to do so. Liberals claim that these institutions or rules can fundamentally change state behaviour. Institutions can discourage states from calculating self-interest <\/span><span>on the basis of<\/span><span> how their every move affects their relative power position, and thus they push states away from war and promote peace.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "All of the following statements, if true, could weaken the main argument presented in the last paragraph EXCEPT:", "options": ["<span>International institutions are often slow to adapt to changes, and their international norms are often contested.<\/span>", "<span><\/span>\tStates have historically shown a tendency to disregard international institutions and break their rules in pursuit of their interests.", "<span><\/span>\tInternational institutions are dominated by powerful states, who use them to further their own interests at the expense of smaller or weaker states.", "<span><\/span>\tInternational institutions are only effective in promoting peace when they have the su
