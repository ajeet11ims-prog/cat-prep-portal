rained <\/span><span>labor<\/span><span> and Intensify competitiveness.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "The passage states that multinational corporations have changed the focus of the allocation of capital away from gaining access to raw materials or markets for basic commodities towards high-technology goods in which they are world leaders, such as computers and pharmaceuticals. Thus, option 1 is a not an exception. The passage also states that the ability to combine high technology with cheap and untrained labor has resulted in the export of the social institutions of capitalism to formerly passive regions in the world economy. This is mentioned in the second paragraph of the passage. Therefore, option 2 is also not an exception.  Moreover, the passage mentions that the new imperialism has greatly intensified the competitiveness of the system in its developed homelands by firing artillery barrages of low-cost commodities back into their motherlands. This is stated in the third paragraph of the passage. Thus, option 4 is also not an exception. However, the passage does not mention that bulk investments have moved to Hong Kong, South Korea, and Thailand. Instead, the passage mentions that only a small fraction of American overseas capital is invested in plantations, railways, or mining properties and that the bulk of overseas capital has moved into manufacturing, and three-quarters of the flow of international investment goes to Europe, Canada, and other developed capitalist lands. Therefore, option 3 is the exception.\r<br />Hence, [3].", "topic": "Inference"}, {"number": 15, "sourceId": "168959793099914", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Multinationals have brought two changes to the overall internationalization of capital. First, they have changed its geographic flows. In the days of classic imperialism, as we have seen, the objective of capitalist expansion was focused mainly on gaining access to raw materials or to markets for basic commodities, like textiles. The multinationals have turned away from these basic commodities toward the sorts of high-technology goods in which they are world leaders, such as computers and pharmaceuticals. The result has been a striking shift in the overseas allocation of capital. In 1897 almost half of American overseas capital was invested in plantations, railways, or mining properties. Today only a small fraction of our foreign investment is in those fields. Instead, the bulk of our overseas capital has moved into manufacturing, and three-quarters of the flow of international investment goes to Europe and Canada and other developed capitalist lands. So, too, the great preponderance of French or Japanese or German international investment seeks out locations in the developed world, rather than in the old colonial parts of the globe.<\/span><br><br><span>A second economic consequence of the rise of the multinationals has been their remarkable ability to combine high technology with cheap and untrained <\/span><span>labor<\/span><span>. The incredibly complicated mechanisms that underlie modern economic life, such as computer parts or television subassemblies, can be produced in the Hong <\/span><span>Kongs<\/span><span> and South Koreas and <\/span><span>Thailands<\/span><span> of the world, using scientific machines operated by men and women just off the paddy fields. From the point of view of imperialism, the upshot of this is a perplexing one. The ability to transplant whole production processes into areas of the world that only yesterday were peasant economies has succeeded to an unprecedented degree in exporting the social institutions of capitalism. Just as the factors of production themselves emerged from a precapitalist social setting during the great economic revolution, so in our times a new economic revolution is bringing the market economy into regions that were formerly only passive, not active forces in the world economy. To that extent, modern imperialism has been a great force for the vitalization of capitalism abroad.<\/span><br><br><span>At the same time, the new imperialism has greatly intensified the competitiveness of the system in its developed homelands. This is not only the result of the interpenetration of each other’s markets that we discussed above, but because the manufacturing outposts of the multinationals in the underdeveloped regions can fire artillery barrages of low-cost commodities back into their motherlands. As no nation knows better than the United States, TV sets made in Hong Kong or Taiwan, or automobiles made in South Korea or assembled in Mexico, can easily undersell the same products manufactured in California or the Midwest.<\/span><br><br><span>It is too soon to foretell the consequences of this internationalization and intensification of competition or what may be the outcome of the financial and political crises that have appeared—not surprisingly—in nearly all the Asian “tigers.” What seems beyond doubt is that we have moved in the direction of a global economy in which new world-straddling enterprises coexist uneasily with older national boundaries and prerogatives. It is an ironic ending to our consideration of the problem of imperialism that the movement whose origins <\/span><span>were connected with<\/span><span> alleviating the pressures on capital has ended up by making them worse.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following best describes the concept of \"new imperialism\" as presented in the passage?<\/span>", "options": ["<span>The acquisition of raw materials and markets for basic commodities by colonial powers.<\/span>", "<span>MNC’s investment in foreign countries to increase their profits and influence.<\/span>", "<span>The movement of overseas capital from the colonies to locations in the developed world.<\/span>", "<span>The ability to transplant whole production processes into peasant economies.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "The correct answer is option 2: MNC’s investment in foreign countries to increase their profits and influence.\r<br />The passage describes \"new imperialism\" as a form of imperialism that emerged in the late 19th century, in which imperial powers began to focus on investment and economic domination rather than territorial acquisition. This form of imperialism was characterized by the internationalization of capital and the rise of multinational corporations (MNCs) that invested in foreign countries to increase their profits and influence. Option 2 best describes this concept as presented in the passage.\r<br />Option 1 is incorrect because it describes traditional imperialism, which was focused on the acquisition of raw materials and markets by colonial powers. Option 3 is incorrect because it describes the opposite of what happened during the era of new imperialism - capital flowed from developed countries to colonies rather than the other way around. Option 4 is incorrect because it describes a different phenomenon - the transplanting of whole production processes into peasant economies - that is not directly related to new imperialism.\r<br />Hence, [2].", "topic": "Inference"}, {"number": 16, "sourceId": "168959793099915", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Multinationals have brought two changes to the overall internationalization of capital. First, they have changed its geographic flows. In the days of classic imperialism, as we have seen, the objective of capitalist expansion was focused mainly on gaining access to raw materials or to markets for basic commodities, like textiles. The multinationals have turned away from these basic commodities toward the sorts of high-technology goods in which they are world leaders, such as computers and pharmaceuticals. The result has been a striking shift in the overseas allocation of capital. In 1897 almost half of American overseas capital was invested in plantations, railways, or mining properties. Today only a small fraction of our foreign investment is in those fields. Instead, the bulk of our overseas capital has moved into manufacturing, and three-quarters of the flow of international investment goes to Europe and Canada and other developed capitalist lands. So, too, the great preponderance of French or Japanese or German international investment seeks out locations in the developed world, rather than in the old colonial parts of the globe.<\/span><br><br><span>A second economic consequence of the rise of the multinationals has been their remarkable ability to combine high technology with cheap and untrained <\/span><span>labor<\/span><span>. The incredibly complicated mechanisms that underlie modern economic life, such as computer parts or television subassemblies, can be produced in the Hong <\/span><span>Kongs<\/span><span> and South Koreas and <\/span><span>Thailands<\/span><span> of the world, using scientific machines operated by men and women just off the paddy fields. From the point of view of imperialism, the upshot of this is a perplexing one. The ability to transplant whole production processes into areas of the world that only yesterday were peasant economies has succeeded to an unprecedented degree in exporting the social institutions of capitalism. Just as the factors of production themselves emerged from a precapitalist social setting during the great economic revolution, so in our times a new economic revolution is bringing the market economy into regions that were formerly only passive, not active forces in the world economy. To that extent, modern imperialism has been a great force for the vitalization of capitalism abroad.<\/span><br><br><span>At the same time, the new imperialism has greatly intensified the competitiveness of the system in its developed homelands. This is not only the result of the interpenetration of each other’s markets that we discussed above, but because the manufacturing outposts of the multinationals in the underdeveloped regions can fire artillery barrages of low-cost commodities back into their motherlands. As no nation knows better than the United States, TV sets made in Hong Kong or Taiwan, or automobiles made in South Korea or assembled in Mexico, can easily undersell the same products manufactured in California or the Midwest.<\/span><br><br><span>It is too soon to foretell the consequences of this internationalization and intensification of competition or what may be the outcome of the financial and political crises that have appeared—not surprisingly—in nearly all the Asian “tigers.” What seems beyond doubt is that we have moved in the direction of a global economy in which new world-straddling enterprises coexist uneasily with older national boundaries and prerogatives. It is an ironic ending to our consideration of the problem of imperialism that the movement whose origins <\/span><span>were connected with<\/span><span> alleviating the pressures on capital has ended up by making them worse.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which one of the following statements best reflects the main argument of the LAST paragraph of the passage?<\/span>", "options": ["<span>The relationship between nationalism and globalization remains a key unresolved issue in the overall overseas allocation of capital.<\/span>", "<span>It is unclear what the ultimate result will be of the financial and political problems in the Asian countries.<\/span>", "<span>It is difficult to predict what the future holds for globalization and the increased competitiveness of the world economy.<\/span>", "<span>It is difficult to predict the future of the Asian “tigers” that have experienced significant growth in the era of new imperialism.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "The best statement that reflects the main argument of the last paragraph of the passage is option 3: The paragraph discusses the unpredictability of the consequences of globalization and intensified competition. It also discusses the financial and political crises that have arisen in various Asian countries which have led to the intensification of competition and increased globalization. The author acknowledges that it is too soon to tell what the outcome will be and that there are a lot of uncertainties surrounding these issues. Therefore, option 3 is the most accurate reflection of the main argument presented in the last paragraph.\r<br />Option 1 focuses on the relationship between nationalism and globalization, which is not the&nbsp;main focus of the last paragraph. Option 2 discusses the financial and political problems in Asian countries, which is not the primary emphasis either. Option 4 specifically mentions the Asian \"tigers,\" which, although mentioned in the passage, does not capture the main argument of the last paragraph, which is broader in scope.\r<br />Hence, [3].", "topic": "Inference"}, {"number": 17, "sourceId": "168959793099916", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br> <br><span>1.<\/span>\t<span>The lights dimmed, and the first notes of the music began to play.<\/span><br>2.\t<span>With a burst of energy, he launched into his first song, setting the tone for an unforgettable <\/span>performance.<br>3.\t<span>He closed his eyes and took a deep breath, <\/span><span>centering<\/span><span> himself for the performance ahead.<\/span><br>4.\t<span>The crowd cheered as the performer took the stage, ready to give it his all.<\/span><br><br><span>", "options": [], "answer": "4312", "answerLabel": "4312", "solution": "Sentence 1. Part of a narrative describing a particular moment. Could be beginning too.\r<br />Sentence 2. 1-2 appear to be a pair. ‘music began to play’ – ‘he launched into his first song’.\r<br />Sentence 3. ‘centering himself on the stage’ must precede 2 and 1.\r<br />Sentence 4. ‘ready to give it his all’ makes it the opening sentence.\r<br />The paragraph effectively conveys the progression of events, from the performer taking the stage to the performer delivering an unforgettable performance.  First, the performer takes the stage as the crowd cheers … then he prepares himself mentally for the performance… the lights dim, … he begins his first song, and an unforgettable performance.\r<br />Therefore, the required answer is 4312.", "topic": "Jumbled Paragraphs"}, {"number": 18, "sourceId": "168959793100117", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br><span>1.<\/span>\t<span>As tensions mount between rival countries, there is growing concern about the possibility of a military conflict breaking out <\/span><span>in the near future<\/span><span>.<\/span><br>2.\t<span>Despite attempts at diplomacy and negotiations, differences over trade, human rights, and territorial disputes continue to divide nations and strain relationships.<\/span><br>3.\t<span>In the wake of recent political upheavals, many countries are re-evaluating their alliances and positioning themselves for potential threats.<\/span><br>4.\t<span>The rise of nationalist movements and the decline of multilateralism have further complicated international relations, making it difficult to find common ground on important issues.<\/span><br><br><span>", "options": [], "answer": "3241", "answerLabel": "3241", "solution": "Sentence 1. Good for the beginning&nbsp;but may be too abrupt – unless some history is invoked.\r<br />Sentence 2. ‘continue to divide’ is a clue. Not the best sentence for a beginning.\r<br />Sentence 3. Background information for 1 – can be placed before 2 and 1.\r<br />Sentence 4. “further complicated” is another clue. 2-4 is a subtle link- ‘continue to divide’ and ‘further complicated’ are progressive.\r<br />Sentence 3 sets the context for the current state of international politics. Sentence 2 describes how attempts at diplomacy and negotiations have not resolved differences between countries, which is a continuation of the theme set in sentence 3, so it should come after sentence 3. In sentence 4, the rise of nationalist movements and the decline of multilateralism is introduced, which is a separate idea that can come after the first two sentences. Finally, in sentence 1, the possibility of military conflict is described, which can be seen as a logical consequence of the tensions and lack of resolution mentioned in the first two sentences.\r<br />Therefore, the required answer is 3241.", "topic": "Jumbled Paragraphs"}, {"number": 19, "sourceId": "168959793100618", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br><span>1.<\/span>\t<span>In addition to the direct harms of alcohol abuse, such as liver disease and addiction, there are also indirect harms such as impaired driving and domestic violence.<\/span><br>2.\t<span>Factors contributing to the problem include the availability and affordability of alcohol, <\/span>cultural norms around drinking, and individual risk factors such as genetics and trauma.<br>3.\t<span>Efforts such as education and treatment programs have been made to address the issue of alcohol use disorder, yet its prevalence remains high.<\/span><br>4.\t<span>Alcoholism is a major public health issue affecting millions of people worldwide, causing significant physical, social, and economic harm.<\/span><br><br><span>", "options": [], "answer": "4321", "answerLabel": "4321", "solution": "Sentence 1. Lists the harms of alcohol abuse. It should be a follower.\r<br />Sentence 2. “Factors contributing to the problem”. The problem should be described before it.\r<br />Sentence 3.&nbsp;In spite of efforts to mitigate ‘alcohol use disorder’, it is high. This describes the significance / extent of the problem. This continues the theme of 4.&nbsp;\r<br />Sentence 4. Introduces the topic. The beginning&nbsp;sentence. This also informs about the extent of the problem.\r<br />4 starts the paragraph. 2 and 3 can both be seen as related, however, 3 continues the theme better – as alcoholism is a worldwide problem and efforts to address the problem have not succeeded. 4 and 3 both talk about how alcoholism is a significant problem. Sentence 2 talks about the causes of /factors contributing to the problem. 2 follows 4-3. So, 4-3-2 is a sequence. 1 closes the paragraph by listing the harmful effects of the problem.\r<br />Therefore, the required answer is 4321.", "topic": "Jumbled Paragraphs"}, {"number": 20, "sourceId": "168959793100719", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><span><b>Sentence:<\/b><\/span><span> Many countries have set ambitious targets for renewable energy use, such as the European Union's goal of reaching 32% renewable energy by 2030.\"<\/span><br><br><span><b>Paragraph:<\/b><\/span><span> Climate change is a pressing global issue, and reducing our carbon emissions is more important than ever. _____1____. Renewable energy sources such as solar, wind, hydro, and geothermal power have the potential to provide us with clean energy without the harmful emissions associated with fossil fuels. _____2____. They are also becoming increasingly affordable and efficient, making them a viable option for many individuals and organizations. However, there are still challenges to overcome, such as the intermittency of some renewable sources and the need for new infrastructure to support them. _____3____. Despite these challenges, <\/span><span>it is clear that the<\/span><span> shift towards renewable energy is necessary for a sustainable future. _____4____.<\/span>", "options": ["<span><\/span>\t<span>Option 1<\/span>", "<span>Option 2<\/span>", "<span>Option 3<\/span>", "<span>Option 4<\/span>"], "answer": 0, "answerLabel": "A", "solution": "The sentence helps to link the first sentence of the paragraph and the one after the first blank. Placing the sentence at the beginning of the paragraph emphasizes the global efforts and targets set by countries to promote renewable energy use. It establishes the context and supports the subsequent statements about the potential of renewable energy sources and the need for a shift towards them. Blank 2 does not need a sentence as “they’ after the blank refers to ‘renewable energy sources’ in the sentence before it. Blanks 3 and 4 are also superfluous.\r<br />Hence, [1].", "topic": "Paragraph Completion"}, {"number": 21, "sourceId": "168959793100920", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<p><strong>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/strong><br /><br /><span><strong>Sentence: <\/strong><\/span><span>Online education has become increasingly popular in recent years, providing greater access to educational opportunities for people around the world.<\/span><br /><br /><strong>Paragraph:<\/strong><span> Education is a crucial aspect of personal and societal development, and advances in technology have made it more accessible than ever. _____1____. Online education, or e-learning, allows individuals to access educational materials and instruction from anywhere with an internet connection. _____2____. This has been particularly important during the COVID-19 pandemic, as many schools and universities have shifted to online instruction to maintain social distancing. However, there are also challenges to online education, such as the lack of face-to-face interaction and potential for technical difficulties. _____3____. Nevertheless, online education has the potential to democratize access to education and empower individuals with knowledge and skills for personal and professional growth. _____4____.<\/span><\/p>", "options": ["<span>Option 1<\/span>", "<span>Option 2<\/span>", "<span>Option 3<\/span>", "<span>Option 4<\/span>"], "answer": 1, "answerLabel": "B", "solution": "Blank 1 does not need a connection its place as advances in technology’ in the sentence before it links to ‘online education’ in the sentence after it. Blank 2 takes the key sentence seamlessly as the sentences before and after the blank discuss accessibility of online education. Blanks 3 and 4 do not need a filler.\r<br />Hence, [2].", "topic": "Paragraph Completion"}, {"number": 22, "sourceId": "168959793101021", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><span> <\/span><br><span>The discovery of the ‘Yamanaka factors’—four transcription factors (Oct3/4, Sox2, c-<\/span><span>Myc<\/span><span> and Klf4), proteins that can reprogram a fully mature cell into an embryonic-like state—earned Shinya Yamanaka a share of the Nobel prize in 2012. The finding transformed stem cell research by providing a new source of cells that resemble embryonic stem cells, which <\/span><span>are able to<\/span><span> give rise to any type of specialized cell in the body. But in recent years, Yamanaka factors have also become the focus for another burgeoning area: to set back the clock on aging. So-called partial reprogramming consists of applying Yamanaka factors to cells for long enough to roll back cellular aging and repair tissues but without returning to pluripotency in which a cell can specialize into other cell types.<\/span>", "options": ["<span>The discovery of the 'Yamanaka factors' that can reprogram a fully mature cell into an embryonic-like state earned Shinya Yamanaka the Nobel prize in 2012 for transforming embryonic stem cell research.<\/span>", "<span>The discovery of the Yamanaka factors that can reprogram a mature cell into an embryonic-like state has transformed stem cell research by providing a new source of cells like embryonic stem cells.<\/span>", "<span>The Nobel prize winning discovery of Yamanaka factors that can reprogram a fully mature cell into an embryonic-like state has revolutionized research as has the potential to turn back the clock on aging.<\/span>", "<span>The Nobel prize winning discovery of Yamanaka factors that can turn a fully mature cell into embryonic-like state can be used to repair tissues and to reverse aging but without returning to pluripotency.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<span><b>Points:<\/b><\/span>\r<br /><span>·<\/span>&nbsp;\tThe discovery of the ‘Yamanaka&nbsp;factors’.\r<br /><span>·<\/span>&nbsp;\tNobel Prize to Shinya Yamanaka 2012.\r<br /><span>·<\/span>&nbsp;\tYamanaka factors that can reprogram mature cells into an embryonic-like state.\r<br /><span>·<\/span>&nbsp;\tThe finding transformed stem cell research.\r<br /><span>·<\/span>&nbsp;\tPartial application of Yamanaka factors can roll back cellular aging and repair tissues.\r<br />Option 1. What Yamanaka factors can do is not mentioned.\r<br />Option 2. it captures the main points of the&nbsp;passage but it is not as concise as option 4. It highlights the discovery of Yamanaka factors and its impact on stem cell research, but it doesn't mention the&nbsp;potential of the discovery to repair tissues and reverse aging. It also doesn't mention the Nobel prize win for the discovery.\r<br />Option 3. It highlights the discovery of Yamanaka factors, the reprogramming of mature cells into embryonic-like state and the potential of the discovery to turn back the clock on aging, and the Nobel prize win for the discovery. However, it doesn't mention the ability of the discovery to repair tissues.\r<br />Option 4. More specific than 3. It is the most concise and covers the main points of the passage. It highlights the discovery of Yamanaka factors, the reprogramming of mature cells into embryonic-like state, the potential of the discovery to repair tissues and reverse aging, and the Nobel prize win for the discovery. Option 4 is more informative and covers more aspects in less words.\r<br />Hence, [4].", "topic": "Summary"}, {"number": 23, "sourceId": "168959793101222", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br><span>The current assessment tests for autism are a prime example of gender bias in medicine and an example of how diagnostics are rife with gender and racial biases. The latest diagnostic criteria for autism were set forth in the 2013 Diagnostic and Statistical Manual of Mental Disorders (DSM-5). This version has extremely restrictive requirements for an autism diagnosis, such as showing deficits in nonverbal communication, displaying social issues, using repetitive speech, and difficulty maintaining relationships. These diagnostic requirements are outdated and more specific to the white male experience of autism. The DSM doesn’t distinguish between subtypes of autism, including Asperger’s syndrome.<\/span><span><\/span>", "options": ["<span>Current autism assessment tests are outdated and biased towards the white male experience, lacking inclusivity and distinction of subtypes.<\/span>", "<span>The Diagnostic and Statistical Manual of Mental Disorders (DSM-5) criteria for autism diagnosis are restrictive and do not account for different experiences or subtypes.<\/span>", "<span>Current autism assessment criteria in the DSM-5 are outdated and restrictive as they are aligned with the white male experience, exclude girls and non-white individuals and lack distinction of subtypes.<\/span>", "<span>The current diagnostic criteria for autism in the DSM-5 are outdated and gender-biased, focusing on white male experiences and not distinguishing between subtypes such as Asperger's.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<span><b>Points<\/b><\/span>\r<br /><span>·<\/span>&nbsp;\tDSM-5 criteria are restrictive for autism.\r<br /><span>·<\/span>&nbsp;\tThis has led to a higher rate of misdiagnosis or underdiagnosis in certain groups.\r<br /><span>·<\/span>&nbsp;\tThe criteria are closely aligned with the \"male\" autism.\r<br /><span>·<\/span>&nbsp;\tLeads to misdiagnosis girls and non-white people.\r<br /><span>·<\/span>&nbsp;\tRemoval of Asperger's syndrome has also been criticized.\r<br />Option 1. It mentions that the current assessment criteria are restrictive and align with the white male experience of autism. Too general and misses certain specific details like DSM – 5 and syndrome etc. Asperger’s\r<br />Option 2. It does not mention that the criteria are restrictive and align with the white male experience of autism.\r<br />Option 3. Option 3 is&nbsp;similar to option 4, but it is a bit more verbose and less concise. The phrase \"exclude girls and non-white individuals\" is not as clear and direct as saying \"gender-biased,\" which encapsulates both issues of gender and race. Additionally, option 4 is more direct in its accusation of bias in the criteria and more specific in mentioning Asperger's Syndrome, a subtype of autism.\r<br />Hence, [4].", "topic": "Summary"}, {"number": 24, "sourceId": "168959793101323", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br><span>Few things encourage users to slow down and reconsider more thoroughly than the application of heat, used by many cultures across the ages, including the Aztecs. For at least 700 years before Spanish colonisers landed in ancient Mesoamerica, <\/span><span>temazcals<\/span><span> were volcanic sweat lodges in which tired Aztecs bathed, not in water but in steam. <\/span><span>Temazcal<\/span><span> comes from the word <\/span><span>temāzcalli<\/span><span>, or \"house of heat\" in the Nahuatl language, and most <\/span><span>temazcals<\/span><span> resembled domed structures, made from volcanic rock, and were symbolic of mother nature's womb, suggesting ideas of rebirth. Modern science has shown that the Aztecs were right. Steam can help clear blocked respiratory systems and soothe some other ailments. Ancient Mayans often carried out <\/span><span>temazcal<\/span><span> ceremonies for warriors returning from battle, which combined Mesoamerican chants, meditation and heated rocks doused with herb-infused water to create an aromatic steam. Today, saunas continue to reap similar benefits.<\/span>", "options": ["<span><\/span>\t<span>The utilization of steam in saunas to alleviate blocked respiratory systems and other afflictions has a rich history, dating back to ancient cultures such as the Mayans and Aztecs. Science has also substantiated the benefits of this practice.<\/span>", "<span>The ancient Aztec practice of <\/span><span>Temazcal<\/span><span>, also known as \"house of heat,\" involves inducing sweating as a means of alleviating blocked respiratory systems and other maladies. Modern science <\/span>has validated the practice, as seen in the contemporary use of saunas.", "<span>Temazcal<\/span><span> is an ancient Aztec practice of sweating in steam in domed structures, used to clear respiratory systems and soothe ailments during chants, <\/span><span>meditation<\/span><span> and the use of heated rocks with herbs. Today, saunas provide similar benefits.<\/span>", "<span>The practice of utilizing steam to alleviate blocked respiratory systems and other afflictions, which has been scientifically validated, has its origins in ancient cultures that used heated rocks doused with herb-infused water to create an aromatic steam.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<span><b>Points:<\/b><\/span>\r<br /><span>·<\/span>&nbsp;\tTemazcals were volcanic sweat lodges in which tired Aztecs bathed, not in water but in steam. Mayans had temazcal ceremonies for warriors.\r<br /><span>·<\/span>&nbsp;\tModern science- Steam can help clear blocked respiratory systems and soothe some other ailments.\r<br /><span>·<\/span>&nbsp;\tToday, saunas continue to reap similar benefits.\r<br />\r<br />Option 1 . The best precis. It highlights the historical context of the practice of using steam to clear respiratory systems, specifically mentioning the Mayans and Aztecs,&nbsp;and also notes that it has been scientifically validated. It also&nbsp;mention that saunas provide similar benefits.\r<br />Option 2. Incorrect. It is less complete than the first one. It only mentions the Aztecs and their practice of Temazcal, and how it is related to sweating and alleviating respiratory and other maladies, and it highlights the validation of the practice by modern science. But it does not mention about the Mayans and the practice of saunas which are also important points from the passage.\r<br />Option 3. Incorrect. it doesn't mention the origin of the practice, Mayans and how it has been validated by modern science. It also only mentions the Aztecs and not the Mayans or the similarity of saunas to the ancient practice, which are important points from the passage.\r<br />Option 4. Incorrect. it only mentions the origins and the validation of the practice, it doesn't mention the specific cultures or the continuation of the practice through saunas which are also important points from the passage. It also doesn't mention the specific practice of Temazcal of Aztecs.\r<br />Hence, [1].", "topic": "Summary"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;

function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
