<script type="application/json" id="test-data">{"testNumber": 7, "simcat": 7, "minutes": 40, "questions": [{"number": 1, "sourceId": "16895979309920", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>Back in the 1960s, when the theory of plate tectonics was rapidly gaining acceptance, certain geological features seemed to evade explanation. While the theory provided explanations for questions that had long puzzled scientists — where volcanoes appear, where land is born, where ocean basins are carved out, where ancient crust was annihilated — it couldn’t explain something like Hawai’i.<\/span>\r<br>\r<br><span>Plate tectonics predicts that the boundaries of tectonic plates — where two plates collide, slide over or under one another, grind side by side, or move apart — are where most of the planet’s geologic fireworks can be found. The so-called Ring of Fire, the horseshoe-shaped region that marks the fringes of the many plates surrounding the Pacific plate, is home to 75% of the world’s active volcanoes.<\/span>\r<br>\r<br><span>But despite being nowhere near a plate boundary, Hawai‘i is an archipelago of giant volcanoes. The active submarine volcano <\/span><span>Lō‘ihi<\/span><span>, off the southeastern shore of the island of Hawai‘i, is the youngest member of a warped chain of volcanoes 6,000 <\/span><span>kilometers<\/span><span> long, one that can be traced all the way to long-expired underwater volcanoes in the northwest Pacific. This phenomenon, known as intraplate volcanism, stood out as a geologic aberration.<\/span>\r<br>\r<br><span>In 1963, the Canadian geophysicist John <\/span><span>Tuzo<\/span><span> Wilson suggested that volcanic chains like this are forged when a tectonic plate continuously drifts over a stationary hot spot in the mantle — the scorching rock that makes up 84% of Earth’s volume. This creates a sequence of volcanoes that erupt, grow, then die out as the plate migrates away from the magmatic fuel source. In 1971, the American geophysicist William Jason Morgan proposed that these hot spots were caused by plumes of particularly hot material rising from the lower mantle.<\/span>\r<br>\r<br><span>Over the following decades, geophysicists concluded that plumes are around 200 degrees Celsius hotter than the ambient mantle. When plumes reach the base of tectonic plates, their heat melts their surroundings, making plenty of magma. The plumes also carry mantle material up from Earth’s depths. This material melts at the lower pressures found away from the core, feeding additional magma into the crust. The combined supply of hot magma neatly explains a great number of Earth’s intraplate volcanoes.<\/span>\r<br>\r<br>Chains of volcanoes, also known as hot spot tracks, are difficult to explain without invoking plumes. Hawai‘i is an oceanic example, but they can be found on land, too: The Yellowstone <span>supervolcano<\/span><span> is the youngest member of a hot spot track dating back at least 17 million years, one that poured 210,000 cubic <\/span><span>kilometers<\/span><span> of lava across the Pacific Northwest before blasting out a trail of giant volcanic cauldrons from Oregon to Wyoming — the undeniable scar tissue of an unrelenting mantle plume.<\/span>\r<br>\r<br><span>Chemical evidence also implies the existence of mantle plumes. There are two stable types of helium: helium-3 and helium-4. Helium-3 was trapped deep within Earth during its formation and is decidedly ancient. Several hot spot volcanoes, including Hawai‘i’s <\/span><span>Kīlauea<\/span><span>, erupt lavas with an abundance of the stuff. That, said Godfrey Fitton, a petrologist at the University of Edinburgh, suggests that these volcanoes are mining mantle matter from considerable depth — and a plume is a reasonable explanation.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Plate tectonics theory provides an explanation for <\/span><span>all of<\/span><span> the following EXCEPT:<\/span>", "options": ["<span>how the Earth's plates move and interact with each other.<\/span>", "<span><\/span>\t<span>how volcanoes arise as plates move apart or collide.<\/span>", "<span><\/span>\t<span>how mantle plumes form beneath the Earth's rocky outer layer,<\/span>", "<span><\/span>\t<span>how intraplate volcanoes arise far from plate boundaries.<\/span>\n<span> <\/span>"], "answer": 2, "answerLabel": "C", "solution": "The first two paragraphs: “While the theory provided explanations for questions that had long puzzled scientists — where volcanoes appear, where land is born, where ocean basins are carved out, where ancient crust was annihilated…” “Plate tectonics predicts that the boundaries of tectonic plates — where two plates collide, slide over or under one another, grind side by side, or move apart — are where most of the planet’s geologic fireworks can be found.”&nbsp;So 1 and 2 are not exceptions. Next three paragraphs explain how after 1960 the theory explained how intraplate volcanoes such as Hawaii and Yellowstone were created’. Hence 4 is not an exception.\r<br />Hence, [3].", "topic": "Specific Detail Question"}, {"number": 2, "sourceId": "16895979309951", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>Back in the 1960s, when the theory of plate tectonics was rapidly gaining acceptance, certain geological features seemed to evade explanation. While the theory provided explanations for questions that had long puzzled scientists — where volcanoes appear, where land is born, where ocean basins are carved out, where ancient crust was annihilated — it couldn’t explain something like Hawai’i.<\/span>\r<br>\r<br><span>Plate tectonics predicts that the boundaries of tectonic plates — where two plates collide, slide over or under one another, grind side by side, or move apart — are where most of the planet’s geologic fireworks can be found. The so-called Ring of Fire, the horseshoe-shaped region that marks the fringes of the many plates surrounding the Pacific plate, is home to 75% of the world’s active volcanoes.<\/span>\r<br>\r<br><span>But despite being nowhere near a plate boundary, Hawai‘i is an archipelago of giant volcanoes. The active submarine volcano <\/span><span>Lō‘ihi<\/span><span>, off the southeastern shore of the island of Hawai‘i, is the youngest member of a warped chain of volcanoes 6,000 <\/span><span>kilometers<\/span><span> long, one that can be traced all the way to long-expired underwater volcanoes in the northwest Pacific. This phenomenon, known as intraplate volcanism, stood out as a geologic aberration.<\/span>\r<br>\r<br><span>In 1963, the Canadian geophysicist John <\/span><span>Tuzo<\/span><span> Wilson suggested that volcanic chains like this are forged when a tectonic plate continuously drifts over a stationary hot spot in the mantle — the scorching rock that makes up 84% of Earth’s volume. This creates a sequence of volcanoes that erupt, grow, then die out as the plate migrates away from the magmatic fuel source. In 1971, the American geophysicist William Jason Morgan proposed that these hot spots were caused by plumes of particularly hot material rising from the lower mantle.<\/span>\r<br>\r<br><span>Over the following decades, geophysicists concluded that plumes are around 200 degrees Celsius hotter than the ambient mantle. When plumes reach the base of tectonic plates, their heat melts their surroundings, making plenty of magma. The plumes also carry mantle material up from Earth’s depths. This material melts at the lower pressures found away from the core, feeding additional magma into the crust. The combined supply of hot magma neatly explains a great number of Earth’s intraplate volcanoes.<\/span>\r<br>\r<br>Chains of volcanoes, also known as hot spot tracks, are difficult to explain without invoking plumes. Hawai‘i is an oceanic example, but they can be found on land, too: The Yellowstone <span>supervolcano<\/span><span> is the youngest member of a hot spot track dating back at least 17 million years, one that poured 210,000 cubic <\/span><span>kilometers<\/span><span> of lava across the Pacific Northwest before blasting out a trail of giant volcanic cauldrons from Oregon to Wyoming — the undeniable scar tissue of an unrelenting mantle plume.<\/span>\r<br>\r<br><span>Chemical evidence also implies the existence of mantle plumes. There are two stable types of helium: helium-3 and helium-4. Helium-3 was trapped deep within Earth during its formation and is decidedly ancient. Several hot spot volcanoes, including Hawai‘i’s <\/span><span>Kīlauea<\/span><span>, erupt lavas with an abundance of the stuff. That, said Godfrey Fitton, a petrologist at the University of Edinburgh, suggests that these volcanoes are mining mantle matter from considerable depth — and a plume is a reasonable explanation.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which one of the following statements best describes what the passage is about?<\/span>", "options": ["<span>The evidence for the existence of mantle plumes and their role in causing intraplate volcanoes.<\/span>", "<span>The various theories regarding the formation of volcanic chains at tectonic plate boundaries.<\/span>", "<span>Intraplate volcanism, and the explanation for volcanic chains far from tectonic plate boundaries.<\/span>", "<span>The theories of John <\/span><span>Tuzo<\/span><span> Wilson and William Jason Morgan regarding Hawaiian Islands and the Yellowstone <\/span><span>supervolcano<\/span><span>.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "Option 1: Too narrow and specific to capture the main idea of the passage, which includes various theories regarding intraplate volcanism and explanations for volcanic chains that are located far from tectonic plate boundaries, though it does discuss evidence for the existence of mantle plumes.\r<br />Option 2: Intraplate volcanism occurs far from tectonic plate boundaries. The passage focuses specifically on the theories explaining the formation of volcanic chains that are not at plate boundaries.\r<br />Option 3: The passage discusses the phenomenon of intraplate volcanism, which occurs in volcanic chains located far from tectonic plate boundaries, such as the Hawaiian Islands and the Yellowstone supervolcano.\r<br />Option 4: Too arrow and specific for the main idea. While the passage does discuss these theories, it its focus is on intraplate volcanism and provides evidence to support the theories. The passage is not solely about the theories themselves but rather the broader topic of intraplate volcanism.\r<br />Hence, [3].", "topic": "Central Idea"}, {"number": 3, "sourceId": "16895979309952", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>Back in the 1960s, when the theory of plate tectonics was rapidly gaining acceptance, certain geological features seemed to evade explanation. While the theory provided explanations for questions that had long puzzled scientists — where volcanoes appear, where land is born, where ocean basins are carved out, where ancient crust was annihilated — it couldn’t explain something like Hawai’i.<\/span>\r<br>\r<br><span>Plate tectonics predicts that the boundaries of tectonic plates — where two plates collide, slide over or under one another, grind side by side, or move apart — are where most of the planet’s geologic fireworks can be found. The so-called Ring of Fire, the horseshoe-shaped region that marks the fringes of the many plates surrounding the Pacific plate, is home to 75% of the world’s active volcanoes.<\/span>\r<br>\r<br><span>But despite being nowhere near a plate boundary, Hawai‘i is an archipelago of giant volcanoes. The active submarine volcano <\/span><span>Lō‘ihi<\/span><span>, off the southeastern shore of the island of Hawai‘i, is the youngest member of a warped chain of volcanoes 6,000 <\/span><span>kilometers<\/span><span> long, one that can be traced all the way to long-expired underwater volcanoes in the northwest Pacific. This phenomenon, known as intraplate volcanism, stood out as a geologic aberration.<\/span>\r<br>\r<br><span>In 1963, the Canadian geophysicist John <\/span><span>Tuzo<\/span><span> Wilson suggested that volcanic chains like this are forged when a tectonic plate continuously drifts over a stationary hot spot in the mantle — the scorching rock that makes up 84% of Earth’s volume. This creates a sequence of volcanoes that erupt, grow, then die out as the plate migrates away from the magmatic fuel source. In 1971, the American geophysicist William Jason Morgan proposed that these hot spots were caused by plumes of particularly hot material rising from the lower mantle.<\/span>\r<br>\r<br><span>Over the following decades, geophysicists concluded that plumes are around 200 degrees Celsius hotter than the ambient mantle. When plumes reach the base of tectonic plates, their heat melts their surroundings, making plenty of magma. The plumes also carry mantle material up from Earth’s depths. This material melts at the lower pressures found away from the core, feeding additional magma into the crust. The combined supply of hot magma neatly explains a great number of Earth’s intraplate volcanoes.<\/span>\r<br>\r<br>Chains of volcanoes, also known as hot spot tracks, are difficult to explain without invoking plumes. Hawai‘i is an oceanic example, but they can be found on land, too: The Yellowstone <span>supervolcano<\/span><span> is the youngest member of a hot spot track dating back at least 17 million years, one that poured 210,000 cubic <\/span><span>kilometers<\/span><span> of lava across the Pacific Northwest before blasting out a trail of giant volcanic cauldrons from Oregon to Wyoming — the undeniable scar tissue of an unrelenting mantle plume.<\/span>\r<br>\r<br><span>Chemical evidence also implies the existence of mantle plumes. There are two stable types of helium: helium-3 and helium-4. Helium-3 was trapped deep within Earth during its formation and is decidedly ancient. Several hot spot volcanoes, including Hawai‘i’s <\/span><span>Kīlauea<\/span><span>, erupt lavas with an abundance of the stuff. That, said Godfrey Fitton, a petrologist at the University of Edinburgh, suggests that these volcanoes are mining mantle matter from considerable depth — and a plume is a reasonable explanation.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\tA<span>ll of the following statements, if false, could be seen as being in accordance with the passage, EXCEPT<\/span>", "options": ["<span>The \"Ring of Fire\" is a satisfactory explanation for the prevalence of volcanoes worldwide.<\/span>", "<span>The existence of mantle plumes provides a plausible explanation for intraplate volcanism.<\/span>", "<span>Hot spot tracks such as Hawaii and Yellowstone can be explained without invoking plumes.<\/span>", "<span>Jason Morgan did not believe that the plumes arose from deep within the Earth's mantle.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "If false … except – As it is, the given statement would be in accordance with the passage.\r<br />Option 1. If false … (is not a satisfactory explanation). On falsification, this statement would be in accordance with the passage, hence not the exception.\r<br />Option 2. If false …(does not provide …) will not be in accordance if falsified. Hence the exception.\r<br />Option 3. If false… (cannot be explained…) will be in accordance if&nbsp;falsified; hence not the exception.\r<br />Option 4. If false … (Morgan believed that …) will be in accordance if&nbsp;falsified; hence not the exception.\r<br />Hence, [2].", "topic": "Specific Detail Question"}, {"number": 4, "sourceId": "16895979309953", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>Back in the 1960s, when the theory of plate tectonics was rapidly gaining acceptance, certain geological features seemed to evade explanation. While the theory provided explanations for questions that had long puzzled scientists — where volcanoes appear, where land is born, where ocean basins are carved out, where ancient crust was annihilated — it couldn’t explain something like Hawai’i.<\/span>\r<br>\r<br><span>Plate tectonics predicts that the boundaries of tectonic plates — where two plates collide, slide over or under one another, grind side by side, or move apart — are where most of the planet’s geologic fireworks can be found. The so-called Ring of Fire, the horseshoe-shaped region that marks the fringes of the many plates surrounding the Pacific plate, is home to 75% of the world’s active volcanoes.<\/span>\r<br>\r<br><span>But despite being nowhere near a plate boundary, Hawai‘i is an archipelago of giant volcanoes. The active submarine volcano <\/span><span>Lō‘ihi<\/span><span>, off the southeastern shore of the island of Hawai‘i, is the youngest member of a warped chain of volcanoes 6,000 <\/span><span>kilometers<\/span><span> long, one that can be traced all the way to long-expired underwater volcanoes in the northwest Pacific. This phenomenon, known as intraplate volcanism, stood out as a geologic aberration.<\/span>\r<br>\r<br><span>In 1963, the Canadian geophysicist John <\/span><span>Tuzo<\/span><span> Wilson suggested that volcanic chains like this are forged when a tectonic plate continuously drifts over a stationary hot spot in the mantle — the scorching rock that makes up 84% of Earth’s volume. This creates a sequence of volcanoes that erupt, grow, then die out as the plate migrates away from the magmatic fuel source. In 1971, the American geophysicist William Jason Morgan proposed that these hot spots were caused by plumes of particularly hot material rising from the lower mantle.<\/span>\r<br>\r<br><span>Over the following decades, geophysicists concluded that plumes are around 200 degrees Celsius hotter than the ambient mantle. When plumes reach the base of tectonic plates, their heat melts their surroundings, making plenty of magma. The plumes also carry mantle material up from Earth’s depths. This material melts at the lower pressures found away from the core, feeding additional magma into the crust. The combined supply of hot magma neatly explains a great number of Earth’s intraplate volcanoes.<\/span>\r<br>\r<br>Chains of volcanoes, also known as hot spot tracks, are difficult to explain without invoking plumes. Hawai‘i is an oceanic example, but they can be found on land, too: The Yellowstone <span>supervolcano<\/span><span> is the youngest member of a hot spot track dating back at least 17 million years, one that poured 210,000 cubic <\/span><span>kilometers<\/span><span> of lava across the Pacific Northwest before blasting out a trail of giant volcanic cauldrons from Oregon to Wyoming — the undeniable scar tissue of an unrelenting mantle plume.<\/span>\r<br>\r<br><span>Chemical evidence also implies the existence of mantle plumes. There are two stable types of helium: helium-3 and helium-4. Helium-3 was trapped deep within Earth during its formation and is decidedly ancient. Several hot spot volcanoes, including Hawai‘i’s <\/span><span>Kīlauea<\/span><span>, erupt lavas with an abundance of the stuff. That, said Godfrey Fitton, a petrologist at the University of Edinburgh, suggests that these volcanoes are mining mantle matter from considerable depth — and a plume is a reasonable explanation.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span>Which one of the following statements, if true, would weaken the argument in the last paragraph?<\/span", "options": ["<span><\/span>\t<span>Helium 3 is found in abundance in the volcanic lavas of the Ring of Fire.<\/span>", "<span>Helium 3 is a rare isotope that can only be found in volcanic lavas formed due to the mantle plume.<\/span>", "<span>The presence of Helium 3 in volcanic lavas is a reliable indicator of the presence of mantle plumes.<\/span>", "<span>The amount of Helium 3 found in intraplate volcanoes is significantly higher than that found in volcanoes at tectonic plate boundaries.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "The argument in the last paragraph is that presence of Helium 3 in the volcanic lavas of intraplate volcanoes makes the mantle plume theory right or “and a plume is a reasonable explanation.” Ring of Fire (second paragraph) is where 75% of the volcanoes (of the plate boundary type) exist. If they also contain an abundance of Helium 3, the argument is weakened. The other options, 2, 3 and 4 strengthen the argument.\r<br />Hence, [1].", "topic": "Application Question"}, {"number": 5, "sourceId": "16895979309954", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Three decades ago, scientists thought they had cracked the medical mystery of what causes Alzheimer’s disease  AD) with an idea known as the amyloid cascade hypothesis. It accused a protein called amyloid-beta of forming sticky, toxic plaques between neurons, killing them and triggering a series of events that made the brain waste away. The amyloid cascade hypothesis was simple and “seductively compelling,” said Scott Small, the director of the Alzheimer’s Disease Research <\/span><span>Center<\/span><span> at Columbia University. And the idea of aiming drugs at the amyloid plaques to stop or prevent the progression of the disease took the field by storm.<\/span><br><br><span>Decades of work and billions of dollars went into funding clinical trials of dozens of drug compounds that targeted amyloid plaques. <\/span><span>Yet,<\/span><span> almost none of the trials showed meaningful benefits to patients with the disease.<\/span><span> <\/span><span>That is, until September 2022, when the pharmaceutical giants Biogen and Eisai announced that in a phase 3 clinical trial, patients taking the anti-amyloid drug <\/span><span>lecanemab<\/span><span> showed 27% less decline in their cognitive health than patients taking a placebo did.<\/span><br><br><span>Because AD progresses over 25 years, the hope is that <\/span><span>lecanemab<\/span><span>, when given to people with early-stage Alzheimer’s disease, will slow that progression, said Paul <\/span><span>Aisen<\/span><span>, a professor of neurology at the Keck School of Medicine of the University of Southern California. By extending the milder stages of the disease, the drug could give people more years of independence and more time to manage their finances before being institutionalized.<\/span><br><br><span>Some are less hopeful that the results will show any meaningful difference. “The clinically important difference is probably not there,” said Eric Larson, a professor of medicine at the University of Washington. On the scale the companies used to test the efficacy — calculated from interviews with the patient and their caregivers on their memory, <\/span><span>judgment<\/span><span> and other cognitive functions — their results were statistically significant but modest. And statistical significance, which means the results <\/span>were likely not due to chance, does not always equate to clinical significance, Larson said. The difference in the rate of decline, for example, might be unnoticeable to caregivers.<br><br><span>What’s more, reports of brain swelling in some participants and two deaths — which the companies deny are due to the drug — has some concerned about the safety of the drug. But Alzheimer’s medicine is a field more accustomed to disappointment than success, and even the announcement by Roche that a second much-awaited drug, gantenerumab, failed in phase 3 clinical trials didn’t diminish the excitement over the <\/span><span>lecanemab<\/span><span> news.<\/span><br><br><span>Do these results mean the amyloid cascade hypothesis was right?<\/span><span> <\/span><span>Not necessarily. It does suggest to some researchers that with more coaxing, targeting amyloid could still lead to effective therapeutics. “I’m thrilled,” said Rudy <\/span><span>Tanzi<\/span><span>, an investigator at Massachusetts General Hospital. <\/span><span>Lecanemab<\/span><span> doesn’t offer a “stellar effect,” he acknowledged, but it’s a “proof of concept” that could potentially lead to more effective drugs or more effectiveness if taken earlier.<\/span><span> <\/span><span>Many researchers, however, aren’t convinced. To them, the small to non-existent effect sizes in these trials and earlier ones suggest that amyloid plaques are not the cause of the disease. Amyloid is “more the smoke, not the fire […] which continues to rage inside neurons,” said Small.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following best explains the relationship between the amyloid hypothesis and the results of recent drug trials?<\/span>", "options": ["<span>The amyloid hypothesis has been definitively proven by the success of the recent clinical trials using anti-amyloid drugs.<\/span>", "<span>The recent clinical trials using anti-amyloid drugs have disproven the amyloid hypothesis.<\/span>", "<span>Anti-amyloid drugs have provided evidence that targeting amyloid may lead to effective therapeutics, but the hypothesis has not been definitively proven.<\/span>", "<span>The recent clinical trials using anti-amyloid drugs have shown that targeting amyloid is not an effective approach to treating Alzheimer's disease.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "Options 1 and 2 are contradictory to each other. The passage is tentative about the anti-amyloid drug lecanemab. Only options 3 and 4 merit evaluation. But only 4 is categorical and&nbsp;similar to 1.\r<br />Correct answer: 3.  It accurately reflects the information presented in the passage – notice the use of ‘may’ in the sentence. The recent clinical trials using anti-amyloid drugs did show some positive results, which suggests that targeting amyloid may be an effective approach to treating Alzheimer's disease – though there is debate surrounding the concept.\r<br />Option 4 it is too extreme. While it is true that many clinical trials using anti-amyloid drugs have failed to show significant benefits, the recent trial with lecanemab did show some positive results. Additionally, while some researchers believe that amyloid plaques are not the cause of Alzheimer's disease, others still believe that targeting amyloid could be an effective approach with further research and development. Therefore, it is not accurate to say that targeting amyloid is not an effective approach.\r<br />Hence, [3].", "topic": "Inference"}, {"number": 6, "sourceId": "16895979309965", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Three decades ago, scientists thought they had cracked the medical mystery of what causes Alzheimer’s disease  AD) with an idea known as the amyloid cascade hypothesis. It accused a protein called amyloid-beta of forming sticky, toxic plaques between neurons, killing them and triggering a series of events that made the brain waste away. The amyloid cascade hypothesis was simple and “seductively compelling,” said Scott Small, the director of the Alzheimer’s Disease Research <\/span><span>Center<\/span><span> at Columbia University. And the idea of aiming drugs at the amyloid plaques to stop or prevent the progression of the disease took the field by storm.<\/span><br><br><span>Decades of work and billions of dollars went into funding clinical trials of dozens of drug compounds that targeted amyloid plaques. <\/span><span>Yet,<\/span><span> almost none of the trials showed meaningful benefits to patients with the disease.<\/span><span> <\/span><span>That is, until September 2022, when the pharmaceutical giants Biogen and Eisai announced that in a phase 3 clinical trial, patients taking the anti-amyloid drug <\/span><span>lecanemab<\/span><span> showed 27% less decline in their cognitive health than patients taking a placebo did.<\/span><br><br><span>Because AD progresses over 25 years, the hope is that <\/span><span>lecanemab<\/span><span>, when given to people with early-stage Alzheimer’s disease, will slow that progression, said Paul <\/span><span>Aisen<\/span><span>, a professor of neurology at the Keck School of Medicine of the University of Southern California. By extending the milder stages of the disease, the drug could give people more years of independence and more time to manage their finances before being institutionalized.<\/span><br><br><span>Some are less hopeful that the results will show any meaningful difference. “The clinically important difference is probably not there,” said Eric Larson, a professor of medicine at the University of Washington. On the scale the companies used to test the efficacy — calculated from interviews with the patient and their caregivers on their memory, <\/span><span>judgment<\/span><span> and other cognitive functions — their results were statistically significant but modest. And statistical significance, which means the results <\/span>were likely not due to chance, does not always equate to clinical significance, Larson said. The difference in the rate of decline, for example, might be unnoticeable to caregivers.<br><br><span>What’s more, reports of brain swelling in some participants and two deaths — which the companies deny are due to the drug — has some concerned about the safety of the drug. But Alzheimer’s medicine is a field more accustomed to disappointmen s Food and Drug Administration approved <\/span><span>lecanemab<\/span><span>.<\/span>", "<span>Patients on <\/span><span>lecanemab<\/span><span> showed statistically significant improvement in their cognitive health.<\/span>", "<span>Patients taking <\/span><span>lecanemab<\/span><span> experienced no adverse side effects during the clinical trial.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "Eric Larson argued that the results of the lecanemab clinical trial, while statistically significant, were too modest to be clinically meaningful. Option 3 presents evidence that directly contradicts Larson's argument by suggesting that the reduction is clinically relevant.&nbsp;<span>Larson is skeptical about the effectiveness of amyloid-targeting drugs. His main argument is “<\/span>their results were statistically significant but modest.” Option 3 just says the opposite. Options 1 and 4 do not address the argument. However, Option 2 may need some consideration (fallacy: appeal to authority): The FDA's approval of lecanemab indicates that the drug has been deemed safe and effective enough to be prescribed as a treatment for Alzheimer's disease. It does not necessarily overrule Eric Larson's argument about the effectiveness of targeting amyloid plaques for treating AD.  Therefore, Eric Larson's argument against the amyloid hypothesis may still hold weight even&nbsp;in light of the FDA's approval of lecanemab.\r<br />Hence, [3].", "topic": "Application Question"}, {"number": 8, "sourceId": "16895979309967", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Three decades ago, scientists thought they had cracked the medical mystery of what causes Alzheimer’s disease  AD) with an idea known as the amyloid cascade hypothesis. It accused a protein called amyloid-beta of forming sticky, toxic plaques between neurons, killing them and triggering a series of events that made the were likely not due to chance, does not always equate to clinical significance, Larson said. The difference in the rate of decline, for example, might be unnoticeable to caregivers.<br><br><span>What’s more, reports of brain swelling in some participants and two deaths — which the companies deny are due to the drug — has some concerned about the safety of the drug. But Alzheimer’s medicine is a field more accustomed to disappointment than success, and even the announcement by Roche that a second much-awaited drug, gantenerumab, failed in phase 3 clinical trials didn’t diminish the excitement over the <\/span><span>lecanemab<\/span><span> news.<\/span><br><br><span>Do these results mean the amyloid cascade hypothesis was right?<\/span><span> <\/span><span>Not necessarily. It does suggest to some researchers that with more coaxing, targeting amyloid could still lead to effective therapeutics. “I’m thrilled,” said Rudy <\/span><span>Tanzi<\/span><span>, an investigator at Massachusetts General Hospital. <\/span><span>Lecanemab<\/span><span> doesn’t offer a “stellar effect,” he acknowledged, but it’s a “proof of concept” that could potentially lead to more effective drugs or more effectiveness if taken earlier.<\/span><span> <\/span><span>Many researchers, however, aren’t convinced. To them, the small to non-existent effect sizes in these trials and earlier ones suggest that amyloid plaques are not the cause of the disease. Amyloid is “more the smoke, not the fire […] which continues to rage inside neurons,” said Small.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which one of the following conclusions can be validly drawn from the last paragraph?<\/span>", "options": ["<span>It is still not entirely clear whether amyloid plaques are related to Alzheimer's disease.<\/span>", "<span>Targeting amyloid plaques could be a viable strategy in the future for the treatment of AD.<\/span>", "<span>Treating AD at earlier stages is the key to better results with drugs targeting amyloid.<\/span>", "<span>The role of amyloid in Alzheimer's disease is still a matter of debate among researchers.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "Last paragraph puts the amyloid hypothesis in perspective.  “Some researchers” represented by Rudy Tranz are thrilled about the amyloid hypothesis and believe&nbsp;that, drugs that target amyloid builds up in the brain provides proof for the principle and will drive future research and lead to more effective drugs. However, “many researchers” aren’t convinced. They are sceptical whether amyloid is the cause or the symptom of AD … mere smoke or the fire. The paragraph or the passage does not provide a conclusion to this debate. Hence only option 4 is valid.\r<br />Option 1. Not valid. “not related to”  is incorrect. Relation is not refuted -whether it is the cause or mere symptom is the issue.\r<br />Option 2. Not valid. “could be a viable strategy” is the view of one camp mentioned in the last paragraph.\r<br />Option 3. Not valid. This again is the view of one camp.\r<br />Hence, [4].", "topic": "Inference"}, {"number": 9, "sourceId": "16895979309968", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>We are witnessing a world-wide upsurge in memory. Over the last twenty-five years, every country, every social, <\/span><span>ethnic<\/span><span> or family group, has undergone a profound change in the relationship it traditionally enjoyed with the past. This change has taken a variety of forms: criticism of official versions of history and recovery of areas of history previously repressed; demands for signs of a past that had been confiscated or suppressed; growing interest in “roots” and genealogical research; and a growing attachment to what in the English-speaking world is called “heritage.”<\/span><br><br><span>This upsurge in memory intersects, with two major historical phenomena, one temporal and one social. The first concerns what is usually referred to as the “acceleration of history” – an accelerated precipitation of all things into an ever more swiftly retreating past.  Broadly speaking, the future could be interpreted in one of three ways, which themselves determined the image people had of the past. It could be envisaged as a form of restoration of the past, a form of progress, or a form of revolution. Today, we have discarded these three ways of interpreting the past, which made it possible to organize a “history.”<\/span><br><br><span>We are utterly uncertain as to what form the future will take. We do not know what our descendants will need to know about ourselves <\/span><span>in order to<\/span><span> understand their own lives. And this inability to anticipate the future puts us under an obligation to stockpile, as it were, in a pious and somewhat indiscriminate fashion, any visible trace or material sign that might eventually testify to what we are or what we will have become.<\/span><br><br>For the other effect of this “acceleration of history”, symmetrical with that of the future, is to abruptly distance us from the past – we are cut off from it. It has become what an English demographic historian has famously described as “the world we have lost”. We are no longer on very good terms with the past. We can only recover it by reconstructing it in monumental detail with the aid of documents and archives; in other words, what we today call “memory.”<br><br><span>The second reason for this outbreak of memory is of a social nature and is linked to what might be called, by analogy with “acceleration”, the “democratization” of history. This takes the form of a marked emancipatory trend among peoples, ethnic <\/span><span>groups<\/span><span> and even certain classes of individual in the world today; in short, the emergence, over a very short period of time, of all those forms of memory bound up with minority groups for whom rehabilitating their past is part and parcel of reaffirming their identity…<\/span><br><br><span>The explosion of minority memories of this kind has profoundly altered the respective status and the reciprocal nature of history and memory – <\/span><span>or,<\/span><span> to be more precise, has enhanced the very notion of “collective memory”. Unlike history, which has always been in the hands of the public authorities, of scholars and specialised peer groups, memory has acquired all the new privileges and prestige of a popular protest movement.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>All of the following are reasons for the current upsurge in memory EXCEPT:<\/span>", "options": ["<span>The difficulty to connect with the past and the desire to recover it through memory.<\/span>", "<span>Appreciation of official versions of history and rejection of areas earlier overlooked.<\/span>", "<span>The use of memory by marginalized groups as a means of asserting their identities.<\/span>", "<span>A growing interest in genealogical research and attachment to one’s heritage.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "The upsurge in memory is a result of two major historical phenomena, one temporal and one social. The first is the \"acceleration of history,\" which refers to the rapid pace at which the present is moving into the past, leaving us increasingly cut off from the past (option 1). This has led to a growing interest in recovering and preserving the past through memory. The second reason for the upsurge in memory is the \"democratization of history,\" which refers to a trend among minority groups to reclaim and celebrate their past as a way of affirming their identity. This has led to a&nbsp;proliferation of diverse memories, which have challenged the traditional dominance of official versions of history and have given rise to the concept of collective memory (Option 3, also makes option 2 the exception) Together, these two phenomena have led to a widespread interest in memory across countries, social, ethnic, and family groups. This has taken the form of demands for the recovery of suppressed or confiscated pasts, interest in genealogical research and \"roots,\" criticism of official versions of history, and growing attachment to \"heritage.\" (Option 4)\r<br />Hence, [2].", "topic": "Specific Detail Question"}, {"number": 10, "sourceId": "16895979309989", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>We are witnessing a world-wide upsurge in memory. Over the last twenty-five years, every country, every social, <\/span><span>ethnic<\/span><span> or family group, has undergone a profound change in the relationship it traditionally enjoyed with the past. This change has taken a variety of forms: criticism of official versions of history and recovery of areas of history previously repressed; demands for signs of a past that had been confiscated or suppressed; growing interest in “roots” and genealogical research; and a growing attachment to what in the English-speaking world is called “heritage.”<\/span><br><br><span>This upsurge in memory intersects, with two major historical phenomena, one temporal and one social. The first concerns what is usually referred to as the “acceleration of history” – an accelerated precipitation of all things into an ever more swiftly retreating past.  Broadly speaking, the future could be interpreted in one of three ways, which themselves determined the image people had of the past. It could be envisaged as a form of restoration of the past, a form of progress, or a form of revolution. Today, we have discarded these three ways of interpreting the past, which made it possible to organize a “history.”<\/span><br><br><span>We are utterly uncertain as to what form the future will take. We do not know what our descendants will need to know about ourselves <\/span><span>in order to<\/span><span> understand their own lives. And this inability to anticipate the future puts us under an obligation to stockpile, as it were, in a pious and somewhat indiscriminate fashion, any visible trace or material sign that might eventually testify to what we are or what we will have become.<\/span><br><br>For the other effect of this “acceleration of history”, symmetrical with that of the future, is to abruptly distance us from the past – we are cut off from it. It has become what an English demographic historian has famously described as “the world we have lost”. We are no longer on very good terms with the past. We can only recover it by reconstructing it in monumental detail with the aid of documents and archives; in other words, what we today call “memory.”<br><br><span>The second reason for this outbreak of memory is of a social nature and is linked to what might be called, by analogy with “acceleration”, the “democratization” of history. This takes the form of a marked emancipatory trend among peoples, ethnic <\/span><span>groups<\/span><span> and even certain classes of individual in the world today; in short, the emergence, over a very short period of time, of all those forms of memory bound up with minority groups for whom rehabilitating their past is part and parcel of reaffirming their identity…<\/span><br><br><span>The explosion of minority memories of this kind has profoundly altered the respective status and the reciprocal nature of history and memory – <\/span><span>or,<\/span><span> to be more precise, has enhanced the very notion of “collective memory”. Unlike history, which has always been in the hands of the public authorities, of scholars and specialised peer groups, memory has acquired all the new privileges and prestige of a popular protest movement.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following best represents the main argument of the passage?<\/span>", "options": ["<span>The world is experiencing an acceleration of history that has left people feeling cut off from the past.<\/span>", "<span>The democratization of history has given rise to diverse memories that affirm the identities of minority groups.<\/span>", "<span>Memory has become a popular protest movement that challenges the authority of history and official versions of the past.<\/span>", "<span>The upsurge in memory is driven by a growing interest in genealogical research and \"roots\" across countries and social groups.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "The passage states that in the last 25 years there is an upsurge in memory as all social groups have leaned back on the past for various reasons. This upsurge is related to the ‘acceleration of history’ and democratization of history. By the former, the author means that unable to cope with the fast-changing world people are disconnected from the past and seek its restoration. They are uncertain of the future&nbsp;<span>and stockpile the past to make sense of themselves. The democratization of history occurs when marginalized groups turn to their&nbsp;<\/span><span>particular history<\/span><span> to reaffirm their lost identity. And finally, the author concludes that “Unlike history, which has always been in the hands of the public authorities, of scholars and specialised peer groups, memory has acquired all the new privileges and prestige of a popular protest movement,” which in nutshell is the main argument of the passage.<\/span>\r<br /><span>Option 3 states the main argument of the passage. Options 1, 2 and 4 are all partially correct but present only aspects of the analysis, but not the main argument.<\/span>\r<br />Hence, [3].", "topic": "Central Idea"}, {"number": 11, "sourceId": "168959793099810", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br>  we have lost”. We are no longer on very good terms with the past. We can only recover it by reconstructing it in monumental detail with the aid of documents and archives; in other words, what we today call “memory.”<br><br><span>The second reason for this outbreak of memory is of a social nature and is linked to what might be called, by analogy with “acceleration”, the “democratization” of history. This takes the form of a marked emancipatory trend among peoples, ethnic <\/span><span>groups<\/span><span> and even certain classes of individual in the world today; in short, the emergence, over a very short period of time, of all those forms of memory bound up with minority groups for whom rehabilitating their past is part and parcel of reaffirming their identity…<\/span><br><br><span>The explosion of minority memories of this kind has profoundly altered the respective status and the reciprocal nature of history and memory – <\/span><span>or,<\/span><span> to be more precise, has enhanced the very notion of “collective memory”. Unlike history, which has always been in the hands of the public authorities, of scholars and specialised peer groups, memory has acquired all the new privileges and prestige of a popular protest movement.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Based on the passage, which of the following provides the most accurate distinction between 'memory' and 'history'?<\/span>", "options": ["<span>Memory is a weaponized past used in protest movements, while history is in the hands of public authorities used for repression.<\/span>", "<span>Memory belongs to the marginalized and the repressed while history is a form of restoration of the past, a form of progress, or a form of revolution.<\/span>", "<span>Memory is a populist and democratized form of remembering the past, while history is more institutionalized and academic in nature.<\/span>", "<span>Memory is the questioning of history and a distancing from the past, while history is the analysis of the past documents and archives.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "Option 1. The passage does not suggest that memory is a weaponized past used in protest movements or that history is in the hands of public authorities used for repression.\r<br />Option 2. While the passage does mention the emergence of all those forms of memory bound up with minority groups for whom rehabilitating their past is part and parcel of reaffirming their identity, it does not state that memory belongs only to the marginalized and the repressed. Furthermore, the passage describes history as having previously been interpreted in one of three ways - as a form of restoration of the past, a form of progress, or a form of revolution - which is different from the description in option 2.\r<br />Option 3 is the correct answer as it accurately captures the difference between memory and history as presented in the passage. The last few lines of the passage state that memory is a populist and democratized form of remembering the past, while history has been more institutionalized and academic in nature. This is supported by various statements in the passage, such as memory being a \"popular protest movement,\" and \"enhanced...collective memory\" being in the hands of minority groups, while history has traditionally been controlled by public authorities, historians, and specialized peer groups.\r<br />Option 4. The passage does not suggest that memory is the questioning of history or a distancing from the past. It states that memory is a response to the distancing from the past that has resulted from the acceleration of history, while history has traditionally been concerned with understanding the past through the analysis of documents and archives.\r<br />Hence, [3].", "topic": "Inference"}, {"number": 12, "sourceId": "168959793099811", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>We are witnessing a world-wide upsurge in memory. Over the last twenty-five years, every country, every social, <\/span><span>ethnic<\/span><span> or family group, has undergone a profound change in the relationship it traditionally enjoyed with the past. This change has taken a variety of forms: criticism of official versions of history and recovery of areas of history previously repressed; demands for signs of a past that had been confiscated or suppressed; growing interest in “roots” and genealogical research; and a growing attachment to what in the English-speaking world is called “heritage.”<\/span><br><br><span>This upsurge in memory intersects, with two major historical phenomena, one temporal and one social. The first concerns what is usually referred to as the “acceleration of history” – an accelerated precipitation of all things into an ever more swiftly retreating past.  Broadly speaking, the future could be interpreted in one of three ways, which themselves determined the image people had of the past. It could be envisaged as a form of restoration of the past, a form of progress, or a form of revolution. Today, we have discarded these three ways of interpreting the past, which made it possible to organize a “history.”<\/span><br><br><span>We are utterly uncertain as to what form the future will take. We do not know what our descendants will need to know about ourselves <\/span><span>in order to<\/span><span> understand their own lives. And this inability to anticipate the future puts us under an obligation to stockpile, as it were, in a pious and somewhat indiscriminate fashion, any visible trace or material sign that might eventually testify to what we are or what we will have become.<\/span><br><br>For the other effect of this “acceleration of history”, symmetrical with that of the future, is to abruptly distance us from the past – we are cut off from it. It has become what an English demographic historian has famously described as “the world we have lost”. We are no longer on very good terms with the past. We can only recover it by reconstructing it in monumental detail with the aid of documents and archives; in other words, what we today call “memory.”<br><br><span>The second reason for this outbreak of memory is of a social nature and is linked to what might be called, by analogy with “acceleration”, the “democratization” of history. This takes the form of a marked emancipatory trend among peoples, ethnic <\/span><span>groups<\/span><span> and even certain classes of individual in the world today; in short, the emergence, over a very short period of time, of all those forms of memory bound up with minority groups for whom rehabilitating their past is part and parcel of reaffirming their identity…<\/span><br><br><span>The explosion of minority memories of this kind has profoundly altered the respective status and the reciprocal nature of history and memory – <\/span><span>or,<\/span><span> to be more precise, has enhanced the very notion of “collective memory”. Unlike history, which has always been in the hands of the public authorities, of scholars and specialised peer groups, memory has acquired all the new privileges and prestige of a popular protest movement.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>\"Unlike history, which has always been in the hands of the public authorities, of scholars and specialised peer groups, memory has acquired all the new privileges and prestige of a popular protest movement?\"<\/span><br><span>In the context of the passage, which one of the following is NOT a possible implication of the statement<\/span><span>,<\/span>", "options": ["<span><\/span>\t<span>History is no longer valued or relevant in modern society because of the emergence of memory as a popular protest movement.<\/span>", "<span>In comparison to history, memory is a more inclusive and accessible way of recollecting the past, with a greater emphasis on democracy and populism.<\/span>", "<span>The emergence of memory has challenged the traditional authority and control of institutions and academic elites over historical narratives.<\/span>", "<span>Memory is being used as a tool to assert marginalized or minority identities and challenge dominant historical narratives.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "Option 1. Not an implication. This option contradicts the author's argument in the passage that \"memory\" and \"history\" are different but still complementary ways of understanding and relating to the past. The author argues that the upsurge in memory is not meant to replace or discredit history, but to complement it and enrich it by bringing in more diverse perspectives, voices, and experiences.\r<br />Option 2 . It is an implication.  Memory has “privileges and prestige of a popular protest movement against the public authorities, specialised peer groups etc.’\r<br />Option 3 It captures one of the possible implications of the statement. In the context of the passage the sentence means option 2.\r<br />Option 4. It is an implication.\r<br />In fact, options 2, 3 and 4 merely rephrase the quoted sentence in different words changing the nuance with details available in the passage.\r<br />Hence, [1].", "topic": "Inference"}, {"number": 13, "sourceId": "168959793099812", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Multinationals have brought two changes to the overall internationalization of capital. First, they have changed its geographic flows. In the days of classic imperialism, as we have seen, the objective of capitalist expansion was focused mainly on gaining access to raw materials or to markets for basic commodities, like textiles. The multinationals have turned away from these basic commodities toward the sorts of high-technology goods in which they are world leaders, such as computers and pharmaceuticals. The result has been a striking shift in the overseas allocation of capital. In 1897 almost half of American overseas capital was invested in plantations, railways, or mining properties. Today only a small fraction of our foreign investment is in those fields. Instead, the bulk of our overseas capital has moved into manufacturing, and three-quarters of the flow of international investment goes to Europe and Canada and other developed capitalist lands. So, too, the great preponderance of French or Japanese or German international investment seeks out locations in the developed world, rather than in the old colonial parts of the globe.<\/span><br><br><span>A second economic consequence of the rise of the multinationals has been their remarkable ability to combine high technology with cheap and untrained <\/span><span>labor<\/span><span>. The incredibly complicated mechanisms that underlie modern economic life, such as computer parts or television subassemblies, can be produced in the Hong <\/span><span>Kongs<\/span><span> and South Koreas and <\/span><span>Thailands<\/span><span> of the world, using scientific machines operated by men and women just off the paddy fields. From the point of view of imperialism, the upshot of this is a perplexing one. The ability to transplant whole production processes into areas of the world that only yesterday were peasant economies has succeeded to an unprecedented degree in exporting the social institutions of capitalism. Just as the factors of production themselves emerged from a precapitalist social setting during the great economic revolution, so in our times a new economic revolution is bringing the market economy into regions that were formerly only passive, not active forces in the world economy. To that extent, modern imperialism has been a great force for the vitalization of capitalism abroad.<\/span><br><br><span>At the same time, the new imperialism has greatly intensified the competitiveness of the system in its developed homelands. This is not only the result of the interpenetration of each other’s markets that we discussed above, but because the manufacturing outposts of the multinationals in the underdeveloped regions can fire artillery barrages of low-cost commodities back into their motherlands. As no nation knows better than the United States, TV sets made in Hong Kong or Taiwan, or automobiles made in South Korea or assembled in Mexico, can easily undersell the same products manufactured in California or the Midwest.<\/span><br><br><span>It is too soon to foretell the consequences of this internationalization and intensification of competition or what may be the outcome of the financial and political crises that have appeared—not surprisingly—in nearly all the Asian “tigers.” What seems beyond doubt is that we have moved in the direction of a global economy in which new world-straddling enterprises coexist uneasily with older national boundaries and prerogatives. It is an ironic ending to our consideration of the problem of imperialism that the movement whose origins <\/span><span>were connected with<\/span><span> alleviating the pressures on capital has ended up by making them worse.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>“It is an ironic ending to our consideration of the problem of imperialism that the movement whose origins were connected with alleviating the pressures on capital has ended up by making them worse.”<\/span><br><span>In the context of the passage, which one of the following is NOT a possible implication of the quoted statement?<\/span>", "options": ["<span><\/span>\t<span>As MNCs operate across borders, they end up undermining national boundaries and prerogatives.<\/span>", "<span>The shift towards high-technology goods by MNCs has resulted in a change in the global economy.<\/span>", "<span>Initial objective of imperialism was to expand capital by gaining access to resources and markets in other countries.<\/span>", "<span>Effects of imperialism and globalization on the world economy have been paradoxical for the economic actors.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "Option 1.  Not a possible implication of the quoted statement. The passage mentions that new world-straddling enterprises coexist uneasily with older national boundaries and prerogatives…To say that they undermine national boundaries is an overstatement.\r<br />Option 2. The quoted statement refers to the shift in the overseas allocation of capital towards manufacturing and away from plantations, railways, or mining properties. This shift has resulted from MNCs' focus on high-technology goods in which they are world leaders. Therefore, this statement is a possible implication of the quoted statement.\r<br />Option 3. The quoted statement refers to the origins of imperialism, which&nbsp;were connected with expanding capital by gaining access to resources and markets in other countries. Therefore, this statement is a possible implication of the quoted statement.\r<br />Option 4. The quoted statement highlights the paradoxical outcome of imperialism, which was intended to alleviate the pressures on capital by expanding it but has ultimately ended up making them worse.  This too is a possible implication of the quoted statement.\r<br />Hence, [1].", "topic": "Inference"}, {"number": 14, "sourceId": "168959793099913", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>Multinationals have brought two changes to the overall internationalization of capital. First, they have changed its geographic flows. In the days of classic imperialism, as we have seen, the objective of capitalist expansion was focused mainly on gaining access to raw materials or to markets for basic commodities, like textiles. The multinationals have turned away from these basic commodities toward the sorts of high-technology goods in which they are world leaders, such as computers and pharmaceuticals. The result has been a striking shift in the overseas allocation of capital. In 1897 almost half of American overseas capital was invested in plantations, railways, or mining properties. Today only a small fraction of our foreign investment is in those fields. Instead, the bulk of our overseas capital has moved into manufacturing, and three-quarters of the flow of international investment goes to Europe and Canada and other developed capitalist lands. So, too, the great preponderance of French or Japanese or German international investment seeks out locations in the developed world, rather than in the old colonial parts of the globe.<\/span><br><br><span>A second economic consequence of the rise of the multinationals has been their remarkable ability to combine high technology with cheap and untrained <\/span><span>labor<\/span><span>. The incredibly complicated mechanisms that underlie modern economic life, such as computer parts or television subassemblies, can be produced in the Hong <\/span><span>Kongs<\/span><span> and South Koreas and <\/span><span>Thailands<\/span><span> of the world, using scientific machines operated by men and women just off the paddy fields. From the point of view of imperialism, the upshot of this is a perplexing one. The ability to transplant whole production processes into areas of the world that only yesterday were peasant economies has succeeded to an unprecedented degree in exporting the social institutions of capitalism. Just as the factors of production themselves emerged from a precapitalist social setting during the great economic revolution, so in our times a new economic revolution is bringing the market economy into regions that were formerly only passive, not active forces in the world economy. To that extent, modern imperialism has been a great force for the vitalization of capitalism
