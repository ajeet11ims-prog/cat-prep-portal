<script type="application/json" id="test-data">{"testNumber": 8, "simcat": 8, "minutes": 40, "questions": [{"number": 1, "sourceId": "16917378828190", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>The Future of Life Institute has garnered thousands of high-profile signatures, including Elon Musk's, in support of a six-month precautionary pause on artificial-intelligence development. The concern is that AI labs are racing to create increasingly powerful systems that no one can predict or control. While control and regulation are central to the issue, it is not clear whose they will be. The historian Yuval Harari predicted that AI <\/span><span>will<\/span><span> result in a stronger class divide within human society, creating a world where those who ride the train of progress will have divine abilities of creation and destruction, while those left behind will face extinction.<\/span>\r<br>\r<br><span>The fear reflected in the AI letter stems from the concern that even those who are on the \"train of progress\" will be unable to steer it. The end of capitalism is a serious threat to those in power, including those who develop, own, and control AI. The only choice left will be between a new form of communism and uncontrollable chaos. The new chatbots, as an example of AI, offer a structure of fetishist disavowal where people know they are not talking to real people but are still able to avoid accompanying risks.<\/span>\r<br>\r<br><span>The AI letter is an attempt to prohibit the impossible, as it is impossible for humans to participate in a post-human future. Instead of focusing on threats to our freedom and dignity, we should consider what freedom means now. Futurist Ray Kurzweil predicts that we will soon be dealing with \"spiritual\" machines that will surpass human intelligence. The \"post-human\" sciences are about surprise and emergent properties that AI models might acquire for themselves.<\/span>\r<br>\r<br><span>Philosopher-engineer Jean-Pierre Dupuy observed that science and technology have undergone an inversion of traditional anthropocentric arrogance. The emerging technology today aims at non-mastery, and the engineer of tomorrow will not be a sorcerer’s apprentice because of his negligence or ignorance, but by choice. Some top scientists believe science has become so risky that it poses the principal threat to humanity's survival, contrary to Descartes's dream of becoming the master of nature. Philosophers who advocate for returning to the mastery of mastery have misunderstood the technology profiled at the horizon.<\/span>\r<br>\r<br><span>Creating \"post-humanity\" threatens to strip humanity, nature, and divinity of their meaning and identity. A fully controlled existence lacks meaning and wonder, while divinity is only meaningful to humans as finite beings. Once we create properties that seem supernatural, gods as we know them will disappear, leaving us to question what, if anything, will be left.<\/span>\r<br>\r<br><span>There is every reason to worry that tech-gnostic visions of a post-human world are ideological fantasies obfuscating the abyss that awaits us. <\/span><span>Needless to say, it<\/span><span> would take more than a six-month pause to ensure that humans do not become irrelevant, and their lives meaningless, in the not-too-distant future.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following DOES NOT describe the post-human society as envisaged in the passage?<\/span>", "options": ["<span>A society in which technology allows humans to transcend their current limitations and become godlike beings.<\/span>", "<span>A society where there is a significant class divide between those who control advanced technology and those who do not.<\/span>", "<span>A society in which humans have lost their sense of identity and divinity due to the creation of supernatural-like properties.<\/span>", "<span>A society where humans have become irrelevant and their lives meaningless in an existence fully controlled by AI.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "Option 1.&nbsp;This option describes a vision of the post-human society where humans have god-like powers due to advanced technology. However, this idea is not discussed in the passage, and there is no indication that technology will make humans god-like beings.\r<br />Option 2. This option accurately describes a potential outcome of the post-human society as envisaged in the passage. The fear is that those who control advanced technology will have significant power and influence over those who do not, leading to a class divide.\r<br />Option 3. This option also accurately describes the potential outcome of the post-human society as envisaged in the passage. The fear is that if technology becomes so advanced that it creates properties that seem supernatural, humans may lose their sense of identity and divinity.\r<br />Option 4. This option accurately describes the potential outcome of the post-human society as envisaged in the passage. The fear is that if AI becomes so advanced that it fully controls human existence, humans may become&nbsp;irrelevant and their lives may become meaningless.\r<br />Hence, [1].", "topic": "Specific Detail Question"}, {"number": 2, "sourceId": "16917378828231", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>The Future of Life Institute has garnered thousands of high-profile signatures, including Elon Musk's, in support of a six-month precautionary pause on artificial-intelligence development. The concern is that AI labs are racing to create increasingly powerful systems that no one can predict or control. While control and regulation are central to the issue, it is not clear whose they will be. The historian Yuval Harari predicted that AI <\/span><span>will<\/span><span> result in a stronger class divide within human society, creating a world where those who ride the train of progress will have divine abilities of creation and destruction, while those left behind will face extinction.<\/span>\r<br>\r<br><span>The fear reflected in the AI letter stems from the concern that even those who are on the \"train of progress\" will be unable to steer it. The end of capitalism is a serious threat to those in power, including those who develop, own, and control AI. The only choice left will be between a new form of communism and uncontrollable chaos. The new chatbots, as an example of AI, offer a structure of fetishist disavowal where people know they are not talking to real people but are still able to avoid accompanying risks.<\/span>\r<br>\r<br><span>The AI letter is an attempt to prohibit the impossible, as it is impossible for humans to participate in a post-human future. Instead of focusing on threats to our freedom and dignity, we should consider what freedom means now. Futurist Ray Kurzweil predicts that we will soon be dealing with \"spiritual\" machines that will surpass human intelligence. The \"post-human\" sciences are about surprise and emergent properties that AI models might acquire for themselves.<\/span>\r<br>\r<br><span>Philosopher-engineer Jean-Pierre Dupuy observed that science and technology have undergone an inversion of traditional anthropocentric arrogance. The emerging technology today aims at non-mastery, and the engineer of tomorrow will not be a sorcerer’s apprentice because of his negligence or ignorance, but by choice. Some top scientists believe science has become so risky that it poses the principal threat to humanity's survival, contrary to Descartes's dream of becoming the master of nature. Philosophers who advocate for returning to the mastery of mastery have misunderstood the technology profiled at the horizon.<\/span>\r<br>\r<br><span>Creating \"post-humanity\" threatens to strip humanity, nature, and divinity of their meaning and identity. A fully controlled existence lacks meaning and wonder, while divinity is only meaningful to humans as finite beings. Once we create properties that seem supernatural, gods as we know them will disappear, leaving us to question what, if anything, will be left.<\/span>\r<br>\r<br><span>There is every reason to worry that tech-gnostic visions of a post-human world are ideological fantasies obfuscating the abyss that awaits us. <\/span><span>Needless to say, it<\/span><span> would take more than a six-month pause to ensure that humans do not become irrelevant, and their lives meaningless, in the not-too-distant future.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>The primary concern behind “the support for a six-month precautionary pause on artificial-intelligence development” is that:<\/span>", "options": ["<span>AI will lead to destabilization of the current economic and political structures and lead to a new form of communism.<\/span>", "<span>AI development is advancing rapidly and without adequate understanding or control, which could result in unintended consequences<\/span><span>.<\/span><span><\/span>", "<span>AI will create a world where those who ride the train of progress will have divine abilities of creation and destruction, while those left behind will face extinction.<\/span>", "<span>AI will lead to the end of capitalism and the power equation which now <\/span><span>favors<\/span><span> the elites will change to their disadvantage.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "They (the letter/signatories) are concerned that AI labs are developing increasingly powerful systems that no one can predict or control.\r<br />The passage states that high-profile signatories to The Future of Life Institute’s letter are concerned that AI labs are racing to create increasingly powerful systems that no one can predict or control. This is reflected in \"The concern is that AI labs are racing to create increasingly powerful systems that no one can predict or control.\" The other options are not the main concern mentioned in the passage. Option 1 is a consequence, not the main concern. Option 3 is a prediction made by historian Yuval Harari, but not the main concern of the signatories to the letter. Option 4 (perhaps) is another potential consequence of AI, but not the main concern of the signatories.\r<br />Hence, [2].", "topic": "Specific Detail Question"}, {"number": 3, "sourceId": "16917378828232", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>The Future of Life Institute has garnered thousands of high-profile signatures, including Elon Musk's, in support of a six-month precautionary pause on artificial-intelligence development. The concern is that AI labs are racing to create increasingly powerful systems that no one can predict or control. While control and regulation are central to the issue, it is not clear whose they will be. The historian Yuval Harari predicted that AI <\/span><span>will<\/span><span> result in a stronger class divide within human society, creating a world where those who ride the train of progress will have divine abilities of creation and destruction, while those left behind will face extinction.<\/span>\r<br>\r<br><span>The fear reflected in the AI letter stems from the concern that even those who are on the \"train of progress\" will be unable to steer it. The end of capitalism is a serious threat to those in power, including those who develop, own, and control AI. The only choice left will be between a new form of communism and uncontrollable chaos. The new chatbots, as an example of AI, offer a structure of fetishist disavowal where people know they are not talking to real people but are still able to avoid accompanying risks.<\/span>\r<br>\r<br><span>The AI letter is an attempt to prohibit the impossible, as it is impossible for humans to participate in a post-human future. Instead of focusing on threats to our freedom and dignity, we should consider what freedom means now. Futurist Ray Kurzweil predicts that we will soon be dealing with \"spiritual\" machines that will surpass human intelligence. The \"post-human\" sciences are about surprise and emergent properties that AI models might acquire for themselves.<\/span>\r<br>\r<br><span>Philosopher-engineer Jean-Pierre Dupuy observed that science and technology have undergone an inversion of traditional anthropocentric arrogance. The emerging technology today aims at non-mastery, and the engineer of tomorrow will not be a sorcerer’s apprentice because of his negligence or ignorance, but by choice. Some top scientists believe science has become so risky that it poses the principal threat to humanity's survival, contrary to Descartes's dream of becoming the master of nature. Philosophers who advocate for returning to the mastery of mastery have misunderstood the technology profiled at the horizon.<\/span>\r<br>\r<br><span>Creating \"post-humanity\" threatens to strip humanity, nature, and divinity of their meaning and identity. A fully controlled existence lacks meaning and wonder, while divinity is only meaningful to humans as finite beings. Once we create properties that seem supernatural, gods as we know them will disappear, leaving us to question what, if anything, will be left.<\/span>\r<br>\r<br><span>There is every reason to worry that tech-gnostic visions of a post-human world are ideological fantasies obfuscating the abyss that awaits us. <\/span><span>Needless to say, it<\/span><span> would take more than a six-month pause to ensure that humans do not become irrelevant, and their lives meaningless, in the not-too-distant future.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>“Philosopher-engineer Jean-Pierre Dupuy observed that science and technology have undergone an inversion of traditional anthropocentric arrogance.”<\/span><br><span>In the context of the passage, which one of the following is NOT a possible implication of the quoted statement?<\/span>", "options": ["<span>Science and technology are no longer solely <\/span><span>centered<\/span><span> around human beings and their mastery over nature.<\/span>", "<span>Science and technology have their own emergent properties and potential risks that cannot be fully understood by humans.<\/span>", "<span>Science and technology may have advanced beyond the point where they can be completely controlled or mastered by their creators.<\/span>", "<span>Tomorrow’s engineers will be preoccupied with developing ways not only to counter the power of technology but also to mitigate its power and risks.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "Option 1.  This option is a possible implication of the quoted statement. Traditionally, humans have seen themselves as the masters of nature and have used science and technology to control and manipulate it for their benefit. However, Dupuy suggests that this anthropocentric view is no longer valid, and that science and technology have taken on a life of their own, separate from human control. This means that we can no longer assume that science and technology are solely&nbsp;centered around humans and our mastery over nature.\r<br />Option 2. This option is also a possible implication of the quoted statement. If science and technology have taken on a life of their own, then they may exhibit emergent properties that are not fully understood by humans. The quoted sentence comes immediately after “The \"post-human\" sciences are about surprise and emergent properties that AI models might acquire for themselves” ,&nbsp;in order to substantiate it.\r<br />Option 3. This option is a possible implication of the quoted statement. If science and technology have taken on a life of their own and exhibit emergent properties, then it may be impossible for humans to completely control or master them. This means that we may have to accept a degree of uncertainty and unpredictability when dealing with advanced technologies like AI.\r<br />Option 4.  Exception. This option is not a possible implication of the quoted statement. While Dupuy suggests that science and technology have taken on a life of their own and exhibit emergent properties, he does not necessarily suggest that engineers should seek to counter the power of technology. “… the engineer of tomorrow will not be a sorcerer’s apprentice because of his negligence or ignorance, but by choice.” The reference to a \"sorcerer's apprentice\" suggests that the engineer will not attempt to completely control technology, but rather work with it in a respectful and cautious manner.\r<br />Hence, [4].", "topic": "Inference"}, {"number": 4, "sourceId": "16917378828233", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b>\r<br>\r<br><span>The Future of Life Institute has garnered thousands of high-profile signatures, including Elon Musk's, in support of a six-month precautionary pause on artificial-intelligence development. The concern is that AI labs are racing to create increasingly powerful systems that no one can predict or control. While control and regulation are central to the issue, it is not clear whose they will be. The historian Yuval Harari predicted that AI <\/span><span>will<\/span><span> result in a stronger class divide within human society, creating a world where those who ride the train of progress will have divine abilities of creation and destruction, while those left behind will face extinction.<\/span>\r<br>\r<br><span>The fear reflected in the AI letter stems from the concern that even those who are on the \"train of progress\" will be unable to steer it. The end of capitalism is a serious threat to those in power, including those who develop, own, and control AI. The only choice left will be between a new form of communism and uncontrollable chaos. The new chatbots, as an example of AI, offer a structure of fetishist disavowal where people know they are not talking to real people but are still able to avoid accompanying risks.<\/span>\r<br>\r<br><span>The AI letter is an attempt to prohibit the impossible, as it is impossible for humans to participate in a post-human future. Instead of focusing on threats to our freedom and dignity, we should consider what freedom means now. Futurist Ray Kurzweil predicts that we will soon be dealing with \"spiritual\" machines that will surpass human intelligence. The \"post-human\" sciences are about surprise and emergent properties that AI models might acquire for themselves.<\/span>\r<br>\r<br><span>Philosopher-engineer Jean-Pierre Dupuy observed that science and technology have undergone an inversion of traditional anthropocentric arrogance. The emerging technology today aims at non-mastery, and the engineer of tomorrow will not be a sorcerer’s apprentice because of his negligence or ignorance, but by choice. Some top scientists believe science has become so risky that it poses the principal threat to humanity's survival, contrary to Descartes's dream of becoming the master of nature. Philosophers who advocate for returning to the mastery of mastery have misunderstood the technology profiled at the horizon.<\/span>\r<br>\r<br><span>Creating \"post-humanity\" threatens to strip humanity, nature, and divinity of their meaning and identity. A fully controlled existence lacks meaning and wonder, while divinity is only meaningful to humans as finite beings. Once we create properties that seem supernatural, gods as we know them will disappear, leaving us to question what, if anything, will be left.<\/span>\r<br>\r<br><span>There is every reason to worry that tech-gnostic visions of a post-human world are ideological fantasies obfuscating the abyss that awaits us. <\/span><span>Needless to say, it<\/span><span> would take more than a six-month pause to ensure that humans do not become irrelevant, and their lives meaningless, in the not-too-distant future.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>In the context of the passage, which of the following statements best describes the main argument presented in the last paragraph of the passage?<\/span>", "options": ["<span>Tech-gnostic visions of a post-human world are necessary for humanity to evolve beyond its current limitations.<\/span>", "<span><\/span>\t<span>The creation of supernatural-like properties will render traditional concepts of divinity and humanity meaningless.<\/span>", "<span>A fully controlled existence lacks meaning and wonder, making it a threat to humanity's identity and purpose.<\/span>", "<span>The fear of becoming irrelevant and meaningless in a post-human world is unfounded and misplaced.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "“There is every reason to worry that tech-gnostic visions of a post-human world are ideological fantasies obfuscating the abyss that awaits us.” This sentence means: Post-human, tech-gnostic visions merely help to hide the dangers (abyss) that await us in a post-human world (a world fully controlled by AI) where AI has acquired supernatural powers.  This is a fantasy which is not based on any empirical evidence.(ideological fantasy). In short, don’t pursue technology blindly!\r<br />Tech-gnosis refers to a worldview that combines technology and spirituality, where technology is seen not just as a tool, but as a mystical force that can reveal hidden truths about the universe and human consciousness.  So, the paragraph argues that a world without&nbsp;wonder and meaning would be devoid of any true purpose, and that the creation of properties that seem supernatural would only further complicate traditional concepts of divinity and humanity. Therefore, option 2 is the correct answer. The argument in the last paragraph&nbsp;has to be seen in the ‘context of the entire passage’ as the question stem suggests. While Yuval Harari suggests that those who control technology will acquire “divine abilities of creation and destruction,’ the third paragraph states that the “\"post-human\" sciences are about surprise and emergent properties that AI models (or ‘spiritual machines’) that might acquire for themselves.” Later in the passage the author suggests that \"post-humanity\" threatens to strip humanity, nature, and divinity of their meaning and identity.” This is tech-gnosticism.&nbsp;\r<br />\r<br />Option 1. Option 1 is incorrect because the passage does not argue that tech-gnostic visions of a post-human world are necessary for humanity to evolve beyond its current limitations. Rather, it expresses concerns about the consequences of such visions.\r<br />Option 2 is the correct answer. The passage argues that once we create properties that seem supernatural, gods as we know them will disappear, leaving us to question what, if anything, will be left. This suggests that the creation of such properties will render traditional concepts of divinity and humanity meaningless. In the context of the passage, especially as a continuation of the paragraph before it, it is the best answer.\r<br />Option 3 is partially correct, but it does not fully capture the argument presented in the last paragraph, with the emphasis of tech-gnosticism. While the passage argues that a fully controlled existence lacks meaning and wonder, it also goes on to argue that the creation of supernatural-like properties is the main concern.\r<br />Option 4 is incorrect because the passage does not argue that the fear of becoming irrelevant and meaningless in a post-human world is unfounded and misplaced. Rather, it acknowledges these concerns and suggests that the creation of supernatural-like properties may exacerbate them.\r<br />\r<br />Hence, [2].", "topic": "Central Idea"}, {"number": 5, "sourceId": "16917378828234", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>One tiny flick of a microscopic cellular hair, known as a cilium, can’t do much on its own. But together, these structures routinely pull off biological marvels within the body. Cilia remove inhaled pathogens from the respiratory tract, carry cerebrospinal fluid across brain cavities, transport eggs from the ovary to the uterus, and drain mucus from the middle ear to the nasal cavity. These tiny, extracellular organelles exert precise microfluidic control over life-sustaining liquids in the body. To better understand how these crucial wonders of nature work, scientists have been trying for years to mimic them.<\/span><br><br><span>Now researchers [from Cornell University] have come close to doing so, creating a <\/span><span>chip covered with artificial cilia<\/span><span> that can precisely control the minuscule flow patterns of fluids… Researchers had previously tried to make artificial cilia that worked by means of pressure, light, electricity and even magnets. But a major hurdle remained: designing extremely tiny actuators—the motion-triggering parts of a machine—that can be controlled individually or in small clusters rather than all at once.<\/span><br><br><span>The Cornell researchers vaulted that hurdle by taking inspiration from some things they learned in their earlier work. In August 2020 Guinness World Records recognized Itai Cohen, a Cornell University physicist and senior author of [this] new <\/span><span>Nature<\/span><span> study, and his team for designing <\/span><span>the world’s smallest walking robot<\/span><span>, a machine that was just a fraction of a <\/span><span>millimeter<\/span><span> wide and could walk on four bendable legs. Much like those legs, the new artificial cilia are made of bendable, <\/span><span>nanometer<\/span><span>-thin film that can respond to electrical control. Each cilium is one-twentieth of a <\/span><span>millimeter<\/span><span> long and 10 <\/span><span>nanometers<\/span><span> thick, with a strip of platinum on one side and a coating of titanium film on the other.<\/span><br><br><span>The key to electrically controlling these artificial cilia comes from their metal makeup. Running a low positive voltage through a cilium triggers a chemical reaction: as a droplet of test fluid flows past, the electrified platinum breaks apart the water molecules within the droplet. This frees up oxygen atoms, which are absorbed into the platinum’s surface. The added oxygen stretches the strip, making it bend in one direction. Once the voltage is reversed, the oxygen is driven out of the platinum—and the cilium returns to its original shape. “<\/span><span>So<\/span><span> by oscillating the voltage back and forth, you can bend and unbend the strip, which will generate waves to drive the movement,” Cohen says. Meanwhile the electrically inert titanium film stabilizes the structure…<\/span><br><br><span>[With] the new technology [imitating] biological structures, […] researchers envision a cilia-covered chip as the basis of a diagnostic device that could test any sample of water, <\/span><span>blood<\/span><span> or urine to find contaminants or markers of disease. A user would place a drop of blood or urine on the chip, and the artificial cilia would carry the sample—along with any chemicals or pathogens within it—from one spot to another, allowing it to mix and react with various testing agents as it moves. Biosensors built into the chip would measure the products of these chemical reactions and then direct the cilia to further manipulate the liquid’s flow, allowing the chip to perform additional tests to confirm the results…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>The first paragraph supports <\/span><span>all of<\/span><span> the following inferences about cilia EXCEPT:<\/span>", "options": ["<span>Cilia move substances across parts of the body.<\/span>", "<span>They manipulate motion of vital fluids in the body.<\/span>", "<span>They transport<\/span><span> <\/span><span>cells from the sperm to the egg.<\/span>", "<span>They expel pathogens away from the cell.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<p><span>Option 1. Inference.&rdquo; Cilia remove inhaled pathogens from the respiratory tract, carry cerebrospinal fluid across brain cavities, transport eggs from the ovary to the uterus, and drain mucus from the middle ear to the nasal cavity. &ldquo;<\/span> <br /><span>Option 2. Inference. &ldquo;microfluidic control over life-sustaining liquids in the body.&rdquo;<\/span> <br /><span>Option 3. Exception. &ldquo;transport eggs from the ovary to the uterus,&rdquo; not sperm to the egg. It is possible that the sperm to the egg is also carried by the motion of cilia on the sperm. <\/span><span>However,<\/span><span> this cannot be inferred from the first paragraph.<\/span> <br /><span>Option 4. Inference. &ldquo;Cilia remove inhaled pathogens from the respiratory tract,&rdquo;<\/span> <br />Hence, [3]. <br /><br /><br /><\/p>", "topic": "Inference"}, {"number": 6, "sourceId": "16917378828245", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>One tiny flick of a microscopic cellular hair, known as a cilium, can’t do much on its own. But together, these structures routinely pull off biological marvels within the body. Cilia remove inhaled pathogens from the respiratory tract, carry cerebrospinal fluid across brain cavities, transport eggs from the ovary to the uterus, and drain mucus from the middle ear to the nasal cavity. These tiny, extracellular organelles exert precise microfluidic control over life-sustaining liquids in the body. To better understand how these crucial wonders of nature work, scientists have been trying for years to mimic them.<\/span><br><br><span>Now researchers [from Cornell University] have come close to doing so, creating a <\/span><span>chip covered with artificial cilia<\/span><span> that can precisely control the minuscule flow patterns of fluids… Researchers had previously tried to make artificial cilia that worked by means of pressure, light, electricity and even magnets. But a major hurdle remained: designing extremely tiny actuators—the motion-triggering parts of a machine—that can be controlled individually or in small clusters rather than all at once.<\/span><br><br><span>The Cornell researchers vaulted that hurdle by taking inspiration from some things they learned in their earlier work. In August 2020 Guinness World Records recognized Itai Cohen, a Cornell University physicist and senior author of [this] new <\/span><span>Nature<\/span><span> study, and his team for designing <\/span><span>the world’s smallest walking robot<\/span><span>, a machine that was just a fraction of a <\/span><span>millimeter<\/span><span> wide and could walk on four bendable legs. Much like those legs, the new artificial cilia are made of bendable, <\/span><span>nanometer<\/span><span>-thin film that can respond to electrical control. Each cilium is one-twentieth of a <\/span><span>millimeter<\/span><span> long and 10 <\/span><span>nanometers<\/span><span> thick, with a strip of platinum on one side and a coating of titanium film on the other.<\/span><br><br><span>The key to electrically controlling these artificial cilia comes from their metal makeup. Running a low positive voltage through a cilium triggers a chemical reaction: as a droplet of test fluid flows past, the electrified platinum breaks apart the water molecules within the droplet. This frees up oxygen atoms, which are absorbed into the platinum’s surface. The added oxygen stretches the strip, making it bend in one direction. Once the voltage is reversed, the oxygen is driven out of the platinum—and the cilium returns to its original shape. “<\/span><span>So<\/span><span> by oscillating the voltage back and forth, you can bend and unbend the strip, which will generate waves to drive the movement,” Cohen says. Meanwhile the electrically inert titanium film stabilizes the structure…<\/span><br><br><span>[With] the new technology [imitating] biological structures, […] researchers envision a cilia-covered chip as the basis of a diagnostic device that could test any sample of water, <\/span><span>blood<\/span><span> or urine to find contaminants or markers of disease. A user would place a drop of blood or urine on the chip, and the artificial cilia would carry the sample—along with any chemicals or pathogens within it—from one spot to another, allowing it to mix and react with various testing agents as it moves. Biosensors built into the chip would measure the products of these chemical reactions and then direct the cilia to further manipulate the liquid’s flow, allowing the chip to perform additional tests to confirm the results…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span>Which of the following best represents the main purpose of the Cornell University research explained in the passage?<\/span>", "options": ["<span>To gain precise microfluidic control over life-sustaining liquids in the body.<\/span>", "<span>To create diagnostic devices that could test samples of water, <\/span><span>blood<\/span><span> or urine.<\/span>", "<span>To electronically control the precise flow of fluids using microfluidic devices.<\/span>", "<span>To understand how biological organisms manipulated fluids at the microscale.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>Refer to the first three paragraphs, which can be summarised as follows: Cilia… exert precise microfluidic control over life-sustaining liquids in the body. To understand how they worked, scientists have been trying for years to mimic them – Artificial cilia that worked by means of pressure, light, electricity and even magnets. Have already been made, but constraints remained. Cornel scientists developed artificial cilia that were bendable,&nbsp;<\/span><span>nanometer<\/span><span>-thin film (cilia) that can respond to electrical control. The&nbsp;<\/span><span>main focus<\/span><span> of the research is to develop a technology that can mimic and electronically control the precise flow of fluids in microfluidic devices, specifically by creating artificial cilia that can be controlled individually or in small clusters. Put together option 3&nbsp;<\/span>can be inferred. Option 2 is only one of the applications mentioned in the last paragraph. Option 4 was already known. Option 1 was the example they used to mimic.\r<br />Hence, [3].", "topic": "Inference"}, {"number": 7, "sourceId": "16917378828246", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>One tiny flick of a microscopic cellular hair, known as a cilium, can’t do much on its own. But together, these structures routinely pull off biological marvels within the body. Cilia remove inhaled pathogens from the respiratory tract, carry cerebrospinal fluid across brain cavities, transport eggs from the ovary to the uterus, and drain mucus from the middle ear to the nasal cavity. These tiny, extracellular organelles exert precise microfluidic control over life-sustaining liquids in the body. To better understand how these crucial wonders of nature work, scientists have been trying for years to mimic them.<\/span><br><br><span>Now researchers [from Cornell University] have come close to doing so, creating a <\/span><span>chip covered with artificial cilia<\/span><span> that can precisely control the minuscule flow patterns of fluids… Researchers had previously tried to make artificial cilia that worked by means of pressure, light, electricity and even magnets. But a major hurdle remained: designing extremely tiny actuators—the motion-triggering parts of a machine—that can be controlled individually or in small clusters rather than all at once.<\/span><br><br><span>The Cornell researchers vaulted that hurdle by taking inspiration from some things they learned in their earlier work. In August 2020 Guinness World Records recognized Itai Cohen, a Cornell University physicist and senior author of [this] new <\/span><span>Nature<\/span><span> study, and his team for designing <\/span><span>the world’s smallest walking robot<\/span><span>, a machine that was just a fraction of a <\/span><span>millimeter<\/span><span> wide and could walk on four bendable legs. Much like those legs, the new artificial cilia are made of bendable, <\/span><span>nanometer<\/span><span>-thin film that can respond to electrical control. Each cilium is one-twentieth of a <\/span><span>millimeter<\/span><span> long and 10 <\/span><span>nanometers<\/span><span> thick, with a strip of platinum on one side and a coating of titanium film on the other.<\/span><br><br><span>The key to electrically controlling these artificial cilia comes from their metal makeup. Running a low positive voltage through a cilium triggers a chemical reaction: as a droplet of test fluid flows past, the electrified platinum breaks apart the water molecules within the droplet. This frees up oxygen atoms, which are absorbed into the platinum’s surface. The added oxygen stretches the strip, making it bend in one direction. Once the voltage is reversed, the oxygen is driven out of the platinum—and the cilium returns to its original shape. “<\/span><span>So<\/span><span> by oscillating the voltage back and forth, you can bend and unbend the strip, which will generate waves to drive the movement,” Cohen says. Meanwhile the electrically inert titanium film stabilizes the structure…<\/span><br><br><span>[With] the new technology [imitating] biological structures, […] researchers envision a cilia-covered chip as the basis of a diagnostic device that could test any sample of water, <\/span><span>blood<\/span><span> or urine to find contaminants or markers of disease. A user would place a drop of blood or urine on the chip, and the artificial cilia would carry the sample—along with any chemicals or pathogens within it—from one spot to another, allowing it to mix and react with various testing agents as it moves. Biosensors built into the chip would measure the products of these chemical reactions and then direct the cilia to further manipulate the liquid’s flow, allowing the chip to perform additional tests to confirm the results…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>According to the passage, the bending and unbending of the artificial cilia is caused by <\/span><span>all of<\/span><span> the following EXCEPT:<\/span>", "options": ["<span><\/span>\t<span>The low positive voltage generated by its contact with the test fluid.<\/span>", "<span>Running a low positive voltage through the metal strip and reversing it.<\/span>", "<span>Its metal makeup of platinum on one side with a titanium film on the other.<\/span>", "<span>A chemical reaction triggered by the artificial cilia’s contact with water.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "<\/span>\t<span>Refer to the fourth paragraph. The next three options summarize the working of the artificial cilia. It is only when a low voltage is run through it that the chemical reaction takes place. The contact with water does not generate any voltage. The strip must be electrified by another source.<\/span>\r<br />Hence, [1].", "topic": "Specific Detail Question"}, {"number": 8, "sourceId": "16917378828247", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span>One tiny flick of a microscopic cellular hair, known as a cilium, can’t do much on its own. But together, these structures routinely pull off biological marvels within the body. Cilia remove inhaled pathogens from the respiratory tract, carry cerebrospinal fluid across brain cavities, transport eggs from the ovary to the uterus, and drain mucus from the middle ear to the nasal cavity. These tiny, extracellular organelles exert precise microfluidic control over life-sustaining liquids in the body. To better understand how these crucial wonders of nature work, scientists have been trying for years to mimic them.<\/span><br><br><span>Now researchers [from Cornell University] have come close to doing so, creating a <\/span><span>chip covered with artificial cilia<\/span><span> that can precisely control the minuscule flow patterns of fluids… Researchers had previously tried to make artificial cilia that worked by means of pressure, light, electricity and even magnets. But a major hurdle remained: designing extremely tiny actuators—the motion-triggering parts of a machine—that can be controlled individually or in small clusters rather than all at once.<\/span><br><br><span>The Cornell researchers vaulted that hurdle by taking inspiration from some things they learned in their earlier work. In August 2020 Guinness World Records recognized Itai Cohen, a Cornell University physicist and senior author of [this] new <\/span><span>Nature<\/span><span> study, and his team for designing <\/span><span>the world’s smallest walking robot<\/span><span>, a machine that was just a fraction of a <\/span><span>millimeter<\/span><span> wide and could walk on four bendable legs. Much like those legs, the new artificial cilia are made of bendable, <\/span><span>nanometer<\/span><span>-thin film that can respond to electrical control. Each cilium is one-twentieth of a <\/span><span>millimeter<\/span><span> long and 10 <\/span><span>nanometers<\/span><span> thick, with a strip of platinum on one side and a coating of titanium film on the other.<\/span><br><br><span>The key to electrically controlling these artificial cilia comes from their metal makeup. Running a low positive voltage through a cilium triggers a chemical reaction: as a droplet of test fluid flows past, the electrified platinum breaks apart the water molecules within the droplet. This frees up oxygen atoms, which are absorbed into the platinum’s surface. The added oxygen stretches the strip, making it bend in one direction. Once the voltage is reversed, the oxygen is driven out of the platinum—and the cilium returns to its original shape. “<\/span><span>So<\/span><span> by oscillating the voltage back and forth, you can bend and unbend the strip, which will generate waves to drive the movement,” Cohen says. Meanwhile the electrically inert titanium film stabilizes the structure…<\/span><br><br><span>[With] the new technology [imitating] biological structures, […] researchers envision a cilia-covered chip as the basis of a diagnostic device that could test any sample of water, <\/span><span>blood<\/span><span> or urine to find contaminants or markers of disease. A user would place a drop of blood or urine on the chip, and the artificial cilia would carry the sample—along with any chemicals or pathogens within it—from one spot to another, allowing it to mix and react with various testing agents as it moves. Biosensors built into the chip would measure the products of these chemical reactions and then direct the cilia to further manipulate the liquid’s flow, allowing the chip to perform additional tests to confirm the results…<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span>Which of the following, if FALSE, could lead to the failure of the diagnostic device mentioned in the last paragraph?<\/span>", "options": ["<span>A cilia-covered chip would not enable field testing that are more efficient than lab-based tests.<\/span>", "<span>Biosensors are enzymes or antibodies that can be incorporated into the cilia-covered chip.<\/span>", "<span>The markers of human diseases can be detected only in laboratories with large equipment.<\/span>", "<span>The fine strips of artificial cilia cannot drive microscopic amounts of fluid in set directions.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<\/span>\t<span>Complex Stem. ‘If false could lead to the failure’ implies:  The answer choice is a feature that is essential for its success – but if falsified it would lead to failure. OR  as they stand three options would lead to its failure OR if&nbsp;<\/span><span>falsified<\/span><span> they can support the device.   This&nbsp;<\/span><span>has to<\/span><span> be clear before looking for the answer.<\/span>\r<br /><span>Option 1. If falsified , the chip will succeed.<\/span>\r<br /><span>Option 2. If falsified the chip fails.<\/span>\r<br /><span>Option 3. If falsified , the chip will succeed.<\/span>\r<br /><span>Option 4. If falsified , the chip will succeed.<\/span>\r<br />Hence, [2].", "topic": "Inference"}, {"number": 9, "sourceId": "16917378828248", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br> <br><span>…The ideas handed down to us can be very hard to shake off, but Joseph Schumpeter, was determined to do so, to make way for his own insights. As Schumpeter wrote in his 1954 <\/span><span>History of Economic Analysis<\/span><span>, ‘In practice we all start our own research from the work of our predecessors, that is, we hardly ever start from scratch. But suppose we did start from scratch, what are the steps we should have to take? Obviously, <\/span><span>in order to<\/span><span> be able to posit to ourselves any problems at all, we should first have to visualize a distinct set of coherent phenomena as a worthwhile object of our analytic effort. In other words, analytic effort is of necessity preceded by a pre-analytic cognitive act that supplies the raw material for the analytic effort.’ …<\/span><br><br><span>…Schumpeter’s concept of pre-analytic vision was inspired by the ideas of sociologist Karl Mannheim whose observation in the late 1920s that, ‘every point of view is particular to a social situation’ led him to popularise the notion that we each have a ‘worldview’ which acts as the lens through which we interpret the world. In the 1960s, Thomas Kuhn turned scientific research upside down by pointing out that ‘scientists work from models acquired through education often without quite knowing or needing to know what characteristics have given these models the status of community paradigms.’ In the 1970s, sociologist Erving Goffmann introduced the concept of ‘framing’ – in the sense that each of us views the world through a mental picture frame – to show that the way we make sense out of our jumble of experience delineates what we can then see.<\/span><br><br><span>Pre-analytic vision. Worldview. Paradigm. Frame. These are cousin concepts. What matters more than the one you choose to use is to realise that you have one in the first place, because then you have the power to question and change it. In economics, that’s an open invitation to look afresh at the mental models we employ in describing and understanding the economy. But it is no easy thing to do… The <\/span>difficulty lies not in the new ideas, but in the old ones which ramify, for those of us brought up as most of us have been, into every corner of our minds.’<br><br><span>The possibility of shaking off old mental models is enticing, but the quest for new ones comes with caveats. First, always remember that ‘the map is not the territory’, as the philosopher Alfred Korzybski put it: every model can only ever be a model, a necessary simplification of the world, and one that should never be mistaken for the real thing. Second, there is no correct pre-analytic vision, true <\/span><span>paradigm<\/span><span> or perfect frame out there to be discovered. In the deft words of the statistician George Box, ‘All models are wrong, but some are useful.’ Rethinking economics is not about finding the correct one (because it doesn’t exist), it’s about choosing or creating one that best serves our purpose – reflecting the context we face, the values we hold, and the aims we have. As humanity’s context, values, and aims continually evolve, so too should the way that we envision the economy.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following is the main point of the passage?<\/span>", "options": ["<span><\/span>\t<span>While one may not be able to  shake off old mental models, rethinking economics involves accepting  old models as simplifications of reality and creating new models that best serve the current context, values and aims.<\/span>", "<span>The way we understand the economy is influenced by our pre-existing mental models, which may be difficult to change, but it is difficult only as long as we lack a vision based on our current context, values and aims.<\/span>", "<span>Economists, sociologists and scientists have explored the concept of \"pre-analytic vision\" and the idea that our perception of the world is shaped by mental frameworks or \"paradigms\" that reflect our context, values and aims.<\/span>", "<span>Rethinking economics is about creating models that best serve our current understanding of the context, values and aims while keeping in mind that old models, though simplified versions of the real world, are all equally wrong.<\/span>\n<span> <\/span>"], "answer": 0, "answerLabel": "A", "solution": "The main argument in the passage is present in the third paragraph. The passage begins with Joseph Schumpeter’s concept of ‘pre-analytic vision’ which is then compared with Karl Mannheim’s ‘worldview’ and Goffman’s ‘framing’. The author then comments “Pre-analytic vision. Worldview. Paradigm … the point is that  that you have one in the first place, because then you have the power to question and change it… The difficulty lies not in the new ideas, but in the old ones which ramify….” The passage then concludes…” Rethinking economics is not about finding the correct one (because it doesn’t exist), it’s about choosing or creating one that best serves our purpose – reflecting the context we face, the values we hold, and the aims we have.” This is best captured by option 1.\r<br />Option 2. ‘Rethinking economy’ – the very purpose of the essay is missing.\r<br />Option 3. The author’s comment is not captured.\r<br />Option 4.  “old models, simplified versions of the real world, are all equally wrong,” misrepresents the last paragraph, among other deficiencies in the option.\r<br />Hence, [1].", "topic": "Central Idea"}, {"number": 10, "sourceId": "16917378828259", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br> <br><span>…The ideas handed down to us can be very hard to shake off, but Joseph Schumpeter, was determined to do so, to make way for his own insights. As Schumpeter wrote in his 1954 <\/span><span>History of Economic Analysis<\/span><span>, ‘In practice we all start our own research from the work of our predecessors, that is, we hardly ever start from scratch. But suppose we did start from scratch, what are the steps we should have to take? Obviously, <\/span><span>in order to<\/span><span> be able to posit to ourselves any problems at all, we should first have to visualize a distinct set of coherent phenomena as a worthwhile object of our analytic effort. In other words, analytic effort is of necessity preceded by a pre-analytic cognitive act that supplies the raw material for the analytic effort.’ …<\/span><br><br><span>…Schumpeter’s concept of pre-analytic vision was inspired by the ideas of sociologist Karl Mannheim whose observation in the late 1920s that, ‘every point of view is particular to a social situation’ led him to popularise the notion that we each have a ‘worldview’ which acts as the lens through which we interpret the world. In the 1960s, Thomas Kuhn turned scientific research upside down by pointing out that ‘scientists work from models acquired through education often without quite knowing or needing to know what characteristics have given these models the status of community paradigms.’ In the 1970s, sociologist Erving Goffmann introduced the concept of ‘framing’ – in the sense that each of us views the world through a mental picture frame – to show that the way we make sense out of our jumble of experience delineates what we can then see.<\/span><br><br><span>Pre-analytic vision. Worldview. Paradigm. Frame. These are cousin concepts. What matters more than the one you choose to use is to realise that you have one in the first place, because then you have the power to question and change it. In economics, that’s an open invitation to look afresh at the mental models we employ in describing and understanding the economy. But it is no easy thing to do… The <\/span>difficulty lies not in the new ideas, but in the old ones which ramify, for those of us brought up as most of us have been, into every corner of our minds.’<br><br><span>The possibility of shaking off old mental models is enticing, but the quest for new ones comes with caveats. First, always remember that ‘the map is not the territory’, as the philosopher Alfred Korzybski put it: every model can only ever be a model, a necessary simplification of the world, and one that should never be mistaken for the real thing. Second, there is no correct pre-analytic vision, true <\/span><span>paradigm<\/span><span> or perfect frame out there to be discovered. In the deft words of the statistician George Box, ‘All models are wrong, but some are useful.’ Rethinking economics is not about finding the correct one (because it doesn’t exist), it’s about choosing or creating one that best serves our purpose – reflecting the context we face, the values we hold, and the aims we have. As humanity’s context, values, and aims continually evolve, so too should the way that we envision the economy.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>All of the following can be inferred from the first paragraph EXCEPT:<\/span>", "options": ["<span><\/span>\t<span>All economic analyses necessarily reflect the researchers’ underlying bias.<\/span>", "<span>A pre-analytic identification of a problem must precede the analytic effort.<\/span>", "<span>The analytical effort must be based on the observation of a real problem.<\/span>", "<span>Most research works merely build on the already existing studies in the field.<\/span>\n<span> <\/span>"], "answer": 0, "answerLabel": "A", "solution": "Option 1. Exception. The first paragraph does not suggest that starting from scratch has not been achieved, It also does not refer to economic analysis per se. – the title of the book is the only reference to economics. The word “all” must also signal caution.\r<br />Option 2.   Not an exception. “… we should first have to visualize a distinct set of coherent phenomena as a worthwhile object of our analytic effort. In other words, analytic effort is of necessity preceded by a pre-analytic cognitive act that supplies the raw material for the analytic effort.’\r<br />Option 3. Not an exception. “Obviously, in order to be able to posit to ourselves any problems at all, we should first have to visualize a distinct set of coherent phenomena as a worthwhile object of our analytic effort.” Simply put this means identifying a problem through observation.\r<br />Option 4. Not an exception. “The ideas handed down to us can be very hard to shake off, but Joseph Schumpeter, was determined to do so, to make way for his own insights. As Schumpeter wrote in his 1954&nbsp;<span>History of Economic Analysis<\/span>, ‘In practice we all start our own research from the work of our predecessors, that is, we  Paradigm. Frame. These are cousin concepts. What matters more than the one you choose to use is to realise that you have one in the first place, because then you have the power to question and change it. In economics, that’s an open invitation to look afresh at the mental models we employ in describing and understanding the economy. But it is no easy thing to do… The <\/span>difficulty lies not in the new ideas, but in the old ones which ramify, for those of us brought up as most of us have been, into every corner of our minds.’<br><br><span>The possibility of shaking off old mental models is enticing, but the quest for new ones comes with caveats. First, always remember that ‘the map is not the territory’, as the philosopher Alfred Korzybski put it: every model can only ever be a model, a necessary simplification of the world, and one that should never be mistaken for the real thing. Second, there is no correct pre-analytic vision, true <\/span><span>paradigm<\/span><span> or perfect frame out there to be discovered. In the deft words of the statistician George Box, ‘All models are wrong, but some are useful.’ Rethinking economics is not about finding the correct one (because it doesn’t exist), it’s about choosing or creating one that best serves our purpose – reflecting the context we face, the values we hold, and the aims we have. As humanity’s context, values, and aims continually evolve, so too should the way that we envision the economy.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>“Pre-analytic vision. Worldview. Paradigm. Frame. These are cousin concepts.”<\/span><br><span>Which one of the following statements best explains the point being made by the author here?<\/span>", "options": ["<span>They refer to the initial understanding of a subject that the researchers’ predecessors had acquired which influences the direction of the research.<\/span>", "<span>They refer to the dominant system of understanding within a particular field based on which the researchers can use to make of the world around them.<\/span>", "<span>Though they are related concepts, their difference will guide the researchers’ questions, methodology, and approach to study a subject matter.<\/span>", "<span>They are the set of assumptions, beliefs, and perspectives that shape the way individuals understand and interpret the world around them.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "\"Pre-analytic vision\" is a term used by Joseph Schumpeter in the passage. It refers to the initial understanding of a subject before it is&nbsp;analyzed. \"Worldview\" is a broader concept that refers to an individual's overall perspective on life and the world. A paradigm is a dominant framework of understanding in a field and a frame is a framework that shapes our understanding. Option 4 puts all these together in one statement.\r<br />Option 1 – reference to ‘predecessors’ make sit incorrect.\r<br />Option 2. Limited to the paradigm alone. It misses the significance of the author’s intent.\r<br />Option 3. – their difference is unimportant.\r<br />Hence, [4].", "topic": "Inference"}, {"number": 12, "sourceId": "169173788282511", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br> <br><span>…The ideas handed down to us can be very hard to shake off, but Joseph Schumpeter, was determined to do so, to make way for his own insights. As Schumpeter wrote in his 1954 <\/span><span>History of Economic Analysis<\/span><span>, ‘In practice we all start our own research from the work of our predecessors, that is, we hardly ever start from scratch. But suppose we did start from scratch, what are the steps we should have to take? Obviously, <\/span><span>in order to<\/span><span> be able to posit to ourselves any problems at all, we should first have to visualize a distinct set of coherent phenomena as a worthwhile object of our analytic effort. In other words, analytic effort is of necessity preceded by a pre-analytic cognitive act that supplies the raw material for the analytic effort.’ …<\/span><br><br><span>…Schumpeter’s concept of pre-analytic vision was inspired by the ideas of sociologist Karl Mannheim whose observation in the late 1920s that, ‘every point of view is particular to a social situation’ led him to popularise the notion that we each have a ‘worldview’ which acts as the lens through which we interpret the world. In the 1960s, Thomas Kuhn turned scientific research upside down by pointing out that ‘scientists work from models acquired through education often without quite knowing or needing to know what characteristics have given these models the status of community paradigms.’ In the 1970s, sociologist Erving Goffmann introduced the concept of ‘framing’ – in the sense that each of us views the world through a mental picture frame – to show that the way we make sense out of our jumble of experience delineates what we can then see.<\/span><br><br><span>Pre-analytic vision. Worldview. Paradigm. Frame. These are cousin concepts. What matters more than the one you choose to use is to realise that you have one in the first place, because then you have the power to question and change it. In economics, that’s an open invitation to look afresh at the mental models we employ in describing and understanding the economy. But it is no easy thing to do… The <\/span>difficulty lies not in the new ideas, but in the old ones which ramify, for those of us brought up as most of us have been, into every corner of our minds.’<br><br><span>The possibility of shaking off old mental models is enticing, but the quest for new ones comes with caveats. First, always remember that ‘the map is not the territory’, as the philosopher Alfred Korzybski put it: every model can only ever be a model, a necessary simplification of the world, and one that should never be mistaken for the real thing. Second, there is no correct pre-analytic vision, true <\/span><span>paradigm<\/span><span> or perfect frame out there to be discovered. In the deft words of the statistician George Box, ‘All models are wrong, but some are useful.’ Rethinking economics is not about finding the correct one (because it doesn’t exist), it’s about choosing or creating one that best serves our purpose – reflecting the context we face, the values we hold, and the aims we have. As humanity’s context, values, and aims continually evolve, so too should the way that we envision the economy.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>In the last paragraph, the author compares mental models to maps for <\/span><span>all of<\/span><span> the following reasons EXCEPT:<\/span>", "options": ["<span>They are tools used to represent and understand complex systems.<\/span>", "<span>They are all necessarily wrong and the correct ones do not exist.<\/span>", "<span>They are used to highlight certain features while disregarding others.<\/span>", "<span>They are simplifications of reality and are subject to errors and uncertainty.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "“First, always remember that ‘the map is not the territory’, as the philosopher Alfred Korzybski put it: every model can only ever be a model, a necessary simplification of the world, and one that should never be mistaken for the real thing.”\r<br />Every model can ever be a model – means that they represent something else (option 1) ‘Complex systems’ in the option can represent the reality or the territory that they represent. The map is not the territory – means they highlight some feature and ignore the rest. ‘necessary simplification of the world’- (option 4) – subject to errors and uncertainty is justifiable as there are ‘caveats.’\r<br />You&nbsp;have to notice that the comparison of maps and mental models stops after the first sentence. The rest of the paragraph is only about “pre-analytic vision, true paradigm or perfect frame”. All models are wrong&nbsp;refers specifically to mental models and not maps. We should not take the comparison farther than needed or intended. Correct maps may exist.\r<br />Hence, [2].", "topic": "Application Question"}, {"number": 13, "sourceId": "169173788282512", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span> …Man is not an ant, conveniently equipped with an inborn pattern of social instincts. On the contrary, he seems to be strongly endowed with a <\/span><span>self-centered<\/span><span> nature. If his relatively weak physique forces him to seek cooperation, his inner drives constantly threaten to disrupt his social working partnerships.<\/span><br><br><span>In primitive society, the struggle between self-centeredness and cooperation is taken care of by the environment; when the <\/span><span>specter<\/span><span> of starvation can look a community in the face—as with the Eskimos—the pure need to secure its own existence pushes society to the cooperative completion of its daily <\/span><span>labors<\/span><span>. Under less stringent conditions, anthropologists tell us, men and women perform their regular tasks under the powerful guidance of universally accepted norms of kinship and reciprocity… But in an advanced community […] when men and women no longer work shoulder to shoulder in tasks directly related to survival, the perpetuation of the human animal becomes a remarkable social feat.<\/span><br><br><span>So remarkable, in fact, that society’s existence hangs by a hair. A modern community is at the mercy of a thousand dangers: if its farmers should fail to plant enough crops; if its railroad men should take it into their heads to become bookkeepers; if too few should offer their services as miners, <\/span><span>puddlers<\/span><span> of steel,  and candidates for engineering degrees, industrial life would soon become hopelessly disorganized. Every day the community faces the possibility of breakdown from sheer human unpredictability.<\/span><br><br><span>Over the centuries man has found only three ways of guarding against this calamity. He has ensured his continuity by organizing his society around tradition, by handing down the varied and necessary tasks from generation to generation according to custom and usage.<\/span><br><br><span>Or society can solve the problem differently. It can use the whip of authoritarian rule to see that its tasks get done. The pyramids of ancient Egypt did not get built because some enterprising contractor took it into his head to build them, nor did the <\/span><span>Five Year<\/span><span> Plans of the Soviet Union get carried out because they happened to accord with hand-me-down custom or individual self-interest. Both Russia and Egypt were Command societies; they ensured their <\/span><span>economic <\/span><span>survival by the edicts of one authority…<\/span><br><br><span>For countless centuries man dealt with the problem of survival according to one or the other of these solutions. It never gave rise to that special field of study called “economics.” For the economists waited upon the invention of a third solution to the problem of survival - the development of an astonishing arrangement in which society assured its own continuance by allowing <\/span><span>each individual<\/span><span> to do exactly as he saw fit, provided he followed a central guiding rule. The arrangement was called the “market system,” and the rule was deceptively simple: each should do what was to his best monetary advantage. In the market system the lure of gain steered the great majority to his (or her) task. And yet, although each was free to go wherever his acquisitive nose directed him, the interplay of one person against another resulted in the necessary tasks of society getting done. It was this paradoxical, subtle, and difficult solution to the problem of survival that called forth the economists.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>Which of the following statements best represents the essence of the passage?<\/span>", "options": ["<span>Large, cooperative societies that characterize modern humans became possible only with the emergence of “economics” and the “market system”.<\/span>", "<span>The perpetuation of the human animal is a social feat achieved through cooperative <\/span><span>behavior<\/span><span> that was borne out of tradition, authoritarian rule, or economics.<\/span>", "<span>Large human societies result from the cooperative tactics of the human animal for survival rather than from an inborn pattern of social instincts.<\/span>", "<span>Economics and the market system have roots in tradition and authoritarian rule which arose from man’s fundamental desire to cooperate and form large societies.<\/span>"], "answer": 2, "answerLabel": "C", "solution": "The passage begins with an assertion that man is not endowed with inborn social instincts like&nbsp;ants but they are inherently&nbsp;self-centered. Harsh climate pushed society to the cooperative completion of its daily&nbsp;labors in primitive societies. Later cooperation was forced by tradition and then by authoritarian rule. Economics and market system emerged later in modern societies in which could accommodate self-centeredness along with societal goals. Briefly, man is not inherently&nbsp;social but societies formed for only survival. This main idea is captured by option 3.\r<br />Option 1. Incorrect. ‘only with the emergence of economics’ etc. is misleading.\r<br />Option 2. Incorrect. The idea that man is not inherently&nbsp;socialis not highlighted.\r<br />Option 3. Correct. As above.\r<br />Option 4.   Incorrect. “fundamental desire to cooperate and form large societies,” is incorrect as&nbsp;th desire is not fundamental but situational.\r<br />Hence, [3].", "topic": "Central Idea"}, {"number": 14, "sourceId": "169173788282713", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span> …Man is not an ant, conveniently equipped with an inborn pattern of social instincts. On the contrary, he seems to be strongly endowed with a <\/span><span>self-centered<\/span><span> nature. If his relatively weak physique forces him to seek cooperation, his inner drives constantly threaten to disrupt his social working partnerships.<\/span><br><br><span>In primitive society, the struggle between self-centeredness and cooperation is taken care of by the environment; when the <\/span><span>specter<\/span><span> of starvation can look a community in the face—as with the Eskimos—the pure need to secure its own existence pushes society to the cooperative completion of its daily <\/span><span>labors<\/span><span>. Under less stringent conditions, anthropologists tell us, men and women perform their regular tasks under the powerful guidance of universally accepted norms of kinship and reciprocity… But in an advanced community […] when men and women no longer work shoulder to shoulder in tasks directly related to survival, the perpetuation of the human animal becomes a remarkable social feat.<\/span><br><br><span>So remarkable, in fact, that society’s existence hangs by a hair. A modern community is at the mercy of a thousand dangers: if its farmers should fail to plant enough crops; if its railroad men should take it into their heads to become bookkeepers; if too few should offer their services as miners, <\/span><span>puddlers<\/span><span> of steel,  and candidates for engineering degrees, industrial life would soon become hopelessly disorganized. Every day the community faces the possibility of breakdown from sheer human unpredictability.<\/span><br><br><span>Over the centuries man has found only three ways of guarding against this calamity. He has ensured his continuity by
