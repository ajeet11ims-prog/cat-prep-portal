ity…<\/span><br><br><span>For countless centuries man dealt with the problem of survival according to one or the other of these solutions. It never gave rise to that special field of study called “economics.” For the economists waited upon the invention of a third solution to the problem of survival - the development of an astonishing arrangement in which society assured its own continuance by allowing <\/span><span>each individual<\/span><span> to do exactly as he saw fit, provided he followed a central guiding rule. The arrangement was called the “market system,” and the rule was deceptively simple: each should do what was to his best monetary advantage. In the market system the lure of gain steered the great majority to his (or her) task. And yet, although each was free to go wherever his acquisitive nose directed him, the interplay of one person against another resulted in the necessary tasks of society getting done. It was this paradoxical, subtle, and difficult solution to the problem of survival that called forth the economists.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>All of the following arguments are made in the passage EXCEPT:<\/span>", "options": ["<span><\/span>\t<span>Social instincts form the basis of our cooperative strategies.<\/span>", "<span>Market system reconciles purely selfish <\/span><span>behavior<\/span><span> with social interest.<\/span>", "<span>Advanced societies risk obliteration in the face of human unpredictability.<\/span>", "<span>Our social <\/span><span>behaviors<\/span><span> come into play when it is a question of our survival.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "Option 1: Exception. This argument is made in the passage. The first paragraph states that we are not born with social instincts like the ant is.  We cooperate based on external reasons – the need for survival, harsh environment,&nbsp;tradition and authority. Option 1 implies social instincts are inborn. Option 1 is the answer.\r<br />Option 2: Not an exception. The market system allowed individuals to work for their own benefit. So, this argument has been made in the passage. Option 2 is not the answer.\r<br />Option 3: Not an exception. This argument has been made in ‘Every day the community faces the possibility of breakdown from sheer human unpredictability.’ Option 3 is not the answer.\r<br />Option 4: Not an exception. Option 4 states almost the opposite of option 1 – that our cooperative strategies (behavior) arise out of the survival instinct. This is the main argument in the passage.\r<br />Hence, [1].", "topic": "Inference"}, {"number": 16, "sourceId": "169173788282715", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br><span> …Man is not an ant, conveniently equipped with an inborn pattern of social instincts. On the contrary, he seems to be strongly endowed with a <\/span><span>self-centered<\/span><span> nature. If his relatively weak physique forces him to seek cooperation, his inner drives constantly threaten to disrupt his social working partnerships.<\/span><br><br><span>In primitive society, the struggle between self-centeredness and cooperation is taken care of by the environment; when the <\/span><span>specter<\/span><span> of starvation can look a community in the face—as with the Eskimos—the pure need to secure its own existence pushes society to the cooperative completion of its daily <\/span><span>labors<\/span><span>. Under less stringent conditions, anthropologists tell us, men and women perform their regular tasks under the powerful guidance of universally accepted norms of kinship and reciprocity… But in an advanced community […] when men and women no longer work shoulder to shoulder in tasks directly related to survival, the perpetuation of the human animal becomes a remarkable social feat.<\/span><br><br><span>So remarkable, in fact, that society’s existence hangs by a hair. A modern community is at the mercy of a thousand dangers: if its farmers should fail to plant enough crops; if its railroad men should take it into their heads to become bookkeepers; if too few should offer their services as miners, <\/span><span>puddlers<\/span><span> of steel,  and candidates for engineering degrees, industrial life would soon become hopelessly disorganized. Every day the community faces the possibility of breakdown from sheer human unpredictability.<\/span><br><br><span>Over the centuries man has found only three ways of guarding against this calamity. He has ensured his continuity by organizing his society around tradition, by handing down the varied and necessary tasks from generation to generation according to custom and usage.<\/span><br><br><span>Or society can solve the problem differently. It can use the whip of authoritarian rule to see that its tasks get done. The pyramids of ancient Egypt did not get built because some enterprising contractor took it into his head to build them, nor did the <\/span><span>Five Year<\/span><span> Plans of the Soviet Union get carried out because they happened to accord with hand-me-down custom or individual self-interest. Both Russia and Egypt were Command societies; they ensured their <\/span><span>economic <\/span><span>survival by the edicts of one authority…<\/span><br><br><span>For countless centuries man dealt with the problem of survival according to one or the other of these solutions. It never gave rise to that special field of study called “economics.” For the economists waited upon the invention of a third solution to the problem of survival - the development of an astonishing arrangement in which society assured its own continuance by allowing <\/span><span>each individual<\/span><span> to do exactly as he saw fit, provided he followed a central guiding rule. The arrangement was called the “market system,” and the rule was deceptively simple: each should do what was to his best monetary advantage. In the market system the lure of gain steered the great majority to his (or her) task. And yet, although each was free to go wherever his acquisitive nose directed him, the interplay of one person against another resulted in the necessary tasks of society getting done. It was this paradoxical, subtle, and difficult solution to the problem of survival that called forth the economists.<\/span>", "passageTitle": "Reading Comprehension Passage", "question": "<span><\/span>\t<span>“It was this paradoxical, subtle, and difficult solution to the problem of survival that called forth the economists.”<\/span><br><span>Which one of the following statements best explains this quote, in the context of the passage?<\/span>", "options": ["<span><\/span>\t<span>The market system which ensured the continuation of society was far more complex than traditional and command systems and demanded the attention of experts.<\/span>", "<span>The market system and the central guiding rule of pursuing one's own monetary advantage created the need for economists to study and understand this new approach.<\/span>", "<span>The market system \"called forth\" the economists, as it presented a new and complex area of study called “economics” that required their expertise and attention.<\/span>", "<span>Economists became necessary in the market system as individuals were free to pursue their own monetary gain, but it resulted in the necessary tasks of society getting done.<\/span>"], "answer": 0, "answerLabel": "A", "solution": "The paradoxical and subtle problem is the idea that in a market system, individuals are free to pursue their own self-interest and monetary gain, but this results in the necessary tasks of society getting done. It is a different approach to organizing economic activity and ensuring the continuation of society compared to other solutions that have been used throughout history, such as command systems or traditional systems. The passage says \"called forth the economists\" because the development of the market system and the central guiding rule of pursuing one's own monetary advantage created a need for a group of people to study and understand this new approach to organizing economic activity. These people, known as economists, dedicated themselves to&nbsp;analyzing and understanding the market system and how it operates. In this sense, the market system \"called forth\" the economists, as it presented a new and complex area of study that required the expertise and attention of these specialized researchers and analysts.\r<br />Option 1 summarizes this. The other three options do not contain the main argument of the passage which is about survival and continuation of society.\r<br />Hence, [1].", "topic": "Application Question"}, {"number": 17, "sourceId": "169173788282716", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br> <br><span>1.<\/span>\t<span>Agape meant unconditional love, unaffected by the vicissitudes of existence.<\/span><br>2.\t<span>In early Christianity, agape was interpreted as the love that God has for humans, and the reciprocal love that humans have for God.<\/span><br>3.\t<span>Over time the meaning of agape was extended to encompass the sense of compassion and empathy which binds together, or ought to bind together, all of humanity.<\/span><br>4.\t<span>The ancient Greeks used the term agape to denote the ‘highest form of love’, and distinguished it from philia, brotherly love.<\/span><br><br><span>", "options": [], "answer": "4213", "answerLabel": "4213", "solution": "Sentence 1. What agape (ah-ga-pay) meant. Possible as a starter, though somewhat abrupt start.\r<br />Sentence 2.  What agape meant in early Christianity. The interpretation can come only after the technical meaning is suggested.\r<br />Sentence 3. Could be directly after 2 or, later after 2 because of ‘over time.’ Also, good for a conclusion.\r<br />Sentence 4. The starter. Chronologically and logically.\r<br />Sentence 4 starts the paragraph. 4 can be followed by 3 or by 2 . 4-1 is not a possibility as 1 does not link well to the specific meaning attached to the specific meaning in 4 – highest love and unconditional love. 4-3 vs. 4-2 requires some deliberation. Placing 1 is a problem but only as long as you try to link 2 and 1. Link 3 and 1 as 1-3.&nbsp;So we get a paragraph that states - What agape meant for the ancient Greeks – what early Christianity&nbsp;<span>interpreted<\/span> it as – what agape meant (perhaps without these specific connotations) and what meaning it got over time. Otherwise, you can’t place 1.  4213 gives a good conclusion to the paragraph. Any other sequence appears inferior to 4213 as no other sentence  (2 or 1) can properly conclude the paragraph.\r<br />Therefore, the required answer is 4213.", "topic": "Jumbled Paragraphs"}, {"number": 18, "sourceId": "169173788283317", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br><span>1.<\/span>\t<span>When using balance-of-payments statistics, it is important to understand their basic concepts.<\/span><br>2.\t<span>To be more specific, some authorities use the expression ‘merchandise balance,’ which refers to trade in goods and excludes services and other international payments.<\/span><br>3.\t<span>These are often referred to as the balance of trade, but the expression has been used in a variety of ways.<\/span><br>4.\t<span>The balance of payments includes, among other things, payments for goods and services between the residents of one country and the residents of foreign nations.<\/span><br><br><span>", "options": [], "answer": "1432", "answerLabel": "1432", "solution": "Sentence 1. Good for the starter.\r<br />Sentence 2. ‘To be more specific…”raises the question about what? Cannot be the starter- must link to some other sentence.\r<br />Sentence 3. “these are often referred to” … “these’ is clue. Must refer to some specific details. Does not link well with 1. Possible to link to 2, as 3-2.\r<br />Sentence 4. Explanation of balance of payments – what it includes. Links well with 1 as 1-4.\r<br />1-4 is a mandatory pair. 3-2 is another pair. 1432 makes a good sequence.\r<br />Therefore, the required answer is 1432.", "topic": "Jumbled Paragraphs"}, {"number": 19, "sourceId": "169173788283418", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><span>1.<\/span>\t<span>In recent decades the concept has been broadened in recognition of the strategic role of land and agriculture in development.<\/span><br>2.\t<span>It also deals with the state of technology, or with any combination of these factors, as shown by modern reform movements, regardless of the political or ideological orientation of the reformers.<\/span><br>3.\t<span>Historically, land reform meant reform of the tenure system or redistribution of the land ownership rights.<\/span><br>4.\t<span>Land reform has therefore become synonymous with agrarian reform or a rapid improvement of the agrarian structure, including the pattern of cultivation and farm organization, the institutions of rural credit, marketing, and education.<\/span><br><br><span>", "options": [], "answer": "3142", "answerLabel": "3142", "solution": "Sentence 1. “the concept has been broadened…” refers to a concept mentioned elsewhere.\r<br />Sentence 2. “it also deals with …” may refer to the same concept as in 1.\r<br />Sentence 3. Good for the starter. ‘land reform’ is most likely the concept in 2 and 1. ‘Historically’ could continue to ‘in recent times’ making 3-1 a mandatory pair. Also, ‘the concept’ is ‘land reform’.\r<br />Sentence 4. “therefore become synonymous” could well be a conclusion.&nbsp;And, “with any combination of these factors” can refer to factors in 2. 2-4 and 4-2 both become possible.\r<br />3-1 begins the paragraph. Since ‘combination of these factors’ in 2 will not be logical after 1, 312 is not possible, but 3142 is coherent.\r<br />Therefore, the required answer is 3142.\r<br /><span><b>&nbsp;<\/b><\/span>", "topic": "Jumbled Paragraphs"}, {"number": 20, "sourceId": "169173788283519", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><span><b>Sentence:<\/b><\/span><span> Even after recognizing a technology’s transformative potential, the shape of the transformation tends to surprise us.<\/span><br><span><b>Paragraph:<\/b><\/span><span> There is no doubt that AI poses a daunting set of operational, ethical, and regulatory challenges. And addressing them will be far from straightforward. _____1_____. Although AI development <\/span><span>dates back to<\/span><span> the 1950s, the technology’s contours and likely impact remain hazy. Of course, recent breakthroughs – from the almost chillingly human-like text produced by OpenAI’s ChatGPT to applications that may shave years off the drug-discovery process – shed light on some dimensions of AI’s immense potential. _____2_____. But it remains impossible to predict all the ways AI will reshape human lives and civilization. This uncertainty is nothing new.  _____3_____. Social media, for example, was initially touted as an innovation that would strengthen democracy but has done far more to destabilize it by facilitating the spread of disinformation. _____4_____.<\/span>", "options": ["<span>Option 1<\/span>", "<span>Option 2<\/span>", "<span>Option 3<\/span>", "<span>Option 4<\/span>"], "answer": 2, "answerLabel": "C", "solution": "Since the key sentence states ‘even after recognizing a technology’s potential’ which is general and points even before it, it would be merely  an interruption to the text if placed in blank 1.&nbsp;Blank 2 does not indicate  a connector is needed between the sentences. This uncertainty mentioned before blank 3 is explained by the key sentence in a general way about all technologies. Hence it fits in blank 3.  Blank 4 too can accommodate the key sentence.&nbsp;However a conclusion is not mandatory after 4. The key sentence helps the transition between the sentences before and after it in blank 3.\r<br />Hence, [3].<span><b>&nbsp;<\/b><\/span>", "topic": "Paragraph Completion"}, {"number": 21, "sourceId": "169173788283620", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><span><b>Sentence:<\/b><\/span><span> These same forces are confronting banking and financial services.<\/span><br><span><b>Paragraph:<\/b><\/span><span>  Without Uber, would many taxi services have developed their own ride-hailing apps or started accepting credit cards when they did? . _____1_____. In static industries with little competition, it takes new competitors and technologies to drive change. And, if managed well, this change need not even threaten incumbents, because they can adopt the new technologies and business models to keep pace with what consumers have come to expect from the new entrants. . _____2_____.  Just as Uber and Lyft built a new model for on-demand consumer mobility, the emerging world of blockchain-based financial services has propelled mobile device-centric banking and payments as well as software-powered capital markets. . _____3_____. While mobile and electronic banking have been around for a while, the emergence of crypto is enabling new levels of user control and access with little more than a personal digital wallet.  _____4_____.<\/span>", "options": ["<span>Option 1<\/span>", "<span>Option 2<\/span>", "<span>Option 3<\/span>", "<span>Option 4<\/span>"], "answer": 1, "answerLabel": "B", "solution": "The key sentence explains the new forces confronting the banking and financial services. the word ‘these’ signals that the sentence before it would explain or name the ‘forces’. Blank 1 is superfluous. No connector is needed. Blank 2 can take the key sentence. The key sentence acts as a link between the sentences before and after blank 2 as a general transition to banking and financial sector from cab hailing services. Blanks 3 and 4 are superfluous.\r<br />Hence, [2].", "topic": "Paragraph Completion"}, {"number": 22, "sourceId": "169173788283821", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br><span>Although the public relations industry is a recent phenomenon, the art of influencing opinion has a long history, dating in fact to the days of ancient Athens. Aristotle's Rhetoric remains one of the most insightful books ever written on the subject. Aristotle argues that rhetoric is an \"art\" as opposed to the sciences, which are governed by logic. The sciences deal with measurable quantities, facts, and principles of proof based on propositions which can <\/span><span>definitely be<\/span><span> <\/span><span>labeled<\/span><span> \"true\" or \"false.\" In social life, however, people are often confronted with situations in which many of the facts are unknown and unknowable. Scientific logic is incapable of evaluating statements whose degree of truth can only be approximated using concepts like \"maybe,\" \"probably,\" or \"probably not.\" Instead of logic, therefore, people turn to rhetoric, the art of communication and persuasion.<\/span>", "options": ["<span>In social life, people turn to rhetoric, the art of communication and persuasion, when facts are unknown and unknowable, rather than to sciences that deal with facts, proof, and logic.<\/span>", "<span>Aristotle argues that rhetoric is an art of communication and persuasion where facts are often unknown and unknowable, unlike the sciences which are governed by logic.<\/span>", "<span>Public relations industry has roots in rhetoric outlined by Aristotle as the art of persuasion in social situations where facts are unknown and unknowable, instead of logic.<\/span>", "<span>Rhetoric, according to Aristotle, is an art of persuasion and communication in social situations where facts are uncertain and it differs from the sciences governed by facts and logic.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<p><strong>Points:<\/strong> <br /><span>&middot;<\/span><strong>&nbsp;<\/strong> The public relations industry is a recent phenomenon. <br /><span>&middot;<\/span><strong>&nbsp;<\/strong> Aristotle explains Rhetoric as an art as opposed to the sciences. <br /><span>&middot;<\/span><strong>&nbsp;<\/strong> Sciences deal with facts, proof, and logic. <br /><span>&middot;<\/span><strong>&nbsp;<\/strong> Scientific logic is incapable of evaluating social situations which involves unknown and unknowable facts. <br /><span>&middot;<\/span><strong>&nbsp;<\/strong> So, people turn to rhetoric, the art of communication and persuasion. <br />Option 1. It seems to say that people turn to rhetoric only when facts are unknown. <br />Option 2. Social life and situations are missing. <br />Option 3. &lsquo;Public relations industry has roots in rhetoric outlined by Aristotle&hellip;&rsquo; is misleading. <br />Option 4. Correct. The best precis of the paragraph. <br />Hence, [4].<\/p>", "topic": "Summary"}, {"number": 23, "sourceId": "169173788283922", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br><span>It is worth noting that in most past and present societies, “repression” of private feelings has often been regarded as a social virtue. From a historical perspective, the burden of proof rests on those who believe that being openly expressive makes people better and healthier. That view has become a dogma of contemporary American popular culture, but in most cultures—including, until quite recently, our own—reticence and stoicism are regarded as commendable, while the free expression of emotions is often seen as self-centred and immature. These reform-minded experts should seriously consider the possibility that American children may in fact need more, not less, self-control and less, not more, self-involvement.<\/span>", "options": ["<span>Contemporary American culture which views open expression as better and healthier must consider if American children need more self-control and less self-involvement.<\/span>", "<span>It has been traditionally viewed as virtuous to repress emotions, but contemporary American children need more self-control and less self-involvement.<\/span>", "<span>Modern American popular culture that emphasizes open expression is questionable, as historically, repression of private feelings was viewed as a positive trait.<\/span>", "<span>American culture, which promotes open expression instead of traditionally regarded virtue of reticence and stoicism, must consider if American children need more self-control.<\/span>"], "answer": 3, "answerLabel": "D", "solution": "<p><strong>Points:<\/strong> <br /><span>&middot;<\/span>&nbsp; \"repression\" of private feelings regarded as a social virtue. <br /><span>&middot;<\/span><strong>&nbsp;<\/strong> belief that openly expressive makes people better and healthier. <br /><span>&middot;<\/span><strong>&nbsp;<\/strong> this is a dogma in American popular culture. <br /><span>&middot;<\/span><strong>&nbsp;<\/strong> reticence and stoicism regarded as commendable. <br /><span>&middot;<\/span><strong>&nbsp;<\/strong> American children may need more self-control and less self-involvement should be considered. <br />Option 1. Traditional view is not present. <br />Option 2.&nbsp;Similar to 1 <br />Option 3. &lsquo;questionable&rsquo; is problematic. <br />Option 4. Correct. <br />Hence, [4].<\/p>", "topic": "Summary"}, {"number": 24, "sourceId": "169173788284023", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<p><strong>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/strong><br /><br /><span>The perception of a news show as a stylized dramatic performance whose content has been staged largely to entertain is reinforced by the fact that the average length of any story is forty-five seconds. While brevity does not always suggest triviality, in this case it clearly does. It is simply not possible to convey a sense of seriousness about any event if its implications are exhausted in less than one minute's time. In fact, it is <\/span><span>quite obvious<\/span><span> that TV news has no intention of suggesting that any story has any implications, for that would require viewers to continue to think about it when it is done and therefore obstruct their attending to the next story that waits, pa<\/span><span>nting in the wings.<\/span><\/p>", "options": ["<span>TV news stories are made so brief and trivial that they prevent any serious viewer reflection and merely want viewers to move on to the next story in less than a minute.<\/span>", "<span>TV news is staged performance for entertainment as stories are made brief and trivial to prevent viewer reflection and pressure viewers to move on to the next story.<\/span>", "<span>TV news is perceived as entertainment due to its short story lengths and lack of emphasis on serious implications, preventing viewers from thinking critically.<\/span>", "<span>TV news is a performance with staged content, stories are brief and trivial, bereft of serious implications encouraging viewers to move on to the next story.<\/span>"], "answer": 1, "answerLabel": "B", "solution": "<p><strong>Points:<\/strong> <br /><span>&middot;<\/span><strong>&nbsp;<\/strong> News show perception as a stylized dramatic performance. <br /><span>&middot;<\/span><strong>&nbsp;<\/strong> Content staged for entertainment. <br /><span>&middot;<\/span> Average story length is 45 seconds. <br /><span>&middot;<\/span><strong>&nbsp;<\/strong> Brevity implies triviality. <br /><span>&middot;<\/span><strong>&nbsp;<\/strong> Inability to convey seriousness in such short time. <br /><span>&middot;<\/span> TV news avoids suggesting story implications. <br /><span>&middot;<\/span><strong>&nbsp;<\/strong> Intention to prevent viewers from thinking about the story. <br /><span>&middot;<\/span><strong>&nbsp;<\/strong> Prioritization of moving to the next story. <br /><br />Option 1. entertainment factor not included. <br />Option 2 . Correct. <br />Option 3. Loses out to 2 &ndash; Crucial element content being intentionally staged for entertainment is missing; moving on to the next story not mentioned. <br />Option 4. Loses out to 2. Entertainment factor is not included. &lsquo;encouraging&rsquo; does not bring out the deliberateness (&lsquo;no intention of suggesting&rsquo;). <br />Hence, [2].<\/p>", "topic": "Summary"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;
function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
