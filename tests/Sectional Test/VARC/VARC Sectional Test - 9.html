<script type="application/json" id="test-data">{"testNumber": 9, "simcat": 9, "minutes": 40, "questions": [{"number": 1, "sourceId": "16920183774340", "type": "mcq", "passage": "<p><strong>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/strong> <br /><br />Inclusive economic and political institutions do not emerge by themselves. They are often the outcome of significant conflict between elites resisting economic growth and political change and those wishing to limit the economic and political power of existing elites. Inclusive institutions emerge during critical junctures, when a series of factors weaken the hold of the elites in power, make their opponents stronger, and create incentives for the formation of a pluralistic society. The outcome of political conflict is never certain, and even if in hindsight we see many historical events as inevitable, the path of history is contingent. Nevertheless, once in place, inclusive economic and political institutions tend to create a virtuous circle, a process of positive feedback, making it more likely that these institutions will persist and even expand.<\/p>\n<p><br />The virtuous circle works through several mechanisms. First, the logic of pluralistic political institutions makes usurpation of power by a dictator, a faction within the government, or even a well-meaning president much more difficult, as Franklin Roosevelt discovered when he tried to remove the checks on his power imposed by the Supreme Court&hellip; <br /><br />Pluralism also enshrines the notion of the rule of law, the principle that laws should be applied equally to everybody&mdash;something that is naturally impossible under an absolutist monarchy. But the rule of law, in turn, implies that laws cannot simply be used by one group to encroach upon the rights of another&hellip; [It] opens the door for greater participation in the political process and greater inclusivity, as it powerfully introduces the idea that people should be equal not only before the law but also in the political system&hellip; <br /><br />Second, inclusive political institutions support and are supported by inclusive economic institutions. This creates another mechanism of the virtuous circle. Inclusive economic institutions remove the most egregious extractive economic relations, such as slavery and serfdom, reduce the importance of monopolies, and create a dynamic economy, all of which reduces the economic benefits that one can secure, at least in the short run, by usurping political power&hellip; This facet of the virtuous circle made the gradual march of democracy in nineteenth-century Britain both less threatening to the elite and more likely to succeed. This contrasts with the situation in absolutist regimes such as the Austro-Hungarian or Russian empires, where economic institutions were still highly extractive and, in consequence, where calls for greater political inclusion later in the nineteenth century would be met by repression because the elite had too much to lose from sharing power. <br /><br />Finally, inclusive political institutions allow a free media to flourish, and a free media often provides information about and mobilizes opposition to threats against inclusive institutions, as it did during the last quarter of the nineteenth century and first quarter of the twentieth century, when the increasing economic domination of the Robber Barons was threatening the essence of inclusive economic institutions in the United States. Though the outcome of the ever-present conflicts continues to be contingent, through these mechanisms the virtuous circle creates a powerful tendency for inclusive institutions to persist, to resist challenges, and to expand as they did in both Britain and the United States.<\/p>", "passageTitle": "q", "question": "According to the passage, all of the following are true about a \"pluralistic society \" EXCEPT:", "options": ["Conflict between elites and those who wish to limit the power of existing elites", "Political systems with broad and equal participation by all members of society", "Rule of law and checks and balances on the power of government officials", "Greater political stability, economic growth, and social welfare."], "answer": 0, "answerLabel": "A", "solution": "In the context of the passage, a pluralistic society with inclusive political institutions refer to political systems that allow for broad and equal participation by all members of society, regardless of their socioeconomic status or political affiliations. A pluralist society as explained in the passage, “powerfully introduces the idea that people should be equal not only before the law but also in the political system” and “inclusive political institutions support and are supported by inclusive economic institutions.” They remove “the most egregious extractive economic relations, such as slavery and serfdom, reduce the importance of monopolies, and create a dynamic economy, all of which reduces the economic benefits that one can secure….” It is a system in which it is “more likely that these institutions will persist and even expand.”   Options 2, 3 and 4 are thus simplifications of these concepts of ‘pluralistic society. Option 1 is the exception as the conflict brings about a pluralistic society. Since the pluralistic society has already limited the elites’  power and capability to usurp power back – the conflict is no longer a prominent feature though the passage hints that the conflict may be ‘ever-present’.&nbsp;\r<br />Hence, [1].", "topic": "Inference"}, {"number": 2, "sourceId": "16920183774371", "type": "mcq", "passage": "<p><strong>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/strong> <br /><br />Inclusive economic and political institutions do not emerge by themselves. They are often the outcome of significant conflict between elites resisting economic growth and political change and those wishing to limit the economic and political power of existing elites. Inclusive institutions emerge during critical junctures, when a series of factors weaken the hold of the elites in power, make their opponents stronger, and create incentives for the formation of a pluralistic society. The outcome of political conflict is never certain, and even if in hindsight we see many historical events as inevitable, the path of history is contingent. Nevertheless, once in place, inclusive economic and political institutions tend to create a virtuous circle, a process of positive feedback, making it more likely that these institutions will persist and even expand.<\/p>\n<p><br />The virtuous circle works through several mechanisms. First, the logic of pluralistic political institutions makes usurpation of power by a dictator, a faction within the government, or even a well-meaning president much more difficult, as Franklin Roosevelt discovered when he tried to remove the checks on his power imposed by the Supreme Court&hellip; <br /><br />Pluralism also enshrines the notion of the rule of law, the principle that laws should be applied equally to everybody&mdash;something that is naturally impossible under an absolutist monarchy. But the rule of law, in turn, implies that laws cannot simply be used by one group to encroach upon the rights of another&hellip; [It] opens the door for greater participation in the political process and greater inclusivity, as it powerfully introduces the idea that people should be equal not only before the law but also in the political system&hellip; <br /><br />Second, inclusive political institutions support and are supported by inclusive economic institutions. This creates another mechanism of the virtuous circle. Inclusive economic institutions remove the most egregious extractive economic relations, such as slavery and serfdom, reduce the importance of monopolies, and create a dynamic economy, all of which reduces the economic benefits that one can secure, at least in the short run, by usurping political power&hellip; This facet of the virtuous circle made the gradual march of democracy in nineteenth-century Britain both less threatening to the elite and more likely to succeed. This contrasts with the situation in absolutist regimes such as the Austro-Hungarian or Russian empires, where economic institutions were still highly extractive and, in consequence, where calls for greater political inclusion later in the nineteenth century would be met by repression because the elite had too much to lose from sharing power. <br /><br />Finally, inclusive political institutions allow a free media to flourish, and a free media often provides information about and mobilizes opposition to threats against inclusive institutions, as it did during the last quarter of the nineteenth century and first quarter of the twentieth century, when the increasing economic domination of the Robber Barons was threatening the essence of inclusive economic institutions in the United States. Though the outcome of the ever-present conflicts continues to be contingent, through these mechanisms the virtuous circle creates a powerful tendency for inclusive institutions to persist, to resist challenges, and to expand as they did in both Britain and the United States.<\/p>", "passageTitle": "q", "question": "Which of the following statements best describes the “virtuous circle” mentioned in the passage?", "options": ["The ever-present conflict between the elites and those who oppose them leading to the emergence of inclusive institutions.", "An economic cycle in which monopolies dominate and limit the benefits of the economy to the elites, followed by the rise of pluralistic societies.", "The mechanisms of institutions, pluralism, rule of law and free media that enable their own continuity through favorable feedback.", "A cycle in which economic institutions lead to extractive economic relations which increase the economic benefit obtained through political power."], "answer": 2, "answerLabel": "C", "solution": "The passage discusses the concept of a \"virtuous circle\" where the mechanisms of institutions, pluralism, rule of law, and free media create a positive feedback loop that enables their own continuity and expansion. This is the main argument of the passage as well.&nbsp;\r<br />Option 1 is incorrect because although conflict between the elites and those who oppose them may lead to the emergence of inclusive institutions, it does not capture the complete picture of the virtuous circle as described in the passage.\r<br />Option 2 is incorrect because it suggests a cycle where monopolies dominate and limit the benefits of the economy to the elites, followed by the rise of pluralistic societies. However, the passage argues that inclusive economic institutions, not monopolies, create a dynamic economy and reduce the economic benefits obtained through political power.\r<br />Option 4 is incorrect because it suggests a cycle where economic institutions lead to extractive economic relations which increase the economic benefit obtained through political power. However, the passage argues the opposite - that inclusive economic institutions remove extractive economic relations and reduce the economic benefits obtained through political power.\r<br />Hence, [3].", "topic": "Central Idea"}, {"number": 3, "sourceId": "16920183774372", "type": "mcq", "passage": "<p><strong>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/strong> <br /><br />Inclusive economic and political institutions do not emerge by themselves. They are often the outcome of significant conflict between elites resisting economic growth and political change and those wishing to limit the economic and political power of existing elites. Inclusive institutions emerge during critical junctures, when a series of factors weaken the hold of the elites in power, make their opponents stronger, and create incentives for the formation of a pluralistic society. The outcome of political conflict is never certain, and even if in hindsight we see many historical events as inevitable, the path of history is contingent. Nevertheless, once in place, inclusive economic and political institutions tend to create a virtuous circle, a process of positive feedback, making it more likely that these institutions will persist and even expand.<\/p>\n<p><br />The virtuous circle works through several mechanisms. First, the logic of pluralistic political institutions makes usurpation of power by a dictator, a faction within the government, or even a well-meaning president much more difficult, as Franklin Roosevelt discovered when he tried to remove the checks on his power imposed by the Supreme Court&hellip; <br /><br />Pluralism also enshrines the notion of the rule of law, the principle that laws should be applied equally to everybody&mdash;something that is naturally impossible under an absolutist monarchy. But the rule of law, in turn, implies that laws cannot simply be used by one group to encroach upon the rights of another&hellip; [It] opens the door for greater participation in the political process and greater inclusivity, as it powerfully introduces the idea that people should be equal not only before the law but also in the political system&hellip; <br /><br />Second, inclusive political institutions support and are supported by inclusive economic institutions. This creates another mechanism of the virtuous circle. Inclusive economic institutions remove the most egregious extractive economic relations, such as slavery and serfdom, reduce the importance of monopolies, and create a dynamic economy, all of which reduces the economic benefits that one can secure, at least in the short run, by usurping political power&hellip; This facet of the virtuous circle made the gradual march of democracy in nineteenth-century Britain both less threatening to the elite and more likely to succeed. This contrasts with the situation in absolutist regimes such as the Austro-Hungarian or Russian empires, where economic institutions were still highly extractive and, in consequence, where calls for greater political inclusion later in the nineteenth century would be met by repression because the elite had too much to lose from sharing power. <br /><br />Finally, inclusive political institutions allow a free media to flourish, and a free media often provides information about and mobilizes opposition to threats against inclusive institutions, as it did during the last quarter of the nineteenth century and first quarter of the twentieth century, when the increasing economic domination of the Robber Barons was threatening the essence of inclusive economic institutions in the United States. Though the outcome of the ever-present conflicts continues to be contingent, through these mechanisms the virtuous circle creates a powerful tendency for inclusive institutions to persist, to resist challenges, and to expand as they did in both Britain and the United States.<\/p>", "passageTitle": "q", "question": "Which of the following can be validly inferred from the 2<sup>nd<\/sup> paragraph?", "options": ["Pluralistic political institutions can unreasonably impede the functioning of the democratic system with unpredictable consequences.", "Franklin Roosevelt was held in check by the Supreme Court because his policies transgressed the power of his office.", "Franklin Roosevelt was held in check by the Supreme Court because the policies were populist and would have harmed the people if implemented.", "Franklin Roosevelt lost to the Supreme Court because his policies were hugely unpopular and people were against them."], "answer": 1, "answerLabel": "B", "solution": "Refer to paragraph 2. In the short paragraph the only point being made is that pluralistic political institutions can frustrate would-be dictators or factions or governments that would exceed their limits to power.  Only option 2 states this directly. Option 1 – ‘unreasonable, and unpredictable’ are data inadequate. Option 3 and 4 are similarly data inadequate, would require historical background information.&nbsp;\r<br />Hence, [2].", "topic": "Inference"}, {"number": 4, "sourceId": "16920183774373", "type": "mcq", "passage": "<p><strong>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/strong> <br /><br />Inclusive economic and political institutions do not emerge by themselves. They are often the outcome of significant conflict between elites resisting economic growth and political change and those wishing to limit the economic and political power of existing elites. Inclusive institutions emerge during critical junctures, when a series of factors weaken the hold of the elites in power, make their opponents stronger, and create incentives for the formation of a pluralistic society. The outcome of political conflict is never certain, and even if in hindsight we see many historical events as inevitable, the path of history is contingent. Nevertheless, once in place, inclusive economic and political institutions tend to create a virtuous circle, a process of positive feedback, making it more likely that these institutions will persist and even expand.<\/p>\n<p><br />The virtuous circle works through several mechanisms. First, the logic of pluralistic political institutions makes usurpation of power by a dictator, a faction within the government, or even a well-meaning president much more difficult, as Franklin Roosevelt discovered when he tried to remove the checks on his power imposed by the Supreme Court&hellip; <br /><br />Pluralism also enshrines the notion of the rule of law, the principle that laws should be applied equally to everybody&mdash;something that is naturally impossible under an absolutist monarchy. But the rule of law, in turn, implies that laws cannot simply be used by one group to encroach upon the rights of another&hellip; [It] opens the door for greater participation in the political process and greater inclusivity, as it powerfully introduces the idea that people should be equal not only before the law but also in the political system&hellip; <br /><br />Second, inclusive political institutions support and are supported by inclusive economic institutions. This creates another mechanism of the virtuous circle. Inclusive economic institutions remove the most egregious extractive economic relations, such as slavery and serfdom, reduce the importance of monopolies, and create a dynamic economy, all of which reduces the economic benefits that one can secure, at least in the short run, by usurping political power&hellip; This facet of the virtuous circle made the gradual march of democracy in nineteenth-century Britain both less threatening to the elite and more likely to succeed. This contrasts with the situation in absolutist regimes such as the Austro-Hungarian or Russian empires, where economic institutions were still highly extractive and, in consequence, where calls for greater political inclusion later in the nineteenth century would be met by repression because the elite had too much to lose from sharing power. <br /><br />Finally, inclusive political institutions allow a free media to flourish, and a free media often provides information about and mobilizes opposition to threats against inclusive institutions, as it did during the last quarter of the nineteenth century and first quarter of the twentieth century, when the increasing economic domination of the Robber Barons was threatening the essence of inclusive economic institutions in the United States. Though the outcome of the ever-present conflicts continues to be contingent, through these mechanisms the virtuous circle creates a powerful tendency for inclusive institutions to persist, to resist challenges, and to expand as they did in both Britain and the United States.<\/p>", "passageTitle": "q", "question": "Which of the following best describes the primary role of free media in the 'virtuous circle', according to the passage?", "options": ["The media’s role is to provide a platform for citizens to express their views, defend free speech, and mobilize opposition to criticism against the government and its policies.", "The media’s role is to provide accurate and objective reporting about government policies and catalyze public debates around issues that confront the common people.", "The media's role is to provide accurate and objective information about government actions and hold officials accountable, and mobilize opposition to threats against the government.", "The media's role is to flourish under inclusive political institutions and provide information about threats against inclusive institutions, as well as mobilize opposition to those threats."], "answer": 3, "answerLabel": "D", "solution": "Refer to the last paragraph: “Finally, inclusive political institutions allow a free media to flourish, and a free media often provides information about and mobilizes opposition to threats against inclusive institutions…” which makes option 4 the primary role of free media as per the passage. Its role is not towards the government or its opposition or individuals.&nbsp;\r<br />Hence, [4].", "topic": "Inference"}, {"number": 5, "sourceId": "16920183774374", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each<\/b><b> <\/b><b>question.<\/b><br><br>Corals are animals, and they eat like any animal would. A coral is, simply put, a small sea anemone with a skeleton. Each coral takes the form of an individual polyp and lives in a colony with many other tiny polyps. Each individual coral is a tiny filter feeder that catches plankton - microscopic plants and organisms - for nutrition with its tentacles.<br><br>But corals have another means of nutrition as well: they harbour microscopic green algae within their tissue. Algae are aquatic plants, and through the process of photosynthesis, convert sunlight into biological energy. In this way, these symbiotic algae power the coral and themselves. Because of the coral’s dual ability to make a living, it’s called a holobiont, a ‘total organism’, incorporating the best of the animal and plant worlds. Especially for many hard corals, which build the most massive calcium carbonate skeletons, the energy derived from photosynthesis makes up the majority of the organism’s energy budget. Hence, clear water, transparent to sunlight, is of paramount importance for the flourishing of a classic coral reef.<br><br>…One [human] activity detrimental to the health of coral reefs is ‘coastal development’, a term that sounds Orwellian to the conservation biologist. Coastal reclamation directly destroys reefs by constructing artificial islands on top of them. And even construction activity on or near the seashore can damage coral reefs: a concrete seawall will filter rainwater flowing into the ocean much less efficiently than an intact mangrove forest. Dense coastal human populations with poor liquid-waste treatment in their communities will make the ocean’s water more turbid and rich in nutrients. These ‘developments’ knock out corals that need clear water for sufficient light to reach their symbiotic algae. In the absence of hard corals, other animals like the soft leather coral Sarcophyton can come to dominate stressed coastlines. Not only does the reduced sunlight harm the hard-coral holobionts, the excessive nutrients serve as fertiliser for other marine algae, often arch-enemies of corals competing with them for space on the reef. Reefs dominated by these algae are a hallmark of many stressed ecosystems in the Caribbean.<br><br>The greatest threat to the stability of the planet’s biosphere is human-caused climate change. The massive amounts of carbon dioxide released into the atmosphere as we burn fossil fuels leads to a rise in temperatures. The physiology [of corals] is very finely tuned to work at the temperatures of sun-drenched shallow tropical reefs, with an optimum just a bit below 30 degrees Celsius. Any temperature above that will cause the algae living symbiotically within the coral to produce so much reactive oxygen as a byproduct of their photosynthesis that their coral hosts suffer damage. Responding to that emergency, corals repulse the algae from their bodies. This is the right move in the short term: the corals remain unharmed by the reactive oxygen. But in the long run they will starve without the energy generated by their algal symbionts, and may eventually die if they do not recover symbiont numbers in time. Since the loss of the algae also leads to the loss of the beautiful colours of the corals, this creates the tragedy on the reef known as ‘coral bleaching’. Hard corals are among the most severely affected by this stress…", "passageTitle": "Reading Comprehension Passage", "question": "Which of the following best describes what the passage is about?", "options": ["The biology and ecology of coral reefs and how human activities threaten their stability.", "The negative effects of coastal development on coral reefs and the threat of coral bleaching due to climate change.", "The nutrient pathways of coral reefs and the ways in which human activities can impact them.", "The possible extinction of symbiotic ecosystems like the coral reefs due to a warming planet and rich oceans."], "answer": 2, "answerLabel": "C", "solution": "The passage begins with “Corals are animals, and they eat like any animal would.” The next two paragraph describe in detail how coral reefs obtain their nutrients and coastal development impacts their nutrient supply.  The last paragraph begins with a general statement “The greatest threat to the stability of the planet’s biosphere is human-caused climate change,” and concludes “Hard corals are among the most severely affected by this stress.” Th nbsp;<span>2 cannot be inferred because less efficiently filtered water will carry more ‘nutrients’ into the sea. Hence 2 is an&nbsp;<\/span>exception<span>.&nbsp;<\/span>\r<br />Option<span> 3. Can be inferred from “Coastal reclamation directly destroys reefs by constructing artificial islands on top of them.”<\/span>\r<br /><span>Option 4. Can be inferred from “Dense coastal human populations with poor liquid-waste treatment in their communities will make the ocean’s water&nbsp;<\/span><span>more turbid and rich<\/span><span> in nutrients. These ‘developments’ knock out corals that need clear water for sufficient light to reach their symbiotic algae.”&nbsp;<\/span>\r<br />Hence, [2].", "topic": "Inference"}, {"number": 8, "sourceId": "16920183774397", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each<\/b><b> <\/b><b>question.<\/b><br><br>Corals are animals, and they eat like any animal would. A coral is, simply put, a small sea anemone with a skeleton. Each coral takes the form of an individual polyp and lives in a colony with many other tiny polyps. Each individual coral is a tiny filter feeder that catches plankton - microscopic plants and organisms - for nutrition with its tentacles.<br><br>But corals have another means of nutrition as well: they harbour microscopic green algae within their tissue. Algae are aquatic plants, and through the process of photosynthesis, convert sunlight into biological energy. In this way, these symbiotic algae power the coral and themselves. Because of the coral’s dual ability to make a living, it’s called a holobiont, a ‘total organism’, incorporating the best of the animal and plant worlds. Especially for many hard corals, which build the most massive calcium carbonate skeletons, the energy derived from photosynthesis makes up the majority of the organism’s energy budget. Hence, clear water, transparent to sunlight, is of paramount importance for the flourishing l symbionts, and may eventually die if they do not recover symbiont numbers in time. Since the loss of the algae also leads to the loss of the beautiful colours of the corals, this creates the tragedy on the reef known as ‘coral bleaching’. Hard corals are among the most severely affected by this stress…", "passageTitle": "Reading Comprehension Passage", "question": "Which of the following best explains the meaning of “coral bleaching”?", "options": ["Corals losing color because of their reaction with excess oxygen in water.", "The death of coral owing to temperatures beyond the optimum range.", "The expulsion of the symbiotic algae that live within the corals.", "The effect of unusually warm water on coral."], "answer": 2, "answerLabel": "C", "solution": "<\/span>\t<span>“Any temperature above that will cause the algae living symbiotically within the coral to produce so much reactive oxygen as a byproduct of their photosynthesis that their coral hosts suffer damage. Responding to that emergency, corals repulse the algae from their bodies. This is the right move in the short term: the corals remain unharmed by the reactive oxygen.”&nbsp;<\/span>\r<br /><span>Option 1. Incorrect. They do not react with the excess oxygen. They react to the excess oxygen produced by symbiotic algae but that does not lead to bleaching.&nbsp;<\/span>\r<br /><span>Option 2. Incorrect. There is no death&nbsp;<\/span>mentioned in the passage<span>.&nbsp;<\/span>\r<br /><span>Option 3. Correct. – the result of this is a loss of&nbsp;<\/span>color<span> and possibly death if prolonged.&nbsp;<\/span>\r<br /><span>Option 4. Incorrect. Too general. Can’t be generally called coral bleaching.&nbsp;<\/span>\r<br />Hence, [3].", "topic": "Specific Detail Question"}, {"number": 9, "sourceId": "16920183774398", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>Why are peahens so attracted by the peacocks with the most extravagant tails – which are very costly to maintain but otherwise seemingly useless? Why do employers care that you put yourself hundreds of thousands of dollars in debt to get an Ivy League degree in sociology with no obvious relevance to the job?<br><br>In the 1970s, the zoologist Amotz Zahavi and the economist Michael Spence offered a provocative answer. They argued that the cost paid by the peacock (or the college graduate) is the whole point. Their argument (which won Spence a Nobel Prize in Economics in 2001) is a bit subtle, so it is worth carefully looking at how it works. Communication is difficult because individuals have incentives to lie. Employers are looking for certain qualities (intelligence, conscientiousness, ambition) in their employees. They could ask the people they interview if they are intelligent and conscientious, but why wouldn’t the job candidates simply lie?<br><br>Instead, employers select their employees on the basis of signals that are difficult to fake, such as university degrees. In general, having the qualities that employers value makes it easier to get a degree. People who do not have the right mix of intelligence, conscientiousness and ambition will find college more difficult, and either drop out or spend much more time completing their studies. People who anticipate that getting a degree would be too costly for them will opt out.<br><br>So, in principle, even if nothing you had learnt was relevant to the job you want, completing the degree still sends a valuable signal to potential employers: you are the kind of person for whom this high-effort achievement is easy enough. Because it sends a valuable signal, it is in your interest to get a degree, and in the employer’s interest to hire you on its basis.<br><br>A similar argument applies in the biological domain, but with natural selection in the driver’s seat. Growing an extravagant tail is moderately costly for a healthy peacock – but a diseased bird would put its life at risk if he spent that much energy growing the ornament. Therefore, only the peacocks in good enough condition can afford to grow an elaborate tail. As such, natural selection favours peahens who prefer peacocks with a long tail, because these peahens mate with healthy males, and get healthy offspring as a result. Costly signals – signals that are honest because of the fact that they are costly – are ubiquitous.", "passageTitle": "Reading Comprehension Passage", "question": "Which of the following, if true, would most invalidate the argument of Amotz Zahavi and Michael Spence?", "options": ["Peahens are attracted to peacocks with long tails primarily because they are flashy and impressive, rather than a signal of good health and genetic quality.", "Employers have begun to place a greater emphasis on qualities such as creativity and adaptability than on intelligence and ambition.", "Individuals have found cheaper and more accessible ways to signal their abilities to employers than obtaining a university degree.", "The qualities that employers value do not have a significant impact on the ease with which individuals can obtain a university degree."], "answer": 3, "answerLabel": "D", "solution": "Option 1. If this was true, it would undermine the analogy, and the assumption that the peacock's tail is a costly signal of good health, and thus weaken the analogy between the peacock's tail and a university degree. However, since it&nbsp;emphasises how peahens perceive the tail rather than&nbsp;peacocks ability to develop the tail, it does not necessarily challenge the fact the tails are not an indicator of ability.&nbsp;\r<br />Option 2. If employers are valuing different qualities than those&nbsp;signalled by a university degree, it does not necessarily challenge the assumption that a degree is a costly signal of other qualities, nor that they do not look at the degrees.&nbsp;\r<br />Option 3. Individuals finding alternative ways to signal their abilities, does not necessarily challenge the assumption that costly signals are more credible than cheap signals.&nbsp;\r<br />Option 4. If this was true, it would completely undermine the argument of Amotz Zahavi and Michael Spence because it would suggest that obtaining a university degree is not actually a reliable signal of desirable qualities such as intelligence, conscientiousness, and ambition. The fact in 4 destroys that correlation.&nbsp;\r<br />Note: The answer choice satisfies ‘most invalidates’ in the question stem. Other options do weaken the argument in certain degrees, but 4 destroys it.&nbsp;\r<br />Hence, [4].", "topic": "Application Question"}, {"number": 10, "sourceId": "16920183774409", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>Why are peahens so attracted by the peacocks with the most extravagant tails – which are very costly to maintain but otherwise seemingly useless? Why do employers care that you put yourself hundreds of thousands of dollars in debt to get an Ivy League degree in sociology with no obvious relevance to the job?<br><br>In the 1970s, the zoologist Amotz Zahavi and the economist Michael Spence offered a provocative answer. They argued that the cost paid by the peacock (or the college graduate) is the whole point. Their argument (which won Spence a Nobel Prize in Economics in 2001) is a bit subtle, so it is worth carefully looking at how it works. Communication is difficult because individuals have incentives to lie. Employers are looking for certain qualities (intelligence, conscientiousness, ambition) in their employees. They could ask the people they interview if they are intelligent and conscientious, but why wouldn’t the job candidates simply lie?<br><br>Instead, employers select their employees on the basis of signals that are difficult to fake, such as university degrees. In general, having the qualities that employers value makes it easier to get a degree. People who do not have the right mix of intelligence, conscientiousness and ambition will find college more difficult, and either drop out or spend much more time completing their studies. People who anticipate that getting a degree would be too costly for them will opt out.<br><br>So, in principle, even if nothing you had learnt was relevant to the job you want, completing the degree still sends a valuable signal to potential employers: you are the kind of person for whom this high-effort achievement is easy enough. Because it sends a valuable signal, it is in your interest to get a degree, and in the employer’s interest to hire you on its basis.<br><br>A similar argument applies in the biological domain, but with natural selection in the driver’s seat. Growing an extravagant tail is moderately costly for a healthy peacock – but a diseased bird would put its life at risk if he spent that much energy growing the ornament. Therefore, only the peacocks in good enough condition can afford to grow an elaborate tail. As such, natural selection favours peahens who prefer peacocks with a long tail, because these peahens mate with healthy males, and get healthy offspring as a result. Costly signals – signals that are honest because of the fact that they are costly – are ubiquitous.", "passageTitle": "Reading Comprehension Passage", "question": "According to the passage, costly signals in both biological and economic domains are used:", "options": ["to hoax potential mates and employers into believing in one’s capabilities.", "to demonstrate superiority and gain admiration for one's accomplishments.", "to convey genuine information that is difficult to fake.", "to eliminate individuals who are unlikely to succeed in their employment."], "answer": 2, "answerLabel": "C", "solution": "Option 1.  This option is incorrect. Deception (hoax) is not the purpose of costly signals in either the biological or economic domains.\r<br />Option2. This option is incorrect. While it i
