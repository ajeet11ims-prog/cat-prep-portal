, "solution": "All of the following, if false, in accordance … except means:&nbsp;\r<br /><span>Which of the following statements is in accordance with the passage?&nbsp;<\/span>\r<br />Option 1. The passage does not imply that Ivy league candidates are able to do this. The Ivy league paper qualification is more reliable than what the candidates have to say. And candidates are likely to lie.&nbsp;\r<br />Option 2. Exception. As it stands it is a true statement from the passage.” Communication is difficult because individuals have incentives to lie.”&nbsp;\r<br />Option 3. The talent (including the ones the passage mentions) may be outside Ivy League, but in the ‘field’. May not carry the paper qualification but may possess the qualities (intelligence, conscientiousness, ambition) better than those who are qualified.&nbsp;\r<br />Option 4. The passage dismisses the relation – it says ‘even if it is not related, it improves one’s chances.&nbsp;\r<br />Hence, [2].", "topic": "Inference"}, {"number": 12, "sourceId": "169201837744011", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>Why are peahens so attracted by the peacocks with the most extravagant tails – which are very costly to maintain but otherwise seemingly useless? Why do employers care that you put yourself hundreds of thousands of dollars in debt to get an Ivy League degree in sociology with no obvious relevance to the job?<br><br>In the 1970s, the zoologist Amotz Zahavi and the economist Michael Spence offered a provocative answer. They argued that the cost paid by the peacock (or the college graduate) is the whole point. Their argument (which won Spence a Nobel Prize in Economics in 2001) is a bit subtle, so it is worth carefully looking at how it works. Communication is difficult because individuals have incentives to lie. Employers are looking for certain qualities (intelligence, conscientiousness, ambition) in their employees. They could ask the people they interview if they are intelligent and conscientious, but why wouldn’t the job candidates simply lie?<br><br>Instead, employers select their employees on the basis of signals that are difficult to fake, such as university degrees. In general, having the qualities that employers value makes it easier to get a degree. People who do not have the right mix of intelligence, conscientiousness and ambition will find college more difficult, and either drop out or spend much more time completing their studies. People who anticipate that getting a degree would be too costly for them will opt out.<br><br>So, in principle, even if nothing you had learnt was relevant to the job you want, completing the degree still sends a valuable signal to potential employers: you are the kind of person for whom this high-effort achievement is easy enough. Because it sends a valuable signal, it is in your interest to get a degree, and in the employer’s interest to hire you on its basis.<br><br>A similar argument applies in the biological domain, but with natural selection in the driver’s seat. Growing an extravagant tail is moderately costly for a healthy peacock – but a diseased bird would put its life at risk if he spent that much energy growing the ornament. Therefore, only the peacocks in good enough condition can afford to grow an elaborate tail. As such, natural selection favours peahens who prefer peacocks with a long tail, because these peahens mate with healthy males, and get healthy offspring as a result. Costly signals – signals that are honest because of the fact that they are costly – are ubiquitous.", "passageTitle": "Reading Comprehension Passage", "question": "“Costly signals – signals that are honest because of the fact that they are costly – are ubiquitous.” Which of these is NOT an example of a costly signal?", "options": ["Chameleons change colors when threatened or to warn others of nearby danger.", "Male lions with fuller, darker manes are often seen as more attractive.", "Antelopes jump and run in a way that signals to predators that the antelope is healthy.", "Birds often sing complex and elaborate songs to attract mates."], "answer": 0, "answerLabel": "A", "solution": "Seen from the perspective of natural selection (last paragraph where the quoted sentence occurs) options 2, 3 and 4 are energy intensive but apparently useless behaviors or traits to signal something to others/mates which are otherwise apparently useless. Option 1 is a defense mechanism - is a type of adaptation that helps individuals blend in with their environment to avoid detection by predators or prey (not costly). It is not a pure signaling mechanism.&nbsp;\r<br />Hence, [1].", "topic": "Application Question"}, {"number": 13, "sourceId": "169201837744012", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>A lot of medical and clinical thinking about addictive craving is driven by a certain neuroscientific picture that explains cravings in terms of the effects of drugs on the production of dopamine in the brain. On this picture, the object of a craving is a drug itself or the pleasurable effects that getting high is expected to produce. But, by focusing narrowly on the brain, this view misidentifies the object of craving in addiction, or puts too much emphasis on the chemical component. When we look at the social and psychological factors that correlate with addiction, the real object of craving is made salient. In truth, addictive cravings seek out vital emotional experiences. They aim at numbing out, feeling in control, or feeling socially connected. Experiences such as these become particularly valuable and simultaneously elusive under certain environmental conditions…<br><br>One of the most popular dopamine-based explanations of craving focuses on reward-learning… The mainstream view is that this learning depends on the dopaminergic system. Phasic dopamine is a reward prediction error signal: it signals to us, the difference between the actual amount of reward at a given moment and the amount of reward anticipated. Bursts of dopamine are released when unexpected rewards, or unexpected cues that signal rewards, are encountered. These bursts tell us to act when we come across rewarding objects or related cues in our environment. <br><br>Addictive drugs have a pathological effect on this system. Psychoactive drugs cause artificially high bursts of phasic dopamine to be released by midbrain dopamine neurons. Increased dopamine activity has been observed, for example, with the ingestion of amphetamines, alcohol, nicotine, opiates, cocaine, cannabis and benzodiazepines. When drugs are encountered, dopamine is released in anticipation of reward, but then the drug itself – due to its chemical effects – causes an additional dopamine boost when ingested, signalling that the drug is ever increasing in value. The result is that these boosts in dopamine trigger cravings that overestimate the amount of reward that is expected, and so explain the excessive motivational pull of cravings.<br><br>Through repeated drug use, environmental cues become associated with drug-taking, and eventually these cues themselves start to trigger cravings. Cues are person specific and can take the form of drug paraphernalia such as needles or pipes, but also locations, emotions and contexts that have become associated with substance use. As a result of the long-term effects of this learning process, drug cues can continue to trigger cravings even years after active drug use has stopped, thus the link between craving and relapse.<br><br>While neuroscience offers insight into the brain mechanisms underlying substance use, explanations of craving have been heavily skewed towards studying the brain. This promotes an incomplete and potentially misleading picture of addictive cravings. To understand addiction, we must also look at experience, thought processes, behaviour, and life conditions. From this broader perspective, addictive cravings do not look like simple switches in the brain. Research shows that addiction is not automatic and, in most cases, not chronic.", "passageTitle": "Reading Comprehension Passage", "question": "Which one of the following statements best reflects the main argument of the first paragraph of the passage?", "options": ["The commonly held view of drug addiction, which focuses solely on dopamine production in the brain does not capture the full complexity of addiction.", "The real object of addictive craving is not just the drug itself or its pleasurable effects but a broader range of emotional experiences.", "When we take into account social and psychological factors that correlate with addiction, we get a more accurate understanding of addiction", "Certain emotional experiences, such as feeling in control or socially connected, are highly desirable and correlate with addictive craving."], "answer": 1, "answerLabel": "B", "solution": "The first paragraph of the passage argues that the commonly held view of addictive craving, which focuses solely on the brain and the effects of drugs on dopamine production, is too narrow and does not capture the full complexity of addiction. Instead, the author argues that addictive cravings are seeking out emotional experiences, such as feeling in control, socially connected, or numb. The author suggests that when we&nbsp;take into account social and psychological factors that correlate with addiction, we get a more accurate understanding of the object of craving in addiction. In other words, the author contends that the real object of addictive craving is not just the drug itself or its pleasurable effects but a broader range of emotional experiences. Hence 2.&nbsp;\r<br />Option 1. The author uses the term addictive craving rather than just addiction – to include the emotional and social factors. Option 1 uses the word addiction which misses the implications.&nbsp;\r<br />Option 2. Correct.&nbsp;\r<br />Option 3. Part of the argument but not the main argument.&nbsp;\r<br />Option 4. Part of the argument but not the main argument.&nbsp;\r<br />Hence, [2].", "topic": "Central Idea"}, {"number": 14, "sourceId": "169201837744113", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>A lot of medical and clinical thinking about addictive craving is driven by a certain neuroscientific picture that explains cravings in terms of the effects of drugs on the production of dopamine in the brain. On this picture, the object of a craving is a drug itself or the pleasurable effects that getting high is expected to produce. But, by focusing narrowly on the brain, this view misidentifies the object of craving in addiction, or puts too much emphasis on the chemical component. When we look at the social and psychological factors that correlate with addiction, the real object of craving is made salient. In truth, addictive cravings seek out vital emotional experiences. They aim at numbing out, feeling in control, or feeling socially connected. Experiences such as these become particularly valuable and simultaneously elusive under certain environmental conditions…<br><br>One of the most popular dopamine-based explanations of craving focuses on reward-learning… The mainstream view is that this learning depends on the dopaminergic system. Phasic dopamine is a reward prediction error signal: it signals to us, the difference between the actual amount of reward at a given moment and the amount of reward anticipated. Bursts of dopamine are released when unexpected rewards, or unexpected cues that signal rewards, are encountered. These bursts tell us to act when we come across rewarding objects or related cues in our environment. <br><br>Addictive drugs have a pathological effect on this system. Psychoactive drugs cause artificially high bursts of phasic dopamine to be released by midbrain dopamine neurons. Increased dopamine activity has been observed, for example, with the ingestion of amphetamines, alcohol, nicotine, opiates, cocaine, cannabis and benzodiazepines. When drugs are encountered, dopamine is released in anticipation of reward, but then the drug itself – due to its chemical effects – causes an additional dopamine boost when ingested, signalling that the drug is ever increasing in value. The result is that these boosts in dopamine trigger cravings that overestimate the amount of reward that is expected, and so explain the excessive motivational pull of cravings.<br><br>Through repeated drug use, environmental cues become associated with drug-taking, and eventually these cues themselves start to trigger cravings. Cues are person specific and can take the form of drug paraphernalia such as needles or pipes, but also locations, emotions and contexts that have become associated with substance use. As a result of the long-term effects of this learning process, drug cues can continue to trigger cravings even years after active drug use has stopped, thus the link between craving and relapse.<br><br>While neuroscience offers insight into the brain mechanisms underlying substance use, explanations of craving have been heavily skewed towards studying the brain. This promotes an incomplete and potentially misleading picture of addictive cravings. To understand addiction, we must also look at experience, thought processes, behaviour, and life conditions. From this broader perspective, addictive cravings do not look like simple switches in the brain. Research shows that addiction is not automatic and, in most cases, not chronic.", "passageTitle": "Reading Comprehension Passage", "question": "All of the following statements are true about the brain's reward system and drug addiction EXCEPT:", "options": ["Emotional experiences that are elusive in certain environmental conditions contribute to excessive motivational pull of craving.", "Dopamine neurons signal reward prediction error by releasing dopamine in response to rewards or reward-predicting cues.", "Drugs of abuse hijack the brain's reward system by artificially increasing dopamine release, and reinforces drug-seeking behavior.", "Repeated drug use leads to environmental cues, which trigger reward prediction error signals and cravings even without the drug."], "answer": 0, "answerLabel": "A", "solution": "The passage is structured around two aspects: most theories about addictive craving (not merely addiction) “explains cravings in terms of the effects of drugs on the production of dopamine in the brain”. The second aspect is that “When we look at the social and psychological factors that correlate with addiction, the real object of craving is made salient…. Addictive craving&nbsp;seek out vital emotional experiences.” The passage concludes with the comment that brain centric explanations are not enough to understand addictive craving. However, the extract does not examine the social and psychological factors. Options 2, 3 and 4 are true about the brain centric explanation. Option 1 Is related to the psychological factor. Hence the odd man out.&nbsp;\r<br />Hence, [1].", "topic": "Specific Detail Question"}, {"number": 15, "sourceId": "169201837744114", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>A lot of medical and clinical thinking about addictive craving is driven by a certain neuroscientific picture that explains cravings in terms of the effects of drugs on the production of dopamine in the brain. On this picture, the object of a craving is a drug itself or the pleasurable effects that getting high is expected to produce. But, by focusing narrowly on the brain, this view misidentifies the object of craving in addiction, or puts too much emphasis on the chemical component. When we look at the social and psychological factors that correlate with addiction, the real object of craving is made salient. In truth, addictive cravings seek out vital emotional experiences. They aim at numbing out, feeling in control, or feeling socially connected. Experiences such as these become particularly valuable and simultaneously elusive under certain environmental conditions…<br><br>One of the most popular dopamine-based explanations of craving focuses on reward-learning… The mainstream view is that this learning depends on the dopaminergic system. Phasic dopamine is a reward prediction error signal: it signals to us, the difference between the actual amount of reward at a given moment and the amount of reward anticipated. Bursts of dopamine are released when unexpected rewards, or unexpected cues that signal rewards, are encountered. These bursts tell us to act when we come across rewarding objects or related cues in our environment. <br><br>Addictive drugs have a pathological effect on this system. Psychoactive drugs cause artificially high bursts of phasic dopamine to be released by midbrain dopamine neurons. Increased dopamine activity has been observed, for example, with the ingestion of amphetamines, alcohol, nicotine, opiates, cocaine, cannabis and benzodiazepines. When drugs are encountered, dopamine is released in anticipation of reward, but then the drug itself – due to its chemical effects – causes an additional dopamine boost when ingested, signalling that the drug is ever increasing in value. The result is that these boosts in dopamine trigger cravings that overestimate the amount of reward that is expected, and so explain the excessive motivational pull of cravings.<br><br>Through repeated drug use, environmental cues become associated with drug-taking, and eventually these cues themselves start to trigger cravings. Cues are person specific and can take the form of drug paraphernalia such as needles or pipes, but also locations, emotions and contexts that have become associated with substance use. As a result of the long-term effects of this learning process, drug cues can continue to trigger cravings even years after active drug use has stopped, thus the link between craving and relapse.<br><br>While neuroscience offers insight into the brain mechanisms underlying substance use, explanations of craving have been heavily skewed towards studying the brain. This promotes an incomplete and potentially misleading picture of addictive cravings. To understand addiction, we must also look at experience, thought processes, behaviour, and life conditions. From this broader perspective, addictive cravings do not look like simple switches in the brain. Research shows that addiction is not automatic and, in most cases, not chronic.", "passageTitle": "Reading Comprehension Passage", "question": "Which of the following statements best explains “the excessive motivational pull of cravings” for drugs of abuse? (Paragraph 3)", "options": ["Repeated drug use leads to physical dependence on the drug, resulting in a strong and persistent desire to use drugs.", "Environmental cues associated with drug use trigger reward prediction error signals, resulting in an overwhelming drive to seek drugs.", "Social and psychological factors persist, creating a craving for emotional experiences that provide a sense of control, numbness, or social connection.", "Cravings caused by a decrease in dopamine release in response to drugs of abuse which leads to an overestimation of the expected reward."], "answer": 1, "answerLabel": "B", "solution": "Option 1. While physical dependence can be a factor in addiction, it does not fully explain the strong and persistent desire to use drugs.\r<br />Option 2. Correct. Repeated drug use leads to environmental cues becoming associated with drug-taking, which can trigger reward prediction error signals and reinforce drug-seeking behavior, even in the absence of the drug.\r<br />Option 3. Cravings are a result of social and psychological factors. This option is partially correct. While social and psychological factors can contribute to cravings, they are not the sole cause of the excessive motivational pull of cravings. The paragraph specifically discusses the excessive motivational pull among those who already consume drugs.&nbsp;\r<br />Option 4. It is caused by an “increase” in the release of dopamine. Distractor.&nbsp;\r<br />Hence, [2].", "topic": "Specific Detail Question"}, {"number": 16, "sourceId": "169201837744115", "type": "mcq", "passage": "<b>The passage below is accompanied by a set of questions. Choose the best answer to each question.<\/b><br><br>A lot of medical and clinical thinking about addictive craving is driven by a certain neuroscientific picture that explains cravings in terms of the effects of drugs on the production of dopamine in the brain. On this picture, the object of a craving is a drug itself or the pleasurable effects that getting high is expected to produce. But, by focusing narrowly on the brain, this view misidentifies the object of craving in addiction, or puts too much emphasis on the chemical component. When we look at the social and psychological factors that correlate with addiction, the real object of craving is made salient. In truth, addictive cravings seek out vital emotional experiences. They aim at numbing out, feeling in control, or feeling socially connected. Experiences such as these become particularly valuable and simultaneously elusive under certain environmental conditions…<br><br>One of the most popular dopamine-based explanations of craving focuses on reward-learning… The mainstream view is that this learning depends on the dopaminergic system. Phasic dopamine is a reward prediction error signal: it signals to us, the difference between the actual amount of reward at a given moment and the amount of reward anticipated. Bursts of dopamine are released when unexpected rewards, or unexpected cues that signal rewards, are encountered. These bursts tell us to act when we come across rewarding objects or related cues in our environment. <br><br>Addictive drugs have a pathological effect on this system. Psychoactive drugs cause artificially high bursts of phasic dopamine to be released by midbrain dopamine neurons. Increased dopamine activity has been observed, for example, with the ingestion of amphetamines, alcohol, nicotine, opiates, cocaine, cannabis and benzodiazepines. When drugs are encountered, dopamine is released in anticipation of reward, but then the drug itself – due to its chemical effects – causes an additional dopamine boost when ingested, signalling that the drug is ever increasing in value. The result is that these boosts in dopamine trigger cravings that overestimate the amount of reward that is expected, and so explain the excessive motivational pull of cravings.<br><br>Through repeated drug use, environmental cues become associated with drug-taking, and eventually these cues themselves start to trigger cravings. Cues are person specific and can take the form of drug paraphernalia such as needles or pipes, but also locations, emotions and contexts that have become associated with substance use. As a result of the long-term effects of this learning process, drug cues can continue to trigger cravings even years after active drug use has stopped, thus the link between craving and relapse.<br><br>While neuroscience offers insight into the brain mechanisms underlying substance use, explanations of craving have been heavily skewed towards studying the brain. This promotes an incomplete and potentially misleading picture of addictive cravings. To understand addiction, we must also look at experience, thought processes, behaviour, and life conditions. From this broader perspective, addictive cravings do not look like simple switches in the brain. Research shows that addiction is not automatic and, in most cases, not chronic.", "passageTitle": "Reading Comprehension Passage", "question": "\"Research shows that addiction is not automatic and, in most cases, not chronic.”  In the context of the passage, which one of the following is NOT a possible implication of the quoted statement??", "options": ["Addiction is not an inevitable process that always follows drug use.", "Some individuals may be more vulnerable to addiction than others.", "it is possible to prevent or overcome addiction through right interventions.", "Neuroscience does not fully explain the brain mechanisms of substance use."], "answer": 3, "answerLabel": "D", "solution": "The quoted sentence suggests that addiction is not an automatic or inevitable process that always follows drug use. Rather, addiction is a complex phenomenon that involves a variety of social, psychological, and biological factors. While some individuals may be more vulnerable to addiction than others, it is possible to prevent or overcome addiction through various interventions, such as education, therapy, and medication. Option 4 is not an implication; in fact, it is contrary to the passage, brain science almost fully explains the mechanisms. (first three paragraphs- dopamine effect , reward-learning&nbsp;etc) ). The passage acknowledges that neuroscience offers insights into the brain mechanisms underlying substance use (not addiction per se)  but it argues that explanations of addiction should also consider other factors such as experience, thought processes, behavior, and life conditions. It does not directly state or imply that neuroscience does not fully explain the brain mechanisms of substance use.\r<br />Hence, [4].", "topic": "Inference"}, {"number": 17, "sourceId": "169201837744116", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br>1.\tAccording to recent studies, the average person spends up to three hours a day on their mobile device.<br>2.\tHowever, excessive use of mobile devices can have negative consequences on physical and mental health, including eye strain, neck and back pain, and poor sleep quality.<br>3.\tMobile devices have become an integral part of modern life, providing a range of benefits including access to information, communication, and entertainment.<br>4.\tTo maintain a healthy balance, it is important to use mobile devices in moderation and take breaks regularly.<br><br><span>", "options": [], "answer": "3124", "answerLabel": "3124", "solution": "Sentence 1. Provides a statistic about mobile use. Could be the starting sentence or supporting detail.&nbsp;\r<br />Sentence 2.A contrasting perspective, highlighting the consequences of  excessive use of mobile devices&nbsp;\r<br />Sentence 3. Introduces the topic of mobile devices, making it a good starting sentence.&nbsp;\r<br />Sentence 4. A  solution to the negative consequences mentioned in sentence 2.&nbsp;\r<br />\r<br />Sentence 3 introduces the topic of mobile devices, making it a good starting sentence. Sentence 1 follows naturally, providing a statistic that supports the notion that mobile devices are an important part of modern life. Sentence 2 provides a contrasting perspective, highlighting that excessive use of mobile devices can have negative consequences on physical and mental health. Sentence 4 offers a solution to the negative consequences mentioned in sentence 2, making it a good ending sentence.&nbsp;\r<br />Therefore, the required answer is 3124.&nbsp;", "topic": "Jumbled Paragraphs"}, {"number": 18, "sourceId": "169201837744617", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br>1.\tThe extremist attack on free speech (from right and left) degrades democracy, and that attack is especially acute on college campuses. <br>2.\tOne line, in particular, resonates in troubled times. “Things fall apart; the center cannot hold,” writes Yeats. <br>3.\tWilliam Butler Yeats’s “The Second Coming” has been called the most plundered poem in the English language. <br>4.\tWritten during the height of the Russian Civil War, it vividly captures the feeling that events are sliding out of control. <br><br><span>", "options": [], "answer": "3421", "answerLabel": "3421", "solution": "Sentence 1: Could be a starter or a follower, talks about extremist attack on free speech\r<br />Sentence 2: Online in, in particular, resonates – indicates that it will follow a mention of some work of writing.\r<br />Sentence 3: Strong candidate for starter – introduces Yeats’s The Second coming\r<br />Sentence 4: Will follow 3 – describes the poem introduced in 3.\r<br />\r<br />Since 4 describes The Second Coming introduced in 3, 3-4 is a pair. 2 talks about one specific line in the poem; so, 2 follows 4 (which talks about the entire poem). So, 4-2 is another sequence. 3-4-2 form a sequence. 1 will either precede or follow this sequence. The writer references the poem to make a comparison to an event in present times. 1 refers to that event. Hence, 3-4-2-1 is the sequence.&nbsp;\r<br />Therefore, the required answer is 3421.", "topic": "Jumbled Paragraphs"}, {"number": 19, "sourceId": "169201837744818", "type": "tita", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The four sentences (labelled 1, 2, 3 and 4) below, when properly sequenced would yield a coherent paragraph. Decide on the proper sequencing of the order of the sentences and key in the sequence of the four numbers as your answer.<\/b><br><br>1.\tInnovative solutions such as precision agriculture and vertical farming have the potential to address these challenges and promote sustainable food production.<br>2.\tThe use of pesticides and fertilizers can have harmful effects on soil quality and biodiversity, making sustainable farming practices essential.<br>3.\tTo feed this growing population, we must find ways to increase food production while also protecting the environment.<br>4.\tThe United Nations estimates that by 2050, the world population will reach 9.7 billion people.<br><br><span>", "options": [], "answer": "4321", "answerLabel": "4321", "solution": "Sentence 1 – ‘these challenges’ need to be preceded by a sentence specifying the challenges.\r<br />Sentence 2 – ‘sustainable farming/food production’ link 1 and 2.&nbsp;\r<br />Sentence 3 – ‘to feed this growing population’ needs another sentence before it\r<br />Sentence 4 – 4 and 3 are a mandatory pair.&nbsp;\r<br />Sentence 4 introduces the topic of the growing world population, making it a good starting sentence. Sentence 3 follows naturally, highlighting the challenge of feeding this population while also protecting the environment. Sentence 2 provides a specific example of the negative consequences of conventional farming practices, emphasizing the need for sustainable agriculture. Sentence 1 offers potential solutions to the challenges presented in sentence 2 and 3, making it a good ending sentence.\r<br />Therefore, the required answer is 4321.", "topic": "Jumbled Paragraphs"}, {"number": 20, "sourceId": "169201837744919", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><b>Sentence:<\/b> Happiness is not something ready-made; it comes from your own actions.<br><br><b>Paragraph:<\/b> _____1____.  Happiness is a state of mind that can be influenced by many factors, including our thoughts, actions, and environment. Some people believe that happiness is determined by external circumstances, such as wealth, status, or relationships. _____2____.  However, studies have shown that these factors do not guarantee long-term happiness. Instead, it is our internal attitudes and actions that can have a greater impact on our well-being. _____3____.  We can cultivate positive emotions like gratitude, compassion, and joy, which have been linked to greater happiness and life satisfaction. _____4____. We can engage in activities that bring us pleasure and meaning, such as hobbies, sports, or creative pursuits. By doing so, we can experience a sense of flow and purpose, which can contribute to our overall sense of well-being. By taking these actions, we can create our own happiness and lead a more fulfilling life.", "options": ["Option 1", "Option 2", "Option 3", "Option 4"], "answer": 3, "answerLabel": "D", "solution": "The sentence \"Happiness is not something ready-made. It comes from your own actions\" emphasizes the importance of our actions and attitudes in achieving happiness. The blank that comes before this sentence talks about how we can cultivate positive emotions and attitudes, which aligns with the idea expressed in the sentence after the blank as well. The sentence that follows&nbsp;this blank details the ‘actions’ that can lead to one’s happiness.  Therefore, the sentence would fit most appropriately in the fourth blank.&nbsp;\r<br />Hence, [4].", "topic": "Paragraph Completion"}, {"number": 21, "sourceId": "169201837745420", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>There is a sentence that is missing in the paragraph below. Look at the paragraph and decide in which blank (option 1, 2, 3, or 4) the following sentence would best fit.<\/b><br><br><b>Sentence:<\/b> Creativity is intelligence having fun.<br><br><b>Paragraph:<\/b> Creativity is a multifaceted phenomenon that involves the generation of novel ideas, insights, and solutions. While some people believe that creativity is an innate talent that only a few possess, researchers have found that everyone has the potential to be creative, given the right environment and mindset. _____1____. Exposure to diverse experiences and perspectives can broaden our horizons and inspire new ways of thinking. _____2____. Taking risks, experimenting, and embracing ambiguity can help us break out of conventional patterns and discover new possibilities. _____3____. Collaboration and communication can foster collective creativity, enabling individuals to build on each other's ideas and create something greater than the sum of its parts. _____4____. Creativity is not just a means to an end, but a source of intrinsic satisfaction and fulfilment, as it allows us to express ourselves, explore our passions, and make a meaningful contribution to the world.", "options": ["Option 1", "Option 2", "Option 3", "Option 4"], "answer": 1, "answerLabel": "B", "solution": "The sentence \"Creativity is intelligence having fun\" suggests that creativity is not a serious or laborious process but rather an enjoyable and playful one that involves the use of our intelligence. The sentence that comes after&nbsp;this blank talks about breaking out of conventional patterns and discovering new possibilities, which aligns with the idea expressed in the sentence. Therefore, the sentence would fit most appropriately in the second blank.&nbsp;\r<br />Thus, the answer is option 2.\r<br />Hence, [2].", "topic": "Paragraph Completion"}, {"number": 22, "sourceId": "169201837745521", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br>We may never know when a human jumped on a horse and rode off into the sunset for the first time, but archaeologists are hard at work trying to understand how horses left the wild and joined humans on the trail to global domination. New research purports to have found the earliest evidence of horseback riding. A team of scientists reports that humans may have ridden horses as early as 3000 B.C.E. – some 1,000 years before the earliest known artistic representation of a human astride a horse. To date, researchers have assembled only a patchy timeline of how humans have used horses. By about 3500 B.C.E., humans appear to have been milking early domestic horses, a delicate process, which is evidence that the animals were already quite tame. But another genetic analysis suggests that the lineage of modern domestic horses didn’t arise until about 2000 B.C.E. That is around the same time that chariot wheels and artistic depictions of horseback riding begin to appear. Both indicate uses that would require fully domesticated animals.", "options": ["Archaeologists have found the earliest evidence of horseback riding dating back to 2000 B.C.E., but the timeline of horse domestication and use for riding is contradictory and unclear.", "Humans have used horses since 3500 B.C.E. for milking and artistic depictions of horseback riding, but genetic analysis makes it unclear when they were fully domesticated.", "Humans may have ridden horses as early as 3000 B.C.E., indicating they were already quite tame, but genetic analysis shows modern domestic horses did not arise until 2000 B.C.E.", "<p>The timeline of horse domestication is unclear, but chariot wheels and artistic depictions of horseback riding indicate that horses were fully domesticated around 2000 B.C.E.<\/p>"], "answer": 2, "answerLabel": "C", "solution": "<span><b>Points:&nbsp;<\/b><\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>The earliest evidence of horseback riding,&nbsp;<\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>The patchy timeline of horse domestication,&nbsp;<\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>The conflicting evidence regarding the domestication of horses.&nbsp;<\/span>\r<br />\r<br />The other options have some misrepresentation or deficiency, making them inaccurate or incomplete. Option 1. “2000 B.C.E” is incorrect in the stated context. Also, there is no mention of 3000 BCE and the discovery therein.&nbsp;\r<br />Option 2. Incorrectly suggests that horses were fully domesticated in 3500 B.C.E. Also, it does not talk of the different genetic analysis of more modern horses of 2000 BCE\r<br />Option 3. Captures the main points in the long paragraph.&nbsp;\r<br />Option 4. Does not mention the evidence of early horseback riding.\r<br />Hence, [3].", "topic": "Summary"}, {"number": 23, "sourceId": "169201837745722", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br>The intellectual ethic of a technology is rarely recognized by its inventors. They are usually so intent on solving a particular problem or untangling some thorny engineering dilemma that they don’t see the broader implications of their work. The users of the technology are also usually oblivious to its ethic. They, too, are concerned with the practical benefits they gain from employing the tool. Our ancestors didn’t develop or use maps in order to enhance their capacity for conceptual thinking or to bring the world’s hidden structures to light. Nor did they manufacture mechanical clocks to spur the adoption of a more scientific mode of thinking. Those were by-products of the technologies. But what by-products! Ultimately, it’s an invention’s intellectual ethic that has the most profound effect on us. The intellectual ethic is the message that a medium or other tool transmits into the minds and culture of its users.", "options": ["The intellectual ethic of a technology, often overlooked by its creators and users, ultimately has the most profound effect on us enhancing our conceptual thinking and urging the adoption of scientific thinking.", "The intellectual ethic of a technology, rarely known to its creators and users, is the message it transmits to its users and has a profound impact on society, often as an unintended consequence.", "The creators of technology are primarily concerned with practical problem-solving, while users focus on benefits, resulting in a lack of attention to an invention’s profound impact on our minds and culture.", "Just as maps and clocks were created for practical purposes but had unintended consequences on our minds and culture, the most profound effect of inventions is on the intellectual ethic."], "answer": 1, "answerLabel": "B", "solution": "<span><b>Points:&nbsp;<\/b><\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>Inventors are focused on solving a specific problem in technology.&nbsp;<\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>Users of technology are more concerned with practical benefits.<\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>Both are unaware of its broader implications<\/span><span>.<\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>E.g., Maps and mechanical clocks – had the unintended consequence of enhancing conceptual thinking or promoting a scientific mode of thinking.<\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\t<span>The intellectual ethic is the message that it transmits into the minds and culture of its users and has the most profound effect.&nbsp;<\/span>\r<br />\r<br />Option 1 – focuses unnecessarily on the by-products of maps and clocks used as examples.&nbsp;\r<br />Option 3 – does not mention the transmission of a message or the unintended consequences of a technology's intellectual ethic.\r<br />Option 4 – The expression “the most profound effect of inventions is on the intellectual ethic” is not accurate. Moreover,&nbsp;It does not convey that the inventors and users are unaware of this intellectual ethic.&nbsp;\r<br />\r<br />Option 2 is the best precis because it accurately conveys the main idea of the paragraph, which is that the intellectual ethic of a technology is often overlooked by its creators and users, but it can have a profound impact on society as an unintended consequence. It also mentions the idea of the transmission of a message, which is a key component of the intellectual ethic of a technology, as discussed in the paragraph.\r<br />Hence, [2].", "topic": "Summary"}, {"number": 24, "sourceId": "169201837745923", "type": "mcq", "passage": "", "passageTitle": "Reading Comprehension Passage", "question": "<b>The passage given below is followed by four alternate summaries. Choose the option that best captures the essence of the passage.<\/b><br><br>Insurance is what economists call a selection market — one where the identity of the customers is just as important as the price they are willing to pay. Some customers will be cheaper for the insurer to serve because they make few claims; others more expensive. The market only works if there is a mix of the two. At its worst, selection can push some companies or entire segments of the industry out of business. If an insurance company finds customers are costlier to serve than it expected, it may raise prices. That could deter less risky customers from buying cover at all, leaving the insurer only with the more risky ones. And so the insurer’s costs rise again, and prices increase again, pushing yet more people out. Eventually, insurance either becomes too expensive for most people, or the insurance company goes bust.", "options": ["The insurance market is a selection market; if prices increase, customers who are cheaper to serve will go out of the market, leaving only the expensive and riskier customers who can potentially make insurance more expensive or the industry go bust.", "The insurance market is a selection market, where the identity of the customers is just as important as the price they are willing to pay, and at its worst, selection can push prices of insurance and the industry out of business.", "Insurance functions as a selection market; if prices rise, the customers who are less expensive to serve may opt out, leaving only the expensive ones who make more claims, which can make either insurance too expensive or the company finally go bankrupt.", "Insurance companies raise prices when customers are more expensive to serve than expected, which could deter less risky customers from buying cover, leaving the insurer only with the riskier ones who further push up the price and the company out of business."], "answer": 2, "answerLabel": "C", "solution": "<span><b>Points:<\/b><\/span>\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\tInsurance, a selection market, needs to find a mix of customers (few claims vs. many claims)&nbsp;\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\tIf the cost of serving customers is higher, prices go up.\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\tThis deters less risky customers from buying insurance.&nbsp;\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\tThe company is left with only the riskier customers.\r<br />\t<span>·<\/span><span>&nbsp;<\/span>\tThis can cause prices to increase further and potentially cause the insurance company to go bust.\r<br />Option 1. ‘industry go bust’ is an overstatement. ‘the company go bust’ is more appropriate.&nbsp;\r<br />Option 2. it explains ‘selection market’ in detail at the expense of clarifying the outcome.&nbsp;\r<br />Option 3. The best precis&nbsp;\r<br />Option 4.  Okay&nbsp;precis, but fails to mention ‘selection market’.&nbsp;\r<br />Hence, [3].", "topic": "Summary"}]}</script><script>
const TEST=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);let current=0,answers=Array(TEST.questions.length).fill(null),marked=Array(TEST.questions.length).fill(false),submitted=false,secondsLeft=TEST.minutes*60;
function answered(i){return answers[i]!==null&&String(answers[i]).trim()!==''}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=TEST.questions[current];$('#qcount').textContent=`Question ${current+1} of ${TEST.questions.length}`;$('#topic').textContent=q.topic;const content=$('#content');content.classList.toggle('has-passage',Boolean(q.passage));$('#passageTitle').textContent=q.passageTitle;$('#passage').innerHTML=q.passage;$('#question').innerHTML=q.question;const box=$('#answerBox');box.innerHTML='';if(q.type==='mcq'){const opts=document.createElement('div');opts.className='options';q.options.forEach((option,index)=>{const label=document.createElement('label');label.className='option';label.innerHTML=`<input type="radio" name="answer" value="${index}" ${answers[current]===index?'checked':''} ${submitted?'disabled':''}><span><b>(${String.fromCharCode(65+index)})</b> ${option}</span>`;opts.append(label)});box.append(opts)}else{const input=document.createElement('input');input.className='tita';input.placeholder='Type your answer';input.value=answers[current]??'';input.disabled=submitted;input.oninput=()=>{answers[current]=input.value;paint()};box.append(input)}$('#solution').innerHTML=`<h2>Solution</h2><div class="correct-answer">Correct answer: ${escapeHtml(q.answerLabel)}</div>${q.solution}`;$('#prevBtn').disabled=current===0;$('#nextBtn').textContent=current===TEST.questions.length-1?'Save':'Save & Next';document.body.classList.toggle('submitted',submitted);paint();$('.passage-panel').scrollTop=0;$('.question-panel').scrollTop=0}
document.addEventListener('change',event=>{if(event.target.name==='answer'){answers[current]=Number(event.target.value);paint()}});
function paint(){document.querySelectorAll('.qbtn').forEach((button,index)=>{button.className='qbtn'+(index===current?' current':'')+(answered(index)?' answered':'')+(marked[index]?' marked':'')})}
function go(index){current=Math.max(0,Math.min(TEST.questions.length-1,index));render()}
function next(){if(current<TEST.questions.length-1)go(current+1)}
function normalize(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function isCorrect(q,index){return q.type==='mcq'?answers[index]===q.answer:normalize(answers[index])===normalize(q.answer)}
function submitTest(){if(submitted)return;const attempted=answers.filter((_,i)=>answered(i)).length;if(!confirm(`Submit the test now? You have attempted ${attempted} of ${TEST.questions.length} questions.`))return;submitted=true;let correct=0,wrongMcq=0,wrongTita=0,skipped=0;TEST.questions.forEach((q,index)=>{if(!answered(index))skipped++;else if(isCorrect(q,index))correct++;else if(q.type==='mcq')wrongMcq++;else wrongTita++});const score=correct*3-wrongMcq;$('#score').textContent=`${score} / ${TEST.questions.length*3}`;$('#correctStat').textContent=correct;$('#wrongStat').textContent=wrongMcq+wrongTita;$('#skipStat').textContent=skipped;$('#result').style.display='grid';render()}
TEST.questions.forEach((_,index)=>{const b=document.createElement('button');b.className='qbtn';b.textContent=index+1;b.onclick=()=>go(index);$('#qgrid').append(b)});$('#nextBtn').onclick=next;$('#prevBtn').onclick=()=>go(current-1);$('#clearBtn').onclick=()=>{answers[current]=null;render()};$('#markBtn').onclick=()=>{marked[current]=!marked[current];next();paint()};$('#bookmarkBtn').onclick=()=>{marked[current]=!marked[current];paint()};$('#submitBtn').onclick=submitTest;$('#closeResult').onclick=()=>{$('#result').style.display='none'};setInterval(()=>{if(submitted)return;secondsLeft=Math.max(0,secondsLeft-1);const m=String(Math.floor(secondsLeft/60)).padStart(2,'0'),s=String(secondsLeft%60).padStart(2,'0');$('#timer').textContent=`${m}:${s}`;if(secondsLeft===0)submitTest()},1000);render();
</script></body></html>
