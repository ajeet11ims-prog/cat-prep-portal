<body><header><div class="topbar"><div class="title"><h1>DI - Bar Graph - Test - 10</h1><div class="meta">CL Jaipur | LRDI | DI - Bar Graph - Test - 10 | 5 Questions | 15 Minutes | +3 correct, -1 wrong</div></div><button type="button" class="calc-toggle" id="calcToggle" title="Open calculator" aria-label="Open calculator"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2" fill="#fff4cf" stroke="#8f6500" stroke-width="1.7"/><rect x="8" y="5" width="8" height="3" rx=".6" fill="#8f6500"/><circle cx="8.5" cy="12" r="1.2" fill="#8f6500"/><circle cx="12" cy="12" r="1.2" fill="#8f6500"/><circle cx="15.5" cy="12" r="1.2" fill="#8f6500"/><circle cx="8.5" cy="16" r="1.2" fill="#8f6500"/><circle cx="12" cy="16" r="1.2" fill="#8f6500"/><circle cx="15.5" cy="16" r="1.2" fill="#8f6500"/></svg></button><div class="timer">Time Left: <span id="time">15:00</span></div></div></header>

<script>const TITLE="DI - Bar Graph - Test - 10",MINUTES=15,questions=[{"group": "set", "q": "If in 1990, there were a total of 1000 buyers of music cassettes/CDs in the city of Phoren and the number of buyers increase by 100 every year, then what is the total number of buyers of music cassettes/CDs who were from age group 45 years and above during the period 1990 to 1994?", "options": ["729", "789", "829", "879"], "answer": "C", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Use the 45-and-above percentages 12%, 11%, 15%, 12% and 18%.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Corresponding buyer totals are 1000, 1100, 1200, 1300 and 1400.<\/li><li><strong>Step 4 - Work through the data:<\/strong> Required total = 120+121+180+156+252 = 829.<\/li><li><strong>Step 5 - Select the option:<\/strong> The result corresponds to option (C).<\/li><\/ol><div class='final-answer'>Final Answer: (C)<\/div>"}, {"group": "set", "q": "By what percentage has the difference between number of buyers who buy music from mail order and those from online stores changed between 1990 and 1994? (assume the number of buyers of music cassettes/CDs have remained the same for every year during this period)", "options": ["Decrease by 15%", "Decrease by 25%", "Increase by 15%", "Increase by 25%"], "answer": "D", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> In 1990 the difference was 10%-2% = 8% of the fixed total.<\/li><li><strong>Step 3 - Work through the data:<\/strong> In 1994 the difference was 15%-5% = 10%.<\/li><li><strong>Step 4 - Work through the data:<\/strong> Percentage increase = <span class='math frac'><span>10-8<\/span><span>8<\/span><\/span> × 100 = 25%.<\/li><li><strong>Step 5 - Select the option:<\/strong> The result corresponds to option (D).<\/li><\/ol><div class='final-answer'>Final Answer: (D)<\/div>"}, {"group": "set", "q": "Which of the following outlets has(/have) managed to retain the number of its customers at almost the same level for a period of three consecutive years in the period 1990 to 1994?", "options": ["Multi product shops", "Online stores", "Both [A] and [B]", "Data Insufficient"], "answer": "D", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> The graph gives only each outlet's percentage share, not the total number of buyers for each year.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Nearly constant percentages do not prove that the absolute number of customers stayed constant.<\/li><li><strong>Step 4 - Work through the data:<\/strong> Therefore the required number of customers cannot be determined.<\/li><li><strong>Step 5 - Select the option:<\/strong> The result corresponds to option (D).<\/li><\/ol><div class='final-answer'>Final Answer: (D)<\/div>"}, {"group": "set", "q": "If in every age group the pattern of buying from various sales outlets show the same break-up as the one given for the total, then what approximately was the number of buyers in the age group 25 years to below 45 years buying music cassettes/CDs from music shops in 1990? (use data from question 12)", "options": ["500", "322", "425", "380"], "answer": "B", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> In 1990, 46% of 1000 buyers were aged 25 to below 45, giving 460 buyers.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Music shops accounted for 70% of buyers that year.<\/li><li><strong>Step 4 - Work through the data:<\/strong> Required number = 460 × <span class='math frac'><span>70<\/span><span>100<\/span><\/span> = 322.<\/li><li><strong>Step 5 - Select the option:<\/strong> The result corresponds to option (B).<\/li><\/ol><div class='final-answer'>Final Answer: (B)<\/div>"}, {"group": "set", "q": "For various sales outlets, the pattern of buying for different age groups follow the same pattern as that given for the total buyers in the given period (1990-1994). What is the percentage change in percentage of buyers in age group of 10 years to below 25 years from online stores between 1993 and 1994?", "options": ["10.7%", "15.3%", "19.0%", "Data Insufficient"], "answer": "C", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> In 1993 the required percentage is proportional to 42×12, using 42% for the age group and 12% for online stores.<\/li><li><strong>Step 3 - Work through the data:<\/strong> In 1994 it is proportional to 40×15.<\/li><li><strong>Step 4 - Work through the data:<\/strong> Percentage change = {(40×15)-(42×12)}/(42×12) × 100 = 19.0%.<\/li><li><strong>Step 5 - Select the option:<\/strong> The result corresponds to option (C).<\/li><\/ol><div class='final-answer'>Final Answer: (C)<\/div>"}],charts={"set": "<div class=\"c calcHandle.onpointerdown=e=>{if(e.target.closest("#calcClose"))return;dragCalc=true;const r=calcPopup.getBoundingClientRect();calcDx=e.clientX-r.left;calcDy=e.clientY-r.top;calcPopup.style.left=r.left+"px";calcPopup.style.top=r.top+"px";calcPopup.style.right="auto";calcPopup.dataset.moved="1";e.preventDefault()};
document.addEventListener("pointermove",e=>{if(!dragCalc)return;const maxX=innerWidth-calcPopup.offsetWidth-4,maxY=innerHeight-calcPopup.offsetHeight-4;calcPopup.style.left=Math.max(4,Math.min(maxX,e.clientX-calcDx))+"px";calcPopup.style.top=Math.max(4,Math.min(maxY,e.clientY-calcDy))+"px"});
document.addEventListener("pointerup",()=>{dragCalc=false});
document.addEventListener("pointercancel",()=>{dragCalc=false});
render();tick();timerId=setInterval(tick,1000);
</script></body></html>
