<script>const TITLE="DI - Bar Graph - Test - 3",MINUTES=30,questions=[{"group": "leather", "q": "In which year was the ratio of Production to Exports for the Indian Leather Industry the lowest?", "options": ["96-97", "98-99", "99-00", "00-01"], "answer": "D", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Compute production ÷ exports for each option.<\/li><li><strong>Step 3 - Work through the data:<\/strong> The ratios are about 10.10, 10.72, 9.90 and 9.01 respectively; the minimum occurs in 2000-01.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (D).<\/li><\/ol><div class='final-answer'>Final Answer: (D)<\/div>"}, {"group": "leather", "q": "The average Production (in Rs. million) between 96-97 and 00-01 (including both) is nearly", "options": ["92,560", "103,125", "117,254", "124,360"], "answer": "B", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Add the five production figures: 67,275 + 90,582 + 113,285 + 119,256 + 125,250 = 515,648.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Divide by 5 to get 103,129.6, nearest to 103,125.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (B).<\/li><\/ol><div class='final-answer'>Final Answer: (B)<\/div>"}, {"group": "leather", "q": "What is the average of the ratios of Production to Exports over the period from 96-97 to 99-00?", "options": ["0.101", "10.1", "9.91", "0.099"], "answer": "B", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> The four ratios <span class='math frac'><span>P<\/span><span>E<\/span><\/span> are approximately 10.10, 10.35, 10.72 and 9.90.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Their arithmetic mean is about 10.27, for which 10.1 is the closest option.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (B).<\/li><\/ol><div class='final-answer'>Final Answer: (B)<\/div>"}, {"group": "leather", "q": "What is the percentage increase in Exports over the given period (96-97 to 00-01)?", "options": ["74.5", "108.8", "135.2", "122.2"], "answer": "B", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Increase = 13,900 - 6,658 = 7,242.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Percentage increase = <span class='math frac'><span>7,242<\/span><span>6,658<\/span><\/span> × 100 ≈ 108.77%.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (B).<\/li><\/ol><div class='final-answer'>Final Answer: (B)<\/div>"}, {"group": "leather", "q": "The increase in domestic consumption (in Rs. million) over the given period is nearly", "options": ["50,000", "7,000", "111,000", "Cannot be determined"], "answer": "A", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Domestic consumption = production - exports.<\/li><li><strong>Step 3 - Work through the data:<\/strong> It rises from 60,617 in 1996-97 to 111,350 in 2000-01, an increase of 50,733, nearly 50,000.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (A).<\/li><\/ol><div class='final-answer'>Final Answer: (A)<\/div>"}, {"group": "leather", "q": "The average domestic consumption (in Rs. million) in the given period is nearly", "options": ["7,654", "76,540", "92,744", "Cannot be determined"], "answer": "C", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Subtract exports from production year by year and add: 60,617 + 81,830 + 102,721 + 107,204 + 111,350 = 463,722.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Average = <span class='math frac'><span>463,722<\/span><span>5<\/span><\/span> ≈ 92,744.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (C).<\/li><\/ol><div class='final-answer'>Final Answer: (C)<\/div>"}, {"group": "donations", "q": "Donations received by IJP exceed those received by Baaki Sab by", "options": ["85%", "42%", "8%", "29.6%"], "answer": "B", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> IJP receives 27% of the total and Baaki Sab 19%.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Excess as a percentage of Baaki Sab = <span class='math frac'><span>27-19<\/span><span>19<\/span><\/span> × 100 ≈ 42.1%.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (B).<\/li><\/ol><div class='final-answer'>Final Answer: (B)<\/div>"}, {"group": "donations", "q": "If all donations made by Jassi go to the IKM, what percent of donations received by IKM come from Jassi?", "options": ["62.5%", "53%", "100%", "70%"], "answer": "A", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Total donations = 4,230 lakhs<\/li><li><strong>Step 3 - Work through the data:<\/strong> IKM receives 13% = 549.9 lakhs.<\/li><li><strong>Step 4 - Work through the data:<\/strong> Jassi contributes 344 lakhs, so the required share is <span class='math frac'><span>344<\/span><span>549.9<\/span><\/span> × 100 ≈ 62.5%.<\/li><li><strong>Step 5 - Select the option:<\/strong> The result corresponds to option (A).<\/li><\/ol><div class='final-answer'>Final Answer: (A)<\/div>"}, {"group": "donations", "q": "Assuming that the percentage contribution of donations received does not change for any party, if Fatte decreases his donation by 20%, by how much does the donation received (in Rs. lakhs) by MSP decrease?", "options": ["28 lakhs", "276 lakhs", "70 lakhs", "138 lakhs"], "answer": "C", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Fatte cuts 20% of 1,192 = 238.4 lakhs.<\/li><li><strong>Step 3 - Work through the data:<\/strong> MSP's fixed share is 29%, hence its reduction = 0.29 × 238.4 ≈ 69.14 lakhs, about 70 lakhs.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (C).<\/li><\/ol><div class='final-answer'>Final Answer: (C)<\/div>"}, {"group": "donations", "q": "If the donation received by BNC from Jassi as well as Juntaa equals 10% of Eir's total donation, then what percent of donation received by BNC comes from sources other than Jassi and Juntaa?", "options": ["49.2%", "37.5%", "50.8%", "8%"], "answer": "C", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Total donation is 1,250+796+1,192+344+648=4,230 lakhs, so BNC receives 12% of 4,230=507.6 lakhs.<\/li><li><strong>Step 3 - Work through the data:<\/strong> The donation from Jassi equals 10% of Eir's 1,250=125 lakhs, and the donation from Juntaa also equals 125 lakhs.<\/li><li><strong>Step 4 - Work through the data:<\/strong> Other sources therefore contribute 507.6-250=257.6 lakhs.<\/li><li><strong>Step 5 - Work through the data:<\/strong> Required percentage=<span class='math frac'><span>257.6<\/span><span>507.6<\/span><\/span>×100≈50.8%.<\/li><li><strong>Step 6 - Select the option:<\/strong> The result corresponds to option (C).<\/li><\/ol><div class='final-answer'>Final Answer: (C)<\/div>"}, {"group": "tea", "q": "Among the following years, in which one was Chaidesh's export of tea, as a proportion of tea produced, the highest?", "options": ["1996", "1997", "1998", "1999"], "answer": "B", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Compare <span class='math frac'><span>export<\/span><span>production<\/span><\/span>: <span class='math frac'><span>189<\/span><span>561,<\/span><\/span> <span class='math frac'><span>209<\/span><span>587,<\/span><\/span> <span class='math frac'><span>215<\/span><span>645<\/span><\/span> and <span class='math frac'><span>220<\/span><span>660.<\/span><\/span> The largest ratio is <span class='math frac'><span>209<\/span><span>587<\/span><\/span> ≈ 35.6% in 1997.<\/li><li><strong>Step 3 - Select the option:<\/strong> The result corresponds to option (B).<\/li><\/ol><div class='final-answer'>Final Answer: (B)<\/div>"}, {"group": "tea", "q": "In which of the following years was the population of Chaidesh the lowest?", "options": ["1995", "1996", "1997", "1999"], "answer": "A", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Population is proportional to total availability divided by per-capita availability.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Total availability is production minus export.<\/li><li><strong>Step 4 - Work through the data:<\/strong> The values of <span class='math frac'><span>P-E<\/span><span>per-capita<\/span><\/span> are smallest for 1995.<\/li><li><strong>Step 5 - Select the option:<\/strong> The result corresponds to option (A).<\/li><\/ol><div class='final-answer'>Final Answer: (A)<\/div>"}, {"group": "tea", "q": "The area under tea cultivation continuously decreased in all four years from 1996 to 1999, by 10%, 7%, 4% and 1%, respectively. In which year was tea productivity (production per unit of area) the highest?", "options": ["1999", "1998", "1997", "1996"], "answer": "A", "solution": "<p><strong>Detailed st \" fill=\"#ffffff\" class=\"bar\"/><text x=\"172.5\" y=\"315.6\" class=\"svg-value\">0.72<\/text><rect x=\"82\" y=\"323.6\" width=\"200.6\" height=\"24.0\" fill=\"#0f172a\" class=\"bar\"/><text x=\"288.6\" y=\"342.6\" class=\"svg-value\">1.71<\/text><rect x=\"230.0\" y=\"384\" width=\"16\" height=\"16\" fill=\"#ffffff\" class=\"bar\"/><text x=\"253.0\" y=\"398\" class=\"svg-label\">1998<\/text><rect x=\"410.0\" y=\"384\" width=\"16\" height=\"16\" fill=\"#0f172a\" class=\"bar\"/><text x=\"433.0\" y=\"398\" class=\"svg-label\">1997<\/text><\/svg>"},passages={"leather": "Directions for questions 1 to 6: Answer on the basis of the information provided in the charts given below. The following graphs for the leather industry show the Production and Export figures for the Indian Leather Industry from 1996-97 to 2000-01. You may assume that the entire production is either consumed in the domestic market or exported. There might be some losses while the products are being exported.", "donations": "Directions for questions 7 to 10: Study the following chart and answer the questions that follow. For the general elections held recently, 5 industrialists (Eir, Bir, Fatte, Jassi and Juntaa) made donations to the election funds of five parties IJP, BNC, MSP, IKM and Baaki Sab. The donations made by the Industrialists and the proportion of these donations received by various Parties are shown in the following charts. You may assume that the parties received donations that were made only by the 5 industrialists shown in the first chart.", "tea": "Directions for questions 11 to 13: Answer the questions on the basis of the following charts. Note: Availability is defined as production less export.", "rain": "Directions for questions 14 to 15: Answer the questions on the basis of the figure below.", "feii": "Directions for questions 16 to 20: Refer to the following graph and answer the questions that follow. The following graph gives the data about Foreign Equity Inflow Index (FEII) for four countries for two years 1997 and 1998. FEII is taken as the ratio of foreign equity inflow (FEI) to the country's GDP. FEII is expressed as percentage in the graph."};
const labels=["A","B","C","D"];let current=0,submitted=false,secondsLeft=MINUTES*60,timerId=null;
const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false);
const host=document.getElementById("host"),qbar=document.getElementById("qbar"),result=document.getElementById("result");
function renderBar(){qbar.innerHTML=questions.map((_,i)=>`<button class="qdot ${i===current?"current":responses[i]!==null?"answered":""} ${marked[i]?"marked":""}" onclick="go(${i})">${i+1}</button>`).join("")}
function save(){const x=host.querySelector('input[name="answer"]:checked');if(x&&!submitted)responses[current]=x.value}
function render(){const x=questions[current];host.innerHTML=`<div class="qhead"><div><div class="qnum">Question ${current+1} of ${questions.length}</div><div class="source">${TITLE}</div></div></div><div class="block"><strong>Common Information</strong><p>${passages[x.group]}</p>${charts[x.group]}</div><div class="qtext">${x.q}</div><div class="options">${x.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${labels[i]}" ${responses[current]===labels[i]?"checked":""} ${submitted?"disabled":""}><span>(${labels[i]}) ${o}</span></label>`).join("")}</div><div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Detailed Solution</h3>${x.solution}</div><div class="navrow"><button onclick="markNext()">Mark for Review & Next</button><button onclick="clearResponse()" ${submitted?"disabled":""}>Clear Response</button><button onclick="go(${current-1})">Previous</button><button class="primary" onclick="next()">Save & Next</button></div>`;host.querySelectorAll('input[name="answer"]').forEach(el=>el.addEventListener("change",()=>{responses[current]=el.value;renderBar()}));if(submitted)review();renderBar()}
function go(i){save();if(i<0||i>=questions.length)return;current=i;render();document.querySelector(".question-card").scrollTop=0}
function next(){save();go(Math.min(current+1,questions.length-1))}
function markNext(){save();marked[current]=true;go(Math.min(current+1,questions.length-1))}
function clearResponse(){if(submitted)return;responses[current]=null;render()}
function review(){const x=questions[current],note=document.getElementById("note");document.getElementById("solution").style.display="block";if(responses[current]===null){note.className="answer-note muted";note.textContent=`Unattempted. Correct answer: (${x.answer})`}else if(responses[current]===x.answer){note.className="answer-note ok";note.textContent="Correct."}else{note.className="answer-note bad";note.textContent=`Wrong. Correct answer: (${x.answer})`}}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm("Submit this test now? You will not be able to change responses afterward."))return;submitted=true;clearInterval(timerId);let c=0,w=0,u=0;questions.forEach((x,i)=>{if(responses[i]===null)u++;else if(responses[i]===x.answer)c++;else w++});const score=c*3-w;result.style.display="block";result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>${score}</strong></div><div class="score-box">Correct<strong>${c}</strong></div><div class="score-box">Wrong<strong>${w}</strong></div><div class="score-box">Attempted<strong>${c+w}</strong></div><div class="score-box">Unattempted<strong>${u}</strong></div></div>`;render();result.scrollIntoView({behavior:"smooth"})}
function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById("time").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(secondsLeft<=0){submitTest(true);return}secondsLeft--}
function calcEval(expr){if(!/^[0-9+\-*/().%\s]+$/.test(expr))return "Error";return Function("return ("+expr.replace(/%/g,"/100")+")")()}
function updateCalcSub(){document.getElementById("calcSubDisplay").textContent=document.getElementById("calcDisplay").value||"0"}
const calcPopup=document.getElementById("calcPopup"),calcHandle=document.getElementById("calcDragHandle");
document.getElementById("calcToggle").onclick=()=>{calcPopup.classList.toggle("open");if(calcPopup.classList.contains("open")&&!calcPopup.dataset.moved){calcPopup.style.left="52%";calcPopup.style.top="120px"}};
document.getElementById("calcClose").onclick=e=>{e.stopPropagation();calcPopup.classList.remove("open")};
document.querySelectorAll("[data-calc]").forEach(btn=>btn.onclick=()=>{const d=document.getElementById("calcDisplay"),v=btn.dataset.calc;if(["MC","MR","MS","M+","M-"].includes(v))return;if(v==="C")d.value="";else if(v==="B")d.value=d.value.slice(0,-1);else if(v==="+/-")d.value=d.value.startsWith("-")?d.value.slice(1):"-"+d.value;else if(v==="sqrt"){try{d.value=Math.sqrt(Number(calcEval(d.value||"0")))}catch{d.value="Error"}}else if(v==="1/x"){try{d.value=1/Number(calcEval(d.value||"0"))}catch{d.value="Error"}}else if(v==="="){try{d.value=calcEval(d.value)}catch{d.value="Error"}}else d.value+=v;updateCalcSub()});
let dragCalc=false,calcDx=0,calcDy=0;
calcHandle.onpointerdown=e=>{dragCalc=true;calcHandle.setPointerCapture(e.pointerId);const r=calcPopup.getBoundingClientRect();calcDx=e.clientX-r.left;calcDy=e.clientY-r.top;calcPopup.style.left=r.left+"px";calcPopup.style.top=r.top+"px";calcPopup.style.right="auto";calcPopup.dataset.moved="1";e.preventDefault()};
calcHandle.onpointermove=e=>{if(!dragCalc)return;const maxX=innerWidth-calcPopup.offsetWidth-4,maxY=innerHeight-calcPopup.offsetHeight-4;calcPopup.style.left=Math.max(4,Math.min(maxX,e.clientX-calcDx))+"px";calcPopup.style.top=Math.max(4,Math.min(maxY,e.clientY-calcDy))+"px"};
calcHandle.onpointerup=e=>{dragCalc=false;try{calcHandle.releasePointerCapture(e.pointerId)}catch{}};
render();tick();timerId=setInterval(tick,1000);
</script></body></html>
