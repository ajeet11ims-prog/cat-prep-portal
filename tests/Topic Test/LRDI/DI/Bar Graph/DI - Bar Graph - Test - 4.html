<script>const TITLE="DI - Bar Graph - Test - 4",MINUTES=35,questions=[{"group": "disease", "q": "The total number of different people who have been vaccinated in the period for any of the diseases is", "options": ["5669", "8340", "10140", "Indeterminate"], "answer": "D", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> The chart gives vaccinations disease-wise but does not state whether the same person received vaccines for multiple diseases.<\/li><li><strong>Step 3 - Work through the data:<\/strong> The number of distinct people therefore cannot be determined.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (D).<\/li><\/ol><div class='final-answer'>Final Answer: (D)<\/div>"}, {"group": "disease", "q": "The minimum possible number of different people in Kalki Sarai who have suffered from diseases A, C, E and G in the given period is", "options": ["1023", "1930", "1807", "Indeterminate"], "answer": "A", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> To minimize distinct people, overlap all four disease groups as much as possible.<\/li><li><strong>Step 3 - Work through the data:<\/strong> The minimum equals the largest individual count: max(896, 550, 1023, 358) = 1023.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (A).<\/li><\/ol><div class='final-answer'>Final Answer: (A)<\/div>"}, {"group": "disease", "q": "The ratio of people vaccinated for a disease to those who suffered from it is highest for which disease?", "options": ["C", "F", "G", "E"], "answer": "A", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Compute <span class='math frac'><span>vaccinated<\/span><span>suffered<\/span><\/span>: C = <span class='math frac'><span>1930<\/span><span>550<\/span><\/span> ≈ 3.51, F ≈ 1.78, G ≈ 3.49 and E ≈ 1.08.<\/li><li><strong>Step 3 - Work through the data:<\/strong> C is marginally the highest.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (A).<\/li><\/ol><div class='final-answer'>Final Answer: (A)<\/div>"}, {"group": "disease", "q": "Prevalence of a disease over a given period of time is directly proportional to the number of people who have suffered from it during the given period. The number of people who have been vaccinated for the three diseases with the highest Prevalence in Kalki ki Sarai over the past 5 years is what percent less than the number of people who have been vaccinated for the three diseases with the lowest Prevalence? (Assume that a person suffers from not more than one disease)", "options": ["100%", "2.6%", "35%", "120%"], "answer": "B", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Highest suffered: B, E and A; vaccinations = 1225+1100+1540 = 3865.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Lowest: G, F and C; vaccinations = 1250+785+1930 = 3965.<\/li><li><strong>Step 4 - Work through the data:<\/strong> The first is <span class='math frac'><span>3965-3865<\/span><span>3965<\/span><\/span> ×100 ≈ 2.52% less, about 2.6%.<\/li><li><strong>Step 5 - Select the option:<\/strong> The result corresponds to option (B).<\/li><\/ol><div class='final-answer'>Final Answer: (B)<\/div>"}, {"group": "employees", "q": "If new hirings for company A in 2004 were half the new hirings by A in 2009, what would have been the number of employees in A at the end of 2003?", "options": ["65", "60", "50", "Indeterminate"], "answer": "B", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> For A, 2009 closing staff 250 = 0.9×220 + hires, so hires in 2009 = 52.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Hence 2004 hires = 26.<\/li><li><strong>Step 4 - Work through the data:<\/strong> With 80 = 0.9×(2003 staff)+26, 2003 staff = 60.<\/li><li><strong>Step 5 - Select the option:<\/strong> The result corresponds to option (B).<\/li><\/ol><div class='final-answer'>Final Answer: (B)<\/div>"}, {"group": "employees", "q": "In 2010, which company hired the maximum number of new employees?", "options": ["A", "B", "C", "B and C"], "answer": "B", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Hires = closing staff - retained prior staff.<\/li><li><strong>Step 3 - Work through the data:<\/strong> A: 250-0.9×250=25<\/li><li><strong>Step 4 - Work through the data:<\/strong> B: 220-0.8×160=92<\/li><li><strong>Step 5 - Work through the data:<\/strong> C: 140-0.8×80=76.<\/li><li><strong>Step 6 - Work through the data:<\/strong> B hired the most.<\/li><li><strong>Step 7 - Select the option:<\/strong> The result corresponds to option (B).<\/li><\/ol><div class='final-answer'>Final Answer: (B)<\/div>"}, {"group": "employees", "q": "What was the total number of new employees hired by the three companies in 2008?", "options": ["105", "130", "137", "146"], "answer": "D", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> A hires 220-0.9×180=58<\/li><li><strong>Step 3 - Work through the data:<\/strong> B hires 130-0.8×90=58<\/li><li><strong>Step 4 - Work through the data:<\/strong> C hires 50-0.8×25=30.<\/li><li><strong>Step 5 - Work through the data:<\/strong> Total = 146.<\/li><li><strong>Step 6 - Select the option:<\/strong> The result corresponds to option (D).<\/li><\/ol><div class='final-answer'>Final Answer: (D)<\/div>"}, {"group": "employees", "q": "Which company has hired the maximum number of employees since its inception?", "options": ["A", "B", "C", "Indeterminate"], "answer": "A", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Use new hires in a year = closing employees - employees retained from the previous year.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Taking the first shown strength as the initial hiring base, company A's cumulative hires are 80+(120-0.9×80)+(150-0.9×120)+(180-0.9×150)+(220-0.9×180)+(250-0.9×220)+(250-0.9×250)=350.<\/li><li><strong>Step 4 - Work throu  and Operations Management (OM) areas respectively, to start with. No faculty member retired or joined the institute in the first three months of the year 2000. In the next four years, the institute recruited one faculty member in each of the four areas. All these new faculty members, who joined the institute subsequently over the years, were 25 years old at the time of their joining the institute. All of them joined the institute on April 1. During these four years, one of the faculty members retired at the age of 60. The chart gives the area-wise average age (in terms of number of completed years) of faculty members as on April 1 of 2000, 2001, 2002, and 2003."};
const labels=["A","B","C","D"];let current=0,submitted=false,secondsLeft=MINUTES*60,timerId=null;
const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false);
const host=document.getElementById("host"),qbar=document.getElementById("qbar"),result=document.getElementById("result");
function renderBar(){qbar.innerHTML=questions.map((_,i)=>`<button class="qdot ${i===current?"current":responses[i]!==null?"answered":""} ${marked[i]?"marked":""}" onclick="go(${i})">${i+1}</button>`).join("")}
function save(){const x=host.querySelector('input[name="answer"]:checked');if(x&&!submitted)responses[current]=x.value}
function render(){const x=questions[current];host.innerHTML=`<div class="qhead"><div><div class="qnum">Question ${current+1} of ${questions.length}</div><div class="source">${TITLE}</div></div></div><div class="block"><strong>Common Information</strong><p>${passages[x.group]}</p>${charts[x.group]}</div><div class="qtext">${x.q}</div><div class="options">${x.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${labels[i]}" ${responses[current]===labels[i]?"checked":""} ${submitted?"disabled":""}><span>(${labels[i]}) ${o}</span></label>`).join("")}</div><div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Detailed Solution</h3>${x.solution}</div><div class="navrow"><button onclick="markNext()">Mark for Review & Next</button><button onclick="clearResponse()" ${submitted?"disabled":""}>Clear Response</button><button onclick="go(${current-1})">Previous</button><button class="primary" onclick="next()">Save & Next</button></div>`;host.querySelectorAll('input[name="answer"]').forEach(el=>el.addEventListener("change",()=>{responses[current]=el.value;renderBar()}));if(submitted)review();renderBar()}
function go(i){save();if(i<0||i>=questions.length)return;current=i;render();document.querySelector(".question-card").scrollTop=0}
function next(){save();go(Math.min(current+1,questions.length-1))}
function markNext(){save();marked[current]=true;go(Math.min(current+1,questions.length-1))}
function clearResponse(){if(submitted)return;responses[current]=null;render()}
function review(){const x=questions[current],note=document.getElementById("note");document.getElementById("solution").style.display="block";if(responses[current]===null){note.className="answer-note muted";note.textContent=`Unattempted. Correct answer: (${x.answer})`}else if(responses[current]===x.answer){note.className="answer-note ok";note.textContent="Correct."}else{note.className="answer-note bad";note.textContent=`Wrong. Correct answer: (${x.answer})`}}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm("Submit this test now? You will not be able to change responses afterward."))return;submitted=true;clearInterval(timerId);let c=0,w=0,u=0;questions.forEach((x,i)=>{if(responses[i]===null)u++;else if(responses[i]===x.answer)c++;else w++});const score=c*3-w;result.style.display="block";result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>${score}</strong></div><div class="score-box">Correct<strong>${c}</strong></div><div class="score-box">Wrong<strong>${w}</strong></div><div class="score-box">Attempted<strong>${c+w}</strong></div><div class="score-box">Unattempted<strong>${u}</strong></div></div>`;render();result.scrollIntoView({behavior:"smooth"})}
function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById("time").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(secondsLeft<=0){submitTest(true);return}secondsLeft--}
function calcEval(expr){if(!/^[0-9+\-*/().%\s]+$/.test(expr))return "Error";return Function("return ("+expr.replace(/%/g,"/100")+")")()}
function updateCalcSub(){document.getElementById("calcSubDisplay").textContent=document.getElementById("calcDisplay").value||"0"}
const calcPopup=document.getElementById("calcPopup"),calcHandle=document.getElementById("calcDragHandle");
document.getElementById("calcToggle").onclick=()=>{calcPopup.classList.toggle("open");if(calcPopup.classList.contains("open")&&!calcPopup.dataset.moved){calcPopup.style.left="52%";calcPopup.style.top="120px"}};
document.getElementById("calcClose").onclick=e=>{e.stopPropagation();calcPopup.classList.remove("open")};
document.querySelectorAll("[data-calc]").forEach(btn=>btn.onclick=()=>{const d=document.getElementById("calcDisplay"),v=btn.dataset.calc;if(["MC","MR","MS","M+","M-"].includes(v))return;if(v==="C")d.value="";else if(v==="B")d.value=d.value.slice(0,-1);else if(v==="+/-")d.value=d.value.startsWith("-")?d.value.slice(1):"-"+d.value;else if(v==="sqrt"){try{d.value=Math.sqrt(Number(calcEval(d.value||"0")))}catch{d.value="Error"}}else if(v==="1/x"){try{d.value=1/Number(calcEval(d.value||"0"))}catch{d.value="Error"}}else if(v==="="){try{d.value=calcEval(d.value)}catch{d.value="Error"}}else d.value+=v;updateCalcSub()});
let dragCalc=false,calcDx=0,calcDy=0;
calcHandle.onpointerdown=e=>{dragCalc=true;calcHandle.setPointerCapture(e.pointerId);const r=calcPopup.getBoundingClientRect();calcDx=e.clientX-r.left;calcDy=e.clientY-r.top;calcPopup.style.left=r.left+"px";calcPopup.style.top=r.top+"px";calcPopup.style.right="auto";calcPopup.dataset.moved="1";e.preventDefault()};
calcHandle.onpointermove=e=>{if(!dragCalc)return;const maxX=innerWidth-calcPopup.offsetWidth-4,maxY=innerHeight-calcPopup.offsetHeight-4;calcPopup.style.left=Math.max(4,Math.min(maxX,e.clientX-calcDx))+"px";calcPopup.style.top=Math.max(4,Math.min(maxY,e.clientY-calcDy))+"px"};
calcHandle.onpointerup=e=>{dragCalc=false;try{calcHandle.releasePointerCapture(e.pointerId)}catch{}};
render();tick();timerId=setInterval(tick,1000);
</script></body></html>
