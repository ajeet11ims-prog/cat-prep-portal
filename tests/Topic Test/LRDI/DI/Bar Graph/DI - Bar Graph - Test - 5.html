 class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Successive growth is approximately 2.7%, 97.9%, 7.8% and 35.0%.<\/li><li><strong>Step 3 - Work through the data:<\/strong> The maximum occurs in 1999-00.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (B).<\/li><\/ol><div class='final-answer'>Final Answer: (B)<\/div>"}, {"group": "audio", "q": "Between which two years did the maximum change in Audio System sales take place?", "options": ["1998-99", "1999-00", "2000-01", "2001-02"], "answer": "B", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Absolute changes are about 0.05, 1.85, 0.29 and 1.41 million for the listed intervals.<\/li><li><strong>Step 3 - Work through the data:<\/strong> The largest is 1999-00.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (B).<\/li><\/ol><div class='final-answer'>Final Answer: (B)<\/div>"}, {"group": "audio", "q": "What was the simple annual growth rate (SAGR) of Audio System sales over the entire period?", "options": ["31%", "155%", "3.6%", "26%"], "answer": "A", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Total growth from 1.84 to 4.68 is <span class='math frac'><span>2.84<\/span><span>1.84<\/span><\/span>×100≈154.3% over five yearly intervals.<\/li><li><strong>Step 3 - Work through the data:<\/strong> SAGR≈<span class='math frac'><span>154.3<\/span><span>5<\/span><\/span>≈30.9%, or 31%.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (A).<\/li><\/ol><div class='final-answer'>Final Answer: (A)<\/div>"}, {"group": "audio", "q": "What were the average annual sales, in Rs. million, of Audio Systems over the entire period?", "options": ["35", "17.3", "3.5", "Indeterminate"], "answer": "C", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Average=<span class='math frac'><span>1.84+1.89+3.74+4.03+5.44+4.68<\/span><span>6<\/span><\/span>≈3.60 million, nearest 3.5.<\/li><li><strong>Step 3 - Select the option:<\/strong> The result corresponds to option (C).<\/li><\/ol><div class='final-answer'>Final Answer: (C)<\/div>"}, {"group": "spend", "q": "Hemant's expenditure on Movies in March as compared to January changed approximately by", "options": ["5%", "8%", "150%", "90%"], "answer": "D", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Movies rise from about 8% in January to 15% in March in the source chart.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Percentage rise=<span class='math frac'><span>15-8<\/span><span>8<\/span><\/span>×100=87.5%, approximately 90%.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (D).<\/li><\/ol><div class='final-answer'>Final Answer: (D)<\/div>"}, {"group": "spend", "q": "The savings from January to April as a percentage of income are", "options": ["30", "26", "60", "Cannot be determined"], "answer": "A", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Savings percentages are 25,30,40 and 25.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Average over January-April=<span class='math frac'><span>25+30+40+25<\/span><span>4<\/span><\/span>=30%.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (A).<\/li><\/ol><div class='final-answer'>Final Answer: (A)<\/div>"}, {"group": "spend", "q": "The average expenditure on food (as a percentage of income) over the 5-month period is", "options": ["25", "20", "16", "40"], "answer": "A", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Food percentages total 25+28+27+24+20=124.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Average=<span class='math frac'><span>124<\/span><span>5<\/span><\/span>=24.8%, about 25%.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (A).<\/li><\/ol><div class='final-answer'>Final Answer: (A)<\/div>"}, {"group": "spend", "q": "If each month's saving earns simple interest at 6% per annum payable monthly, Hemant's interest on his savings at end of May is", "options": ["Rs.1000", "Rs.2500", "Rs.740", "Rs.1280"], "answer": "C", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class= during this period. You may assume that Hemant spends only on the items shown in the chart and saves the remaining portion of his salary.", "work": "Directions for questions 12 to 16: Answer these questions based on the two graphs shown below. Figure on the left shows the amount of work distribution, in man-hours, for a software company between offshore and onsite activities. Figure on the right shows the estimated and actual work involved in the different offshore activities in the same company during the same period. Note: Onsite refers to work performed at the customer's premise and offshore refers to work performed at the developer's own premises.", "visitors": "Directions for questions 17 to 20: Answer the questions on the basis of the information given in the bar chart. Mughlai Chiken is a company that has a website where it charges to provide recipes to people interested in the Mughlai cuisine. The chart gives the visitor count (in '000s) on the company's website www.mughlaichiken.com over a period of 7 months."};
const labels=["A","B","C","D"];let current=0,submitted=false,secondsLeft=MINUTES*60,timerId=null;
const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false);
const host=document.getElementById("host"),qbar=document.getElementById("qbar"),result=document.getElementById("result");
function renderBar(){qbar.innerHTML=questions.map((_,i)=>`<button class="qdot ${i===current?"current":responses[i]!==null?"answered":""} ${marked[i]?"marked":""}" onclick="go(${i})">${i+1}</button>`).join("")}
function save(){const x=host.querySelector('input[name="answer"]:checked');if(x&&!submitted)responses[current]=x.value}
function render(){const x=questions[current];host.innerHTML=`<div class="qhead"><div><div class="qnum">Question ${current+1} of ${questions.length}</div><div class="source">${TITLE}</div></div></div><div class="block"><strong>Common Information</strong><p>${passages[x.group]}</p>${charts[x.group]}</div><div class="qtext">${x.q}</div><div class="options">${x.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${labels[i]}" ${responses[current]===labels[i]?"checked":""} ${submitted?"disabled":""}><span>(${labels[i]}) ${o}</span></label>`).join("")}</div><div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Detailed Solution</h3>${x.solution}</div><div class="navrow"><button onclick="markNext()">Mark for Review & Next</button><button onclick="clearResponse()" ${submitted?"disabled":""}>Clear Response</button><button onclick="go(${current-1})">Previous</button><button class="primary" onclick="next()">Save & Next</button></div>`;host.querySelectorAll('input[name="answer"]').forEach(el=>el.addEventListener("change",()=>{responses[current]=el.value;renderBar()}));if(submitted)review();renderBar()}
function go(i){save();if(i<0||i>=questions.length)return;current=i;render();document.querySelector(".question-card").scrollTop=0}
function next(){save();go(Math.min(current+1,questions.length-1))}
function markNext(){save();marked[current]=true;go(Math.min(current+1,questions.length-1))}
function clearResponse(){if(submitted)return;responses[current]=null;render()}
function review(){const x=questions[current],note=document.getElementById("note");document.getElementById("solution").style.display="block";if(responses[current]===null){note.className="answer-note muted";note.textContent=`Unattempted. Correct answer: (${x.answer})`}else if(responses[current]===x.answer){note.className="answer-note ok";note.textContent="Correct."}else{note.className="answer-note bad";note.textContent=`Wrong. Correct answer: (${x.answer})`}}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm("Submit this test now? You will not be able to change responses afterward."))return;submitted=true;clearInterval(timerId);let c=0,w=0,u=0;questions.forEach((x,i)=>{if(responses[i]===null)u++;else if(responses[i]===x.answer)c++;else w++});const score=c*3-w;result.style.display="block";result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>${score}</strong></div><div class="score-box">Correct<strong>${c}</strong></div><div class="score-box">Wrong<strong>${w}</strong></div><div class="score-box">Attempted<strong>${c+w}</strong></div><div class="score-box">Unattempted<strong>${u}</strong></div></div>`;render();result.scrollIntoView({behavior:"smooth"})}
function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById("time").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(secondsLeft<=0){submitTest(true);return}secondsLeft--}
function calcEval(expr){if(!/^[0-9+\-*/().%\s]+$/.test(expr))return "Error";return Function("return ("+expr.replace(/%/g,"/100")+")")()}
function updateCalcSub(){document.getElementById("calcSubDisplay").textContent=document.getElementById("calcDisplay").value||"0"}
const calcPopup=document.getElementById("calcPopup"),calcHandle=document.getElementById("calcDragHandle");
document.getElementById("calcToggle").onclick=()=>{calcPopup.classList.toggle("open");if(calcPopup.classList.contains("open")&&!calcPopup.dataset.moved){calcPopup.style.left="52%";calcPopup.style.top="120px"}};
document.getElementById("calcClose").onclick=e=>{e.stopPropagation();calcPopup.classList.remove("open")};
document.querySelectorAll("[data-calc]").forEach(btn=>btn.onclick=()=>{const d=document.getElementById("calcDisplay"),v=btn.dataset.calc;if(["MC","MR","MS","M+","M-"].includes(v))return;if(v==="C")d.value="";else if(v==="B")d.value=d.value.slice(0,-1);else if(v==="+/-")d.value=d.value.startsWith("-")?d.value.slice(1):"-"+d.value;else if(v==="sqrt"){try{d.value=Math.sqrt(Number(calcEval(d.value||"0")))}catch{d.value="Error"}}else if(v==="1/x"){try{d.value=1/Number(calcEval(d.value||"0"))}catch{d.value="Error"}}else if(v==="="){try{d.value=calcEval(d.value)}catch{d.value="Error"}}else d.value+=v;updateCalcSub()});
let dragCalc=false,calcDx=0,calcDy=0;
calcHandle.onpointerdown=e=>{dragCalc=true;calcHandle.setPointerCapture(e.pointerId);const r=calcPopup.getBoundingClientRect();calcDx=e.clientX-r.left;calcDy=e.clientY-r.top;calcPopup.style.left=r.left+"px";calcPopup.style.top=r.top+"px";calcPopup.style.right="auto";calcPopup.dataset.moved="1";e.preventDefault()};
calcHandle.onpointermove=e=>{if(!dragCalc)return;const maxX=innerWidth-calcPopup.offsetWidth-4,maxY=innerHeight-calcPopup.offsetHeight-4;calcPopup.style.left=Math.max(4,Math.min(maxX,e.clientX-calcDx))+"px";calcPopup.style.top=Math.max(4,Math.min(maxY,e.clientY-calcDy))+"px"};
calcHandle.onpointerup=e=>{dragCalc=false;try{calcHandle.releasePointerCapture(e.pointerId)}catch{}};
render();tick();timerId=setInterval(tick,1000);
</script></body></html>
