<script>const TITLE="DI - Bar Graph - Test - 6",MINUTES=45,questions=[{"group": "food", "q": "How much less did a dozen kg of milk cost as against a dozen kg of eggs in 1992?", "options": ["17.3%", "25%", "20%", "(<span class='math frac'><span>50<\/span><span>3<\/span><\/span>)%"], "answer": "D", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> In 1992, the cost of 12 kg of milk is 10×12=Rs.120.<\/li><li><strong>Step 3 - Work through the data:<\/strong> The comparison used in the published solution takes the cost of a dozen kg of eggs as 12×12=Rs.144.<\/li><li><strong>Step 4 - Work through the data:<\/strong> Hence milk costs <span class='math frac'><span>144-120<\/span><span>144<\/span><\/span>×100=16.67%=<span class='math frac'><span>50<\/span><span>3<\/span><\/span>% less.<\/li><li><strong>Step 5 - Select the option:<\/strong> The result corresponds to option (D).<\/li><\/ol><div class='final-answer'>Final Answer: (D)<\/div>"}, {"group": "food", "q": "The maximum percentage increase (over the previous year) in the cost of a dozen eggs was observed in which year?", "options": ["1993", "1994", "1995", "1996"], "answer": "B", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Dozen-egg costs are 9.6,10.4,14,16.5,19.2,20.4,21.6.<\/li><li><strong>Step 3 - Work through the data:<\/strong> The largest rise is from 10.4 to14 in 1994: <span class='math frac'><span>3.6<\/span><span>10.4<\/span><\/span>≈34.6%.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (B).<\/li><\/ol><div class='final-answer'>Final Answer: (B)<\/div>"}, {"group": "food", "q": "What is most nearly the difference between the average cost of a kg of milk and that of a kg of eggs over the entire period?", "options": ["Rs.1", "Zero", "Rs.1.53", "Rs.2"], "answer": "A", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Average milk price=<span class='math frac'><span>10+12+14+16+18+20+22<\/span><span>7<\/span><\/span>=16.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Average egg price=<span class='math frac'><span>12+13+14+15+16+17+18<\/span><span>7<\/span><\/span>=15.<\/li><li><strong>Step 4 - Work through the data:<\/strong> Difference=Rs.1.<\/li><li><strong>Step 5 - Select the option:<\/strong> The result corresponds to option (A).<\/li><\/ol><div class='final-answer'>Final Answer: (A)<\/div>"}, {"group": "food", "q": "If a person paid equal amounts for 1 kg of milk and 1 dozen eggs, then he bought these items in", "options": ["1994", "1997", "1993", "None of these"], "answer": "A", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> In 1994 milk costs Rs.14/kg.<\/li><li><strong>Step 3 - Work through the data:<\/strong> A dozen eggs weighs 1 kg and eggs cost Rs.14/kg, so both amounts are Rs.14.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (A).<\/li><\/ol><div class='final-answer'>Final Answer: (A)<\/div>"}, {"group": "food", "q": "If the costs per unit weight for milk and eggs continued to follow their trends, what would be the difference in the cost of 5 kg of egg and 4 kg of milk in 2004?", "options": ["Rs.10", "Rs.16", "Rs.50", "Data insufficient"], "answer": "B", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Milk rises Rs.2/year to Rs.34/kg in 2004; eggs rise Rs.1/year to Rs.24/kg.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Four kg milk=136 and five kg eggs=120; difference=Rs.16.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (B).<\/li><\/ol><div class='final-answer'>Final Answer: (B)<\/div>"}, {"group": "food", "q": "What is the approximate percentage increase in the cost of a dozen eggs during 1992-98?", "options": ["50%", "200%", "125%", "100%"], "answer": "C", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Cost rises from 12×0.8=9.6 to 18×1.2=21.6.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Increase=<span class='math frac'><span>21.6-9.6<\/span><span>9.6<\/span><\/span>×100=125%.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (C).<\/li><\/ol><div class='final-answer'>Final Answer: (C)<\/div>"}, {"group": "revenue", "q": "Which of the following is closest to the percent change in growth rate of Europe in 2007 (over 2006) relative to the growth rate of 2005 (over 2004)?", "options": ["17", "20", "35", "60"], "answer": "C", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Growth 2007 over 2006=<span class='math frac'><span>500-380<\/span><span>380<\/span><\/span>=31.58%; growth 2005 over 2004=<span class='math frac'><span>270-180<\/span><span>180<\/span><\/span>=50%.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Relative change=<span class='math frac'><span>31.58-50<\/span><span>50<\/span><\/span>×100≈-36.84%; magnitude closest to35.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (C).<\/li><\/ol><div class='final-answer'>Final Answer: (C)<\/div>"}, {"group": "revenue", "q": "The difference between the estimated subscription in Europe in 2008 and what it would have been if it were computed using the percentage growth rate of 2007 (over 2006), is closest to", "options": ["50", "80", "20", "10"], "answer": "A", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> 2007 growth factor=1+<span class='math frac'><span>120<\/span><span>380<\/span><\/span>=1.3158.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Applied to 2007 revenue 500 gives 657.9.<\/li><li><strong>Step 4 - Work through the data:<\/strong> Actual/estimated chart value is about605; difference≈53, closest to50.<\/li><li><strong>Step 5 - Select the option:<\/strong> The result corresponds to option (A).<\/li><\/ol><div class='final-answer'>Final Answer: (A)<\/div>"}, {"group": "revenue", "q": "In 2003, 60% of Europe subscribers were me const labels=["A","B","C","D"];let current=0,submitted=false,secondsLeft=MINUTES*60,timerId=null;
const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false);
const host=document.getElementById("host"),qbar=document.getElementById("qbar"),result=document.getElementById("result");
function renderBar(){qbar.innerHTML=questions.map((_,i)=>`<button class="qdot ${i===current?"current":responses[i]!==null?"answered":""} ${marked[i]?"marked":""}" onclick="go(${i})">${i+1}</button>`).join("")}
function save(){const x=host.querySelector('input[name="answer"]:checked');if(x&&!submitted)responses[current]=x.value}
function render(){const x=questions[current];host.innerHTML=`<div class="qhead"><div><div class="qnum">Question ${current+1} of ${questions.length}</div><div class="source">${TITLE}</div></div></div><div class="block"><strong>Common Information</strong><p>${passages[x.group]}</p>${charts[x.group]}</div><div class="qtext">${x.q}</div><div class="options">${x.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${labels[i]}" ${responses[current]===labels[i]?"checked":""} ${submitted?"disabled":""}><span>(${labels[i]}) ${o}</span></label>`).join("")}</div><div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Detailed Solution</h3>${x.solution}</div><div class="navrow"><button onclick="markNext()">Mark for Review & Next</button><button onclick="clearResponse()" ${submitted?"disabled":""}>Clear Response</button><button onclick="go(${current-1})">Previous</button><button class="primary" onclick="next()">Save & Next</button></div>`;host.querySelectorAll('input[name="answer"]').forEach(el=>el.addEventListener("change",()=>{responses[current]=el.value;renderBar()}));if(submitted)review();renderBar()}
function go(i){save();if(i<0||i>=questions.length)return;current=i;render();document.querySelector(".question-card").scrollTop=0}
function next(){save();go(Math.min(current+1,questions.length-1))}
function markNext(){save();marked[current]=true;go(Math.min(current+1,questions.length-1))}
function clearResponse(){if(submitted)return;responses[current]=null;render()}
function review(){const x=questions[current],note=document.getElementById("note");document.getElementById("solution").style.display="block";if(responses[current]===null){note.className="answer-note muted";note.textContent=`Unattempted. Correct answer: (${x.answer})`}else if(responses[current]===x.answer){note.className="answer-note ok";note.textContent="Correct."}else{note.className="answer-note bad";note.textContent=`Wrong. Correct answer: (${x.answer})`}}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm("Submit this test now? You will not be able to change responses afterward."))return;submitted=true;clearInterval(timerId);let c=0,w=0,u=0;questions.forEach((x,i)=>{if(responses[i]===null)u++;else if(responses[i]===x.answer)c++;else w++});const score=c*3-w;result.style.display="block";result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>${score}</strong></div><div class="score-box">Correct<strong>${c}</strong></div><div class="score-box">Wrong<strong>${w}</strong></div><div class="score-box">Attempted<strong>${c+w}</strong></div><div class="score-box">Unattempted<strong>${u}</strong></div></div>`;render();result.scrollIntoView({behavior:"smooth"})}
function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById("time").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(secondsLeft<=0){submitTest(true);return}secondsLeft--}
function calcEval(expr){if(!/^[0-9+\-*/().%\s]+$/.test(expr))return "Error";return Function("return ("+expr.replace(/%/g,"/100")+")")()}
function updateCalcSub(){document.getElementById("calcSubDisplay").textContent=document.getElementById("calcDisplay").value||"0"}
const calcPopup=document.getElementById("calcPopup"),calcHandle=document.getElementById("calcDragHandle");
document.getElementById("calcToggle").onclick=()=>{calcPopup.classList.toggle("open");if(calcPopup.classList.contains("open")&&!calcPopup.dataset.moved){calcPopup.style.left="52%";calcPopup.style.top="120px"}};
document.getElementById("calcClose").onclick=e=>{e.stopPropagation();calcPopup.classList.remove("open")};
document.querySelectorAll("[data-calc]").forEach(btn=>btn.onclick=()=>{const d=document.getElementById("calcDisplay"),v=btn.dataset.calc;if(["MC","MR","MS","M+","M-"].includes(v))return;if(v==="C")d.value="";else if(v==="B")d.value=d.value.slice(0,-1);else if(v==="+/-")d.value=d.value.startsWith("-")?d.value.slice(1):"-"+d.value;else if(v==="sqrt"){try{d.value=Math.sqrt(Number(calcEval(d.value||"0")))}catch{d.value="Error"}}else if(v==="1/x"){try{d.value=1/Number(calcEval(d.value||"0"))}catch{d.value="Error"}}else if(v==="="){try{d.value=calcEval(d.value)}catch{d.value="Error"}}else d.value+=v;updateCalcSub()});
let dragCalc=false,calcDx=0,calcDy=0;
calcHandle.onpointerdown=e=>{dragCalc=true;calcHandle.setPointerCapture(e.pointerId);const r=calcPopup.getBoundingClientRect();calcDx=e.clientX-r.left;calcDy=e.clientY-r.top;calcPopup.style.left=r.left+"px";calcPopup.style.top=r.top+"px";calcPopup.style.right="auto";calcPopup.dataset.moved="1";e.preventDefault()};
calcHandle.onpointermove=e=>{if(!dragCalc)return;const maxX=innerWidth-calcPopup.offsetWidth-4,maxY=innerHeight-calcPopup.offsetHeight-4;calcPopup.style.left=Math.max(4,Math.min(maxX,e.clientX-calcDx))+"px";calcPopup.style.top=Math.max(4,Math.min(maxY,e.clientY-calcDy))+"px"};
calcHandle.onpointerup=e=>{dragCalc=false;try{calcHandle.releasePointerCapture(e.pointerId)}catch{}};
render();tick();timerId=setInterval(tick,1000);
</script></body></html>
