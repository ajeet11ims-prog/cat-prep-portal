<script>const TITLE="DI - Bar Graph - Test - 7",MINUTES=15,questions=[{"group": "set", "q": "In which of the following options is the number of drugs going off patent equal?", "options": ["2004-07, 2001-04, 2002-05", "2005-08, 1999-2002, 2000-03", "2004-07, 2000-03, 2002-05", "1999-2002, 2000-03, 2002-05"], "answer": "D", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Read and add the four annual bars in every period appearing in each option. 1999-2002 gives 4+9+9+7=29, 2000-2003 gives 9+9+7+4=29, and 2002-2005 gives 7+4+8+10=29.<\/li><li><strong>Step 3 - Work through the data:<\/strong> All three periods in option D therefore have the same total.<\/li><li><strong>Step 4 - Select the option:<\/strong> The result corresponds to option (D).<\/li><\/ol><div class='final-answer'>Final Answer: (D)<\/div>"}, {"group": "set", "q": "What is the average number of drugs going off patent from 1999 to 2013 (approximately)?", "options": ["3", "4", "5", "6"], "answer": "C", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Add all fifteen bar values to obtain 76.<\/li><li><strong>Step 3 - Work through the data:<\/strong> There are 15 years from 1999 through 2013.<\/li><li><strong>Step 4 - Work through the data:<\/strong> Average = <span class='math frac'><span>76<\/span><span>15<\/span><\/span> = 5.07, which is approximately 5.<\/li><li><strong>Step 5 - Select the option:<\/strong> The result corresponds to option (C).<\/li><\/ol><div class='final-answer'>Final Answer: (C)<\/div>"}, {"group": "set", "q": "In which five-year period did the minimum number of drugs go off patent?", "options": ["2008-2012", "2009-2013", "2006-2010", "None of these"], "answer": "B", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Add the bars for each proposed five-year window. 2008-2012 gives 4+4+2+1+1 = 12, while 2009-2013 gives 4+2+1+1+3 = 11. 2006-2010 gives 4+6+4+4+2 = 20, so 2009-2013 is the minimum.<\/li><li><strong>Step 3 - Select the option:<\/strong> The result corresponds to option (B).<\/li><\/ol><div class='final-answer'>Final Answer: (B)<\/div>"}],charts={"set": "<svg class=\"chart-svg\" viewBox=\"0 0 820 420\" role=\"img\" aria-label=\"Number of Drugs Going Off Patent (1999-2013)\"><text x=\"410.0\" y=\"30\" text-anchor=\"middle\" class=\"svg-title\">Number of Drugs Going Off Patent (1999-2013)<\/text><defs><pattern id=\"hatch\" width=\"8\" height=\"8\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(35)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"8\" stroke=\"#475569\" stroke-width=\"3\"/><\/pattern><\/defs><line x1=\"82\" y1=\"348.0\" x2=\"786\" y2=\"348.0\" class=\"grid\"/><text x=\"72\" y=\"353.0\" text-anchor=\"end\" class=\"svg-small\">0<\/text><line x1=\"82\" y1=\"289.6\" x2=\"786\" y2=\"289.6\" class=\"grid\"/><text x=\"72\" y=\"294.6\" text-anchor=\"end\" class=\"svg-small\">2.4<\/text><line x1=\"82\" y1=\"231.2\" x2=\"786\" y2=\"231.2\" class=\"grid\"/><text x=\"72\" y=\"236.2\" text-anchor=\"end\" class=\"svg-small\">4.8<\/text><line x1=\"82\" y1=\"172.8\" x2=\"786\" y2=\"172.8\" class=\"grid\"/><text x=\"72\" y=\"177.8\" text-anchor=\"end\" class=\"svg-small\">7.2<\/text><line x1=\"82\" y1=\"114.4\" x2=\"786\" y2=\"114.4\" class=\"grid\"/><text x=\"72\" y=\"119.4\" text-anchor=\"end\" class=\"svg-small\">9.6<\/text><line x1=\"82\" y1=\"56.0\" x2=\"786\" y2=\"56.0\" class=\"grid\"/><text x=\"72\" y=\"61.0\" text-anchor=\"end\" class=\"svg-small\">12<\/text><line x1=\"82\" y1=\"56\" x2=\"82\" y2=\"348\" class=\"axis\"/><line x1=\"82\" y1=\"348.0\" x2=\"786\" y2=\"348.0\" class=\"axis\"/><rect x=\"91.7\" y=\"250.7\" width=\"24.6\" height=\"97.3\" fill=\"#ffffff\" class=\"bar\"/><text x=\"105.5\" y=\"372\" text-anchor=\"middle\" class=\"svg-label\">1999<\/text><rect x=\"138.6\" y=\"129.0\" width=\"24.6\" height=\"219.0\" fill=\"#ffffff\" class=\"bar\"/><text x=\"152.4\" y=\"372\" text-anchor=\"middle\" class=\"svg-label\">2000<\/text><rect x=\"185.5\" y=\"129.0\" width=\"24.6\" height=\"219.0\" fill=\"#ffffff\" class=\"bar\"/><text x=\"199.3\" y=\"372\" text-anchor=\"middle\" class=\"svg-label\">2001<\/text><rect x=\"232.5\" y=\"177.7\" width=\"24.6\" height=\"170.3\" fill=\"#ffffff\" class=\"bar\"/><text x=\"246.3\" y=\"372\" text-anchor=\"middle\" class=\"svg-label\">2002<\/text><rect x=\"279.4\" y=\"250.7\" width=\"24.6\" height=\"97.3\" fill=\"#ffffff\" class=\"bar\"/><text x=\"293.2\" y=\"372\" text-anchor=\"middle\" class=\"svg-label\">2003<\/text><rect x=\"326.3\" y=\"153.3\" width=\"24.6\" height=\"194.7\" fill=\"#ffffff\" class=\"bar\"/><text x=\"340.1\" y=\"372\" text-anchor=\"middle\" class=\"svg-label\">2004<\/text><rect x=\"373.3\" y=\"104.7\" width=\"24.6\" height=\"243.3\" fill=\"#ffffff\" class=\"bar\"/><text x=\"387.1\" y=\"372\" text-anchor=\"middle\" class=\"svg-label\">2005<\/text><rect x=\"420.2\" y=\"250.7\" width=\"24.6\" height=\"97.3\" fill=\"#ffffff\" class=\"bar\"/><text x=\"434.0\" y=\"372\" text-anchor=\"middle\" class=\"svg-label\">2006<\/text><rect x=\"467.1\" y=\"202.0\" width=\"24.6\" height=\"146.0\" fill=\"#ffffff\" class=\"bar\"/><text x=\"480.9\" y=\"372\" text-anchor=\"middle\" class=\"svg-label\">2007<\/text><rect x=\"514.1\" y=\"250.7\" width=\"24.6\" height=\"97.3\" fill=\"#ffffff\" class=\"bar\"/><text x=\"527.9\" y=\"372\" text-anchor=\"middle\" class=\"svg-label\">2008<\/text><rect x=\"561.0\" y=\"250.7\" width=\"24.6\" height=\"97.3\" fill=\"#ffffff\" class=\"bar\"/><text x=\"574.8\" y=\"372\" text-anchor=\"middle\" class=\"svg-label\">2009<\/text><rect x=\"607.9\" y=\"299.3\" width=\"24.6\" height=\"48.7\" fill=\"#ffffff\" class=\"bar\"/><text x=\"621.7\" y=\"372\" text-anchor=\"middle\" class=\"svg-label\">2010<\/text><rect x=\"654.9\" y=\"323.7\" width=\"24.6\" height=\"24.3\" fill=\"#ffffff\" class=\"bar\"/><text x=\"668.7\" y=\"372\" text-anchor=\"middle\" class=\"svg-label\">2011<\/text><rect x=\"701.8\" y=\"323.7\" width=\"24.6\" height=\"24.3\" fill=\"#ffffff\" class=\"bar\"/><text x=\"715.6\" y=\"372\" text-anchor=\"middle\" class=\"svg-label\">2012<\/text><rect x=\"748.7\" y=\"275.0\" width=\"24.6\" height=\"73.0\" fill=\"#ffffff\" class=\"bar\"/><text x=\"762.5\" y=\"372\" text-anchor=\"middle\" class=\"svg-label\">2013<\/text><rect x=\"320.0\" y=\"384\" width=\"16\" height=\"16\" fill=\"#ffffff\" class=\"bar\"/><text x=\"343.0\" y=\"398\" class=\"svg-label\">Number of drugs<\/text><\/svg>"},passages={"set": "Directions for questions 1 to 3: Answer the questions on the basis of the information given below. The following bar chart gives the number of drugs going off patent during the period 1999-2013."};
const labels=["A","B","C","D"];let current=0,submitted=false,secondsLeft=MINUTES*60,timerId=null;
const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false);
const host=document.getElementById("host"),qbar=document.getElementById("qbar"),result=document.getElementById("result");
function renderBar(){qbar.innerHTML=questions.map((_,i)=>`<button class="qdot ${i===current?"current":responses[i]!==null?"answered":""} ${marked[i]?"marked":""}" onclick="go(${i})">${i+1}</button>`).join("")}
function normalize(v){return String(v??"").replaceAll(",","").replace(/rs\.?/gi,"").replace(/%$/,"").replace(/\s+/g," ").trim().toLowerCase()}
function save(){if(submitted)return;const radio=host.querySelector('input[name="answer"]:checked'),typed=host.querySelector('input.typed-answer');if(radio)responses[current]=radio.value;else if(typed)responses[current]=typed.value.trim()||null}
function render(){const x=questions[current],commonText=passages[x.group]?`<p>${passages[x.group]}</p>`:"",control=x.type==="text"?`<input class="typed-answer" name="answer" autocomplete="off" value="${responses[current]??""}" placeholder="Type your answer" ${submitted?"disabled":""}>`:`<div class="options">${x.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${labels[i]}" ${responses[current]===labels[i]?"checked":""} ${submitted?"disabled":""}><span>(${labels[i]}) ${o}</span></label>`).join("")}</div>`;host.innerHTML=`<div class="qhead"><div><div class="qnum">Question ${current+1} of ${questions.length}</div><div class="source">${TITLE} | Source Q${current+1}</div></div></div><div class="block">${commonText}${charts[x.group]}</div><div class="qtext">${x.q}</div>${control}<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Detailed Solution</h3>${x.solution}</div><div class="navrow"><button onclick="markNext()">Mark for Review & Next</button><button onclick="clearResponse()" ${submitted?"disabled":""}>Clear Response</button><button onclick="go(${current-1})">Previous</button><button class="primary" onclick="next()">Save & Next</button></div>`;host.querySelectorAll('input[name="answer"]').forEach(el=>{el.addEventListener("change",()=>{responses[current]=el.value;renderBar()});el.addEventListener("input",()=>{responses[current]=el.value.trim()||null;renderBar()})});if(submitted)review();renderBar()}
function go(i){save();if(i<0||i>=questions.length)return;current=i;render();document.querySelector(".question-card").scrollTop=0}
function next(){save();go(Math.min(current+1,questions.length-1))}
function markNext(){save();marked[current]=true;go(Math.min(current+1,questions.length-1))}
function clearResponse(){if(submitted)return;responses[current]=null;render()}
function isCorrect(x,response){return x.type==="text"?normalize(response)===normalize(x.answer):response===x.answer}
function answerText(x){return x.type==="text"?x.answer:`(${x.answer})`}
function review(){const x=questions[current],note=document.getElementById("note");document.getElementById("solution").style.display="block";if(responses[current]===null){note.className="answer-note muted";note.textContent=`Unattempted. Correct answer: ${answerText(x)}`}else if(isCorrect(x,responses[current])){note.className="answer-note ok";note.textContent="Correct."}else{note.className="answer-note bad";note.textContent=`Wrong. Correct answer: ${answerText(x)}`}}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm("Submit this test now? You will not be able to change responses afterward."))return;submitted=true;clearInterval(timerId);let c=0,w=0,u=0;questions.forEach((x,i)=>{if(responses[i]===null)u++;else if(isCorrect(x,responses[i]))c++;else w++});const score=c*3-w;result.style.display="block";result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>${score}</strong></div><div class="score-box">Correct<strong>${c}</strong></div><div class="score-box">Wrong<strong>${w}</strong></div><div class="score-box">Attempted<strong>${c+w}</strong></div><div class="score-box">Unattempted<strong>${u}</strong></div></div>`;render();result.scrollIntoView({behavior:"smooth"})}
function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById("time").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(secondsLeft<=0){submitTest(true);return}secondsLeft--}
function calcEval(expr){if(!/^[0-9+\-*/().%\s]+$/.test(expr))return "Error";return Function("return ("+expr.replace(/%/g,"/100")+")")()}
function updateCalcSub(){document.getElementById("calcSubDisplay").textContent=document.getElementById("calcDisplay").value||"0"}
const calcPopup=document.getElementById("calcPopup"),calcHandle=document.getElementById("calcDragHandle");
document.getElementById("calcToggle").onclick=()=>{calcPopup.classList.toggle("open");if(calcPopup.classList.contains("open")&&!calcPopup.dataset.moved){calcPopup.style.left="52%";calcPopup.style.top="120px"}};
document.getElementById("calcClose").onclick=e=>{e.stopPropagation();calcPopup.classList.remove("open")};
document.querySelectorAll("[data-calc]").forEach(btn=>btn.onclick=()=>{const d=document.getElementById("calcDisplay"),v=btn.dataset.calc;if(["MC","MR","MS","M+","M-"].includes(v))return;if(v==="C")d.value="";else if(v==="B")d.value=d.value.slice(0,-1);else if(v==="+/-")d.value=d.value.startsWith("-")?d.value.slice(1):"-"+d.value;else if(v==="sqrt"){try{d.value=Math.sqrt(Number(calcEval(d.value||"0")))}catch{d.value="Error"}}else if(v==="1/x"){try{d.value=1/Number(calcEval(d.value||"0"))}catch{d.value="Error"}}else if(v==="="){try{d.value=calcEval(d.value)}catch{d.value="Error"}}else d.value+=v;updateCalcSub()});
let dragCalc=false,calcDx=0,calcDy=0;
calcHandle.onpointerdown=e=>{dragCalc=true;calcHandle.setPointerCapture(e.pointerId);const r=calcPopup.getBoundingClientRect();calcDx=e.clientX-r.left;calcDy=e.clientY-r.top;calcPopup.style.left=r.left+"px";calcPopup.style.top=r.top+"px";calcPopup.style.right="auto";calcPopup.dataset.moved="1";e.preventDefault()};
calcHandle.onpointermove=e=>{if(!dragCalc)return;const maxX=innerWidth-calcPopup.offsetWidth-4,maxY=innerHeight-calcPopup.offsetHeight-4;calcPopup.style.left=Math.max(4,Math.min(maxX,e.clientX-calcDx))+"px";calcPopup.style.top=Math.max(4,Math.min(maxY,e.clientY-calcDy))+"px"};
calcHandle.onpointerup=e=>{dragCalc=false;try{calcHandle.releasePointerCapture(e.pointerId)}catch{}};
render();tick();timerId=setInterval(tick,1000);
</script></body></html>
