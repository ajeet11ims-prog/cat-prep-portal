<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Line Graph Test</title><style>:root{--ink:#101820;--muted:#5f6f7a;--line:#b8c3cc;--brand:#0b75bb;--dark:#24313a;--mid:#4089c8;--soft:#dff3fb;--ok:#60b947;--bad:#e55b25;--review:#7b4ab0;--paper:#fff;--bg:#eef3f7}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;overflow:hidden}.top{height:84px;background:#f3f5f7;border-bottom:1px solid #9eadb9;display:grid;grid-template-columns:minmax(0,1fr) 62px 300px;padding:0}.title{background:var(--dark);color:#fff;padding:10px 18px;display:flex;flex-direction:column;justify-content:center}.title h1{font-size:22px;line-height:1.1;margin:0;color:#fff}.meta{font-size:15px;color:#dce9ef;margin-top:6px}.timer{display:grid;place-items:center;background:#fff;border-left:1px solid #9eadb9;font-weight:700;font-size:18px}.timer span{font-size:22px}.calc-toggle{align-self:center;justify-self:center;width:34px;height:34px;border:1px solid #d89c29;background:#f9c35b;color:#774d00;border-radius:2px;font-weight:800;cursor:pointer}.calc-toggle svg{width:20px;height:20px;display:block;margin:auto}main{height:calc(100vh - 84px);display:grid;grid-template-columns:minmax(0,1fr) 300px;background:#fff}.stage{min-width:0;min-height:0;border-right:2px solid #41515c;display:flex;flex-direction:column;overflow:hidden}.panel{grid-column:2;padding:14px;background:#e5f6fc;display:flex;flex-direction:column;overflow:auto}.panel h2{font-size:18px;margin:0 -14px 14px;padding:10px 14px;background:var(--mid);color:#fff}.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.dot{height:44px;border:1px solid #a9b3bc;background:linear-gradient(#fff,#dfe5ea);border-radius:3px;font-size:18px;font-weight:700;color:#45515a}.dot.active{background:#e85b21;color:#fff;border-color:#c84815;clip-path:polygon(0 0,100% 0,100% 72%,50% 100 padding:0 24px 18px}.option{border:0;padding:4px 0;display:flex;gap:12px;cursor:pointer;background:#fff;font-size:20px;font-weight:700}.option input{margin-top:7px;transform:scale(1.25)}.option:hover span{text-decoration:underline}.note{font-weight:800;font-size:17px;margin:10px 24px}.note.ok{color:#157347}.note.bad{color:#b02a37}.note.muted{color:var(--muted)}.nav,.actions{position:fixed;left:0;right:300px;bottom:0;height:64px;display:flex;gap:10px;align-items:center;padding:10px 16px;background:#eef8fc;border-top:1px solid #b6cbd6;z-index:20}.nav{justify-content:flex-end}.actions{display:none;pointer-events:none}.actions button{display:none}.nav button,.side-submit{border-radius:2px;padding:11px 18px;font-size:16px;font-weight:700}.nav .secondary{background:#fff;color:#2f3b44;border:1px solid #b6c1ca}.nav button:not(.secondary){background:#29a8df;color:#fff;border:1px solid #198fc0}.mark-btn{margin-right:auto!important;background:#fff!important;color:#2f3b44!important}.correct{background:#eef8f2}.wrong{background:#fff1f2}.missed{background:#f5f6f7}#result{display:none;padding:16px;border-bottom:1px solid var(--line)}.score{display:grid;grid-template-columns:repeat(4,minmax(100px,1fr));gap:10px}.score div{border:1px solid var(--line);padding:10px;background:#fbfcfd}.score strong{display:block;font-size:24px}.calculator-dialog{width:300px;border:1px solid #7c8991;border-radius:0;padding:0;box-shadow:0 7px 18px #0005}.calculator-dialog::backdrop{background:transparent}.calc-head{display:flex;justify-content:space-between;align-items:center;background:#4a8fd0;color:#fff;padding:8px 9px;cursor:move;user-select:none;touch-action:none}.calc-head h2{font-size:17px;margin:0}.calc-head button{width:27px;height:27px;border:0;background:#4a8fd0;color:#fff;font-size:22px}.display{width:calc(100% - 18px);margin:9px;height:39px;text-align:right;font-size:20px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:0 9px 9px}.keys button{height:35px;border:1px solid #bababa;background:linear-gradient(#fff,#e7e7e7);font-weight:700}.keys .eq{background:#21c987;color:#fff;grid-column:span 2}.math{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif}.legend text{font-size:12px}.question.active{display:grid;grid-template-columns:minmax(0,60%) minmax(360px,40%);grid-template-rows:52px minmax(0,1fr);overflow:hidden;padding-bottom:64px}.question.active .qhead{grid-column:2;grid-row:1;border-left:1px solid #aeb8bf}.question.active .source{grid-column:1;grid-row:1 / span 2;border-right:1px solid #aeb8bf;border-bottom:0;overflow:auto;min-height:0;padding:12px 14px}.question.active .qbody{grid-column:2;grid-row:2;overflow:auto;min-height:0}.question.active .chart{max-height:none}.question.active .qbody h2{min-height:auto;padding-top:20px}.solution{display:none;margin:14px 24px 28px;padding:16px 18px;border:1px solid #b8c3cc;background:#fbfcfd;font-size:17px;line-height:1.6}.solution h3{margin:0 0 10px;color:#0b75bb;font-size:19px}.formula-box{margin:12px 0;padding:12px 14px;border:2px solid #2d7fb8;background:#f4fbff;font-weight:700}.solution-steps{margin:10px 0 0 24px;padding:0}.solution-steps li{margin:0 0 8px}.final-answer{margin-top:14px;padding:10px 12px;background:#fff7df;border:1px solid #e4c86d;font-size:18px;font-weight:800}.math-nowrap{white-space:nowrap}.frac{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;line-height:1.05}.frac span:first-child{border-bottom:1.6px solid currentColor;padding:0 .2em}.frac span:last-child{padding:0 .2em}.math sup,.solution sup{font-size:.72em;vertical-align:super;line-height:0}.calc-subdisplay{height:27px;margin:-9px 9px 9px;padding:3px 8px;border:1px solid #d0d0d0;background:#fff;text-align:right;color:#666}.cat-keys{grid-template-columns:repeat(5,1fr)}.cat-keys .eq{grid-column:auto;grid-row:span 2;height:75px}.cat-keys .red{background:#e35d4f;color:#fff;border-color:#c94a3d}.cat-keys .op{background:#e9edf2}@media(max-width:980px){html,body{overflow:auto;height:auto}.top{height:auto;grid-template-columns:1fr 62px 1fr}main{height:auto;display:block}.stage{border:0}.panel{min-height:260px}.palette{grid-template-columns:repeat(8,1fr)}.question{height:auto;min-height:70vh;padding-bottom:16px}.question.active{display:block;overflow:visible;padding-bottom:16px}.question.active .qhead,.question.active .source,.question.active .qbody{display:block;overflow:visible;border-left:0;border-right:0}.question.active .source{border-bottom:1px solid #d7dde5}.question.active .chart{max-height:none}.nav,.actions{position:static;right:auto}.chart{max-height:none}.score{grid-template-columns:1fr 1fr}}

<header class="top"><div class="title"><h1 id="title"></h1><div class="meta" id="meta"></div></div><button id="calcOpen" class="calc-toggle" title="Open CAT calculator" aria-label="Open calculator"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2" fill="#fff4cf" stroke="#8f6500" stroke-width="1.7"/><rect x="8" y="5" width="8" height="3" rx=".6" fill="#8f6500"/><circle cx="8.5" cy="12" r="1.2" fill="#8f6500"/><circle cx="12" cy="12" r="1.2" fill="#8f6500"/><circle cx="15.5" cy="12" r="1.2" fill="#8f6500"/><circle cx="8.5" cy="16" r="1.2" fill="#8f6500"/><circle cx="12" cy="16" r="1.2" fill="#8f6500"/><circle cx="15.5" cy="16" r="1.2" fill="#8f6500"/></svg></button><div class="timer">Time Left: <span id="time"></span></div></header>
<main><section class="stage"><section id="result"></section><form id="form" autocomplete="off"></form></section><aside class="panel"><h2>Question Bar</h2><div class="palette" id="palette"></div><div class="legend"><span><i class="key current"></i>Current</span><span><i class="key answered"></i>Answered</span><span><i class="key marked"></i>Marked</span></div><button id="sideSubmit" class="side-submit">Submit</button></aside></main>
<dialog class="calculator-dialog" id="calculator"><div class="calc-head"><h2>CAT On-Screen Calculator</h2><button id="calcClose">×</button></div><input id="display" class="display" value="0" readonly><div class="calc-subdisplay" id="calcSub">0</div><div id="keys" class="keys cat-keys"><button data-calc="MC">MC</button><button data-calc="MR">MR</button><button data-calc="MS">MS</button><button data-calc="M+">M+</button><button data-calc="M-">M-</button><button class="red" data-calc="B">Back</button><button class="red" data-calc="C">C</button><button class="red" data-calc="+/-">+/−</button><button data-calc="sqrt">√</button><button data-calc="%">%</button><button data-calc="7">7</button><button data-calc="8">8</button><button data-calc="9">9</button><button class="op" data-calc="/">÷</button><button data-calc="1/x">1/x</button><button data-calc="4">4</button><button data-calc="5">5</button><button data-calc="6">6</button><button class="op" data-calc="*">×</button><button class="eq" data-calc="=">=</button><button data-calc="1">1</button><button data-calc="2">2</button><button data-calc="3">3</button><button class="op" data-calc="-">−</button><button data-calc="0">0</button><button data-calc=".">.</button><button class="op" data-calc="+">+</button></div></dialog>
<script>function lineChart(c){const W=760,H=430,l=72,r=20,t=45,b=65,pw=W-l-r,ph=H-t-b;let vals=c.series.flatMap(s=>s.v),min=c.min??Math.min(0,...vals),max=c.max??Math.max(...vals),xs=c.x.map((_,i)=>l+(c.x.length===1?0:i*pw/(c.x.length-1))),y=v=>t+(max-v)*ph/(max-min);let ticks=c.ticks||Array.from({length:6},(_,i)=>min+i*(max-min)/5);let out=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${c.title}"><text x="380" y="24" text-anchor="middle" font-size="17" font-weight="700">${c.title}</text>`;ticks.forEach(v=>out+=`<line class="grid" x1="${l}" y1="${y(v)}" x2="${W-r}" y2="${y(v)}"/><text x="${l-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`);out+=`<line class="axis" x1="${l}" y1="${t}" x2="${l}" y2="${H-b}"/><line class="axis" x1="${l}" y1="${H-b}" x2="${W-r}" y2="${H-b}"/>`;c.x.forEach((v,i)=>out+=`<text x="${xs[i]}" y="${H-b+24}" text-anchor="middle">${v}</text>`);c.series.forEach((s,k)=>{let pts=s.v.map((v,i)=>`${xs[i]},${y(v)}`).join(' ');out+=`<polyline class="series ${k%2?'dash':''}" points="${pts}"/>`;s.v.forEach((v,i)=>out+=k%3===0?`<circle class="marker" cx="${xs[i]}" cy="${y(v)}" r="4"/>`:k%3===1?`<rect class="marker" x="${xs[i]-4}" y="${y(v)-4}" width="8" height="8"/>`:`<polygon class="marker" points="${xs[i]},${y(v)-6} ${xs[i]-6},${y(v)+5} ${xs[i]+6},${y(v)+5}"/>`)});out+=`<text x="380" y="${H-8}" text-anchor="middle">${c.xlabel||''}</text><text x="18" y="220" text-anchor="middle" transform="rotate(-90 18 220)">${c.ylabel||''}</text><g class="legend">`;c.series.forEach((s,k)=>out+=`<text x="${90+k*155}" y="${H-30}">${['●','■','▲'][k%3]} ${s.n}</text>`);return out+'</g></svg>'}
function companyScatter(){const W=760,H=500,l=85,r=165,t=45,b=70,pw=W-l-r,ph=H-t-b,x=v=>l+v/5000*pw,y=v=>t+(500-v)/500*ph,steel=[[1200,220],[1200,160],[2300,120],[2800,330],[3400,270]],textile=[[800,120],[1700,220],[2800,120],[3700,220]],cement=[[2200,180],[2200,270],[2700,370],[3300,150]];let out=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Profit and turnover scatter plot by industry"><text x="300" y="25" text-anchor="middle" font-size="18" font-weight="700">Profit versus Turnover</text>`;for(let v=0;v<=500;v+=100)out+=`<line class="grid" x1="${l}" y1="${y(v)}" x2="${W-r}" y2="${y(v)}"/><text x="${l-10}" y="${y(v)+5}" text-anchor="end">${v}</text>`;for(let v=0;v<=5000;v+=1000)out+=`<line class="grid" x1="${x(v)}" y1="${t}" x2="${x(v)}" y2="${H-b}"/><text x="${x(v)}" y="${H-b+24}" text-anchor="middle">${v}</text>`;out+=`<line class="axis" x1="${l}" y1="${t}" x2="${l}" y2="${H-b}"/><line class="axis" x1="${l}" y1="${H-b}" x2="${W-r}" y2="${H-b}"/><text x="${l+pw/2}" y="${H-16}" text-anchor="middle" font-weight="700">Turnover</text><text x="25" y="${t+ph/2}" text-anchor="middle" transform="rotate(-90 25 ${t+ph/2})" font-weight="700">Profit</text>`;steel.forEach(p=>out+=`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="6" fill="#fff" stroke="#111" stroke-width="2"/>`);textile.forEach(p=>out+=`<polygon points="${x(p[0])},${y(p[1])-7} ${x(p[0])-7},${y(p[1])+6} ${x(p[0])+7},${y(p[1])+6}" fill="#fff" stroke="#111" stroke-width="2"/>`);cement.forEach(p=>out+=`<rect x="${x(p[0])-6}" y="${y(p[1])-6}" width="12" height="12" fill="#fff" stroke="#111" stroke-width="2"/>`);const lx=W-r+28;out+=`<rect x="${W-r+8}" y="145" width="145" height="145" fill="#fff" stroke="#111"/><circle cx="${lx}" cy="180" r="6" fill="#fff" stroke="#111" stroke-width="2"/><text x="${lx+18}" y="185">Steel</text><polygon points="${lx},213 ${lx-7},226 ${lx+7},226" fill="#fff" stroke="#111" stroke-width="2"/><text x="${lx+18}" y="225">Textile</text><rect x="${lx-6}" y="252" width="12" height="12" fill="#fff" stroke="#111" stroke-width="2"/><text x="${lx+18}" y="263">Cement</text></svg>`;return out}
function boot(){const L=['A','B','C','D'];let current=0,submitted=false,left=TEST.minutes*60;const marked=new Set(),form=document.querySelector('#form'),palette=document.querySelector('#palette');
function solutionHTML(x){const index=TEST.questions.indexOf(x),custom=typeof SOLUTIONS!=='undefined'&&SOLUTIONS[index];if(custom)return '<h3>Detailed Solution</h3><div class="worked-solution">'+custom+'</div><div class="final-answer">Final Answer: ('+x.a+') '+x.o[L.indexOf(x.a)]+'</div>';const q=x.q.toLowerCase();let formula='<span class="math">Required value = value read from the graph</span>';if(q.includes('average'))formula='<span class="math">Average = <span class="frac"><span>Sum of observations</span><span>Number of observations</span></span></span>';else if(q.includes('percentage')||q.includes('percent')||q.includes('growth'))formula='<span class="math">Percentage change = <span class="frac"><span>New value − Original value</span><span>Original value</span></span> × 100</span>';return '<h3>Detailed Solution</h3><div class="formula-box">'+formula+'</div><p>Read the required values from the graph, apply the displayed relationship and compare the result with the options.</p><div class="final-answer">Final Answer: ('+x.a+') '+x.o[L.indexOf(x.a)]+'</div>'}
function render(){document.querySelector('title').textContent=TEST.title;document.querySelector('#title').textContent=TEST.title;document.querySelector('#meta').textContent=`CL Jaipur | LRDI | ${TEST.title} | ${TEST.questions.length} Questions | ${TEST.minutes} Minutes | +3 correct, -1 wrong`;form.innerHTML=TEST.questions.map((x,i)=>`<article class="question" id="card${i}"><div class="qhead">Question ${i+1} of ${TEST.questions.length}</div><section class="source"><p class="directions"><strong>${TEST.sets[x.set].text}</strong></p>${TEST.sets[x.set].svg}</section><section class="qbody"><h2>Q${i+1}. ${x.q}</h2><div class="options">${x.o.map((v,j)=>`<label class="option"><input type="radio" name="q${i}" value="${L[j]}"><span>(${L[j]}) ${v}</span></label>`).join('')}</div><div class="note" id="note${i}"></div><div class="solution" id="solution${i}">${solutionHTML(x)}</div></section></article>`).join('')+`<div class="nav"><button type="button" class="mark-btn" id="mark">Mark for Review & Next</button><button type="button" class="secondary" id="clear">Clear Response</button><button type="button" id="next">Save & Next</button></div><div class="actions"><button type="submit" id="submit">Submit Test</button></div>`;palette.innerHTML=TEST.questions.map((_,i)=>`<button type="button" class="dot" data-i="${i}">${i+1}</button>`).join('');form.querySelectorAll('input').forEach(e=>e.addEventListener('change',state));palette.querySelectorAll('.dot').forEach(e=>e.onclick=()=>show(+e.dataset.i));document.querySelector('#next').onclick=()=>show(current+1);document.querySelector('#mark').onclick=()=>{marked.has(current)?marked.delete(current):marked.add(current);state();show(Math.min(current+1,TEST.questions.length-1))};document.querySelector('#clear').onclick=()=>{if(submitted)return;form.querySelectorAll(`[name="q${current}"]`).forEach(e=>e.checked=false);state()};document.querySelector('#sideSubmit').onclick=()=>submit();show(0);state()}
function ans(i){return form.querySelector(`input[name="q${i}"]:checked`)?.value||''}function state(){TEST.questions.forEach((_,i)=>{let d=palette.querySelector(`[data-i="${i}"]`);d.classList.toggle('answered',!!ans(i));d.classList.toggle('marked',marked.has(i))});document.querySelector('#mark').textContent=marked.has(current)?'Unmark & Next':'Mark for Review & Next'}function show(i){if(i<0||i>=TEST.questions.length)return;current=i;form.querySelectorAll('.question').forEach((e,j)=>e.classList.toggle('active',j===i));palette.querySelectorAll('.dot').forEach((e,j)=>e.classList.toggle('active',j===i));document.querySelector('#next').disabled=i===TEST.questions.length-1||submitted;state();requestAnimationFrame(()=>window.drawNativeCharts?.())}
function submit(e){e?.preventDefault();if(submitted)return;submitted=true;let c=0,w=0,u=0;TEST.questions.forEach((x,i)=>{let a=ans(i),card=document.querySelector(`#card${i}`),note=document.querySelector(`#note${i}`),solution=document.querySelector(`#solution${i}`);solution.style.display="block";form.querySelectorAll(`[name="q${i}"]`).forEach(z=>z.disabled=true);if(!a){u++;card.classList.add('missed');note.className='note muted';note.textContent=`Unattempted. Correct answer: (${x.a}) ${x.o[L.indexOf(x.a)]}`}else if(a===x.a){c++;card.classList.add('correct');note.className='note ok';note.textContent=`Correct: (${x.a}) ${x.o[L.indexOf(x.a)]}`}else{w++;card.classList.add('wrong');note.className='note bad';note.textContent=`Incorrect. Correct answer: (${x.a}) ${x.o[L.indexOf(x.a)]}`}});document.querySelector('#result').style.display='block';document.querySelector('#result').innerHTML=`<div class="score"><div>Score<strong>${c*3-w}</strong></div><div>Correct<strong>${c}</strong></div><div>Wrong<strong>${w}</strong></div><div>Unattempted<strong>${u}</strong></div></div>`;document.querySelectorAll('#next,#submit,#clear,#mark,#sideSubmit').forEach(e=>e.disabled=true);show(current)}
