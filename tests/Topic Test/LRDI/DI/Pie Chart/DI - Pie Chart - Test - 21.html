function normalize(v){return String(v??"").replaceAll(",","").replace(/rs\.?/gi,"").replace(/%$/,"").replace(/\s+/g," ").trim().toLowerCase()}
function save(){if(submitted)return;const radio=host.querySelector('input[name="answer"]:checked'),typed=host.querySelector('input.typed-answer');if(radio)responses[current]=radio.value;else if(typed)responses[current]=typed.value.trim()||null}
function render(){const x=questions[current],commonText=passages[x.group]?`<div class="common-info">${passages[x.group]}</div>`:"",control=x.type==="text"?`<input class="typed-answer" name="answer" autocomplete="off" value="${responses[current]??""}" placeholder="Type your answer" ${submitted?"disabled":""}>`:`<div class="options">${x.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${labels[i]}" ${responses[current]===labels[i]?"checked":""} ${submitted?"disabled":""}><span>(${labels[i]}) ${o}</span></label>`).join("")}</div>`;host.innerHTML=`<section class="common-panel"><div class="block">${commonText}${charts[x.group]}<div id="solution" class="solution"><h3>Detailed Solution</h3>${x.solution}</div></div></section><section class="question-panel"><div class="qhead"><div><div class="qnum">Question ${current+1} of ${questions.length}</div><div class="source">${TITLE} | Source Q${current+1}</div></div></div><div class="question-body"><div class="qtext">${x.q}</div>${control}<div id="note" class="answer-note"></div></div><div class="navrow"><button class="mark-btn" onclick="markNext()">Mark for Review & Next</button><button class="clear-btn" onclick="clearResponse()" ${submitted?"disabled":""}>Clear Response</button><button class="previous-btn" onclick="go(${current-1})">Previous</button><button class="primary save-btn" onclick="next()">Save & Next</button></div></section>`;host.querySelectorAll('input[name="answer"]').forEach(el=>{el.addEventListener("change",()=>{responses[current]=el.value;renderBar()});el.addEventListener("input",()=>{responses[current]=el.value.trim()||null;renderBar()})});if(submitted)review();renderBar()}
function go(i){save();if(i<0||i>=questions.length)return;current=i;render();document.querySelector(".question-card").scrollTop=0}
function next(){save();go(Math.min(current+1,questions.length-1))}
function markNext(){save();marked[current]=true;go(Math.min(current+1,questions.length-1))}
function clearResponse(){if(submitted)return;responses[current]=null;render()}
function isCorrect(x,response){return x.type==="text"?normalize(response)===normalize(x.answer):response===x.answer}
function answerText(x){return x.type==="text"?x.answer:`(${x.answer})`}
function review(){const x=questions[current],note=document.getElementById("note");document.getElementById("solution").style.display="block";if(responses[current]===null){note.className="answer-note muted";note.textContent=`Unattempted. Correct answer: ${answerText(x)}`}else if(isCorrect(x,responses[current])){note.className="answer-note ok";note.textContent="Correct."}else{note.className="answer-note bad";note.textContent=`Wrong. Correct answer: ${answerText(x)}`}}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm("Submit this test now? You will not be able to change responses afterward."))return;submitted=true;clearInterval(timerId);let c=0,w=0,u=0;questions.forEach((x,i)=>{if(responses[i]===null)u++;else if(isCorrect(x,responses[i]))c++;else w++});const score=c*3-w;result.style.display="block";result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>${score}</strong></div><div class="score-box">Correct<strong>${c}</strong></div><div class="score-box">Wrong<strong>${w}</strong></div><div class="score-box">Attempted<strong>${c+w}</strong></div><div class="score-box">Unattempted<strong>${u}</strong></div></div>`;render();result.scrollIntoView({behavior:"smooth"})}
function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById("time").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(secondsLeft<=0){submitTest(true);return}secondsLeft--}
function calcEval(expr){if(!/^[0-9+\-*/().%\s]+$/.test(expr))return "Error";return Function("return ("+expr.replace(/%/g,"/100")+")")()}
function updateCalcSub(){document.getElementById("calcSubDisplay").textContent=document.getElementById("calcDisplay").value||"0"}
const calcPopup=document.getElementById("calcPopup"),calcHandle=document.getElementById("calcDragHandle"),calcClose=document.getElementById("calcClose");
function closeCalculator(e){if(e){e.preventDefault();e.stopPropagation()}dragCalc=false;calcPopup.classList.remove("open");calcPopup.hidden=true;calcPopup.setAttribute("aria-hidden","true")}
document.getElementById("calcToggle").onclick=()=>{if(calcPopup.classList.contains("open")){closeCalculator();return}calcPopup.hidden=false;calcPopup.setAttribute("aria-hidden","false");calcPopup.classList.add("open");if(!calcPopup.dataset.moved){calcPopup.style.left="52%";calcPopup.style.top="120px"}};
calcClose.addEventListener("pointerdown",closeCalculator);
calcClose.addEventListener("click",closeCalculator);
calcPopup.addEventListener("click",e=>{if(e.target.closest("#calcClose"))closeCalculator(e)},true);
document.querySelectorAll("[data-calc]").forEach(btn=>btn.onclick=()=>{const d=document.getElementById("calcDisplay"),v=btn.dataset.calc;if(["MC","MR","MS","M+","M-"].includes(v))return;if(v==="C")d.value="";else if(v==="B")d.value=d.value.slice(0,-1);else if(v==="+/-")d.value=d.value.startsWith("-")?d.value.slice(1):"-"+d.value;else if(v==="sqrt"){try{d.value=Math.sqrt(Number(calcEval(d.value||"0")))}catch{d.value="Error"}}else if(v==="1/x"){try{d.value=1/Number(calcEval(d.value||"0"))}catch{d.value="Error"}}else if(v==="="){try{d.value=calcEval(d.value)}catch{d.value="Error"}}else d.value+=v;updateCalcSub()});
let dragCalc=false,calcDx=0,calcDy=0;
calcHandle.onpointerdown=e=>{if(e.target.closest("#calcClose"))return;dragCalc=true;const r=calcPopup.getBoundingClientRect();calcDx=e.clientX-r.left;calcDy=e.clientY-r.top;calcPopup.style.left=r.left+"px";calcPopup.style.top=r.top+"px";calcPopup.style.right="auto";calcPopup.dataset.moved="1";e.preventDefault()};
document.addEventListener("pointermove",e=>{if(!dragCalc)return;const maxX=innerWidth-calcPopup.offsetWidth-4,maxY=innerHeight-calcPopup.offsetHeight-4;calcPopup.style.left=Math.max(4,Math.min(maxX,e.clientX-calcDx))+"px";calcPopup.style.top=Math.max(4,Math.min(maxY,e.clientY-calcDy))+"px"});
document.addEventListener("pointerup",()=>{dragCalc=false});
document.addEventListener("pointercancel",()=>{dragCalc=false});
render();tick();timerId=setInterval(tick,1000);
</script></body></html>
