fficial solution method):<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Identify the required quantity:<\/strong> Read the relevant chart, table or network, note exactly what is asked, and retain the units given in the source.<\/li><li><strong>Step 2 - Set up the method:<\/strong> Select the applicable relationship from the official solution method, then substitute the source values before simplifying.<\/li><li><strong>Step 3 - Substitute and calculate:<\/strong> Compute selected counts per credit from each group, then aggregate by section.<\/li><li><strong>Step 4 - Derive the needed value:<\/strong> Compare each selected count with that section’s pie-chart share.<\/li><li><strong>Step 5 - Derive the needed value:<\/strong> S3 gives the largest selected-to-total proportion.<\/li><li><strong>Step 6 - Verify the result:<\/strong> Check the arithmetic, units and direction of comparison against the original chart or table before choosing the option.<\/li><li><strong>Step 7 - Select the option:<\/strong> The result corresponds to option (B).<\/li><\/ol><div class='final-answer'>Final Answer: (B)<\/div>"}, {"group": "set", "q": "What was the total amount paid as cash-back to customers with 39 credits or more?", "options": ["Rs.30,000", "Rs.36,000", "Rs.37,200", "Rs.44,400"], "answer": "D", "solution": "<p><strong>Detailed step-by-step solution (checked with the official solution method):<\/strong><\/p><div class='solution-formula'><strong>Formula / calculation used:<\/strong><div>Group E has 8 selected customers per credit; credits 39 and 40 contribute 2×8×900 = Rs.14,400.<\/div><div>Group F has 6 per credit across five credits: 5×6×1,000 = Rs.30,000.<\/div><div>Total = Rs.44,400.<\/div><\/div><ol class='solution-steps'><li><strong>Step 1 - Identify the required quantity:<\/strong> Read the relevant chart, table or network, note exactly what is asked, and retain the units given in the source.<\/li><li><strong>Step 2 - Set up the method:<\/strong> Select the applicable relationship from the official solution method, then substitute the source values before simplifying.<\/li><li><strong>Step 3 - Substitute and calculate:<\/strong> Group E has 8 selected customers per credit; credits 39 and 40 contribute 2×8×900 = Rs.14,400.<\/li><li><strong>Step 4 - Substitute and calculate:<\/strong> Group F has 6 per credit across five credits: 5×6×1,000 = Rs.30,000.<\/li><li><strong>Step 5 - Substitute and calculate:<\/strong> Total = Rs.44,400.<\/li><li><strong>Step 6 - Verify the result:<\/strong> Check the arithmetic, units and direction of comparison against the original chart or table before choosing the option.<\/li><li><strong>Step 7 - Select the option:<\/strong> The result corresponds to option (D).<\/li><\/ol><div class='final-answer'>Final Answer: (D)<\/div>"}, {"group": "set", "q": "What percentage of the total amount paid as cash back was to customers with at least 29 and at most 33 credits?", "options": ["7.5%", "13.8%", "15.2%", "17.3%"], "answer": "C", "solution": "<p><strong>Detailed step-by-step solution (checked with the official solution method):<\/strong><\/p><div class='solution-formula'><strong>Formula / calculation used:<\/strong><div>Credits 29-30 contribute 2×6×700 = Rs.8,400.<\/div><div>Credits 31-33 contribute 3×6×800 = Rs.14,400.<\/div><div>Total Rs.22,800; <span class='math frac'><span>22,800<\/span><span>1,50,000<\/span><\/span> ×100 = 15.2%.<\/div><\/div><ol class='solution-steps'><li><strong>Step 1 - Identify the required quantity:<\/strong> Read the relevant chart, table or network, note exactly what is asked, and retain the units given in the source.<\/li><li><strong>Step 2 - Set up the method:<\/strong> Select the applicable relationship from the official solution method, then substitute the source values before simplifying.<\/li><li><strong>Step 3 - Substitute and calculate:<\/strong> Credits 29-30 contribute 2×6×700 = Rs.8,400.<\/li><li><strong>Step 4 - Substitute and calculate:<\/strong> Credits 31-33 contribute 3×6×800 = Rs.14,400.<\/li><li><strong>Step 5 - Substitute and calculate:<\/strong> Total Rs.22,800; <span class='math frac'><span>22,800<\/span><span>1,50,000<\/span><\/span> ×100 = 15.2%.<\/li><li><strong>Step 6 - Verify the result:<\/strong> Check the arithmetic, units and direction of comparison against the original chart or table before choosing the option.<\/li><li><strong>Step 7 - Select the option:<\/strong> The result corresponds to option (C).<\/li><\/ol><div class='final-answer'>Final Answer: (C)<\/div>"}],charts={"set": "<div class=\"chart-grid\"><div class=\"chart-card pie-card\"><svg class=\"chart-svg pie-svg\" viewBox=\"0 0 520 390\" role=\"img\" aria-label=\"Customers by section\"><text x=\"260\" y=\"31\" text-anchor=\"middle\" class=\"svg-title\">Customers by section<\/text><path d=\"M 187.20 187.20 L 187.20 74.10 A 113.10 113.10 0 0 1 253.68 278.70 Z\" fill=\"#2f80ed\" class=\"pie-slice\"/><text x=\"258.2\" y=\"169.1\" text-anchor=\"middle\" class=\"svg-value pie-value\">40%<\/text><path d=\"M 187.20 187.20 L 253.68 278.70 A 113.10 113.10 0 0 1 187.20 300.30 Z\" fill=\"#f2994a\" class=\"pie-slice\"/><text x=\"210.3\" y=\"263.2\" text-anchor=\"middle\" class=\"svg-value pie-value\">10%<\/text><path d=\"M 187.20 187.20 L 187.20 300.30 A 113.10 113.10 0 0 1 120.72 278.70 Z\" fill=\"#27ae60\" class=\"pie-slice\"/><text x=\"164.1\" y=\"263.2\" text-anchor=\"middle\" class=\"svg-value pie-value\">10%<\/text><path d=\"M 187.20 187.20 L 120.72 278.70 A 113.10 113.10 0 0 1 95.70 253.68 Z\" fill=\"#9b51e0\" class=\"pie-slice\"/><line x1=\"107.2\" y1=\"267.2\" x2=\"87.2\" y2=\"287.2\" class=\"value-guide\"/><text x=\"87.2\" y=\"292.2\" text-anchor=\"end\" class=\"svg-value pie-value\">5%<\/text><path d=\"M 187.20 187.20 L 95.70 253.68 A 113.10 113.10 0 0 1 74.10 187.20 Z\" fill=\"#eb5757\" class=\"pie-slice\"/><text x=\"116.2\" y=\"215.3\" text-anchor=\"middle\" class=\"svg-value pie-value\">10%<\/text><path d=\"M 187.20 187.20 L 74.10 187.20 A 113.10 113.10 0 0 1 79.64 152.25 Z\" fill=\"#0097a7\" class=\"pie-slice\"/><line x1=\"75.5\" y1=\"169.5\" x2=\"47.6\" y2=\"165.1\" class=\"value-guide\"/><text x=\"47.6\" y=\"170.1\" text-anchor=\"end\" class=\"svg-value pie-value\">5%<\/text><path d=\"M 187.20 187.20 L 79.64 152.25 A 113.10 113.10 0 0 1 187.20 74.10 Z\" fill=\"#f2c94c\" class=\"pie-slice\"/><text x=\"143.3\" y=\"131.8\" text-anchor=\"middle\" class=\"svg-value pie-value\">20%<\/text><rect x=\"364.0\" y=\"57\" width=\"18\" height=\"18\" fill=\"#2f80ed\" class=\"pie-slice\"/><text x=\"391.0\" y=\"72\" class=\"svg-label\">S0 (17 or below)<\/text><rect x=\"364.0\" y=\"86\" width=\"18\" height=\"18\" fill=\"#f2994a\" class=\"pie-slice\"/><text x=\"391.0\" y=\"101\" class=\"svg-label\">S1 (18)<\/text><rect x=\"364.0\" y=\"115\" width=\"18\" height=\"18\" fill=\"#27ae60\" class=\"pie-slice\"/><text x=\"391.0\" y=\"130\" class=\"svg-label\">S2 (19-23)<\/text><rect x=\"364.0\" y=\"144\" width=\"18\" height=\"18\" fill=\"#9b51e0\" class=\"pie-slice\"/><text x=\"391.0\" y=\"159\" class=\"svg-label\">S3 (24-28)<\/text><rect x=\"364.0\" y=\"173\" width=\"18\" height=\"18\" fill=\"#eb5757\" class=\"pie-slice\"/><text x=\"391.0\" y=\"188\" class=\"svg-label\">S4 (29-33)<\/text><rect x=\"364.0\" y=\"202\" width=\"18\" height=\"18\" fill=\"#0097a7\" class=\"pie-slice\"/><text x=\"391.0\" y=\"217\" class=\"svg-label\">S5 (34-38)<\/text><rect x=\"364.0\" y=\"231\" width=\"18\" height=\"18\" fill=\"#f2c94c\" class=\"pie-slice\"/><text x=\"391.0\" y=\"246\" class=\"svg-label\">S6 (39-45)<\/text><\/svg><\/div><div class=\"chart-card pie-card\"><svg class=\"chart-svg pie-svg\" viewBox=\"0 0 520 390\" role=\"img\" aria-label=\"Cash-back value by group — Rs.1,50,000\"><text x=\"260\" y=\"31\" text-anchor=\"middle\" class=\"svg-title\">Cash-back value by group — Rs.1,50,000<\/text><path d=\"M 187.20 187.20 L 187.20 74.10 A 113.10 113.10 0 0 1 228.83 82.04 Z\" fill=\"#2f80ed\" class=\"pie-slice\"/><line x1=\"208.4\" y1=\"76.1\" x2=\"213.7\" y2=\"48.3\" class=\"value-guide\"/><text x=\"213.7\" y=\"53.3\" text-anchor=\"start\" class=\"svg-value pie-value\">6%<\/text><path d=\"M 187.20 187.20 L 228.83 82.04 A 113.10 113.10 0 0 1 300.08 194.30 Z\" fill=\"#f2994a\" class=\"pie-slice\"/><text x=\"250.2\" y=\"152.2\" text-anchor=\"middle\" class=\"svg-value pie-value\">20%<\/text><path d=\"M 187.20 187.20 L 300.08 194.30 A 113.10 113.10 0 0 1 253.68 278.70 Z\" fill=\"#27ae60\" class=\"pie-slice\"/><text x=\"252.6\" y=\"228.2\" text-anchor=\"middle\" class=\"svg-value pie-value\">14%<\/text><path d=\"M 187.20 187.20 L 253.68 278.70 A 113.10 113.10 0 0 1 145.57 292.36 Z\" fill=\"#9b51e0\" class=\"pie-slice\"/><text x=\"196.6\" y=\"266.3\" text-anchor=\"middle\" class=\"svg-value pie-value\">16%<\/text><path d=\"M 187.20 187.20 L 145.57 292.36 A 113.10 113.10 0 0 1 79.64 152.25 Z\" fill=\"#eb5757\" class=\"pie-slice\"/><text x=\"119.7\" y=\"224.0\" text-anchor=\"middle\" class=\"svg-value pie-value\">24%<\/text><path d=\"M 187.20 187.20 L 79.64 152.25 A 113.10 113.10 0 0 1 187.20 74.10 Z\" fill=\"#0097a7\" class=\"pie-slice\"/><text x=\"143.3\" y=\"131.8\" text-anchor=\"middle\" class=\"svg-value pie-value\">20%<\/text><rect x=\"364.0\" y=\"57\" width=\"18\" height=\"18\" fill=\"#2f80ed\" class=\"pie-slice\"/><text x=\"391.0\" y=\"72\" class=\"svg-label\">A<\/text><rect x=\"364.0\" y=\"86\" width=\"18\" height=\"18\" fill=\"#f2994a\" class=\"pie-slice\"/><text x=\"391.0\" y=\"101\" class=\"svg-label\">B<\/text><rect x=\"364.0\" y=\"115\" width=\"18\" height=\"18\" fill=\"#27ae60\" class=\"pie-slice\"/><text x=\"391.0\" y=\"130\" class=\"svg-label\">C<\/text><rect x=\"364.0\" y=\"144\" width=\"18\" height=\"18\" fill=\"#9b51e0\" class=\"pie-slice\"/><text x=\"391.0\" y=\"159\" class=\"svg-label\">D<\/text><rect x=\"364.0\" y=\"173\" width=\"18\" height=\"18\" fill=\"#eb5757\" class=\"pie-slice\"/><text x=\"391.0\" y=\"188\" class=\"svg-label\">E<\/text><rect x=\"364.0\" y=\"202\" width=\"18\" height=\"18\" fill=\"#0097a7\" class=\"pie-slice\"/><text x=\"391.0\" y=\"217\" class=\"svg-label\">F<\/text><\/svg><\/div><\/div><div class=\"chart-card\"><h3 style=\"text-align:center\">Cash-back rules<\/h3><table class=\"data-table\"><thead><tr><th>Group<\/th><th>Credits<\/th><th>Cash-back<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>18, 19, 20<\/td><td>Rs.500<\/td><\/tr><tr><td>B<\/td><td>21-25<\/td><td>Rs.600<\/td><\/tr><tr><td>C<\/td><td>26-30<\/td><td>Rs.700<\/td><\/tr><tr><td>D<\/td><td>31-35<\/td><td>Rs.800<\/td><\/tr><tr><td>E<\/td><td>36-40<\/td><td>Rs.900<\/td><\/tr><tr><td>F<\/td><td>41-45<\/td><td>Rs.1,000<\/td><\/tr><\/tbody><\/table><\/div>"},passages={"set": "<p><b>Directions for questions 11 to 14: Answer the questions on the basis of the information given below.<\/b><\/p><p>Electronics Shoppy, a leading white goods retailer, was running a special sales promotion at its outlet in which, for every 1000 rupees that a customer spent on buying electronic items at the shop, the customer would get 1 credit. The marketing department classified the total number of customers into seven different sections - S0, S1, S2, S3, S4, S5, S6 - according to their respective number of credits. The following pie chart gives the percentage wise break up of the number of customers classified into each of these seven sections. In the pie chart, the values given in the brackets alongside each section give the minimum and maximum number of credits got by any customer classified into that section.<\/p><p>To encourage customers to spend more at their outlet, the management decided to give cash-backs to some of the customers from among those who had at least 18 credits. While deciding the cash-backs the management decided to classify the customers with different credits into different groups - A to F - according to their number of credits, as given in the table below.<\/p><p>The number of customers selected for receiving a cash back were different for different groups. However, within each group, the management selected an equal number of customers with each of the different number of credits classified into that group. For example, in group A, of the total number of customers selected for receiving a cashback, the number of customers with 18 credits is same as that with 19 credits, which, in turn, is same as that with 20 credits.<\/p><p>The percentage wise distribution of the total value of the cash-backs offered by the management to the customers belonging to the different groups is given in the following pie chart.<\/p>"};
const labels=Array.from({length:26},(_,i)=>String.fromCharCode(65+i));let current=0,submitted=false,secondsLeft=MINUTES*60,timerId=null;
const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false);
const host=document.getElementById("host"),qbar=document.getElementById("qbar"),result=document.getElementById("result");
function renderBar(){qbar.innerHTML=questions.map((_,i)=>`<button class="qdot ${i===current?"current":responses[i]!==null?"answered":""} ${marked[i]?"marked":""}" onclick="go(${i})">${i+1}</button>`).join("")}
function normalize(v){return String(v??"").replaceAll(",","").replace(/rs\.?/gi,"").replace(/%$/,"").replace(/\s+/g," ").trim().toLowerCase()}
function save(){if(submitted)return;const radio=host.querySelector('input[name="answer"]:checked'),typed=host.querySelector('input.typed-answer');if(radio)responses[current]=radio.value;else if(typed)responses[current]=typed.value.trim()||null}
function render(){const x=questions[current],commonText=passages[x.group]?`<div class="common-info">${passages[x.group]}</div>`:"",control=x.type==="text"?`<input class="typed-answer" name="answer" autocomplete="off" value="${responses[current]??""}" placeholder="Type your answer" ${submitted?"disabled":""}>`:`<div class="options">${x.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${labels[i]}" ${responses[current]===labels[i]?"checked":""} ${submitted?"disabled":""}><span>(${labels[i]}) ${o}</span></label>`).join("")}</div>`;host.innerHTML=`<section class="common-panel"><div class="block">${commonText}${charts[x.group]}<div id="solution" class="solution"><h3>Detailed Solution</h3>${x.solution}</div></div></section><section class="question-panel"><div class="qhead"><div><div class="qnum">Question ${current+1} of ${questions.length}</div><div class="source">${TITLE} | Source Q${current+1}</div></div></div><div class="question-body"><div class="qtext">${x.q}</div>${control}<div id="note" class="answer-note"></div></div><div class="navrow"><button class="mark-btn" onclick="markNext()">Mark for Review & Next</button><button class="clear-btn" onclick="clearResponse()" ${submitted?"disabled":""}>Clear Response</button><button class="previous-btn" onclick="go(${current-1})">Previous</button><button class="primary save-btn" onclick="next()">Save & Next</button></div></section>`;host.querySelectorAll('input[name="answer"]').forEach(el=>{el.addEventListener("change",()=>{responses[current]=el.value;renderBar()});el.addEventListener("input",()=>{responses[current]=el.value.trim()||null;renderBar()})});if(submitted)review();renderBar()}
function go(i){save();if(i<0||i>=questions.length)return;current=i;render();document.querySelector(".question-card").scrollTop=0}
function next(){save();go(Math.min(current+1,questions.length-1))}
function markNext(){save();marked[current]=true;go(Math.min(current+1,questions.length-1))}
function clearResponse(){if(submitted)return;responses[current]=null;render()}
function isCorrect(x,response){return x.type==="text"?normalize(response)===normalize(x.answer):response===x.answer}
function answerText(x){return x.type==="text"?x.answer:`(${x.answer})`}
function review(){const x=questions[current],note=document.getElementById("note");document.getElementById("solution").style.display="block";if(responses[current]===null){note.className="answer-note muted";note.textContent=`Unattempted. Correct answer: ${answerText(x)}`}else if(isCorrect(x,responses[current])){note.className="answer-note ok";note.textContent="Correct."}else{note.className="answer-note bad";note.textContent=`Wrong. Correct answer: ${answerText(x)}`}}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm("Submit this test now? You will not be able to change responses afterward."))return;submitted=true;clearInterval(timerId);let c=0,w=0,u=0;questions.forEach((x,i)=>{if(responses[i]===null)u++;else if(isCorrect(x,responses[i]))c++;else w++});const score=c*3-w;result.style.display="block";result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>${score}</strong></div><div class="score-box">Correct<strong>${c}</strong></div><div class="score-box">Wrong<strong>${w}</strong></div><div class="score-box">Attempted<strong>${c+w}</strong></div><div class="score-box">Unattempted<strong>${u}</strong></div></div>`;render();result.scrollIntoView({behavior:"smooth"})}
function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById("time").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(secondsLeft<=0){submitTest(true);return}secondsLeft--}
function calcEval(expr){if(!/^[0-9+\-*/().%\s]+$/.test(expr))return "Error";return Function("return ("+expr.replace(/%/g,"/100")+")")()}
function updateCalcSub(){document.getElementById("calcSubDisplay").textContent=document.getElementById("calcDisplay").value||"0"}
const calcPopup=document.getElementById("calcPopup"),calcHandle=document.getElementById("calcDragHandle"),calcClose=document.getElementById("calcClose");
function closeCalculator(e){if(e){e.preventDefault();e.stopPropagation()}dragCalc=false;calcPopup.classList.remove("open");calcPopup.hidden=true;calcPopup.setAttribute("aria-hidden","true")}
document.getElementById("calcToggle").onclick=()=>{if(calcPopup.classList.contains("open")){closeCalculator();return}calcPopup.hidden=false;calcPopup.setAttribute("aria-hidden","false");calcPopup.classList.add("open");if(!calcPopup.dataset.moved){calcPopup.style.left="52%";calcPopup.style.top="120px"}};
calcClose.addEventListener("pointerdown",closeCalculator);
calcClose.addEventListener("click",closeCalculator);
calcPopup.addEventListener("click",e=>{if(e.target.closest("#calcClose"))closeCalculator(e)},true);
document.querySelectorAll("[data-calc]").forEach(btn=>btn.onclick=()=>{const d=document.getElementById("calcDisplay"),v=btn.dataset.calc;if(["MC","MR","MS","M+","M-"].includes(v))return;if(v==="C")d.value="";else if(v==="B")d.value=d.value.slice(0,-1);else if(v==="+/-")d.value=d.value.startsWith("-")?d.value.slice(1):"-"+d.value;else if(v==="sqrt"){try{d.value=Math.sqrt(Number(calcEval(d.value||"0")))}catch{d.value="Error"}}else if(v==="1/x"){try{d.value=1/Number(calcEval(d.value||"0"))}catch{d.value="Error"}}else if(v==="="){try{d.value=calcEval(d.value)}catch{d.value="Error"}}else d.value+=v;updateCalcSub()});
let dragCalc=false,calcDx=0,calcDy=0;
calcHandle.onpointerdown=e=>{if(e.target.closest("#calcClose"))return;dragCalc=true;const r=calcPopup.getBoundingClientRect();calcDx=e.clientX-r.left;calcDy=e.clientY-r.top;calcPopup.style.left=r.left+"px";calcPopup.style.top=r.top+"px";calcPopup.style.right="auto";calcPopup.dataset.moved="1";e.preventDefault()};
document.addEventListener("pointermove",e=>{if(!dragCalc)return;const maxX=innerWidth-calcPopup.offsetWidth-4,maxY=innerHeight-calcPopup.offsetHeight-4;calcPopup.style.left=Math.max(4,Math.min(maxX,e.clientX-calcDx))+"px";calcPopup.style.top=Math.max(4,Math.min(maxY,e.clientY-calcDy))+"px"});
document.addEventListener("pointerup",()=>{dragCalc=false});
document.addEventListener("pointercancel",()=>{dragCalc=false});
render();tick();timerId=setInterval(tick,1000);
</script></body></html>
