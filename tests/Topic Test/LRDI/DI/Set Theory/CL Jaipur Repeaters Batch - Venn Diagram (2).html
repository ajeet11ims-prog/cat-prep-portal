*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;overflow:hidden}.top{height:84px;background:#f3f5f7;border-bottom:1px solid #9eadb9;display:grid;grid-template-columns:minmax(0,1fr) 62px 300px}.title{background:var(--dark);color:#fff;padding:10px 18px;display:flex;flex-direction:column;justify-content:center}.title h1{font-size:22px;line-height:1.1;margin:0;color:#fff}.meta{font-size:15px;color:#dce9ef;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.timer{display:grid;place-items:center;text-align:center;background:#fff;border-left:1px solid #9eadb9;font-weight:700;font-size:18px}.timer span{font-size:22px}.calc-toggle{align-self:center;justify-self:center;width:34px;height:34px;border:1px solid #d89c29;background:#f9c35b;color:#774d00;border-radius:2px;font-weight:800;cursor:pointer}.calc-toggle svg{width:20px;height:20px;display:block;margin:auto}
main{height:calc(100vh - 84px);display:grid;grid-template-columns:minmax(0,1fr) 300px;background:#fff}.stage{min-width:0;min-height:0;border-right:2px solid #41515c;display:flex;flex-direction:column;overflow:hidden}.panel{padding:14px;background:#e5f6fc;display:flex;flex-direction:column;overflow:auto}.panel h2{font-size:18px;margin:0 -14px 14px;padding:10px 14px;background:var(--mid);color:#fff}.palette{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.dot{height:44px;border:1px solid #a9b3bc;background:linear-gradient(#fff,#dfe5ea);border-radius:3px;font-size:18px;font-weight:700;color:#45515a}.dot.active{background:#e85b21;color:#fff;border-color:#c84815;clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%)}.dot.answered{background:#72bd3b;color:#fff;border-color:#4f9727;clip-path:polygon(14% 0,86% 0,100% 50%,86% 100%,14% 100%,0 50%)}.dot.marked{background:#7950a5;color:#fff;border-color:#5d3a85;border-radius:50%;clip-path:none}.dot.active.marked{box-shadow:0 0 0 3px #e85b21}.legend{display:grid;gap:10px;margin:18px 0;font-size:15px}.key{display:inline-block;width:20px;height:20px;border:1px solid var(--line);vertical-align:-5px;margin-right:8px}.key.current{background:#e85b21}.key.answered{background:#72bd3b}.key.marked{background:#7950a5;border-radius:50%}.side-submit{margin-top:auto;align-self:center;width:124px;height:42px;border:0;border-radius:2px;background:#29a8df;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
#result{display:none;padding:16px;border-bottom:1px solid var(--line);background:#fff}.score{display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:10px}.score div{border:1px solid var(--line);padding:10px;background:#fbfcfd}.score strong{display:block;font-size:24px}.form{flex:1;min-height:0;overflow:hidden}.question{height:100%;display:grid;grid-template-columns:minmax(0,60%) minmax(360px,40%);grid-template-rows:52px minmax(0,1fr);overflow:hidden;padding-bottom:64px}.qhead{grid-column:2;grid-row:1;min-height:52px;padding:12px 16px;border-bottom:1px solid #c6d0d8;border-left:1px solid #aeb8bf;background:#f5f7f9;font-size:19px;font-weight:700}.source{grid-column:1;grid-row:1 / span 2;border-right:1px solid #aeb8bf;overflow:auto;min-height:0;padding:14px 18px;background:#fff;font-size:19px;font-weight:600;line-height:1.65}.directions{margin:0 0 14px;font-size:20px;line-height:1.5;font-weight:700}.set-label{display:inline-block;margin:0 0 12px;padding:5px 9px;background:#dff3fb;color:#0b75bb;font-weight:700;font-size:14px}.source.set-2-common{font-size:23px;line-height:1.75}.source.set-2-common .directions{font-size:23px}.source img,.solution img{max-width:100%;height:auto}.qbody{grid-column:2;grid-row:2;overflow:auto;min-height:0;background:#fff}.qbody h2{font-size:20px;margin:0;padding:22px 24px 14px;line-height:1.5}.options{display:grid;gap:14px;padding:0 24px 18px}.option{border:0;padding:4px 0;display:flex;gap:12px;cursor:pointer;background:#fff;font-size:20px;font-weight:700;text-align:left}.option input{margin-top:7px;transform:scale(1.25);flex:0 0 auto}.option:hover span{text-decoration:underline}.typed-answer{width:min(420px,calc(100% - 48px));font-size:20px;font-weight:700;border:1px solid #8795a1;border-radius:2px;padding:12px;background:#fff;margin:0 24px 18px}.note{font-weight:800;font-size:17px;margin:10px 24px}.note.ok{color:#157347}.note.bad{color:#b02a37}.note.muted{color:var(--muted)}.solution{display:none;margin:14px 24px 28px;padding:16px 18px;border:1px solid #b8c3cc;background:#fbfcfd;font-size:17px;line-height:1.6}.solution h3{margin:0 0 10px;color:#0b75bb;font-size:19px}.solution-content{max-height:360px;overflow:auto;padding-right:8px}.nav{position:fixed;left:0;right:300px;bottom:0;height:64px;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:10px 16px;background:#eef8fc;border-top:1px solid #b6cbd6;z-index:20}.nav button,.side-submit{border-radius:2px;padding:11px 18px;font-size:16px;font-weight:700}.nav .secondary{background:#fff;color:#2f3b44;border:1px solid #b6c1ca}.nav button:not(.secondary){background:#29a8df;color:#fff;border:1px solid #198fc0}.mark-btn{margin-right:auto!important;background:#fff!important;color:#2f3b44!important}.correct{background:#eef8f2}.wrong{background:#fff1f2}.missed{background:#f5f6f7}

<script>
const DATA={"passages":[{"id":"16941682968604","label":"Set 1 · Nano Café","html":"<p>'Nano Cafe' has a variety of 205 different servings, out of which 130 use Arabica coffee and the remaining 75 use Robusta coffee. Each serving can be either a bakery product or a beverage, but not both. Some servings have been packed in red containers while the remaining servings have been packed in blue containers. <br /><br />The following points are known:<br />1. The total number of servings packed in blue containers is 35. <br />2. The total number of servings which use Arabica coffee that are packed in blue containers is equal to the number of beverages, which use Robusta coffee that are packed in blue containers.<br />3. The total number of servings which use Robusta coffee that are packed in blue containers is equal to the number of beverages that use Arabica coffee that are packed in red containers. This number is equal to the number of beverages that use Robusta coffee, which in turn is half the number of bakery products that use Robusta coffee.<br />4. The number of bakery products which use Robusta coffee that are packed in red containers is 65 less than the number of bakery products that use Arabica coffee.</p>"},{"id":"16817314416943","label":"Set 2 · Fruit Purchases","html":"<p><span style=\"font-family: Calibri;\">The mess committee of Pataudi Mahavidyalaya consists of ten members namely, Ajay, Bindu, Chandani, Deepti, Enaya, Farzana, Garvit, Harshita, Indu and Jatin. Every Sunday they go to the local fruit market and buy 40 kg of fruits. On a particular Sunday they all collectively bought five types of fruits, namely Apple, Banana, Orange, Mango and Watermelon. Each member of the committee bought a total of 4 kg of fruits of two types. No one bought more than 2 kg of any one type of fruit. Also no two members bought the same combination of fruits. The prices of Apple, Banana, Orange, Mango and Watermelon were Rs. 100, Rs. 50, Rs. 80, Rs, 150 and Rs. 40 per kg in the given order. It is known that Indu bought Watermelons, Enaya bought Bananas and Jatin bought Mangoes. Also the sum of the amounts spent by Bindu, Farzana and Garvit was Rs. 1360 and the sum of the amounts spent by Ajay, Deepti and Harshita was Rs. 680.</span></p>"},{"id":"16884687741252","label":"Set 3 · Garment Store","html":"<p>Mrs. Noorani Kapdawala is the owner of a readymade garments store in Pune, India. Her store is known for good quality clothes &ndash; acquired from both domestic and imported sources. Clothes in the store can be classified into three types based on material used &ndash; cotton, synthetic and leather. The shop has two separate floors &ndash; the first floor is used exclusively for women&rsquo;s clothing and the second floor is used only for men&rsquo;s clothing. Mrs. Kapdawala is taking physical stock of the garments available in the shop on 31<sup>st</sup> March night to check whether the stock registers are properly maintained or not. Total stock of garments found in the shop was 5000 items. Here, each piece of garment has been referred to as an &lsquo;item&rsquo;.</p>\n<p><br />Further, Mrs. Kapdawala got to know the following facts &ndash; <br />1.&nbsp; &nbsp; &nbsp; 44% of the total items were imported, while 33% of the total items were for men&rsquo;s clothing. <br />2.&nbsp; &nbsp; &nbsp; Non-leather items constitute 72% of the total items available and <span class=\"mixed-number\">55<span class=\"frac\" role=\"math\" aria-label=\"5 over 9\"><span class=\"num\">5</span><span class=\"den\">9</span></span>%</span> of them are cotton items.<br />3.&nbsp; &nbsp; &nbsp; 42.5% of the cotton items and <span class=\"mixed-number\">46<span class=\"frac\" role=\"math\" aria-label=\"7 over 8\"><span class=\"num\">7</span><span class=\"den\">8</span></span>%</span> synthetic items are imported.<br />4.&nbsp; &nbsp; &nbsp; For women&rsquo;s clothing, domestic leather items exceed the imported leather items by half the number of leather items for men&rsquo;s clothing. Half of the leather items for men&rsquo;s clothing are from domestic sources.<br />5.&nbsp; &nbsp; &nbsp; The number of cotton items acquired from domestic sources for the women was 750. The number of Cotton items for men&rsquo;s clothing were 100 less than that.<br />6.&nbsp; &nbsp; &nbsp; Total domestic items found for women&rsquo;s clothing were 1950.</p>"}],"questions":[{"n":1,"sourceId":"169416829686615","passage":0,"type":"mcq","question":"The number of servings which use Arabica coffee that are packed in blue containers is:","options":["10","5","15","20"],"answer":0,"explanation":"\n<div class=\"solution-card\">\n  <div class=\"solution-title\">How the complete arrangement is obtained</div>\n  <div class=\"calc-steps\">\n    <div><b>Step 1:</b> Let <i>x</i> be the total number of Arabica servings in blue containers and <i>y</i> be the number of Robusta bakery products in blue containers. By condition 2, Robusta beverages in blue containers are also <i>x</i>.</div>\n    <div class=\"math-line\">Blue total: &nbsp; x + y + x = 35 &nbsp;⇒&nbsp; 2x + y = 35 &nbsp;… (1)</div>\n    <div><b>Step 2:</b> Condition 3 states that the total Robusta-blue count equals the total Robusta-beverage count. Hence Robusta beverages in red containers = <i>y</i>. The same count is half the total Robusta bakery count, so Robusta bakery-red = <i>y + 2x</i>.</div>\n    <div class=\"math-line\">Robusta total: &nbsp; y + x + y + (y + 2x) = 75<br>⇒ 3(x + y) = 75 ⇒ x + y = 25 &nbsp;… (2)</div>\n    <div><b>Step 3:</b> Solving (1) and (2): <b>x = 10</b> and <b>y = 15</b>. Therefore Robusta beverage-red = 15, Robusta bakery-red = 35, and Arabica beverage-red = 25.</div>\n    <div><b>Step 4:</b> Robusta bakery-red is 65 less than total Arabica bakery products. Thus Arabica bakery total = 35 + 65 = 100. Arabica beverage total = 130 − 100 = 30.</div>\n    <div><b>Step 5:</b> Arabica beverage-blue = 30 − 25 = 5. Since total Arabica-blue is 10, Arabica bakery-blue = 5, leaving Arabica bakery-red = 95.</div>\n  </div>\n  \n<div class=\"visual-heading\">Final 8-region classification diagram</div>\n<p class=\"diagram-note\">The categories are mutually exclusive, so an 8-region classification grid is mathematically clearer than overlapping circles.</p>\n<svg class=\"logic-svg\" viewBox=\"0 0 820 360\" role=\"img\" aria-label=\"Set 1 classification diagram showing blue and red containers, beverages and bakery products, Arabica and Robusta values\">\n  <rect x=\"8\" y=\"8\" width=\"804\" height=\"344\" rx=\"14\" fill=\"#ffffff\" stroke=\"#9fb0bd\" stroke-width=\"2\"/>\n  <text x=\"410\" y=\"38\" text-anchor=\"middle\" font-size=\"23\" font-weight=\"700\" fill=\"#101820\">Nano Café — Final Distribution</text>\n  <g transform=\"translate(28,58)\">\n    <rect x=\"0\" y=\"0\" width=\"365\" height=\"260\" rx=\"12\" fill=\"#eef8ff\" stroke=\"#4089c8\" stroke-width=\"2\"/>\n    <text x=\"182.5\" y=\"30\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"700\" fill=\"#0b75bb\">BLUE CONTAINERS (35)</text>\n    <line x1=\"115\" y1=\"48\" x2=\"115\" y2=\"235\" stroke=\"#92a7b5\" stroke-width=\"1.5\"/>\n    <line x1=\"240\" y1=\"48\" x2=\"240\" y2=\"235\" stroke=\"#92a7b5\" stroke-width=\"1.5\"/>\n    <line x1=\"15\" y1=\"92\" x2=\"350\" y2=\"92\" stroke=\"#92a7b5\" stroke-width=\"1.5\"/>\n    <line x1=\"15\" y1=\"164\" x2=\"350\" y2=\"164\" stroke=\"#92a7b5\" stroke-width=\"1.5\"/>\n    <line x1=\"15\" y1=\"235\" x2=\"350\" y2=\"235\" stroke=\"#92a7b5\" stroke-width=\"1.5\"/>\n    <text x=\"177\" y=\"78\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\">Arabica</text>\n    <text x=\"295\" y=\"78\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\">Robusta</text>\n    <text x=\"65\" y=\"133\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\">Beverage</text>\n    <text x=\"65\" y=\"207\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\">Bakery</text>\n    <text x=\"177\" y=\"136\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"800\">5</text>\n    <text x=\"295\" y=\"136\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"800\">10</text>\n    <text x=\"177\" y=\"210\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"800\">5</text>\n    <text x=\"295\" y=\"210\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"800\">15</text>\n    <text x=\"182.5\" y=\"252\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\">Beverage 15 · Bakery 20</text>\n  </g>\n  <g transform=\"translate(427,58)\">\n    <rect x=\"0\" y=\"0\" width=\"365\" height=\"260\" rx=\"12\" fill=\"#fff4f1\" stroke=\"#e55b25\" stroke-width=\"2\"/>\n    <text x=\"182.5\" y=\"30\" text-anchor=\"middle\" font-size=\"21\" font-weight=\"700\" fill=\"#bd4317\">RED CONTAINERS (170)</text>\n    <line x1=\"115\" y1=\"48\" x2=\"115\" y2=\"235\" stroke=\"#b8a39a\" stroke-width=\"1.5\"/>\n    <line x1=\"240\" y1=\"48\" x2=\"240\" y2=\"235\" stroke=\"#b8a39a\" stroke-width=\"1.5\"/>\n    <line x1=\"15\" y1=\"92\" x2=\"350\" y2=\"92\" stroke=\"#b8a39a\" stroke-width=\"1.5\"/>\n    <line x1=\"15\" y1=\"164\" x2=\"350\" y2=\"164\" stroke=\"#b8a39a\" stroke-width=\"1.5\"/>\n    <line x1=\"15\" y1=\"235\" x2=\"350\" y2=\"235\" stroke=\"#b8a39a\" stroke-width=\"1.5\"/>\n    <text x=\"177\" y=\"78\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\">Arabica</text>\n    <text x=\"295\" y=\"78\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\">Robusta</text>\n    <text x=\"65\" y=\"133\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\">Beverage</text>\n    <text x=\"65\" y=\"207\" text-anchor=\"middle\" font-size=\"17\" font-weight=\"700\">Bakery</text>\n    <text x=\"177\" y=\"136\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"800\">25</text>\n    <text x=\"295\" y=\"136\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"800\">15</text>\n    <text x=\"177\" y=\"210\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"800\">95</text>\n    <text x=\"295\" y=\" \" role=\"math\" aria-label=\"7 over 8\"><span class=\"num\">7</span><span class=\"den\">8</span></span>%</span> of 1600 = 750; domestic synthetic = 850.</div>\n    <div><b>Leather split:</b> Leather-imported = 2200 − 850 − 750 = 600; leather-domestic = 800. Let each men-leather source count be <i>b</i> because half of men’s leather is domestic. Women domestic leather − women imported leather = <i>b</i>. From the source totals, this difference is (800 − b) − (600 − b) = 200, so <i>b = 200</i>.</div>\n    <div><b>Complete the synthetic cells:</b> Men-imported synthetic = 800 − 250 − 200 = 350; men-domestic synthetic = 850 − 400 − 200 = 250. The women’s synthetic cells are then 400 imported and 600 domestic.</div>\n  </div>\n  \n<div class=\"visual-heading\">Final 12-category classification diagram</div>\n<table class=\"solution-table garment-table\" aria-label=\"Garment distribution by material, source and gender\">\n  <thead>\n    <tr><th>Material</th><th>Men<br>Domestic</th><th>Men<br>Imported</th><th>Women<br>Domestic</th><th>Women<br>Imported</th><th>Total</th></tr>\n  </thead>\n  <tbody>\n    <tr><th>Cotton</th><td>400</td><td>250</td><td>750</td><td>600</td><td><b>2000</b></td></tr>\n    <tr><th>Synthetic</th><td>250</td><td>350</td><td>600</td><td>400</td><td><b>1600</b></td></tr>\n    <tr><th>Leather</th><td>200</td><td>200</td><td>600</td><td>400</td><td><b>1400</b></td></tr>\n    <tr class=\"total-row\"><th>Total</th><td>850</td><td>800</td><td>1950</td><td>1400</td><td>5000</td></tr>\n  </tbody>\n</table>\n\n</div>\n<div class=\"answer-box\">Cotton–Imported–Women = 600<br>Synthetic–Domestic–Women = 600<br>Leather–Domestic–Women = 600<br>Synthetic–Imported–Women = 400<br>The smallest category is <b>Synthetic–Imported–Women</b>.<br><b>Correct option: (D)</b></div>","marks":3,"negative":1},{"n":15,"sourceId":"16884687741289","passage":2,"type":"tita","question":"Mrs. Kapdawala has decided to classify all garment items into two categories only based on the material used – cotton and non-cotton (non-cotton means synthetic and leather combined). How many non-cotton items have been acquired from the domestic sources?<br><br>Enter your response (as an integer) using the virtual keyboard in the box provided below.<br><br>","options":[],"answer":"1650","explanation":"\n<div class=\"solution-card\">\n  <div class=\"solution-title\">Complete Set 3 working</div>\n  <div class=\"calc-steps\">\n    <div><b>Gender totals:</b> Men = 33% of 5000 = 1650; Women = 5000 − 1650 = 3350.</div>\n    <div><b>Source totals:</b> Imported = 44% of 5000 = 2200; Domestic = 2800. Since women-domestic = 1950, women-imported = 3350 − 1950 = 1400. Hence men-domestic = 850 and men-imported = 800.</div>\n    <div><b>Material totals:</b> Leather = 28% of 5000 = 1400; non-leather = 3600. Cotton = <span class=\"mixed-number\">55<span class=\"frac\" role=\"math\" aria-label=\"5 over 9\"><span class=\"num\">5</span><span class=\"den\">9</span></span>%</span> of 3600 = 2000; therefore synthetic = 3600 − 2000 = 1600.</div>\n    <div><b>Cotton by source:</b> Imported cotton = 42.5% of 2000 = 850 and domestic cotton = 1150. Women-domestic cotton = 750, so men-domestic cotton = 400. Total men-cotton is 650, giving men-imported cotton = 250 and women-imported cotton = 600.</div>\n    <div><b>Synthetic by source:</b> Imported synthetic = <span class=\"mixed-number\">46<span class=\"frac\" role=\"math\" aria-label=\"7 over 8\"><span class=\"num\">7</span><span class=\"den\">8</span></span>%</span> of 1600 = 750; domestic synthetic = 850.</div>\n    <div><b>Leather split:</b> Leather-imported = 2200 − 850 − 750 = 600; leather-domestic = 800. Let each men-leather source count be <i>b</i> because half of men’s leather is domestic. Women domestic leather − women imported leather = <i>b</i>. From the source totals, this difference is (800 − b) − (600 − b) = 200, so <i>b = 200</i>.</div>\n    <div><b>Complete the synthetic cells:</b> Men-imported synthetic = 800 − 250 − 200 = 350; men-domestic synthetic = 850 − 400 − 200 = 250. The women’s synthetic cells are then 400 imported and 600 domestic.</div>\n  </div>\n  \n<div class=\"visual-heading\">Final 12-category classification diagram</div>\n<table class=\"solution-table garment-table\" aria-label=\"Garment distribution by material, source and gender\">\n  <thead>\n    <tr><th>Material</th><th>Men<br>Domestic</th><th>Men<br>Imported</th><th>Women<br>Domestic</th><th>Women<br>Imported</th><th>Total</th></tr>\n  </thead>\n  <tbody>\n    <tr><th>Cotton</th><td>400</td><td>250</td><td>750</td><td>600</td><td><b>2000</b></td></tr>\n    <tr><th>Synthetic</th><td>250</td><td>350</td><td>600</td><td>400</td><td><b>1600</b></td></tr>\n    <tr><th>Leather</th><td>200</td><td>200</td><td>600</td><td>400</td><td><b>1400</b></td></tr>\n    <tr class=\"total-row\"><th>Total</th><td>850</td><td>800</td><td>1950</td><td>1400</td><td>5000</td></tr>\n  </tbody>\n</table>\n\n</div>\n<div class=\"answer-box\">Domestic non-cotton items = domestic synthetic + domestic leather<br>= (250 + 600) + (200 + 600)<br>= 850 + 800 = <b>1650</b>.</div>","marks":3,"negative":0}]};
const L=['A','B','C','D'];let current=0,submitted=false,left=40*60,timerId=null;const marked=new Set(),answers=Array(DATA.questions.length).fill(null);const form=document.querySelector('#form'),palette=document.querySelector('#palette');
const strip=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.trim()};
function answerText(q){return q.type==='tita'?String(q.answer):'('+L[q.answer]+') '+strip(q.options[q.answer])}
function save(){if(submitted)return;const q=DATA.questions[current];if(q.type==='mcq'){const e=form.querySelector('input[name="q'+current+'"]:checked');answers[current]=e?Number(e.value):null}else{const e=form.querySelector('#tita');answers[current]=e&&e.value.trim()!==''?e.value.trim():null}}
function isCorrect(q,a){if(a===null||a==='')return null;return q.type==='tita'?String(a).trim()===String(q.answer).trim():Number(a)===q.answer}
function control(q){if(q.type==='mcq')return '<div class="options">'+q.options.map((o,j)=>'<label class="option"><input type="radio" name="q'+current+'" value="'+j+'" '+(answers[current]===j?'checked':'')+' '+(submitted?'disabled':'')+'><span>('+L[j]+') '+o+'</span></label>').join('')+'</div>';return '<input id="tita" class="typed-answer" inputmode="numeric" value="'+(answers[current]??'')+'" placeholder="Type your answer" '+(submitted?'disabled':'')+'>'}
function render(){const q=DATA.questions[current],p=DATA.passages[q.passage];form.innerHTML='<article class="question"><div class="qhead">Question '+(current+1)+' of '+DATA.questions.length+' · '+(q.type==='tita'?'TITA (+3 / 0)':'MCQ (+3 / −1)')+'</div><section class="source'+(q.passage===1?' set-2-common':'')+'"><div class="set-label">'+p.label+'</div><p class="directions">Refer to the data below and answer the questions that follow.</p>'+p.html+'</section><section class="qbody"><h2>Q'+(current+1)+'. '+q.question+'</h2>'+control(q)+'<div class="note" id="note"></div><div class="solution" id="solution"><h3>Solution</h3><strong>Correct answer: '+answerText(q)+'</strong><div class="solution-content">'+q.explanation+'</div></div></section></article><div class="nav"><button type="button" class="mark-btn" id="mark">'+(marked.has(current)?'Unmark Review':'Mark for Review')+'</button><button type="button" class="secondary" id="clear">Clear Response</button><button type="button" class="secondary" id="prev">Previous</button><button type="button" id="next">Save & Next</button></div>';
 form.querySelector('#mark').onclick=()=>{save();marked.has(current)?marked.delete(current):marked.add(current);state();form.querySelector('#mark').textContent=marked.has(current)?'Unmark Review':'Mark for Review'};form.querySelector('#clear').onclick=()=>{if(submitted)return;answers[current]=null;render()};form.querySelector('#prev').onclick=()=>show(current-1);form.querySelector('#next').onclick=()=>{save();show(current+1)};form.querySelector('#prev').disabled=current===0;form.querySelector('#next').disabled=current===DATA.questions.length-1;if(submitted)review();state()}
function renderPalette(){palette.innerHTML=DATA.questions.map((_,i)=>'<button type="button" class="dot" data-i="'+i+'">'+(i+1)+'</button>').join('');palette.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{save();show(Number(b.dataset.i))});state()}
function state(){palette.querySelectorAll('.dot').forEach((d,i)=>{d.classList.toggle('active',i===current);d.classList.toggle('answered',answers[i]!==null&&answers[i]!=='');d.classList.toggle('marked',marked.has(i))})}
function show(i){if(i<0||i>=DATA.questions.length)return;save();current=i;render()}
function review(){const q=DATA.questions[current],r=isCorrect(q,answers[current]),note=form.querySelector('#note'),body=form.querySelector('.qbody');form.querySelector('#solution').style.display='block';if(r===null){body.classList.add('missed');note.className='note muted';note.textContent='Unattempted. Correct answer: '+answerText(q)}else if(r){body.classList.add('correct');note.className='note ok';note.textContent='Correct: '+answerText(q)}else{body.classList.add('wrong');note.className='note bad';note.textContent='Incorrect. Correct answer: '+answerText(q)}}
function submit(){if(submitted)return;save();submitted=true;clearInterval(timerId);let c=0,w=0,u=0,score=0;DATA.questions.forEach((q,i)=>{const r=isCorrect(q,answers[i]);if(r===null)u++;else if(r){c++;score+=3}else{w++;score-=q.negative}});const result=document.querySelector('#result');result.style.display='block';result.innerHTML='<div class="score"><div>Score<strong>'+score+' / 45</strong></div><div>Correct<strong>'+c+'</strong></div><div>Wrong<strong>'+w+'</strong></div><div>Attempted<strong>'+(c+w)+'</strong></div><div>Unattempted<strong>'+u+'</strong></div></div>';document.querySelector('#sideSubmit').disabled=true;render();result.scrollIntoView({block:'start'})}
document.querySelector('#sideSubmit').onclick=submit;renderPalette();render();
function tick(){const m=Math.floor(left/60),s=left%60;document.querySelector('#time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(left<=0){submit();return}left--}tick();timerId=setInterval(()=>{if(!submitted)tick()},1000);
let memory=0,expression='';const display=document.querySelector('#display'),sub=document.querySelector('#calcSub'),dialog=document.querySelector('#calculator');function calcValue(){const safe=expression.replace(/%/g,'/100');if(!/^[0-9+\-*/. ()]+$/.test(safe))throw Error();return Function('"use strict";return ('+safe+')')()}document.querySelector('#calcOpen').onclick=()=>dialog.showModal();document.querySelector('#calcClose').onclick=()=>dialog.close();document.querySelector('#keys').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.calc;if(/^[0-9.]$/.test(k))expression=expression==='0'?k:expression+k;else if(['+','-','*','/'].includes(k))expression+=(expression?' '+k+' ':'0 '+k+' ');else if(k==='C')expression='';else if(k==='B')expression=expression.trim().slice(0,-1).trim();else if(k==='+/-'){try{expression=String(-calcValue())}catch{}}else if(k==='%')expression+='%';else if(k==='sqrt'){try{expression=String(Math.sqrt(calcValue()))}catch{expression='Error'}}else if(k==='1/x'){try{expression=String(1/calcValue())}catch{expression='Error'}}else if(k==='='){try{expression=String(Number(calcValue().toFixed(10)))}catch{expression='Error'}}else if(k==='MS'){try{memory=calcValue()}catch{}}else if(k==='MR')expression=String(memory);else if(k==='MC')memory=0;else if(k==='M+'){try{memory+=calcValue()}catch{}}else if(k==='M-'){try{memory-=calcValue()}catch{}}display.value=expression||'0';sub.textContent='M: '+Number(memory.toFixed(10))};
</script></body></html>
