<script>const questions=[{"source":"Concept Review Q1","type":"mcq","question":"If the remainder obtained when 4S is divided by 7 is 3, then a possible value of S, where S is a positive integer, is _____.","options":["5","6","7","4"],"answer":1,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Given <span class='math'>Rem(<span class='frac'><span>4S</span><span>7</span></span>) = 3</span>.</li><li>By trial, S = 6 gives 4S = 24, which leaves remainder 3 on division by 7.</li><li>Hence possible values are 6, 13, 20, ... .</li></ol><div class='final-answer'>Final Answer: 6 (Option B)</div>"},{"source":"Concept Review Q2","type":"text","question":"A person purchased three items a, b and c spending a total amount of ₹101. Each of the items a, b and c cost ₹80, ₹3 and ₹2 respectively. Find the maximum number of items altogether he could have purchased.","typedAnswer":"10","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let the numbers of the three items be a, b and c. Then 80a + 3b + 2c = 101, with a, b, c natural numbers.</li><li>Since at least one of each is bought, a = 1 and the balance amount is 21.</li><li>Using the source solution: b = 3 and c = 6, so total items = 1 + 3 + 6 = 10.</li></ol><div class='final-answer'>Final Answer: 10</div>","answer":"10","accepted":["10"]},{"source":"Concept Review Q3","type":"mcq","question":"If 4x + 5y = 27 where x, y ∈ Z⁺, then possible values of x and y are _____ respectively.","options":["2 and 3","3 and 5","3 and 4","3 and 3"],"answer":3,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Check the options in 4x + 5y = 27.</li><li>For x = 3 and y = 3, 4(3) + 5(3) = 12 + 15 = 27.</li><li>The other listed pairs do not satisfy the equation.</li></ol><div class='final-answer'>Final Answer: x = 3, y = 3 (Option D)</div>"},{"source":"Concept Review Q4","type":"mcq","question":"If 3x + 7y = 37 where x, y ∈ Z⁺, then the number of combinations of x and y is _____.","options":["1","2","3","0"],"answer":1,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Given 3x + 7y = 37 with x, y positive integers.</li><li>For y = 1, x = 10; for y = 4, x = 3.</li><li>No other positive integer values of y keep x positive and integral.</li></ol><div class='final-answer'>Final Answer: 2 combinations (Option B)</div>"},{"source":"Concept Review Q5","type":"mcq","question":"If 5x + 16y = 100 where x, y ∈ Z⁺, the values that y can take are _____.","options":["multiples of 10","multiples of 4","multiples of 5","None of these"],"answer":2,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Given 5x + 16y = 100.</li><li>Since both 5x and 100 are divisible by 5, 16y must be divisible by 5.</li><li>As 16 is coprime to 5, y must be a multiple of 5.</li></ol><div class='final-answer'>Final Answer: Multiples of 5 (Option C)</div>"},{"source":"Concept Review Q6","type":"mcq","question":"If Remainder(4Q/5) = 4, Q is of the form _____.","options":["4k + 1, k ∈ Z","5k, k ∈ Z","5k + 1, k ∈ Z","5k − 1, k ∈ Z"],"answer":2,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Given <span class='math'>Rem(<span class='frac'><span>4Q</span><span>5</span></span>) = 4</span>.</li><li>This is equivalent to 4 × Rem(<span class='frac'><span>Q</span><span>5</span></span>) = 4, so Rem(<span class='frac'><span>Q</span><span>5</span></span>) = 1.</li><li>Hence Q = 5k + 1 for some integer k.</li></ol><div class='final-answer'>Final Answer: 5k + 1, k ∈ Z (Option C)</div>"},{"source":"Concept Review Q7","type":"text","question":"The number of solutions of the equation 2x + 3y = 14 in which both x and y are positive integers is","typedAnswer":"2","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Solve 2x + 3y = 14 in positive integers.</li><li>The valid pairs are (x, y) = (4, 2) and (1, 4).</li></ol><div class='final-answer'>Final Answer: 2</div>","answer":"2","accepted":["2"]},{"source":"Concept Review Q8","type":"text","question":"The number of non-negative integral solutions of the equation 3x + 5y = 20 is","typedAnswer":"2","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Solve 3x + 5y = 20 in non-negative integers.</li><li>The valid pairs are (0, 4) and (5, 1).</li></ol><div class='final-answer'>Final Answer: 2</div>","answer":"2","accepted":["2"]},{"source":"Concept Review Q9","type":"mcq","question":"A and B are positive integers such that 5A + 8B = 78. Which of the following is a possible value of A?","options":["3","9","14","11"],"answer":2,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Given 5A + 8B = 78 with A, B positive integers.</li><li>Testing the listed values, A = 14 gives 70 + 8B = 78, so B = 1.</li></ol><div class='final-answer'>Final Answer: 14 (Option C)</div>"},{"source":"Concept Review Q10","type":"mcq","question":"X and Y are positive integers such that 5X + 7Y = 135. Which of the following is a possible value of Y?","options":["7","12","15","20"],"answer":2,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Given 5X + 7Y = 135.</li><li>Since 5X and 135 are divisible by 5, 7Y must be divisible by 5; therefore Y is a multiple of 5.</li><li>Among the options, Y = 15 works; Y = 20 would make 7Y > 135.</li></ol><div class='final-answer'>Final Answer: 15 (Option C)</div>"},{"source":"Concept Review Q11","type":"mcq","question":"Ramesh bought some pencils and erasers spending an amount of ₹15. If a pencil cost him ₹4 and an eraser ₹3, then how many pencils did he buy?","options":["3","4","1","Cannot be determined"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let pencils = x and erasers = y. Then 4x + 3y = 15.</li><li>For x to be integral and positive, x = 3 gives y = 1.</li><li>Larger x makes 4x exceed 15.</li></ol><div class='final-answer'>Final Answer: 3 pencils (Option A)</div>"},{"source":"Concept Review Q12","type":"text","question":"Shakuntala has some parrots and rabbits with her. If 4 times the number of parrots added to 7 times the number of rabbits is equal to 29, then how many parrots does she have?","typedAnswer":"2","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let parrots = x and rabbits = y. Then 4x + 7y = 29.</li><li>Trying positive integer y, y = 3 gives x = 2; the next value of y is too large.</li></ol><div class='final-answer'>Final Answer: 2 parrots</div>","answer":"2","accepted":["2"]},{"source":"Concept Review Q13","type":"text","question":"Ritish has some coins in denominations of two rupees and five rupees. If the total amount with him is ₹13, then how many coins does he have?","typedAnswer":"5","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let ₹2 coins = x and ₹5 coins = y. Then 2x + 5y = 13.</li><li>The positive solution is y = 1, x = 4.</li><li>Total coins = 4 + 1 = 5.</li></ol><div class='final-answer'>Final Answer: 5</div>","answer":"5","accepted":["5"]},{"source":"Concept Review Q14","type":"mcq","question":"Satwick purchased some scales and charts. Each scale cost him ₹7 and each chart ₹5. If he has spent a total amount of ₹42, then how many items did he purchase?","options":["8","7","9","Cannot be determined"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let scales = x and charts = y. Then 7x + 5y = 42.</li><li>Because 7x and 42 are divisible by 7, 5y must also be divisible by 7, so y = 7 is the only feasible positive value.</li><li>Then x = 1 and total items = 8.</li></ol><div class='final-answer'>Final Answer: 8 (Option A)</div>"},{"source":"Concept Review Q15","type":"text","question":"Kashyap purchased some cricket balls and shuttlecocks. The price of each cricket ball is ₹10 and the price of each shuttlecock is ₹11. If Kashyap spends a total amount of ₹130, then how many shuttlecocks did he purchase?","typedAnswer":"10","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let cricket balls = x and shuttlecocks = y. Then 10x + 11y = 130.</li><li>Since 10x and 130 are divisible by 10, 11y must be divisible by 10, so y = 10.</li><li>Then x = 2.</li></ol><div class='final-answer'>Final Answer: 10 shuttlecocks</div>","answer":"10","accepted":["10"]},{"source":"Exercise 1(a) Q1","type":"mcq","question":"Supriya asked Rajesh, “What is the date of your birth?” Rajesh replied, “25 times the date of my birth added to 9 times the month of my birth is 563.” In which month was Rajesh born?","options":["September","July","February","November"],"answer":1,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let date = D and month = M. Then 25D + 9M = 563.</li><li>Taking remainders modulo 9: Rem(<span class='frac'><span>7D</span><span>9</span></span>) = 5.</li><li>Trial gives D = 2, 11, 20, ... . The corresponding M values are 57, 32, 7, ... .</li><li>Only 1 ≤ M ≤ 12 is allowed, so M = 7.</li></ol><div class='final-answer'>Final Answer: July (Option B)</div>"},{"source":"Exercise 1(a) Q2","type":"text","question":"The “Friends Club” bought some shuttlecocks and cricket balls. Each shuttlecock cost ₹8 and each cricket ball cost ₹15. In how many different ways could the club have bought the items if it spent a total amount of ₹769?","typedAnswer":"6","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let shuttlecocks = x and cricket balls = y. Then 8x + 15y = 769.</li><li>Modulo 8, Rem(<span class='frac'><span>7y</span><span>8</span></span>) = 1, giving y = 7, 15, 23, 31, 39, 47, ... .</li><li>For y ≥ 55, 15y > 769. Thus exactly six positive values are feasible.</li></ol><div class='final-answer'>Final Answer: 6</div>","answer":"6","accepted":["6"]},{"source":"Exercise 1(a) Q3","type":"mcq","question":"Kushal takes up an assignment wherein each working day he is given a target. For each day he meets the target, he is paid ₹105 and for each day he does not meet the target he is paid ₹18 less. If by the end of a month he is paid a total of ₹2988, then for how many days does he meet the target?","options":["21","9","18","19"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let x be days target met and y days target missed. Then 105x + 87y = 2988, or 35x + 29y = 996.</li><li>Using the remainder method gives x = 21 and y = 9 as the feasible pair with x + y ≤ 31.</li><li>Therefore Kushal met the target on 21 days.</li></ol><div class='final-answer'>Final Answer: 21 days (Option A)</div>"},{"source":"Exercise 1(a) Q4","type":"mcq","question":"John and Rosy have a collection of less than 90 coins together. If Rosy gives John a certain number of coins, then John would have 4 times as many coins as Rosy. Instead, if John gives the same number of coins to Rosy, then John would have 3 times as many coins as Rosy. The number of coins with John and Rosy together can be _____.","options":["80","29","35","85"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let John and Rosy initially have x and y coins. Eliminating the transferred amount from the two conditions gives 9x − 31y = 0.</li><li>So x = <span class='frac'><span>31y</span><span>9</span></span>; hence y is a multiple of 9.</li><li>Keeping x + y < 90 gives feasible totals 40 and 80.</li><li>Among the options, 80 is possible.</li></ol><div class='final-answer'>Final Answer: 80 (Option A)</div>"},{"source":"Exercise 1(a) Q5","type":"text","question":"The average weight of a certain group of n men is 72 kg. When two men whose weights are 73 kg and 67 kg join the group, and one man whose weight is more than 58 kg leaves the group, the average weight of the group goes up by 3 kg. If the initial number of men in the group is an even number, then the weight of the man who leaves the group is ____ kg.","typedAnswer":"59","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let the weight of the man who leaves be k kg.</li><li>Initial total = 72n. After two men of 73 kg and 67 kg join and k kg leaves, new average is 75 for n + 1 men.</li><li>72n + 140 − k = 75(n + 1), so k = 65 − 3n.</li><li>Given k > 58 and n is even, n = 2, giving k = 59.</li></ol><div class='final-answer'>Final Answer: 59 kg</div>","answer":"59","accepted":["59"]}];

function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}function norm(s){return String(s??'').toLowerCase().replace(/[₹,()\s]/g,'').replace(/years?|days?|km|kg/g,'').trim();}

function hasHtml(s){return /<[^>]+>/.test(String(s??''));}
function formatMathText(text){
  let out=esc(text);
  out=out.replace(/√\s*\(([^()]+)\)/g,'<span class="sqrt"><span class="sqrt-radicand">$1</span></span>');
  out=out.replace(/√\s*([A-Za-z0-9]+)/g,'<span class="sqrt"><span class="sqrt-radicand">$1</span></span>');
  out=out.replace(/([A-Za-z0-9\)])\^\s*\{?(-?\d+)\}?/g,'$1<sup>$2</sup>');
  out=out.replace(/(^|[^\w>])([A-Za-z0-9]+)\s*\/\s*([A-Za-z0-9]+)(?![\w<])/g,'$1<span class="frac"><span>$2</span><span>$3</span></span>');
  return out;
}
function formatMathHtml(html){
  const template=document.createElement('template');template.innerHTML=String(html??'');
  const walker=document.createTreeWalker(template.content,NodeFilter.SHOW_TEXT);const nodes=[];
  while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(node=>{const parent=node.parentElement;if(parent&&(parent.closest('.frac')||parent.tagName==='SCRIPT'||parent.tagName==='STYLE'))return;const span=document.createElement('span');span.innerHTML=formatMathText(node.nodeValue);node.replaceWith(...Array.from(span.childNodes));});
  return template.innerHTML;
}
function rich(s){return hasHtml(s)?formatMathHtml(s):formatMathText(s);}
function answerIndex(q){return q.answer;}function correctText(q){if(q.type==='mcq'){let i=q.answer;return '('+labels[i]+') '+q.options[i];}return q.typedAnswer;}
function renderBar(){qbar.innerHTML=questions.map((q,i)=>`<button type="button" class="qbtn ${i===current?'current ':''}${responses[i]!==null&&responses[i]!==''?'answered ':''}${marked[i]?'marked ':''}" onclick="go(${i})">${i+1}</button>`).join('');}
function control(q,i){if(q.type==='mcq')return '<div class="options">'+q.options.map((op,j)=>`<label class="option"><input type="radio" name="answer_${i}" value="${j}" ${responses[i]===String(j)?'checked':''} ${submitted?'disabled':''}><span>(${labels[j]}) ${rich(op)}</span></label>`).join('')+'</div>';return `<input class="typed-answer" name="answer_${i}" value="${esc(responses[i]||'')}" placeholder="Type your answer" ${submitted?'disabled':''}>`;}
function renderQuestion(){const q=questions[current];host.innerHTML=`<div class="qhead"><div class="qnum">Question ${current+1} of ${questions.length}</div><div class="source">${esc(q.source)}</div></div><div class="qtext">${rich(q.question)}</div>${control(q,current)}<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Solution</h3><strong>Answer: ${rich(correctText(q))}</strong><div class="solution-content">${rich(q.solution)}</div></div><div class="navrow"><button type="button" onclick="markReviewNext()">Mark for Review & Next</button><button type="button" onclick="clearResponse()" ${submitted?'disabled':''}>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" onclick="nextQ()" class="save">Save & Next</button></div>`;if(submitted){showReview();}else{const s=document.getElementById('solution');if(s)s.style.display='none';}bindAnswer();renderBar();}
function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{el.addEventListener('input',()=>{responses[current]=el.value;renderBar();});el.addEventListener('change',()=>{responses[current]=el.value;renderBar();});});}
function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('input.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}function go(i){saveCurrent();current=i;renderQuestion();if(submitted)setTimeout(()=>{const el=document.querySelector('.qhead');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},0);}function prevQ(){if(current>0)go(current-1)}function nextQ(){if(current<questions.length-1)go(current+1)}function markReviewNext(){marked[current]=true;if(current<questions.length-1)nextQ();else renderQuestion()}function clearResponse(){responses[current]=null;renderQuestion()}
function isCorrect(q,a){if(a===null||a==='')return null;if(q.type==='mcq')return Number(a)===q.answer;const acc=(q.accepted&&q.accepted.length?q.accepted:[q.typedAnswer]).map(norm);return acc.includes(norm(a));}
function showReview(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';if(r===null){note.className='answer-note muted';note.innerHTML='Unattempted. Correct answer: '+rich(correctText(q));}else if(r){note.className='answer-note ok';note.textContent='Correct.';}else{note.className='answer-note bad';note.innerHTML='Wrong. Correct answer: '+rich(correctText(q));}}
function submitTest(){if(submitted)return;saveCurrent();submitted=true;document.body.classList.add('submitted-mode');let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++;});const score=c*3-w;resultBox.style.display='block';resultBox.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>${score}</strong></div><div class="score-box">Correct<strong>${c}</strong></div><div class="score-box">Wrong<strong>${w}</strong></div><div class="score-box">Attempted<strong>${c+w}</strong></div><div class="score-box">Unattempted<strong>${u}</strong></div></div>`;renderQuestion();renderBar();const sec=document.querySelector('main>section');if(sec)sec.scrollTop=0;}
function tick(){let m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest();return}secondsLeft--}
const calc=document.getElementById('calcPopup'),display=document.getElementById('calcDisplay');document.getElementById('calcToggle').onclick=()=>calc.classList.toggle('open');document.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>{let v=b.dataset.calc;if(v==='C')display.value='';else if(v==='='){try{display.value=Function('return ('+display.value.replace(/%/g,'/100')+')')()}catch(e){display.value='Error'}}else display.value+=v});
renderQuestion();tick();setInterval(tick,1000);
</script></body></html>
