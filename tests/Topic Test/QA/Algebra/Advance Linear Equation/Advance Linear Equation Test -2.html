y{width:100%;height:42px;text-align:right;font-size:20px;margin-bottom:8px}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.calc-grid button{height:36px;font-weight:700}

<script>const questions=[{"source":"Exercise 1(a) Q6","type":"text","question":"The number 284 has to be divided into two positive parts such that one part is a multiple of 9 and the other is a multiple of 17. In how many ways can the number be divided?","typedAnswer":"2","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let the two positive parts be 9p and 17q. Then 9p + 17q = 284.</li><li>Modulo 9 gives Rem(<span class='frac'><span>8q</span><span>9</span></span>) = 5.</li><li>The feasible q values are 4 and 13; the next value makes 17q ≥ 284.</li></ol><div class='final-answer'>Final Answer: 2 ways</div>","answer":"2","accepted":["2"]},{"source":"Exercise 1(a) Q7","type":"mcq","question":"Jasmine wants to buy some apples, oranges and jackfruits. Each apple costs ₹8, each orange costs ₹3 and each jackfruit costs ₹13. If she wants to spend ₹112 and wants to buy a minimum of 4 fruits of each variety, then in how many different combinations can she buy the fruits?","options":["1","2","3","4"],"answer":1,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let apples, oranges and jackfruits be x, y, z and set x = X + 4, y = Y + 4, z = Z + 4.</li><li>Then 8X + 3Y + 13Z = 16.</li><li>The non-negative solutions are (X,Y,Z) = (0,1,1) and (2,0,0).</li></ol><div class='final-answer'>Final Answer: 2 combinations (Option B)</div>"},{"source":"Exercise 1(a) Q8","type":"mcq","question":"A question paper contains a certain number of 10-mark, 5-mark and 2-mark questions with a total of 35 questions. The maximum marks that a student can secure in the paper are 100. How many 5-mark questions are there in the paper?","options":["30","2","3","4"],"answer":1,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let the numbers of 10-, 5- and 2-mark questions be x, y, z.</li><li>x + y + z = 35 and 10x + 5y + 2z = 100.</li><li>Eliminating z gives 8x + 3y = 30. The positive solution is x = 3, y = 2, z = 30.</li></ol><div class='final-answer'>Final Answer: 2 five-mark questions (Option B)</div>"},{"source":"Exercise 1(a) Q9","type":"mcq","question":"On a certain winter day, a dealer sold some woollen jackets, sweaters and gloves. He sold each jacket at ₹300, each sweater at ₹175 and each pair of gloves at ₹100. If the dealer sold at least one piece of each variety and made a total collection of ₹1175, then how many sweaters did he sell?","options":["1","5","4","2"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let jackets, sweaters and gloves be x, y, z. Then 300x + 175y + 100z = 1175, or 12x + 7y + 4z = 47.</li><li>Modulo 4 gives 3y ≡ 3 (mod 4), so y = 1, 5, 9, ... .</li><li>y = 5 makes 7y too large to allow both x and z positive. Thus y = 1.</li></ol><div class='final-answer'>Final Answer: 1 sweater (Option A)</div>"},{"source":"Exercise 1(a) Q10","type":"text","question":"An organization has 14 employees belonging to three different sections A, B and C. The monthly salaries of each of the employees of the sections A, B and C are ₹11000, ₹6000 and ₹2000 respectively. If the total salaries paid to the employees of all three sections is ₹84000, then the number of employees in section A is","typedAnswer":"4","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let employees in A, B, C be x, y, z.</li><li>x + y + z = 14 and 11x + 6y + 2z = 84.</li><li>Subtracting twice the first equation from the second gives 9x + 4y = 56.</li><li>The feasible positive solution is x = 4, y = 5, z = 5.</li></ol><div class='final-answer'>Final Answer: 4 employees in A</div>","answer":"4","accepted":["4"]},{"source":"Exercise 1(a) Q11","type":"text","question":"In an acute triangle, the angles are all positive integers, when measured in degrees. 13 times one of the angles is equal to 17 times another. What is the measure in degrees of the least possible angle in the triangle?","typedAnswer":"30","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let the related angles be A and B, with 13A = 17B. Hence A = 17k and B = 13k.</li><li>The third angle is C = 180 − 30k.</li><li>For k = 4, the triangle is (68°, 52°, 60°); for k = 5, it is (85°, 65°, 30°). Both are acute.</li><li>The least possible angle across all valid acute triangles is 30°.</li></ol><div class='final-answer'>Final Answer: 30°</div>","answer":"30","accepted":["30"]},{"source":"Exercise 1(a) Q12","type":"mcq","question":"Ajay spent ₹1000 for buying blackboards and white chalk boxes for his school. Each blackboard cost ₹25 and each chalk box cost ₹5. He noted that if he had bought as many chalk boxes as the blackboards and as many blackboards as the chalk boxes he had actually bought, he would have spent less than half of what he actually spent. In how many different combinations could he have bought the items?","options":["1","2","3","4"],"answer":1,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let blackboards = x and chalk boxes = y. Then 25x + 5y = 1000, so 5x + y = 200.</li><li>If quantities are interchanged, the cost is 25y + 5x < 500, so 5y + x < 100.</li><li>Combining gives x > 37.5 while x < 40. Thus x = 38 or 39.</li></ol><div class='final-answer'>Final Answer: 2 combinations (Option B)</div>"},{"source":"Exercise 1(a) Q13","type":"mcq","question":"Using the same Ajay data: if Ajay bought at least 10 of each of the items, then how many blackboards did he buy?","options":["38","39","40","37"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>From the same equations, the feasible pairs are (x,y) = (38,10) and (39,5).</li><li>If at least 10 of each are bought, only (38,10) remains.</li></ol><div class='final-answer'>Final Answer: 38 blackboards (Option A)</div>"},{"source":"Exercise 1(a) Q14","type":"mcq","question":"Lokesh purchased a total of 38 CDs, DVDs and cassettes spending ₹3540. Each CD cost ₹80, each DVD ₹150 and each cassette ₹30. Among all possible combinations, if the number of CDs is as great as it can be, how many DVDs and cassettes together did he buy?","options":["21","23","14","12"],"answer":2,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let CDs, DVDs, cassettes be x, y, z.</li><li>x + y + z = 38 and 80x + 150y + 30z = 3540.</li><li>Eliminating z gives 5x + 12y = 240.</li><li>Feasible solutions are (x,y,z) = (12,15,11) and (24,10,4). Maximum CDs occurs at x = 24, so y + z = 14.</li></ol><div class='final-answer'>Final Answer: 14 (Option C)</div>"},{"source":"Exercise 1(a) Q15","type":"mcq","question":"Using the same Lokesh data: if the number of DVDs is as small as it can be, how many cassettes did he buy?","options":["4","12","10","6"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>From the feasible Lokesh combinations (12,15,11) and (24,10,4), the minimum possible number of DVDs is 10.</li><li>In that case the number of cassettes is 4.</li></ol><div class='final-answer'>Final Answer: 4 (Option A)</div>"},{"source":"Exercise 1(a) Q16","type":"text","question":"How many 3-digit numbers are there which leave a remainder of 5 when divided by 17 and a remainder of 6 when divided by 11?","typedAnswer":"6","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>A required number N satisfies N = 17p + 5 and N = 11q + 6.</li><li>Thus 17p − 11q = 1. Modulo 11 gives 6p ≡ 1 (mod 11), so p = 2, 13, 24, 35, 46, 57, ... .</li><li>These give the six 3-digit numbers before p = 68 makes N exceed 999.</li></ol><div class='final-answer'>Final Answer: 6</div>","answer":"6","accepted":["6"]},{"source":"Exercise 1(a) Q17","type":"text","question":"Meghana bought packs of ice-cream in two flavours—vanilla and strawberry—spending a total of ₹710. If each vanilla pack costs ₹55 and each strawberry pack costs ₹80, then how many packs did she buy in all?","typedAnswer":"12","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let vanilla and strawberry packs be x and y. Then 55x + 80y = 710, or 11x + 16y = 142.</li><li>Modulo 11 gives 5y ≡ 10, hence y = 2 (next is 13, too large).</li><li>Then x = 10 and total packs = 12.</li></ol><div class='final-answer'>Final Answer: 12</div>","answer":"12","accepted":["12"]},{"source":"Exercise 1(a) Q18","type":"mcq","question":"In a certain cricket match, Mithali Raj scored 130 runs only in sixes, twos and singles. The total number of scoring shots was 42. The number of sixes hit is at least 8 more than the number of twos and the number of singles is at most 10 more than the number of twos. How many sixers did Mithali Raj hit?","options":["16","18","8","17"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let sixes, twos and singles be x, y, z.</li><li>6x + 2y + z = 130 and x + y + z = 42.</li><li>Using x − y ≥ 8 and z − y ≤ 10 with the two equations forces x = 16, y = 8, z = 18.</li></ol><div class='final-answer'>Final Answer: 16 sixes (Option A)</div>"},{"source":"Exercise 1(a) Q19","type":"mcq","question":"Using the same Mithali Raj data, which of the following statements is/are true?","options":["The number of sixers is twice the number of twos and the runs scored in sixes are 96.","The number of singles is 2 more than the number of sixers.","The runs scored in twos and singles are eight less than the number of scoring shots.","All the above"],"answer":3,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>From Q18, (x,y,z) = (16,8,18).</li><li>Sixers are twice twos and runs in sixes = 96; singles = 18 is 2 more than sixers; runs in twos plus singles = 34, which is 8 less than 42 scoring shots.</li><li>Therefore all statements are true.</li></ol><div class='final-answer'>Final Answer: All the above (Option D)</div>"},{"source":"Exercise 1(a) Q20","type":"text","question":"A potter makes more than 100 but less than 300 pots and arranges them in rows, with each row containing the same number of pots. If he places 6 pots more per row, he can arrange them in 10 fewer rows. How many pots does the potter make?","typedAnswer":"225","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let x be the number of rows and y the number of pots per row. Then total pots = xy.</li><li>With 6 more pots per row and 10 fewer rows: (x − 10)(y + 6) = xy.</li><li>Expanding gives 6x − 10y − 60 = 0, or 3x − 5y = 30.</li><li>The feasible pairs with 100 < xy < 300 include (x,y) = (20,6) and (25,9); the source solution selects the required value 25×9 = 225.</li></ol><div class='final-answer'>Final Answer: 225</div>","answer":"225","accepted":["225"]},{"source":"Exercise 1(a) Q21","type":"text","question":"Pallavi has coins of ₹5, ₹2 and ₹1. The number of ₹2 coins is four times the number of ₹1 coins and the total amount is ₹135. If Pallavi has at least 10 five-rupee coins, then how many coins does she have in all?","typedAnswer":"43","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let the number of ₹5 coins be x, the number of ₹1 coins be y, so ₹2 coins = 4y.</li><li>Then 5x + 9y = 135.</li><li>Since x ≥ 10, the feasible solution is x = 18, y = 5.</li><li>Total coins = x + 4y + y = 18 + 25 = 43.</li></ol><div class='final-answer'>Final Answer: 43</div>","answer":"43","accepted":["43"]},{"source":"Exercise 1(a) Q22","type":"mcq","question":"Anoop Bhandari bought diamonds, rubies and sapphires for ₹75000. Their prices are ₹1800, ₹2700 and ₹1200 respectively. He bought 42 stones and at least 5 of each. If two varieties were bought in equal number, how many rubies did he buy?","options":["12","10","8","6"],"answer":1,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let diamonds, rubies and sapphires be x, y, z.</li><li>x + y + z = 42 and 1800x + 2700y + 1200z = 75000.</li><li>Eliminating z gives 2x + 5y = 82. Feasible triples include (26,6,10), (21,8,13), (16,10,16), (11,12,19), (6,14,22).</li><li>The only case with two varieties equal is x = z = 16, so y = 10.</li></ol><div class='final-answer'>Final Answer: 10 rubies (Option B)</div>"},{"source":"Exercise 1(a) Q23","type":"mcq","question":"Using the same Anoop data: if the number of sapphires was more than the number of diamonds and rubies together, then how many diamonds did he buy?","options":["6","12","14","10"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Using the feasible triples from Q22, require z > x + y.</li><li>This occurs for (x,y,z) = (6,14,22).</li></ol><div class='final-answer'>Final Answer: 6 diamonds (Option A)</div>"},{"source":"Exercise 1(a) Q24","type":"mcq","question":"There are two kinds of insects in an anthill. The first kind triples every day and the second kind becomes 6 times every day. Initially there are more than 25 of the first kind and more than 2 of the second kind. After 4 days the total is 6804. Find the total number of insects at the beginning.","options":["54","24","39","69"],"answer":2,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let initial insects be a and b. After 4 days, counts are 81a and 1296b.</li><li>81a + 1296b = 6804, so a + 16b = 84.</li><li>With a > 25 and b > 2, the feasible solution is (a,b) = (36,3).</li><li>Initial total = 39.</li></ol><div class='final-answer'>Final Answer: 39 (Option C)</div>"},{"source":"Exercise 1(a) Q25","type":"text","question":"Arpitha buys pens, rulers and refills. She buys twice as many refills as pens and at least 10 pens more than rulers. Refills cost half as much as pens and rulers cost three times as much as refills. If each refill costs ₹5 and Arpitha spends ₹350, how many items did she buy in all?","typedAnswer":"50","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let pens = x, rulers = y and refills = 2x.</li><li>A refill costs ₹5, hence a pen costs ₹10 and a ruler ₹15.</li><li>10x + 15y + 5(2x) = 350 gives 4x + 3y = 70.</li><li>Together with x ≥ y + 10, the feasible pair is x = 16, y = 2. Total items = 16 + 2 + 32 = 50.</li></ol><div class='final-answer'>Final Answer: 50</div>","answer":"50","accepted":["50"]}];
const labels=['A','B','C','D'];let current=0,submitted=false,secondsLeft=45*60;const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false);const host=document.getElementById('questionHost'),qbar=document.getElementById('qbar'),resultBox=document.getElementById('result');
function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}function norm(s){return String(s??'').toLowerCase().replace(/[₹,()\s]/g,'').replace(/years?|days?|km|kg/g,'').trim();}

function hasHtml(s){return /<[^>]+>/.test(String(s??''));}
function formatMathText(text){
  let out=esc(text);
  out=out.replace(/√\s*\(([^()]+)\)/g,'<span class="sqrt"><span class="sqrt-radicand">$1</span></span>');
  out=out.replace(/√\s*([A-Za-z0-9]+)/g,'<span class="sqrt"><span class="sqrt-radicand">$1</span></span>');
  out=out.replace(/([A-Za-z0-9\)])\^\s*\{?(-?\d+)\}?/g,'$1<sup>$2</sup>');
  out=out.replace(/(^|[^\w>])([A-Za-z0-9]+)\s*\/\s*([A-Za-z0-9]+)(?![\w<])/g,'$1<span class="frac"><span>$2</span><span>$3</span></span>');
  return out;
}
function formatMathHtml(html){
  const template=document.createElement('template');template.innerHTML=String(html??'');
  const walker=document.createTreeWalker(template.content,NodeFilter.SHOW_TEXT);const nodes=[];
  while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(node=>{const parent=node.parentElement;if(parent&&(parent.closest('.frac')||parent.tagName==='SCRIPT'||parent.tagName==='STYLE'))return;const span=document.createElement('span');span.innerHTML=formatMathText(node.nodeValue);node.replaceWith(...Array.from(span.childNodes));});
  return template.innerHTML;
}
function rich(s){return hasHtml(s)?formatMathHtml(s):formatMathText(s);}
function answerIndex(q){return q.answer;}function correctText(q){if(q.type==='mcq'){let i=q.answer;return '('+labels[i]+') '+q.options[i];}return q.typedAnswer;}
function renderBar(){qbar.innerHTML=questions.map((q,i)=>`<button type="button" class="qbtn ${i===current?'current ':''}${responses[i]!==null&&responses[i]!==''?'answered ':''}${marked[i]?'marked ':''}" onclick="go(${i})">${i+1}</button>`).join('');}
function control(q,i){if(q.type==='mcq')return '<div class="options">'+q.options.map((op,j)=>`<label class="option"><input type="radio" name="answer_${i}" value="${j}" ${responses[i]===String(j)?'checked':''} ${submitted?'disabled':''}><span>(${labels[j]}) ${rich(op)}</span></label>`).join('')+'</div>';return `<input class="typed-answer" name="answer_${i}" value="${esc(responses[i]||'')}" placeholder="Type your answer" ${submitted?'disabled':''}>`;}
function renderQuestion(){const q=questions[current];host.innerHTML=`<div class="qhead"><div class="qnum">Question ${current+1} of ${questions.length}</div><div class="source">${esc(q.source)}</div></div><div class="qtext">${rich(q.question)}</div>${control(q,current)}<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Solution</h3><strong>Answer: ${rich(correctText(q))}</strong><div class="solution-content">${rich(q.solution)}</div></div><div class="navrow"><button type="button" onclick="markReviewNext()">Mark for Review & Next</button><button type="button" onclick="clearResponse()" ${submitted?'disabled':''}>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" onclick="nextQ()" class="save">Save & Next</button></div>`;if(submitted){showReview();}else{const s=document.getElementById('solution');if(s)s.style.display='none';}bindAnswer();renderBar();}
function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{el.addEventListener('input',()=>{responses[current]=el.value;renderBar();});el.addEventListener('change',()=>{responses[current]=el.value;renderBar();});});}
function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('input.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}function go(i){saveCurrent();current=i;renderQuestion();if(submitted)setTimeout(()=>{const el=document.querySelector('.qhead');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},0);}function prevQ(){if(current>0)go(current-1)}function nextQ(){if(current<questions.length-1)go(current+1)}function markReviewNext(){marked[current]=true;if(current<questions.length-1)nextQ();else renderQuestion()}function clearResponse(){responses[current]=null;renderQuestion()}
function isCorrect(q,a){if(a===null||a==='')return null;if(q.type==='mcq')return Number(a)===q.answer;const acc=(q.accepted&&q.accepted.length?q.accepted:[q.typedAnswer]).map(norm);return acc.includes(norm(a));}
function showReview(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';if(r===null){note.className='answer-note muted';note.innerHTML='Unattempted. Correct answer: '+rich(correctText(q));}else if(r){note.className='answer-note ok';note.textContent='Correct.';}else{note.className='answer-note bad';note.innerHTML='Wrong. Correct answer: '+rich(correctText(q));}}
function submitTest(){if(submitted)return;saveCurrent();submitted=true;document.body.classList.add('submitted-mode');let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++;});const score=c*3-w;resultBox.style.display='block';resultBox.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>${score}</strong></div><div class="score-box">Correct<strong>${c}</strong></div><div class="score-box">Wrong<strong>${w}</strong></div><div class="score-box">Attempted<strong>${c+w}</strong></div><div class="score-box">Unattempted<strong>${u}</strong></div></div>`;renderQuestion();renderBar();const sec=document.querySelector('main>section');if(sec)sec.scrollTop=0;}
function tick(){let m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest();return}secondsLeft--}
const calc=document.getElementById('calcPopup'),display=document.getElementById('calcDisplay');document.getElementById('calcToggle').onclick=()=>calc.classList.toggle('open');document.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>{let v=b.dataset.calc;if(v==='C')display.value='';else if(v==='='){try{display.value=Function('return ('+display.value.replace(/%/g,'/100')+')')()}catch(e){display.value='Error'}}else display.value+=v});
renderQuestion();tick();setInterval(tick,1000);
</script></body></html>
