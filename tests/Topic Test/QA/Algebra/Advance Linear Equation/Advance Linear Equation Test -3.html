<script>const questions=[{"source":"Exercise 1(a) Q26","type":"text","question":"How many ordered pairs of positive integers (x, y) satisfy 1/x + 1/y = 1/12?","typedAnswer":"15","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li><span class='frac'><span>1</span><span>x</span></span> + <span class='frac'><span>1</span><span>y</span></span> = <span class='frac'><span>1</span><span>12</span></span>.</li><li>Multiplying through and rearranging: xy − 12x − 12y = 0, so (x − 12)(y − 12) = 144.</li><li>Counting admissible positive factor assignments as in the source solution gives 15 ordered pairs.</li></ol><div class='final-answer'>Final Answer: 15</div>","answer":"15","accepted":["15"]},{"source":"Exercise 1(a) Q27","type":"mcq","question":"How many ordered pairs of integers (x, y), where y > 0, satisfy 5/x + 1/y = 1/31?","options":["2","4","6","8"],"answer":3,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li><span class='frac'><span>5</span><span>x</span></span> + <span class='frac'><span>1</span><span>y</span></span> = <span class='frac'><span>1</span><span>31</span></span>.</li><li>Rearranging gives (x − 155)(y − 31) = 5·31².</li><li>Considering positive and negative factor assignments while keeping y > 0 gives 8 admissible ordered pairs.</li></ol><div class='final-answer'>Final Answer: 8 (Option D)</div>"},{"source":"Exercise 1(a) Q28","type":"mcq","question":"How many ordered pairs of integers satisfy 11/x − 2/y = 1/9?","options":["16","32","15","40"],"answer":3,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li><span class='frac'><span>11</span><span>x</span></span> − <span class='frac'><span>2</span><span>y</span></span> = <span class='frac'><span>1</span><span>9</span></span>.</li><li>Rearranging gives (x − 99)(y + 18) = −18·99.</li><li>The RHS has 20 positive factors; allowing positive and negative assignments gives 40 integral ordered pairs.</li></ol><div class='final-answer'>Final Answer: 40 (Option D)</div>"},{"source":"Exercise 1(a) Q29","type":"mcq","question":"How many positive integral values of (x, y) satisfy x² − y² = 1155?","options":["16","32","8","4"],"answer":2,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>x² − y² = (x − y)(x + y) = 1155 = 3·5·7·11.</li><li>For x,y positive, both factors are positive and x + y > x − y.</li><li>The valid positive factor-pair assignments give 8 ordered pairs (x,y).</li></ol><div class='final-answer'>Final Answer: 8 (Option C)</div>"},{"source":"Exercise 1(a) Q30","type":"text","question":"If a² − b² = 132, how many integral values can (a, b) take?","typedAnswer":"8","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>a² − b² = (a − b)(a + b) = 132.</li><li>Both factor expressions must have the same parity. The valid positive assignments are (2,66), (6,22), (22,6), (66,2) in factor form, giving four (a,b) pairs.</li><li>Changing the signs of both a and b gives four more.</li></ol><div class='final-answer'>Final Answer: 8</div>","answer":"8","accepted":["8"]},{"source":"Exercise 1(b) Q1","type":"mcq","question":"Ramu told Ravi, “8 times the date of my birth added to 15 times the month of my birth is 240.” In which month was Ramu born?","options":["January","March","September","August"],"answer":3,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let date = d and month = m. Then 8d + 15m = 240.</li><li>Dividing by 8 gives d + m + <span class='frac'><span>7m</span><span>8</span></span> = 30.</li><li>For the equation to be integral, <span class='frac'><span>7m</span><span>8</span></span> must be an integer, so m is divisible by 8.</li><li>Since 1 ≤ m ≤ 12, m = 8.</li></ol><div class='final-answer'>Final Answer: August (Option D)</div>"},{"source":"Exercise 1(b) Q2","type":"text","question":"A fruit-seller wants to sell mangoes costing ₹5 each and apples costing ₹6 each to get exactly ₹100. In how many combinations can he sell the fruits if he sells at least one of each kind?","typedAnswer":"3","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let mangoes = m and apples = a. Then 5m + 6a = 100.</li><li>Modulo 5, a must be a multiple of 5.</li><li>The positive possibilities are a = 5, 10, 15, with m = 14, 8, 2.</li></ol><div class='final-answer'>Final Answer: 3 combinations</div>","answer":"3","accepted":["3"]},{"source":"Exercise 1(b) Q3","type":"mcq","question":"In June, a craftsman earns ₹50 on a day he completes his target and ₹30 otherwise. If by the end of the month he earns ₹1430, on how many days did he not complete the task?","options":["28","1","15","5"],"answer":1,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let x be days target completed and y days not completed.</li><li>x + y ≤ 30 and 50x + 30y = 1430, so 5x + 3y = 143.</li><li>The only pair satisfying both conditions is x = 28, y = 1.</li></ol><div class='final-answer'>Final Answer: 1 day not completed (Option B)</div>"},{"source":"Exercise 1(b) Q4","type":"mcq","question":"In the previous question, for how many days did the craftsman report for work?","options":["29","24","28","30"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>From Q3, x = 28 completed days and y = 1 incomplete day.</li><li>Total days reported for work = 28 + 1 = 29.</li></ol><div class='final-answer'>Final Answer: 29 days (Option A)</div>"},{"source":"Exercise 1(b) Q5","type":"text","question":"In how many ways can 149 be divided into two positive parts such that one part is divisible by 5 and the other part is divisible by 8?","typedAnswer":"4","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let the parts be 5p and 8q. Then 5p + 8q = 149.</li><li>Modulo 5 gives 3q ≡ 4, so q = 3, 8, 13, 18.</li><li>These produce four positive values of p.</li></ol><div class='final-answer'>Final Answer: 4 ways</div>","answer":"4","accepted":["4"]},{"source":"Exercise 1(b) Q6","type":"text","question":"How many 2-digit numbers leave a remainder of 1 when divided by 17 and a remainder of 2 when divided by 3?","typedAnswer":"2","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>A required two-digit number N satisfies N = 17x + 1 and N = 3y + 2.</li><li>Thus 17x − 3y = 1. Modulo 3 gives 2x ≡ 1, so x = 2, 5, 8, ... .</li><li>Only x = 2 and 5 give two-digit N: 35 and 86.</li></ol><div class='final-answer'>Final Answer: 2</div>","answer":"2","accepted":["2"]},{"source":"Exercise 1(b) Q7","type":"mcq","question":"A and B together have fewer than 60 chocolates. If A gives a certain number to B, then B would have thrice the number left with A. If instead B gives the same number to A, both would have the same number. The number of chocolates with A can be","options":["6","16","19","14"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let A and B have a and b chocolates. Eliminating the transferred number from the two conditions gives 5a = 3b.</li><li>Hence a must be a multiple of 3.</li><li>Considering a + b < 60, the listed feasible value is a = 6.</li></ol><div class='final-answer'>Final Answer: 6 (Option A)</div>"},{"source":"Exercise 1(b) Q8","type":"text","question":"The average percentage of n students is 75. Three students with 75%, 85% and 99% join and one student whose percentage is between 94 and 100 leaves. The average increases by 2. If initially n is a multiple of 5, what is the number of students in the group now?","typedAnswer":"7","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let the initial number of students be n and the percentage of the leaving student be x.</li><li><span class='frac'><span>75n + 75 + 85 + 99 − x</span><span>n + 2</span></span> = 77.</li><li>This simplifies to x = 105 − 2n. With 94 < x < 100, 2.5 < n < 5.5.</li><li>Since n is a multiple of 5, n = 5. The new group size is 7.</li></ol><div class='final-answer'>Final Answer: 7</div>","answer":"7","accepted":["7"]},{"source":"Exercise 1(b) Q9","type":"mcq","question":"Ravi wants pencils, pens and sheets of paper spending ₹50. Each pen costs ₹6, pencil ₹5 and sheet ₹3. If he wants at least 3 items of each kind, in how many combinations can he buy the items?","options":["4","1","2","3"],"answer":1,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let pencils, pens, sheets be a, b, c. Then 5a + 6b + 3c = 50.</li><li>At least 3 of each costs ₹42, leaving ₹8.</li><li>The only way to use the remaining ₹8 while keeping integer counts is one extra pencil and one extra sheet.</li></ol><div class='final-answer'>Final Answer: 1 combination (Option B)</div>"},{"source":"Exercise 1(b) Q10","type":"text","question":"A book dealer sold art books at ₹100, science books at ₹120 and magazines at ₹25. Total sales were ₹685. What is the maximum possible number of books and magazines sold, if at least one of each kind was sold?","typedAnswer":"13","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let science, art and magazine counts be s, a, m.</li><li>120s + 100a + 25m = 685, or 24s + 20a + 5m = 137.</li><li>Modulo 5 gives 4s ≡ 2, so s = 3 is the only positive feasible value.</li><li>Then 4a + m = 13. To maximize total items, choose a = 1, m = 9, giving 3 + 1 + 9 = 13.</li></ol><div class='final-answer'>Final Answer: 13</div>","answer":"13","accepted":["13"]},{"source":"Exercise 1(b) Q11","type":"text","question":"A gift shop owner buys gifts A and B spending ₹4000. A costs ₹100 and B costs ₹20. If the numbers of A and B were interchanged, the spending would be less than half of ₹4000. In how many different combinations could he have bought the gifts?","typedAnswer":"2","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let counts of gifts A and B be x and y. Then 100x + 20y = 4000, so 5x + y = 200.</li><li>After interchanging counts, 100y + 20x < 2000, so 5y + x < 100.</li><li>The feasible x values are 38 and 39, giving two combinations.</li></ol><div class='final-answer'>Final Answer: 2</div>","answer":"2","accepted":["2"]},{"source":"Exercise 1(b) Q12","type":"text","question":"Using the same gift-shop data, if he buys at least 10 pieces of each variety, then how many gifts did he buy in total?","typedAnswer":"48","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>From Q11, the pairs are (x,y) = (38,10) and (39,5).</li><li>With at least 10 of each, only (38,10) remains.</li><li>Total gifts = 48.</li></ol><div class='final-answer'>Final Answer: 48</div>","answer":"48","accepted":["48"]},{"source":"Exercise 1(b) Q13","type":"mcq","question":"In a triangle, all angles are acute positive integers. 19 times one angle equals 21 times another. What is a possible value of the least angle?","options":["19","20","57","49"],"answer":1,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let two linked angles be x and y with 19x = 21y. Hence x = 21k and y = 19k.</li><li>The third angle is 180 − 40k.</li><li>For k = 4, the acute triangle is (84°, 76°, 20°), so the least angle can be 20°.</li></ol><div class='final-answer'>Final Answer: 20° (Option B)</div>"},{"source":"Exercise 1(b) Q14","type":"mcq","question":"Ravi bought 40 pens of varieties A, B and C costing ₹24, ₹50 and ₹30 respectively, spending ₹1420. If he bought the greatest number of pens of variety B, how many pens of varieties A and C together did he buy?","options":["23","26","24","25"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let counts of A, B, C pens be a, b, c.</li><li>a + b + c = 40 and 24a + 50b + 30c = 1420.</li><li>Eliminating c gives −3a + 10b = 110.</li><li>Maximum b occurs at b = 17, giving a = 20 and c = 3. Thus A + C = 23.</li></ol><div class='final-answer'>Final Answer: 23 (Option A)</div>"},{"source":"Exercise 1(b) Q15","type":"mcq","question":"Ram bought art books at ₹72 each and science books at ₹110 each. If he tendered exactly ₹1020, how many books could he have bought in total?","options":["10","9","11","14"],"answer":2,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let art books = x and science books = y. Then 72x + 110y = 1020, or 36x + 55y = 510.</li><li>The positive integer solution is x = 5, y = 6.</li><li>Total books = 11.</li></ol><div class='final-answer'>Final Answer: 11 (Option C)</div>"}];
const labels=['A','B','C','D'];let current=0,submitted=false,secondsLeft=45*60;const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false);const host=document.getElementById('questionHost'),qbar=document.getElementById('qbar'),resultBox=document.getElementById('result');
function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}function norm(s){return String(s??'').toLowerCase().replace(/[₹,()\s]/g,'').replace(/years?|days?|km|kg/g,'').trim();}

function hasHtml(s){return /<[^>]+>/.test(String(s??''));}
function formatMathText(text){
  let out=esc(text);
  out=out.replace(/√\s*\(([^()]+)\)/g,'<span class="sqrt"><span class="sqrt-radicand">$1</span></span>');
  out=out.replace(/√\s*([A-Za-z0-9]+)/g,'<span class="sqrt"><span class="sqrt-radicand">$1</span></span>');
  out=out.replace(/([A-Za-z0-9\)])\^\s*\{?(-?\d+)\}?/g,'$1<sup>$2</sup>');
  out=out.replace(/(^|[^\w>])([A-Za-z0-9]+)\s*\/\s*([A-Za-z0-9]+)(?![\w<])/g,'$1<span class="frac"><span>$2</span><span>$3</span></span>');
  return out;
}
function formatMathHtml(html){
  const template=document.createElement('template');template.innerHTML=String(html??'');
  const walker=document.createTreeWalker(template.content,NodeFilter.SHOW_TEXT);const nodes=[];
  while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(node=>{const parent=node.parentElement;if(parent&&(parent.closest('.frac')||parent.tagName==='SCRIPT'||parent.tagName==='STYLE'))return;const span=document.createElement('span');span.innerHTML=formatMathText(node.nodeValue);node.replaceWith(...Array.from(span.childNodes));});
  return template.innerHTML;
}
function rich(s){return hasHtml(s)?formatMathHtml(s):formatMathText(s);}
function answerIndex(q){return q.answer;}function correctText(q){if(q.type==='mcq'){let i=q.answer;return '('+labels[i]+') '+q.options[i];}return q.typedAnswer;}
function renderBar(){qbar.innerHTML=questions.map((q,i)=>`<button type="button" class="qbtn ${i===current?'current ':''}${responses[i]!==null&&responses[i]!==''?'answered ':''}${marked[i]?'marked ':''}" onclick="go(${i})">${i+1}</button>`).join('');}
function control(q,i){if(q.type==='mcq')return '<div class="options">'+q.options.map((op,j)=>`<label class="option"><input type="radio" name="answer_${i}" value="${j}" ${responses[i]===String(j)?'checked':''} ${submitted?'disabled':''}><span>(${labels[j]}) ${rich(op)}</span></label>`).join('')+'</div>';return `<input class="typed-answer" name="answer_${i}" value="${esc(responses[i]||'')}" placeholder="Type your answer" ${submitted?'disabled':''}>`;}
function renderQuestion(){const q=questions[current];host.innerHTML=`<div class="qhead"><div class="qnum">Question ${current+1} of ${questions.length}</div><div class="source">${esc(q.source)}</div></div><div class="qtext">${rich(q.question)}</div>${control(q,current)}<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Solution</h3><strong>Answer: ${rich(correctText(q))}</strong><div class="solution-content">${rich(q.solution)}</div></div><div class="navrow"><button type="button" onclick="markReviewNext()">Mark for Review & Next</button><button type="button" onclick="clearResponse()" ${submitted?'disabled':''}>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" onclick="nextQ()" class="save">Save & Next</button></div>`;if(submitted){showReview();}else{const s=document.getElementById('solution');if(s)s.style.display='none';}bindAnswer();renderBar();}
function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{el.addEventListener('input',()=>{responses[current]=el.value;renderBar();});el.addEventListener('change',()=>{responses[current]=el.value;renderBar();});});}
function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('input.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}function go(i){saveCurrent();current=i;renderQuestion();if(submitted)setTimeout(()=>{const el=document.querySelector('.qhead');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},0);}function prevQ(){if(current>0)go(current-1)}function nextQ(){if(current<questions.length-1)go(current+1)}function markReviewNext(){marked[current]=true;if(current<questions.length-1)nextQ();else renderQuestion()}function clearResponse(){responses[current]=null;renderQuestion()}
function isCorrect(q,a){if(a===null||a==='')return null;if(q.type==='mcq')return Number(a)===q.answer;const acc=(q.accepted&&q.accepted.length?q.accepted:[q.typedAnswer]).map(norm);return acc.includes(norm(a));}
function showReview(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';if(r===null){note.className='answer-note muted';note.innerHTML='Unattempted. Correct answer: '+rich(correctText(q));}else if(r){note.className='answer-note ok';note.textContent='Correct.';}else{note.className='answer-note bad';note.innerHTML='Wrong. Correct answer: '+rich(correctText(q));}}
function submitTest(){if(submitted)return;saveCurrent();submitted=true;document.body.classList.add('submitted-mode');let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++;});const score=c*3-w;resultBox.style.display='block';resultBox.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>${score}</strong></div><div class="score-box">Correct<strong>${c}</strong></div><div class="score-box">Wrong<strong>${w}</strong></div><div class="score-box">Attempted<strong>${c+w}</strong></div><div class="score-box">Unattempted<strong>${u}</strong></div></div>`;renderQuestion();renderBar();const sec=document.querySelector('main>section');if(sec)sec.scrollTop=0;}
function tick(){let m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest();return}secondsLeft--}
const calc=document.getElementById('calcPopup'),display=document.getElementById('calcDisplay');document.getElementById('calcToggle').onclick=()=>calc.classList.toggle('open');document.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>{let v=b.dataset.calc;if(v==='C')display.value='';else if(v==='='){try{display.value=Function('return ('+display.value.replace(/%/g,'/100')+')')()}catch(e){display.value='Error'}}else display.value+=v});
renderQuestion();tick();setInterval(tick,1000);
</script></body></html>
