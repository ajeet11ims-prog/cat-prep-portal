<script>const questions=[{"source":"Exercise 1(b) Q16","type":"mcq","question":"Eat-well Candies sells eclairs at ₹3, caramels at ₹2 and mints at ₹1. Ravi bought chocolates for ₹45 and bought twice as many mints as caramels. How many eclairs could he have bought?","options":["4","7","6","10"],"answer":1,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let eclairs, caramels and mints be x, y, z. Given z = 2y.</li><li>3x + 2y + z = 45, so 3x + 4y = 45.</li><li>Feasible y values are 3, 6, 9, giving x = 11, 7, 3.</li><li>Among the options, 7 is possible.</li></ol><div class='final-answer'>Final Answer: 7 eclairs (Option B)</div>"},{"source":"Exercise 1(b) Q17","type":"mcq","question":"Kishan Lal, a jeweller, bought 27 precious stones of types A, B and C for ₹30000. The prices are ₹750, ₹1000 and ₹1250 respectively. He bought more than 3 stones of each variety and did not buy the same number of any two varieties. How many stones of types A and B together did he buy?","options":["11","12","13","14"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let stone counts A, B, C be a, b, c.</li><li>a + b + c = 27 and 750a + 1000b + 1250c = 30000.</li><li>The additional condition that no two counts are equal yields the feasible solution a = 4, b = 7, c = 16.</li><li>Thus A + B = 11.</li></ol><div class='final-answer'>Final Answer: 11 (Option A)</div>"},{"source":"Exercise 1(b) Q18","type":"mcq","question":"Using the same Kishan Lal data, which variety of stones did he buy the most?","options":["A","B","C","A or B"],"answer":2,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>From Q17, the counts are A = 4, B = 7, C = 16.</li><li>Hence variety C is bought the most.</li></ol><div class='final-answer'>Final Answer: C (Option C)</div>"},{"source":"Exercise 1(b) Q19","type":"text","question":"A cashier collects ₹700 in 27 notes of ₹50, ₹10 and ₹5. The number of ₹5 notes is less than the number of ₹50 notes, and the difference is at most 2. How many ₹10 notes does the cashier have?","typedAnswer":"5","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let ₹50, ₹10, ₹5 note counts be a, b, c.</li><li>a + b + c = 27 and 50a + 10b + 5c = 700.</li><li>The condition on ₹5 and ₹50 notes leads to the feasible solution a = 12, b = 5, c = 10.</li></ol><div class='final-answer'>Final Answer: 5 ten-rupee notes</div>","answer":"5","accepted":["5"]},{"source":"Exercise 1(b) Q20","type":"text","question":"Using the same cashier data, if he loses two ₹50 notes, then how many ₹50 notes would he have?","typedAnswer":"10","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>From Q19, the cashier has 12 notes of ₹50.</li><li>After losing two, 12 − 2 = 10 remain.</li></ol><div class='final-answer'>Final Answer: 10</div>","answer":"10","accepted":["10"]},{"source":"Exercise 1(b) Q21","type":"mcq","question":"A fruit vendor packs fewer than 21 dozen fruits into more than 15 boxes. If he packs 5 fruits less per box, he needs 10 boxes more. How many fruits does he pack?","options":["208","168","132","100"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let x be boxes and y fruits per box. Then xy < 252 and x > 15.</li><li>If 5 fewer fruits are packed per box and 10 extra boxes are needed: xy = (x + 10)(y − 5).</li><li>This gives x = 2y − 10. Testing y gives (x,y) = (16,13) as the only pair with xy < 252 before the next pair reaches 252.</li><li>Total fruits = 16 × 13 = 208.</li></ol><div class='final-answer'>Final Answer: 208 (Option A)</div>"},{"source":"Exercise 1(b) Q22","type":"mcq","question":"Madhavi has 5 times as many ₹1 stamps as ₹3 stamps and also some ₹5 stamps. The total value is ₹75. If she has at least 20 one-rupee stamps, how many stamps does she have in all?","options":["36","37","38","39"],"answer":1,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let ₹1, ₹3 and ₹5 stamp counts be r, t, f. Given r = 5t and r ≥ 20.</li><li>r + 3t + 5f = 75 gives 8t + 5f = 75.</li><li>The feasible t is 5, giving f = 7 and r = 25.</li><li>Total stamps = 25 + 5 + 7 = 37.</li></ol><div class='final-answer'>Final Answer: 37 (Option B)</div>"},{"source":"Exercise 1(b) Q23","type":"text","question":"Ram and Ravi, two magicians, present a magic show. Ram triples every red flower in 10 seconds and Ravi doubles every yellow flower in 10 seconds. If after a minute there were 1049 red and yellow flowers, how many flowers were there initially?","typedAnswer":"6","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let initial red and yellow flowers be x and y.</li><li>In one minute (six 10-second intervals), red flowers become 3⁶x = 729x and yellow flowers become 2⁶y = 64y.</li><li>729x + 64y = 1049. With positive integers, x = 1 and y = 5.</li><li>Initial total = 6.</li></ol><div class='final-answer'>Final Answer: 6</div>","answer":"6","accepted":["6"]},{"source":"Exercise 1(b) Q24","type":"mcq","question":"How many ordered pairs of positive integers (x, y) satisfy 1/x + 1/y = 1/7?","options":["1","2","3","more than 3"],"answer":2,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li><span class='frac'><span>1</span><span>x</span></span> + <span class='frac'><span>1</span><span>y</span></span> = <span class='frac'><span>1</span><span>7</span></span>.</li><li>Rearranging gives (x − 7)(y − 7) = 49.</li><li>Positive factor pairs 1×49, 7×7 and 49×1 yield (8,56), (14,14), (56,8).</li></ol><div class='final-answer'>Final Answer: 3 (Option C)</div>"},{"source":"Exercise 1(b) Q25","type":"mcq","question":"If a² − b² = 1001, how many positive integral values can (a, b) take?","options":["4","8","5","7"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>a² − b² = (a − b)(a + b) = 1001 = 7·11·13.</li><li>The positive factor-pair assignments are 1×1001, 7×143, 11×91 and 13×77.</li><li>Each gives one positive integer pair (a,b).</li></ol><div class='final-answer'>Final Answer: 4 (Option A)</div>"},{"source":"Exercise 1(b) Q26","type":"text","question":"In an organisation there are 36 employees in departments A, B and C, each department having at least 10 employees. Bonuses of ₹5000, ₹3000 and ₹2000 per employee are paid respectively. If the total bonus is ₹122000, what is the maximum possible number of employees in department C?","typedAnswer":"12","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let employees in A, B, C be x, y, z.</li><li>x + y + z = 36 and 5x + 3y + 2z = 122.</li><li>Eliminating z gives 3x + y = 50.</li><li>With each department having at least 10 employees, valid triples are (12,14,10) and (13,11,12). Maximum z = 12.</li></ol><div class='final-answer'>Final Answer: 12</div>","answer":"12","accepted":["12"]},{"source":"Exercise 1(b) Q27","type":"mcq","question":"Sangamithra buys scales, pencils and crayons. She buys twice as many crayons as pencils and at least one pencil more than scales. Pencils are thrice as expensive as scales, and scales cost half as much as crayons. If each scale costs ₹2 and the total spent is ₹94, how many items did she purchase in all?","options":["23","25","27","29"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let scales = s, pencils = p, crayons = c. Given c = 2p and p ≥ s + 1.</li><li>Costs give 2s + 6p + 4c = 94, so s + 7p = 47.</li><li>s > 0 gives p ≤ 6, while p ≥ s + 1 gives p ≥ 6. Therefore p = 6.</li><li>Then s = 5, c = 12, total items = 23.</li></ol><div class='final-answer'>Final Answer: 23 (Option A)</div>"},{"source":"Exercise 1(b) Q28","type":"text","question":"How many ordered pairs of integers (x, y), where x > 0, satisfy 3/x + 4/y = 1/5?","typedAnswer":"26","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li><span class='frac'><span>3</span><span>x</span></span> + <span class='frac'><span>4</span><span>y</span></span> = <span class='frac'><span>1</span><span>5</span></span>.</li><li>Rearranging gives (x − 15)(y − 20) = 300.</li><li>There are 18 positive divisors of 300. In addition, negative divisors greater than −15 are −1, −2, −3, −4, −5, −6, −10, −12.</li><li>Thus x − 15 has 18 + 8 = 26 admissible values.</li></ol><div class='final-answer'>Final Answer: 26</div>","answer":"26","accepted":["26"]},{"source":"Exercise 1(b) Q29","type":"mcq","question":"How many ordered pairs of positive integers (x, y) satisfy 37/x − 4/y = 1/13?","options":["18","11","9","20"],"answer":1,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li><span class='frac'><span>37</span><span>x</span></span> − <span class='frac'><span>4</span><span>y</span></span> = <span class='frac'><span>1</span><span>13</span></span>.</li><li>Algebraic rearrangement gives [13·37 − x][y + 52] = 2²·13²·37.</li><li>Applying x > 0 and y > 0 to the factor assignments leaves 11 admissible ordered pairs.</li></ol><div class='final-answer'>Final Answer: 11 (Option B)</div>"},{"source":"Exercise 1(b) Q30","type":"mcq","question":"How many integral values of (x, y) satisfy 4x² − 9y² = 2100?","options":["72","36","18","None of these"],"answer":3,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>4x² − 9y² = (2x − 3y)(2x + 3y) = 2100.</li><li>The parity and divisibility-by-3 requirements on the two factors cannot simultaneously be met by a valid factor pair of 2100.</li><li>Hence no integral pair (x,y) exists.</li></ol><div class='final-answer'>Final Answer: None of these (Option D)</div>"},{"source":"Practice Exercise 1 Q1","type":"text","question":"Raghav purchased breadsticks, buns and cheese. In total, he spent ₹33. The cost of a breadstick, bun and cheese is ₹16, ₹5 and ₹6 respectively. Find all possible values of breadsticks, buns and cheese purchased when he has purchased at least one of each item.","typedAnswer":"1, 1, 2","accepted":["1, 1, 2"],"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let breadsticks, buns and cheese be x, y, z.</li><li>16x + 5y + 6z = 33 with x,y,z ≥ 1.</li><li>Since two breadsticks already cost ₹32, x = 1. Thus 5y + 6z = 17.</li><li>The positive solution is y = 1, z = 2.</li></ol><div class='final-answer'>Final Answer: x = 1, y = 1, z = 2</div>","answer":"1, 1, 2"},{"source":"Practice Exercise 1 Q2","type":"text","question":"Find the number of pairs of positive integers x and y that satisfy 4x + 14y = 186.","typedAnswer":"7","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>4x + 14y = 186, or 2x + 7y = 93.</li><li>So x = <span class='frac'><span>93 − 7y</span><span>2</span></span>. For x to be a positive integer, y must be an odd positive integer with 7y < 93.</li><li>Thus y = 1, 3, 5, 7, 9, 11, 13: seven values.</li></ol><div class='final-answer'>Final Answer: 7</div>","answer":"7","accepted":["7"]},{"source":"Practice Exercise 1 Q3","type":"text","question":"Find the maximum value of xyz if x + y + z = 21, where x, y and z are positive real numbers.","typedAnswer":"343","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>By AM ≥ GM, <span class='frac'><span>x + y + z</span><span>3</span></span> ≥ ∛(xyz).</li><li>Since x + y + z = 21, 7 ≥ ∛(xyz), so xyz ≤ 343.</li><li>Equality occurs at x = y = z = 7.</li></ol><div class='final-answer'>Final Answer: 343</div>","answer":"343","accepted":["343"]},{"source":"Practice Exercise 1 Q4","type":"text","question":"The linear equations 4x + ay = 5 and ax + 4y = 6 (a is a constant) are given. Find the values of a such that the system of equations is inconsistent.","typedAnswer":"±4","accepted":["±4"],"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>For 4x + ay = 5 and ax + 4y = 6 to be inconsistent, the coefficients must be proportional but constants not in the same ratio.</li><li><span class='frac'><span>4</span><span>a</span></span> = <span class='frac'><span>a</span><span>4</span></span> ⇒ a² = 16.</li><li>Hence a = ±4.</li></ol><div class='final-answer'>Final Answer: a = ±4</div>","answer":"±4"},{"source":"Practice Exercise 1 Q5","type":"mcq","question":"Raj is four times his son’s age at present. After 5 years, Raj will be three times the age of his son. What is the present age of Raj?","options":["40 years","50 years","60 years","45 years"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let Raj's present age = x and son's = y.</li><li>x = 4y. After 5 years, x + 5 = 3(y + 5).</li><li>Substitute x = 4y: 4y + 5 = 3y + 15, so y = 10 and x = 40.</li></ol><div class='final-answer'>Final Answer: 40 years (Option A)</div>"}];
const labels=['A','B','C','D'];let current=0,submitted=false,secondsLeft=45*60;const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false);const host=document.getElementById('questionHost'),qbar=document.getElementById('qbar'),resultBox=document.getElementById('result');
function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}function norm(s){return String(s??'').toLowerCase().replace(/[₹,()\s]/g,'').replace(/years?|days?|km|kg/g,'').trim();}

function hasHtml(s){return /<[^>]+>/.test(String(s??''));}
function formatMathText(text){
  let out=esc(text);
  out=out.replace(/√\s*\(([^()]+)\)/g,'<span class="sqrt"><span class="sqrt-radicand">$1</span></span>');
  out=out.replace(/√\s*([A-Za-z0-9]+)/g,'<span class="sqrt"><span class="sqrt-radicand">$1</span></span>');
  out=out.replace(/([A-Za-z0-9\)])\^\s*\{?(-?\d+)\}?/g,'$1<sup>$2</sup>');
  out=out.replace(/(^|[^\w>])([A-Za-z0-9]+)\s*\/\s*([A-Za-z0-9]+)(?![\w<])/g,'$1<span class="frac"><span>$2</span><span>$3</span></span>');
  return out;
}
function formatMathHtml(html){
  const template=document.createElement('template');template.innerHTML=String(html??'');
  const walker=document.createTreeWalker(template.content,NodeFilter.SHOW_TEXT);const nodes=[];
  while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(node=>{const parent=node.parentElement;if(parent&&(parent.closest('.frac')||parent.tagName==='SCRIPT'||parent.tagName==='STYLE'))return;const span=document.createElement('span');span.innerHTML=formatMathText(node.nodeValue);node.replaceWith(...Array.from(span.childNodes));});
  return template.innerHTML;
}
function rich(s){return hasHtml(s)?formatMathHtml(s):formatMathText(s);}
function answerIndex(q){return q.answer;}function correctText(q){if(q.type==='mcq'){let i=q.answer;return '('+labels[i]+') '+q.options[i];}return q.typedAnswer;}
function renderBar(){qbar.innerHTML=questions.map((q,i)=>`<button type="button" class="qbtn ${i===current?'current ':''}${responses[i]!==null&&responses[i]!==''?'answered ':''}${marked[i]?'marked ':''}" onclick="go(${i})">${i+1}</button>`).join('');}
function control(q,i){if(q.type==='mcq')return '<div class="options">'+q.options.map((op,j)=>`<label class="option"><input type="radio" name="answer_${i}" value="${j}" ${responses[i]===String(j)?'checked':''} ${submitted?'disabled':''}><span>(${labels[j]}) ${rich(op)}</span></label>`).join('')+'</div>';return `<input class="typed-answer" name="answer_${i}" value="${esc(responses[i]||'')}" placeholder="Type your answer" ${submitted?'disabled':''}>`;}
function renderQuestion(){const q=questions[current];host.innerHTML=`<div class="qhead"><div class="qnum">Question ${current+1} of ${questions.length}</div><div class="source">${esc(q.source)}</div></div><div class="qtext">${rich(q.question)}</div>${control(q,current)}<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Solution</h3><strong>Answer: ${rich(correctText(q))}</strong><div class="solution-content">${rich(q.solution)}</div></div><div class="navrow"><button type="button" onclick="markReviewNext()">Mark for Review & Next</button><button type="button" onclick="clearResponse()" ${submitted?'disabled':''}>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" onclick="nextQ()" class="save">Save & Next</button></div>`;if(submitted){showReview();}else{const s=document.getElementById('solution');if(s)s.style.display='none';}bindAnswer();renderBar();}
function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{el.addEventListener('input',()=>{responses[current]=el.value;renderBar();});el.addEventListener('change',()=>{responses[current]=el.value;renderBar();});});}
function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('input.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}function go(i){saveCurrent();current=i;renderQuestion();if(submitted)setTimeout(()=>{const el=document.querySelector('.qhead');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},0);}function prevQ(){if(current>0)go(current-1)}function nextQ(){if(current<questions.length-1)go(current+1)}function markReviewNext(){marked[current]=true;if(current<questions.length-1)nextQ();else renderQuestion()}function clearResponse(){responses[current]=null;renderQuestion()}
function isCorrect(q,a){if(a===null||a==='')return null;if(q.type==='mcq')return Number(a)===q.answer;const acc=(q.accepted&&q.accepted.length?q.accepted:[q.typedAnswer]).map(norm);return acc.includes(norm(a));}
function showReview(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';if(r===null){note.className='answer-note muted';note.innerHTML='Unattempted. Correct answer: '+rich(correctText(q));}else if(r){note.className='answer-note ok';note.textContent='Correct.';}else{note.className='answer-note bad';note.innerHTML='Wrong. Correct answer: '+rich(correctText(q));}}
function submitTest(){if(submitted)return;saveCurrent();submitted=true;document.body.classList.add('submitted-mode');let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++;});const score=c*3-w;resultBox.style.display='block';resultBox.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>${score}</strong></div><div class="score-box">Correct<strong>${c}</strong></div><div class="score-box">Wrong<strong>${w}</strong></div><div class="score-box">Attempted<strong>${c+w}</strong></div><div class="score-box">Unattempted<strong>${u}</strong></div></div>`;renderQuestion();renderBar();const sec=document.querySelector('main>section');if(sec)sec.scrollTop=0;}
function tick(){let m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest();return}secondsLeft--}
const calc=document.getElementById('calcPopup'),display=document.getElementById('calcDisplay');document.getElementById('calcToggle').onclick=()=>calc.classList.toggle('open');document.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>{let v=b.dataset.calc;if(v==='C')display.value='';else if(v==='='){try{display.value=Function('return ('+display.value.replace(/%/g,'/100')+')')()}catch(e){display.value='Error'}}else display.value+=v});
renderQuestion();tick();setInterval(tick,1000);
</script></body></html>
