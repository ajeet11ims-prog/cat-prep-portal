main{height:calc(100vh - 84px);display:grid;grid-template-columns:minmax(0,1fr) 300px;background:#fff}main>section{min-width:0;min-height:0;border-right:2px solid #41515c;display:flex;flex-direction:column;overflow:hidden}.panel{padding:14px;background:#e5f6fc}.panel h2{font-size:18px;margin:0 -14px 14px;padding:10px 14px;background:var(--brand-mid);color:#fff}.question-palette-panel{display:flex;flex-direction:column;overflow:auto}.qbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.qbtn{height:44px;border:1px solid #a9b3bc;background:linear-gradient(#fff,#dfe5ea);border-radius:3px;font-size:18px;font-weight:700;color:#45515a}.qbtn.current{background:#e85b21;color:#fff;border-color:#c84815}.qbtn.answered{background:#72bd3b;color:#fff;border-color:#4f9727}.qbtn.marked{background:#7950a5;color:#fff;border-color:#5d3a85;border-radius:50%}.legend{display:grid;gap:10px;margin:18px 0;font-size:15px}.dot{display:inline-block;width:20px;height:20px;border-radius:3px;border:1px solid var(--line);vertical-align:-5px;margin-right:8px}.dot.current{background:#e85b21}.dot.answered{background:#72bd3b}.dot.marked{background:#7950a5;border-radius:50%}.side-submit{margin-top:auto;align-self:center;width:124px;height:42px;border:0;background:#29a8df;color:#fff;font-weight:700;font-size:16px}

y{width:100%;height:42px;text-align:right;font-size:20px;margin-bottom:8px}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.calc-grid button{height:36px;font-weight:700}

<script>const questions=[{"source":"Practice Exercise 1 Q6","type":"mcq","question":"The average age of Ram, Shyam and Shazia is 47 years. Ram’s niece visited their home, and now the average age of all four is 37 years. Ram’s age is six times the age of his niece, and Shyam’s age is two more than the square of the age of Ram’s niece. Find the age of Shazia.","options":["40 years","48 years","60 years","45 years"],"answer":1,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let ages of Ram, Shyam, Shazia be p,q,r and niece be s.</li><li><span class='frac'><span>p+q+r</span><span>3</span></span>=47 ⇒ p+q+r=141; <span class='frac'><span>p+q+r+s</span><span>4</span></span>=37 ⇒ p+q+r+s=148, so s=7.</li><li>Ram = 6s = 42. Shyam = s² + 2 = 51.</li><li>Therefore 42 + 51 + r = 141, so r = 48.</li></ol><div class='final-answer'>Final Answer: 48 years (Option B)</div>"},{"source":"Practice Exercise 1 Q7","type":"mcq","question":"When the digits of a two-digit number are reversed, the new number is 63 less than the original number. How many such numbers are possible?","options":["4","5","3","2"],"answer":3,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let original number be 10y + x and reversed number 10x + y.</li><li>10y + x − (10x + y) = 63, so y − x = 7.</li><li>With both digits non-zero, the only possibilities are 92 and 81.</li></ol><div class='final-answer'>Final Answer: 2 numbers (Option D)</div>"},{"source":"Practice Exercise 1 Q8","type":"mcq","question":"The sum of a two-digit number and the number formed by reversing its digits is 44. If eight is added to the number, it becomes 13 more than twice the reversed number. Find the number.","options":["31","63","43","23"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let original number be 10y + x.</li><li>Original + reversed = 44 gives x + y = 4.</li><li>Also 10y + x + 8 = 13 + 2(10x + y), giving 19x − 8y = −5.</li><li>Solving gives x = 1, y = 3, hence 31.</li></ol><div class='final-answer'>Final Answer: 31 (Option A)</div>"},{"source":"Practice Exercise 1 Q9","type":"text","question":"Charu’s aunt travelled from her home to Charu’s home at 12 km/hr, stayed 30 minutes, and returned at 15 km/hr. The total time was 5 hours 54 minutes. Find the total distance travelled.","typedAnswer":"72","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let one-way distance be d km.</li><li>Travel time equation: <span class='frac'><span>d</span><span>12</span></span> + <span class='frac'><span>30</span><span>60</span></span> + <span class='frac'><span>d</span><span>15</span></span> = 5 + <span class='frac'><span>54</span><span>60</span></span>.</li><li>So <span class='frac'><span>d</span><span>12</span></span> + <span class='frac'><span>d</span><span>15</span></span> = <span class='frac'><span>54</span><span>10</span></span>, giving d = 36 km.</li><li>Total distance travelled = 2d = 72 km.</li></ol><div class='final-answer'>Final Answer: 72 km</div>","answer":"72","accepted":["72"]},{"source":"Practice Exercise 1 Q10","type":"text","question":"Ashi travelled from Lucknow to Kanpur. She covered 5/9 of the distance by tram, 1/20 by train, 1/4 by bus, and the remaining 52 km by walking. Find the total distance.","typedAnswer":"360","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let total distance be x km.</li><li><span class='frac'><span>5</span><span>9</span></span>x + <span class='frac'><span>1</span><span>20</span></span>x + <span class='frac'><span>1</span><span>4</span></span>x + 52 = x.</li><li>The remaining fraction is <span class='frac'><span>26</span><span>180</span></span>, so <span class='frac'><span>26</span><span>180</span></span>x = 52.</li><li>Thus x = 360 km.</li></ol><div class='final-answer'>Final Answer: 360 km</div>","answer":"360","accepted":["360"]},{"source":"Practice Exercise 1 Q11","type":"mcq","question":"If 2|x| + 7y = 56, and x, y are integers, how many values can (x, y) take?","options":["Infinite","12","8","5"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>2|x| + 7y = 56, so 7y = 56 − 2|x|.</li><li>Whenever 2|x| is a multiple of 7, y is an integer. This happens for x = ±7, ±14, ±21, ... .</li><li>There are infinitely many integer pairs.</li></ol><div class='final-answer'>Final Answer: Infinite (Option A)</div>"},{"source":"Practice Exercise 1 Q12","type":"mcq","question":"Check whether the system 2x + 3y + 4z = 8; 3x + 5y + 8z = 7; 6x + 10y + 16z = 14 will have a unique solution.","options":["No unique solution","Two unique solutions","One unique solution","None of these"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>The equations are 2x + 3y + 4z = 8; 3x + 5y + 8z = 7; 6x + 10y + 16z = 14.</li><li>The third equation is exactly twice the second, so the system contains a linear dependence.</li><li>Therefore it cannot have a unique solution.</li></ol><div class='final-answer'>Final Answer: No unique solution (Option A)</div>"},{"source":"Practice Exercise 1 Q13","type":"mcq","question":"Akshay and Bunty can do a piece of work in 15 days, Bunty and Chintu can do the same work in 10 days, whereas Chintu and Akshay can do that in 8 days. If Akshay, Bunty and Chintu can do the work together in x integral number of days, find x.","options":["7 days","10 days","5 days","9 days"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let individual one-day work rates be A, B, C.</li><li>A+B=<span class='frac'><span>1</span><span>15</span></span>, B+C=<span class='frac'><span>1</span><span>10</span></span>, C+A=<span class='frac'><span>1</span><span>8</span></span>.</li><li>Adding: 2(A+B+C) = <span class='frac'><span>1</span><span>15</span></span>+<span class='frac'><span>1</span><span>10</span></span>+<span class='frac'><span>1</span><span>8</span></span> = <span class='frac'><span>7</span><span>24</span></span>.</li><li>So A+B+C = <span class='frac'><span>7</span><span>48</span></span> and time = <span class='frac'><span>48</span><span>7</span></span> ≈ 6.86 days, i.e. about 7 integral days.</li></ol><div class='final-answer'>Final Answer: 7 days (Option A)</div>","typedAnswer":"7 days"},{"source":"Practice Exercise 1 Q14","type":"mcq","question":"If 3x + 2y = 78, how many pairs of positive integers (x, y) exist that satisfy the equation?","options":["12","13","14","15"],"answer":1,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>3x + 2y = 78 with x,y positive integers.</li><li>For x integral, 78 − 2y must be divisible by 3, so y is a multiple of 3.</li><li>Following the source solution, y = 3, 6, 9, ..., 39 gives 13 listed values.</li></ol><div class='final-answer'>Final Answer: 13 pairs (Option B)</div>"},{"source":"Practice Exercise 1 Q15","type":"mcq","question":"In how many ways can you pay a restaurant bill of ₹127 using ₹1, ₹10 and ₹50 notes, given that the number of notes is unlimited?","options":["24","35","30","43"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let numbers of ₹50, ₹10 and ₹1 notes be a,b,c.</li><li>For a = 0, b can be 0 to 12: 13 ways.</li><li>For a = 1, b can be 0 to 7: 8 ways.</li><li>For a = 2, b can be 0 to 2: 3 ways.</li><li>Total = 13 + 8 + 3 = 24 ways.</li></ol><div class='final-answer'>Final Answer: 24 (Option A)</div>"},{"source":"Practice Exercise 2 Q1","type":"mcq","question":"Find the number of positive integral solutions of 7x + 11y = 273.","options":["3","2","1","Infinite"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>7x + 11y = 273.</li><li>x = <span class='frac'><span>273 − 11y</span><span>7</span></span> = 39 − <span class='frac'><span>11y</span><span>7</span></span>.</li><li>For x integral, y must be a multiple of 7. Positive feasible y values are 7, 14, 21, giving x = 28, 17, 6.</li></ol><div class='final-answer'>Final Answer: 3 solutions (Option A)</div>"},{"source":"Practice Exercise 2 Q2","type":"text","question":"Ramesh told his son: “My age x years ago was twice your age. My age 4x years ago was six times your age at that time.” If the difference between their present ages is 30 years, find the sum of their present ages.","typedAnswer":"106","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let present ages of Ramesh and son be y and z.</li><li>From the two past-age conditions, elimination gives y/z = 34/19.</li><li>Let y = 34k, z = 19k. Their present age difference is 15k = 30, so k = 2.</li><li>Sum = 68 + 38 = 106.</li></ol><div class='final-answer'>Final Answer: 106</div>","answer":"106","accepted":["106"]},{"source":"Practice Exercise 2 Q3","type":"text","question":"Arjun was carrying ₹x and y paise. He spent ₹9 and 30 paise on candies and was left with ₹3y and 2x paise. Find x.","typedAnswer":"40","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Convert all money to paise. Initial amount = 100x + y.</li><li>He spends 930 paise and is left with 300y + 2x.</li><li>Thus (100x + y) − 930 = 300y + 2x, so 98x = 299y + 930.</li><li>The feasible two-digit paise value is y = 10, giving x = 40.</li></ol><div class='final-answer'>Final Answer: 40</div>","answer":"40","accepted":["40"]},{"source":"Practice Exercise 2 Q4","type":"mcq","question":"Hira bought mangoes and apples, spending less than ₹2500. If the amount spent on mangoes and apples were interchanged, he would have bought two more fruits in total. A mango costs ₹50 and an apple ₹40. What is the maximum number of apples Hira could have bought?","options":["25","20","30","26"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let mangoes = x and apples = y. Cost condition: 50x + 40y < 2500.</li><li>If expenditures are interchanged, the total fruit count increases by 2, which simplifies to 5x − 4y = 40.</li><li>Feasible solutions under the budget include y = 5,10,15,20,25 with x = 12,16,20,24,28.</li><li>The next y violates the budget, so maximum apples = 25.</li></ol><div class='final-answer'>Final Answer: 25 (Option A)</div>"},{"source":"Practice Exercise 2 Q5","type":"mcq","question":"An online site “zip cart” sells machine-learning books costing ₹6000, ₹1200 and ₹300. Three institutes spend equal amounts. The site sells 1 book of the first type, 15 books of the third type and some books of the second type to the institutes. Find the minimum number of second-type books sold.","options":["7","5","6","8"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>The three institutes spend equal amounts.</li><li>One first-type book and fifteen third-type books cost ₹6000 + ₹4500 = ₹10500. To reach an equal distributable total, the least feasible addition of second-type books is 7.</li><li>Then total amount is ₹10500 + 7×₹1200 = ₹18900, or ₹6300 per institute, and the source combinations are feasible.</li></ol><div class='final-answer'>Final Answer: 7 (Option A)</div>"},{"source":"Practice Exercise 2 Q6","type":"mcq","question":"A was born 2 years ago when B was 2 years old. At present, the average age of A, B, C and D is a perfect square. The difference between the ages of any two persons is not more than 5 years. Which could be the ages of C and D, respectively?","options":["8, 2","10, 9","7, 3","6, 3"],"answer":2,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>A is 2 years old and B is 4 years old now.</li><li>The average of A,B,C,D must be a perfect square and any two ages differ by at most 5.</li><li>C = 7, D = 3 gives total 16 and average 4, while satisfying all age-difference restrictions.</li></ol><div class='final-answer'>Final Answer: 7, 3 (Option C)</div>"},{"source":"Practice Exercise 2 Q7","type":"mcq","question":"How many pairs of positive integers x and y exist such that 5x + 7y = 185?","options":["4","5","6","18"],"answer":1,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>5x + 7y = 185.</li><li>x = <span class='frac'><span>185 − 7y</span><span>5</span></span>. For x integral, y must be a multiple of 5.</li><li>Positive feasible y values are 5,10,15,20,25; the next makes 7y exceed 185.</li></ol><div class='final-answer'>Final Answer: 5 pairs (Option B)</div>"},{"source":"Practice Exercise 2 Q8","type":"text","question":"The cost of 5 pens, 7 pencils and 11 erasers is ₹111. The cost of 3 pens, 4 pencils and 5 erasers is ₹61. Find the cost (in ₹) of 5 pens, 6 pencils and 3 erasers.","typedAnswer":"83","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let costs of one pen, pencil and eraser be A,B,C.</li><li>5A + 7B + 11C = 111 and 3A + 4B + 5C = 61.</li><li>Let K = 5A + 6B + 3C. Subtracting and combining the two given equations as in the source gives 305 − 3K = 222 − 2K.</li><li>Hence K = 83.</li></ol><div class='final-answer'>Final Answer: ₹83</div>","answer":"83","accepted":["83"]},{"source":"Practice Exercise 2 Q9","type":"mcq","question":"In how many ways can 48 be divided into three positive parts such that the first is divisible by 7, the second by 8 and the third by 9?","options":["4","3","2","1"],"answer":2,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let the three parts be 7A, 8B, 9C. Then 7A + 8B + 9C = 48.</li><li>If C = 1, the positive solution is (A,B) = (1,4).</li><li>If C = 2, the positive solution is (A,B) = (2,2). No solution exists for C ≥ 3.</li></ol><div class='final-answer'>Final Answer: 2 ways (Option C)</div>"},{"source":"Practice Exercise 2 Q10","type":"mcq","question":"A railway fare consists of ticket charge and a common booking charge. Child and adult-female ticket charges are 50% and 80% of adult-male ticket charge. The total fare for an adult male is ₹720, while a family of adult male, adult female and a 2-year-old child pays ₹1712. Find the booking charge per ticket.","options":["120","100","90","None of these"],"answer":3,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let adult-male ticket charge be ₹100K and booking charge per ticket be ₹Y.</li><li>Adult-female and child ticket charges are ₹80K and ₹50K.</li><li>Y + 100K = 720 and 3Y + 230K = 1712.</li><li>Solving gives K = 6.4 and Y = ₹80, which is not among the first three choices.</li></ol><div class='final-answer'>Final Answer: None of these (Option D); booking charge ₹80</div>"}];
const labels=['A','B','C','D'];let current=0,submitted=false,secondsLeft=45*60;const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false);const host=document.getElementById('questionHost'),qbar=document.getElementById('qbar'),resultBox=document.getElementById('result');
function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}function norm(s){return String(s??'').toLowerCase().replace(/[₹,()\s]/g,'').replace(/years?|days?|km|kg/g,'').trim();}

function hasHtml(s){return /<[^>]+>/.test(String(s??''));}
function formatMathText(text){
  let out=esc(text);
  out=out.replace(/√\s*\(([^()]+)\)/g,'<span class="sqrt"><span class="sqrt-radicand">$1</span></span>');
  out=out.replace(/√\s*([A-Za-z0-9]+)/g,'<span class="sqrt"><span class="sqrt-radicand">$1</span></span>');
  out=out.replace(/([A-Za-z0-9\)])\^\s*\{?(-?\d+)\}?/g,'$1<sup>$2</sup>');
  out=out.replace(/(^|[^\w>])([A-Za-z0-9]+)\s*\/\s*([A-Za-z0-9]+)(?![\w<])/g,'$1<span class="frac"><span>$2</span><span>$3</span></span>');
  return out;
}
function formatMathHtml(html){
  const template=document.createElement('template');template.innerHTML=String(html??'');
  const walker=document.createTreeWalker(template.content,NodeFilter.SHOW_TEXT);const nodes=[];
  while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(node=>{const parent=node.parentElement;if(parent&&(parent.closest('.frac')||parent.tagName==='SCRIPT'||parent.tagName==='STYLE'))return;const span=document.createElement('span');span.innerHTML=formatMathText(node.nodeValue);node.replaceWith(...Array.from(span.childNodes));});
  return template.innerHTML;
}
function rich(s){return hasHtml(s)?formatMathHtml(s):formatMathText(s);}
function answerIndex(q){return q.answer;}function correctText(q){if(q.type==='mcq'){let i=q.answer;return '('+labels[i]+') '+q.options[i];}return q.typedAnswer;}
function renderBar(){qbar.innerHTML=questions.map((q,i)=>`<button type="button" class="qbtn ${i===current?'current ':''}${responses[i]!==null&&responses[i]!==''?'answered ':''}${marked[i]?'marked ':''}" onclick="go(${i})">${i+1}</button>`).join('');}
function control(q,i){if(q.type==='mcq')return '<div class="options">'+q.options.map((op,j)=>`<label class="option"><input type="radio" name="answer_${i}" value="${j}" ${responses[i]===String(j)?'checked':''} ${submitted?'disabled':''}><span>(${labels[j]}) ${rich(op)}</span></label>`).join('')+'</div>';return `<input class="typed-answer" name="answer_${i}" value="${esc(responses[i]||'')}" placeholder="Type your answer" ${submitted?'disabled':''}>`;}
function renderQuestion(){const q=questions[current];host.innerHTML=`<div class="qhead"><div class="qnum">Question ${current+1} of ${questions.length}</div><div class="source">${esc(q.source)}</div></div><div class="qtext">${rich(q.question)}</div>${control(q,current)}<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Solution</h3><strong>Answer: ${rich(correctText(q))}</strong><div class="solution-content">${rich(q.solution)}</div></div><div class="navrow"><button type="button" onclick="markReviewNext()">Mark for Review & Next</button><button type="button" onclick="clearResponse()" ${submitted?'disabled':''}>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" onclick="nextQ()" class="save">Save & Next</button></div>`;if(submitted){showReview();}else{const s=document.getElementById('solution');if(s)s.style.display='none';}bindAnswer();renderBar();}
function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{el.addEventListener('input',()=>{responses[current]=el.value;renderBar();});el.addEventListener('change',()=>{responses[current]=el.value;renderBar();});});}
function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('input.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}function go(i){saveCurrent();current=i;renderQuestion();if(submitted)setTimeout(()=>{const el=document.querySelector('.qhead');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},0);}function prevQ(){if(current>0)go(current-1)}function nextQ(){if(current<questions.length-1)go(current+1)}function markReviewNext(){marked[current]=true;if(current<questions.length-1)nextQ();else renderQuestion()}function clearResponse(){responses[current]=null;renderQuestion()}
function isCorrect(q,a){if(a===null||a==='')return null;if(q.type==='mcq')return Number(a)===q.answer;const acc=(q.accepted&&q.accepted.length?q.accepted:[q.typedAnswer]).map(norm);return acc.includes(norm(a));}
function showReview(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';if(r===null){note.className='answer-note muted';note.innerHTML='Unattempted. Correct answer: '+rich(correctText(q));}else if(r){note.className='answer-note ok';note.textContent='Correct.';}else{note.className='answer-note bad';note.innerHTML='Wrong. Correct answer: '+rich(correctText(q));}}
function submitTest(){if(submitted)return;saveCurrent();submitted=true;document.body.classList.add('submitted-mode');let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++;});const score=c*3-w;resultBox.style.display='block';resultBox.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>${score}</strong></div><div class="score-box">Correct<strong>${c}</strong></div><div class="score-box">Wrong<strong>${w}</strong></div><div class="score-box">Attempted<strong>${c+w}</strong></div><div class="score-box">Unattempted<strong>${u}</strong></div></div>`;renderQuestion();renderBar();const sec=document.querySelector('main>section');if(sec)sec.scrollTop=0;}
function tick(){let m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest();return}secondsLeft--}
const calc=document.getElementById('calcPopup'),display=document.getElementById('calcDisplay');document.getElementById('calcToggle').onclick=()=>calc.classList.toggle('open');document.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>{let v=b.dataset.calc;if(v==='C')display.value='';else if(v==='='){try{display.value=Function('return ('+display.value.replace(/%/g,'/100')+')')()}catch(e){display.value='Error'}}else display.value+=v});
renderQuestion();tick();setInterval(tick,1000);
</script></body></html>
