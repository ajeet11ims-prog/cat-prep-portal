header{height:84px;background:#f3f5f7;border-bottom:1px solid #9eadb9}.topbar{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 62px 300px}.title{background:var(--brand-dark);color:#fff;padding:10px 18px;display:flex;flex-direction:column;justify-content:center}.title h1{font-size:22px;line-height:1.1;margin:0;font-weight:700}.meta{font-size:15px;color:#dce9ef;margin-top:6px}.timer{display:grid;place-items:center;background:#fff;border-left:1px solid #9eadb9;font-weight:700;font-size:17px}.timer span{font-size:22px}.calc-toggle{width:34px;height:34px;align-self:center;justify-self:center;border:1px solid #d89c29;background:#f9c35b;border-radius:2px;font-weight:800}
main{height:calc(100vh - 84px);display:grid;grid-template-columns:minmax(0,1fr) 300px;background:#fff}main>section{min-width:0;min-height:0;border-right:2px solid #41515c;display:flex;flex-direction:column;overflow:hidden}.panel{padding:14px;background:#e5f6fc}.panel h2{font-size:18px;margin:0 -14px 14px;padding:10px 14px;background:var(--brand-mid);color:#fff}.question-palette-panel{display:flex;flex-direction:column;overflow:auto}.qbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.qbtn{height:44px;border:1px solid #a9b3bc;background:linear-gradient(#fff,#dfe5ea);border-radius:3px;font-size:18px;font-weight:700;color:#45515a}.qbtn.current{background:#e85b21;color:#fff;border-color:#c84815}.qbtn.answered{background:#72bd3b;color:#fff;border-color:#4f9727}.qbtn.marked{background:#7950a5;color:#fff;border-color:#5d3a85;border-radius:50%}.legend{display:grid;gap:10px;margin:18px 0;font-size:15px}.dot{display:inline-block;width:20px;height:20px;border-radius:3px;border:1px solid var(--line);vertical-align:-5px;margin-right:8px}.dot.current{background:#e85b21}.dot.answered{background:#72bd3b}.dot.marked{background:#7950a5;border-radius:50%}.side-submit{margin-top:auto;align-self:center;width:124px;height:42px;border:0;background:#29a8df;color:#fff;font-weight:700;font-size:16px}

y{width:100%;height:42px;text-align:right;font-size:20px;margin-bottom:8px}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.calc-grid button{height:36px;font-weight:700}

<script>const questions=[{"source":"Practice Exercise 2 Q11","type":"mcq","question":"Jessica is the mother of Wincet. When Wincet was as old as Jackson’s present age, Jessica was four times Wincet’s age. At present, twice Jessica’s age is five times Wincet’s age. Find the ratio of Jessica’s present age to Jackson’s present age.","options":["4:3","1:5","5:1","2:5"],"answer":2,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let present ages of Jessica, Wincet and Jackson be x,y,z and let a = y − z.</li><li>Using the past-age condition gives a = (4y − x)/3.</li><li>At present 2x = 5y. Combining with a = y − z gives x/z = 5.</li><li>Hence Jessica : Jackson = 5 : 1.</li></ol><div class='final-answer'>Final Answer: 5:1 (Option C)</div>"},{"source":"Practice Exercise 2 Q12","type":"text","question":"A man says his wife’s age is represented by the digits of his two-digit age reversed. She is older, their ages sum to 55, and the difference is not more than 10 years. What is the unit digit of his age?","typedAnswer":"3","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let husband's age be 10x + y and wife's age be 10y + x.</li><li>Their sum is 55, so x + y = 5.</li><li>Wife is older and age difference ≤ 10: 9(y − x) ≤ 10. Since ages differ, y − x = 1.</li><li>Solving gives y = 3, x = 2. Husband is 23.</li></ol><div class='final-answer'>Final Answer: 3</div>","answer":"3","accepted":["3"]},{"source":"Practice Exercise 2 Q13","type":"text","question":"One thousand members attended a science exhibition. Charges were ₹5 per man, ₹4 per woman and 10 paise per child, and ₹1000 was collected. How many women were there?","typedAnswer":"80","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let men, women, children be M,W,C.</li><li>M + W + C = 1000 and 5M + 4W + 0.1C = 1000.</li><li>Since M and W are integers, 0.1C must be integral, so C is a multiple of 100.</li><li>Checking feasible values gives C = 800, then M + W = 200 and 5M + 4W = 920, yielding M = 120, W = 80.</li></ol><div class='final-answer'>Final Answer: 80 women</div>","answer":"80","accepted":["80"]},{"source":"Practice Exercise 2 Q14","type":"mcq","question":"A student purchases pens, pencils and sharpeners for ₹104. Each costs ₹20, ₹8 and ₹5 respectively. In how many ways can he purchase them if he buys at least two items of each type?","options":["1","2","3","4"],"answer":1,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let purchases beyond the minimum two of each be x,y,z.</li><li>20(x+2) + 8(y+2) + 5(z+2) = 104, so 20x + 8y + 5z = 38.</li><li>The non-negative solutions are (0,1,6) and (1,1,2).</li></ol><div class='final-answer'>Final Answer: 2 ways (Option B)</div>"},{"source":"Practice Exercise 2 Q15","type":"mcq","question":"In a four-digit number with distinct digits, the sum of the first two digits equals the sum of the last two. The sum of the units and thousands digits is thrice the sum of the tens and hundreds digits. If the sum of all digits is 20, how many such numbers are possible?","options":["2","4","6","8"],"answer":1,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let the four-digit number be ABCD with distinct digits.</li><li>A + B = C + D and A + D = 3(B + C), while A+B+C+D = 20.</li><li>Thus A+B=C+D=10 and B+C=5, A+D=15.</li><li>The valid distinct-digit numbers are 9146, 8237, 7328 and 6419.</li></ol><div class='final-answer'>Final Answer: 4 numbers (Option B)</div>"},{"source":"Practice Exercise 2 Q16","type":"mcq","question":"Raju has 262 coins of ₹1, 50 paise and 25 paise with total value ₹130. If the 50-paise and 25-paise coins are interchanged, the value decreases by ₹6. Find the number of ₹1 coins.","options":["43","24","38","46"],"answer":3,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let ₹1, 50-paise, 25-paise coin counts be x,y,z.</li><li>x + y + z = 262; 4x + 2y + z = 520.</li><li>After interchange: 4x + y + 2z = 496.</li><li>Combining these equations gives x = 46.</li></ol><div class='final-answer'>Final Answer: 46 (Option D)</div>"},{"source":"Practice Exercise 2 Q17","type":"text","question":"In a 50-question multiple-choice contest, a correct answer gives 4 points, blank gives 0 and wrong gives −1. Ranjan scored 99. What is the maximum number of questions he could have answered correctly?","typedAnswer":"29","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let correct = a, blank = b, wrong = c.</li><li>a + b + c = 50 and 4a − c = 99, so c = 4a − 99.</li><li>Since a + c ≤ 50, 5a ≤ 149, hence a ≤ 29.</li><li>Therefore the maximum possible correct answers is 29.</li></ol><div class='final-answer'>Final Answer: 29</div>","answer":"29","accepted":["29"]},{"source":"Practice Exercise 2 Q18","type":"mcq","question":"Dinesh, Eswar, Ganesh and Harish had 360 marbles. Dinesh had 1/3 of the total with the others; Eswar had 3/5 of the total with the others; Ganesh had 2/7 of the total with the others. Find the number with Harish.","options":["45","55","60","None of the above"],"answer":1,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Dinesh has one-third of the total with the others. If others = 3x, Dinesh = x, so 4x = 360 and Dinesh = 90.</li><li>Similarly, Eswar = 135 and Ganesh = 80 from their given ratios.</li><li>Harish = 360 − 90 − 135 − 80 = 55.</li></ol><div class='final-answer'>Final Answer: 55 (Option B)</div>"},{"source":"Practice Exercise 2 Q19","type":"text","question":"A cheque was for A rupees and B paise. The banker mistakenly paid B rupees and A paise. After spending ₹2.40 from the mistaken amount, the person had twice the original cheque amount left. Find A + B.","typedAnswer":"57","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Original cheque = 100A + B paise; mistaken payment = 100B + A paise.</li><li>After spending 240 paise, the mistaken amount is twice the correct cheque amount:</li><li>100B + A − 240 = 2(100A + B), so 98B = 199A + 240.</li><li>With A,B as two-digit rupee/paise values, the feasible solution is A = 18, B = 39. Hence A + B = 57.</li></ol><div class='final-answer'>Final Answer: 57</div>","answer":"57","accepted":["57"]},{"source":"Practice Exercise 2 Q20","type":"mcq","question":"Two colleagues, Sunil and Raghav, have 40 kg luggage together and are charged ₹1200 and ₹2640 for excess luggage. Had all 40 kg belonged to one person, the charge would have been ₹7920. What is the difference between Raghav’s luggage and the free allowance?","options":["6 kg","5.8 kg","8.8 kg","9 kg"],"answer":2,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let Raghav carry x kg, Sunil 40 − x kg, free allowance m kg and excess rate n.</li><li>(40 − x − m)n = 1200 and (x − m)n = 2640.</li><li>If all 40 kg belonged to one person, (40 − m)n = 7920.</li><li>Solving gives x = 22.4 and m = 13.6, so x − m = 8.8 kg.</li></ol><div class='final-answer'>Final Answer: 8.8 kg (Option C)</div>"},{"source":"Practice Exercise 2 Q21","type":"mcq","question":"A one-day exam has 80 questions. Correct answers give 4 marks and wrong answers −1. A student scored 132 and the number of unattempted questions is the lowest possible. How many questions did he answer correctly?","options":["41","32","42","40"],"answer":2,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let correct, wrong, unattempted be x,y,z.</li><li>x + y + z = 80 and 4x − y = 132.</li><li>Adding gives 5x + z = 212, so z = 212 − 5x.</li><li>To minimize z, maximize x. The largest feasible x is 42, giving z = 2.</li></ol><div class='final-answer'>Final Answer: 42 correct (Option C)</div>"},{"source":"Practice Exercise 2 Q22","type":"text","question":"From a four-digit number with distinct digits, Ramesh subtracted the sum of its digits and got 7119. Find the maximum possible sum of the digits of the original number.","typedAnswer":"20","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let the original number be ABCD = 1000A + 100B + 10C + D.</li><li>Subtracting digit sum: 999A + 99B + 9C = 7119, or 111A + 11B + C = 791.</li><li>This forces A = 7 and 11B + C = 14. With distinct digits, B = 1, C = 3.</li><li>D can be at most 9, so maximum digit sum = 7 + 1 + 3 + 9 = 20.</li></ol><div class='final-answer'>Final Answer: 20</div>","answer":"20","accepted":["20"]},{"source":"Practice Exercise 2 Q23","type":"text","question":"For natural numbers P and Q, (P + 2)/(Q + 3) = 3/4 and (P − 1)/Q = 2/3. Find P + Q.","typedAnswer":"16","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li><span class='frac'><span>P+2</span><span>Q+3</span></span> = <span class='frac'><span>3</span><span>4</span></span> and <span class='frac'><span>P−1</span><span>Q</span></span> = <span class='frac'><span>2</span><span>3</span></span>.</li><li>Cross-multiplying gives 4P − 3Q = 1 and 3P − 2Q = 3.</li><li>Solving gives P = 7, Q = 9.</li></ol><div class='final-answer'>Final Answer: 16</div>","answer":"16","accepted":["16"]},{"source":"Practice Exercise 2 Q24","type":"text","question":"In a magical purse, on alternate days starting from the 14th the money decreases by ₹10, and on alternate days starting from the 15th it doubles. The purse had ₹500 on the 19th and continued until the 25th. If it had started with ₹100 on the 13th, how much more money would there be on the 25th?","typedAnswer":"1280","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Case 1: working backward/forward from ₹500 on the 19th gives ₹3860 on the 25th.</li><li>Case 2: starting with ₹100 on the 13th and applying −₹10 on even dates and doubling on odd dates gives ₹5140 on the 25th.</li><li>Difference = 5140 − 3860 = 1280.</li></ol><div class='final-answer'>Final Answer: ₹1280</div>","answer":"1280","accepted":["1280"]},{"source":"Practice Exercise 2 Q25","type":"text","question":"There were 100 questions in JMET. A correct answer gives 3 marks and a wrong answer deducts 1 mark. A certain number of students with all different numbers of attempts got the same score of 100. Find the maximum number of such students.","typedAnswer":"17","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let total attempts = A, correct = x, wrong = y. Score condition is 3x − y = 100.</li><li>So x = <span class='frac'><span>100+y</span><span>3</span></span> = 33 + <span class='frac'><span>y+1</span><span>3</span></span>. Thus y + 1 must be divisible by 3.</li><li>The feasible attempt totals are 36, 40, 44, ..., 100, giving 17 possibilities.</li></ol><div class='final-answer'>Final Answer: 17</div>","answer":"17","accepted":["17"]},{"source":"Practice Exercise 2 Q26","type":"text","question":"In a four-digit number N with distinct digits, thousands + hundreds = tens + units, and thousands + tens = 3(hundreds + units). If the digit sum S lies between 11 and 21, how many different values can N take?","typedAnswer":"8","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let N = abcd. Given a + b = c + d and a + c = 3(b + d).</li><li>If b + d = k, then a + c = 3k and total digit sum S = 4k.</li><li>With 11 < S < 21, S can be 12, 16, 20.</li><li>Enumerating distinct-digit numbers gives 2 possibilities for S=12, 2 for S=16 and 4 for S=20: total 8.</li></ol><div class='final-answer'>Final Answer: 8</div>","answer":"8","accepted":["8"]},{"source":"Practice Exercise 2 Q27","type":"text","question":"Ramu makes P sandwiches. For each sandwich he uses N packs of peanut butter at ₹4 and K packs of jam at ₹5. The total cost for P sandwiches is ₹253. Assume P, N and K are positive integers with P > 1. What is the total expenditure on jam?","typedAnswer":"165","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Cost per sandwich = 4N + 5K, so P(4N + 5K) = 253 = 11×23.</li><li>P > 1. The feasible factor choice is P = 11 and 4N + 5K = 23.</li><li>The positive integer solution is N = 2, K = 3.</li><li>Total jam cost = P × 5K = 11 × 15 = 165.</li></ol><div class='final-answer'>Final Answer: ₹165</div>","answer":"165","accepted":["165"]},{"source":"Practice Exercise 2 Q28","type":"mcq","question":"Mrs Alpa buys ₹249 worth of candies. Each girl gets a strawberry candy at ₹3.30 and each boy a chocolate candy at ₹2.90. How many candies of each type did she buy?","options":["21, 57","57, 21","37, 51","27, 51"],"answer":1,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let girls = x and boys = y.</li><li>3.3x + 2.9y = 249.</li><li>Checking the choices, x = 57 and y = 21 satisfies the equation.</li></ol><div class='final-answer'>Final Answer: 57 strawberry, 21 chocolate (Option B)</div>"},{"source":"Practice Exercise 2 Q29","type":"mcq","question":"The equation √(x + 1) − √(x − 1) = √(4x − 1) has","options":["No solution","More than two solutions","Three solutions","More than three solutions"],"answer":0,"solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Given √(x+1) − √(x−1) = √(4x−1), with x ≥ 1.</li><li>Squaring and simplifying, then squaring again, gives candidate x = 5/4.</li><li>Substitution in the original equation gives LHS = 1 but RHS = 2.</li><li>The candidate is extraneous, so no solution exists.</li></ol><div class='final-answer'>Final Answer: No solution (Option A)</div>"},{"source":"Practice Exercise 2 Q30","type":"text","question":"Roses bloom monthly. In alternate months starting January, 60 more flowers appear than at the end of the previous month. In alternate months starting February, the number becomes half of the previous month. If 120 roses bloomed in June, how many bloomed in January?","typedAnswer":"600","solution":"<p><strong>Detailed solution:</strong></p><ol class='solution-steps'><li>Let January roses be x.</li><li>Following the alternating rules: Feb = <span class='frac'><span>x</span><span>2</span></span>; Mar = <span class='frac'><span>x</span><span>2</span></span>+60; Apr = <span class='frac'><span>x</span><span>4</span></span>+30; May = <span class='frac'><span>x</span><span>4</span></span>+90; Jun = <span class='frac'><span>x</span><span>8</span></span>+45.</li><li>Given June = 120: <span class='frac'><span>x</span><span>8</span></span> + 45 = 120.</li><li>Hence x = 600.</li></ol><div class='final-answer'>Final Answer: 600</div>","answer":"600","accepted":["600"]}];
const labels=['A','B','C','D'];let current=0,submitted=false,secondsLeft=45*60;const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false);const host=document.getElementById('questionHost'),qbar=document.getElementById('qbar'),resultBox=document.getElementById('result');
function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}function norm(s){return String(s??'').toLowerCase().replace(/[₹,()\s]/g,'').replace(/years?|days?|km|kg/g,'').trim();}

function hasHtml(s){return /<[^>]+>/.test(String(s??''));}
function formatMathText(text){
  let out=esc(text);
  out=out.replace(/√\s*\(([^()]+)\)/g,'<span class="sqrt"><span class="sqrt-radicand">$1</span></span>');
  out=out.replace(/√\s*([A-Za-z0-9]+)/g,'<span class="sqrt"><span class="sqrt-radicand">$1</span></span>');
  out=out.replace(/([A-Za-z0-9\)])\^\s*\{?(-?\d+)\}?/g,'$1<sup>$2</sup>');
  out=out.replace(/(^|[^\w>])([A-Za-z0-9]+)\s*\/\s*([A-Za-z0-9]+)(?![\w<])/g,'$1<span class="frac"><span>$2</span><span>$3</span></span>');
  return out;
}
function formatMathHtml(html){
  const template=document.createElement('template');template.innerHTML=String(html??'');
  const walker=document.createTreeWalker(template.content,NodeFilter.SHOW_TEXT);const nodes=[];
  while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(node=>{const parent=node.parentElement;if(parent&&(parent.closest('.frac')||parent.tagName==='SCRIPT'||parent.tagName==='STYLE'))return;const span=document.createElement('span');span.innerHTML=formatMathText(node.nodeValue);node.replaceWith(...Array.from(span.childNodes));});
  return template.innerHTML;
}
function rich(s){return hasHtml(s)?formatMathHtml(s):formatMathText(s);}
function answerIndex(q){return q.answer;}function correctText(q){if(q.type==='mcq'){let i=q.answer;return '('+labels[i]+') '+q.options[i];}return q.typedAnswer;}
function renderBar(){qbar.innerHTML=questions.map((q,i)=>`<button type="button" class="qbtn ${i===current?'current ':''}${responses[i]!==null&&responses[i]!==''?'answered ':''}${marked[i]?'marked ':''}" onclick="go(${i})">${i+1}</button>`).join('');}
function control(q,i){if(q.type==='mcq')return '<div class="options">'+q.options.map((op,j)=>`<label class="option"><input type="radio" name="answer_${i}" value="${j}" ${responses[i]===String(j)?'checked':''} ${submitted?'disabled':''}><span>(${labels[j]}) ${rich(op)}</span></label>`).join('')+'</div>';return `<input class="typed-answer" name="answer_${i}" value="${esc(responses[i]||'')}" placeholder="Type your answer" ${submitted?'disabled':''}>`;}
function renderQuestion(){const q=questions[current];host.innerHTML=`<div class="qhead"><div class="qnum">Question ${current+1} of ${questions.length}</div><div class="source">${esc(q.source)}</div></div><div class="qtext">${rich(q.question)}</div>${control(q,current)}<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Solution</h3><strong>Answer: ${rich(correctText(q))}</strong><div class="solution-content">${rich(q.solution)}</div></div><div class="navrow"><button type="button" onclick="markReviewNext()">Mark for Review & Next</button><button type="button" onclick="clearResponse()" ${submitted?'disabled':''}>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" onclick="nextQ()" class="save">Save & Next</button></div>`;if(submitted){showReview();}else{const s=document.getElementById('solution');if(s)s.style.display='none';}bindAnswer();renderBar();}
function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{el.addEventListener('input',()=>{responses[current]=el.value;renderBar();});el.addEventListener('change',()=>{responses[current]=el.value;renderBar();});});}
function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('input.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}function go(i){saveCurrent();current=i;renderQuestion();if(submitted)setTimeout(()=>{const el=document.querySelector('.qhead');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},0);}function prevQ(){if(current>0)go(current-1)}function nextQ(){if(current<questions.length-1)go(current+1)}function markReviewNext(){marked[current]=true;if(current<questions.length-1)nextQ();else renderQuestion()}function clearResponse(){responses[current]=null;renderQuestion()}
function isCorrect(q,a){if(a===null||a==='')return null;if(q.type==='mcq')return Number(a)===q.answer;const acc=(q.accepted&&q.accepted.length?q.accepted:[q.typedAnswer]).map(norm);return acc.includes(norm(a));}
function showReview(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';if(r===null){note.className='answer-note muted';note.innerHTML='Unattempted. Correct answer: '+rich(correctText(q));}else if(r){note.className='answer-note ok';note.textContent='Correct.';}else{note.className='answer-note bad';note.innerHTML='Wrong. Correct answer: '+rich(correctText(q));}}
function submitTest(){if(submitted)return;saveCurrent();submitted=true;document.body.classList.add('submitted-mode');let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++;});const score=c*3-w;resultBox.style.display='block';resultBox.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>${score}</strong></div><div class="score-box">Correct<strong>${c}</strong></div><div class="score-box">Wrong<strong>${w}</strong></div><div class="score-box">Attempted<strong>${c+w}</strong></div><div class="score-box">Unattempted<strong>${u}</strong></div></div>`;renderQuestion();renderBar();const sec=document.querySelector('main>section');if(sec)sec.scrollTop=0;}
function tick(){let m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest();return}secondsLeft--}
const calc=document.getElementById('calcPopup'),display=document.getElementById('calcDisplay');document.getElementById('calcToggle').onclick=()=>calc.classList.toggle('open');document.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>{let v=b.dataset.calc;if(v==='C')display.value='';else if(v==='='){try{display.value=Function('return ('+display.value.replace(/%/g,'/100')+')')()}catch(e){display.value='Error'}}else display.value+=v});
renderQuestion();tick();setInterval(tick,1000);
