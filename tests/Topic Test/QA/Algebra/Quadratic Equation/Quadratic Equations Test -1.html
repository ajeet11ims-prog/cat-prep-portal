<style>
:root{--ink:#101820;--muted:#5f6f7a;--line:#b8c3cc;--brand:#0b75bb;--brand-dark:#24313a;--brand-mid:#4089c8;--soft:#dff3fb;--ok:#60b947;--bad:#e55b25;--review:#7b4ab0;--paper:#fff;--bg:#eef3f7}
*{box-sizing:border-box}html,body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;overflow:hidden}
header{height:84px;background:#f3f5f7;border-bottom:1px solid #9eadb9}.topbar{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 62px 300px}
.title{background:var(--brand-dark);color:#fff;padding:10px 18px;display:flex;flex-direction:column;justify-content:center}.title h1{font-size:22px;line-height:1.1;margin:0;font-weight:700}.meta{font-size:15px;color:#dce9ef;margin-top:6px}
.timer{display:grid;place-items:center;background:#fff;border-left:1px solid #9eadb9;font-weight:700;font-size:17px}.timer span{font-size:22px}.calc-toggle{width:34px;height:34px;align-self:center;justify-self:center;border:1px solid #d89c29;background:#f9c35b;border-radius:2px;font-weight:800}
main{height:calc(100vh - 84px);display:grid;grid-template-columns:minmax(0,1fr) 300px;background:#fff}main>section{min-width:0;min-height:0;border-right:2px solid #41515c;display:flex;flex-direction:column;overflow:hidden}
.panel{padding:14px;background:#e5f6fc}.panel h2{font-size:18px;margin:0 -14px 14px;padding:10px 14px;background:var(--brand-mid);color:#fff}.question-palette-panel{display:flex;flex-direction:column;overflow:auto}
.qbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.qbtn{height:44px;border:1px solid #a9b3bc;background:linear-gradient(#fff,#dfe5ea);border-radius:3px;font-size:18px;font-weight:700;color:#45515a}
.qbtn.current{background:#e85b21;color:#fff;border-color:#c84815}.qbtn.answered{background:#72bd3b;color:#fff;border-color:#4f9727}.qbtn.marked{background:#7950a5;color:#fff;border-color:#5d3a85;border-radius:50%}
.legend{display:grid;gap:10px;margin:18px 0;font-size:15px}.dot{display:inline-block;width:20px;height:20px;border-radius:3px;border:1px solid var(--line);vertical-align:-5px;margin-right:8px}.dot.current{background:#e85b21}.dot.answered{background:#72bd3b}.dot.marked{background:#7950a5;border-radius:50%}

.solution{display:none;margin:16px 24px 28px;padding:16px 18px 20px;border:1px solid var(--line);border-radius:4px;background:#fbfcfd;font-size:17px;line-height:1.6;overflow:visible}.solution h3{color:var(--brand);margin:0 0 8px}.solution-img{display:block;max-width:100%;width:auto;margin-top:12px;background:#fff}

const labels=['A','B','C','D'];let current=0,submitted=false,secondsLeft=2700;const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false);const host=document.getElementById('questionHost'),qbar=document.getElementById('qbar'),resultBox=document.getElementById('result');
function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));}
function norm(s){return String(s??'').trim().toLowerCase().replace(/\s+/g,'').replace(/−/g,'-').replace(/,/g,'');}
function correctText(q){return q.type==='mcq'?'('+labels[q.answer]+')':q.typedAnswer;}
function renderBar(){qbar.innerHTML=questions.map((q,i)=>`<button type="button" class="qbtn ${i===current?'current ':''}${responses[i]!==null&&responses[i]!==''?'answered ':''}${marked[i]?'marked ':''}" onclick="go(${i})">${i+1}</button>`).join('');}
function control(q,i){if(q.type==='mcq')return '<div class="answer-controls">'+labels.map((lab,j)=>`<label class="opt"><input type="radio" name="answer_${i}" value="${j}" ${responses[i]===String(j)?'checked':''} ${submitted?'disabled':''}><span>(${lab})</span></label>`).join('')+'</div>';return `<input class="typed-answer" name="answer_${i}" value="${esc(responses[i]||'')}" placeholder="Type your answer" ${submitted?'disabled':''}>`;}
function renderQuestion(){const q=questions[current];host.innerHTML=`<div class="qhead"><div class="qnum">Question ${current+1} of ${questions.length}</div></div>${q.direction||''}<div class="qtext">${q.questionHtml}</div>${control(q,current)}<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Source Solution</h3><strong>Correct answer: ${correctText(q)}</strong>${q.solutionHtml}</div><div class="navrow"><button type="button" onclick="markReviewNext()">Mark for Review & Next</button><button type="button" onclick="clearResponse()" ${submitted?'disabled':''}>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" onclick="nextQ()" class="save">Save & Next</button></div>`;if(submitted)showReview();bindAnswer();renderBar();}
function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{el.addEventListener('input',()=>{responses[current]=el.value;renderBar();});el.addEventListener('change',()=>{responses[current]=el.value;renderBar();});});}
function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('input.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}
function go(i){saveCurrent();current=i;renderQuestion();if(submitted)setTimeout(()=>{document.querySelector('.qhead')?.scrollIntoView({behavior:'smooth',block:'start'});},0);}
function prevQ(){if(current>0)go(current-1)}function nextQ(){if(current<questions.length-1)go(current+1)}function markReviewNext(){marked[current]=true;if(current<questions.length-1)nextQ();else renderQuestion()}function clearResponse(){responses[current]=null;renderQuestion()}
function isCorrect(q,a){if(a===null||a==='')return null;if(q.type==='mcq')return Number(a)===q.answer;return norm(a)===norm(q.typedAnswer);}
function showReview(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';if(r===null){note.className='answer-note muted';note.textContent='Unattempted. Correct answer: '+correctText(q);}else if(r){note.className='answer-note ok';note.textContent='Correct.';}else{note.className='answer-note bad';note.textContent='Wrong. Correct answer: '+correctText(q);}}
function submitTest(){if(submitted)return;saveCurrent();submitted=true;document.body.classList.add('submitted-mode');let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++;});const score=c*3-w;resultBox.style.display='block';resultBox.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>${score}</strong></div><div class="score-box">Correct<strong>${c}</strong></div><div class="score-box">Wrong<strong>${w}</strong></div><div class="score-box">Attempted<strong>${c+w}</strong></div><div class="score-box">Unattempted<strong>${u}</strong></div></div><p><strong>Solutions are now unlocked.</strong> Use the question bar or Previous/Save & Next to review every source solution.</p>`;renderQuestion();renderBar();document.querySelector('main>section').scrollTop=0;}
function tick(){let m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest();return}secondsLeft--}
const calc=document.getElementById('calcPopup'),display=document.getElementById('calcDisplay');document.getElementById('calcToggle').onclick=()=>calc.classList.toggle('open');document.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>{let v=b.dataset.calc;if(v==='C')display.value='';else if(v==='='){try{display.value=Function('return ('+display.value.replace(/%/g,'/100')+')')()}catch(e){display.value='Error'}}else display.value+=v});
renderQuestion();tick();setInterval(tick,1000);
</script></body></html>
