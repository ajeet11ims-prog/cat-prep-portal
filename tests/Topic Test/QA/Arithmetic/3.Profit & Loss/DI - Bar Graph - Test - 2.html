<script>const TITLE="DI - Bar Graph - Test - 2",MINUTES=40,questions=[{"group": "vehicles", "q": "If the production target of all the vehicles together in 2008 is 20% more than the production in 2007, then what is the percentage deficit in 2008 with respect to the target, if the number of vehicles produced in 2008 is 520 thousand?", "options": ["Lies between 4% and 5%.", "Less than 3%.", "Greater than 5%.", "Lies between 3% and 4%."], "answer": "D", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Total production in 2007 is 75+50+100+50+175=450 thousand vehicles.<\/li><li><strong>Step 3 - Work through the data:<\/strong> The 2008 target is 20% above this, so target production=450×1.20=540 thousand.<\/li><li><strong>Step 4 - Work through the data:<\/strong> Actual production is 520 thousand, giving a deficit of 540-520=20 thousand.<\/li><li><strong>Step 5 - Work through the data:<\/strong> Percentage deficit=<span class='math frac'><span>20<\/span><span>540<\/span><\/span>×100≈3.70%, which lies between 3% and 4%.<\/li><li><strong>Step 6 - Select the option:<\/strong> The result corresponds to option (D).<\/li><\/ol><div class='final-answer'>Final Answer: (D)<\/div>"}, {"group": "vehicles", "q": "If the production of each of A, B, C and D increases by 10% in 2008 and the overall increase in production of all the vehicles is 15%, then what is the net increase in the production of vehicles of type E?", "options": ["40,000", "35,000", "30,000", "25,000"], "answer": "A", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> In 2007, total production is 450 thousand and production of A+B+C+D is 75+50+100+50=275 thousand.<\/li><li><strong>Step 3 - Work through the data:<\/strong> A 15% overall rise requires a total increase of 450×15%=67.5 thousand.<\/li><li><strong>Step 4 - Work through the data:<\/strong> A 10% rise in A-D contributes 275×10%=27.5 thousand.<\/li><li><strong>Step 5 - Work through the data:<\/strong> Therefore the increase required from E is 67.5-27.5=40 thousand vehicles.<\/li><li><strong>Step 6 - Select the option:<\/strong> The result corresponds to option (A).<\/li><\/ol><div class='final-answer'>Final Answer: (A)<\/div>"}, {"group": "vehicles", "q": "By how many percentage points is the production of the vehicles of type C, as a percentage of the total number of vehicles produced, more in 2006 than in 2007?", "options": ["3.33", "4.88", "4.44", "2.22"], "answer": "C", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> In 2006, type C forms <span class='math frac'><span>100<\/span><span>375<\/span><\/span>×100=26.67% of total production.<\/li><li><strong>Step 3 - Work through the data:<\/strong> In 2007, type C forms <span class='math frac'><span>100<\/span><span>450<\/span><\/span>×100=22.22%.<\/li><li><strong>Step 4 - Work through the data:<\/strong> The difference is 26.67-22.22=4.45 percentage points, which matches 4.44 after rounding.<\/li><li><strong>Step 5 - Select the option:<\/strong> The result corresponds to option (C).<\/li><\/ol><div class='final-answer'>Final Answer: (C)<\/div>"}, {"group": "vehicles", "q": "For vehicles of type B, the percentage decrease in the production from 2006 to 2007 is equal to the percentage increase in the price during the same period. If the price of each vehicle of type B in 2006 was Rs.2 lakh, then its price in 2007 is", "options": ["Rs.2.33 lakh", "Rs.6 lakh", "Rs.2.99 lakh", "Rs.2.66 lakh"], "answer": "D", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Type B production falls from 75 thousand in 2006 to 50 thousand in 2007.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Percentage decrease=<span class='math frac'><span>75-50<\/span><span>75<\/span><\/span>×100=33.33%.<\/li><li><strong>Step 4 - Work through the data:<\/strong> Hence the price rises by 33.33% from Rs.2 lakh.<\/li><li><strong>Step 5 - Work through the data:<\/strong> New price=2×(1+<span class='math frac'><span>1<\/span><span>3<\/span><\/span>)=Rs.2.666..., approximately Rs.2.66 lakh.<\/li><li><strong>Step 6 - Select the option:<\/strong> The result corresponds to option (D).<\/li><\/ol><div class='final-answer'>Final Answer: (D)<\/div>"}, {"group": "vehicles", "q": "What is the percentage increase in the total production of vehicles by XYZ from 2005 to 2007?", "options": ["100%", "50%", "150%", "200%"], "answer": "A", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Total production in 2005 is 25+50+75+50+25=225 thousand.<\/li><li><strong>Step 3 - Work through the data:<\/strong> Total production in 2007 is 75+50+100+50+175=450 thousand.<\/li><li><strong>Step 4 - Work through the data:<\/strong> Increase=450-225=225 thousand.<\/li><li><strong>Step 5 - Work through the data:<\/strong> Percentage increase=<span class='math frac'><span>225<\/span><span>225<\/span><\/span>×100=100%.<\/li><li><strong>Step 6 - Select the option:<\/strong> The result corresponds to option (A).<\/li><\/ol><div class='final-answer'>Final Answer: (A)<\/div>"}, {"group": "staff", "q": "If 30% of the managers in section C leave the company, then approximately how many managers will be there for every 40 executives in that section?", "options": ["6", "5", "8", "7"], "answer": "D", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 - Work through the data:<\/strong> Section C has 25% of 120 managers, so it initially has 30 managers.<\/li><li><strong>Step 3 - Work through the data:<\/strong> After 30% leave, remaining managers=30×70%=21.<\/li><li><strong>Step 4 - Work through the data:<\/strong> Section C also has 5% of 2400 executives=120 executives.<\/li><li><strong>Step 5 - Work through the data:<\/strong> Managers per 40 executives=<span class='math frac'><span>21<\/span><span>120<\/span><\/span>×40=7.<\/li><li><strong>Step 6 - Select the option:<\/strong> The result corresponds to option (D).<\/li><\/ol><div class='final-answer'>Final Answer: (D)<\/div>"}, {"group": "staff", "q": "If 50% of the executives of section E join a new company, then the remaining executives of the section form what percentage of the total executives in the company?", "options": ["20%", "22.22%", "12.5%", "14.28%"], "answer": "D", "solution": "<p><strong>Detailed step-by-step solution:<\/strong><\/p><ol class='solution-steps'><li><strong>Step 1 - Understand the requirement:<\/strong> Read the relevant bar chart carefully, identify the quantities asked for, and keep all units consistent.<\/li><li><strong>Step 2 function next(){save();go(Math.min(current+1,questions.length-1))}
function markNext(){save();marked[current]=true;go(Math.min(current+1,questions.length-1))}
function clearResponse(){if(submitted)return;responses[current]=null;render()}
function isCorrect(x,response){return x.type==="text"?normalize(response)===normalize(x.answer):response===x.answer}
function answerText(x){return x.type==="text"?x.answer:`(${x.answer})`}
function review(){const x=questions[current],note=document.getElementById("note");document.getElementById("solution").style.display="block";if(responses[current]===null){note.className="answer-note muted";note.textContent=`Unattempted. Correct answer: ${answerText(x)}`}else if(isCorrect(x,responses[current])){note.className="answer-note ok";note.textContent="Correct."}else{note.className="answer-note bad";note.textContent=`Wrong. Correct answer: ${answerText(x)}`}}
function submitTest(auto=false){if(submitted)return;save();if(!auto&&!confirm("Submit this test now? You will not be able to change responses afterward."))return;submitted=true;clearInterval(timerId);let c=0,w=0,u=0;questions.forEach((x,i)=>{if(responses[i]===null)u++;else if(isCorrect(x,responses[i]))c++;else w++});const score=c*3-w;result.style.display="block";result.innerHTML=`<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>${score}</strong></div><div class="score-box">Correct<strong>${c}</strong></div><div class="score-box">Wrong<strong>${w}</strong></div><div class="score-box">Attempted<strong>${c+w}</strong></div><div class="score-box">Unattempted<strong>${u}</strong></div></div>`;render();result.scrollIntoView({behavior:"smooth"})}
function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById("time").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");if(secondsLeft<=0){submitTest(true);return}secondsLeft--}
function calcEval(expr){if(!/^[0-9+\-*/().%\s]+$/.test(expr))return "Error";return Function("return ("+expr.replace(/%/g,"/100")+")")()}
function updateCalcSub(){document.getElementById("calcSubDisplay").textContent=document.getElementById("calcDisplay").value||"0"}
const calcPopup=document.getElementById("calcPopup"),calcHandle=document.getElementById("calcDragHandle");
document.getElementById("calcToggle").onclick=()=>{calcPopup.classList.toggle("open");if(calcPopup.classList.contains("open")&&!calcPopup.dataset.moved){calcPopup.style.left="52%";calcPopup.style.top="120px"}};
document.getElementById("calcClose").onclick=e=>{e.stopPropagation();calcPopup.classList.remove("open")};
document.querySelectorAll("[data-calc]").forEach(btn=>btn.onclick=()=>{const d=document.getElementById("calcDisplay"),v=btn.dataset.calc;if(["MC","MR","MS","M+","M-"].includes(v))return;if(v==="C")d.value="";else if(v==="B")d.value=d.value.slice(0,-1);else if(v==="+/-")d.value=d.value.startsWith("-")?d.value.slice(1):"-"+d.value;else if(v==="sqrt"){try{d.value=Math.sqrt(Number(calcEval(d.value||"0")))}catch{d.value="Error"}}else if(v==="1/x"){try{d.value=1/Number(calcEval(d.value||"0"))}catch{d.value="Error"}}else if(v==="="){try{d.value=calcEval(d.value)}catch{d.value="Error"}}else d.value+=v;updateCalcSub()});
let dragCalc=false,calcDx=0,calcDy=0;
calcHandle.onpointerdown=e=>{dragCalc=true;calcHandle.setPointerCapture(e.pointerId);const r=calcPopup.getBoundingClientRect();calcDx=e.clientX-r.left;calcDy=e.clientY-r.top;calcPopup.style.left=r.left+"px";calcPopup.style.top=r.top+"px";calcPopup.style.right="auto";calcPopup.dataset.moved="1";e.preventDefault()};
calcHandle.onpointermove=e=>{if(!dragCalc)return;const maxX=innerWidth-calcPopup.offsetWidth-4,maxY=innerHeight-calcPopup.offsetHeight-4;calcPopup.style.left=Math.max(4,Math.min(maxX,e.clientX-calcDx))+"px";calcPopup.style.top=Math.max(4,Math.min(maxY,e.clientY-calcDy))+"px"};
calcHandle.onpointerup=e=>{dragCalc=false;try{calcHandle.releasePointerCapture(e.pointerId)}catch{}};
render();tick();timerId=setInterval(tick,1000);
</script></body></html>
