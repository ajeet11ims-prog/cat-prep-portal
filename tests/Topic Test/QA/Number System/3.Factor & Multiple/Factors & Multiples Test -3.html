<!DOCTYPE html>
<html lang="en">
<head>

  <title>Factors &amp; Multiples Test -3</title>
  <script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'}};</script>

  <style>
    :root{--ink:#101820;--muted:#5f6f7a;--line:#b8c3cc;--brand:#0b75bb;--dark:#24313a;--mid:#4089c8;--ok:#60b947;--bad:#e55b25;--review:#7b4ab0;--bg:#eef3f7}
    *{box-sizing:border-box}html,body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;overflow:hidden}header{height:84px;background:#f3f5f7;border-bottom:1px solid #9eadb9}.topbar{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px}.title{background:var(--dark);color:#fff;padding:10px 18px;display:flex;flex-direction:column;justify-content:center}.title h1{font-size:22px;margin:0}.meta{font-size:15px;color:#dce9ef;margin-top:6px}.timer{display:grid;place-items:center;background:#fff;font-weight:700;font-size:18px}.timer span{font-size:22px}
    main{height:calc(100vh - 84px);display:grid;grid-template-columns:minmax(0,1fr) 300px;background:#fff}section{min-width:0;border-right:2px solid #41515c}.panel{padding:14px;background:#e5f6fc;display:flex;flex-direction:column}.panel h2{font-size:18px;margin:0 -14px 14px;padding:10px 14px;background:var(--mid);color:#fff}.qbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.qbtn{height:44px;border:1px solid #a9b3bc;background:linear-gradient(#fff,#dfe5ea);border-radius:3px;font-size:18px;font-weight:700;color:#45515a;cursor:pointer}.qbtn.current{background:#e85b21;color:#fff}.qbtn.answered{background:#72bd3b;color:#fff}.qbtn.marked{background:#7950a5;color:#fff;border-radius:50%}.legend{display:grid;gap:10px;margin-top:18px}.dot{display:inline-block;width:20px;height:20px;border:1px solid var(--line);vertical-align:-5px;margin-right:8px}.dot.current{background:#e85b21}.dot.answered{background:#72bd3b}.dot.marked{background:#7950a5;border-radius:50%}.side-submit{margin-top:auto;align-self:center;width:124px;height:42px;border:0;background:#29a8df;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
    .question-card{height:100%;overflow:auto;padding:0 0 74px}.qhead{min-height:52px;padding:12px 16px;border-bottom:1px solid #c6d0d8;background:#f5f7f9}.qnum{font-size:19px;font-weight:700}.qtext{font-size:20px;font-weight:700;padding:24px;min-height:125px}.options{display:grid;gap:14px;padding:0 24px 18px}.option{display:flex;gap:12px;cursor:pointer;font-size:20px;font-weight:700}.option input{margin-top:7px;transform:scale(1.25)}.typed-answer{width:min(420px,calc(100% - 48px));font-size:20px;font-weight:700;border:1px solid #8795a1;padding:12px;margin-left:24px}.navrow{position:fixed;left:0;right:300px;bottom:0;height:64px;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:10px 16px;background:#eef8fc;border-top:1px solid #b6cbd6}.navrow button{border:1px solid #b6c1ca;padding:11px 18px;font-size:16px;font-weight:700;background:#fff;cursor:pointer}.navrow .next{background:#29a8df;color:#fff}.solution{display:none;margin:16px 24px 0;padding:14px 16px;border:1px solid var(--line);background:#f8fbfd;font-size:17px}.solution h3{margin:0 0 8px;color:var(--brand)}.answer-note{margin:14px 24px 0;font-weight:800}.ok{color:#157347}.bad{color:#b02a37}.muted{color:var(--muted)}#result{display:none;padding:16px;border-bottom:1px solid var(--line)}.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.score-box{border:1px solid var(--line);padding:10px;background:#fbfcfd}.score-box strong{display:block;font-size:24px}
    mjx-container{font-size:108%!important}@media(max-width:900px){html,body{overflow:auto}header{height:auto}.topbar{grid-template-columns:1fr}.timer{padding:8px}main{height:auto;display:block}.panel{min-height:260px}.qbar{grid-template-columns:repeat(5,1fr)}.question-card{height:auto;min-height:70vh}.navrow{position:static}.score-grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <header><div class="topbar"><div class="title"><h1>Factors &amp; Multiples Test -3</h1><div class="meta">20 Questions | 40 Minutes | +3 correct, -1 wrong | MCQ and numeric entry</div></div><div class="timer">Time Left: <span id="time">40:00</span></div></div></header>
  <main><section><div id="result"></div><form id="testForm" autocomplete="off"><div id="questionHost" class="question-card"></div></form></section><aside class="panel"><h2>Question Bar</h2><div id="qbar" class="qbar"></div><div class="legend"><span><i class="dot current"></i>Current</span><span><i class="dot answered"></i>Answered</span><span><i class="dot marked"></i>Marked</span></div><button type="button" class="side-submit" onclick="submitTest()">Submit</button></aside></main>
  <script>
    const questions=[{"type":"mcq","question":"If \\(N\\) is a perfect number, the sum of all positive factors of \\(N\\) equals:","options":["\\(N\\)","\\(2N\\)","\\(3N\\)","\\(4N\\)"],"answer":1,"typedAnswer":"\\(2N\\)","solution":"\u003cp>A perfect number equals the sum of its proper positive divisors.\u003c/p>\u003cp>Including \\(N\\) itself makes the sum of all positive divisors \\(N+N=2N\\).\u003c/p>","no":1,"itemId":72201,"source":"Factors & Multiples Test 3"},{"type":"mcq","question":"Find the number of positive integers less than \\(2^{14}\\) and co-prime to it.","options":["\\(2^{12}\\)","\\(2^{22}\\)","\\(2^{23}\\)","\\(2^{13}\\)"],"answer":3,"typedAnswer":"\\(2^{13}\\)","solution":"\u003cp>Euler's totient formula gives \\(\\varphi(2^{14})=2^{14}(1-1/2)\\).\u003c/p>\u003cp>Hence \\(\\varphi(2^{14})=2^{13}\\).\u003c/p>","no":2,"itemId":72202,"source":"Factors & Multiples Test 3"},{"type":"mcq","question":"If \\(N=3^p\\cdot2^q\\cdot3^{2r}\\), find the number of positive integers less than \\(N\\) and co-prime to it.","options":["\\(N/4\\)","\\(N/3\\)","\\(2N/3\\)","\\(N/2\\)"],"answer":1,"typedAnswer":"\\(N/3\\)","solution":"\u003cp>The only distinct primes dividing \\(N\\) are 2 and 3.\u003c/p>\u003cp>\\(\\varphi(N)=N(1-1/2)(1-1/3)=N\\cdot(1/2)\\cdot(2/3)=N/3\\).\u003c/p>","no":3,"itemId":72203,"source":"Factors & Multiples Test 3"},{"type":"text","question":"Find the number of positive integers less than \\(289\\) and co-prime to it.","options":[],"answer":0,"typedAnswer":"272","solution":"\u003cp>\\(289=17^2\\).\u003c/p>\u003cp>Thus \\(\\varphi(289)=17^2-17=289-17=272\\).\u003c/p>","no":4,"itemId":72204,"source":"Factors & Multiples Test 3"},{"type":"text","question":"Find the sum of the positive integers less than \\(48\\) and co-prime to \\(48\\).","options":[],"answer":0,"typedAnswer":"384","solution":"\u003cp>\\(48=2^4\\cdot3\\), so \\(\\varphi(48)=48(1/2)(2/3)=16\\).\u003c/p>\u003cp>Reduced residues pair as \\(a\\) and \\(48-a\\); each pair sums to 48. There are 8 pairs, so the sum is \\(8\\cdot48=384\\).\u003c/p>","no":5,"itemId":72205,"source":"Factors & Multiples Test 3"},{"type":"mcq","question":"What is the product of all positive factors of \\(18^3\\)?","options":["\\(18^{84}\\)","\\(18^{42}\\)","\\(18^{314}\\)","None of these"],"answer":1,"typedAnswer":"\\(18^{42}\\)","solution":"\u003cp>\\(18^3=(2\\cdot3^2)^3=2^3\\cdot3^6\\), so its divisor count is \\((3+1)(6+1)=28\\).\u003c/p>\u003cp>The product is \\((18^3)^{28/2}=18^{42}\\).\u003c/p>","no":6,"itemId":72206,"source":"Factors & Multiples Test 3"},{"type":"mcq","question":"What is the product of all positive factors of \\(12!\\)?","options":["\\(2^{10}3^5 5^2(77)\\)","\\((12!)^{396}\\)","\\((12!)^{782}\\)","None of these"],"answer":1,"typedAnswer":"\\((12!)^{396}\\)","solution":"\u003cp>\\(12!=2^{10}3^5 5^2 7\\cdot11\\), so \\(d(12!)=11\\cdot6\\cdot3\\cdot2\\cdot2=792\\).\u003c/p>\u003cp>Therefore the product of all divisors is \\((12!)^{792/2}=(12!)^{396}\\).\u003c/p>","no":7,"itemId":72207,"source":"Factors & Multiples Test 3"},{"type":"text","question":"In how many ways can \\(11025\\) be expressed as a product of two co-prime natural numbers, with order ignored?","options":[],"answer":0,"typedAnswer":"4","solution":"\u003cp>\\(11025=3^2\\cdot5^2\\cdot7^2\\) has three distinct prime-power blocks.\u003c/p>\u003cp>The number of unordered co-prime pairs is \\(2^{3-1}=4\\).\u003c/p>","no":8,"itemId":72208,"source":"Factors & Multiples Test 3"},{"type":"text","question":"How many odd natural numbers up to \\(1400\\) are divisible by neither 5 nor 7?","options":[],"answer":0,"typedAnswer":"480","solution":"\u003cp>There are 700 odd numbers up to 1400. Odd multiples of 5: 140; odd multiples of 7: 100; odd multiples of 35: 20.\u003c/p>\u003cp>By inclusion-exclusion, the required count is \\(700-140-100+20=480\\).\u003c/p>","no":9,"itemId":72209,"source":"Factors & Multiples Test 3"},{"type":"text","question":"How many positive integers are factors of exactly one of \\(1125\\) and \\(1800\\)?","options":[],"answer":0,"typedAnswer":"30","solution":"\u003cp>\\(1125=3^2 5^3\\) has 12 factors, and \\(1800=2^3 3^2 5^2\\) has 36.\u003c/p>\u003cp>The common factors are the factors of \\(\\gcd(1125,1800)=225\\), of which there are 9. Hence exactly one count is \\(12+36-2\\cdot9=30\\).\u003c/p>","no":10,"itemId":72210,"source":"Factors & Multiples Test 3"},{"type":"mcq","question":"There are \\(N\\) houses numbered 1 to \\(N\\). All but five are destroyed. The five surviving house numbers are consecutive, and the sum of the destroyed house numbers is 1085. What is the least surviving house number?","options":["36","26","25","Either 36 or 26"],"answer":3,"typedAnswer":"Either 36 or 26","solution":"\u003cp>If \\(N=49\\), the total is \\(1225\\); the five survivors sum to \\(140\\) and are \\(26,27,28,29,30\\).\u003c/p>\u003cp>If \\(N=50\\), the total is \\(1275\\); the survivors sum to \\(190\\) and are \\(36,37,38,39,40\\). Both cases make the destroyed-house sum 1085, so either 26 or 36 is possible.\u003c/p>","no":11,"itemId":72211,"source":"Factors & Multiples Test 3"},{"type":"mcq","question":"Let \\(N=2^{25}3^{15}5^{16}\\). Find the number of factors of \\(N\\) that are perfect cubes.","options":["324","200","288","225"],"answer":0,"typedAnswer":"324","solution":"\u003cp>A cube factor uses exponents divisible by 3.\u003c/p>\u003cp>Choices are 9 for the exponent of 2 (\\(0\\) to \\(24\\)), 6 for 3, and 6 for 5. Hence \\(9\\cdot6\\cdot6=324\\).\u003c/p>","no":12,"itemId":72212,"source":"Factors & Multiples Test 3"},{"type":"text","question":"A set \\(S\\) contains all integers \\(x\\) such that every digit of \\(x\\) is even and \\(2100\\le x\\le2300\\). How many elements of \\(S\\) are divisible by 3?","options":[],"answer":0,"typedAnswer":"9","solution":"\u003cp>Such a number must be \\(22tu\\) where \\(t,u\\in\\{0,2,4,6,8\\}\\).\u003c/p>\u003cp>Divisibility by 3 requires \\(4+t+u\\equiv0\\pmod3\\), or \\(t+u\\equiv2\\pmod3\\). Counting the admissible ordered pairs gives \\(8+1=9\\).\u003c/p>","no":13,"itemId":72213,"source":"Factors & Multiples Test 3"},{"type":"mcq","question":"Find the number of divisors of \\(900\\) excluding 1 and 900.","options":["25","27","23","21"],"answer":0,"typedAnswer":"25","solution":"\u003cp>\\(900=2^2\\cdot3^2\\cdot5^2\\), so it has \\(3^3=27\\) positive divisors.\u003c/p>\u003cp>Excluding 1 and the number itself leaves \\(27-2=25\\).\u003c/p>","no":14,"itemId":72214,"source":"Factors & Multiples Test 3"},{"type":"mcq","question":"In how many ways can \\(1500\\) be expressed as a product of two of its factors, with order ignored?","options":["18","12","24","36"],"answer":1,"typedAnswer":"12","solution":"\u003cp>\\(1500=2^2\\cdot3\\cdot5^3\\), so \\(d(1500)=3\\cdot2\\cdot4=24\\).\u003c/p>\u003cp>Since 1500 is not a square, there are \\(24/2=12\\) unordered factor pairs.\u003c/p>","no":15,"itemId":72215,"source":"Factors & Multiples Test 3"},{"type":"text","question":"In how many different ways can \\(784\\) be expressed as a product of two different positive factors, with order ignored?","options":[],"answer":0,"typedAnswer":"7","solution":"\u003cp>\\(784=2^4\\cdot7^2\\), so \\(d(784)=5\\cdot3=15\\).\u003c/p>\u003cp>There are \\((15+1)/2=8\\) unordered pairs including \\((28,28\\). Excluding that equal pair leaves 7.\u003c/p>","no":16,"itemId":72216,"source":"Factors & Multiples Test 3"},{"type":"mcq","question":"What is the product of all positive factors of \\(4!\\cdot5!\\)?","options":["\\(120^8\\cdot24^4\\)","2880","\\(2880^{21}\\)","\\(2880^{42}\\)"],"answer":2,"typedAnswer":"\\(2880^{21}\\)","solution":"\u003cp>\\(4!\\cdot5!=24\\cdot120=2880=2^6\\cdot3^2\\cdot5\\).\u003c/p>\u003cp>It has \\(7\\cdot3\\cdot2=42\\) divisors, so their product is \\(2880^{42/2}=2880^{21}\\).\u003c/p>","no":17,"itemId":72217,"source":"Factors & Multiples Test 3"},{"type":"mcq","question":"What is the product of all positive factors of \\(8^9\\cdot9^8\\)?","options":["\\(2^{3213}3^{1904}\\)","\\(2^{1904}3^{3213}\\)","\\(6^{238}\\)","\\(2^{6426}3^{3808}\\)"],"answer":3,"typedAnswer":"\\(2^{6426}3^{3808}\\)","solution":"\u003cp>\\(8^9\\cdot9^8=2^{27}3^{16}\\) and its divisor count is \\(28\\cdot17=476\\).\u003c/p>\u003cp>The product is \\((2^{27}3^{16})^{238}=2^{6426}3^{3808}\\).\u003c/p>","no":18,"itemId":72218,"source":"Factors & Multiples Test 3"},{"type":"text","question":"How many positive integers less than \\(8640\\) are co-prime to it?","options":[],"answer":0,"typedAnswer":"2304","solution":"\u003cp>\\(8640=2^6\\cdot3^3\\cdot5\\).\u003c/p>\u003cp>\\(\\varphi(8640)=8640(1-1/2)(1-1/3)(1-1/5)=8640\\cdot\\frac12\\cdot\\frac23\\cdot\\frac45=2304\\).\u003c/p>","no":19,"itemId":72219,"source":"Factors & Multiples Test 3"},{"type":"text","question":"Find the number of factors of \\(N=2^5\\cdot3^4\\cdot5^3\\) that are multiples of 15.","options":[],"answer":0,"typedAnswer":"72","solution":"\u003cp>A divisor multiple of \\(15=3\\cdot5\\) must use a positive exponent of 3 and of 5.\u003c/p>\u003cp>There are 6 choices for the exponent of 2, 4 positive choices for 3 and 3 positive choices for 5. Thus \\(6\\cdot4\\cdot3=72\\).\u003c/p>","no":20,"itemId":72220,"source":"Factors & Multiples Test 3"}];
    let current=0,submitted=false,secondsLeft=40*60;const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false),labels=['A','B','C','D'];
    const host=document.getElementById('questionHost'),qbar=document.getElementById('qbar'),resultBox=document.getElementById('result');
    function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function norm(s){return String(s??'').trim().toLowerCase().replace(/[, ]/g,'').replace(/.0+$/,'');}
    function correctText(q){return q.type==='mcq'?'('+labels[q.answer]+') '+q.options[q.answer]:q.typedAnswer;}
    function renderBar(){qbar.innerHTML=questions.map((q,i)=>'<button type="button" class="qbtn '+(i===current?'current ':'')+(responses[i]!==null&&responses[i]!==''?'answered ':'')+(marked[i]?'marked ':'')+'" onclick="go('+i+')">'+(i+1)+'</button>').join('');}
    function control(q,i){if(q.type==='mcq')return '<div class="options">'+q.options.map((op,j)=>'<label class="option"><input type="radio" name="answer_'+i+'" value="'+j+'" '+(responses[i]===String(j)?'checked':'')+' '+(submitted?'disabled':'')+'><span>('+labels[j]+') '+op+'</span></label>').join('')+'</div>';return '<input class="typed-answer" name="answer_'+i+'" value="'+esc(responses[i]||'')+'" placeholder="Type your answer" '+(submitted?'disabled':'')+'>';}
    function typeset(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([host,resultBox]).catch(()=>{});}
    function renderQuestion(){const q=questions[current];host.innerHTML='<div class="qhead"><div class="qnum">Question '+(current+1)+' of '+questions.length+'</div></div><div class="qtext">'+q.question+'</div>'+control(q,current)+'<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Detailed Solution</h3><strong>Correct answer: '+correctText(q)+'</strong>'+q.solution+'</div><div class="navrow"><button type="button" onclick="markReviewNext()">Mark for Review &amp; Next</button><button type="button" onclick="clearResponse()" '+(submitted?'disabled':'')+'>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" class="next" onclick="nextQ()">Save &amp; Next</button></div>';bindAnswer();if(submitted)showReviewForCurrent();renderBar();typeset();}
    function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{el.addEventListener('input',()=>{responses[current]=el.value;renderBar();});});}
    function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}
    function go(i){saveCurrent();current=i;renderQuestion()}function prevQ(){if(current>0)go(current-1)}function nextQ(){if(current<questions.length-1)go(current+1)}function markReviewNext(){marked[current]=true;nextQ()}function clearResponse(){responses[current]=null;renderQuestion()}
    function isCorrect(q,a){if(a===null||a==='')return null;return q.type==='mcq'?Number(a)===q.answer:norm(a)===norm(q.typedAnswer);}
    function showReviewForCurrent(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';if(r===null){note.className='answer-note muted';note.textContent='Unattempted.'}else if(r){note.className='answer-note ok';note.textContent='Correct.'}else{note.className='answer-note bad';note.textContent='Wrong.'}typeset();}
    function submitTest(){if(submitted)return;saveCurrent();submitted=true;let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++});resultBox.style.display='block';resultBox.innerHTML='<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>'+(c*3-w)+'</strong></div><div class="score-box">Correct<strong>'+c+'</strong></div><div class="score-box">Wrong<strong>'+w+'</strong></div><div class="score-box">Attempted<strong>'+(c+w)+'</strong></div><div class="score-box">Unattempted<strong>'+u+'</strong></div></div>';renderQuestion();resultBox.scrollIntoView({behavior:'smooth'});typeset();}
    function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest();return}secondsLeft--}
    renderQuestion();tick();setInterval(tick,1000);
  </script>
</body></html>
