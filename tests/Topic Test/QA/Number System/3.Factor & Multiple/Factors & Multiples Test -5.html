<!DOCTYPE html>
<html lang="en">
<head>

  <title>Factors &amp; Multiples Test -5</title>
  <script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'}};</script>

  <style>
    :root{--ink:#101820;--muted:#5f6f7a;--line:#b8c3cc;--brand:#0b75bb;--dark:#24313a;--mid:#4089c8;--ok:#60b947;--bad:#e55b25;--review:#7b4ab0;--bg:#eef3f7}
    *{box-sizing:border-box}html,body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;overflow:hidden}header{height:84px;background:#f3f5f7;border-bottom:1px solid #9eadb9}.topbar{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px}.title{background:var(--dark);color:#fff;padding:10px 18px;display:flex;flex-direction:column;justify-content:center}.title h1{font-size:22px;margin:0}.meta{font-size:15px;color:#dce9ef;margin-top:6px}.timer{display:grid;place-items:center;background:#fff;font-weight:700;font-size:18px}.timer span{font-size:22px}
    main{height:calc(100vh - 84px);display:grid;grid-template-columns:minmax(0,1fr) 300px;background:#fff}section{min-width:0;border-right:2px solid #41515c}.panel{padding:14px;background:#e5f6fc;display:flex;flex-direction:column}.panel h2{font-size:18px;margin:0 -14px 14px;padding:10px 14px;background:var(--mid);color:#fff}.qbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.qbtn{height:44px;border:1px solid #a9b3bc;background:linear-gradient(#fff,#dfe5ea);border-radius:3px;font-size:18px;font-weight:700;color:#45515a;cursor:pointer}.qbtn.current{background:#e85b21;color:#fff}.qbtn.answered{background:#72bd3b;color:#fff}.qbtn.marked{background:#7950a5;color:#fff;border-radius:50%}.legend{display:grid;gap:10px;margin-top:18px}.dot{display:inline-block;width:20px;height:20px;border:1px solid var(--line);vertical-align:-5px;margin-right:8px}.dot.current{background:#e85b21}.dot.answered{background:#72bd3b}.dot.marked{background:#7950a5;border-radius:50%}.side-submit{margin-top:auto;align-self:center;width:124px;height:42px;border:0;background:#29a8df;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
    .question-card{height:100%;overflow:auto;padding:0 0 74px}.qhead{min-height:52px;padding:12px 16px;border-bottom:1px solid #c6d0d8;background:#f5f7f9}.qnum{font-size:19px;font-weight:700}.qtext{font-size:20px;font-weight:700;padding:24px;min-height:125px}.options{display:grid;gap:14px;padding:0 24px 18px}.option{display:flex;gap:12px;cursor:pointer;font-size:20px;font-weight:700}.option input{margin-top:7px;transform:scale(1.25)}.typed-answer{width:min(420px,calc(100% - 48px));font-size:20px;font-weight:700;border:1px solid #8795a1;padding:12px;margin-left:24px}.navrow{position:fixed;left:0;right:300px;bottom:0;height:64px;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:10px 16px;background:#eef8fc;border-top:1px solid #b6cbd6}.navrow button{border:1px solid #b6c1ca;padding:11px 18px;font-size:16px;font-weight:700;background:#fff;cursor:pointer}.navrow .next{background:#29a8df;color:#fff}.solution{display:none;margin:16px 24px 0;padding:14px 16px;border:1px solid var(--line);background:#f8fbfd;font-size:17px}.solution h3{margin:0 0 8px;color:var(--brand)}.answer-note{margin:14px 24px 0;font-weight:800}.ok{color:#157347}.bad{color:#b02a37}.muted{color:var(--muted)}#result{display:none;padding:16px;border-bottom:1px solid var(--line)}.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.score-box{border:1px solid var(--line);padding:10px;background:#fbfcfd}.score-box strong{display:block;font-size:24px}
    mjx-container{font-size:108%!important}@media(max-width:900px){html,body{overflow:auto}header{height:auto}.topbar{grid-template-columns:1fr}.timer{padding:8px}main{height:auto;display:block}.panel{min-height:260px}.qbar{grid-template-columns:repeat(5,1fr)}.question-card{height:auto;min-height:70vh}.navrow{position:static}.score-grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <header><div class="topbar"><div class="title"><h1>Factors &amp; Multiples Test -5</h1><div class="meta">20 Questions | 40 Minutes | +3 correct, -1 wrong | MCQ and numeric entry</div></div><div class="timer">Time Left: <span id="time">40:00</span></div></div></header>
  <main><section><div id="result"></div><form id="testForm" autocomplete="off"><div id="questionHost" class="question-card"></div></form></section><aside class="panel"><h2>Question Bar</h2><div id="qbar" class="qbar"></div><div class="legend"><span><i class="dot current"></i>Current</span><span><i class="dot answered"></i>Answered</span><span><i class="dot marked"></i>Marked</span></div><button type="button" class="side-submit" onclick="submitTest()">Submit</button></aside></main>
  <script>
    const questions=[{"type":"text","question":"Find the greatest natural number \\(n\\) for which \\(\\frac{20n^4+15n^3+10n^2+5n+10}{5n}\\) is a natural number.","options":[],"answer":0,"typedAnswer":"2","solution":"\u003cp>The expression simplifies to \\(4n^3+3n^2+2n+1+\\frac2n\\).\u003c/p>\u003cp>It is integral when \\(n\\mid2\\). The natural values are 1 and 2, so the greatest is 2.\u003c/p>","no":1,"itemId":72401,"source":"Factors & Multiples Test 5"},{"type":"mcq","question":"Find the sum of all natural numbers from 1 to 100 that are neither multiples of 2 nor multiples of 5.","options":["2000","2275","2515","2845"],"answer":0,"typedAnswer":"2000","solution":"\u003cp>The sum of all odd numbers from 1 to 99 is \\(50^2=2500\\).\u003c/p>\u003cp>Remove the odd multiples of 5: \\(5+15+\\cdots+95=5(1+3+\\cdots+19)=5\\cdot100=500\\). Required sum \\(=2500-500=2000\\).\u003c/p>","no":2,"itemId":72402,"source":"Factors & Multiples Test 5"},{"type":"mcq","question":"A two-digit number has exactly three factors excluding 1 and itself. Find the sum of all such two-digit numbers.","options":["97","96","359","1020"],"answer":0,"typedAnswer":"97","solution":"\u003cp>Exactly three proper factors means five factors in total. A number with five factors must be \\(p^4\\) for a prime \\(p\\).\u003c/p>\u003cp>The two-digit values are \\(2^4=16\\) and \\(3^4=81\\); their sum is \\(97\\).\u003c/p>","no":3,"itemId":72403,"source":"Factors & Multiples Test 5"},{"type":"mcq","question":"Four distinct non-zero digits \\(a,b,c,d\\) satisfy: \\(b+c+d\\) is a multiple of 9, \\(a+c+d\\) a multiple of 8, \\(a+b+d\\) a multiple of 5, and \\(a+b+c\\) a multiple of 23. Find \\(ab\\).","options":["24","35","40","48"],"answer":3,"typedAnswer":"48","solution":"\u003cp>Because three digits sum to at most 24, \\(a+b+c\\) must equal 23. Testing distinct digits under the other divisibility conditions gives \\((a,b,c,d)=(6,8,9,1)\\).\u003c/p>\u003cp>Therefore \\(ab=6\\cdot8=48\\).\u003c/p>","no":4,"itemId":72404,"source":"Factors & Multiples Test 5"},{"type":"mcq","question":"Let \\(S\\) be the set of five-digit numbers formed using 1,2,3,4,5 exactly once, with exactly two odd positions occupied by odd digits. Find the sum of the units digits of all numbers in \\(S\\).","options":["228","216","294","192"],"answer":1,"typedAnswer":"216","solution":"\u003cp>There are three odd digits and three odd positions. Exactly two odd positions must receive odd digits.\u003c/p>\u003cp>Counting valid permutations by the units digit gives 72 numbers in total; symmetry/counting the admissible placements gives a units-digit sum of \\(216\\).\u003c/p>","no":5,"itemId":72405,"source":"Factors & Multiples Test 5"},{"type":"mcq","question":"If \\(\\frac{94}{27}=a+\\frac{1}{b+\\frac1c}\\), where \\(a,b,c\\) are positive integers, find \\(a+b+c\\).","options":["18","20","12","15"],"answer":0,"typedAnswer":"18","solution":"\u003cp>\\(94/27=3+13/27=3+1/(27/13)\\).\u003c/p>\u003cp>Also \\(27/13=2+1/13\\). Hence \\((a,b,c)=(3,2,13)\\) and the sum is \\(18\\).\u003c/p>","no":6,"itemId":72406,"source":"Factors & Multiples Test 5"},{"type":"text","question":"In how many ways can \\(1000\\) be written as a sum of two or more consecutive natural numbers?","options":[],"answer":0,"typedAnswer":"3","solution":"\u003cp>The number of representations as consecutive positive integers is governed by odd divisors. \\(1000=2^3\\cdot5^3\\) has four odd divisors.\u003c/p>\u003cp>One corresponds to the one-term representation, so the number using two or more terms is \\(4-1=3\\).\u003c/p>","no":7,"itemId":72407,"source":"Factors & Multiples Test 5"},{"type":"mcq","question":"Find the product of all positive factors of \\(5^{32}\\).","options":["\\(5^{1056}\\)","\\(5^{528}\\)","\\(5^{264}\\)","\\(5^{320}\\)"],"answer":1,"typedAnswer":"\\(5^{528}\\)","solution":"\u003cp>\\(5^{32}\\) has \\(32+1=33\\) factors.\u003c/p>\u003cp>The divisor product is \\((5^{32})^{33/2}=5^{32\\cdot33/2}=5^{528}\\).\u003c/p>","no":8,"itemId":72408,"source":"Factors & Multiples Test 5"},{"type":"mcq","question":"How many natural numbers \\(N\\) satisfy: \\(N!\\) is a multiple of \\(2^{26}\\), but not a multiple of \\(3^{26}\\)?","options":["24","23","22","18"],"answer":0,"typedAnswer":"24","solution":"\u003cp>\\(v_2(29!)=25\\) and \\(v_2(30!)=26\\), so \\(N\\ge30\\).\u003c/p>\u003cp>\\(v_3(53!)=23\\) while \\(v_3(54!)=26\\), so \\(N\\le53\\). Thus \\(N=30,31,\\ldots,53\\): 24 values.\u003c/p>","no":9,"itemId":72409,"source":"Factors & Multiples Test 5"},{"type":"mcq","question":"Among the first 100 natural numbers, how many can be expressed as a difference of two perfect squares in at least one way?","options":["25","40","50","75"],"answer":3,"typedAnswer":"75","solution":"\u003cp>\\(a^2-b^2=(a-b)(a+b)\\). A positive integer is a difference of two squares exactly when it is odd or divisible by 4; numbers congruent to 2 modulo 4 are impossible.\u003c/p>\u003cp>There are 25 such excluded numbers up to 100, so \\(100-25=75\\) work.\u003c/p>","no":10,"itemId":72410,"source":"Factors & Multiples Test 5"},{"type":"mcq","question":"For \\(N=2^{12}3^8 5^{10}7^4\\), how many factors of \\(N\\) are multiples of 360 but not multiples of 420?","options":["1400","900","700","1200"],"answer":2,"typedAnswer":"700","solution":"\u003cp>Multiples of \\(360=2^3 3^2 5\\) among the divisors: \\(10\\cdot7\\cdot10\\cdot5=3500\\).\u003c/p>\u003cp>Those also divisible by \\(420=2^2 3\\cdot5\\cdot7\\) are multiples of the LCM \\(2^3 3^2 5\\cdot7\\): \\(10\\cdot7\\cdot10\\cdot4=2800\\). Difference \\(=700\\).\u003c/p>","no":11,"itemId":72411,"source":"Factors & Multiples Test 5"},{"type":"mcq","question":"Let \\(N=2^{35}3^{41}\\). How many factors of \\(N^2\\) are less than \\(N\\) but do not divide \\(N\\)?","options":["2936","1435","1570","1511"],"answer":1,"typedAnswer":"1435","solution":"\u003cp>\\(N^2=2^{70}3^{82}\\) has \\(71\\cdot83=5893\\) divisors. By symmetry, \\((5893-1)/2=2946\\) are less than \\(N\\).\u003c/p>\u003cp>\\(N\\) has \\(36\\cdot42=1512\\) divisors, of which 1511 are less than \\(N\\). Hence \\(2946-1511=1435\\).\u003c/p>","no":12,"itemId":72412,"source":"Factors & Multiples Test 5"},{"type":"mcq","question":"How many natural numbers from 1 to 50 have at least two and at most three positive factors?","options":["4","12","15","19"],"answer":3,"typedAnswer":"19","solution":"\u003cp>Numbers with exactly two factors are primes: there are 15 primes up to 50.\u003c/p>\u003cp>Numbers with exactly three factors are squares of primes: \\(4,9,25,49\\), four more. Total \\(15+4=19\\).\u003c/p>","no":13,"itemId":72413,"source":"Factors & Multiples Test 5"},{"type":"mcq","question":"If \\(N=3x^3+6x^2+5x+36\\), for how many natural-number values of \\(x\\) is \\(N\\) divisible by \\(x\\)?","options":["6","8","9","12"],"answer":2,"typedAnswer":"9","solution":"\u003cp>\\(N/x=3x^2+6x+5+36/x\\).\u003c/p>\u003cp>This is integral exactly when \\(x\\) is a positive divisor of 36. Since \\(36=2^2 3^2\\), it has \\(3\\cdot3=9\\) positive divisors.\u003c/p>","no":14,"itemId":72414,"source":"Factors & Multiples Test 5"},{"type":"text","question":"Find the sum of the even factors of 144 and the odd factors of 2400.","options":[],"answer":0,"typedAnswer":"514","solution":"\u003cp>\\(144=2^4 3^2\\). Sum of even factors \\(=(2+4+8+16)(1+3+9)=30\\cdot13=390\\).\u003c/p>\u003cp>\\(2400=2^5 3\\cdot5^2\\). Sum of odd factors \\(=(1+3)(1+5+25)=4\\cdot31=124\\). Total \\(390+124=514\\).\u003c/p>","no":15,"itemId":72415,"source":"Factors & Multiples Test 5"},{"type":"text","question":"Find the number of factors of \\(2^6\\cdot5^9\\cdot12^3\\) that are perfect squares.","options":[],"answer":0,"typedAnswer":"70","solution":"\u003cp>\\(2^6\\cdot5^9\\cdot12^3=2^{12}3^3 5^9\\).\u003c/p>\u003cp>Even exponent choices are 7 for 2, 2 for 3 and 5 for 5. Hence \\(7\\cdot2\\cdot5=70\\).\u003c/p>","no":16,"itemId":72416,"source":"Factors & Multiples Test 5"},{"type":"text","question":"If \\(x=30^{12}\\), how many factors of \\(x\\) have at least one zero at the end?","options":[],"answer":0,"typedAnswer":"1872","solution":"\u003cp>\\(30^{12}=2^{12}3^{12}5^{12}\\). A divisor ends in zero if it contains at least one 2 and at least one 5.\u003c/p>\u003cp>The exponent choices are 12 positive choices for 2, 13 choices for 3 and 12 positive choices for 5: \\(12\\cdot13\\cdot12=1872\\).\u003c/p>","no":17,"itemId":72417,"source":"Factors & Multiples Test 5"},{"type":"mcq","question":"There is a number \\(x^2\\) that has 21 positive factors. How many positive factors can \\(x\\) have?","options":["12 or 8","11 or 8","10 or 6","12 or 6"],"answer":1,"typedAnswer":"11 or 8","solution":"\u003cp>If \\(x=\\prod p_i^{a_i}\\), then \\(d(x^2)=\\prod(2a_i+1)=21\\).\u003c/p>\u003cp>Either \\(21=21\\) gives \\(a=10\\) and \\(d(x)=11\\), or \\(21=3\\cdot7\\) gives exponents 1 and 3 and \\(d(x)=2\\cdot4=8\\).\u003c/p>","no":18,"itemId":72418,"source":"Factors & Multiples Test 5"},{"type":"mcq","question":"The product of all factors of a positive integer \\(P\\) equals \\(P^2\\). The sum of all proper factors of \\(P\\) is 20. Between which limits does \\(P\\) lie?","options":["0 and 20","20 and 40","40 and 60","60 and 80"],"answer":1,"typedAnswer":"20 and 40","solution":"\u003cp>The divisor-product condition gives \\(d(P)=4\\). Thus \\(P\\) is either \\(p^3\\) or \\(pq\\) for distinct primes.\u003c/p>\u003cp>\\(p^3\\) does not satisfy the proper-factor sum. For \\(P=pq\\), \\(1+p+q=20\\), so \\(p+q=19\\); the prime pair is 2 and 17, giving \\(P=34\\), between 20 and 40.\u003c/p>","no":19,"itemId":72419,"source":"Factors & Multiples Test 5"},{"type":"mcq","question":"If \\(N=10800\\), find three times the number of odd factors plus twice the number of even factors plus three times the number of perfect-square factors.","options":["168","192","172","180"],"answer":0,"typedAnswer":"168","solution":"\u003cp>\\(10800=2^4 3^3 5^2\\). Total factors \\(=5\\cdot4\\cdot3=60\\); odd factors \\(=4\\cdot3=12\\); even factors \\(=48\\).\u003c/p>\u003cp>Square factors \\(=(2+1)(1+1)(1+1)=12\\). Required value \\(3(12)+2(48)+3(12)=168\\).\u003c/p>","no":20,"itemId":72420,"source":"Factors & Multiples Test 5"}];
    let current=0,submitted=false,secondsLeft=40*60;const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false),labels=['A','B','C','D'];
    const host=document.getElementById('questionHost'),qbar=document.getElementById('qbar'),resultBox=document.getElementById('result');
    function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function norm(s){return String(s??'').trim().toLowerCase().replace(/[, ]/g,'').replace(/.0+$/,'');}
    function correctText(q){return q.type==='mcq'?'('+labels[q.answer]+') '+q.options[q.answer]:q.typedAnswer;}
    function renderBar(){qbar.innerHTML=questions.map((q,i)=>'<button type="button" class="qbtn '+(i===current?'current ':'')+(responses[i]!==null&&responses[i]!==''?'answered ':'')+(marked[i]?'marked ':'')+'" onclick="go('+i+')">'+(i+1)+'</button>').join('');}
    function control(q,i){if(q.type==='mcq')return '<div class="options">'+q.options.map((op,j)=>'<label class="option"><input type="radio" name="answer_'+i+'" value="'+j+'" '+(responses[i]===String(j)?'checked':'')+' '+(submitted?'disabled':'')+'><span>('+labels[j]+') '+op+'</span></label>').join('')+'</div>';return '<input class="typed-answer" name="answer_'+i+'" value="'+esc(responses[i]||'')+'" placeholder="Type your answer" '+(submitted?'disabled':'')+'>';}
    function typeset(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([host,resultBox]).catch(()=>{});}
    function renderQuestion(){const q=questions[current];host.innerHTML='<div class="qhead"><div class="qnum">Question '+(current+1)+' of '+questions.length+'</div></div><div class="qtext">'+q.question+'</div>'+control(q,current)+'<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Detailed Solution</h3><strong>Correct answer: '+correctText(q)+'</strong>'+q.solution+'</div><div class="navrow"><button type="button" onclick="markReviewNext()">Mark for Review &amp; Next</button><button type="button" onclick="clearResponse()" '+(submitted?'disabled':'')+'>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" class="next" onclick="nextQ()">Save &amp; Next</button></div>';bindAnswer();if(submitted)showReviewForCurrent();renderBar();typeset();}
    function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{el.addEventListener('input',()=>{responses[current]=el.value;renderBar();});});}
    function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}
    function go(i){saveCurrent();current=i;renderQuestion()}function prevQ(){if(current>0)go(current-1)}function nextQ(){if(current<questions.length-1)go(current+1)}function markReviewNext(){marked[current]=true;nextQ()}function clearResponse(){responses[current]=null;renderQuestion()}
    function isCorrect(q,a){if(a===null||a==='')return null;return q.type==='mcq'?Number(a)===q.answer:norm(a)===norm(q.typedAnswer);}
    function showReviewForCurrent(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';if(r===null){note.className='answer-note muted';note.textContent='Unattempted.'}else if(r){note.className='answer-note ok';note.textContent='Correct.'}else{note.className='answer-note bad';note.textContent='Wrong.'}typeset();}
    function submitTest(){if(submitted)return;saveCurrent();submitted=true;let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++});resultBox.style.display='block';resultBox.innerHTML='<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>'+(c*3-w)+'</strong></div><div class="score-box">Correct<strong>'+c+'</strong></div><div class="score-box">Wrong<strong>'+w+'</strong></div><div class="score-box">Attempted<strong>'+(c+w)+'</strong></div><div class="score-box">Unattempted<strong>'+u+'</strong></div></div>';renderQuestion();resultBox.scrollIntoView({behavior:'smooth'});typeset();}
    function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest();return}secondsLeft--}
    renderQuestion();tick();setInterval(tick,1000);
  </script>
</body></html>
