<!DOCTYPE html>
<html lang="en">
<head>

  <title>Factors &amp; Multiples Test -7</title>
  <script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'}};</script>

  <style>
    :root{--ink:#101820;--muted:#5f6f7a;--line:#b8c3cc;--brand:#0b75bb;--dark:#24313a;--mid:#4089c8;--ok:#60b947;--bad:#e55b25;--review:#7b4ab0;--bg:#eef3f7}
    *{box-sizing:border-box}html,body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;overflow:hidden}header{height:84px;background:#f3f5f7;border-bottom:1px solid #9eadb9}.topbar{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px}.title{background:var(--dark);color:#fff;padding:10px 18px;display:flex;flex-direction:column;justify-content:center}.title h1{font-size:22px;margin:0}.meta{font-size:15px;color:#dce9ef;margin-top:6px}.timer{display:grid;place-items:center;background:#fff;font-weight:700;font-size:18px}.timer span{font-size:22px}
    main{height:calc(100vh - 84px);display:grid;grid-template-columns:minmax(0,1fr) 300px;background:#fff}section{min-width:0;border-right:2px solid #41515c}.panel{padding:14px;background:#e5f6fc;display:flex;flex-direction:column}.panel h2{font-size:18px;margin:0 -14px 14px;padding:10px 14px;background:var(--mid);color:#fff}.qbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.qbtn{height:44px;border:1px solid #a9b3bc;background:linear-gradient(#fff,#dfe5ea);border-radius:3px;font-size:18px;font-weight:700;color:#45515a;cursor:pointer}.qbtn.current{background:#e85b21;color:#fff}.qbtn.answered{background:#72bd3b;color:#fff}.qbtn.marked{background:#7950a5;color:#fff;border-radius:50%}.legend{display:grid;gap:10px;margin-top:18px}.dot{display:inline-block;width:20px;height:20px;border:1px solid var(--line);vertical-align:-5px;margin-right:8px}.dot.current{background:#e85b21}.dot.answered{background:#72bd3b}.dot.marked{background:#7950a5;border-radius:50%}.side-submit{margin-top:auto;align-self:center;width:124px;height:42px;border:0;background:#29a8df;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
    .question-card{height:100%;overflow:auto;padding:0 0 74px}.qhead{min-height:52px;padding:12px 16px;border-bottom:1px solid #c6d0d8;background:#f5f7f9}.qnum{font-size:19px;font-weight:700}.qtext{font-size:20px;font-weight:700;padding:24px;min-height:125px}.options{display:grid;gap:14px;padding:0 24px 18px}.option{display:flex;gap:12px;cursor:pointer;font-size:20px;font-weight:700}.option input{margin-top:7px;transform:scale(1.25)}.typed-answer{width:min(420px,calc(100% - 48px));font-size:20px;font-weight:700;border:1px solid #8795a1;padding:12px;margin-left:24px}.navrow{position:fixed;left:0;right:300px;bottom:0;height:64px;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:10px 16px;background:#eef8fc;border-top:1px solid #b6cbd6}.navrow button{border:1px solid #b6c1ca;padding:11px 18px;font-size:16px;font-weight:700;background:#fff;cursor:pointer}.navrow .next{background:#29a8df;color:#fff}.solution{display:none;margin:16px 24px 0;padding:14px 16px;border:1px solid var(--line);background:#f8fbfd;font-size:17px}.solution h3{margin:0 0 8px;color:var(--brand)}.answer-note{margin:14px 24px 0;font-weight:800}.ok{color:#157347}.bad{color:#b02a37}.muted{color:var(--muted)}#result{display:none;padding:16px;border-bottom:1px solid var(--line)}.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.score-box{border:1px solid var(--line);padding:10px;background:#fbfcfd}.score-box strong{display:block;font-size:24px}
    mjx-container{font-size:108%!important}@media(max-width:900px){html,body{overflow:auto}header{height:auto}.topbar{grid-template-columns:1fr}.timer{padding:8px}main{height:auto;display:block}.panel{min-height:260px}.qbar{grid-template-columns:repeat(5,1fr)}.question-card{height:auto;min-height:70vh}.navrow{position:static}.score-grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <header><div class="topbar"><div class="title"><h1>Factors &amp; Multiples Test -7</h1><div class="meta">20 Questions | 40 Minutes | +3 correct, -1 wrong | MCQ and numeric entry</div></div><div class="timer">Time Left: <span id="time">40:00</span></div></div></header>
  <main><section><div id="result"></div><form id="testForm" autocomplete="off"><div id="questionHost" class="question-card"></div></form></section><aside class="panel"><h2>Question Bar</h2><div id="qbar" class="qbar"></div><div class="legend"><span><i class="dot current"></i>Current</span><span><i class="dot answered"></i>Answered</span><span><i class="dot marked"></i>Marked</span></div><button type="button" class="side-submit" onclick="submitTest()">Submit</button></aside></main>
  <script>
    const questions=[{"type":"mcq","question":"Find the number of distinct prime factors of \\(17017\\).","options":["2","4","6","8"],"answer":1,"typedAnswer":"4","solution":"\u003cp>\\(17017=7\\cdot2431=7\\cdot11\\cdot13\\cdot17\\).\u003c/p>\u003cp>Thus it has four distinct prime factors.\u003c/p>","no":1,"itemId":72601,"source":"Factors & Multiples Test 7"},{"type":"mcq","question":"How many numbers are multiples of \\(64^{112}\\) and at the same time factors of \\(64^{120}\\)?","options":["36","40","46","49"],"answer":3,"typedAnswer":"49","solution":"\u003cp>\\(64^{112}=2^{672}\\) and \\(64^{120}=2^{720}\\).\u003c/p>\u003cp>The required divisors are \\(2^k\\) for \\(672\\le k\\le720\\), giving \\(720-672+1=49\\) values.\u003c/p>","no":2,"itemId":72602,"source":"Factors & Multiples Test 7"},{"type":"mcq","question":"Find the number of positive factors of the largest two-digit triangular number.","options":["2","3","4","6"],"answer":2,"typedAnswer":"4","solution":"\u003cp>\\(T_{13}=13\\cdot14/2=91\\) and \\(T_{14}=105\\), so 91 is the largest two-digit triangular number.\u003c/p>\u003cp>\\(91=7\\cdot13\\), hence it has \\(2\\cdot2=4\\) factors.\u003c/p>","no":3,"itemId":72603,"source":"Factors & Multiples Test 7"},{"type":"text","question":"A number \\(P\\) has exactly 18 factors and exactly two distinct prime factors. Find the maximum possible number of factors of \\(P^2\\).","options":[],"answer":0,"typedAnswer":"55","solution":"\u003cp>Write \\(P=p^a q^b\\); then \\((a+1)(b+1)=18\\).\u003c/p>\u003cp>The patterns are \\((a,b)=(1,8)\\) or \\((2,5)\\). For \\(P^2\\), the counts are \\(3\\cdot17=51\\) and \\(5\\cdot11=55\\). Maximum \\(=55\\).\u003c/p>","no":4,"itemId":72604,"source":"Factors & Multiples Test 7"},{"type":"mcq","question":"A number \\(N\u003c1000\\) has only 2, 3 and 5 as prime factors. What is the greatest possible factor of \\(N\\) that is a multiple of the product of its lowest and highest prime factors?","options":["960","990","570","940"],"answer":0,"typedAnswer":"960","solution":"\u003cp>The required factor must use only 2, 3 and 5 and be divisible by \\(2\\cdot5=10\\).\u003c/p>\u003cp>Among the choices, \\(960=2^6\\cdot3\\cdot5\\) satisfies this and is the greatest; the others introduce primes 11, 19 or 47.\u003c/p>","no":5,"itemId":72605,"source":"Factors & Multiples Test 7"},{"type":"mcq","question":"Suppose \\(A=2^{16}\\cdot5^{31}\\). How many positive factors of \\(A\\) are less than \\(A\\) (and therefore also divide \\(A^2\\))?","options":["540","542","543","544"],"answer":2,"typedAnswer":"543","solution":"\u003cp>\\(d(A)=(16+1)(31+1)=17\\cdot32=544\\).\u003c/p>\u003cp>All factors except \\(A\\) itself are less than \\(A\\), so the required number is \\(544-1=543\\).\u003c/p>","no":6,"itemId":72606,"source":"Factors & Multiples Test 7"},{"type":"mcq","question":"The only prime factors of \\(N\\) are \\(a,b,c\\). If \\(a+b+c=10\\) and \\(N\\) has 8 factors, find the maximum possible value of \\(N\\).","options":["30","24","12","Inadequate data"],"answer":0,"typedAnswer":"30","solution":"\u003cp>The three distinct primes with sum 10 must be 2, 3 and 5.\u003c/p>\u003cp>Since \\(N\\) contains all three and has \\(2^3=8\\) factors, every exponent is 1. Hence \\(N=2\\cdot3\\cdot5=30\\).\u003c/p>","no":7,"itemId":72607,"source":"Factors & Multiples Test 7"},{"type":"mcq","question":"Let \\(N=2^{42}\\cdot3^{34}\\). How many factors of \\(N\\) are perfect cubes, excluding 1?","options":["120","143","170","179"],"answer":3,"typedAnswer":"179","solution":"\u003cp>The exponent of 2 can be \\(0,3,\\ldots,42\\): 15 choices. The exponent of 3 can be \\(0,3,\\ldots,33\\): 12 choices.\u003c/p>\u003cp>Thus there are \\(15\\cdot12=180\\) cube divisors including 1, or \\(179\\) excluding 1.\u003c/p>","no":8,"itemId":72608,"source":"Factors & Multiples Test 7"},{"type":"mcq","question":"Find the least number having only 2, 3 and 7 as prime factors and exactly 20 positive factors.","options":["168","252","336","None of these"],"answer":2,"typedAnswer":"336","solution":"\u003cp>All three primes must occur. Since \\(20=5\\cdot2\\cdot2\\), the exponent pattern is \\((4,1,1)\\).\u003c/p>\u003cp>To minimize the number, place the largest exponent on the smallest prime: \\(2^4\\cdot3\\cdot7=336\\).\u003c/p>","no":9,"itemId":72609,"source":"Factors & Multiples Test 7"},{"type":"mcq","question":"The product of all factors of a number equals the square of the number, and the sum of all proper factors is 21. How many values can the number have?","options":["6","4","3","2"],"answer":3,"typedAnswer":"2","solution":"\u003cp>The product condition gives exactly 4 factors, so the number is \\(p^3\\) or \\(pq\\).\u003c/p>\u003cp>For \\(p^3\\), \\(1+p+p^2=21\\) has no prime solution. For \\(pq\\), \\(1+p+q=21\\), so \\(p+q=20\\). The prime pairs are \\((3,17)\\) and \\((7,13)\\), giving 2 values.\u003c/p>","no":10,"itemId":72610,"source":"Factors & Multiples Test 7"},{"type":"text","question":"Find the number of positive divisors of \\(21600\\).","options":[],"answer":0,"typedAnswer":"72","solution":"\u003cp>\\(21600=2^5\\cdot3^3\\cdot5^2\\).\u003c/p>\u003cp>Therefore \\(d(21600)=(5+1)(3+1)(2+1)=6\\cdot4\\cdot3=72\\).\u003c/p>","no":11,"itemId":72611,"source":"Factors & Multiples Test 7"},{"type":"text","question":"How many divisors of \\(21600\\) are odd?","options":[],"answer":0,"typedAnswer":"12","solution":"\u003cp>\\(21600=2^5\\cdot3^3\\cdot5^2\\).\u003c/p>\u003cp>For an odd divisor the exponent of 2 is zero. The remaining choices give \\((3+1)(2+1)=12\\).\u003c/p>","no":12,"itemId":72612,"source":"Factors & Multiples Test 7"},{"type":"text","question":"How many divisors of \\(21600\\) are even?","options":[],"answer":0,"typedAnswer":"60","solution":"\u003cp>\\(21600\\) has 72 divisors in total and 12 odd divisors.\u003c/p>\u003cp>Hence the number of even divisors is \\(72-12=60\\).\u003c/p>","no":13,"itemId":72613,"source":"Factors & Multiples Test 7"},{"type":"text","question":"How many divisors of 360 are not divisors of 540, and how many divisors of 540 are not divisors of 360? Give the ordered pair.","options":[],"answer":0,"typedAnswer":"6,6","solution":"\u003cp>\\(d(360)=24\\) and \\(d(540)=24\\). Common divisors are divisors of \\(\\gcd(360,540)=180\\), and \\(d(180)=18\\).\u003c/p>\u003cp>Therefore each one has \\(24-18=6\\) divisors not shared by the other: \\((6,6)\\).\u003c/p>","no":14,"itemId":72614,"source":"Factors & Multiples Test 7"},{"type":"text","question":"How many divisors of \\(2^7\\cdot3^5\\cdot5^4\\) have units digit 5?","options":[],"answer":0,"typedAnswer":"24","solution":"\u003cp>A divisor ending in 5 must contain a positive power of 5 and no factor 2.\u003c/p>\u003cp>The exponent of 3 has 6 choices and the positive exponent of 5 has 4 choices. Thus \\(6\\cdot4=24\\).\u003c/p>","no":15,"itemId":72615,"source":"Factors & Multiples Test 7"},{"type":"text","question":"How many divisors of \\(36^{36}\\) are perfect cubes?","options":[],"answer":0,"typedAnswer":"625","solution":"\u003cp>\\(36^{36}=(2^2 3^2)^{36}=2^{72}3^{72}\\).\u003c/p>\u003cp>Each exponent can be \\(0,3,6,\\ldots,72\\), giving 25 choices for each prime. Total \\(25^2=625\\).\u003c/p>","no":16,"itemId":72616,"source":"Factors & Multiples Test 7"},{"type":"text","question":"Find all positive integers less than 100 that have exactly 8 positive divisors.","options":[],"answer":0,"typedAnswer":"24,30,40,42,54,56,66,70,78,88","solution":"\u003cp>Eight divisors arise from \\(p^7\\), \\(p^3q\\) or \\(pqr\\) with distinct primes. No \\(p^7\u003c100\\) exists.\u003c/p>\u003cp>Checking the remaining two forms gives \\(24,30,40,42,54,56,66,70,78,88\\).\u003c/p>","no":17,"itemId":72617,"source":"Factors & Multiples Test 7"},{"type":"text","question":"Find the smallest positive integer having exactly 15 positive divisors.","options":[],"answer":0,"typedAnswer":"144","solution":"\u003cp>The exponent patterns are \\(p^{14}\\) or \\(p^4q^2\\).\u003c/p>\u003cp>The smallest candidates are \\(2^{14}\\) and \\(2^4\\cdot3^2=144\\); hence the answer is \\(144\\).\u003c/p>","no":18,"itemId":72618,"source":"Factors & Multiples Test 7"},{"type":"text","question":"A natural number \\(N\\) has exactly 4 positive factors, and the sum of its proper factors is 31. How many values of \\(N\\) are possible?","options":[],"answer":0,"typedAnswer":"4","solution":"\u003cp>If \\(N=p^3\\), then \\(1+p+p^2=31\\), giving \\(p=5\\) and one value.\u003c/p>\u003cp>If \\(N=pq\\), then \\(1+p+q=31\\), so \\(p+q=30\\). The distinct prime pairs are \\((7,23),(11,19),(13,17)\\): three more. Total 4.\u003c/p>","no":19,"itemId":72619,"source":"Factors & Multiples Test 7"},{"type":"text","question":"How many divisors of \\(21600\\) are perfect squares?","options":[],"answer":0,"typedAnswer":"12","solution":"\u003cp>\\(21600=2^5\\cdot3^3\\cdot5^2\\).\u003c/p>\u003cp>Even exponent choices are 3 for 2 (\\(0,2,4\\)), 2 for 3 (\\(0,2\\)) and 2 for 5 (\\(0,2\\)). Thus \\(3\\cdot2\\cdot2=12\\).\u003c/p>","no":20,"itemId":72620,"source":"Factors & Multiples Test 7"}];
    let current=0,submitted=false,secondsLeft=40*60;const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false),labels=['A','B','C','D'];
    const host=document.getElementById('questionHost'),qbar=document.getElementById('qbar'),resultBox=document.getElementById('result');
    function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function norm(s){return String(s??'').trim().toLowerCase().replace(/[, ]/g,'').replace(/.0+$/,'');}
    function correctText(q){return q.type==='mcq'?'('+labels[q.answer]+') '+q.options[q.answer]:q.typedAnswer;}
    function renderBar(){qbar.innerHTML=questions.map((q,i)=>'<button type="button" class="qbtn '+(i===current?'current ':'')+(responses[i]!==null&&responses[i]!==''?'answered ':'')+(marked[i]?'marked ':'')+'" onclick="go('+i+')">'+(i+1)+'</button>').join('');}
    function control(q,i){if(q.type==='mcq')return '<div class="options">'+q.options.map((op,j)=>'<label class="option"><input type="radio" name="answer_'+i+'" value="'+j+'" '+(responses[i]===String(j)?'checked':'')+' '+(submitted?'disabled':'')+'><span>('+labels[j]+') '+op+'</span></label>').join('')+'</div>';return '<input class="typed-answer" name="answer_'+i+'" value="'+esc(responses[i]||'')+'" placeholder="Type your answer" '+(submitted?'disabled':'')+'>';}
    function typeset(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([host,resultBox]).catch(()=>{});}
    function renderQuestion(){const q=questions[current];host.innerHTML='<div class="qhead"><div class="qnum">Question '+(current+1)+' of '+questions.length+'</div></div><div class="qtext">'+q.question+'</div>'+control(q,current)+'<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Detailed Solution</h3><strong>Correct answer: '+correctText(q)+'</strong>'+q.solution+'</div><div class="navrow"><button type="button" onclick="markReviewNext()">Mark for Review &amp; Next</button><button type="button" onclick="clearResponse()" '+(submitted?'disabled':'')+'>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" class="next" onclick="nextQ()">Save &amp; Next</button></div>';bindAnswer();if(submitted)showReviewForCurrent();renderBar();typeset();}
    function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{el.addEventListener('input',()=>{responses[current]=el.value;renderBar();});});}
    function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}
    function go(i){saveCurrent();current=i;renderQuestion()}function prevQ(){if(current>0)go(current-1)}function nextQ(){if(current<questions.length-1)go(current+1)}function markReviewNext(){marked[current]=true;nextQ()}function clearResponse(){responses[current]=null;renderQuestion()}
    function isCorrect(q,a){if(a===null||a==='')return null;return q.type==='mcq'?Number(a)===q.answer:norm(a)===norm(q.typedAnswer);}
    function showReviewForCurrent(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';if(r===null){note.className='answer-note muted';note.textContent='Unattempted.'}else if(r){note.className='answer-note ok';note.textContent='Correct.'}else{note.className='answer-note bad';note.textContent='Wrong.'}typeset();}
    function submitTest(){if(submitted)return;saveCurrent();submitted=true;let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++});resultBox.style.display='block';resultBox.innerHTML='<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>'+(c*3-w)+'</strong></div><div class="score-box">Correct<strong>'+c+'</strong></div><div class="score-box">Wrong<strong>'+w+'</strong></div><div class="score-box">Attempted<strong>'+(c+w)+'</strong></div><div class="score-box">Unattempted<strong>'+u+'</strong></div></div>';renderQuestion();resultBox.scrollIntoView({behavior:'smooth'});typeset();}
    function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest();return}secondsLeft--}
    renderQuestion();tick();setInterval(tick,1000);
  </script>
</body></html>
