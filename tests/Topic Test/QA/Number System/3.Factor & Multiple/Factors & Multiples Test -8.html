<!DOCTYPE html>
<html lang="en">
<head>

  <title>Factors &amp; Multiples Test -8</title>
  <script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'}};</script>

  <style>
    :root{--ink:#101820;--muted:#5f6f7a;--line:#b8c3cc;--brand:#0b75bb;--dark:#24313a;--mid:#4089c8;--ok:#60b947;--bad:#e55b25;--review:#7b4ab0;--bg:#eef3f7}
    *{box-sizing:border-box}html,body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;overflow:hidden}header{height:84px;background:#f3f5f7;border-bottom:1px solid #9eadb9}.topbar{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px}.title{background:var(--dark);color:#fff;padding:10px 18px;display:flex;flex-direction:column;justify-content:center}.title h1{font-size:22px;margin:0}.meta{font-size:15px;color:#dce9ef;margin-top:6px}.timer{display:grid;place-items:center;background:#fff;font-weight:700;font-size:18px}.timer span{font-size:22px}
    main{height:calc(100vh - 84px);display:grid;grid-template-columns:minmax(0,1fr) 300px;background:#fff}section{min-width:0;border-right:2px solid #41515c}.panel{padding:14px;background:#e5f6fc;display:flex;flex-direction:column}.panel h2{font-size:18px;margin:0 -14px 14px;padding:10px 14px;background:var(--mid);color:#fff}.qbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.qbtn{height:44px;border:1px solid #a9b3bc;background:linear-gradient(#fff,#dfe5ea);border-radius:3px;font-size:18px;font-weight:700;color:#45515a;cursor:pointer}.qbtn.current{background:#e85b21;color:#fff}.qbtn.answered{background:#72bd3b;color:#fff}.qbtn.marked{background:#7950a5;color:#fff;border-radius:50%}.legend{display:grid;gap:10px;margin-top:18px}.dot{display:inline-block;width:20px;height:20px;border:1px solid var(--line);vertical-align:-5px;margin-right:8px}.dot.current{background:#e85b21}.dot.answered{background:#72bd3b}.dot.marked{background:#7950a5;border-radius:50%}.side-submit{margin-top:auto;align-self:center;width:124px;height:42px;border:0;background:#29a8df;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
    .question-card{height:100%;overflow:auto;padding:0 0 74px}.qhead{min-height:52px;padding:12px 16px;border-bottom:1px solid #c6d0d8;background:#f5f7f9}.qnum{font-size:19px;font-weight:700}.qtext{font-size:20px;font-weight:700;padding:24px;min-height:125px}.options{display:grid;gap:14px;padding:0 24px 18px}.option{display:flex;gap:12px;cursor:pointer;font-size:20px;font-weight:700}.option input{margin-top:7px;transform:scale(1.25)}.typed-answer{width:min(420px,calc(100% - 48px));font-size:20px;font-weight:700;border:1px solid #8795a1;padding:12px;margin-left:24px}.navrow{position:fixed;left:0;right:300px;bottom:0;height:64px;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:10px 16px;background:#eef8fc;border-top:1px solid #b6cbd6}.navrow button{border:1px solid #b6c1ca;padding:11px 18px;font-size:16px;font-weight:700;background:#fff;cursor:pointer}.navrow .next{background:#29a8df;color:#fff}.solution{display:none;margin:16px 24px 0;padding:14px 16px;border:1px solid var(--line);background:#f8fbfd;font-size:17px}.solution h3{margin:0 0 8px;color:var(--brand)}.answer-note{margin:14px 24px 0;font-weight:800}.ok{color:#157347}.bad{color:#b02a37}.muted{color:var(--muted)}#result{display:none;padding:16px;border-bottom:1px solid var(--line)}.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.score-box{border:1px solid var(--line);padding:10px;background:#fbfcfd}.score-box strong{display:block;font-size:24px}
    mjx-container{font-size:108%!important}@media(max-width:900px){html,body{overflow:auto}header{height:auto}.topbar{grid-template-columns:1fr}.timer{padding:8px}main{height:auto;display:block}.panel{min-height:260px}.qbar{grid-template-columns:repeat(5,1fr)}.question-card{height:auto;min-height:70vh}.navrow{position:static}.score-grid{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
  <header><div class="topbar"><div class="title"><h1>Factors &amp; Multiples Test -8</h1><div class="meta">20 Questions | 40 Minutes | +3 correct, -1 wrong | MCQ and numeric entry</div></div><div class="timer">Time Left: <span id="time">40:00</span></div></div></header>
  <main><section><div id="result"></div><form id="testForm" autocomplete="off"><div id="questionHost" class="question-card"></div></form></section><aside class="panel"><h2>Question Bar</h2><div id="qbar" class="qbar"></div><div class="legend"><span><i class="dot current"></i>Current</span><span><i class="dot answered"></i>Answered</span><span><i class="dot marked"></i>Marked</span></div><button type="button" class="side-submit" onclick="submitTest()">Submit</button></aside></main>
  <script>
    const questions=[{"type":"text","question":"What is the sum of all positive divisors of \\(60\\)?","options":[],"answer":0,"typedAnswer":"168","solution":"\u003cp>\\(60=2^2\\cdot3\\cdot5\\).\u003c/p>\u003cp>\\(\\sigma(60)=(1+2+4)(1+3)(1+5)=7\\cdot4\\cdot6=168\\).\u003c/p>","no":1,"itemId":72701,"source":"Factors & Multiples Test 8"},{"type":"text","question":"Find the sum of all even divisors of \\(2^5\\cdot3^5\\cdot5^4\\).","options":[],"answer":0,"typedAnswer":"17625608","solution":"\u003cp>The even-power contribution from 2 is \\(2+2^2+\\cdots+2^5=62\\).\u003c/p>\u003cp>\\(1+3+\\cdots+3^5=364\\) and \\(1+5+\\cdots+5^4=781\\). Hence the sum is \\(62\\cdot364\\cdot781=17,625,608\\).\u003c/p>","no":2,"itemId":72702,"source":"Factors & Multiples Test 8"},{"type":"text","question":"What is the product of all positive divisors of \\(60\\)?","options":[],"answer":0,"typedAnswer":"46656000000","solution":"\u003cp>\\(60=2^2\\cdot3\\cdot5\\) has \\(3\\cdot2\\cdot2=12\\) divisors.\u003c/p>\u003cp>The divisor product is \\(60^{12/2}=60^6=46,656,000,000\\).\u003c/p>","no":3,"itemId":72703,"source":"Factors & Multiples Test 8"},{"type":"text","question":"Let \\(A\\) be the set of divisors of 8100 and \\(B\\) the set of divisors of 21600. Express the product of all distinct elements of \\(A\\cup B\\) in prime-power form.","options":[],"answer":0,"typedAnswer":"2^189*3^144*5^81","solution":"\u003cp>The product over \\(A\\cup B\\) equals product(\\(A\\)) times product(\\(B\\)) divided by the product over the intersection, whose elements divide \\(\\gcd(8100,21600)=2700\\).\u003c/p>\u003cp>Adding prime exponents and subtracting the intersection gives \\(2^{189}3^{144}5^{81}\\).\u003c/p>","no":4,"itemId":72704,"source":"Factors & Multiples Test 8"},{"type":"text","question":"How many of the first 1200 natural numbers are divisible by none of 2, 3 and 5?","options":[],"answer":0,"typedAnswer":"320","solution":"\u003cp>The pattern repeats every \\(\\operatorname{lcm}(2,3,5)=30\\) numbers.\u003c/p>\u003cp>In each block, \\(\\varphi(30)=8\\) numbers are co-prime to 30. There are \\(1200/30=40\\) blocks, so the count is \\(40\\cdot8=320\\).\u003c/p>","no":5,"itemId":72705,"source":"Factors & Multiples Test 8"},{"type":"text","question":"How many of the first 1200 natural numbers are divisible by neither 2 nor 5?","options":[],"answer":0,"typedAnswer":"480","solution":"\u003cp>In every block of 10, the admissible residues are 1, 3, 7 and 9: four numbers.\u003c/p>\u003cp>There are 120 blocks, so the total is \\(120\\cdot4=480\\).\u003c/p>","no":6,"itemId":72706,"source":"Factors & Multiples Test 8"},{"type":"text","question":"How many of the first 1200 natural numbers are co-prime to 6 or co-prime to 15 (or both)?","options":[],"answer":0,"typedAnswer":"720","solution":"\u003cp>Counts are \\(1200\\cdot\\varphi(6)/6=400\\) and \\(1200\\cdot\\varphi(15)/15=640\\).\u003c/p>\u003cp>The intersection is co-prime to 30: \\(1200\\cdot8/30=320\\). By inclusion-exclusion, union \\(=400+640-320=720\\).\u003c/p>","no":7,"itemId":72707,"source":"Factors & Multiples Test 8"},{"type":"text","question":"Among the natural numbers from 1 to 1000, which number has the greatest number of positive divisors?","options":[],"answer":0,"typedAnswer":"840","solution":"\u003cp>\\(840=2^3\\cdot3\\cdot5\\cdot7\\) has \\(4\\cdot2^3=32\\) divisors.\u003c/p>\u003cp>Checking the highly composite candidates below 1000 shows no smaller-range number exceeds 32 divisors; thus 840 is the required number.\u003c/p>","no":8,"itemId":72708,"source":"Factors & Multiples Test 8"},{"type":"mcq","question":"\\(N\\) is the smallest number such that \\(N/2\\) is a perfect square and \\(N/3\\) is a perfect cube. Find the number of divisors of \\(N\\).","options":["12","16","20","24"],"answer":2,"typedAnswer":"20","solution":"\u003cp>For the power of 2, the exponent must be odd after removing one 2 and divisible by 3 for the cube condition; the least is 3. For 3, the exponent must be even and one less than a multiple of 3; the least is 4.\u003c/p>\u003cp>Thus \\(N=2^3 3^4\\) and \\(d(N)=(3+1)(4+1)=20\\).\u003c/p>","no":9,"itemId":72709,"source":"Factors & Multiples Test 8"},{"type":"mcq","question":"A number \\(N\\) satisfies \\(200\u003cN\u003c300\\) and has exactly 6 positive divisors. How many values of \\(N\\) are possible?","options":["12","13","14","15"],"answer":1,"typedAnswer":"13","solution":"\u003cp>Six divisors means \\(N=p^5\\) or \\(N=p^2q\\) for distinct primes.\u003c/p>\u003cp>The valid numbers are \\(207,212,236,242,243,244,245,261,268,275,279,284,292\\), a total of 13.\u003c/p>","no":10,"itemId":72710,"source":"Factors & Multiples Test 8"},{"type":"mcq","question":"How many natural numbers from 1 to 900 are not multiples of any of 2, 3 or 5?","options":["240","250","270","300"],"answer":0,"typedAnswer":"240","solution":"\u003cp>The pattern repeats every 30 numbers, and \\(\\varphi(30)=8\\) residues in each block are divisible by none of 2, 3 and 5.\u003c/p>\u003cp>There are \\(900/30=30\\) blocks, giving \\(30\\cdot8=240\\).\u003c/p>","no":11,"itemId":72711,"source":"Factors & Multiples Test 8"},{"type":"mcq","question":"All divisors of \\(72\\) are multiplied. The product is \\(2^a3^b\\). Find \\(a+b\\).","options":["28","30","34","40"],"answer":1,"typedAnswer":"30","solution":"\u003cp>\\(72=2^3 3^2\\) has \\(4\\cdot3=12\\) divisors, so their product is \\(72^6\\).\u003c/p>\u003cp>\\(72^6=(2^3 3^2)^6=2^{18}3^{12}\\); hence \\(a+b=18+12=30\\).\u003c/p>","no":12,"itemId":72712,"source":"Factors & Multiples Test 8"},{"type":"mcq","question":"How many natural numbers less than 65 have an odd number of divisors?","options":["8","12","15","21"],"answer":0,"typedAnswer":"8","solution":"\u003cp>Exactly the perfect squares have an odd number of divisors.\u003c/p>\u003cp>The squares below 65 are \\(1^2,2^2,\\ldots,8^2\\), so there are 8.\u003c/p>","no":13,"itemId":72713,"source":"Factors & Multiples Test 8"},{"type":"mcq","question":"The sum of all divisors of 360 is 1170. What is the sum of the reciprocals of all divisors of 360?","options":["3.25","2.75","2.5","1.75"],"answer":0,"typedAnswer":"3.25","solution":"\u003cp>For any \\(N\\), the reciprocal divisor sum equals \\(\\sigma(N)/N\\).\u003c/p>\u003cp>Thus the required value is \\(1170/360=3.25\\).\u003c/p>","no":14,"itemId":72714,"source":"Factors & Multiples Test 8"},{"type":"mcq","question":"How many natural numbers from 1 to 100 have exactly four positive factors?","options":["30","32","300","33"],"answer":1,"typedAnswer":"32","solution":"\u003cp>Exactly four factors occur for \\(p^3\\) or \\(pq\\) with distinct primes.\u003c/p>\u003cp>Enumerating these forms up to 100 gives 32 numbers.\u003c/p>","no":15,"itemId":72715,"source":"Factors & Multiples Test 8"},{"type":"mcq","question":"Let \\(N=2^{15}3^{12}\\). How many factors of \\(N^2\\) are less than \\(N\\) but do not divide \\(N\\)?","options":["387","180","208","310"],"answer":1,"typedAnswer":"180","solution":"\u003cp>\\(N^2=2^{30}3^{24}\\) has \\(31\\cdot25=775\\) factors, so \\((775-1)/2=387\\) are below \\(N\\).\u003c/p>\u003cp>\\(N\\) has \\(16\\cdot13=208\\) factors, of which 207 are below \\(N\\). Difference \\(=387-207=180\\).\u003c/p>","no":16,"itemId":72716,"source":"Factors & Multiples Test 8"},{"type":"mcq","question":"A number \\(N\\) is divisible by 10, 90, 98 and 882; it is not divisible by 50, 270, 686 or 1764; and \\(N\\) divides 9261000. Find \\(N\\).","options":["4410","22050","13230","8820"],"answer":0,"typedAnswer":"4410","solution":"\u003cp>The LCM of 10, 90, 98 and 882 is \\(2\\cdot3^2\\cdot5\\cdot7^2=4410\\).\u003c/p>\u003cp>Multiplying by 5, 3, 7 or 2 would make the number divisible by one of the forbidden values. Thus the required divisor is \\(4410\\).\u003c/p>","no":17,"itemId":72717,"source":"Factors & Multiples Test 8"},{"type":"mcq","question":"A number has exactly 32 factors, of which exactly four are not composite. The product of the non-composite factors is 30. How many such numbers are possible?","options":["0","3","4","6"],"answer":1,"typedAnswer":"3","solution":"\u003cp>The non-composite factors are 1 and the distinct prime divisors. Product 30 therefore gives the primes 2, 3 and 5.\u003c/p>\u003cp>With three positive exponents and divisor count 32, \\(32=8\\cdot2\\cdot2\\), so the exponent pattern is \\((7,1,1)\\). The exponent 7 can be assigned to any of the three primes: 3 numbers.\u003c/p>","no":18,"itemId":72718,"source":"Factors & Multiples Test 8"},{"type":"mcq","question":"Find the total number of prime factors, counted with multiplicity, in \\(2^{17}6^{31}7^5 10^{11}11^{10}323^{23}\\).","options":["162","161","346","97"],"answer":0,"typedAnswer":"162","solution":"\u003cp>\\(6^{31}=2^{31}3^{31}\\), \\(10^{11}=2^{11}5^{11}\\), and \\(323^{23}=17^{23}19^{23}\\).\u003c/p>\u003cp>Total multiplicity \\(=(17+31+11)+31+5+11+10+23+23=162\\).\u003c/p>","no":19,"itemId":72719,"source":"Factors & Multiples Test 8"},{"type":"mcq","question":"Find the least number by which \\(22932\\) must be multiplied or divided to make a perfect square.","options":["10","4","11","13"],"answer":3,"typedAnswer":"13","solution":"\u003cp>\\(22932=2^2\\cdot3^2\\cdot7^2\\cdot13\\).\u003c/p>\u003cp>Only the exponent of 13 is odd. Multiplying or dividing by 13 makes every prime exponent even, so the least required number is \\(13\\).\u003c/p>","no":20,"itemId":72720,"source":"Factors & Multiples Test 8"}];
    let current=0,submitted=false,secondsLeft=40*60;const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false),labels=['A','B','C','D'];
    const host=document.getElementById('questionHost'),qbar=document.getElementById('qbar'),resultBox=document.getElementById('result');
    function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function norm(s){return String(s??'').trim().toLowerCase().replace(/[, ]/g,'').replace(/.0+$/,'');}
    function correctText(q){return q.type==='mcq'?'('+labels[q.answer]+') '+q.options[q.answer]:q.typedAnswer;}
    function renderBar(){qbar.innerHTML=questions.map((q,i)=>'<button type="button" class="qbtn '+(i===current?'current ':'')+(responses[i]!==null&&responses[i]!==''?'answered ':'')+(marked[i]?'marked ':'')+'" onclick="go('+i+')">'+(i+1)+'</button>').join('');}
    function control(q,i){if(q.type==='mcq')return '<div class="options">'+q.options.map((op,j)=>'<label class="option"><input type="radio" name="answer_'+i+'" value="'+j+'" '+(responses[i]===String(j)?'checked':'')+' '+(submitted?'disabled':'')+'><span>('+labels[j]+') '+op+'</span></label>').join('')+'</div>';return '<input class="typed-answer" name="answer_'+i+'" value="'+esc(responses[i]||'')+'" placeholder="Type your answer" '+(submitted?'disabled':'')+'>';}
    function typeset(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([host,resultBox]).catch(()=>{});}
    function renderQuestion(){const q=questions[current];host.innerHTML='<div class="qhead"><div class="qnum">Question '+(current+1)+' of '+questions.length+'</div></div><div class="qtext">'+q.question+'</div>'+control(q,current)+'<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Detailed Solution</h3><strong>Correct answer: '+correctText(q)+'</strong>'+q.solution+'</div><div class="navrow"><button type="button" onclick="markReviewNext()">Mark for Review &amp; Next</button><button type="button" onclick="clearResponse()" '+(submitted?'disabled':'')+'>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" class="next" onclick="nextQ()">Save &amp; Next</button></div>';bindAnswer();if(submitted)showReviewForCurrent();renderBar();typeset();}
    function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{el.addEventListener('input',()=>{responses[current]=el.value;renderBar();});});}
    function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}
    function go(i){saveCurrent();current=i;renderQuestion()}function prevQ(){if(current>0)go(current-1)}function nextQ(){if(current<questions.length-1)go(current+1)}function markReviewNext(){marked[current]=true;nextQ()}function clearResponse(){responses[current]=null;renderQuestion()}
    function isCorrect(q,a){if(a===null||a==='')return null;return q.type==='mcq'?Number(a)===q.answer:norm(a)===norm(q.typedAnswer);}
    function showReviewForCurrent(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';if(r===null){note.className='answer-note muted';note.textContent='Unattempted.'}else if(r){note.className='answer-note ok';note.textContent='Correct.'}else{note.className='answer-note bad';note.textContent='Wrong.'}typeset();}
    function submitTest(){if(submitted)return;saveCurrent();submitted=true;let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++});resultBox.style.display='block';resultBox.innerHTML='<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>'+(c*3-w)+'</strong></div><div class="score-box">Correct<strong>'+c+'</strong></div><div class="score-box">Wrong<strong>'+w+'</strong></div><div class="score-box">Attempted<strong>'+(c+w)+'</strong></div><div class="score-box">Unattempted<strong>'+u+'</strong></div></div>';renderQuestion();resultBox.scrollIntoView({behavior:'smooth'});typeset();}
    function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest();return}secondsLeft--}
    renderQuestion();tick();setInterval(tick,1000);
  </script>
</body></html>
