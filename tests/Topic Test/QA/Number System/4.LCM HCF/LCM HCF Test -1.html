<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LCM HCF Test -1</title><script>window.MathJax={tex:{inlineMath:[["\\(","\\)"]],displayMath:[["\\[","\\]"]]},svg:{fontCache:"global"}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script><style>:root{--ink:#101820;--muted:#5f6f7a;--line:#b8c3cc;--brand:#0b75bb;--dark:#24313a;--mid:#4089c8;--ok:#60b947;--bad:#e55b25;--review:#7b4ab0;--bg:#eef3f7}*{box-sizing:border-box}html,body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;overflow:hidden}header{height:84px;background:#f3f5f7;border-bottom:1px solid #9eadb9}.topbar{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px}.title{background:var(--dark);color:#fff;padding:10px 18px;display:flex;flex-direction:column;justify-content:center}.title h1{font-size:22px;margin:0}.meta{font-size:15px;color:#dce9ef;margin-top:6px}.timer{display:grid;place-items:center;background:#fff;font-weight:700;font-size:18px}.timer span{font-size:22px}main{height:calc(100vh - 84px);display:grid;grid-template-columns:minmax(0,1fr) 300px;background:#fff}section{min-width:0;border-right:2px solid #41515c}.panel{padding:14px;background:#e5f6fc;display:flex;flex-direction:column}.panel h2{font-size:18px;margin:0 -14px 14px;padding:10px 14px;background:var(--mid);color:#fff}.qbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.qbtn{height:44px;border:1px solid #a9b3bc;background:linear-gradient(#fff,#dfe5ea);border-radius:3px;font-size:18px;font-weight:700;color:#45515a;cursor:pointer}.qbtn.current{background:#e85b21;color:#fff}.qbtn.answered{background:#72bd3b;color:#fff}.qbtn.marked{background:#7950a5;color:#fff;border-radius:50%}.legend{display:grid;gap:10px;margin-top:18px}.dot{display:inline-block;width:20px;height:20px;border:1px solid var(--line);vertical-align:-5px;margin-right:8px}.dot.current{background:#e85b21}.dot.answered{background:#72bd3b}.dot.marked{background:#7950a5;border-radius:50%}.side-submit{margin-top:auto;align-self:center;width:124px;height:42px;border:0;background:#29a8df;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.question-card{height:100%;overflow:auto;padding:0 0 74px}.qhead{min-height:52px;padding:12px 16px;border-bottom:1px solid #c6d0d8;background:#f5f7f9}.qnum{font-size:19px;font-weight:700}.qtext{font-size:20px;font-weight:700;padding:24px;min-height:125px}.options{display:grid;gap:14px;padding:0 24px 18px}.option{display:flex;gap:12px;cursor:pointer;font-size:20px;font-weight:700}.option input{margin-top:7px;transform:scale(1.25)}.typed-answer{width:min(420px,calc(100% - 48px));font-size:20px;font-weight:700;border:1px solid #8795a1;padding:12px;margin-left:24px}.navrow{position:fixed;left:0;right:300px;bottom:0;height:64px;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:10px 16px;background:#eef8fc;border-top:1px solid #b6cbd6}.navrow button{border:1px solid #b6c1ca;padding:11px 18px;font-size:16px;font-weight:700;background:#fff;cursor:pointer}.navrow .next{background:#29a8df;color:#fff}.solution{display:none;margin:16px 24px 0;padding:14px 16px;border:1px solid var(--line);background:#f8fbfd;font-size:17px}.solution h3{margin:0 0 8px;color:var(--brand)}.answer-note{margin:14px 24px 0;font-weight:800}.ok{color:#157347}.bad{color:#b02a37}.muted{color:var(--muted)}#result{display:none;padding:16px;border-bottom:1px solid var(--line)}.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.score-box{border:1px solid var(--line);padding:10px;background:#fbfcfd}.score-box strong{display:block;font-size:24px}mjx-container{font-size:108%!important}@media(max-width:900px){html,body{overflow:auto}header{height:auto}.topbar{grid-template-columns:1fr}.timer{padding:8px}main{height:auto;display:block}.panel{min-height:260px}.qbar{grid-template-columns:repeat(5,1fr)}.question-card{height:auto;min-height:70vh}.navrow{position:static}.score-grid{grid-template-columns:1fr 1fr}}</style></head><body><header><div class="topbar"><div class="title"><h1>LCM HCF Test -1</h1><div class="meta">20 Questions | 40 Minutes | +3 correct, -1 wrong | MCQ and numeric entry</div></div><div class="timer">Time Left: <span id="time">40:00</span></div></div></header><main><section><div id="result"></div><form id="testForm" autocomplete="off"><div id="questionHost" class="question-card"></div></form></section><aside class="panel"><h2>Question Bar</h2><div id="qbar" class="qbar"></div><div class="legend"><span><i class="dot current"></i>Current</span><span><i class="dot answered"></i>Answered</span><span><i class="dot marked"></i>Marked</span></div><button type="button" class="side-submit" onclick="submitTest()">Submit</button></aside></main><script>const questions=[{"type":"tita","question":"Find the LCM of \\(480,360,320\\).","typedAnswer":"2880","solution":"<p>The highest prime powers are \\(2^6,3^2,5\\). Hence the LCM is \\(2^6\\cdot3^2\\cdot5=2880\\).</p>","no":1,"itemId":74101,"source":"LCM HCF Test 1"},{"type":"tita","question":"Find the HCF of \\(63,84,147\\).","typedAnswer":"21","solution":"<p>The common prime part is \\(3\\cdot7=21\\).</p>","no":2,"itemId":74102,"source":"LCM HCF Test 1"},{"type":"tita","question":"Find \\(\\operatorname{LCM}\\left(\\frac56,\\frac9{10},\\frac89\\right)\\).","typedAnswer":"360","solution":"<p>For fractions, LCM = LCM of numerators divided by HCF of denominators. Thus \\(\\frac{\\operatorname{LCM}(5,9,8)}{\\operatorname{HCF}(6,10,9)}=\\frac{360}{1}=360\\).</p>","no":3,"itemId":74103,"source":"LCM HCF Test 1"},{"type":"mcq","question":"Find \\(\\operatorname{HCF}\\left(\\frac7{12},\\frac{21}5,\\frac{14}{18}\\right)\\).","options":["\\(\\frac7{360}\\)","\\(\\frac7{180}\\)","\\(\\frac7{1080}\\)","\\(\\frac7{2160}\\)"],"answer":1,"typedAnswer":"\\(\\frac7{180}\\)","solution":"<p>HCF of fractions = HCF of numerators divided by LCM of denominators: \\(7/180\\).</p>","no":4,"itemId":74104,"source":"LCM HCF Test 1"},{"type":"mcq","question":"Is \\(\\operatorname{HCF}(\\operatorname{HCF}(p,q),\\operatorname{HCF}(r,s))=\\operatorname{HCF}(\\operatorname{HCF}(p,r),\\operatorname{HCF}(q,s))\\)?","options":["Yes","No","Can't say"],"answer":0,"typedAnswer":"Yes","solution":"<p>Both sides equal \\(\\operatorname{HCF}(p,q,r,s)\\), because HCF is associative and commutative.</p>","no":5,"itemId":74105,"source":"LCM HCF Test 1"},{"type":"mcq","question":"Is \\(\\operatorname{LCM}(\\operatorname{LCM}(p,q),\\operatorname{LCM}(r,s))=\\operatorname{LCM}(\\operatorname{LCM}(p,r),\\operatorname{LCM}(q,s))\\)?","options":["Yes","No","Can't say"],"answer":0,"typedAnswer":"Yes","solution":"<p>Both sides equal \\(\\operatorname{LCM}(p,q,r,s)\\), because LCM is associative and commutative.</p>","no":6,"itemId":74106,"source":"LCM HCF Test 1"},{"type":"tita","question":"A number when divided by 54 leaves remainder 31. Find the remainder when it is divided by 27.","typedAnswer":"4","solution":"<p>Write the number as \\(54k+31=27(2k+1)+4\\). The remainder is 4.</p>","no":7,"itemId":74107,"source":"LCM HCF Test 1"},{"type":"mcq","question":"Find the least natural number which, when divided by 7 or 8, leaves a remainder of 3 in either case.","options":["3","59","31","25"],"answer":0,"typedAnswer":"3","solution":"<p>The number 3 itself leaves remainder 3 on division by both 7 and 8, so it is the least natural number.</p>","no":8,"itemId":74108,"source":"LCM HCF Test 1"},{"type":"tita","question":"Find the least natural number which when divided by 24 and 18 leaves remainders 18 and 12 respectively.","typedAnswer":"66","solution":"<p>In both cases, adding 6 makes the number divisible. Hence \\(N+6=\\operatorname{LCM}(24,18)=72\\), so \\(N=66\\).</p>","no":9,"itemId":74109,"source":"LCM HCF Test 1"},{"type":"tita","question":"Find the least natural number which when divided by 5 and 6 leaves remainders 3 and 5 respectively.","typedAnswer":"23","solution":"<p>Checking the residues modulo \\(\\operatorname{LCM}(5,6)=30\\), \\(23\\equiv3\\pmod5\\) and \\(23\\equiv5\\pmod6\\).</p>","no":10,"itemId":74110,"source":"LCM HCF Test 1"},{"type":"mcq","question":"Find the area of the smallest square that can be formed with rectangles of dimensions \\(7\\text{ cm}\\times5\\text{ cm}\\), in square centimetres.","options":["1225","4900","11025","None of these"],"answer":0,"typedAnswer":"1225","solution":"<p>The least square side compatible with both dimensions is \\(\\operatorname{LCM}(7,5)=35\\) cm. Its area is \\(35^2=1225\\).</p>","no":11,"itemId":74111,"source":"LCM HCF Test 1"},{"type":"tita","question":"Find the largest number which divides 107 and 78 leaving remainders 17 and 18 respectively.","typedAnswer":"30","solution":"<p>The divisor must divide \\(107-17=90\\) and \\(78-18=60\\). Their HCF is 30.</p>","no":12,"itemId":74112,"source":"LCM HCF Test 1"},{"type":"mcq","question":"Find the largest number which divides 34, 58 and 94 leaving the same remainder in each case.","options":["6","9","12","8"],"answer":2,"typedAnswer":"12","solution":"<p>It must divide all pairwise differences: 24, 36 and 60. Their HCF is 12.</p>","no":13,"itemId":74113,"source":"LCM HCF Test 1"},{"type":"tita","question":"Find the least natural number which when divided by 5, 6 and 7 leaves respective remainders 3, 4 and 5.","typedAnswer":"208","solution":"<p>Each remainder is 2 less than the divisor, so \\(N+2\\) is divisible by 5, 6 and 7. Thus \\(N=210-2=208\\).</p>","no":14,"itemId":74114,"source":"LCM HCF Test 1"},{"type":"tita","question":"Find the number of three-digit natural numbers divisible by 8, 12 and 15.","typedAnswer":"8","solution":"<p>Their LCM is 120. The three-digit multiples are \\(120,240,\\ldots,960\\), giving 8 numbers.</p>","no":15,"itemId":74115,"source":"LCM HCF Test 1"},{"type":"mcq","question":"The product of a seven-digit, a ten-digit and a twelve-digit number can be a ______ digit number.","options":["27","28","28 or 29","27 or 28 or 29"],"answer":3,"typedAnswer":"27 or 28 or 29","solution":"<p>The product is at least \\(10^6\\cdot10^9\\cdot10^{11}=10^{26}\\) and less than \\(10^{29}\\), so it may have 27, 28 or 29 digits.</p>","no":16,"itemId":74116,"source":"LCM HCF Test 1"},{"type":"tita","question":"The number of digits in the square root of a thirteen-digit number is ______.","typedAnswer":"7","solution":"<p>A thirteen-digit number lies from \\(10^{12}\\) to below \\(10^{13}\\). Its square root lies from \\(10^6\\) to below \\(10^{6.5}\\), so it has 7 digits.</p>","no":17,"itemId":74117,"source":"LCM HCF Test 1"},{"type":"mcq","question":"The number of digits in \\((2PQR)^4\\), where \\(2PQR\\) is a four-digit number, is ______.","options":["13","14","15","Can't say"],"answer":1,"typedAnswer":"14","solution":"<p>Here \\(2000\\le 2PQR\\le2999\\). Both \\(2000^4\\) and \\(2999^4\\) are 14-digit numbers, so every possible fourth power has 14 digits.</p>","no":18,"itemId":74118,"source":"LCM HCF Test 1"},{"type":"mcq","question":"The number of digits in the cube root of a 29-digit number is ______.","options":["10","9","8","Cannot say"],"answer":0,"typedAnswer":"10","solution":"<p>A 29-digit number lies from \\(10^{28}\\) to below \\(10^{29}\\); its cube root lies between about \\(2.15\\times10^9\\) and \\(4.65\\times10^9\\), hence has 10 digits.</p>","no":19,"itemId":74119,"source":"LCM HCF Test 1"},{"type":"mcq","question":"From a city, buses start for four places every 15, 20, 25 and 30 minutes from 8:00 a.m. When will they first start together again?","options":["10:00 a.m.","12:00 noon","1:00 p.m.","2:00 p.m."],"answer":2,"typedAnswer":"1:00 p.m.","solution":"<p>The LCM of 15, 20, 25 and 30 is 300 minutes, or 5 hours. Five hours after 8:00 a.m. is 1:00 p.m.</p>","no":20,"itemId":74120,"source":"LCM HCF Test 1"}];let current=0,submitted=false,secondsLeft=40*60;const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false),labels=['A','B','C','D'];const host=document.getElementById('questionHost'),qbar=document.getElementById('qbar'),resultBox=document.getElementById('result');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function norm(s){return String(s??'').trim().toLowerCase().replace(/[, ]/g,'').replace(/\.0+$/,'');}function correctText(q){return q.type==='mcq'?'('+labels[q.answer]+') '+q.options[q.answer]:q.typedAnswer;}function renderBar(){qbar.innerHTML=questions.map((q,i)=>'<button type="button" class="qbtn '+(i===current?'current ':'')+(responses[i]!==null&&responses[i]!==''?'answered ':'')+(marked[i]?'marked ':'')+'" onclick="go('+i+')">'+(i+1)+'</button>').join('');}function control(q,i){if(q.type==='mcq')return '<div class="options">'+q.options.map((op,j)=>'<label class="option"><input type="radio" name="answer_'+i+'" value="'+j+'" '+(responses[i]===String(j)?'checked':'')+' '+(submitted?'disabled':'')+'><span>('+labels[j]+') '+op+'</span></label>').join('')+'</div>';return '<input class="typed-answer" name="answer_'+i+'" value="'+esc(responses[i]||'')+'" placeholder="Type your answer" '+(submitted?'disabled':'')+'>';}function typeset(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([host,resultBox]).catch(()=>{});}function renderQuestion(){const q=questions[current];host.innerHTML='<div class="qhead"><div class="qnum">Question '+(current+1)+' of '+questions.length+'</div></div><div class="qtext">'+q.question+'</div>'+control(q,current)+'<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Detailed Solution</h3><strong>Correct answer: '+correctText(q)+'</strong>'+q.solution+'</div><div class="navrow"><button type="button" onclick="markReviewNext()">Mark for Review &amp; Next</button><button type="button" onclick="clearResponse()" '+(submitted?'disabled':'')+'>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" class="next" onclick="nextQ()">Save &amp; Next</button></div>';bindAnswer();if(submitted)showReviewForCurrent();renderBar();typeset();}function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{el.addEventListener('input',()=>{responses[current]=el.value;renderBar();});});}function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}function go(i){saveCurrent();current=i;renderQuestion()}function prevQ(){if(current>0)go(current-1)}function nextQ(){if(current<questions.length-1)go(current+1)}function markReviewNext(){marked[current]=true;nextQ()}function clearResponse(){responses[current]=null;renderQuestion()}function isCorrect(q,a){if(a===null||a==='')return null;return q.type==='mcq'?Number(a)===q.answer:norm(a)===norm(q.typedAnswer);}function showReviewForCurrent(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';if(r===null){note.className='answer-note muted';note.textContent='Unattempted.'}else if(r){note.className='answer-note ok';note.textContent='Correct.'}else{note.className='answer-note bad';note.textContent='Wrong.'}typeset();}function submitTest(){if(submitted)return;saveCurrent();submitted=true;let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++});resultBox.style.display='block';resultBox.innerHTML='<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>'+(c*3-w)+'</strong></div><div class="score-box">Correct<strong>'+c+'</strong></div><div class="score-box">Wrong<strong>'+w+'</strong></div><div class="score-box">Attempted<strong>'+(c+w)+'</strong></div><div class="score-box">Unattempted<strong>'+u+'</strong></div></div>';renderQuestion();resultBox.scrollIntoView({behavior:'smooth'});typeset();}function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest();return}secondsLeft--}renderQuestion();tick();setInterval(tick,1000);</script></body></html>
