<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LCM HCF Test -2</title><script>window.MathJax={tex:{inlineMath:[["\\(","\\)"]],displayMath:[["\\[","\\]"]]},svg:{fontCache:"global"}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script><style>:root{--ink:#101820;--muted:#5f6f7a;--line:#b8c3cc;--brand:#0b75bb;--dark:#24313a;--mid:#4089c8;--ok:#60b947;--bad:#e55b25;--review:#7b4ab0;--bg:#eef3f7}*{box-sizing:border-box}html,body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;overflow:hidden}header{height:84px;background:#f3f5f7;border-bottom:1px solid #9eadb9}.topbar{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px}.title{background:var(--dark);color:#fff;padding:10px 18px;display:flex;flex-direction:column;justify-content:center}.title h1{font-size:22px;margin:0}.meta{font-size:15px;color:#dce9ef;margin-top:6px}.timer{display:grid;place-items:center;background:#fff;font-weight:700;font-size:18px}.timer span{font-size:22px}main{height:calc(100vh - 84px);display:grid;grid-template-columns:minmax(0,1fr) 300px;background:#fff}section{min-width:0;border-right:2px solid #41515c}.panel{padding:14px;background:#e5f6fc;display:flex;flex-direction:column}.panel h2{font-size:18px;margin:0 -14px 14px;padding:10px 14px;background:var(--mid);color:#fff}.qbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.qbtn{height:44px;border:1px solid #a9b3bc;background:linear-gradient(#fff,#dfe5ea);border-radius:3px;font-size:18px;font-weight:700;color:#45515a;cursor:pointer}.qbtn.current{background:#e85b21;color:#fff}.qbtn.answered{background:#72bd3b;color:#fff}.qbtn.marked{background:#7950a5;color:#fff;border-radius:50%}.legend{display:grid;gap:10px;margin-top:18px}.dot{display:inline-block;width:20px;height:20px;border:1px solid var(--line);vertical-align:-5px;margin-right:8px}.dot.current{background:#e85b21}.dot.answered{background:#72bd3b}.dot.marked{background:#7950a5;border-radius:50%}.side-submit{margin-top:auto;align-self:center;width:124px;height:42px;border:0;background:#29a8df;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.question-card{height:100%;overflow:auto;padding:0 0 74px}.qhead{min-height:52px;padding:12px 16px;border-bottom:1px solid #c6d0d8;background:#f5f7f9}.qnum{font-size:19px;font-weight:700}.qtext{font-size:20px;font-weight:700;padding:24px;min-height:125px}.options{display:grid;gap:14px;padding:0 24px 18px}.option{display:flex;gap:12px;cursor:pointer;font-size:20px;font-weight:700}.option input{margin-top:7px;transform:scale(1.25)}.typed-answer{width:min(420px,calc(100% - 48px));font-size:20px;font-weight:700;border:1px solid #8795a1;padding:12px;margin-left:24px}.navrow{position:fixed;left:0;right:300px;bottom:0;height:64px;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:10px 16px;background:#eef8fc;border-top:1px solid #b6cbd6}.navrow button{border:1px solid #b6c1ca;padding:11px 18px;font-size:16px;font-weight:700;background:#fff;cursor:pointer}.navrow .next{background:#29a8df;color:#fff}.solution{display:none;margin:16px 24px 0;padding:14px 16px;border:1px solid var(--line);background:#f8fbfd;font-size:17px}.solution h3{margin:0 0 8px;color:var(--brand)}.answer-note{margin:14px 24px 0;font-weight:800}.ok{color:#157347}.bad{color:#b02a37}.muted{color:var(--muted)}#result{display:none;padding:16px;border-bottom:1px solid var(--line)}.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.score-box{border:1px solid var(--line);padding:10px;background:#fbfcfd}.score-box strong{display:block;font-size:24px}mjx-container{font-size:108%!important}@media(max-width:900px){html,body{overflow:auto}header{height:auto}.topbar{grid-template-columns:1fr}.timer{padding:8px}main{height:auto;display:block}.panel{min-height:260px}.qbar{grid-template-columns:repeat(5,1fr)}.question-card{height:auto;min-height:70vh}.navrow{position:static}.score-grid{grid-template-columns:1fr 1fr}}</style></head><body><header><div class="topbar"><div class="title"><h1>LCM HCF Test -2</h1><div class="meta">20 Questions | 40 Minutes | +3 correct, -1 wrong | MCQ and numeric entry</div></div><div class="timer">Time Left: <span id="time">40:00</span></div></div></header><main><section><div id="result"></div><form id="testForm" autocomplete="off"><div id="questionHost" class="question-card"></div></form></section><aside class="panel"><h2>Question Bar</h2><div id="qbar" class="qbar"></div><div class="legend"><span><i class="dot current"></i>Current</span><span><i class="dot answered"></i>Answered</span><span><i class="dot marked"></i>Marked</span></div><button type="button" class="side-submit" onclick="submitTest()">Submit</button></aside></main><script>const questions=[{"type":"tita","question":"I have fewer than 200 sweets. Dividing them equally among 10, 16 or 20 children leaves 1 sweet each time, while division among 23 children leaves none. How many sweets are there?","typedAnswer":"161","solution":"<p>The number is \\(1\\pmod{80}\\), since \\(\\operatorname{LCM}(10,16,20)=80\\). Among 1, 81 and 161, only \\(161=7\\cdot23\\) is divisible by 23.</p>","no":1,"itemId":74201,"source":"LCM HCF Test 2"},{"type":"mcq","question":"What is the smallest five-digit number which when divided by 7, 11 and 21 leaves a remainder of 5 in each case?","options":["10164","10169","10118","10123"],"answer":1,"typedAnswer":"10169","solution":"<p>The LCM is 231. The first five-digit number of the form \\(231k+5\\) is \\(231\\cdot44+5=10169\\).</p>","no":2,"itemId":74202,"source":"LCM HCF Test 2"},{"type":"tita","question":"Find the smallest number which when divided by 3, 5, 7 and 9 leaves respective remainders 2, 4, 6 and 8.","typedAnswer":"314","solution":"<p>Every remainder is 1 less than its divisor. Thus \\(N+1=\\operatorname{LCM}(3,5,7,9)=315\\), giving \\(N=314\\).</p>","no":3,"itemId":74203,"source":"LCM HCF Test 2"},{"type":"mcq","question":"Find the largest five-digit number which leaves remainder 3 on division by 8 and remainder 1 on division by 7.","options":["99948","99953","99960","99947"],"answer":3,"typedAnswer":"99947","solution":"<p>Direct substitution shows \\(99947\\equiv3\\pmod8\\) and \\(99947\\equiv1\\pmod7\\); it is the largest listed five-digit solution.</p>","no":4,"itemId":74204,"source":"LCM HCF Test 2"},{"type":"tita","question":"Find the greatest number which divides 565, 847 and 1551 leaving remainders 5, 7 and 11 respectively.","typedAnswer":"140","solution":"<p>Take the HCF of \\(560,840,1540\\), which is 140.</p>","no":5,"itemId":74205,"source":"LCM HCF Test 2"},{"type":"mcq","question":"Three words on a signboard remain on for 3 seconds and are then off for \\(7\\frac56\\), \\(1\\frac13\\) and \\(5\\frac23\\) seconds respectively, repeating this cycle. After how many seconds will the entire board switch on together for the second time?","options":["\\(40\\frac13\\)","\\(41\\frac23\\)","\\(42\\frac23\\)","\\(43\\frac13\\)"],"answer":3,"typedAnswer":"\\(43\\frac13\\)","solution":"<p>The cycle lengths are \\(65/6,26/6,52/6\\) seconds. Their LCM is \\(260/6=43\\frac13\\) seconds.</p>","no":6,"itemId":74206,"source":"LCM HCF Test 2"},{"type":"tita","question":"The HCF and LCM of two numbers are 11 and 1001. If their sum is 220, find the smaller number.","typedAnswer":"77","solution":"<p>Write the numbers as \\(11a,11b\\) with \\(ab=91\\), \\(a+b=20\\) and \\(\\gcd(a,b)=1\\). Thus \\(a,b=7,13\\), so the smaller number is 77.</p>","no":7,"itemId":74207,"source":"LCM HCF Test 2"},{"type":"mcq","question":"In finding the HCF of two numbers by division, the last divisor is 8 and the quotients are 1, 1, 14 and 2 in that order. Find the two numbers.","options":["256, 496","248, 480","280, 344","320, 464"],"answer":1,"typedAnswer":"248, 480","solution":"<p>Reverse Euclid's steps: \\(16=2\\cdot8\\), \\(232=14\\cdot16+8\\), \\(248=1\\cdot232+16\\), and \\(480=1\\cdot248+232\\).</p>","no":8,"itemId":74208,"source":"LCM HCF Test 2"},{"type":"mcq","question":"What is the HCF of all numbers of the form \\(n(n^2+20)\\), where \\(n\\) is any even natural number?","options":["24","12","8","48"],"answer":3,"typedAnswer":"48","solution":"<p>For even \\(n\\), the expression is always divisible by 48. Values at \\(n=2\\) and \\(n=4\\) are 48 and 144, whose HCF is 48, so no larger universal factor is possible.</p>","no":9,"itemId":74209,"source":"LCM HCF Test 2"},{"type":"tita","question":"A number when divided successively by 6 and 7 leaves remainders 4 and 5 respectively. Find its remainder when divided by 21.","typedAnswer":"13","solution":"<p>Successive division gives \\(N=6(7k+5)+4=42k+34\\). Hence the remainder modulo 21 is 13.</p>","no":10,"itemId":74210,"source":"LCM HCF Test 2"},{"type":"mcq","question":"Find the largest four-digit number which when successively divided by 3, 4 and 5 leaves respective remainders 2, 3 and 4.","options":["9985","9995","9996","9959"],"answer":3,"typedAnswer":"9959","solution":"<p>Successive division gives \\(N=3[4(5k+4)+3]+2=60k+59\\). The largest four-digit value is 9959.</p>","no":11,"itemId":74211,"source":"LCM HCF Test 2"},{"type":"mcq","question":"Two numbers divided by the same divisor leave remainders 238 and 342. Their sum leaves remainder 156. Find the divisor.","options":["384","404","424","Cannot be determined"],"answer":2,"typedAnswer":"424","solution":"<p>The two remainders add to 580, which reduces to 156 modulo the divisor. Thus the divisor divides \\(580-156=424\\) and must exceed 342; hence it is 424.</p>","no":12,"itemId":74212,"source":"LCM HCF Test 2"},{"type":"mcq","question":"When 5, 7 and 11 divide a multiple of 17, the remainders are 4, 6 and 10. Which multiple of 17 is the least such number?","options":["384th","317th","385th","325th"],"answer":1,"typedAnswer":"317th","solution":"<p>The number is \\(-1\\pmod{5,7,11}\\), hence \\(-1\\pmod{385}\\). The least multiple of 17 satisfying this is \\(17\\cdot317=5389\\).</p>","no":13,"itemId":74213,"source":"LCM HCF Test 2"},{"type":"tita","question":"Find the smallest number which leaves remainder 7 on division by 31 and remainder 6 on division by 25.","typedAnswer":"131","solution":"<p>Let \\(N=7+31k\\). Modulo 25, \\(7+6k\\equiv6\\), so \\(k\\equiv4\\pmod{25}\\). The least value is \\(N=131\\).</p>","no":14,"itemId":74214,"source":"LCM HCF Test 2"},{"type":"tita","question":"Find the greatest number which divides 6155 and 4935 leaving remainders 5 and 15 respectively.","typedAnswer":"1230","solution":"<p>The divisor is \\(\\gcd(6150,4920)=1230\\).</p>","no":15,"itemId":74215,"source":"LCM HCF Test 2"},{"type":"tita","question":"Cakes weigh \\(5\\frac14\\), \\(7\\frac34\\) and \\(8\\frac15\\) lb. They are cut into equal pieces of maximum possible weight. How many guests can receive one piece each?","typedAnswer":"424","solution":"<p>The maximum piece weight is the HCF of the fractions: \\(1/20\\) lb. The three cakes yield 105, 155 and 164 pieces, totalling 424.</p>","no":16,"itemId":74216,"source":"LCM HCF Test 2"},{"type":"tita","question":"A number successively divided by 7, 11 and 5 leaves respective remainders 5, 1 and 1. Find the smallest such number.","typedAnswer":"89","solution":"<p>Reverse the successive divisions: \\(N=7[11(5k+1)+1]+5=385k+89\\). The least value is 89.</p>","no":17,"itemId":74217,"source":"LCM HCF Test 2"},{"type":"mcq","question":"A number successively divided by 4, 5 and 6 leaves remainders 3, 4 and 5. Find the hundreds digit of the smallest such number.","options":["1","2","3","4"],"answer":0,"typedAnswer":"1","solution":"<p>The numbers are \\(4[5(6k+5)+4]+3=120k+119\\). The smallest is 119, whose hundreds digit is 1.</p>","no":18,"itemId":74218,"source":"LCM HCF Test 2"},{"type":"mcq","question":"For the same condition, find the hundreds digit of the second-smallest such number.","options":["2","3","4","5"],"answer":0,"typedAnswer":"2","solution":"<p>The second-smallest value is \\(119+120=239\\), whose hundreds digit is 2.</p>","no":19,"itemId":74219,"source":"LCM HCF Test 2"},{"type":"mcq","question":"How many times the HCF of \\(\\frac3{14},\\frac6{35},\\frac{16}{21}\\) is their LCM?","options":["1440","144","210","48"],"answer":0,"typedAnswer":"1440","solution":"<p>The HCF is \\(1/210\\) and the LCM is \\(48/7\\). Their ratio is \\((48/7)/(1/210)=1440\\).</p>","no":20,"itemId":74220,"source":"LCM HCF Test 2"}];let current=0,submitted=false,secondsLeft=40*60;const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false),labels=['A','B','C','D'];const host=document.getElementById('questionHost'),qbar=document.getElementById('qbar'),resultBox=document.getElementById('result');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function norm(s){return String(s??'').trim().toLowerCase().replace(/[, ]/g,'').replace(/\.0+$/,'');}function correctText(q){return q.type==='mcq'?'('+labels[q.answer]+') '+q.options[q.answer]:q.typedAnswer;}function renderBar(){qbar.innerHTML=questions.map((q,i)=>'<button type="button" class="qbtn '+(i===current?'current ':'')+(responses[i]!==null&&responses[i]!==''?'answered ':'')+(marked[i]?'marked ':'')+'" onclick="go('+i+')">'+(i+1)+'</button>').join('');}function control(q,i){if(q.type==='mcq')return '<div class="options">'+q.options.map((op,j)=>'<label class="option"><input type="radio" name="answer_'+i+'" value="'+j+'" '+(responses[i]===String(j)?'checked':'')+' '+(submitted?'disabled':'')+'><span>('+labels[j]+') '+op+'</span></label>').join('')+'</div>';return '<input class="typed-answer" name="answer_'+i+'" value="'+esc(responses[i]||'')+'" placeholder="Type your answer" '+(submitted?'disabled':'')+'>';}function typeset(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([host,resultBox]).catch(()=>{});}function renderQuestion(){const q=questions[current];host.innerHTML='<div class="qhead"><div class="qnum">Question '+(current+1)+' of '+questions.length+'</div></div><div class="qtext">'+q.question+'</div>'+control(q,current)+'<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Detailed Solution</h3><strong>Correct answer: '+correctText(q)+'</strong>'+q.solution+'</div><div class="navrow"><button type="button" onclick="markReviewNext()">Mark for Review &amp; Next</button><button type="button" onclick="clearResponse()" '+(submitted?'disabled':'')+'>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" class="next" onclick="nextQ()">Save &amp; Next</button></div>';bindAnswer();if(submitted)showReviewForCurrent();renderBar();typeset();}function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{el.addEventListener('input',()=>{responses[current]=el.value;renderBar();});});}function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}function go(i){saveCurrent();current=i;renderQuestion()}function prevQ(){if(current>0)go(current-1)}function nextQ(){if(current<questions.length-1)go(current+1)}function markReviewNext(){marked[current]=true;nextQ()}function clearResponse(){responses[current]=null;renderQuestion()}function isCorrect(q,a){if(a===null||a==='')return null;return q.type==='mcq'?Number(a)===q.answer:norm(a)===norm(q.typedAnswer);}function showReviewForCurrent(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';if(r===null){note.className='answer-note muted';note.textContent='Unattempted.'}else if(r){note.className='answer-note ok';note.textContent='Correct.'}else{note.className='answer-note bad';note.textContent='Wrong.'}typeset();}function submitTest(){if(submitted)return;saveCurrent();submitted=true;let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++});resultBox.style.display='block';resultBox.innerHTML='<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>'+(c*3-w)+'</strong></div><div class="score-box">Correct<strong>'+c+'</strong></div><div class="score-box">Wrong<strong>'+w+'</strong></div><div class="score-box">Attempted<strong>'+(c+w)+'</strong></div><div class="score-box">Unattempted<strong>'+u+'</strong></div></div>';renderQuestion();resultBox.scrollIntoView({behavior:'smooth'});typeset();}function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest();return}secondsLeft--}renderQuestion();tick();setInterval(tick,1000);</script></body></html>
