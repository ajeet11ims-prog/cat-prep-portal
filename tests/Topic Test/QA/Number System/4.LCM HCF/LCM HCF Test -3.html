<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LCM HCF Test -3</title><script>window.MathJax={tex:{inlineMath:[["\\(","\\)"]],displayMath:[["\\[","\\]"]]},svg:{fontCache:"global"}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script><style>:root{--ink:#101820;--muted:#5f6f7a;--line:#b8c3cc;--brand:#0b75bb;--dark:#24313a;--mid:#4089c8;--ok:#60b947;--bad:#e55b25;--review:#7b4ab0;--bg:#eef3f7}*{box-sizing:border-box}html,body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;overflow:hidden}header{height:84px;background:#f3f5f7;border-bottom:1px solid #9eadb9}.topbar{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px}.title{background:var(--dark);color:#fff;padding:10px 18px;display:flex;flex-direction:column;justify-content:center}.title h1{font-size:22px;margin:0}.meta{font-size:15px;color:#dce9ef;margin-top:6px}.timer{display:grid;place-items:center;background:#fff;font-weight:700;font-size:18px}.timer span{font-size:22px}main{height:calc(100vh - 84px);display:grid;grid-template-columns:minmax(0,1fr) 300px;background:#fff}section{min-width:0;border-right:2px solid #41515c}.panel{padding:14px;background:#e5f6fc;display:flex;flex-direction:column}.panel h2{font-size:18px;margin:0 -14px 14px;padding:10px 14px;background:var(--mid);color:#fff}.qbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.qbtn{height:44px;border:1px solid #a9b3bc;background:linear-gradient(#fff,#dfe5ea);border-radius:3px;font-size:18px;font-weight:700;color:#45515a;cursor:pointer}.qbtn.current{background:#e85b21;color:#fff}.qbtn.answered{background:#72bd3b;color:#fff}.qbtn.marked{background:#7950a5;color:#fff;border-radius:50%}.legend{display:grid;gap:10px;margin-top:18px}.dot{display:inline-block;width:20px;height:20px;border:1px solid var(--line);vertical-align:-5px;margin-right:8px}.dot.current{background:#e85b21}.dot.answered{background:#72bd3b}.dot.marked{background:#7950a5;border-radius:50%}.side-submit{margin-top:auto;align-self:center;width:124px;height:42px;border:0;background:#29a8df;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.question-card{height:100%;overflow:auto;padding:0 0 74px}.qhead{min-height:52px;padding:12px 16px;border-bottom:1px solid #c6d0d8;background:#f5f7f9}.qnum{font-size:19px;font-weight:700}.qtext{font-size:20px;font-weight:700;padding:24px;min-height:125px}.options{display:grid;gap:14px;padding:0 24px 18px}.option{display:flex;gap:12px;cursor:pointer;font-size:20px;font-weight:700}.option input{margin-top:7px;transform:scale(1.25)}.typed-answer{width:min(420px,calc(100% - 48px));font-size:20px;font-weight:700;border:1px solid #8795a1;padding:12px;margin-left:24px}.navrow{position:fixed;left:0;right:300px;bottom:0;height:64px;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:10px 16px;background:#eef8fc;border-top:1px solid #b6cbd6}.navrow button{border:1px solid #b6c1ca;padding:11px 18px;font-size:16px;font-weight:700;background:#fff;cursor:pointer}.navrow .next{background:#29a8df;color:#fff}.solution{display:none;margin:16px 24px 0;padding:14px 16px;border:1px solid var(--line);background:#f8fbfd;font-size:17px}.solution h3{margin:0 0 8px;color:var(--brand)}.answer-note{margin:14px 24px 0;font-weight:800}.ok{color:#157347}.bad{color:#b02a37}.muted{color:var(--muted)}#result{display:none;padding:16px;border-bottom:1px solid var(--line)}.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.score-box{border:1px solid var(--line);padding:10px;background:#fbfcfd}.score-box strong{display:block;font-size:24px}mjx-container{font-size:108%!important}@media(max-width:900px){html,body{overflow:auto}header{height:auto}.topbar{grid-template-columns:1fr}.timer{padding:8px}main{height:auto;display:block}.panel{min-height:260px}.qbar{grid-template-columns:repeat(5,1fr)}.question-card{height:auto;min-height:70vh}.navrow{position:static}.score-grid{grid-template-columns:1fr 1fr}}</style></head><body><header><div class="topbar"><div class="title"><h1>LCM HCF Test -3</h1><div class="meta">20 Questions | 40 Minutes | +3 correct, -1 wrong | MCQ and numeric entry</div></div><div class="timer">Time Left: <span id="time">40:00</span></div></div></header><main><section><div id="result"></div><form id="testForm" autocomplete="off"><div id="questionHost" class="question-card"></div></form></section><aside class="panel"><h2>Question Bar</h2><div id="qbar" class="qbar"></div><div class="legend"><span><i class="dot current"></i>Current</span><span><i class="dot answered"></i>Answered</span><span><i class="dot marked"></i>Marked</span></div><button type="button" class="side-submit" onclick="submitTest()">Submit</button></aside></main><script>const questions=[{"type":"mcq","question":"How many natural numbers up to 2050 are neither perfect squares nor perfect cubes?","options":["1966","1978","1996","1990"],"answer":2,"typedAnswer":"1996","solution":"<p>There are 45 squares and 12 cubes; 3 numbers are both (sixth powers). By inclusion-exclusion, the excluded count is \\(45+12-3=54\\), so the answer is \\(2050-54=1996\\).</p>","no":1,"itemId":74301,"source":"LCM HCF Test 3"},{"type":"mcq","question":"Find the HCF of \\(2n+13\\) and \\(n+7\\), where \\(n\\) is a natural number.","options":["1","\\(n+6\\)","\\(n+7\\)","Depends upon \\(n\\)"],"answer":0,"typedAnswer":"1","solution":"<p>Any common divisor divides \\(2(n+7)-(2n+13)=1\\). Therefore the HCF is always 1.</p>","no":2,"itemId":74302,"source":"LCM HCF Test 3"},{"type":"tita","question":"What is the smallest number which when increased by 5 is completely divisible by 8, 11 and 24?","typedAnswer":"259","solution":"<p>The LCM of 8, 11 and 24 is 264. Therefore the number is \\(264-5=259\\).</p>","no":3,"itemId":74303,"source":"LCM HCF Test 3"},{"type":"mcq","question":"Find the smallest four-digit number which when divided by 12, 15 and 18 leaves remainders 8, 11 and 14 respectively.","options":["1080","1084","1076","1176"],"answer":2,"typedAnswer":"1076","solution":"<p>Each remainder is 4 below the divisor, so \\(N+4\\) is a multiple of \\(\\operatorname{LCM}(12,15,18)=180\\). The least four-digit value is \\(1080-4=1076\\).</p>","no":4,"itemId":74304,"source":"LCM HCF Test 3"},{"type":"mcq","question":"Find the greatest number which on dividing 225, 395 and 552 leaves remainders 4, 5 and 6 respectively.","options":["19","17","11","13"],"answer":3,"typedAnswer":"13","solution":"<p>The answer is \\(\\gcd(221,390,546)=13\\).</p>","no":5,"itemId":74305,"source":"LCM HCF Test 3"},{"type":"mcq","question":"How many natural numbers below 500 leave remainders 1, 3, 5 and 7 when divided by 2, 4, 6 and 8 respectively?","options":["18","19","20","21"],"answer":2,"typedAnswer":"20","solution":"<p>Each number is one less than a multiple of \\(\\operatorname{LCM}(2,4,6,8)=24\\). The values \\(24k-1<500\\) correspond to \\(k=1,\\ldots,20\\).</p>","no":6,"itemId":74306,"source":"LCM HCF Test 3"},{"type":"mcq","question":"Find the number closest to 3000 which leaves remainder 10 when divided by 18, 45 and 75.","options":["2710","3160","3600","3650"],"answer":1,"typedAnswer":"3160","solution":"<p>The number is \\(10\\pmod{450}\\). The nearby values are 2710 and 3160; 3160 is closer to 3000.</p>","no":7,"itemId":74307,"source":"LCM HCF Test 3"},{"type":"mcq","question":"How many numbers between 2000 and 3000 leave remainder 10 when divided by 24, 30, 36 and 40?","options":["6","5","4","3"],"answer":3,"typedAnswer":"3","solution":"<p>The LCM is 360. The qualifying numbers are 2170, 2530 and 2890, so there are 3.</p>","no":8,"itemId":74308,"source":"LCM HCF Test 3"},{"type":"mcq","question":"Find the greatest number which divides 62, 132 and 237 leaving the same remainder in each case.","options":["5","7","35","None of these"],"answer":2,"typedAnswer":"35","solution":"<p>Take the HCF of the differences 70, 105 and 175. It is 35.</p>","no":9,"itemId":74309,"source":"LCM HCF Test 3"},{"type":"mcq","question":"The sum of two numbers is 528 and their HCF is 33. How many unordered pairs satisfy the conditions?","options":["6","12","8","4"],"answer":3,"typedAnswer":"4","solution":"<p>Write the numbers as \\(33a,33b\\), where \\(a+b=16\\) and \\(\\gcd(a,b)=1\\). The unordered pairs are (1,15), (3,13), (5,11) and (7,9): 4 pairs.</p>","no":10,"itemId":74310,"source":"LCM HCF Test 3"},{"type":"mcq","question":"Three wheels complete 60, 36 and 24 revolutions per minute. A marked spot on each touches the ground at time zero. After how much time will all three spots touch the ground again?","options":["\\(\\frac52\\) s","\\(\\frac53\\) s","5 s","7.5 s"],"answer":2,"typedAnswer":"5 s","solution":"<p>Their revolution periods have LCM \\(1/\\gcd(60,36,24)=1/12\\) minute, which equals 5 seconds.</p>","no":11,"itemId":74311,"source":"LCM HCF Test 3"},{"type":"mcq","question":"Distinct integers \\(x,y,z\\) satisfy \\(\\operatorname{LCM}(x,2y,z)=20^2\\). Which can be \\(\\operatorname{LCM}(6x,8y,18z)\\)?","options":["\\(72\\cdot20^2\\)","\\(60\\cdot20^2\\)","\\(48\\cdot20^2\\)","\\(36\\cdot20^2\\)"],"answer":3,"typedAnswer":"\\(36\\cdot20^2\\)","solution":"<p>The coefficient 18 forces a factor \\(3^2\\), while the powers of 2 can raise the LCM by a factor 4. A factor 5 cannot newly appear. Thus \\(36\\cdot20^2\\) is attainable.</p>","no":12,"itemId":74312,"source":"LCM HCF Test 3"},{"type":"mcq","question":"A rod is cut into 3 equal parts, which are then cut into 12, 18 and 32 equal parts respectively. If every final piece has integer length, what is the minimum rod length?","options":["6912 units","864 units","288 units","240 units"],"answer":1,"typedAnswer":"864 units","solution":"<p>The rod length must be divisible by 36, 54 and 96. Their LCM is 864.</p>","no":13,"itemId":74313,"source":"LCM HCF Test 3"},{"type":"mcq","question":"A heap is divisible into groups of 21. Grouping it by 16, 20, 25 or 45 leaves 3 stones each time. What is the least possible number of stones?","options":["7203","2403","3603","4803"],"answer":0,"typedAnswer":"7203","solution":"<p>The number is \\(3\\pmod{3600}\\) and divisible by 21. The least solution is \\(2\\cdot3600+3=7203\\).</p>","no":14,"itemId":74314,"source":"LCM HCF Test 3"},{"type":"mcq","question":"Two consecutive positive multiples of 5 have a three-digit LCM. What is the maximum possible sum of the two numbers?","options":["135","140","145","150"],"answer":0,"typedAnswer":"135","solution":"<p>Let the numbers be \\(5n,5(n+1)\\). Their LCM is \\(5n(n+1)\\). The largest \\(n\\) giving a three-digit LCM is 13, so the sum is \\(65+70=135\\).</p>","no":15,"itemId":74315,"source":"LCM HCF Test 3"},{"type":"tita","question":"There are 84, 108 and 192 students in three trainings. Each room must contain the same number of students and only one training. Find the minimum number of rooms.","typedAnswer":"32","solution":"<p>The maximum equal room size is \\(\\gcd(84,108,192)=12\\). Thus the rooms required are \\(7+9+16=32\\).</p>","no":16,"itemId":74316,"source":"LCM HCF Test 3"},{"type":"mcq","question":"Trees are placed every 12 m and stones every 15 m along the same line, starting together. What is the minimum positive distance at which a tree and stone coincide?","options":["15 m","60 m","30 m","120 m"],"answer":1,"typedAnswer":"60 m","solution":"<p>The first positive coincidence is at \\(\\operatorname{LCM}(12,15)=60\\) m.</p>","no":17,"itemId":74317,"source":"LCM HCF Test 3"},{"type":"mcq","question":"Buses from Delhi to Meerut run every 24 minutes and buses in the opposite direction every 32 minutes. If two pass a bridge together at 10:15 a.m., when will this first happen again?","options":["11:45 a.m.","11:51 a.m.","11:51 p.m.","12:51 a.m."],"answer":1,"typedAnswer":"11:51 a.m.","solution":"<p>The interval is \\(\\operatorname{LCM}(24,32)=96\\) minutes. Adding 96 minutes to 10:15 a.m. gives 11:51 a.m.</p>","no":18,"itemId":74318,"source":"LCM HCF Test 3"},{"type":"mcq","question":"If \\(x\\) is the HCF of 12, 36 and 48 and \\(y\\) is the LCM of 3, 4 and 6, then:","options":["\\(x>y\\)","\\(x<y\\)","\\(x=y\\)","No relation"],"answer":2,"typedAnswer":"\\(x=y\\)","solution":"<p>Both values are 12, so \\(x=y\\).</p>","no":19,"itemId":74319,"source":"LCM HCF Test 3"},{"type":"mcq","question":"Four bells begin together and then toll at intervals of 6, 7, 8 and 9 seconds. How many further times will they toll together in 2 hours, and at what interval?","options":["14 times, 504 sec","15 times, 600 sec","13 times, 650 sec","11 times, 720 sec"],"answer":0,"typedAnswer":"14 times, 504 sec","solution":"<p>The common interval is \\(\\operatorname{LCM}(6,7,8,9)=504\\) seconds. In 7200 seconds there are \\(\\lfloor7200/504\\rfloor=14\\) further coincidences.</p>","no":20,"itemId":74320,"source":"LCM HCF Test 3"}];let current=0,submitted=false,secondsLeft=40*60;const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false),labels=['A','B','C','D'];const host=document.getElementById('questionHost'),qbar=document.getElementById('qbar'),resultBox=document.getElementById('result');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function norm(s){return String(s??'').trim().toLowerCase().replace(/[, ]/g,'').replace(/\.0+$/,'');}function correctText(q){return q.type==='mcq'?'('+labels[q.answer]+') '+q.options[q.answer]:q.typedAnswer;}function renderBar(){qbar.innerHTML=questions.map((q,i)=>'<button type="button" class="qbtn '+(i===current?'current ':'')+(responses[i]!==null&&responses[i]!==''?'answered ':'')+(marked[i]?'marked ':'')+'" onclick="go('+i+')">'+(i+1)+'</button>').join('');}function control(q,i){if(q.type==='mcq')return '<div class="options">'+q.options.map((op,j)=>'<label class="option"><input type="radio" name="answer_'+i+'" value="'+j+'" '+(responses[i]===String(j)?'checked':'')+' '+(submitted?'disabled':'')+'><span>('+labels[j]+') '+op+'</span></label>').join('')+'</div>';return '<input class="typed-answer" name="answer_'+i+'" value="'+esc(responses[i]||'')+'" placeholder="Type your answer" '+(submitted?'disabled':'')+'>';}function typeset(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([host,resultBox]).catch(()=>{});}function renderQuestion(){const q=questions[current];host.innerHTML='<div class="qhead"><div class="qnum">Question '+(current+1)+' of '+questions.length+'</div></div><div class="qtext">'+q.question+'</div>'+control(q,current)+'<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Detailed Solution</h3><strong>Correct answer: '+correctText(q)+'</strong>'+q.solution+'</div><div class="navrow"><button type="button" onclick="markReviewNext()">Mark for Review &amp; Next</button><button type="button" onclick="clearResponse()" '+(submitted?'disabled':'')+'>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" class="next" onclick="nextQ()">Save &amp; Next</button></div>';bindAnswer();if(submitted)showReviewForCurrent();renderBar();typeset();}function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{el.addEventListener('input',()=>{responses[current]=el.value;renderBar();});});}function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}function go(i){saveCurrent();current=i;renderQuestion()}function prevQ(){if(current>0)go(current-1)}function nextQ(){if(current<questions.length-1)go(current+1)}function markReviewNext(){marked[current]=true;nextQ()}function clearResponse(){responses[current]=null;renderQuestion()}function isCorrect(q,a){if(a===null||a==='')return null;return q.type==='mcq'?Number(a)===q.answer:norm(a)===norm(q.typedAnswer);}function showReviewForCurrent(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';if(r===null){note.className='answer-note muted';note.textContent='Unattempted.'}else if(r){note.className='answer-note ok';note.textContent='Correct.'}else{note.className='answer-note bad';note.textContent='Wrong.'}typeset();}function submitTest(){if(submitted)return;saveCurrent();submitted=true;let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++});resultBox.style.display='block';resultBox.innerHTML='<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>'+(c*3-w)+'</strong></div><div class="score-box">Correct<strong>'+c+'</strong></div><div class="score-box">Wrong<strong>'+w+'</strong></div><div class="score-box">Attempted<strong>'+(c+w)+'</strong></div><div class="score-box">Unattempted<strong>'+u+'</strong></div></div>';renderQuestion();resultBox.scrollIntoView({behavior:'smooth'});typeset();}function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest();return}secondsLeft--}renderQuestion();tick();setInterval(tick,1000);</script></body></html>
