<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LCM HCF Test -4</title><script>window.MathJax={tex:{inlineMath:[["\\(","\\)"]],displayMath:[["\\[","\\]"]]},svg:{fontCache:"global"}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script><style>:root{--ink:#101820;--muted:#5f6f7a;--line:#b8c3cc;--brand:#0b75bb;--dark:#24313a;--mid:#4089c8;--ok:#60b947;--bad:#e55b25;--review:#7b4ab0;--bg:#eef3f7}*{box-sizing:border-box}html,body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;overflow:hidden}header{height:84px;background:#f3f5f7;border-bottom:1px solid #9eadb9}.topbar{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px}.title{background:var(--dark);color:#fff;padding:10px 18px;display:flex;flex-direction:column;justify-content:center}.title h1{font-size:22px;margin:0}.meta{font-size:15px;color:#dce9ef;margin-top:6px}.timer{display:grid;place-items:center;background:#fff;font-weight:700;font-size:18px}.timer span{font-size:22px}main{height:calc(100vh - 84px);display:grid;grid-template-columns:minmax(0,1fr) 300px;background:#fff}section{min-width:0;border-right:2px solid #41515c}.panel{padding:14px;background:#e5f6fc;display:flex;flex-direction:column}.panel h2{font-size:18px;margin:0 -14px 14px;padding:10px 14px;background:var(--mid);color:#fff}.qbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.qbtn{height:44px;border:1px solid #a9b3bc;background:linear-gradient(#fff,#dfe5ea);border-radius:3px;font-size:18px;font-weight:700;color:#45515a;cursor:pointer}.qbtn.current{background:#e85b21;color:#fff}.qbtn.answered{background:#72bd3b;color:#fff}.qbtn.marked{background:#7950a5;color:#fff;border-radius:50%}.legend{display:grid;gap:10px;margin-top:18px}.dot{display:inline-block;width:20px;height:20px;border:1px solid var(--line);vertical-align:-5px;margin-right:8px}.dot.current{background:#e85b21}.dot.answered{background:#72bd3b}.dot.marked{background:#7950a5;border-radius:50%}.side-submit{margin-top:auto;align-self:center;width:124px;height:42px;border:0;background:#29a8df;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.question-card{height:100%;overflow:auto;padding:0 0 74px}.qhead{min-height:52px;padding:12px 16px;border-bottom:1px solid #c6d0d8;background:#f5f7f9}.qnum{font-size:19px;font-weight:700}.qtext{font-size:20px;font-weight:700;padding:24px;min-height:125px}.options{display:grid;gap:14px;padding:0 24px 18px}.option{display:flex;gap:12px;cursor:pointer;font-size:20px;font-weight:700}.option input{margin-top:7px;transform:scale(1.25)}.typed-answer{width:min(420px,calc(100% - 48px));font-size:20px;font-weight:700;border:1px solid #8795a1;padding:12px;margin-left:24px}.navrow{position:fixed;left:0;right:300px;bottom:0;height:64px;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:10px 16px;background:#eef8fc;border-top:1px solid #b6cbd6}.navrow button{border:1px solid #b6c1ca;padding:11px 18px;font-size:16px;font-weight:700;background:#fff;cursor:pointer}.navrow .next{background:#29a8df;color:#fff}.solution{display:none;margin:16px 24px 0;padding:14px 16px;border:1px solid var(--line);background:#f8fbfd;font-size:17px}.solution h3{margin:0 0 8px;color:var(--brand)}.answer-note{margin:14px 24px 0;font-weight:800}.ok{color:#157347}.bad{color:#b02a37}.muted{color:var(--muted)}#result{display:none;padding:16px;border-bottom:1px solid var(--line)}.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.score-box{border:1px solid var(--line);padding:10px;background:#fbfcfd}.score-box strong{display:block;font-size:24px}mjx-container{font-size:108%!important}@media(max-width:900px){html,body{overflow:auto}header{height:auto}.topbar{grid-template-columns:1fr}.timer{padding:8px}main{height:auto;display:block}.panel{min-height:260px}.qbar{grid-template-columns:repeat(5,1fr)}.question-card{height:auto;min-height:70vh}.navrow{position:static}.score-grid{grid-template-columns:1fr 1fr}}</style></head><body><header><div class="topbar"><div class="title"><h1>LCM HCF Test -4</h1><div class="meta">20 Questions | 40 Minutes | +3 correct, -1 wrong | MCQ and numeric entry</div></div><div class="timer">Time Left: <span id="time">40:00</span></div></div></header><main><section><div id="result"></div><form id="testForm" autocomplete="off"><div id="questionHost" class="question-card"></div></form></section><aside class="panel"><h2>Question Bar</h2><div id="qbar" class="qbar"></div><div class="legend"><span><i class="dot current"></i>Current</span><span><i class="dot answered"></i>Answered</span><span><i class="dot marked"></i>Marked</span></div><button type="button" class="side-submit" onclick="submitTest()">Submit</button></aside></main><script>const questions=[{"type":"mcq","question":"Find the least number which must be subtracted from 2424 so that the result leaves remainder 1 when divided by 12, 25 and 30.","options":["23","21","19","17"],"answer":0,"typedAnswer":"23","solution":"<p>The result must be \\(1\\pmod{300}\\). Since \\(2424\\equiv24\\pmod{300}\\), subtract 23.</p>","no":1,"itemId":74401,"source":"LCM HCF Test 4"},{"type":"mcq","question":"Four gears A, B, C and D mesh in order and have 10, 21, 12 and 17 teeth. Starting from rest, how many revolutions must the largest gear make for the entire mechanism to return to its starting position?","options":["270","340","7140","285"],"answer":1,"typedAnswer":"340","solution":"<p>If the 21-tooth gear turns \\(k\\) times, the other turns are \\(21k/10,21k/12,21k/17\\). The least integer \\(k\\) making all integral is \\(\\operatorname{LCM}(10,4,17)=340\\).</p>","no":2,"itemId":74402,"source":"LCM HCF Test 4"},{"type":"mcq","question":"A stamp collection leaves 1 stamp when grouped in 2, 3, 4, 5 or 6, but none when grouped in 7. What remainder is left when it is grouped in 8?","options":["5","7","1","0"],"answer":0,"typedAnswer":"5","solution":"<p>The least collection is \\(1\\pmod{60}\\) and divisible by 7, namely 301. Since \\(301\\equiv5\\pmod8\\), 5 stamps remain.</p>","no":3,"itemId":74403,"source":"LCM HCF Test 4"},{"type":"mcq","question":"If \\(a=103!\\) and \\(b=104\\times105\\times106\\), find \\(\\operatorname{LCM}(a,b)\\).","options":["\\(106!\\)","\\(103!\\times106\\)","\\(103!\\times105\\)","\\(103!\\)"],"answer":3,"typedAnswer":"\\(103!\\)","solution":"<p>All prime-power factors in \\(104\\times105\\times106\\) already occur in \\(103!\\), so \\(b\\mid103!\\). Hence the LCM is \\(103!\\).</p>","no":4,"itemId":74404,"source":"LCM HCF Test 4"},{"type":"mcq","question":"The numbers of cows, sheep and goats are distinct primes. The number of cows times the total cows and sheep is 120 more than the goats. How many goats are there?","options":["21","22","23","11"],"answer":2,"typedAnswer":"23","solution":"<p>With 11 cows and 2 sheep, \\(11(11+2)=143=120+23\\). Thus there are 23 goats; the other prime option does not satisfy the conditions.</p>","no":5,"itemId":74405,"source":"LCM HCF Test 4"},{"type":"tita","question":"What is the least number that leaves remainder 4 when divided by 16, 18 or 20, but is divisible by 7?","typedAnswer":"2884","solution":"<p>The number is \\(720k+4\\), since the LCM is 720. Modulo 7 this gives \\(6k+4\\equiv0\\), whose least positive solution is \\(k=4\\). Thus the number is 2884.</p>","no":6,"itemId":74406,"source":"LCM HCF Test 4"},{"type":"mcq","question":"Find the least number to subtract from 1930 so that the result leaves the same remainder when divided by 9, 10 and 15.","options":["32","40","39","None of these"],"answer":0,"typedAnswer":"32","solution":"<p>A common remainder below 9 means the result is \\(r\\pmod{90}\\) with \\(0\\le r<9\\). Since \\(1930\\equiv40\\pmod{90}\\), the least subtraction is \\(40-8=32\\).</p>","no":7,"itemId":74407,"source":"LCM HCF Test 4"},{"type":"mcq","question":"Gold coins leave 1 when grouped by 2, 3, 4, 5 or 6, but none when grouped by 7. What is the minimum possible number of coins?","options":["4321","301","721","91"],"answer":1,"typedAnswer":"301","solution":"<p>The number is \\(1\\pmod{60}\\) and divisible by 7. The least solution is 301.</p>","no":8,"itemId":74408,"source":"LCM HCF Test 4"},{"type":"mcq","question":"Let \\(N=\\overline{ab}\\), \\(M=\\overline{ba}\\), and \\(P=ab\\). If \\(N+M+P=87\\), find \\(P\\).","options":["25","7","15","10"],"answer":3,"typedAnswer":"10","solution":"<p>The equation is \\(11(a+b)+ab=87\\), or \\((a+11)(b+11)=208=13\\cdot16\\). Thus the digits are 2 and 5, and \\(P=10\\).</p>","no":9,"itemId":74409,"source":"LCM HCF Test 4"},{"type":"mcq","question":"A teacher's two-digit age is odd and composite. The sum of the age and its digit reversal is a perfect square, and their positive difference is also a perfect square. The age is divisible by:","options":["7","9","13","15"],"answer":2,"typedAnswer":"13","solution":"<p>The age is 65: \\(65+56=121=11^2\\) and \\(65-56=9=3^2\\). Therefore it is divisible by 13.</p>","no":10,"itemId":74410,"source":"LCM HCF Test 4"},{"type":"mcq","question":"Boxes of three brands number 96, 240 and 336. Equal-sized cartons must contain equal numbers of boxes and only one brand. What is the minimum number of cartons?","options":["20","14","42","38"],"answer":1,"typedAnswer":"14","solution":"<p>Each carton should hold \\(\\gcd(96,240,336)=48\\) boxes. The number of cartons is \\(2+5+7=14\\).</p>","no":11,"itemId":74411,"source":"LCM HCF Test 4"},{"type":"mcq","question":"The numbers 4242 and 2903 leave the same remainder when divided by a certain three-digit number. Find the divisor and remainder.","options":["103, 19","100, 20","150, 40","125, 35"],"answer":0,"typedAnswer":"103, 19","solution":"<p>Their difference is \\(1339=13\\cdot103\\). The three-digit divisor is 103, and \\(4242\\equiv2903\\equiv19\\pmod{103}\\).</p>","no":12,"itemId":74412,"source":"LCM HCF Test 4"},{"type":"mcq","question":"Unequal natural numbers \\(p,q\\) have sum 60. What is the highest possible value of their HCF?","options":["60","30","20","15"],"answer":2,"typedAnswer":"20","solution":"<p>Write \\(p=da,q=db\\) with coprime unequal \\(a,b\\). The smallest possible \\(a+b\\) is 3, so the largest \\(d=60/3=20\\), attained by 20 and 40.</p>","no":13,"itemId":74413,"source":"LCM HCF Test 4"},{"type":"mcq","question":"The sum of 18 consecutive natural numbers is a perfect square. What is the minimum possible largest number?","options":["18","19","20","21"],"answer":3,"typedAnswer":"21","solution":"<p>For first term \\(n\\), the sum is \\(9(2n+17)\\). The least odd square at least 19 is 25, giving \\(n=4\\); the largest term is \\(4+17=21\\).</p>","no":14,"itemId":74414,"source":"LCM HCF Test 4"},{"type":"mcq","question":"Find the largest four-digit number that leaves remainder 5 when divided by 12, 24 and 60.","options":["9960","9955","9965","9990"],"answer":2,"typedAnswer":"9965","solution":"<p>The number is \\(5\\pmod{120}\\). The largest four-digit value is \\(120\\cdot83+5=9965\\).</p>","no":15,"itemId":74415,"source":"LCM HCF Test 4"},{"type":"tita","question":"A number leaves remainder 2 when divided by 3, 4, 5 or 6, but is divisible by 7. Find the least such number.","typedAnswer":"182","solution":"<p>The number is \\(60k+2\\). Modulo 7, \\(4k+2\\equiv0\\), whose least solution is \\(k=3\\). Thus the number is 182.</p>","no":16,"itemId":74416,"source":"LCM HCF Test 4"},{"type":"tita","question":"For how many ordered pairs \\((a,b)\\) of natural numbers is \\(\\operatorname{LCM}(a,b)=2^5 5^7 11^{13}\\)?","typedAnswer":"4455","solution":"<p>For a prime exponent \\(e\\) in the LCM, the ordered exponent pairs with maximum \\(e\\) number \\(2e+1\\). Hence the count is \\(11\\cdot15\\cdot27=4455\\).</p>","no":17,"itemId":74417,"source":"LCM HCF Test 4"},{"type":"mcq","question":"The HCF of two numbers is 13 and their product is 4732. How many unordered pairs are possible?","options":["0","1","2","3"],"answer":2,"typedAnswer":"2","solution":"<p>Write the numbers as \\(13a,13b\\), with \\(ab=28\\) and \\(\\gcd(a,b)=1\\). The coprime factor pairs are (1,28) and (4,7), so there are 2 pairs.</p>","no":18,"itemId":74418,"source":"LCM HCF Test 4"},{"type":"mcq","question":"If \\(\\overline{abc}\\) is a three-digit number whose product with the sum of its digits is 2005, what is \\(b\\)?","options":["4","1","5","0"],"answer":3,"typedAnswer":"0","solution":"<p>Since \\(2005=401\\cdot5\\) and the digit sum of 401 is 5, the number is 401. Its tens digit \\(b\\) is 0.</p>","no":19,"itemId":74419,"source":"LCM HCF Test 4"},{"type":"mcq","question":"Positive integers \\(a<b<c<10\\) satisfy \\(ac/b=7.5\\). What is \\(\\operatorname{LCM}(b,c)\\)?","options":["3","12","18","30"],"answer":2,"typedAnswer":"18","solution":"<p>The equation is \\(2ac=15b\\). The ordered digit solution is \\(a,b,c=(5,6,9)\\), and \\(\\operatorname{LCM}(6,9)=18\\).</p>","no":20,"itemId":74420,"source":"LCM HCF Test 4"}];let current=0,submitted=false,secondsLeft=40*60;const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false),labels=['A','B','C','D'];const host=document.getElementById('questionHost'),qbar=document.getElementById('qbar'),resultBox=document.getElementById('result');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function norm(s){return String(s??'').trim().toLowerCase().replace(/[, ]/g,'').replace(/\.0+$/,'');}function correctText(q){return q.type==='mcq'?'('+labels[q.answer]+') '+q.options[q.answer]:q.typedAnswer;}function renderBar(){qbar.innerHTML=questions.map((q,i)=>'<button type="button" class="qbtn '+(i===current?'current ':'')+(responses[i]!==null&&responses[i]!==''?'answered ':'')+(marked[i]?'marked ':'')+'" onclick="go('+i+')">'+(i+1)+'</button>').join('');}function control(q,i){if(q.type==='mcq')return '<div class="options">'+q.options.map((op,j)=>'<label class="option"><input type="radio" name="answer_'+i+'" value="'+j+'" '+(responses[i]===String(j)?'checked':'')+' '+(submitted?'disabled':'')+'><span>('+labels[j]+') '+op+'</span></label>').join('')+'</div>';return '<input class="typed-answer" name="answer_'+i+'" value="'+esc(responses[i]||'')+'" placeholder="Type your answer" '+(submitted?'disabled':'')+'>';}function typeset(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([host,resultBox]).catch(()=>{});}function renderQuestion(){const q=questions[current];host.innerHTML='<div class="qhead"><div class="qnum">Question '+(current+1)+' of '+questions.length+'</div></div><div class="qtext">'+q.question+'</div>'+control(q,current)+'<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Detailed Solution</h3><strong>Correct answer: '+correctText(q)+'</strong>'+q.solution+'</div><div class="navrow"><button type="button" onclick="markReviewNext()">Mark for Review &amp; Next</button><button type="button" onclick="clearResponse()" '+(submitted?'disabled':'')+'>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" class="next" onclick="nextQ()">Save &amp; Next</button></div>';bindAnswer();if(submitted)showReviewForCurrent();renderBar();typeset();}function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{el.addEventListener('input',()=>{responses[current]=el.value;renderBar();});});}function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}function go(i){saveCurrent();current=i;renderQuestion()}function prevQ(){if(current>0)go(current-1)}function nextQ(){if(current<questions.length-1)go(current+1)}function markReviewNext(){marked[current]=true;nextQ()}function clearResponse(){responses[current]=null;renderQuestion()}function isCorrect(q,a){if(a===null||a==='')return null;return q.type==='mcq'?Number(a)===q.answer:norm(a)===norm(q.typedAnswer);}function showReviewForCurrent(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';if(r===null){note.className='answer-note muted';note.textContent='Unattempted.'}else if(r){note.className='answer-note ok';note.textContent='Correct.'}else{note.className='answer-note bad';note.textContent='Wrong.'}typeset();}function submitTest(){if(submitted)return;saveCurrent();submitted=true;let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++});resultBox.style.display='block';resultBox.innerHTML='<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>'+(c*3-w)+'</strong></div><div class="score-box">Correct<strong>'+c+'</strong></div><div class="score-box">Wrong<strong>'+w+'</strong></div><div class="score-box">Attempted<strong>'+(c+w)+'</strong></div><div class="score-box">Unattempted<strong>'+u+'</strong></div></div>';renderQuestion();resultBox.scrollIntoView({behavior:'smooth'});typeset();}function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest();return}secondsLeft--}renderQuestion();tick();setInterval(tick,1000);</script></body></html>
