<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LCM HCF Test -5</title><script>window.MathJax={tex:{inlineMath:[["\\(","\\)"]],displayMath:[["\\[","\\]"]]},svg:{fontCache:"global"}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script><style>:root{--ink:#101820;--muted:#5f6f7a;--line:#b8c3cc;--brand:#0b75bb;--dark:#24313a;--mid:#4089c8;--ok:#60b947;--bad:#e55b25;--review:#7b4ab0;--bg:#eef3f7}*{box-sizing:border-box}html,body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;overflow:hidden}header{height:84px;background:#f3f5f7;border-bottom:1px solid #9eadb9}.topbar{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px}.title{background:var(--dark);color:#fff;padding:10px 18px;display:flex;flex-direction:column;justify-content:center}.title h1{font-size:22px;margin:0}.meta{font-size:15px;color:#dce9ef;margin-top:6px}.timer{display:grid;place-items:center;background:#fff;font-weight:700;font-size:18px}.timer span{font-size:22px}main{height:calc(100vh - 84px);display:grid;grid-template-columns:minmax(0,1fr) 300px;background:#fff}section{min-width:0;border-right:2px solid #41515c}.panel{padding:14px;background:#e5f6fc;display:flex;flex-direction:column}.panel h2{font-size:18px;margin:0 -14px 14px;padding:10px 14px;background:var(--mid);color:#fff}.qbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.qbtn{height:44px;border:1px solid #a9b3bc;background:linear-gradient(#fff,#dfe5ea);border-radius:3px;font-size:18px;font-weight:700;color:#45515a;cursor:pointer}.qbtn.current{background:#e85b21;color:#fff}.qbtn.answered{background:#72bd3b;color:#fff}.qbtn.marked{background:#7950a5;color:#fff;border-radius:50%}.legend{display:grid;gap:10px;margin-top:18px}.dot{display:inline-block;width:20px;height:20px;border:1px solid var(--line);vertical-align:-5px;margin-right:8px}.dot.current{background:#e85b21}.dot.answered{background:#72bd3b}.dot.marked{background:#7950a5;border-radius:50%}.side-submit{margin-top:auto;align-self:center;width:124px;height:42px;border:0;background:#29a8df;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.question-card{height:100%;overflow:auto;padding:0 0 74px}.qhead{min-height:52px;padding:12px 16px;border-bottom:1px solid #c6d0d8;background:#f5f7f9}.qnum{font-size:19px;font-weight:700}.qtext{font-size:20px;font-weight:700;padding:24px;min-height:125px}.options{display:grid;gap:14px;padding:0 24px 18px}.option{display:flex;gap:12px;cursor:pointer;font-size:20px;font-weight:700}.option input{margin-top:7px;transform:scale(1.25)}.typed-answer{width:min(420px,calc(100% - 48px));font-size:20px;font-weight:700;border:1px solid #8795a1;padding:12px;margin-left:24px}.navrow{position:fixed;left:0;right:300px;bottom:0;height:64px;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:10px 16px;background:#eef8fc;border-top:1px solid #b6cbd6}.navrow button{border:1px solid #b6c1ca;padding:11px 18px;font-size:16px;font-weight:700;background:#fff;cursor:pointer}.navrow .next{background:#29a8df;color:#fff}.solution{display:none;margin:16px 24px 0;padding:14px 16px;border:1px solid var(--line);background:#f8fbfd;font-size:17px}.solution h3{margin:0 0 8px;color:var(--brand)}.answer-note{margin:14px 24px 0;font-weight:800}.ok{color:#157347}.bad{color:#b02a37}.muted{color:var(--muted)}#result{display:none;padding:16px;border-bottom:1px solid var(--line)}.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.score-box{border:1px solid var(--line);padding:10px;background:#fbfcfd}.score-box strong{display:block;font-size:24px}mjx-container{font-size:108%!important}@media(max-width:900px){html,body{overflow:auto}header{height:auto}.topbar{grid-template-columns:1fr}.timer{padding:8px}main{height:auto;display:block}.panel{min-height:260px}.qbar{grid-template-columns:repeat(5,1fr)}.question-card{height:auto;min-height:70vh}.navrow{position:static}.score-grid{grid-template-columns:1fr 1fr}}</style></head><body><header><div class="topbar"><div class="title"><h1>LCM HCF Test -5</h1><div class="meta">20 Questions | 40 Minutes | +3 correct, -1 wrong | MCQ and numeric entry</div></div><div class="timer">Time Left: <span id="time">40:00</span></div></div></header><main><section><div id="result"></div><form id="testForm" autocomplete="off"><div id="questionHost" class="question-card"></div></form></section><aside class="panel"><h2>Question Bar</h2><div id="qbar" class="qbar"></div><div class="legend"><span><i class="dot current"></i>Current</span><span><i class="dot answered"></i>Answered</span><span><i class="dot marked"></i>Marked</span></div><button type="button" class="side-submit" onclick="submitTest()">Submit</button></aside></main><script>const questions=[{"type":"mcq","question":"Find the LCM of 15, 24, 35 and 54.","options":["7650","7560","6570","5670"],"answer":1,"typedAnswer":"7560","solution":"<p>Using the highest prime powers, the LCM is \\(2^3\\cdot3^3\\cdot5\\cdot7=7560\\).</p>","no":1,"itemId":74501,"source":"LCM HCF Test 5"},{"type":"mcq","question":"Find the HCF of 18, 54 and 72.","options":["6","18","27","12"],"answer":1,"typedAnswer":"18","solution":"<p>The greatest common factor of all three numbers is 18.</p>","no":2,"itemId":74502,"source":"LCM HCF Test 5"},{"type":"mcq","question":"The LCM of 48, 88 and another number \\(x\\) is 4752. Which value can \\(x\\) take?","options":["202","307","216","123"],"answer":2,"typedAnswer":"216","solution":"<p>The LCM of 48 and 88 is 528. Since \\(4752=2^4\\cdot3^3\\cdot11\\), choosing \\(x=216=2^3\\cdot3^3\\) supplies exactly the missing power of 3.</p>","no":3,"itemId":74503,"source":"LCM HCF Test 5"},{"type":"mcq","question":"If the LCM of \\(x\\sqrt y\\) and \\(y\\sqrt x\\) is \\(l\\), find the LCM of \\(4x^3\\sqrt{y^6}\\) and \\(y^3\\sqrt{4x^6}\\).","options":["\\(4l^3\\)","\\(8l^2\\)","\\(l^2\\)","\\(2l^2\\)"],"answer":0,"typedAnswer":"\\(4l^3\\)","solution":"<p>The two new expressions simplify to \\(4x^3y^3\\) and \\(2x^3y^3\\). Their LCM is \\(4(xy)^3=4l^3\\).</p>","no":4,"itemId":74504,"source":"LCM HCF Test 5"},{"type":"mcq","question":"Find the HCF of \\(\\frac12,\\frac34,\\frac{27}{16},\\frac{81}{64}\\).","options":["\\(\\frac1{64}\\)","\\(\\frac9{64}\\)","\\(\\frac{243}{256}\\)","\\(\\frac{81}{64}\\)"],"answer":0,"typedAnswer":"\\(\\frac1{64}\\)","solution":"<p>HCF of fractions equals HCF of numerators over LCM of denominators: \\(1/64\\).</p>","no":5,"itemId":74505,"source":"LCM HCF Test 5"},{"type":"mcq","question":"Find the LCM of \\(\\frac32,\\frac{81}{16},\\frac98\\).","options":["\\(\\frac{111}{2}\\)","\\(\\frac{91}{2}\\)","\\(\\frac{81}{2}\\)","\\(\\frac{101}{2}\\)"],"answer":2,"typedAnswer":"\\(\\frac{81}{2}\\)","solution":"<p>LCM of numerators is 81 and HCF of denominators is 2, giving \\(81/2\\).</p>","no":6,"itemId":74506,"source":"LCM HCF Test 5"},{"type":"mcq","question":"Find the difference between the LCM and HCF of \\(\\frac47,\\frac5{14},\\frac9{35}\\).","options":["19.5","20.7","22.3","25.7"],"answer":3,"typedAnswer":"25.7","solution":"<p>The LCM is \\(180/7\\) and the HCF is \\(1/70\\). Their difference is \\(1799/70=25.7\\).</p>","no":7,"itemId":74507,"source":"LCM HCF Test 5"},{"type":"mcq","question":"Find the LCM of 0.9, 3.7 and 0.54.","options":["99.9","106","105","107"],"answer":0,"typedAnswer":"99.9","solution":"<p>Multiply by 100: the LCM of 90, 370 and 54 is 9990. Dividing by 100 gives 99.9.</p>","no":8,"itemId":74508,"source":"LCM HCF Test 5"},{"type":"mcq","question":"Find the HCF of 0.7, 0.35 and 1.05.","options":["0.7","0.35","1.005","0.07"],"answer":1,"typedAnswer":"0.35","solution":"<p>After multiplying by 100, \\(\\gcd(70,35,105)=35\\). Dividing by 100 gives 0.35.</p>","no":9,"itemId":74509,"source":"LCM HCF Test 5"},{"type":"mcq","question":"Find the HCF and LCM of 0.48, 1.20 and 1.68.","options":["HCF = 0.24; LCM = 4.80","HCF = 0.12; LCM = 2.40","HCF = 0.12; LCM = 1.68","HCF = 0.24; LCM = 16.8"],"answer":3,"typedAnswer":"HCF = 0.24; LCM = 16.8","solution":"<p>Scaling by 100 gives HCF 24 and LCM 1680. Scaling back gives 0.24 and 16.8.</p>","no":10,"itemId":74510,"source":"LCM HCF Test 5"},{"type":"mcq","question":"The HCF and LCM of two numbers are 13 and 1170. If one number is 130, find the other.","options":["91","104","117","143"],"answer":2,"typedAnswer":"117","solution":"<p>The product of the numbers is HCF × LCM. Thus the other number is \\(13\\cdot1170/130=117\\).</p>","no":11,"itemId":74511,"source":"LCM HCF Test 5"},{"type":"mcq","question":"The sum and difference of the LCM and HCF of two numbers are 512 and 496. If one number is 72, find the other.","options":["80","40","64","56"],"answer":3,"typedAnswer":"56","solution":"<p>Solving gives LCM 504 and HCF 8. The other number is \\(504\\cdot8/72=56\\).</p>","no":12,"itemId":74512,"source":"LCM HCF Test 5"},{"type":"mcq","question":"Two numbers are in the ratio 3:16, and the product of their LCM and HCF is 432. Find the sum of the reciprocals of the LCM and HCF.","options":["\\(\\frac{49}{151}\\)","\\(\\frac{49}{145}\\)","\\(\\frac{49}{159}\\)","\\(\\frac{49}{144}\\)"],"answer":3,"typedAnswer":"\\(\\frac{49}{144}\\)","solution":"<p>The numbers are 9 and 48, so HCF = 3 and LCM = 144. The reciprocal sum is \\(1/3+1/144=49/144\\).</p>","no":13,"itemId":74513,"source":"LCM HCF Test 5"},{"type":"mcq","question":"The sum of two numbers is 84 and their HCF is 12. If LCM:HCF = 12:1, find the numbers.","options":["36 and 48","24 and 60","12 and 72","42 and 42"],"answer":0,"typedAnswer":"36 and 48","solution":"<p>The LCM is 144. Writing the numbers as \\(12a,12b\\) gives \\(a+b=7\\), \\(ab=12\\), so \\(a,b=3,4\\).</p>","no":14,"itemId":74514,"source":"LCM HCF Test 5"},{"type":"mcq","question":"How many unordered pairs of positive integers \\(p,q\\) have HCF 37 and sum 1961?","options":["54","26","53","28"],"answer":1,"typedAnswer":"26","solution":"<p>Write \\(p=37a,q=37b\\). Then \\(a+b=53\\). Since 53 is prime, all 26 unordered positive pairs are coprime.</p>","no":15,"itemId":74515,"source":"LCM HCF Test 5"},{"type":"mcq","question":"The product of two numbers is 2028 and their HCF is 13. How many unordered pairs are possible?","options":["1","2","3","4"],"answer":1,"typedAnswer":"2","solution":"<p>Writing the numbers as \\(13a,13b\\) gives \\(ab=12\\) with \\(a,b\\) coprime. The pairs (1,12) and (3,4) give 2 possibilities.</p>","no":16,"itemId":74516,"source":"LCM HCF Test 5"},{"type":"mcq","question":"The LCM of two numbers is 12 times their HCF. Their LCM and HCF sum to 169, while the numbers sum to 91. Find the difference between the numbers.","options":["13","58","72","66"],"answer":0,"typedAnswer":"13","solution":"<p>HCF = 13 and LCM = 156. The numbers are \\(13\\cdot3=39\\) and \\(13\\cdot4=52\\), whose difference is 13.</p>","no":17,"itemId":74517,"source":"LCM HCF Test 5"},{"type":"mcq","question":"The HCF of two numbers is 62, and their remaining coprime factors are 7 and 9. Which can be the smaller number?","options":["434","432","433","431"],"answer":0,"typedAnswer":"434","solution":"<p>The numbers are \\(62\\cdot7\\) and \\(62\\cdot9\\). The smaller is 434.</p>","no":18,"itemId":74518,"source":"LCM HCF Test 5"},{"type":"mcq","question":"Find the greatest number that divides 556, 763 and 349 leaving remainder 4 in each case.","options":["69","92","36","54"],"answer":0,"typedAnswer":"69","solution":"<p>The required number is \\(\\gcd(552,759,345)=69\\).</p>","no":19,"itemId":74519,"source":"LCM HCF Test 5"},{"type":"mcq","question":"Find the greatest number that divides 797, 1085 and 1232 leaving remainders 16, 20 and 25 respectively.","options":["69","71","65","91"],"answer":1,"typedAnswer":"71","solution":"<p>The required number is \\(\\gcd(781,1065,1207)=71\\).</p>","no":20,"itemId":74520,"source":"LCM HCF Test 5"}];let current=0,submitted=false,secondsLeft=40*60;const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false),labels=['A','B','C','D'];const host=document.getElementById('questionHost'),qbar=document.getElementById('qbar'),resultBox=document.getElementById('result');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function norm(s){return String(s??'').trim().toLowerCase().replace(/[, ]/g,'').replace(/\.0+$/,'');}function correctText(q){return q.type==='mcq'?'('+labels[q.answer]+') '+q.options[q.answer]:q.typedAnswer;}function renderBar(){qbar.innerHTML=questions.map((q,i)=>'<button type="button" class="qbtn '+(i===current?'current ':'')+(responses[i]!==null&&responses[i]!==''?'answered ':'')+(marked[i]?'marked ':'')+'" onclick="go('+i+')">'+(i+1)+'</button>').join('');}function control(q,i){if(q.type==='mcq')return '<div class="options">'+q.options.map((op,j)=>'<label class="option"><input type="radio" name="answer_'+i+'" value="'+j+'" '+(responses[i]===String(j)?'checked':'')+' '+(submitted?'disabled':'')+'><span>('+labels[j]+') '+op+'</span></label>').join('')+'</div>';return '<input class="typed-answer" name="answer_'+i+'" value="'+esc(responses[i]||'')+'" placeholder="Type your answer" '+(submitted?'disabled':'')+'>';}function typeset(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([host,resultBox]).catch(()=>{});}function renderQuestion(){const q=questions[current];host.innerHTML='<div class="qhead"><div class="qnum">Question '+(current+1)+' of '+questions.length+'</div></div><div class="qtext">'+q.question+'</div>'+control(q,current)+'<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Detailed Solution</h3><strong>Correct answer: '+correctText(q)+'</strong>'+q.solution+'</div><div class="navrow"><button type="button" onclick="markReviewNext()">Mark for Review &amp; Next</button><button type="button" onclick="clearResponse()" '+(submitted?'disabled':'')+'>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" class="next" onclick="nextQ()">Save &amp; Next</button></div>';bindAnswer();if(submitted)showReviewForCurrent();renderBar();typeset();}function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{el.addEventListener('input',()=>{responses[current]=el.value;renderBar();});});}function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}function go(i){saveCurrent();current=i;renderQuestion()}function prevQ(){if(current>0)go(current-1)}function nextQ(){if(current<questions.length-1)go(current+1)}function markReviewNext(){marked[current]=true;nextQ()}function clearResponse(){responses[current]=null;renderQuestion()}function isCorrect(q,a){if(a===null||a==='')return null;return q.type==='mcq'?Number(a)===q.answer:norm(a)===norm(q.typedAnswer);}function showReviewForCurrent(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';if(r===null){note.className='answer-note muted';note.textContent='Unattempted.'}else if(r){note.className='answer-note ok';note.textContent='Correct.'}else{note.className='answer-note bad';note.textContent='Wrong.'}typeset();}function submitTest(){if(submitted)return;saveCurrent();submitted=true;let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++});resultBox.style.display='block';resultBox.innerHTML='<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>'+(c*3-w)+'</strong></div><div class="score-box">Correct<strong>'+c+'</strong></div><div class="score-box">Wrong<strong>'+w+'</strong></div><div class="score-box">Attempted<strong>'+(c+w)+'</strong></div><div class="score-box">Unattempted<strong>'+u+'</strong></div></div>';renderQuestion();resultBox.scrollIntoView({behavior:'smooth'});typeset();}function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest();return}secondsLeft--}renderQuestion();tick();setInterval(tick,1000);</script></body></html>
