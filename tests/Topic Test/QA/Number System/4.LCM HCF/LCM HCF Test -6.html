<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LCM HCF Test -6</title><script>window.MathJax={tex:{inlineMath:[["\\(","\\)"]],displayMath:[["\\[","\\]"]]},svg:{fontCache:"global"}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script><style>:root{--ink:#101820;--muted:#5f6f7a;--line:#b8c3cc;--brand:#0b75bb;--dark:#24313a;--mid:#4089c8;--ok:#60b947;--bad:#e55b25;--review:#7b4ab0;--bg:#eef3f7}*{box-sizing:border-box}html,body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;overflow:hidden}header{height:84px;background:#f3f5f7;border-bottom:1px solid #9eadb9}.topbar{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px}.title{background:var(--dark);color:#fff;padding:10px 18px;display:flex;flex-direction:column;justify-content:center}.title h1{font-size:22px;margin:0}.meta{font-size:15px;color:#dce9ef;margin-top:6px}.timer{display:grid;place-items:center;background:#fff;font-weight:700;font-size:18px}.timer span{font-size:22px}main{height:calc(100vh - 84px);display:grid;grid-template-columns:minmax(0,1fr) 300px;background:#fff}section{min-width:0;border-right:2px solid #41515c}.panel{padding:14px;background:#e5f6fc;display:flex;flex-direction:column}.panel h2{font-size:18px;margin:0 -14px 14px;padding:10px 14px;background:var(--mid);color:#fff}.qbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.qbtn{height:44px;border:1px solid #a9b3bc;background:linear-gradient(#fff,#dfe5ea);border-radius:3px;font-size:18px;font-weight:700;color:#45515a;cursor:pointer}.qbtn.current{background:#e85b21;color:#fff}.qbtn.answered{background:#72bd3b;color:#fff}.qbtn.marked{background:#7950a5;color:#fff;border-radius:50%}.legend{display:grid;gap:10px;margin-top:18px}.dot{display:inline-block;width:20px;height:20px;border:1px solid var(--line);vertical-align:-5px;margin-right:8px}.dot.current{background:#e85b21}.dot.answered{background:#72bd3b}.dot.marked{background:#7950a5;border-radius:50%}.side-submit{margin-top:auto;align-self:center;width:124px;height:42px;border:0;background:#29a8df;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.question-card{height:100%;overflow:auto;padding:0 0 74px}.qhead{min-height:52px;padding:12px 16px;border-bottom:1px solid #c6d0d8;background:#f5f7f9}.qnum{font-size:19px;font-weight:700}.qtext{font-size:20px;font-weight:700;padding:24px;min-height:125px}.options{display:grid;gap:14px;padding:0 24px 18px}.option{display:flex;gap:12px;cursor:pointer;font-size:20px;font-weight:700}.option input{margin-top:7px;transform:scale(1.25)}.typed-answer{width:min(420px,calc(100% - 48px));font-size:20px;font-weight:700;border:1px solid #8795a1;padding:12px;margin-left:24px}.navrow{position:fixed;left:0;right:300px;bottom:0;height:64px;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:10px 16px;background:#eef8fc;border-top:1px solid #b6cbd6}.navrow button{border:1px solid #b6c1ca;padding:11px 18px;font-size:16px;font-weight:700;background:#fff;cursor:pointer}.navrow .next{background:#29a8df;color:#fff}.solution{display:none;margin:16px 24px 0;padding:14px 16px;border:1px solid var(--line);background:#f8fbfd;font-size:17px}.solution h3{margin:0 0 8px;color:var(--brand)}.answer-note{margin:14px 24px 0;font-weight:800}.ok{color:#157347}.bad{color:#b02a37}.muted{color:var(--muted)}#result{display:none;padding:16px;border-bottom:1px solid var(--line)}.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.score-box{border:1px solid var(--line);padding:10px;background:#fbfcfd}.score-box strong{display:block;font-size:24px}mjx-container{font-size:108%!important}@media(max-width:900px){html,body{overflow:auto}header{height:auto}.topbar{grid-template-columns:1fr}.timer{padding:8px}main{height:auto;display:block}.panel{min-height:260px}.qbar{grid-template-columns:repeat(5,1fr)}.question-card{height:auto;min-height:70vh}.navrow{position:static}.score-grid{grid-template-columns:1fr 1fr}}</style></head><body><header><div class="topbar"><div class="title"><h1>LCM HCF Test -6</h1><div class="meta">20 Questions | 40 Minutes | +3 correct, -1 wrong | MCQ and numeric entry</div></div><div class="timer">Time Left: <span id="time">40:00</span></div></div></header><main><section><div id="result"></div><form id="testForm" autocomplete="off"><div id="questionHost" class="question-card"></div></form></section><aside class="panel"><h2>Question Bar</h2><div id="qbar" class="qbar"></div><div class="legend"><span><i class="dot current"></i>Current</span><span><i class="dot answered"></i>Answered</span><span><i class="dot marked"></i>Marked</span></div><button type="button" class="side-submit" onclick="submitTest()">Submit</button></aside></main><script>const questions=[{"type":"mcq","question":"When 13511, 13903 and 14589 are divided by the greatest possible number \\(n\\), each leaves the same remainder \\(m\\). Find \\(n+m\\).","options":["131","183","151","161"],"answer":1,"typedAnswer":"183","solution":"<p>The HCF of the pairwise differences is \\(n=98\\). The common remainder is \\(m=85\\), so \\(n+m=183\\).</p>","no":1,"itemId":74601,"source":"LCM HCF Test 6"},{"type":"mcq","question":"A rectangular courtyard measuring 3.78 m by 5.25 m is paved with identical largest possible square tiles. Find the side of each tile.","options":["14 cm","21 cm","42 cm","56 cm"],"answer":1,"typedAnswer":"21 cm","solution":"<p>Convert to centimetres: \\(\\gcd(378,525)=21\\). The largest tile side is 21 cm.</p>","no":2,"itemId":74602,"source":"LCM HCF Test 6"},{"type":"mcq","question":"The least number greater than the divisors leaves remainder 2 when divided by 4, 6, 10 and 15. Find the sum of its digits.","options":["3","8","4","6"],"answer":1,"typedAnswer":"8","solution":"<p>The LCM is 60, so the least intended number is \\(60+2=62\\). Its digit sum is 8.</p>","no":3,"itemId":74603,"source":"LCM HCF Test 6"},{"type":"mcq","question":"Find the sum of the digits of the least multiple of 13 which leaves remainders 5, 7 and 11 when divided by 6, 8 and 12 respectively.","options":["5","6","7","8"],"answer":3,"typedAnswer":"8","solution":"<p>The number is \\(-1\\pmod{24}\\). The least multiple of 13 satisfying this is 143, whose digit sum is 8.</p>","no":4,"itemId":74604,"source":"LCM HCF Test 6"},{"type":"mcq","question":"Five bells ring together initially and then at intervals of 4, 8, 12, 16 and 20 seconds. How many times will they ring together from just after 12:00 p.m. through 3:00 p.m.?","options":["62","54","42","45"],"answer":3,"typedAnswer":"45","solution":"<p>They coincide every \\(\\operatorname{LCM}(4,8,12,16,20)=240\\) seconds, or 4 minutes. In 180 minutes there are 45 further coincidences.</p>","no":5,"itemId":74605,"source":"LCM HCF Test 6"},{"type":"mcq","question":"Three traffic signals have equal green and red durations. Their green durations are 25, 39 and 60 seconds. If all turn green at 2:00 p.m., when will they next turn green together?","options":["4:00 p.m.","4:10 p.m.","4:20 p.m.","4:30 p.m."],"answer":1,"typedAnswer":"4:10 p.m.","solution":"<p>Their full cycles are 50, 78 and 120 seconds. The LCM is 7800 seconds = 130 minutes, giving 4:10 p.m.</p>","no":6,"itemId":74606,"source":"LCM HCF Test 6"},{"type":"mcq","question":"A number leaves remainders 4, 13 and 20 when divided by 32, 41 and 48, and is divisible by 53. Between which limits can the number lie?","options":["7814 and 7824","7794 and 7804","7864 and 7874","7834 and 7854"],"answer":3,"typedAnswer":"7834 and 7854","solution":"<p>Each remainder is 28 less than its divisor, so \\(N+28\\) is a multiple of 3936. The least solution divisible by 53 is 7844, which lies in the fourth interval.</p>","no":7,"itemId":74607,"source":"LCM HCF Test 6"},{"type":"mcq","question":"Find the HCF of \\(2^{18}-1\\) and \\(2^{20}-1\\).","options":["15","3","65","7"],"answer":1,"typedAnswer":"3","solution":"<p>Use \\(\\gcd(a^m-1,a^n-1)=a^{\\gcd(m,n)}-1\\). This gives \\(2^2-1=3\\).</p>","no":8,"itemId":74608,"source":"LCM HCF Test 6"},{"type":"mcq","question":"Find the HCF of \\(4^{63}+1\\) and \\(4^{45}+1\\).","options":["\\(4^5+1\\)","\\(4^9+1\\)","\\(4^7+1\\)","\\(4^9-1\\)"],"answer":1,"typedAnswer":"\\(4^9+1\\)","solution":"<p>Since \\(\\gcd(63,45)=9\\) and both quotients are odd, the HCF is \\(4^9+1\\).</p>","no":9,"itemId":74609,"source":"LCM HCF Test 6"},{"type":"mcq","question":"Find the HCF of \\(3^{29}-9\\) and \\(3^{38}-9\\).","options":["\\(3^9-1\\)","\\(3^{11}-1\\)","\\(3^{11}-3\\)","\\(3^{11}-9\\)"],"answer":3,"typedAnswer":"\\(3^{11}-9\\)","solution":"<p>Factor out 9: the HCF is \\(9(3^{\\gcd(27,36)}-1)=9(3^9-1)=3^{11}-9\\).</p>","no":10,"itemId":74610,"source":"LCM HCF Test 6"},{"type":"mcq","question":"The HCF of \\(a,b\\) is \\(h\\). It doubles when \\(a\\) is doubled and triples when \\(b\\) is tripled. Which pair has HCF \\(6h\\)?","options":["\\(2a,2b\\)","\\(3a,2b\\)","\\(3a,3b\\)","\\(2a,3b\\)"],"answer":3,"typedAnswer":"\\(2a,3b\\)","solution":"<p>The conditions force the reduced part of \\(b\\) to contain 2 and the reduced part of \\(a\\) to contain 3. Therefore \\(\\gcd(2a,3b)=6h\\).</p>","no":11,"itemId":74611,"source":"LCM HCF Test 6"},{"type":"mcq","question":"Two positive numbers differ by 2858. Dividing the greater by the smaller gives quotient 5 and remainder 178. Find the HCF of the greater number and 3828.","options":["17","13","12","11"],"answer":2,"typedAnswer":"12","solution":"<p>The smaller number is 670 and the greater is 3528. Then \\(\\gcd(3528,3828)=12\\).</p>","no":12,"itemId":74612,"source":"LCM HCF Test 6"},{"type":"mcq","question":"In Euclid's algorithm the quotients are 1, 5 and 8, and the last divisor is 57. Find the LCM of the original numbers.","options":["114509","114517","114511","114513"],"answer":3,"typedAnswer":"114513","solution":"<p>Reversing the algorithm gives the numbers 2793 and 2337. Their LCM is \\(2793\\cdot2337/57=114513\\).</p>","no":13,"itemId":74613,"source":"LCM HCF Test 6"},{"type":"mcq","question":"Let \\(P=\\overline{QQQ}\\) be a three-digit number with the same nonzero digit repeated. Find the HCF of \\(P\\) and 481.","options":["1","13","37","481"],"answer":2,"typedAnswer":"37","solution":"<p>Since \\(P=111Q=3\\cdot37\\cdot Q\\) and \\(481=13\\cdot37\\), while no digit \\(Q\\) is divisible by 13, the HCF is 37.</p>","no":14,"itemId":74614,"source":"LCM HCF Test 6"},{"type":"mcq","question":"Two numbers have sum 25, HCF 3 and LCM 105. Find the sum of their reciprocals.","options":["\\(\\frac3{56}\\)","\\(\\frac6{35}\\)","\\(\\frac5{63}\\)","\\(\\frac5{36}\\)"],"answer":2,"typedAnswer":"\\(\\frac5{63}\\)","solution":"<p>Their product is \\(3\\cdot105=315\\). Thus the reciprocal sum is \\(25/315=5/63\\).</p>","no":15,"itemId":74615,"source":"LCM HCF Test 6"},{"type":"mcq","question":"Let \\(A\\) be 75% of a three-digit number equal to 20 times the HCF of 44 and 55, and let \\(B=25^2\\). Find \\(A+B\\).","options":["740","780","790","750"],"answer":2,"typedAnswer":"790","solution":"<p>The HCF is 11, so the number is 220 and \\(A=165\\). Also \\(B=625\\), giving 790.</p>","no":16,"itemId":74616,"source":"LCM HCF Test 6"},{"type":"mcq","question":"A forester plants 76 apple, 114 banana and 152 mango trees in separate rows with the same number in every row. Find the minimum number of rows.","options":["10","11","12","9"],"answer":3,"typedAnswer":"9","solution":"<p>The maximum trees per row are \\(\\gcd(76,114,152)=38\\). The row count is \\(2+3+4=9\\).</p>","no":17,"itemId":74617,"source":"LCM HCF Test 6"},{"type":"mcq","question":"The greatest number \\(V\\) divides 6305, 4505 and 905 leaving the same remainder. Find the product of the digits of \\(V\\).","options":["8","0","2","4"],"answer":1,"typedAnswer":"0","solution":"<p>The HCF of the pairwise differences is \\(V=1800\\). Its digit product is 0.</p>","no":18,"itemId":74618,"source":"LCM HCF Test 6"},{"type":"mcq","question":"Find the smallest four-digit number that leaves remainder 5 when divided by 7, 10, 14, 15 and 21.","options":["1150","1055","1050","1100"],"answer":1,"typedAnswer":"1055","solution":"<p>The LCM is 210. The smallest four-digit number of the form \\(210k+5\\) is 1055.</p>","no":19,"itemId":74619,"source":"LCM HCF Test 6"},{"type":"mcq","question":"Three times 20% of \\(N\\) is divisible by 12, 4, 8 and 6. Find the least positive integer \\(N\\).","options":["40","14.4","24","48"],"answer":0,"typedAnswer":"40","solution":"<p>Three times 20% is \\(3N/5\\). It must be a multiple of 24, so the least integer \\(N\\) is 40.</p>","no":20,"itemId":74620,"source":"LCM HCF Test 6"}];let current=0,submitted=false,secondsLeft=40*60;const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false),labels=['A','B','C','D'];const host=document.getElementById('questionHost'),qbar=document.getElementById('qbar'),resultBox=document.getElementById('result');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function norm(s){return String(s??'').trim().toLowerCase().replace(/[, ]/g,'').replace(/\.0+$/,'');}function correctText(q){return q.type==='mcq'?'('+labels[q.answer]+') '+q.options[q.answer]:q.typedAnswer;}function renderBar(){qbar.innerHTML=questions.map((q,i)=>'<button type="button" class="qbtn '+(i===current?'current ':'')+(responses[i]!==null&&responses[i]!==''?'answered ':'')+(marked[i]?'marked ':'')+'" onclick="go('+i+')">'+(i+1)+'</button>').join('');}function control(q,i){if(q.type==='mcq')return '<div class="options">'+q.options.map((op,j)=>'<label class="option"><input type="radio" name="answer_'+i+'" value="'+j+'" '+(responses[i]===String(j)?'checked':'')+' '+(submitted?'disabled':'')+'><span>('+labels[j]+') '+op+'</span></label>').join('')+'</div>';return '<input class="typed-answer" name="answer_'+i+'" value="'+esc(responses[i]||'')+'" placeholder="Type your answer" '+(submitted?'disabled':'')+'>';}function typeset(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([host,resultBox]).catch(()=>{});}function renderQuestion(){const q=questions[current];host.innerHTML='<div class="qhead"><div class="qnum">Question '+(current+1)+' of '+questions.length+'</div></div><div class="qtext">'+q.question+'</div>'+control(q,current)+'<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Detailed Solution</h3><strong>Correct answer: '+correctText(q)+'</strong>'+q.solution+'</div><div class="navrow"><button type="button" onclick="markReviewNext()">Mark for Review &amp; Next</button><button type="button" onclick="clearResponse()" '+(submitted?'disabled':'')+'>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" class="next" onclick="nextQ()">Save &amp; Next</button></div>';bindAnswer();if(submitted)showReviewForCurrent();renderBar();typeset();}function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{el.addEventListener('input',()=>{responses[current]=el.value;renderBar();});});}function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}function go(i){saveCurrent();current=i;renderQuestion()}function prevQ(){if(current>0)go(current-1)}function nextQ(){if(current<questions.length-1)go(current+1)}function markReviewNext(){marked[current]=true;nextQ()}function clearResponse(){responses[current]=null;renderQuestion()}function isCorrect(q,a){if(a===null||a==='')return null;return q.type==='mcq'?Number(a)===q.answer:norm(a)===norm(q.typedAnswer);}function showReviewForCurrent(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';if(r===null){note.className='answer-note muted';note.textContent='Unattempted.'}else if(r){note.className='answer-note ok';note.textContent='Correct.'}else{note.className='answer-note bad';note.textContent='Wrong.'}typeset();}function submitTest(){if(submitted)return;saveCurrent();submitted=true;let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++});resultBox.style.display='block';resultBox.innerHTML='<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>'+(c*3-w)+'</strong></div><div class="score-box">Correct<strong>'+c+'</strong></div><div class="score-box">Wrong<strong>'+w+'</strong></div><div class="score-box">Attempted<strong>'+(c+w)+'</strong></div><div class="score-box">Unattempted<strong>'+u+'</strong></div></div>';renderQuestion();resultBox.scrollIntoView({behavior:'smooth'});typeset();}function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest();return}secondsLeft--}renderQuestion();tick();setInterval(tick,1000);</script></body></html>
