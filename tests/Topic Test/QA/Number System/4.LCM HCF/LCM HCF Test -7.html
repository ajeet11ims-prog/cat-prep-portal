<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LCM HCF Test -7</title><script>window.MathJax={tex:{inlineMath:[["\\(","\\)"]],displayMath:[["\\[","\\]"]]},svg:{fontCache:"global"}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script><style>:root{--ink:#101820;--muted:#5f6f7a;--line:#b8c3cc;--brand:#0b75bb;--dark:#24313a;--mid:#4089c8;--ok:#60b947;--bad:#e55b25;--review:#7b4ab0;--bg:#eef3f7}*{box-sizing:border-box}html,body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;overflow:hidden}header{height:84px;background:#f3f5f7;border-bottom:1px solid #9eadb9}.topbar{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px}.title{background:var(--dark);color:#fff;padding:10px 18px;display:flex;flex-direction:column;justify-content:center}.title h1{font-size:22px;margin:0}.meta{font-size:15px;color:#dce9ef;margin-top:6px}.timer{display:grid;place-items:center;background:#fff;font-weight:700;font-size:18px}.timer span{font-size:22px}main{height:calc(100vh - 84px);display:grid;grid-template-columns:minmax(0,1fr) 300px;background:#fff}section{min-width:0;border-right:2px solid #41515c}.panel{padding:14px;background:#e5f6fc;display:flex;flex-direction:column}.panel h2{font-size:18px;margin:0 -14px 14px;padding:10px 14px;background:var(--mid);color:#fff}.qbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.qbtn{height:44px;border:1px solid #a9b3bc;background:linear-gradient(#fff,#dfe5ea);border-radius:3px;font-size:18px;font-weight:700;color:#45515a;cursor:pointer}.qbtn.current{background:#e85b21;color:#fff}.qbtn.answered{background:#72bd3b;color:#fff}.qbtn.marked{background:#7950a5;color:#fff;border-radius:50%}.legend{display:grid;gap:10px;margin-top:18px}.dot{display:inline-block;width:20px;height:20px;border:1px solid var(--line);vertical-align:-5px;margin-right:8px}.dot.current{background:#e85b21}.dot.answered{background:#72bd3b}.dot.marked{background:#7950a5;border-radius:50%}.side-submit{margin-top:auto;align-self:center;width:124px;height:42px;border:0;background:#29a8df;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.question-card{height:100%;overflow:auto;padding:0 0 74px}.qhead{min-height:52px;padding:12px 16px;border-bottom:1px solid #c6d0d8;background:#f5f7f9}.qnum{font-size:19px;font-weight:700}.qtext{font-size:20px;font-weight:700;padding:24px;min-height:125px}.options{display:grid;gap:14px;padding:0 24px 18px}.option{display:flex;gap:12px;cursor:pointer;font-size:20px;font-weight:700}.option input{margin-top:7px;transform:scale(1.25)}.typed-answer{width:min(420px,calc(100% - 48px));font-size:20px;font-weight:700;border:1px solid #8795a1;padding:12px;margin-left:24px}.navrow{position:fixed;left:0;right:300px;bottom:0;height:64px;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:10px 16px;background:#eef8fc;border-top:1px solid #b6cbd6}.navrow button{border:1px solid #b6c1ca;padding:11px 18px;font-size:16px;font-weight:700;background:#fff;cursor:pointer}.navrow .next{background:#29a8df;color:#fff}.solution{display:none;margin:16px 24px 0;padding:14px 16px;border:1px solid var(--line);background:#f8fbfd;font-size:17px}.solution h3{margin:0 0 8px;color:var(--brand)}.answer-note{margin:14px 24px 0;font-weight:800}.ok{color:#157347}.bad{color:#b02a37}.muted{color:var(--muted)}#result{display:none;padding:16px;border-bottom:1px solid var(--line)}.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.score-box{border:1px solid var(--line);padding:10px;background:#fbfcfd}.score-box strong{display:block;font-size:24px}mjx-container{font-size:108%!important}@media(max-width:900px){html,body{overflow:auto}header{height:auto}.topbar{grid-template-columns:1fr}.timer{padding:8px}main{height:auto;display:block}.panel{min-height:260px}.qbar{grid-template-columns:repeat(5,1fr)}.question-card{height:auto;min-height:70vh}.navrow{position:static}.score-grid{grid-template-columns:1fr 1fr}}</style></head><body><header><div class="topbar"><div class="title"><h1>LCM HCF Test -7</h1><div class="meta">20 Questions | 40 Minutes | +3 correct, -1 wrong | MCQ and numeric entry</div></div><div class="timer">Time Left: <span id="time">40:00</span></div></div></header><main><section><div id="result"></div><form id="testForm" autocomplete="off"><div id="questionHost" class="question-card"></div></form></section><aside class="panel"><h2>Question Bar</h2><div id="qbar" class="qbar"></div><div class="legend"><span><i class="dot current"></i>Current</span><span><i class="dot answered"></i>Answered</span><span><i class="dot marked"></i>Marked</span></div><button type="button" class="side-submit" onclick="submitTest()">Submit</button></aside></main><script>const questions=[{"type":"mcq","question":"The sum of two numbers is 36 and their HCF is 4. How many unordered pairs are possible?","options":["2","4","1","3"],"answer":3,"typedAnswer":"3","solution":"<p>Write the numbers as \\(4a,4b\\), where \\(a+b=9\\) and \\(a,b\\) are coprime. The pairs are (1,8), (2,7) and (4,5): 3.</p>","no":1,"itemId":74701,"source":"LCM HCF Test 7"},{"type":"mcq","question":"The HCF of two numbers is 21 and their LCM is 221 times the HCF. If one number lies between 200 and 300, find the digit sum of the other.","options":["14","17","18","15"],"answer":3,"typedAnswer":"15","solution":"<p>The coprime factors are 13 and 17. The numbers are 273 and 357; the latter has digit sum 15.</p>","no":2,"itemId":74702,"source":"LCM HCF Test 7"},{"type":"mcq","question":"The LCM of two numbers is 495, their HCF is 5 and their sum is 100. Find their difference.","options":["20","5","10","15"],"answer":2,"typedAnswer":"10","solution":"<p>The numbers have product 2475 and sum 100, so they are 45 and 55. Their difference is 10.</p>","no":3,"itemId":74703,"source":"LCM HCF Test 7"},{"type":"mcq","question":"The LCM of two numbers is 25 times their HCF. If their product is 16900, find their LCM.","options":["556","650","580","641"],"answer":1,"typedAnswer":"650","solution":"<p>Since product = HCF × LCM, \\(25h^2=16900\\), giving \\(h=26\\) and LCM = 650.</p>","no":4,"itemId":74704,"source":"LCM HCF Test 7"},{"type":"mcq","question":"The LCM of two numbers is 8372 and their HCF is 28. If one number is 364, find the other.","options":["364","8372","644","161"],"answer":2,"typedAnswer":"644","solution":"<p>The other number is \\(8372\\cdot28/364=644\\).</p>","no":5,"itemId":74705,"source":"LCM HCF Test 7"},{"type":"mcq","question":"The HCF of two numbers is 17 and their remaining coprime factors are 11 and 19. Find the smaller number.","options":["209","187","323","306"],"answer":1,"typedAnswer":"187","solution":"<p>The numbers are \\(17\\cdot11=187\\) and \\(17\\cdot19=323\\).</p>","no":6,"itemId":74706,"source":"LCM HCF Test 7"},{"type":"mcq","question":"Three numbers are in the ratio 5:7:9 and their LCM is 1260. Find the difference between the largest and smallest.","options":["20","24","16","32"],"answer":2,"typedAnswer":"16","solution":"<p>The LCM of the ratio terms is 315, so the scale factor is 4. The numbers are 20, 28 and 36; the difference is 16.</p>","no":7,"itemId":74707,"source":"LCM HCF Test 7"},{"type":"mcq","question":"Find the HCF of 0.05, 0.5, 0.25 and 1.25.","options":["1.25","0.25","0.05","0.5"],"answer":2,"typedAnswer":"0.05","solution":"<p>Scaling by 100 gives 5, 50, 25 and 125, whose HCF is 5. Scale back to obtain 0.05.</p>","no":8,"itemId":74708,"source":"LCM HCF Test 7"},{"type":"mcq","question":"Find the HCF of \\(2^2\\cdot3^5\\cdot5^3\\) and \\(2^4\\cdot3^2\\cdot5\\).","options":["\\(2^2\\cdot3^2\\cdot9\\)","\\(2^2\\cdot3^2\\cdot5\\)","\\(2^2\\cdot3^2\\cdot7\\)","\\(2^2\\cdot3^2\\cdot8\\)"],"answer":1,"typedAnswer":"\\(2^2\\cdot3^2\\cdot5\\)","solution":"<p>Take the smaller exponent of each prime: \\(2^2\\cdot3^2\\cdot5\\).</p>","no":9,"itemId":74709,"source":"LCM HCF Test 7"},{"type":"mcq","question":"Find the HCF of 105, 335 and 465.","options":["11","5","7","3"],"answer":1,"typedAnswer":"5","solution":"<p>The greatest factor common to all three numbers is 5.</p>","no":10,"itemId":74710,"source":"LCM HCF Test 7"},{"type":"mcq","question":"The LCM of 48 and 64 is how many times the HCF of 12 and 18?","options":["28","32","24","16"],"answer":1,"typedAnswer":"32","solution":"<p>The LCM is 192 and the HCF is 6. Their ratio is 32.</p>","no":11,"itemId":74711,"source":"LCM HCF Test 7"},{"type":"mcq","question":"Find the LCM of 0.126, 0.36 and 0.96.","options":["20160","20.16","201.60","2.016"],"answer":1,"typedAnswer":"20.16","solution":"<p>Scale by 1000. The LCM of 126, 360 and 960 is 20160; scaling back gives 20.16.</p>","no":12,"itemId":74712,"source":"LCM HCF Test 7"},{"type":"mcq","question":"Find the LCM of \\(\\frac38,\\frac5{16},\\frac72\\).","options":["\\(101\\frac12\\)","\\(52\\frac12\\)","\\(28\\frac12\\)","\\(25\\frac14\\)"],"answer":1,"typedAnswer":"\\(52\\frac12\\)","solution":"<p>LCM of numerators is 105 and HCF of denominators is 2, so the LCM is \\(105/2=52\\frac12\\).</p>","no":13,"itemId":74713,"source":"LCM HCF Test 7"},{"type":"mcq","question":"Find the LCM of 90, 128 and 144.","options":["5764","5758","5760","5762"],"answer":2,"typedAnswer":"5760","solution":"<p>The highest prime powers are \\(2^7,3^2,5\\), giving \\(2^7\\cdot3^2\\cdot5=5760\\).</p>","no":14,"itemId":74714,"source":"LCM HCF Test 7"},{"type":"mcq","question":"Find the HCF of \\(\\frac13,\\frac23,\\frac29,\\frac3{12}\\).","options":["\\(\\frac1{12}\\)","\\(\\frac1{60}\\)","\\(\\frac1{48}\\)","\\(\\frac1{36}\\)"],"answer":3,"typedAnswer":"\\(\\frac1{36}\\)","solution":"<p>The HCF of numerators is 1 and the LCM of denominators is 36, so the answer is \\(1/36\\).</p>","no":15,"itemId":74715,"source":"LCM HCF Test 7"},{"type":"mcq","question":"Find the HCF of 3.6, 0.54 and 1.08.","options":["1.8","18","0.018","0.18"],"answer":3,"typedAnswer":"0.18","solution":"<p>Scale by 100: \\(\\gcd(360,54,108)=18\\). Scaling back gives 0.18.</p>","no":16,"itemId":74716,"source":"LCM HCF Test 7"},{"type":"mcq","question":"Find the LCM of 9, 8.1, 0.27 and 0.09.","options":["801","81","8100","810"],"answer":1,"typedAnswer":"81","solution":"<p>Scale by 100. The LCM of 900, 810, 27 and 9 is 8100; scaling back gives 81.</p>","no":17,"itemId":74717,"source":"LCM HCF Test 7"},{"type":"mcq","question":"Find the smallest number which leaves remainders 4, 6 and 8 when divided by 15, 17 and 19 respectively.","options":["4548","4845","4834","4832"],"answer":2,"typedAnswer":"4834","solution":"<p>Each remainder is 11 below the divisor, so \\(N+11\\) is their LCM, 4845. Hence \\(N=4834\\).</p>","no":18,"itemId":74718,"source":"LCM HCF Test 7"},{"type":"mcq","question":"Find the largest positive integer that divides 216, 358 and 454 leaving remainders 9, 13 and 17 respectively.","options":["27","17","23","29"],"answer":2,"typedAnswer":"23","solution":"<p>Take \\(\\gcd(207,345,437)=23\\).</p>","no":19,"itemId":74719,"source":"LCM HCF Test 7"},{"type":"mcq","question":"Two numbers are in the ratio 7:8 and their LCM is 280. Find the numbers.","options":["30 and 35","35 and 40","40 and 45","35 and 45"],"answer":1,"typedAnswer":"35 and 40","solution":"<p>Let the numbers be \\(7k,8k\\). Their LCM is \\(56k=280\\), so \\(k=5\\) and the numbers are 35 and 40.</p>","no":20,"itemId":74720,"source":"LCM HCF Test 7"}];let current=0,submitted=false,secondsLeft=40*60;const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false),labels=['A','B','C','D'];const host=document.getElementById('questionHost'),qbar=document.getElementById('qbar'),resultBox=document.getElementById('result');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function norm(s){return String(s??'').trim().toLowerCase().replace(/[, ]/g,'').replace(/\.0+$/,'');}function correctText(q){return q.type==='mcq'?'('+labels[q.answer]+') '+q.options[q.answer]:q.typedAnswer;}function renderBar(){qbar.innerHTML=questions.map((q,i)=>'<button type="button" class="qbtn '+(i===current?'current ':'')+(responses[i]!==null&&responses[i]!==''?'answered ':'')+(marked[i]?'marked ':'')+'" onclick="go('+i+')">'+(i+1)+'</button>').join('');}function control(q,i){if(q.type==='mcq')return '<div class="options">'+q.options.map((op,j)=>'<label class="option"><input type="radio" name="answer_'+i+'" value="'+j+'" '+(responses[i]===String(j)?'checked':'')+' '+(submitted?'disabled':'')+'><span>('+labels[j]+') '+op+'</span></label>').join('')+'</div>';return '<input class="typed-answer" name="answer_'+i+'" value="'+esc(responses[i]||'')+'" placeholder="Type your answer" '+(submitted?'disabled':'')+'>';}function typeset(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([host,resultBox]).catch(()=>{});}function renderQuestion(){const q=questions[current];host.innerHTML='<div class="qhead"><div class="qnum">Question '+(current+1)+' of '+questions.length+'</div></div><div class="qtext">'+q.question+'</div>'+control(q,current)+'<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Detailed Solution</h3><strong>Correct answer: '+correctText(q)+'</strong>'+q.solution+'</div><div class="navrow"><button type="button" onclick="markReviewNext()">Mark for Review &amp; Next</button><button type="button" onclick="clearResponse()" '+(submitted?'disabled':'')+'>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" class="next" onclick="nextQ()">Save &amp; Next</button></div>';bindAnswer();if(submitted)showReviewForCurrent();renderBar();typeset();}function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{el.addEventListener('input',()=>{responses[current]=el.value;renderBar();});});}function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}function go(i){saveCurrent();current=i;renderQuestion()}function prevQ(){if(current>0)go(current-1)}function nextQ(){if(current<questions.length-1)go(current+1)}function markReviewNext(){marked[current]=true;nextQ()}function clearResponse(){responses[current]=null;renderQuestion()}function isCorrect(q,a){if(a===null||a==='')return null;return q.type==='mcq'?Number(a)===q.answer:norm(a)===norm(q.typedAnswer);}function showReviewForCurrent(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';if(r===null){note.className='answer-note muted';note.textContent='Unattempted.'}else if(r){note.className='answer-note ok';note.textContent='Correct.'}else{note.className='answer-note bad';note.textContent='Wrong.'}typeset();}function submitTest(){if(submitted)return;saveCurrent();submitted=true;let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++});resultBox.style.display='block';resultBox.innerHTML='<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>'+(c*3-w)+'</strong></div><div class="score-box">Correct<strong>'+c+'</strong></div><div class="score-box">Wrong<strong>'+w+'</strong></div><div class="score-box">Attempted<strong>'+(c+w)+'</strong></div><div class="score-box">Unattempted<strong>'+u+'</strong></div></div>';renderQuestion();resultBox.scrollIntoView({behavior:'smooth'});typeset();}function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest();return}secondsLeft--}renderQuestion();tick();setInterval(tick,1000);</script></body></html>
