<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LCM HCF Test -8</title><script>window.MathJax={tex:{inlineMath:[["\\(","\\)"]],displayMath:[["\\[","\\]"]]},svg:{fontCache:"global"}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script><style>:root{--ink:#101820;--muted:#5f6f7a;--line:#b8c3cc;--brand:#0b75bb;--dark:#24313a;--mid:#4089c8;--ok:#60b947;--bad:#e55b25;--review:#7b4ab0;--bg:#eef3f7}*{box-sizing:border-box}html,body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;overflow:hidden}header{height:84px;background:#f3f5f7;border-bottom:1px solid #9eadb9}.topbar{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px}.title{background:var(--dark);color:#fff;padding:10px 18px;display:flex;flex-direction:column;justify-content:center}.title h1{font-size:22px;margin:0}.meta{font-size:15px;color:#dce9ef;margin-top:6px}.timer{display:grid;place-items:center;background:#fff;font-weight:700;font-size:18px}.timer span{font-size:22px}main{height:calc(100vh - 84px);display:grid;grid-template-columns:minmax(0,1fr) 300px;background:#fff}section{min-width:0;border-right:2px solid #41515c}.panel{padding:14px;background:#e5f6fc;display:flex;flex-direction:column}.panel h2{font-size:18px;margin:0 -14px 14px;padding:10px 14px;background:var(--mid);color:#fff}.qbar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.qbtn{height:44px;border:1px solid #a9b3bc;background:linear-gradient(#fff,#dfe5ea);border-radius:3px;font-size:18px;font-weight:700;color:#45515a;cursor:pointer}.qbtn.current{background:#e85b21;color:#fff}.qbtn.answered{background:#72bd3b;color:#fff}.qbtn.marked{background:#7950a5;color:#fff;border-radius:50%}.legend{display:grid;gap:10px;margin-top:18px}.dot{display:inline-block;width:20px;height:20px;border:1px solid var(--line);vertical-align:-5px;margin-right:8px}.dot.current{background:#e85b21}.dot.answered{background:#72bd3b}.dot.marked{background:#7950a5;border-radius:50%}.side-submit{margin-top:auto;align-self:center;width:124px;height:42px;border:0;background:#29a8df;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.question-card{height:100%;overflow:auto;padding:0 0 74px}.qhead{min-height:52px;padding:12px 16px;border-bottom:1px solid #c6d0d8;background:#f5f7f9}.qnum{font-size:19px;font-weight:700}.qtext{font-size:20px;font-weight:700;padding:24px;min-height:125px}.options{display:grid;gap:14px;padding:0 24px 18px}.option{display:flex;gap:12px;cursor:pointer;font-size:20px;font-weight:700}.option input{margin-top:7px;transform:scale(1.25)}.typed-answer{width:min(420px,calc(100% - 48px));font-size:20px;font-weight:700;border:1px solid #8795a1;padding:12px;margin-left:24px}.navrow{position:fixed;left:0;right:300px;bottom:0;height:64px;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:10px 16px;background:#eef8fc;border-top:1px solid #b6cbd6}.navrow button{border:1px solid #b6c1ca;padding:11px 18px;font-size:16px;font-weight:700;background:#fff;cursor:pointer}.navrow .next{background:#29a8df;color:#fff}.solution{display:none;margin:16px 24px 0;padding:14px 16px;border:1px solid var(--line);background:#f8fbfd;font-size:17px}.solution h3{margin:0 0 8px;color:var(--brand)}.answer-note{margin:14px 24px 0;font-weight:800}.ok{color:#157347}.bad{color:#b02a37}.muted{color:var(--muted)}#result{display:none;padding:16px;border-bottom:1px solid var(--line)}.score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.score-box{border:1px solid var(--line);padding:10px;background:#fbfcfd}.score-box strong{display:block;font-size:24px}mjx-container{font-size:108%!important}@media(max-width:900px){html,body{overflow:auto}header{height:auto}.topbar{grid-template-columns:1fr}.timer{padding:8px}main{height:auto;display:block}.panel{min-height:260px}.qbar{grid-template-columns:repeat(5,1fr)}.question-card{height:auto;min-height:70vh}.navrow{position:static}.score-grid{grid-template-columns:1fr 1fr}}</style></head><body><header><div class="topbar"><div class="title"><h1>LCM HCF Test -8</h1><div class="meta">20 Questions | 40 Minutes | +3 correct, -1 wrong | MCQ and numeric entry</div></div><div class="timer">Time Left: <span id="time">40:00</span></div></div></header><main><section><div id="result"></div><form id="testForm" autocomplete="off"><div id="questionHost" class="question-card"></div></form></section><aside class="panel"><h2>Question Bar</h2><div id="qbar" class="qbar"></div><div class="legend"><span><i class="dot current"></i>Current</span><span><i class="dot answered"></i>Answered</span><span><i class="dot marked"></i>Marked</span></div><button type="button" class="side-submit" onclick="submitTest()">Submit</button></aside></main><script>const questions=[{"type":"mcq","question":"The LCM of \\(a\\) and \\(b\\) is 42. Find the LCM of \\(5a\\) and \\(11b\\).","options":["2310","4620","210","462"],"answer":0,"typedAnswer":"2310","solution":"<p>Neither 5 nor 11 divides 42, so both new prime factors enter the LCM. It is \\(5\\cdot11\\cdot42=2310\\).</p>","no":1,"itemId":74801,"source":"LCM HCF Test 8"},{"type":"mcq","question":"The HCF of two numbers is 4 and their LCM is 150. If one number is 25, find the other.","options":["52","28","25","24"],"answer":3,"typedAnswer":"24","solution":"<p>The product of the numbers is \\(4\\cdot150=600\\). The other number is \\(600/25=24\\).</p>","no":2,"itemId":74802,"source":"LCM HCF Test 8"},{"type":"mcq","question":"Find the smallest positive integer that gives an integer quotient when divided by each of \\(\\frac23,\\frac35,\\frac6{10}\\).","options":["\\(\\frac6{30}\\)","\\(\\frac1{30}\\)","6","\\(\\frac64\\)"],"answer":2,"typedAnswer":"6","solution":"<p>The rational LCM is the LCM of numerators over the HCF of denominators: \\(6/1=6\\).</p>","no":3,"itemId":74803,"source":"LCM HCF Test 8"},{"type":"mcq","question":"Five bells ring at intervals of 3, 5, 9, 10 and 15 minutes. Starting together at 10:00 a.m., when will they next ring together?","options":["11:15 a.m.","11:30 a.m.","11:15 p.m.","11:30 p.m."],"answer":1,"typedAnswer":"11:30 a.m.","solution":"<p>Their LCM is 90 minutes, so the next common ringing is at 11:30 a.m.</p>","no":4,"itemId":74804,"source":"LCM HCF Test 8"},{"type":"tita","question":"A farmer has 110 apple, 66 mango and 44 banana trees. Separate rows must contain equal numbers of a single tree type. Find the minimum number of rows.","typedAnswer":"10","solution":"<p>The maximum trees per row are \\(\\gcd(110,66,44)=22\\). The row count is \\(5+3+2=10\\).</p>","no":5,"itemId":74805,"source":"LCM HCF Test 8"},{"type":"tita","question":"Two two-digit numbers have HCF 7 and LCM 588. Find the smaller number.","typedAnswer":"49","solution":"<p>Write the numbers as \\(7a,7b\\), where \\(ab=84\\) and \\(a,b\\) are coprime. The only pair making both numbers two-digit is \\(a,b=7,12\\), giving 49 and 84.</p>","no":6,"itemId":74806,"source":"LCM HCF Test 8"},{"type":"mcq","question":"The HCF of two integers is 7 and their LCM is 588. How many unordered pairs are possible?","options":["2","3","4","6"],"answer":2,"typedAnswer":"4","solution":"<p>The reduced factors have product 84 and must be coprime. The pairs are (1,84), (3,28), (4,21) and (7,12): 4.</p>","no":7,"itemId":74807,"source":"LCM HCF Test 8"},{"type":"mcq","question":"Find the smallest positive integer greater than the divisors which leaves remainders 3, 4, 7 and 8 when divided by 4, 5, 8 and 9.","options":["119","319","359","719"],"answer":2,"typedAnswer":"359","solution":"<p>Each remainder is one below the divisor, so \\(N+1=\\operatorname{LCM}(4,5,8,9)=360\\). Thus \\(N=359\\).</p>","no":8,"itemId":74808,"source":"LCM HCF Test 8"},{"type":"tita","question":"A school has fewer than 5000 students. Division into teams of 9, 10, 12 or 25 leaves 4 students, but division into teams of 11 leaves none. Find the maximum number of complete teams of 12.","typedAnswer":"150","solution":"<p>The student count is \\(900k+4\\). The largest solution below 5000 divisible by 11 is 1804, which forms 150 complete teams of 12 with 4 left.</p>","no":9,"itemId":74809,"source":"LCM HCF Test 8"},{"type":"mcq","question":"Find the least number greater than 36 which leaves remainder 4 when divided by 16, 24 and 36.","options":["144","140","148","152"],"answer":2,"typedAnswer":"148","solution":"<p>The LCM is 144. The least intended number is \\(144+4=148\\).</p>","no":10,"itemId":74810,"source":"LCM HCF Test 8"},{"type":"mcq","question":"Find the greatest five-digit number divisible by 48, 60 and 64.","options":["96000","99940","99840","98940"],"answer":2,"typedAnswer":"99840","solution":"<p>Their LCM is 960. The greatest five-digit multiple is \\(960\\cdot104=99840\\).</p>","no":11,"itemId":74811,"source":"LCM HCF Test 8"},{"type":"mcq","question":"Find the greatest length that measures exactly 1 m 8 cm, 2 m 43 cm, 1 m 35 cm and 1 m 89 cm.","options":["9 cm","11 cm","49 cm","27 cm"],"answer":3,"typedAnswer":"27 cm","solution":"<p>In centimetres the lengths are 108, 243, 135 and 189. Their HCF is 27 cm.</p>","no":12,"itemId":74812,"source":"LCM HCF Test 8"},{"type":"mcq","question":"Four bells ring at intervals of 6, 8, 12 and 18 seconds. After how many seconds will they ring together again?","options":["48","60","84","72"],"answer":3,"typedAnswer":"72","solution":"<p>The LCM of 6, 8, 12 and 18 is 72 seconds.</p>","no":13,"itemId":74813,"source":"LCM HCF Test 8"},{"type":"mcq","question":"Find the HCF of 84, 126 and 210.","options":["21","42","63","84"],"answer":1,"typedAnswer":"42","solution":"<p>The greatest common factor of the three numbers is 42.</p>","no":14,"itemId":74814,"source":"LCM HCF Test 8"},{"type":"mcq","question":"Find the LCM of 18, 28 and 45.","options":["630","1260","2520","840"],"answer":1,"typedAnswer":"1260","solution":"<p>The highest prime powers are \\(2^2,3^2,5,7\\), giving 1260.</p>","no":15,"itemId":74815,"source":"LCM HCF Test 8"},{"type":"mcq","question":"Two numbers have HCF 12 and LCM 420. If one number is 84, find the other.","options":["48","60","72","120"],"answer":1,"typedAnswer":"60","solution":"<p>The other number is \\(12\\cdot420/84=60\\).</p>","no":16,"itemId":74816,"source":"LCM HCF Test 8"},{"type":"mcq","question":"Find the least number greater than 30 which leaves remainder 5 when divided by 12, 18 and 30.","options":["175","180","185","195"],"answer":2,"typedAnswer":"185","solution":"<p>The LCM is 180, so the least intended number is \\(180+5=185\\).</p>","no":17,"itemId":74817,"source":"LCM HCF Test 8"},{"type":"mcq","question":"Find the greatest number that divides 1001 and 1365 leaving the same remainder.","options":["182","273","364","455"],"answer":2,"typedAnswer":"364","solution":"<p>The required divisor is the difference \\(1365-1001=364\\), which leaves the same remainder on both numbers.</p>","no":18,"itemId":74818,"source":"LCM HCF Test 8"},{"type":"mcq","question":"A rectangular floor is 4.2 m by 6.3 m. Find the side of the largest square tile that covers it exactly.","options":["0.7 m","1.4 m","2.1 m","3.5 m"],"answer":2,"typedAnswer":"2.1 m","solution":"<p>In decimetres the dimensions are 42 and 63. Their HCF is 21 dm = 2.1 m.</p>","no":19,"itemId":74819,"source":"LCM HCF Test 8"},{"type":"mcq","question":"Three bells ring at intervals of 14, 18 and 24 seconds. After how many seconds will they next ring together?","options":["252","336","504","1008"],"answer":2,"typedAnswer":"504","solution":"<p>The LCM is \\(2^3\\cdot3^2\\cdot7=504\\) seconds.</p>","no":20,"itemId":74820,"source":"LCM HCF Test 8"}];let current=0,submitted=false,secondsLeft=40*60;const responses=Array(questions.length).fill(null),marked=Array(questions.length).fill(false),labels=['A','B','C','D'];const host=document.getElementById('questionHost'),qbar=document.getElementById('qbar'),resultBox=document.getElementById('result');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function norm(s){return String(s??'').trim().toLowerCase().replace(/[, ]/g,'').replace(/\.0+$/,'');}function correctText(q){return q.type==='mcq'?'('+labels[q.answer]+') '+q.options[q.answer]:q.typedAnswer;}function renderBar(){qbar.innerHTML=questions.map((q,i)=>'<button type="button" class="qbtn '+(i===current?'current ':'')+(responses[i]!==null&&responses[i]!==''?'answered ':'')+(marked[i]?'marked ':'')+'" onclick="go('+i+')">'+(i+1)+'</button>').join('');}function control(q,i){if(q.type==='mcq')return '<div class="options">'+q.options.map((op,j)=>'<label class="option"><input type="radio" name="answer_'+i+'" value="'+j+'" '+(responses[i]===String(j)?'checked':'')+' '+(submitted?'disabled':'')+'><span>('+labels[j]+') '+op+'</span></label>').join('')+'</div>';return '<input class="typed-answer" name="answer_'+i+'" value="'+esc(responses[i]||'')+'" placeholder="Type your answer" '+(submitted?'disabled':'')+'>';}function typeset(){if(window.MathJax&&MathJax.typesetPromise)MathJax.typesetPromise([host,resultBox]).catch(()=>{});}function renderQuestion(){const q=questions[current];host.innerHTML='<div class="qhead"><div class="qnum">Question '+(current+1)+' of '+questions.length+'</div></div><div class="qtext">'+q.question+'</div>'+control(q,current)+'<div id="note" class="answer-note"></div><div id="solution" class="solution"><h3>Detailed Solution</h3><strong>Correct answer: '+correctText(q)+'</strong>'+q.solution+'</div><div class="navrow"><button type="button" onclick="markReviewNext()">Mark for Review &amp; Next</button><button type="button" onclick="clearResponse()" '+(submitted?'disabled':'')+'>Clear Response</button><button type="button" onclick="prevQ()">Previous</button><button type="button" class="next" onclick="nextQ()">Save &amp; Next</button></div>';bindAnswer();if(submitted)showReviewForCurrent();renderBar();typeset();}function bindAnswer(){host.querySelectorAll('[name^="answer_"]').forEach(el=>{el.addEventListener('input',()=>{responses[current]=el.value;renderBar();});});}function saveCurrent(){const el=host.querySelector('[name^="answer_"]:checked')||host.querySelector('.typed-answer');if(el&&!submitted)responses[current]=el.value||null;}function go(i){saveCurrent();current=i;renderQuestion()}function prevQ(){if(current>0)go(current-1)}function nextQ(){if(current<questions.length-1)go(current+1)}function markReviewNext(){marked[current]=true;nextQ()}function clearResponse(){responses[current]=null;renderQuestion()}function isCorrect(q,a){if(a===null||a==='')return null;return q.type==='mcq'?Number(a)===q.answer:norm(a)===norm(q.typedAnswer);}function showReviewForCurrent(){const q=questions[current],r=isCorrect(q,responses[current]),note=document.getElementById('note'),sol=document.getElementById('solution');sol.style.display='block';if(r===null){note.className='answer-note muted';note.textContent='Unattempted.'}else if(r){note.className='answer-note ok';note.textContent='Correct.'}else{note.className='answer-note bad';note.textContent='Wrong.'}typeset();}function submitTest(){if(submitted)return;saveCurrent();submitted=true;let c=0,w=0,u=0;questions.forEach((q,i)=>{const r=isCorrect(q,responses[i]);if(r===null)u++;else if(r)c++;else w++});resultBox.style.display='block';resultBox.innerHTML='<h2>Test Submitted</h2><div class="score-grid"><div class="score-box">Score<strong>'+(c*3-w)+'</strong></div><div class="score-box">Correct<strong>'+c+'</strong></div><div class="score-box">Wrong<strong>'+w+'</strong></div><div class="score-box">Attempted<strong>'+(c+w)+'</strong></div><div class="score-box">Unattempted<strong>'+u+'</strong></div></div>';renderQuestion();resultBox.scrollIntoView({behavior:'smooth'});typeset();}function tick(){const m=Math.floor(secondsLeft/60),s=secondsLeft%60;document.getElementById('time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(secondsLeft<=0){submitTest();return}secondsLeft--}renderQuestion();tick();setInterval(tick,1000);</script></body></html>
